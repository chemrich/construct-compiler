```yaml
construct:
  name: "fab_fragment_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fab_light_chain
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: fab_light_chain

    - spacer: 30

    - cistron:
        label: fab_heavy_chain_fd
        expression: high
        fused: false
        gene:
          id: fab_heavy_chain_fd

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```