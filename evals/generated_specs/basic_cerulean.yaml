construct:
  name: "mCerulean3_expression_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: mCerulean3_reporter
        expression: high
        gene:
          id: mCerulean3
          source: fpbase
    - terminator: T7term