construct:
  name: "low_expression_mNeonGreen"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5 # Selected for lower transcription levels compared to T7 or tac
    - cistron:
        label: mNeonGreen_target
        expression: low
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: rrnB_T1