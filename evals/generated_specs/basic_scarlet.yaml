construct:
  name: "mScarlet_T7_expression_BL21"
  host: e_coli_bl21_de3  # Substituted BL21 with BL21(DE3) because the T7 promoter requires the DE3 lysogen for T7 RNA polymerase expression.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: mScarlet_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term