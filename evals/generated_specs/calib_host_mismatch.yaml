construct:
  name: protein_p_mammalian_expression
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        gene:
          id: ProteinP
          source: uniprot
    - terminator: BBa_B0015  # BBa_B0015 used as a generic terminator placeholder; in practice, BGH_pA or SV40_pA would be used for mammalian cells.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21