construct:
  name: "ecoli_not_gate_lacI_gfp"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: J23100
    - cistron:
        label: input_a_repressor
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: lacUV5
    - cistron:
        label: output_gfp
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21