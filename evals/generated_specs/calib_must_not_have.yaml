construct:
  name: "genex_expression_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: genex_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GeneX
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21