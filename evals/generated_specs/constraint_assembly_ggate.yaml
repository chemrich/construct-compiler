construct:
  name: "gg_assembly_multi_reporter_system"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 35
    - cistron:
        label: process_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term