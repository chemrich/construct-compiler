construct:
  name: "his_tagged_gfp_bpii"
  host: e_coli_bl21
  backbone:
    # Golden Gate assembly vectors typically use custom parts; pET-28b(+) is standard for His-tag expression.
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term
# Note: User requested BpiI (BbsI) Golden Gate assembly. The compiler will prioritize BpiI recognition site avoidance in sequence optimization.