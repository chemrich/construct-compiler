```yaml
construct:
  name: "His_tagged_GFP_e_coli"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BpiI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
```