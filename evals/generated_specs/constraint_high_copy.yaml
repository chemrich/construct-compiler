construct:
  name: "max_production_his_megfp"
  host: e_coli_bl21_de3  # Substituted BL21 with BL21(DE3) to support T7lac promoter for high expression
  backbone:
    resistance: kanamycin
    ori: pUC  # High-copy origin for maximum plasmid yield
    source: custom
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term