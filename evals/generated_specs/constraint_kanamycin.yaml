construct:
  name: "ppi_mneongreen_mcherry_kanamycin"
  host: e_coli_bl21_de3 # T7 promoter requires the DE3 lysogen for expression in E. coli BL21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: target_mneongreen
        expression: high
        chain:
          - tag: 10xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase
    - spacer: 40
    - cistron:
        label: reporter_mcherry
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term