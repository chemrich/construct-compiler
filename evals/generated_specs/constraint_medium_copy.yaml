```yaml
construct:
  name: bicistronic_mEGFP_mScarlet_medium_copy
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A

  cassette:
    - promoter: T7lac

    - cistron:
        label: mEGFP_tag
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 30

    - cistron:
        label: mScarlet_tag
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
```