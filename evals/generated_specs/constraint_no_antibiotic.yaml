```yaml
construct:
  name: "construct_with_counter_selectable_marker_placeholder"
  host: e_coli

  backbone:
    # The schema does not currently support specifying counter-selectable markers directly.
    # A default antibiotic resistance (kanamycin) is used as a placeholder.
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: test_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```