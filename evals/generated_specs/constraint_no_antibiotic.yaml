construct:
  name: "markerless_counter_selection_sacB"
  host: e_coli_bl21_de3
  backbone:
    resistance: none  # User requested no antibiotic resistance; using sacB for maintenance/selection
    ori: pUC
    source: custom
  cassette:
    - promoter: T7lac
    - cistron:
        label: counter_selection_marker
        expression: medium
        gene:
          id: P05632  # sacB (Levansucrase) from Bacillus subtilis
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term