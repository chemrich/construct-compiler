```yaml
construct:
  name: "pET_32a_Trx_fusion_construct"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-32a(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_gene
        expression: high
        chain:
          - solubility_tag: Trx
          - gene:
              id: mEGFP # Placeholder gene, replace with your gene of interest
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
