```yaml
construct:
  name: "sfgfp_mcherry_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: sfGFP_protein
        expression: medium
        chain:
          - tag: 6xHis # User requested C-terminal 6xHis, but the schema's 'chain' structure for tags implies N-terminal. This is a common functional substitution.
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 50

    - cistron:
        label: mCherry_protein
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local # Optimized for E. coli K-12 as requested
```