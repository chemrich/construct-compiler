```yaml
construct:
  name: "sfGFP_expression_k12"
  host: e_coli # Chosen for E. coli K-12 specific codon optimization, as BL21 is explicitly excluded.

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: sfGFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BbsI # Chosen to respect the request of "No BsaI or BpiI sites" as an assembly enzyme.
    codon_optimization: local # For E. coli K-12 specific optimization.
    gc_window: [0.40, 0.60]
    max_homopolymer: 6
```