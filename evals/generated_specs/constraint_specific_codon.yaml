construct:
  name: "sfGFP_E_coli_K12_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac with tac because host is E. coli K-12 (which lacks T7 polymerase)
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1