```yaml
construct:
  name: "low_expression_toxic_protease"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    # A weak constitutive promoter chosen for low expression,
    # deviating from the default T7lac promoter which is high-expression.
    - promoter: J23106

    - cistron:
        label: toxic_protease
        expression: low
        gene:
          id: "protease_gene" # Placeholder for the specific protease gene, e.g., TEV protease, specific endopeptidase
          source: uniprot # Assuming a natural protease with a UniProt ID

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```