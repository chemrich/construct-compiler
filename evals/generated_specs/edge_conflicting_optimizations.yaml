construct:
  name: "expression_kinetics_optimization_construct"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: fast_expression_module
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 40
    - cistron:
        label: slow_expression_module
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term