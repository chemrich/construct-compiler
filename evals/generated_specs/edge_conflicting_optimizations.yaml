```yaml
construct:
  name: "dual_expression_construct"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: high_expression_gene
        expression: high # Optimized for fast/high expression
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30 # Separating the two cistrons for independent regulation

    - cistron:
        label: low_expression_gene
        expression: low # Optimized for slow/low expression
        fused: false # Ensure independent translation from the first cistron
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```