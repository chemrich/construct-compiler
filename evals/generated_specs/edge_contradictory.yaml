construct:
  name: "GFP_expression_in_E_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac # CMV promoter requested is mammalian; substituted with T7lac for functional expression in E. coli
    - cistron:
        label: GFP_target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1