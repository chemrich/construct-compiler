```yaml
construct:
  name: "gfp_expression_e_coli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac # CMV promoter is for mammalian hosts, T7lac is a common E. coli promoter.

    - cistron:
        label: gfp
        expression: high
        gene:
          id: GFP
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```