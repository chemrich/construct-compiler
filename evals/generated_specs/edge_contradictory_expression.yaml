construct:
  name: "high_expression_inducible_toxic_safe"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # T7lac is used for tight control of toxic protein expression in BL21(DE3)
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term