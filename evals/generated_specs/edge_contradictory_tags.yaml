construct:
  name: "dual_sfgfp_tagged_and_untagged"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: his_tagged_sfgfp
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: untagged_sfgfp
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term