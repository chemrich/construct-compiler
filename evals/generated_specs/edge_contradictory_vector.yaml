construct:
  name: "pET28a_adapted_for_CHO"
  host: CHO
  backbone:
    catalog_vector: "pET-28a(+)"
  cassette:
    - promoter: CMV # Substitution: CMV promoter used for CHO expression as T7 is prokaryotic.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BGH_pA # Substitution: BGH polyadenylation signal used for mammalian host compatibility.