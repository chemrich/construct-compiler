```yaml
construct:
  name: cho_expression_construct
  host: CHO

  backbone:
    # pET-28a(+) is a prokaryotic expression vector.
    # For mammalian CHO cell expression, a mammalian catalog vector like pTwist CMV is more appropriate.
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: BBa_B0015 # Note: This is a bacterial terminator. Mammalian systems typically use poly-A signals (e.g., SV40 polyA), which are not listed in the provided schema.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```