construct:
  name: "lac_variant_expression_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5  # lacUV5 is the standard 'old' lac promoter variant used for stable expression
    - cistron:
        label: target
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1