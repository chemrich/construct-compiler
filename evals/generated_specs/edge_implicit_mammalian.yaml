```yaml
construct:
  name: "HEK293_insulin_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: insulin
        expression: high
        gene:
          id: P01308 # Human Insulin Precursor
          source: uniprot

    - terminator: rrnB_T1 # Note: For mammalian expression, a polyadenylation signal (e.g., SV40 polyA) would typically be used instead of a bacterial terminator. This is a placeholder from the available schema options.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
