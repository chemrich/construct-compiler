construct:
  name: "his_mbp_protein_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term