construct:
  name: "triple_fluorescent_protein_reporter"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: scarlet_expression
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: neongreen_expression
        expression: high
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: T7term