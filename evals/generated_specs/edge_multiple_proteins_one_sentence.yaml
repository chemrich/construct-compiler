construct:
  name: "bacterial_dual_fluorescence_reporter"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: rfp_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term