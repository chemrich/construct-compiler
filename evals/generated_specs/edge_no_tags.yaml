construct:
  name: "simple_megfp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: megfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1