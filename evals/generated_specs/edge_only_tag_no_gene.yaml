construct:
  name: "his_tev_placeholder_vector"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP  # Rule 1: Every cistron needs a gene. Using sfGFP as a temporary placeholder.
              source: fpbase
    - terminator: T7term