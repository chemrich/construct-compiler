construct:
  name: viral_protein_solubility_enhanced
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: viral_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: viral_protein
              source: uniprot

    - terminator: rrnB_T1
