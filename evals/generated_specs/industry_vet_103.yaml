construct:
  name: "viral_subunit_complex_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: SubunitA
        expression: high
        chain:
          - gene:
              id: SubunitA
              source: uniprot

    - spacer: 21

    - cistron:
        label: P2A_linker
        expression: high
        chain:
          - gene:
              id: P2A
              source: uniprot

    - spacer: 21

    - cistron:
        label: SubunitB
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SubunitB
              source: uniprot

    - terminator: rrnB_T1
