construct:
  name: "yeast_nanoparticle_factory"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: structural_protein
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: VLP
              source: uniprot

    - terminator: CYC1
