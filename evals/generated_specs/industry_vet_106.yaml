construct:
  name: "bacterial_enzyme_ecoli_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: bacterial_enzyme
              source: uniprot
              codon_optimization: e_coli

    - terminator: rrnB_T1
