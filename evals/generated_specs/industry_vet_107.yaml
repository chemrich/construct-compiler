construct:
  name: "dual_tag_antigen_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: antigen
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - gene:
              id: uniprot_query
              source: uniprot
              # User should specify the actual UniProt ID or gene name

    - terminator: SV40_polyA
