construct:
  name: "dual_cleavable_antigen_expression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: tricky_antigen
        expression: high
        chain:
          - tag: Twin-Strep
          - cleavage_site: TEV
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: P0DTC2
              source: uniprot
    - terminator: bGH_pA