construct:
  name: "chaperone_A_protein_Y_polycistronic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: chaperone
        expression: medium
        gene:
          id: ChaperoneA
          source: uniprot
    - spacer: 30 # E. coli uses intergenic spacers with RBS for polycistronic expression; IRES/2A are substituted for independent translation (fused: false).
    - cistron:
        label: target
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinY
              source: uniprot
    - terminator: rrnB_T1