construct:
  name: "chaperone_target_polycistronic"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: chaperone
        expression: high
        gene:
          id: ChaperoneA
          source: uniprot

    - spacer: 30

    - cistron:
        label: target
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
