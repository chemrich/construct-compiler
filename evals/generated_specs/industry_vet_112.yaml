construct:
  name: "cytoplasmic_soluble_protein_gst"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: GST
    - terminator: rrnB_T1