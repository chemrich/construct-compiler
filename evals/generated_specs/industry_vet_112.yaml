construct:
  name: "soluble_cytoplasmic_protein_gst_purification"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: J23100

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: your_protein_name
              source: uniprot
          - solubility_tag: GST

    - terminator: rrnB_T1
