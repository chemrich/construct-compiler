construct:
  name: "RBD_secreted_CHO_Strep"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: RBD_secreted
        expression: high
        chain:
          - tag: signal_peptide_SP_D89
          - gene:
              id: RBD
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: Strep-II

    - terminator: rrnB_T1
