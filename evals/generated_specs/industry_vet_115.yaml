construct:
  name: "viral_protease_autoprocessing_system"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: self_cleaving_protease
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: 3C
          - gene:
              id: P03300
              source: uniprot

    - terminator: T7term