construct:
  name: "viral_protease_self_cleaving"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: viral_protease
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: viral_protease
              source: uniprot

    - terminator: rrnB_T1
