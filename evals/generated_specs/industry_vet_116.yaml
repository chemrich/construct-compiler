construct:
  name: "GFP_TargetF_His_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: TargetF
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
