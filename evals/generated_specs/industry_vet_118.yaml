construct:
  name: "mammalian_Fab_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: antibody_light_chain
              source: uniprot

    # IRES enables cap-independent translation of second cistron
    - spacer: 50

    - cistron:
        label: heavy_chain
        expression: high
        fused: false
        chain:
          - gene:
              id: antibody_heavy_chain
              source: uniprot

    - terminator: rrnB_T1
