construct:
  name: "Extracellular_Domain_I_secreted_Strep"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for secretion
          - tag: Strep-II             # Strep-tag after signal peptide, retained in secreted protein
          - gene:
              id: Extracellular_Domain_I
              source: uniprot

    - terminator: polyA
