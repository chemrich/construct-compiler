construct:
  name: "mammalian_dual_protein_2A"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    # 2A peptide enables ribosomal skipping for clean separation
    - spacer: 24  # T2A is 24 bp, achieves post-translational cleavage

    - cistron:
        label: protein_2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
