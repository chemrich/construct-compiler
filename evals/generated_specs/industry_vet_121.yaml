construct:
  name: "mammalian_polycistronic_2A_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter_1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 60  # Length corresponding to a standard P2A peptide sequence
    - cistron:
        label: reporter_2
        expression: high
        fused: false  # Facilitates separate protein products via IRES or 2A-mediated ribosomal skipping
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_polyA