construct:
  name: "yeast_secreted_growth_factor"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_growth_factor
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: PDGF_B
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
