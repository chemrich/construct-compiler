construct:
  name: "HEK293_CAG_His_TEV_MammalianProtein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: "your_gene_id"
              source: uniprot

    - terminator: rrnB_T1
