construct:
  name: "human_geneX_e_coli_highexpression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: geneX
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: geneX
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II

    - terminator: rrnB_T1
