construct:
  name: "liver_specific_enzyme_aav"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: albumin  # Liver-specific promoter

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P12345  # Replace with actual UniProt ID of your therapeutic enzyme
              source: uniprot

    - terminator: rrnB_T1
