construct:
  name: soluble_mbp_target_fusion
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P04637  # Placeholder UniProt ID for TP53, representing the target protein
              source: uniprot
    - terminator: T7term