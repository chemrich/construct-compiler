construct:
  name: "TetOn_inducible_mammalian_system"
  host: HEK293

  backbone:
    catalog_vector: "pTRE3G"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TRE3G
      # TRE3G (Tet-responsive element with tight control, minimal leakiness)

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
              # User should specify their protein of interest (UniProt ID)

    - terminator: SV40_polyA
      # SV40 poly(A) signal for robust 3' end formation in mammalian cells
