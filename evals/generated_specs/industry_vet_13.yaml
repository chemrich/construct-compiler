construct:
  name: "yeast_two_hybrid_bait_Scaffold_Protein_J"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: bait
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Scaffold_Protein_J
              source: uniprot

    - terminator: CYC1
