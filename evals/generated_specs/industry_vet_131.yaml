construct:
  name: "protein_GFP_localization_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: your_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
