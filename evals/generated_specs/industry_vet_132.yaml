construct:
  name: "secreted_antibody_fragment_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: SP_IgE  # Signal peptide for secretion
          - gene:
              id: scFv_example
              source: uniprot
          - tag: 6xHis

    - element: WPRE  # Woodchuck Posttranscriptional Regulatory Element

    - element: polyA_signal  # SV40 or bGH polyA
