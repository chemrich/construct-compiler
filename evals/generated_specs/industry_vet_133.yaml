construct:
  name: dual_enzyme_metabolic_pathway
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme1
              source: uniprot

    - spacer: 50

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme2
              source: uniprot

    - terminator: rrnB_T1
