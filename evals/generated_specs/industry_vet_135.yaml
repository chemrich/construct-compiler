construct:
  name: membrane_protein_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: membrane_protein
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: membrane_protein
              source: uniprot

    - spacer: 30

    - cistron:
        label: trafficking_helper
        expression: high
        fused: false
        chain:
          - gene:
              id: BiP
              source: uniprot
          - cleavage_site: 2A

    - spacer: 30

    - cistron:
        label: chaperone
        expression: medium
        fused: false
        gene:
          id: GRP94
          source: uniprot

    - terminator: rrnB_T1
