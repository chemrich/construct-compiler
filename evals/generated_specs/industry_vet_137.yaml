construct:
  name: "minimal_Gene_X_AAV"
  host: HEK293

  backbone:
    catalog_vector: "pTwist AAV"
    resistance: ampicillin

  cassette:
    - promoter: U6
      # U6 is minimal Pol III promoter (~300 bp) vs CMV (~600+ bp)

    - cistron:
        label: Gene_X
        expression: high
        chain:
          - gene:
              id: Gene_X
              source: uniprot

    - terminator: polyA_min
      # Minimal poly(A) signal (~30-50 bp) instead of full SV40 polyA
