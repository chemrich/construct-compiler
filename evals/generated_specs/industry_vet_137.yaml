construct:
  name: "minimal_gene_x_aav_cassette"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: CMV
    - cistron:
        label: gene_x
        expression: high
        gene:
          id: Gene_X
          source: uniprot
    - terminator: SV40_polyA # Chosen for its minimal footprint in AAV packaging constraints