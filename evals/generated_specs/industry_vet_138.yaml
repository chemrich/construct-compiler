construct:
  name: "lysosomal_enzyme_ERT_construct"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: lysosomal_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: GLA
              source: uniprot
          - tag: KFERQ
          # KFERQ is a lysosomal targeting motif; alternatively could use M6P (mannose-6-phosphate)
          # for N-glycosylation-dependent lysosomal sorting via M6P receptor pathway

    - terminator: rrnB_T1
