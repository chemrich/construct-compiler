construct:
  name: "cmv_bicistronic_ires_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        gene:
          id: P04406
          source: uniprot
    - spacer: 500 # Spacer acts as an IRES for independent translation of the second cistron
    - cistron:
        label: reporter
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA