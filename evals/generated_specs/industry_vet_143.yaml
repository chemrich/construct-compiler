construct:
  name: dual_expression_CMV_IRES_GFP
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: main_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: example_protein
              source: uniprot

    # IRES enables cap-independent translation of downstream gene
    - spacer: 50

    - cistron:
        label: GFP_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
