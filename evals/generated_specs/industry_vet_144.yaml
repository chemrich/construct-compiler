construct:
  name: "soluble_target_protein"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: "YOUR_GENE_ID_HERE"
              source: uniprot

    - terminator: rrnB_T1
