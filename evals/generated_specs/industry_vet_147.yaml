construct:
  name: stable_mammalian_expression_with_selection
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: gene_of_interest
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: EF1_alpha

    - cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: neomycin_phosphotransferase
              source: uniprot

    - terminator: SV40_polyA
