construct:
  name: "dual_subunit_coexpression_his_tagged"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: subunit_alpha
        expression: high
        chain:
          - gene:
              id: "SUBUNIT_A"
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: subunit_beta
        expression: high
        fused: false
        chain:
          - gene:
              id: "SUBUNIT_B"
              source: uniprot
          - tag: 6xHis
    - terminator: T7term