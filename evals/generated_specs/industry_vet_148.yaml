construct:
  name: "protein_complex_dual_subunit_expression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - gene:
              id: subunit_A
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - gene:
              id: subunit_B
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
