construct:
  name: "mammalian_kozak_optimized_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        # The compiler automatically optimizes the Kozak sequence for the HEK293 host
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_pA