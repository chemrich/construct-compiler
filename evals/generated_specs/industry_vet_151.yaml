construct:
  name: "yeast_surface_display_aga2p_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAL1 # Inducible promoter standard for Aga2p yeast display
    - cistron:
        label: yeast_display_anchor
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_peptide
              source: uniprot
    - terminator: CYC1