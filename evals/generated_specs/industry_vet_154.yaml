construct:
  name: tet_on_inducible_system_hek293
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: tet_transactivator
        expression: medium
        gene:
          id: rtTA3
          source: uniprot
    - terminator: SV40_polyA
    - spacer: 150
    - promoter: TRE3G  # Inducible promoter responsive to rtTA + Doxycycline
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bgh_polyA