construct:
  name: "yeast_cytoplasmic_protein_his_tag"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: your_protein_id
              source: uniprot

    - terminator: CYC1
