construct:
  name: "dual_expression_helper_plasmid"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Gene_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Gene_A
              source: uniprot

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: Gene_B
        expression: high
        chain:
          - gene:
              id: Gene_B
              source: uniprot

    - terminator: T7term
