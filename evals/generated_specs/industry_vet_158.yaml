construct:
  name: hepatocyte_specific_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: TBG
      # TBG (Transthyretin Promoter with Beta-globin Poly(A)) provides hepatocyte-specific expression

    - cistron:
        label: target
        expression: high
        gene:
          id: null
          # User must specify the target gene ID and source (e.g., uniprot:P12345)

    - terminator: WPRE
      # WPRE (Woodchuck Posttranscriptional Regulatory Element) followed by SV40 polyA for mammalian expression
