construct:
  name: yeast_p2a_bicistronic_expression
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: p2a_polyprotein
        expression: high
        chain:
          - gene:
              id: Gene_A
              source: uniprot
          - linker:
              type: P2A
          - gene:
              id: Gene_B
              source: uniprot
    - terminator: CYC1