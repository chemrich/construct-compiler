construct:
  name: "yeast_dual_ORF_P2A"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: gene_A
        expression: high
        chain:
          - gene:
              id: gene_A
              source: uniprot

    - linker:
        type: P2A_peptide
        repeats: 1

    - cistron:
        label: gene_B
        expression: high
        fused: false
        gene:
          id: gene_B
          source: uniprot

    - terminator: CYC1_poly_A
