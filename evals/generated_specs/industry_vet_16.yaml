construct:
  name: "Enhanced_Protein_M"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: Protein_M
              source: uniprot
    - terminator: bGH_polyA # WPRE is typically included in the 3' UTR before the polyA signal in high-yield mammalian vectors.