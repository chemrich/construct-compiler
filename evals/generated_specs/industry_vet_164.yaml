construct:
  name: "Protein1_P2A_Protein2_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein1
              source: uniprot

    - cistron:
        label: P2A_spacer
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - cistron:
        label: Protein2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein2
              source: uniprot

    - terminator: polyA
