construct:
  name: "mammalian_ProteinA_IRES_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    # IRES for polycistronic expression in mammalian cells
    - spacer: 50  # IRES sequence (~50+ bp)

    - cistron:
        label: GFP_reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: SV40_polyA
