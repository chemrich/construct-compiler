    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: InsolubleProtein
              source: uniprot

    - terminator: rrnB_T1
