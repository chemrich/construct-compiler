construct:
  name: "InsolubleProtein_SUMO_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: InsolubleProtein
              source: uniprot
    - terminator: rrnB_T1