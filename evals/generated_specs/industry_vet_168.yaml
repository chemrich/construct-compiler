construct:
  name: "yeast_protein_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAPDH

    - cistron:
        label: target
        expression: high
        gene:
          id: YeastProtein
          source: uniprot

    - terminator: CYC1
