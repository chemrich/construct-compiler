construct:
  name: secreted_protein_yeast
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: SecretedYeastProtein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
