construct:
  name: HumanGene_codon_optimized_ecoli
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: HumanGene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: HumanGene
              source: uniprot
              codon_optimization: e_coli

    - terminator: rrnB_T1
