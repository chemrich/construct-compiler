construct:
  name: "mammalian_weak_promoter_test_with_reporter"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: WeakPromoter
    - cistron:
        label: target
        gene:
          id: ProteinZ
          source: uniprot
    - terminator: bGH_polyA
    - promoter: CMV
    - cistron:
        label: reporter
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_polyA