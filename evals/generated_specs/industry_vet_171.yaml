construct:
  name: "dual_promoter_ProteinZ_mCherry_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: WeakPromoter

    - cistron:
        label: ProteinZ
        expression: medium
        gene:
          id: ProteinZ
          source: uniprot

    - terminator: rrnB_T1

    - promoter: CMV

    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
