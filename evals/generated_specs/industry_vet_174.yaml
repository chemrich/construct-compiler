construct:
  name: "periplasmic_protein_export"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: periplasmic_target
        expression: high
        chain:
          - tag: PelB
          - gene:
              id: PeriplasmicProtein
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1