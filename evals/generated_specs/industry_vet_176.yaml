construct:
  name: "lentiviral_StableProtein_EF1a"
  host: HEK293

  backbone:
    catalog_vector: "pTwist Lenti CMV"
    # Note: This is a lentiviral transfer plasmid backbone with 5' and 3' LTRs
    # Compatible with standard lentiviral packaging systems
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: StableProtein
        expression: high
        chain:
          - gene:
              id: StableProtein
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
