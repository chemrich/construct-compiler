construct:
  name: "CleavableProtein_His_TEV"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: CleavableProtein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CleavableProtein
              source: uniprot

    - terminator: rrnB_T1
