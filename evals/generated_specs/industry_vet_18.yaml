construct:
  name: "Antibody_Fragment_Yeast_Display_AAV_Epitope"
  host: yeast

  backbone:
    catalog_vector: "pEXP1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: antibody_display
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv_Capsid_Epitope_P
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot
          - tag: Myc

    - terminator: CYC1
