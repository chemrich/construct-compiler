construct:
  name: "bicistronic_A_B_HEK293_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: protein_A
              source: uniprot

    # IRES element represented as spacer with comment
    # In practice, an ENCV or EMCV IRES (~580bp) would be inserted here
    - spacer: 600

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - gene:
              id: protein_B
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
