construct:
  name: "yeast_secreted_protein_purification"
  host: yeast

  backbone:
    catalog_vector: "pGAPZA"
    resistance: zeocin
    ori: 2_micron
    source: invitrogen

  cassette:
    - promoter: GAPDH

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: alpha_factor
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1
