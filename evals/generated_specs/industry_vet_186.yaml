construct:
  name: "HEK293_CMV_protein_His_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: human_protein  # placeholder; specify actual gene
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    # WPRE equivalent for mammalian: polyadenylation signal (pA) + WPRE-like element
    # Using synthetic poly(A) signal for mRNA stability
    - regulatory_element: SV40_pA

    - terminator: rrnB_T1
