construct:
  name: "mammalian_constitutive_expression_FLAG_HIS"
  host: mammalian

  backbone:
    catalog_vector: "pAAV"

  cassette:
    - promoter: CAG  # CAG = CMV enhancer + chicken beta-actin promoter, strong constitutive expression

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: your_protein_id
              source: uniprot
          - tag: 6xHis

    - terminator: BGH  # bovine growth hormone polyadenylation signal
