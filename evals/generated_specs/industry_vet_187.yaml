construct:
  name: "constitutive_mammalian_CAG_expression"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CAG # Chicken beta-actin promoter with CMV enhancer (CBA/CAG)
    - cistron:
        label: target_expression
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP # Placeholder for user-specified protein
              source: fpbase
          - tag: 6xHis
    - terminator: bGH_pA