construct:
  name: "tandem_repeat_dual_his_tag"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: copy_1
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis

    - spacer: 50

    - cistron:
        label: copy_2
        expression: high
        fused: false
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
