construct:
  name: "tandem_repeat_protein_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target_copy_1
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - spacer: 40
    - cistron:
        label: target_copy_2
        expression: high
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - terminator: T7term