construct:
  name: yeast_2h_protein_x_dbd
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
  - promoter: ADH1
  - cistron:
      label: dbd_fusion
      expression: high
      chain:
      - gene:
          id: gal4_dbd
          source: uniprot
      - linker:
          type: GS_flexible
          repeats: 1
      - gene:
          id: protein_x
          source: uniprot
  - cistron:
      label: c_terminal_tag
      expression: high
      fused: true
      chain:
      - tag: 6xHis
  - terminator: CYC1
