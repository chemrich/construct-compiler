construct:
  name: "high_stability_20aa_cargo_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: therapeutic_cargo
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP  # Added MBP fusion to ensure stability and prevent proteolysis of the 20aa peptide
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Bivalirudin
              source: uniprot
    - terminator: T7term