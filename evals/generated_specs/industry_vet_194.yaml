construct:
  name: "protein_variant_library_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: variant_library
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: variable_region
              source: user_provided
          - tag: Strep-II

    - terminator: rrnB_T1
