construct:
  name: "neuron_specific_myc_tagged_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: catalog vector contains CMV, but will be replaced with neuron-specific promoter in final construct

  cassette:
    - promoter: hSyn1  # human Synapsin 1 promoter - neuron-specific, minimal expression in non-neuronal cells

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc  # C-terminal Myc epitope tag

    - terminator: SV40_polyA  # strong mammalian polyadenylation signal for enhanced mRNA stability and translation
