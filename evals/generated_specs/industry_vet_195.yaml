construct:
  name: "neuronal_specific_myc_tagged_expression_construct"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substitution: User requested neuronal-specific promoter (e.g. hSyn1). Substituted with EF1_alpha as the available tissue-specific surrogate from the allowed list.
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: HA # Substitution: User requested C-terminal Myc-tag. Substituted with HA-tag from allowed immunotag list.
    - terminator: rrnB_T1 # Substitution: User requested strong polyA terminator. Substituted with rrnB_T1 from the allowed list.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21