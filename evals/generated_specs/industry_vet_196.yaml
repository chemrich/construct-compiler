construct:
  name: GOI_GFP_His_HEK293
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: GOI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
