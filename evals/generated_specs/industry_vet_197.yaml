construct:
  name: "dual_tag_purification_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: protein_of_interest
              source: uniprot
          - tag: 6xHis
    - terminator: T7term