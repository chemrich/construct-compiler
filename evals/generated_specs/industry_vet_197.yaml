construct:
  name: "dual_tag_purification_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
