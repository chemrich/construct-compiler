construct:
  name: "high_expression_pichia_pastoris_His_tag"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1
