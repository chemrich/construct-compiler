construct:
  name: "AOX1_Pichia_high_expression_system"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1 # Strong methanol-inducible promoter for Pichia pastoris
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP # Placeholder gene; AOX1 terminator and high expression flag optimized for yeast mRNA stability
              source: fpbase
    - terminator: AOX1_TT # The AOX1 terminator is used to ensure efficient polyadenylation and mRNA stability in Pichia, analogous to WPRE in mammalian systems