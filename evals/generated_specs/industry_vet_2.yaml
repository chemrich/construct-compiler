construct:
  name: Glyco_Protein_Z_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GPD

    - cistron:
        label: glyco_protein_z
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal secretion signal for yeast ER targeting
          - gene:
              id: Glyco_Protein_Z
              source: uniprot
          - tag: FLAG  # C-terminal affinity tag

    - terminator: CYC1
