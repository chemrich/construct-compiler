construct:
  name: "high_level_GOI_expression_E_coli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI
              source: uniprot

    - terminator: rrnB_T1
