construct:
  name: "simple_ecoli_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: goi
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI
              source: uniprot

    - terminator: rrnB_T1
