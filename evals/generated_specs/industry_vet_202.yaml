construct:
  name: "HEK293_mEGFP_High_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: SV40_polyA # Standard mammalian terminator appropriate for HEK293 expression