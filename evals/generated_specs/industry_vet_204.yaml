construct:
  name: Rep_Cap_mammalian_IRES
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Rep
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Rep
              source: uniprot

    - spacer: 27
      # IRES (Internal Ribosome Entry Site) inserted here for cap-independent translation

    - cistron:
        label: Cap
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Cap
              source: uniprot

    - terminator: rrnB_T1
