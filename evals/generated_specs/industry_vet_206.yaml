construct:
  name: "secreted_protein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: IgE  # N-terminal secretion signal for mammalian ER/Golgi trafficking
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot

    - terminator: WPRE  # Woodchuck Posttranscriptional Regulatory Element for mammalian expression
