construct:
  name: "tet_inducible_goi_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: goi
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ""
              source: uniprot
              # User should replace with their specific GOI UniProt ID or gene name

    - terminator: rrnB_T1
