construct:
  name: "yeast_gal1_expression_system"
  host: s_cerevisiae # S. cerevisiae substituted as host; not in the default E. coli/mammalian schema list
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1 # GAL1 promoter substituted for yeast-specific inducible expression
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1_term # CYC1 terminator substituted for proper termination in yeast
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21