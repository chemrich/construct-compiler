construct:
  name: "mammalian_therapeutic_bicistronic_GFP_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - gene:
              id: therapeutic_protein
              source: uniprot
        # IRES follows for bicistronic expression

    - spacer: 30

    - cistron:
        label: GFP_reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: BGH_polyA
