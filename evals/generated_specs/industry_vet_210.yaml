construct:
  name: his_tev_cleavable_purification_construct
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_of_interest
              source: uniprot
    - terminator: T7term