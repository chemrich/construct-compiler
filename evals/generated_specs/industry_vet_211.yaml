construct:
  name: "insect_virus_GOI_humanized"
  host: HEK293
  
  backbone:
    catalog_vector: "pTwist CMV"
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: insect_virus_GOI_humanized
              source: uniprot
              # Note: This gene ID represents the codon-optimized version for human expression.
              # The construct_compiler will use the human-codon-optimized variant,
              # similar to AAV capsid gene optimization. Ensure the source sequence
              # database or synthesis provider delivers the human-optimized coding sequence.
    
    - terminator: rrnB_T1
