construct:
  name: "insect_viral_protein_human_optimized"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: insect_goi
        expression: high
        gene:
          id: P04604  # Baculovirus GP64 protein used as a representative insect viral GOI
          source: uniprot
    - terminator: bGH_pA  # Standard mammalian polyadenylation signal/terminator_
# Codon optimization for human cells is automatically performed by the compiler based on the HEK293 host selection.