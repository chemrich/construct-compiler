construct:
  name: "domain_a_domain_b_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: Domain_A
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Domain_B
    - terminator: rrnB_T1