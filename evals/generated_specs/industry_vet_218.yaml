construct:
  name: "dual_mammalian_expression_mCherry_GOI"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: bGH_polyA

    - promoter: EF1_alpha

    - cistron:
        label: GOI
        expression: medium
        gene:
          id: your_protein_of_interest
          source: uniprot

    - terminator: bGH_polyA
