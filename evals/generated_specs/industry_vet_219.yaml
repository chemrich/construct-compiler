construct:
  name: "high_yield_untagged_protein_tev_cleavage"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
              # Note: User should provide specific UniProt ID and codon-optimize the sequence
              # The construct_compiler will integrate the optimized coding sequence

    - terminator: rrnB_T1
