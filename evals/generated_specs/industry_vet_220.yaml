construct:
  name: "EGFP_reporter_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: EGFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EGFP
              source: fpbase

    - terminator: rrnB_T1
