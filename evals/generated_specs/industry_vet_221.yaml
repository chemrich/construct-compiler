construct:
  name: "bicistronic_AAV_Cargo1_Cargo2"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: AAV_Cargo1
        expression: high
        chain:
          - gene:
              id: AAV_Cargo1
              source: uniprot
          - tag: FLAG

    # IRES enables cap-independent translation of second cistron from same transcript
    - spacer: 588  # IRES sequence, minimum ~588 bp for EMCV IRES

    - cistron:
        label: AAV_Cargo2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: AAV_Cargo2
              source: uniprot

    - terminator: rrnB_T1
