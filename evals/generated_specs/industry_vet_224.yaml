construct:
  name: "Rep_like_protein_baculovirus"
  host: insect_cells

  backbone:
    catalog_vector: "pFastBac1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: p10

    - cistron:
        label: Rep_like
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Rep_like_protein
              source: uniprot

    - terminator: SV40_polyA
