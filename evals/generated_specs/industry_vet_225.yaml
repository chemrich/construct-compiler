construct:
  name: "tissue_specific_therapeutic_cargo"
  host: in_vitro

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter with more restricted/tissue-specific activity
      # compared to ubiquitous CMV, suitable for therapeutic cargo in IVT context

    - cistron:
        label: therapeutic_cargo
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PLACEHOLDER_THERAPEUTIC
              source: uniprot
              # User should replace PLACEHOLDER_THERAPEUTIC with actual UniProt ID

    - terminator: rrnB_T1
