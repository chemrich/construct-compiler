construct:
  name: "CapsidFragment_EGFP_2A_release"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: CapsidFragment
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CapsidFragment
              source: uniprot

    - cistron:
        label: EGFP_released
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A_P2A  # Self-cleaving peptide for post-translational release
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
