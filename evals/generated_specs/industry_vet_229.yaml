construct:
  name: "bicistronic_bacterial_peptide_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: peptide_component_1
        expression: high
        gene:
          id: peptide_1
          source: uniprot
    - spacer: 30
    - cistron:
        label: peptide_component_2
        expression: high
        fused: false
        gene:
          id: peptide_2
          source: uniprot
    - terminator: T7term