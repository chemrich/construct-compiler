construct:
  name: bicistronic_peptide_expression
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: peptide_1
              source: uniprot

    - spacer: 30

    - cistron:
        label: peptide_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: peptide_2
              source: uniprot

    - terminator: rrnB_T1
