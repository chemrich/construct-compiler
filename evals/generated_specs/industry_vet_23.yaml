construct:
  name: bicistronic_proteinA_proteinB_2A
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: proteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinA
              source: uniprot

    - spacer: 21  # 2A peptide sequence (GSGATNFSLLKQAGDVEENPG)

    - cistron:
        label: proteinB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: proteinB
              source: uniprot

    - terminator: rrnB_T1
