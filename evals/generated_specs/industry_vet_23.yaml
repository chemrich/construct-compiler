construct:
  name: "mammalian_stoichiometric_2A_bicistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: "bicistronic_payload"
        expression: high
        chain:
          - gene:
              id: Protein_A
              source: uniprot
          - cleavage_site: P2A
          - gene:
              id: Protein_B
              source: uniprot
    - terminator: SV40_polyA