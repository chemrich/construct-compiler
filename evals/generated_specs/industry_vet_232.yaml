construct:
  name: yeast_AAV_epitope_display
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: AAV_capsid_epitope
        expression: high
        chain:
          - tag: HA
          - gene:
              id: AAV2_VP3_neutralizing_epitope
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: agal1
              source: uniprot

    - terminator: CYC1
