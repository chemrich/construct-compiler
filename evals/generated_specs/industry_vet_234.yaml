construct:
  name: AAV_accessory_factor_TetOn_inducible
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: TRE3G
      # TRE3G (Tet-Responsive Element) requires co-expression of rtTA (reverse Tet-transactivator)
      # Doxycycline binding to rtTA activates transcription from TRE3G

    - cistron:
        label: accessory_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: AAV_rep52
              source: uniprot

    - terminator: SV40poly
