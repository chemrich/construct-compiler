construct:
  name: synthetic_capsid_variant_AB
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: capsid_AB_fusion
        expression: high
        chain:
          - gene:
              id: domain_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_B
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
