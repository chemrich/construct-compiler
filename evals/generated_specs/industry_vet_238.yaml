construct:
  name: EnzymeX_lysosomal_targeting
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: EnzymeX_lysosomal
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EnzymeX
              source: uniprot
          - tag: KFERQ
          # KFERQ is a chaperone-mediated autophagy targeting motif for lysosomal delivery
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: mCherry
          # mCherry as C-terminal reporter for tracking

    - terminator: rrnB_T1
