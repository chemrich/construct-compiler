construct:
  name: "mammalian_bicistronic_p2a_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: multicomponent_cleavable
        expression: high
        chain:
          - gene:
              id: GOI1
              source: uniprot
          - linker:
              type: P2A
          - gene:
              id: GOI2
              source: uniprot
    - terminator: bGH_polyA