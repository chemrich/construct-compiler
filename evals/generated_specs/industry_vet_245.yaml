construct:
  name: "Tet_on_inducible_GOI_system"
  host: HEK293

  cassette:
    - promoter: CMV
      cistron:
        label: tTA
        expression: high
        gene:
          id: tTA
          source: uniprot

    - terminator: SV40_poly_A

  cassette:
    - promoter: TRE
      cistron:
        label: GOI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40_poly_A
