construct:
  name: tet_on_inducible_expression_system
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_pA
    - spacer: 50
    - promoter: CMV
    - cistron:
        label: tet_transactivator
        expression: medium
        gene:
          id: rtTA3
          source: uniprot
    - terminator: SV40_pA