construct:
  name: "mammalian_triple_2A_polyprotein"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: triple_expression_unit
        expression: high
        chain:
          - gene:
              id: Protein_A
              source: uniprot
          - linker:
              type: P2A
          - gene:
              id: Protein_B
              source: uniprot
          - linker:
              type: T2A
          - gene:
              id: Protein_C
              source: uniprot
    - terminator: bGH_polyA