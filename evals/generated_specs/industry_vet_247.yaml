construct:
  name: mammalian_triple_expression_CMV
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - cistron:
        label: Protein_B
        expression: high
        chain:
          - gene:
              id: ProteinB
              source: uniprot
        # P2A self-cleaving peptide separates A from B
        p2a_upstream: true

    - cistron:
        label: Protein_C
        expression: high
        chain:
          - gene:
              id: ProteinC
              source: uniprot
        # T2A self-cleaving peptide separates B from C
        t2a_upstream: true

    - terminator: polyA
