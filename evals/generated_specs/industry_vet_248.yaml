construct:
  name: "constitutive_polycistronic_GOI1_GOI2"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: GOI1_cistron
        expression: high
        chain:
          - gene:
              id: GOI1
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: GOI2_cistron
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: GOI2
              source: uniprot
    - terminator: rrnB_T1