construct:
  name: "soluble_target_with_GST_TEV"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
