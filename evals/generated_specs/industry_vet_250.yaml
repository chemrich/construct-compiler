construct:
  name: "yeast_secreted_protein_with_mRNA_stability"
  host: yeast

  backbone:
    resistance: kanMX  # kanamycin resistance cassette for yeast
    ori: 2-micron    # high-copy plasmid origin for yeast
    source: addgene

  cassette:
    - promoter: GAL1  # galactose-inducible promoter for yeast

    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal secretion signal peptide
          - cleavage_site: KEX2        # KEX2 protease cleavage site (removes alpha-factor signal)
          - gene:
              id: GFP                  # placeholder GOI
              source: uniprot

    - terminator: CYC1_poly_A         # CYC1 poly(A) tail for mRNA stability in yeast

  post_transcript:
    stability_element: WPRE            # Woodchuck Posttranscriptional Regulatory Element
    # Note: WPRE is typically used in mammalian/viral systems; for yeast, consider SV40-derived poly(A) or native CYC1 poly(A) which are included above. WPRE can still enhance stability in yeast expression systems.
