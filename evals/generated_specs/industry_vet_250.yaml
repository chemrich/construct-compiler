construct:
  name: yeast_secreted_goi_stabilized
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: alpha_mating_factor
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: CYC1 # WPRE is a mammalian stabilizing element; substituted with CYC1, a standard yeast terminator known for robust mRNA polyadenylation and stability.