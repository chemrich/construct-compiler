construct:
  name: AAV_Rep52_40_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: SV40  # SV40 early promoter for strong mammalian expression

    - cistron:
        label: Rep52_40
        expression: high
        chain:
          - gene:
              id: P03135
              source: uniprot  # AAV2 Rep52/40 (UniProt entry for AAV rep protein)

    - terminator: SV40_polyA  # SV40 polyadenylation signal
