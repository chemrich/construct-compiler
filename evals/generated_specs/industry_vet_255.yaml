construct:
  name: "dual_host_GOI1_GOI2_diagnostic"
  host: yeast
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
      # Constitutive yeast promoter for GOI1
    
    - cistron:
        label: GOI1_yeast
        expression: high
        gene:
          id: GOI1
          source: uniprot
    
    - terminator: rrnB_T1
    
    # Mammalian cassette on same backbone
    - spacer: 50
    
    - promoter: CMV
      # Mammalian CMV promoter for GOI2
    
    - cistron:
        label: GOI2_mammalian
        expression: high
        gene:
          id: GOI2
          source: uniprot
    
    - terminator: rrnB_T1
