construct:
  name: mammalian_secreted_protein_with_tags
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CAG

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG
          - tag: 6xHis
          - gene:
              id: GOI
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
