construct:
  name: "soluble_GOI_His_SUMO"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GOI_soluble
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI
          - solubility_tag: SUMO
    
    - terminator: rrnB_T1
