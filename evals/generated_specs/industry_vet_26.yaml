```yaml
construct:
  name: periplasmic_expression_construct
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: pelB  # periplasmic secretion signal
          - tag: 6xHis
          - gene:
              id: P0A6F5  # example protein - replace with desired target
              source: uniprot

    - terminator: rrnB_T1
```