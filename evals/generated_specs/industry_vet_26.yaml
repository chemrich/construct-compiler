construct:
  name: "periplasmic_secretion_his_tag"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: periplasmic_protein
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: pelB
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
