construct:
  name: "MyTherapeuticProtein_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: MyTherapeuticProtein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MyTherapeuticProtein
              source: uniprot

    - terminator: rrnB_T1
