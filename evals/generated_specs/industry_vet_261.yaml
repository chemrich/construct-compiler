construct:
  name: "ProteinA_2A_ProteinB_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: 2A_peptide
        expression: high
        fused: false
        gene:
          id: T2A
          source: uniprot

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
