construct:
  name: ProteinZ_mCherry_IRES_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinZ
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinZ
              source: uniprot

    - spacer: 30

    # IRES placed as a structural element before mCherry
    # Note: IRES (Internal Ribosome Entry Site) enables cap-independent translation
    # of the downstream cistron from the same CMV promoter
    - cistron:
        label: mCherry_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
