construct:
  name: "Tet_On_inducible_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV
    - cistron:
        label: rtTA_transactivator
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot
    - terminator: rrnB_T1

    - spacer: 30

    - promoter: TRE
    - cistron:
        label: GOI
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
