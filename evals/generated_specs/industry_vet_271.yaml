construct:
  name: "ProteinM_dual_tag_purification"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinM
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinM
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
