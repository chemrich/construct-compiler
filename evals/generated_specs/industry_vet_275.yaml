construct:
  name: "MembraneProteinR_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # CMV is a strong constitutive promoter suitable for mammalian protein expression

  cassette:
    - promoter: CMV

    - cistron:
        label: MembraneProteinR
        expression: high
        chain:
          - gene:
              id: MembraneProteinR
              source: uniprot

    - terminator: polyA
      # polyA signal for mammalian mRNA stability and export
