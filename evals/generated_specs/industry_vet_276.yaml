construct:
  name: ProteinS_ProteinT_fusion_Histag
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinS
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ProteinT
              source: uniprot

    - terminator: rrnB_T1
