construct:
  name: "ProteinX_VLP_packaging"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinX_for_VLP
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinX
              source: uniprot

    - terminator: rrnB_T1
