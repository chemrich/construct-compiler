construct:
  name: "vlp_packaged_proteinx_design"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_x_cargo
        expression: high
        chain:
          - tag: FLAG  # Using FLAG as a proxy for a VLP-interaction tag/domain
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P04637  # Using UniProt P04637 (TP53) as a representative "ProteinX"
              source: uniprot
    - terminator: bGH_pA  # Standard mammalian polyadenylation signal/terminator