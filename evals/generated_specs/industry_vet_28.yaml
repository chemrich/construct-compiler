construct:
  name: "yeast_chromosomal_integration_ha_tagged_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3 # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: target_gene
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: HA
    - terminator: CYC1_term