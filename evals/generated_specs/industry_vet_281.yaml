construct:
  name: "mammalian_dual_expression_GFP_readout"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_of_interest
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: fluorescent_marker
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
