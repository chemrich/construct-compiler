construct:
  name: "tissue_specific_secreted_protein"
  host: HEK293

  backbone:
    catalog_vector: "pAAV-MCS"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: hSPC_B  # human surfactant protein C promoter (lung-specific)

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: SP_hIgG1  # human IgG1 signal peptide for secretion
          - gene:
              id: "P01234"  # Replace with your secreted protein UniProt ID
              source: uniprot

    - terminator: rrnB_T1
