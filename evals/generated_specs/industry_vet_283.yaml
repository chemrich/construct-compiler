construct:
  name: "soluble_protein_with_removable_tag"
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: your_protein
              source: uniprot
    
    - terminator: rrnB_T1
