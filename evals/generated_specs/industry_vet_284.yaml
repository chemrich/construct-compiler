construct:
  name: "secreted_protein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: SP  # Signal peptide for ER translocation and secretion
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 8xHis  # C-terminal His tag for IMAC purification
          - tag: Twin-Strep  # Twin-Strep tag for affinity purification and detection

    - terminator: rrnB_T1
