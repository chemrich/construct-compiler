construct:
  name: "protein_interaction_fusion_removable_tag"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: binding_partner
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: binding_partner_protein
              source: uniprot

    - terminator: rrnB_T1
