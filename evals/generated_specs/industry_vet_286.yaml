construct:
  name: "target_with_chaperone_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - spacer: 30

    - cistron:
        label: chaperone
        expression: high
        fused: false
        chain:
          - gene:
              id: HSP90
              source: uniprot

    - terminator: rrnB_T1
