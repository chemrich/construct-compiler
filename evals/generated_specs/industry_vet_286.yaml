construct:
  name: "mammalian_polycistronic_coexpression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 40
    - cistron:
        label: chaperone_biP
        expression: medium
        fused: false
        gene:
          id: P11021
          source: uniprot
    - terminator: BGH_polyA