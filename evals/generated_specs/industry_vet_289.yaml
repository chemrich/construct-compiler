construct:
  name: "cell_free_His_tagged_protein_synthesis"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase

    - terminator: T7term
