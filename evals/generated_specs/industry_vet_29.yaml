construct:
  name: liver_specific_luciferase_reporter
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ApoE_hAAT  # Synthetic hepatocyte-specific promoter (ApoE enhancer + hAAT promoter)
    - cistron:
        label: luciferase_reporter
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: SV40_polyA  # Standard mammalian termination and polyadenylation signal