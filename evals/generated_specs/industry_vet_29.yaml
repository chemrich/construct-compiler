```yaml
construct:
  name: hepatocyte_luciferase_reporter
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: hepatocyte_specific  # synthetic liver-specific promoter for hepatocyte targeting

    - cistron:
        label: reporter
        expression: high
        gene:
          id: P08659  # Firefly luciferase
          source: uniprot

    - terminator: SV40_polyA  # SV40 polyadenylation signal
```