construct:
  name: "hepatocyte_luciferase_reporter"
  host: HEK293
  
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
  
  cassette:
    - promoter: "hAlb"  # human Albumin promoter, hepatocyte-specific
    
    - cistron:
        label: luciferase
        expression: high
        chain:
          - gene:
              id: "Renilla_luciferase"
              source: "uniprot"
    
    - terminator: "SV40_polyA"
