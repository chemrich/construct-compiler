construct:
  name: "glycoprotein_yeast_secretion"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - signal_peptide: alpha_factor  # N-terminal secretion signal for yeast ER targeting
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1_poly_A
