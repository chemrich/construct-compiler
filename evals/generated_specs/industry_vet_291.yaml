construct:
  name: "baculovirus_high_yield_His_tag"
  host: insect

  backbone:
    catalog_vector: "pFastBac"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: p10

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_ID
              source: uniprot

    - terminator: SV40_polyA
