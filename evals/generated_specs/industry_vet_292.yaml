construct:
  name: "nuclear_targeted_purifiable_mEGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: nls_target
        expression: high
        chain:
          - tag: 6xHis
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_polyA # Standard mammalian polyadenylation signal for termination