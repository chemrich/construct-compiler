construct:
  name: "mammalian_transmembrane_receptor"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: transmembrane_receptor
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: transmembrane_receptor_ectodomain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: transmembrane_domain
              source: uniprot
          - gene:
              id: intracellular_domain
              source: uniprot

    - terminator: rrnB_T1
