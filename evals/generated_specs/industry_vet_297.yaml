construct:
  name: "dual_protein_mammalian_differential_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: high_expression_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: AAV_Rep78
              source: uniprot

    - spacer: 30

    - cistron:
        label: low_expression_protein
        expression: low
        fused: false
        chain:
          - tag: FLAG
          - cleavage_site: 3C
          - gene:
              id: AAV_Cap
              source: uniprot

    - terminator: rrnB_T1
