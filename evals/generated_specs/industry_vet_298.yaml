construct:
  name: "stable_mammalian_integration_aav"
  host: HEK293
  backbone:
    catalog_vector: "pAAV-MCS"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: selection_marker
        expression: low
        fused: false
        gene:
          id: NeoR
          source: uniprot
    - terminator: bGH_PA