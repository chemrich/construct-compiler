construct:
  name: stable_integration_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: polyA

    - promoter: SV40

    - cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: neomycin_phosphotransferase
              source: uniprot

    - terminator: polyA
