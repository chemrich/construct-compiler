construct:
  name: "peptide_library_fusion_array"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: peptide_unit_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0CG47
              source: uniprot
    - cistron:
        label: peptide_unit_2
        fused: true
        chain:
          - cleavage_site: TEV
          - gene:
              id: P01133
              source: uniprot
    - cistron:
        label: peptide_unit_3
        fused: true
        chain:
          - cleavage_site: TEV
          - gene:
              id: P61278
              source: uniprot
    - terminator: T7term