construct:
  name: "peptide_display_library"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: peptide_1
              source: custom

    - spacer: 30

    - cistron:
        label: peptide_2_with_2A
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: custom
          - gene:
              id: peptide_2
              source: custom

    - spacer: 30

    - cistron:
        label: peptide_3_with_2A
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: custom
          - gene:
              id: peptide_3
              source: custom

    - spacer: 30

    - cistron:
        label: peptide_4_with_2A
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: custom
          - gene:
              id: peptide_4
              source: custom

    - terminator: rrnB_T1
