construct:
  name: "AAV_dual_expression_GFP_enzyme"
  host: HEK293

  backbone:
    catalog_vector: "pAAV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: Reporter_GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # P2A self-cleaving peptide separates the two proteins
    - spacer: 51  # P2A sequence length in bp (approximate)

    - cistron:
        label: Therapeutic_Enzyme
        expression: high
        fused: false
        gene:
          id: Cre_recombinase
          source: uniprot

    - terminator: polyA  # Single polyA tail for both proteins post-cleavage
