construct:
  name: "AAV_P2A_GFP_Therapeutic_Enzyme"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bicistronic_expression
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: P2A
          - gene:
              id: P10253 # Human Acid alpha-glucosidase (GAA) as therapeutic enzyme example
              source: uniprot
    - terminator: bGH_polyA