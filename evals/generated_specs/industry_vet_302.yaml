construct:
  name: "bicistronic_AAV_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pAAV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: protein1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GFP
              source: fpbase

    # IRES enables cap-independent translation of second cistron
    - spacer: 27  # IRES_EMCV consensus sequence length

    - cistron:
        label: protein2
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: polyA
