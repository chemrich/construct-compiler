construct:
  name: "AAV_mammalian_transgene_HIS"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: transgene
              source: user_provided
              codon_optimization: human

    - terminator: rrnB_T1
