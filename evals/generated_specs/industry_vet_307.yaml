construct:
  name: "aav_optimized_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP # mEGFP used as placeholder for requested protein
              source: fpbase
    - terminator: bGH_polyA_terminator # Standard strong mammalian terminator for high expression
