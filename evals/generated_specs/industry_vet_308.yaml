construct:
  name: "targeting_peptide_therapeutic_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: targeting_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_domain
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
