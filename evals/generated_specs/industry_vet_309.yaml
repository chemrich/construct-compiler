construct:
  name: "dual_protein_2A_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_A
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: ProteinA
              source: uniprot

    - cistron:
        label: P2A_spacer
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot
        # P2A self-cleaving peptide enables translational skipping

    - cistron:
        label: Protein_B
        expression: high
        fused: false
        gene:
          id: ProteinB
          source: uniprot

    - terminator: polyA
