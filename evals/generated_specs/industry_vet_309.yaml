construct:
  name: "mammalian_p2a_coexpression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: polyprotein_p2a
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
          - cleavage_site: P2A
          - gene:
              id: mCherry
              source: fpbase
    - terminator: bGH_polyA  # Substituted bGH_polyA for bacterial terminators to ensure functional mammalian termination
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21