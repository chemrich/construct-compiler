construct:
  name: "mammalian_gene_therapy_minimal_non_viral"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Non-viral ubiquitous human promoter
    - cistron:
        label: therapy_cargo
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: hBG_polyA  # Human beta-globin polyadenylation signal