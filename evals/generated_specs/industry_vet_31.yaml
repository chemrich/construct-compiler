construct:
  name: gene_therapy_minimal_immunogenicity
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"  # Will modify promoter below
    
  cassette:
    - promoter: EF1_alpha  # Human cellular promoter, less immunogenic than viral CMV
    
    - cistron:
        label: therapeutic_protein
        expression: medium
        gene:
          id: # Gene ID needed - please specify target protein
          source: uniprot
    
    - terminator: human_beta_globin_polyA  # Human-derived terminator for reduced immunogenicity