construct:
  name: "unstable_protein_PEST_turnover"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - tag: PEST  # C-terminal PEST degron for accelerated proteasomal turnover

    - terminator: rrnB_T1
