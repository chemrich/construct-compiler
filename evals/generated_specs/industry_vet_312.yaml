construct:
  name: "protein_localization_tracker_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: YOUR_PROTEIN_ID
              source: uniprot

    - terminator: polyA
