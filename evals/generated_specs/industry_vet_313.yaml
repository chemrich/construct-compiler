construct:
  name: "yeast_surface_display_AAV_epitope"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AAV_epitope_insert
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1_terminator
