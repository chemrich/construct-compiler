construct:
  name: "mammalian_transmembrane_protein_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha
      # Weaker constitutive promoter to reduce cytotoxicity from membrane protein overexpression

    - cistron:
        label: transmembrane_target
        expression: medium
        chain:
          - signal_peptide: Kozak
          - gene:
              id: AAVR
              source: uniprot
              # Multi-pass transmembrane protein; signal peptide aids ER targeting and proper membrane insertion

    - terminator: SV40_polyA
      # SV40 poly(A) signal standard for mammalian expression
