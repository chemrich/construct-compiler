construct:
  name: secreted_therapeutic_protein
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: SV40_polyA
