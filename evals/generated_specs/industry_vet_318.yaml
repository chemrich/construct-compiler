construct:
  name: "yeast_bicistronic_2A_pathway"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - gene:
              id: enzyme1
              source: uniprot
          - tag: FLAG

    - cistron:
        label: 2A_peptide
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        gene:
          id: enzyme2
          source: uniprot

    - terminator: rrnB_T1
