construct:
  name: mammalian_promoter_characterization_luciferase
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV
      # User's custom promoter would replace CMV in actual implementation
      # This is a placeholder for "cell-specific promoter" evaluation

    - cistron:
        label: luciferase_reporter
        expression: high
        chain:
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: rrnB_T1
