construct:
  name: "tripartite_subunit_complex_ecoli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: alpha
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: alpha_subunit
              source: uniprot

    - spacer: 30

    - cistron:
        label: beta
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: beta_subunit
              source: uniprot

    - spacer: 30

    - cistron:
        label: gamma
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: gamma_subunit
              source: uniprot

    - terminator: rrnB_T1
