construct:
  name: "mammalian_secreted_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - signal_peptide: IgG_signal  # N-terminal secretion signal for efficient ER targeting
          - gene:
              id: therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His tag for purification from conditioned media

    - terminator: SV40_polyA
