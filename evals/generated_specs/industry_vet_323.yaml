construct:
  name: "mammalian_GFP_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
