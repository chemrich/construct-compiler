construct:
  name: "mammalian_gfp_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_pA  # Standard mammalian polyadenylation signal for proper processing/stability