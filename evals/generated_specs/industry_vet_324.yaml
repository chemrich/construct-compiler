construct:
  name: "TetOn_Inducible_6xHis_POI"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G  # Standard Tetracycline Response Element for Tet-On systems
    - cistron:
        label: target_poi
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01133
              source: uniprot
    - terminator: bGH_polyA  # Standard mammalian terminator for AAV/plasmid expression