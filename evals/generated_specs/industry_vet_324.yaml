construct:
  name: "Tet_on_POI_His_tag"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: tTA
        expression: high
        chain:
          - gene:
              id: tTA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TRE

    - cistron:
        label: POI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: POI
              source: uniprot

    - terminator: rrnB_T1
