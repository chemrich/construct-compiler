construct:
  name: "AAV_capsid_subunits_AB_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AAV_VP1
              source: uniprot

    - spacer: 22

    - cistron:
        label: P2A_self_cleaving
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 22

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: AAV_VP3
              source: uniprot

    - terminator: rrnB_T1
