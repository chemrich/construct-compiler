construct:
  name: "mitochondrial_matrix_protein_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: mito_protein
        expression: high
        chain:
          - tag: 6xHis
          - mito_targeting_sequence: MTS
          - gene:
              id: uniprot_lookup_required
              source: uniprot

    - terminator: rrnB_T1
