construct:
  name: "hts_constitutive_6xhis_vector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: J23100
    - cistron:
        label: library_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1