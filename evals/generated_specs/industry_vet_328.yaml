construct:
  name: "yeast_surface_display_AAV_peptide"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AGA1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AAV_capsid_peptide
              source: uniprot

    - terminator: CYC1
