construct:
  name: "mammalian_bicistronic_CAG_P2A_mCherry"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CAG
    - cistron:
        label: target_and_reporter
        expression: high
        chain:
          - gene:
              id: target_gene
          - linker:
              type: P2A
          - gene:
              id: mCherry
              source: fpbase
    - terminator: SV40