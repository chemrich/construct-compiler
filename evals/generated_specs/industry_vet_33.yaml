construct:
  name: "bicistronic_GOI_mCherry_CAG"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: GOI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "user_GOI"
              source: uniprot

    - spacer: 21

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    # 2A peptide included conceptually as part of spacing/translation control
    - terminator: polyA
