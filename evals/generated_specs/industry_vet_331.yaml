construct:
  name: "dual_fluorescent_reporter_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: fluorescent_protein_1
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    # IRES enables cap-independent translation of second cistron from same mRNA
    - spacer: 25  # IRES sequence placeholder

    - cistron:
        label: fluorescent_protein_2
        expression: high
        fused: false
        chain:
          - gene:
              id: eGFP
              source: fpbase

    - terminator: rrnB_T1
