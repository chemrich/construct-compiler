construct:
  name: "mammalian_coexpression_mCherry_eGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: red_reporter
        gene:
          id: mCherry
          source: fpbase
    - spacer: 580  # Representative length for an IRES sequence to facilitate internal ribosome entry
    - cistron:
        label: green_reporter
        fused: false
        gene:
          id: eGFP
          source: fpbase
    - terminator: SV40_polyA