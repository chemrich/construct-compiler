construct:
  name: "cleavable_fusion_protein_ecoli"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
          - cleavage_site: 3C
          - tag: 6xHis
    
    - terminator: rrnB_T1
