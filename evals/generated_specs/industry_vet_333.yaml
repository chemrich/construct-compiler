construct:
  name: yeast_robust_ptm_study_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Strong constitutive yeast promoter (TDH3)
    - cistron:
        label: ptm_target
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1 # Standard yeast terminator