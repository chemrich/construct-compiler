construct:
  name: lentiviral_expression_HA_tagged
  host: HEK293

  backbone:
    catalog_vector: pLenti-CMV-HA
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: # user_insert_gene_id_here
              source: uniprot

    - terminator: WPRE
