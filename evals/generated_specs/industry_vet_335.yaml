construct:
  name: "enzyme_substrate_coexpression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: your_enzyme_id
              source: uniprot

    - spacer: 25

    - cistron:
        label: substrate
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: your_substrate_id
              source: uniprot

    - terminator: rrnB_T1
