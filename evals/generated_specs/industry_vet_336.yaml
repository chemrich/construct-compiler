construct:
  name: bidirectional_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV
      direction: forward

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: "USER_GENE_A"
              source: uniprot
          - tag: HA
        c_tag: Myc

    - terminator: rrnB_T1

    # Bidirectional element: reverse-orientation promoter + terminator
    - promoter: CMV
      direction: reverse
      # Note: Bidirectional promoter cassettes require careful spacing.
      # In practice, the CMV promoter region is shared/overlapping in opposite orientations.
      # This YAML represents the conceptual layout; physical implementation uses a
      # bidirectional promoter cassette (e.g., pTRE-Tight Bidirectional from Clontech).

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: "USER_GENE_B"
              source: uniprot

    - terminator: rrnB_T1
