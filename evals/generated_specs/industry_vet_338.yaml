construct:
  name: autoregulated_mammalian_feedback_construct
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV
      # CMV promoter includes binding sites for the autoregulatory protein
      # These are embedded in the CMV enhancer/promoter region
      comment: "CMV promoter engineered with response elements for autoregulatory protein binding"

    - cistron:
        label: autoregulator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AAV_Rep78
              source: uniprot

    - terminator: BHCV_polyA
