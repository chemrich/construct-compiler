construct:
  name: "mammalian_autoregulatory_feedback_loop"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: p5  # AAV p5 promoter is naturally regulated by the Rep protein
    - cistron:
        label: rep_autoregulator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P03132
              source: uniprot
    - terminator: SV40_polyA