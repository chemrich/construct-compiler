construct:
  name: dual_affinity_purification_cassette
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Strep-II

    - terminator: rrnB_T1
