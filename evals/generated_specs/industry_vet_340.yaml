construct:
  name: "AAV2_VP3_capsid_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # CMV is mammalian-specific; using T7lac (inducible) for E. coli protein expression

    - cistron:
        label: AAV2_VP3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AAV2_VP3
              source: uniprot

    - terminator: rrnB_T1
      # E. coli uses transcription terminators (rrnB_T1) instead of polyA tails;
      # polyA is eukaryotic-specific and non-functional in prokaryotes