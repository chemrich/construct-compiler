construct:
  name: "AAV2_VP3_Expression_Ecoli"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # CMV is a mammalian promoter and will not function in E. coli; substituted with T7lac for inducible high-level expression.
    - cistron:
        label: vp3_fragment
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P03135
              source: uniprot
    - terminator: T7term # The E. coli equivalent of a polyA signal for terminating T7 RNA polymerase transcription.