construct:
  name: "high_solubility_therapeutic_peptide_production"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: Strep-II
          - solubility_tag: MBP # MBP is used to maximize solubility in E. coli
          - cleavage_site: TEV
          - gene:
              id: P01270 # Parathyroid hormone (PTH), a common therapeutic peptide
              source: uniprot
    - terminator: T7term