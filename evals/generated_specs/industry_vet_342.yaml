construct:
  name: "yeast_antibody_fragment_solubility_fusion"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: antibody_fragment
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
          - tag: 6xHis

    - terminator: rrnB_T1
