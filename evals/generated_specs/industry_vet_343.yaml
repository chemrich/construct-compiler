construct:
  name: "dual_protein_his_tags_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: proteinA
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: protein_B
        expression: high
        chain:
          - gene:
              id: proteinB
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
