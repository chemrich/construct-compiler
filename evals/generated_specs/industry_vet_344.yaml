construct:
  name: "mammalian_reporter_CAG_FLAG"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CAG

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: FLAG

    - poly_A: bGH  # bovine growth hormone polyadenylation signal
