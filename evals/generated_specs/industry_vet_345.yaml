construct:
  name: "human_growth_factor_periplasmic"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - signal_peptide: pelB  # pelB signal peptide for periplasmic secretion
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_growth_factor
              source: uniprot

    - terminator: rrnB_T1
