construct:
  name: "E_coli_GST_enzyme_expression"
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: "USER_ENZYME"
              source: uniprot
    
    - terminator: rrnB_T1
