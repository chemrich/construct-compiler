construct:
  name: "yeast_protein_expression_his_tag"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: PROTEIN_ID
              source: uniprot
          - cleavage_site: 3C
          - tag: 6xHis

    - terminator: CYC1
