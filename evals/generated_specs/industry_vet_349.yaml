construct:
  name: "MBP_TEV_therapeutic_protein"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              # Substituted P01241 (human growth hormone) as a representative therapeutic gene
              id: P01241
              source: uniprot
          - tag: 6xHis
    - terminator: T7term