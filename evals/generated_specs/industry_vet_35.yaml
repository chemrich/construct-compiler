construct:
  name: "mammalian_high_stability_cbh_mEGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CBh  # Strong hybrid promoter for mammalian expression
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: WPRE_BGH_polyA  # WPRE included for mRNA stability and packaging efficiency, followed by BGH polyA signal