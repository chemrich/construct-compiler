construct:
  name: "mammalian_dual_protein_IRES_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: HA

    - spacer: 50
      # IRES element follows (represented as spacer; compiler interprets context for mammalian dual expression)

    - cistron:
        label: therapeutic_protein
        expression: high
        fused: false
        chain:
          - gene:
              id: human_IgG1_Fc
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
