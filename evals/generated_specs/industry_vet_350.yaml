construct:
  name: "mammalian_polycistronic_ha_tagged_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - gene:
              id: P60568
              source: uniprot
          - tag: HA
    - spacer: 580 # Representing the Encephalomyocarditis virus (EMCV) IRES for independent translation
    - cistron:
        label: reporter_protein
        expression: medium
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: HA
    - terminator: bGH_polyA