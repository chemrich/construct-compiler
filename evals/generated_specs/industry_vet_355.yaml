construct:
  name: "yeast_secreted_therapeutic_His"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: therapeutic_protein
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
