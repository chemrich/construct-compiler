construct:
  name: "AAV_GFP_sgRNA_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
    
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1

    - promoter: U6
    
    - gene:
        id: sgRNA_generic
        source: uniprot
        # Note: U6 promoter drives Pol III transcription of small RNA (not translated)
        # sgRNA sequence should be customized by user post-compilation
    
    - terminator: rrnB_T1
