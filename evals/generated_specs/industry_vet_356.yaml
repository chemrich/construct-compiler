construct:
  name: "mammalian_dual_expression_gRNA_mEGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA
    - spacer: 50
    - promoter: U6
    - cistron:
        label: guide_RNA
        gene:
          id: sgRNA
    - terminator: polyT