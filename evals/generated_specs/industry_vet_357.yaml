construct:
  name: "ecoli_protein_cterminal_his_linker"
  host: e_coli
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
    
    - terminator: rrnB_T1
