construct:
  name: "yeast_TAP_tag_GAL1_inducible"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GOI_TAP
        expression: high
        chain:
          - tag: TAP
          - gene:
              id: GOI
              source: uniprot

    - terminator: CYC1
