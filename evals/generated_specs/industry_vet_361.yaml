construct:
  name: "secreted_antibody_fragment_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal for mammalian secretion
          - gene:
              id: antibody_fragment
              source: uniprot
          - tag: 6xHis  # C-terminal His tag for Ni-NTA purification from supernatant

    - terminator: SV40_polyA
