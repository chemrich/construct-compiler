construct:
  name: "AAV_capsid_VP1_VP2_dual_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: VP1
        expression: high
        chain:
          - gene:
              id: AAV_VP1
              source: uniprot

    - spacer: 30

    # P2A self-cleaving peptide enables independent VP2 translation
    - cistron:
        label: VP2
        expression: high
        chain:
          - gene:
              id: p2a
              source: uniprot
          - gene:
              id: AAV_VP2
              source: uniprot
        fused: false

    - terminator: rrnB_T1
