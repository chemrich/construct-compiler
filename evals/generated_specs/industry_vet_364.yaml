construct:
  name: "AAV_capsid_VP123_insect"
  host: insect_sf9
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: p10
    
    - cistron:
        label: VP1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: VP1
              source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: VP2_self_cleaving
        expression: high
        fused: false
        chain:
          - gene:
              id: "P2A"
              note: "self-cleaving peptide for stoichiometric expression"
          - gene:
              id: VP2
              source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: VP3_self_cleaving
        expression: high
        fused: false
        chain:
          - gene:
              id: "P2A"
              note: "self-cleaving peptide for stoichiometric expression"
          - gene:
              id: VP3
              source: uniprot
    
    - terminator: SV40_polyA
