construct:
  name: "mammalian_POI_FP_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: POI_FP_fusion
        expression: high
        chain:
          - gene:
              id: POI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
