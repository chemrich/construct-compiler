construct:
  name: "mammalian_targeting_peptide_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
          - tag: 6xHis
    - terminator: bGH_pA_terminator # Standard mammalian polyA signal for high expression constructs.