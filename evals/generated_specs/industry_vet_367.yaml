construct:
  name: "mammalian_nterm_peptide_protein_purification"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: engineered_protein
        expression: high
        chain:
          - gene:
              id: engineered_targeting_peptide
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: protein_of_interest
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
