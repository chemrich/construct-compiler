construct:
  name: mammalian_tissue_specific_promoter_test
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: custom_tissue_specific
      # User can replace this with their specific promoter sequence/name

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase

    - terminator: SV40_polyA
