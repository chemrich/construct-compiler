construct:
  name: "AAV_fusion_capsid_construct"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: AAV_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AAV_capsid_domain1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: AAV_capsid_domain2
              source: uniprot

    - terminator: rrnB_T1
