construct:
  name: "high_throughput_peptide_variant_library_vector"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_variant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: peptide_variant
              source: user_defined

    - terminator: rrnB_T1
