construct:
  name: "yeast_surface_display_POI"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AGA1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: POI
              source: uniprot

    - terminator: CYC1
