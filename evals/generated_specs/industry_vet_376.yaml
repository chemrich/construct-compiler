construct:
  name: "human_therapeutic_secreted_high_yield_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - signal_peptide: SP_IgK  # Immunoglobulin kappa signal peptide for robust secretion
          - gene:
              id: "therapeutic_protein_codon_optimized"
              source: uniprot
              # Note: User should provide UniProt ID; codon optimization handled by synthesis vendor

    - terminator: rrnB_T1
