construct:
  name: "dual_mammalian_ppi_coexpression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: POI_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TP53
              source: uniprot
    - terminator: bGH_polyA
    - promoter: CMV
    - cistron:
        label: POI_B
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: MDM2
              source: uniprot
    - terminator: bGH_polyA