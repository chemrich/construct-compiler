construct:
  name: "precursor_protease_cleavage_purification"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: precursor
        expression: high
        chain:
          - gene:
              id: precursor_protein
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
