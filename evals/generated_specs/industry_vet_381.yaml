construct:
  name: "scFv_secreted_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: IgG_signal_peptide
          - gene:
              id: scFv
              source: uniprot

    - terminator: SV40_polyA
