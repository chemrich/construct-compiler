construct:
  name: "P1_P2_polyprotein_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: P1_peptide
        expression: high
        gene:
          id: P1
          source: uniprot
    - cistron:
        label: P2_peptide
        expression: high
        fused: true
        chain:
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV  # Cleavage site for post-translational processing
          - gene:
              id: P2
              source: uniprot
    - terminator: BBa_B0015