construct:
  name: "P1_P2_polyprotein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: polyprotein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P1
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: P2
              source: uniprot
          - cleavage_site: 3C
          - tag: FLAG

    - terminator: rrnB_T1
