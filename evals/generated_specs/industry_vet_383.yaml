construct:
  name: "IPTG_inducible_mCherry_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
