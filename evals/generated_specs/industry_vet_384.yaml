construct:
  name: "enzyme_chaperone_bicistronic"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P00761
              source: uniprot

    # Spacer between cistrons; in E. coli, RBS + start codon needed for independent translation
    - spacer: 25

    - cistron:
        label: chaperone
        expression: high
        fused: false
        gene:
          id: P0A6F5
          source: uniprot

    - terminator: rrnB_T1
