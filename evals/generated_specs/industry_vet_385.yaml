construct:
  name: "yeast_transgene_solubility"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: transgene
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: transgene
              source: uniprot

    - terminator: rrnB_T1
