construct:
  name: "therapeutic_intracellular_enzyme_high_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha  # EF1_alpha provides high-level, stable expression in mammalian cells often used in AAV applications
    - cistron:
        label: enzyme_target
        expression: high
        gene:
          id: P04062
          source: uniprot
    - terminator: hGH_pA  # Human growth hormone polyadenylation signal for mRNA stability and efficient termination