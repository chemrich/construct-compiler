construct:
  name: "mammalian_two_subunit_complex"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P12345
              source: uniprot

    # IRES-mediated translation of second cistron from same mRNA
    - spacer: 25

    - cistron:
        label: Subunit_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: Q67890
              source: uniprot

    - terminator: rrnB_T1
