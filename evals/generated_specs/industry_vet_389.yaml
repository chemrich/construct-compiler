construct:
  name: "peptide_stability_test_degron"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target_peptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: "peptide_ligand"
              sequence: "MSVLFLFLSLLTAFSSAYS"
          - degron: ssrA  # C-terminal ssrA tag (LAA motif) for Lon/ClpXP-mediated degradation
    
    - terminator: rrnB_T1
