```yaml
construct:
  name: membrane_protein_GFP_tracker
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: membrane_tracker
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: CD86  # Type I membrane protein for membrane localization
              source: uniprot

    - terminator: polyA
```