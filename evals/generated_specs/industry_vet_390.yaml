construct:
  name: "mammalian_secreted_cargo_production"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: secreted_cargo
        expression: high
        chain:
          - signal_peptide: SP_hIgG  # human IgG signal peptide for robust ER targeting and secretion
          - gene:
              id: cargo
              source: uniprot

    - terminator: bGH_polyA  # bovine growth hormone polyadenylation signal for robust 3' end processing
