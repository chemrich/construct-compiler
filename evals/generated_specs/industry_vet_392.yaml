construct:
  name: "yeast_human_TM_protein_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: human_TM_protein
        expression: high
        chain:
          - gene:
              id: "uniprot_search_required"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: CYC1
