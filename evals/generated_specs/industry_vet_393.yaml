construct:
  name: "immunogenic_protein_inclusion_body"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: immunogenic_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: null
              # User must provide the specific gene ID or sequence
              # This construct assumes an immunogenic protein (e.g., antigen, toxoid)
              # Expression at high level in BL21(DE3) will drive inclusion body formation
              source: uniprot

    - terminator: rrnB_T1
