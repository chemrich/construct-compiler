construct:
  name: "dual_protein_P2A_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Px
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Px
              source: uniprot

    - spacer: 21

    - cistron:
        label: P2A_linker
        expression: high
        chain:
          - gene:
              id: P2A
              source: uniprot
          - comment: "Self-cleaving P2A peptide ensures equimolar production of Px and Py"

    - spacer: 21

    - cistron:
        label: Py
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Py
              source: uniprot

    - terminator: rrnB_T1
