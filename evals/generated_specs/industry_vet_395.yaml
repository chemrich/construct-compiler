construct:
  name: "periplasmic_cytokine_export"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: pelB_signal_peptide  # N-terminal signal peptide for periplasmic targeting
          - gene:
              id: IL2  # Example cytokine; substitute as needed
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: rrnB_T1
