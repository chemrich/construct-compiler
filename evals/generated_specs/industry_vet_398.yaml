construct:
  name: "mammalian_luciferase_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Using pTwist for mammalian expression; will modify promoter downstream

  cassette:
    - promoter: EF1_alpha
      # EF1_alpha is weaker/more moderate than CMV, suitable for constitutive baseline expression

    - cistron:
        label: luciferase
        expression: medium
        gene:
          id: Renilla_luciferase
          source: uniprot

    - terminator: polyA
