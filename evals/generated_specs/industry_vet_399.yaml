construct:
  name: "P1_P2_P3_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: P1
        expression: high
        fused: false
        gene:
          id: P1
          source: uniprot

    - spacer: 30

    - cistron:
        label: P2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P2
              source: uniprot

    - spacer: 30

    - cistron:
        label: P3
        expression: high
        fused: false
        gene:
          id: P3
          source: uniprot

    - terminator: rrnB_T1
