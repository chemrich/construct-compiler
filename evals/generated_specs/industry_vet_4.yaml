construct:
  name: "Tet_on_Toxic_Factor_A"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: TRE  # Tetracycline Response Element (Tet-on)

    - cistron:
        label: Toxic_Factor_A
        expression: high
        gene:
          id: Toxic_Factor_A
          source: uniprot

    - terminator: polyA  # SV40 polyA signal for mammalian stability
