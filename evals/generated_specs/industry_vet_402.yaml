construct:
  name: "mammalian_constitutive_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase # Placeholder for the user's Gene of Interest (GOI)
    - terminator: SV40_pA # Standard strong polyadenylation signal for mammalian termination