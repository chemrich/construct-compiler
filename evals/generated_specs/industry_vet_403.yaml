construct:
  name: "bicistronic_GOI1_GOI2_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: GOI1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI1
              source: uniprot

    # IRES for bicistronic translation in mammalian cells
    - spacer: 50

    - cistron:
        label: GOI2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: GOI2
              source: uniprot

    - terminator: rrnB_T1
