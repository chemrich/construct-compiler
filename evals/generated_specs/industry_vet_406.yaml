construct:
  name: "secreted_therapeutic_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal for mammalian cells
          - gene:
              id: therapeutic_protein
              source: uniprot

    - terminator: rrnB_T1
