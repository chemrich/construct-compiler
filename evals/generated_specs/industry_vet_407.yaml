construct:
  name: "arabinose_inducible_GOI"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: generic_GOI
              source: uniprot

    - terminator: rrnB_T1
