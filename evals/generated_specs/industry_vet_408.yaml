construct:
  name: "yeast_GOI_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI
              source: uniprot

    - terminator: CYC1
