construct:
  name: "mammalian_tracking_fusion_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: goi_reporter_fusion
        expression: high
        chain:
          - gene:
              id: ACTB_HUMAN
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_pA