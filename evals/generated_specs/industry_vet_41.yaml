construct:
  name: secreted_protein_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide  # Ensures secretion from mammalian cells
          - gene:
              id: P04637  # p53 tumor suppressor as example secreted protein
              source: uniprot

    - terminator: rrnB_T1