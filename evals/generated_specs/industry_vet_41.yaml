construct:
  name: "mammalian_secretory_expression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: IgK_leader  # Standard secretion signal for mammalian cell secretion
          - gene:
              id: protein_of_interest
    - terminator: bGH_pA