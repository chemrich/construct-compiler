construct:
  name: "mammalian_secreted_protein_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: signal_peptide_IL2
          - gene:
              id: target_protein
              source: uniprot

    - terminator: SV40_polyA
