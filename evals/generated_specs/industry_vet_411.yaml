construct:
  name: "dual_tagged_protein_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - tag: Strep-II
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1