construct:
  name: "dual_tag_sequential_purification"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - tag: Strep-II
          - gene:
              id: GOI
              source: uniprot

    - terminator: rrnB_T1
