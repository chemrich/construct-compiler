construct:
  name: "periplasmic_export_sfGFP"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: PelB
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term