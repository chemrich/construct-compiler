construct:
  name: dual_independent_cassettes
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GOI1
        expression: high
        gene:
          id: GOI1
          source: uniprot
    
    - terminator: rrnB_T1
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GOI2
        expression: high
        gene:
          id: GOI2
          source: uniprot
    
    - terminator: rrnB_T1
