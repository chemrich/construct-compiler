construct:
  name: "stable_mammalian_expression_with_selection"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: GOI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        gene:
          id: neomycin_phosphotransferase
          source: uniprot

    - terminator: rrnB_T1
