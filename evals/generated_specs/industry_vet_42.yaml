```yaml
construct:
  name: soluble_transgene_with_chaperone_tag
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP  # Maltose Binding Protein acts as molecular chaperone
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: transgene  # Replace with actual gene ID/source when known
              source: uniprot

    - terminator: rrnB_T1
