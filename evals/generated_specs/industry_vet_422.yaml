construct:
  name: "AAV_Rep78_P2A_Rep52"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Rep78
        expression: high
        chain:
          - gene:
              id: Rep78
              source: uniprot

    - spacer: 51
      # P2A sequence (51 bp encodes GSGATNFSLLKQAGDVEENPGP)
      # This self-cleaving peptide ensures stoichiometric 1:1 expression of Rep78 and Rep52

    - cistron:
        label: Rep52
        expression: high
        fused: false
        gene:
          id: Rep52
          source: uniprot

    - terminator: rrnB_T1
