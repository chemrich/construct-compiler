construct:
  name: "bicistronic_GFP_mCherry_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CAG

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase

    - spacer: 50
      # IRES element inserted here for independent translation initiation

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
