construct:
  name: MyEnzyme_Flag_T2A_mNeonGreen
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: MyEnzyme_Flag
        expression: high
        chain:
          - gene:
              id: MyEnzyme
              source: uniprot
          - tag: FLAG

    - cistron:
        label: mNeonGreen
        expression: high
        fused: false
        chain:
          - cleavage_site: T2A
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
