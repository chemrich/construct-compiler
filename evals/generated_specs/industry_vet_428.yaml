construct:
  name: "secreted_GrowthFactorZ_production"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: IgK_leader  # Secretion signal peptide for export to media
          - tag: Strep-II
          - gene:
              id: GrowthFactorZ
              source: uniprot
    - terminator: bGH_polyA