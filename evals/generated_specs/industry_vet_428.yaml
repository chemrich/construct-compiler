construct:
  name: "GrowthFactorZ_secreted_AAV"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: GrowthFactorZ
        expression: high
        chain:
          - tag: Strep-II
          - secretion_signal: SP_IgG  # IgG signal peptide for mammalian secretion
          - gene:
              id: GrowthFactorZ
              source: uniprot

    - terminator: rrnB_T1
