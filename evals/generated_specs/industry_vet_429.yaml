construct:
  name: "ToxicProteinA_TetOn_inducible"
  host: HEK293

  backbone:
    catalog_vector: "pTRE-Tight"
    resistance: ampicillin

  cassette:
    - promoter: TRE
      # TRE (Tetracycline Response Element) requires co-expression of rtTA (reverse Tet transactivator)
      # This enables doxycycline-inducible expression

    - cistron:
        label: ToxicProteinA
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: ToxicProteinA
              source: uniprot

    - terminator: WPRE
      # WPRE (Woodchuck Posttranscriptional Regulatory Element) enhances expression in mammalian cells
