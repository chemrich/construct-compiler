construct:
  name: "dual_protein_payload_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: payload_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: payload_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
