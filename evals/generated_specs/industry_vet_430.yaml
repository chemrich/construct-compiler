construct:
  name: "MyGlycoprotein_yeast_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MyGlycoprotein
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: MyGlycoprotein
              source: uniprot

    - terminator: CYC1
