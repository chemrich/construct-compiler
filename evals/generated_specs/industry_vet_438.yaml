construct:
  name: "AAV_library_peptide_F_strep"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: LibraryPeptideF
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: LibraryPeptideF
              source: uniprot

    - terminator: rrnB_T1
