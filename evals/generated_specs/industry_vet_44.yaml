construct:
  name: "e_coli_protein_with_cleavable_tag"
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: YOUR_PROTEIN_ID
              source: uniprot
    
    - terminator: rrnB_T1
