construct:
  name: "therapeutic_enzyme_mammalian_hightiter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_lookup_required
              source: uniprot
              # User should specify the actual enzyme UniProt ID or gene name

    - terminator: rrnB_T1
