construct:
  name: "bicistronic_AAV_fluorescent_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pAAV-CMV"
    # AAV vector backbone with CMV promoter for robust mammalian expression

  cassette:
    - promoter: CMV

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # IRES element enables cap-independent translation of downstream cistron
    - spacer: 85  # ENCV IRES minimal sequence (~85 bp) for efficient translation

    - cistron:
        label: therapeutic_peptide
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: insulin
              source: uniprot

    - terminator: rrnB_T1
