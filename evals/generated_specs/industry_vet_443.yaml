construct:
  name: "secreted_antibody_fragment_AAV_mimic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_payload
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - gene:
              id: antibody_fragment
              source: uniprot
          - tag: His6  # C-terminal purification tag

    - terminator: bGH_poly_A
