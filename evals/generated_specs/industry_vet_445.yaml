construct:
  name: "targeting_peptide_mEGFP_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: peptide_reporter_fusion
        expression: high
        chain:
          - gene:
              id: targeting_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term