construct:
  name: "nuclear_localized_gene_editing_enzyme"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: editor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: NLS
          - gene:
              id: Cas9
              source: uniprot

    - terminator: rrnB_T1
