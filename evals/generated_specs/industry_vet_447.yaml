construct:
  name: "inducible_cytotoxic_protein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE3G
      # TRE3G: tetracycline response element for tight, doxycycline-inducible control

    - cistron:
        label: cytotoxic_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: caspase_3
              source: uniprot

    - terminator: SV40_pA
      # Mammalian polyadenylation signal for stable expression
