construct:
  name: chimeric_capsid_with_TEV_cleavage
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: chimeric_capsid
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
