construct:
  name: viral_assembly_factor_tandem_purification
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: assembly_factor
        expression: high
        chain:
          - tag: 6xHis
          - tag: Strep-II
          - gene:
              id: viral_assembly_factor
              source: uniprot
    - terminator: T7term