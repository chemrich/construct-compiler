```yaml
construct:
  name: therapeutic_payload_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: therapeutic_payload
        expression: high
        chain:
          - tag: alpha_factor  # secretion signal for yeast
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: payload_gene  # replace with actual therapeutic gene ID
              source: uniprot

    - terminator: CYC1
```