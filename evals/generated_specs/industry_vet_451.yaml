construct:
  name: epitope_tag_peptide_bacterial_expression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: epitope_tag
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: custom_epitope
              source: uniprot

    - terminator: rrnB_T1
