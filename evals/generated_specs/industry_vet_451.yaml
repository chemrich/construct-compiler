construct:
  name: "high_yield_epitope_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: epitope_fragment
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P01106  # Myc-proto-oncogene protein; standard epitope tag source
              source: uniprot
    - terminator: T7term