construct:
  name: "mammalian_high_yield_WPRE_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: WPRE_bGH_pA  # WPRE is used here to provide the 'AAV boost' (mRNA stability/export) alongside a strong polyA signal.