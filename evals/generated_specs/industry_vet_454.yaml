construct:
  name: "transient_regulatory_protein_degradable"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: regulatory
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: regulatory_protein
              source: uniprot
          - tag: ssrA  # C-terminal degradation tag for rapid proteolysis

    - terminator: rrnB_T1
