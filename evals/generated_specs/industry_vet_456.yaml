construct:
  name: "therapeutic_protein_yeast_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: IgG_Fc
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - terminator: CYC1
