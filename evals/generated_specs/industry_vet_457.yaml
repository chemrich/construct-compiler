construct:
  name: "dual_promoter_capsid_rep"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: capsid
        expression: high
        gene:
          id: VP1
          source: uniprot

    - terminator: rrnB_T1

    - promoter: SV40

    - cistron:
        label: rep
        expression: medium
        gene:
          id: Rep
          source: uniprot

    - terminator: rrnB_T1
