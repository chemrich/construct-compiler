construct:
  name: "lysosomal_targeting_enzyme"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: lysosomal_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: lysosomal_enzyme
              source: uniprot
          - tag: KFERQ  # C-terminal KFERQ-like motif for chaperone-mediated autophagy targeting

    - terminator: rrnB_T1
