construct:
  name: "AAV_rep_stable_producer_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: AAV_rep
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: "AAV2_rep"
              source: uniprot

    - spacer: 30

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        gene:
          id: "PuroR"
          source: uniprot

    - terminator: rrnB_T1
