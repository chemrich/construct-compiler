construct:
  name: "insect_cell_high_yield_secreted_GOI"
  host: insect_cells

  backbone:
    catalog_vector: "pFastBac1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: signal_peptide_honeybee_melittin
          - gene:
              id: gene_of_interest
              source: uniprot

    - terminator: SV40_polyA
