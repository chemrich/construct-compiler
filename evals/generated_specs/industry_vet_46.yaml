```yaml
construct:
  name: secreted_protein_baculovirus_expression
  host: insect_cells

  backbone:
    catalog_vector: "pFastBac1"
    resistance: ampicillin

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: gp67  # baculovirus envelope glycoprotein signal for secretion
          - gene:
              id: your_gene_of_interest
              source: uniprot  # replace with actual gene ID

    - terminator: polyhedrin_terminator
```