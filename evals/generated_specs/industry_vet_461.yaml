construct:
  name: "mammalian_secreted_GOI_His"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_GOI
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal for mammalian ER entry
          - gene:
              id: GOI_secreted
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: rrnB_T1
