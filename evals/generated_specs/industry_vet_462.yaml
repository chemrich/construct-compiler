construct:
  name: "dual_protein_AAV_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pAAV-CMV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 25

    - cistron:
        label: IRES
        expression: high
        fused: false
        gene:
          id: IRES_EMCV
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
