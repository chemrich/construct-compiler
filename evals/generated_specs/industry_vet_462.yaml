construct:
  name: "mammalian_ires_polycistronic_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: ProteinA
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: ProteinB
          source: uniprot
    - terminator: bGH_PA