construct:
  name: "EColi_Protein_Purification_Vector"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EColi_Protein
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1