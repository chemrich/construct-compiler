construct:
  name: TargetProtein_GFP_fusion_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: TargetProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
