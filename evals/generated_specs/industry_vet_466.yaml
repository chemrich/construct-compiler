construct:
  name: "Inducible_Protein_Y"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE_tight
      # TRE (Tetracycline Response Element) for Tet-On inducible control in mammalian cells

    - cistron:
        label: protein_Y
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: rrnB_T1
