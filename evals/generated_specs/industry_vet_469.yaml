construct:
  name: InsolubleProtein_GST_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: pGEX-4T-1
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: InsolubleProtein_GST
        expression: high
        chain:
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: InsolubleProtein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
