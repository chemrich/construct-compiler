construct:
  name: "secreted_peptide_precursor_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal
          - cleavage_site: Furin    # Processed by furin protease in secretory pathway
          - gene:
              id: SecretedPeptide
              source: uniprot
          - tag: 6xHis              # C-terminal His-tag for purification

    - terminator: SV40polyA
