construct:
  name: dual_inducible_mammalian_expression
  host: HEK293

  cassette:
    - promoter: TRE_tight
      # Tet-On inducible promoter for first gene

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - terminator: SV40_polyA

  cassette:
    - promoter: CMV_IE
      # Independent constitutive/regulatable promoter for second gene

    - cistron:
        label: GeneB
        expression: high
        gene:
          id: GeneB
          source: uniprot

    - terminator: SV40_polyA
