construct:
  name: dual_inducible_expression_system
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE3G
    - cistron:
        label: target_gene_a
        expression: high
        fused: false
        gene:
          id: GeneA
          source: uniprot
    - terminator: bGH_pA
    - spacer: 50
    - promoter: pCMV_CuO
    - cistron:
        label: target_gene_b
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - terminator: SV40_pA