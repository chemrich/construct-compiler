construct:
  name: SurfaceDisplayGOI
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: Myc
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: SurfaceDisplayGOI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
