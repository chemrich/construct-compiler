construct:
  name: LysosomalEnzyme_lysosomal_targeting
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: lysosomal_enzyme
        expression: high
        chain:
          - gene:
              id: LysosomalEnzyme
              source: uniprot
          - tag: V5
          - signal: KFERQ  # C-terminal lysosomal targeting signal (chaperone-mediated autophagy)

    - terminator: rrnB_T1
