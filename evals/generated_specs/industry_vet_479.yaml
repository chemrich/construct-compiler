construct:
  name: MyProteinClean_intein_autocleavage
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - intein: Mxe_GyrA  # N-terminal intein for auto-cleavage upon purification trigger
          - gene:
              id: MyProteinClean
              source: uniprot

    - terminator: rrnB_T1
