construct:
  name: tunable_payload_expression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: payload
        expression: high
        chain:
          - tag: 6xHis
          - gene:
            id: # gene_id_required
            source: # uniprot_or_fpbase

    - terminator: rrnB_T1