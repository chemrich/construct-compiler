construct:
  name: "AntigenE_yeast_secretion"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron

  cassette:
    - promoter: GAL1

    - cistron:
        label: AntigenE_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: AntigenE
              source: uniprot

    - terminator: CYC1
