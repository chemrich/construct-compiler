construct:
  name: "AntigenE_Yeast_Secretory_System"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor  # Yeast alpha-mating factor secretion signal
          - gene:
              id: AntigenE
              source: uniprot
    - terminator: CYC1