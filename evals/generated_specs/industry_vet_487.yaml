construct:
  name: "CardiacG_Cardiac_Specific_Expression"
  host: mammalian

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: cTnT  # Cardiac Troponin T promoter used for cardiac-specific expression tropism

    - cistron:
        label: target
        expression: medium
        gene:
          id: CardiacG
          source: uniprot

    - terminator: bGH_polyA  # Standard mammalian polyadenylation signal/terminator