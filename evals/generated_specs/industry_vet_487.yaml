construct:
  name: "CardiacG_cardiac_specific"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: cTnT  # Cardiac troponin T promoter - cardiac tissue-specific

    - cistron:
        label: CardiacG
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CardiacG
              source: uniprot

    - terminator: rrnB_T1
