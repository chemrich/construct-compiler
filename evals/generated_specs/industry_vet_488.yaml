construct:
  name: "ProteinH_GFP_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinH_GFP
        expression: high
        chain:
          - gene:
              id: ProteinH
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
