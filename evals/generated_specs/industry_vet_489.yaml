construct:
  name: ProteinI_His_pulldown
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: ProteinI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinI
              source: uniprot
    
    - terminator: rrnB_T1
