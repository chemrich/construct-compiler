construct:
  name: "capsid_egfp_fusion_tracking"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: capsid_fusion
        expression: high
        chain:
          - gene:
              id: "target_capsid"
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_polyA