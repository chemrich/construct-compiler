construct:
  name: capsid_GFP_packaging_tracker
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: capsid_GFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: capsid_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
