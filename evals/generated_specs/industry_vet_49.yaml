```yaml
construct:
  name: capsid_GFP_fusion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: capsid_reporter_fusion
        expression: high
        chain:
          - gene:
              id: your_gene_of_interest  # Replace with actual gene ID
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
