construct:
  name: "mammalian_dual_protein_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinL
        expression: high
        gene:
          id: ProteinL
          source: uniprot

    - spacer: 30

    - cistron:
        label: IRES_ProteinM
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinM
              source: uniprot
        # Note: IRES (Internal Ribosome Entry Site) inserted upstream of this cistron
        # to enable cap-independent translation of ProteinM from the same mRNA

    - terminator: rrnB_T1
