construct:
  name: "PeriplasmicN"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
      cistron:
        label: target
        expression: high
        chain:
          - tag: PelB  # Signal sequence for periplasmic targeting
          - gene:
              id: N
              source: uniprot
      terminator: T7term