construct:
  name: "PeriplasmicN_periplasmic_expression"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: pelB  # N-terminal periplasmic targeting signal
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PeriplasmicN
              source: uniprot

    - terminator: rrnB_T1
