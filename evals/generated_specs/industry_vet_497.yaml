construct:
  name: "ProteinR_self_cleaving_intein"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinR_with_intein
        expression: high
        chain:
          - tag: 6xHis
          - intein: Mxe_GyrA  # N-terminal intein (self-cleaves post-expression when induced with thiol)
          - gene:
              id: ProteinR
              source: uniprot

    - terminator: rrnB_T1
