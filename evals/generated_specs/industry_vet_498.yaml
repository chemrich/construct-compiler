construct:
  name: "GeneS_miR122_detarget_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneS
        expression: high
        gene:
          id: GeneS
          source: uniprot

    - terminator: SV40_polyA
      # Note: 3' UTR miR-122 target sites appended post-synthesis
      # miR-122 binding elements (4x miR-122 BS) inserted between stop codon and polyA
      # This detargets expression from liver tissue and fine-tunes expression level
