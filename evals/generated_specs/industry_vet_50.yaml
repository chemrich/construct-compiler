construct:
  name: "periplasmic_payload_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: payload
        expression: high
        chain:
          - signal_peptide: PelB  # PelB periplasmic signal sequence
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: payload
              source: uniprot

    - terminator: rrnB_T1
