construct:
  name: "periplasmic_aav_vp1_production"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: PelB  # Signal peptide for periplasmic targeting
          - tag: 6xHis # Purification handle requested
          - cleavage_site: TEV
          - gene:
              id: VP1
              source: uniprot

    - terminator: T7term