construct:
  name: "bicistronic_AAV_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: payload_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    # IRES element for independent translation of second cistron from same promoter
    - spacer: 50  # IRES sequence placeholder; actual IRES (e.g., EMCV or EIF4G) ~600bp

    - cistron:
        label: payload_2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
