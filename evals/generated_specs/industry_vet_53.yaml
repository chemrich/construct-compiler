construct:
  name: "mammalian_bicistronic_ires_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: payload_one
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    - spacer: 580  # IRES (Internal Ribosome Entry Site) sequence for bicistronic translation
    - cistron:
        label: payload_two
        expression: medium
        fused: false  # Separate translation via IRES
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Standard terminator sequence