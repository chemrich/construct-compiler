construct:
  name: "inducible_degradation_payload"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: payload
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: degron_dBET1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
