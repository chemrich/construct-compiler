construct:
  name: "on_demand_degradation_payload"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: mAID  # Mini-auxin inducible degron for on-demand proteasomal degradation
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: SV40_polyA