construct:
  name: "mammalian_membrane_protein_expression_optimized"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: membrane_payload
        expression: high
        chain:
          - tag: HA
          - gene:
              id: ADRB2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: bGH_PA