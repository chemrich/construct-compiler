construct:
  name: "membrane_protein_AAV_optimized"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: membrane_protein
        expression: high
        chain:
          - tag: HA
          - gene:
              id: null
              source: uniprot
              # User must provide UniProt ID for their membrane protein

    - spacer: 30

    - cistron:
        label: trafficking_helper
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: BiP
              source: uniprot
              # BiP (GRP78) co-expression enhances ER retention and proper folding

    - terminator: rrnB_T1
