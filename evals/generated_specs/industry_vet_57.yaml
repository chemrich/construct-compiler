construct:
  name: "pichia_pastoris_secreted_payload"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: payload
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: payload
              source: uniprot

    - terminator: CYC1
