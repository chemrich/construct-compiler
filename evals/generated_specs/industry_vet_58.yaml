construct:
  name: "clinical_grade_AAV_dual_purification"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_dual_tagged
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - tag: Strep-II
          - cleavage_site: Factor_Xa
          - solubility_tag: MBP
          - gene:
              id: AAV_capsid_protein
              source: uniprot

    - terminator: rrnB_T1
