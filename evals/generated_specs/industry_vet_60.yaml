construct:
  name: "simple_GOI_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: GOI
        expression: high
        chain:
          - gene:
              id: GOI
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
