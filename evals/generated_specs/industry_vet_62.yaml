construct:
  name: "bicistronic_goi1_ires_egfp_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: GOI1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI1
              source: uniprot
    - spacer: 585  # EMCV IRES element for internal ribosome entry
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_pA