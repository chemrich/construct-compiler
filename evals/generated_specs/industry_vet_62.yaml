construct:
  name: "bicistronic_GOI1_eGFP_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: GOI1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI1
              source: uniprot

    # IRES-mediated translation of second cistron
    - spacer: 25

    - cistron:
        label: eGFP
        expression: high
        fused: false
        gene:
          id: eGFP
          source: fpbase

    - terminator: rrnB_T1
