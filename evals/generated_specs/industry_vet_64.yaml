construct:
  name: "yeast_expression_vector"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Strong inducible yeast promoter, equivalent robustness to AAV promoters

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1  # Standard yeast terminator
