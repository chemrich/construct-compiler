construct:
  name: "GOI_FP_direct_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha # Shortened EF1a (EFS) promoter for constitutive expression
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: "GOI"
          - tag: "FP" # Small functional peptide fused C-terminally
    - terminator: WPRE_BGH_polyA # Includes WPRE regulatory element followed by polyA signal