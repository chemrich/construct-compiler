construct:
  name: GOI_FP_direct_fusion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: GOI_FP
        expression: high
        chain:
          - gene:
              id: GOI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: FP
              source: uniprot

    - spacer: 20

    - cistron:
        label: WPRE
        fused: false
        gene:
          id: WPRE
          source: uniprot

    - terminator: BBa_B0015
