construct:
  name: "inducible_GOI_strep_tag"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GOI
        expression: high
        chain:
          - gene:
              id: GOI
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - terminator: rrnB_T1
