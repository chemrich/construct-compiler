construct:
  name: "AAV_capsid_dual_affinity_tags"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: AAV_capsid
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: AAV2_capsid
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
