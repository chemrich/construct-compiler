construct:
  name: "aav_capsid_dual_tag_purification"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive E. coli promoter as requested
    - cistron:
        label: aav_vp1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: P03135
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1