construct:
  name: "mammalian_CMV_WPRE_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: null
              source: uniprot

    - terminator: rrnB_T1
    
    # WPRE (Woodchuck Hepatitis Post-transcriptional Regulatory Element) 
    # included in pTwist CMV backbone for enhanced expression
