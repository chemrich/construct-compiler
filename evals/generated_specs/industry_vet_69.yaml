construct:
  name: "mammalian_high_expression_flag_wpre"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_pA  # WPRE element requested: integrated into the 3' UTR prior to the polyadenylation signal for mRNA stabilization.