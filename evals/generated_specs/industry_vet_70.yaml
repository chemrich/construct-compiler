construct:
  name: "secreted_protein_AAV"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: SP_IgG  # IgG signal peptide for secretion from mammalian cells
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification from media

    - terminator: rrnB_T1
