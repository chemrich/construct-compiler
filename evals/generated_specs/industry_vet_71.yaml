construct:
  name: "codon_optimized_viral_gene_strep_tag"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: viral_gene_codon_optimized_ecoli
              source: uniprot
              # Note: Codon optimization for E. coli should be applied during gene synthesis
    
    - terminator: rrnB_T1
