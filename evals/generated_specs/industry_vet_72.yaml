construct:
  name: "targeted_degradation_mEGFP"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: 6xHis
          - tag: SsrA  # Standard E. coli C-terminal degradation tag recognized by ClpXP/ClpAP
    - terminator: T7term