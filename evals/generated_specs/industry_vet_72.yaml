construct:
  name: "degron_tagged_protein_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis
          - degron: ssrA  # C-terminal ssrA tag (Lon protease recognition)

    - terminator: rrnB_T1
