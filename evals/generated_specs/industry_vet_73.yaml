construct:
  name: bicistronic_GOI1_GOI2_yeast
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GOI1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI1
              source: uniprot

    - spacer: 50

    - cistron:
        label: GOI2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GOI2
              source: uniprot

    - terminator: CYC1
