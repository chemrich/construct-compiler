construct:
  name: "yeast_bicistronic_his_goi"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GOI1
              source: uniprot
    - spacer: 30 # Intercistronic region configured for IRES-mediated translation initiation
    - cistron:
        label: target_2
        expression: high
        fused: false # Indicates independent translation initiation for the second cistron
        chain:
          - tag: 6xHis
          - gene:
              id: GOI2
              source: uniprot
    - terminator: CYC1