construct:
  name: "AAV_packaged_protein_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - aav_itr:
        position: 5prime
        serotype: AAV2

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: unspecified_protein
              source: uniprot

    - aav_itr:
        position: 3prime
        serotype: AAV2

    - terminator: rrnB_T1
