construct:
  name: "aav_cag_6xhis_target_cassette"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    # AAV Inverted Terminal Repeats (ITRs) are positioned flanking this expression cassette for viral packaging
    - promoter: CAG
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_polyA