construct:
  name: "constitutive_max_output_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Strongest constitutive Anderson promoter for maximum output
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015  # Robust double terminator for maximum stability