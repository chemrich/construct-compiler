construct:
  name: "constitutive_high_expression_ecoli"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: trc  # trc is a strong constitutive promoter, bacterial equivalent of CAG strength
    
    - cistron:
        label: target
        expression: high
        gene:
          id: unspecified
          source: uniprot
    
    - terminator: rrnB_T1
