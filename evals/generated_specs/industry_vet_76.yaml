construct:
  name: "GOI_Renilla_luciferase_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GOI
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: custom_GOI
              source: uniprot

    - spacer: 21

    - cistron:
        label: P2A_peptide
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 21

    - cistron:
        label: luciferase_reporter
        expression: high
        fused: false
        gene:
          id: Renilla_luciferase
          source: uniprot

    - terminator: rrnB_T1
