construct:
  name: "low_copy_inducible_rep_protein"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: rep_protein
        expression: low
        chain:
          - gene:
              id: AAV_Rep
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
