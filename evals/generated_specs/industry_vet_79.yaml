construct:
  name: "muscle_promoter_ecoli_test"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # Note: Muscle-specific promoters (e.g., MCK, desmin) are eukaryotic and non-functional in E. coli.
      # Substituted with T7lac for prokaryotic expression. For actual tissue-specific control, use a mammalian host with pTwist CMV or similar.

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: user_protein
              source: uniprot

    - terminator: rrnB_T1
