construct:
  name: "mammalian_IRES_bicistronic_D_E"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_d
        gene:
          id: Protein_D
          source: uniprot
    - spacer: 585  # EMCV IRES (Internal Ribosome Entry Site) sequence
    - cistron:
        label: protein_e
        fused: false  # Independent translation via IRES
        gene:
          id: Protein_E
          source: uniprot
    - terminator: BGH_pA