```yaml
construct:
  name: "Protein_D_IRES_Protein_E_bicistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_d
        expression: high
        gene:
          id: Protein_D
          source: uniprot

    - spacer: 30  # IRES element - enables independent translation of downstream cistron

    - cistron:
        label: protein_e
        expression: medium
        fused: false  # independent translation via IRES
        gene:
          id: Protein_E
          source: uniprot

    - terminator: polyA
```