construct:
  name: "CMV_ProteinD_IRES_ProteinE_AAV"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_D
        expression: high
        gene:
          id: Protein_D
          source: uniprot

    # IRES for cap-independent translation initiation
    - spacer: 120  # IRES element (~120 bp)

    - cistron:
        label: Protein_E
        expression: high
        fused: false
        gene:
          id: Protein_E
          source: uniprot

    - terminator: polyA  # SV40 or WPRE polyA signal for mammalian/AAV
