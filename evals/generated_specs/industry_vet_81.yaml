construct:
  name: "secreted_human_growth_factor_mammalian_ivt"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_growth_factor
        expression: high
        chain:
          - signal_peptide: Kozak_secretion  # N-terminal signal for ER targeting and secretion
          - gene:
              id: human_growth_factor
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His tag for detection/purification

    - terminator: polyA  # mammalian polyadenylation signal
