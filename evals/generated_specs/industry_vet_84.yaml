construct:
  name: "dual_protein_P2A_His_tags"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein1
              source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: protein2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein2
              source: uniprot
    
    # Note: P2A peptide sequence should be inserted between protein1 stop codon
    # and protein2 start codon. This design uses a 20bp spacer as placeholder;
    # in practice, the P2A coding sequence (~57 bp) should replace or extend this spacer.
    # Post-translational cleavage at P2A will yield two independent proteins.
    
    - terminator: rrnB_T1
