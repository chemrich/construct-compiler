construct:
  name: "mammalian_protein_complex_dual_subunit"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Subunit_A
        expression: high
        chain:
          - gene:
              id: subunit_a
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: IRES_separator
        fused: false
        expression: high
        chain:
          - gene:
              id: subunit_b
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
