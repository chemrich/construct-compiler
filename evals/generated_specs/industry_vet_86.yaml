construct:
  name: "yeast_secreted_Fab_His"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Fab
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: P01857
              source: uniprot
              codon_optimize: true
              optimization_host: yeast
          - tag: 6xHis

    - terminator: CYC1
