construct:
  name: mammalian_protein_GFP_fusion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
