construct:
  name: "Mammalian_Target_mEGFP_C_terminal_Fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_fusion
        expression: high
        chain:
          - gene:
              id: P53_HUMAN
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_polyA