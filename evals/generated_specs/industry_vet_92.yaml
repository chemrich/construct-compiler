construct:
  name: yeast_surface_display_binding_domain
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_anchor
        expression: high
        chain:
          - gene:
              id: Aga2p
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: binding_domain
              source: uniprot
          - tag: HA

    - terminator: CYC1
