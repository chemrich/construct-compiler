construct:
  name: "TAP_tagged_protein_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: tap_target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Twin-Strep
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term