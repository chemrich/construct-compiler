construct:
  name: "mammalian_CAG_optimized_Kozak"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: target
        expression: high
        chain:
          - kozak_sequence: strong  # strong Kozak (GCCRCCATGG) for mammalian translation initiation
          - gene:
              id: null  # User to specify their gene ID
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
