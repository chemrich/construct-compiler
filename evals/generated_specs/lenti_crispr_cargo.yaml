construct:
  name: "Jurkat_EF1a_mEGFP_Puro_Lenti"
  host: Jurkat
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: selection
        expression: medium
        fused: false
        gene:
          id: P13249
          source: uniprot
    - terminator: hGH_pA