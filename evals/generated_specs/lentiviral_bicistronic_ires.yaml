```yaml
construct:
  name: "lentiviral_bicistronic_mEGFP_puroR"
  host: HEK293 # Lentiviral constructs are typically expressed in mammalian cells; HEK293 is a common host.

  backbone:
    catalog_vector: "pTwist CMV" # A common mammalian expression vector, often used in lentiviral systems.

  cassette:
    - promoter: CMV # Common strong promoter for mammalian expression.

    - cistron:
        label: mEGFP_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 30 # A spacer between cistrons for bicistronic expression.
                 # The 'fused: false' on the next cistron signifies independent translation
                 # via an IRES element as described in the prompt.

    - cistron:
        label: puroR
        expression: medium # Puromycin resistance typically needs medium expression for selection.
        fused: false # Indicates independent translation from the same transcript, mediated by an IRES.
        gene:
          id: PAC # Puromycin N-acetyltransferase gene
          source: uniprot # UniProt ID for PAC is P00494.

    - terminator: BBa_B0015 # A common strong terminator.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```