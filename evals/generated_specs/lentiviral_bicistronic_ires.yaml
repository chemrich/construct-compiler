construct:
  name: "lentiviral_mEGFP_IRES_PuroR"
  host: HEK293
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: fluorescent_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 574  # Length of standard IRESv2 element
    - cistron:
        label: selection_marker
        expression: medium
        fused: false
        gene:
          id: P13249
          source: uniprot
    - terminator: bGH_PA