construct:
  name: "Lentiviral_Cre_Self_Excisable_Selection"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: cre_recombinase
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: P06956
              source: uniprot
    - spacer: 30
    - cistron:
        label: puromycin_resistance
        expression: medium
        fused: false  # Independently translated selection marker
        gene:
          id: P42670
          source: uniprot
    - terminator: SV40_polyA