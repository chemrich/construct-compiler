```yaml
construct:
  name: "lentiviral_CMV_EF1a_dual_expression"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV" # This is a mammalian expression vector, typically used for transient/stable expression, not explicitly a full lentiviral backbone in the context of packaging.

  cassette:
    - promoter: CMV
    - cistron:
        label: mEGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015 # For mammalian expression, a polyadenylation signal (e.g., SV40_polyA or bGH_polyA) is typically required here, but not available in the current schema.
    - promoter: EF1_alpha
    - cistron:
        label: mScarlet
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015 # For mammalian expression, a polyadenylation signal (e.g., SV40_polyA or bGH_polyA) is typically required here, but not available in the current schema.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
