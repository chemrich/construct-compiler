construct:
  name: "lenti_EF1a_mEGFP_puroR"
  host: HEK293
  backbone:
    catalog_vector: "pLenti6"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: reporter
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30  # Spacer provided for bicistronic architecture; typically requires an IRES or 2A peptide in mammalian systems.
    - cistron:
        label: selection
        fused: false
        gene:
          id: pac
          source: uniprot
    - terminator: bGH_polyA