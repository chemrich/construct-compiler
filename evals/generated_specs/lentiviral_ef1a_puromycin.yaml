```yaml
construct:
  name: "lentivirus_mEGFP_puroR"
  host: HEK293 # Lentiviral vectors are typically used in mammalian cells like HEK293 for packaging and transduction.

  backbone:
    catalog_vector: "pTwist CMV" # Using a generic mammalian catalog vector as a placeholder. A true lentiviral backbone would include LTRs, packaging signals, etc., which are not explicitly options in the schema's catalog_vector list.

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: mEGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 30 # Separating mEGFP from the puromycin resistance gene for independent translation

    - cistron:
        label: puroR
        expression: medium
        fused: false # Puromycin resistance is an independent protein
        gene:
          id: P0A7Y5 # UniProt ID for Puromycin N-acetyltransferase (pac gene)
          source: uniprot

    - terminator: BBa_B0015 # Placeholder for a mammalian polyadenylation signal (e.g., SV40 polyA, bGH polyA), which is not directly an option in the current schema's terminator list.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```