construct:
  name: "Lentiviral_RRE_mEGFP_Expression"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: WPRE_SV40_polyA  # RRE and WPRE are essential for lentiviral stability and packaging efficiency