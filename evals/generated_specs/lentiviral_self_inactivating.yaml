```yaml
construct:
  name: "mammalian_expression_plasmid"
  host: mammalian
  # The description refers to a self-inactivating lentiviral vector,
  # which includes complex viral elements (LTRs, packaging signals, etc.)
  # not directly representable or supported by this plasmid-focused schema.
  # This specification represents a standard mammalian expression plasmid,
  # which is the typical goal of a lentiviral vector's payload (i.e., to express a gene in mammalian cells).
  # The "self-inactivating" aspect is a vector design feature external to this schema.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: payload_gene
        expression: high
        gene:
          id: mEGFP # Using mEGFP as a common reporter gene payload.
          source: fpbase
    - terminator: BBa_B0015 # Schema limitation: using a generic terminator. Mammalian vectors typically use polyadenylation signals (e.g., BGH polyA, SV40 polyA).
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```