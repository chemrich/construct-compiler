```yaml
construct:
  name: "dox_inducible_lentiviral_transgene"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV" # Note: A true lentiviral backbone would include LTRs and packaging signals, not fully represented by this catalog vector.

  cassette:
    # A doxycycline-inducible system typically involves a Tet-response element (TRE)
    # and a transactivator. The 'CMV' promoter here represents a strong mammalian
    # promoter often used in such systems, or as the minimal promoter within the TRE.
    # The schema does not allow for explicit specification of a Tet-On/Off system.
    - promoter: CMV

    - cistron:
        label: transgene
        expression: high
        gene:
          id: gene_of_interest # Placeholder for the desired transgene
          source: uniprot # Generic source for a hypothetical protein

    # Note: For mammalian expression, a polyadenylation signal (e.g., SV40 polyA)
    # is typically used as a terminator. 'BBa_B0015' is an E. coli terminator
    # and is used here as the closest option available in the schema.
    - terminator: BBa_B0015

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```