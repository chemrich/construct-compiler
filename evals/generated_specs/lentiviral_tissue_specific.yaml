construct:
  name: "lentiviral_hSyn_mCherry_neuron_specific"
  host: mammalian
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: hSyn  # Neuron-specific human Synapsin 1 promoter
    - cistron:
        label: neuron_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: BGH_pA