```yaml
construct:
  name: "lentiviral_neuron_target"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV # Neuron-specific promoter not in the defined list, using common mammalian CMV as a placeholder.
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015 # A mammalian polyadenylation signal (e.g., SV40 PolyA, bGH PolyA) would be typical for a lentiviral construct, but is not in the schema's terminator list.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```