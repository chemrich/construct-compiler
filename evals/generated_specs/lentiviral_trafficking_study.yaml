construct:
  name: lentiviral_dual_trafficking_reporter
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: nuclear_reporter
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: er_reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: SEC61B
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015