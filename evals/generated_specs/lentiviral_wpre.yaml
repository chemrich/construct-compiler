construct:
  name: "lentiviral_mEGFP_WPRE"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: WPRE_bGH_pA  # WPRE is placed before the polyadenylation signal for enhanced mRNA stability and expression