```yaml
construct:
  name: "HEK293_CMV_mEGFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: mEGFP_target
        expression: high # CMV is a strong promoter for high expression
        gene:
          id: mEGFP
          source: fpbase

    - terminator: BBa_B0015 # For a mammalian host like HEK293, this implies a polyadenylation signal (e.g., SV40 polyA or BGH polyA). The compiler will interpret BBa_B0015 as a generic placeholder for a mammalian polyA.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```