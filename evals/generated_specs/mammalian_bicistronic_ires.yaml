construct:
  name: "HEK293_mEGFP_IRES_mScarlet"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: first_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 580  # IRES element length
    - cistron:
        label: second_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_polyA