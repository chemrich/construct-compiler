```yaml
construct:
  name: "CHO_EF1a_mEGFP"
  host: CHO

  backbone:
    # Puromycin resistance is often a selection marker in mammalian vectors,
    # but not a direct option in the current 'resistance' field (which is for E. coli).
    # Using pTwist CMV as a common mammalian catalog vector.
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: BBa_B0015

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```