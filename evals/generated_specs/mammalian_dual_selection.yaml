```yaml
construct:
  name: "HEK293_CMV_mEGFP_stable_selection"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV" # This vector typically includes a mammalian selection marker like neomycin resistance for stable transfection in HEK293 cells.

  cassette:
    - promoter: CMV

    - cistron:
        label: mEGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    # For mammalian expression, a poly-A signal is required. The pTwist CMV catalog vector typically provides this.
    # The available terminator options in the schema are bacterial. rrnB_T1 is included as a placeholder,
    # primarily relevant for the bacterial cloning plasmid context if the construct is maintained in E. coli.
    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```