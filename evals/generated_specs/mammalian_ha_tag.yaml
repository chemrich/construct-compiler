```yaml
construct:
  name: "HA_mScarlet_mammalian_expression"
  host: HEK293 # A specific mammalian host for general "mammalian cells"

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: HA_mScarlet
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: BBa_B0015 # Bacterial terminator; for mammalian expression, a polyadenylation signal (usually from the vector) is used.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```