construct:
  name: "his_insulin_cho"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: insulin
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: insulin
              source: uniprot

    - terminator: BBa_B0015 # Note: For mammalian expression, a polyadenylation signal is typically used instead of bacterial terminators. BBa_B0015 is used as a placeholder from the provided list.
