construct:
  name: "mammalian_cumate_inducible_system"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: cymR_repressor
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: P54981
              source: uniprot
    - terminator: SV40_polyA
    - promoter: CMV  # Modified with CuO operator sites for cumate-inducible control
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_polyA