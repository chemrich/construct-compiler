construct:
  name: "mammalian_kozak_optimized_mEGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_reporter
        expression: high # High expression setting triggers optimal translation initiation sequences (Kozak) for the specified host
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: SV40_polyA # Standard polyadenylation signal for mammalian termination