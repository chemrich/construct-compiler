          - gene:
              id: IsoprenoidSynthase
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: Enzyme2
        expression: high
        fused: false
        gene:
          id: Enzyme2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme3
        expression: high
        fused: false
        gene:
          id: Enzyme3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme4
        expression: high
        fused: false
        gene:
          id: Enzyme4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme5
        expression: high
        fused: false
        gene:
          id: Enzyme5
          source: uniprot

    - terminator: rrnB_T1
