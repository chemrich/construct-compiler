construct:
  name: P_pastoris_PKS_pathway_4enzyme
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: PKS_KS
        expression: high
        gene:
          id: PKS_KS
          source: uniprot

    - spacer: 30

    - cistron:
        label: PKS_AT
        expression: high
        fused: false
        gene:
          id: PKS_AT
          source: uniprot

    - spacer: 30

    - cistron:
        label: PKS_DH
        expression: high
        fused: false
        gene:
          id: PKS_DH
          source: uniprot

    - spacer: 30

    - cistron:
        label: PKS_TE
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: PKS_TE
              source: uniprot

    - terminator: rrnB_T1
