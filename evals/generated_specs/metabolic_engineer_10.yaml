construct:
  name: "Aspergillus_niger_pectin_degradation_pathway"
  host: aspergillus_niger

  backbone:
    resistance: hygromycin
    ori: AMA1
    source: addgene

  cassette:
    - promoter: PgpdA  # Strong constitutive promoter for Aspergillus

    - cistron:
        label: pectinase_1
        expression: high
        chain:
          - signal_peptide: alpha_factor_Aspergillus
          - gene:
              id: pectinase_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: pectinase_2
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor_Aspergillus
          - gene:
              id: pectinase_B
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: pectinase_3
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor_Aspergillus
          - gene:
              id: pectinase_C
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: pectinase_4
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor_Aspergillus
          - gene:
              id: pectinase_D
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: pectinase_5
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor_Aspergillus
          - gene:
              id: pectinase_E
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - terminator: Aspergillus_terminator
