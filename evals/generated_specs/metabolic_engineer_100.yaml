construct:
  name: mevalonate_pathway_operon
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # strong constitutive promoter for balanced expression
    
    - cistron:
        label: acetoacetyl_coa_thiophorase
        expression: high
        rbs_strength: strong
        gene:
          id: atoB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: hmg_coa_synthase
        expression: high
        rbs_strength: medium
        fused: false
        gene:
          id: mvaS
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: hmg_coa_reductase
        expression: medium
        rbs_strength: medium
        fused: false
        gene:
          id: mvaE
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: mevalonate_kinase
        expression: medium
        rbs_strength: weak
        fused: false
        gene:
          id: mvaK1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: phosphomevalonate_kinase
        expression: medium
        rbs_strength: weak
        fused: false
        gene:
          id: mvaK2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: diphosphomevalonate_decarboxylase
        expression: high
        rbs_strength: strong
        fused: false
        gene:
          id: idi
          source: uniprot
    
    - terminator: rrnB_T1
