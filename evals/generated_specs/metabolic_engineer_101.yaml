construct:
  name: "polyketide_synthase_cluster_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2mu
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: PKS_enzyme_1_mitochondrial
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: PKS_enzyme_1
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - cistron:
        label: PKS_enzyme_2_mitochondrial
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: PKS_enzyme_2
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - cistron:
        label: PKS_enzyme_3_cytoplasmic
        expression: high
        chain:
          - gene:
              id: PKS_enzyme_3
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - cistron:
        label: PKS_enzyme_4_cytoplasmic
        expression: high
        chain:
          - gene:
              id: PKS_enzyme_4
              source: uniprot

    - terminator: CYC1
