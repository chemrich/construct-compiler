construct:
  name: lysine_biosynthesis_operon_bacillus
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_spac  # Strong, constitutive, tightly regulated Gram-positive promoter

    - cistron:
        label: aspartokinase
        expression: high
        gene:
          id: lysC
          source: uniprot

    - spacer: 25

    - cistron:
        label: aspartate_semialdehyde_dehydrogenase
        expression: high
        fused: false
        gene:
          id: asd
          source: uniprot

    - spacer: 25

    - cistron:
        label: dihydrodipicolinate_synthase
        expression: high
        fused: false
        gene:
          id: dapA
          source: uniprot

    - spacer: 25

    - cistron:
        label: dihydrodipicolinate_reductase
        expression: high
        fused: false
        gene:
          id: dapB
          source: uniprot

    - spacer: 25

    - cistron:
        label: tetrahydrodipicolinate_succinylase
        expression: high
        fused: false
        gene:
          id: dapD
          source: uniprot

    - spacer: 25

    - cistron:
        label: lysine_decarboxylase
        expression: high
        fused: false
        gene:
          id: lysA
          source: uniprot

    - terminator: rrnB_T1
