construct:
  name: "b_subtilis_enhanced_lysine_operon"
  host: b_subtilis  # Rule 15: Using standard biological name for Bacillus subtilis
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_veg  # Strong constitutive promoter for Gram-positive bacteria
    - cistron:
        label: aspartokinase_III
        expression: high
        gene:
          id: lysC
          source: uniprot
    - spacer: 30
    - cistron:
        label: dihydrodipicolinate_synthase
        expression: high
        fused: false
        gene:
          id: dapA
          source: uniprot
    - spacer: 30
    - cistron:
        label: dihydrodipicolinate_reductase
        expression: high
        fused: false
        gene:
          id: dapB
          source: uniprot
    - spacer: 30
    - cistron:
        label: tetrahydropyridine_2_6_dicarboxylate_N_succinyltransferase
        expression: high
        fused: false
        gene:
          id: dapD
          source: uniprot
    - spacer: 30
    - cistron:
        label: succinyl_diaminopimelate_aminotransferase
        expression: high
        fused: false
        gene:
          id: dapC
          source: uniprot
    - spacer: 30
    - cistron:
        label: diaminopimelate_decarboxylase
        expression: high
        fused: false
        gene:
          id: lysA
          source: uniprot
    - terminator: rrnB_T1