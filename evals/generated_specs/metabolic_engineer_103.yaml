construct:
  name: butanol_operon_gg_rbs_library
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: adhE_rbs_gg
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: adhE
              source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: fdhF_rbs_gg
        expression: medium
        fused: false
        chain:
          - gene:
              id: fdhF
              source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: aldB_rbs_gg
        expression: medium
        fused: false
        chain:
          - gene:
              id: aldB
              source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: yqhD_rbs_gg
        expression: low
        fused: false
        chain:
          - gene:
              id: yqhD
              source: uniprot
    
    - terminator: rrnB_T1
