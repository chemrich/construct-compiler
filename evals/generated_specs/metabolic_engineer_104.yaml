construct:
  name: "mammalian_five_enzyme_pathway"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: P12345
              source: uniprot
          - tag: 6xHis
    - terminator: hGH_polyA
    - promoter: CMV
    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - gene:
              id: P23456
              source: uniprot
          - tag: 6xHis
    - terminator: hGH_polyA
    - promoter: CMV
    - cistron:
        label: enzyme_3
        expression: high
        chain:
          - gene:
              id: P34567
              source: uniprot
          - tag: 6xHis
    - terminator: hGH_polyA
    - promoter: CMV
    # Note: To incorporate the requested IRES for co-translation, enzyme_4 and enzyme_5 are arranged bicistronically under the fourth CMV promoter.
    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - gene:
              id: P45678
              source: uniprot
          - tag: 6xHis
    - spacer: 585  # Internal Ribosome Entry Site (EMCV IRES)
    - cistron:
        label: enzyme_5
        expression: high
        fused: false  # Independent translation initiation via IRES
        chain:
          - gene:
              id: P56789
              source: uniprot
          - tag: 6xHis
    - terminator: hGH_polyA