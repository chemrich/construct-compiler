construct:
  name: "five_enzyme_pathway_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: P12345
              source: uniprot
          - tag: 6xHis

    - terminator: bGH_polyA

    - promoter: CMV

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - gene:
              id: P23456
              source: uniprot
          - tag: 6xHis

    - terminator: bGH_polyA

    - promoter: CMV

    - cistron:
        label: enzyme_3_ires_coupling
        expression: high
        chain:
          - gene:
              id: P34567
              source: uniprot
          - tag: 6xHis
        # Note: IRES element inserted after this cassette terminator in vector design

    - terminator: bGH_polyA

    - promoter: CMV

    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - gene:
              id: P45678
              source: uniprot
          - tag: 6xHis

    - terminator: bGH_polyA

    - promoter: CMV

    - cistron:
        label: enzyme_5
        expression: high
        chain:
          - gene:
              id: P56789
              source: uniprot
          - tag: 6xHis

    - terminator: bGH_polyA
