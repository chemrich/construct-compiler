construct:
  name: PHA_pathway_six_gene_P_pastoris
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAPDH

    - cistron:
        label: PHA_synthase
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: phaCAB
              source: uniprot

    - spacer: 25

    - cistron:
        label: acetyl_CoA_carboxylase
        expression: high
        fused: false
        gene:
          id: ACC1
          source: uniprot

    - spacer: 25

    - cistron:
        label: malonyl_CoA_reductase
        expression: high
        fused: false
        gene:
          id: MCR
          source: uniprot

    - spacer: 25

    - cistron:
        label: 3_ketoacyl_CoA_thiolase
        expression: medium
        fused: false
        gene:
          id: THIO
          source: uniprot

    - spacer: 25

    - cistron:
        label: polyhydroxybutyrate_polymerase
        expression: medium
        fused: false
        gene:
          id: PHB_polymerase
          source: uniprot

    - spacer: 25

    - cistron:
        label: acetoacetyl_CoA_reductase
        expression: medium
        fused: false
        gene:
          id: AACR
          source: uniprot

    - terminator: CYC1_poly_A
