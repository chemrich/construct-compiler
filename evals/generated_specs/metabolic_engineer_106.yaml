construct:
  name: "vitamin_B12_precursor_synthesis_pathway"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: cbiA
        expression: low
        chain:
          - gene:
              id: cbiA
              source: uniprot

    - spacer: 25

    - cistron:
        label: cbiB
        expression: low
        fused: false
        gene:
          id: cbiB
          source: uniprot

    - spacer: 25

    - cistron:
        label: cbiC
        expression: low
        fused: false
        gene:
          id: cbiC
          source: uniprot

    - spacer: 25

    - cistron:
        label: cbiD
        expression: low
        fused: false
        gene:
          id: cbiD
          source: uniprot

    - terminator: rrnB_T1
