construct:
  name: dual_operon_six_enzyme_system
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: araB
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: malZ
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: xylA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: treA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_6
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: scrK
              source: uniprot
    
    - terminator: rrnB_T1
