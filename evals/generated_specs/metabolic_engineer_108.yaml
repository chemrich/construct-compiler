construct:
  name: "four_gene_FRET_pathway_mammalian"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: enzyme1_CFP
        expression: high
        chain:
          - gene:
              id: mCerulean
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme1
              source: uniprot

    - terminator: SV40polyA

    - promoter: EF1_alpha
    - cistron:
        label: enzyme2_YFP
        expression: high
        chain:
          - gene:
              id: mVenus
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme2
              source: uniprot

    - terminator: SV40polyA

    - promoter: CMV
    - cistron:
        label: enzyme3
        expression: high
        chain:
          - gene:
              id: enzyme3
              source: uniprot

    - terminator: SV40polyA

    - promoter: EF1_alpha
    - cistron:
        label: enzyme4
        expression: high
        chain:
          - gene:
              id: enzyme4
              source: uniprot

    - terminator: SV40polyA
