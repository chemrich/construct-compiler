    - cistron:
        label: enzyme_1_cfp
        expression: high
        chain:
          - gene:
              id: enzyme_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mTurquoise2
              source: fpbase
    - terminator: bGH_polyA
    - spacer: 50
    - promoter: EF1_alpha
