construct:
  name: "five_gene_metabolic_pathway_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - integration_site: attB_lambda
      
    - promoter: J23100

    - cistron:
        label: gene_1
        expression: high
        gene:
          id: enzymeA
          source: uniprot

    - rbs: BBa_B0030

    - cistron:
        label: gene_2
        expression: high
        gene:
          id: enzymeB
          source: uniprot

    - rbs: BBa_B0031

    - cistron:
        label: gene_3
        expression: medium
        gene:
          id: enzymeC
          source: uniprot

    - rbs: BBa_B0032

    - cistron:
        label: gene_4
        expression: medium
        gene:
          id: enzymeD
          source: uniprot

    - rbs: BBa_B0033

    - cistron:
        label: gene_5
        expression: high
        gene:
          id: enzymeE
          source: uniprot

    - terminator: rrnB_T1
    
    - integration_site: attB_lambda
