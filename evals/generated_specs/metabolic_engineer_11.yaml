construct:
  name: "four_enzyme_metabolic_shunt_arabinose"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: enzyme_1
              source: uniprot
          - tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_2
              source: uniprot
          - tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_3
              source: uniprot
          - tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_4
              source: uniprot
          - tag: LVA

    - terminator: rrnB_T1
