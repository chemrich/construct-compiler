construct:
  name: "yeast_stress_response_four_gene_operon"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: hsp104

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: HSP70
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: HSP90
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: SSA1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: UBQ1
              source: uniprot

    - terminator: CYC1
