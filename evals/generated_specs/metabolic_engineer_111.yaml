construct:
  name: "agrobacterium_chloroplast_pathway"
  host: plant  # Standard biological host for Agrobacterium transformation
  backbone:
    resistance: kanamycin
    ori: pVS1  # Origin of replication for Agrobacterium binary vectors
    source: addgene
  cassette:
    - promoter: CaMV_35S
    - cistron:
        label: enzyme_1
        expression: high
        fused: false
        chain:
          - tag: RBCS_CTP  # Rubisco small subunit chloroplast transit peptide
          - gene:
              id: enzyme_1
              source: uniprot
    - terminator: NOS_term

    - promoter: CaMV_35S
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: RBCS_CTP
          - gene:
              id: enzyme_2
              source: uniprot
    - terminator: NOS_term

    - promoter: CaMV_35S
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: RBCS_CTP
          - gene:
              id: enzyme_3
              source: uniprot
    - terminator: NOS_term

    - promoter: CaMV_35S
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - tag: RBCS_CTP
          - gene:
              id: enzyme_4
              source: uniprot
    - terminator: NOS_term

    - promoter: CaMV_35S
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - tag: RBCS_CTP
          - gene:
              id: enzyme_5
              source: uniprot
    - terminator: NOS_term