              id: enzyme_3
              source: uniprot

    - terminator: Nos_poly_A

    - promoter: CaMV_35S

    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - tag: chloroplast_transit_peptide
          - gene:
              id: enzyme_4
              source: uniprot

    - terminator: Nos_poly_A

    - promoter: CaMV_35S

    - cistron:
        label: enzyme_5
        expression: high
        chain:
          - tag: chloroplast_transit_peptide
