construct:
  name: "dual_inducible_antibiotic_resistance_pathway"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: enzyme_1_araBAD
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2_araBAD
        expression: high
        fused: false
        gene:
          id: enzyme_2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3_araBAD
        expression: high
        fused: false
        gene:
          id: enzyme_3
          source: uniprot

    - terminator: rrnB_T1

    - promoter: L_rhamnose  # rhamnose-inducible promoter (alternative: rha_BAD)

    - cistron:
        label: enzyme_4_rhaBAD
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_4
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5_rhaBAD
        expression: high
        fused: false
        gene:
          id: enzyme_5
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6_rhaBAD
        expression: high
        fused: false
        gene:
          id: enzyme_6
          source: uniprot

    - terminator: rrnB_T1
