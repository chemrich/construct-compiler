construct:
  name: "four_enzyme_cascade_bicistronic_dual_promoter"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    # First bicistronic unit: genes 1 & 2
    - promoter: T7lac

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: enzyme_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: enzyme_2
              source: uniprot

    - terminator: rrnB_T1

    # Second bicistronic unit: genes 3 & 4
    - promoter: T7lac

    - cistron:
        label: enzyme_3
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: enzyme_3
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: low
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: enzyme_4
              source: uniprot

    - terminator: rrnB_T1
