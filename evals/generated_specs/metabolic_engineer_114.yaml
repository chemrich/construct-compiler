construct:
  name: "five_enzyme_peroxisomal_pathway_yeast"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: peroxidase_A
              source: uniprot
          - tag: PTS1
        terminator: CYC1

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - gene:
              id: catalase_T
              source: uniprot
          - tag: PTS1
        terminator: CYC1

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        chain:
          - gene:
              id: thiolase
              source: uniprot
          - tag: PTS2
        terminator: CYC1

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - gene:
              id: aldolase_peroxisomal
              source: uniprot
          - tag: PTS1
        terminator: CYC1

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        chain:
          - gene:
              id: oxidase_FAD
              source: uniprot
          - tag: PTS1
        terminator: CYC1
