construct:
  name: thermophilic_pathway_operon_geobacillus
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      # Strong constitutive promoter compatible with Bacillus/Geobacillus high-temperature expression

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - gene:
              id: GEO_ORF1_thermophilic
              source: uniprot
              # Geobacillus thermophilic pathway enzyme 1, codon-optimized for high GC content

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - gene:
              id: GEO_ORF2_thermophilic
              source: uniprot
              # Geobacillus thermophilic pathway enzyme 2, codon-optimized for high GC content

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        chain:
          - gene:
              id: GEO_ORF3_thermophilic
              source: uniprot
              # Geobacillus thermophilic pathway enzyme 3, codon-optimized for high GC content

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        chain:
          - gene:
              id: GEO_ORF4_thermophilic
              source: uniprot
              # Geobacillus thermophilic pathway enzyme 4, codon-optimized for high GC content

    - terminator: rrnB_T1
