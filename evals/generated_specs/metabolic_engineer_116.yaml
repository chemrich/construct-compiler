construct:
  name: four_gene_biosensor_pathway
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23108
      # Very weak constitutive promoter for low baseline expression

    - cistron:
        label: sensor_enzyme_1
        expression: very_low
        gene:
          id: envZ
          source: uniprot

    - spacer: 25

    - cistron:
        label: sensor_enzyme_2
        expression: very_low
        fused: false
        gene:
          id: ompR
          source: uniprot

    - spacer: 25

    - cistron:
        label: sensor_enzyme_3
        expression: very_low
        fused: false
        gene:
          id: cheA
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      # Strong inducible promoter for reporter

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
