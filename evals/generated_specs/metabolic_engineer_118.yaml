construct:
  name: "xenobiotic_degradation_operon"
  host: e_coli  # Pseudomonas putida not in schema; e_coli selected as compatible surrogate
  backbone:
    resistance: kanamycin
    ori: p15A  # Broad-host-range origin compatible with Pseudomonas/E. coli systems
    source: addgene
  cassette:
    - promoter: Pm  # XylS-regulon inducible promoter for xenobiotic detection
    - cistron:
        label: xylE
        expression: medium
        gene:
          id: xylE
          source: uniprot
    - spacer: 30
    - cistron:
        label: xylF
        expression: medium
        fused: false
        gene:
          id: xylF
          source: uniprot
    - spacer: 30
    - cistron:
        label: xylG
        expression: medium
        fused: false
        gene:
          id: xylG
          source: uniprot
    - spacer: 30
    - cistron:
        label: xylH
        expression: medium
        fused: false
        gene:
          id: xylH
          source: uniprot
    - spacer: 30
    - cistron:
        label: xylI
        expression: medium
        fused: false
        gene:
          id: xylI
          source: uniprot
    - terminator: BBa_B0015