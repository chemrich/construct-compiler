construct:
  name: "xenobiotic_degradation_operon_pp"
  host: pseudomonas_putida

  backbone:
    resistance: tetracycline
    ori: RK2  # broad-host-range origin of replication
    source: addgene

  cassette:
    - promoter: Pm  # XylS-regulon inducible promoter (responds to methylbenzoate/target xenobiotic)

    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: xylE
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: xylF
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: xylG
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: xylH
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        gene:
          id: xylI
          source: uniprot

    - terminator: rrnB_T1
