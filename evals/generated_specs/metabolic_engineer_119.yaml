construct:
  name: directed_evolution_operon_4gene
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: gene1
        expression: medium
        chain:
          - gene:
              id: lacZ_alpha
              source: uniprot

    - spacer: 25

    - cistron:
        label: gene2_mutagenesis
        expression: medium
        fused: false
        chain:
          - gene:
              id: araBAD_operon_araB
              source: uniprot
        # Note: error-prone PCR hot spots integrated at codons 50-150 and 200-280

    - spacer: 25

    - cistron:
        label: gene3
        expression: medium
        fused: false
        chain:
          - gene:
              id: araD
              source: uniprot

    - spacer: 25

    - cistron:
        label: gene4_mutagenesis
        expression: medium
        fused: false
        chain:
          - gene:
              id: araA
              source: uniprot
        # Note: error-prone PCR hot spots integrated at codons 80-180 and 250-350

    - terminator: rrnB_T1
