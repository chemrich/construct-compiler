construct:
  name: "directed_evolution_four_gene_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23106  # Medium-strength constitutive promoter
    - cistron:
        label: "gene_1"
        expression: medium
        gene:
          id: "P00509"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "gene_2_mutagenesis_target"
        expression: medium
        fused: false
        gene:
          id: "P00817"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "gene_3"
        expression: medium
        fused: false
        gene:
          id: "P0AD61"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "gene_4_mutagenesis_target"
        expression: medium
        fused: false
        gene:
          id: "P00489"
          source: uniprot
    - terminator: rrnB_T1