construct:
  name: "S_coelicolor_6enzyme_NPK_operon"
  host: bacillus  # Streptomyces is a Gram-positive bacterium; bacillus is the closest available host profile

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: trc  # trc is a strong constitutive promoter suitable for Streptomyces high-level expression

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: STR_E1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: STR_E2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: STR_E3
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: STR_E4
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        gene:
          id: STR_E5
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6
        expression: high
        fused: false
        gene:
          id: STR_E6
          source: uniprot

    - terminator: rrnB_T1
