construct:
  name: "polyketide_five_gene_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneX
        expression: high
        chain:
          - gene:
              id: GeneX
              source: uniprot
          - tag: Strep-II
          - cleavage_site: TEV
    
    - spacer: 25
    
    - cistron:
        label: GeneY
        expression: high
        fused: false
        gene:
          id: GeneY
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: GeneZ
        expression: medium
        fused: false
        gene:
          id: GeneZ
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: GeneW
        expression: medium
        fused: false
        gene:
          id: GeneW
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: GeneV
        expression: low
        fused: false
        gene:
          id: GeneV
          source: uniprot
    
    - terminator: rrnB_T1
