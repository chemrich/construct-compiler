construct:
  name: "fatty_acid_modification_pathway_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: Fah1
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: Fah1
              source: uniprot

    - spacer: 51
      # P2A self-cleaving peptide (3x STOP-SKIP: GSGATNFSLLKQAGDVEENPGP)

    - cistron:
        label: Fsa2
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: Fsa2
              source: uniprot

    - spacer: 51

    - cistron:
        label: Fdh3
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: Fdh3
              source: uniprot

    - spacer: 51

    - cistron:
        label: Fdh4
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: Fdh4
              source: uniprot

    - spacer: 51

    - cistron:
        label: Fdh5
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: Fdh5
              source: uniprot

    - spacer: 51

    - cistron:
        label: Fdh6
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: Fdh6
              source: uniprot

    - terminator: rrnB_T1
