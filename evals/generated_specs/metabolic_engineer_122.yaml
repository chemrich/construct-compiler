    - spacer: 66  # P2A self-cleaving peptide DNA sequence

    - cistron:
        label: Fdh4
        fused: true
        chain:
          - tag: Myc
          - gene:
              id: Fdh4
              source: uniprot

    - spacer: 66  # P2A self-cleaving peptide DNA sequence

    - cistron:
        label: Fdh5
        fused: true
        chain:
          - tag: Myc
          - gene:
              id: Fdh5
              source: uniprot

    - spacer: 66  # P2A self-cleaving peptide DNA sequence

    - cistron:
        label: Fdh6
        fused: true
        chain:
          - tag: Myc
          - gene:
              id: Fdh6
