construct:
  name: "therapeutic_metabolic_pathway_4enzyme_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Enzyme_M1_GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Enzyme_M1
              source: uniprot

    - spacer: 25  # IRES sequence placeholder; in practice, insert EMCV or CrPV IRES here

    - cistron:
        label: Enzyme_M2
        expression: high
        fused: false
        gene:
          id: Enzyme_M2
          source: uniprot

    - spacer: 25  # IRES sequence placeholder

    - cistron:
        label: Enzyme_M3
        expression: high
        fused: false
        gene:
          id: Enzyme_M3
          source: uniprot

    - spacer: 25  # IRES sequence placeholder

    - cistron:
        label: Enzyme_M4
        expression: high
        fused: false
        gene:
          id: Enzyme_M4
          source: uniprot

    - terminator: rrnB_T1
