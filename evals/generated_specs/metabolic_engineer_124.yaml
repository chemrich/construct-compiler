    - spacer: 30
    - cistron:
        label: ChE4
        expression: high
        fused: false
        gene:
          id: ChE4
          source: uniprot
    - spacer: 30
    - cistron:
        label: ChE5
        expression: high
        fused: false
        gene:
          id: ChE5
          source: uniprot
