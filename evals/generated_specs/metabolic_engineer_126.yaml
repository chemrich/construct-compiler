construct:
  name: "six_gene_amino_acid_synthesis_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: AA1
        expression: very_high
        chain:
          - gene:
              id: AA1
              source: uniprot
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1

    - cistron:
        label: AA2
        expression: very_high
        fused: false
        gene:
          id: AA2
          source: uniprot

    - spacer: 25

    - cistron:
        label: AA3
        expression: very_high
        fused: false
        gene:
          id: AA3
          source: uniprot

    - spacer: 25

    - cistron:
        label: AA4
        expression: very_high
        fused: false
        gene:
          id: AA4
          source: uniprot

    - spacer: 25

    - cistron:
        label: AA5
        expression: very_high
        fused: false
        gene:
          id: AA5
          source: uniprot

    - spacer: 25

    - cistron:
        label: AA6
        expression: very_high
        fused: false
        gene:
          id: AA6
          source: uniprot

    - terminator: rrnB_T1
