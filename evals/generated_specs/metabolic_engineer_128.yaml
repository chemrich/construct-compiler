construct:
  name: "tet_inducible_metabolic_shunt_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: pTet
    - cistron:
        label: shunt_a
        expression: high
        gene:
          id: ShuntA
          source: uniprot
    - spacer: 35
    - cistron:
        label: shunt_b
        expression: medium
        fused: false
        gene:
          id: ShuntB
          source: uniprot
    - spacer: 35
    - cistron:
        label: shunt_c
        expression: low
        fused: false
        gene:
          id: ShuntC
          source: uniprot
    - spacer: 35
    - cistron:
        label: shunt_d
        expression: very_low
        fused: false
        gene:
          id: ShuntD
          source: uniprot
    - terminator: rrnB_T1