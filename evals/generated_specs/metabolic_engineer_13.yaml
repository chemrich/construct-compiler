construct:
  name: "Zymomonas_mobilis_ethanol_5enzyme_cascade"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: enzyme1_dehydrogenase
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: ADH1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2_dehydrogenase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: ADH2
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3_dehydrogenase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: ALDH
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4_dehydrogenase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: PDH
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme5_dehydrogenase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: NADH_oxidase
              source: uniprot

    - terminator: rrnB_T1
