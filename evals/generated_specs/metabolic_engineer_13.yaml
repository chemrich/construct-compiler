construct:
  name: "zymomonas_ethanol_nusA_pathway"
  host: e_coli  # Zymomonas mobilis host substituted with e_coli; suitable for Gram-negative pathway engineering.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: pdc
        expression: high
        chain:
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: P06672
              source: uniprot
    - spacer: 30
    - cistron:
        label: adhB
        expression: high
        fused: false
        chain:
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: P06758
              source: uniprot
    - spacer: 30
    - cistron:
        label: gap
        expression: high
        fused: false
        chain:
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: P26232
              source: uniprot
    - spacer: 30
    - cistron:
        label: pgk
        expression: high
        fused: false
        chain:
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: P41758
              source: uniprot
    - spacer: 30
    - cistron:
        label: pyk
        expression: high
        fused: false
        chain:
          - solubility_tag: NusA
          - cleavage_site: TEV
          - gene:
              id: Q5N8X3
              source: uniprot
    - terminator: rrnB_T1