construct:
  name: "terpenoid_pathway_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T5
    - cistron:
        label: geranyl_synthase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: geranyl_synthase
              source: uniprot
    - spacer: 30
    - cistron:
        label: linalyl_synthase
        expression: high
        fused: false
        gene:
          id: linalyl_synthase
          source: uniprot
    - spacer: 30
    - cistron:
        label: farnesyl_synthase
        expression: high
        fused: false
        gene:
          id: farnesyl_synthase
          source: uniprot
    - spacer: 30
    - cistron:
        label: squalene_synthase
        expression: high
        fused: false
        gene:
          id: squalene_synthase
          source: uniprot
    - spacer: 30
    - cistron:
        label: carotene_synthase
        expression: high
        fused: false
        gene:
          id: carotene_synthase
          source: uniprot
    - spacer: 30
    - cistron:
        label: lycopene_synthase
        expression: high
        fused: false
        chain:
          - gene:
              id: lycopene_synthase
              source: uniprot
          - cleavage_site: 3C
          - tag: FLAG
    - terminator: BBa_B0015