construct:
  name: "drug_metabolism_module_tet_inducible"
  host: HEK293

  backbone:
    catalog_vector: "pTRE3G"
    resistance: puromycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TRE  # Tetracycline Response Element (Doxycycline-inducible)

    - cistron:
        label: DrugMet_1
        expression: high
        chain:
          - gene:
              id: DrugMet_1
              source: uniprot

    - cistron:
        label: P2A_peptide
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - cistron:
        label: DrugMet_2
        expression: high
        fused: false
        chain:
          - gene:
              id: DrugMet_2
              source: uniprot

    - cistron:
        label: P2A_peptide_2
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - cistron:
        label: DrugMet_3
        expression: high
        fused: false
        chain:
          - gene:
              id: DrugMet_3
              source: uniprot

    - cistron:
        label: P2A_peptide_3
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - cistron:
        label: DrugMet_4
        expression: high
        fused: false
        chain:
          - gene:
              id: DrugMet_4
              source: uniprot

    - terminator: SV40polyA
