construct:
  name: signaling_cascade_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: KinaseA
        expression: high
        gene:
          id: KinaseA
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhosphataseB
        expression: medium
        gene:
          id: PhosphataseB
          source: uniprot

    - spacer: 25

    - cistron:
        label: LigaseC
        expression: medium
        gene:
          id: LigaseC
          source: uniprot

    - spacer: 25

    - cistron:
        label: TransferaseD
        expression: medium
        gene:
          id: TransferaseD
          source: uniprot

    - spacer: 25

    - cistron:
        label: HydrolaseE
        expression: low
        gene:
          id: HydrolaseE
          source: uniprot

    - terminator: rrnB_T1
