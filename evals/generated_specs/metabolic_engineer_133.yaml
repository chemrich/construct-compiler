construct:
  name: "S_cerevisiae_PeroX1234_peroxisomal_cassette"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TDH3

    - cistron:
        label: PeroX1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: PeroX1
              source: uniprot
          - c_tag: PTS1

    - spacer: 25

    - cistron:
        label: P2A_PeroX2
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroX2
              source: uniprot
          - c_tag: PTS1

    - spacer: 25

    - cistron:
        label: P2A_PeroX3
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroX3
              source: uniprot
          - c_tag: PTS1

    - spacer: 25

    - cistron:
        label: P2A_PeroX4
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroX4
              source: uniprot
          - c_tag: PTS1

    - terminator: rrnB_T1
