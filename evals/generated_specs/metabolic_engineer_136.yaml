construct:
  name: "Met_pathway_5enzyme_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MetA
        expression: high
        chain:
          - gene:
              id: MetA
              source: uniprot
          - tag: Strep-II

    - spacer: 30

    - cistron:
        label: 2A_peptide
        expression: high
        fused: false
        gene:
          id: T2A
          source: uniprot

    - spacer: 30

    - cistron:
        label: MetB
        expression: high
        chain:
          - gene:
              id: MetB
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1

  cassette_2:
    - promoter: CUP1

    - cistron:
        label: MetC
        expression: medium
        chain:
          - gene:
              id: MetC
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1

  cassette_3:
    - promoter: CUP1

    - cistron:
        label: MetD
        expression: medium
        chain:
          - gene:
              id: MetD
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1

  cassette_4:
    - promoter: CUP1

    - cistron:
        label: MetE
        expression: medium
        chain:
          - gene:
              id: MetE
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1
