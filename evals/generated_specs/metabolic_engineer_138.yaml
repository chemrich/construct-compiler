construct:
  name: liver_specific_quad_enzyme_therapy
  host: mammalian
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ALB
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: Enz_Hep1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: Enz_Hep2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: Enz_Hep3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: low
        fused: false
        gene:
          id: Enz_Hep4
          source: uniprot
    - terminator: bGH_PA