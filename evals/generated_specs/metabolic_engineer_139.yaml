construct:
  name: "IPTG_inducible_four_enzyme_pathway"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - terminator: rrnB_T1
      # Upstream terminator to prevent leaky transcription from upstream elements

    - promoter: T7lac
      # IPTG-inducible promoter for tight control

    - cistron:
        label: PathA_1
        expression: high
        chain:
          - gene:
              id: PathA_1
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: PathA_2
        expression: high
        fused: false
        chain:
          - gene:
              id: PathA_2
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: PathA_3
        expression: high
        fused: false
        chain:
          - gene:
              id: PathA_3
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: PathA_4
        expression: high
        fused: false
        chain:
          - gene:
              id: PathA_4
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
