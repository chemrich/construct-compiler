construct:
  name: "IPTG_inducible_four_enzyme_pathway"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_A
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_A
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_B
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_B
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_C
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_C
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_D
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_D
              source: uniprot
    
    - terminator: rrnB_T1
