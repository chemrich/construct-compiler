construct:
  name: fatty_acid_synthesis_operon
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: E1_Synthase
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: E1_Synthase
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E2_Hydrolase
        expression: high
        fused: false
        gene:
          id: E2_Hydrolase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E3_Isomerase
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: E3_Isomerase
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E4_Kinase
        expression: high
        fused: false
        gene:
          id: E4_Kinase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E5_Reductase
        expression: high
        fused: false
        gene:
          id: E5_Reductase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E6_Ligase
        expression: high
        fused: false
        chain:
          - gene:
              id: E6_Ligase
              source: uniprot
          - tag: FLAG
    
    - terminator: rrnB_T1
