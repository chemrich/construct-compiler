construct:
  name: "xyl_operon_with_xylD_degron"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: XylA
        expression: high
        gene:
          id: XylA
          source: uniprot
    - spacer: 30
    - cistron:
        label: XylB
        expression: high
        fused: false
        gene:
          id: XylB
          source: uniprot
    - spacer: 30
    - cistron:
        label: XylC
        expression: high
        fused: false
        gene:
          id: XylC
          source: uniprot
    - spacer: 30
    - cistron:
        label: XylD
        expression: high
        fused: false
        chain:
          - gene:
              id: XylD
              source: uniprot
          - tag: LVA
    - terminator: rrnB_T1