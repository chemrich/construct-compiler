          id: XylA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: XylB
        expression: high
        fused: false
        gene:
          id: XylB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: XylC
        expression: high
        fused: false
        gene:
          id: XylC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: XylD
        expression: high
        fused: false
        chain:
          - gene:
              id: XylD
              source: uniprot
          - tag: LVA
    
    - terminator: rrnB_T1
