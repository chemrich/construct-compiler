construct:
  name: "central_metabolic_operon_EnzA_EnzB_EnzC_EnzD"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzA
        expression: high
        rbs_strength: strong
        gene:
          id: EnzA
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzB
        expression: medium
        rbs_strength: weak
        fused: false
        gene:
          id: EnzB
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzC
        expression: medium
        rbs_strength: weak
        fused: false
        gene:
          id: EnzC
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzD
        expression: very_high
        rbs_strength: very_strong
        fused: false
        gene:
          id: EnzD
          source: uniprot

    - terminator: rrnB_T1
