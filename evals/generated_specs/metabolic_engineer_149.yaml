construct:
  name: "periplasmic_metabolic_operon_m1_m5"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_m1
        expression: high
        chain:
          - tag: pelB  # Signal peptide for periplasmic secretion in E. coli
          - gene:
              id: M1
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_m2
        expression: high
        fused: false
        gene:
          id: M2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_m3
        expression: high
        fused: false
        gene:
          id: M3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_m4
        expression: high
        fused: false
        gene:
          id: M4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_m5
        expression: high
        fused: false
        gene:
          id: M5
          source: uniprot
    - terminator: T7term