construct:
  name: "five_enzyme_periplasmic_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: M1
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: M1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M2
        expression: high
        fused: false
        gene:
          id: M2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M3
        expression: high
        fused: false
        gene:
          id: M3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M4
        expression: high
        fused: false
        gene:
          id: M4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M5
        expression: high
        fused: false
        gene:
          id: M5
          source: uniprot
    
    - terminator: rrnB_T1
