construct:
  name: carotenoid_biosynthesis_operon_pichia
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: GGPP_synthase
        expression: very_high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - gene:
              id: GGPP_synthase
              source: uniprot

    - spacer: 30

    - cistron:
        label: phytoene_synthase
        expression: high
        fused: false
        chain:
          - gene:
              id: phytoene_synthase
              source: uniprot

    - spacer: 30

    - cistron:
        label: phytoene_desaturase
        expression: high
        fused: false
        chain:
          - gene:
              id: phytoene_desaturase
              source: uniprot

    - spacer: 30

    - cistron:
        label: zeta_carotene_desaturase
        expression: high
        fused: false
        chain:
          - gene:
              id: zeta_carotene_desaturase
              source: uniprot

    - spacer: 30

    - cistron:
        label: carotenoid_isomerase
        expression: high
        fused: false
        chain:
          - gene:
              id: carotenoid_isomerase
              source: uniprot

    - terminator: CYC1_terminator
