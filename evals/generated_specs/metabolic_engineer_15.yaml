construct:
  name: "carotenoid_biosynthesis_operon_pichia"
  host: yeast  # Komagataella phaffii (Pichia pastoris)
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1  # Strong methanol-inducible promoter for Pichia
    - cistron:
        label: crtE_GGPP_synthase
        expression: high
        gene:
          id: P22849
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtB_phytoene_synthase
        expression: medium  # Set to medium to maintain 2:1 ratio with crtE
        fused: false  # Independent translation unit for polycistronic mRNA
        gene:
          id: P22851
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtI_phytoene_desaturase
        expression: medium
        fused: false
        gene:
          id: P22852
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtY_lycopene_cyclase
        expression: medium
        fused: false
        gene:
          id: P22853
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtZ_beta_carotene_hydroxylase
        expression: medium
        fused: false
        gene:
          id: P22854
          source: uniprot
    - terminator: AOX1_TT # Standard AOX1 transcription terminator