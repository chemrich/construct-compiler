construct:
  name: "bacillus_subtilis_biosynthetic_operon"
  host: e_coli  # Bacillus subtilis not in supported host list; substituting e_coli with Gram-positive compatible elements
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_veg  # Standard constitutive promoter for Bacillus subtilis
    - cistron:
        label: enzyme_alpha
        expression: high
        gene:
          id: Enzyme_alpha
    - spacer: 30
    - cistron:
        label: enzyme_beta
        expression: high
        fused: false
        gene:
          id: Enzyme_beta
    - spacer: 30
    - cistron:
        label: enzyme_gamma
        expression: high
        fused: false
        gene:
          id: Enzyme_gamma
    - spacer: 30
    - cistron:
        label: enzyme_delta
        expression: high
        fused: false
        gene:
          id: Enzyme_delta
    - terminator: rrnB_T1