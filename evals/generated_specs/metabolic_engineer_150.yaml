construct:
  name: "biosynthetic_pathway_operon_four_enzymes"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Enzyme_alpha
        expression: high
        chain:
          - gene:
              id: Enzyme_alpha
              source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme_beta
        expression: high
        fused: false
        gene:
          id: Enzyme_beta
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme_gamma
        expression: high
        fused: false
        gene:
          id: Enzyme_gamma
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enzyme_delta
        expression: high
        fused: false
        gene:
          id: Enzyme_delta
          source: uniprot

    - terminator: rrnB_T1
