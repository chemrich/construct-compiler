construct:
  name: "six_enzyme_operon_complex_precursor"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Ealpha
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Ealpha
              source: uniprot

    - spacer: 25

    - cistron:
        label: Ebeta
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Ebeta
              source: uniprot

    - spacer: 25

    - cistron:
        label: Egamma
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Egamma
              source: uniprot

    - spacer: 25

    - cistron:
        label: Edelta
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Edelta
              source: uniprot

    - spacer: 25

    - cistron:
        label: Epsilon
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Epsilon
              source: uniprot

    - spacer: 25

    - cistron:
        label: Ezeta
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Ezeta
              source: uniprot

    - terminator: rrnB_T1
    - terminator: T7term
