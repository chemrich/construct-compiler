construct:
  name: "detoxification_operon_E_cat1_to_E_cat5"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: E_cat1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E_cat1_codon_optimized
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_cat2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E_cat2_codon_optimized
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_cat3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E_cat3_codon_optimized
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_cat4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E_cat4_codon_optimized
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_cat5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E_cat5_codon_optimized
              source: uniprot

    - terminator: rrnB_T1
