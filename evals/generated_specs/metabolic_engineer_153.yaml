construct:
  name: four_enzyme_operon_with_tev_cleavage
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: E_start
        expression: high
        gene:
          id: E_start
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: E_mid1
        expression: high
        fused: false
        gene:
          id: E_mid1
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: E_mid2_and_E_end
        expression: high
        chain:
          - gene:
              id: E_mid2
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: E_end
              source: uniprot
    
    - terminator: rrnB_T1
