construct:
  name: "six_enzyme_operon_chassis"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: C1
        expression: very_high
        chain:
          - tag: 6xHis
          - gene:
              id: C1
              source: uniprot

    - spacer: 25

    - cistron:
        label: C2
        expression: very_high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: C2
              source: uniprot

    - spacer: 25

    - cistron:
        label: C3
        expression: very_high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: C3
              source: uniprot

    - spacer: 25

    - cistron:
        label: C4
        expression: very_high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: C4
              source: uniprot

    - spacer: 25

    - cistron:
        label: C5
        expression: very_high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: C5
              source: uniprot

    - spacer: 25

    - cistron:
        label: C6
        expression: very_high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: C6
              source: uniprot

    - terminator: rrnB_T1
