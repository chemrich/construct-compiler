construct:
  name: "five_enzyme_pathway_gradient"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enz_A
        expression: high
        gene:
          id: Enz_A
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz_B
        expression: high
        fused: false
        gene:
          id: Enz_B
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz_C
        expression: medium
        fused: false
        gene:
          id: Enz_C
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz_D
        expression: medium
        fused: false
        gene:
          id: Enz_D
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz_E
        expression: low
        fused: false
        gene:
          id: Enz_E
          source: uniprot
    
    - terminator: rrnB_T1
