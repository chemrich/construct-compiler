          id: P0A6Q3
          source: uniprot
    - spacer: 30
    - cistron:
        label: pta
        expression: medium
        fused: false
        gene:
          id: P0A9M8
          source: uniprot
    - spacer: 30
    - cistron:
        label: ackA
        expression: medium
        fused: false
        gene:
          id: P0AAD6
          source: uniprot
    - spacer: 30
    - cistron:
        label: dnaK
        expression: medium
        fused: false
        gene:
          id: P0A6Y8
          source: uniprot
    - spacer: 30
    - cistron:
        label: grpE
        expression: medium
        fused: false
        gene:
          id: P0AGB1
          source: uniprot
    - terminator: BBa_B0015  # Reliable double terminator for bacterial hosts