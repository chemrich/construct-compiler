construct:
  name: "methionine_salvage_operon_MetA_to_MetF"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter for balanced, sustained expression
    
    - cistron:
        label: MetA
        expression: high
        gene:
          id: metA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: MetB
        expression: high
        fused: false
        gene:
          id: metB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: MetC
        expression: medium
        fused: false
        gene:
          id: metC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: MetD
        expression: medium
        fused: false
        gene:
          id: metD
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: MetE
        expression: high
        fused: false
        gene:
          id: metE
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: MetF
        expression: medium
        fused: false
        gene:
          id: metF
          source: uniprot
    
    - terminator: rrnB_T1
