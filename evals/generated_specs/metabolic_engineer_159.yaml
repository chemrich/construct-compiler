construct:
  name: "carotenoid_synthesis_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: CarotenoidSynthase
        expression: high
        chain:
          - tag: GST
          - gene:
              id: CarotenoidSynthase
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: CarotenoidDesaturase
        expression: high
        fused: false
        gene:
          id: CarotenoidDesaturase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: CarotenoidHydroxylase
        expression: high
        fused: false
        gene:
          id: CarotenoidHydroxylase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: CarotenoidKetolase
        expression: high
        fused: false
        gene:
          id: CarotenoidKetolase
          source: uniprot
    
    - terminator: rrnB_T1
