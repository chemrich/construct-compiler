```yaml
construct:
  name: clostridium_solvent_production_operon
  host: bacillus  # closest available host for Clostridium

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # butyrate-inducible system not in schema, using araBAD as tightly controlled alternative

    - cistron:
        label: acetyl_coa_acetyltransferase
        expression: medium
        gene:
          id: P23672  # thlA from C. acetobutylicum
          source: uniprot

    - spacer: 25

    - cistron:
        label: 3_hydroxybutyryl_coa_dehydrogenase
        expression: medium
        fused: false
        gene:
          id: P23673  # hbd from C. acetobutylicum
          source: uniprot

    - spacer: 25

    - cistron:
        label: crotonase
        expression: medium
        fused: false
        gene:
          id: P23674  # crt from C. acetobutylicum
          source: uniprot

    - spacer: 25

    - cistron:
        label: butyryl_coa_dehydrogenase
        expression: medium
        fused: false
        gene:
          id: Q97II0  # bcd from C. acetobutylicum
          source: uniprot

    - spacer: 25

    - cistron:
        label: acetoacetyl_coa_transferase
        expression: medium
        fused: false
        gene:
          id: P23675  # ctfA from C. acetobutylicum
          source: uniprot

    - spacer: 25

    - cistron:
        label: acetoacetate_decarboxylase
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: P23676  # adc from C. acetobutylicum
              source: uniprot

    - terminator: rrnB_T1
```