construct:
  name: "clostridium_solvent_production_operon"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD used as proxy for butyrate-inducible regulation in Clostridium
      # Note: Native Clostridium promoters (e.g., adhE-type) may be substituted
      # araBAD provides tight, titratable control suitable for metabolic pathway engineering

    - cistron:
        label: enzyme_1
        expression: medium
        gene:
          id: thlA
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: medium
        gene:
          id: ctfA
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        gene:
          id: ctfB
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: medium
        gene:
          id: adhE
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: medium
        gene:
          id: adhB
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: bdhB
              source: uniprot

    - terminator: rrnB_T1
