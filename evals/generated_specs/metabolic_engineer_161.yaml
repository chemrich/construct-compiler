construct:
  name: tunable_arabinose_enzyme_cascade_E5_E9_GFP
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: E5
        expression: high
        gene:
          id: E5
          source: uniprot

    - spacer: 25

    - cistron:
        label: E6
        expression: high
        gene:
          id: E6
          source: uniprot

    - spacer: 25

    - cistron:
        label: E7
        expression: medium
        gene:
          id: E7
          source: uniprot

    - spacer: 25

    - cistron:
        label: E8
        expression: medium
        gene:
          id: E8
          source: uniprot

    - spacer: 25

    - cistron:
        label: E9_GFP_fusion
        expression: low
        chain:
          - gene:
              id: E9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
