construct:
  name: "industrial_enzyme_operon_A_B_C_D_E_F"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter for industrial-scale expression
    
    - cistron:
        label: enzyme_A
        expression: high
        fused: false
        gene:
          id: enzyme_A
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: enzyme_B
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP  # N-terminal MBP to prevent aggregation
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme_C
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_D
        expression: high
        fused: false
        gene:
          id: enzyme_D
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_E
        expression: high
        fused: false
        gene:
          id: enzyme_E
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_F
        expression: high
        fused: false
        gene:
          id: enzyme_F
          source: uniprot
    
    - terminator: rrnB_T1
