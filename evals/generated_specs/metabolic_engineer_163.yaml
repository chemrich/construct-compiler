construct:
  name: "atc_inducible_low_copy_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
  cassette:
    - promoter: Ptet
    - cistron:
        label: enzyme_P1
        expression: low
        chain:
          - gene:
              id: P1
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_P2
        expression: low
        fused: false
        chain:
          - gene:
              id: P2
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_P3
        expression: low
        fused: false
        chain:
          - gene:
              id: P3
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_P4
        expression: low
        fused: false
        chain:
          - gene:
              id: P4
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1