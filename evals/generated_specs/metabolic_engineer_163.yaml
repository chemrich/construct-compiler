construct:
  name: "aTc_inducible_P1P2P3P4_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: tetR_pTet
      # aTc-inducible promoter, tightly repressed without inducer

    - cistron:
        label: P1
        expression: high
        chain:
          - gene:
              id: P1
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: P2
        expression: high
        fused: false
        chain:
          - gene:
              id: P2
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: P3
        expression: high
        fused: false
        chain:
          - gene:
              id: P3
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: P4
        expression: high
        fused: false
        chain:
          - gene:
              id: P4
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
