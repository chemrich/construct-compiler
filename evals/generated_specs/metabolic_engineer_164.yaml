          - gene:
              id: P00909
              source: uniprot
    - spacer: 30
    - cistron:
        label: enz4
        expression: low
        fused: false
        gene:
          id: P00933
          source: uniprot
    - spacer: 30
    - cistron:
        label: enz5
        expression: very_low
        fused: false
        gene:
          id: P00929
          source: uniprot
    - terminator: T7term