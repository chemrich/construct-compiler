construct:
  name: "five_enzyme_metabolic_cascade"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enz1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Enz1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz2
        expression: high
        fused: false
        chain:
          - gene:
              id: Enz2
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz3
        expression: medium
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: Enz3
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz4
        expression: medium
        fused: false
        chain:
          - gene:
              id: Enz4
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enz5
        expression: low
        fused: false
        chain:
          - gene:
              id: Enz5
              source: uniprot
    
    - terminator: rrnB_T1
