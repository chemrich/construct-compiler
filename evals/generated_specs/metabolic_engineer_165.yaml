construct:
  name: "BacE1_4_pathway_Bacillus_subtilis"
  host: b_subtilis
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: BacE1
        expression: medium
        gene:
          id: BacE1
          source: uniprot

    - spacer: 30

    - cistron:
        label: BacE2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: BacE2
              source: uniprot

    - spacer: 30

    - cistron:
        label: BacE3
        expression: medium
        fused: false
        gene:
          id: BacE3
          source: uniprot

    - spacer: 30

    - cistron:
        label: BacE4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: BacE4
              source: uniprot

    - terminator: rrnB_T1