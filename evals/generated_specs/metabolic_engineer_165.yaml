construct:
  name: "bacillus_4enzyme_xylose_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: xylA

    - cistron:
        label: BacE1
        expression: high
        gene:
          id: BacE1
          source: uniprot

    - spacer: 30

    - cistron:
        label: BacE2
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: BacE2
              source: uniprot

    - spacer: 30

    - cistron:
        label: BacE3
        expression: high
        gene:
          id: BacE3
          source: uniprot

    - spacer: 30

    - cistron:
        label: BacE4
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: BacE4
              source: uniprot

    - terminator: rrnB_T1
