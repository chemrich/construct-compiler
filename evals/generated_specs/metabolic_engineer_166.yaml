construct:
  name: "E_coli_stress_response_pathway_operon"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: grpE  # Heat-shock inducible promoter

    - cistron:
        label: S1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S1
              source: uniprot

    - spacer: 25

    - cistron:
        label: S2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: S2
              source: uniprot

    - spacer: 25

    - cistron:
        label: S3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: S3
              source: uniprot

    - spacer: 25

    - cistron:
        label: S4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: S4
              source: uniprot

    - spacer: 25

    - cistron:
        label: S5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: S5
              source: uniprot

    - spacer: 25

    - cistron:
        label: S6
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: S6
              source: uniprot

    - terminator: rrnB_T1
