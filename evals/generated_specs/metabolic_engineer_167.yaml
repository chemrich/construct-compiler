construct:
  name: "anaerobic_pathway_operon_AnE1_to_AnE5"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: focA  # Anaerobic promoter (P_focA) for tight anaerobic control

    - cistron:
        label: AnE1
        expression: high
        gene:
          id: AnE1
          source: uniprot

    - spacer: 30

    - cistron:
        label: AnE2
        expression: high
        fused: false
        gene:
          id: AnE2
          source: uniprot

    - spacer: 30

    - cistron:
        label: AnE3
        expression: high
        fused: false
        gene:
          id: AnE3
          source: uniprot

    - spacer: 30

    - cistron:
        label: AnE4
        expression: high
        fused: false
        gene:
          id: AnE4
          source: uniprot

    - spacer: 30

    - cistron:
        label: AnE5
        expression: high
        fused: false
        gene:
          id: AnE5
          source: uniprot

    - terminator: rrnB_T1
