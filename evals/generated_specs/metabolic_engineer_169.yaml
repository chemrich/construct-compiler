construct:
  name: "PreE_quad_operon_balanced_expression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: tac

    - cistron:
        label: PreE1
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PreE1_eco_opt
              source: uniprot

    - spacer: 25

    - cistron:
        label: PreE2
        expression: medium
        fused: false
        gene:
          id: PreE2_eco_opt
          source: uniprot

    - spacer: 25

    - cistron:
        label: PreE3
        expression: medium
        fused: false
        gene:
          id: PreE3_eco_opt
          source: uniprot

    - spacer: 25

    - cistron:
        label: PreE4
        expression: medium
        fused: false
        gene:
          id: PreE4_eco_opt
          source: uniprot

    - terminator: rrnB_T1
