construct:
  name: "toxic_pathway_rhamnose_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is rhamnose-inducible; using as tight inducible system for toxic pathway

    - cistron:
        label: ToxE1
        expression: low
        chain:
          - gene:
              id: ToxE1
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE2
        expression: low
        fused: false
        gene:
          id: ToxE2
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE3
        expression: low
        fused: false
        gene:
          id: ToxE3
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE4
        expression: low
        fused: false
        gene:
          id: ToxE4
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE5
        expression: low
        fused: false
        chain:
          - gene:
              id: ToxE5
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
