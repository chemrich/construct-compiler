construct:
  name: "cofactor_regeneration_operon_4enzyme"
  host: e_coli_bl21_de3

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: formate_dehydrogenase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: glucose_6_phosphate_dehydrogenase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: phosphite_dehydrogenase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: alcohol_dehydrogenase
              source: uniprot

    - terminator: rrnB_T1
