construct:
  name: "VisE_operon_GFP_monitor"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: VisE1
        expression: high
        gene:
          id: VisE1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: VisE2
        expression: high
        gene:
          id: VisE2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: VisE3_GFP
        expression: high
        chain:
          - gene:
              id: VisE3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GFP
    
    - spacer: 25
    
    - cistron:
        label: VisE4
        expression: high
        gene:
          id: VisE4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: VisE5
        expression: high
        gene:
          id: VisE5
          source: uniprot
    
    - terminator: rrnB_T1
