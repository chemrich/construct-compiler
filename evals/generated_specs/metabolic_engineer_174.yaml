          id: PPIE3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: PPIE4
        expression: medium
        fused: false
        gene:
          id: PPIE4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: PPIE5
        expression: medium
        fused: false
        chain:
          - gene:
              id: PPIE5
              source: uniprot
