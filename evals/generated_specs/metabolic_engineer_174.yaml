construct:
  name: "ppi_metabolic_module_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: ppi_e1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: PPIE1
              source: uniprot
    - spacer: 30
    - cistron:
        label: ppi_e2
        expression: medium
        fused: false
        gene:
          id: PPIE2
          source: uniprot
    - spacer: 30
    - cistron:
        label: ppi_e3
        expression: medium
        fused: false
        gene:
          id: PPIE3
          source: uniprot
    - spacer: 30
    - cistron:
        label: ppi_e4
        expression: medium
        fused: false
        gene:
          id: PPIE4
          source: uniprot
    - spacer: 30
    - cistron:
        label: ppi_e5
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: PPIE5
              source: uniprot
    - terminator: rrnB_T1