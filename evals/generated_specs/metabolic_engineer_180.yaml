construct:
  name: "terpene_synthesis_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # Strong, constitutive bacterial promoter

    - cistron:
        label: GPPS
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GPPS
              source: uniprot

    - spacer: 25

    - cistron:
        label: FPPS
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: FPPS
              source: uniprot

    - spacer: 25

    - cistron:
        label: SQS
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: SQS
              source: uniprot

    - spacer: 25

    - cistron:
        label: SQE
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: SQE
              source: uniprot

    - terminator: rrnB_T1
