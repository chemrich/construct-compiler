construct:
  name: "carotenoid_pathway_inducible_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - gene:
              id: carotenoid_synthase_A
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: medium
        fused: false
        chain:
          - gene:
              id: carotenoid_synthase_B
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_C
        expression: medium
        fused: false
        chain:
          - gene:
              id: carotenoid_synthase_C
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_D
        expression: medium
        fused: false
        chain:
          - gene:
              id: carotenoid_synthase_D
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_E
        expression: medium
        fused: false
        chain:
          - gene:
              id: carotenoid_synthase_E
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
