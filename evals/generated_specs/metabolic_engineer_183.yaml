construct:
  name: "bacillus_subtilis_exopolysaccharide_operon"
  host: b_subtilis
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pveg  # Strong constitutive promoter for Bacillus subtilis
    - cistron:
        label: hydrolase_1
        expression: high
        fused: false
        chain:
          - tag: amyE_signal
          - gene:
              id: Hydrolase1
              source: uniprot
    - spacer: 30
    - cistron:
        label: reductase_2
        expression: high
        fused: false
        chain:
          - tag: amyE_signal
          - gene:
              id: Reductase2
              source: uniprot
    - spacer: 30
    - cistron:
        label: transferase_3
        expression: high
        fused: false
        chain:
          - tag: amyE_signal
          - gene:
              id: Transferase3
              source: uniprot
    - spacer: 30
    - cistron:
        label: kinase_4
        expression: high
        fused: false
        chain:
          - tag: amyE_signal
          - gene:
              id: Kinase4
              source: uniprot
    - terminator: rrnB_T1