construct:
  name: "Bacillus_exopolysaccharide_operon"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PsrfA  # Strong, constitutive B. subtilis promoter

    - cistron:
        label: Hydrolase1
        expression: high
        chain:
          - secretion_signal: AmyE  # Bacillus amylase signal peptide for extracellular secretion
          - gene:
              id: Hydrolase1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Reductase2
        expression: high
        fused: false
        chain:
          - secretion_signal: AmyE
          - gene:
              id: Reductase2
              source: uniprot

    - spacer: 25

    - cistron:
        label: Transferase3
        expression: medium
        fused: false
        chain:
          - secretion_signal: AmyE
          - gene:
              id: Transferase3
              source: uniprot

    - spacer: 25

    - cistron:
        label: Kinase4
        expression: medium
        fused: false
        chain:
          - secretion_signal: AmyE
          - gene:
              id: Kinase4
              source: uniprot

    - terminator: rrnB_T1
