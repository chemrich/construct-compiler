construct:
  name: "HEK293_metabolic_pathway_five_enzymes"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: SynthaseX
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SynthaseX
              source: uniprot

    - spacer: 25

    - cistron:
        label: DehydrogenaseY
        expression: high
        fused: false
        chain:
          - gene:
              id: DehydrogenaseY
              source: uniprot

    - spacer: 25

    - cistron:
        label: IsomeraseZ
        expression: high
        fused: false
        chain:
          - gene:
              id: IsomeraseZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: LigaseW
        expression: high
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: LigaseW
              source: uniprot

    - spacer: 25

    - cistron:
        label: PhosphataseV
        expression: high
        fused: false
        chain:
          - gene:
              id: PhosphataseV
              source: uniprot

    - terminator: rrnB_T1
