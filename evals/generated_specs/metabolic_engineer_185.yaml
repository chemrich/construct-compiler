construct:
  name: "four_enzyme_pathway_araBAD_MBP_EnzB"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: EnzA
        expression: medium
        chain:
          - gene:
              id: EnzA
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: EnzB
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: EnzB
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: EnzC
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzC
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: EnzD
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzD
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
