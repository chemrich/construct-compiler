construct:
  name: "Pichia_pastoris_FAS_pathway_AOX1"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS4
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: FAS1
        expression: high
        gene:
          id: FAS1
          source: uniprot
          codon_optimization: pichia_pastoris

    - spacer: 25

    - cistron:
        label: FAS2
        expression: high
        fused: false
        gene:
          id: FAS2
          source: uniprot
          codon_optimization: pichia_pastoris

    - spacer: 25

    - cistron:
        label: FAS3
        expression: high
        fused: false
        gene:
          id: FAS3
          source: uniprot
          codon_optimization: pichia_pastoris

    - spacer: 25

    - cistron:
        label: FAS4
        expression: medium
        fused: false
        gene:
          id: FAS4
          source: uniprot
          codon_optimization: pichia_pastoris

    - spacer: 25

    - cistron:
        label: FAS5
        expression: medium
        fused: false
        gene:
          id: FAS5
          source: uniprot
          codon_optimization: pichia_pastoris

    - spacer: 25

    - cistron:
        label: FAS6
        expression: medium
        fused: false
        chain:
          - gene:
              id: FAS6
              source: uniprot
              codon_optimization: pichia_pastoris
          - tag: FLAG

    - terminator: rrnB_T1
