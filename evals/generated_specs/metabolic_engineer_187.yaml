construct:
  name: "Synechocystis_phycobilin_assembly_system"
  host: cyanobacteria

  backbone:
    resistance: spectinomycin
    ori: pSC101
    source: addgene

  cassette:
    - promoter: Pcpc560  # Light-inducible promoter for cyanobacteria

    - cistron:
        label: PhycocyaninLyaseA
        expression: medium
        chain:
          - tag: thylakoid_transit_peptide_A
          - gene:
              id: PhycocyaninLyaseA
              source: uniprot

    - spacer: 25

    - cistron:
        label: PhycocyaninLyaseB
        expression: medium
        fused: false
        chain:
          - tag: thylakoid_transit_peptide_B
          - gene:
              id: PhycocyaninLyaseB
              source: uniprot

    - spacer: 25

    - cistron:
        label: PhycocyaninLyaseC
        expression: medium
        fused: false
        chain:
          - tag: thylakoid_transit_peptide_C
          - gene:
              id: PhycocyaninLyaseC
              source: uniprot

    - spacer: 25

    - cistron:
        label: PhycocyaninLyaseD
        expression: medium
        fused: false
        chain:
          - tag: thylakoid_transit_peptide_D
          - gene:
              id: PhycocyaninLyaseD
              source: uniprot

    - terminator: cyanobacterial_terminator
