construct:
  name: "phycocyanin_lyase_operon_synechocystis"
  host: algae  # Synechocystis PCC 6803 is a photosynthetic cyanobacterium, categorized under algae in this schema
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: psbA2  # Standard light-inducible promoter in Synechocystis PCC 6803
    - cistron:
        label: lyase_a
        expression: medium
        chain:
          - tag: Thylakoid_Signal
          - gene:
              id: PhycocyaninLyaseA
              source: uniprot
    - spacer: 30
    - cistron:
        label: lyase_b
        expression: medium
        fused: false
        chain:
          - tag: Thylakoid_Signal
          - gene:
              id: PhycocyaninLyaseB
              source: uniprot
    - spacer: 30
    - cistron:
        label: lyase_c
        expression: medium
        fused: false
        chain:
          - tag: Thylakoid_Signal
          - gene:
              id: PhycocyaninLyaseC
              source: uniprot
    - spacer: 30
    - cistron:
        label: lyase_d
        expression: medium
        fused: false
        chain:
          - tag: Thylakoid_Signal
          - gene:
              id: PhycocyaninLyaseD
              source: uniprot
    - terminator: rrnB_T1