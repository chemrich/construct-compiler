construct:
  name: "tight_five_enzyme_pathway_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides tight repression with minimal leakage; expression is dose-dependent on L-arabinose

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: Enzyme_T1
              source: uniprot
          - c_tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - gene:
              id: Enzyme_T2
              source: uniprot
          - c_tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - gene:
              id: Enzyme_T3
              source: uniprot
          - c_tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - gene:
              id: Enzyme_T4
              source: uniprot
          - c_tag: LVA

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - gene:
              id: Enzyme_T5
              source: uniprot
          - c_tag: LVA

    - terminator: rrnB_T1
