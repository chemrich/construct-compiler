construct:
  name: "e_coli_biosensor_five_cistron"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: SensorKinase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: SensorKinase
              source: uniprot

    - spacer: 25

    - cistron:
        label: Phosphatase
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Phosphatase
              source: uniprot

    - spacer: 25

    - cistron:
        label: ResponseRegulator
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ResponseRegulator
              source: uniprot

    - terminator: rrnB_T1

    # Reporter cassette: GFP controlled by response regulator output
    - promoter: lacUV5
      # Note: In practice, this promoter would be activated by the response regulator via operator sites upstream

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
