construct:
  name: "vibrio_natriegens_constitutive_6enz_operon"
  host: e_coli  # Vibrio natriegens is compatible with E. coli parts; substituted for tool compatibility.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: "enzyme_1"
        expression: high
        chain:
          - tag: Twin-Strep
          - gene:
              id: pathway_enz1
              source: uniprot
    - spacer: 30
    - cistron:
        label: "enzyme_2"
        expression: high
        fused: false
        gene:
          id: pathway_enz2
          source: uniprot
    - spacer: 30
    - cistron:
        label: "enzyme_3"
        expression: high
        fused: false
        gene:
          id: pathway_enz3
          source: uniprot
    - spacer: 30
    - cistron:
        label: "enzyme_4"
        expression: high
        fused: false
        gene:
          id: pathway_enz4
          source: uniprot
    - spacer: 30
    - cistron:
        label: "enzyme_5"
        expression: high
        fused: false
        gene:
          id: pathway_enz5
          source: uniprot
    - spacer: 30
    - cistron:
        label: "enzyme_6"
        expression: high
        fused: false
        gene:
          id: pathway_enz6
          source: uniprot
    - terminator: rrnB_T1