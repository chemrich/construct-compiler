construct:
  name: "Vibrio_natriegens_6enzyme_biosynthetic_operon"
  host: vibrio_natriegens

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides strong, constitutive expression in V. natriegens
      # Addition of arabinose can further boost expression if needed

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: Twin-Strep
          - gene:
              id: enzyme1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        gene:
          id: enzyme2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        gene:
          id: enzyme3
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        gene:
          id: enzyme4
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme5
        expression: high
        fused: false
        gene:
          id: enzyme5
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme6
        expression: high
        fused: false
        gene:
          id: enzyme6
          source: uniprot

    - terminator: rrnB_T1
