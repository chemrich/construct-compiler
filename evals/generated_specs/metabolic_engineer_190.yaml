construct:
  name: "synthetic_metabolic_bypass_glycolase_ABCD"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR  # aTc-inducible (anhydrotetracycline-responsive) promoter

    - cistron:
        label: Glycolase_A
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Glycolase_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: Glycolase_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Glycolase_B
              source: uniprot

    - spacer: 25

    - cistron:
        label: Glycolase_C
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Glycolase_C
              source: uniprot

    - spacer: 25

    - cistron:
        label: Glycolase_D
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Glycolase_D
              source: uniprot

    - terminator: rrnB_T1
