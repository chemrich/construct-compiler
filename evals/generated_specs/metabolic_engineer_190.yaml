construct:
  name: "synthetic_metabolic_bypass_atc_inducible"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Ptet  # anhydrotetracycline (aTc) inducible promoter
    - cistron:
        label: glycolase_a
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Glycolase_A
              source: uniprot
    - spacer: 30
    - cistron:
        label: glycolase_b
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Glycolase_B
              source: uniprot
    - spacer: 30
    - cistron:
        label: glycolase_c
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Glycolase_C
              source: uniprot
    - spacer: 30
    - cistron:
        label: glycolase_d
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Glycolase_D
              source: uniprot
    - terminator: rrnB_T1