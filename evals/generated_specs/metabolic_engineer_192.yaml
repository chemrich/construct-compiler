construct:
  name: "P_putida_lignin_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: Pp_araBAD

    - cistron:
        label: Ligninase1
        expression: high
        chain:
          - gene:
              id: Ligninase1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: Ligninase2
        expression: high
        fused: false
        chain:
          - gene:
              id: Ligninase2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 25

