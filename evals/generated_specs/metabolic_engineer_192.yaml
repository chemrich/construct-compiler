construct:
  name: "lignin_degradation_operon_pputida"
  host: e_coli  # Pseudomonas putida not in schema; substituted with e_coli as J23100 is active in most Gram-negative bacteria
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: "ligninase_1"
        expression: high
        fused: false
        chain:
          - gene:
              id: "Ligninase1"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: "ligninase_2"
        expression: high
        fused: false
        chain:
          - gene:
              id: "Ligninase2"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: "ligninase_3"
        expression: medium
        fused: false
        chain:
          - gene:
              id: "Ligninase3"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: "ligninase_4"
        expression: medium
        fused: false
        chain:
          - gene:
              id: "Ligninase4"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: "ligninase_5"
        expression: high
        fused: false
        chain:
          - gene:
              id: "Ligninase5"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: "ligninase_6"
        expression: medium
        fused: false
        chain:
          - gene:
              id: "Ligninase6"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - terminator: rrnB_T1