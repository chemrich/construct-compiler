construct:
  name: "bioplastic_production_pathway_5enzyme"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: MonomerSynthaseA
        expression: high
        chain:
          - gene:
              id: MonomerSynthaseA
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: MonomerSynthaseB
        expression: high
        fused: false
        chain:
          - gene:
              id: MonomerSynthaseB
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: MonomerSynthaseC
        expression: high
        fused: false
        chain:
          - gene:
              id: MonomerSynthaseC
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

    - promoter: J23100

    - cistron:
        label: PolymeraseD
        expression: high
        chain:
          - gene:
              id: PolymeraseD
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1

    - promoter: J23100

    - cistron:
        label: PolymeraseE
        expression: high
        chain:
          - gene:
              id: PolymeraseE
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
