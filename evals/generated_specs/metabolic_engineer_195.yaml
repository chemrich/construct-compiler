construct:
  name: "AAV_TheraEnz_1_4_MultiExpression"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CAG
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz1
              source: uniprot
    - terminator: bGH_polyA
    - spacer: 40
    - promoter: CAG
    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz2
              source: uniprot
    - terminator: bGH_polyA
    - spacer: 40
    - promoter: CAG
    - cistron:
        label: enzyme_3
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz3
              source: uniprot
    - terminator: bGH_polyA
    - spacer: 40
    - promoter: CAG
    - cistron:
        label: enzyme_4
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz4
              source: uniprot
    - terminator: bGH_polyA
# Note: Total length of four CAG-driven units likely exceeds the ~4.7kb packaging capacity of a single AAV vector.