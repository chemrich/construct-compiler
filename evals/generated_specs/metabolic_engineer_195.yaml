    - cistron:
        label: TheraEnz1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz1
              source: uniprot
              codon_optimization: human

    - terminator: WPRE_polyA

    - promoter: CAG

    - cistron:
        label: TheraEnz2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz2
              source: uniprot
              codon_optimization: human

    - terminator: WPRE_polyA

    - promoter: CAG

    - cistron:
        label: TheraEnz3
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz3
              source: uniprot
              codon_optimization: human

    - terminator: WPRE_polyA

    - promoter: CAG

    - cistron:
        label: TheraEnz4
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TheraEnz4
              source: uniprot
              codon_optimization: human

    - terminator: WPRE_polyA
