construct:
  name: "ethanol_pathway_operon_enzEth1-5"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter (iGEM standard)

    - cistron:
        label: EnzEth1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth1
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzEth2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth2
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzEth3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth3
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzEth4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth4
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzEth5
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth5
              source: uniprot

    - terminator: rrnB_T1
