construct:
  name: "ethanol_production_metabolic_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: enz_eth1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth1
              source: uniprot
    - spacer: 30
    - cistron:
        label: enz_eth2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth2
              source: uniprot
    - spacer: 30
    - cistron:
        label: enz_eth3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth3
              source: uniprot
    - spacer: 30
    - cistron:
        label: enz_eth4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth4
              source: uniprot
    - spacer: 30
    - cistron:
        label: enz_eth5
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzEth5
              source: uniprot
    - terminator: BBa_B0015