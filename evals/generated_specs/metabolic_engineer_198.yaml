construct:
  name: "synthetic_pathway_abcd_operon_library"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5
    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - gene:
              id: "ModuleA"
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: medium
        fused: false
        chain:
          - gene:
              id: "ModuleB"
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: low
        fused: false
        chain:
          - gene:
              id: "ModuleC"
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_d
        expression: very_low
        fused: false
        chain:
          - gene:
              id: "ModuleD"
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1