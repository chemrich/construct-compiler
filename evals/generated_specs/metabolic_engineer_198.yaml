construct:
  name: "synthetic_pathway_operon_expression_library"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: ModuleA
        expression: high
        chain:
          - gene:
              id: ModuleA
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: ModuleB
        expression: high
        fused: false
        chain:
          - gene:
              id: ModuleB
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: ModuleC
        expression: medium
        fused: false
        chain:
          - gene:
              id: ModuleC
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: ModuleD
        expression: low
        fused: false
        chain:
          - gene:
              id: ModuleD
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
