construct:
  name: "pollutant_degradation_operon_5_enzyme"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # pollutant-responsive; arabinose inducible as proxy for chemical induction

    - cistron:
        label: Degradase1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Degradase1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Degradase2
        expression: high
        fused: false
        chain:
          - gene:
              id: Degradase2
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: Degradase3
        expression: high
        fused: false
        chain:
          - gene:
              id: Degradase3
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: Degradase4
        expression: high
        fused: false
        chain:
          - gene:
              id: Degradase4
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: Degradase5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Degradase5
              source: uniprot

    - terminator: rrnB_T1
