construct:
  name: "bacillus_biofuel_pathway_iptg_inducible"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: aldehyde_dehydrogenase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        gene:
          id: alcohol_dehydrogenase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        gene:
          id: acyl_CoA_synthetase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: medium
        gene:
          id: fatty_acid_desaturase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: medium
        gene:
          id: thioesterase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6
        expression: low
        gene:
          id: aldol_condensase
          source: uniprot

    - spacer: 25

    - cistron:
        label: gfp_reporter
        expression: low
        chain:
          - tag: BsaI_site_n_terminus
          - gene:
              id: sfGFP
              source: fpbase
          - tag: BsaI_site_c_terminus

    - terminator: rrnB_T1
