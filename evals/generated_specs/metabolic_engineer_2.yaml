construct:
  name: biofuel_precursor_pathway_operon
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacI_Phyperspank  # IPTG-inducible promoter for tight control in B. subtilis

    - cistron:
        label: enzyme1
        expression: high
        gene:
          id: P450BM3  # example pathway enzyme
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: medium
        fused: false
        gene:
          id: Q45619  # example dehydrogenase
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        gene:
          id: P39844  # example synthase
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: medium
        fused: false
        gene:
          id: O34667  # example reductase
          source: uniprot

    - spacer: 35

    - cistron:
        label: enzyme5
        expression: low
        fused: false
        gene:
          id: P54424  # example isomerase
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme6
        expression: medium
        fused: false
        gene:
          id: P80877  # example transferase
          source: uniprot

    - spacer: 40  # larger spacer before reporter with BsaI sites

    - cistron:
        label: gfp_reporter
        expression: low
        fused: false
        chain:
          - BsaI_site: GGTCTC  # flanking BsaI site for removal
          - gene:
              id: sfGFP
              source: fpbase
          - BsaI_site: GAGACC  # complementary BsaI site

    - terminator: rrnB_T1