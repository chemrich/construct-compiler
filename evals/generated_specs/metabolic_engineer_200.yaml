construct:
  name: "terpene_biosynthesis_operon_5enzymes"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # strong constitutive promoter for balanced multi-gene expression

    - cistron:
        label: GPS
        expression: high
        gene:
          id: GPS
          source: uniprot

    - spacer: 30

    - cistron:
        label: FPS
        expression: high
        fused: false
        gene:
          id: FPS
          source: uniprot

    - spacer: 30

    - cistron:
        label: SQS
        expression: high
        fused: false
        gene:
          id: SQS
          source: uniprot

    - spacer: 30

    - cistron:
        label: SQE
        expression: high
        fused: false
        gene:
          id: SQE
          source: uniprot

    - spacer: 30

    - cistron:
        label: TPS
        expression: high
        fused: false
        chain:
          - gene:
              id: TPS
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
