construct:
  name: carotenoid_pathway_4enzyme_yeast
  host: yeast

  backbone:
    resistance: nourseothricin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: CrtB
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: CrtB
              source: uniprot
              codon_optimization: saccharomyces_cerevisiae

    - spacer: 25

    - cistron:
        label: CrtI
        expression: high
        fused: false
        gene:
          id: CrtI
          source: uniprot
          codon_optimization: saccharomyces_cerevisiae

    - spacer: 25

    - cistron:
        label: CrtY
        expression: medium
        fused: false
        gene:
          id: CrtY
          source: uniprot
          codon_optimization: saccharomyces_cerevisiae

    - spacer: 25

    - cistron:
        label: CrtW
        expression: medium
        fused: false
        chain:
          - gene:
              id: CrtW
              source: uniprot
              codon_optimization: saccharomyces_cerevisiae
          - tag: FLAG

    - terminator: CYC1_terminator
