construct:
  name: "mammalian_4protein_2A_polycistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: PrtA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PrtA
              source: uniprot

    - spacer: 21  # 2A peptide sequence (T2A, ~21 bp)

    - cistron:
        label: PrtB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PrtB
              source: uniprot

    - spacer: 21  # 2A peptide sequence

    - cistron:
        label: PrtC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PrtC
              source: uniprot

    - spacer: 21  # 2A peptide sequence

    - cistron:
        label: PrtD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PrtD
              source: uniprot

    - terminator: polyA  # poly(A) signal for mammalian mRNA stability and translation
