construct:
  name: "bacillus_subtilis_pathway_operon"
  host: b_subtilis
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: custom
  cassette:
    - promoter: Pveg # Strong constitutive promoter for Bacillus subtilis
    - cistron:
        label: enzA
        expression: high
        gene:
          id: EnzA
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzB
        expression: high
        fused: false
        gene:
          id: EnzB
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzC
        expression: high
        fused: false
        gene:
          id: EnzC
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzD
        expression: high
        fused: false
        gene:
          id: EnzD
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1 # Rho-independent terminator compatible with B. subtilis