construct:
  name: "bacillus_4enzyme_pathway_sfGFP_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: aprE

    - cistron:
        label: EnzA
        expression: high
        gene:
          id: EnzA
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzB
        expression: high
        fused: false
        gene:
          id: EnzB
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzC
        expression: high
        fused: false
        gene:
          id: EnzC
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzD
        expression: high
        fused: false
        gene:
          id: EnzD
          source: uniprot

    - spacer: 25

    - cistron:
        label: sfGFP_reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
