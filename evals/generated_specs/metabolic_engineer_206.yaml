construct:
  name: "Pseudomonas_putida_pollutant_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is catabolite-repressible in Pseudomonas; active only when glucose absent
      # Alternative: Pm (methylamine utilization promoter) also works for catabolite repression

    - cistron:
        label: Deg1
        expression: high
        chain:
          - gene:
              id: Deg1
              source: uniprot
          - tag: myc

    - spacer: 25

    - cistron:
        label: Deg2
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg2
              source: uniprot
          - tag: myc

    - spacer: 25

    - cistron:
        label: Deg3
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg3
              source: uniprot
          - tag: myc

    - spacer: 25

    - cistron:
        label: Deg4
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg4
              source: uniprot
          - tag: myc

    - spacer: 25

    - cistron:
        label: Deg5
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg5
              source: uniprot
          - tag: myc

    - terminator: rrnB_T1
