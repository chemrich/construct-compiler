construct:
  name: "bioremediation_deg_operon"
  host: e_coli  # Pseudomonas putida substituted with E. coli as host list surrogate; tac promoter used for catabolite repression.
  backbone:
    resistance: kanamycin
    ori: p15A
  cassette:
    - promoter: tac
    - cistron:
        label: deg1
        expression: medium
        fused: false
        chain:
          - gene:
              id: Deg1
              source: uniprot
          - tag: Myc
    - spacer: 30
    - cistron:
        label: deg2
        expression: medium
        fused: false
        chain:
          - gene:
              id: Deg2
              source: uniprot
          - tag: Myc
    - spacer: 30
    - cistron:
        label: deg3
        expression: medium
        fused: false
        chain:
          - gene:
              id: Deg3
              source: uniprot
          - tag: Myc
    - spacer: 30
    - cistron:
        label: deg4
        expression: medium
        fused: false
        chain:
          - gene:
              id: Deg4
              source: uniprot
          - tag: Myc
    - spacer: 30
    - cistron:
        label: deg5
        expression: medium
        fused: false
        chain:
          - gene:
              id: Deg5
              source: uniprot
          - tag: Myc
    - terminator: rrnB_T1