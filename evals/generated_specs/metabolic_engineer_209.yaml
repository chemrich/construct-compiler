construct:
  name: toxic_intermediate_pathway_operon
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Path1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Path1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Path2
        expression: high
        fused: false
        gene:
          id: Path2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Path3
        expression: medium
        fused: false
        gene:
          id: Path3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Path4
        expression: low
        fused: false
        chain:
          - gene:
              id: Path4
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
