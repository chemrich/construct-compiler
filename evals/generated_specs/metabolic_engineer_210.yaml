construct:
  name: brain_enzyme_cascade_5enzyme_2A
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: SynI  # Synapsin I promoter for neuron-specific expression

    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - gene:
              id: EnzymeX
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_EnzymeY
        expression: high
        chain:
          - cleavage_site: P2A  # 2A self-cleaving peptide for stoichiometric production
          - gene:
              id: EnzymeY
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_EnzymeZ
        expression: high
        chain:
          - cleavage_site: P2A
          - gene:
              id: EnzymeZ
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_EnzymeW
        expression: high
        chain:
          - cleavage_site: P2A
          - gene:
              id: EnzymeW
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_EnzymeV
        expression: high
        chain:
          - cleavage_site: P2A
          - gene:
              id: EnzymeV
              source: uniprot

    - terminator: rrnB_T1  # rrnB_T1 provides high mRNA stability
