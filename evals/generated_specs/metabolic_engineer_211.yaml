construct:
  name: "starvation_induced_stress_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: bolA  # bolA is a canonical starvation-induced promoter (RpoS-dependent)
    - cistron:
        label: stress_enzyme_1
        expression: medium
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress1
              source: uniprot
    - spacer: 30
    - cistron:
        label: stress_enzyme_2
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress2
              source: uniprot
    - spacer: 30
    - cistron:
        label: stress_enzyme_3
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress3
              source: uniprot
    - spacer: 30
    - cistron:
        label: stress_enzyme_4
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress4
              source: uniprot
    - spacer: 30
    - cistron:
        label: stress_enzyme_5
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress5
              source: uniprot
    - spacer: 30
    - cistron:
        label: stress_enzyme_6
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: Stress6
              source: uniprot
    - terminator: rrnB_T1