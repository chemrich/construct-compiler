construct:
  name: "bacillus_hydrolase_cocktail_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # xylose-inducible (arabinose promoter as xylose-inducible analog in Bacillus)

    - cistron:
        label: Hydrolase1
        expression: high
        chain:
          - secretion_signal: SP_amyE  # Bacillus AmyE signal peptide for robust secretion
          - gene:
              id: Hydrolase1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Hydrolase2
        expression: high
        fused: false
        chain:
          - secretion_signal: SP_amyE
          - gene:
              id: Hydrolase2
              source: uniprot

    - spacer: 25

    - cistron:
        label: Hydrolase3
        expression: high
        fused: false
        chain:
          - secretion_signal: SP_amyE
          - gene:
              id: Hydrolase3
              source: uniprot

    - spacer: 25

    - cistron:
        label: Hydrolase4
        expression: high
        fused: false
        chain:
          - secretion_signal: SP_amyE
          - gene:
              id: Hydrolase4
              source: uniprot

    - spacer: 25

    - cistron:
        label: Hydrolase5
        expression: high
        fused: false
        chain:
          - secretion_signal: SP_amyE
          - gene:
              id: Hydrolase5
              source: uniprot

    - terminator: rrnB_T1
