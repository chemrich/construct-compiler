construct:
  name: "peroxisomal_metabolic_pathway_4enzyme"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: CUP1

    - cistron:
        label: PeroxEnz1
        expression: high
        chain:
          - gene:
              id: PeroxEnz1
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: PeroxEnz2
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroxEnz2
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: PeroxEnz3
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroxEnz3
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: PeroxEnz4
        expression: high
        fused: false
        chain:
          - gene:
              id: PeroxEnz4
              source: uniprot
          - tag: PTS1

    - terminator: CYC1_terminator
