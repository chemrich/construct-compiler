construct:
  name: "yeast_peroxisomal_metabolic_pathway"
  host: yeast
  backbone:
    resistance: uracil
    ori: 2micron
    source: addgene
  cassette:
    - promoter: CUP1
    - cistron:
        label: "perox_enz1"
        expression: medium
        chain:
          - tag: "PTS2"
          - gene:
              id: "PeroxEnz1"
              source: uniprot
    - spacer: 30
    - cistron:
        label: "perox_enz2"
        expression: medium
        fused: false
        chain:
          - gene:
              id: "PeroxEnz2"
              source: uniprot
          - tag: "PTS1"
    - spacer: 30
    - cistron:
        label: "perox_enz3"
        expression: medium
        fused: false
        chain:
          - tag: "PTS2"
          - gene:
              id: "PeroxEnz3"
              source: uniprot
    - spacer: 30
    - cistron:
        label: "perox_enz4"
        expression: medium
        fused: false
        chain:
          - gene:
              id: "PeroxEnz4"
              source: uniprot
          - tag: "PTS1"
    - terminator: CYC1_term