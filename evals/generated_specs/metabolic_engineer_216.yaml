construct:
  name: "four_enzyme_operon_E_coli"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: Enzyme_A
        expression: high
        gene:
          id: Enzyme_A
          source: uniprot

    - spacer: 30

    - cistron:
        label: Enzyme_B
        expression: high
        fused: false
        gene:
          id: Enzyme_B
          source: uniprot

    - spacer: 30

    - cistron:
        label: Enzyme_C
        expression: high
        fused: false
        gene:
          id: Enzyme_C
          source: uniprot

    - spacer: 30

    - cistron:
        label: Enzyme_D
        expression: high
        fused: false
        gene:
          id: Enzyme_D
          source: uniprot

    - terminator: T7term
