          id: Flux3
          source: uniprot

    - spacer: 30

    - cistron:
        label: Flux4
        expression: very_high
        utr_5: ADH1_strong
        utr_3: ADH1_terminator
        gene:
          id: Flux4
          source: uniprot

    - spacer: 30

    - cistron:
        label: Flux5
        expression: very_high
        utr_5: GAP_strong
        utr_3: CYC1_terminator
