construct:
  name: "P_putida_5enzyme_complex_frameshifted"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: nptII  # Strong constitutive promoter for P. putida

    - cistron:
        label: Complex1
        expression: high
        gene:
          id: Complex1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Complex2
        expression: high
        gene:
          id: Complex2
          source: uniprot

    - frameshift:
        type: minus_one
        sequence: AAAAAAC  # Typical -1 frameshift motif (slippery site)

    - cistron:
        label: Complex3
        expression: medium
        gene:
          id: Complex3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Complex4
        expression: medium
        gene:
          id: Complex4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Complex5
        expression: high
        gene:
          id: Complex5
          source: uniprot

    - terminator: rrnB_T1
