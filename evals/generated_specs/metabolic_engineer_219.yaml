construct:
  name: "InteractA_B_C_D_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: tac

    - cistron:
        label: InteractA
        expression: high
        chain:
          - gene:
              id: InteractA
              source: uniprot
          - tag: Twin-Strep

    - spacer: 25

    - cistron:
        label: InteractB
        expression: high
        fused: false
        chain:
          - gene:
              id: InteractB
              source: uniprot
          - tag: S-tag

    - spacer: 25

    - cistron:
        label: InteractC
        expression: high
        fused: false
        chain:
          - gene:
              id: InteractC
              source: uniprot
          - tag: Twin-Strep

    - spacer: 25

    - cistron:
        label: InteractD
        expression: high
        fused: false
        chain:
          - gene:
              id: InteractD
              source: uniprot
          - tag: S-tag

    - terminator: rrnB_T1
