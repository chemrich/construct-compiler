construct:
  name: "bacillus_pks_assembly_line"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pveg  # Strong constitutive promoter appropriate for Bacillus subtilis
    - cistron:
        label: pks1
        expression: high
        gene:
          id: PKS1
          source: uniprot
    - spacer: 30
    - cistron:
        label: pks2
        expression: high
        fused: false
        gene:
          id: PKS2
          source: uniprot
    - spacer: 30
    - cistron:
        label: pks3
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PKS3
              source: uniprot
    - spacer: 30
    - cistron:
        label: pks4
        expression: high
        fused: false
        gene:
          id: PKS4
          source: uniprot
    - spacer: 30
    - cistron:
        label: pks5
        expression: high
        fused: false
        gene:
          id: PKS5
          source: uniprot
    - spacer: 30
    - cistron:
        label: pks6
        expression: high
        fused: false
        gene:
          id: PKS6
          source: uniprot
    - terminator: rrnB_T1