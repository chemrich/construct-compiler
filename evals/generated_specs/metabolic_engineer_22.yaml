    - cistron:
        label: PKS4
        expression: high
        gene:
          id: PKS4
          source: uniprot

    - spacer: 25

    - cistron:
        label: PKS5
        expression: high
        gene:
          id: PKS5
          source: uniprot

    - spacer: 25

    - cistron:
        label: PKS6
