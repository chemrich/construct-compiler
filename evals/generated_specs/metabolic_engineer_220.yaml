construct:
  name: "chemical_precursor_biosynthesis_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GeneA
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_c
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_d
        expression: high
        fused: false
        gene:
          id: GeneD
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_e
        expression: high
        fused: false
        gene:
          id: GeneE
          source: uniprot
    - terminator: rrnB_T1