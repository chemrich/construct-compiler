construct:
  name: "E_coli_five_enzyme_operon_precursor"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter for balanced expression

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneC
        expression: medium
        fused: false
        gene:
          id: GeneC
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneD
        expression: medium
        fused: false
        gene:
          id: GeneD
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneE
        expression: medium
        fused: false
        gene:
          id: GeneE
          source: uniprot

    - terminator: rrnB_T1
