construct:
  name: "tunable_secondary_metabolite_operon_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1  # Inducible by galactose, repressed by glucose

    - cistron:
        label: Enz1
        expression: high
        chain:
          - gene:
              id: Enz1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Enz2
        expression: medium
        fused: false
        gene:
          id: Enz2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enz3
        expression: medium
        fused: false
        gene:
          id: Enz3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Enz4
        expression: low
        fused: false
        gene:
          id: Enz4
          source: uniprot

    - terminator: CYC1  # Yeast terminator
