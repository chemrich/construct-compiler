construct:
  name: "mammalian_quad_enzyme_P2A_cassette"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: Kinase1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P06239
              source: uniprot
        notes: "Codon-optimized for mammalian expression"

    - spacer: 21  # P2A peptide sequence (63 bp encoding GSGATNFSLLKQAGDVEENPGP)

    - cistron:
        label: Phosphatase2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: P24522
              source: uniprot
        notes: "P2A self-cleaving peptide separates from Kinase1"

    - spacer: 21  # F2A peptide sequence (63 bp encoding GSGATNFSLLKQAGDVEENPGP variant)

    - cistron:
        label: Transporter3
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: P11166
              source: uniprot
        notes: "F2A self-cleaving peptide separates from Phosphatase2"

    - spacer: 21  # P2A peptide sequence

    - cistron:
        label: Ligase4
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Q13094
              source: uniprot
        notes: "P2A self-cleaving peptide separates from Transporter3"

    - terminator: rrnB_T1
