construct:
  name: five_enzyme_pathway_substrate_channeling
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: MandelateRacemase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MandelateRacemase
              source: uniprot

    - spacer: 30

    - cistron:
        label: Hydroxylase_Reductase_fusion
        expression: high
        chain:
          - gene:
              id: Hydroxylase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Reductase
              source: uniprot

    - spacer: 30

    - cistron:
        label: Isomerase
        expression: high
        fused: false
        gene:
          id: Isomerase
          source: uniprot

    - spacer: 30

    - cistron:
        label: Synthase
        expression: high
        fused: false
        gene:
          id: Synthase
          source: uniprot

    - terminator: rrnB_T1
