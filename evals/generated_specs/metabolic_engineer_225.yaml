construct:
  name: heavy_metal_biosensor_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Metal-inducible promoter (araBAD responds to L-arabinose; can be engineered for metal sensing)
      # For true metal induction, consider replacing with Zn2+-responsive promoter or Hg2+-responsive promoter in practice

    - cistron:
        label: SensorA
        expression: medium
        fused: false
        gene:
          id: SensorA
          source: uniprot

    - spacer: 30

    - cistron:
        label: SensorB
        expression: medium
        fused: false
        gene:
          id: SensorB
          source: uniprot

    - spacer: 30

    - cistron:
        label: SensorC
        expression: medium
        fused: false
        gene:
          id: SensorC
          source: uniprot

    - spacer: 30

    - cistron:
        label: SensorD
        expression: medium
        fused: false
        gene:
          id: SensorD
          source: uniprot

    - spacer: 30

    - cistron:
        label: SensorE_GFP
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
