construct:
  name: "heavy_metal_biosensor_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: pArsR  # Metal-inducible promoter (Arsenic responsive) for tight regulation
    - cistron:
        label: SensorA
        expression: medium
        fused: false
        gene:
          id: SensorA
          source: uniprot
    - spacer: 30
    - cistron:
        label: SensorB
        expression: medium
        fused: false
        gene:
          id: SensorB
          source: uniprot
    - spacer: 30
    - cistron:
        label: SensorC
        expression: medium
        fused: false
        gene:
          id: SensorC
          source: uniprot
    - spacer: 30
    - cistron:
        label: SensorD
        expression: medium
        fused: false
        gene:
          id: SensorD
          source: uniprot
    - spacer: 30
    - cistron:
        label: SensorE
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1