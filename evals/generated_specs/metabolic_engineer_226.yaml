construct:
  name: "NADPH_regeneration_four_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: NADPH_Synthase1
        expression: high
        gene:
          id: NADPH_Synthase1
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Reductase2
        expression: high
        fused: false
        gene:
          id: Reductase2
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Dehydrogenase3
        expression: high
        fused: false
        gene:
          id: Dehydrogenase3
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Kinase4
        expression: high
        fused: false
        gene:
          id: Kinase4
          source: uniprot
    
    - terminator: rrnB_T1
