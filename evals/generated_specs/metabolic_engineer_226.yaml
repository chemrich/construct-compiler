construct:
  name: "NADPH_regeneration_operon"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: synthase
        expression: high
        gene:
          id: NADPH_Synthase1
          source: uniprot
    - spacer: 30
    - cistron:
        label: reductase
        expression: high
        fused: false
        gene:
          id: Reductase2
          source: uniprot
    - spacer: 30
    - cistron:
        label: dehydrogenase
        expression: high
        fused: false
        gene:
          id: Dehydrogenase3
          source: uniprot
    - spacer: 30
    - cistron:
        label: kinase
        expression: high
        fused: false
        gene:
          id: Kinase4
          source: uniprot
    - terminator: T7term