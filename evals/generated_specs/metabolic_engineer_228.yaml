construct:
  name: "S_cerevisiae_five_enzyme_pathway"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MitoEnz1
        expression: high
        chain:
          - tag: MTS_mitochondrial
          - gene:
              id: MitoEnz1
              source: uniprot

    - spacer: 30

    - cistron:
        label: MitoEnz2
        expression: high
        fused: false
        chain:
          - tag: MTS_mitochondrial
          - gene:
              id: MitoEnz2
              source: uniprot

    - spacer: 30

    - cistron:
        label: CytoEnz3
        expression: high
        fused: false
        gene:
          id: CytoEnz3
          source: uniprot

    - spacer: 30

    - cistron:
        label: PeroxEnz4
        expression: high
        fused: false
        chain:
          - tag: PTS1_peroxisomal
          - gene:
              id: PeroxEnz4
              source: uniprot

    - spacer: 30

    - cistron:
        label: CytoEnz5
        expression: high
        fused: false
        gene:
          id: CytoEnz5
          source: uniprot

    - terminator: CYC1_terminator
