    - cistron:
        label: LigaseB
        expression: high
        fused: false
        gene:
          id: LigaseB
          source: uniprot
    - spacer: 30
    - cistron:
        label: HydrolaseC
        expression: high
        fused: false
        gene:
          id: HydrolaseC
          source: uniprot
    - spacer: 30
    - cistron:
        label: IsomeraseD
        expression: high
        fused: false
        gene:
          id: IsomeraseD
          source: uniprot
    - terminator: T7term