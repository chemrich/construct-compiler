construct:
  name: four_enzyme_operon_synthaseA_ligaseB_hydrolaseC_isomeraseD
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: SynthaseA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: SynthaseA
              source: uniprot

    - spacer: 30

    - cistron:
        label: LigaseB
        expression: high
        fused: false
        gene:
          id: LigaseB
          source: uniprot

    - spacer: 30

    - cistron:
        label: HydrolaseC
        expression: high
        fused: false
        gene:
          id: HydrolaseC
          source: uniprot

    - spacer: 30

    - cistron:
        label: IsomeraseD
        expression: high
        fused: false
        gene:
          id: IsomeraseD
          source: uniprot

    - terminator: rrnB_T1
