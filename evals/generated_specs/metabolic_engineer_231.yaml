construct:
  name: "six_enzyme_metabolic_pathway_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: PrecursorA
        expression: high
        chain:
          - gene:
              id: PrecursorA
              source: uniprot
              codon_optimization: e_coli

    - spacer: 25

    - cistron:
        label: PrecursorB
        expression: high
        fused: false
        chain:
          - gene:
              id: PrecursorB
              source: uniprot
              codon_optimization: e_coli

    - spacer: 25

    - cistron:
        label: PrecursorC
        expression: high
        fused: false
        chain:
          - gene:
              id: PrecursorC
              source: uniprot
              codon_optimization: e_coli

    - spacer: 25

    - cistron:
        label: PrecursorD
        expression: high
        fused: false
        chain:
          - gene:
              id: PrecursorD
              source: uniprot
              codon_optimization: e_coli

    - spacer: 25

    - cistron:
        label: PrecursorE
        expression: high
        fused: false
        chain:
          - gene:
              id: PrecursorE
              source: uniprot
              codon_optimization: e_coli

    - spacer: 25

    - cistron:
        label: PrecursorF
        expression: high
        fused: false
        chain:
          - gene:
              id: PrecursorF
              source: uniprot
              codon_optimization: e_coli

    - terminator: rrnB_T1
