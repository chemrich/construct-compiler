construct:
  name: "four_enzyme_metabolic_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: EnzX
        expression: high
        gene:
          id: EnzX
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzY
        expression: high
        chain:
          - gene:
              id: EnzY
              source: uniprot
          - degron: LVA
    
    - spacer: 25
    
    - cistron:
        label: EnzZ
        expression: medium
        chain:
          - gene:
              id: EnzZ
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzW
        expression: high
        gene:
          id: EnzW
          source: uniprot
    
    - terminator: rrnB_T1
