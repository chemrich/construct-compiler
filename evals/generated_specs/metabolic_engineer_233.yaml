construct:
  name: "contaminant_sensing_remediation_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
      # lacUV5 serves as the constitutive basal promoter for SensorTF expression
    
    - cistron:
        label: SensorTF
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: SensorTF
              source: uniprot
    
    - spacer: 25
    
    - promoter: SensorTF_responsive
      # This is a synthetic/natural promoter responsive to SensorTF binding
      # In practice, this would be engineered with appropriate operator sequences
      comment: "Contaminant-responsive promoter controlled by SensorTF transcriptional factor"
    
    - cistron:
        label: Effector1
        expression: high
        fused: false
        gene:
          id: Effector1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Effector2
        expression: high
        fused: false
        gene:
          id: Effector2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Effector3
        expression: high
        fused: false
        gene:
          id: Effector3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Effector4
        expression: high
        fused: false
        gene:
          id: Effector4
          source: uniprot
    
    - terminator: rrnB_T1
