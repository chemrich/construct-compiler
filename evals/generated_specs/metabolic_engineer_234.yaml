construct:
  name: "quorum_sensing_synthase_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
      # constitutive low-level expression for QS system initiation
    
    - cistron:
        label: luxI
        expression: low
        gene:
          id: luxI
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: luxR
        expression: low
        gene:
          id: luxR
          source: uniprot
    
    - spacer: 30
    
    - promoter: lux_pR
      # density-dependent promoter activated by LuxR-AHL complex
      # only active above QS threshold
    
    - cistron:
        label: synthase1
        expression: high
        gene:
          id: synthase1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: synthase2
        expression: high
        gene:
          id: synthase2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: synthase3
        expression: high
        gene:
          id: synthase3
          source: uniprot
    
    - terminator: rrnB_T1
