construct:
  name: six_enzyme_scaffold_pathway
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ScaffoldA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ScaffoldA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldProteinDomain
              source: uniprot

    - spacer: 25

    - cistron:
        label: PolymeraseB
        expression: high
        fused: false
        chain:
          - gene:
              id: PolymeraseB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldBindingDomainB
              source: uniprot

    - spacer: 25

    - cistron:
        label: LigatorC
        expression: high
        fused: false
        chain:
          - gene:
              id: LigatorC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldBindingDomainC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ModulatorD
        expression: high
        fused: false
        chain:
          - gene:
              id: ModulatorD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldBindingDomainD
              source: uniprot

    - spacer: 25

    - cistron:
        label: CrosslinkerE
        expression: high
        fused: false
        chain:
          - gene:
              id: CrosslinkerE
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldBindingDomainE
              source: uniprot

    - spacer: 25

    - cistron:
        label: FinisherF
        expression: high
        fused: false
        chain:
          - gene:
              id: FinisherF
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldBindingDomainF
              source: uniprot

    - terminator: rrnB_T1
