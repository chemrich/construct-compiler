construct:
  name: "four_enzyme_pathway_EnzK_L_M_N"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzK
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: EnzK
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: EnzL
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP
          - gene:
              id: EnzL
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzM
        expression: medium
        fused: false
        gene:
          id: EnzM
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzN
        expression: medium
        fused: false
        gene:
          id: EnzN
          source: uniprot

    - terminator: rrnB_T1
