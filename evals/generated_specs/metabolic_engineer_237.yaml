construct:
  name: "five_gene_pathway_dual_regulation"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: SensorX
        expression: medium
        gene:
          id: SensorX
          source: uniprot

    - spacer: 25

    - cistron:
        label: ActivatorY
        expression: medium
        fused: false
        gene:
          id: ActivatorY
          source: uniprot

    - spacer: 25

    - cistron:
        label: SuppressorZ
        expression: medium
        fused: false
        gene:
          id: SuppressorZ
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneP
        expression: medium
        fused: false
        gene:
          id: GeneP
          source: uniprot

    - spacer: 25

    - cistron:
        label: GeneQ
        expression: medium
        fused: false
        gene:
          id: GeneQ
          source: uniprot

    - terminator: rrnB_T1
