construct:
  name: "novel_carbon_source_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD provides catabolite repression (glucose effect) and strong induction with L-arabinose
      # Alternatively, a custom PL-arabinose promoter could be used for tighter control
    
    - cistron:
        label: Uptake1
        expression: high
        # Strong RBS (BBa_B0034) for efficient substrate transport
        chain:
          - rbs: B0034
          - gene:
              id: Uptake1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Metabolizer2
        expression: high
        fused: false
        gene:
          id: Metabolizer2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Convertase3
        expression: high
        fused: false
        gene:
          id: Convertase3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Regulator4
        expression: medium
        fused: false
        gene:
          id: Regulator4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Synthase5
        expression: high
        fused: false
        gene:
          id: Synthase5
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Detoxifier6
        expression: medium
        fused: false
        gene:
          id: Detoxifier6
          source: uniprot
    
    - terminator: rrnB_T1
