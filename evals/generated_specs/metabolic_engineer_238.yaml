construct:
  name: "novel_carbon_utilization_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Selected for strong induction and catabolite repression properties
    - cistron:
        label: uptake_1
        expression: high
        gene:
          id: Uptake1
          source: uniprot
    - spacer: 30
    - cistron:
        label: metabolizer_2
        expression: medium
        fused: false
        gene:
          id: Metabolizer2
          source: uniprot
    - spacer: 30
    - cistron:
        label: convertase_3
        expression: medium
        fused: false
        gene:
          id: Convertase3
          source: uniprot
    - spacer: 30
    - cistron:
        label: regulator_4
        expression: medium
        fused: false
        gene:
          id: Regulator4
          source: uniprot
    - spacer: 30
    - cistron:
        label: synthase_5
        expression: medium
        fused: false
        gene:
          id: Synthase5
          source: uniprot
    - spacer: 30
    - cistron:
        label: detoxifier_6
        expression: medium
        fused: false
        gene:
          id: Detoxifier6
          source: uniprot
    - terminator: rrnB_T1