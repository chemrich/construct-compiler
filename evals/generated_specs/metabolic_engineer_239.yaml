construct:
  name: "HEK293T_viral_packaging_quad"
  host: HEK293
  
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: Gag
        expression: high
        chain:
          - gene:
              id: "HIV_Gag"
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: Pol
        expression: high
        fused: false
        chain:
          - gene:
              id: "HIV_Pol"
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: Env
        expression: high
        fused: false
        chain:
          - gene:
              id: "HIV_Env"
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: Rev
        expression: medium
        fused: false
        chain:
          - gene:
              id: "HIV_Rev"
              source: uniprot
    
    - terminator: rrnB_T1
    
    # Polyadenylation signal for mRNA stability in mammalian cells
    - polyadenylation: AATAAA
