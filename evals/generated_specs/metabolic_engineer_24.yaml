construct:
  name: "lysine_biosynthesis_operon_minimal_burden"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD provides tunable, dose-dependent expression control
      # Allows metabolic burden minimization via L-arabinose titration
    
    - cistron:
        label: lysC
        expression: high
        gene:
          id: lysC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: dapA
        expression: medium
        chain:
          - cleavage_site: TEV
          - gene:
              id: dapA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: dapB
        expression: medium
        gene:
          id: dapB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: dapD
        expression: medium
        gene:
          id: dapD
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: dapF
        expression: low
        gene:
          id: dapF
          source: uniprot
    
    - terminator: rrnB_T1
