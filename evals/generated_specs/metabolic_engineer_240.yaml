construct:
  name: "four_enzyme_metabolic_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_a
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeC
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_d
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeD
              source: uniprot
    - terminator: rrnB_T1