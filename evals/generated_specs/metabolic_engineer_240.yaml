construct:
  name: "four_enzyme_metabolic_pathway_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # constitutive promoter for balanced expression

    - cistron:
        label: EnzymeA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeB
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeC
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeC
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeD
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeD
              source: uniprot

    - terminator: rrnB_T1
