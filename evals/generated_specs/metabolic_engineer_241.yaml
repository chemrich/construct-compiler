construct:
  name: "five_enzyme_operon_IPTG_inducible"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzymeP
        expression: medium
        chain:
          - gene:
              id: EnzymeP
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: EnzymeQ
        expression: medium
        fused: false
        gene:
          id: EnzymeQ
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzymeR
        expression: medium
        fused: false
        gene:
          id: EnzymeR
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzymeS
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: EnzymeS
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzymeT
        expression: medium
        fused: false
        gene:
          id: EnzymeT
          source: uniprot

    - terminator: rrnB_T1
