construct:
  name: "arabinose_inducible_six_enzyme_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - gene:
              id: EnzymeX
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzymeY
        expression: high
        fused: false
        chain:
          - gene:
              id: EnzymeY
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzymeZ
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzymeZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: MBP
    
    - spacer: 25
    
    - cistron:
        label: EnzymeAA
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzymeAA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzymeBB
        expression: low
        fused: false
        chain:
          - gene:
              id: EnzymeBB
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzymeCC
        expression: very_low
        fused: false
        chain:
          - gene:
              id: EnzymeCC
              source: uniprot
    
    - terminator: rrnB_T1
