construct:
  name: "arabinose_inducible_six_enzyme_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: enzyme_x
        expression: high
        gene:
          id: EnzymeX
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_y
        expression: medium
        fused: false
        gene:
          id: EnzymeY
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_z
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzymeZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
    - spacer: 30
    - cistron:
        label: enzyme_aa
        expression: medium
        fused: false
        gene:
          id: EnzymeAA
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_bb
        expression: low
        fused: false
        gene:
          id: EnzymeBB
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_cc
        expression: low
        fused: false
        gene:
          id: EnzymeCC
          source: uniprot
    - terminator: rrnB_T1