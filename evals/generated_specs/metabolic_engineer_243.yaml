construct:
  name: "high_flux_pathway_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_k
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeK
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_l
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeL
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_m
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeM
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_n
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeN
              source: uniprot
    - terminator: rrnB_T1