construct:
  name: "high_flux_enzyme_operon_KLMN"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: EnzymeK
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeK
              source: uniprot
              codon_optimized: true
    
    - spacer: 30
    
    - cistron:
        label: EnzymeL
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeL
              source: uniprot
              codon_optimized: true
    
    - spacer: 30
    
    - cistron:
        label: EnzymeM
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeM
              source: uniprot
              codon_optimized: true
    
    - spacer: 30
    
    - cistron:
        label: EnzymeN
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeN
              source: uniprot
              codon_optimized: true
    
    - terminator: rrnB_T1
