construct:
  name: "five_enzyme_operon_with_GFP_reporter"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: EnzymeU
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeU
              source: uniprot
    - spacer: 25
    - cistron:
        label: EnzymeV
        expression: high
        fused: false
        gene:
          id: EnzymeV
          source: uniprot
    - spacer: 25
    - cistron:
        label: EnzymeW
        expression: high
        fused: false
        gene:
          id: EnzymeW
          source: uniprot
    - spacer: 25
    - cistron:
        label: EnzymeX
        expression: high
        fused: false
        gene:
          id: EnzymeX
          source: uniprot
    - spacer: 25
    - cistron:
        label: EnzymeY
        expression: high
        fused: false
        gene:
          id: EnzymeY
          source: uniprot
    - spacer: 25
    - cistron:
        label: GFP_reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
