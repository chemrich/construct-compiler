construct:
  name: "bacillus_stress_response_operon"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_groEL

    - cistron:
        label: StressA
        expression: high
        chain:
          - gene:
              id: StressA
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: StressB
        expression: high
        fused: false
        chain:
          - gene:
              id: StressB
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: StressC
        expression: high
        fused: false
        chain:
          - gene:
              id: StressC
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: StressD
        expression: high
        fused: false
        chain:
          - gene:
              id: StressD
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
