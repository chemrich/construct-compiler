construct:
  name: "bacillus_stress_response_operon"
  host: bacillus_subtilis
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: P_groEL
    - cistron:
        label: stress_a
        expression: medium
        chain:
          - gene:
              id: StressA
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: stress_b
        expression: medium
        fused: false
        chain:
          - gene:
              id: StressB
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: stress_c
        expression: medium
        fused: false
        chain:
          - gene:
              id: StressC
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: stress_d
        expression: medium
        fused: false
        chain:
          - gene:
              id: StressD
              source: uniprot
          - tag: Strep-II
    - terminator: rrnB_T1