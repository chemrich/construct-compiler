construct:
  name: "five_enzyme_scaffold_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: ScaffoldE1_E2_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ScaffoldE1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaffoldE2
              source: uniprot

    - spacer: 25

    - cistron:
        label: ScaffoldE3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ScaffoldE3
              source: uniprot

    - spacer: 25

    - cistron:
        label: ScaffoldE4_E5_fusion
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ScaffoldE4
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: ScaffoldE5
              source: uniprot

    - terminator: rrnB_T1
