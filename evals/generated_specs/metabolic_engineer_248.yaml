construct:
  name: "OptE_operon_polycistronic_RBS_tuning"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR  # aTc-inducible promoter (anhydrotetracycline-responsive)

    - cistron:
        label: OptE1
        expression: high
        chain:
          - gene:
              id: OptE1
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: OptE2
        expression: high  # high RBS strength - tune as needed
        fused: false
        chain:
          - gene:
              id: OptE2
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: OptE3
        expression: medium  # medium RBS strength - tune as needed
        fused: false
        chain:
          - gene:
              id: OptE3
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: OptE4
        expression: medium  # medium RBS strength - tune as needed
        fused: false
        chain:
          - gene:
              id: OptE4
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: OptE5
        expression: high
        fused: false
        chain:
          - gene:
              id: OptE5
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
