construct:
  name: "aTc_inducible_pathway_optimization_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tetA
    - cistron:
        label: OptE1
        expression: medium
        chain:
          - gene:
              id: OptE1
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: OptE2
        expression: high
        fused: false
        chain:
          - gene:
              id: OptE2
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: OptE3
        expression: medium
        fused: false
        chain:
          - gene:
              id: OptE3
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: OptE4
        expression: low
        fused: false
        chain:
          - gene:
              id: OptE4
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: OptE5
        expression: medium
        fused: false
        chain:
          - gene:
              id: OptE5
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - terminator: BBa_B0015