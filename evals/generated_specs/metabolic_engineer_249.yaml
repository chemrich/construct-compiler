construct:
  name: "aptE_operon_constitutive_riboswitch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: AptE1
        expression: medium
        # 5' UTR contains a riboswitch for small molecule control of translation
        chain:
          - tag: Strep-II
          - gene:
              id: AptE1
              source: uniprot
    - spacer: 30
    - cistron:
        label: AptE2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: AptE2
              source: uniprot
    - spacer: 30
    - cistron:
        label: AptE3
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: AptE3
              source: uniprot
    - spacer: 30
    - cistron:
        label: AptE4
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: AptE4
              source: uniprot
    - terminator: rrnB_T1