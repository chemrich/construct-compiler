        gene:
          id: rbcS
          source: uniprot
    - spacer: 30
    - cistron:
        label: prkA
        expression: medium
        fused: false
        gene:
          id: prkA
          source: uniprot
    - spacer: 30
    - cistron:
        label: fbp
        expression: medium
        fused: false
        gene:
          id: fbp
          source: uniprot
    - spacer: 30
    - cistron:
        label: glpX
        expression: medium
        fused: false
        gene:
          id: glpX
          source: uniprot
    - spacer: 30
