              id: SecretoryE3
              source: uniprot

    - spacer: 25

    - cistron:
        label: SecretoryE4
        expression: high
        fused: false
        chain:
          - tag: AmyQ_signal_peptide
          - gene:
              id: SecretoryE4
              source: uniprot

    - terminator: rrnB_T1
