construct:
  name: "bacillus_subtilis_secretory_enzyme_operon"
  host: b_subtilis
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: P_veg  # Strong constitutive promoter for B. subtilis
    - cistron:
        label: SecretoryE1
        expression: medium
        chain:
          - tag: AmyQ  # B. subtilis Alpha-amylase secretion signal peptide
          - gene:
              id: SecretoryE1
              source: uniprot
    - spacer: 30
    - cistron:
        label: SecretoryE2
        expression: medium
        fused: false
        chain:
          - tag: AmyQ
          - gene:
              id: SecretoryE2
              source: uniprot
    - spacer: 30
    - cistron:
        label: SecretoryE3
        expression: medium
        fused: false
        chain:
          - tag: AmyQ
          - gene:
              id: SecretoryE3
              source: uniprot
    - spacer: 30
    - cistron:
        label: SecretoryE4
        expression: medium
        fused: false
        chain:
          - tag: AmyQ
          - gene:
              id: SecretoryE4
              source: uniprot
    - terminator: rrnB_T1