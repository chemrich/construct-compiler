construct:
  name: "high_yield_five_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: HighYieldE1
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE2
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE3
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE4
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE5
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
