construct:
  name: "HighYield_Five_Enzyme_Operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: E1
        expression: high
        chain:
          - gene:
              id: HighYieldE1
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: E2
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE2
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: E3
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE3
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: E4
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE4
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: E5
        expression: high
        fused: false
        chain:
          - gene:
              id: HighYieldE5
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1