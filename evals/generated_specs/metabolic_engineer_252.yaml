construct:
  name: "metabolic_pathway_four_enzyme_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: InitialStepA
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: InitialStepA
              source: uniprot

    - spacer: 25

    - cistron:
        label: MidStepB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: MidStepB
              source: uniprot

    - spacer: 25

    - cistron:
        label: MidStepC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: MidStepC
              source: uniprot

    - spacer: 25

    - cistron:
        label: FinalStepD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: FinalStepD
              source: uniprot

    - terminator: rrnB_T1
