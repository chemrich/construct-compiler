construct:
  name: "E_coli_toxin_mitigation_operon"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: InputE
        expression: high
        chain:
          - gene:
              id: InputE
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ToxE1
        expression: very_high
        fused: false
        chain:
          - gene:
              id: ToxE1
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ToxE2
        expression: very_high
        fused: false
        chain:
          - gene:
              id: ToxE2
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ProdE1
        expression: high
        fused: false
        chain:
          - gene:
              id: ProdE1
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ProdE2
        expression: high
        fused: false
        chain:
          - gene:
              id: ProdE2
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
