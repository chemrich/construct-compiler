construct:
  name: "four_enzyme_pathway_arabinose_inducible"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: PurifE1
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PurifE1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: PurifE2
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PurifE2
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: PurifE3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PurifE3
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: PurifE4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PurifE4
              source: uniprot
    
    - terminator: rrnB_T1
