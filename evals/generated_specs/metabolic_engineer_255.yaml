construct:
  name: "robust_six_enzyme_operon_putida"
  host: e_coli  # Pseudomonas putida not in schema; substituted with e_coli for Gram-negative expression
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strong constitutive promoter (Anderson Library)
    - cistron:
        label: robust_e1
        expression: high
        gene:
          id: RobustE1
          source: uniprot
    - spacer: 30
    - cistron:
        label: robust_e2
        expression: high
        fused: false
        gene:
          id: RobustE2
          source: uniprot
    - spacer: 30
    - cistron:
        label: robust_e3
        expression: high
        fused: false
        gene:
          id: RobustE3
          source: uniprot
    - spacer: 30
    - cistron:
        label: robust_e4
        expression: high
        fused: false
        gene:
          id: RobustE4
          source: uniprot
    - spacer: 30
    - cistron:
        label: robust_e5
        expression: high
        fused: false
        gene:
          id: RobustE5
          source: uniprot
    - spacer: 30
    - cistron:
        label: robust_e6
        expression: high
        fused: false
        gene:
          id: RobustE6
          source: uniprot
    - terminator: BBa_B0015