construct:
  name: thermoinducible_five_enzyme_operon
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_L_lambda_CI857
      # Temperature-sensitive lambda P_L promoter under CI857 repressor control
      # Repressed at 30°C (permissive for CI857), induced at 42°C (CI857 inactivated)

    - cistron:
        label: ThermoE1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE1
              source: uniprot

    - spacer: 25

    - cistron:
        label: ThermoE2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE2
              source: uniprot

    - spacer: 25

    - cistron:
        label: ThermoE3
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE3
              source: uniprot

    - spacer: 25

    - cistron:
        label: ThermoE4
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE4
              source: uniprot

    - spacer: 25

    - cistron:
        label: ThermoE5
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE5
              source: uniprot

    - terminator: rrnB_T1
