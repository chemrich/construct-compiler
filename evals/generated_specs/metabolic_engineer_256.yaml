construct:
  name: "thermo_enzyme_operon_e1_e5"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lambda_PL  # Temperature-sensitive promoter regulated by CI857
    - cistron:
        label: thermo_e1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE1
              source: uniprot
    - spacer: 30
    - cistron:
        label: thermo_e2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE2
              source: uniprot
    - spacer: 30
    - cistron:
        label: thermo_e3
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE3
              source: uniprot
    - spacer: 30
    - cistron:
        label: thermo_e4
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE4
              source: uniprot
    - spacer: 30
    - cistron:
        label: thermo_e5
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ThermoE5
              source: uniprot
    - terminator: rrnB_T1