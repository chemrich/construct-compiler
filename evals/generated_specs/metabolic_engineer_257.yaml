construct:
  name: "flux_control_operon_tunable"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: FluxE1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: FluxE1
              source: uniprot

    - spacer: 25

    - cistron:
        label: FluxE2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: FluxE2
              source: uniprot
        rbs_tuning: true

    - spacer: 25

    - cistron:
        label: FluxE3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: FluxE3
              source: uniprot
        rbs_tuning: true

    - spacer: 25

    - cistron:
        label: FluxE4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: FluxE4
              source: uniprot

    - terminator: rrnB_T1
