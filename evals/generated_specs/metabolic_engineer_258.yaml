construct:
  name: "five_enzyme_soluble_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: SolubleE1
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: SolubleE1
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: SolubleE2
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE2
              source: uniprot
          - solubility_tag: GST
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: SolubleE3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - gene:
              id: SolubleE3
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: SolubleE4
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE4
              source: uniprot
          - solubility_tag: MBP
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: SolubleE5
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE5
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
