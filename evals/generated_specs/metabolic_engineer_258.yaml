construct:
  name: "five_enzyme_solubility_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: SolubleE1
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE2
              source: uniprot
          - solubility_tag: MBP
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP
          - gene:
              id: SolubleE3
              source: uniprot
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE4
              source: uniprot
          - solubility_tag: MBP
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - gene:
              id: SolubleE5
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1