construct:
  name: "proof_of_concept_pathway_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: ProofE1_E2_fusion
        expression: high
        chain:
          - gene:
              id: ProofE1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProofE2
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ProofE3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProofE3
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ProofE4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProofE4
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ProofE5
        expression: medium
        fused: false
        chain:
          - gene:
              id: ProofE5
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II
    
    - spacer: 25
    
    - cistron:
        label: ProofE6_GFP
        expression: medium
        fused: false
        chain:
          - gene:
              id: ProofE6
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
