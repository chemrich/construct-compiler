    - spacer: 25
    
    - cistron:
        label: enzyme_2
        expression: low
        fused: false
        gene:
          id: arabinosidase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3
        expression: low
        fused: false
        gene:
          id: xylose_isomerase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_4
        expression: low
        fused: false
        gene:
          id: sugar_phosphatase
          source: uniprot
    
    - terminator: rrnB_T1
