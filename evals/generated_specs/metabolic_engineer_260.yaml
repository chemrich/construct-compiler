construct:
  name: "mevalonate_pathway_operon_IPP_production"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: tac

    - cistron:
        label: mvaE
        expression: high
        gene:
          id: mvaE
          source: uniprot

    - spacer: 25

    - cistron:
        label: mvaS
        expression: high
        gene:
          id: mvaS
          source: uniprot

    - spacer: 25

    - cistron:
        label: ERG12
        expression: medium
        gene:
          id: ERG12
          source: uniprot

    - spacer: 25

    - cistron:
        label: ERG8
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: ERG8
              source: uniprot

    - terminator: rrnB_T1
