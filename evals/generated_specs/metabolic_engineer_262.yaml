construct:
  name: "aromatic_precursor_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: DAHP_synthase
        expression: high
        gene:
          id: aroG_fbr
          source: uniprot

    - spacer: 25

    - cistron:
        label: chorismate_mutase
        expression: high
        fused: false
        gene:
          id: pheA
          source: uniprot

    - spacer: 25

    - cistron:
        label: prephenate_dehydratase
        expression: high
        fused: false
        gene:
          id: pheH
          source: uniprot

    - spacer: 25

    - cistron:
        label: transaminase
        expression: high
        fused: false
        gene:
          id: tyrB
          source: uniprot

    - spacer: 25

    - cistron:
        label: decarboxylase
        expression: high
        fused: false
        gene:
          id: aromatic_decarboxylase
          source: uniprot

    - terminator: rrnB_T1
