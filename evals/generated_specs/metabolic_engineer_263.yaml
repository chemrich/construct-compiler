construct:
  name: "fatty_alcohol_biosynthesis_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: fatty_acyl_CoA_reductase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: fatty_acyl_CoA_reductase
              source: uniprot
        rbs_strength: strong

    - spacer: 25

    - cistron:
        label: alcohol_dehydrogenase
        expression: medium
        fused: false
        gene:
          id: alcohol_dehydrogenase
          source: uniprot
        rbs_strength: medium

    - spacer: 25

    - cistron:
        label: thioesterase
        expression: medium
        fused: false
        gene:
          id: thioesterase
          source: uniprot
        rbs_strength: medium

    - spacer: 25

    - cistron:
        label: acetyl_CoA_carboxylase
        expression: low
        fused: false
        gene:
          id: acetyl_CoA_carboxylase
          source: uniprot
        rbs_strength: weak

    - terminator: rrnB_T1
