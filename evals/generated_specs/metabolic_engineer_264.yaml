construct:
  name: "CO2_fixation_operon_E_coli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides strong constitutive expression and is active under anaerobic conditions
      # inducible with arabinose for additional control if needed

    - cistron:
        label: rubisco_modified
        expression: high
        gene:
          id: P09738
          source: uniprot
        # Modified Rubisco from Rhodospirillum rubrum for improved CO2 fixation

    - spacer: 30

    - cistron:
        label: phosphoribulokinase
        expression: high
        gene:
          id: P09739
          source: uniprot
        # PRK catalyzes ribulose-5-P phosphorylation

    - spacer: 30

    - cistron:
        label: sedoheptulose_1_7_bisphosphatase
        expression: high
        gene:
          id: P09740
          source: uniprot
        # SBPase for Calvin cycle intermediate metabolism

    - spacer: 30

    - cistron:
        label: fructose_1_6_bisphosphatase
        expression: high
        gene:
          id: P09741
          source: uniprot
        # FBPase regenerates ribulose-1,5-bisphosphate

    - spacer: 30

    - cistron:
        label: transketolase
        expression: high
        gene:
          id: P09742
          source: uniprot
        # TK catalyzes carbon skeleton rearrangement in the Calvin cycle

    - terminator: rrnB_T1
