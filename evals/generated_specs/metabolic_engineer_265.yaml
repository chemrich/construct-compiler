construct:
  name: NRPS_antibiotic_precursor_operon
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: rhaBAD
    
    - cistron:
        label: NRPS_loading_module
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: nrps_adenylation_loading
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: NRPS_elongation_module_1
        expression: high
        fused: false
        gene:
          id: nrps_condensation_adenylation_1
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: NRPS_elongation_module_2
        expression: high
        fused: false
        gene:
          id: nrps_condensation_adenylation_2
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: NRPS_elongation_module_3
        expression: high
        fused: false
        gene:
          id: nrps_condensation_adenylation_3
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: NRPS_elongation_module_4
        expression: high
        fused: false
        gene:
          id: nrps_condensation_adenylation_4
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: NRPS_thioesterase_release
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: nrps_thioesterase
              source: uniprot
    
    - terminator: rrnB_T1
