construct:
  name: "butanol_production_operon_Cac"
  host: bacillus
  # Note: C. acetobutylicum is not in standard host list; using bacillus as closest anaerobic producer organism

  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides constitutive-like expression suitable for anaerobic conditions in Clostridium

    - cistron:
        label: thiolase
        expression: high
        gene:
          id: thl
          source: uniprot

    - cistron:
        label: HBD
        expression: high
        fused: false
        gene:
          id: hbd
          source: uniprot

    - cistron:
        label: CR
        expression: medium
        fused: false
        gene:
          id: crt
          source: uniprot

    - cistron:
        label: ADH
        expression: medium
        fused: false
        gene:
          id: adh
          source: uniprot

    - terminator: rrnB_T1
      # rrnB_T1 provides robust transcription termination in anaerobic conditions
