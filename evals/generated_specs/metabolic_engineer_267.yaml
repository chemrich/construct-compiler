construct:
  name: "vitamin_B_operon_E_coli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # Strong constitutive promoter for high-level expression

    - cistron:
        label: gtp_cyclohydrolase_I
        expression: high
        gene:
          id: gch1
          source: uniprot

    - cistron:
        label: ptp_synthase
        expression: high
        gene:
          id: ptps
          source: uniprot

    - cistron:
        label: dhna_kinase
        expression: high
        gene:
          id: rbsk
          source: uniprot

    - cistron:
        label: lumazine_synthase
        expression: high
        gene:
          id: ribh
          source: uniprot

    - cistron:
        label: riboflavin_synthase
        expression: high
        chain:
          - gene:
              id: riba
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
