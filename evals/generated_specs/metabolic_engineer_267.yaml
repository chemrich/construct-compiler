construct:
  name: "vitamin_b_precursor_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strong constitutive promoter for high-level expression
    - cistron:
        label: gtp_cyclohydrolase_i
        expression: high
        gene:
          id: "P0A6T5"
          source: "uniprot"
    - spacer: 30
    - cistron:
        label: ptp_synthase
        expression: high
        fused: false
        gene:
          id: "P0A9L0"
          source: "uniprot"
    - spacer: 30
    - cistron:
        label: dhna_kinase
        expression: high
        fused: false
        gene:
          id: "P0AB89"
          source: "uniprot"
    - spacer: 30
    - cistron:
        label: lumazine_synthase
        expression: high
        fused: false
        gene:
          id: "P0A720"
          source: "uniprot"
    - spacer: 30
    - cistron:
        label: riboflavin_synthase
        expression: high
        fused: false
        chain:
          - gene:
              id: "P0A722"
              source: "uniprot"
          - tag: 6xHis
    - terminator: BBa_B0015