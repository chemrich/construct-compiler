construct:
  name: "lignin_depolymerization_operon_ecoli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: laccase
        expression: high
        chain:
          - tag: periplasmic_signal_peptide
          - gene:
              id: laccase
              source: uniprot

    - spacer: 25

    - cistron:
        label: versatile_peroxidase
        expression: high
        fused: false
        chain:
          - tag: periplasmic_signal_peptide
          - gene:
              id: versatile_peroxidase
              source: uniprot

    - spacer: 25

    - cistron:
        label: manganese_peroxidase
        expression: high
        fused: false
        chain:
          - tag: periplasmic_signal_peptide
          - gene:
              id: manganese_peroxidase
              source: uniprot

    - spacer: 25

    - cistron:
        label: cellobiose_dehydrogenase
        expression: medium
        fused: false
        chain:
          - tag: periplasmic_signal_peptide
          - gene:
              id: cellobiose_dehydrogenase
              source: uniprot

    - spacer: 25

    - cistron:
        label: feruloyl_esterase
        expression: medium
        fused: false
        gene:
          id: feruloyl_esterase
          source: uniprot

    - spacer: 25

    - cistron:
        label: esterase
        expression: medium
        fused: false
        gene:
          id: esterase
          source: uniprot

    - terminator: rrnB_T1
