construct:
  name: "trp_analog_biosynthesis_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: dahp_synthase_fbr
        expression: high
        gene:
          id: aroG_fbr
          source: uniprot

    - spacer: 25

    - cistron:
        label: chorismate_mutase
        expression: high
        gene:
          id: aroH
          source: uniprot

    - spacer: 25

    - cistron:
        label: anthranilate_synthase
        expression: medium
        gene:
          id: trpE
          source: uniprot

    - spacer: 25

    - cistron:
        label: indole3gp_synthase
        expression: medium
        gene:
          id: trpC
          source: uniprot

    - spacer: 25

    - cistron:
        label: trp_synthase_variant
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: trpB_variant
              source: uniprot

    - terminator: rrnB_T1
