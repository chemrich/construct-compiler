construct:
  name: "QS_regulated_biodegradation_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lux_pR  # QS-responsive promoter (LuxR-activated)

    - cistron:
        label: enzyme1_GFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme1_biodegradation
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        gene:
          id: enzyme2_biodegradation
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        gene:
          id: enzyme3_biodegradation
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        gene:
          id: enzyme4_biodegradation
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme5
        expression: high
        fused: false
        gene:
          id: enzyme5_biodegradation
          source: uniprot

    - terminator: rrnB_T1
