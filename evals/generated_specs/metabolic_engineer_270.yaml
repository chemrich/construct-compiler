construct:
  name: synechocystis_cyanophycin_biosynthesis_operon
  host: algae

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: cyanophycin_synthetase
        expression: very_high
        chain:
          - tag: 6xHis
          - gene:
              id: cphA
              source: uniprot

    - spacer: 25

    - cistron:
        label: carbamoyl_phosphate_synthetase
        expression: very_high
        fused: false
        gene:
          id: carA
          source: uniprot

    - spacer: 25

    - cistron:
        label: aspartate_kinase
        expression: very_high
        fused: false
        gene:
          id: ask
          source: uniprot

    - spacer: 25

    - cistron:
        label: glutamate_synthase
        expression: very_high
        fused: false
        gene:
          id: gltD
          source: uniprot

    - terminator: rrnB_T1
