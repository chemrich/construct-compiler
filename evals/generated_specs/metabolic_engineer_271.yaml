construct:
  name: "pseudomonas_xenobiotic_degradation_operon"
  host: pseudomonas_putida_kt2440

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: Pm
      inducible: true
      inducer: m_toluate

    - cistron:
        label: dioxygenase
        expression: high
        rbs_strength: strong
        gene:
          id: todC1
          source: uniprot

    - spacer: 25

    - cistron:
        label: ring_cleavage_dioxygenase
        expression: high
        rbs_strength: strong
        gene:
          id: todE
          source: uniprot

    - spacer: 25

    - cistron:
        label: hydrolase
        expression: high
        rbs_strength: medium
        gene:
          id: todF
          source: uniprot

    - spacer: 25

    - cistron:
        label: reductase
        expression: medium
        rbs_strength: medium
        gene:
          id: todG
          source: uniprot

    - spacer: 25

    - cistron:
        label: accessory_enzyme_1
        expression: medium
        rbs_strength: medium
        gene:
          id: todH
          source: uniprot

    - spacer: 25

    - cistron:
        label: accessory_enzyme_2
        expression: low
        rbs_strength: weak
        gene:
          id: todI
          source: uniprot

    - terminator: rrnB_T1
