construct:
  name: "bacillus_cellulose_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_veg  # strong, constitutive Bacillus promoter

    - cistron:
        label: endoglucanase
        expression: high
        chain:
          - secretion_signal: amyE_signal  # Bacillus secretion signal
          - gene:
              id: endoglucanase_cel8A
              source: uniprot

    - spacer: 25

    - cistron:
        label: exoglucanase
        expression: high
        chain:
          - secretion_signal: amyE_signal
          - gene:
              id: exoglucanase_cel6A
              source: uniprot

    - spacer: 25

    - cistron:
        label: beta_glucosidase
        expression: high
        chain:
          - secretion_signal: amyE_signal
          - gene:
              id: beta_glucosidase_bgl1A
              source: uniprot

    - spacer: 25

    - cistron:
        label: xylanase
        expression: high
        chain:
          - secretion_signal: amyE_signal
          - gene:
              id: xylanase_xyn10A
              source: uniprot

    - spacer: 25

    - cistron:
        label: esterase
        expression: high
        chain:
          - secretion_signal: amyE_signal
          - gene:
              id: esterase_cxe1
              source: uniprot

    - terminator: rrnB_T1
