construct:
  name: "engineered_glycolytic_bypass_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: xylose_isomerase
        expression: high
        fused: false
        gene:
          id: xylA
          source: uniprot

    - spacer: 25

    - cistron:
        label: xylulokinase
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylB
              source: uniprot

    - spacer: 25

    - cistron:
        label: transaldolase
        expression: medium
        fused: false
        gene:
          id: tal
          source: uniprot

    - spacer: 25

    - cistron:
        label: transketolase
        expression: low
        fused: false
        gene:
          id: tkt
          source: uniprot

    - terminator: rrnB_T1
