construct:
  name: "E_coli_PHA_operon_high_yield"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: beta_ketothiolase
        expression: high
        gene:
          id: fadA
          source: uniprot

    - spacer: 25

    - cistron:
        label: acetoacetyl_CoA_reductase
        expression: high
        gene:
          id: atoB
          source: uniprot

    - spacer: 25

    - cistron:
        label: precursor_enzyme_1
        expression: high
        gene:
          id: eutE
          source: uniprot

    - spacer: 25

    - cistron:
        label: precursor_enzyme_2
        expression: high
        gene:
          id: paaI
          source: uniprot

    - spacer: 25

    - cistron:
        label: PHA_synthase
        expression: high
        chain:
          - gene:
              id: phaCAb
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
