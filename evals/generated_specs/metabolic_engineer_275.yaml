construct:
  name: "NADPH_regeneration_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: G6PD
        expression: high
        fused: false
        gene:
          id: zwf
          source: uniprot

    - spacer: 25

    - cistron:
        label: 6PGD
        expression: high
        fused: false
        gene:
          id: gnd
          source: uniprot

    - spacer: 25

    - cistron:
        label: malic_enzyme
        expression: high
        fused: false
        gene:
          id: maeA
          source: uniprot

    - spacer: 25

    - cistron:
        label: transhydrogenase
        expression: high
        fused: false
        gene:
          id: pntA
          source: uniprot

    - terminator: rrnB_T1
