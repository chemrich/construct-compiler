construct:
  name: "phenylpropanoid_pathway_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: PAL
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PAL
              source: uniprot

    - spacer: 25

    - cistron:
        label: C4H
        expression: high
        fused: false
        gene:
          id: C4H
          source: uniprot

    - spacer: 25

    - cistron:
        label: 4CL
        expression: high
        fused: false
        gene:
          id: 4CL
          source: uniprot

    - spacer: 25

    - cistron:
        label: CHS
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CHS
              source: uniprot

    - spacer: 25

    - cistron:
        label: CHI
        expression: high
        fused: false
        gene:
          id: CHI
          source: uniprot

    - spacer: 25

    - cistron:
        label: F3H
        expression: high
        fused: false
        gene:
          id: F3H
          source: uniprot

    - terminator: rrnB_T1
