construct:
  name: artemisinin_precursor_amorphadiene_operon
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: MvaE
        expression: high
        gene:
          id: MvaE
          source: uniprot

    - cistron:
        label: MvaS
        expression: high
        gene:
          id: MvaS
          source: uniprot

    - cistron:
        label: Idi
        expression: high
        gene:
          id: Idi
          source: uniprot

    - cistron:
        label: FPS
        expression: high
        gene:
          id: FPS
          source: uniprot

    - cistron:
        label: ADS
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ADS
              source: uniprot

    - terminator: rrnB_T1
