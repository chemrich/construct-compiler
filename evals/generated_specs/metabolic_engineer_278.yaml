construct:
  name: pyruvate_production_operon
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: pyruvate_carboxylase
        expression: high
        gene:
          id: pyc
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: malic_enzyme
        expression: high
        gene:
          id: maeA
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: malate_dehydrogenase
        expression: medium
        gene:
          id: mdh
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: phosphotransacetylase
        expression: medium
        gene:
          id: pta
          source: uniprot
    
    - terminator: rrnB_T1
