construct:
  name: "NRPS_mini_module_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter for balanced NRPS domain expression

    - cistron:
        label: adenylation_domain
        expression: high
        fused: false
        gene:
          id: NRPS_adenylation
          source: uniprot

    - spacer: 25

    - cistron:
        label: thiolation_domain
        expression: high
        fused: false
        gene:
          id: NRPS_thiolation
          source: uniprot

    - spacer: 25

    - cistron:
        label: condensation_domain
        expression: high
        fused: false
        gene:
          id: NRPS_condensation
          source: uniprot

    - spacer: 25

    - cistron:
        label: epimerase_domain
        expression: high
        fused: false
        gene:
          id: NRPS_epimerase
          source: uniprot

    - spacer: 25

    - cistron:
        label: reductase_domain
        expression: high
        fused: false
        gene:
          id: NRPS_reductase
          source: uniprot

    - spacer: 25

    - cistron:
        label: thioesterase_release
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: NRPS_thioesterase
              source: uniprot

    - terminator: rrnB_T1
