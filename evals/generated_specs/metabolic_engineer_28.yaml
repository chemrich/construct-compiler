          - gene:
              id: HMGCS1
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: HMGR
        expression: high
        chain:
          - gene:
              id: HMGCR
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: MK
        expression: high
        chain:
          - gene:
              id: MVK
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: PMK
        expression: high
        chain:
          - gene:
              id: PMVK
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: DXPS
        expression: high
        chain:
          - gene:
              id: DXPS
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
