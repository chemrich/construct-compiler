construct:
  name: "constitutive_xylose_utilization_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106  # Moderate constitutive promoter for balanced expression
    - cistron:
        label: xylA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: xylA
              source: uniprot
    - spacer: 30
    - cistron:
        label: xylB
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylB
              source: uniprot
    - spacer: 30
    - cistron:
        label: xylC
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylC
              source: uniprot
    - spacer: 30
    - cistron:
        label: xylD
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylD
              source: uniprot
    - terminator: rrnB_T1