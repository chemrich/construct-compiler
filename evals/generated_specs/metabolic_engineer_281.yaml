construct:
  name: ergosterol_pathway_five_enzyme_yeast
  host: yeast

  backbone:
    resistance: G418  # nourseothricin for yeast integration
    ori: 2micron      # 2micron for yeast episomal, or use integration locus (HO)
    source: addgene
    integration_locus: HO

  cassette:
    - promoter: GAL1

    - cistron:
        label: erg1
        expression: medium
        chain:
          - gene:
              id: ERG1
              source: uniprot

    - spacer: 25

    - cistron:
        label: erg3
        expression: medium
        fused: false
        chain:
          - gene:
              id: ERG3
              source: uniprot

    - spacer: 25

    - cistron:
        label: erg6
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ERG6
              source: uniprot

    - spacer: 25

    - cistron:
        label: erg9
        expression: medium
        fused: false
        chain:
          - gene:
              id: ERG9
              source: uniprot

    - spacer: 25

    - cistron:
        label: erg11
        expression: medium
        fused: false
        chain:
          - gene:
              id: ERG11
              source: uniprot

    - terminator: CYC1
