construct:
  name: bacillus_antibiotic_precursor_operon
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PglnA  # Strong constitutive promoter for Bacillus subtilis

    - cistron:
        label: sntA
        expression: high
        gene:
          id: sntA
          source: uniprot

    - cistron:
        label: sntB
        expression: high
        fused: false
        gene:
          id: sntB
          source: uniprot

    - cistron:
        label: sntC
        expression: high
        fused: false
        gene:
          id: sntC
          source: uniprot

    - cistron:
        label: sntD
        expression: high
        fused: false
        gene:
          id: sntD
          source: uniprot

    - cistron:
        label: sntE
        expression: high
        fused: false
        gene:
          id: sntE
          source: uniprot

    - cistron:
        label: sntF
        expression: high
        fused: false
        chain:
          - gene:
              id: sntF
              source: uniprot
          - solubility_tag: MBP  # Enhanced stability under osmotic stress

    - terminator: rrnB_T1
