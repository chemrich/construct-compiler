construct:
  name: "lux_operon_arabinose_tunable"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: luxA
        expression: high
        gene:
          id: luxA
          source: uniprot

    - spacer: 25

    - cistron:
        label: luxB
        expression: high
        gene:
          id: luxB
          source: uniprot

    - spacer: 25

    - cistron:
        label: luxC
        expression: high
        chain:
          - gene:
              id: luxC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: luxD
        expression: high
        gene:
          id: luxD
          source: uniprot

    - spacer: 25

    - cistron:
        label: luxE
        expression: high
        gene:
          id: luxE
          source: uniprot

    - terminator: rrnB_T1
