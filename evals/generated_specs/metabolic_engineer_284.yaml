construct:
  name: "multi_enzyme_cytoplasmic_expression_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: hsaA
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: hsaA
              source: uniprot

    - spacer: 30

    - cistron:
        label: hsaB
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: hsaB
              source: uniprot

    - spacer: 30

    - cistron:
        label: hsaC
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: hsaC
              source: uniprot

    - spacer: 30

    - cistron:
        label: hsaD
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: hsaD
              source: uniprot

    - terminator: rrnB_T1
