construct:
  name: "arginine_biosynthesis_pathway_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # strong constitutive promoter (BioBrick)
    
    - cistron:
        label: arg1
        expression: high
        gene:
          id: arg1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: arg2
        expression: low
        gene:
          id: arg2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: arg3
        expression: medium
        gene:
          id: arg3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: arg4
        expression: very_low
        chain:
          - gene:
              id: arg4
              source: uniprot
          - tag: LVA  # C-terminal LVA degradation tag for rapid turnover
    
    - spacer: 25
    
    - cistron:
        label: arg5
        expression: low
        gene:
          id: arg5
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: arg6
        expression: high
        gene:
          id: arg6
          source: uniprot
    
    - terminator: rrnB_T1
