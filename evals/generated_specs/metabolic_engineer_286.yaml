construct:
  name: "yeast_secreted_cellulase_quartet"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: cel1_secreted
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - secretion_signal: alpha_factor
          - gene:
              id: cel1
              source: uniprot

    - spacer: 25

    - cistron:
        label: cel2_secreted
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - secretion_signal: alpha_factor
          - gene:
              id: cel2
              source: uniprot

    - spacer: 25

    - cistron:
        label: cel3_secreted
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - secretion_signal: alpha_factor
          - gene:
              id: cel3
              source: uniprot

    - spacer: 25

    - cistron:
        label: cel4_secreted
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - secretion_signal: alpha_factor
          - gene:
              id: cel4
              source: uniprot

    - terminator: CYC1_poly_A
