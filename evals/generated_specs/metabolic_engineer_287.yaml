construct:
  name: "synechocystis_carbon_fixation_cluster"
  host: cyanobacterium
  
  backbone:
    resistance: kanamycin
    ori: pSC101
    source: addgene

  cassette:
    - promoter: PpsbA  # Light-inducible promoter from photosystem II

    - cistron:
        label: rubisco_large
        expression: high
        chain:
          - transit_peptide: Synechocystis_chloroplast_targeting
          - gene:
              id: rubisco_large
              source: uniprot

    - spacer: 25

    - cistron:
        label: rubisco_small
        expression: high
        chain:
          - transit_peptide: Synechocystis_chloroplast_targeting
          - gene:
              id: rubisco_small
              source: uniprot

    - spacer: 25

    - cistron:
        label: prkA
        expression: high
        chain:
          - transit_peptide: Synechocystis_chloroplast_targeting
          - gene:
              id: prkA
              source: uniprot

    - spacer: 25

    - cistron:
        label: pgi
        expression: high
        chain:
          - transit_peptide: Synechocystis_chloroplast_targeting
          - gene:
              id: pgi
              source: uniprot

    - spacer: 25

    - cistron:
        label: fba
        expression: high
        chain:
          - transit_peptide: Synechocystis_chloroplast_targeting
          - gene:
              id: fba
              source: uniprot

    - terminator: rrnB_T1
