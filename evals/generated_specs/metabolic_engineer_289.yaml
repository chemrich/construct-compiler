construct:
  name: "pichia_pastoris_lipase_multicistronic_cassette"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: lipase_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lip1
              source: uniprot
    - spacer: 30
    - cistron:
        label: lipase_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: lip2
              source: uniprot
    - spacer: 30
    - cistron:
        label: lipase_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: lip3
              source: uniprot
    - spacer: 30
    - cistron:
        label: lipase_4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: lip4
              source: uniprot
    - terminator: AOX1