construct:
  name: "pichia_pastoris_lipase_quartet"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lip1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lip1
              source: uniprot

    - spacer: 30

    - cistron:
        label: lip2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lip2
              source: uniprot

    - spacer: 30

    - cistron:
        label: lip3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lip3
              source: uniprot

    - spacer: 30

    - cistron:
        label: lip4
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lip4
              source: uniprot

    - terminator: rrnB_T1
