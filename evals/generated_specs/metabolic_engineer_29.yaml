construct:
  name: "arabinose_inducible_4enzyme_cofactor_pathway"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: enzyme1
        expression: high
        gene:
          id: thrA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme2
        expression: high
        gene:
          id: thrB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme3
        expression: high
        gene:
          id: thrC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme4
        expression: high
        chain:
          - gene:
              id: thrD
              source: uniprot
          - degradation_tag: LVA  # C-terminal LVA tag for rapid turnover
    
    - terminator: rrnB_T1
