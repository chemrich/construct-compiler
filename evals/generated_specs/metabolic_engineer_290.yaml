construct:
  name: "toluene_degradation_operon_putida"
  host: e_coli  # Pseudomonas putida not in schema; substituting with E. coli
  backbone:
    resistance: kanamycin
    ori: pBR322  # Standard bacterial ori
  cassette:
    - promoter: J23100  # Constitutive promoter used as proxy; schema lacks specific anoxic-responsive promoters like Pfnr
    - cistron:
        label: tolA
        expression: high
        chain:
          - gene:
              id: tolA
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: tolB
        expression: high
        fused: false
        chain:
          - gene:
              id: tolB
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: tolC
        expression: high
        fused: false
        chain:
          - gene:
              id: tolC
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: tolD
        expression: high
        fused: false
        chain:
          - gene:
              id: tolD
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: tolE
        expression: high
        fused: false
        chain:
          - gene:
              id: tolE
              source: uniprot
          - tag: Strep-II
    - terminator: BBa_B0015