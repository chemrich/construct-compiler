construct:
  name: "pseudomonas_putida_toluene_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: tolA
        expression: high
        chain:
          - gene:
              id: tolA
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: tolB
        expression: high
        fused: false
        chain:
          - gene:
              id: tolB
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: tolC
        expression: high
        fused: false
        chain:
          - gene:
              id: tolC
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: tolD
        expression: high
        fused: false
        chain:
          - gene:
              id: tolD
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: tolE
        expression: high
        fused: false
        chain:
          - gene:
              id: tolE
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
