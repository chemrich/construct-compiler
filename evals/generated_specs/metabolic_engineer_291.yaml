construct:
  name: "human_CYP1_RED1_FAD2_SULT1_with_GroEL_ES_DnaK_chaperone_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: GroEL_ES_chaperone
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: groES
              source: uniprot

    - spacer: 30

    - cistron:
        label: GroEL_chaperone
        expression: high
        fused: false
        chain:
          - gene:
              id: groEL
              source: uniprot

    - spacer: 30

    - cistron:
        label: DnaK_chaperone
        expression: high
        fused: false
        chain:
          - gene:
              id: dnaK
              source: uniprot

    - spacer: 30

    - cistron:
        label: DnaJ_cochaperone
        expression: high
        fused: false
        chain:
          - gene:
              id: dnaJ
              source: uniprot

    - spacer: 30

    - cistron:
        label: GrpE_nucleotide_exchange
        expression: high
        fused: false
        chain:
          - gene:
              id: grpE
              source: uniprot

    - spacer: 30

    - cistron:
        label: CYP1_human
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: P04798
              source: uniprot

    - spacer: 30

    - cistron:
        label: RED1_human
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: GST
          - gene:
              id: O94829
              source: uniprot

    - spacer: 30

    - cistron:
        label: FAD2_human
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: Q02537
              source: uniprot

    - spacer: 30

    - cistron:
        label: SULT1_human
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - gene:
              id: P37292
              source: uniprot

    - terminator: rrnB_T1
