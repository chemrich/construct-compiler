construct:
  name: "yeast_peroxisomal_fatty_acid_enzymes_tet_on"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: tTA_tetracycline_responsive
      comment: "Tetracycline-inducible (Tet-On) promoter for tight control in S. cerevisiae"

    - cistron:
        label: fatA
        expression: medium
        chain:
          - gene:
              id: fatA
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: fatB
        expression: medium
        fused: false
        chain:
          - gene:
              id: fatB
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: fatC
        expression: medium
        fused: false
        chain:
          - gene:
              id: fatC
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: fatD
        expression: medium
        fused: false
        chain:
          - gene:
              id: fatD
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: fatE
        expression: medium
        fused: false
        chain:
          - gene:
              id: fatE
              source: uniprot
          - tag: PTS1

    - spacer: 25

    - cistron:
        label: fatF
        expression: medium
        fused: false
        chain:
          - gene:
              id: fatF
              source: uniprot
