construct:
  name: "E_coli_terpene_biosynthesis_pentacistronic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: terp_synth_fusion_1_2_3
        expression: high
        chain:
          - gene:
              id: terp_synth1
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: terp_synth2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: terp_synth3
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: terp_synth4
        expression: high
        fused: false
        chain:
          - gene:
              id: terp_synth4
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: terp_synth5
        expression: high
        fused: false
        chain:
          - gene:
              id: terp_synth5
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
