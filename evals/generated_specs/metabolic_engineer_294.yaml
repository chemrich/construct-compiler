construct:
  name: "Liver_Specific_Inducible_mGlu_Pathway"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: "TRE-Albumin" # Dox-inducible liver-specific promoter (TRE fused to Albumin promoter)
    - cistron:
        label: "mGluA"
        expression: medium
        gene:
          id: "mGluA"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "mGluB"
        expression: medium
        fused: false
        gene:
          id: "mGluB"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "mGluC"
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: "mGluC"
              source: uniprot
    - spacer: 30
    - cistron:
        label: "mGluD"
        expression: medium
        fused: false
        gene:
          id: "mGluD"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "mGluE"
        expression: medium
        fused: false
        gene:
          id: "mGluE"
          source: uniprot
    - terminator: bGH_pA