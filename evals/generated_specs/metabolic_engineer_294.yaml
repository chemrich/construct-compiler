construct:
  name: "doxycycline_inducible_liver_albumin_5enzyme_operon"
  host: HEK293

  backbone:
    catalog_vector: "pTRE-Tight"
    resistance: ampicillin

  cassette:
    - promoter: albumin
      inducible: doxycycline

    - cistron:
        label: mGluA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mGluA
              source: uniprot

    - spacer: 30

    - cistron:
        label: mGluB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mGluB
              source: uniprot

    - spacer: 30

    - cistron:
        label: mGluC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: SUMO_protease
          - gene:
              id: mGluC
              source: uniprot

    - spacer: 30

    - cistron:
        label: mGluD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mGluD
              source: uniprot

    - spacer: 30

    - cistron:
        label: mGluE
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mGluE
              source: uniprot

    - terminator: SV40_polyA
