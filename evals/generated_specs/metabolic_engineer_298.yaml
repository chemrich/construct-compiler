construct:
  name: bacillus_bacteriocin_operon_bacABCD
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pAMβ1
    source: addgene

  cassette:
    - promoter: SP01
      # Strong, constitutive promoter from B. subtilis phage SP01

    - rbs: riboswitch_THI
      # RNA leader sequence for enhanced mRNA stability and translation initiation

    - cistron:
        label: bacA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: bacA
              source: uniprot

    - spacer: 30

    - cistron:
        label: bacB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: bacB
              source: uniprot

    - spacer: 30

    - cistron:
        label: bacC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: bacC
              source: uniprot

    - spacer: 30

    - cistron:
        label: bacD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: bacD
              source: uniprot

    - terminator: rrnB_T1
