construct:
  name: "anaerobic_pathway_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: fnr  # Fumarate and Nitrate Reduction regulator - strong anaerobic promoter
    
    - cistron:
        label: ana1_ana2_fusion
        expression: high
        chain:
          - gene:
              id: ana1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ana2
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ana3
        expression: high
        fused: false
        chain:
          - gene:
              id: ana3
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ana4
        expression: high
        fused: false
        chain:
          - gene:
              id: ana4
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: ana5
        expression: high
        fused: false
        chain:
          - gene:
              id: ana5
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
