construct:
  name: "bacillus_antibiotic_precursor_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: spoVG  # Strong constitutive Bacillus promoter

    - cistron:
        label: enzyme_1
        expression: very_high
        gene:
          id: ORF1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: very_high
        fused: false
        gene:
          id: ORF2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: very_high
        fused: false
        gene:
          id: ORF3
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: very_high
        fused: false
        gene:
          id: ORF4
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: very_high
        fused: false
        gene:
          id: ORF5
          source: uniprot

    - terminator: rrnB_T1
