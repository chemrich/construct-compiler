construct:
  name: "e_coli_nbutanol_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: thlA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: thlA
              source: uniprot

    - spacer: 25

    - cistron:
        label: hbd
        expression: high
        fused: false
        gene:
          id: hbd
          source: uniprot

    - spacer: 25

    - cistron:
        label: crt
        expression: high
        fused: false
        gene:
          id: crt
          source: uniprot

    - spacer: 25

    - cistron:
        label: bch
        expression: high
        fused: false
        gene:
          id: bch
          source: uniprot

    - spacer: 25

    - cistron:
        label: adhE2
        expression: high
        fused: false
        gene:
          id: adhE2
          source: uniprot

    - spacer: 25

    - cistron:
        label: ter
        expression: high
        fused: false
        gene:
          id: ter
          source: uniprot

    - terminator: rrnB_T1
