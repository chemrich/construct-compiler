construct:
  name: "PHB_production_system_with_chaperone"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: phaA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: phaA
              source: uniprot
          - degradation_tag: LVA
    
    - spacer: 25
    
    - cistron:
        label: phaB
        expression: medium
        fused: false
        gene:
          id: phaB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: phaC
        expression: high
        fused: false
        gene:
          id: phaC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: groEL_chaperone
        expression: high
        fused: false
        gene:
          id: groEL
          source: uniprot
    
    - terminator: rrnB_T1
