construct:
  name: "E_coli_lactate_production_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: ldhA
        expression: high
        gene:
          id: ldhA
          source: uniprot

    - spacer: 25

    - cistron:
        label: pflB_inactive
        expression: high
        fused: false
        gene:
          id: pflB
          source: uniprot

    - spacer: 25

    - cistron:
        label: pykF
        expression: medium
        fused: false
        gene:
          id: pykF
          source: uniprot

    - spacer: 25

    - cistron:
        label: pfkA
        expression: medium
        fused: false
        gene:
          id: pfkA
          source: uniprot

    - terminator: rrnB_T1

    - terminator: BBa_B0015
