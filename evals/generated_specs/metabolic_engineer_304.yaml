construct:
  name: violacein_operon_P_putida
  host: pseudomonas_putida
  
  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene
  
  cassette:
    - promoter: rhamnose_inducible
    
    - cistron:
        label: vioA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: vioA
              source: uniprot
    
    - cistron:
        label: vioB
        expression: high
        fused: false
        gene:
          id: vioB
          source: uniprot
    
    - cistron:
        label: vioC
        expression: high
        fused: false
        gene:
          id: vioC
          source: uniprot
    
    - cistron:
        label: vioD
        expression: high
        fused: false
        gene:
          id: vioD
          source: uniprot
    
    - cistron:
        label: vioE
        expression: high
        fused: false
        gene:
          id: vioE
          source: uniprot
    
    - terminator: rrnB_T1
