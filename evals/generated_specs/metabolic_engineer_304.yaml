  backbone:
    resistance: kanamycin
    ori: pBBR1
    source: addgene
  cassette:
    - promoter: rhaBAD
    - cistron:
        label: vioA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P27034
              source: uniprot
    - spacer: 30
    - cistron:
        label: vioB
        expression: medium
        fused: false
        gene:
          id: P27035
          source: uniprot
    - spacer: 30
    - cistron:
        label: vioC
        expression: medium
        fused: false
        gene:
          id: P27036
          source: uniprot
    - spacer: 30
    - cistron:
        label: vioD
        expression: medium
        fused: false
        gene:
          id: P27037
          source: uniprot
    - spacer: 30
    - cistron:
        label: vioE
        expression: medium
        fused: false
        gene:
          id: P27038
          source: uniprot
    - terminator: rrnB_T1