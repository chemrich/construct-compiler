construct:
  name: "synthetic_carbon_fixation_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: crt
        expression: high
        gene:
          id: crt
          source: uniprot

    - spacer: 25

    - cistron:
        label: hpr
        expression: high
        fused: false
        gene:
          id: hpr
          source: uniprot

    - spacer: 25

    - cistron:
        label: erk
        expression: high
        fused: false
        gene:
          id: erk
          source: uniprot

    - spacer: 25

    - cistron:
        label: rpk
        expression: high
        fused: false
        gene:
          id: rpk
          source: uniprot

    - spacer: 25

    - cistron:
        label: spp
        expression: high
        fused: false
        gene:
          id: spp
          source: uniprot

    - terminator: rrnB_T1
