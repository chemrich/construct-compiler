construct:
  name: "nadph_pathway_operon_tac"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: zwf
        expression: high
        gene:
          id: zwf
          source: uniprot
    - spacer: 30
    - cistron:
        label: gnd
        expression: high
        fused: false
        gene:
          id: gnd
          source: uniprot
    - spacer: 30
    - cistron:
        label: edd
        expression: medium
        fused: false
        gene:
          id: edd
          source: uniprot
    - spacer: 30
    - cistron:
        label: eda
        expression: medium
        fused: false
        gene:
          id: eda
          source: uniprot
    - spacer: 30
    - cistron:
        label: pgl
        expression: high
        fused: false
        gene:
          id: pgl
          source: uniprot
    - spacer: 30
    - cistron:
        label: tktA
        expression: high
        fused: false
        gene:
          id: tktA
          source: uniprot
    - terminator: rrnB_T1