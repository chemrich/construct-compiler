construct:
  name: "bacillus_cellulase_cocktail_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: veg  # Strong constitutive B. subtilis promoter

    - cistron:
        label: endoglucanaseA
        expression: high
        chain:
          - signal_peptide: amyE  # Bacillus secretion signal
          - tag: FLAG
          - gene:
              id: endoglucanaseA
              source: uniprot

    - spacer: 30

    - cistron:
        label: exoglucanaseB
        expression: high
        fused: false
        chain:
          - signal_peptide: amyE
          - gene:
              id: exoglucanaseB
              source: uniprot

    - spacer: 30

    - cistron:
        label: beta_glucosidaseC
        expression: high
        fused: false
        chain:
          - signal_peptide: amyE
          - gene:
              id: beta_glucosidaseC
              source: uniprot

    - spacer: 30

    - cistron:
        label: xylanaseD
        expression: high
        fused: false
        chain:
          - signal_peptide: amyE
          - gene:
              id: xylanaseD
              source: uniprot

    - terminator: rrnB_T1
