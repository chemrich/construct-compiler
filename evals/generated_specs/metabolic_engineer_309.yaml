construct:
  name: "terpenoid_production_five_gene_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: pTet
    
    - cistron:
        label: idi
        expression: high
        chain:
          - gene:
              id: idi
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ispG
        expression: high
        chain:
          - gene:
              id: ispG
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ispH
        expression: high
        fused: false
        chain:
          - cleavage_site: T2A
          - gene:
              id: ispH
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ispI
        expression: medium
        chain:
          - gene:
              id: ispI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ispJ
        expression: medium
        chain:
          - gene:
              id: ispJ
              source: uniprot
    
    - terminator: rrnB_T1
