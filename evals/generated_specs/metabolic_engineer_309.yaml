construct:
  name: "terpenoid_production_operon_pTet"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: pTet
    - cistron:
        label: idi
        expression: high
        gene:
          id: idi
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispG
        expression: medium
        fused: false
        gene:
          id: ispG
          source: uniprot
    - spacer: 35  # Substituted 2A peptide with bacterial spacer/RBS for operon structure; 2A peptides are for eukaryotic systems
    - cistron:
        label: ispH
        expression: medium
        fused: false
        gene:
          id: ispH
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispI
        expression: medium
        fused: false
        gene:
          id: ispI
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispJ
        expression: medium
        fused: false
        gene:
          id: ispJ
          source: uniprot
    - terminator: rrnB_T1