construct:
  name: "protein_assembly_line_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: enzyme_1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: SpyTag
          - gene:
              id: enzyme_2
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        chain:
          - tag: SpyCatcher
          - gene:
              id: enzyme_3
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: medium
        gene:
          id: enzyme_4
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: medium
        gene:
          id: enzyme_5
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6
        expression: low
        gene:
          id: enzyme_6
          source: uniprot

    - terminator: rrnB_T1
