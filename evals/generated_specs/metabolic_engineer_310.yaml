construct:
  name: "E_coli_polyketide_synthase_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: PKS_module1
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PKS_module1
              source: uniprot

    - spacer: 25

    - cistron:
        label: PKS_module2
        expression: high
        fused: false
        gene:
          id: PKS_module2
          source: uniprot

    - spacer: 25

    - cistron:
        label: PKS_module3
        expression: high
        fused: false
        gene:
          id: PKS_module3
          source: uniprot

    - spacer: 25

    - cistron:
        label: PKS_module4
        expression: high
        fused: false
        gene:
          id: PKS_module4
          source: uniprot

    - spacer: 25

    - cistron:
        label: ACP
        expression: high
        fused: false
        gene:
          id: ACP
          source: uniprot

    - terminator: rrnB_T1
