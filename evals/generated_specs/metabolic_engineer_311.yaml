construct:
  name: "oxidative_stress_tolerance_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: katG  # Dual-control: OxyR-inducible stress-responsive promoter with basal constitutive activity
    - cistron:
        label: katG
        expression: high
        gene:
          id: P0A324
          source: uniprot
    - spacer: 30
    - cistron:
        label: ahpC
        expression: high
        fused: false
        gene:
          id: P0AE11
          source: uniprot
    - spacer: 30
    - cistron:
        label: ahpF
        expression: high
        fused: false
        gene:
          id: P0AE14
          source: uniprot
    - spacer: 30
    - cistron:
        label: sodA
        expression: high
        fused: false
        gene:
          id: P00448
          source: uniprot
    - spacer: 30
    - cistron:
        label: sodB
        expression: high
        fused: false
        gene:
          id: P0AGD3
          source: uniprot
    - terminator: rrnB_T1