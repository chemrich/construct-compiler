        label: ahpC
        expression: high
        fused: false
        gene:
          id: ahpC
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ahpF
        expression: high
        fused: false
        gene:
          id: ahpF
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: sodA
        expression: high
        fused: false
        gene:
          id: sodA
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: sodB
        expression: high
        fused: false
        gene:
          id: sodB
          source: uniprot
    
    - terminator: rrnB_T1
