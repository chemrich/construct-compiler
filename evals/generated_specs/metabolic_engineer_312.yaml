construct:
  name: xylitol_production_operon_ecoli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong, constitutive promoter for operon

    - cistron:
        label: xylA
        expression: high
        gene:
          id: xylA
          source: uniprot

    - spacer: 25

    - cistron:
        label: xylB
        expression: high
        fused: false
        gene:
          id: xylB
          source: uniprot

    - spacer: 25

    - cistron:
        label: yjhG
        expression: high
        fused: false
        gene:
          id: yjhG
          source: uniprot

    - spacer: 25

    - cistron:
        label: pntA
        expression: medium
        fused: false
        gene:
          id: pntA
          source: uniprot

    - spacer: 25

    - cistron:
        label: pntB
        expression: medium
        fused: false
        gene:
          id: pntB
          source: uniprot

    - terminator: rrnB_T1
