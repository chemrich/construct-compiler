construct:
  name: "e_coli_xylitol_production_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: xylA
        expression: high
        gene:
          id: xylA
          source: uniprot
    - spacer: 30
    - cistron:
        label: xylB
        expression: high
        fused: false
        gene:
          id: xylB
          source: uniprot
    - spacer: 30
    - cistron:
        label: yjhG
        expression: high
        fused: false
        gene:
          id: yjhG
          source: uniprot
    - spacer: 30
    - cistron:
        label: pntA
        expression: high
        fused: false
        gene:
          id: pntA
          source: uniprot
    - spacer: 30
    - cistron:
        label: pntB
        expression: high
        fused: false
        gene:
          id: pntB
          source: uniprot
    - terminator: rrnB_T1