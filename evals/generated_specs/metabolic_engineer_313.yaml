construct:
  name: "anaerobic_xenobiotic_degradation_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pfnr  # Oxygen-sensitive Fnr-regulated promoter
    - cistron:
        label: anaA
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: anaA
              source: uniprot
    - spacer: 30
    - cistron:
        label: anaB
        expression: medium
        fused: false
        gene:
          id: anaB
          source: uniprot
    - spacer: 30
    - cistron:
        label: anaC
        expression: medium
        fused: false
        gene:
          id: anaC
          source: uniprot
    - spacer: 30
    - cistron:
        label: anaD
        expression: medium
        fused: false
        gene:
          id: anaD
          source: uniprot
    - spacer: 30
    - cistron:
        label: anaE
        expression: medium
        fused: false
        gene:
          id: anaE
          source: uniprot
    - terminator: rrnB_T1