construct:
  name: anaerobic_xenobiotic_degradation_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: fnr  # Oxygen-sensitive, anaerobic-responsive promoter

    - cistron:
        label: anaA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: anaA
              source: uniprot

    - spacer: 25

    - cistron:
        label: anaB
        expression: high
        fused: false
        gene:
          id: anaB
          source: uniprot

    - spacer: 25

    - cistron:
        label: anaC
        expression: high
        fused: false
        gene:
          id: anaC
          source: uniprot

    - spacer: 25

    - cistron:
        label: anaD
        expression: high
        fused: false
        gene:
          id: anaD
          source: uniprot

    - spacer: 25

    - cistron:
        label: anaE
        expression: high
        fused: false
        gene:
          id: anaE
          source: uniprot

    - terminator: rrnB_T1
