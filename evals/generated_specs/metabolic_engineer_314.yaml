construct:
  name: "heavy_metal_bioreporter_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # Metal-inducible via araBAD regulation; alternative: custom metal-responsive promoter

    - cistron:
        label: MecR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MecR
              source: uniprot

    - spacer: 25

    - cistron:
        label: MecT
        expression: high
        fused: false
        gene:
          id: MecT
          source: uniprot

    - spacer: 25

    - cistron:
        label: GFP
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - spacer: 25

    - cistron:
        label: RegP
        expression: high
        fused: false
        gene:
          id: RegP
          source: uniprot

    - terminator: rrnB_T1
    - terminator: T7term
