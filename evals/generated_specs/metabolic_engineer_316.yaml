construct:
  name: "Rhodococcus_PAH_degradation_operon"
  host: bacillus
  # Note: Rhodococcus opacus is not in the standard host list; using bacillus as closest gram-positive alternative with similar expression machinery

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      # Constitutive promoter; J23100 provides stable expression analogous to native Rhodococcus promoters

    - cistron:
        label: pahA
        expression: high
        gene:
          id: pahA
          source: uniprot

    - spacer: 25

    - cistron:
        label: pahB
        expression: high
        fused: false
        gene:
          id: pahB
          source: uniprot

    - spacer: 25

    - cistron:
        label: pahC
        expression: high
        fused: false
        chain:
          - gene:
              id: pahC
              source: uniprot
          - c_tag: Strep-II

    - spacer: 25

    - cistron:
        label: pahD
        expression: high
        fused: false
        chain:
          - gene:
              id: pahD
              source: uniprot
          - c_tag: myc

    - terminator: rrnB_T1
