construct:
  name: "synthetic_quorum_sensing_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23106  # Moderately strong constitutive promoter
    - cistron:
        label: luxi_synthase
        expression: high  # Strong RBS as requested
        # Note: 5' UTR stabilizing sequence (e.g., T7g10) to be included in the leader sequence
        gene:
          id: LuxI
          source: uniprot
    - spacer: 30
    - cistron:
        label: luxr_receptor
        expression: medium
        fused: false
        gene:
          id: LuxR
          source: uniprot
    - spacer: 30
    - cistron:
        label: mcherry_reporter
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: qs_feedback_inhibitor
        expression: medium
        fused: false
        gene:
          id: QS_feedback
          source: uniprot
    - terminator: rrnB_T1