construct:
  name: synthetic_QS_module_luxI_luxR_mCherry_feedback
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106
      utr_5: RBS_strong

    - cistron:
        label: LuxI
        expression: high
        gene:
          id: luxI
          source: uniprot

    - spacer: 25

    - cistron:
        label: LuxR
        expression: medium
        fused: false
        gene:
          id: luxR
          source: uniprot

    - spacer: 25

    - cistron:
        label: mCherry
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - spacer: 25

    - cistron:
        label: QS_feedback
        expression: medium
        fused: false
        gene:
          id: QS_feedback
          source: uniprot

    - terminator: rrnB_T1
