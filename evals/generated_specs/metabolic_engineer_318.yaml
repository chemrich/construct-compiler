construct:
  name: lysine_overproduction_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: dapA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dapA
              source: uniprot

    - spacer: 25

    - cistron:
        label: dapB
        expression: high
        fused: false
        gene:
          id: dapB
          source: uniprot

    - spacer: 25

    - cistron:
        label: dapC
        expression: high
        fused: false
        gene:
          id: dapC
          source: uniprot

    - spacer: 25

    - cistron:
        label: lysA
        expression: high
        fused: false
        gene:
          id: lysA
          source: uniprot

    - spacer: 25

    - cistron:
        label: asd
        expression: high
        fused: false
        gene:
          id: asd
          source: uniprot

    - terminator: rrnB_T1
