construct:
  name: "Pseudomonas_biosurfactant_operon_BsfABCDEF"
  host: pseudomonas_aeruginosa

  backbone:
    resistance: carbenicillin
    ori: pSEX104
    source: addgene

  cassette:
    - promoter: Pp_strong
      # Strong, constitutive Pseudomonas promoter

    - cistron:
        label: BsfA
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: BsfA
              source: uniprot

    - spacer: 25

    - cistron:
        label: BsfB
        expression: high
        fused: false
        gene:
          id: BsfB
          source: uniprot

    - spacer: 25

    - cistron:
        label: BsfC
        expression: high
        fused: false
        gene:
          id: BsfC
          source: uniprot

    - spacer: 25

    - cistron:
        label: BsfD
        expression: high
        fused: false
        gene:
          id: BsfD
          source: uniprot

    - spacer: 25

    - cistron:
        label: BsfE
        expression: high
        fused: false
        gene:
          id: BsfE
          source: uniprot

    - spacer: 25

    - cistron:
        label: BsfF
        expression: high
        fused: false
        gene:
          id: BsfF
          source: uniprot

    - terminator: rrnB_T1
      # Strong Rho-independent terminator
