construct:
  name: "anaerobic_degradation_pathway_4enzymes"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: fnr  # FNR (Fumarate and Nitrate Reduction) - oxygen-responsive anaerobic promoter

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - gene:
              id: P0A9Q0  # Example: FrdA (Fumarate reductase)
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        chain:
          - gene:
              id: P0AFG8  # Example: NarG (Nitrate reductase)
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        chain:
          - gene:
              id: P69905  # Example: PdhA (Pyruvate dehydrogenase)
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        chain:
          - gene:
              id: P0A799  # Example: AdhE (Alcohol dehydrogenase)
              source: uniprot

    - terminator: rrnB_T1
