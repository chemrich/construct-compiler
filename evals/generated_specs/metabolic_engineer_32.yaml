construct:
  name: anaerobic_degradation_pathway
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: narG # narG is a native E. coli promoter highly induced under anaerobic conditions by FNR and NarL
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: anaerobic_enz1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false # Ensures independent translation with its own RBS
        chain:
          - gene:
              id: anaerobic_enz2
              source: uniprot
          - tag: FLAG # C-terminal FLAG tag for immunodetection
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: anaerobic_enz3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: anaerobic_enz4
          source: uniprot
    - terminator: rrnB_T1