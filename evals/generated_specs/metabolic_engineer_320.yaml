construct:
  name: "metabolic_pathway_four_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: P1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P1
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: P2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P2
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: P3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P3
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: P4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P4
              source: uniprot
    
    - terminator: rrnB_T1
