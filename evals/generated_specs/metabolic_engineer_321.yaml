              id: Enzyme_C
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: Enzyme_D
        expression: high
        fused: false
        chain:
          - gene:
              id: Enzyme_D
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: Enzyme_E
