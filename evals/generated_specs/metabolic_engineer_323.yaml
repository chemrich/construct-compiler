construct:
  name: "KsaA_KsaB_KsaC_KsaD_operon"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: KsaA
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: KsaA
              source: uniprot

    - spacer: 25

    - cistron:
        label: KsaB
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: KsaB
              source: uniprot

    - spacer: 25

    - cistron:
        label: KsaC
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: KsaC
              source: uniprot

    - spacer: 25

    - cistron:
        label: KsaD
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: KsaD
              source: uniprot

    - terminator: rrnB_T1
