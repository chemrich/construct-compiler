construct:
  name: "biofuel_biosynthesis_operon_klebsiella"
  host: e_coli  # Substituted Klebsiella oxytoca with e_coli as the closest model organism
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: SynE1
        expression: medium
        fused: false
        gene:
          id: SynE1
    - spacer: 30
    - cistron:
        label: SynE2
        expression: high
        fused: false
        gene:
          id: SynE2
    - spacer: 30
    - cistron:
        label: SynE3
        expression: medium
        fused: false
        gene:
          id: SynE3
    - spacer: 30
    - cistron:
        label: SynE4
        expression: medium
        fused: false
        gene:
          id: SynE4
    - spacer: 30
    - cistron:
        label: SynE5
        expression: medium
        fused: false
        gene:
          id: SynE5
    - terminator: rrnB_T1