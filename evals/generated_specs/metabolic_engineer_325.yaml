construct:
  name: six_gene_operon_hts_screening
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: J23100

    - cistron:
        label: Alpha
        expression: high
        gene:
          id: Alpha
          source: uniprot

    - spacer: 25

    - cistron:
        label: Beta
        expression: high
        fused: false
        gene:
          id: Beta
          source: uniprot

    - spacer: 25

    - cistron:
        label: Gamma
        expression: high
        fused: false
        gene:
          id: Gamma
          source: uniprot

    - spacer: 25

    - cistron:
        label: Delta
        expression: high
        fused: false
        gene:
          id: Delta
          source: uniprot

    - spacer: 25

    - cistron:
        label: Epsilon
        expression: high
        fused: false
        gene:
          id: Epsilon
          source: uniprot

    - spacer: 25

    - cistron:
        label: Zeta
        expression: high
        fused: false
        gene:
          id: Zeta
          source: uniprot

    - terminator: rrnB_T1
