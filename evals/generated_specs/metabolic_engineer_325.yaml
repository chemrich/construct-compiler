construct:
  name: "six_gene_screening_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: J23100
    - cistron:
        label: alpha_enzyme
        expression: medium
        fused: false
        gene:
          id: Alpha
    - spacer: 30
    - cistron:
        label: beta_enzyme
        expression: medium
        fused: false
        gene:
          id: Beta
    - spacer: 30
    - cistron:
        label: gamma_enzyme
        expression: medium
        fused: false
        gene:
          id: Gamma
    - spacer: 30
    - cistron:
        label: delta_enzyme
        expression: medium
        fused: false
        gene:
          id: Delta
    - spacer: 30
    - cistron:
        label: epsilon_enzyme
        expression: medium
        fused: false
        gene:
          id: Epsilon
    - spacer: 30
    - cistron:
        label: zeta_enzyme
        expression: medium
        fused: false
        gene:
          id: Zeta
    - terminator: BBa_B0015