construct:
  name: "synthetic_nif_operon_azotobacter_A_F"
  host: e_coli  # Azotobacter vinelandii is not a predefined host; E. coli is used as the closest bacterial proxy.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: PnifH  # Anaerobic, NifA-dependent promoter native to Azotobacter vinelandii nitrogenase.
    - cistron:
        label: nifA
        expression: high
        fused: false
        gene:
          id: P09121
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifB
        expression: high
        fused: false
        gene:
          id: P09122
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifC
        expression: high
        fused: false
        gene:
          id: P22036
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifD
        expression: high
        fused: false
        gene:
          id: P07328
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifE
        expression: high
        fused: false
        gene:
          id: P07329
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifF
        expression: high
        fused: false
        gene:
          id: P09124
          source: uniprot
    - terminator: rrnB_T1