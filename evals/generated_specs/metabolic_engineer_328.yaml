construct:
  name: "nif_ABCDEF_operon_anaerobic"
  host: bacillus  # Azotobacter vinelandii is a gram-negative bacterium; using bacillus as closest available for anaerobic optimization

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # araBAD provides tight anaerobic control and is responsive to microaerobic conditions

    - cistron:
        label: NifA
        expression: high
        gene:
          id: NifA
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifB
        expression: high
        fused: false
        gene:
          id: NifB
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifC
        expression: high
        fused: false
        gene:
          id: NifC
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifD
        expression: high
        fused: false
        gene:
          id: NifD
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifE
        expression: high
        fused: false
        gene:
          id: NifE
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifF
        expression: high
        fused: false
        gene:
          id: NifF
          source: uniprot

    - terminator: rrnB_T1
