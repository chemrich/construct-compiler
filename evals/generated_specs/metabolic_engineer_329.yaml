construct:
  name: cellulolytic_operon_four_enzymes
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # strong constitutive promoter suitable for E. coli

    - cistron:
        label: Endo1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Endo1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Exo2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Exo2
              source: uniprot

    - spacer: 25

    - cistron:
        label: BGL3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: BGL3
              source: uniprot

    - spacer: 25

    - cistron:
        label: LPMO4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LPMO4
              source: uniprot

    - terminator: rrnB_T1
