construct:
  name: "insoluble_pathway_sumo_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: Enzyme1
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: Enzyme2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: Enzyme3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: Enzyme4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        gene:
          id: Enzyme5
          source: uniprot
    - terminator: rrnB_T1