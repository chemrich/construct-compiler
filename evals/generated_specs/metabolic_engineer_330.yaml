construct:
  name: "PKS_five_enzyme_operon"
  host: bacillus  # Streptomyces coelicolor not directly supported; using bacillus as closest high-expression actinomycete alternative

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: tac  # strong, regulated promoter suitable for Streptomyces

    - cistron:
        label: Module1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PKS_Module1
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: Module2
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS_Module2
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: Module3
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS_Module3
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: Module4
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS_Module4
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: ModifyingEnz
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS_ModifyingEnz
              source: uniprot

    - terminator: rrnB_T1
