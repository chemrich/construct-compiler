construct:
  name: "toxin_biosynthesis_operon_ToxA_ToxF"
  host: agrobacterium_tumefaciens

  backbone:
    resistance: kanamycin
    ori: pTi
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides tight OFF state with minimal leakiness in Agrobacterium
      # Induction with L-arabinose enables dose-dependent control

    - cistron:
        label: ToxA
        expression: high
        chain:
          - rbs: RBS_strong
          - gene:
              id: ToxA
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxB
        expression: high
        fused: false
        chain:
          - rbs: RBS_medium
          - gene:
              id: ToxB
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxC
        expression: high
        fused: false
        chain:
          - rbs: RBS_medium
          - gene:
              id: ToxC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxD
        expression: medium
        fused: false
        chain:
          - rbs: RBS_medium
          - gene:
              id: ToxD
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE
        expression: medium
        fused: false
        chain:
          - rbs: RBS_weak
          - gene:
              id: ToxE
              source: uniprot

    - spacer: 25

    - cistron:
        label: ToxF
        expression: medium
        fused: false
        chain:
          - rbs: RBS_weak
          - gene:
              id: ToxF
              source: uniprot

    - terminator: rrnB_T1
      # Double terminator (transcriptional + translational) ensures no read-through
