construct:
  name: "arom_biosynthesis_operon_cold_optimized"
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
      # Comment: T7lac with BL21(DE3) allows tight control; cold induction at 20°C reduces proteolysis and improves folding of aromatic biosynthesis enzymes
    
    - cistron:
        label: AromA
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: AromA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: AromB
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: AromB
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: AromC
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: AromC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: AromD
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: AromD
              source: uniprot
    
    - terminator: rrnB_T1
