construct:
  name: "aromatic_biosynthesis_cold_shock_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: cspA  # Optimized for low-temperature expression (20°C)
    - cistron:
        label: aromA
        expression: medium
        gene:
          id: AromA
          source: uniprot
    - spacer: 30
    - cistron:
        label: aromB
        expression: medium
        fused: false
        gene:
          id: AromB
          source: uniprot
    - spacer: 30
    - cistron:
        label: aromC
        expression: medium
        fused: false
        gene:
          id: AromC
          source: uniprot
    - spacer: 30
    - cistron:
        label: aromD
        expression: medium
        fused: false
        gene:
          id: AromD
          source: uniprot
    - terminator: rrnB_T1