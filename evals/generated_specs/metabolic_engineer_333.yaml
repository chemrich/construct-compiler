        gene:
          id: Vit2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Vit3
        expression: high
        fused: false
        gene:
          id: Vit3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Vit4
        expression: high
        fused: false
        gene:
          id: Vit4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Vit5
        expression: high
        fused: false
        gene:
          id: Vit5
          source: uniprot
    
    - terminator: rrnB_T1  # Strong bidirectional terminator for broad-host compatibility
