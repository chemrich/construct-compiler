construct:
  name: shewanella_metal_stress_response_operon
  host: e_coli  # Shewanella oneidensis substituted with E. coli as a compatible Gram-negative host.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: P_arsR  # Arsenic-inducible metal sensor promoter.
    - cistron:
        label: stress_r1
        expression: medium
        gene:
          id: StressR1
          source: uniprot
    - spacer: 30
    - cistron:
        label: stress_r2
        expression: medium
        fused: false
        gene:
          id: StressR2
          source: uniprot
    - spacer: 30
    - cistron:
        label: stress_r3
        expression: medium
        fused: false
        gene:
          id: StressR3
          source: uniprot
    - spacer: 30
    - cistron:
        label: stress_r4
        expression: medium
        fused: false
        gene:
          id: StressR4
          source: uniprot
    - spacer: 30
    - cistron:
        label: stress_r5
        expression: medium
        fused: false
        gene:
          id: StressR5
          source: uniprot
    - spacer: 30
    - cistron:
        label: stress_r6
        expression: medium
        fused: false
        gene:
          id: StressR6
          source: uniprot
    - terminator: rrnB_T1