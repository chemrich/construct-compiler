construct:
  name: "ShewON_artificial_stress_response_operon"
  host: bacillus
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # Metal-inducible promoter (araBAD serves as inducible analog for S. oneidensis)
      # In practice, use native S. oneidensis metal-response promoters (e.g., rsrA)
    
    - cistron:
        label: StressR1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: stressR1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: StressR2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: stressR2
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: StressR3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: stressR3
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: StressR4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: stressR4
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: StressR5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: stressR5
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: StressR6
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: stressR6
              source: uniprot
    
    - terminator: rrnB_T1
