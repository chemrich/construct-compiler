construct:
  name: "four_enzyme_degradation_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Deg1
        expression: high
        chain:
          - gene:
              id: Deg1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Deg2
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg2
              source: uniprot
          - degradation_tag: LVA

    - spacer: 25

    - cistron:
        label: Deg3
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg3
              source: uniprot

    - spacer: 25

    - cistron:
        label: Deg4
        expression: high
        fused: false
        chain:
          - gene:
              id: Deg4
              source: uniprot
          - degradation_tag: LVA

    - terminator: rrnB_T1
