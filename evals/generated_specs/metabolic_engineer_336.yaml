construct:
  name: five_enzyme_operon_fused_enz1_enz2
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enz1_Enz2_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Enz1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Enz2
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enz3
        expression: high
        fused: false
        gene:
          id: Enz3
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enz4
        expression: high
        fused: false
        gene:
          id: Enz4
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enz5
        expression: high
        fused: false
        gene:
          id: Enz5
          source: uniprot
    
    - terminator: rrnB_T1
