construct:
  name: "vibrio_fischeri_autoinducible_qs_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: luxp  # Autoinducible promoter activated by LuxR-AHL complex
    - cistron:
        label: QS1
        expression: high
        gene:
          id: P12746  # LuxI: Acyl-homoserine-lactone synthase
          source: uniprot
    - spacer: 30
    - cistron:
        label: QS2
        expression: medium
        fused: false
        gene:
          id: P12747  # LuxC: Fatty acid reductase acid-reductase subunit
          source: uniprot
    - spacer: 30
    - cistron:
        label: QS3
        expression: medium
        fused: false
        gene:
          id: P12748  # LuxD: Fatty acid transferase
          source: uniprot
    - spacer: 30
    - cistron:
        label: QS4
        expression: medium
        fused: false
        gene:
          id: P12742  # LuxA: Alkanal monooxygenase alpha chain
          source: uniprot
    - spacer: 30
    - cistron:
        label: QS5
        expression: medium
        fused: false
        gene:
          id: P12743  # LuxB: Alkanal monooxygenase beta chain
          source: uniprot
    - spacer: 30
    - cistron:
        label: QS6
        expression: medium
        fused: false
        gene:
          id: P12749  # LuxE: Fatty acid-reductase acyl-protein synthetase subunit
          source: uniprot
    - terminator: rrnB_T1