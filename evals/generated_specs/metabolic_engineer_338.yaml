construct:
  name: "rhodococcus_four_enzyme_operon_reporter"
  host: bacillus  # Rhodococcus opacus is Gram-positive, closest available host approximation

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter for initial ReporterA validation

    - cistron:
        label: ReporterA
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: EnzX
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzX
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzY
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzY
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzZ
        expression: medium
        fused: false
        chain:
          - gene:
              id: EnzZ
              source: uniprot

    - terminator: rrnB_T1

  # NOTE: For promoter optimization in Rhodococcus opacus, generate multiple variants of this construct
  # using alternative promoters (J23106, J23101, araBAD, tac) to create a library for screening.
  # ReporterA fluorescence correlates with promoter strength; select variants with balanced EnzX/Y/Z expression.
