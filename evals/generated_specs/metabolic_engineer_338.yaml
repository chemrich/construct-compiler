construct:
  name: "rhodococcus_metabolic_operon_optimization"
  host: rhodococcus_opacus
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: reporter_a
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: enzyme_x
        expression: medium
        fused: false
        gene:
          id: EnzX
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_y
        expression: medium
        fused: false
        gene:
          id: EnzY
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_z
        expression: medium
        fused: false
        gene:
          id: EnzZ
          source: uniprot
    - terminator: rrnB_T1