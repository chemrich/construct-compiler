construct:
  name: "zymomonas_mobilis_membrane_operon"
  host: e_coli # Substituted e_coli as Zymomonas mobilis is not a standard host option; J23100 promoter remains compatible
  backbone:
    resistance: kanamycin
    ori: p15A
  cassette:
    - promoter: J23100
    - cistron:
        label: MemE1
        expression: medium
        fused: false
        chain:
          - tag: pelB
          - gene:
              id: MemE1
              source: uniprot
    - spacer: 30
    - cistron:
        label: MemE2
        expression: medium
        fused: false
        chain:
          - tag: pelB
          - gene:
              id: MemE2
              source: uniprot
    - spacer: 30
    - cistron:
        label: MemE3
        expression: medium
        fused: false
        chain:
          - tag: pelB
          - gene:
              id: MemE3
              source: uniprot
    - spacer: 30
    - cistron:
        label: MemE4
        expression: medium
        fused: false
        chain:
          - tag: pelB
          - gene:
              id: MemE4
              source: uniprot
    - spacer: 30
    - cistron:
        label: CytoE5
        expression: medium
        fused: false
        gene:
          id: CytoE5
          source: uniprot
    - terminator: BBa_B0015