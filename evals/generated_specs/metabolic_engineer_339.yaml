construct:
  name: "Zymomonas_mobilis_five_gene_membrane_cytosol_operon"
  host: bacillus  # Zymomonas mobilis is a Gram-negative bacterium; use bacillus as closest proxy for prokaryotic secretion/membrane targeting

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # constitutive promoter for balanced expression

    - cistron:
        label: MemE1
        expression: medium
        chain:
          - signal_peptide: Sec_signal  # N-terminal signal peptide for Sec pathway membrane targeting
          - gene:
              id: MemE1
              source: uniprot

    - spacer: 30

    - cistron:
        label: MemE2
        expression: medium
        fused: false
        chain:
          - signal_peptide: Sec_signal
          - gene:
              id: MemE2
              source: uniprot

    - spacer: 30

    - cistron:
        label: MemE3
        expression: medium
        fused: false
        chain:
          - signal_peptide: Sec_signal
          - gene:
              id: MemE3
              source: uniprot

    - spacer: 30

    - cistron:
        label: MemE4
        expression: medium
        fused: false
        chain:
          - signal_peptide: Sec_signal
          - gene:
              id: MemE4
              source: uniprot

    - spacer: 30

    - cistron:
        label: CytoE5
        expression: medium
        fused: false
        gene:
          id: CytoE5
          source: uniprot

    - terminator: rrnB_T1
