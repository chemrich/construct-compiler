```yaml
construct:
  name: six_enzyme_signaling_cascade
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: rhaBAD  # L-Rhamnose inducible for dose-dependent control

    - cistron:
        label: enzyme1
        expression: very_low
        gene:
          id: P0A6F5  # example enzyme
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: low
        fused: false
        gene:
          id: P0A6G7
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme3
        expression: medium
        fused: false
        gene:
          id: P0A6H1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        gene:
          id: P0A6I3
          source: uniprot

    - spacer: 35

    - cistron:
        label: enzyme5
        expression: medium
        fused: false
        gene:
          id: P0A6J5
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme6
        expression: low
        fused: false
        gene:
          id: P0A6K7
          source: uniprot

    - terminator: rrnB_T1
```