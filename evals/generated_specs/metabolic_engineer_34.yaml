construct:
  name: "synthetic_signaling_cascade_6enzyme_rhamnose_inducible"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: rhamnose  # L-rhamnose inducible for dose-dependent control
    
    - cistron:
        label: enzyme_1
        expression: very_high
        rbs_strength: strong
        gene:
          id: histidine_kinase_component
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_2
        expression: high
        rbs_strength: medium_strong
        fused: false
        gene:
          id: response_regulator_component
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3
        expression: medium
        rbs_strength: medium
        fused: false
        gene:
          id: phosphatase_component
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_4
        expression: medium
        rbs_strength: medium_weak
        fused: false
        gene:
          id: kinase_component
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_5
        expression: low
        rbs_strength: weak
        fused: false
        gene:
          id: protease_component
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_6
        expression: very_low
        rbs_strength: very_weak
        fused: false
        gene:
          id: output_enzyme_component
          source: uniprot
    
    - terminator: rrnB_T1
