construct:
  name: "IPTG_inducible_fatty_acid_pathway_operon"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: PyrDH
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PyrDH
              source: uniprot

    - spacer: 25

    - cistron:
        label: Ddh
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Ddh
              source: uniprot

    - spacer: 25

    - cistron:
        label: TADH
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: TADH
              source: uniprot

    - spacer: 25

    - cistron:
        label: GDH
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GDH
              source: uniprot

    - spacer: 25

    - cistron:
        label: ODC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ODC
              source: uniprot

    - terminator: rrnB_T1
