construct:
  name: "carotenoid_pathway_operon_p_putida"
  host: e_coli  # Substituted e_coli for P. putida as the closest supported host; tac promoter is used for compatibility.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: crtE
        expression: low  # Stoichiometry 1
        fused: false
        gene:
          id: crtE
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtB
        expression: medium  # Stoichiometry 2
        fused: false
        gene:
          id: crtB
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtI
        expression: low  # Stoichiometry 1
        fused: false
        gene:
          id: crtI
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtY
        expression: high  # Stoichiometry 3
        fused: false
        gene:
          id: crtY
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtZ
        expression: low  # Stoichiometry 1
        fused: false
        gene:
          id: crtZ
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtX
        expression: medium  # Stoichiometry 2
        fused: false
        gene:
          id: crtX
          source: uniprot
    - terminator: BBa_B0015