construct:
  name: "aldehyde_degradation_operon_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc

    - cistron:
        label: AldA
        expression: high
        chain:
          - gene:
              id: AldA
              source: uniprot

    - spacer: 25

    - cistron:
        label: AldB
        expression: high
        fused: false
        chain:
          - gene:
              id: AldB
              source: uniprot

    - spacer: 25

    - cistron:
        label: AldC
        expression: high
        fused: false
        chain:
          - gene:
              id: AldC
              source: uniprot

    - spacer: 25

    - cistron:
        label: AldD
        expression: high
        fused: false
        chain:
          - gene:
              id: AldD
              source: uniprot

    - terminator: rrnB_T1
