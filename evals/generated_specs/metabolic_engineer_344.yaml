construct:
  name: "xylose_utilization_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: XylA
        expression: medium
        chain:
          - gene:
              id: XylA
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: XylB
        expression: medium
        fused: false
        chain:
          - gene:
              id: XylB
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: XylC
        expression: medium
        fused: false
        chain:
          - gene:
              id: XylC
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: XylD
        expression: medium
        fused: false
        chain:
          - gene:
              id: XylD
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: XylE
        expression: medium
        fused: false
        chain:
          - gene:
              id: XylE
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - terminator: rrnB_T1