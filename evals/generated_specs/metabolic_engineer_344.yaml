construct:
  name: "xylose_utilization_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: XylA
        expression: high
        chain:
          - cleavage_site: TEV
          - gene:
              id: XylA
              source: uniprot
          - tag: Strep-II

    - spacer: 35

    - cistron:
        label: XylB
        expression: high
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: XylB
              source: uniprot
          - tag: Strep-II

    - spacer: 35

    - cistron:
        label: XylC
        expression: high
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: XylC
              source: uniprot
          - tag: Strep-II

    - spacer: 35

    - cistron:
        label: XylD
        expression: high
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: XylD
              source: uniprot
          - tag: Strep-II

    - spacer: 35

    - cistron:
        label: XylE
        expression: high
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: XylE
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
