construct:
  name: "thermophilic_glycolytic_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # strong constitutive promoter, works well at elevated temperatures

    - cistron:
        label: GAPDH
        expression: high
        gene:
          id: GAPDH_thermophile
          source: uniprot

    - spacer: 25

    - cistron:
        label: PGK
        expression: high
        fused: false
        gene:
          id: PGK_thermophile
          source: uniprot

    - spacer: 25

    - cistron:
        label: PGM
        expression: high
        fused: false
        gene:
          id: PGM_thermophile
          source: uniprot

    - spacer: 25

    - cistron:
        label: Eno
        expression: high
        fused: false
        gene:
          id: Eno_thermophile
          source: uniprot

    - terminator: rrnB_T1
