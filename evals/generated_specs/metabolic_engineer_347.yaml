construct:
  name: "biofuel_precursor_five_enzyme_operon"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: PDC
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PDC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ADH
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ADH
              source: uniprot

    - spacer: 25

    - cistron:
        label: THAP
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: THAP
              source: uniprot

    - spacer: 25

    - cistron:
        label: CHAT
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CHAT
              source: uniprot

    - spacer: 25

    - cistron:
        label: PKS
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PKS
              source: uniprot

    - terminator: rrnB_T1
