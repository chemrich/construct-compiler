construct:
  name: "araBAD_four_enzyme_operon_FP_construct"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: FP1
        expression: high
        gene:
          id: FP1
          source: uniprot

    - spacer: 25

    - cistron:
        label: FP2
        expression: high
        fused: false
        gene:
          id: FP2
          source: uniprot

    - spacer: 25

    - cistron:
        label: FP3
        expression: high
        fused: false
        gene:
          id: FP3
          source: uniprot

    - spacer: 25

    - cistron:
        label: FP4
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: FP4
              source: uniprot

    - terminator: rrnB_T1
