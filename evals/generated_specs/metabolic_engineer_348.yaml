construct:
  name: "fluorescent_protein_biosynthesis_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: enzyme_1
        expression: medium
        gene:
          id: FP1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: FP2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: FP3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: FP4
              source: uniprot
    - terminator: rrnB_T1