construct:
  name: "secondary_metabolite_operon_SmABCDEF"
  host: bacillus
  # Rhodococcus is gram-positive; Bacillus host selected as closest compatible option
  # for broad-host-range gram-positive expression design

  backbone:
    resistance: kanamycin
    ori: pRB69
    # pRB69 is a broad-host-range plasmid origin suitable for Rhodococcus
    source: addgene

  cassette:
    - promoter: P_Pveg
    # P_Pveg (vegetative promoter from B. subtilis) functions across diverse gram-positive bacteria
    # including Rhodococcus, Streptomyces, and other actinomycetes

    - cistron:
        label: SmA
        expression: high
        chain:
          - gene:
              id: SmA
              source: uniprot

    - spacer: 25

    - cistron:
        label: SmB
        expression: high
        fused: false
        chain:
          - gene:
              id: SmB
              source: uniprot

    - spacer: 25

    - cistron:
        label: SmC
        expression: high
        fused: false
        chain:
          - gene:
              id: SmC
              source: uniprot

    - spacer: 25

    - cistron:
        label: SmD
        expression: high
        fused: false
        chain:
          - gene:
              id: SmD
              source: uniprot

    - spacer: 25

    - cistron:
        label: SmE
        expression: high
        fused: false
        chain:
          - gene:
              id: SmE
              source: uniprot

    - spacer: 25

    - cistron:
        label: SmF
        expression: high
        fused: false
        chain:
          - gene:
              id: SmF
              source: uniprot

    - terminator: rrnB_T1
