construct:
  name: "Sm_Metabolite_Pathway_Operon_Rhodococcus"
  host: e_coli  # Rhodococcus is not in the standard list; using e_coli as a proxy for bacterial assembly with broad-host elements.
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive promoter from the Anderson library, widely used for broad-host range bacterial expression.
    - cistron:
        label: SmA
        expression: high
        gene:
          id: SmA
          source: uniprot
    - spacer: 30
    - cistron:
        label: SmB
        expression: high
        fused: false  # Independent translation for operon architecture
        gene:
          id: SmB
          source: uniprot
    - spacer: 30
    - cistron:
        label: SmC
        expression: high
        fused: false
        gene:
          id: SmC
          source: uniprot
    - spacer: 30
    - cistron:
        label: SmD
        expression: high
        fused: false
        gene:
          id: SmD
          source: uniprot
    - spacer: 30
    - cistron:
        label: SmE
        expression: high
        fused: false
        gene:
          id: SmE
          source: uniprot
    - spacer: 30
    - cistron:
        label: SmF
        expression: high
        fused: false
        gene:
          id: SmF
          source: uniprot
    - terminator: rrnB_T1