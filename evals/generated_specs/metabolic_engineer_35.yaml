construct:
  name: "metabolic_shunt_4enzyme_pathway"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: enzyme1
        expression: high
        gene:
          id: enzyme1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: enzyme2
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        gene:
          id: enzyme3
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        gene:
          id: enzyme4
          source: uniprot

    - terminator: rrnB_T1
