construct:
  name: "constitutive_metabolic_shunt"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_1
        expression: medium
        gene:
          id: P0A6F2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: Thrombin
          - gene:
              id: P0A6P9
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: P0A9Q5
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: P0A6D3
          source: uniprot
    - terminator: rrnB_T1