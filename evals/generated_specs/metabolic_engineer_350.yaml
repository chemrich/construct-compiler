construct:
  name: "ComABCD_Stoichiometric_Operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: ComA
        expression: medium
        gene:
          id: ComA
          source: uniprot
    - spacer: 30
    - cistron:
        label: ComB
        expression: medium
        fused: false
        gene:
          id: ComB
          source: uniprot
    - spacer: 30
    - cistron:
        label: ComC
        expression: high
        fused: false
        gene:
          id: ComC
          source: uniprot
    - spacer: 30
    - cistron:
        label: ComD
        expression: medium
        fused: false
        gene:
          id: ComD
          source: uniprot
    - terminator: rrnB_T1