construct:
  name: "pathway_variant_screening_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7lac
    - cistron:
        label: mutA
        expression: high
        gene:
          id: MutA
    - spacer: 30
    - cistron:
        label: mutB
        expression: high
        fused: false
        gene:
          id: MutB
    - spacer: 30
    - cistron:
        label: mutC
        expression: high
        fused: false
        gene:
          id: MutC
    - spacer: 30
    - cistron:
        label: mutD
        expression: high
        fused: false
        gene:
          id: MutD
    - spacer: 30
    - cistron:
        label: mutE
        expression: high
        fused: false
        gene:
          id: MutE
    - terminator: rrnB_T1