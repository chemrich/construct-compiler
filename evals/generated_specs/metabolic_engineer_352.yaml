construct:
  name: "clostridium_nif_operon"
  host: clostridium_acetobutylicum
  backbone:
    resistance: chloramphenicol
    ori: pCB102
    source: addgene
  cassette:
    - promoter: P_hydA  # Anaerobic-inducible promoter in Clostridium
    - cistron:
        label: nifR
        expression: high
        gene:
          id: nifR
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifF
        expression: high
        fused: false
        gene:
          id: nifF
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifG
        expression: high
        fused: false
        gene:
          id: nifG
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifH
        expression: high
        fused: false
        gene:
          id: nifH
          source: uniprot
    - terminator: rrnB_T1