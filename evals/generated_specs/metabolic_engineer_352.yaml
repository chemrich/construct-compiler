construct:
  name: "nif_operon_C_acetobutylicum"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: PnifA
      # Anaerobic-inducible promoter responsive to NifA transcription factor
      # Suitable for nitrogen fixation operons in obligate anaerobes

    - cistron:
        label: NifR
        expression: high
        chain:
          - gene:
              id: nifR
              source: uniprot

    - spacer: 25

    - cistron:
        label: NifF
        expression: high
        fused: false
        chain:
          - gene:
              id: nifF
              source: uniprot

    - spacer: 25

    - cistron:
        label: NifG
        expression: high
        fused: false
        chain:
          - gene:
              id: nifG
              source: uniprot

    - spacer: 25

    - cistron:
        label: NifH
        expression: high
        fused: false
        chain:
          - gene:
              id: nifH
              source: uniprot

    - terminator: rrnB_T1
