construct:
  name: "fine_chemical_five_enzyme_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: CycA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CycA
              source: uniprot

    - spacer: 25

    - cistron:
        label: CycB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CycB
              source: uniprot

    - spacer: 25

    - cistron:
        label: CycC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CycC
              source: uniprot

    - spacer: 25

    - cistron:
        label: CycD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CycD
              source: uniprot

    - spacer: 25

    - cistron:
        label: CycE
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CycE
              source: uniprot

    - terminator: rrnB_T1
