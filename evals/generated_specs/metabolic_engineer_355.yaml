construct:
  name: "phaCAB_operon_balanced_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: PhaA
        expression: medium
        gene:
          id: PhaA
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaB
        expression: medium
        fused: false
        gene:
          id: PhaB
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaC
        expression: medium
        fused: false
        gene:
          id: PhaC
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaD
        expression: medium
        fused: false
        gene:
          id: PhaD
          source: uniprot

    - terminator: rrnB_T1
