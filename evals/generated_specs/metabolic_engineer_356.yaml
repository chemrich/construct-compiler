construct:
  name: "cold_shock_cry_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cspA  # cold-shock promoter (cspA is temperature-sensitive, upregulated at low temperatures)

    - cistron:
        label: CryA
        expression: high
        gene:
          id: CryA
          source: uniprot

    - spacer: 25

    - cistron:
        label: CryB
        expression: high
        fused: false
        gene:
          id: CryB
          source: uniprot

    - spacer: 25

    - cistron:
        label: CryC
        expression: high
        fused: false
        gene:
          id: CryC
          source: uniprot

    - spacer: 25

    - cistron:
        label: CryD
        expression: high
        fused: false
        gene:
          id: CryD
          source: uniprot

    - spacer: 25

    - cistron:
        label: CryE
        expression: high
        fused: false
        gene:
          id: CryE
          source: uniprot

    - terminator: rrnB_T1
