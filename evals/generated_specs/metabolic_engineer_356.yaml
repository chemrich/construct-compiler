construct:
  name: "cold_shock_cry_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: cspA  # Major cold-shock promoter in E. coli
    - cistron:
        label: cryA
        expression: medium
        gene:
          id: CryA
          source: uniprot
    - spacer: 30
    - cistron:
        label: cryB
        expression: medium
        fused: false
        gene:
          id: CryB
          source: uniprot
    - spacer: 30
    - cistron:
        label: cryC
        expression: medium
        fused: false
        gene:
          id: CryC
          source: uniprot
    - spacer: 30
    - cistron:
        label: cryD
        expression: medium
        fused: false
        gene:
          id: CryD
          source: uniprot
    - spacer: 30
    - cistron:
        label: cryE
        expression: medium
        fused: false
        gene:
          id: CryE
          source: uniprot
    - terminator: rrnB_T1