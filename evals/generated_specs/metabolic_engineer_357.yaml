construct:
  name: "four_enzyme_operon_with_BC_fusion"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzA
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzBC_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: EnzC
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzD
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzD
              source: uniprot

    - terminator: rrnB_T1
