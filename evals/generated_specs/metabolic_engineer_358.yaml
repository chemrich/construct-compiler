construct:
  name: "regulatory_cascade_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: RegA
        expression: low
        gene:
          id: RegA
          source: uniprot

    - spacer: 25

    - cistron:
        label: KinB
        expression: high
        fused: false
        gene:
          id: KinB
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhoC
        expression: high
        fused: false
        gene:
          id: PhoC
          source: uniprot

    - spacer: 25

    - cistron:
        label: TrxR
        expression: high
        fused: false
        gene:
          id: TrxR
          source: uniprot

    - spacer: 25

    - cistron:
        label: TrxP
        expression: high
        fused: false
        gene:
          id: TrxP
          source: uniprot

    - terminator: rrnB_T1
