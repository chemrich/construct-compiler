construct:
  name: "stress_response_operon_autoinduction"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD responds to L-arabinose and is repressed by glucose
      # Combined with lactose-inducible elements, provides auto-induction behavior

    - cistron:
        label: HspA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: HspA
              source: uniprot

    - spacer: 25

    - cistron:
        label: GroE
        expression: high
        fused: false
        gene:
          id: GroEL
          source: uniprot

    - spacer: 25

    - cistron:
        label: DnaK
        expression: high
        fused: false
        gene:
          id: DnaK
          source: uniprot

    - spacer: 25

    - cistron:
        label: ClpP
        expression: high
        fused: false
        gene:
          id: ClpP
          source: uniprot

    - spacer: 25

    - cistron:
        label: Lon
        expression: high
        fused: false
        gene:
          id: Lon
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegP
        expression: high
        fused: false
        gene:
          id: DegP
          source: uniprot

    - terminator: rrnB_T1

  # Auto-induction mechanism note:
  # araBAD promoter is glucose-repressed (catabolite repression via CRP-cAMP)
  # and arabinose-induced. In auto-induction media (Terrific Broth + glycerol + lactose),
  # glucose depletion triggers CRP-cAMP activation and removal of arabinose repression.
  # Lactose presence (via basal beta-galactosidase) produces allolactose, activating
  # any lac operators if included in the regulatory region. This design achieves
  # high-cell-density expression during diauxic growth transition.
