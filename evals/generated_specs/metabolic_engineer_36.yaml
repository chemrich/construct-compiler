construct:
  name: "B_subtilis_5enzyme_vitamin_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg  # Strong constitutive promoter for Bacillus

    - cistron:
        label: enzyme1
        expression: high
        gene:
          id: vitA
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        gene:
          id: vitB
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        gene:
          id: vitC
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        gene:
          id: vitD
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme5_final
        expression: high
        fused: false
        gene:
          id: vitE
          source: uniprot

    - terminator: rrnB_T1
