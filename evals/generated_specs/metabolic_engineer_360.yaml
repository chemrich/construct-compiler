construct:
  name: "e_coli_butanol_synthesis_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: Thiolase
        expression: high
        gene:
          id: thl
          source: uniprot

    - spacer: 30

    - cistron:
        label: HBD
        expression: high
        gene:
          id: hbd
          source: uniprot

    - spacer: 30

    - cistron:
        label: BD
        expression: high
        gene:
          id: bd
          source: uniprot

    - spacer: 30

    - cistron:
        label: BCD
        expression: high
        gene:
          id: bcd
          source: uniprot

    - spacer: 30

    - cistron:
        label: AdhE2
        expression: high
        gene:
          id: adhE2
          source: uniprot

    - spacer: 30

    - cistron:
        label: Td
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: td
              source: uniprot

    - terminator: rrnB_T1
