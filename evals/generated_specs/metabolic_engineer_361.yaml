construct:
  name: limonene_production_operon
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: Mvsk
        expression: high
        gene:
          id: dxs
          source: uniprot

    - spacer: 25

    - cistron:
        label: Mvk
        expression: high
        gene:
          id: aact
          source: uniprot

    - spacer: 25

    - cistron:
        label: IspA
        expression: medium
        gene:
          id: ispA
          source: uniprot

    - spacer: 25

    - cistron:
        label: IDI
        expression: medium
        gene:
          id: idi1
          source: uniprot

    - spacer: 25

    - cistron:
        label: LS
        expression: medium
        chain:
          - gene:
              id: lims
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
