construct:
  name: "E_coli_PHA_pathway_4enzyme_polycistronic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: PhaC
        expression: high
        gene:
          id: PhaC
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaA
        expression: high
        fused: false
        gene:
          id: PhaA
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaB
        expression: high
        fused: false
        gene:
          id: PhaB
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhaJ
        expression: high
        fused: false
        gene:
          id: PhaJ
          source: uniprot

    - terminator: rrnB_T1

    - terminator: BBa_B0015
