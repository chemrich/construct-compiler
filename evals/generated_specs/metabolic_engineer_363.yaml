construct:
  name: indole_derivative_pathway_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: TrpA
        expression: medium
        gene:
          id: TrpA
          source: uniprot

    - spacer: 25

    - cistron:
        label: TrpB
        expression: medium
        gene:
          id: TrpB
          source: uniprot

    - spacer: 25

    - cistron:
        label: FMO
        expression: medium
        gene:
          id: FMO
          source: uniprot

    - spacer: 25

    - cistron:
        label: P450
        expression: high
        gene:
          id: CYP102A1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Reductase
        expression: high
        gene:
          id: CPR
          source: uniprot

    - spacer: 50

    - cistron:
        label: GFP_reporter
        expression: medium
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
