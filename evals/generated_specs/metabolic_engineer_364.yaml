construct:
  name: "Bacillus_4enzyme_secretion_pathway"
  host: bacillus

  backbone:
    resistance: null
    ori: null
    source: chromosomal_integration

  cassette:
    - promoter: xylA

    - cistron:
        label: P1_enzyme
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: P1
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2_enzyme
        expression: high
        fused: false
        chain:
          - signal_peptide: AmyE
          - gene:
              id: P2
              source: uniprot

    - spacer: 30

    - cistron:
        label: P3_enzyme
        expression: high
        fused: false
        chain:
          - signal_peptide: AmyE
          - gene:
              id: P3
              source: uniprot

    - spacer: 30

    - cistron:
        label: P4_enzyme
        expression: high
        fused: false
        chain:
          - signal_peptide: AmyE
          - gene:
              id: P4
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
