construct:
  name: "pseudomonas_aromatic_degradation_operon"
  host: e_coli  # Pseudomonas putida not in specific list; e_coli used as a compatible proteobacterial surrogate
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: Pm  # XylS-inducible strong promoter from the P. putida TOL plasmid pathway
    - cistron:
        label: nahAa
        expression: high
        gene:
          id: P0A110
          source: uniprot
    - spacer: 30
    - cistron:
        label: nahAb
        expression: high
        fused: false
        gene:
          id: P0A111
          source: uniprot
    - spacer: 30
    - cistron:
        label: nahAc
        expression: high
        fused: false
        gene:
          id: P0A112
          source: uniprot
    - spacer: 30
    - cistron:
        label: nahAd
        expression: high
        fused: false
        gene:
          id: P0A113
          source: uniprot
    - spacer: 30
    - cistron:
        label: nahB
        expression: medium
        fused: false
        gene:
          id: P0A114
          source: uniprot
    - spacer: 30
    - cistron:
        label: nahC
        expression: medium
        fused: false
        gene:
          id: P0A115
          source: uniprot
    - terminator: rrnB_T1