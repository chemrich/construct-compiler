construct:
  name: "Pseudomonas_putida_aromatic_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: Psal  # Salicylate-inducible promoter from P. putida; strong and substrate-responsive

    - cistron:
        label: D1
        expression: very_high
        gene:
          id: salA
          source: uniprot

    - spacer: 25

    - cistron:
        label: D2
        expression: high
        fused: false
        gene:
          id: salB
          source: uniprot

    - spacer: 25

    - cistron:
        label: D3
        expression: high
        fused: false
        gene:
          id: salC
          source: uniprot

    - spacer: 25

    - cistron:
        label: D4
        expression: medium
        fused: false
        gene:
          id: salD
          source: uniprot

    - spacer: 25

    - cistron:
        label: D5
        expression: medium
        fused: false
        gene:
          id: salE
          source: uniprot

    - spacer: 25

    - cistron:
        label: D6
        expression: medium
        fused: false
        linker:
          type: GS_flexible
          repeats: 1
        gene:
          id: salF
          source: uniprot

    - terminator: rrnB_T2  # Strong Pseudomonas-compatible terminator
