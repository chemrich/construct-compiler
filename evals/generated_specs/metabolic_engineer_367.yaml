construct:
  name: "PKS_module_arabinose_inducible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: KS
        expression: high
        gene:
          id: KS_domain
          source: uniprot

    - spacer: 25

    - cistron:
        label: AT
        expression: high
        fused: false
        gene:
          id: AT_domain
          source: uniprot

    - spacer: 25

    - cistron:
        label: DH
        expression: high
        fused: false
        gene:
          id: DH_domain
          source: uniprot

    - spacer: 25

    - cistron:
        label: ACP
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ACP_domain
              source: uniprot

    - terminator: rrnB_T1
