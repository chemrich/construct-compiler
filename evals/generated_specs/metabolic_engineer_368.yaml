construct:
  name: "E_coli_CO2_fixation_operon_anaerobic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: fnr  # FNR-dependent anaerobic promoter for E. coli

    - cistron:
        label: RuBisCO_large_subunit
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rbcL
              source: uniprot

    - spacer: 25

    - cistron:
        label: RuBisCO_small_subunit
        expression: high
        fused: false
        chain:
          - gene:
              id: rbcS
              source: uniprot

    - spacer: 25

    - cistron:
        label: PRK
        expression: high
        fused: false
        chain:
          - gene:
              id: prkA
              source: uniprot

    - spacer: 25

    - cistron:
        label: carbonic_anhydrase
        expression: medium
        fused: false
        chain:
          - gene:
              id: can
              source: uniprot

    - spacer: 25

    - cistron:
        label: GAPDH
        expression: high
        fused: false
        chain:
          - gene:
              id: gapA
              source: uniprot

    - terminator: rrnB_T1
