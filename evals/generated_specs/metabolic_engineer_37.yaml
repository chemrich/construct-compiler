construct:
  name: "six_enzyme_polymer_precursor_pathway"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: enzyme_1
        expression: medium
        gene:
          id: enzyme_1
    
    - spacer: 25
    
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: enzyme_2
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: enzyme_3
    
    - spacer: 25
    
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: enzyme_4
    
    - spacer: 25
    
    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        gene:
          id: enzyme_5
    
    - spacer: 25
    
    - cistron:
        label: enzyme_6
        expression: medium
        fused: false
        gene:
          id: enzyme_6
    
    - terminator: rrnB_T1
