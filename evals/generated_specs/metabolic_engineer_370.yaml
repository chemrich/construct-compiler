        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: E2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: E3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: E4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        gene:
          id: E5
          source: uniprot
    - terminator: T7term