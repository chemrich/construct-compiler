construct:
  name: "phb_production_scaffold_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Strong constitutive promoter for high expression
    - cistron:
        label: phaA
        expression: high
        gene:
          id: phaA
          source: uniprot
    - spacer: 30
    - cistron:
        label: phaB
        expression: high
        fused: false
        gene:
          id: phaB
          source: uniprot
    - spacer: 30
    - cistron:
        label: phaC
        expression: high
        fused: false
        gene:
          id: phaC
          source: uniprot
    - spacer: 30
    - cistron:
        label: scaffold
        expression: high
        fused: false
        gene:
          id: scaffold
          source: uniprot
    - terminator: BBa_B0015