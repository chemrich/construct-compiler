construct:
  name: "E_coli_PHB_operon_phaA_phaB_phaC_scaffold"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: phaA
        expression: high
        gene:
          id: phaA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: phaB
        expression: high
        fused: false
        gene:
          id: phaB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: phaC
        expression: high
        fused: false
        gene:
          id: phaC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: scaffold
        expression: high
        fused: false
        gene:
          id: PduA
          source: uniprot
    
    - terminator: rrnB_T1
