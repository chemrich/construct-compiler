construct:
  name: "Synechocystis_photosynthetic_efficiency_pathway"
  host: cyanobacteria  # Synechocystis PCC 6803

  backbone:
    resistance: spectinomycin  # standard for cyanobacterial selection
    ori: neutral_site  # chromosomal integration vector (no replicating ori)
    source: addgene

  cassette:
    - promoter: PpsbA  # strong, light-inducible promoter (photosystem II promoter in cyanobacteria)

    - cistron:
        label: rubisco_variant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: rbcL_synechocystis_optimized
              source: uniprot  # cyanobacterial Rubisco large subunit variant

    - spacer: 35

    - cistron:
        label: carboxysome_shell
        expression: high
        fused: false
        gene:
          id: ccmK_synechocystis
          source: uniprot  # carboxysome shell protein

    - spacer: 35

    - cistron:
        label: carbonic_anhydrase
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ccaA_synechocystis
              source: uniprot  # carbonic anhydrase for CO2 fixation

    - spacer: 35

    - cistron:
        label: rubisco_chaperone
        expression: medium
        fused: false
        chain:
          - solubility_tag: Trx  # Thioredoxin enhances folding and assembly
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: groES_synechocystis
              source: uniprot  # chaperone for Rubisco complex assembly

    - terminator: rrnB_T1
