construct:
  name: "tetA_lacI_metabolic_pathway_T1T2T3T4"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetA_lacI
      # Dual-control: aTc-inducible (pTet) with LacI repressor for tight OFF-state

    - cistron:
        label: T1_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: T1
              source: uniprot

    - spacer: 25

    - cistron:
        label: T2_enzyme
        expression: high
        fused: false
        gene:
          id: T2
          source: uniprot

    - spacer: 25

    - cistron:
        label: T3_enzyme
        expression: medium
        fused: false
        gene:
          id: T3
          source: uniprot

    - spacer: 25

    - cistron:
        label: T4_enzyme
        expression: medium
        fused: false
        gene:
          id: T4
          source: uniprot

    - terminator: rrnB_T1
