construct:
  name: "tightly_regulated_toxic_metabolic_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_LtetO_lacO  # Custom hybrid promoter: aTc inducible with LacI operators for tight repression
    - cistron:
        label: enzyme_T1
        expression: medium
        gene:
          id: T1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_T2
        expression: high
        fused: false  # Independent translation for polycistronic operon
        gene:
          id: T2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_T3
        expression: high
        fused: false
        gene:
          id: T3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_T4
        expression: high
        fused: false
        gene:
          id: T4
          source: uniprot
    - terminator: rrnB_T1