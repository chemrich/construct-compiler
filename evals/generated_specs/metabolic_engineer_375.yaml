construct:
  name: "yeast_fatty_acid_pathway_6enzyme"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: ACC1
        expression: high
        chain:
          - gene:
              id: ACC1
              source: uniprot
          - tag: PTS1
        codon_optimization: yeast

    - spacer: 30

    - cistron:
        label: P2A_FAS1
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A
          - gene:
              id: FAS1
              source: uniprot
          - tag: PTS1
        codon_optimization: yeast

    - spacer: 30

    - cistron:
        label: P2A_FAS2
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A
          - gene:
              id: FAS2
              source: uniprot
        codon_optimization: yeast

    - spacer: 30

    - cistron:
        label: P2A_FASN
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A
          - gene:
              id: FASN
              source: uniprot
        codon_optimization: yeast

    - spacer: 30

    - cistron:
        label: P2A_Desaturase
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A
          - gene:
              id: Desaturase
              source: uniprot
        codon_optimization: yeast

    - spacer: 30

    - cistron:
        label: P2A_Reductase
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A
          - gene:
              id: Reductase
              source: uniprot
          - tag: PTS1
        codon_optimization: yeast

    - terminator: CYC1
