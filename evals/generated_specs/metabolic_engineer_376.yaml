construct:
  name: glycolysis_bypass_operon_5enzyme
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: PPC
        expression: high
        chain:
          - gene:
              id: PPC
              source: uniprot

    - spacer: 25

    - cistron:
        label: PEPCK
        expression: high
        fused: false
        chain:
          - gene:
              id: PEPCK
              source: uniprot

    - spacer: 25

    - cistron:
        label: FBPase
        expression: high
        fused: false
        chain:
          - gene:
              id: FBPase
              source: uniprot

    - spacer: 25

    - cistron:
        label: TPI
        expression: high
        fused: false
        chain:
          - gene:
              id: TPI
              source: uniprot

    - spacer: 25

    - cistron:
        label: GAPDH_rev
        expression: high
        fused: false
        chain:
          - tag: GST
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: GAPDH
              source: uniprot

    - terminator: rrnB_T1
