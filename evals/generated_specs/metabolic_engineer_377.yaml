construct:
  name: "CHO_4enzyme_pathway_F2A_secreted"
  host: CHO

  backbone:
    catalog_vector: "pCDNA3.1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: E1
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal for mammalian ER
          - gene:
              id: E1
              source: uniprot
              codon_optimization: CHO

    - cistron:
        label: F2A_E2
        expression: high
        fused: false
        chain:
          - cleavage_site: F2A  # Self-cleaving 2A peptide for translational decoupling
          - gene:
              id: E2
              source: uniprot
              codon_optimization: CHO

    - cistron:
        label: F2A_E3
        expression: high
        fused: false
        chain:
          - cleavage_site: F2A
          - gene:
              id: E3
              source: uniprot
              codon_optimization: CHO

    - cistron:
        label: F2A_E4
        expression: high
        fused: false
        chain:
          - cleavage_site: F2A
          - gene:
              id: E4
              source: uniprot
              codon_optimization: CHO
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: SV40_polyA  # Mammalian polyadenylation signal for stable integration
