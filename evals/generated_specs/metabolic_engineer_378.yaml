construct:
  name: biofuel_pathway_B1B5_with_BFP_monitor
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc
      # trc is glucose-repressible and strong, suitable for metabolic engineering

    - cistron:
        label: B1
        expression: high
        gene:
          id: B1
          source: uniprot

    - spacer: 25

    - cistron:
        label: B2
        expression: high
        fused: false
        gene:
          id: B2
          source: uniprot

    - spacer: 25

    - cistron:
        label: B3
        expression: medium
        fused: false
        gene:
          id: B3
          source: uniprot

    - spacer: 25

    - cistron:
        label: B4
        expression: medium
        fused: false
        gene:
          id: B4
          source: uniprot

    - spacer: 25

    - cistron:
        label: B5
        expression: low
        fused: false
        gene:
          id: B5
          source: uniprot

    - terminator: rrnB_T1

    - promoter: J23106
      # weak constitutive promoter for reporter gene

    - cistron:
        label: BFP_monitor
        expression: very_low
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
