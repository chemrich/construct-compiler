construct:
  name: "Rhodobacter_sphaeroides_isoprenoid_operon"
  host: rhodobacter_sphaeroides

  backbone:
    resistance: kanamycin
    ori: pBBR1
    source: addgene
    # Integration vector for Rhodobacter chromosome integration via homologous recombination

  cassette:
    - promoter: J23100
      # Strong constitutive promoter, well-characterized in photosynthetic bacteria

    - cistron:
        label: DXS
        expression: high
        chain:
          - gene:
              id: DXS
              source: uniprot
              organism: "Rhodobacter sphaeroides"

    - spacer: 25
      # Optimized RBS + intergenic region for efficient ribosome binding and polycistronic translation

    - cistron:
        label: DXR
        expression: high
        fused: false
        gene:
          id: DXR
          source: uniprot
          organism: "Rhodobacter sphaeroides"

    - spacer: 25

    - cistron:
        label: IspD
        expression: high
        fused: false
        gene:
          id: IspD
          source: uniprot
          organism: "Rhodobacter sphaeroides"

    - spacer: 25

    - cistron:
        label: IspE
        expression: high
        fused: false
        gene:
          id: IspE
          source: uniprot
          organism: "Rhodobacter sphaeroides"

    - spacer: 25

    - cistron:
        label: IspF
        expression: high
        fused: false
        chain:
          - tag: SUMO
          - gene:
              id: IspF
              source: uniprot
              organism: "Rhodobacter sphaeroides"

    - terminator: rrnB_T1
