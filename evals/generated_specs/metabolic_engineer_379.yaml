construct:
  name: "Rhodobacter_isoprenoid_operon"
  host: e_coli  # Rhodobacter sphaeroides not in schema; using e_coli as bacterial proxy
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100  # Strong constitutive bacterial promoter
    - cistron:
        label: dxs
        expression: high
        gene:
          id: Q3J0W5
          source: uniprot
    - spacer: 30
    - cistron:
        label: dxr
        expression: high
        fused: false
        gene:
          id: Q3IZL5
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispD
        expression: high
        fused: false
        gene:
          id: Q3IYP8
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispE
        expression: high
        fused: false
        gene:
          id: Q3IYP7
          source: uniprot
    - spacer: 30
    - cistron:
        label: ispF
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: Q3IYP6
              source: uniprot
    - terminator: rrnB_T1