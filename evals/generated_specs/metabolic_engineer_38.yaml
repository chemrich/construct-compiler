construct:
  name: "quorum_sensing_interference_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: pLux  # LuxR-inducible promoter
    - cistron:
        label: aiiA_ytnP_fusion
        expression: high
        chain:
          - gene:
              id: Q9L9V1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: O34962
              source: uniprot
    - spacer: 30
    - cistron:
        label: qsdA_cistron
        expression: medium
        fused: false
        gene:
          id: Q9K9Z1
          source: uniprot
    - spacer: 30
    - cistron:
        label: pvdQ_cistron
        expression: medium
        fused: false
        gene:
          id: Q9I0G8
          source: uniprot
    - terminator: rrnB_T1