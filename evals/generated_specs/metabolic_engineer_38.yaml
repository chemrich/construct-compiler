construct:
  name: "lux_quorum_sensing_interference_operon"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: lacUV5
      # lacUV5 provides inducible expression; can be further regulated by LuxR in context

    - cistron:
        label: enzyme_1_acylhomoserine_lactone_synthase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: luxI
              source: uniprot

    - cistron:
        label: enzyme_2_acylhomoserine_lactone_hydrolase
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: aiA
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_3_quorum_sensing_repressor
        expression: medium
        fused: false
        gene:
          id: qsrR
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_4_signal_degradation_enzyme
        expression: medium
        fused: false
        gene:
          id: aiiA
          source: uniprot

    - terminator: rrnB_T1
