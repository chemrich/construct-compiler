        label: syn2
        expression: medium
        fused: false
        gene:
          id: Syn2
          source: uniprot
    - spacer: 30
    - cistron:
        label: syn3
        expression: medium
        fused: false
        gene:
          id: Syn3
          source: uniprot
    - spacer: 30
    - cistron:
        label: syn4
        expression: medium
        fused: false
