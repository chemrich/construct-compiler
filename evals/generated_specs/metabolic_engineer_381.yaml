construct:
  name: "pBAD_five_enzyme_operon"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Syn1
        expression: high
        gene:
          id: Syn1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syn2
        expression: high
        gene:
          id: Syn2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syn3
        expression: high
        gene:
          id: Syn3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syn4
        expression: medium
        gene:
          id: Syn4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syn5
        expression: medium
        chain:
          - gene:
              id: Syn5
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II

    - terminator: rrnB_T1
