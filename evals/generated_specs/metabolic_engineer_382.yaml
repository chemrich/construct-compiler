construct:
  name: "six_enzyme_operon_SUMO_His"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc

    - cistron:
        label: Kinase1
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: Kinase1
              source: uniprot

    - spacer: 25

    - cistron:
        label: ReductaseA
        expression: high
        fused: false
        gene:
          id: ReductaseA
          source: uniprot

    - spacer: 25

    - cistron:
        label: LyaseB
        expression: high
        fused: false
        gene:
          id: LyaseB
          source: uniprot

    - spacer: 25

    - cistron:
        label: SynthaseC
        expression: high
        fused: false
        gene:
          id: SynthaseC
          source: uniprot

    - spacer: 25

    - cistron:
        label: TransferaseD
        expression: high
        fused: false
        gene:
          id: TransferaseD
          source: uniprot

    - spacer: 25

    - cistron:
        label: IsomeraseE
        expression: high
        fused: false
        chain:
          - gene:
              id: IsomeraseE
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
