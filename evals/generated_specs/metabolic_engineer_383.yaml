construct:
  name: "PKS_Mod_polycistronic_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # strong constitutive promoter for balanced expression
    
    - cistron:
        label: PKS_Mod1
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS_Mod1
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: PKS_Mod2
        expression: high
        fused: false
        gene:
          id: PKS_Mod2
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: PKS_Mod3
        expression: high
        fused: false
        gene:
          id: PKS_Mod3
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: PKS_Mod4_GFP
        expression: high
        fused: false
        chain:
          - gene:
              id: PKS_Mod4
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
