construct:
  name: Bacillus_biomass_degradation_operon
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_veg
      # Strong constitutive promoter for B. subtilis

    - cistron:
        label: Amy1
        expression: high
        chain:
          - gene:
              id: Amy1
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: Gluco2
        expression: medium
        fused: false
        gene:
          id: Gluco2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Cell3
        expression: medium
        fused: false
        gene:
          id: Cell3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Xylan4
        expression: medium
        fused: false
        gene:
          id: Xylan4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Lacc5
        expression: medium
        fused: false
        chain:
          - gene:
              id: Lacc5
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
