construct:
  name: "methionine_biosynthesis_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: MetA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MetA
              source: uniprot

    - spacer: 25

    - cistron:
        label: MetB
        expression: high
        fused: false
        gene:
          id: MetB
          source: uniprot

    - spacer: 25

    - cistron:
        label: MetC
        expression: high
        fused: false
        gene:
          id: MetC
          source: uniprot

    - spacer: 25

    - cistron:
        label: MetD
        expression: high
        fused: false
        gene:
          id: MetD
          source: uniprot

    - terminator: rrnB_T1
