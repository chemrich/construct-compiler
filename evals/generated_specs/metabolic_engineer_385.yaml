construct:
  name: "methionine_biosynthesis_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106 # Medium-strength constitutive promoter
    - cistron:
        label: metA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: metA
              source: uniprot
    - spacer: 20
    - cistron:
        label: metB
        expression: medium
        fused: false
        gene:
          id: metB
          source: uniprot
    - spacer: 20
    - cistron:
        label: metC
        expression: medium
        fused: false
        gene:
          id: metC
          source: uniprot
    - spacer: 20
    - cistron:
        label: metD
        expression: medium
        fused: false
        gene:
          id: metD
          source: uniprot
    - terminator: rrnB_T1