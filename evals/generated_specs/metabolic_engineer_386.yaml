construct:
  name: "six_gene_operon_pBAD_equimolar"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Representing the pBAD variant of the requested operon; only one construct output per spec.
    - cistron:
        label: gen_a
        expression: medium
        fused: false
        gene:
          id: GenA
          source: uniprot
    - spacer: 30
    - cistron:
        label: gen_b
        expression: medium
        fused: false
        gene:
          id: GenB
          source: uniprot
    - spacer: 30
    - cistron:
        label: gen_c
        expression: medium
        fused: false
        gene:
          id: GenC
          source: uniprot
    - spacer: 30
    - cistron:
        label: gen_d
        expression: medium
        fused: false
        gene:
          id: GenD
          source: uniprot
    - spacer: 30
    - cistron:
        label: gen_e
        expression: medium
        fused: false
        gene:
          id: GenE
          source: uniprot
    - spacer: 30
    - cistron:
        label: gen_f
        expression: medium
        fused: false
        gene:
          id: GenF
          source: uniprot
    - terminator: rrnB_T1