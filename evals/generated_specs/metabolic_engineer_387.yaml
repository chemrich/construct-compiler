construct:
  name: "Pseudomonas_putida_plastic_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: kanamycin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: Pm  # Pseudomonas constitutive promoter

    - cistron:
        label: Deg1_secreted
        expression: high
        chain:
          - secretion_signal: tat_signal_peptide  # Twin-arginine translocation for periplasmic targeting
          - tag: FLAG
          - gene:
              id: Deg1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Deg2_cytosolic
        expression: high
        fused: false
        gene:
          id: Deg2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Deg3_cytosolic
        expression: high
        fused: false
        gene:
          id: Deg3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Deg4_cytosolic
        expression: high
        fused: false
        gene:
          id: Deg4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Deg5_cytosolic
        expression: high
        fused: false
        gene:
          id: Deg5
          source: uniprot

    - terminator: rrnB_T1
