construct:
  name: "ProdX_pathway_quartet_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: ProdX_A_RFP
        expression: high
        chain:
          - gene:
              id: ProdX_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: ProdX_B
        expression: high
        fused: false

    - spacer: 25

    - cistron:
        label: ProdX_C
        expression: high
        chain:
          - gene:
              id: ProdX_C
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: ProdX_D
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: ProdX_D
              source: uniprot

    - terminator: rrnB_T1
