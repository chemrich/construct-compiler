construct:
  name: "doxycycline_inducible_5enzyme_resistance_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR  # doxycycline-inducible (tight regulation)

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "ENZYME1_RESISTANCE"
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: "ENZYME2_RESISTANCE"
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: "ENZYME3_RESISTANCE"
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: "ENZYME4_RESISTANCE"
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: low
        fused: false
        chain:
          - gene:
              id: "ENZYME5_RESISTANCE"
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
