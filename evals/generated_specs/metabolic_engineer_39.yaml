construct:
  name: "doxycycline_inducible_drug_resistance_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tetA  # Doxycycline-inducible promoter
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_1
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: enzyme_2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: enzyme_3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: enzyme_4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: low
        fused: false
        chain:
          - gene:
              id: enzyme_5
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1