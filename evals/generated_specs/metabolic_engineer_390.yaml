      label: EnzX2
      expression: high
      fused: false
      gene:
        id: EnzX2
        source: uniprot
  - spacer: 30
  - cistron:
      label: EnzX3
      expression: high
      fused: false
      gene:
        id: EnzX3
        source: uniprot
  - spacer: 30
  - cistron:
      label: EnzX4
      expression: high
      fused: false
      gene:
        id: EnzX4
        source: uniprot
  - terminator: rrnB_T1
