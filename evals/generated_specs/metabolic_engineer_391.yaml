construct:
  name: "Corynebacterium_glutamicum_ProdY_operon"
  host: corynebacterium_glutamicum

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_cg  # Strong constitutive promoter for C. glutamicum

    - cistron:
        label: ProdY_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: NusA
          - gene:
              id: ProdY_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: ProdY_2
        expression: high
        fused: false
        gene:
          id: ProdY_2
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProdY_3
        expression: high
        fused: false
        gene:
          id: ProdY_3
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProdY_4
        expression: high
        fused: false
        gene:
          id: ProdY_4
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProdY_5
        expression: high
        fused: false
        gene:
          id: ProdY_5
          source: uniprot

    - terminator: rrnB_T1
