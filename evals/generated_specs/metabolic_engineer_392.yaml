construct:
  name: "E_coli_ABCD_synthetic_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: pTet

    - cistron:
        label: A_Synth
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: A_Synth
              source: uniprot

    - spacer: 25

    - cistron:
        label: B_Lygase
        expression: low
        fused: false
        gene:
          id: B_Lygase
          source: uniprot

    - spacer: 25

    - cistron:
        label: C_Hydrolase
        expression: high
        chain:
          - gene:
              id: C_Hydrolase
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: D_Dehydr
        expression: low
        fused: false
        gene:
          id: D_Dehydr
          source: uniprot

    - terminator: rrnB_T1
