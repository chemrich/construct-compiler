          id: Polyketide_Synth4
          source: uniprot
          codon_optimized: true
          organism: streptomyces_coelicolor

    - spacer: 25

    - cistron:
        label: Polyketide_Synth5
        expression: medium
        fused: false
        gene:
          id: Polyketide_Synth5
          source: uniprot
