construct:
  name: "E_coli_outer_membrane_enzyme_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: lacUV5

    - cistron:
        label: OuterMembraneEnz
        expression: medium
        chain:
          - signal_peptide: OmpA
          - gene:
              id: OuterMembraneEnz
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: CytosolEnz1
        expression: high
        fused: false
        gene:
          id: CytosolEnz1
          source: uniprot

    - spacer: 25

    - cistron:
        label: CytosolEnz2
        expression: high
        fused: false
        gene:
          id: CytosolEnz2
          source: uniprot

    - spacer: 25

    - cistron:
        label: CytosolEnz3
        expression: high
        fused: false
        gene:
          id: CytosolEnz3
          source: uniprot

    - spacer: 25

    - cistron:
        label: CytosolEnz4
        expression: high
        fused: false
        gene:
          id: CytosolEnz4
          source: uniprot

    - terminator: rrnB_T1
