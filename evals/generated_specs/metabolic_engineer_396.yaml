construct:
  name: "operon_gradient_E1_E5"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac  # tac is functionally equivalent to pTrc for IPTG induction

    - cistron:
        label: E1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: E1
              source: uniprot

    - spacer: 30

    - cistron:
        label: E2
        expression: medium
        fused: false
        gene:
          id: E2
          source: uniprot

    - spacer: 30

    - cistron:
        label: E3
        expression: medium
        fused: false
        gene:
          id: E3
          source: uniprot

    - spacer: 30

    - cistron:
        label: E4
        expression: low
        fused: false
        gene:
          id: E4
          source: uniprot

    - spacer: 30

    - cistron:
        label: E5
        expression: very_low
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: E5
              source: uniprot

    - terminator: rrnB_T1