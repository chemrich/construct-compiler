    - spacer: 30
    - cistron:
        label: BioSyn4
        expression: medium
        fused: false
        gene:
          id: BioSyn4
          source: uniprot
    - spacer: 30
    - cistron:
        label: BioSyn5
        expression: medium
        fused: false
        gene:
          id: BioSyn5
          source: uniprot
    - spacer: 30
