construct:
  name: "four_enzyme_complex_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProtA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProtA
              source: uniprot

    - spacer: 20

    - cistron:
        label: ProtB
        expression: high
        fused: false
        gene:
          id: ProtB
          source: uniprot

    - spacer: 20

    - cistron:
        label: ProtC
        expression: high
        fused: false
        gene:
          id: ProtC
          source: uniprot

    - spacer: 20

    - cistron:
        label: ProtD
        expression: high
        fused: false
        chain:
          - gene:
              id: ProtD
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
