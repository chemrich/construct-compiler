construct:
  name: "rhodobacter_carotenoid_operon"
  host: rhodobacter_sphaeroides # Custom host for carotenoid synthesis
  backbone:
    resistance: kanamycin
    ori: pBBR1 # Broad-host-range origin for Rhodobacter sphaeroides
  cassette:
    - promoter: pPpsR # Light-inducible Rhodobacter-specific promoter
    - cistron:
        label: carot_1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Carot_1
              source: uniprot
    - spacer: 30
    - cistron:
        label: carot_2
        expression: medium
        fused: false
        gene:
          id: Carot_2
          source: uniprot
    - spacer: 30
    - cistron:
        label: carot_3
        expression: medium
        fused: false
        gene:
          id: Carot_3
          source: uniprot
    - spacer: 30
    - cistron:
        label: carot_4
        expression: medium
        fused: false
        gene:
          id: Carot_4
          source: uniprot
    - spacer: 30
    - cistron:
        label: carot_5
        expression: medium
        fused: false
        gene:
          id: Carot_5
          source: uniprot
    - terminator: rrnB_T1