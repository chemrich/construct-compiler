construct:
  name: calvin_cycle_5enzyme_operon
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: rubisco_large
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P00877  # RuBisCO large subunit from Synechococcus
              source: uniprot

    - spacer: 25

    - cistron:
        label: phosphoglycerate_kinase
        expression: medium
        fused: false
        gene:
          id: P0A799  # Phosphoglycerate kinase from E. coli
          source: uniprot

    - spacer: 30

    - cistron:
        label: triose_phosphate_isomerase
        expression: medium
        fused: false
        gene:
          id: P0A858  # Triose-phosphate isomerase from E. coli
          source: uniprot

    - spacer: 28

    - cistron:
        label: aldolase
        expression: medium
        fused: false
        gene:
          id: P0A6V8  # Fructose-bisphosphate aldolase from E. coli
          source: uniprot

    - spacer: 32

    - cistron:
        label: sedoheptulose_bisphosphatase
        expression: medium
        fused: false
        chain:
          - tag: SUMO
          - cleavage_site: SUMO_protease
          - gene:
              id: Q46893  # Sedoheptulose-1,7-bisphosphatase from E. coli
              source: uniprot

    - terminator: rrnB_T1