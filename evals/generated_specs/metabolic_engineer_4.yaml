construct:
  name: calvin_cycle_5enzyme_operon
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: RuBisCO_large_subunit
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rbcL
              source: uniprot

    - spacer: 25

    - cistron:
        label: phosphoglycerate_kinase
        expression: high
        fused: false
        gene:
          id: pgk
          source: uniprot

    - spacer: 25

    - cistron:
        label: glyceraldehyde_3_phosphate_dehydrogenase
        expression: high
        fused: false
        gene:
          id: gapdh
          source: uniprot

    - spacer: 25

    - cistron:
        label: fructose_bisphosphate_aldolase
        expression: medium
        fused: false
        gene:
          id: fbaA
          source: uniprot

    - spacer: 25

    - cistron:
        label: sedoheptulose_bisphosphatase
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: sbpase
              source: uniprot

    - terminator: rrnB_T1
