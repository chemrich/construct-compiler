construct:
  name: "carotenoid_biosynthesis_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: CrtE
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CrtE
              source: uniprot

    - spacer: 30

    - cistron:
        label: CrtB
        expression: high
        fused: false
        gene:
          id: CrtB
          source: uniprot

    - spacer: 30

    - cistron:
        label: CrtI
        expression: high
        fused: false
        gene:
          id: CrtI
          source: uniprot

    - spacer: 30

    - cistron:
        label: CrtY
        expression: high
        fused: false
        gene:
          id: CrtY
          source: uniprot

    - spacer: 30

    - cistron:
        label: CrtZ
        expression: high
        fused: false
        gene:
          id: CrtZ
          source: uniprot

    - terminator: rrnB_T1
