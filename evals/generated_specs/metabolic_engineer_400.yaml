construct:
  name: "E_coli_E1_E2_E3_E4_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: E1
        expression: medium
        chain:
          - gene:
              id: E1
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: E2
        expression: medium
        fused: false
        gene:
          id: E2
          source: uniprot

    - spacer: 25

    - cistron:
        label: E3
        expression: medium
        fused: false
        gene:
          id: E3
          source: uniprot

    - spacer: 25

    - cistron:
        label: E4
        expression: medium
        fused: false
        gene:
          id: E4
          source: uniprot

    - terminator: rrnB_T1
