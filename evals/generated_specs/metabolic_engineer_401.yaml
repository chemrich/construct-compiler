construct:
  name: "bacillus_subtilis_5_gene_operon"
  host: bacillus_subtilis
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Standard strong constitutive promoter
    - cistron:
        label: enzyme_a
        expression: medium
        gene:
          id: Enzyme_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: medium
        fused: false # Ensures independent translation with separate RBS
        gene:
          id: Enzyme_B
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: medium
        fused: false
        gene:
          id: Enzyme_C
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_d
        expression: medium
        fused: false
        gene:
          id: Enzyme_D
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_e
        expression: medium
        fused: false
        gene:
          id: Enzyme_E
          source: uniprot
    - terminator: rrnB_T1