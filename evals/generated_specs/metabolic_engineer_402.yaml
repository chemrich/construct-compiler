construct:
  name: "pseudomonas_putida_xylose_degradation_operon"
  host: bacillus  # P. putida is gram-negative; using bacillus as closest available for non-E. coli gram-negative
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac  # Strong inducible promoter suitable for gram-negative bacteria
    
    - cistron:
        label: XylA
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: XylA
              source: uniprot
    
    - cistron:
        label: XylB
        expression: high
        fused: false
        gene:
          id: XylB
          source: uniprot
    
    - cistron:
        label: XylC
        expression: medium
        fused: false
        gene:
          id: XylC
          source: uniprot
    
    - cistron:
        label: XylD
        expression: medium
        fused: false
        gene:
          id: XylD
          source: uniprot
    
    - cistron:
        label: XylE
        expression: low
        fused: false
        gene:
          id: XylE
          source: uniprot
    
    - cistron:
        label: XylF
        expression: low
        fused: false
        gene:
          id: XylF
          source: uniprot
    
    - terminator: rrnB_T1
