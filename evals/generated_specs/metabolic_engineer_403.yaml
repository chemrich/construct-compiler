construct:
  name: "inducible_KLMN_drug_synthesis_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_K
        expression: medium
        gene:
          id: enzyme_K
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_L
        expression: medium
        fused: false
        gene:
          id: enzyme_L
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_M
        expression: medium
        fused: false
        gene:
          id: enzyme_M
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_N_GFP
        expression: medium
        fused: false
        chain:
          - gene:
              id: enzyme_N
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GFP
            location: c_terminus
            id: mEGFP
            source: fpbase

    - terminator: rrnB_T1
