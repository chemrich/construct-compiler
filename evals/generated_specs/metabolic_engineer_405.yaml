construct:
  name: "E_coli_S1_S2_S3_S4_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: S1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: S2
        expression: high
        fused: false
        gene:
          id: S2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: S3
        expression: high
        fused: false
        gene:
          id: S3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: S4
        expression: high
        fused: false
        gene:
          id: S4
          source: uniprot
    
    - terminator: rrnB_T1
