construct:
  name: mevalonate_terpene_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: MvaS
        expression: high
        gene:
          id: MvaS
          source: uniprot

    - cistron:
        label: MvaA
        expression: high
        fused: false
        gene:
          id: MvaA
          source: uniprot

    - spacer: 30

    - cistron:
        label: HmgR
        expression: medium
        fused: false
        gene:
          id: HmgR
          source: uniprot

    - spacer: 30

    - cistron:
        label: IDI
        expression: medium
        fused: false
        gene:
          id: IDI
          source: uniprot

    - spacer: 30

    - cistron:
        label: GGDPs
        expression: medium
        fused: false
        gene:
          id: GGDPs
          source: uniprot

    - spacer: 30

    - cistron:
        label: TPS
        expression: medium
        fused: false
        gene:
          id: TPS
          source: uniprot

    - terminator: rrnB_T1
