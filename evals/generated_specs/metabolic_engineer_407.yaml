construct:
  name: "B_subtilis_Hyd_operon_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PxylA

    - cistron:
        label: HydA
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: HydA
              source: uniprot

    - spacer: 25

    - cistron:
        label: HydB
        expression: high
        fused: false
        gene:
          id: HydB
          source: uniprot

    - spacer: 25

    - cistron:
        label: HydC
        expression: high
        fused: false
        gene:
          id: HydC
          source: uniprot

    - spacer: 25

    - cistron:
        label: HydD
        expression: high
        fused: false
        gene:
          id: HydD
          source: uniprot

    - spacer: 25

    - cistron:
        label: HydE
        expression: high
        fused: false
        gene:
          id: HydE
          source: uniprot

    - terminator: rrnB_T1
