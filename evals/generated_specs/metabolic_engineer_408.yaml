construct:
  name: "four_enzyme_operon_X_Y_Z_W"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: enzyme_X
        expression: medium
        gene:
          id: enzyme_X
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_Y
        expression: medium
        chain:
          - solubility_tag: MBP
          - gene:
              id: enzyme_Y
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_Z
        expression: medium
        gene:
          id: enzyme_Z
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_W
        expression: medium
        gene:
          id: enzyme_W
          source: uniprot
    
    - terminator: rrnB_T1
