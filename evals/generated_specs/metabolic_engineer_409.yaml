construct:
  name: "mammalian_glycolysis_enzymes_compartmentalized"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: HK1_cytoplasm
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: HK1
              source: uniprot

    - terminator: SV40_poly_A

  cassette:
    - promoter: CMV
    - cistron:
        label: PFKFB3_nuclear
        expression: high
        chain:
          - tag: 6xHis
          - tag: NLS
          - gene:
              id: PFKFB3
              source: uniprot

    - terminator: SV40_poly_A

  cassette:
    - promoter: CMV
    - cistron:
        label: GPI_cytoplasm
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GPI
              source: uniprot

    - terminator: SV40_poly_A

  cassette:
    - promoter: CMV
    - cistron:
        label: PKM2_mitochondrial
        expression: high
        chain:
          - tag: 6xHis
          - tag: MTS
          - gene:
              id: PKM2
              source: uniprot

    - terminator: SV40_poly_A
