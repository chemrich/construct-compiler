construct:
  name: yeast_terpene_pathway_optimized
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: isoprene_synthase
        expression: high
        gene:
          id: IspS
          source: uniprot
    - terminator: CYC1
    - promoter: TDH3
    - cistron:
        label: ggpp_synthase
        expression: high
        gene:
          id: GGPPS
          source: uniprot
    - terminator: ADH1
    - promoter: PGK1
    - cistron:
        label: farnesene_synthase
        expression: high
        gene:
          id: FS
          source: uniprot
    - terminator: TEF1
    - promoter: ADH1
    - cistron:
        label: ocimene_synthase
        expression: high
        chain:
          - gene:
              id: OS
              source: uniprot
          - tag: Strep-II
    - terminator: ENO1