construct:
  name: "yeast_terpene_synthase_quartet"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: IspS
        expression: high
        gene:
          id: IspS
          source: uniprot

    - terminator: CYC1

    - promoter: GAL10

    - cistron:
        label: GGPPS
        expression: high
        gene:
          id: GGPPS
          source: uniprot

    - terminator: CYC1

    - promoter: TEF1

    - cistron:
        label: FS
        expression: high
        gene:
          id: FS
          source: uniprot

    - terminator: CYC1

    - promoter: PGK1

    - cistron:
        label: OS
        expression: high
        chain:
          - gene:
              id: OS
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1
