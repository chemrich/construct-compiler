construct:
  name: "five_enzyme_operon_C1_C2_C3_IRES_C4_C5"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: C1
        expression: medium
        gene:
          id: C1
          source: uniprot

    - spacer: 25

    - cistron:
        label: C2
        expression: medium
        fused: false
        gene:
          id: C2
          source: uniprot

    - spacer: 25

    - cistron:
        label: C3
        expression: medium
        fused: false
        gene:
          id: C3
          source: uniprot

    # IRES element inserted between C3 and C4 to explore uncoupling of downstream translation
    - spacer: 30

    - cistron:
        label: C4_IRES_coupled
        expression: medium
        fused: false
        gene:
          id: C4
          source: uniprot

    - spacer: 25

    - cistron:
        label: C5
        expression: medium
        fused: false
        gene:
          id: C5
          source: uniprot

    - terminator: rrnB_T1
