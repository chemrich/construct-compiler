construct:
  name: dual_promoter_enzyme_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: G1
        expression: medium
        gene:
          id: G1
          source: uniprot

    - spacer: 25

    - cistron:
        label: G2
        expression: medium
        fused: false
        gene:
          id: G2
          source: uniprot

    - spacer: 25

    - cistron:
        label: G3
        expression: medium
        fused: false
        chain:
          - gene:
              id: G3
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: G4
        expression: medium
        gene:
          id: G4
          source: uniprot

    - spacer: 25

    - cistron:
        label: G5
        expression: medium
        fused: false
        gene:
          id: G5
          source: uniprot

    - spacer: 25

    - cistron:
        label: G6
        expression: medium
        fused: false
        chain:
          - gene:
              id: G6
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
