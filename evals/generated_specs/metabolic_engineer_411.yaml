    - cistron:
        label: g4
        expression: medium
        gene:
          id: G4
          source: uniprot
    - spacer: 30
    - cistron:
        label: g5
        expression: medium
        fused: false
        gene:
          id: G5
          source: uniprot
    - spacer: 30
    - cistron:
        label: g6
        expression: medium
        fused: false
