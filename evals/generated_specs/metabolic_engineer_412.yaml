construct:
  name: "P_putida_xenobiotic_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: RK2
    source: addgene

  cassette:
    - promoter: P_xyl

    - cistron:
        label: DegA
        expression: high
        chain:
          - gene:
              id: DegA
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: DegB
        expression: high
        fused: false
        gene:
          id: DegB
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegC
        expression: high
        fused: false
        gene:
          id: DegC
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegD
        expression: high
        fused: false
        gene:
          id: DegD
          source: uniprot

    - terminator: rrnB_T1
