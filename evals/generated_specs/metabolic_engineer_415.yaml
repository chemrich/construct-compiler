construct:
  name: "E_coli_Q1_Q2_Q3_Q4_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong, well-characterized constitutive promoter from iGEM registry

    - cistron:
        label: Q1
        expression: high
        gene:
          id: Q1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Q2
        expression: high
        chain:
          - gene:
              id: Q2
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: Q3
        expression: high
        gene:
          id: Q3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Q4
        expression: high
        gene:
          id: Q4
          source: uniprot

    - terminator: rrnB_T1
