construct:
  name: "Syc_five_gene_operon_autoinducible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD provides tunable, density-responsive control when used with L-arabinose
      # For autoinduction at high cell density, pair with arabinose autoinduction medium

    - cistron:
        label: Syc1
        expression: medium
        gene:
          id: Syc1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syc2
        expression: medium
        fused: false
        gene:
          id: Syc2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syc3
        expression: medium
        fused: false
        gene:
          id: Syc3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syc4
        expression: medium
        fused: false
        gene:
          id: Syc4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Syc5
        expression: medium
        fused: false
        gene:
          id: Syc5
          source: uniprot

    - terminator: rrnB_T1
