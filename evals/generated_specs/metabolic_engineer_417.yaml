construct:
  name: lysine_production_operon_cg
  host: bacillus
  # Note: C. glutamicum is a Gram-positive bacterium similar to Bacillus.
  # Using bacillus as the closest host option for Corynebacterium glutamicum.

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      # Strong constitutive promoter suitable for high expression in Gram-positive bacteria

    - cistron:
        label: LysA
        expression: high
        gene:
          id: lysA
          source: uniprot

    - spacer: 25

    - cistron:
        label: LysB
        expression: high
        fused: false
        gene:
          id: lysB
          source: uniprot

    - spacer: 25

    - cistron:
        label: LysC
        expression: high
        fused: false
        chain:
          - gene:
              id: lysC
              source: uniprot
          - tag: Myc

    - spacer: 25

    - cistron:
        label: LysD
        expression: high
        fused: false
        gene:
          id: lysD
          source: uniprot

    - terminator: rrnB_T1
