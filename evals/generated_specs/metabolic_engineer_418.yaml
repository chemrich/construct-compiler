construct:
  name: "phos_six_enzyme_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: PhosA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PhosA
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: PhosB
        expression: high
        fused: false
        gene:
          id: PhosB
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhosC
        expression: high
        fused: false
        gene:
          id: PhosC
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhosD
        expression: high
        fused: false
        gene:
          id: PhosD
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhosE
        expression: high
        fused: false
        gene:
          id: PhosE
          source: uniprot

    - spacer: 25

    - cistron:
        label: PhosF
        expression: high
        fused: false
        gene:
          id: PhosF
          source: uniprot

    - terminator: rrnB_T1
