construct:
  name: "phos_operon_complex_purification"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: PhosA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: PhosA
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: PhosB
        expression: medium
        fused: false
        gene:
          id: PhosB
          source: uniprot
    - spacer: 30
    - cistron:
        label: PhosC
        expression: medium
        fused: false
        gene:
          id: PhosC
          source: uniprot
    - spacer: 30
    - cistron:
        label: PhosD
        expression: medium
        fused: false
        gene:
          id: PhosD
          source: uniprot
    - spacer: 30
    - cistron:
        label: PhosE
        expression: medium
        fused: false
        gene:
          id: PhosE
          source: uniprot
    - spacer: 30
    - cistron:
        label: PhosF
        expression: medium
        fused: false
        gene:
          id: PhosF
          source: uniprot
    - terminator: rrnB_T1