construct:
  name: "five_enzyme_operon_e_coli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProtA
        expression: high
        gene:
          id: ProtA
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProtB_ProtC_fusion
        expression: high
        chain:
          - gene:
              id: ProtB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: Factor_Xa
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProtC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ProtD
        expression: high
        gene:
          id: ProtD
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProtE
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ProtE
              source: uniprot

    - terminator: rrnB_T1
