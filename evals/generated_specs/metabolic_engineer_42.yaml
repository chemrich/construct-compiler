construct:
  name: polyketide_synthesis_system
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: PKS1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PKS1
              source: uniprot

    - spacer: 30

    - cistron:
        label: PKS2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PKS2
              source: uniprot

    - spacer: 30

    - cistron:
        label: PKS3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PKS3
              source: uniprot

    - spacer: 30

    - cistron:
        label: PPTase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PPTase
              source: uniprot

    - terminator: rrnB_T1

  resistance: kanamycin
  ori: pBR322
