construct:
  name: precursor_X_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: EnzA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzA
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzB
        expression: high
        fused: false
        gene:
          id: EnzB
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzC
        expression: high
        fused: false
        gene:
          id: EnzC
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzD
        expression: high
        fused: false
        gene:
          id: EnzD
          source: uniprot

    - terminator: rrnB_T1
