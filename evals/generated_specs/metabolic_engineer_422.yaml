construct:
  name: "Bacillus_six_enzyme_bioconversion_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Hydrolase_Dehydrogenase1_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Hydrolase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Dehydrogenase1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Isomerase
        expression: high
        fused: false
        gene:
          id: Isomerase
          source: uniprot

    - spacer: 25

    - cistron:
        label: Dehydrogenase2
        expression: high
        fused: false
        gene:
          id: Dehydrogenase2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Reductase
        expression: high
        fused: false
        gene:
          id: Reductase
          source: uniprot

    - spacer: 25

    - cistron:
        label: Ligase
        expression: high
        fused: false
        chain:
          - gene:
              id: Ligase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
