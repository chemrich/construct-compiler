construct:
  name: "balanced_pathway_operon_ABCD"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # constitutive promoter, strong
    
    - cistron:
        label: EnzA
        expression: high
        gene:
          id: EnzA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzB
        expression: medium
        fused: false
        gene:
          id: EnzB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzC
        expression: medium
        fused: false
        gene:
          id: EnzC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzD
        expression: low
        fused: false
        gene:
          id: EnzD
          source: uniprot
    
    - terminator: rrnB_T1
