construct:
  name: "Bacillus_four_enzyme_secretion_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: xylose_inducible  # Inducible promoter suitable for Bacillus subtilis

    - cistron:
        label: EnzX
        expression: high
        chain:
          - secretion_signal: AmyQ_signal_peptide
          - gene:
              id: EnzX
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzY
        expression: high
        fused: false
        gene:
          id: EnzY
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzZ
        expression: high
        fused: false
        gene:
          id: EnzZ
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzW
        expression: high
        fused: false
        gene:
          id: EnzW
          source: uniprot

    - terminator: rrnB_T1
