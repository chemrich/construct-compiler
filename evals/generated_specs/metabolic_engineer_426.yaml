construct:
  name: five_enzyme_pathway_translational_coupling
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: alpha
        expression: high
        chain:
          - gene:
              id: alpha
              source: uniprot
          - tag: FLAG
    
    - cistron:
        label: beta
        expression: high
        fused: false
        # Translational coupling: stop codon of alpha overlaps with start codon of beta
        chain:
          - gene:
              id: beta
              source: uniprot
          - tag: FLAG
    
    - cistron:
        label: gamma
        expression: high
        fused: false
        # Translational coupling: stop codon of beta overlaps with start codon of gamma
        chain:
          - gene:
              id: gamma
              source: uniprot
          - tag: FLAG
    
    - cistron:
        label: delta
        expression: high
        fused: false
        # Translational coupling: stop codon of gamma overlaps with start codon of delta
        chain:
          - gene:
              id: delta
              source: uniprot
          - tag: FLAG
    
    - cistron:
        label: epsilon
        expression: high
        fused: false
        # Translational coupling: stop codon of delta overlaps with start codon of epsilon
        chain:
          - gene:
              id: epsilon
              source: uniprot
          - tag: FLAG
    
    - terminator: rrnB_T1
