construct:
  name: "four_enzyme_operon_arabinose"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: E_A_E_B_fusion
        expression: medium
        chain:
          - gene:
              id: E_A
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: E_B
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_C
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: E_C
              source: uniprot

    - spacer: 25

    - cistron:
        label: E_D
        expression: medium
        fused: false
        gene:
          id: E_D
          source: uniprot

    - terminator: rrnB_T1
