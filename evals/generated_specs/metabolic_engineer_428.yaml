construct:
  name: "P_putida_5enzyme_bioremediation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: tetracycline
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: XylS_Pm

    - cistron:
        label: DegA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: DegA
              source: uniprot

    - spacer: 25

    - cistron:
        label: DegB
        expression: high
        fused: false
        gene:
          id: DegB
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegC
        expression: high
        fused: false
        gene:
          id: DegC
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegD
        expression: high
        fused: false
        gene:
          id: DegD
          source: uniprot

    - spacer: 25

    - cistron:
        label: DegE
        expression: high
        fused: false
        chain:
          - gene:
              id: DegE
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
