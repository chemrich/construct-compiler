construct:
  name: "mammalian_therapeutic_pathway_five_enzyme_cassette"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Enzyme_A
        expression: high
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: enzyme_a
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: Enzyme_B
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: enzyme_b
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: Enzyme_C
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: enzyme_c
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: Enzyme_D
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: enzyme_d
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: Enzyme_E
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: enzyme_e
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
