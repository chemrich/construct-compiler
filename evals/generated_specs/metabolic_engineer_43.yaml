construct:
  name: "mammalian_pathway_5_enzyme_secretion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    # Note: For stable integration, this construct would typically be delivered via a lentiviral or transposon-based system;
    # pTwist CMV is used here as a standard mammalian expression backbone.

  cassette:
    - promoter: CMV
    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - tag: IgK_leader # Secretion signal peptide
          - gene:
              id: Enzyme_A
              source: uniprot
          - tag: FLAG # C-terminal Flag-tag
    - terminator: bGH_pA

    - promoter: CMV
    - cistron:
        label: enzyme_b
        expression: high
        chain:
          - tag: IgK_leader
          - gene:
              id: Enzyme_B
              source: uniprot
          - tag: FLAG
    - terminator: bGH_pA

    - promoter: CMV
    - cistron:
        label: enzyme_c
        expression: high
        chain:
          - tag: IgK_leader
          - gene:
              id: Enzyme_C
              source: uniprot
          - tag: FLAG
    - terminator: bGH_pA

    - promoter: CMV
    - cistron:
        label: enzyme_d
        expression: high
        chain:
          - tag: IgK_leader
          - gene:
              id: Enzyme_D
              source: uniprot
          - tag: FLAG
    - terminator: bGH_pA

    - promoter: CMV
    - cistron:
        label: enzyme_e
        expression: high
        chain:
          - tag: IgK_leader
          - gene:
              id: Enzyme_E
              source: uniprot
          - tag: FLAG
    - terminator: bGH_pA