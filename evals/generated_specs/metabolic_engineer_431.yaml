construct:
  name: "five_enzyme_nadh_regeneration_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: EnzA
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: EnzB
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        gene:
          id: EnzC
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_D
        expression: medium
        fused: false
        gene:
          id: EnzD
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_E
        expression: medium
        fused: false
        gene:
          id: EnzE
          source: uniprot
    - terminator: BBa_B0015