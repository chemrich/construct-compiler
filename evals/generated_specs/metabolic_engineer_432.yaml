construct:
  name: "arabinose_inducible_synth_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: araBAD
    - cistron:
        label: synth1
        expression: high
        chain:
          - gene:
              id: Synth1
              source: uniprot
          - tag: HA
    - spacer: 30
    - cistron:
        label: synth2
        expression: medium
        fused: false
        gene:
          id: Synth2
          source: uniprot
    - spacer: 30
    - cistron:
        label: synth3
        expression: medium
        fused: false
        gene:
          id: Synth3
          source: uniprot
    - spacer: 30
    - cistron:
        label: synth4
        expression: low
        fused: false
        gene:
          id: Synth4
          source: uniprot
    - terminator: rrnB_T1