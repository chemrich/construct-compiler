construct:
  name: "araBAD_synth_operon_RBS_library"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Synth1_strong_RBS
        expression: high
        chain:
          - gene:
              id: Synth1
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: Synth1_medium_RBS
        expression: medium
        chain:
          - gene:
              id: Synth1
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: Synth1_weak_RBS
        expression: low
        chain:
          - gene:
              id: Synth1
              source: uniprot
          - tag: HA

    - spacer: 30

    - cistron:
        label: Synth2_strong_RBS
        expression: high
        fused: false
        gene:
          id: Synth2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth2_medium_RBS
        expression: medium
        fused: false
        gene:
          id: Synth2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth2_weak_RBS
        expression: low
        fused: false
        gene:
          id: Synth2
          source: uniprot

    - spacer: 30

    - cistron:
        label: Synth3_strong_RBS
        expression: high
        fused: false
        gene:
          id: Synth3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth3_medium_RBS
        expression: medium
        fused: false
        gene:
          id: Synth3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth3_weak_RBS
        expression: low
        fused: false
        gene:
          id: Synth3
          source: uniprot

    - spacer: 30

    - cistron:
        label: Synth4_strong_RBS
        expression: high
        fused: false
        gene:
          id: Synth4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth4_medium_RBS
        expression: medium
        fused: false
        gene:
          id: Synth4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Synth4_weak_RBS
        expression: low
        fused: false
        gene:
          id: Synth4
          source: uniprot

    - terminator: rrnB_T1
