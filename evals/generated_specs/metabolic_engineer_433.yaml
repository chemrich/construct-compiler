construct:
  name: "five_enzyme_operon_solubility_tags"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: Kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: Kinase
              source: uniprot

    - spacer: 25

    - cistron:
        label: Phosphatase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - gene:
              id: Phosphatase
              source: uniprot

    - spacer: 25

    - cistron:
        label: Transferase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: Transferase
              source: uniprot

    - spacer: 25

    - cistron:
        label: Oxidase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - gene:
              id: Oxidase
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: Reductase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: Reductase
              source: uniprot

    - terminator: rrnB_T1
