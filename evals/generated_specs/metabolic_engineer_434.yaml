construct:
  name: sRNA_regulatable_degradase_pathway
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: Degradase_1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: Degradase_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Degradase_2_sRNA_target
        expression: medium
        # 5' UTR engineered with sRNA binding site (rbs_variant notation indicates modulated RBS)
        rbs_variant: sRNA_target_site
        gene:
          id: Degradase_2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Degradase_3
        expression: medium
        gene:
          id: Degradase_3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Degradase_4
        expression: medium
        gene:
          id: Degradase_4
          source: uniprot

    - terminator: rrnB_T1
