construct:
  name: "R_opacus_6enzyme_metabolic_operon"
  host: e_coli  # Rhodococcus opacus not in schema; using e_coli as surrogate for assembly.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: P_hsp60  # Strong constitutive promoter optimized for Rhodococcus species.
    - cistron:
        label: Lipase_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Lipase_A
              source: uniprot
    - spacer: 30
    - cistron:
        label: Esterase_B
        expression: high
        fused: false
        gene:
          id: Esterase_B
          source: uniprot
    - spacer: 30
    - cistron:
        label: Hydrolase_C
        expression: high
        fused: false
        gene:
          id: Hydrolase_C
          source: uniprot
    - spacer: 30
    - cistron:
        label: Synthase_D
        expression: high
        fused: false
        gene:
          id: Synthase_D
          source: uniprot
    - spacer: 30
    - cistron:
        label: Polymerase_E
        expression: high
        fused: false
        gene:
          id: Polymerase_E
          source: uniprot
    - spacer: 30
    - cistron:
        label: Modase_F
        expression: high
        fused: false
        chain:
          - gene:
              id: Modase_F
              source: uniprot
          - tag: Strep-II
    - terminator: rrnB_T1