construct:
  name: "cold_shock_inducible_five_enzyme_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: cspA
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: E_cold_1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: E_cold_2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: E_cold_3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: E_cold_4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - gene:
              id: E_cold_5
              source: uniprot
          - solubility_tag: GST
    - terminator: rrnB_T1