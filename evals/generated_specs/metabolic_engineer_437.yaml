construct:
  name: "streptomyces_metabolite_pathway_operon"
  host: streptomyces_coelicolor

  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom

  cassette:
    - promoter: ermE_star

    - cistron:
        label: SM_E1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SM_E1
              source: uniprot

    - spacer: 30

    - cistron:
        label: SM_E2
        expression: high
        fused: false
        gene:
          id: SM_E2
          source: uniprot

    - spacer: 30

    - cistron:
        label: SM_E3
        expression: high
        fused: false
        gene:
          id: SM_E3
          source: uniprot

    - spacer: 30

    - cistron:
        label: SM_E4
        expression: high
        fused: false
        gene:
          id: SM_E4
          source: uniprot

    - spacer: 30

    - cistron:
        label: SM_E5
        expression: high
        fused: false
        gene:
          id: SM_E5
          source: uniprot

    - spacer: 30

    - cistron:
        label: SM_E6
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: SM_E6
              source: uniprot

    - terminator: BBa_B0015