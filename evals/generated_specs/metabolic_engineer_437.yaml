construct:
  name: "Streptomyces_secondary_metabolite_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ermE_star

    - cistron:
        label: SM_E1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SM_E1
              source: uniprot

    - spacer: 25

    - cistron:
        label: SM_E2
        expression: high
        fused: false
        gene:
          id: SM_E2
          source: uniprot

    - spacer: 25

    - cistron:
        label: SM_E3
        expression: high
        fused: false
        gene:
          id: SM_E3
          source: uniprot

    - spacer: 25

    - cistron:
        label: SM_E4
        expression: high
        fused: false
        gene:
          id: SM_E4
          source: uniprot

    - spacer: 25

    - cistron:
        label: SM_E5
        expression: high
        fused: false
        gene:
          id: SM_E5
          source: uniprot

    - spacer: 25

    - cistron:
        label: SM_E6
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: SM_E6
              source: uniprot

    - terminator: rrnB_T1
