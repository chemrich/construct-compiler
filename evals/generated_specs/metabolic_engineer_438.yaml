construct:
  name: "PTM_operon_four_enzyme_pathway"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: Mod_A
        expression: high
        chain:
          - gene:
              id: Mod_A
              source: uniprot
          - tag: Avi

    - spacer: 25

    - cistron:
        label: Mod_B
        expression: high
        fused: false
        chain:
          - gene:
              id: Mod_B
              source: uniprot
          - tag: Avi

    - spacer: 25

    - cistron:
        label: Mod_C
        expression: high
        fused: false
        chain:
          - gene:
              id: Mod_C
              source: uniprot
          - tag: Avi

    - spacer: 25

    - cistron:
        label: Mod_D
        expression: high
        fused: false
        chain:
          - gene:
              id: Mod_D
              source: uniprot
          - tag: Avi

    - terminator: rrnB_T1
