construct:
  name: "minimal_five_enzyme_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: Min_1
        expression: high
        gene:
          id: Min_1
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min_2
        expression: high
        fused: false
        gene:
          id: Min_2
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min_3
        expression: high
        fused: false
        gene:
          id: Min_3
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min_4
        expression: high
        fused: false
        gene:
          id: Min_4
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min_5
        expression: high
        fused: false
        gene:
          id: Min_5
          source: uniprot

    - terminator: rrnB_T1
