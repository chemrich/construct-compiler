construct:
  name: butanol_production_operon
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Thl
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Thl
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: CtfA
        expression: high
        fused: false
        gene:
          id: CtfA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: CtfB
        expression: high
        fused: false
        gene:
          id: CtfB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: AdhE
        expression: medium
        fused: false
        gene:
          id: AdhE
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Bcd
        expression: medium
        fused: false
        gene:
          id: Bcd
          source: uniprot
    
    - terminator: rrnB_T1
