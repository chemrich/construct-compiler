construct:
  name: "compound_X_operon_A_B_C_D_E"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter for balanced operon expression

    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: enzymeA
          source: uniprot

    - cistron:
        label: enzyme_B
        expression: high
        gene:
          id: enzymeB
          source: uniprot

    - cistron:
        label: enzyme_C
        expression: medium
        gene:
          id: enzymeC
          source: uniprot

    - cistron:
        label: enzyme_D
        expression: medium
        gene:
          id: enzymeD
          source: uniprot

    - cistron:
        label: enzyme_E
        expression: low
        gene:
          id: enzymeE
          source: uniprot

    - terminator: rrnB_T1
