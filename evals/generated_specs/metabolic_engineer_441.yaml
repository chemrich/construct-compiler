construct:
  name: "inducible_4enzyme_pathway_FGHI"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_F
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_F
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_G
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_G
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_H
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_H
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_I
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_I
              source: uniprot

    - terminator: rrnB_T1
