construct:
  name: "Bacillus_subtilis_tuned_carbon_utilization_operon"
  host: b_subtilis
  backbone:
    resistance: kanamycin
    ori: pUB110  # Standard high-copy origin for B. subtilis
    source: addgene

  cassette:
    - promoter: Pveg  # Strong constitutive promoter for B. subtilis

    - cistron:
        label: XylA
        expression: high
        gene:
          id: XylA
          source: uniprot

    - spacer: 30

    - cistron:
        label: XylB
        expression: high
        fused: false
        gene:
          id: XylB
          source: uniprot

    - spacer: 30

    - cistron:
        label: PckA
        expression: medium
        fused: false
        gene:
          id: PckA
          source: uniprot

    - spacer: 30

    - cistron:
        label: PdhA
        expression: medium
        fused: false
        gene:
          id: PdhA
          source: uniprot

    - spacer: 30

    - cistron:
        label: CdhB
        expression: low
        fused: false
        gene:
          id: CdhB
          source: uniprot

    - terminator: amyL_term  # Standard terminator for Bacillus subtilis expression systems