construct:
  name: "sequential_conversion_operon_S_to_P"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: M1
        expression: high
        gene:
          id: M1
          source: uniprot

    - spacer: 25

    - cistron:
        label: M2
        expression: medium
        fused: false
        gene:
          id: M2
          source: uniprot

    - spacer: 25

    - cistron:
        label: M3
        expression: medium
        fused: false
        gene:
          id: M3
          source: uniprot

    - spacer: 25

    - cistron:
        label: M4
        expression: low
        fused: false
        gene:
          id: M4
          source: uniprot

    - terminator: rrnB_T1
