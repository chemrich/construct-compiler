construct:
  name: "five_enzyme_operon_araBAD"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: E1
        expression: medium
        gene:
          id: E1

    - spacer: 25

    - cistron:
        label: E2
        expression: medium
        gene:
          id: E2

    - spacer: 25

    - cistron:
        label: E3_E2_fusion
        expression: medium
        fused: true
        chain:
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: E3

    - spacer: 25

    - cistron:
        label: E4
        expression: medium
        gene:
          id: E4

    - spacer: 25

    - cistron:
        label: E5
        expression: medium
        gene:
          id: E5

    - terminator: rrnB_T1
