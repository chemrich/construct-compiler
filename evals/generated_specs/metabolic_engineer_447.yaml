construct:
  name: "thermosensitive_4enzyme_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_lambda_pR  # temperature-inducible promoter

    - cistron:
        label: Thermo1
        expression: high
        gene:
          id: Thermo1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Thermo2
        expression: high
        fused: false
        gene:
          id: Thermo2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Thermo3
        expression: medium
        fused: false
        gene:
          id: Thermo3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Thermo4
        expression: medium
        fused: false
        gene:
          id: Thermo4
          source: uniprot

    - terminator: rrnB_T1
