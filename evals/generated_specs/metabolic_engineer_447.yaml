construct:
  name: "thermosensitive_4_enzyme_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: P_lambda_pR  # Temperature-inducible promoter (lambda pR)
    - cistron:
        label: Thermo1
        expression: high
        gene:
          id: Thermo1
          source: uniprot
    - spacer: 30
    - cistron:
        label: Thermo2
        expression: medium
        fused: false
        gene:
          id: Thermo2
          source: uniprot
    - spacer: 30
    - cistron:
        label: Thermo3
        expression: medium
        fused: false
        gene:
          id: Thermo3
          source: uniprot
    - spacer: 30
    - cistron:
        label: Thermo4
        expression: low
        fused: false
        gene:
          id: Thermo4
          source: uniprot
    - terminator: rrnB_T1