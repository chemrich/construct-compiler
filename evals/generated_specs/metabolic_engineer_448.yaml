construct:
  name: "biosensor_five_gene_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23106
    - cistron:
        label: SensorA
        expression: medium
        gene:
          id: SensorA
          source: uniprot
    - spacer: 30
    - cistron:
        label: SensorB
        expression: medium
        fused: false
        gene:
          id: SensorB
          source: uniprot
    - spacer: 30
    - cistron:
        label: ReporterC
        expression: low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 30
    - cistron:
        label: D
        expression: low
        fused: false
        gene:
          id: EnzymeD
          source: uniprot
    - spacer: 30
    - cistron:
        label: E
        expression: low
        fused: false
        gene:
          id: EnzymeE
          source: uniprot
    - terminator: rrnB_T1