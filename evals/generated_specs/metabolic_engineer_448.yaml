construct:
  name: "five_gene_biosensor_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: SensorA
        expression: medium
        gene:
          id: SensorA
          source: uniprot

    - cistron:
        label: SensorB
        expression: medium
        gene:
          id: SensorB
          source: uniprot

    - cistron:
        label: ReporterC
        expression: low
        fused: false
        gene:
          id: ReporterC
          source: uniprot

    - cistron:
        label: D
        expression: low
        fused: false
        gene:
          id: D
          source: uniprot

    - cistron:
        label: E
        expression: low
        fused: false
        gene:
          id: E
          source: uniprot

    - terminator: rrnB_T1
