construct:
  name: "S_pathway_operon_MBP_solubility"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: S_synthase
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: S_synthase
              source: uniprot

    - spacer: 25

    - cistron:
        label: S_hydroxylase
        expression: high
        fused: false
        gene:
          id: S_hydroxylase
          source: uniprot

    - spacer: 25

    - cistron:
        label: S_reductase
        expression: medium
        fused: false
        gene:
          id: S_reductase
          source: uniprot

    - spacer: 25

    - cistron:
        label: S_ligase
        expression: medium
        fused: false
        gene:
          id: S_ligase
          source: uniprot

    - terminator: rrnB_T1
