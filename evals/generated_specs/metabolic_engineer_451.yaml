construct:
  name: "balanced_5_enzyme_operon_chemostat"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: lacUV5
      # Medium-strength constitutive promoter; stable for long-term chemostat culture

    - cistron:
        label: C1
        expression: medium
        chain:
          - gene:
              id: C1
              source: uniprot

    - spacer: 25

    - cistron:
        label: C2
        expression: medium
        fused: false
        chain:
          - gene:
              id: C2
              source: uniprot

    - spacer: 25

    - cistron:
        label: C3
        expression: medium
        fused: false
        chain:
          - gene:
              id: C3
              source: uniprot

    - spacer: 25

    - cistron:
        label: C4
        expression: medium
        fused: false
        chain:
          - gene:
              id: C4
              source: uniprot

    - spacer: 25

    - cistron:
        label: C5
        expression: medium
        fused: false
        chain:
          - gene:
              id: C5
              source: uniprot

    - terminator: rrnB_T1
      # Strong, reliable terminator for stable long-term expression
