construct:
  name: "four_gene_operon_Z1_Z2_Z3_Z4"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Z1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: Z1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Z2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Z2
              source: uniprot

    - spacer: 25

    - cistron:
        label: Z3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Z3
              source: uniprot

    - spacer: 25

    - cistron:
        label: Z4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Z4
              source: uniprot

    - terminator: rrnB_T1
