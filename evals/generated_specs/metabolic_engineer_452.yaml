construct:
  name: "inducible_4_gene_z_operon"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: z1_z2_fusion
        expression: medium
        chain:
          - gene:
              id: Z1
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: Z2
              source: uniprot
    - spacer: 30
    - cistron:
        label: z3
        expression: medium
        fused: false
        gene:
          id: Z3
          source: uniprot
    - spacer: 30
    - cistron:
        label: z4
        expression: medium
        fused: false
        gene:
          id: Z4
          source: uniprot
    - terminator: rrnB_T1