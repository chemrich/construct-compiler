construct:
  name: "six_enzyme_pathway_ecoli"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter for E. coli
    
    - cistron:
        label: kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: kinase_ecoli
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: isomerase
        expression: medium
        fused: false
        chain:
          - gene:
              id: isomerase_ecoli
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: dehydrogenase
        expression: medium
        fused: false
        chain:
          - gene:
              id: dehydrogenase_ecoli
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: reductase
        expression: low
        fused: false
        chain:
          - gene:
              id: reductase_ecoli
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: ligase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ligase_ecoli
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: polymerase
        expression: low
        fused: false
        chain:
          - gene:
              id: polymerase_ecoli
              source: uniprot
    
    - terminator: rrnB_T1
