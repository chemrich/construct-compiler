          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: CRISPR_target3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: CRISPR_target4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        gene:
          id: CRISPR_target5
          source: uniprot
    - terminator: rrnB_T1