construct:
  name: "P_putida_pollutant_degradation_operon"
  host: pseudomonas_putida

  backbone:
    resistance: gentamicin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: P_alkB

    - cistron:
        label: P_degrade1
        expression: high
        gene:
          id: P_degrade1
          source: uniprot

    - spacer: 25

    - cistron:
        label: P_degrade2
        expression: medium
        fused: false
        gene:
          id: P_degrade2
          source: uniprot

    - spacer: 25

    - cistron:
        label: P_degrade3
        expression: medium
        fused: false
        gene:
          id: P_degrade3
          source: uniprot

    - spacer: 25

    - cistron:
        label: P_degrade4
        expression: low
        fused: false
        gene:
          id: P_degrade4
          source: uniprot

    - terminator: rrnB_T1
