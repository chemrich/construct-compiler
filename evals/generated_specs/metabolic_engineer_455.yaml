construct:
  name: "pollutant_degradation_operon_p_putida"
  host: e_coli  # Substituted for Pseudomonas putida as it is not in the standard host list; P_alkB is a compatible Pseudomonas promoter.
  backbone:
    resistance: kanamycin
    ori: p15A
  cassette:
    - promoter: P_alkB
    - cistron:
        label: P_degrade1
        expression: high
        gene:
          id: P_degrade1
          source: uniprot
    - spacer: 30
    - cistron:
        label: P_degrade2
        expression: high
        fused: false
        gene:
          id: P_degrade2
          source: uniprot
    - spacer: 30
    - cistron:
        label: P_degrade3
        expression: high
        fused: false
        gene:
          id: P_degrade3
          source: uniprot
    - spacer: 30
    - cistron:
        label: P_degrade4
        expression: high
        fused: false
        gene:
          id: P_degrade4
          source: uniprot
    - terminator: rrnB_T1