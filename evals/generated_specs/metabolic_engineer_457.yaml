construct:
  name: "four_enzyme_operon_TransABCD"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong, well-characterized BioBrick constitutive promoter

    - cistron:
        label: TransA
        expression: high
        gene:
          id: TransA
          source: uniprot

    - spacer: 25

    - cistron:
        label: TransB
        expression: medium
        fused: false
        gene:
          id: TransB
          source: uniprot

    - spacer: 25

    - cistron:
        label: TransC
        expression: medium
        fused: false
        gene:
          id: TransC
          source: uniprot

    - spacer: 25

    - cistron:
        label: TransD
        expression: low
        fused: false
        gene:
          id: TransD
          source: uniprot

    - terminator: rrnB_T1
