construct:
  name: "stress_response_operon_4enzyme"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: katG  # Stress-inducible promoter responsive to oxidative stress

    - cistron:
        label: StressR1
        expression: high
        gene:
          id: StressR1
          source: uniprot

    - spacer: 25

    - cistron:
        label: StressR2
        expression: high
        fused: false
        gene:
          id: StressR2
          source: uniprot

    - spacer: 25

    - cistron:
        label: StressR3
        expression: high
        fused: false
        gene:
          id: StressR3
          source: uniprot

    - spacer: 25

    - cistron:
        label: StressR4
        expression: high
        fused: false
        gene:
          id: StressR4
          source: uniprot

    - terminator: rrnB_T1
