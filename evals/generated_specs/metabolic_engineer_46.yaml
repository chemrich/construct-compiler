construct:
  name: "synthetic_co2_fixation_light_inducible"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: pDawn  # Standard blue-light inducible promoter for E. coli
    - cistron:
        label: rbcL
        expression: high
        fused: false
        gene:
          id: rbcL
          source: uniprot
    - spacer: 30
    - cistron:
        label: rbcS
        expression: high
        fused: false
        gene:
          id: rbcS
          source: uniprot
    - spacer: 30
    - cistron:
        label: prk
        expression: medium
        fused: false
        gene:
          id: prk
          source: uniprot
    - spacer: 30
    - cistron:
        label: gapdh
        expression: medium
        fused: false
        gene:
          id: gapA
          source: uniprot
    - terminator: rrnB_T1