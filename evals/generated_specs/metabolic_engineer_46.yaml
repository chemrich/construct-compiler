construct:
  name: "CO2_fixation_light_inducible_polycistronic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Light-inducible control via araBAD + L-arabinose induction
      # Fine-tuned RBS strengths for stoichiometric balance

    - cistron:
        label: RuBisCO_large_subunit
        expression: high
        chain:
          - gene:
              id: rbcL
              source: uniprot

    - spacer: 30

    - cistron:
        label: RuBisCO_small_subunit
        expression: medium
        fused: false
        gene:
          id: rbcS
          source: uniprot

    - spacer: 30

    - cistron:
        label: phosphoribulokinase
        expression: medium
        fused: false
        chain:
          - gene:
              id: prkA
              source: uniprot

    - spacer: 30

    - cistron:
        label: glyceraldehyde_3_phosphate_dehydrogenase
        expression: low
        fused: false
        chain:
          - gene:
              id: gapA
              source: uniprot

    - terminator: rrnB_T1
