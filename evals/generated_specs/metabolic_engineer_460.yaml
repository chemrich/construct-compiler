construct:
  name: "four_enzyme_pathway_balanced_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Strong constitutive promoter for high-level pathway expression
    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - gene:
              id: enzyme_A
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag on Enzyme A
    - spacer: 30
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: enzyme_B
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        gene:
          id: enzyme_C
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_D
        expression: high
        fused: false
        gene:
          id: enzyme_D
          source: uniprot
    - terminator: BBa_B0015