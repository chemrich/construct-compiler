construct:
  name: "four_enzyme_pathway_A_B_C_D"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - gene:
              id: enzymeA
              source: uniprot
          - tag: 6xHis
    
    - spacer: 25
    
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: enzymeB
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_C
        expression: medium
        fused: false
        gene:
          id: enzymeC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_D
        expression: medium
        fused: false
        gene:
          id: enzymeD
          source: uniprot
    
    - terminator: rrnB_T1
