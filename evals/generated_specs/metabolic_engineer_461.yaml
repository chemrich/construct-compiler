construct:
  name: "aromatic_degradation_pathway_P_putida"
  host: pseudomonas_putida

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: degA
        expression: high
        chain:
          - tag: GST
          - gene:
              id: degA
              source: uniprot

    - spacer: 25

    - cistron:
        label: degB
        expression: high
        fused: false
        gene:
          id: degB
          source: uniprot

    - spacer: 25

    - cistron:
        label: degC
        expression: high
        fused: false
        gene:
          id: degC
          source: uniprot

    - spacer: 25

    - cistron:
        label: degD
        expression: high
        fused: false
        gene:
          id: degD
          source: uniprot

    - spacer: 25

    - cistron:
        label: degE
        expression: high
        fused: false
        gene:
          id: degE
          source: uniprot

    - terminator: rrnB_T1
