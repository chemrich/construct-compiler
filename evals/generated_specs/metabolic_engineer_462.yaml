construct:
  name: "PKS_polyketide_operon_pks1_pks6"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: PKS1
        expression: medium
        chain:
          - gene:
              id: PKS1
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS2
        expression: medium
        fused: false
        chain:
          - gene:
              id: PKS2
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS3
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PKS3
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS4
        expression: low
        fused: false
        chain:
          - gene:
              id: PKS4
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS5
        expression: medium
        fused: false
        chain:
          - gene:
              id: PKS5
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS6
        expression: low
        fused: false
        chain:
          - gene:
              id: PKS6
              source: uniprot

    - terminator: rrnB_T1
