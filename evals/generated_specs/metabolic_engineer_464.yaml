construct:
  name: "toxic_pathway_arabinose_inducible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: ToxA
        expression: medium
        gene:
          id: ToxA
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxB
        expression: medium
        fused: false
        gene:
          id: ToxB
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxC
        expression: high
        fused: false
        gene:
          id: ToxC
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxD
        expression: high
        fused: false
        gene:
          id: ToxD
          source: uniprot

    - spacer: 25

    - cistron:
        label: ToxE
        expression: medium
        fused: false
        gene:
          id: ToxE
          source: uniprot

    - terminator: rrnB_T1
