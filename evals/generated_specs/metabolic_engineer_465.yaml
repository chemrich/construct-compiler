construct:
  name: "synthetic_metabolic_sink_operon_6core_enzymes"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: Core1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: Core1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Core2
        expression: high
        fused: false
        gene:
          id: Core2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Core3
        expression: high
        fused: false
        gene:
          id: Core3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Core4
        expression: high
        fused: false
        gene:
          id: Core4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Core5
        expression: high
        fused: false
        gene:
          id: Core5
          source: uniprot

    - spacer: 25

    - cistron:
        label: Core6
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Core6
              source: uniprot

    - terminator: rrnB_T1
