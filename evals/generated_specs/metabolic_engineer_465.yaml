        label: core3
        expression: high
        fused: false
        gene:
          id: Core3
          source: uniprot
    - spacer: 30
    - cistron:
        label: core4
        expression: high
        fused: false
        gene:
          id: Core4
          source: uniprot
    - spacer: 30
    - cistron:
        label: core5
        expression: high
        fused: false
        gene:
          id: Core5
          source: uniprot
    - spacer: 30
    - cistron:
        label: core6
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Core6
              source: uniprot
    - terminator: rrnB_T1