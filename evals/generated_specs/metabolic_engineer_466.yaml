construct:
  name: "four_enzyme_gradient_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23106
    - cistron:
        label: PathA
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PathA
              source: uniprot
    - spacer: 30
    - cistron:
        label: PathB
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PathB
              source: uniprot
    - spacer: 30
    - cistron:
        label: PathC
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PathC
              source: uniprot
    - spacer: 30
    - cistron:
        label: PathD
        expression: low
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: PathD
              source: uniprot
    - terminator: rrnB_T1