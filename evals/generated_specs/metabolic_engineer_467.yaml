construct:
  name: "sec_pentacistronic_operon"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: SecA
        expression: high
        gene:
          id: secA
          source: uniprot

    - spacer: 25

    - cistron:
        label: SecB
        expression: high
        chain:
          - signal_peptide: PelB
          - gene:
              id: secB
              source: uniprot

    - spacer: 25

    - cistron:
        label: SecC
        expression: high
        gene:
          id: secC
          source: uniprot

    - spacer: 25

    - cistron:
        label: SecD
        expression: high
        gene:
          id: secD
          source: uniprot

    - spacer: 25

    - cistron:
        label: SecE
        expression: high
        gene:
          id: secE
          source: uniprot

    - terminator: rrnB_T1
