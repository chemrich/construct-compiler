construct:
  name: "pth_constitutive_6enzyme_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100 # Strong constitutive Anderson promoter
    - cistron:
        label: pth1
        expression: medium
        fused: false
        gene:
          id: Pth1
          source: uniprot
    - spacer: 30
    - cistron:
        label: pth2
        expression: medium
        fused: false
        gene:
          id: Pth2
          source: uniprot
    - spacer: 30
    - cistron:
        label: pth3_reporter
        expression: high # Increased to high to compensate for poor expression and achieve balance
        fused: false
        chain:
          - gene:
              id: Pth3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: pth4
        expression: medium
        fused: false
        gene:
          id: Pth4
          source: uniprot
    - spacer: 30
    - cistron:
        label: pth5
        expression: medium
        fused: false
        gene:
          id: Pth5
          source: uniprot
    - spacer: 30
    - cistron:
        label: pth6
        expression: medium
        fused: false
        gene:
          id: Pth6
          source: uniprot
    - terminator: BBa_B0015