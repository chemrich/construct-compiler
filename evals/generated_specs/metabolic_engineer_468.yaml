construct:
  name: "Pth1_to_Pth6_pathway_with_GFP_Pth3_fusion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: Pth1
        expression: high
        gene:
          id: Pth1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Pth2
        expression: high
        gene:
          id: Pth2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Pth3_GFP_fusion
        expression: high
        chain:
          - gene:
              id: Pth3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: Pth4
        expression: high
        gene:
          id: Pth4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Pth5
        expression: high
        gene:
          id: Pth5
          source: uniprot

    - spacer: 25

    - cistron:
        label: Pth6
        expression: high
        gene:
          id: Pth6
          source: uniprot

    - terminator: rrnB_T1
