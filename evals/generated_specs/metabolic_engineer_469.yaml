construct:
  name: "cold_adapted_enzyme_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # lacUV5 is a strong constitutive promoter that functions well at low temperatures

    - cistron:
        label: CA1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CA1
              source: uniprot

    - spacer: 30

    - cistron:
        label: CA2
        expression: high
        fused: false
        # Alternative start codon GTG for improved translation initiation at 18°C
        codon_override:
          start: GTG
        gene:
          id: CA2
          source: uniprot

    - spacer: 30

    - cistron:
        label: CA3
        expression: high
        fused: false
        gene:
          id: CA3
          source: uniprot

    - spacer: 30

    - cistron:
        label: CA4
        expression: high
        fused: false
        # Alternative start codon TTG for improved translation initiation at 18°C
        codon_override:
          start: TTG
        gene:
          id: CA4
          source: uniprot

    - terminator: rrnB_T1
