construct:
  name: scaffold_pathway_4enzymes_tagged
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: tac

    - cistron:
        label: ScaA
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaA
              source: uniprot

    - spacer: 25

    - cistron:
        label: ScaB
        expression: high
        fused: false
        chain:
          - gene:
              id: ScaB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: ScaC
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ScaC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ScaD
        expression: high
        fused: false
        chain:
          - gene:
              id: ScaD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    - terminator: rrnB_T1
