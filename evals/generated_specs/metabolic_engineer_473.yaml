construct:
  name: "pentacistronic_Nat_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: Nat1
        expression: high
        gene:
          id: Nat1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Nat2
        expression: high
        fused: false
        gene:
          id: Nat2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Nat3
        expression: high
        fused: false
        gene:
          id: Nat3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Nat4
        expression: high
        fused: false
        gene:
          id: Nat4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Nat5
        expression: high
        fused: false
        gene:
          id: Nat5
          source: uniprot

    # Note: mRNA stability enhanced by compact spacing (25 bp RBS-to-start distances),
    # strong RBS placement via lacUV5 promoter, and rrnB terminator with downstream
    # stability elements. Consider adding stem-loop or Hfq-binding motifs post-synthesis
    # if additional mRNA stabilization is needed.

    - terminator: rrnB_T1
