construct:
  name: "nat1_5_polycistronic_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5 # lacUV5 is used as a well-characterized native E. coli promoter variant for robust expression
    - cistron:
        label: nat1
        expression: medium
        gene:
          id: Nat1
          source: uniprot
    - spacer: 30
    - cistron:
        label: nat2
        expression: medium
        fused: false
        gene:
          id: Nat2
          source: uniprot
    - spacer: 30
    - cistron:
        label: nat3
        expression: medium
        fused: false
        gene:
          id: Nat3
          source: uniprot
    - spacer: 30
    - cistron:
        label: nat4
        expression: medium
        fused: false
        gene:
          id: Nat4
          source: uniprot
    - spacer: 30
    - cistron:
        label: nat5
        expression: medium
        fused: false
        gene:
          id: Nat5
          source: uniprot
    - terminator: rrnB_T1 # Strong terminator to ensure transcript stability and proper termination