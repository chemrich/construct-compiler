construct:
  name: "six_enzyme_operon_gg"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: custom

  cassette:
    - promoter: J23106 # Medium constitutive promoter

    - cistron:
        label: Var1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Var1
              source: uniprot

    - spacer: 30

    - cistron:
        label: Var2
        expression: medium
        fused: false
        gene:
          id: Var2
          source: uniprot

    - spacer: 30

    - cistron:
        label: Var3
        expression: medium
        fused: false
        gene:
          id: Var3
          source: uniprot

    - spacer: 30

    - cistron:
        label: Var4
        expression: medium
        fused: false
        gene:
          id: Var4
          source: uniprot

    - spacer: 30

    - cistron:
        label: Var5
        expression: medium
        fused: false
        gene:
          id: Var5
          source: uniprot

    - spacer: 30

    - cistron:
        label: Var6
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Var6
              source: uniprot

    - terminator: rrnB_T1