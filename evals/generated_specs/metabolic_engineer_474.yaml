construct:
  name: "six_enzyme_operon_golden_gate"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23106  # medium constitutive promoter for stable expression
    
    - cistron:
        label: Var1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Var1
              source: uniprot
    
    - cistron:
        label: Var2
        expression: medium
        fused: false
        gene:
          id: Var2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Var3
        expression: medium
        fused: false
        gene:
          id: Var3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Var4
        expression: medium
        fused: false
        gene:
          id: Var4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Var5
        expression: medium
        fused: false
        gene:
          id: Var5
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Var6
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Var6
              source: uniprot
    
    - terminator: rrnB_T1
  
  # Comment: Golden Gate assembly ready — each enzyme between Var1 and Var6 is independently
  # translatable via separate RBS elements (fused: false). Spacers provide BsaI recognition
  # site compatibility for modular Golden Gate swapping. Add BsaI sites at cassette boundaries
  # during synthesis for full Golden Gate compatibility.
