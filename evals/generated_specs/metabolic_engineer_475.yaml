construct:
  name: chloroplast_4enzyme_operon_E_coli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: ChlA_B_C_D_polyprotein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ChlA
              source: uniprot
          - cleavage_site: P2A
          - gene:
              id: ChlB
              source: uniprot
          - cleavage_site: T2A
          - gene:
              id: ChlC
              source: uniprot
          - cleavage_site: F2A
          - gene:
              id: ChlD
              source: uniprot

    - terminator: rrnB_T1
