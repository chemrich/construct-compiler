        gene:
          id: MetB
          source: uniprot

    - spacer: 25

    - cistron:
        label: MetC
        expression: high
        rbs_strength: 0.53  # Same as MetA for ~1x
        fused: false
        gene:
          id: MetC
          source: uniprot

    - spacer: 25

    - cistron:
        label: MetD
        expression: high
        rbs_strength: 0.95  # Strongest RBS for ~3x relative to MetA
        fused: false
        gene:
          id: MetD
          source: uniprot

    - spacer: 25

    - cistron:
        label: MetE
        expression: high
        rbs_strength: 0.53  # Same as MetA for ~1x
        fused: false
        gene:
          id: MetE
          source: uniprot

    - terminator: rrnB_T1

    - terminator: BBa_B0015
