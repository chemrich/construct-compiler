construct:
  name: "five_enzyme_pathway_with_chaperone_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Chp1
        expression: medium
        gene:
          id: Chp1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Chp2
        expression: medium
        fused: false
        gene:
          id: Chp2
          source: uniprot

    - spacer: 25

    - cistron:
        label: ChaperoneA
        expression: medium
        fused: false
        gene:
          id: ChaperoneA
          source: uniprot

    - spacer: 25

    - cistron:
        label: Chp3
        expression: medium
        fused: false
        gene:
          id: Chp3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Chp4
        expression: medium
        fused: false
        gene:
          id: Chp4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Chp5
        expression: medium
        fused: false
        gene:
          id: Chp5
          source: uniprot

    - terminator: rrnB_T1
