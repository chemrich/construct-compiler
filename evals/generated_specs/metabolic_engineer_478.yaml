construct:
  name: "four_enzyme_operon_with_sRNA_regulation"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: RegA
        expression: medium
        gene:
          id: RegA
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: RegB
        expression: medium
        # sRNA binding site in 5' UTR - represented as regulatory element upstream of translation
        gene:
          id: RegB
          source: uniprot
        # Note: sRNA binding site (e.g., sRNA_bs) should be included in the 5' UTR sequence
        # during compilation; complementary sRNA supplied on separate plasmid for conditional repression
    
    - spacer: 25
    
    - cistron:
        label: RegC
        expression: medium
        gene:
          id: RegC
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: RegD
        expression: medium
        gene:
          id: RegD
          source: uniprot
    
    - terminator: rrnB_T1
