construct:
  name: "multi_enzyme_interaction_module_alt_rbs"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: IntA
        expression: high
        chain:
          - gene:
              id: IntA
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: IntB_alt_rbs
        expression: high
        fused: false
        riboswitch: true  # Alternative translation initiation via riboswitch-derived secondary structure
        gene:
          id: IntB
          source: uniprot

    - spacer: 25

    - cistron:
        label: IntC
        expression: high
        fused: false
        gene:
          id: IntC
          source: uniprot

    - spacer: 25

    - cistron:
        label: IntD_alt_rbs
        expression: high
        fused: false
        riboswitch: true  # Alternative translation initiation via riboswitch-derived secondary structure
        gene:
          id: IntD
          source: uniprot

    - spacer: 25

    - cistron:
        label: IntE
        expression: high
        fused: false
        gene:
          id: IntE
          source: uniprot

    - terminator: rrnB_T1
