construct:
  name: "E_coli_lactic_acid_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: PFL
        expression: high
        chain:
          - gene:
              id: pflB
              source: uniprot
          - tag: Strep-II
    
    - spacer: 25
    
    - cistron:
        label: Pdh
        expression: high
        fused: false
        chain:
          - gene:
              id: aceEF
              source: uniprot
          - tag: Strep-II
    
    - spacer: 25
    
    - cistron:
        label: LdhA
        expression: high
        fused: false
        chain:
          - gene:
              id: ldhA
              source: uniprot
          - tag: Strep-II
    
    - spacer: 25
    
    - cistron:
        label: ADH
        expression: high
        fused: false
        chain:
          - gene:
              id: adhE
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
