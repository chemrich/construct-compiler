```yaml
construct:
  name: "lactic_acid_pathway_anaerobic"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: narG  # anaerobic-inducible promoter
    
    - cistron:
        label: PFL
        expression: high
        chain:
          - gene:
              id: pflB
              source: uniprot
          - tag: Strep-II
    
    - spacer: 30
    
    - cistron:
        label: Pdh
        expression: high
        fused: false
        chain:
          - gene:
              id: pdhA
              source: uniprot
          - tag: Strep-II
    
    - spacer: 30
    
    - cistron:
        label: LdhA
        expression: high
        fused: false
        chain:
          - gene:
              id: ldhA
              source: uniprot
          - tag: Strep-II
    
    - spacer: 30
    
    - cistron:
        label: ADH
        expression: high
        fused: false
        chain:
          - gene:
              id: adhE
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
```