          - gene:
              id: enzyme_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: high
        chain:
          - gene:
              id: enzyme_B
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_C
        expression: high
        chain:
          - gene:
              id: enzyme_C
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_D
        expression: high
        chain:
          - gene:
              id: enzyme_D
              source: uniprot

    - terminator: rrnB_T1
