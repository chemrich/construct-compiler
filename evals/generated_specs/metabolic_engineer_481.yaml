    - cistron:
        label: E2
        expression: medium
        gene:
          id: E2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E3
        expression: medium
        gene:
          id: E3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: E4
        expression: medium
