construct:
  name: "K_enzyme_operon_with_GFP_monitor"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: K1_GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: K1
              source: uniprot

    - spacer: 25

    - cistron:
        label: K2
        expression: high
        fused: false
        gene:
          id: K2
          source: uniprot

    - spacer: 25

    - cistron:
        label: K3
        expression: high
        fused: false
        gene:
          id: K3
          source: uniprot

    - spacer: 25

    - cistron:
        label: K4
        expression: high
        fused: false
        gene:
          id: K4
          source: uniprot

    - terminator: rrnB_T1
