construct:
  name: "secondary_metabolite_pathway_M1_M5"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: M1
        expression: medium
        gene:
          id: M1
          source: uniprot

    - spacer: 25

    - cistron:
        label: M2
        expression: medium
        fused: false
        gene:
          id: M2
          source: uniprot

    - spacer: 25

    - cistron:
        label: M3
        expression: medium
        fused: false
        gene:
          id: M3
          source: uniprot

    - spacer: 25

    - cistron:
        label: M4
        expression: medium
        fused: false
        gene:
          id: M4
          source: uniprot

    - spacer: 25

    - cistron:
        label: M5
        expression: medium
        fused: false
        chain:
          - gene:
              id: M5
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
