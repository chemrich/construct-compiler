construct:
  name: "anaerobic_pathway_operon_Q1_Q2_Q3_Q4"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: fnr_regulated
      # FNR-regulated promoter for anaerobic induction

    - cistron:
        label: Q1
        expression: high
        gene:
          id: Q1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Q2
        expression: high
        fused: false
        gene:
          id: Q2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Q3
        expression: high
        fused: false
        gene:
          id: Q3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Q4
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Q4
              source: uniprot

    - terminator: rrnB_T1
