construct:
  name: "R1_R2_R3_R4_R5_operon_with_degradation_control"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong, constitutive Anderson promoter
    
    - cistron:
        label: R1
        expression: high
        gene:
          id: R1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R2
        expression: high
        gene:
          id: R2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R3
        expression: high
        gene:
          id: R3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R4
        expression: high
        gene:
          id: R4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R5
        expression: high
        chain:
          - gene:
              id: R5
              source: uniprot
          - degradation_tag: LVA  # C-terminal degradation tag for rapid turnover
    
    - terminator: rrnB_T1
