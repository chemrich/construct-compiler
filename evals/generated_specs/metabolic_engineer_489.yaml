construct:
  name: "T1_T2_T3_T4_frameshifting_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # strong constitutive promoter for operon-level expression

    - cistron:
        label: T1
        expression: high
        gene:
          id: T1
          source: uniprot

    # T1-T2 junction with programmed ribosomal frameshifting (-1 PRF)
    # The ribosomal shift reduces T2 translation efficiency to ~50% of T1
    - spacer: 50  # includes -1 PRF sequence (slippery site + downstream secondary structure)

    - cistron:
        label: T2
        expression: medium
        fused: false
        gene:
          id: T2
          source: uniprot

    - spacer: 30

    - cistron:
        label: T3
        expression: high
        fused: false
        gene:
          id: T3
          source: uniprot

    - spacer: 30

    - cistron:
        label: T4
        expression: high
        fused: false
        gene:
          id: T4
          source: uniprot

    - terminator: rrnB_T1
