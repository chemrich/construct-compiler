construct:
  name: "yeast_MEP_pathway_peroxisomal"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: DXS
        expression: high
        chain:
          - tag: PTS1
          - gene:
              id: DXS
              source: uniprot

    - spacer: 30

    - cistron:
        label: DXR
        expression: high
        chain:
          - tag: PTS1
          - gene:
              id: DXR
              source: uniprot

    - spacer: 30

    - cistron:
        label: IspD
        expression: high
        chain:
          - tag: PTS1
          - gene:
              id: IspD
              source: uniprot

    - spacer: 30

    - cistron:
        label: IspE
        expression: high
        chain:
          - tag: PTS1
          - gene:
              id: IspE
              source: uniprot

    - spacer: 30

    - cistron:
        label: IspF
        expression: high
        chain:
          - tag: PTS1
          - gene:
              id: IspF
              source: uniprot

    - spacer: 30

    - cistron:
        label: IspG
        expression: high
        chain:
          - tag: PTS1
          - tag: V5
          - gene:
              id: IspG
              source: uniprot

    - terminator: CYC1
