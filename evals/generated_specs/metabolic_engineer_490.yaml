          - tag: Dockerin
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: U2
              source: custom

    - spacer: 25

    - cistron:
        label: U3
        expression: medium
        fused: false
        chain:
          - tag: SpyTag
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: U3
              source: custom

    - spacer: 25

    - cistron:
        label: U4
        expression: medium
        fused: false
        chain:
          - tag: Dockerin
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: U4
              source: custom

    - spacer: 25

    - cistron:
        label: U5
        expression: medium
        fused: false
        chain:
          - tag: SpyTag
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: U5
              source: custom

    - terminator: rrnB_T1
