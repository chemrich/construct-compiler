construct:
  name: "five_enzyme_scaffold_operon"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: U1
        expression: medium
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: U1
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: SpyTag

    - spacer: 25

    - cistron:
        label: U2
        expression: medium
        fused: false
