construct:
  name: "six_enzyme_operon_mRNA_stable"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - utr_5: BBa_B0030  # RBS optimized for stability and translation initiation
    
    - cistron:
        label: V1
        expression: high
        gene:
          id: V1_enzyme
          source: uniprot
    
    - rbs: BBa_B0030  # Ribosome binding site between genes
    
    - cistron:
        label: V2
        expression: high
        fused: false
        gene:
          id: V2_enzyme
          source: uniprot
    
    - rbs: BBa_B0030
    
    - cistron:
        label: V3
        expression: high
        fused: false
        gene:
          id: V3_enzyme
          source: uniprot
    
    - rbs: BBa_B0030
    
    - cistron:
        label: V4
        expression: medium
        fused: false
        gene:
          id: V4_enzyme
          source: uniprot
    
    - rbs: BBa_B0030
    
    - cistron:
        label: V5
        expression: medium
        fused: false
        gene:
          id: V5_enzyme
          source: uniprot
    
    - rbs: BBa_B0030
    
    - cistron:
        label: V6
        expression: medium
        fused: false
        gene:
          id: V6_enzyme
          source: uniprot
    
    - utr_3: BBa_B0010_B0012  # rrnB T1 and terminator for mRNA stability
    
    - terminator: rrnB_T1
