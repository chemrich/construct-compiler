construct:
  name: "four_enzyme_periplasmic_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: W1_periplasmic
        expression: high
        chain:
          - tag: signal_peptide_pelB
          - cleavage_site: Signal_Peptidase_I
          - gene:
              id: W1
              source: uniprot

    - spacer: 25

    - cistron:
        label: W2_cytoplasmic
        expression: high
        fused: false
        gene:
          id: W2
          source: uniprot

    - spacer: 25

    - cistron:
        label: W3_cytoplasmic
        expression: medium
        fused: false
        gene:
          id: W3
          source: uniprot

    - spacer: 25

    - cistron:
        label: W4_cytoplasmic
        expression: medium
        fused: false
        gene:
          id: W4
          source: uniprot

    - terminator: rrnB_T1
