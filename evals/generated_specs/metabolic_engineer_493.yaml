construct:
  name: "engineered_sensor_operon_X1_X5"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD serves as engineered sensor-responsive promoter
      # (in practice, would be engineered with transcription factor binding sites)

    - cistron:
        label: X1
        expression: medium
        gene:
          id: X1
          source: uniprot

    - spacer: 25

    - cistron:
        label: X2
        expression: medium
        fused: false
        gene:
          id: X2
          source: uniprot

    - spacer: 25

    - cistron:
        label: X3
        expression: medium
        fused: false
        gene:
          id: X3
          source: uniprot

    - spacer: 25

    - cistron:
        label: X4
        expression: medium
        fused: false
        gene:
          id: X4
          source: uniprot

    - spacer: 25

    - cistron:
        label: X5
        expression: medium
        fused: false
        chain:
          - gene:
              id: X5
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
