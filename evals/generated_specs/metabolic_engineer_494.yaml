construct:
  name: "six_enzyme_operon_balanced_low_burden"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5  # medium-strength, tightly regulated promoter for balanced expression

    - cistron:
        label: Y1
        expression: medium
        gene:
          id: Y1
          source: uniprot

    - spacer: 25

    - cistron:
        label: Y2
        expression: medium
        fused: false
        gene:
          id: Y2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Y3
        expression: low  # reduced expression to minimize toxicity
        fused: false
        gene:
          id: Y3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Y4
        expression: medium
        fused: false
        gene:
          id: Y4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Y5
        expression: medium
        fused: false
        gene:
          id: Y5
          source: uniprot

    - spacer: 25

    - cistron:
        label: Y6
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Y6
              source: uniprot

    - terminator: rrnB_T1
