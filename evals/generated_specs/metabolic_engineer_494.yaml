        label: enzyme_Y3
        expression: low
        fused: false
        gene:
          id: Y3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_Y4
        expression: medium
        fused: false
        gene:
          id: Y4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_Y5
        expression: medium
        fused: false
        gene:
          id: Y5
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_Y6
        expression: medium
        fused: false
