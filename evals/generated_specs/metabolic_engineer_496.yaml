construct:
  name: "five_enzyme_pathway_operon_variant_A"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # strong constitutive promoter for high-throughput screening

    - cistron:
        label: barcode_5prime
        expression: high
        gene:
          id: AAAACCCGGGAAACCCGGG  # 5' variant barcode sequence
          source: custom

    - spacer: 20

    - cistron:
        label: Eta1
        expression: high
        fused: false
        gene:
          id: eta1
          source: uniprot

    - spacer: 20

    - cistron:
        label: Eta2
        expression: high
        fused: false
        gene:
          id: eta2
          source: uniprot

    - spacer: 20

    - cistron:
        label: Eta3
        expression: high
        fused: false
        gene:
          id: eta3
          source: uniprot

    - spacer: 20

    - cistron:
        label: Eta4
        expression: high
        fused: false
        gene:
          id: eta4
          source: uniprot

    - spacer: 20

    - cistron:
        label: Eta5
        expression: high
        fused: false
        gene:
          id: eta5
          source: uniprot

    - spacer: 20

    - cistron:
        label: barcode_3prime
        expression: high
        gene:
          id: TTTGGGCCCTTTGGGCCC  # 3' variant barcode sequence (reverse complement variant)
          source: custom

    - terminator: rrnB_T1
