construct:
  name: "theta_six_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter (Anderson collection)
    
    - cistron:
        label: Theta1
        expression: high
        rbs: BBa_B0030  # Strong RBS for high expression
        gene:
          id: theta1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Theta2
        expression: high
        rbs: BBa_B0030  # Strong RBS for high expression
        fused: false
        gene:
          id: theta2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Theta3
        expression: medium
        rbs: BBa_B0031  # Medium RBS for intermediate expression
        fused: false
        gene:
          id: theta3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Theta4
        expression: medium
        rbs: BBa_B0031  # Medium RBS for intermediate expression
        fused: false
        gene:
          id: theta4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Theta5
        expression: low
        rbs: BBa_B0032  # Weak RBS for low expression
        fused: false
        gene:
          id: theta5
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Theta6
        expression: low
        rbs: BBa_B0032  # Weak RBS for low expression
        fused: false
        gene:
          id: theta6
          source: uniprot
    
    - terminator: rrnB_T1
