construct:
  name: "iota_quadruple_operon"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: J23100  # constitutive promoter for compact design
    
    - cistron:
        label: Iota1
        expression: high
        gene:
          id: iota1
          source: uniprot
    
    - spacer: 20  # minimal spacer for compact footprint
    
    - cistron:
        label: Iota2
        expression: high
        gene:
          id: iota2
          source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: Iota3
        expression: high
        gene:
          id: iota3
          source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: Iota4
        expression: high
        chain:
          - gene:
              id: iota4
              source: uniprot
          - tag: HA
    
    - terminator: rrnB_T1
