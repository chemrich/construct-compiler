construct:
  name: "iota_compact_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100 # High-strength constitutive promoter
    - cistron:
        label: iota1
        expression: high
        gene:
          id: Iota1
          source: uniprot
    - spacer: 20
    - cistron:
        label: iota2
        expression: high
        fused: false
        gene:
          id: Iota2
          source: uniprot
    - spacer: 20
    - cistron:
        label: iota3
        expression: high
        fused: false
        gene:
          id: Iota3
          source: uniprot
    - spacer: 20
    - cistron:
        label: iota4
        expression: high
        fused: false
        chain:
          - gene:
              id: Iota4
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015