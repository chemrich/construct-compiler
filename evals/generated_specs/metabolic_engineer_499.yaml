construct:
  name: "five_enzyme_pathway_conditional_kappa3_degradation"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Kappa1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Kappa1
              source: uniprot

    - spacer: 30

    - cistron:
        label: Kappa2
        expression: high
        fused: false
        chain:
          - gene:
              id: Kappa2
              source: uniprot

    - spacer: 30

    - cistron:
        label: Kappa3_degron
        expression: high
        fused: false
        chain:
          - gene:
              id: Kappa3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ssrA_degron

    - spacer: 30

    - cistron:
        label: Kappa4
        expression: high
        fused: false
        chain:
          - gene:
              id: Kappa4
              source: uniprot

    - spacer: 30

    - cistron:
        label: Kappa5
        expression: high
        fused: false
        chain:
          - gene:
              id: Kappa5
              source: uniprot

    - terminator: rrnB_T1
