construct:
  name: "C_glutamicum_amino_acid_biosynthesis_operon"
  host: bacillus  # C. glutamicum uses similar expression systems to Bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter suitable for C. glutamicum

    - cistron:
        label: enzyme_1_dehydratase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dehydratase_1
              source: uniprot

    - spacer: 20

    - cistron:
        label: P2A_peptide_1
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 20

    - cistron:
        label: enzyme_2_transaminase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: transaminase_1
              source: uniprot

    - spacer: 20

    - cistron:
        label: P2A_peptide_2
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 20

    - cistron:
        label: enzyme_3_dehydratase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dehydratase_2
              source: uniprot

    - spacer: 20

    - cistron:
        label: P2A_peptide_3
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 20

    - cistron:
        label: enzyme_4_transaminase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: transaminase_2
              source: uniprot

    - terminator: rrnB_T1
