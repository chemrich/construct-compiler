construct:
  name: metabolic_therapy_multi_enzyme_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: enzyme_x
        expression: high
        chain:
          - gene:
              id: enzyme_x
              source: uniprot
          - cleavage_site: T2A
          - tag: HA

    - cistron:
        label: enzyme_y
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_y
              source: uniprot
          - cleavage_site: T2A
          - tag: HA

    - cistron:
        label: enzyme_z
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_z
              source: uniprot
          - cleavage_site: T2A
          - tag: HA

    - cistron:
        label: cofactor_recycler
        expression: high
        fused: false
        chain:
          - gene:
              id: cofactor_recycler
              source: uniprot
          - tag: HA

    - terminator: SV40_poly_A
