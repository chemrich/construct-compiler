construct:
  name: "yeast_cellulase_complex"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: endoglucanase
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: EG_Trichoderma_reesei
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: exoglucanase
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: EX_Trichoderma_reesei
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: beta_glucosidase
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: BGL_Aspergillus_niger
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: cellobiose_phosphorylase
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: CBP_Cellvibrio_vulgaris
              source: uniprot
          - tag: HA

    - terminator: CYC1
