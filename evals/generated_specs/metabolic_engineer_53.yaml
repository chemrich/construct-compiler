construct:
  name: antibiotic_biosynthesis_six_enzyme_pathway
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_A
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: enzyme_B
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_C
              source: uniprot
          - cleavage_site: TEV
          - solubility_tag: SUMO
    
    - spacer: 30
    
    - cistron:
        label: enzyme_D
        expression: high
        fused: false
        gene:
          id: enzyme_D
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_E
        expression: high
        fused: false
        gene:
          id: enzyme_E
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_F
        expression: high
        fused: false
        gene:
          id: enzyme_F
          source: uniprot
    
    - terminator: rrnB_T1
