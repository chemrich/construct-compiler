construct:
  name: "biodegradable_plastic_monomer_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # glucose-repressible alternative to native arabinose promoter

    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: enzyme_A
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_B
        expression: high
        gene:
          id: enzyme_B
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_C
        expression: high
        chain:
          - gene:
              id: enzyme_C
              source: uniprot
          - tag: T7

    - spacer: 30

    - cistron:
        label: enzyme_D
        expression: high
        gene:
          id: enzyme_D
          source: uniprot

    - terminator: rrnB_T1
