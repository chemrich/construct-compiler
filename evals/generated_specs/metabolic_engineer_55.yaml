construct:
  name: "yeast_flavonoid_pathway_6gene"
  host: yeast

  backbone:
    catalog_vector: "pRS426"
    resistance: uracil
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: CHS
        expression: high
        chain:
          - gene:
              id: CHS1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: GST

    - spacer: 25

    - cistron:
        label: CHI
        expression: high
        fused: false
        gene:
          id: CHI
          source: uniprot

    - spacer: 25

    - cistron:
        label: F3H
        expression: high
        fused: false
        gene:
          id: F3H
          source: uniprot

    - spacer: 25

    - cistron:
        label: FLS
        expression: high
        fused: false
        gene:
          id: FLS
          source: uniprot

    - spacer: 25

    - cistron:
        label: DFR
        expression: high
        fused: false
        gene:
          id: DFR
          source: uniprot

    - spacer: 25

    - cistron:
        label: ANS
        expression: high
        fused: false
        gene:
          id: ANS
          source: uniprot

    - terminator: CYC1
