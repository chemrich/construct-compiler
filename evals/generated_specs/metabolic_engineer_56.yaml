construct:
  name: nif_operon_synthetic_nitrogen_fixation
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # oxygen-sensitive alternative; ideally use a microaerobic/hypoxic promoter like fnr or similar
      # Note: araBAD is used as a proxy for inducible control; for true oxygen-sensitivity, consider fnr promoter if available

    - cistron:
        label: NifH
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: nifH
              source: uniprot

    - spacer: 25

    - cistron:
        label: NifD
        expression: high
        fused: false
        gene:
          id: nifD
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifK
        expression: high
        fused: false
        gene:
          id: nifK
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifB
        expression: high
        fused: false
        gene:
          id: nifB
          source: uniprot

    - spacer: 25

    - cistron:
        label: NifV
        expression: high
        fused: false
        gene:
          id: nifV
          source: uniprot

    - terminator: rrnB_T1
