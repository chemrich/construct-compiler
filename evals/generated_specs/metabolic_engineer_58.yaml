construct:
  name: "mammalian_drug_metabolism_panel_tetOn"
  host: HEK293

  backbone:
    catalog_vector: "pTRE-Tight"
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: TRE_tight

    - cistron:
        label: CYP1A1
        expression: medium
        chain:
          - gene:
              id: CYP1A1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: CYP2D6
        expression: medium
        fused: false
        chain:
          - gene:
              id: CYP2D6
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: V5

    - spacer: 30

    - cistron:
        label: CYP3A4
        expression: medium
        fused: false
        chain:
          - gene:
              id: CYP3A4
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Myc

    - spacer: 30

    - cistron:
        label: NAT2
        expression: medium
        fused: false
        chain:
          - gene:
              id: NAT2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - spacer: 30

    - cistron:
        label: UGT1A1
        expression: medium
        fused: false
        chain:
          - gene:
              id: UGT1A1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Twin-Strep

    - terminator: SV40_polyA
