construct:
  name: algae_lipid_synthesis_pathway_ecoli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: ACP
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ACP
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: KAS
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: KAS
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: KAR
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: KAR
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: DH
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: DH
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: ER
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ER
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
