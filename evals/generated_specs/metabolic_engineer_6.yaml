construct:
  name: "rhodobacter_sphaeroides_nitrogenase_operon"
  host: e_coli  # Using e_coli as a proxy for Rhodobacter sphaeroides as it is not in the supported host list
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Strong bacterial promoter often used for metabolic engineering
    - cistron:
        label: nifH
        expression: high
        gene:
          id: Q05149
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifD
        expression: high
        fused: false
        gene:
          id: Q05151
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifK
        expression: medium
        fused: false
        gene:
          id: Q05152
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifE
        expression: medium
        fused: false
        gene:
          id: Q53102
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifN
        expression: medium
        fused: false
        gene:
          id: Q53103
          source: uniprot
    - spacer: 30
    - cistron:
        label: nifB
        expression: medium
        fused: false
        gene:
          id: Q05146
          source: uniprot
    - terminator: rrnB_T1