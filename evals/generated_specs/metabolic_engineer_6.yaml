construct:
  name: "rhodobacter_nitrogenase_assembly_operon"
  host: bacillus  # R. sphaeroides is alpha-proteobacterium; bacillus represents gram-positive/prokaryotic expression system with anaerobic capability

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PnifA  # Strong anaerobic/diazotrophic promoter from nif regulon; activated by NifA under nitrogen-limited conditions

    - cistron:
        label: NifB
        expression: high
        rbs: RBS_strong_1  # High-strength RBS (e.g., consensus AGGAGGU with optimal spacing ~5-9 nt from start)
        chain:
          - gene:
              id: nifB
              source: uniprot  # Nitrogenase cofactor maturase

    - spacer: 25

    - cistron:
        label: NifE
        expression: high
        rbs: RBS_strong_1  # Matched RBS strength to NifB for 2x expression ratio
        fused: false
        chain:
          - gene:
              id: nifE
              source: uniprot  # Nitrogenase molybdenum-cofactor synthesis protein

    - spacer: 25

    - cistron:
        label: NifN
        expression: medium
        rbs: RBS_medium_2  # Weaker RBS (e.g., GAGG with 7 nt spacing) for ~0.5x relative to NifB/NifE
        fused: false
        chain:
          - gene:
              id: nifN
              source: uniprot  # Nitrogenase molybdenum-cofactor synthesis protein

    - spacer: 25

    - cistron:
        label: NifX
        expression: medium
        rbs: RBS_medium_2  # Consistent medium RBS
        fused: false
        chain:
          - gene:
              id: nifX
              source: uniprot  # Nitrogenase cofactor maturation factor

    - spacer: 25

    - cistron:
        label: NifW
        expression: medium
        rbs: RBS_medium_2
        fused: false
        chain:
          - gene:
              id: nifW
              source: uniprot  # Nitrogenase cofactor maturase

    - spacer: 25

    - cistron:
        label: NifZ
        expression: medium
        rbs: RBS_medium_2
        fused: false
        chain:
          - gene:
              id: nifZ
              source: uniprot  # Nitrogenase molybdenum-cofactor synthesis protein

    - terminator: rrnB_T1
