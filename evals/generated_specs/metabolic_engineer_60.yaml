construct:
  name: "xylose_utilization_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: XylA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: xylA
              source: uniprot
    - spacer: 30
    - cistron:
        label: XylB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylB
              source: uniprot
    - spacer: 30
    - cistron:
        label: XylC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylC
              source: uniprot
    - spacer: 30
    - cistron:
        label: XylD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: xylD
              source: uniprot
    - terminator: rrnB_T1
