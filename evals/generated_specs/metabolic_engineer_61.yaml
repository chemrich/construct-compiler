construct:
  name: "carotenoid_biosynthesis_pathway"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: crtE
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: crtE
              source: uniprot
    - spacer: 30
    - cistron:
        label: crtB
        expression: medium
        fused: false
        gene:
          id: crtB
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtI
        expression: low
        fused: false
        gene:
          id: crtI
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtY
        expression: low
        fused: false
        gene:
          id: crtY
          source: uniprot
    - spacer: 30
    - cistron:
        label: crtZ
        expression: low
        fused: false
        gene:
          id: crtZ
          source: uniprot
    - terminator: rrnB_T1