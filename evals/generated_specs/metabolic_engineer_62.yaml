construct:
  name: "PKS_module_6enzyme_operon"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: PKS_KS
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - gene:
              id: pks_ketosynthase
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS_AT
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: pks_acyltransferase
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS_DH
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: pks_dehydratase
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS_ER
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: pks_enoylreductase
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS_KR
        expression: high
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: pks_ketoreductase
              source: uniprot

    - spacer: 20

    - cistron:
        label: PKS_ACP
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP
          - gene:
              id: pks_acp
              source: uniprot

    - terminator: rrnB_T1
