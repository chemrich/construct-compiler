construct:
  name: "Bacillus_subtilis_therapeutic_peptide_operon"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pveg  # Strong constitutive promoter for Bacillus subtilis
    - cistron:
        label: PeptA
        expression: high
        chain:
          - gene:
              id: PeptA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: PeptB
        expression: high
        fused: false
        chain:
          - gene:
              id: PeptB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: PeptC
        expression: high
        fused: false
        chain:
          - gene:
              id: PeptC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - spacer: 30
    - cistron:
        label: PeptD
        expression: high
        fused: false
        chain:
          - gene:
              id: PeptD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
    - terminator: rrnB_T1