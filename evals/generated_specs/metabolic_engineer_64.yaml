construct:
  name: "pseudomonas_putida_pollutant_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: enzyme_1
        expression: high
        fused: false
        gene:
          id: alkB
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: almA
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - gene:
              id: catA
              source: uniprot
          - tag: FLAG

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: xylE
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        gene:
          id: todC
          source: uniprot

    - terminator: rrnB_T1
