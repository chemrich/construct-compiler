construct:
  name: cofactor_regeneration_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: enzyme_1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: NAD_kinase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        chain:
          - gene:
              id: phosphopantetheine_adenylyltransferase
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: pantothenate_synthetase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        chain:
          - gene:
              id: thiamine_phosphate_synthase
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: riboflavin_synthase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_6
        expression: medium
        fused: false
        chain:
          - gene:
              id: FAD_synthetase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
