construct:
  name: "four_enzyme_operon_tiered_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - gene:
              id: araB
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        chain:
          - gene:
              id: xylA
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: medium
        fused: false
        gene:
          id: pta
          source: uniprot

    - terminator: rrnB_T1

    - terminator: BBa_B0015
