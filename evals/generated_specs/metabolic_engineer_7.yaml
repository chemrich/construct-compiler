construct:
  name: "kl_lactis_xylose_mitochondrial_pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    # Robust constitutive expression in K. lactis is achieved via individual transcriptional units
    - promoter: TEF1
    - cistron:
        label: xyr1_xylose_reductase
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: O74205
              source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: xdh1_xylitol_dehydrogenase
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: O74206
              source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: xks1_xylulokinase
        expression: high
        chain:
          - tag: MTS
          - tag: FLAG
          - gene:
              id: P42328
              source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: tkl1_transketolase
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: Q6CWN1
              source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: tal1_transaldolase
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: Q6CIT1
              source: uniprot
    - terminator: CYC1