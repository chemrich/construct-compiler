construct:
  name: "K_lactis_mitochondrial_xylose_utilization_pathway"
  host: yeast

  backbone:
    catalog_vector: "pKLAC1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: xylose_reductase
        expression: high
        chain:
          - tag: MTS_Sc_Cox4
          - gene:
              id: XYL1
              source: uniprot

    - spacer: 25

    - cistron:
        label: xylitol_dehydrogenase
        expression: high
        fused: false
        chain:
          - tag: MTS_Sc_Cox4
          - gene:
              id: XYL2
              source: uniprot

    - spacer: 25

    - cistron:
        label: xylulose_kinase_FLAG
        expression: high
        fused: false
        chain:
          - tag: MTS_Sc_Cox4
          - gene:
              id: XYL3
              source: uniprot
          - tag: FLAG
          - cleavage_site: TEV

    - spacer: 25

    - cistron:
        label: pentose_phosphate_enzyme_4
        expression: high
        fused: false
        chain:
          - tag: MTS_Sc_Cox4
          - gene:
              id: XKS1
              source: uniprot

    - spacer: 25

    - cistron:
        label: pentose_phosphate_enzyme_5
        expression: high
        fused: false
        chain:
          - tag: MTS_Sc_Cox4
          - gene:
              id: TAL1
              source: uniprot

    - terminator: CYC1_terminator
