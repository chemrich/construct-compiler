construct:
  name: "bacillus_five_enzyme_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43  # Strong constitutive B. subtilis promoter

    - cistron:
        label: enzyme_1_secreted
        expression: high
        chain:
          - signal_peptide: AmyE  # B. subtilis signal peptide for secretion
          - gene:
              id: enzyme_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: enzyme_2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: enzyme_3
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: enzyme_4
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        gene:
          id: enzyme_5
          source: uniprot

    - terminator: rrnB_T1
