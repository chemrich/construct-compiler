construct:
  name: "carbon_fixation_operon_6enzyme"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cspA  # cold-shock inducible, strong promoter for low-temperature expression

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - gene:
              id: enzyme1_cfx
              source: uniprot
          - solubility_tag: SUMO

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        gene:
          id: enzyme2_cfx
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        gene:
          id: enzyme3_cfx
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        gene:
          id: enzyme4_cfx
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme5
        expression: high
        fused: false
        gene:
          id: enzyme5_cfx
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme6
        expression: high
        fused: false
        gene:
          id: enzyme6_cfx
          source: uniprot

    - terminator: rrnB_T1
