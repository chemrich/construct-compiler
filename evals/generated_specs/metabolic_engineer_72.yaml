  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: multi_enzyme_complex
        expression: high
        chain:
          - gene:
              id: sensing_enzyme_1
              source: uniprot
          - linker:
              type: short_GS
          - gene:
              id: sensing_enzyme_2
              source: uniprot
          - linker:
              type: short_GS
          - gene:
              id: sensing_enzyme_3
              source: uniprot
          - linker:
              type: short_GS
          - gene:
              id: sensing_enzyme_4
              source: uniprot
    - terminator: BBa_B0015