construct:
  name: "four_enzyme_nutrient_sensing_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme_2
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme_3
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: enzyme_4
              source: uniprot

    - terminator: BBa_B0015
