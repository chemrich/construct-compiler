construct:
  name: "Pp_plastic_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PpuC

    - cistron:
        label: Depoly1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Depoly1
              source: uniprot

    - spacer: 25

    - cistron:
        label: Depoly2
        expression: high
        fused: false
        gene:
          id: Depoly2
          source: uniprot

    - spacer: 25

    - cistron:
        label: Depoly3
        expression: high
        fused: false
        gene:
          id: Depoly3
          source: uniprot

    - spacer: 25

    - cistron:
        label: Depoly4
        expression: high
        fused: false
        gene:
          id: Depoly4
          source: uniprot

    - spacer: 25

    - cistron:
        label: Depoly5
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Depoly5
              source: uniprot

    - terminator: rrnB_T1
