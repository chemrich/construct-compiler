construct:
  name: pharmaceutical_intermediate_6enzyme_operon
  host: e_coli

  backbone:
    catalog_vector: pET-28b(+)
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: tac

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme1
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme2
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme3
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme4
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme5
        expression: low
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme5
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme6
        expression: low
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme6
              source: uniprot

    - terminator: rrnB_T1
