construct:
  name: "tuned_four_enzyme_operon"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: E1_enzyme
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: E2_enzyme
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: E3_enzyme
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: low
        fused: false
        gene:
          id: E4_enzyme
          source: uniprot
    - terminator: T7term