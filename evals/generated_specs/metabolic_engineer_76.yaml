construct:
  name: "five_enzyme_biosynthetic_operon_tunable"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_1
        expression: low
        chain:
          - gene:
              id: enzyme_1
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - spacer: 35
    
    - cistron:
        label: enzyme_2
        expression: low
        fused: false
        chain:
          - gene:
              id: enzyme_2
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - spacer: 35
    
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        chain:
          - gene:
              id: enzyme_3
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - spacer: 35
    
    - cistron:
        label: enzyme_4
        expression: low
        fused: false
        chain:
          - gene:
              id: enzyme_4
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - spacer: 35
    
    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        chain:
          - gene:
              id: enzyme_5
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    
    - terminator: rrnB_T1
