construct:
  name: "bacillus_starch_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_veg  # Strong constitutive promoter for Bacillus subtilis

    - cistron:
        label: amylase_1
        expression: high
        codon_optimization: bacillus
        chain:
          - signal_peptide: AmyE_signal  # B. subtilis AmyE secretion signal
          - gene:
              id: amyA
              source: uniprot  # Alpha-amylase

    - spacer: 25

    - cistron:
        label: amylase_2
        expression: high
        codon_optimization: bacillus
        fused: false
        chain:
          - signal_peptide: AmyE_signal
          - gene:
              id: amyB
              source: uniprot  # Beta-amylase

    - spacer: 25

    - cistron:
        label: pullulanase
        expression: high
        codon_optimization: bacillus
        fused: false
        chain:
          - signal_peptide: AmyE_signal
          - gene:
              id: pulA
              source: uniprot  # Pullulanase

    - spacer: 25

    - cistron:
        label: isoamylase
        expression: high
        codon_optimization: bacillus
        fused: false
        chain:
          - signal_peptide: AmyE_signal
          - gene:
              id: isoA
              source: uniprot  # Isoamylase

    - spacer: 25

    - cistron:
        label: maltase
        expression: high
        codon_optimization: bacillus
        fused: false
        chain:
          - signal_peptide: AmyE_signal
          - gene:
              id: malA
              source: uniprot  # Maltase

    - spacer: 25

    - cistron:
        label: glucoamylase
        expression: high
        codon_optimization: bacillus
        fused: false
        chain:
          - signal_peptide: AmyE_signal
          - gene:
              id: glaA
              source: uniprot  # Glucoamylase

    - terminator: rrnB_T1  # Robust transcription terminator
