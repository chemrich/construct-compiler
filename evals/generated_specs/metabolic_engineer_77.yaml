construct:
  name: "Bacillus_starch_degradation_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg  # Strong constitutive Bacillus subtilis promoter
    
    - cistron:
        label: alpha_amylase
        expression: high
        chain:
          - tag: AmyE_signal
          - gene:
              id: P00691
              source: uniprot

    - spacer: 30

    - cistron:
        label: pullulanase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: P07206
              source: uniprot

    - spacer: 30

    - cistron:
        label: glucoamylase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: P04064
              source: uniprot

    - spacer: 30

    - cistron:
        label: isoamylase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: P39120
              source: uniprot

    - spacer: 30

    - cistron:
        label: maltogenic_amylase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: P15334
              source: uniprot

    - spacer: 30

    - cistron:
        label: alpha_glucosidase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: P40208
              source: uniprot

    - terminator: BBa_B0015