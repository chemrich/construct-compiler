construct:
  name: "enzyme_consortia_tet_operon"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene
  cassette:
    - promoter: Ptet  # Tetracycline-inducible promoter for tight control
    - cistron:
        label: enzyme_1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P0A6C8
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: P0A6C4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: P0A6C1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_4
        expression: medium
        fused: false
        gene:
          id: P0A9K1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_5
        expression: medium
        fused: false
        chain:
          - gene:
              id: P0A9K4
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1