construct:
  name: "five_enzyme_consortium_operon_tet_inducible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR  # tetracycline-inducible (tight OFF, induced ON)

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: araB
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: araA
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        gene:
          id: araD
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - gene:
              id: araE
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
