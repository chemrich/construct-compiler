construct:
  name: "glucose_pathway_tuned_cascade"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: glucose_6_phosphatase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - rbs: RBS_strong
          - gene:
              id: phosphoglucose_isomerase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: medium
        fused: false
        chain:
          - rbs: RBS_medium
          - gene:
              id: phosphofructokinase
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme4
        expression: low
        fused: false
        chain:
          - rbs: RBS_weak
          - gene:
              id: aldolase
              source: uniprot

    - terminator: rrnB_T1
