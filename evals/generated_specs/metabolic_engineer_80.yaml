construct:
  name: "balanced_operon_E1_E5_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: E1
        expression: high
        gene:
          id: E1
          source: uniprot
    - spacer: 30
    - cistron:
        label: E2
        expression: high
        fused: false
        gene:
          id: E2
          source: uniprot
    - spacer: 30
    - cistron:
        label: E3
        expression: medium
        fused: false
        gene:
          id: E3
          source: uniprot
    - spacer: 30
    - cistron:
        label: E4
        expression: medium
        fused: false
        gene:
          id: E4
          source: uniprot
    - spacer: 30
    - cistron:
        label: E5
        expression: low
        fused: false
        gene:
          id: E5
          source: uniprot
    - terminator: rrnB_T1