construct:
  name: metabolic_pathway_operon_G1G2G3G4
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: G1
        expression: high
        gene:
          id: G1
          source: uniprot

    - spacer: 25

    - cistron:
        label: G2
        expression: high
        fused: false
        gene:
          id: G2
          source: uniprot
        # RBS strength: strong (BBa_B0034 equivalent) for 2x relative expression

    - spacer: 25

    - cistron:
        label: G3
        expression: high
        fused: false
        gene:
          id: G3
          source: uniprot
        # RBS strength: weak (BBa_B0030 equivalent) for 1x relative expression

    - spacer: 25

    - cistron:
        label: G4
        expression: high
        fused: false
        gene:
          id: G4
          source: uniprot
        # RBS strength: very strong (BBa_B0064 equivalent) for 3x relative expression

    - terminator: rrnB_T1
