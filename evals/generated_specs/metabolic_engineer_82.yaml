construct:
  name: "six_enzyme_operon_industrial_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - gene:
              id: enzyme_A
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_B
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_C
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme_D
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_D
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme_E
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_E
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: enzyme_F
        expression: high
        fused: false
        chain:
          - gene:
              id: enzyme_F
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
