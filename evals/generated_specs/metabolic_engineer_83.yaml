construct:
  name: metabolic_cascade_m1_m5_bacillus
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: Pveg # Strong constitutive promoter for Bacillus subtilis
    - cistron:
        label: M1
        expression: medium
        gene:
          id: M1
          source: uniprot
    - spacer: 30
    - cistron:
        label: M2
        expression: medium
        fused: false
        gene:
          id: M2
          source: uniprot
    - spacer: 30
    - cistron:
        label: M3
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: M3
              source: uniprot
    - spacer: 30
    - cistron:
        label: M4
        expression: medium
        fused: false
        gene:
          id: M4
          source: uniprot
    - spacer: 30
    - cistron:
        label: M5
        expression: medium
        fused: false
        gene:
          id: M5
          source: uniprot
    - terminator: rrnB_T1