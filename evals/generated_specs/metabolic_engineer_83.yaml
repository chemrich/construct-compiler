construct:
  name: metabolic_cascade_M1_M5_bacillus
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: M1
        expression: medium
        gene:
          id: M1
          source: uniprot

    - spacer: 25

    - cistron:
        label: M2
        expression: medium
        fused: false
        gene:
          id: M2
          source: uniprot

    - spacer: 25

    - cistron:
        label: M3
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: M3
              source: uniprot

    - spacer: 25

    - cistron:
        label: M4
        expression: medium
        fused: false
        gene:
          id: M4
          source: uniprot

    - spacer: 25

    - cistron:
        label: M5
        expression: medium
        fused: false
        gene:
          id: M5
          source: uniprot

    - terminator: rrnB_T1
