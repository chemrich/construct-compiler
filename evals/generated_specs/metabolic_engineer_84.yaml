construct:
  name: four_enzyme_operon_Pp
  host: pseudomonas_putida

  backbone:
    resistance: kanamycin
    ori: pBBR1
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: E1_E2_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: E2
              source: uniprot

    - spacer: 25

    - cistron:
        label: E3
        expression: high
        fused: false
        gene:
          id: E3
          source: uniprot

    - spacer: 25

    - cistron:
        label: E4
        expression: high
        fused: false
        gene:
          id: E4
          source: uniprot

    - terminator: rrnB_T1
