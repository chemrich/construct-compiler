        label: enzyme_P2
        expression: medium
        fused: false
        gene:
          id: P2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_P3
        expression: high
        fused: false
        gene:
          id: P3
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_P4
        expression: high
        fused: false
        gene:
          id: P4
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_P5
        expression: high
        fused: false
        gene:
          id: P5
          source: uniprot
    - terminator: rrnB_T1