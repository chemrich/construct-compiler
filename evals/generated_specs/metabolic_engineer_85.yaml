construct:
  name: "five_enzyme_pathway_optimized_flux"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter for high metabolic flux
    
    - cistron:
        label: P1
        expression: medium
        gene:
          id: P1
          source: uniprot
    
    - cistron:
        label: P2
        expression: medium
        fused: true
        gene:
          id: P2
          source: uniprot
    
    - cistron:
        label: P3
        expression: high
        fused: true
        gene:
          id: P3
          source: uniprot
    
    - cistron:
        label: P4
        expression: high
        fused: true
        gene:
          id: P4
          source: uniprot
    
    - cistron:
        label: P5
        expression: high
        fused: true
        gene:
          id: P5
          source: uniprot
    
    - terminator: rrnB_T1
