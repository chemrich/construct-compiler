construct:
  name: "rhodobacter_oxygen_sensing_operon_S1-S4"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PnifA
      # Oxygen-sensitive promoter commonly used in Rhodobacter for anaerobic/microaerobic regulation

    - cistron:
        label: S1
        expression: medium
        gene:
          id: S1
          source: uniprot

    - spacer: 25

    - cistron:
        label: S2
        expression: medium
        fused: false
        gene:
          id: S2
          source: uniprot

    - spacer: 25

    - cistron:
        label: S3
        expression: medium
        fused: false
        gene:
          id: S3
          source: uniprot

    - spacer: 25

    - cistron:
        label: S4_reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
