construct:
  name: "six_enzyme_operon_with_degradation_tags"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: C1
        expression: high
        chain:
          - tag: ssrA
          - gene:
              id: C1
              source: uniprot

    - spacer: 25

    - cistron:
        label: C2
        expression: high
        fused: false
        chain:
          - tag: ssrA
          - gene:
              id: C2
              source: uniprot

    - spacer: 25

    - cistron:
        label: C3
        expression: high
        fused: false
        chain:
          - tag: ssrA
          - gene:
              id: C3
              source: uniprot

    - spacer: 25

    - cistron:
        label: C4
        expression: high
        fused: false
        gene:
          id: C4
          source: uniprot

    - spacer: 25

    - cistron:
        label: C5
        expression: high
        fused: false
        gene:
          id: C5
          source: uniprot

    - spacer: 25

    - cistron:
        label: C6
        expression: high
        fused: false
        gene:
          id: C6
          source: uniprot

    - terminator: rrnB_T1
