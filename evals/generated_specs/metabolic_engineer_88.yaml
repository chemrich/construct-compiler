construct:
  name: "four_enzyme_complex_operon"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: X1
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: X1
              source: uniprot

    - spacer: 25

    - cistron:
        label: X2
        expression: medium
        fused: false
        gene:
          id: X2
          source: uniprot

    - spacer: 25

    - cistron:
        label: X3
        expression: medium
        fused: false
        gene:
          id: X3
          source: uniprot

    - spacer: 25

    - cistron:
        label: X4
        expression: medium
        fused: false
        gene:
          id: X4
          source: uniprot

    - terminator: rrnB_T1
