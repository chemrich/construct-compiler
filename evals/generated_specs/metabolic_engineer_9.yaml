construct:
  name: "P_putida_pollutant_degradation_operon"
  host: pseudomonas_putida
  
  backbone:
    resistance: gentamicin
    ori: RK2
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD allows induction by L-arabinose; can be engineered for pollutant-responsive variants
    
    - cistron:
        label: enzyme_1_monooxygenase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PAH_monooxygenase
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_2_hydroxylase
        expression: high
        fused: false
        gene:
          id: PAH_hydroxylase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_3_dehydrogenase
        expression: high
        fused: false
        gene:
          id: catechol_dehydrogenase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_4_oxygenase
        expression: high
        fused: false
        gene:
          id: catechol_1_2_oxygenase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_5_isomerase
        expression: high
        fused: false
        gene:
          id: muconate_isomerase
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: enzyme_6_lactonase
        expression: high
        fused: false
        gene:
          id: muconolactone_isomerase
          source: uniprot
    
    - terminator: rrnB_T1
