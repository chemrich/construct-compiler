construct:
  name: "ribosome_profiling_gradient_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106
    - cistron:
        label: R1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: R2
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: R3
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: R4
        expression: very_low
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1