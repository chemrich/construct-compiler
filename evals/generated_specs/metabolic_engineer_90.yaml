construct:
  name: "ribosome_profiling_operon_R1_R2_R3_R4"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: R1
        expression: high
        chain:
          - gene:
              id: R1
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R2
        expression: medium
        fused: false
        chain:
          - gene:
              id: R2
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R3
        expression: low
        fused: false
        chain:
          - gene:
              id: R3
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: R4
        expression: very_low
        fused: false
        chain:
          - gene:
              id: R4
              source: uniprot
    
    - terminator: rrnB_T1
