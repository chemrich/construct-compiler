construct:
  name: "biofilm_enhancement_operon_paeruginosa"
  host: e_coli  # Defaulting to e_coli as Pseudomonas aeruginosa is not in the schema; e_coli is the closest Gram-negative relative.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strong constitutive promoter for balanced expression
    - cistron:
        label: bf1
        expression: high
        fused: false
        gene:
          id: Bf1
          source: uniprot
    - spacer: 30
    - cistron:
        label: bf2
        expression: high
        fused: false
        gene:
          id: Bf2
          source: uniprot
    - spacer: 30
    - cistron:
        label: bf3
        expression: high
        fused: false
        gene:
          id: Bf3
          source: uniprot
    - spacer: 30
    - cistron:
        label: bf4
        expression: high
        fused: false
        gene:
          id: Bf4
          source: uniprot
    - spacer: 30
    - cistron:
        label: bf5
        expression: high
        fused: false
        gene:
          id: Bf5
          source: uniprot
    - spacer: 30
    - cistron:
        label: bf6
        expression: high
        fused: false
        gene:
          id: Bf6
          source: uniprot
    - terminator: BBa_B0015