construct:
  name: "four_enzyme_scaffold_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: S1_scaffold
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S1
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: GSLLEYLG  # C-terminal scaffold attachment peptide (SAP)

    - spacer: 30

    - cistron:
        label: S2_scaffold
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S2
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: GSLLEYLG

    - spacer: 30

    - cistron:
        label: S3_scaffold
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S3
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: GSLLEYLG

    - spacer: 30

    - cistron:
        label: S4_scaffold
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S4
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: GSLLEYLG

    - terminator: rrnB_T1
