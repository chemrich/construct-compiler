construct:
  name: "temperature_controlled_five_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD  # araBAD is temperature-sensitive and tightly regulated; alternatively could use ibpA (heat-shock)
    
    - cistron:
        label: T1
        expression: high
        gene:
          id: T1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: T2
        expression: high
        fused: false
        gene:
          id: T2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: T3
        expression: high
        fused: false
        gene:
          id: T3
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: T4
        expression: high
        fused: false
        gene:
          id: T4
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: T5
        expression: high
        fused: false
        gene:
          id: T5
          source: uniprot
    
    - terminator: rrnB_T1
