construct:
  name: "heat_inducible_T1_T5_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: pL  # Strong heat-shock inducible lambda promoter, tightly controlled by temperature
    - cistron:
        label: T1
        expression: medium
        fused: false
        gene:
          id: T1
          source: uniprot
    - spacer: 30
    - cistron:
        label: T2
        expression: medium
        fused: false
        gene:
          id: T2
          source: uniprot
    - spacer: 30
    - cistron:
        label: T3
        expression: medium
        fused: false
        gene:
          id: T3
          source: uniprot
    - spacer: 30
    - cistron:
        label: T4
        expression: medium
        fused: false
        gene:
          id: T4
          source: uniprot
    - spacer: 30
    - cistron:
        label: T5
        expression: medium
        fused: false
        gene:
          id: T5
          source: uniprot
    - terminator: rrnB_T1  # Robust rho-independent terminator