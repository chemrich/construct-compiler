construct:
  name: "compact_four_enzyme_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: Min1
        expression: high
        gene:
          id: Min1
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min2
        expression: high
        fused: false
        gene:
          id: Min2
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min3
        expression: high
        fused: false
        gene:
          id: Min3
          source: uniprot

    - spacer: 20

    - cistron:
        label: Min4
        expression: high
        fused: false
        gene:
          id: Min4
          source: uniprot

    - terminator: rrnB_T1
