construct:
  name: FRET_biosensor_operon_F1_F2_F3_F4
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: F1_F2_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: F1
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: F2
              source: uniprot

    - spacer: 25

    - cistron:
        label: F3
        expression: high
        fused: false
        gene:
          id: F3
          source: uniprot

    - spacer: 25

    - cistron:
        label: F4
        expression: high
        fused: false
        gene:
          id: F4
          source: uniprot

    - terminator: rrnB_T1
