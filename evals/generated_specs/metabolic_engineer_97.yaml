construct:
  name: "streptomyces_coelicolor_five_enzyme_pathway"
  host: streptomyces_coelicolor
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: ermE_star  # Strong constitutive promoter native to Streptomyces
    - cistron:
        label: gc1
        expression: high
        gene:
          id: GC1
          source: uniprot
    - spacer: 30
    - cistron:
        label: gc2
        expression: high
        fused: false
        gene:
          id: GC2
          source: uniprot
    - spacer: 30
    - cistron:
        label: gc3
        expression: high
        fused: false
        gene:
          id: GC3
          source: uniprot
    - spacer: 30
    - cistron:
        label: gc4
        expression: high
        fused: false
        gene:
          id: GC4
          source: uniprot
    - spacer: 30
    - cistron:
        label: gc5
        expression: high
        fused: false
        gene:
          id: GC5
          source: uniprot
    - terminator: rrnB_T1