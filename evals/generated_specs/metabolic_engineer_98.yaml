construct:
  name: "dual_operon_enzyme_cascade"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    # First operon: constitutive expression of D1-D3
    - promoter: J23100

    - cistron:
        label: D1
        expression: high
        gene:
          id: D1
          source: uniprot

    - spacer: 25

    - cistron:
        label: D2
        expression: high
        fused: false
        gene:
          id: D2
          source: uniprot

    - spacer: 25

    - cistron:
        label: D3
        expression: high
        fused: false
        gene:
          id: D3
          source: uniprot

    - terminator: rrnB_T1

    # Second operon: inducible expression of D4-D6
    - promoter: T7lac

    - cistron:
        label: D4
        expression: high
        gene:
          id: D4
          source: uniprot

    - spacer: 25

    - cistron:
        label: D5
        expression: high
        fused: false
        gene:
          id: D5
          source: uniprot

    - spacer: 25

    - cistron:
        label: D6
        expression: high
        fused: false
        gene:
          id: D6
          source: uniprot

    - terminator: rrnB_T1
