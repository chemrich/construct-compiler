construct:
  name: "ecoli_surface_display_antigenA"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: surface_display
        expression: high
        chain:
          - gene:
              id: antigenA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: OmpA_C_terminal
              source: uniprot

    - terminator: rrnB_T1
