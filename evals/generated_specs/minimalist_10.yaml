construct:
  name: "antigenA_surface_display"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: surface_fusion
        expression: high
        chain:
          - tag: Lpp-OmpA
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: antigenA
              source: uniprot
    - terminator: T7term