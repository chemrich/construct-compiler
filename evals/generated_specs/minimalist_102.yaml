construct:
  name: "protein_a_protein_b_coexpression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: medium
        gene:
          id: ProteinA
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: medium
        fused: false
        gene:
          id: ProteinB
          source: uniprot
    - terminator: T7term