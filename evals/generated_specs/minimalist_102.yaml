construct:
  name: ProteinA_ProteinB_interaction_pair
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinB
              source: uniprot
    
    - terminator: rrnB_T1
