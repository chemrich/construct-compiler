construct:
  name: "yeast_lacz_sensing_pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SensorP
    - cistron:
        label: lacZ_reporter
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - terminator: CYC1_term # Standard yeast terminator for optimal expression in host