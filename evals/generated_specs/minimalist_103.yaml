construct:
  name: yeast_lacZ_sensor
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: SensorP

    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
