construct:
  name: Domain1_Domain2_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Domain1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Domain2
              source: uniprot

    - terminator: rrnB_T1
