construct:
  name: "mammalian_TargetGene_shRNA_knockdown"
  host: HEK293

  backbone:
    catalog_vector: "pLKO.1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: shRNA_TargetGene
        expression: high
        chain:
          - gene:
              id: shRNA_TargetGene
              source: uniprot
              description: "U6-driven short hairpin RNA targeting TargetGene"

    - terminator: rrnB_T1
