construct:
  name: "mammalian_targetgene_knockdown"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6  # Standard Pol III promoter for shRNA expression
    - cistron:
        label: shRNA_cassette
        gene:
          id: TargetGene
          source: uniprot
    - terminator: PolyT  # Standard termination signal for Pol III/U6 promoters