construct:
  name: "activator_repressor_minimal"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: activator
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_x_responsive
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: repressor
              source: uniprot

    - terminator: rrnB_T1
