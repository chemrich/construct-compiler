construct:
  name: "activator_repressor_minimal"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: activator
        expression: high
        gene:
          id: Activator
          source: uniprot
    - spacer: 30
    - cistron:
        label: repressor
        expression: medium
        fused: false
        gene:
          id: Repressor
          source: uniprot
    - terminator: rrnB_T1