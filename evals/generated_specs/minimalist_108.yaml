construct:
  name: mCherry_ScaffoldProtein_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: ScaffoldProtein
        expression: high
        fused: false
        gene:
          id: ScaffoldProtein
          source: uniprot

    - terminator: rrnB_T1
