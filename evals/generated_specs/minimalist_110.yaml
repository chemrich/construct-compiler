construct:
  name: "dual_protein_expression_FuncProtein_HelperProtein"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: FuncProtein
        expression: high
        chain:
          - gene:
              id: FuncProtein
              source: uniprot

    - spacer: 30

    - cistron:
        label: HelperProtein
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: HelperProtein
              source: uniprot

    - terminator: rrnB_T1
