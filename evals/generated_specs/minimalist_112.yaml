construct:
  name: "mammalian_crispr_guide_genex"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6  # Standard Pol III promoter for sgRNA expression in mammalian cells
    - cistron:
        label: guide_genex
        expression: high
        gene:
          id: "sgRNA_GeneX"
    - terminator: polyT # Standard termination sequence for Pol III promoters