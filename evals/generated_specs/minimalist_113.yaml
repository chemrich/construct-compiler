construct:
  name: "EnzymeA_CofactorSynthase_coexpression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot

    - spacer: 30

    - cistron:
        label: CofactorSynthase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CofactorSynthase
              source: uniprot

    - terminator: rrnB_T1
