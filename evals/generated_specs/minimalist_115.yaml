construct:
  name: yeast_surface_display_BindingDomain
  host: yeast

  backbone:
    catalog_vector: "pCTCON2"
    # pCTCON2 is a standard yeast surface display vector with selection markers

  cassette:
    - promoter: GAL1

    - cistron:
        label: display_protein
        expression: high
        chain:
          - tag: HA
          - gene:
              id: BindingDomain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: c_myc
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
