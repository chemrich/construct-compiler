construct:
  name: mammalian_optogenetics_light_sensor_effector
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: LightSensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CRY2
              source: uniprot

    - spacer: 30

    - cistron:
        label: EffectorDomain
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CIBN
              source: uniprot

    - terminator: rrnB_T1
