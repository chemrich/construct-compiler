construct:
  name: yeast_dual_reporter
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Reporter1
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - spacer: 30

    - cistron:
        label: Reporter2
        expression: high
        fused: false
        gene:
          id: HIS3
          source: uniprot

    - terminator: rrnB_T1
