construct:
  name: yeast_dual_reporter_system
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: Reporter1
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: Reporter2
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: CYC1