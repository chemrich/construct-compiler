construct:
  name: "protein_a_b_tight_coexpression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: Protein_A
          source: uniprot
    - spacer: 20
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: Protein_B
          source: uniprot
    - terminator: T7term