construct:
  name: "co_express_ProtA_ProtB"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProtA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProtA
              source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: ProtB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProtB
              source: uniprot
    
    - terminator: rrnB_T1
