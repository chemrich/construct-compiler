construct:
  name: "mammalian_reporter_H_enzyme_I_bicistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: reporter_H
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: enzyme_I
        expression: high
        fused: false
        chain:
          - gene:
              id: luciferase
              source: uniprot

    - terminator: rrnB_T1
