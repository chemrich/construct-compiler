construct:
  name: mammalian_polycistronic_reporter_h_enzyme_i
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter_h
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: enzyme_i
        expression: medium
        fused: false
        gene:
          id: P00338
          source: uniprot
    - terminator: bGH_polyA