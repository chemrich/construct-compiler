construct:
  name: "Protein_J_CFP_fusion_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: J
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CFP
              source: fpbase

    - terminator: CYC1
