construct:
  name: "baculovirus_Protein_L_high_yield"
  host: insect

  backbone:
    catalog_vector: "pFastBac_Dual"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: Protein_L
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Protein_L
              source: uniprot

    - terminator: SV40_polyA
