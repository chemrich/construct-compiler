construct:
  name: "e_coli_periplasmic_protein_M"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_M
        expression: high
        chain:
          - signal_peptide: pelB  # pelB signal sequence for periplasmic export
          - gene:
              id: protein_M
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
