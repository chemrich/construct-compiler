construct:
  name: "protein_o_constitutive_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive promoter for yeast
    - cistron:
        label: protein_o
        expression: high
        gene:
          id: Protein_O
          source: uniprot
    - terminator: CYC1  # Standard yeast terminator