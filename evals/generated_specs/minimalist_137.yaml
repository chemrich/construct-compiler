construct:
  name: "protein_R_with_His_Flag"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_R
              source: uniprot
          - tag: FLAG
    
    - terminator: rrnB_T1
