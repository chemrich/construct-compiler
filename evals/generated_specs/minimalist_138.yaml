construct:
  name: periplasmic_export_S_T
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_S
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: S
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_T
        expression: high
        fused: false
        chain:
          - tag: ompA
          - gene:
              id: T
              source: uniprot
    - terminator: T7term