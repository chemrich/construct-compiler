construct:
  name: "toxin_u_tight_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # araBAD is selected for the tightest control and minimal basal leakage in E. coli
    - cistron:
        label: toxin_u
        expression: high
        gene:
          id: toxin_u
          source: uniprot
    - terminator: rrnB_T1