construct:
  name: "yeast_promoter_activity_monitor"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: luciferase
        expression: high
        chain:
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: CYC1_terminator
