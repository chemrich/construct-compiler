construct:
  name: yeast_promoter_activity_monitor
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Using TEF1 as a standard constitutive yeast promoter for benchmarking luciferase activity
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: P08659
          source: uniprot
    - terminator: ADH1_term  # Standard yeast terminator for stable transcript processing