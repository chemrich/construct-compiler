construct:
  name: "TetR_GFP_coexpression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: TetR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: GFP
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
