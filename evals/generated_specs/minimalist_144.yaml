construct:
  name: "Rubisco_SSU_Chloroplast_Expression"
  host: algae  # Algae selected as the closest host for chloroplast-based expression systems
  backbone:
    resistance: spectinomycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: psbA
    - cistron:
        label: rbcs
        expression: high
        gene:
          id: P00839
          source: uniprot
    - terminator: psbA_term