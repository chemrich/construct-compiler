construct:
  name: "yeast_COX4_mitochondrial_targeting"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: COX4_mito
        expression: high
        chain:
          - tag: NLS  # Mitochondrial targeting sequence (MTS) for yeast
          - gene:
              id: COX4
              source: uniprot

    - terminator: rrnB_T1
