construct:
  name: baculovirus_secreted_antibody_fragment
  host: insect

  backbone:
    catalog_vector: "pFastBac_HTb"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_insect
          - gene:
              id: human_antibody_fab
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - cleavage_site: TEV

    - terminator: SV40_polyA
