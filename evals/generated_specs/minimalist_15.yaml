construct:
  name: "proteinD_degron"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: proteinD
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinD
              source: uniprot
          - degron: ssrA  # C-terminal degron for rapid proteolysis

    - terminator: rrnB_T1
