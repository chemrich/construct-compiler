construct:
  name: "proteinD_fast_degradation"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinD
              source: uniprot
          - tag: SsrA  # Degradation tag for E. coli
    - terminator: T7term