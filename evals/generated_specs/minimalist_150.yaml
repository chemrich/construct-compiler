construct:
  name: "bicistronic_GeneA_GeneB"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 30

    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot

    - terminator: rrnB_T1
