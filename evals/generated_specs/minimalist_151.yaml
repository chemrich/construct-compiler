construct:
  name: "B_subtilis_secreted_amylase"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: amyE
              source: uniprot

    - terminator: rrnB_T1
