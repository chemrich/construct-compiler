construct:
  name: "halophile_thermostable_enzyme"
  host: halophile

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: thermostable_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: thermostable_protease
              source: uniprot

    - terminator: rrnB_T1
