construct:
  name: nuclear_cytoplasmic_shuttle_protein
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: shuttle_protein
        expression: high
        chain:
          - tag: NLS
          - cleavage_site: 3C
          - gene:
              id: eGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS

    - terminator: rrnB_T1
