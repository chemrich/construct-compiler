construct:
  name: "nuclear_cytoplasmic_shuttle_mEGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: shuttling_reporter
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: NES
    - terminator: SV40_polyA