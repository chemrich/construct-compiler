construct:
  name: "Enzyme_A_Enzyme_B_coexpression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enzyme_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot
    
    - terminator: rrnB_T1
