construct:
  name: "yeast_secreted_peptide"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: small_peptide
              source: uniprot

    - terminator: CYC1_terminator
