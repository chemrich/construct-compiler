construct:
  name: "mCherry_P_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P
              source: uniprot
    - terminator: bGH_PA