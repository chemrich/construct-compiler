construct:
  name: mCherry_tagged_protein_P_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: protein_P
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
