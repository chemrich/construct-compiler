construct:
  name: "polycistronic_egfp_mcherry"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp
        expression: high
        gene:
          id: eGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term