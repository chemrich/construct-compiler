construct:
  name: eGFP_mCherry_polycistronic
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: eGFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: eGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
