construct:
  name: "constant_mah_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Constitutive promoter for constant expression in E. coli
    - cistron:
        label: mah_peptide
        expression: high
        gene:
          id: "met_ala_his"  # The sequence 'Met-Ala-His' must be defined in the compiler's database as MAH
    - terminator: rrnB_T1