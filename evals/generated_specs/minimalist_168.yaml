construct:
  name: custom_promoter_firefly_luciferase
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: custom
      sequence: "TTGACA_TATAAT"

    - cistron:
        label: firefly_luciferase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot

    - terminator: rrnB_T1
