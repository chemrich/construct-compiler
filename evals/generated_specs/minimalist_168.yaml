construct:
  name: "firefly_luciferase_reporter_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac # Defaulting to T7lac per Rule 8 as no specific custom promoter name was provided.
    - cistron:
        label: reporter
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1