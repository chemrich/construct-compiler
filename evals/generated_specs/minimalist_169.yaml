construct:
  name: "ProteinY_mitochondrial_targeting"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: MTS  # Mitochondrial Targeting Sequence
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
