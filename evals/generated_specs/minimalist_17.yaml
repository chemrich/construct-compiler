construct:
  name: "proteinX_bait_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: proteinX_bait
        expression: high
        chain:
          - gene:
              id: proteinX
              source: uniprot

    - terminator: CYC1
