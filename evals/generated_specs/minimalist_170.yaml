construct:
  name: "GFP_RFP_bicistronic_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: RFP
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
