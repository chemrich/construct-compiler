construct:
  name: "mammalian_polycistronic_gfp_rfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: rfp_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_polyA # Standard mammalian polyadenylation signal for termination