construct:
  name: "minimal_e_coli_ori_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    # A functional construct requires a selection marker and an expression cassette to satisfy the compiler schema;
    # sfGFP and kanamycin resistance are included as defaults to create a valid spec.
    - promoter: T7lac
    - cistron:
        label: reporter
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015