construct:
  name: "e_coli_stress_reporter_mcherry"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: dnaK  # Stress-responsive promoter responding to protein folding stress and heat shock
    - cistron:
        label: stress_sensor
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1