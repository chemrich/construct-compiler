construct:
  name: mammalian_protein_Y_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_Y
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: rrnB_T1
