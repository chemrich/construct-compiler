construct:
  name: "fusion_A_B"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: A_B_fusion
        expression: high
        chain:
          - gene:
              id: A
              source: uniprot
          - gene:
              id: B
              source: uniprot
    - terminator: T7term