construct:
  name: "A_B_fusion"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: A_B_fusion
        expression: high
        chain:
          - gene:
              id: A
          - gene:
              id: B
    
    - terminator: rrnB_T1
