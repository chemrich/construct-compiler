construct:
  name: "co_expression_X_and_Y"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_X
        expression: medium
        gene:
          id: X
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_Y
        expression: medium
        fused: false
        gene:
          id: Y
          source: uniprot
    - terminator: rrnB_T1