construct:
  name: XY_coexpression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: X
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Y
              source: uniprot

    - terminator: rrnB_T1
