construct:
  name: "His_tagged_protein_P"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_P
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_P
              source: uniprot
    
    - terminator: rrnB_T1
