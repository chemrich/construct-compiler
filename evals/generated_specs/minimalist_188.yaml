construct:
  name: "A_then_B_TEV_cleavage"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: A
              source: uniprot

    - cistron:
        label: B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: B
              source: uniprot

    - terminator: rrnB_T1
