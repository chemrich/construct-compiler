construct:
  name: "minimal_expression_pathway_e1_e2_e3"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_e1
        expression: very_low
        gene:
          id: E1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_e2
        expression: very_low
        fused: false
        gene:
          id: E2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_e3
        expression: very_low
        fused: false
        gene:
          id: E3
          source: uniprot
    - terminator: rrnB_T1