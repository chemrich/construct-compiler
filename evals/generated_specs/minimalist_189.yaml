construct:
  name: "minimal_E123_pathway"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: E1
        expression: low
        gene:
          id: E1
          source: uniprot

    - spacer: 20

    - cistron:
        label: E2
        expression: low
        fused: false
        gene:
          id: E2
          source: uniprot

    - spacer: 20

    - cistron:
        label: E3
        expression: low
        fused: false
        gene:
          id: E3
          source: uniprot

    - terminator: rrnB_T1
