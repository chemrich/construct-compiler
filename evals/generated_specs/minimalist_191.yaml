construct:
  name: yeast_display_protein_D_mCherry
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: display
        expression: high
        chain:
          - tag: HA
          - gene:
              id: protein_D
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
