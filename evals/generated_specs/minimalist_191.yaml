          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P06821
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1