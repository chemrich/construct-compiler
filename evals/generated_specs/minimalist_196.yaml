construct:
  name: "repressor_R_target_gene_T"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: repressor_R
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: target_gene_T
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_gene_T
              source: uniprot

    - terminator: rrnB_T1
