construct:
  name: "minimal_mammalian_expression_gene_Y"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: minCMV  # Minimal promoter containing only the TATA box and core elements as requested
    - cistron:
        label: target_protein
        gene:
          id: Y
          source: uniprot
    - terminator: bGH_pA  # Standard mammalian polyadenylation signal for mRNA stability and termination 16. For constructs intended for cell-free or in vitro transcription (IVT), use 'in_vitro' as the host.