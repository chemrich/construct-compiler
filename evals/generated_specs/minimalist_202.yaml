construct:
  name: minimal_mammalian_Y_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV
      # Minimal configuration: no 5' UTR, direct CDS

    - cistron:
        label: Y
        expression: high
        gene:
          id: Y
          source: uniprot

    - terminator: rrnB_T1
