construct:
  name: "protein_a_b_coexpression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: Protein_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: Protein_B
          source: uniprot
    - terminator: T7term