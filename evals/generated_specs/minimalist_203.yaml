construct:
  name: "Protein_A_B_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Protein_A
        expression: high
        gene:
          id: proteinA
          source: uniprot

    - cistron:
        label: Protein_B
        expression: high
        fused: false
        gene:
          id: proteinB
          source: uniprot

    - terminator: rrnB_T1
