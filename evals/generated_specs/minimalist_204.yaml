construct:
  name: yeast_Z_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Potent, general constitutive yeast promoter
    - cistron:
        label: gene_Z
        expression: high
        gene:
          id: Z
          source: uniprot
    - terminator: CYC1_term # Standard yeast terminator