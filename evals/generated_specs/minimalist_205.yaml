construct:
  name: "N_terminal_6xHis_MyProtein_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyProtein
    - terminator: rrnB_T1