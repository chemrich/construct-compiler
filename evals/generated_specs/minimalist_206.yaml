construct:
  name: "gene1_gene2_operon"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_1
        expression: high
        fused: false
        gene:
          id: Gene1
    - spacer: 30
    - cistron:
        label: gene_2
        expression: very_low
        fused: false
        gene:
          id: Gene2
    - terminator: T7term