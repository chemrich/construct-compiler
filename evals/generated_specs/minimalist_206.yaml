construct:
  name: Gene1_Gene2_operon
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Gene1
        expression: high
        gene:
          id: Gene1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Gene2
        expression: very_low
        gene:
          id: Gene2
          source: uniprot
    
    - terminator: rrnB_T1
