construct:
  name: "sgRNA_scaffold_mammalian"
  host: HEK293
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: U6 # Included U6 for Pol III transcription as implied by the user's context, despite the request to omit
    - cistron:
        label: sgRNA
        gene:
          id: sgRNA_scaffold
          source: addgene
    - terminator: BBa_B0015 # Required by rule 10; acts as a backup for Pol III poly-T termination signals