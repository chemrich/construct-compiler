construct:
  name: "yeast_dual_protein_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        gene:
          id: protein_A
          source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        gene:
          id: protein_B
          source: uniprot

    - terminator: rrnB_T1
