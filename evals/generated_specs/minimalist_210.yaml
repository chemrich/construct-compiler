construct:
  name: yeast_polycistronic_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: protein_a
        gene:
          id: protein_a
    - spacer: 30
    - cistron:
        label: protein_b
        fused: false  # Indicates independent translation initiation for the second CDS
        gene:
          id: protein_b
    - terminator: CYC1  # Standard yeast terminator