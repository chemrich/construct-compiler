construct:
  name: "Protein_G_with_TEV_cleavage"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_G_tev
        expression: high
        chain:
          - gene:
              id: protein_G
              source: uniprot
              # TEV cleavage site (ENLYFQ-G) inserted in-frame at desired position
              # User must specify insertion point; defaulting to N-terminal insertion
              insertion:
                position: N-terminal
                sequence: ENLYFQG

    - terminator: rrnB_T1
