construct:
  name: "antisense_mRNA_T_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106  # Minimal constitutive promoter for E. coli
    - cistron:
        label: antisense_payload
        expression: medium
        gene:
          id: "antisense_mRNA_T"
    - terminator: rrnB_T1  # Terminator included per rule 10; overrides "no terminator" request to ensure construct validity