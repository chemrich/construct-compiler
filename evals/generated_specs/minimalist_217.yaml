construct:
  name: "polycistronic_X_Y_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_X
        expression: high
        chain:
          - gene:
              id: ProteinX
              source: uniprot

    # IRES allows cap-independent translation of downstream cistron
    - spacer: 27  # IRES consensus element (~27 bp minimal)

    - cistron:
        label: Protein_Y
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
