construct:
  name: yeast_dual_reporter_mCherry_Luciferase
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - spacer: 30

    - promoter: J23106

    - cistron:
        label: Luciferase_reporter
        expression: high
        gene:
          id: Renilla_reniformis_luciferase
          source: uniprot
