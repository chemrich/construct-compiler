construct:
  name: "secreted_amylase_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: AMY1
              source: uniprot
          - tag: HA

    - terminator: CYC1
