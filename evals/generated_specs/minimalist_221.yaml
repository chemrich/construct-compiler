construct:
  name: "rfp_mcherry_coexpression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: rfp
        expression: medium
        gene:
          id: mRFP1
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1