construct:
  name: "report_transcription_luciferase"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: luciferase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot

    - terminator: rrnB_T1
