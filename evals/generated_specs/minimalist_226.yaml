construct:
  name: TetR_controlled_protein_expression
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: TetR
        expression: medium
        gene:
          id: TetR
          source: uniprot

    - terminator: rrnB_T1

    - promoter: tetO

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
