construct:
  name: "tet_controlled_expression_of_protein_x"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: pTet  # TetR-repressible promoter (inducible by aTc or Tetracycline)
    - cistron:
        label: target
        expression: high
        gene:
          id: protein_x
          source: uniprot
    - terminator: rrnB_T1