construct:
  name: "dual_protein_production_P_Q"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_P
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: protein_Q
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Q
              source: uniprot

    - terminator: rrnB_T1
