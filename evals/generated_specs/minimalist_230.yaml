construct:
  name: "dual_expression_p_q"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_p
        expression: high
        gene:
          id: P
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_q
        expression: high
        fused: false
        gene:
          id: Q
          source: uniprot
    - terminator: T7term