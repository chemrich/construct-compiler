construct:
  name: "in_vitro_toxin_expression"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: toxin
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: colicin_E1
              source: uniprot

    - terminator: T7term
