construct:
  name: plant_drought_resistance_dreb1a
  host: algae # Plant host not explicitly in schema; algae used as photosynthetic proxy
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV_35S # CaMV 35S is a standard promoter for high expression in photosynthetic eukaryotes
    - cistron:
        label: DREB1A_factor
        expression: high
        gene:
          id: P0C0S8
          source: uniprot
    - terminator: NOS_terminator