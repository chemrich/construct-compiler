construct:
  name: "protein_z_periplasmic_targeting"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_z
              source: uniprot
        signal_peptide: pelB  # N-terminal periplasmic targeting signal

    - terminator: rrnB_T1
