construct:
  name: "domain_a_b_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: fusion_protein
        chain:
          - gene:
              id: domain_a
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_b
              source: uniprot
    - terminator: T7term