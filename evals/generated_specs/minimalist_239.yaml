construct:
  name: "self_cleaving_dual_protein"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: primary_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - cistron:
        label: secondary_protein
        expression: high
        fused: false
        chain:
          - self_cleaving_peptide: T2A
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
