construct:
  name: BFP_T7RNAP_fusion
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: BFP_T7RNAP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mTagBFP2
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P00573
              source: uniprot

    - terminator: rrnB_T1
