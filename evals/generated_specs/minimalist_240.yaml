construct:
  name: "mCherry_simple_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1