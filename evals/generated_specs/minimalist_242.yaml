construct:
  name: "polycistronic_enzymes_A_B"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_A
        chain:
          - gene:
              id: enzyme_A
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_B
        fused: false
        chain:
          - gene:
              id: enzyme_B
              source: uniprot
    - terminator: rrnB_T1