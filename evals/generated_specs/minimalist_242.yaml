construct:
  name: "dual_enzyme_ab_polycistronic"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_a
        expression: high
        gene:
          id: enzyme_a
    
    - spacer: 20
    
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: enzyme_b
    
    - terminator: rrnB_T1
