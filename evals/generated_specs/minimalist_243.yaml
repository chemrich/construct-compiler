construct:
  name: "HEK293_antibody_heavy_chain_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_heavy_chain
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for ER secretion
          - gene:
              id: antibody_heavy_chain
              source: uniprot

    - terminator: SV40_polyA
