construct:
  name: "dual_protein_TEV_cleavable"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - cleavage_site: TEV
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
