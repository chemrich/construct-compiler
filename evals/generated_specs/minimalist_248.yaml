construct:
  name: metabolite_X_sensor_GFP
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: PBD_metabolite_X
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
