```yaml
construct:
  name: "dual_enzyme_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_a
        expression: high
        gene:
          id: "ENZYME_A"
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: "ENZYME_B" 
          source: uniprot
          
    - terminator: rrnB_T1
```