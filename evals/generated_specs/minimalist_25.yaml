construct:
  name: "enzyme_A_B_polycistronic"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_A
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_B
              source: uniprot
    
    - terminator: rrnB_T1
