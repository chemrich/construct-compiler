construct:
  name: "triple_Y_fusion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Y_triple
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Y
              source: uniprot
          - gene:
              id: Y
              source: uniprot
          - gene:
              id: Y
              source: uniprot

    - terminator: rrnB_T1
