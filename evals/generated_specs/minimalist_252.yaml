construct:
  name: "Gal4DBD_M_yeast2hybrid"
  host: yeast

  backbone:
    catalog_vector: "pGBT9"
    resistance: ampicillin

  cassette:
    - promoter: ADH1

    - cistron:
        label: Gal4DBD_M
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: M
              source: uniprot

    - terminator: CYC1
