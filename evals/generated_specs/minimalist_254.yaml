construct:
  name: "gene_A_gene_B_polycistronic_readthrough"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_A
        expression: high
        gene:
          id: gene_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_B
        expression: high
        fused: false
        gene:
          id: gene_B
          source: uniprot
    - terminator: rrnB_T1