construct:
  name: "geneA_readthrough_geneB"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: geneA
        expression: high
        gene:
          id: geneA
          source: uniprot

    - spacer: 20

    - cistron:
        label: geneB
        expression: high
        fused: false
        gene:
          id: geneB
          source: uniprot

    - terminator: rrnB_T1
