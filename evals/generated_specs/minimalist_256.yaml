construct:
  name: "aav_reporter_z_minimal"
  host: mammalian
  backbone:
    resistance: kanamycin  # Default per rule 9
    ori: pUC
    source: addgene  # Assuming standard AAV transfer backbone like pAAV-CMV
  cassette:
    - promoter: CMV  # Default per rule 8 for mammalian
    - cistron:
        label: reporter_z
        expression: high
        gene:
          id: mEGFP  # Used as a representative 'reporter Z'
          source: fpbase
    - terminator: bGH_polyA  # Standard mammalian polyA signal for AAV constructs