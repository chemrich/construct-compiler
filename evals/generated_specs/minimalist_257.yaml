construct:
  name: "polyprotein_ABC_self_cleaving"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: polyprotein_ABC
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: A
              source: uniprot
          - cleavage_site: 2A  # self-cleaving peptide
          - gene:
              id: B
              source: uniprot
          - cleavage_site: 2A  # self-cleaving peptide
          - gene:
              id: C
              source: uniprot
    
    - terminator: rrnB_T1
