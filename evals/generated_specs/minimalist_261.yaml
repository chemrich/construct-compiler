construct:
  name: lacZ_mCherry_bicistronic
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - spacer: 30

    - cistron:
        label: mCherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
