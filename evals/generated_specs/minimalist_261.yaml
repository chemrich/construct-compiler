construct:
  name: "lacz_mcherry_polycistronic"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: mcherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term