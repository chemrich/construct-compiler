construct:
  name: "three_enzyme_operon_ABC"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: A
    
    - spacer: 30
    
    - cistron:
        label: enzyme_B
        expression: high
        gene:
          id: B
    
    - spacer: 30
    
    - cistron:
        label: enzyme_C
        expression: high
        gene:
          id: C
    
    - terminator: rrnB_T1
