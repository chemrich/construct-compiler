construct:
  name: "three_enzyme_operon_abc"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_A
        expression: medium
        gene:
          id: enzyme_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_B
        expression: medium
        fused: false
        gene:
          id: enzyme_B
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_C
        expression: medium
        fused: false
        gene:
          id: enzyme_C
          source: uniprot
    - terminator: rrnB_T1