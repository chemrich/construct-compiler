    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: protein_X
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: protein_Y
        expression: high
        fused: false
        gene:
          id: protein_Y
          source: uniprot
    
    - terminator: rrnB_T1
