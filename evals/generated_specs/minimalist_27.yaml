construct:
  name: "Protein_X_Y_coexpression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Protein_X
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: proteinX
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Protein_Y
        expression: high
        fused: false
        gene:
          id: proteinY
          source: uniprot
    
    - terminator: rrnB_T1
