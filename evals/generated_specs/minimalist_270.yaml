construct:
  name: "tobacco_disease_resistance_expression"
  host: tobacco # User requested tobacco; using custom plant host host as per Rule 12.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV_35S # Standard constitutive promoter for high-level expression in dicot plants.
    - cistron:
        label: resistance_protein_N
        expression: high
        gene:
          id: P43255
          source: uniprot
    - terminator: NOS_term # Standard plant terminator derived from nopaline synthase.