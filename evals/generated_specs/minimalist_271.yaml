construct:
  name: baculovirus_structural_protein
  host: insect

  backbone:
    catalog_vector: "pFastBac"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: p10

    - cistron:
        label: structural_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: structural_protein
              source: uniprot

    - terminator: SV40_polyA
