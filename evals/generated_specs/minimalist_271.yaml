construct:
  name: "baculovirus_structural_protein_expression"
  host: Sf9  # Specific insect cell line commonly used with baculovirus systems
  backbone:
    catalog_vector: "pFastBac1"
  cassette:
    - promoter: polh  # High-level polyhedrin promoter standard for baculovirus
    - cistron:
        label: structural_protein
        expression: high
        gene:
          id: P03135  # Hepatitis B core antigen (HBcAg) used as a model structural protein
          source: uniprot
    - terminator: SV40_polyA  # Standard polyadenylation signal for insect cell expression