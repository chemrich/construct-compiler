construct:
  name: "Protein_Aggregator_X_soluble"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: aggregator_x
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - gene:
              id: aggregator_x
              source: uniprot

    - terminator: rrnB_T1
