construct:
  name: "Gene_A_Gene_B_mammalian_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: Gene_A
        expression: high
        gene:
          id: Gene_A
          source: uniprot

    - spacer: 30

    - cistron:
        label: Gene_B
        expression: high
        fused: false
        chain:
          - gene:
              id: Gene_B
              source: uniprot

    - terminator: rrnB_T1
