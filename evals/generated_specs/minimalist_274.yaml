construct:
  name: "protein_P_quick_degradation"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - degron: ssrA  # C-terminal ssrA tag for rapid ClpXP-mediated degradation
          - gene:
              id: P
              source: uniprot

    - terminator: rrnB_T1
