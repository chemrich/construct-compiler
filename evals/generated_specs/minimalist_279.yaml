construct:
  name: constitutive_AMP_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: AMP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: novel_antimicrobial_peptide
              source: uniprot

    - terminator: CYC1
