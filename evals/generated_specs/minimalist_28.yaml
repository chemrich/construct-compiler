construct:
  name: "CFP_YFP_FRET_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: FRET_pair
        expression: high
        chain:
          - gene:
              id: mCerulean3
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mVenus
              source: fpbase

    - terminator: rrnB_T1