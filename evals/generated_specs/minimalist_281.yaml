construct:
  name: "constitutive_sfGFP_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Constitutive J23 series promoter for E. coli
    - cistron:
        label: sfGFP_reporter
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: BBa_B0015