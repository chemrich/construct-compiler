construct:
  name: "protein_A_protein_B_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
