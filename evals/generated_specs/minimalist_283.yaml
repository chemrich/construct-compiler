construct:
  name: "yeast_polycistronic_A_B"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: protein_A
        expression: medium
        gene:
          id: protein_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_B
        expression: medium
        fused: false
        gene:
          id: protein_B
          source: uniprot
    - terminator: CYC1