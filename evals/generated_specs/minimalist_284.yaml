construct:
  name: "secreted_mcherry"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: mcherry_secretion
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: mCherry
              source: fpbase
    - terminator: T7term