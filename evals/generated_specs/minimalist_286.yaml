construct:
  name: CRISPR_guide_Q
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: guide_RNA
        expression: high
        chain:
          - gene:
              id: CRISPR_gRNA_Q
              source: uniprot
              # Note: This represents a synthetic guide RNA scaffold targeting gene Q
              # Actual target sequence must be designed based on PAM sites in the Q gene

    - terminator: T7term
