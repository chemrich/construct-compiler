construct:
  name: dCas9_gRNA_coexpression
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: dCas9
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: dCas9
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: gRNA_target_G
        expression: high
        fused: false
        gene:
          id: gRNA
          source: uniprot
    
    - terminator: rrnB_T1
