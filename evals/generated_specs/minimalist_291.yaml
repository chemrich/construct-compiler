construct:
  name: MBP_Luciferase_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: MBP_Luciferase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "Photuris_pyralis_luciferase"
              source: uniprot

    - terminator: rrnB_T1
