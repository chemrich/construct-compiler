construct:
  name: tetracycline_inducible_protein_F
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetO  # tetracycline operator-controlled promoter

    - cistron:
        label: protein_F
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_F
              source: uniprot

    - terminator: rrnB_T1
