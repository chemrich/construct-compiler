construct:
  name: "bicistronic_protein_I_resistance_J"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_I
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_I
              source: uniprot

    - spacer: 30

    - cistron:
        label: resistance_J
        expression: medium
        fused: false
        gene:
          id: resistance_J
          source: uniprot

    - terminator: rrnB_T1
