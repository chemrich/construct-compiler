construct:
  name: "bicistronic_protein_i_marker_j"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_i
        expression: high
        gene:
          id: protein_I
          source: uniprot
    - spacer: 30
    - cistron:
        label: marker_j
        expression: medium
        fused: false
        gene:
          id: marker_J
          source: uniprot
    - terminator: rrnB_T1