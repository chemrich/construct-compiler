construct:
  name: protein_L_degradation_tagged
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_L
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_L
              source: uniprot
          - degron: ssrA  # C-terminal degradation tag (SsrA)

    - terminator: rrnB_T1
