construct:
  name: self_excising_reporter_protein_M
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_M
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_M
              source: uniprot

    - terminator: rrnB_T1
