construct:
  name: "mitochondrial_protein_n_delivery"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: "mito_n"
        expression: high
        chain:
          - tag: MTS  # Mitochondrial Targeting Signal for organelle delivery
          - gene:
              id: P0DTC9  # Defaulting Protein N to SARS-CoV-2 Nucleocapsid protein
              source: uniprot
    - terminator: bGH_PA