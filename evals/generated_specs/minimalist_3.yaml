construct:
  name: geneA_geneB_coexpression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: geneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: geneA

    - spacer: 30

    - cistron:
        label: geneB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: geneB

    - terminator: rrnB_T1
