construct:
  name: "bacterial_polycistronic_coexpression_geneA_geneB"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: geneA_expression
        expression: medium
        gene:
          id: geneA
          source: uniprot
    - spacer: 30
    - cistron:
        label: geneB_expression
        expression: medium
        fused: false
        gene:
          id: geneB
          source: uniprot
    - terminator: T7term