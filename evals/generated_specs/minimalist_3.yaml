```yaml
construct:
  name: geneA_geneB_coexpression
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: geneA
        expression: high
        gene:
          id: geneA
          source: uniprot

    - spacer: 30

    - cistron:
        label: geneB
        expression: high
        fused: false
        gene:
          id: geneB
          source: uniprot

    - terminator: rrnB_T1
```