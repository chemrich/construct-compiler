construct:
  name: toxin_A_low_noise
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: J23106  # Low-strength constitutive promoter for minimal noise
    
    - cistron:
        label: toxin_A
        expression: very_low  # Minimize expression for toxicity concerns
        chain:
          - tag: 6xHis
          - gene:
              id: P16562  # Clostridium difficile Toxin A
              source: uniprot
    
    - terminator: rrnB_T1