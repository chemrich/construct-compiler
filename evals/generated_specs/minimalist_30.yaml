construct:
  name: "E_coli_ToxinA_low_noise"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: ToxinA
        expression: very_low
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ToxinA
              source: uniprot

    - terminator: rrnB_T1
