construct:
  name: "toxin_a_low_noise_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: araBAD  # Used for tight regulation and minimizing expression noise compared to T7lac
    - cistron:
        label: toxin_a
        expression: low
        gene:
          id: P16154
          source: uniprot
    - terminator: rrnB_T1