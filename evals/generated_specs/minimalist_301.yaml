construct:
  name: Gene_B_Gene_C_fusion
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: Gene_B
              source: uniprot
          - gene:
              id: Gene_C
              source: uniprot
    
    - terminator: rrnB_T1
