construct:
  name: "gene_b_gene_c_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: b_c_fusion
        expression: high
        chain:
          - gene:
              id: Gene_B
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Gene_C
              source: uniprot
    - terminator: rrnB_T1