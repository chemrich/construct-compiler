construct:
  name: "Protein_E_F_coexpression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Protein_E
        expression: high
        gene:
          id: proteinE
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Protein_F
        expression: high
        fused: false
        gene:
          id: proteinF
          source: uniprot
    
    - terminator: rrnB_T1
