construct:
  name: "iptg_inducible_gene_g_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_g
        expression: high
        gene:
          id: G
          source: uniprot
    - terminator: T7term