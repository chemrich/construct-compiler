construct:
  name: "sensor_j_response_regulator_k_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: sensor_j
        expression: medium
        gene:
          id: sensor_j
          source: uniprot
    - spacer: 30
    - cistron:
        label: response_regulator_k
        expression: medium
        fused: false
        gene:
          id: response_regulator_k
          source: uniprot
    - terminator: rrnB_T1