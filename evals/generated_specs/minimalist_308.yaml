construct:
  name: sensor_response_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_J
        expression: high
        gene:
          id: sensor_J
          source: uniprot

    - spacer: 25

    - cistron:
        label: response_regulator_K
        expression: high
        fused: false
        gene:
          id: response_regulator_K
          source: uniprot

    - terminator: rrnB_T1
