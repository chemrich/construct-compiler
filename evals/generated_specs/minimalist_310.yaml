construct:
  name: "GAL4_interaction_detector_L_M"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GAL4_AD_L
        expression: high
        chain:
          - gene:
              id: GAL4_AD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: protein_L
              source: uniprot

    - spacer: 30

    - terminator: rrnB_T1

  cassette_2:
    - promoter: GAL1

    - cistron:
        label: GAL4_BD_M
        expression: high
        chain:
          - gene:
              id: GAL4_BD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: protein_M
              source: uniprot

    - spacer: 30

    - terminator: rrnB_T1
