construct:
  name: "Arabidopsis_protein_N_overexpression"
  host: plant

  backbone:
    catalog_vector: "pEAQ-HT"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CaMV_35S

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_N
              source: uniprot

    - terminator: nos
