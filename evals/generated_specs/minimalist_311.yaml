construct:
  name: "protein_N_overexpression_arabidopsis"
  host: algae  # Arabidopsis is a plant host; algae is selected as the closest available category
  backbone:
    resistance: kanamycin  # Standard selection marker for Arabidopsis transformation
    ori: pBR322
    source: addgene
  cassette:
    - promoter: 35S  # Constitutive Cauliflower Mosaic Virus 35S promoter for high expression in plants
    - cistron:
        label: protein_N
        expression: high
        gene:
          id: Q40392
          source: uniprot
    - terminator: NOS_term  # Nopaline synthase terminator, standard for plant expression cassettes