construct:
  name: "gene_P_thermal_induction"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: pL  # Induced at 42C via cI857 repressor system
    - cistron:
        label: target
        expression: high
        gene:
          id: P
          source: uniprot
    - terminator: rrnB_T1