  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: antitoxin_R
        expression: high
        gene:
          id: R
          source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: toxin_Q
        expression: high
        fused: false
        gene:
          id: Q
          source: uniprot
    
    - terminator: rrnB_T1
