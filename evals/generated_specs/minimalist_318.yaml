construct:
  name: yeast_pathway_U_V_W
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: protein_U
        expression: medium
        gene:
          id: U
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_V
        expression: medium
        fused: false
        gene:
          id: V
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_W
        expression: medium
        fused: false
        gene:
          id: W
          source: uniprot
    - terminator: CYC1_term