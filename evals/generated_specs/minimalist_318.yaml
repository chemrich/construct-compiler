construct:
  name: "UVW_pathway_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: U
        expression: high
        gene:
          id: U
          source: uniprot

    - spacer: 30

    - cistron:
        label: V
        expression: high
        fused: false
        gene:
          id: V
          source: uniprot

    - spacer: 30

    - cistron:
        label: W
        expression: high
        fused: false
        gene:
          id: W
          source: uniprot

    - terminator: rrnB_T1
