construct:
  name: "protein_X_2A_protein_Y_bacterial"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_X
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: rrnB_T1
