construct:
  name: "B_then_C_polycistronic_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_B
        expression: high
        gene:
          id: B
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_C
        expression: high
        fused: false
        gene:
          id: C
          source: uniprot
    - terminator: rrnB_T1