construct:
  name: EGFP_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: EGFP
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase

    - terminator: CYC1
