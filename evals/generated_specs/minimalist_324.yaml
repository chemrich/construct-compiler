    - cistron:
        label: mNeonGreen_secretory
        expression: high
        chain:
          - tag: IgK_leader
          - tag: 10xHis
          - solubility_tag: MBP
          - cleavage_site: 3C
          - gene:
              id: mNeonGreen
              source: fpbase
    - spacer: 30
    - cistron:
        label: reporter
        expression: low
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_pA