construct:
  name: "gene_j_silencing_construct"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: "dCas9_effector"
        expression: high
        # Substitution: Silencing 'gene J' (likely phage phiX174 capsid protein P03635) 
        # is interpreted as a CRISPRi request; construct expresses dCas9 (Q99ZW2).
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Q99ZW2
              source: uniprot
    - terminator: T7term