construct:
  name: "sequential_enzyme_cascade_KLM"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_K
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: K
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_L
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: L
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_M
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: M
              source: uniprot

    - terminator: rrnB_T1
