construct:
  name: "mito_targeted_mEGFP"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: mito_GFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: MTS
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
