construct:
  name: "HEK293_Dual_Localization_NLS_MTS"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: nuclear_GFP
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 40
    - cistron:
        label: mitochondrial_mCherry
        expression: high
        fused: false
        chain:
          - tag: MTS
          - gene:
              id: mCherry
              source: fpbase
    - terminator: bGH_polyA