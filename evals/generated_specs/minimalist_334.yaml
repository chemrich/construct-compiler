construct:
  name: "short_lived_mEGFP_reporter"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: reporter
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: SsrA # C-terminal SsrA degradation tag (AANDENYALAA) for E. coli ClpXP proteolysis
    - terminator: rrnB_T1