construct:
  name: Q_degron_short_lived
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Q_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Q
              source: uniprot
          - degradation_tag: ssrA

    - terminator: rrnB_T1
