construct:
  name: "HEK293_KRAS_G12D_mCherry_AAV"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: target_kras
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAS_G12D
              source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase
    - terminator: bGH_polyA