construct:
  name: "target_T_with_guide"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target_T
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: T
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: guide
        expression: high
        fused: false
        gene:
          id: guide
          source: uniprot
    
    - terminator: rrnB_T1
