construct:
  name: "E_coli_periplasmic_protein_K"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: pelB  # periplasmic signal peptide for E. coli
          - gene:
              id: protein_K
              source: uniprot

    - terminator: rrnB_T1
