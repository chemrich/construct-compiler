construct:
  name: "protein_K_periplasmic_export"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: pelB  # periplasmic export signal
          - gene:
              id: K
              source: uniprot
    
    - terminator: rrnB_T1