construct:
  name: "e_coli_gfp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term # Rule 10: Always include a terminator at the end of the cassette.