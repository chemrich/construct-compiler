construct:
  name: minimal_ABC_secretion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ABC_secreted
        expression: high
        chain:
          - tag: SP_IgG  # IgG signal peptide for mammalian secretion
          - gene:
              id: ABC
              sequence: "GCG TCC TGC"  # minimal 3-codon peptide (Ala-Ser-Cys)

    - terminator: rrnB_T1
