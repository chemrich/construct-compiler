construct:
  name: "GeneA_GeneB_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA

    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
