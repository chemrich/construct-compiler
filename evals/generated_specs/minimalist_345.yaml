construct:
  name: "coexpression_genea_geneb"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GeneA
    - spacer: 30
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: GeneB
    - terminator: T7term  # Added to satisfy compiler Rule 10 requiring a terminator at cassette end