construct:
  name: GeneC_GFP_fusion_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: GeneC
              source: uniprot
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
