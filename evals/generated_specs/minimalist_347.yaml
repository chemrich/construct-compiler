construct:
  name: "TM1_membrane_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: TM1_target
        expression: medium
        gene:
          id: TM1
          source: uniprot
    - terminator: rrnB_T1  # Rule 10 requires a terminator despite request for omission; rrnB_T1 is a standard E. coli terminator.