construct:
  name: "minimal_mcherry_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Default mammalian promoter per rule 8; required for initiation
    - cistron:
        label: reporter
        expression: low
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_polyA  # Required per rule 10 for construct stability