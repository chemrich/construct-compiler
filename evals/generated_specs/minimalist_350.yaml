construct:
  name: "TF1_yeast_expression"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Standard high-expression yeast promoter
    - cistron:
        label: target
        expression: medium
        gene:
          id: TF1
          source: uniprot
    - terminator: CYC1_term  # Common yeast terminator