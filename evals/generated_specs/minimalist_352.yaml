construct:
  name: "proteinz_n_strep_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinZ
              source: uniprot
    - terminator: rrnB_T1 # Added terminator to ensure construct stability as per Rule 10