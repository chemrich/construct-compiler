construct:
  name: ProteinE_ProteinF_yeast_dual
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinE
        expression: high
        gene:
          id: ProteinE
          source: uniprot

    - spacer: 20

    - cistron:
        label: ProteinF
        expression: high
        fused: false
        gene:
          id: ProteinF
          source: uniprot

    - terminator: CYC1
