construct:
  name: "chloroplast_targeting_mCherry"
  host: algae

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: chloroplast_mCherry
        expression: high
        chain:
          - tag: CTP  # Chloroplast Transit Peptide
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
