construct:
  name: "tox1_minimal_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: araBAD # Chosen for high repression and minimal basal expression
    - cistron:
        label: toxin
        expression: very_low
        gene:
          id: Tox1
          source: uniprot
    - terminator: rrnB_T1