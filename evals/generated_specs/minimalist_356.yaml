construct:
  name: "GeneG_GeneH_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneG
        expression: high
        gene:
          id: GeneG
          source: uniprot

    - spacer: 30

    - cistron:
        label: IRES
        expression: high
        gene:
          id: IRES_EMCV
          source: uniprot

    - spacer: 30

    - cistron:
        label: GeneH
        expression: high
        gene:
          id: GeneH
          source: uniprot

    - terminator: rrnB_T1
