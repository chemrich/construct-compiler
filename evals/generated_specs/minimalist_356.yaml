construct:
  name: "GeneG_IRES_GeneH_mammalian_expression"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: GeneG
        gene:
          id: GeneG
          source: uniprot
    - spacer: 500  # Spacer for IRES element
    - cistron:
        label: GeneH
        fused: false
        gene:
          id: GeneH
          source: uniprot
    - terminator: bGH_polyA