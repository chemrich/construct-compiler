construct:
  name: "yeast_GFP_NLS"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP_NLS
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - tag: NLS

    - terminator: rrnB_T1
