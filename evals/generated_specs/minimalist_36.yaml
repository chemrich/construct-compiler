construct:
  name: "arabinose_inducible_reporter_r"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: reporter_r
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1