construct:
  name: arabinose_inducible_reporter_R
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
