construct:
  name: "gfp_mcherry_coexpression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term