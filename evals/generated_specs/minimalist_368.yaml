construct:
  name: Kinase_K_Regulator_R
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Kinase_K
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: K
              source: uniprot

    - spacer: 30

    - cistron:
        label: Regulator_R
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: R
              source: uniprot

    - terminator: rrnB_T1
