construct:
  name: TetR_GeneX
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: TetR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: GeneX
        expression: high
        fused: false
        gene:
          id: GeneX
          source: uniprot

    - terminator: rrnB_T1
