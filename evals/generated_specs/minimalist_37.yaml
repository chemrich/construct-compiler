```yaml
construct:
  name: two_component_system
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_kinase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P0AEC3
              source: uniprot

    - spacer: 30

    - cistron:
        label: response_regulator
        expression: medium
        fused: false
        gene:
          id: P0AA18
          source: uniprot

    - terminator: rrnB_T1
