construct:
  name: sensor_histidine_kinase_response_regulator_coexpression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_histidine_kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cheA
              source: uniprot

    - spacer: 25

    - cistron:
        label: response_regulator
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cheY
              source: uniprot

    - terminator: rrnB_T1
