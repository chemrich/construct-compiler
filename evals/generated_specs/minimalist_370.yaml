construct:
  name: GAL1_A_B
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: A
        expression: high
        fused: false
        gene:
          id: A
          source: uniprot

    - spacer: 30

    - cistron:
        label: B
        expression: high
        fused: false
        gene:
          id: B
          source: uniprot

    - terminator: rrnB_T1
