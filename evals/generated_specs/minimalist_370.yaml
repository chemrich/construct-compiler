construct:
  name: GAL1_A_B_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        gene:
          id: A
          source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        fused: false
        gene:
          id: B
          source: uniprot

    - terminator: CYC1_term