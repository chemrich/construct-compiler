construct:
  name: "polycistronic_gfp_mcherry_bfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: bfp
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1