construct:
  name: "secreted_ProteinY"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinY
        expression: high
        chain:
          - tag: signal_peptide_pelB
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
