construct:
  name: "gRNA_target_X_expression_vector"
  host: e_coli_bl21_de3  # Using BL21(DE3) to support the T7lac promoter default for E. coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gRNA_expression_unit
        expression: high
        gene:
          id: gRNA_target_X
    - terminator: T7term