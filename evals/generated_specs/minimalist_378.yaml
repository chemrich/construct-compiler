construct:
  name: "genex_geney_pathway"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: genex
        expression: medium
        gene:
          id: GeneX
          source: uniprot
    - spacer: 30
    - cistron:
        label: geney
        expression: medium
        fused: false
        gene:
          id: GeneY
          source: uniprot
    - terminator: rrnB_T1