construct:
  name: "GeneX_GeneY_pathway"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneX
        expression: high
        gene:
          id: GeneX
          source: uniprot

    - spacer: 30

    - cistron:
        label: GeneY
        expression: high
        fused: false
        gene:
          id: GeneY
          source: uniprot

    - terminator: rrnB_T1
