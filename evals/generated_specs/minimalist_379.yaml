construct:
  name: "ProteinE_with_intein"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinE_intein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinE
              source: uniprot
          - intein: DnaE  # N-terminal intein domain for protein splicing

    - terminator: rrnB_T1
