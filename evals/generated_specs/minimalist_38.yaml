construct:
  name: secreted_peptidase_s
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: peptidase_s
        expression: high
        chain:
          - tag: pelB  # signal peptide for periplasmic export
          - gene:
              id: P00777  # example subtilisin/peptidase S
              source: uniprot
    
    - terminator: rrnB_T1