construct:
  name: T7_polymerase_mCherry_fusion
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: T7_polymerase_mCherry
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: T7_RNA_polymerase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
