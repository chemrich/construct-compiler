construct:
  name: argF_lacI_coexpression
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: argF
        expression: high
        gene:
          id: argF
          source: uniprot

    - spacer: 30

    - cistron:
        label: lacI
        expression: high
        fused: false
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
