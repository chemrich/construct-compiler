construct:
  name: "strep_tagged_protein_beta"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: Protein_Beta
              source: uniprot
    - terminator: rrnB_T1