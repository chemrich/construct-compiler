construct:
  name: "mammalian_dual_protein_X_Y"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
