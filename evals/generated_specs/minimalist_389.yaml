construct:
  name: Gene_Delta_degron_construct
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Gene_Delta
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_degron  # C-terminal degron tag for proteasomal targeting

    - terminator: rrnB_T1
