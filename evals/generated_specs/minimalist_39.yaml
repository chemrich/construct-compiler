construct:
  name: "Peptide_X_Protein_Y_fusion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: peptide_X
              source: uniprot
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: rrnB_T1
