construct:
  name: "peptideX_proteinY_fusion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: "peptideX"  # Replace with actual peptide/protein ID
          - gene:
              id: "proteinY"  # Replace with actual protein ID and source
              # source: uniprot  # Add source when replacing with real ID

    - terminator: rrnB_T1