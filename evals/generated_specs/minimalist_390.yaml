construct:
  name: nisin_secretion_construct
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: nisin_A
        expression: high
        chain:
          - tag: pelB  # Signal peptide for periplasmic secretion in E. coli
          - gene:
              id: P0C0L8
              source: uniprot
    - terminator: T7term