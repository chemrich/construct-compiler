construct:
  name: "LuxR_RhlR_Activity_Monitor"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PluxI  # Responsive to LuxR-AHL complex
    - cistron:
        label: LuxR_reporter
        expression: medium
        gene:
          id: Venus
          source: fpbase
    - terminator: rrnB_T1
    - promoter: PrhlI  # Responsive to RhlR-BHL complex
    - cistron:
        label: RhlR_reporter
        expression: medium
        gene:
          id: Cerulean
          source: fpbase
    - terminator: T7term