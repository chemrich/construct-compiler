construct:
  name: LuxR_RhlR_activity_dual_reporter
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: LuxR_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Venus
              source: fpbase

    - spacer: 30

    - cistron:
        label: RhlR_reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Cerulean
              source: fpbase

    - terminator: rrnB_T1
