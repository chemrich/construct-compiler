construct:
  name: "heterodimer_alpha_beta_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Alpha
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: alpha_subunit
              source: uniprot

    - spacer: 30

    - cistron:
        label: Beta
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: beta_subunit
              source: uniprot

    - terminator: rrnB_T1
