construct:
  name: scFv_yeast_surface_display
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv_display
        expression: high
        chain:
          - tag: HA
          - secretion_signal: alpha_factor
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - anchor: Aga2p

    - terminator: CYC1
