construct:
  name: cas9_lentiviral_vector
  host: HEK293
  backbone:
    catalog_vector: "pLenti-Puro"
  cassette:
    - promoter: CMV
    - cistron:
        label: cas9_expression
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: Q99ZW2
              source: uniprot
    - terminator: bGH_polyA  # Standard mammalian terminator for lentiviral expression cassettes