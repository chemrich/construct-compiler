construct:
  name: "cold_shock_rnat_mNeonGreen"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: "cspA" # The cspA promoter naturally includes the cold-shock responsive RNA thermometer in its 5' UTR
    - cistron:
        label: "cold_shock_reporter"
        expression: medium
        gene:
          id: "mNeonGreen"
          source: fpbase
    - terminator: "rrnB_T1"