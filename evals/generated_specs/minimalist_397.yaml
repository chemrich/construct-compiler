construct:
  name: RNA_thermometer_cold_shock
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: thermometer_rna
        expression: high
        chain:
          - gene:
              id: cspA_5utr_thermometer
              sequence: >
                GGAAGATTTAAGAAGATTGAAAGAAGATTTTGAAAGAAGATTTTAAGAAGATTGAAAGAAGATTTTGAAAGAAGATTGAAACGCCTTATAGGCGGATTGACCGTAATCATAACAGAAAC
              source: synthetic
    
    - cistron:
        label: cspA_protein
        expression: high
        fused: false
        gene:
          id: cspA
          source: uniprot
    
    - terminator: rrnB_T1
