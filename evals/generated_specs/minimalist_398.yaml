construct:
  name: "kanamycin_resistance_cassette"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: kan_resistance
        expression: high
        gene:
          id: neo
          source: uniprot
    
    - terminator: rrnB_T1
