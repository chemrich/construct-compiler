construct:
  name: "two_domain_tev_cleavable"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: two_domain_construct
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MBP
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
