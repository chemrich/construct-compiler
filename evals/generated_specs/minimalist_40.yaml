construct:
  name: "protein_X_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        gene:
          id: protein_X
          source: uniprot
    
    - terminator: rrnB_T1