construct:
  name: "yeast_xyzase_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Defaulting to constitutive GPD promoter for yeast high expression
    - cistron:
        label: enzyme
        expression: high
        gene:
          id: XYZase
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator