construct:
  name: GeneA_GeneB_dual_expression
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneA
              source: uniprot

    - spacer: 20

    - cistron:
        label: GeneB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GeneB
              source: uniprot

    - terminator: rrnB_T1
