construct:
  name: geneA_geneB_tandem_expression
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: GeneA
        expression: medium
        gene:
          id: GeneA
          source: uniprot
    - spacer: 20
    - cistron:
        label: GeneB
        expression: medium
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - terminator: rrnB_T1