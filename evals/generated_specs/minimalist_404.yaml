construct:
  name: "DomainX_DomainY_yeast_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: DomainX
              source: uniprot
          - gene:
              id: DomainY
              source: uniprot
    - terminator: CYC1