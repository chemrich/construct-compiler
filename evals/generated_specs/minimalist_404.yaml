construct:
  name: "DomainX_DomainY_fusion_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: DomainX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: DomainY
              source: uniprot

    - terminator: rrnB_T1
