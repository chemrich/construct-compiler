construct:
  name: "polycistronic_enzyme_expression_1_2_3"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_1
        expression: medium
        gene:
          id: Enzyme1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: Enzyme2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        gene:
          id: Enzyme3
          source: uniprot
    - terminator: rrnB_T1