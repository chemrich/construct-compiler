construct:
  name: "polycistronic_enzyme_cascade"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Enzyme1
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enzyme2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Enzyme2
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Enzyme3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Enzyme3
              source: uniprot
    
    - terminator: rrnB_T1
