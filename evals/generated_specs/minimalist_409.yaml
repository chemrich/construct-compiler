construct:
  name: "algae_biofuel_enzyme_expression"
  host: algae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: RBCS2 # Common constitutive promoter for algal expression (e.g., C. reinhardtii)
    - cistron:
        label: target
        expression: high
        gene:
          id: BiofuelEnzyme
          source: uniprot
    - terminator: rrnB_T1