construct:
  name: yeast_enzyme_pathway_ab
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot

    - spacer: 25

    - cistron:
        label: EnzymeB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot

    - terminator: rrnB_T1
