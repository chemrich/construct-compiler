construct:
  name: "yeast_pathway_operon"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: enzyme_a
        expression: high
        gene:
          id: EnzymeA
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: EnzymeB
          source: uniprot
    - terminator: CYC1_term