construct:
  name: "yeast_secreted_enzyme_k"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: SecretedEnzymeK
              source: uniprot

    - terminator: CYC1
