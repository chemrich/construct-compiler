```yaml
construct:
  name: proteinA_proteinB_coexpression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1
    
    - cistron:
        label: proteinA
        expression: high
        gene:
          id: proteinA
          source: uniprot
    
    - linker:
        type: GS_flexible
        repeats: 3
    
    - cistron:
        label: proteinB
        expression: high
        gene:
          id: proteinB
          source: uniprot
    
    - terminator: CYC1
```