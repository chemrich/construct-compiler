construct:
  name: "yeast_coexpress_A_B"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        gene:
          id: protein_A
          source: uniprot

    - spacer: 25

    - cistron:
        label: protein_B
        expression: high
        fused: false
        gene:
          id: protein_B
          source: uniprot

    - terminator: rrnB_T1
