construct:
  name: "yeast_lacz_his6_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1  # Standard constitutive yeast promoter
    - cistron:
        label: lacz_target
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: LacZ
              source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator