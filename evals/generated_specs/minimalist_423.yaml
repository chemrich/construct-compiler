construct:
  name: kanR_rfp_dual_expression
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: kanamycin_resistance
        expression: high
        gene:
          id: kanR
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: rfp
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    
    - terminator: rrnB_T1
