construct:
  name: "e_coli_secretion_signal_autocleavage"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_with_cleavage
        expression: high
        chain:
          - gene:
              id: pelB
              source: uniprot
          - cleavage_site: 2A_self_cleaving
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
