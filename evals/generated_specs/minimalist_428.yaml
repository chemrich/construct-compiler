construct:
  name: "mammalian_XY_IRES_bicistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: X
        expression: high
        gene:
          id: X
          source: uniprot

    - spacer: 50

    - cistron:
        label: Y
        expression: high
        fused: false
        gene:
          id: Y
          source: uniprot

    - terminator: rrnB_T1
