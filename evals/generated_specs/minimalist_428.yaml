construct:
  name: mammalian_bicistronic_X_Y
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: X
        gene:
          id: X
          source: uniprot
    - spacer: 500 # Spacer length typical for an IRES sequence to allow internal ribosome entry
    - cistron:
        label: Y
        fused: false
        gene:
          id: Y
          source: uniprot
    - terminator: BGH_pA