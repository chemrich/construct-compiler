construct:
  name: human_geneX_eGFP_fusion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: geneX_eGFP
        expression: high
        chain:
          - gene:
              id: eGFP
              source: fpbase
          - gene:
              id: ENSG00000000003
              source: uniprot

    - terminator: rrnB_T1
