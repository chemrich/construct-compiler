construct:
  name: "protein_P_degron_tag"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P
              source: uniprot
          - tag: ssrA  # C-terminal ssrA (SsrA) degron tag for protease-mediated degradation

    - terminator: rrnB_T1
