construct:
  name: "ProteinA_ProteinB_mammalian_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinB
              source: uniprot
          - tag: V5

    - terminator: rrnB_T1
