construct:
  name: "protein_R_with_TEV_site"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_R
              source: uniprot
          - cleavage_site: TEV

    - terminator: rrnB_T1
