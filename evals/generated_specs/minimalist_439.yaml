construct:
  name: "mammalian_reporter_enzyme_dual"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: reporter_G
        expression: high
        gene:
          id: reporter_G
          source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: enzyme_F
        expression: high
        gene:
          id: enzyme_F
          source: uniprot

    - terminator: SV40_polyA
