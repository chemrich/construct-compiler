construct:
  name: luminescence_reporter_human
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: luciferase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: rrnB_T1
