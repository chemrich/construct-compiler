construct:
  name: "EnzymeC_EnzymeD_yeast_pathway"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzymeC
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeC
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeD
              source: uniprot

    - terminator: CYC1
