construct:
  name: "enzymeC_enzymeD_yeast_pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: enzyme_c
        expression: medium
        gene:
          id: EnzymeC
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_d
        expression: medium
        fused: false
        gene:
          id: EnzymeD
          source: uniprot
    - terminator: CYC1