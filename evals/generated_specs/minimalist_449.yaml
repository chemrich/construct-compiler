construct:
  name: ProteinJ_ProteinK_coexpression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinJ
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinJ
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinK
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinK
              source: uniprot

    - terminator: rrnB_T1
