construct:
  name: proteinj_proteink_coexpression
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_j
        expression: medium
        gene:
          id: ProteinJ
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_k
        expression: medium
        fused: false
        gene:
          id: ProteinK
          source: uniprot
    - terminator: rrnB_T1