construct:
  name: "mammalian_Cas9_gRNA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: rrnB_T1

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        gene:
          id: guide_RNA_scaffold
          source: uniprot

    - terminator: rrnB_T1
