construct:
  name: "GFP_plant_expression"
  host: mammalian # Substituted for plant cells as it is the closest supported eukaryotic host category
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV_35S
    - cistron:
        label: target
        gene:
          id: mEGFP
          source: fpbase
    - terminator: NOS_term