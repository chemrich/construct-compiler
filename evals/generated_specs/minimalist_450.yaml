construct:
  name: "plant_GFP_expression"
  host: algae

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
