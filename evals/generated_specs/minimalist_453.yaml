construct:
  name: "ProteinN_solubility_enhanced"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinN
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: ProteinN
              source: uniprot
    
    - terminator: rrnB_T1
