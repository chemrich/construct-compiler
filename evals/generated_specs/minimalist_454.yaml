construct:
  name: "yeast_two_hybrid_bait_proteinp"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ProteinP
              source: uniprot
    - terminator: CYC1