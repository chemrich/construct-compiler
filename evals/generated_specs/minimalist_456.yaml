construct:
  name: "RegulatorS_ReporterR"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: RegulatorS
        expression: medium
        gene:
          id: RegulatorS
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: ReporterR
        expression: high
        gene:
          id: ReporterR
          source: uniprot

    - terminator: rrnB_T1
