construct:
  name: "regulator_s_reporter_r_circuit"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: regulator_s
        expression: medium
        gene:
          id: RegulatorS
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_r
        expression: high
        fused: false
        gene:
          id: ReporterR
          source: uniprot
    - terminator: rrnB_T1