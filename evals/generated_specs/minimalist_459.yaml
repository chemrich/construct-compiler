construct:
  name: "bicistronic_expression_protein_v_w"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_v
        expression: medium
        gene:
          id: ProteinV
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_w
        expression: medium
        fused: false
        gene:
          id: ProteinW
          source: uniprot
    - terminator: rrnB_T1