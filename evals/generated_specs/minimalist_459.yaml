construct:
  name: ProteinV_ProteinW_bicistronic
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinV
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinV
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinW
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinW
              source: uniprot

    - terminator: rrnB_T1
