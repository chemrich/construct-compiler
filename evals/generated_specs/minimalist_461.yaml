construct:
  name: human_insulin_yeast
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: insulin
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: P01308
              source: uniprot

    - terminator: rrnB_T1
