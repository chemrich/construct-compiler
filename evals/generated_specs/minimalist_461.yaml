construct:
  name: "human_insulin_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1  # Selected TEF1 as a standard constitutive yeast promoter
    - cistron:
        label: human_insulin
        expression: high
        gene:
          id: P01308
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator