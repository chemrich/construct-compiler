construct:
  name: "His_tagged_Protein_A"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_A
              source: uniprot

    - terminator: rrnB_T1
