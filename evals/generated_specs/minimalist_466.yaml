construct:
  name: "Fab_expression_ecoli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: fab_heavy
              source: uniprot

    - spacer: 30

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: fab_light
              source: uniprot

    - terminator: rrnB_T1
