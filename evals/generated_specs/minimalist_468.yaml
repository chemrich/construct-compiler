construct:
  name: yeast_secreted_protein_S
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_S
        expression: high
        chain:
          - gene:
              id: protein_S
              source: uniprot

    - terminator: rrnB_T1
