construct:
  name: DnaK_GFP_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: DnaK_GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dnaK
              source: uniprot
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
