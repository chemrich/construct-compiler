construct:
  name: "secreted_protein_S_insect_expression"
  host: mammalian # Insect cell lines not in schema; using mammalian as eukaryotic proxy for glycosylated protein expression
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # CMV substituted for insect-specific promoter (e.g. Polh/OpIE2) to align with tool schema
    - cistron:
        label: target
        expression: high
        gene:
          id: P06401 # UniProt ID for Human Protein S; assumes signal peptide is intrinsic as per prompt
          source: uniprot
    - terminator: BBa_B0015