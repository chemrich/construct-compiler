construct:
  name: "bacterial_ribozyme_R"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: ribozyme_R
        expression: high
        gene:
          id: sequence_R  # Refers to the provided ribozyme sequence R
    - terminator: rrnB_T1