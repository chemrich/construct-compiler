construct:
  name: "P1_P2_polycistronic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: P1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P1
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P2
              source: uniprot

    - terminator: rrnB_T1
