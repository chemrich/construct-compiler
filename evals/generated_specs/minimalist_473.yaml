construct:
  name: viral_vp1_plant_expression
  host: plant  # Standard plant expression host substitution
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: 35S  # Standard constitutive plant promoter
    - cistron:
        label: vp1_cds
        expression: high
        gene:
          id: VP1
          source: uniprot
    - terminator: NOS_term  # Standard nopaline synthase terminator for plant expression