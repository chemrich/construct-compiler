construct:
  name: "Bacillus_subtilis_ComK_expression"
  host: Bacillus_subtilis # Host specific to the request; B. subtilis uses different origins and promoters than E. coli.
  backbone:
    resistance: kanamycin
    ori: pBR322 # Placeholder; B. subtilis typically requires pUB110 or pC194 origins for replication.
    source: addgene
  cassette:
    - promoter: P_veg # Strong constitutive promoter for Bacillus subtilis.
    - cistron:
        label: comK
        expression: high
        gene:
          id: P39138
          source: uniprot
    - terminator: BBa_B0015