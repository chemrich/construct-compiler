construct:
  name: "TM_Protein_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: TM_Protein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: TM_Protein
              source: uniprot

    - terminator: rrnB_T1
