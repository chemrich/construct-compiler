construct:
  name: yeast_lacZ_reporter
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
