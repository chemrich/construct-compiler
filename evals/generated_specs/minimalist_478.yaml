construct:
  name: SUMO_tagged_protein_X
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: SUMO_X_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: protein_X
              source: uniprot
    
    - terminator: rrnB_T1
