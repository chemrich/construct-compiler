construct:
  name: "GFP_mCherry_cotranslation"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: mCherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
