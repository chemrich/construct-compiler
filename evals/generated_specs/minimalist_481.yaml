construct:
  name: "cotranslation_sfGFP_mCherry"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: sfGFP_reporter
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mCherry_reporter
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term