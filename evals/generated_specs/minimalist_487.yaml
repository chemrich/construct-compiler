construct:
  name: "AAV_hSyn_mCherry_neuronal_reporter"
  host: mammalian
  backbone:
    catalog_vector: "pAAV-MCS"
  cassette:
    - promoter: hSyn  # Human synapsin 1 promoter for neuronal-specific expression
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA