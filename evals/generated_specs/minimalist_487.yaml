construct:
  name: AAV_neuronal_reporter
  host: HEK293

  backbone:
    catalog_vector: "pAAV-CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
