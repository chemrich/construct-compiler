construct:
  name: "shRNA_targeting_gene_Y"
  host: HEK293 # Defaulted to HEK293 as shRNA delivery requires a eukaryotic host
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6 # U6 is the standard Pol III promoter for shRNA expression
    - cistron:
        label: shRNA_cassette
        expression: high
        gene:
          id: shRNA_targeting_gene_Y
    - terminator: BBa_B0015