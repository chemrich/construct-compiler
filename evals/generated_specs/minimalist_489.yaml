construct:
  name: "mammalian_secreted_X_coexpressed_Y"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_X
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal
          - gene:
              id: X
              source: uniprot

    - spacer: 30

    - cistron:
        label: Y_via_2A
        expression: high
        fused: false
        chain:
          - cleavage_site: T2A  # Self-cleaving peptide for independent translation
          - gene:
              id: Y
              source: uniprot

    - terminator: rrnB_T1
