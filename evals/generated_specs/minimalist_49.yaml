construct:
  name: "fusion_P_Q_direct"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: p_q_fusion
        expression: medium
        chain:
          - gene:
              id: P
              source: uniprot
          - gene:
              id: Q
              source: uniprot
    - terminator: T7term