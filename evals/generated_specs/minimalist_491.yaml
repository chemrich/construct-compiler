construct:
  name: "in_vitro_peptide_synthesis"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: short_peptide
              source: custom

    - terminator: rrnB_T1
