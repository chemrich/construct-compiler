construct:
  name: "mammalian_bicistronic_gfp_mcherry"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_pA