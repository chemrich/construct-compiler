construct:
  name: GFP_mCherry_mammalian_bicistronic
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
