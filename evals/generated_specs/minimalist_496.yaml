construct:
  name: "mitochondrial_GFP_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mitochondrial_GFP
        expression: high
        chain:
          - tag: mitochondrial_targeting_signal
          - gene:
              id: GFP
              source: uniprot

    - terminator: CYC1
