construct:
  name: "mitochondrial_gfp_expression_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: mito_gfp
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1