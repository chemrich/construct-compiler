construct:
  name: "yeast_ABC_complex_tricistronic"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: subunit_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: subunit_B
              source: uniprot

    - spacer: 25

    - cistron:
        label: subunit_C
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: subunit_C
              source: uniprot

    - terminator: rrnB_T1
