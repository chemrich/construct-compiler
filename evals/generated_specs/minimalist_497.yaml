construct:
  name: "yeast_complex_ABC_assembly"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: subunit_A
        expression: medium
        gene:
          id: subunit_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: subunit_B
        expression: medium
        fused: false
        gene:
          id: subunit_B
          source: uniprot
    - spacer: 30
    - cistron:
        label: subunit_C
        expression: medium
        fused: false
        gene:
          id: subunit_C
          source: uniprot
    - terminator: CYC1