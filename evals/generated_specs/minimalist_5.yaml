construct:
  name: "geneF_geneG_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: geneF
              source: uniprot
          - gene:
              id: geneG
              source: uniprot
    - terminator: rrnB_T1