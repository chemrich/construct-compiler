construct:
  name: inducible_protein_I_system
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_I
        expression: high
        gene:
          id: sfGFP # Used sfGFP as a standard inducible target placeholder for 'Protein I'
          source: fpbase
    - terminator: T7term