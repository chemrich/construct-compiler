construct:
  name: "plant_chloroplast_protein_x_expression"
  host: algae  # Algae is selected as the representative photosynthetic host for plant-based chloroplast delivery
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV_35S
    - cistron:
        label: protein_x
        expression: high
        gene:
          id: PROTEIN_X
          source: uniprot
    - terminator: NOS_term