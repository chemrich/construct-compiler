construct:
  name: "operon_X_Y_Z_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_X
        gene:
          id: gene_X
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_Y
        fused: false
        gene:
          id: gene_Y
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_Z
        fused: false
        gene:
          id: gene_Z
          source: uniprot
    - terminator: rrnB_T1