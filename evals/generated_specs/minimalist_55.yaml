construct:
  name: "XYZ_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - cistron:
        label: gene_X
        expression: high
        gene:
          id: X
          source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: gene_Y
        expression: high
        fused: false
        gene:
          id: Y
          source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: gene_Z
        expression: high
        fused: false
        gene:
          id: Z
          source: uniprot
    
    - terminator: rrnB_T1
