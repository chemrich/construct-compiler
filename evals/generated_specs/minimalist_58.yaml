construct:
  name: "sgRNA_expression_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: sgRNA_target
        expression: high
        # Note: cistron used to define the template for non-coding sgRNA expression
        gene:
          id: sgRNA_spacer_scaffold
    - terminator: rrnB_T1