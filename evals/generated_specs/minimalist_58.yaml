construct:
  name: "sgRNA_CRISPR_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - rna:
        label: sgRNA
        type: CRISPR_guide
        sequence: "GGUUUUCCGUUCUGCGCCUGUUU"
    
    - terminator: rrnB_T1
