construct:
  name: secreted_peptideS_yeast
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_peptideS
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: peptideS
              source: uniprot

    - terminator: CYC1
