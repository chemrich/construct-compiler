construct:
  name: "secreted_peptideS_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: secreted_peptideS
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast secretion signal
          - gene:
              id: P01308  # human insulin precursor as example peptide
              source: uniprot

    - terminator: rrnB_T1