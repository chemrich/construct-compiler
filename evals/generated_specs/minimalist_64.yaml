construct:
  name: GeneA_GeneB_GeneC_polycistronic
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: GeneC
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot
    
    - terminator: rrnB_T1
