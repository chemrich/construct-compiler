construct:
  name: "polycistronic_gene_a_b_c_operon"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_a
        expression: medium
        gene:
          id: GeneA
    - spacer: 30
    - cistron:
        label: gene_b
        expression: medium
        fused: false
        gene:
          id: GeneB
    - spacer: 30
    - cistron:
        label: gene_c
        expression: medium
        fused: false
        gene:
          id: GeneC
    - terminator: T7term