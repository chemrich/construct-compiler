construct:
  name: "HEK293_secreted_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for ER secretion
          - gene:
              id: SecretedProtein
              source: uniprot
          - tag: 6xHis  # C-terminal His tag for purification after secretion

    - terminator: rrnB_T1
