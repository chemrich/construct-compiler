construct:
  name: AntigenZ_yeast_surface_display
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: Aga2p
          - gene:
              id: AntigenZ
              source: uniprot

    - terminator: rrnB_T1
