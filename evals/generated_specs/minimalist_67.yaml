construct:
  name: "mammalian_sgRNA_guide_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6 # U6 promoter is used for RNA polymerase III transcription of sgRNA in mammalian cells
    - cistron:
        label: guide_RNA
        expression: high
        gene:
          id: sgRNA_Guide
    - terminator: U6_terminator