construct:
  name: "ProblematicProtein_MBP_solubility_tag"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: ProblematicProtein
              source: uniprot
    
    - terminator: rrnB_T1
