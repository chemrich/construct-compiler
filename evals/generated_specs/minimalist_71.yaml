construct:
  name: CFP_YFP_dual_expression
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: CFP
        expression: high
        gene:
          id: mCerulean
          source: fpbase

    - spacer: 50

    - cistron:
        label: YFP
        expression: high
        fused: false
        gene:
          id: mVenus
          source: fpbase

    - terminator: rrnB_T1
