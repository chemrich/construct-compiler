construct:
  name: "toxA_antitoxB_expression_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: toxA
        expression: medium
        gene:
          id: toxA
          source: uniprot
    - spacer: 30
    - cistron:
        label: antiToxB
        expression: high
        fused: false
        gene:
          id: antiToxB
          source: uniprot
    - terminator: T7term