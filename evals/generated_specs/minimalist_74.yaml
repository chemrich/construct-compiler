construct:
  name: ToxA_AntiToxB_dual_expression
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ToxA
        expression: high
        gene:
          id: ToxA
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: AntiToxB
        expression: high
        gene:
          id: AntiToxB
          source: uniprot

    - terminator: rrnB_T1
