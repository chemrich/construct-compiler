construct:
  name: HSP70_stress_inducible_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: HSP70  # HSP70 promoter is natively stress-inducible in yeast

    - cistron:
        label: HSP70
        expression: high
        gene:
          id: HSP70
          source: uniprot

    - terminator: rrnB_T1
