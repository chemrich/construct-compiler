construct:
  name: "CRISPR_sgRNA_TargetGeneA_with_HDR_template"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
          - tag: NLS

    - spacer: 20

    - promoter: U6

    - cistron:
        label: sgRNA_TargetGeneA
        expression: high
        fused: false
        gene:
          id: sgRNA_TargetGeneA
          sequence: "GCTAGCTAGCTAG"
          # sgRNA targeting TargetGeneA (replace with actual 20bp guide sequence)

    - spacer: 20

    - promoter: SV40

    - cistron:
        label: HomologyTemplate
        expression: low
        fused: false
        gene:
          id: HDR_HomologyTemplate
          sequence: "GGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCCTAGGCC"
          # Left homology arm (40bp) + edit site + Right homology arm (40bp)

    - terminator: SV40_polyA
