construct:
  name: "mCherry_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: BGH_polyA  # Standard mammalian polyadenylation signal for mRNA stability and termination