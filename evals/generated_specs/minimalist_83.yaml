construct:
  name: scFv_yeast_surface_display
  host: yeast

  backbone:
    catalog_vector: "pEXP2"
    resistance: ampicillin
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: HA
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
