construct:
  name: "operon_coexpression_A_B"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_A
        expression: medium
        gene:
          id: protein_A
    - spacer: 20
    - cistron:
        label: gene_B
        expression: medium
        fused: false
        gene:
          id: protein_B
    - terminator: rrnB_T1