construct:
  name: "hCas9_sgRNA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: hCas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: spCas9
              source: uniprot
          - tag: NLS

    - terminator: rrnB_T1

    - promoter: U6

    - cistron:
        label: sgRNA
        expression: high
        gene:
          id: sgRNA_custom
          source: uniprot
