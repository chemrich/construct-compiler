construct:
  name: "luciferase_eGFP_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: luciferase_eGFP
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: Renilla_luciferase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase
          - tag: 6xHis

    - terminator: SV40_poly_A
