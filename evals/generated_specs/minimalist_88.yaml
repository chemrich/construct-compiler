construct:
  name: inducible_gene_y_expression
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_y_target
        expression: high
        chain:
          - gene:
              id: gene_y
              source: uniprot
    - terminator: T7term