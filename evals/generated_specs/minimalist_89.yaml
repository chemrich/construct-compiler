construct:
  name: "human_shRNA_knockdown"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6  # U6 is a Pol III promoter required for shRNA transcription in mammalian cells
    - cistron:
        label: shRNA_expression_unit
        gene:
          id: shRNA_target_sequence
    - terminator: PolyT  # Standard termination signal for Pol III promoters (e.g., U6, H1)