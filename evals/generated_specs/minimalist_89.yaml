construct:
  name: shRNA_gene_knockdown_HEK293
  host: HEK293

  backbone:
    catalog_vector: "pTwist shRNA"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: shRNA
        expression: high
        chain:
          - gene:
              id: shRNA_hairpin
              sequence: "GCTAGCTAGCTACGTAGCTACGTAGCTACGTAGCTACGT"
              source: custom

    - terminator: U6_terminator
