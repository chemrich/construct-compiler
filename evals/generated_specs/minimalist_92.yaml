construct:
  name: "bicistronic_P_Q_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: gene_P
        expression: high
        gene:
          id: P
          source: uniprot

    # IRES enables cap-independent translation of the downstream cistron in mammalian cells
    - spacer: 50

    - cistron:
        label: gene_Q
        expression: high
        fused: false
        gene:
          id: Q
          source: uniprot

    - terminator: rrnB_T1
