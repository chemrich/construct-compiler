construct:
  name: "mammalian_bicistronic_P_Q"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gene_P
        expression: medium
        gene:
          id: P
          source: uniprot
    - spacer: 500  # IRES element for bicistronic expression
    - cistron:
        label: gene_Q
        expression: medium
        fused: false
        gene:
          id: Q
          source: uniprot
    - terminator: bGH_polyA