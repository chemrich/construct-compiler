construct:
  name: "streptavidin_tagged_enzyme"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: lacZ
              source: uniprot
    
    - terminator: rrnB_T1
