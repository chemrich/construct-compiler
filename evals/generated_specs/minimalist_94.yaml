construct:
  name: "CPP_cargo_fusion"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: cpp_cargo
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TAT
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
