construct:
  name: "dual_promoter_expression_alpha_beta"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: alpha_protein
        expression: medium
        gene:
          id: Alpha
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7lac
    - cistron:
        label: beta_protein
        expression: medium
        gene:
          id: Beta
          source: uniprot
    - terminator: rrnB_T1