construct:
  name: alpha_beta_dual_promoter
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: alpha
        expression: high
        gene:
          id: alpha
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: beta
        expression: high
        gene:
          id: beta
          source: uniprot
    
    - terminator: rrnB_T1
