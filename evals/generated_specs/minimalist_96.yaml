construct:
  name: membrane_anchored_reporter
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: CAAX  # C-terminal CAAX motif for membrane anchoring

    - terminator: rrnB_T1
