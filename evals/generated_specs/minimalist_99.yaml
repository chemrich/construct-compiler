construct:
  name: cloning_vector_ampicillin_sacB
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: ampicillin_resistance
        expression: high
        gene:
          id: bla
          source: uniprot

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: sacB_counter_selection
        expression: high
        gene:
          id: sacB
          source: uniprot

    - terminator: rrnB_T1
