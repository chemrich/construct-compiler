construct:
  name: "yeast_alpha_amylase_LEU2"
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: alpha_amylase
        expression: high
        chain:
          - gene:
              id: alpha_amylase
              source: uniprot
          - tag: Myc

    - terminator: CYC1

    - promoter: ADH1

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: LEU2
          source: uniprot

    - terminator: CYC1
