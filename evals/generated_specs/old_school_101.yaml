construct:
  name: blue_white_screening_vector
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: lacZ_alpha
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1
