construct:
  name: "trp_controlled_target_expression"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: trp
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target
              source: uniprot
    
    - terminator: rrnB_T1
