construct:
  name: "mammalian_cmv_p53_megfp"
  host: HEK293
  backbone:
    resistance: neomycin
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: P53_HUMAN # Substitution: P53_HUMAN used as placeholder for "my gene"
          source: uniprot
    - spacer: 40
    - cistron:
        label: visual_marker
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA