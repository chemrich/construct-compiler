construct:
  name: CMV_target_GFP_neomycin
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: unspecified_target
              source: uniprot

    - spacer: 30

    - cistron:
        label: GFP_marker
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: SV40_polyA
