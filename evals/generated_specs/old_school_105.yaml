construct:
  name: "GST_fusion_TEV_cleavable"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: YOUR_GENE_HERE
              source: uniprot

    - terminator: rrnB_T1
