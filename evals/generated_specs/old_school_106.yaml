construct:
  name: "mini_operon_gene_a_gene_b"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: T7
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GENE_A
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: GENE_B
          source: uniprot
    - terminator: T7term