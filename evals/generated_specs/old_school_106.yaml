construct:
  name: "mini_operon_geneA_geneB"
  host: e_coli_bl21
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: geneA
        expression: high
        gene:
          id: geneA
    
    - spacer: 30
    
    - cistron:
        label: geneB
        expression: high
        fused: false
        gene:
          id: geneB
    
    - terminator: rrnB_T1
