construct:
  name: "inducible_lac_expression_with_lacIq"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_gene
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 100
    
    - promoter: lacIq
    
    - cistron:
        label: repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
