construct:
  name: "tac_inducible_lacIq_expression_system"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 45
    - promoter: J23100
    - cistron:
        label: lacIq_repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1