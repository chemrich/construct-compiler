construct:
  name: "secreted_protein_pelB_his"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
