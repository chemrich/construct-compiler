construct:
  name: "dual_reporter_lacZ_CAT"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: tac
    
    - cistron:
        label: CAT
        expression: high
        gene:
          id: CAT
          source: uniprot
    
    - terminator: rrnB_T1
