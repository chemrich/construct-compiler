construct:
  name: "dual_reporter_lacZ_CAT"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: lacZ_constitutive
        expression: medium
        fused: false
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: T7lac
    - cistron:
        label: CAT_inducible
        expression: high
        fused: false
        gene:
          id: cat
          source: uniprot
    - terminator: T7term