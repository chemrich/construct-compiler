construct:
  name: mammalian_dhfr_expression_amplification
  host: HEK293
  
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: SV40_early
    
    - cistron:
        label: target
        expression: high
        gene:
          id: null
          source: uniprot
    
    - terminator: SV40_poly_A
    
    - promoter: SV40_early
    
    - cistron:
        label: dhfr_selection
        expression: high
        gene:
          id: dhfr
          source: uniprot
    
    - terminator: SV40_poly_A
