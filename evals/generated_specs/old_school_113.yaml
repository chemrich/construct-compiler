construct:
  name: "Gene_X_His_overexpression"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: Gene_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Gene_X
              source: uniprot
    
    - terminator: rrnB_T1
