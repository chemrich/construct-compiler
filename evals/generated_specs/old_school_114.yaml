construct:
  name: "lambda_pr_repressible_expression_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lambda_PR
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: J23100
    - cistron:
        label: ci_repressor
        fused: false
        gene:
          id: P03034
          source: uniprot
    - terminator: BBa_B0015