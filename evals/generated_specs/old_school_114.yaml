construct:
  name: lambda_PR_conditional_expression
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lambda_PR
    
    - cistron:
        label: target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: lacUV5
    
    - cistron:
        label: cI_repressor
        expression: medium
        gene:
          id: cI
          source: uniprot
    
    - terminator: rrnB_T1
