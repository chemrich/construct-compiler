construct:
  name: mammalian_CMV_luciferase_hygro
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: Renilla_luciferase
          source: uniprot

    - polyA: SV40

    - promoter: SV40

    - cistron:
        label: hygromycin_resistance
        expression: high
        gene:
          id: hph
          source: uniprot

    - polyA: SV40

    - terminator: rrnB_T1
