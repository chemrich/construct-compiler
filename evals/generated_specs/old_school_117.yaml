construct:
  name: alpha_beta_polycistronic_expression
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_alpha
        expression: high
        gene:
          id: Alpha
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_beta
        expression: high
        fused: false
        gene:
          id: Beta
          source: uniprot
    - terminator: T7term