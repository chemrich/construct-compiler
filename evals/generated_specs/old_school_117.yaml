construct:
  name: "dual_gene_T7_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: gene_alpha
        expression: high
        gene:
          id: gene_alpha
          sequence: null

    - spacer: 30

    - cistron:
        label: gene_beta
        expression: high
        fused: false
        gene:
          id: gene_beta
          sequence: null

    - terminator: rrnB_T1
