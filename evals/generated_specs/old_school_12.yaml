construct:
  name: mitochondrial_targeting_yeast
  host: yeast

  backbone:
    resistance: HIS3
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: protein_M_mitochondrial
        expression: high
        chain:
          - tag: mitochondrial_targeting_sequence
          - gene:
              id: protein_M
              source: uniprot

    - terminator: CYC1
