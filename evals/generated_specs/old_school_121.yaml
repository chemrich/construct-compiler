construct:
  name: "lacZ_colorimetric_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: promoterY  # User-specified promoter for lacZ expression
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1