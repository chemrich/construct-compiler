construct:
  name: "GST_FactorXa_proteinB_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: proteinB
              source: uniprot
    - terminator: rrnB_T1