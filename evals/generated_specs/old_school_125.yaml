construct:
  name: "dual_cat_luxAB_expression"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: cat
        expression: high
        gene:
          id: cat
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: trp
    
    - cistron:
        label: luxAB
        expression: high
        gene:
          id: luxAB
          source: uniprot
    
    - terminator: rrnB_T1
