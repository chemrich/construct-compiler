construct:
  name: "shRNA_geneD_mammalian_knockdown"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: H1
    - cistron:
        label: shRNA_geneD
        gene:
          id: shRNA_geneD
    - terminator: SV40_polyA # Note: H1 is a Pol III promoter typically terminating at a T-stretch, but SV40 polyA was requested.