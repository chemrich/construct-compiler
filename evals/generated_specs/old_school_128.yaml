construct:
  name: promoterE_GFP_reporter
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: promoterE

    - cistron:
        label: GFP
        expression: high
        chain:
          - rbs: RBS_B0034
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
