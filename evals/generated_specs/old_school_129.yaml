construct:
  name: "proteinF_MBP_fusion"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: proteinF_MBP
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: proteinF
              source: uniprot
    
    - terminator: rrnB_T1
