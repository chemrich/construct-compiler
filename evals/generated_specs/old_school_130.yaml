construct:
  name: toxinG_arabinose_inducible
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: araC_regulator
        expression: medium
        gene:
          id: araC
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: toxinG
        expression: high
        gene:
          id: toxinG
          source: uniprot
    
    - terminator: rrnB_T1
