construct:
  name: yeast_secreted_peptideH
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GPD

    - cistron:
        label: secreted_peptideH
        expression: high
        chain:
          - tag: alpha-factor_signal
          - gene:
              id: peptideH
              source: uniprot

    - terminator: CYC1
