construct:
  name: "yeast_GPD_peptideH_secretion"
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2-micron
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: peptideH
              source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator for transcription termination and polyadenylation.