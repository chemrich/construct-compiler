construct:
  name: "mammalian_proteinI_IRES_proteinJ"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: proteinI
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinI
              source: uniprot

    # IRES (Internal Ribosome Entry Site) represented as spacer with note
    # In mammalian polycistronic designs, an IRES enables cap-independent translation of downstream cistron
    - spacer: 600  # IRES sequence (e.g., EMCV IRES ~600 bp)

    - cistron:
        label: proteinJ
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: proteinJ
              source: uniprot

    - terminator: rrnB_T1
