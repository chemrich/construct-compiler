construct:
  name: "mammalian_CRISPR_gRNA_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: U6
    - cistron:
        label: gRNA
        gene:
          id: SpCas9_gRNA
          source: uniprot
    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV
    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
