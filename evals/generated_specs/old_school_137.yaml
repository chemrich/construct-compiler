construct:
  name: toxin_antitoxin_system
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      label: toxinO_native_promoter

    - cistron:
        label: toxinO
        expression: high
        gene:
          id: toxinO
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      label: antitoxinP_native_promoter

    - cistron:
        label: antitoxinP
        expression: high
        gene:
          id: antitoxinP
          source: uniprot

    - terminator: rrnB_T1
