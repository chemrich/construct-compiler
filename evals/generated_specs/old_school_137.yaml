construct:
  name: "toxinO_antitoxinP_dual_system"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  cassette:
    - promoter: native_toxinO
    - cistron:
        label: toxinO
        expression: medium
        gene:
          id: toxinO
          source: uniprot
    - terminator: rrnB_T1
    - promoter: native_antitoxinP
    - cistron:
        label: antitoxinP
        expression: medium
        gene:
          id: antitoxinP
          source: uniprot
    - terminator: rrnB_T1