construct:
  name: "proteinR_P2A_proteinS_fusion"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: proteinR_P2A_proteinS
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinR
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: P2A
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: proteinS
              source: uniprot

    - terminator: rrnB_T1
