construct:
  name: "proteinR_P2A_proteinS_fusion"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: proteinR
              source: uniprot
          - linker:
              type: P2A  # P2A is a eukaryotic ribosome-skipping sequence; in E. coli, this will likely remain a single fusion protein without cleavage.
          - gene:
              id: proteinS
              source: uniprot
    - terminator: T7term