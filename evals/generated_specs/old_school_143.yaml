construct:
  name: "inducible_expression_vector_lacI_kanR"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: target
        expression: high
        fused: false
        gene:
          id: lacI
          source: uniprot
    
    - terminator: T7term

    - promoter: lacUV5
    
    - cistron:
        label: selection_marker
        expression: high
        fused: false
        gene:
          id: kanR
          source: uniprot
    
    - terminator: T7term
