construct:
  name: "His_tag_target_thrombin_LacZ_fusion"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: lacZ
              source: uniprot

    - terminator: rrnB_T1
