construct:
  name: "6xHis_Thrombin_LacZ_Fusion"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: pET-21a(+)
  cassette:
    - promoter: T7
    - cistron:
        label: lacz_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: LacZ
              source: uniprot
    - terminator: T7term