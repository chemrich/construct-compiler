construct:
  name: bicistronic_mammalian_SV40_IRES
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: SV40_early

    - cistron:
        label: first_cistron
        expression: high
        chain:
          - gene:
              id: GFP
              source: fpbase

    # IRES element represented as spacer with comment
    # Note: IRES (Internal Ribosome Entry Site) enables cap-independent translation of second cistron
    - spacer: 600

    - cistron:
        label: second_cistron
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: SV40_poly
