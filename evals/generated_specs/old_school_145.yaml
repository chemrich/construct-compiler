construct:
  name: "SV40_IRES_Bicistronic_Hygro"
  host: mammalian
  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40
    - cistron:
        label: gene_1
        expression: high  # Mapping 'high' to the requested full-length Kozak sequence
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 585  # Standard sequence length for an EMCV IRES element
    - cistron:
        label: gene_2
        expression: low   # Mapping 'low' to the requested weaker Kozak sequence
        fused: false      # Enables independent translation initiation via IRES
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA