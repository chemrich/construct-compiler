construct:
  name: "lacZ_promoter_reporter_pUC19"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
