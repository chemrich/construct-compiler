construct:
  name: "pUC19_lacZ_transcriptional_reporter"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5  # Selected lacUV5 as a standard E. coli promoter for reporter assays
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1