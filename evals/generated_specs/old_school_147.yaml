construct:
  name: "yeast_secreted_protein_gal1"
  host: yeast

  backbone:
    resistance: uracil
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - secretion_signal: alpha-factor
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1
