construct:
  name: "GAL1_alpha_factor_secretion_construct"
  host: yeast
  backbone:
    resistance: ura3
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: target_protein
              source: uniprot
    - terminator: CYC1