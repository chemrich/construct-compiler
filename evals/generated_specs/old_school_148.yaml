construct:
  name: "shuttle_vector_ecoli_mammalian"
  host: HEK293
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Note: This is a simplified representation. A true shuttle vector requires:
    # - ColE1/pBR322 ori for E. coli replication
    # - SV40 ori for mammalian replication
    # - Neomycin resistance gene (G418 selection) in addition to kanamycin
    # These dual-ori and dual-selection elements should be included in the custom backbone specification.
    # Consider using a commercial shuttle vector such as pSVK3, pEGFP-N1 with added bacterial ori, or similar.
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: gene_of_interest
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase
    
    - terminator: rrnB_T1
