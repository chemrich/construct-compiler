construct:
  name: "T5_mEGFP_C_terminal_FLAG_plasmid"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: addgene
  cassette:
    - promoter: T5
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1