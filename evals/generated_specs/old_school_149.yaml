construct:
  name: "ecoli_T5_FLAG_CAT"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T5
    
    - rbs: strong
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
          - tag: FLAG
    
    - terminator: rrnB_T1
