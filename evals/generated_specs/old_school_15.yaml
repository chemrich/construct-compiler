```yaml
construct:
  name: yeast_protein_p_expression
  host: yeast

  backbone:
    resistance: TRP1
    ori: CEN/ARS
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: protein_p
        expression: medium
        chain:
          - gene:
              id: P  # User-defined protein P
          - tag: 6xHis

    - terminator: CYC1
```