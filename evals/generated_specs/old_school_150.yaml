construct:
  name: "baculovirus_polh_sfGFP_transfer_vector"
  host: Sf9
  backbone:
    resistance: none  # User requested no selection marker on the transfer vector itself
    ori: pUC
    source: custom     # Transfer vector for homologous recombination into bacmid DNA
  cassette:
    - promoter: Polh   # Polyhedrin promoter for super-strong expression in late-stage infection
    - cistron:
        label: target_enzyme
        expression: high
        gene:
          id: sfGFP    # Placeholder for the enzyme specified as "this enzyme"
          source: fpbase
    - terminator: Polh_ter