construct:
  name: dual_constitutive_genes_ecoli
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: gene_A
        expression: medium
        gene:
          id: geneA
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
    
    - cistron:
        label: gene_B
        expression: medium
        gene:
          id: geneB
    
    - terminator: rrnB_T1
