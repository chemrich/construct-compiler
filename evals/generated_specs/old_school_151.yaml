construct:
  name: "dual_constitutive_inducible_expression_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: gene_a
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: araBAD
    - cistron:
        label: gene_b
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015