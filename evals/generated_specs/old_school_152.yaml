construct:
  name: "GST_fusion_protein_with_Factor_Xa"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: target_protein
              source: uniprot
    
    - terminator: rrnB_T1
