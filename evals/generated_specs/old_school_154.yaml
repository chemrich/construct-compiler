construct:
  name: "yeast_TDH3_sfGFP_LEU2"
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP # Using sfGFP as a placeholder for 'this gene' as the specific ID was not provided
          source: fpbase
    - terminator: CYC1