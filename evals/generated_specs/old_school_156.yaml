    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1