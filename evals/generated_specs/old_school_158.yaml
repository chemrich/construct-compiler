construct:
  name: "mammalian_dual_reporter_ires_puro"
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 500  # IRES sequence (approximate length)
    - cistron:
        label: reporter
        fused: false
        gene:
          id: P27652
          source: uniprot
    - terminator: SV40_polyA