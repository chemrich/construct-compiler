construct:
  name: dual_reporter_CMV_IRES_renilla
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25
      # IRES enables cap-independent translation of downstream cistron

    - cistron:
        label: renilla_luciferase
        expression: medium
        fused: false
        gene:
          id: renilla_luciferase
          source: uniprot

    - terminator: SV40_polyA
