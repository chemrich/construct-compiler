construct:
  name: "minimal_bacterial_constitutive"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: J23100 # Substituting generic strong constitutive promoter with standard J23100
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP # Using sfGFP as a placeholder for user's gene
          source: fpbase
    - terminator: BBa_B0015 # Standard rho-independent terminator