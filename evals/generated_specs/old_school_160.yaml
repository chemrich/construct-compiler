construct:
  name: "high_expression_e_coli_protein"
  host: e_coli_bl21
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot
    
    - terminator: rrnB_T1
