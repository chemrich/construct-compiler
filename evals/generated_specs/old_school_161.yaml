construct:
  name: "secreted_antibody_expression_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: SV40_early

    - cistron:
        label: secreted_antibody
        expression: high
        chain:
          - signal_peptide: mammalian_IgG_leader
          - gene:
              id: antibody_heavy_chain
              source: uniprot
        poly_a_tail: SV40

    - terminator: poly_A_SV40
