construct:
  name: "bait_lacZ_interaction_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PL_lambda

    - cistron:
        label: bait_lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: bait
              source: uniprot

    - terminator: rrnB_T1
