construct:
  name: bait_lacZ_interaction_fusion
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: lambda_PL
    - cistron:
        label: bait_fusion
        expression: high
        chain:
          - gene:
              id: bait
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: lacZ
              source: uniprot
    - terminator: rrnB_T1