construct:
  name: dual_protein_expression_trc
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: Protein_Alpha
        expression: high
        gene:
          id: protein_alpha
          source: uniprot

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: Protein_Beta
        expression: high
        gene:
          id: protein_beta
          source: uniprot

    - terminator: rrnB_T1
