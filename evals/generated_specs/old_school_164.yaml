construct:
  name: alpha_beta_dual_trc_expression
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trc
    - cistron:
        label: alpha
        expression: high
        fused: false
        gene:
          id: Protein_Alpha
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: trc
    - cistron:
        label: beta
        expression: high
        fused: false
        gene:
          id: Protein_Beta
    - terminator: rrnB_T1