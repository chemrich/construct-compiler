construct:
  name: "gst_thrombin_enzyme_purification_construct"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target_purification
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: target_enzyme
    - terminator: rrnB_T1