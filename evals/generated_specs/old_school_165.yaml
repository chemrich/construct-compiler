construct:
  name: "GST_enzyme_thrombin_cleavable"
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: enzyme
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: enzyme
              source: uniprot

    - terminator: rrnB_T1
