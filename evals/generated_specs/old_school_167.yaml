construct:
  name: "heat_inducible_lambda_PL_system"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: constitutive_arabinose  # Constitutive expression of cI repressor
      
    - cistron:
        label: cI_repressor
        expression: medium
        gene:
          id: cI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: lambda_PL  # Heat-inducible lambda P_L promoter
      
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GFP
              source: uniprot
    
    - terminator: rrnB_T1
