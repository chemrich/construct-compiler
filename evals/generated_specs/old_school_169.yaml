construct:
  name: "mammalian_protein_GFP_localization"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: target_GFP_fusion
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: protein_of_interest
              source: uniprot

    - terminator: rrnB_T1
