construct:
  name: "beta_galactosidase_reporter"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
