construct:
  name: "t7_ivt_transcription_vector"
  host: in_vitro
  backbone:
    resistance: ampicillin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: target_rna
        expression: high
        gene:
          id: mEGFP # mEGFP used as a template placeholder as the user-provided sequence cannot be directly embedded
          source: fpbase
    - terminator: T7term