construct:
  name: "ubiquitin_stability_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: stability_target
        expression: medium
        chain:
          - solubility_tag: Ubiquitin
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1