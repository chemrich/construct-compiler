construct:
  name: ubiquitin_fusion_stability_study
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: ubiquitin_fusion
        expression: high
        chain:
          - gene:
              id: ubiquitin
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: your_protein
              source: uniprot
    
    - terminator: rrnB_T1
