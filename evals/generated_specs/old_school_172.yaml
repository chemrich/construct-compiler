construct:
  name: "e_coli_yeast_shuttle_vector"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Additional features for yeast compatibility:
    # - 2-micron origin (2μ) for yeast replication
    # - LEU2 marker gene for yeast selection
    # These are assumed to be present in a dual-use shuttle vector backbone

  cassette:
    - promoter: T7lac

    - cistron:
        label: polylinker
        expression: high
        gene:
          id: MCS
          source: addgene

    - terminator: rrnB_T1
