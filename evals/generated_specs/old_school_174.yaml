construct:
  name: "inducible_lac_library_expression_vector"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: library_insertion_site
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1