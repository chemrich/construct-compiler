construct:
  name: "bacillus_subtilis_constitutive_expression"
  host: b_subtilis
  backbone:
    resistance: erythromycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pveg  # Strong constitutive promoter for Bacillus subtilis
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: gene_of_interest
          source: uniprot
    - terminator: amyL_terminator  # Bacillus-specific terminator from the alpha-amylase gene