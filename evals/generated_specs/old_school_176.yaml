construct:
  name: "bicistronic_X_Y_trc"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: X
        expression: high
        fused: false
        gene:
          id: X

    - spacer: 30

    - cistron:
        label: Y
        expression: high
        fused: false
        gene:
          id: Y

    - terminator: rrnB_T1
