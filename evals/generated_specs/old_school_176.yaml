construct:
  name: "bicistronic_trc_X_Y_expression"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trc
    - cistron:
        label: gene_X
        expression: high
        fused: false
        gene:
          id: X
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_Y
        expression: high
        fused: false
        gene:
          id: Y
          source: uniprot
    - terminator: rrnB_T1