construct:
  name: "muscle_specific_gene_therapy_vector"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: MCK  # Muscle Creatine Kinase promoter for muscle-specific expression

    - cistron:
        label: therapeutic_gene
        expression: high
        chain:
          - gene:
              id: null  # User to specify their gene ID or provide sequence via external reference

    - terminator: SV40_polyA  # SV40 poly(A) signal for mammalian mRNA stability

    - promoter: CMV  # Constitutive promoter for selection marker

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        chain:
          - gene:
              id: neo
              source: uniprot  # Neomycin phosphotransferase II (G418 resistance)

    - terminator: SV40_polyA
