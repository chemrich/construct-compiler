construct:
  name: pUC19_with_T7terminator
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
    # pUC19 backbone: lacZ alpha fragment retained, MCS present
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: insert
        expression: medium
        gene:
          id: USER_SUPPLIED
          # User inserts gene into MCS
    
    - terminator: T7term
