construct:
  name: "Bacillus_amylase_expression_system"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: Bacillus_amylase
        expression: high
        chain:
          - gene:
              id: AmyE
              source: uniprot

    - terminator: rrnB_T1
