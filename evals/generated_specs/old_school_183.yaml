construct:
  name: "mouse_gene_gal1_yeast_expression"
  host: yeast
  backbone:
    resistance: leucine  # Yeast LEU2 selection marker
    ori: 2micron         # Standard high-copy yeast origin
    source: addgene
  cassette:
    - promoter: GAL1     # Galactose-inducible promoter
    - cistron:
        label: mouse_gene
        gene:
          id: P60710      # Mus musculus Actin beta (ACTB)
          source: uniprot
    - terminator: CYC1_term # Standard yeast transcription terminator