construct:
  name: "MBP_archaeal_enzyme_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: archaeal_enzyme
              source: uniprot
    - terminator: rrnB_T1