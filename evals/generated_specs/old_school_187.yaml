construct:
  name: "E_coli_FLAG_tagged_protein"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: unspecified
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    - terminator: rrnB_T1
