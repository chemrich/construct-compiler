construct:
  name: "c_terminal_flag_tagged_protein"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_expression
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: FLAG  # User mentioned influenza origin which describes the HA tag, but explicitly asked for FLAG. Using FLAG as named.
    - terminator: T7term