construct:
  name: lacI_GeneX_inducible
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      cistron:
        label: lacI
        expression: high
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      cistron:
        label: GeneX
        expression: high
        gene:
          id: GeneX

    - terminator: rrnB_T1
