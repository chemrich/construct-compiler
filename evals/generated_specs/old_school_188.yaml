construct:
  name: "lacI_constitutive_and_GeneX_inducible"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: lacI_repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: T7lac
    - cistron:
        label: GeneX_target
        expression: high
        fused: false
        gene:
          id: GeneX
    - terminator: T7term