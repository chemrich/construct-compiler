construct:
  name: "baculovirus_human_viral_protein_expression"
  host: Sf9 # Sf9 insect cells are standard for baculovirus expression systems
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: polh # Strong polyhedrin promoter for baculovirus
    - cistron:
        label: viral_target
        expression: high
        gene:
          id: P03366 # Example: HIV-1 Gag protein
          source: uniprot
    - terminator: SV40_polyA