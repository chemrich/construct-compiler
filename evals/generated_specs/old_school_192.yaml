construct:
  name: "pUC_cloning_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lac
    - cistron:
        label: lacZ_alpha
        expression: medium
        gene:
          id: P00722  # Full-length LacZ; common proxy for alpha-complementation in specs
          source: uniprot
    - terminator: BBa_B0015