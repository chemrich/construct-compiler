construct:
  name: pUC_basic_cloning_vector
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: lacZ_alpha
        expression: medium
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
