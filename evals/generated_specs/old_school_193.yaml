construct:
  name: phage_display_M13_gIII_peptide_library
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: gIII_N_terminal
        expression: high
        chain:
          - gene:
              id: M13_gIII_N_terminal
              source: uniprot

    - spacer: 20

    - cistron:
        label: peptide_insert
        expression: high
        fused: true
        gene:
          id: peptide_library
          source: user_defined

    - spacer: 20

    - cistron:
        label: gIII_C_terminal
        expression: high
        fused: true
        gene:
          id: M13_gIII_C_terminal
          source: uniprot

    - terminator: rrnB_T1
