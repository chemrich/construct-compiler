construct:
  name: "tightly_controlled_toxic_mammalian_expression"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: p15A # Low copy number origin for reduced basal expression and plasmid stability
    source: addgene
  cassette:
    - promoter: J23106 # Constitutive promoter for the AraC regulator
    - cistron:
        label: araC_regulator
        expression: low
        gene:
          id: P0ACG8 # AraC transcriptional regulator
          source: uniprot
    - spacer: 45
    - promoter: araBAD # Arabinose-inducible promoter for tight control of the toxic protein
    - cistron:
        label: toxic_target
        expression: medium
        gene:
          id: P55957 # Human BAX (mammalian pro-apoptotic protein, often toxic in E. coli)
          source: uniprot
    - terminator: rrnB_T1