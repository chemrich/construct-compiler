construct:
  name: "tight_control_mammalian_protein_arac_pbad"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD
      label: arac_pbad_system
      regulatory_element: araC

    - cistron:
        label: toxic_mammalian_protein
        expression: very_low
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: null
              source: uniprot
              # User must provide UniProt ID or sequence for their specific mammalian protein

    - terminator: rrnB_T1
