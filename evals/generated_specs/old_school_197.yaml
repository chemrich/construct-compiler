construct:
  name: dual_luciferase_pathway_reporter
  host: HEK293
  backbone:
    resistance: kanamycin  # Kanamycin resistance gene (nptII) provides Neomycin/G418 selection in mammalian cells
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_polyA
    - promoter: SV40
    - cistron:
        label: renilla_luciferase
        expression: high
        gene:
          id: P27652
          source: uniprot
    - terminator: SV40_polyA