construct:
  name: dual_luciferase_reporter_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: Photinus_pyralis_luciferase
          source: uniprot

    - terminator: SV40_polyA

    - promoter: SV40_early

    - cistron:
        label: renilla_luciferase
        expression: high
        gene:
          id: Renilla_reniformis_luciferase
          source: uniprot

    - terminator: SV40_polyA
