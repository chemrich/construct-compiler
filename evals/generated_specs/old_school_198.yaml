construct:
  name: "Tet_On_human_gene_expression_system"
  host: HEK293

  cassette:
    - promoter: CMV
      cistron:
        label: rtTA
        expression: high
        gene:
          id: rtTA
          source: uniprot
      terminator: SV40_polyA

    - spacer: 30

    - promoter: P_TRE
      cistron:
        label: target_human_gene
        expression: high
      terminator: SV40_polyA

  backbone:
    catalog_vector: "pTRE-tight"
    resistance: hygromycin
    ori: pBR322
    source: addgene
