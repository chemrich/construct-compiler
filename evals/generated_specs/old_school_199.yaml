construct:
  name: yeast_two_hybrid_bait_AD
  host: yeast
  backbone:
    resistance: leucine
    ori: 2-micron
    source: addgene
  cassette:
  - promoter: ADH1
  - cistron:
      label: bait_AD
      expression: high
      chain:
      - gene:
          id: GAL4_AD
          source: uniprot
      - linker:
          type: GS_flexible
          repeats: 1
      - gene:
          id: bait_protein
          source: uniprot
  - terminator: CYC1
