```yaml
construct:
  name: secreted_peptide_CMV_neo
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - signal_peptide: IL2_signal  # Signal peptide for mammalian secretion
          - gene:
              id: "custom_peptide"  # Replace with actual peptide ID/sequence
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: SV40

    - cistron:
        label: selection_marker
        expression: medium
        fused: false
        gene:
          id: neo
          source: uniprot

    - terminator: SV40_polyA
```