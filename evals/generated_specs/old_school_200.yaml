construct:
  name: "high_expression_human_growth_factor_ecoli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_growth_factor
              source: uniprot

    - terminator: T7term
