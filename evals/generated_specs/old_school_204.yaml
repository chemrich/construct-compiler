construct:
  name: "GST_thrombin_protein_purification"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: PLACEHOLDER_GENE
              source: uniprot

    - terminator: rrnB_T1
