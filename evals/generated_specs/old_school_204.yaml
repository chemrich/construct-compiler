construct:
  name: "gst_thrombin_sfgfp_purification_construct"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: custom
  cassette:
    - promoter: tac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1