construct:
  name: trp_polycistronic_expression_A_B
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trp
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: Gene_A
    - spacer: 30
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: Gene_B
    - terminator: rrnB_T1