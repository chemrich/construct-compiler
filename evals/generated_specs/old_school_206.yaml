construct:
  name: "periplasmic_POI_expression_T7"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: pelB  # Periplasmic leader sequence for secretion
          - gene:
              id: POI  # Placeholder for the user's target gene
              source: uniprot
    - terminator: T7term