construct:
  name: "yeast_surface_display_Aga2_fusion"
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: Aga2_fusion
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_protein
              source: uniprot

    - terminator: ADH1
