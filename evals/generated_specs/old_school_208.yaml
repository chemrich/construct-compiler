construct:
  name: "yeast_surface_display_aga2_fusion"
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2_micron
    source: custom
  cassette:
    - promoter: ADH1
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_protein
              source: uniprot
    - terminator: ADH1