construct:
  name: "tet_inducible_GFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE
      
    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: polyA

    - spacer: 100

    - promoter: CMV

    - cistron:
        label: rtTA
        expression: medium
        gene:
          id: rtTA
          source: uniprot

    - terminator: polyA
