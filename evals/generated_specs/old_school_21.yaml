construct:
  name: "tet_inducible_gfp_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: J23100  # Constitutive promoter for TetR expression
    - cistron:
        label: tet_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - terminator: rrnB_T1
    - promoter: Ptet  # Tet-inducible promoter (repressed by TetR, induced by aTc)
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015