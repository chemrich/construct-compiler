construct:
  name: "tetR_ptet_gfp_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: tetR
        expression: medium
        gene:
          id: tetR
          source: uniprot

    - terminator: rrnB_T1

    - promoter: ptet

    - cistron:
        label: gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
