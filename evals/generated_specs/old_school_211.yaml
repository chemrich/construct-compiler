construct:
  name: "low_copy_integrase_expression"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: p15A  # p15A is the low-copy origin found in pACYC-style vectors
  cassette:
    - promoter: J23100
    - cistron:
        label: phage_integrase
        expression: high
        gene:
          id: P03700
          source: uniprot
    - terminator: BBa_B0015