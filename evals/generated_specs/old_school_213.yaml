construct:
  name: phage_display_pelb_geneIII_library
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: f1
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: PelB_signal
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: gene_III_minor_coat
              source: uniprot
    
    - terminator: rrnB_T1
