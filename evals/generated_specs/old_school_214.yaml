construct:
  name: "pBAD_phosphatase_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: phosphatase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: phosphatase
              source: uniprot

    - terminator: rrnB_T1
