construct:
  name: "promoter_trap_bla"
  host: e_coli
  backbone:
    resistance: chloramphenicol  # Using chloramphenicol to avoid conflict with the bla (ampicillin) reporter
    ori: pUC
  cassette:
    # Promoter omitted to create a promoterless trap system as requested
    - cistron:
        label: bla_reporter
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: BBa_B0015