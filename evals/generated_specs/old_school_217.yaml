construct:
  name: "mammalian_actin_GFP_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Using catalog vector as base; actin promoter will replace CMV in cassette

  cassette:
    - promoter: actin  # Constitutive mammalian promoter (minimal actin)

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: polyA  # polyA tail for mRNA stability and export
