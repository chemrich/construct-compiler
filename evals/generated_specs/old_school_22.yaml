construct:
  name: "mammalian_GrowthFactorZ_CMV"
  host: HEK293

  backbone:
    resistance: ampicillin
    ori: ColE1
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: GrowthFactorZ
        expression: high
        chain:
          - gene:
              id: GrowthFactorZ
              source: uniprot

    - terminator: SV40_polyA

  features:
    - name: SV40_ori
      type: origin
      description: SV40 origin for episomal replication in permissive mammalian cell lines
