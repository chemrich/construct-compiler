construct:
  name: "protein_x_purification_pET_setup"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_X
              source: uniprot
    - terminator: T7term