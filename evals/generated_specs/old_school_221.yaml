construct:
  name: "HeLa_Luciferase_Promoter_Validation"
  host: HeLa
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: "custom_test_promoter" # User-specified novel promoter sequence
    - cistron:
        label: test_reporter
        gene:
          id: P08659
          source: uniprot
    - terminator: SV40_polyA
    - promoter: CMV
    - cistron:
        label: positive_control
        gene:
          id: P08659
          source: uniprot
    - terminator: SV40_polyA