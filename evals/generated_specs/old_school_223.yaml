construct:
  name: "enzyme_complex_subA_subB"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: subA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: subA
              source: uniprot
    
    # IRES enables cap-independent translation of downstream cistron
    - spacer: 30
    
    - cistron:
        label: subB
        expression: high
        fused: false
        gene:
          id: subB
          source: uniprot
    
    - terminator: rrnB_T1
