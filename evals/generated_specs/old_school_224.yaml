construct:
  name: "periplasmic_peptide_hormone_secretion"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: peptide_hormone
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: peptide_hormone
              source: uniprot
    
    - terminator: rrnB_T1
