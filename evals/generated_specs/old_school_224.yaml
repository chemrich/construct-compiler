construct:
  name: "periplasmic_peptide_hormone_secretion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: custom
  cassette:
    - promoter: lacUV5
    - cistron:
        label: secreted_hormone
        expression: medium
        chain:
          - tag: pelB
          - gene:
              id: peptide_hormone
              source: uniprot
    - terminator: rrnB_T1