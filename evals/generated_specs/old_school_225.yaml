construct:
  name: MBP_fusion_solubility_tag
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: ColE1
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: target_gene
              source: uniprot

    - terminator: rrnB_T1
