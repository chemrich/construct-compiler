construct:
  name: pBAD_GFP_expression_system
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: araC_regulator
        expression: medium
        gene:
          id: araC
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    
    - terminator: rrnB_T1
