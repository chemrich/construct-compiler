construct:
  name: "HEK293_CRISPR_dual_cassette"
  host: HEK293

  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6
    - gene:
        id: guide_RNA
        source: custom
    - terminator: U6term

    - spacer: 100

    - promoter: CMV
    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
          - tag: NLS
    - terminator: SV40poly
