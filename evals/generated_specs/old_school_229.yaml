construct:
  name: "yeast_two_hybrid_GAL4_DBD_fusion"
  host: yeast

  backbone:
    resistance: trp1
    ori: 2micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: GAL4_DBD_fusion
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "user_gene_of_interest"
              source: uniprot

    - terminator: CYC1
