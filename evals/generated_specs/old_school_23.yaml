construct:
  name: "yeast_two_hybrid_bait_ProteinA_GAL4DBD"
  host: yeast

  backbone:
    resistance: TRP1
    ori: CEN
    source: addgene
    # pRS-derived vector with ARS/CEN for autonomous replication

  cassette:
    - promoter: ADH1

    - cistron:
        label: bait
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinA
              source: uniprot

    - terminator: ADH1
