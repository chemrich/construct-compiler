construct:
  name: protein_y_expression_e_coli
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: lac
    - cistron:
        label: target_protein
        expression: medium
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: Protein_Y
              source: uniprot
    - terminator: rrnB_T1