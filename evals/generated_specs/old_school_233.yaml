construct:
  name: "FKBP_FRB_dimerization_switch"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: GFP_FKBP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P62942
              source: uniprot
    - spacer: 30
    - cistron:
        label: RFP_FRB
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P42345
              source: uniprot
    - terminator: rrnB_T1