construct:
  name: "S_cerevisiae_URA3_knockout_loxP_geneX"
  host: yeast

  backbone:
    resistance: trp1
    ori: CEN6
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: homology_arm_5prime
        expression: very_low
        gene:
          id: geneX_5arm
          source: uniprot

    - spacer: 30

    - cistron:
        label: loxP_site_upstream
        expression: very_low
        gene:
          id: loxP
          source: uniprot

    - spacer: 30

    - cistron:
        label: URA3_marker
        expression: high
        gene:
          id: URA3
          source: uniprot

    - spacer: 30

    - cistron:
        label: loxP_site_downstream
        expression: very_low
        gene:
          id: loxP
          source: uniprot

    - spacer: 30

    - cistron:
        label: homology_arm_3prime
        expression: very_low
        gene:
          id: geneX_3arm
          source: uniprot

    - terminator: rrnB_T1
