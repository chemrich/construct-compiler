construct:
  name: ccdB_ccdA_toxin_antitoxin_selection
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: ColE1
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: toxin
        expression: high
        gene:
          id: ccdB
          source: uniprot

    - spacer: 25

    - cistron:
        label: antitoxin
        expression: high
        fused: false
        gene:
          id: ccdA
          source: uniprot

    - terminator: rrnB_T1
