construct:
  name: hsp70_EGFP_mammalian_stable
  host: HEK293

  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: hsp70

    - cistron:
        label: EGFP
        expression: high
        chain:
          - gene:
              id: EGFP
              source: uniprot

    - terminator: rrnB_T1
