```yaml
construct:
  name: "enzymeX_lacI_bicistronic_tac_regulated"
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: enzymeX
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: EnzymeX
              source: uniprot

    - spacer: 30

    - cistron:
        label: lacI_repressor
        expression: medium
        fused: false
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
```