construct:
  name: "EnzymeX_GST_LacI_self_repressed"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - tag: GST
          - gene:
              id: EnzymeX
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: LacI
        expression: medium
        fused: false
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
