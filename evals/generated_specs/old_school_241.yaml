construct:
  name: "trp_lacZ_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin  # from Tn903
    ori: pUC  # high copy number
    source: custom

  cassette:
    - promoter: trp

    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
