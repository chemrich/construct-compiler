construct:
  name: "mammalian_special_human_gene_expression"
  host: HEK293

  backbone:
    resistance: neomycin
    ori: SV40
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: special_human_gene
        expression: high
        gene:
          id: special_human_gene
          source: uniprot

    - terminator: SV40_polyA
