construct:
  name: "special_human_gene_mammalian_expression_vector"
  host: mammalian
  backbone:
    # User requested no bacterial parts; using SV40 origin for mammalian propagation and Neomycin for selection
    resistance: neomycin
    ori: SV40
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        gene:
          id: Special_Human_Gene
          source: uniprot
    - terminator: SV40_polyA