construct:
  name: yeast_wonder_gene_expression
  host: yeast

  backbone:
    resistance: URA3
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: wonder_gene
        expression: high
        chain:
          - gene:
              id: YWG1
              source: uniprot

    - terminator: CYC1
