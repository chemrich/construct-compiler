construct:
  name: "Gene_Alpha_Beta_fusion"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: Gene_Alpha
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Gene_Beta
              source: uniprot
    
    - terminator: rrnB_T1
