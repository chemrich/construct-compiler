construct:
  name: "gene_alpha_beta_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: fusion_protein
        expression: medium
        chain:
          - gene:
              id: Gene_Alpha
          - linker:
              type: short_GS
          - gene:
              id: Gene_Beta
    - terminator: rrnB_T1