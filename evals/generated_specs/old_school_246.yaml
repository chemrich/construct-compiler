construct:
  name: "pelB_mediated_secretion_of_exported_factor"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: custom
  cassette:
    - promoter: tac
    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: Exported_Factor
    - terminator: rrnB_T1