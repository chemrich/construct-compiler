construct:
  name: "pelB_secretion_exported_factor"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: exported_factor
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: exported_factor
              source: uniprot

    - terminator: rrnB_T1
