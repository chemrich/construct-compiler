construct:
  name: dual_promoter_protein_A_B
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: protein_A
        expression: high
        gene:
          id: protein_A
          source: uniprot

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: protein_B
        expression: high
        gene:
          id: protein_B
          source: uniprot

    - terminator: rrnB_T1
