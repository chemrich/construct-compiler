construct:
  name: "dual_lac_trp_expression_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
  cassette:
    - promoter: lac
    - cistron:
        label: protein_a
        expression: medium
        fused: false
        gene:
          id: protein_a
          source: uniprot
    - terminator: rrnB_T1
    - promoter: trp
    - cistron:
        label: protein_b
        expression: medium
        fused: false
        gene:
          id: protein_b
          source: uniprot
    - terminator: BBa_B0015