construct:
  name: "GST_FactorXa_PreciousProtein"
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: PreciousProtein
              source: uniprot

    - terminator: rrnB_T1
