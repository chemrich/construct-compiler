construct:
  name: "precious_protein_gst_fusion"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
  cassette:
    - promoter: araBAD
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: Precious_Protein
    - terminator: rrnB_T1