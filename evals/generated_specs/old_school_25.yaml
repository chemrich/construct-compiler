construct:
  name: "mammalian_secreted_FactorS"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC

  cassette:
    - promoter: SV40_early

    - cistron:
        label: FactorS_secreted
        expression: high
        chain:
          - signal_peptide: IgG
          - gene:
              id: FactorS
              source: uniprot

    - terminator: BGH_polyA

    - promoter: EF1_alpha

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: NeoR
          source: uniprot

    - terminator: BGH_polyA
