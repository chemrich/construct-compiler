construct:
  name: "secreted_FactorS_mammalian_expression"
  host: mammalian
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40
    - cistron:
        label: factor_s_expression
        expression: high
        chain:
          - tag: IgG_kappa
          - gene:
              id: FactorS
              source: uniprot
    - terminator: BGH_polyA
    - promoter: CMV
    - cistron:
        label: neomycin_selection
        expression: medium
        fused: false
        gene:
          id: NeoR
          source: uniprot
    - terminator: SV40_polyA