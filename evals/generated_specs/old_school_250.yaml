construct:
  name: "tight_tet_OFF_system"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: SC101
    source: addgene
  
  cassette:
    - promoter: Ptet
      
    - cistron:
        label: target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
