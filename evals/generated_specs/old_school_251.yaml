construct:
  name: high_copy_reporter_enzyme
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: pL  # Lambda phage pL promoter, strong constitutive

    - cistron:
        label: reporter_enzyme
        expression: high
        gene:
          id: reporter_enzyme
          source: uniprot

    - terminator: rrnB_T1
