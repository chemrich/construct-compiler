construct:
  name: "yeast_TRP1_stable_integration"
  host: yeast

  backbone:
    resistance: LEU2
    ori: null
    source: genomic_integration

  cassette:
    - homology_arm:
        locus: TRP1
        position: upstream
        length: 500

    - promoter: PGK1

    - cistron:
        label: target
        expression: high
        gene:
          id: Stable_Expression_Gene
          source: uniprot

    - terminator: PGK1_terminator

    - homology_arm:
        locus: TRP1
        position: downstream
        length: 500
