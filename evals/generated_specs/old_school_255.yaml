construct:
  name: "simple_kan_marker_cassette"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: kan_resistance
        expression: high
        gene:
          id: kanR
          source: uniprot

    - terminator: rrnB_T1
