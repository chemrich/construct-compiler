construct:
  name: "pUC18_polylinker_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5  # lacUV5 substituted for wild-type lac to satisfy 'strong' requirement
    - cistron:
        label: MCS
        # The polylinker is historically part of the lacZ_alpha fragment for blue-white screening
        gene:
          id: lacZ_alpha
          source: uniprot
    - terminator: rrnB_T1