construct:
  name: pUC18_cloning_vector
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: MCS
        expression: high
        chain:
          - cloning_site:
              type: pUC18_polylinker
              sites:
                - EcoRI
                - BamHI
                - SmaI
                - KpnI
                - SacI
                - SphI
                - HindIII

    - terminator: rrnB_T1
