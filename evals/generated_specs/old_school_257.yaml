construct:
  name: recA_luxAB_reporter
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: recA
    
    - cistron:
        label: luxAB_operon
        expression: high
        gene:
          id: luxAB
          source: uniprot
    
    - terminator: rrnB_T1
