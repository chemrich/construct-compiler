construct:
  name: "recA_luxAB_reporter"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: recA
    - cistron:
        label: luxA
        expression: medium
        gene:
          id: P07739
          source: uniprot
    - spacer: 30
    - cistron:
        label: luxB
        expression: medium
        fused: false
        gene:
          id: P07740
          source: uniprot
    - terminator: rrnB_T1