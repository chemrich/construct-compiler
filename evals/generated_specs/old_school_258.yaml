construct:
  name: "protein_of_death_survival_test"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
  cassette:
    - promoter: J23114  # Weakest constitutive promoter in the Anderson library
    - cistron:
        label: toxic_protein
        expression: very_low
        gene:
          id: protein_of_death
          source: uniprot
    - terminator: rrnB_T1