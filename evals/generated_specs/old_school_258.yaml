construct:
  name: Protein_of_Death_minimal_expression
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23114  # very weak constitutive promoter from Anderson library
    
    - cistron:
        label: protein_of_death
        expression: very_low
        gene:
          id: protein_of_death
    
    - terminator: rrnB_T1
