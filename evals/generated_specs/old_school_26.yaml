construct:
  name: "SensorY_Luciferase_yeast_CUP1"
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: CUP1

    - cistron:
        label: SensorY_Luciferase
        expression: high
        chain:
          - gene:
              id: SensorY
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: ADH1
