construct:
  name: "yeast_GrowthFactor_secretion"
  host: yeast

  backbone:
    resistance: URA3
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAPDH

    - cistron:
        label: GrowthFactor
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: GrowthFactor
              source: uniprot

    - terminator: CYC1
