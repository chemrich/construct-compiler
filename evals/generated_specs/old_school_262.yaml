construct:
  name: yeast_growth_factor_secretion
  host: yeast
  backbone:
    resistance: ura3
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAPDH
    - cistron:
        label: secreted_growth_factor
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: GrowthFactor
              source: uniprot
    - terminator: CYC1