construct:
  name: "PartnerA_PartnerB_coexpression"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
    repressor: lacIq

  cassette:
    - promoter: tac

    - cistron:
        label: PartnerA
        expression: high
        gene:
          id: PartnerA
          source: uniprot

    - spacer: 30

    - cistron:
        label: PartnerB
        expression: high
        fused: false
        gene:
          id: PartnerB
          source: uniprot

    - terminator: rrnB_T1
