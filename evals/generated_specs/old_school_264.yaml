construct:
  name: "tac_polycistronic_partnerA_partnerB"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: custom
  cassette:
    - promoter: tac
    - cistron:
        label: partner_a
        expression: high
        gene:
          id: PartnerA
          source: uniprot
    - spacer: 30
    - cistron:
        label: partner_b
        expression: high
        fused: false
        gene:
          id: PartnerB
          source: uniprot
    - terminator: rrnB_T1