construct:
  name: InsolubleProtein_GST_cleavable
  host: e_coli
  
  backbone:
    catalog_vector: "pGEX-4T-1"
    resistance: ampicillin
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: InsolubleProtein_GST
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: InsolubleProtein
    
    - terminator: rrnB_T1
