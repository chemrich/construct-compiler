construct:
  name: "GST_FactorXa_InsolubleProtein_Fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: InsolubleProtein
              source: uniprot
    - terminator: rrnB_T1