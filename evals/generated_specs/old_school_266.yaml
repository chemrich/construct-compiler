construct:
  name: "mypromoter_lacz_strength_test"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
  cassette:
    - promoter: "MyPromoter" # Custom promoter as requested by user
    - cistron:
        label: "lacZ_reporter"
        expression: high
        chain:
          - gene:
              id: "lacZ"
              source: uniprot
    - terminator: "rrnB_T1"