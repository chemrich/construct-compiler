construct:
  name: "MyPromoter_lacZ_test"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: MyPromoter
    
    - ribosome_binding_site: Shine_Dalgarno
    
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot
    
    - terminator: rrnB_T1
