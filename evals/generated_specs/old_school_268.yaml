construct:
  name: "yeast_two_hybrid_target_BD"
  host: yeast

  backbone:
    resistance: trp1
    ori: 2µm
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: target_BD
        expression: high
        chain:
          - gene:
              id: TargetProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GAL4_BD

    - terminator: CYC1
