construct:
  name: pnovel_lacZ_reporter
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: Pnovel

    - cistron:
        label: reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
