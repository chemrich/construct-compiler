construct:
  name: "Pnovel_LacZ_reporter_test"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: p15A
  cassette:
    - promoter: Pnovel
    - cistron:
        label: lacZ_reporter
        expression: medium
        gene:
          id: LacZ
          source: uniprot
    - terminator: rrnB_T1