construct:
  name: "yeast_ADH1_sfGFP_HIS3_integration"
  host: yeast
  backbone:
    catalog_vector: "pRS403"  # Standard yeast integrative vector with HIS3 marker for selection and recombination
  cassette:
    - promoter: ADH1
    - cistron:
        label: reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: CYC1