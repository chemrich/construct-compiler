construct:
  name: "yeast_GFP_ADH1_HIS3_integration"
  host: yeast

  backbone:
    resistance: HIS3
    ori: none
    source: custom

  cassette:
    - promoter: ADH1

    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: GFP
              source: fpbase

    - terminator: CYC1

    - cistron:
        label: HIS3_marker
        expression: high
        chain:
          - gene:
              id: HIS3
              source: uniprot

    - terminator: CYC1
