construct:
  name: "AAV_UbC_Luciferase_WPRE"
  host: HEK293

  backbone:
    catalog_vector: "pAAV"
    # Note: pAAV backbone includes AAV ITRs and lacks selection marker per design requirements

  cassette:
    - promoter: UbC

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: Firefly_Luciferase
          source: uniprot

    - regulatory_element: WPRE

    - terminator: SV40_poly_A
