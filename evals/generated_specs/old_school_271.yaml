construct:
  name: "AAV_UbC_Luciferase_WPRE"
  host: HEK293
  backbone:
    # AAV2 ITRs are integrated into the backbone to flank the expression cassette
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: UbC
    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: WPRE_hGH_pA # WPRE sequence included for post-transcriptional enhancement as requested