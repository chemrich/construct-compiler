construct:
  name: "CAG_GFP_IRES_MyGene_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CAG

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    # IRES element represented as spacer with comment
    - spacer: 600  # IRES (Internal Ribosome Entry Site) ~600bp

    - cistron:
        label: MyGene
        expression: high
        fused: false
        chain:
          - gene:
              id: MyGene
              source: uniprot

    - terminator: rrnB_T1
