construct:
  name: "e_coli_dual_stress_response"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: hsp70
      
    - cistron:
        label: heat_shock_gfp
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
  
  cassette:
    - promoter: osmY
      
    - cistron:
        label: osmotic_stress_rfp
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
