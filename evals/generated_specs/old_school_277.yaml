construct:
  name: "shRNA_TargetGene_knockdown"
  host: HEK293

  backbone:
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: H1

    - cistron:
        label: shRNA_TargetGene
        expression: high
        chain:
          - gene:
              id: TargetGene_shRNA
              source: custom

    - terminator: poly_T  # Pol III termination (TTTT)
