construct:
  name: "scaffold_x_expression_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: scaffold
        expression: medium
        chain:
          - gene:
              id: ScaffoldX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
    - terminator: rrnB_T1