construct:
  name: "ScaffoldX_expression_vector"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: ScaffoldX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ScaffoldX
              source: uniprot

    - terminator: rrnB_T1
