construct:
  name: "TherapeuticP_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC

  cassette:
    - promoter: CAG
    
    - cistron:
        label: TherapeuticP
        expression: high
        chain:
          - gene:
              id: TherapeuticP
              source: uniprot
    
    - terminator: BGH_polyA
    
    # WPRE for post-transcriptional stability
    - regulatory_element: WPRE
