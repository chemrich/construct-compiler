construct:
  name: therapeutic_p_high_expression_cag
  host: HEK293
  backbone:
    resistance: blasticidin
    ori: pUC
    source: custom
  cassette:
    - promoter: CAG # Includes CMV enhancer, chicken beta-actin promoter, and rabbit beta-globin intron
    - cistron:
        label: therapeutic_p
        expression: high # High expression setting incorporates a consensus Kozak sequence for mammalian hosts
        gene:
          id: TherapeuticP
          source: uniprot
    - terminator: BGH_polyA_WPRE # BGH polyadenylation signal with WPRE for mRNA stability