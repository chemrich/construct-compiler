construct:
  name: "FactorZ_mammalian_expression"
  host: mammalian
  backbone:
    catalog_vector: "pcDNA3.1(+)" # Includes NeoR for G418 selection and CMV promoter
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: FactorZ
              source: uniprot
    - terminator: bGH_polyA