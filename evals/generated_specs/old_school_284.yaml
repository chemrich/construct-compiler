construct:
  name: "promoter_test_gfp_rho_independent"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Used as a standard constitutive promoter for testing purposes
    - cistron:
        label: target
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015  # Standard rho-independent terminator (double terminator)