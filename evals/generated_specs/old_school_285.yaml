construct:
  name: "GeneX_GeneY_GeneZ_operon"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: GeneX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneX
    
    - cistron:
        label: GeneY
        expression: high
        fused: false
        gene:
          id: GeneY
    
    - cistron:
        label: GeneZ
        expression: high
        fused: false
        gene:
          id: GeneZ
    
    - terminator: rrnB_T1
