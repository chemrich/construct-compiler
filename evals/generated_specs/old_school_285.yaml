construct:
  name: "lac_operon_GeneX_GeneY_GeneZ"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: lacUV5
    - cistron:
        label: GeneX
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GeneX
    - spacer: 30
    - cistron:
        label: GeneY
        expression: medium
        fused: false
        gene:
          id: GeneY
    - spacer: 30
    - cistron:
        label: GeneZ
        expression: medium
        fused: false
        gene:
          id: GeneZ
    - terminator: rrnB_T1