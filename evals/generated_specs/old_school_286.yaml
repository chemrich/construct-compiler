construct:
  name: mammalian_firefly_luciferase_reporter
  host: HEK293

  backbone:
    resistance: DHFR
    ori: SV40
    source: addgene

  cassette:
    - promoter_cloning_site: MCS  # User-provided promoter sequence to be inserted here

    - cistron:
        label: luciferase
        expression: high
        chain:
          - kozak_sequence: GCCRCCATGG
          - gene:
              id: firefly_luciferase
              source: uniprot

    - polya_signal: SV40
