construct:
  name: "PeptideD_lac_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - cleavage_site: Thrombin
          - gene:
              id: PeptideD
    - terminator: rrnB_T1