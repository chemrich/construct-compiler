construct:
  name: "CMV_Gene1_Myc_IRES_Gene2_polyA"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Gene1
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: Gene1
              source: uniprot

    - spacer: 50  # IRES element (represented as spacer; compiler will insert IRES)

    - cistron:
        label: Gene2
        expression: high
        fused: false
        gene:
          id: Gene2
          source: uniprot

    - terminator: polyA
