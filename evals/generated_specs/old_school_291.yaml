construct:
  name: "yeast_secreted_ProteinE"
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_ProteinE
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: ProteinE
              source: uniprot

    - terminator: poly_A_yeast
