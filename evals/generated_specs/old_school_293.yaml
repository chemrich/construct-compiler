construct:
  name: ProteinG_GFP_mammalian_localization
  host: HEK293

  backbone:
    resistance: hygromycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinG_GFP_fusion
        expression: high
        chain:
          - gene:
              id: ProteinG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: EGFP
              source: fpbase

    - polya: SV40

    - terminator: rrnB_T1
