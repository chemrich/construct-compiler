construct:
  name: yeast_bait_gal4_dbd_fusion
  host: yeast
  backbone:
    resistance: TRP1  # TRP1 auxotrophic marker used for selection in yeast
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait
        chain:
          - tag: GAL4_DBD
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: BaitProteinI
              source: uniprot
    - terminator: ADH1_term # Standard yeast terminator providing polyadenylation signal