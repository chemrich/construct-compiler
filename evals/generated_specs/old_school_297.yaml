construct:
  name: "mammalian_gRNA_U6_PuroR"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        gene:
          id: gRNA_scaffold
          source: uniprot

    - terminator: U6term

    - spacer: 100

    - promoter: CMV

    - cistron:
        label: PuroR
        expression: high
        chain:
          - gene:
              id: puromycin_N_acetyltransferase
              source: uniprot

    - terminator: rrnB_T1
