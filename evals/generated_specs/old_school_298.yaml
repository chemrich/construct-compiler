construct:
  name: "GeneP_GeneQ_Dual_Inducible_Expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5
    - cistron:
        label: GeneP_expression
        chain:
          - tag: 6xHis
          - gene:
              id: GeneP
              source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5
    - cistron:
        label: GeneQ_expression
        gene:
          id: GeneQ
          source: uniprot
    - terminator: rrnB_T1