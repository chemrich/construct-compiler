construct:
  name: GeneP_GeneQ_dual_inducible
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneP
              source: uniprot
    
    - terminator: rrnB_T1

    - promoter: T7lac
    
    - cistron:
        label: GeneQ
        expression: high
        chain:
          - gene:
              id: GeneQ
              source: uniprot
    
    - terminator: rrnB_T1
