construct:
  name: "ProteinR_ProteinS_mammalian_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC

  cassette:
    - promoter: SV40

    - cistron:
        label: ProteinR
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: ProteinR
              source: uniprot

    - terminator: polyA_signal

    # IRES for cap-independent translation of ProteinS
    - spacer: 50
    
    - cistron:
        label: ProteinS
        expression: high
        fused: false
        gene:
          id: ProteinS
          source: uniprot

    - terminator: polyA_signal

    # Neomycin resistance cassette with separate promoter
    - promoter: CMV

    - cistron:
        label: Neomycin_resistance
        expression: high
        gene:
          id: neo
          source: uniprot

    - terminator: polyA_signal
