```yaml
construct:
  name: "bicistronic_enzyme_A_enzyme_B"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: "Enzyme A"  # Replace with actual gene ID/name
          source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: "Enzyme B"  # Replace with actual gene ID/name
          source: uniprot

    - terminator: rrnB_T1
```