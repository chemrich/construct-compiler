construct:
  name: "bicistronic_EnzymeA_EnzymeB"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: EnzymeA
        expression: high
        gene:
          id: EnzymeA
          source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeB
        expression: high
        fused: false
        gene:
          id: EnzymeB
          source: uniprot

    - terminator: rrnB_T1
