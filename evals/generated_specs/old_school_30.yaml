construct:
  name: "shuttle_vector_AntigenA_ecoli_yeast"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Note: This construct includes dual origins (ColE1 for E. coli, ARS/CEN for yeast)
    # and dual selectable markers (AmpR for E. coli, URA3 for yeast) to function
    # as a shuttle vector. Additional backbone elements (ARS/CEN, URA3) should be
    # included in the physical construct but are specified here for documentation.
    
  cassette:
    # E. coli expression cassette
    - promoter: lacUV5
    
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    # Yeast expression cassette
    - promoter: GPD
    
    - cistron:
        label: AntigenA
        expression: high
        gene:
          id: AntigenA
          source: uniprot
    
    - terminator: rrnB_T1
