```yaml
construct:
  name: AntigenA_shuttle_vector
  host: e_coli  # Primary host for cloning

  backbone:
    resistance: ampicillin
    ori: pBR322  # Contains ColE1
    source: custom

  cassette:
    - promoter: lac
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: P03023  # LacI repressor
          source: uniprot
    - terminator: rrnB_T1

    - promoter: lac
    - cistron:
        label: antigenA_ecoli
        expression: high
        gene:
          id: AntigenA
          # source: uniprot  # User should specify actual protein ID
    - terminator: rrnB_T1

    # Yeast expression cassette
    - promoter: GPD  # Strong constitutive yeast promoter
    - cistron:
        label: antigenA_yeast
        expression: high
        gene:
          id: AntigenA
          # source: uniprot  # Same antigen for yeast expression
    - terminator: CYC1  # Yeast terminator

    # Note: This YAML schema doesn't explicitly support multiple origins or selection markers
    # The actual shuttle vector would need ARS/CEN origin and URA3 marker added during assembly
```