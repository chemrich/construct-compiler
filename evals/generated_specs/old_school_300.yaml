construct:
  name: "geneX_lacZ_expression_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        gene:
          id: geneX
          source: uniprot
    - spacer: 30
    - cistron:
        label: screening_reporter
        expression: medium
        fused: false
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1