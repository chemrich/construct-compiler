construct:
  name: "enzymeZ_dual_resistance"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Note: dual antibiotic resistance (ampicillin + tetracycline) requires 
    # two separate resistance markers in the backbone. This spec includes ampicillin 
    # as primary; tetracycline marker must be engineered into the pBR322 backbone separately.
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: enzymeZ
        expression: high
        gene:
          id: enzymeZ
          source: uniprot
    
    - terminator: rrnB_T1
