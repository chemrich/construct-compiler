construct:
  name: "enzymeZ_pBR322_constitutive_dual_selection"
  host: e_coli
  backbone:
    resistance: ampicillin # pBR322 naturally carries both ampicillin (bla) and tetracycline (tetA) resistance markers
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Standard constitutive promoter for E. coli
    - cistron:
        label: target_enzyme
        expression: medium
        gene:
          id: enzymeZ
          source: uniprot
    - terminator: rrnB_T1