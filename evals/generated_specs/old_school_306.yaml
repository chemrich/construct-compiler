construct:
  name: GST_growth_factor_purification
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: GST_growth_factor
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: growth_factor
              source: uniprot
    
    - terminator: rrnB_T1
