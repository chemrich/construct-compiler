construct:
  name: "growth_factor_gst_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: J23100  # Standard constitutive promoter for E. coli
    - cistron:
        label: growth_factor_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: growth_factor
              source: uniprot
    - terminator: rrnB_T1