construct:
  name: subunitA_subunitB_coexpression
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: subunitA
        expression: high
        gene:
          id: subunitA
          source: uniprot

    - spacer: 30

    - cistron:
        label: subunitB
        expression: high
        fused: false
        gene:
          id: subunitB
          source: uniprot

    - terminator: rrnB_T1
