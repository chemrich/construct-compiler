construct:
  name: "subunitA_subunitB_coexpression"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: lacUV5
    - cistron:
        label: subunit_A
        gene:
          id: subunitA
          source: uniprot
    - spacer: 30
    - cistron:
        label: subunit_B
        fused: false
        gene:
          id: subunitB
          source: uniprot
    - terminator: rrnB_T1