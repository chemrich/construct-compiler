construct:
  name: "mammalian_luciferase_constitutive"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin
    ori: pUC

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: luciferase
        expression: medium
        chain:
          - gene:
              id: Renilla_reniformis_luciferase
              source: uniprot

    - terminator: rrnB_T1
