construct:
  name: "peptideM_c_terminal_flag_expression"
  host: e_coli
  backbone:
    resistance: tetracycline  # User requested tetracycline; common for pBR322-based vectors
    ori: pBR322
  cassette:
    - promoter: trp
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: peptideM
          - tag: FLAG
    - terminator: rrnB_T1  # Strong Rho-independent terminator