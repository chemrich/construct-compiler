construct:
  name: "CMV_protein_alpha_IRES_RFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_alpha
        expression: high
        gene:
          id: protein_alpha
          source: uniprot

    # IRES element enables cap-independent translation of downstream cistron
    - spacer: 588  # IRES_EMCV sequence, ~588 bp

    - cistron:
        label: red_fluorescent_protein
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
