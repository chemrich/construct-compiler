construct:
  name: cDNA_library_vector_with_lacZ_screening
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Note: lacZ alpha-fragment is present for blue/white screening

  cassette:
    - promoter: lacUV5
      # Strong constitutive promoter suitable for cDNA expression and library screening

    - cistron:
        label: lacZ_alpha
        expression: high
        chain:
          - gene:
              id: lacZ_alpha
              source: uniprot
              # Multiple Cloning Site (MCS) positioned within lacZ coding sequence
              # Insertion here disrupts lacZ and enables blue/white screening

    - terminator: rrnB_T1
