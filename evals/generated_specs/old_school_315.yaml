construct:
  name: "tet_on_regulated_apoptosis_system"
  host: HEK293
  backbone:
    resistance: blasticidin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G  # Substituted for CMV to enable Tet-On inducible control as requested
    - cistron:
        label: apoptosis_inducer
        expression: high
        gene:
          id: P55269
          source: uniprot
    - spacer: 60
    - promoter: CMV
    - cistron:
        label: rtTA_transactivator
        expression: medium
        fused: false
        gene:
          id: Q06AC0
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21