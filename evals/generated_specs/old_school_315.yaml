construct:
  name: "tet_on_apoptosis_inducer_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTRE3G"
    resistance: blasticidin
    source: addgene

  cassette:
    - promoter: TRE3G
      # Tetracycline-responsive element (tet-on): requires rtTA transactivator
      # Provides tight OFF state and dose-dependent ON with doxycycline

    - cistron:
        label: apoptosis_inducer
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: apoptosis_inducer
              source: uniprot

    - terminator: SV40_polyA
