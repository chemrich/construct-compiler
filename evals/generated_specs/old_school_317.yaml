construct:
  name: "antibody_fragment_secretion_mammalian"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin # Kanamycin resistance gene (NeoR) provides G418 selection in mammalian cells
    source: twist
  cassette:
    - promoter: CMV
    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: IgK_leader # Secretion signal peptide for mammalian expression
          - gene:
              id: antibody_fragment
              source: uniprot
    - terminator: bGH_pA