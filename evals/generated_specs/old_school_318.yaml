construct:
  name: "divergent_promoter_cloning_vector"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      direction: forward

    - spacer: 50

    - mcs:
        sites:
          - EcoRI
          - BamHI
          - HindIII
          - XbaI
          - SalI
          - PstI
        cloning_strategy: directional

    - spacer: 50

    - promoter: T7
      direction: reverse

    - terminator: rrnB_T1
