construct:
  name: "basic_e_coli_backbone"
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: tetR
          source: uniprot
    - terminator: rrnB_T1
