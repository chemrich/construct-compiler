construct:
  name: "GFP_LacZ_fusion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist EF1a"
    ori: null
    resistance: null

  cassette:
    - promoter: EF1_alpha

    - kozak_sequence: strong

    - cistron:
        label: GFP_LacZ_fusion
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: lacZ
              source: uniprot

    - polyadenylation: SV40_late

    - terminator: rrnB_T1
