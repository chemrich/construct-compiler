construct:
  name: "EF1a_mEGFP_LacZ_Fusion"
  host: mammalian
  backbone:
    resistance: kanamycin # Defaulting to kanamycin per Rule 9; prompt requested no selection marker
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: lacZ
              source: uniprot
    - terminator: SV40_polyA