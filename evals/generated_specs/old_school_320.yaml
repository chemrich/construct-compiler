construct:
  name: "pBR322_high_expression_polypeptide"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: target_polypeptide
        expression: high
        chain:
          - gene:
              id: custom_polypeptide
              source: uniprot

    - terminator: rrnB_T1
