construct:
  name: "lacZ_expression_vector"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: beta_gal
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
