construct:
  name: "SV40_gene_du_jour_HeLa_neo_selection"
  host: HeLa

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: SV40_early

    - cistron:
        label: gene_du_jour
        expression: high
        chain:
          - gene:
              id: gene_du_jour
              source: uniprot

    - terminator: SV40_poly_A

    - spacer: 30

    - promoter: SV40_early

    - cistron:
        label: neo_selection
        expression: high
        fused: false
        gene:
          id: neo
          source: uniprot

    - terminator: SV40_poly_A
