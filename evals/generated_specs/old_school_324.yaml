construct:
  name: "IPTG_inducible_peptide_expression"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    lacI_repressor: true

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide
        expression: high
        gene:
          id: peptide
          source: uniprot

    - terminator: rrnB_T1
