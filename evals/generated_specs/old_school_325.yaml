construct:
  name: "T7_high_yield_expression_vector"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP # sfGFP selected as a standard high-yield reporter for 'my gene'
          source: fpbase
    - terminator: T7term