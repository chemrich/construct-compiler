construct:
  name: GST_protein_X_thrombin
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GST_protein_X
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: protein_X
              source: uniprot
    
    - terminator: rrnB_T1
