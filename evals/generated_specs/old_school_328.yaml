construct:
  name: "dual_lac_protein_a_b_expression"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: protein_a
        expression: medium
        fused: false
        gene:
          id: PROTEIN_A_ID
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5
    - cistron:
        label: protein_b
        expression: medium
        fused: false
        gene:
          id: PROTEIN_B_ID
          source: uniprot
    - terminator: rrnB_T1