construct:
  name: "dual_protein_expression_A_B"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassettes:
    - promoter: lacUV5
      ribosome_binding_site: SD_canonical
      cistron:
        label: Protein_A
        expression: high
        gene:
          id: protein_a
          source: uniprot
      terminator: rrnB_T1
    
    - promoter: lacUV5
      ribosome_binding_site: SD_canonical
      cistron:
        label: Protein_B
        expression: high
        gene:
          id: protein_b
          source: uniprot
      terminator: rrnB_T1
