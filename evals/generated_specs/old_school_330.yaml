construct:
  name: "tetracycline_inducible_mammalian_system"
  host: HEK293

  cassette:
    - promoter: CMV
      cistron:
        label: regulator
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot
      terminator: SV40_poly_A

    - promoter: hEF1a
      cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: gene_X
              source: uniprot
      terminator: SV40_poly_A

    - promoter: SV40
      cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: hygromycin_B_phosphotransferase
              source: uniprot
      terminator: SV40_poly_A

  backbone:
    resistance: hygromycin
    ori: SV40
    source: addgene
