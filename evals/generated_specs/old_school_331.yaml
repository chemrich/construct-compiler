construct:
  name: "constitutive_GFP_selector"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
