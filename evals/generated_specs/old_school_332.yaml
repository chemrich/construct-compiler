construct:
  name: "peptide_Y_periplasmic_export"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: peptide_Y
        expression: high
        chain:
          - tag: pelB
          - cleavage_site: Signal_Peptidase
          - gene:
              id: peptide_Y
              source: uniprot

    - terminator: rrnB_T1
