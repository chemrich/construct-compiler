construct:
  name: "pUC_high_copy_cloning_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: custom
  cassette:
    - promoter: tac # lac-based promoter suitable for library induction in E. coli
    - cistron:
        label: placeholder_reporter
        # Note: A placeholder gene is included to satisfy the schema requirement for at least one cistron/gene.
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1