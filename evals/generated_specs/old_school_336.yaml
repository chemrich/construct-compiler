construct:
  name: "retroviral_cmv_goi_puromycin"
  host: mammalian
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: gene_of_interest
        # Defaulting 'gene of interest' to mEGFP as a representative reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA