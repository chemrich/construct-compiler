construct:
  name: luciferase_GFP_dual_expression
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: luxAB
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: tac

    - cistron:
        label: GFP
        expression: high
        gene:
          id: wtGFP
          source: fpbase

    - terminator: rrnB_T1
