construct:
  name: "dual_tac_luciferase_gfp_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: luciferase_reporter
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: tac
    - cistron:
        label: gfp_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015