construct:
  name: CAT_expression_test
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # User-supplied custom promoter sequence should be inserted here by compiler
      ribosome_binding_site: Shine_Dalgarno

    - cistron:
        label: CAT
        expression: high
        gene:
          id: CAT
          source: uniprot

    - terminator: rrnB_T1
      # rho-independent transcription terminator
