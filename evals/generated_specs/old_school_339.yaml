construct:
  name: "MBP_TEV_protein_Z_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: protein_Z
              source: uniprot
    - terminator: rrnB_T1