construct:
  name: "MBP_TEV_ProteinZ_E_coli"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: rrnB_T1
