construct:
  name: "ecoli_MyProteinX_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: MyProteinX
        expression: high
        chain:
          - gene:
              id: MyProteinX
              source: uniprot

    - terminator: rrnB_T1
