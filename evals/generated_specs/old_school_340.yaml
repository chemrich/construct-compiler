construct:
  name: "my_protein_x_expression_plasmid"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # Lac-derived promoter chosen to match user request
    - cistron:
        label: target
        expression: high
        gene:
          id: MyProteinX
    - terminator: rrnB_T1