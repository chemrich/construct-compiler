construct:
  name: "toxic_protein_inducible"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: toxic_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ToxicProtein
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: J23100
      # lacIq repressor gene for tight control
    
    - cistron:
        label: lacIq_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
