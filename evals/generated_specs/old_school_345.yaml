construct:
  name: "GST_StickyProtein_expression"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GST_StickyProtein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: StickyProtein
              source: uniprot

    - terminator: rrnB_T1
