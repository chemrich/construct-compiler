construct:
  name: "StickyProtein_GST_Purification"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: StickyProtein
              source: uniprot
    - terminator: T7term