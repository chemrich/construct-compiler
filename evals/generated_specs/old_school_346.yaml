construct:
  name: "periplasmic_secreted_factor_expression"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: target
        expression: high
        chain:
          - tag: PelB
          - gene:
              id: SecretedFactor
              source: uniprot
    - terminator: rrnB_T1