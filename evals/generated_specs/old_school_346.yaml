construct:
  name: SecretedFactor_periplasm
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: secreted_factor
        expression: high
        chain:
          - signal_peptide: PelB
          - gene:
              id: SecretedFactor
              source: uniprot

    - terminator: rrnB_T1
