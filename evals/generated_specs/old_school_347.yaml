construct:
  name: "enzA_enzB_enzC_operon"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enz_a
        expression: medium
        gene:
          id: EnzA
          source: uniprot
    - spacer: 30
    - cistron:
        label: enz_b
        expression: medium
        fused: false
        gene:
          id: EnzB
          source: uniprot
    - spacer: 30
    - cistron:
        label: enz_c
        expression: medium
        fused: false
        gene:
          id: EnzC
          source: uniprot
    - terminator: rrnB_T1