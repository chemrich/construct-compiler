construct:
  name: "EnzA_EnzB_EnzC_operon"
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzA
        expression: high
        gene:
          id: EnzA
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzB
        expression: high
        fused: false
        gene:
          id: EnzB
          source: uniprot

    - spacer: 25

    - cistron:
        label: EnzC
        expression: high
        fused: false
        gene:
          id: EnzC
          source: uniprot

    - terminator: rrnB_T1
