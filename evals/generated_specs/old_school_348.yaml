construct:
  name: "dual_expression_alpha_beta"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: alpha
        expression: high
        gene:
          id: ProteinAlpha
          source: uniprot
    - terminator: T7term
    - promoter: trp
    - cistron:
        label: beta
        expression: medium
        gene:
          id: ProteinBeta
          source: uniprot
    - terminator: rrnB_T1