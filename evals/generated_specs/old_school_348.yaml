construct:
  name: "ProteinAlpha_ProteinBeta_dual_promoter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: ProteinAlpha
        expression: high
        gene:
          id: ProteinAlpha
          source: uniprot

    - terminator: rrnB_T1

    - promoter: trp

    - cistron:
        label: ProteinBeta
        expression: medium
        gene:
          id: ProteinBeta
          source: uniprot

    - terminator: rrnB_T1
