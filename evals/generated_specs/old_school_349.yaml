construct:
  name: tet_on_key_regulator_system
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G
    - cistron:
        label: inducible_target
        expression: high
        gene:
          id: KeyRegulator
          source: uniprot
    - terminator: SV40_PA
    - spacer: 50
    - promoter: CMV
    - cistron:
        label: tet_activator
        expression: medium
        gene:
          id: rtTA
          source: uniprot
    - terminator: bGH_PA