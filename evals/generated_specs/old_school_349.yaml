construct:
  name: "mammalian_TetOn_KeyRegulator"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC

  cassette:
    - promoter: CMV
    
    - cistron:
        label: rtTA_activator
        expression: high
        gene:
          id: rtTA
          source: uniprot
    
    - terminator: BGH_polyA

    - promoter: TRE
    
    - cistron:
        label: KeyRegulator
        expression: high
        gene:
          id: KeyRegulator
          source: uniprot
    
    - terminator: BGH_polyA
