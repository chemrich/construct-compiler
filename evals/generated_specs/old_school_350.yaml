construct:
  name: "Y2H_Bait_GAL4BD_BaitProtein"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: high
        chain:
          - tag: GAL4_BD
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: BaitProtein
              source: uniprot
    - spacer: 30
    - cistron:
        label: selection_marker
        expression: low
        fused: false
        gene:
          id: TRP1
          source: uniprot
    - terminator: CYC1