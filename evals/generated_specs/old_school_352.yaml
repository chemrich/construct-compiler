construct:
  name: CleanProtein_His_TEV
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: CleanProtein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CleanProtein
              source: uniprot
    
    - terminator: rrnB_T1
