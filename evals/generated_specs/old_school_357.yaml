construct:
  name: DualTagProtein_His_Myc
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: DualTagProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: DualTagProtein
              source: uniprot
          - tag: Myc
    
    - terminator: rrnB_T1
