construct:
  name: InsolubleProtein_MBP_fusion
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: InsolubleProtein_MBP
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: InsolubleProtein
              source: uniprot

    - terminator: rrnB_T1
