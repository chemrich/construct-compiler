construct:
  name: baculovirus_transfer_vector_ViralProtein
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Note: This is an E. coli maintenance backbone for baculovirus transfer vector
    # Homologous recombination flanking regions (HR-L and HR-R) should flank the expression cassette
    
  cassette:
    - hr_region: left
      # Homologous recombination left flanking region for baculovirus genome insertion
      
    - promoter: Polyhedrin
      
    - cistron:
        label: ViralProtein
        expression: high
        gene:
          id: ViralProtein
          source: uniprot
          
    - terminator: SV40_polyA
      
    - hr_region: right
      # Homologous recombination right flanking region for baculovirus genome insertion
