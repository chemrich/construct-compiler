construct:
  name: "viral_protein_baculovirus_transfer_vector"
  host: e_coli  # Maintenance host for the transfer plasmid as per user request
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: polh  # Polyhedrin promoter for high-level expression in insect cells
    - cistron:
        label: target
        gene:
          id: ViralProtein
          source: uniprot
    - terminator: SV40  # Standard terminator for baculovirus transfer vectors