construct:
  name: "tac_operon_geneA_geneB"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: GeneA_cistron
        expression: high
        gene:
          id: GeneA
    - spacer: 30
    - cistron:
        label: GeneB_cistron
        expression: high
        fused: false
        gene:
          id: GeneB
    - terminator: rrnB_T1