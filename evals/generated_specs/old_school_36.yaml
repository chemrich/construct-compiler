```yaml
construct:
  name: "GeneA_GeneB_operon"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 30

    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot

    - terminator: rrnB_T1
```