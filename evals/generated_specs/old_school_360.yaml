construct:
  name: "geneA_his6_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: geneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: geneA
              source: uniprot

    - terminator: rrnB_T1
