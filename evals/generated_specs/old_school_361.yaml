construct:
  name: "proteinX_GST_thrombin"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pGEX-4T-1"

  cassette:
    - promoter: T7lac

    - cistron:
        label: proteinX_GST
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: proteinX
              source: uniprot

    - terminator: rrnB_T1
