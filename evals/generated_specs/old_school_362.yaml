construct:
  name: proteinY_EGFP_CMV_HEK293
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: puromycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: proteinY_EGFP
        expression: high
        chain:
          - kozak: GCCRCCATGG
          - gene:
              id: proteinY
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: EGFP
              source: fpbase

    - terminator: rrnB_T1
