construct:
  name: "subunitA_subunitB_operon"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: subunitA
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: subunitA
              source: uniprot
    - spacer: 30
    - cistron:
        label: subunitB
        expression: high
        fused: false
        gene:
          id: subunitB
          source: uniprot
    - terminator: T7term