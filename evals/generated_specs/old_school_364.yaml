construct:
  name: "dual_subunit_operon_T7"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: subunitA
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: subunitA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: subunitB
        expression: high
        fused: false
        gene:
          id: subunitB
          source: uniprot
    
    - terminator: rrnB_T1
