construct:
  name: "CHO_factorC_dual_selection"
  host: CHO

  backbone:
    catalog_vector: "pCDNA3.1"
    resistance: hygromycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: SV40

    - cistron:
        label: factorC
        expression: high
        chain:
          - gene:
              id: factorC
              source: uniprot
          - tag: V5

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: CMV

    - cistron:
        label: selection_G418
        expression: high
        gene:
          id: neomycin_phosphotransferase
          source: uniprot

    - terminator: SV40_polyA
