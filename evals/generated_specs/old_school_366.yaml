construct:
  name: "peptideD_periplasmic_secretion"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: peptideD
        expression: high
        chain:
          - signal_peptide: PelB
          - gene:
              id: peptideD
              source: uniprot

    - terminator: rrnB_T1
