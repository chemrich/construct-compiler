construct:
  name: "shRNA_geneF_expression_with_puro_selection"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_geneF
        gene:
          id: shRNA_geneF
    - terminator: polyT
    - spacer: 50
    - promoter: CMV
    - cistron:
        label: puromycin_resistance
        expression: medium
        fused: false
        gene:
          id: PuroR
          source: uniprot
    - terminator: bGH_PA