construct:
  name: "proteinG_cell_free_expression"
  host: in_vitro
  backbone:
    resistance: none  # No selection marker needed for cell-free synthesis
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: proteinG_target
        expression: high
        chain:
          - gene:
              id: proteinG
              source: uniprot
          - tag: 6xHis
    - terminator: T7term