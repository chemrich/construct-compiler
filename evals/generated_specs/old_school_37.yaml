construct:
  name: tet_off_regulated_reporter_system
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: SV40
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: tTA_regulator
        expression: medium
        gene:
          id: tTA
          source: uniprot
    - terminator: SV40_polyA
    - promoter: Ptight
    - cistron:
        label: target_reporter
        expression: high
        gene:
          id: ReporterR
    - terminator: bGH_polyA