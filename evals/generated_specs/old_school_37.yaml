construct:
  name: "TetOff_mammalian_reporter"
  host: HEK293

  backbone:
    resistance: kanamycin
    ori: SV40
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: tTA
        expression: high
        gene:
          id: tTA
          source: uniprot

    - terminator: polyA_SV40

    - promoter: Ptight

    - cistron:
        label: ReporterR
        expression: high
        gene:
          id: ReporterR
          source: uniprot

    - terminator: polyA_BGH
