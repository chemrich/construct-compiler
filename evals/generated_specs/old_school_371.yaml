construct:
  name: "proteinI_IRES_proteinJ_mammalian"
  host: HEK293

  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: proteinI
        expression: high
        chain:
          - tag: HA
          - gene:
              id: proteinI
              source: uniprot

    # IRES element for independent translation of second cistron from same mRNA
    - spacer: 27

    - cistron:
        label: proteinJ
        expression: high
        fused: false
        gene:
          id: proteinJ
          source: uniprot

    - terminator: rrnB_T1
