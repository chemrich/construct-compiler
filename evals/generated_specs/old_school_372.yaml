construct:
  name: proteinK_MBP_fusion
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: proteinK_MBP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: proteinK
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: MBP
    
    - terminator: rrnB_T1
