construct:
  name: proteinL_EGFP_localization_yeast
  host: yeast

  backbone:
    resistance: HIS3
    ori: 2micron
    source: addgene

  cassette:
    - promoter: TEF2

    - cistron:
        label: proteinL_EGFP
        expression: high
        chain:
          - gene:
              id: proteinL
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: EGFP

    - terminator: CYC1
