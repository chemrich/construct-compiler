construct:
  name: "trp_sd_comparison_luc_mcherry"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: addgene
  cassette:
    - promoter: trp
    - cistron:
        label: luciferase_strong_sd
        expression: high
        gene:
          id: luciferase
          source: uniprot
    - spacer: 30
    - cistron:
        label: mcherry_weak_sd
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1