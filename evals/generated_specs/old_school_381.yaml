construct:
  name: "pUC_lacZ_alpha_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: alpha_complementation_fusion
        expression: medium
        chain:
          - gene:
              id: lacZ_alpha
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1