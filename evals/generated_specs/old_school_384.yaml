construct:
  name: gamma_delta_operon
  host: e_coli

  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trp

    - cistron:
        label: gamma
        expression: high
        gene:
          id: proteinGamma
          source: uniprot

    - spacer: 25

    - cistron:
        label: delta
        expression: high
        fused: false
        gene:
          id: proteinDelta
          source: uniprot

    - terminator: trp
