construct:
  name: "trp_operon_gamma_delta"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trp
    - cistron:
        label: gamma
        expression: medium
        gene:
          id: Protein_Gamma
          source: uniprot
    - spacer: 30
    - cistron:
        label: delta
        expression: medium
        fused: false
        gene:
          id: Protein_Delta
          source: uniprot
    - terminator: trpA