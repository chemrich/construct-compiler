construct:
  name: MyGene_CAT_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: My_Gene
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CAT
              source: uniprot

    - terminator: T7term
