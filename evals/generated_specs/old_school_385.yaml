construct:
  name: "MyGene_CAT_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: "MyGene"
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: "CAT"
              source: uniprot
    - terminator: T7term