construct:
  name: "Gene_Epsilon_IPTG_control"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: Gene_Epsilon
        expression: high
        gene:
          id: Gene_Epsilon
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: lacUV5

    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
