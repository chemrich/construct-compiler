construct:
  name: "trp_lacZ_reporter"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trp
    - cistron:
        label: beta_galactosidase
        expression: medium
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1