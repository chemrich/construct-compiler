construct:
  name: "peptide_lambda_secretion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: PelB # Signal sequence for N-terminal export/secretion
          - gene:
              id: Peptide_Lambda
    - terminator: rrnB_T1