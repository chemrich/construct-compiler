construct:
  name: "E_coli_secreted_Peptide_Lambda"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: pelB_signal_peptide
          - gene:
              id: Peptide_Lambda
              source: uniprot

    - terminator: rrnB_T1
