construct:
  name: blunt_end_expression_vector
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: cloning_site
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: placeholder_blunt_cloning
              source: custom

    - terminator: rrnB_T1
