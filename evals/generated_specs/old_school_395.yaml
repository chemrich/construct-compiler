construct:
  name: "ecoli_yeast_shuttle_vector_Mu"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: ColE1
    source: custom
    comment: "Dual-host shuttle vector with ColE1 (E. coli) and CEN/ARS (S. cerevisiae) origins; includes AmpR (E. coli) and TRP1 (yeast) selection markers"

  cassette:
    - promoter: GAPDH

    - cistron:
        label: Mu
        expression: high
        gene:
          id: Mu
          source: uniprot
        comment: "S. cerevisiae expression cassette"

    - terminator: CYC1
