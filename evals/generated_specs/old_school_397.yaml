construct:
  name: "dual_cassette_Xi_Omicron"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: Xi
        expression: high
        gene:
          id: Gene_Xi
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: trp
    
    - cistron:
        label: Omicron
        expression: high
        gene:
          id: Gene_Omicron
          source: uniprot
    
    - terminator: rrnB_T1
