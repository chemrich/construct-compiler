construct:
  name: "dual_expression_xi_omicron_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: custom
  cassette:
    - promoter: lacUV5
    - cistron:
        label: gene_xi
        expression: medium
        gene:
          id: Xi
          source: uniprot
    - terminator: rrnB_T1
    - promoter: trp
    - cistron:
        label: gene_omicron
        expression: medium
        gene:
          id: Omicron
          source: uniprot
    - terminator: BBa_B0015