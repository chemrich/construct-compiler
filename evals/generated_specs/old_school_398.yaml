construct:
  name: "lacZ_GFP_reporter_with_lacI_repressor"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: lacUV5
    
    - cistron:
        label: lacI_repressor
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - terminator: rrnB_T1
