construct:
  name: "lac_regulated_gfp_with_trans_lacI"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacI_repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1