construct:
  name: firefly_luciferase_reporter_vero
  host: mammalian

  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: SV40_early

    - cistron:
        label: reporter
        expression: high
        gene:
          id: P08659  # Firefly luciferase
          source: uniprot

    - terminator: BGH_polyA