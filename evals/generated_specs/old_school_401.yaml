construct:
  name: GST_FactorXa_sfGFP_fusion
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1