construct:
  name: "CHO_secreted_protein_CMV"
  host: CHO

  backbone:
    resistance: neomycin
    ori: SV40
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal for mammalian cells
          - gene:
              id: null
              source: uniprot
              # User should specify their gene ID; placeholder for compilation

    - terminator: WPRE  # Woodchuck Posttranscriptional Regulatory Element for mammalian stability
