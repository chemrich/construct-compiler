construct:
  name: secreted_megfp_cho_expression
  host: CHO
  backbone:
    resistance: neomycin
    ori: SV40
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: IgK_leader  # Standard mammalian secretion signal peptide
          - gene:
              id: mEGFP      # Defaulting to mEGFP as placeholder for "my gene"
              source: fpbase
    - terminator: bGH_pA     # Strong mammalian polyadenylation signal suitable for CHO