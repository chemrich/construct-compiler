construct:
  name: "dual_gene_operon_ecoli"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: gene1
        expression: high
        fused: false
        gene:
          id: gene1
    
    - spacer: 35
    
    - cistron:
        label: gene2
        expression: high
        fused: false
        gene:
          id: gene2
    
    - terminator: rrnB_T1
