construct:
  name: "t7_polycistronic_operon"
  host: e_coli_bl21_de3
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: gene_1
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: gene_2
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term