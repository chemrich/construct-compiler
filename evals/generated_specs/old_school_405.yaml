construct:
  name: "lacZ_custom_promoter_validation"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: custom_promoter
    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1