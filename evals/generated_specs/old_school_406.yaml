construct:
  name: "MBP_fusion_pBAD_araBAD"
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: target_protein

    - terminator: rrnB_T1
