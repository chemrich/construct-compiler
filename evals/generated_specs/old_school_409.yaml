construct:
  name: "ompA_protein_export_system"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: OmpA
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - terminator: T7term