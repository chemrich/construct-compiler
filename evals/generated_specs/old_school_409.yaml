construct:
  name: "OmpA_secretion_His_tag"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: OmpA
          - gene:
              id: unspecified
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
