construct:
  name: hGF_secretion_yeast
  host: yeast

  backbone:
    resistance: URA3
    ori: 2micron
    source: addgene
    integration_site: chromosome

  cassette:
    - promoter: PGK

    - cistron:
        label: hGF_secreted
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: HGF
              source: uniprot

    - terminator: CYC1
