construct:
  name: simple_pUC_amp_expression_vector
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: custom
  cassette:
    - promoter: tac  # tac is used as a strong, lac-derived promoter
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1