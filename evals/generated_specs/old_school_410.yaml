construct:
  name: "simple_ecoli_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: target
        expression: high
        gene:
          id: gene_of_interest
          source: uniprot

    - terminator: rrnB_T1
