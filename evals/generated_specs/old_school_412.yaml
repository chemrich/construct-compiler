construct:
  name: "Yeast_ACT1_mEGFP_C_Terminal_Fusion"
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: P60010
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: ADH1_term