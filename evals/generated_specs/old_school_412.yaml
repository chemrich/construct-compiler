construct:
  name: yeast_protein_GFP_fusion
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: your_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
