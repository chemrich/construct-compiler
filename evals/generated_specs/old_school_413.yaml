construct:
  name: "tripartite_operon"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: ColE1
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: gene_A
        expression: high
        gene:
          id: gene_A
          source: uniprot

    - spacer: 30

    - cistron:
        label: gene_B
        expression: high
        fused: false
        gene:
          id: gene_B
          source: uniprot

    - spacer: 30

    - cistron:
        label: gene_C
        expression: high
        fused: false
        gene:
          id: gene_C
          source: uniprot

    - terminator: rrnB_T1
