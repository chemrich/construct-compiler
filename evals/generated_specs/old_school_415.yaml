construct:
  name: "promoter_screening_CAT_reporter"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - mcs:
        name: promoter_cloning_site
        sites:
          - EcoRI
          - BamHI
          - HindIII

    - rbs: BBa_B0030

    - cistron:
        label: CAT_reporter
        expression: high
        gene:
          id: CAT
          source: uniprot

    - terminator: rrnB_T1
