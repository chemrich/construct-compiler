construct:
  name: "yeast_two_hybrid_bait_ADH1_Gal4DBD"
  host: yeast
  backbone:
    resistance: TRP1
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: bait_protein
              source: uniprot
    - terminator: CYC1