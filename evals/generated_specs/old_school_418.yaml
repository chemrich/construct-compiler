construct:
  name: "SBP_tagged_protein_expression"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: trp
    - cistron:
        label: target
        expression: high
        chain:
          - tag: SBP
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1