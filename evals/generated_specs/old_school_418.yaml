construct:
  name: "SBP_tag_protein_expression"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trp

    - rbs: BBa_B0030

    - cistron:
        label: target
        expression: high
        chain:
          - tag: SBP
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
