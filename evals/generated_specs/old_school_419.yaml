construct:
  name: "mammalian_stable_expression_blasticidin"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Override with blasticidin resistance for viral packaging construct
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: target
        expression: high
        gene:
          id: null
          # User to specify their gene ID and source (uniprot, fpbase, or custom sequence reference)

    - terminator: SV40_polyA
