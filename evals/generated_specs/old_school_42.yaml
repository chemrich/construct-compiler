construct:
  name: mammalian_stable_expression_sv40
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: neomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: SV40_early

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_gene
              source: uniprot

    - terminator: SV40_polyA

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        gene:
          id: neomycin_phosphotransferase
          source: uniprot

    - terminator: SV40_polyA
