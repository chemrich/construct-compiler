construct:
  name: "periplasmic_GFP_secretion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: periplasmic_GFP
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: T7term
