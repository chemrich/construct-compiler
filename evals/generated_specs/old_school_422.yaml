construct:
  name: human_factor_yeast_expression
  host: yeast

  backbone:
    resistance: URA3
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: human_factor
        expression: high
        chain:
          - gene:
              id: human_factor
              source: uniprot

    - terminator: CYC1
