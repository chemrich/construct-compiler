construct:
  name: "Protein_X_His6_Purification"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: lac
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_X
    - terminator: rrnB_T1