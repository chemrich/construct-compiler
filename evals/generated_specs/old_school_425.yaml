construct:
  name: yeast_low_copy_lacZ_reporter
  host: yeast
  backbone:
    resistance: TRP1
    ori: CEN_ARS
    source: custom
  cassette:
    - promoter: pNew_Yeast  # Placeholder for the user-provided experimental yeast promoter
    - cistron:
        label: lacZ_reporter
        expression: medium
        gene:
          id: lacZ
          source: uniprot
    - terminator: ADH1_term