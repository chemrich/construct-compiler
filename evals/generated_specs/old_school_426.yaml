construct:
  name: bicistronic_ompA_proteinA_proteinB
  host: e_coli_bl21
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: proteinA
        expression: high
        chain:
          - signal_peptide: ompA
          - gene:
              id: proteinA
              source: uniprot
    
    - spacer: 20
    
    - cistron:
        label: proteinB
        expression: high
        fused: false
        gene:
          id: proteinB
          source: uniprot
    
    - terminator: rrnB_T1
