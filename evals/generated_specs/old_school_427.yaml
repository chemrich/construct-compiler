construct:
  name: "mammalian_sv40_luciferase_dhfr"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40_early
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: luciferase
          source: uniprot
    - spacer: 30
    - cistron:
        label: selection
        expression: medium
        fused: false
        gene:
          id: DHFR
          source: uniprot
    - terminator: SV40_polyA