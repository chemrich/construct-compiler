construct:
  name: "SV40_Luciferase_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: SV40_early

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: Luciferase
          source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: selection_marker
        expression: medium
        gene:
          id: DHFR
          source: uniprot

    - terminator: SV40_polyA
