construct:
  name: "protein_complex_gst_fusion"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: protein_a
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: protein_a
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: protein_b
          source: uniprot
    
    - terminator: T7term
