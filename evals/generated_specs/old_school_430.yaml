construct:
  name: "CMV_RFP_IRES_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: RFP
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    # IRES element for independent translation of second cistron
    - spacer: 27  # IRES sequence (minimal representation)

    - cistron:
        label: GFP
        expression: high
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
