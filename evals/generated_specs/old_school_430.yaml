construct:
  name: "mammalian_IRES_mCherry_mEGFP"
  host: HEK293
  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: RFP
        gene:
          id: mCherry
          source: fpbase
    - spacer: 585 # Standard length for EMCV IRES sequence
    - cistron:
        label: GFP
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_pA