construct:
  name: "GST_TEV_ProteinY_E_coli"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: GST_ProteinY
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: ProteinY
              source: uniprot
    
    - terminator: rrnB_T1
