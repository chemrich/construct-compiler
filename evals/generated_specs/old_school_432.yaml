construct:
  name: "yeast_protein_beta_his3_integration"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: protein_beta
        expression: high
        gene:
          id: protein_beta
          source: uniprot

    - terminator: CYC1

    - promoter: PGK1

    - cistron:
        label: his3_marker
        expression: high
        gene:
          id: HIS3
          source: uniprot

    - terminator: CYC1
