construct:
  name: "yeast_his3_integration_protein_beta"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: PGK1
    - cistron:
        label: protein_beta_target
        gene:
          id: Protein_Beta
          source: uniprot
    - terminator: CYC1
    - spacer: 50
    - cistron:
        label: his3_selection_marker
        fused: false
        gene:
          id: HIS3
          source: uniprot
    - terminator: ADH1