construct:
  name: "TetOn_GFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: tTA
        expression: high
        gene:
          id: tTA
          source: uniprot

    - terminator: SV40_polyA

    - promoter: TetO

    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: SV40_polyA
