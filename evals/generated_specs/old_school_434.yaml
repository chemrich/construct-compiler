construct:
  name: luxAB_novel_promoter_test
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Substitution: J23100 used as a representative high-strength E. coli promoter to test the reporter system.
    - cistron:
        label: luxA
        expression: high
        gene:
          id: P07739
          source: uniprot
    - spacer: 30
    - cistron:
        label: luxB
        expression: high
        fused: false
        gene:
          id: P07740
          source: uniprot
    - terminator: rrnB_T1