construct:
  name: "yeast_dual_enzyme_independent_expression"
  host: yeast
  backbone:
    resistance: TRP1
    ori: 2micron
    source: addgene
  cassette:
    - promoter: PGK1
    - cistron:
        label: enzyme_a
        expression: medium
        gene:
          id: Enzyme_A
          source: uniprot
    - terminator: CYC1_term
    - promoter: GAL1
    - cistron:
        label: enzyme_b
        expression: high
        gene:
          id: Enzyme_B
          source: uniprot
    - terminator: ADH1_term