construct:
  name: dual_enzyme_yeast_expression
  host: yeast

  backbone:
    resistance: TRP1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: Enzyme_A
        expression: high
        gene:
          id: Enzyme_A
          source: uniprot

    - terminator: CYC1

    - promoter: GAL1

    - cistron:
        label: Enzyme_B
        expression: high
        gene:
          id: Enzyme_B
          source: uniprot

    - terminator: GAL10
