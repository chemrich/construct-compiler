construct:
  name: "hormone_p_secretion_construct"
  host: HEK293
  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: hormone_p_production
        expression: high
        chain:
          - tag: IgK
          - gene:
              id: hormone_p
              source: uniprot
    - terminator: SV40