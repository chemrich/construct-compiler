construct:
  name: "e_coli_chromosomal_GFP_lac"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: null  # No plasmid origin; chromosomal integration only
    source: custom
  
  cassette:
    - homology_arm:
        label: upstream
        length: 1000
        target_locus: "lacZ"  # Common integration site in E. coli chromosome
    
    - promoter: lacUV5
    
    - cistron:
        label: gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - cassette:
        - promoter: constitutive  # For kanamycin resistance
        - cistron:
            label: kanR
            expression: high
            gene:
              id: neo
              source: uniprot
        - terminator: rrnB_T1
    
    - homology_arm:
        label: downstream
        length: 1000
        target_locus: "lacZ"
