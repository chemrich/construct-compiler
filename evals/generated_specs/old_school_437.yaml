construct:
  name: "e_coli_chromosomal_lac_GFP_integration"
  host: e_coli
  backbone:
    # Recombination arms for chromosomal integration are typically flanking the cassette;
    # specific arms are handled by the assembly tool based on the target locus.
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lac
    - cistron:
        label: target
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1