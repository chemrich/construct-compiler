construct:
  name: yeast_shuttle_vector_GFP
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    yeast_ori: 2_micron
    yeast_marker: LEU2

  cassette:
    - promoter: ADH1

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1
