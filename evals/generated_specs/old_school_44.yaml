construct:
  name: "tetracycline_inducible_therapeutic_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
      cistron:
        label: TetR
        expression: medium
        gene:
          id: TetR
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: TetO  # Tetracycline-responsive promoter
      cistron:
        label: therapeutic
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: null  # User to specify therapeutic gene
              source: uniprot

    - terminator: rrnB_T1
