          id: P04483
          source: uniprot

    - terminator: rrnB_T1

    - promoter: TetO  # Tet-responsive promoter

    - cistron:
        label: therapeutic_target
        expression: high
        chain:
          - secretion_signal: native  # Add appropriate secretion signal for therapeutic
          - gene:
              id: P01308  # Human insulin as example therapeutic
              source: uniprot

    - terminator: rrnB_T1
