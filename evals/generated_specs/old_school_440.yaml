construct:
  name: "T7_phi10_GFP_expression_vector"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7  # phi-10 variant of T7 promoter
    
    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
