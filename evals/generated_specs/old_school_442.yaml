construct:
  name: mammalian_secreted_protein
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - signal_peptide: IgG_leader
          - gene:
              id: target_protein
              source: uniprot

    - terminator: SV40_polyA
