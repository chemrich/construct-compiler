construct:
  name: GST_target_pET_system
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: target
              source: uniprot

    - terminator: rrnB_T1
