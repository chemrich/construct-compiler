construct:
  name: "His6_TEV_gene_pUC_ampR"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_gene
              source: uniprot

    - terminator: rrnB_T1
