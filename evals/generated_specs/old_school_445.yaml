construct:
  name: "T7_His6_TEV_sfGFP_expression_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: custom
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term