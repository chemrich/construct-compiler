construct:
  name: "dual_enzyme_tac_polycistronic"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: enzyme_a
        gene:
          id: enzyme_a
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        fused: false
        gene:
          id: enzyme_b
          source: uniprot
    - terminator: rrnB_T1