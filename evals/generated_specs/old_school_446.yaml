construct:
  name: "dual_enzyme_expression_A_B"
  host: e_coli

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: enzyme_A
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        gene:
          id: enzyme_B
          source: uniprot

    - terminator: rrnB_T1
