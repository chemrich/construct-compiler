construct:
  name: mammalian_dual_gene_IRES
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: gene_A
        expression: high
        gene:
          id: null
          source: custom
        # User must specify actual gene A sequence or ID

    # IRES element for cap-independent translation of downstream gene
    - spacer: 50  # IRES is typically ~300-600 bp; represented here as spacer marker

    - cistron:
        label: gene_B
        expression: high
        fused: false
        gene:
          id: null
          source: custom
        # User must specify actual gene B sequence or ID
        # This cistron represents the post-IRES translated protein

    - terminator: rrnB_T1
