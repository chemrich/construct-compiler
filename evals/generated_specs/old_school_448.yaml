construct:
  name: yeast_surface_display_aga2p
  host: yeast

  backbone:
    resistance: TRP1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AGA2
              source: uniprot

    - spacer: 20

    - cistron:
        label: target
        expression: high
        fused: false
        gene:
          id: your_protein
          source: uniprot

    - terminator: CYC1
