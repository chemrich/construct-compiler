construct:
  name: "tet_inducible_system"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Ptet

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_gene
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: lacUV5

    - cistron:
        label: repressor
        expression: medium
        gene:
          id: TetR
          source: uniprot

    - terminator: rrnB_T1
