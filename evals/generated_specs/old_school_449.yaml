construct:
  name: "tet_inducible_expression_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: tetR_repressor
        gene:
          id: P04483
          source: uniprot
    - spacer: 50
    - promoter: tetA
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1