construct:
  name: "yeast_promoter_test_lacZ"
  host: yeast

  backbone:
    resistance: LEU2
    ori: 2_micron
    source: custom

  cassette:
    - promoter: GAL1  # Standard S. cerevisiae promoter for testing

    - cistron:
        label: beta_galactosidase
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: CYC1_terminator
