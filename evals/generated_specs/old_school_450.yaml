construct:
  name: "tet_on_dual_expression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin # E. coli selection; mammalian selection via NeoR is standard on this backbone
  cassette:
    - promoter: CMV # P_CMV-TetO placeholder; CMV used as schema-valid base
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: rtTA_transactivator
        expression: medium
        fused: false # Independently translated to provide transactivator
        gene:
          id: rtTA3
          source: uniprot
    - terminator: rrnB_T1 # Standard schema-valid terminator used as placeholder for mammalian pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21