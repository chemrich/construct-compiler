construct:
  name: "Tet_On_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - terminator: SV40poly

    - promoter: CMV_TetO

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40poly
