construct:
  name: "protein_mCherry_visualization"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: your_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
