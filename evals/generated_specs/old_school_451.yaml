construct:
  name: "protein_mcherry_c_terminal_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1