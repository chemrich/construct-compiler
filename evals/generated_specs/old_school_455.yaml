construct:
  name: "yeast_bait_gal4_dbd_fusion"
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: target_protein
              source: uniprot
    - terminator: ADH1_term