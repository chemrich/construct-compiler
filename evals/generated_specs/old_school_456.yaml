construct:
  name: "pUC_amp_cloning_vector"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: custom
  cassette:
    - promoter: lac # Standard promoter for cloning vectors like pUC19
    - cistron:
        label: cloning_site
        gene:
          id: lacZ_alpha
          source: uniprot # Added as a placeholder for the MCS/alpha-complementation fragment as the schema requires a gene
    - terminator: rrnB_T1