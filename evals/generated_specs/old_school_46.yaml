construct:
  name: "FLAG_tagged_protein_tac_promoter"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: unknown_protein
              source: uniprot

    - terminator: rrnB_T1
