construct:
  name: "FLAG_tagged_protein_tac_inducible"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: # Missing protein ID - please specify the target protein
              source: uniprot
    
    - terminator: rrnB_T1