construct:
  name: "pUC_beta_gal_promoter_test"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5  # Chosen as a standard promoter for testing LacZ expression in E. coli
    - cistron:
        label: beta_galactosidase
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1