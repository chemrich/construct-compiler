construct:
  name: HeLa_CMV_mEGFP
  host: HeLa

  backbone:
    catalog_vector: "pNeo"
    resistance: neomycin
    ori: SV40
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: eGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: SV40
