construct:
  name: "HeLa_constitutive_mEGFP"
  host: HeLa
  backbone:
    resistance: neomycin  # G418 selection requires neomycin phosphotransferase (neoR)
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA  # Standard SV40 polyadenylation signal for mammalian termination