construct:
  name: "GST_ProteinX_T7lac_Cm"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GST_ProteinX
        expression: high
        chain:
          - tag: N-terminal_GST
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinX
              source: uniprot

    - terminator: rrnB_T1
