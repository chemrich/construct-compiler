construct:
  name: "CHO_polycistronic_GeneA_IRES_GeneB"
  host: CHO
  backbone:
    resistance: puromycin
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GeneA
    - spacer: 580  # Approximate length of a standard IRES element for polycistronic expression
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: GeneB
    - terminator: bGH_polyA