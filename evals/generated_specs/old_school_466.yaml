construct:
  name: "CHO_dual_expression_Gene_A_Gene_B_IRES"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: ColA
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: Gene_A
        expression: high
        gene:
          id: Gene_A
          source: uniprot

    # IRES (Internal Ribosome Entry Site) for cap-independent translation of second gene
    - spacer: 600  # IRES sequences are typically 400-700 bp; using standard ENCV IRES length

    - cistron:
        label: Gene_B
        expression: high
        fused: false
        gene:
          id: Gene_B
          source: uniprot

    - terminator: rrnB_T1
