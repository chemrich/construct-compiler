construct:
  name: "triple_enzyme_pathway_E1_E2_E3"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: E1
        expression: high
        gene:
          id: E1
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: E2
        expression: high
        fused: false
        gene:
          id: E2
          source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: E3
        expression: high
        fused: false
        gene:
          id: E3
          source: uniprot
    
    - terminator: rrnB_T1
