construct:
  name: lentiviral_CMV_target_PGK_puro
  host: mammalian

  backbone:
    catalog_vector: "pLenti4"
    # Note: LTRs and packaging signals (Psi, RRE, cPPT) are inherent to lentiviral backbones
    # and handled by the construct_compiler for pLenti4

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: GFP
              source: fpbase

    - terminator: rrnB_T1

    - promoter: PGK

    - cistron:
        label: selection
        expression: high
        fused: false
        gene:
          id: puromycin_N_acetyltransferase
          source: uniprot

    - terminator: rrnB_T1
