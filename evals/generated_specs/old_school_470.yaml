construct:
  name: "therapeutic_peptide_gst_fusion"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: therapeutic_peptide
    - terminator: rrnB_T1