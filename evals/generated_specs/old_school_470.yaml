construct:
  name: "therapeutic_peptide_GST"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: rrnB_T1
