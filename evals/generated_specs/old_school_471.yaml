construct:
  name: transcription_factor_aequorea_indicator
  host: yeast

  backbone:
    resistance: trp1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: native  # Native promoter of transcription factor gene

    - cistron:
        label: transcription_factor_aequorea
        expression: high
        chain:
          - gene:
              id: transcription_factor
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: aequorea_indicator
              source: fpbase

    - terminator: rrnB_T1
