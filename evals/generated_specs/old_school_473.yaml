construct:
  name: "workhorse_expression_plasmid"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MCS
              sequence: "GAATTCGCTAGCGGTACCGAGCTCGGATCCTCTAGAGTCGACCTGCAGGCATGCAAGCTT"

    - terminator: rrnB_T1
