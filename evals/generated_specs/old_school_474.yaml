construct:
  name: yeast_two_hybrid_bait_Protein_A
  host: yeast
  backbone:
    resistance: LEU2
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait
        expression: medium
        chain:
          - tag: GAL4_DBD
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Protein_A
              source: uniprot
    - terminator: ADH1_term