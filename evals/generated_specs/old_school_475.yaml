construct:
  name: retroviral_vector_gene_X
  host: HEK293

  backbone:
    catalog_vector: pMSCV
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: LTR

    - cistron:
        label: packing_signal
        expression: low
        gene:
          id: psi_sequence
          source: uniprot

    - spacer: 30

    - cistron:
        label: gene_X
        expression: high
        fused: false
        gene:
          id: gene_X
          source: uniprot

    - terminator: LTR
