construct:
  name: "weak_constitutive_toxin_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: SC101
    source: addgene
  cassette:
    - promoter: J23114  # Substituting weak constitutive J23114 for PL, as PL is typically a strong promoter.
    - cistron:
        label: toxin
        expression: very_low
        gene:
          id: P0A730
          source: uniprot
    - terminator: rrnB_T1