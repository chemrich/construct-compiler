construct:
  name: "low_level_killer_protein"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: SC101
    source: addgene

  cassette:
    - promoter: lacUV5  # weak constitutive promoter (P_L not directly available; lacUV5 provides very low basal expression)

    - cistron:
        label: killer_protein
        expression: very_low
        gene:
          id: ccdB
          source: uniprot

    - terminator: rrnB_T1
