construct:
  name: kinase_overexpression_yeast_HA
  host: yeast

  backbone:
    resistance: URA3
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1
      # Using GAL1 as a strong yeast promoter for overexpression; user's native regulatory regions would require custom specification

    - cistron:
        label: kinase
        expression: high
        chain:
          - gene:
              id: kinase_gene
              source: uniprot
          - tag: HA

    - terminator: CYC1
