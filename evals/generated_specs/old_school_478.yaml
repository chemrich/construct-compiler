construct:
  name: "tet_on_protein_y_expression_system"
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: tet_activator
        expression: medium
        gene:
          id: rtTA3
          source: uniprot
    - terminator: bGH_pA
    - spacer: 50
    - promoter: TRE3G
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: ProteinY
          source: uniprot
    - terminator: SV40_pA