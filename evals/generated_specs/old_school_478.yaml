construct:
  name: "mammalian_tet_on_protein_y"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV
      cistron:
        label: tet_activator
        expression: high
        gene:
          id: tTA
          source: uniprot
      terminator: WPRE

    - promoter: tetO
      # Comment: tetO is the tetracycline-responsive promoter element
      # In Tet-On systems, tTA protein binds tetO in presence of tetracycline/doxycycline
      cistron:
        label: protein_y
        expression: high
        gene:
          id: protein_y
          source: uniprot
      terminator: WPRE
