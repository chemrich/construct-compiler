construct:
  name: "MBP_TEV_fusion_construct"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: tricky_protein_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: P0A887  # Placeholder UniProt ID; replace with the specific target protein ID
              source: uniprot
    - terminator: T7term