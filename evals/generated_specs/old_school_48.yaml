construct:
  name: "n_terminal_domain_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: trc # Constitutive/hybrid promoter as requested
    - cistron:
        label: n_term_fragment
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: p53 # Placeholder for the requested N-terminal domain
              source: uniprot
    - terminator: rrnB_T1