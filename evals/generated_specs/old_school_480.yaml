construct:
  name: "high_expression_wonder_protein"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: wonder_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: wonder_protein
              source: uniprot

    - terminator: rrnB_T1
