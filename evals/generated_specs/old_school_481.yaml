construct:
  name: "toxic_protein_iptg_inducible_gst_tev"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: target
        expression: high
        chain:
          - tag: GST
          - cleavage_site: TEV
          - gene:
              id: toxic_protein
              source: uniprot

    - terminator: rrnB_T1
