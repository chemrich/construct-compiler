construct:
  name: "nuclear_flag_tagged_expression_system"
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: nuclear_target
        expression: high
        chain:
          - tag: NLS
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bgh_pA