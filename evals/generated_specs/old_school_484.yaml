construct:
  name: "Gene_A_Gene_B_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Gene_A
        expression: high
        chain:
          - gene:
              id: Gene_A
              source: uniprot
          - tag: 6xHis
    
    - spacer: 30
    
    - cistron:
        label: Gene_B
        expression: high
        fused: false
        gene:
          id: Gene_B
          source: uniprot
    
    - terminator: rrnB_T1
