construct:
  name: "mammalian_Target_Gene_X_Myc"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: Target_Gene_X
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Myc

    - terminator: rrnB_T1
