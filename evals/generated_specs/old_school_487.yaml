construct:
  name: "mammalian_EF1a_Target_Gene_X_Myc"
  host: mammalian
  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: Target_Gene_X
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc
    - terminator: SV40_pA