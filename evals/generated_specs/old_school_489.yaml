construct:
  name: dual_fluorescent_CMV_IRES
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    # IRES element for independent translation of second cistron
    - spacer: 600  # IRES-like spacer; represents IRES regulatory element

    - cistron:
        label: EGFP
        expression: high
        fused: false
        chain:
          - gene:
              id: EGFP
              source: fpbase

    - terminator: rrnB_T1
