construct:
  name: "mCherry_IRES_EGFP_mammalian_expression"
  host: HEK293
  backbone:
    resistance: blasticidin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_reporter
        gene:
          id: mCherry
          source: fpbase
    - spacer: 580 # Representative length for an IRES element
    - cistron:
        label: EGFP_reporter
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: bGH_pA