construct:
  name: "dual_sv40_gfp_rfp_hygro"
  host: HEK293
  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40
    - cistron:
        label: gfp_reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 40
    - promoter: SV40
    - cistron:
        label: rfp_reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA