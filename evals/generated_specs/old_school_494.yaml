construct:
  name: "STREP_SUMO_target_FLAG"
  host: e_coli
  
  backbone:
    resistance: spectinomycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T5
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: SUMO
          - gene:
              id: target
              source: uniprot
          - tag: FLAG
    
    - terminator: rrnB_T1
