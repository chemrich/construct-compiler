construct:
  name: "strep_sumo_target_flag"
  host: e_coli
  backbone:
    resistance: spectinomycin
    ori: pBR322
  cassette:
    - promoter: T5
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: SUMO
          - gene:
              id: sfGFP
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1