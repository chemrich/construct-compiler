construct:
  name: "alpha_beta_dual_promoter"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: alpha
        expression: high
        gene:
          id: alpha
          source: uniprot

    - terminator: rrnB_T1

    - promoter: trc  # Trp-based promoter; trc is a hybrid Trp/lac

    - cistron:
        label: beta
        expression: high
        chain:
          - gene:
              id: beta
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
