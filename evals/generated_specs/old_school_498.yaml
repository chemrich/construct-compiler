construct:
  name: "shRNA_knockdown_GFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_target
        expression: high
        gene:
          id: shRNA_target
          source: uniprot

    - terminator: U6_terminator

    - promoter: CAG
    - cistron:
        label: GFP_tracker
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: WPRE
