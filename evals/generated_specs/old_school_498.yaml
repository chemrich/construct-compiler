construct:
  name: "shRNA_knockdown_GFP_reporter"
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: U6
    - cistron:
        label: knockdown_shRNA
        gene:
          id: shRNA_target
    - promoter: CAG
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_PA