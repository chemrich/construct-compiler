construct:
  name: "high_expression_protein_Z_yeast"
  host: yeast

  backbone:
    resistance: trp1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL10

    - cistron:
        label: protein_Z
        expression: high
        chain:
          - gene:
              id: Z
              source: uniprot
          - tag: TAP

    - terminator: CYC1
