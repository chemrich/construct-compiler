construct:
  name: "chaperone_gst_thrombin_expression"
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: chaperone
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: GroEL
              source: uniprot
    - terminator: rrnB_T1