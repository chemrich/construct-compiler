construct:
  name: "chaperone_protein_gst_expression"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: chaperone
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: chaperone_protein
              source: uniprot
    
    - terminator: rrnB_T1
