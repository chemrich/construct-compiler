construct:
  name: "y2h_bait_gal4_fusion_trp1"
  host: yeast
  backbone:
    # pGBKT7 is a standard yeast two-hybrid bait vector containing the TRP1 marker and GAL4-DBD
    catalog_vector: "pGBKT7"
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P04637
              source: uniprot
    - terminator: ADH1_term