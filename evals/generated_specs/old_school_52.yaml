construct:
  name: periplasmic_pBAD_expression_construct
  host: e_coli
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: periplasmic_target
        expression: medium
        chain:
          - tag: pelB
          - gene:
              id: target_protein
              source: uniprot
    - terminator: rrnB_T1