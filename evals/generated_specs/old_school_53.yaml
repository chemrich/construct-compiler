construct:
  name: "CHO_therapeutic_puromycin_selection"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: SC101
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - gene:
              id: null
              source: uniprot
        poly_a: SV40

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: puromycin_resistance
        expression: high
        chain:
          - gene:
              id: pac
              source: uniprot
        poly_a: SV40

    - terminator: rrnB_T1
