construct:
  name: "HEK293_secreted_diagnostic_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: zeocin
    ori: pUC

  cassette:
    - promoter: CAG

    - cistron:
        label: diagnostic_protein
        expression: high
        chain:
          - signal_peptide: IgG_signal  # N-terminal secretion signal from immunoglobulin
          - gene:
              id: diagnostic_protein
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: SV40_poly_A
