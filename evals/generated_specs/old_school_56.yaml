construct:
  name: "mammalian_enzyme_gfp_IRES"
  host: HEK293

  backbone:
    resistance: puromycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot

    - spacer: 25
      # IRES (Internal Ribosome Entry Site) inserted here for cap-independent translation of second cistron

    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
