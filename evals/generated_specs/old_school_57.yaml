construct:
  name: "toxic_protein_tight_control_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
          - tag: Strep-II
    - terminator: rrnB_T1