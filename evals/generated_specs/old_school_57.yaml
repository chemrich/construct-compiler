construct:
  name: "tight_trp_lac_control_protein"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # trc is a hybrid trp-lac promoter providing tight IPTG-inducible control
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1

    - spacer: 30

    - cistron:
        label: repressor
        expression: medium
        fused: false
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
