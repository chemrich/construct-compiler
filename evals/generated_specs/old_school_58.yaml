construct:
  name: "GFP_target_visualization_yeast"
  host: yeast

  backbone:
    resistance: LEU2
    ori: CEN6_ARSH4
    source: addgene

  cassette:
    - promoter: TEF2

    - cistron:
        label: GFP_fusion
        expression: high
        chain:
          - gene:
              id: GFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target
              source: uniprot

    - terminator: CYC1
