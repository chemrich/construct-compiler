construct:
  name: shRNA_knockdown_GFP_reporter
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: BBa_B0015

    - promoter: U6

    - cistron:
        label: shRNA
        expression: high
        gene:
          id: shRNA_cassette
          source: custom
        # Note: shRNA sequence should be designed targeting the specific endogenous gene of interest
        # and inserted as a synthetic construct with proper stem-loop structure

    - terminator: BBa_B0015
