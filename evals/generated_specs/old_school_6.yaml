```yaml
construct:
  name: Y2H_bait_domain_of_interest
  host: yeast

  backbone:
    resistance: TRP1
    ori: CEN_ARS
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: LexA_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: domain_of_interest
              source: custom  # user will provide sequence

    - terminator: ADH1
```