construct:
  name: "yeast_y2h_bait_lexa_fusion"
  host: yeast
  backbone:
    resistance: trp1
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: LexA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: domain_of_interest
    - terminator: CYC1_term