construct:
  name: mammalian_CMV_FLAG_neomycin
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: null
              source: uniprot
        polya: SV40

    - promoter: SV40

    - cistron:
        label: selection
        expression: medium
        gene:
          id: neomycin_phosphotransferase
          source: uniprot
        polya: SV40

    - terminator: SV40
