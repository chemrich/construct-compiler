construct:
  name: "dual_protein_A_B_tac_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: protein_A
        expression: high
        gene:
          id: protein_A
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: protein_B
        expression: high
        fused: false
        gene:
          id: protein_B
          source: uniprot
    
    - terminator: rrnB_T1
