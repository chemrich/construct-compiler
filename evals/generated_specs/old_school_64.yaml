construct:
  name: "tac_bicistronic_expression_A_B"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: protein_a
          source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: protein_b
          source: uniprot
    - terminator: rrnB_T1