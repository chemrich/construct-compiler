construct:
  name: "tet_inducible_expression"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
      # lacUV5 for constitutive tetR expression
    
    - cistron:
        label: tetR_repressor
        expression: high
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: tetO
      # tet operator-based promoter; active when tetracycline is present
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: target_gene
              source: uniprot
    
    - terminator: rrnB_T1
