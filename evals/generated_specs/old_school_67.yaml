construct:
  name: "gst_fusion_protein_expression"
  host: e_coli_bl21
  backbone:
    resistance: ampicillin
    ori: pBR322
  cassette:
    - promoter: T7lac
      cistron:
        label: gst_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: target_protein
      terminator: T7term