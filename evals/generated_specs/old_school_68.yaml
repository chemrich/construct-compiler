construct:
  name: "yeast_two_hybrid_GAL4DBD_fusion"
  host: yeast

  backbone:
    resistance: TRP1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: GAL4DBD_fusion
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: USER_PROTEIN
              source: uniprot

    - terminator: ADH1_terminator
