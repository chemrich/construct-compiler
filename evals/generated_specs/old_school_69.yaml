construct:
  name: "high_copy_gfp_marker"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: gfp
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
