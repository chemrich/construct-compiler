construct:
  name: "mammalian_CAG_bicistronic_IRES_luciferase"
  host: HEK293
  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CAG
    - cistron:
        label: target
        expression: high
        gene:
          id: target_gene
    - spacer: 580 # IRES sequence for independent translation of the downstream cistron
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: luciferase
          source: uniprot
    - terminator: bGH_polyA