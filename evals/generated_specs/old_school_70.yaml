construct:
  name: "constitutive_gene_IRES_luciferase"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin

  cassette:
    - promoter: CAG

    - cistron:
        label: target_gene
        expression: high
        chain:
          - gene:
              id: unknown
              source: uniprot

    - spacer: 30

    - cistron:
        label: IRES_luciferase
        expression: high
        fused: false
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot

    - terminator: SV40poly
