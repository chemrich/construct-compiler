construct:
  name: "MBP_fusion_solubility_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: your_gene
              source: uniprot

    - terminator: rrnB_T1
