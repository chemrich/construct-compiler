        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1

    - promoter: LEU2_promoter
    - cistron:
        label: selection_marker
        gene:
          id: P06633
          source: uniprot
    - terminator: ADH1