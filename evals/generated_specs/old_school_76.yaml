construct:
  name: "mammalian_A_P2A_B_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - cistron:
        label: P2A_linker
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
