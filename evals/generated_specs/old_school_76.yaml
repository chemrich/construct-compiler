construct:
  name: "mammalian_stoichiometric_A_B_P2A"
  host: HEK293
  backbone:
    resistance: blasticidin
    ori: pUC
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: stoichiometric_expression
        expression: high
        chain:
          - gene:
              id: "Protein_A"
              source: uniprot
          - linker:
              type: P2A
              repeats: 1
          - gene:
              id: "Protein_B"
              source: uniprot
    - terminator: bGH_polyA