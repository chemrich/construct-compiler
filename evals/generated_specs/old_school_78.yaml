construct:
  name: "dual_constitutive_reporter_system"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: GFP_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: J23106
    - cistron:
        label: RFP_reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015