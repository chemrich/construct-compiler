construct:
  name: "dual_reporter_GFP_RFP"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: J23106

    - cistron:
        label: RFP
        expression: medium
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
