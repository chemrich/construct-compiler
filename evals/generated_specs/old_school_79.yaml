construct:
  name: Tet_On_HEK293_mEGFP_system
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA
    - spacer: 50
    - promoter: CMV
    - cistron:
        label: transactivator
        expression: medium
        gene:
          id: rtTA
          source: uniprot
    - terminator: SV40_polyA