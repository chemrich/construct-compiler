construct:
  name: bicistronic_regulatory_GFP
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: regulatory_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: REGULATORY_PROTEIN
              source: uniprot

    # IRES element represented as spacer with comment
    - spacer: 600  # IRES (Internal Ribosome Entry Site) for cap-independent translation

    - cistron:
        label: GFP
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: SV40_polyA
