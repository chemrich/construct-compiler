construct:
  name: "mammalian_bicistronic_EF1a_IRES_GFP"
  host: HEK293
  backbone:
    resistance: neomycin  # Conferring G418 selection
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: "regulatory_protein"
        expression: high
        gene:
          id: "P53_HUMAN"
          source: uniprot
    - spacer: 585  # EMCV IRES sequence for bicistronic translation
    - cistron:
        label: "reporter"
        expression: medium
        fused: false  # Independently translated via IRES
        gene:
          id: "mEGFP"
          source: fpbase
    - terminator: SV40_polyA