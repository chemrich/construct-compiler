```yaml
construct:
  name: "EF1a_regulatory_protein_IRES_GFP_G418"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin  # G418 resistance in mammalian cells, kanamycin for bacterial propagation

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: regulatory_protein
        expression: high
        gene:
          id: your_regulatory_protein  # Replace with actual protein ID
          source: uniprot

    - spacer: 500  # IRES sequence - larger spacer to accommodate IRES functionality

    - cistron:
        label: reporter
        expression: medium
        fused: false  # Independent translation via IRES
        gene:
          id: EGFP
          source: fpbase

    - terminator: SV40_polyA
```