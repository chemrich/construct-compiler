construct:
  name: "His_tagged_GFP_expression"
  host: e_coli
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    
    - terminator: rrnB_T1
