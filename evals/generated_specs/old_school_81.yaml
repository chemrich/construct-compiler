construct:
  name: "pUC19_lacZ_regulatory_test"
  host: e_coli

  backbone:
    catalog_vector: "pUC19"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: lacZ
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
