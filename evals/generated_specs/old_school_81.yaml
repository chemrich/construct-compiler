construct:
  name: "pUC19_lacZ_expression_test"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac # Default T7lac used as a placeholder for the custom upstream regulatory sequence
    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1