construct:
  name: "dual_t7_activator_reporter_construct"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: activator_protein_a
        expression: high
        gene:
          id: araC
          source: uniprot
    - terminator: T7term
    - spacer: 30
    - promoter: T7lac
    - cistron:
        label: reporter_protein_b
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term