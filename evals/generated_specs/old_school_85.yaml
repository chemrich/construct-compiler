construct:
  name: "tac_GST_FactorXa_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
    - cistron:
        label: gst_target_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: target_protein
              source: uniprot
    - terminator: T7term