construct:
  name: "GST_fusion_with_FactorXa_cleavage"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: target_GST_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Factor_Xa
          - gene:
              id: target
              source: uniprot
    
    - terminator: T7term
