construct:
  name: "mammalian_bicistronic_IRES_GeneX_GeneY"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: SV40_early

    - cistron:
        label: Gene_X
        expression: high
        gene:
          id: Gene_X
          source: uniprot

    # EMCV IRES element for cap-independent translation of downstream gene
    - spacer: 586  # EMCV IRES is ~586 bp

    - cistron:
        label: Gene_Y
        expression: high
        fused: false
        gene:
          id: Gene_Y
          source: uniprot

    - terminator: SV40_polyA
