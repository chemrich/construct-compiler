construct:
  name: "ampicillin_resistance_cassette"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: bla_promoter  # Native promoter for the beta-lactamase gene
    - cistron:
        label: bla
        expression: medium
        gene:
          id: P62593
          source: uniprot
    - terminator: rrnB_T1  # Classic Rho-independent terminator