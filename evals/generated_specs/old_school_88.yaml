construct:
  name: "S_cerevisiae_Aga2p_Surface_Display"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: ADH1
    - cistron:
        label: display_fusion
        expression: medium
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_peptide
    - terminator: ADH1_term