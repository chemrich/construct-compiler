construct:
  name: "yeast_surface_display_aga2p_peptide"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - signal_peptide: Aga2p_signal
          - gene:
              id: Aga2p
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_peptide
              source: uniprot

    - terminator: CYC1
