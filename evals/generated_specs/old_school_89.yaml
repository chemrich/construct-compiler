construct:
  name: basic_shuttle_backbone
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV
      # Mammalian expression element; no coding sequence yet
    - terminator: SV40_polyA
      # SV40 poly(A) signal for mammalian transcript stability and polyadenylation
