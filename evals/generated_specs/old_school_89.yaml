construct:
  name: "shuttle_pBR322_amp_CMV"
  host: mammalian
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: cloning_site
        # User requested 'driving nothing', but schema requires a gene. 
        # Using mEGFP as a placeholder for future insertion.
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA # Standard mammalian poly-A terminator as requested