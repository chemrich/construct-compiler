construct:
  name: "CHO_antibody_fragment_expression"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - gene:
              id: antibody_fragment
              source: uniprot

    - terminator: BGH_polyA
