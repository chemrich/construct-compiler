construct:
  name: human_gene_MBP_fusion_6xHis
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lambda_PL

    - cistron:
        label: fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: human_gene
              source: uniprot
          - tag: 6xHis

    - terminator: T7term
