construct:
  name: "HEK293_EF1alpha_eGFP_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: reporter
        expression: high
        gene:
          id: eGFP
          source: fpbase

    - terminator: rrnB_T1

    - polya_signal: SV40
