construct:
  name: "yeast_two_hybrid_bait_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: high
        chain:
          - tag: GAL4_DBD
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: bait_protein
              source: uniprot
    - terminator: CYC1