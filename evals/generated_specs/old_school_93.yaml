construct:
  name: "T7_enzyme_lacI_repression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: enzyme
        expression: high
        gene:
          id: enzyme
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1
