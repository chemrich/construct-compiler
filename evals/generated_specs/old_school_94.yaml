construct:
  name: tetracycline_inducible_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: TRE

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: target_gene
              source: uniprot

    - terminator: BGH_polyA
