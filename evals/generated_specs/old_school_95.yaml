construct:
  name: "e_coli_crystallography_target"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: rrnB_P1

    - cistron:
        label: target
        expression: high
        gene:
          id: target_protein

    - terminator: rrnB_T1
