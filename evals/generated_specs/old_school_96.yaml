construct:
  name: "yeast_secreted_invertase_monitor"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAPDH

    - cistron:
        label: secreted_invertase
        expression: high
        chain:
          - gene:
              id: SUC2
              source: uniprot
              include_signal_sequence: true

    - terminator: CYC1
