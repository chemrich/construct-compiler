construct:
  name: GFP_variant_FLAG_internal
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: GFP_with_internal_FLAG
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          # Note: Internal FLAG insertion at loop position handled post-compilation
          # The loop insertion point should be specified in downstream cloning strategy

    - terminator: rrnB_T1
