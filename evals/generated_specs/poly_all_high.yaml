construct:
  name: "polycistronic_high_expression_fluorescent_trio"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_cistron
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_cistron
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term