construct:
  name: "low_toxicity_fluorescent_triplet"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23106  # Anderson promoter for constitutive low expression
    - cistron:
        label: egfp_cistron
        expression: low
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: neongreen_cistron
        expression: low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 30
    - cistron:
        label: tagbfp2_cistron
        expression: low
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1