```yaml
construct:
  name: "scFv_light_heavy_bicistronic"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: scFv_light_chain
        expression: medium
        gene:
          id: scFv_light_chain_gene
          source: uniprot

    - spacer: 30

    - cistron:
        label: scFv_heavy_chain_variable_domain
        expression: medium
        gene:
          id: scFv_heavy_chain_variable_domain_gene
          source: uniprot

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```