```yaml
construct:
  name: "two_separate_expression_cassettes"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_A
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1

    - promoter: tac
    - cistron:
        label: gene_B
        expression: low
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```