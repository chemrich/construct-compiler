```yaml
construct:
  name: "kinase_cascade"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)" # Common E. coli expression vector
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase
        expression: high
        gene:
          id: kinase_placeholder # Placeholder as no specific gene ID was provided
    - spacer: 30
    - cistron:
        label: substrate
        expression: medium
        fused: false # Independent translation for polycistronic cascade
        gene:
          id: substrate_placeholder
    - spacer: 30
    - cistron:
        label: adapter
        expression: low
        fused: false # Independent translation for polycistronic cascade
        gene:
          id: adapter_placeholder
    - spacer: 30
    - cistron:
        label: reporter
        expression: very_low
        fused: false # Independent translation for polycistronic cascade
        gene:
          id: reporter_placeholder
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
