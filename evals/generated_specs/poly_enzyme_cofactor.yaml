```yaml
construct:
  name: "kinase_regulatory_bicistronic_e_coli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: kinase
        expression: high
        gene:
          id: kinase_gene
          source: uniprot

    - spacer: 30

    - cistron:
        label: regulatory_protein
        expression: low
        fused: false
        gene:
          id: regulatory_protein_gene
          source: uniprot

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```