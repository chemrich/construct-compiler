```yaml
construct:
  name: "his_tev_mbp_megfp_mscarlet_strep_mneongreen"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: independent_reporter
        expression: low
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - spacer: 30

    - cistron:
        label: strep_fusion
        expression: medium # Expression level for this cistron was not specified, defaulting to medium
        chain:
          - tag: Strep-II
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
