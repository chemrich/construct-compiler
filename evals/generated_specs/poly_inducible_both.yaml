construct:
  name: "dual_inducible_mEGFP_mScarlet"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Inducible by L-arabinose
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: T7lac  # Inducible by IPTG
    - cistron:
        label: mscarlet_expression
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term