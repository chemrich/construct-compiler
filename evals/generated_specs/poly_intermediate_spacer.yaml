construct:
  name: "mNeonGreen_mCerulean3_polycistronic_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 40
    - cistron:
        label: blue_reporter
        expression: low
        fused: false
        gene:
          id: mCerulean3
          source: fpbase
    - terminator: T7term