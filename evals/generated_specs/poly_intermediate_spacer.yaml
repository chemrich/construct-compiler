```yaml
construct:
  name: mNeonGreen_mCerulean3_dual_expression
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mNeonGreen_target
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase

    - spacer: 40

    - cistron:
        label: mCerulean3_reporter
        expression: low
        fused: false
        gene:
          id: mCerulean3
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
