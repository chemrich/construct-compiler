construct:
  name: "bicistronic_mEGFP_mScarlet"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 100
    - cistron:
        label: scarlet_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1