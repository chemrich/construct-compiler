```yaml
construct:
  name: "bicistronic_mEGFP_mScarlet_ecoli"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mEGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 100

    - cistron:
        label: mScarlet
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
