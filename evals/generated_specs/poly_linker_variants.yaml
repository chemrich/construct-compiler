```yaml
construct:
  name: his_gs_mbp_megfp_and_his_rigid_mscarlet
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: his_gs_mbp_megfp
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: his_rigid_mscarlet
        expression: medium # Defaulting to medium for second cistron as no explicit expression level was given
        chain:
          - tag: 6xHis
          - linker:
              type: rigid_EAAAK
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```