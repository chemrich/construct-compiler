construct:
  name: "mEGFP_mCherry_coexpression_system"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: reporter
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term