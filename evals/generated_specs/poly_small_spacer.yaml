construct:
  name: "mNeonGreen_tdTomato_polycistronic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: mNeonGreen_cistron
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 20
    - cistron:
        label: tdTomato_cistron
        expression: low
        fused: false
        gene:
          id: tdTomato
          source: fpbase
    - terminator: rrnB_T1