construct:
  name: "insulin_mcherry_bicistronic_expression"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: T7lac
    - cistron:
        label: insulin
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: INS
              source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term