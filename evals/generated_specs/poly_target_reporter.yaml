```yaml
construct:
  name: "bicistronic_His_insulin_mCherry"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)" # Common E. coli expression vector with T7 promoter and Kanamycin resistance

  cassette:
    - promoter: T7lac # Default promoter for E. coli expression with pET-28b(+)

    - cistron:
        label: human_insulin
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01308 # UniProt ID for Human Insulin
              source: uniprot

    - spacer: 30 # Minimum 20 bp for bicistronic expression

    - cistron:
        label: mCherry_reporter
        expression: low
        fused: false # Independent translation for co-expression reporter
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1 # Default E. coli terminator

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```