construct:
  name: "dual_expression_with_readthrough_protection"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    # The terminator above prevents transcriptional read-through from the first promoter into the second
    - promoter: T7lac
    - cistron:
        label: protein_2
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term