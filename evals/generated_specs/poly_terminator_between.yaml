```yaml
construct:
  name: "polycistronic_expression_construct"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # The request specified "terminator between cistrons". For polycistronic expression from a single
    # promoter (i.e., multiple proteins from one mRNA), a spacer is typically used to allow ribosomal
    # re-initiation. Placing a terminator here would prevent transcription of the downstream cistron
    # from the initial promoter. Thus, a spacer is used to ensure both genes are expressed as part
    # of a polycistronic mRNA.
    - spacer: 30

    - cistron:
        label: reporter_protein
        expression: low
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```