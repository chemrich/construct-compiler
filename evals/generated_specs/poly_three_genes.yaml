construct:
  name: "tri_fluorescent_protein_operon"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: megfp_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 50
    - cistron:
        label: mscarlet_cistron
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 50
    - cistron:
        label: mtagbfp2_cistron
        expression: low
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1