```yaml
construct:
  name: "megfp_mscarlet_mneongreen_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_megfp
        expression: medium
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 30

    - cistron:
        label: reporter_mscarlet
        expression: low
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - spacer: 30

    - cistron:
        label: reporter_mneongreen
        expression: low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```