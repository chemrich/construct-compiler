construct:
  name: "multi_color_mEGFP_mScarlet_mNeonGreen_tracking"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: reporter_scarlet
        expression: low
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: reporter_neongreen
        expression: low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: rrnB_T1