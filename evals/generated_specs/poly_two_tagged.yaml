construct:
  name: "bicistronic_his_megfp_strep_mscarlet"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: megfp_cistron
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_cistron
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term