```yaml
construct:
  name: "yeast_secreted_protein_his_tagged"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: 6xHis
          - gene:
              id: P01308  # human insulin as example secreted protein
              source: uniprot

    - terminator: CYC1
```