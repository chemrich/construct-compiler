construct:
  name: "target_protein_purification_nmr"
  host: e_coli_bl21_de3  # T7 promoter requires a DE3 lysogen host for expression
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
      cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: TargetProtein
              source: uniprot
          - tag: 6xHis
      terminator: T7term