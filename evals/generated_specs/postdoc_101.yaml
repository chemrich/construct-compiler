construct:
  name: "gfp_high_expression_check"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # User requested CMV; substituted with T7lac because CMV is a mammalian promoter and inactive in E. coli.
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term