construct:
  name: "quick_GFP_check"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # CMV is a mammalian promoter; substituted T7lac for efficient E. coli expression
    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
