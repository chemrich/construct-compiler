construct:
  name: "yeast_TMProteinA_plasma_membrane"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Strong, constitutive promoter for S. cerevisiae

    - cistron:
        label: TMProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TMProteinA
              source: uniprot

    - terminator: CYC1  # S. cerevisiae transcription terminator
