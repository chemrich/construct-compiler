construct:
  name: mammalian_GeneA_GeneB_GeneC_triexpress
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneA
              source: uniprot

    # IRES for polycistronic translation in E. coli (note: IRES is mammalian element; 
    # E. coli uses RBS instead. This design uses synthetic RBS spacing for prokaryotic polycistronic expression.)
    - spacer: 35

    - cistron:
        label: GeneB
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot

    - spacer: 35

    - cistron:
        label: GeneC
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot

    - terminator: rrnB_T1
