construct:
  name: "mammalian_polycistronic_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GeneA
          source: uniprot
    - spacer: 30 # IRES is incompatible with E. coli; substituted with intergenic spacers for RBS-mediated polycistronic translation
    - cistron:
        label: gene_b
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_c
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot
    - terminator: T7term