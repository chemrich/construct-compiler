construct:
  name: "CytokineX_secreted_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: CytokineX_secreted
        expression: high
        chain:
          - secretion_signal: native_mammalian_signal_peptide
          - gene:
              id: CytokineX
              source: uniprot
          - tag: FLAG

    - terminator: CYC1_poly_A
