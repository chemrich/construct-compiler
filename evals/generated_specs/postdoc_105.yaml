construct:
  name: protein_z_expression_kanamycin
  host: e_coli
  backbone:
    resistance: kanamycin # G418 resistance in E. coli is conferred by the kanamycin resistance gene (nptII/aph).
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: ProteinZ
          source: uniprot
    - terminator: rrnB_T1