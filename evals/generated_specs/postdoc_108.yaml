construct:
  name: "dox_inducible_EnzymeX_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: pTET  # Doxycycline-responsive tetracycline-controlled promoter

    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeX
              source: uniprot

    - terminator: rrnB_T1
