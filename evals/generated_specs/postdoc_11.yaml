construct:
  name: "yeast_GAL1_MyAntigen_integrative"
  host: yeast
  backbone:
    resistance: kanamycin # kanMX module for G418 selection in yeast
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: antigen_expression
        expression: high
        chain:
          - gene:
              id: MyAntigen
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis
    - terminator: CYC1