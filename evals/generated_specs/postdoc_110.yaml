construct:
  name: "human_therapeutic_protein_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: TEF1  # Strong constitutive yeast promoter selected for high expression
    - cistron:
        label: therapeutic_target
        expression: high
        gene:
          id: TherapeuticProtein
          source: uniprot
    - terminator: CYC1  # Standard yeast transcription terminator