construct:
  name: "signaling_protein_expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: SignalingProtein
          source: uniprot
    - terminator: T7term
# Note: E. coli does not natively perform site-specific phosphorylation (e.g., Ser123) on eukaryotic proteins. A phosphomimetic mutation or kinase co-expression system would be required for functional phosphorylation.