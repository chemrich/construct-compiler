construct:
  name: "BindingProtein_Strep_mCherry_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: BindingProtein_fusion
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: BindingProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
