construct:
  name: "yeast_binding_protein_strep_mcherry"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2micron
  cassette:
    - promoter: GPD
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: BindingProtein
              source: uniprot
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1