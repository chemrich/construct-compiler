construct:
  name: "mammalian_metabolic_pathway_transplant_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Mammalian promoters are incompatible with yeast; substituted with strong constitutive yeast GPD promoter
    - cistron:
        label: enzyme_1
        gene:
          id: Enzyme1
          source: uniprot
    - promoter: TEF1 # Mammalian promoters are incompatible with yeast; substituted with strong constitutive yeast TEF1 promoter
    - cistron:
        label: enzyme_2
        gene:
          id: Enzyme2
          source: uniprot
    - promoter: ADH1 # Mammalian promoters are incompatible with yeast; substituted with strong constitutive yeast ADH1 promoter
    - cistron:
        label: enzyme_3
        gene:
          id: Enzyme3
          source: uniprot
    - terminator: CYC1_term