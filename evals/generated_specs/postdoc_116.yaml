construct:
  name: yeast_high_copy_mammalian_ori
  host: yeast

  backbone:
    resistance: G418  # neomycin resistance (G418) for yeast selection
    ori: 2_micron    # S. cerevisiae 2-micron circle - natural high-copy yeast ori
    source: addgene
    # Note: mammalian ORIs (SV40, CMV-enhancer) are not functional in S. cerevisiae.
    # Using native 2-micron ori instead for stable, high-copy replication in yeast.

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
