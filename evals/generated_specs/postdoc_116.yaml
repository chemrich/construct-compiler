construct:
  name: "yeast_high_copy_neomycin_vector"
  host: yeast
  backbone:
    resistance: kanamycin # Kanamycin/G418 selection is the standard method for neomycin-type resistance in yeast
    ori: 2_micron # Substituted 2-micron for mammalian origin as mammalian origins do not support replication in S. cerevisiae
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1