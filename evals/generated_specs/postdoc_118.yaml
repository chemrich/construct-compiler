construct:
  name: MitoProtein_mitochondrial_targeting
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MitoProtein
        expression: high
        chain:
          - mitochondrial_targeting_signal: COX_IV_MTS
          - gene:
              id: MitoProtein
              source: uniprot

    - terminator: rrnB_T1
