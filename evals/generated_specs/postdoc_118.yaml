construct:
  name: "MitoProtein_yeast_mitochondrial_targeting"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TDH3  # Standard constitutive promoter for high expression in S. cerevisiae
    - cistron:
        label: mitochondrial_targeted_fusion
        expression: medium
        chain:
          - gene:
              id: COX4I1
              source: uniprot  # Human cytochrome c oxidase subunit 4 isoform 1 (contains N-term MTS)
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: MitoProtein
              source: uniprot
    - terminator: CYC1_term  # Common yeast terminator for mRNA stability