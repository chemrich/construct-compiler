construct:
  name: hDrugTarget_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: target
        expression: high
        gene:
          id: hDrugTarget
          source: uniprot

    - terminator: CYC1  # Yeast terminator - human polyA signals may not work efficiently in yeast