  backbone:
    resistance: ampicillin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: glycopro_target
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - gene:
              id: GlycoPro
              source: uniprot
    - terminator: CYC1