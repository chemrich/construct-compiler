construct:
  name: "GlycoPro_secretion_yeast"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: GlycoPro_secreted
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor
          - gene:
              id: GlycoPro
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
