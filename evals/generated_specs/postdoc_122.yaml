construct:
  name: "lentiviral_FactorX_HelperY_bicistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: FactorX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: FactorX
              source: uniprot

    - spacer: 30

    # IRES element represented as spacer + independent cistron
    # In practice, an IRES sequence (e.g., EMCV or EIF4E) would be inserted here
    - cistron:
        label: HelperY
        expression: high
        fused: false
        gene:
          id: HelperY
          source: uniprot

    - terminator: rrnB_T1
