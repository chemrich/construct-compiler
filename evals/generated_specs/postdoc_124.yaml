construct:
  name: "yeast_two_hybrid_reporter_activator"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1
    
    - cistron:
        label: ReporterA
        expression: high
        gene:
          id: ReporterA
          source: uniprot

    - spacer: 30

    - cistron:
        label: ActivatorB
        expression: high
        fused: false
        gene:
          id: ActivatorB
          source: uniprot

    - terminator: rrnB_T1
