construct:
  name: "yeast_two_hybrid_inducible_reporter_activator"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: "ReporterA"
        expression: high
        gene:
          id: "ReporterA"
    - spacer: 30
    - cistron:
        label: "ActivatorB"
        expression: high
        fused: false
        gene:
          id: "ActivatorB"
    - terminator: CYC1