construct:
  name: yeast_constitutive_high_expression_vector
  host: yeast
  backbone:
    resistance: ampicillin # Standard for E. coli selection in yeast shuttle vectors
    ori: pUC # High-copy E. coli origin for cloning
    source: addgene
  cassette:
    - promoter: GPD # Strong constitutive yeast promoter (TDH3)
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis # Included as requested; sequence is resolved by the compiler
          - gene:
              id: GOI # Placeholder for your Gene of Interest
    - terminator: CYC1 # Standard yeast terminator