construct:
  name: "tightly_inducible_death_inducer"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE3G  # Used TRE3G for tight tet-inducible control in mammalian cells as requested
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: DeathInducer
              source: uniprot
    - terminator: bGH_PA