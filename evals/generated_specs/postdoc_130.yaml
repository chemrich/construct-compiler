construct:
  name: "yeast_coexpression_proteinA_proteinB"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: ProteinA
          source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: protein_b
        expression: high
        gene:
          id: ProteinB
          source: uniprot
    - terminator: ADH1