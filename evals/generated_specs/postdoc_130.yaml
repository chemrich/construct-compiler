construct:
  name: ProteinA_ProteinB_yeast_dual_promoter
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinA
        expression: high
        gene:
          id: ProteinA
          source: uniprot

    - terminator: CYC1

    - spacer: 100

    - promoter: GAL10

    - cistron:
        label: ProteinB
        expression: high
        gene:
          id: ProteinB
          source: uniprot

    - terminator: CYC1
