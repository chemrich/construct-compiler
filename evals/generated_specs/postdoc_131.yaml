construct:
  name: bacterial_trimeric_complex
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: subunit_1
        expression: medium
        gene:
          id: Subunit1
          source: uniprot
    - spacer: 30
    - cistron:
        label: subunit_2
        expression: medium
        fused: false
        gene:
          id: Subunit2
          source: uniprot
    - spacer: 30
    - cistron:
        label: subunit_3
        expression: medium
        fused: false
        gene:
          id: Subunit3
          source: uniprot
    - terminator: rrnB_T1