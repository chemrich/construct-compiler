construct:
  name: "bacterial_complex_subunits_polycistronic"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Subunit1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Subunit1
              source: uniprot

    - spacer: 30

    - cistron:
        label: Subunit2
        expression: high
        fused: false
        chain:
          - gene:
              id: Subunit2
              source: uniprot

    - spacer: 30

    - cistron:
        label: Subunit3
        expression: high
        fused: false
        chain:
          - gene:
              id: Subunit3
              source: uniprot

    - terminator: rrnB_T1
