construct:
  name: KeyEnzyme_genomic_integration_yeast
  host: yeast

  backbone:
    # Genomic integration vector for S. cerevisiae
    # Uses homologous recombination flanking sequences
    resistance: kanamycin
    ori: pUC
    source: addgene
    integration_target: URA3  # Standard yeast integration locus

  cassette:
    - promoter: TEF1  # Strong constitutive promoter for yeast (glycolysis enzyme 3-phosphoglycerate kinase alternative)

    - cistron:
        label: KeyEnzyme
        expression: high
        gene:
          id: KeyEnzyme
          source: uniprot

    - terminator: CYC1  # Yeast CYC1 terminator for strong stable expression
