construct:
  name: CRISPR_humanized_Cas9_mCherry
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: humanized_Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: humanized_Cas9
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        gene:
          id: guide_RNA_scaffold
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: CMV

    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
