construct:
  name: "yeast_shuttle_NovelProtein_screening"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Implicit yeast autonomous replication element (ARS) and selection marker (URA3/LEU2) handled by yeast shuttle vector defaults

  cassette:
    - promoter: GAL1

    - cistron:
        label: NovelProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: NovelProtein
              source: uniprot

    - terminator: CYC1
