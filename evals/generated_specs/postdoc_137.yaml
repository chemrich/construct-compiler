construct:
  name: protease_cleavage_biosensor
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: biosensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
