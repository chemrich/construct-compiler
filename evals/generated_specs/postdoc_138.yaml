construct:
  name: dual_luciferase_reporter_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV
    
    - cistron:
        label: firefly_luciferase
        expression: high
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot
        poly_a: true

    - promoter: EF1_alpha

    - cistron:
        label: renilla_luciferase
        expression: high
        fused: false
        chain:
          - gene:
              id: Renilla_reniformis_luciferase
              source: uniprot
        poly_a: true

    - terminator: SV40_polyA
