construct:
  name: "dual_luciferase_reporter_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Represents the test promoter (placeholder)
    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P13127
          source: uniprot
    - terminator: SV40_polyA
    - spacer: 100
    - promoter: EF1_alpha  # Constitutive control promoter
    - cistron:
        label: renilla_luciferase
        expression: medium
        fused: false
        gene:
          id: P27652
          source: uniprot
    - terminator: bGH_polyA