construct:
  name: "SecretedCytokine_E_coli"
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: secreted_cytokine
        expression: high
        chain:
          - signal_peptide: OmpA  # E. coli signal peptide for periplasmic export
          - gene:
              id: SecretedCytokine
              source: uniprot
          - tag: Myc
    
    - terminator: rrnB_T1
    
    # Note: E. coli cannot perform mammalian-style glycosylation or polyA processing
    # For proper glycosylation and processing, consider mammalian expression systems