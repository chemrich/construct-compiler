construct:
  name: "E_coli_GFP_secretion"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - tag: OmpA_signal_peptide
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
