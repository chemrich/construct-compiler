construct:
  name: "mEGFP_secretion_E_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # CMV is a mammalian promoter; substituted with strong constitutive E. coli promoter J23100 as requested.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: PelB  # Signal peptide for periplasmic secretion in E. coli
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1