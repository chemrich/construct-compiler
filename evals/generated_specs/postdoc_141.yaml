construct:
  name: yeast_pGAL1_6xHis_X
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Translated from user 'pGALL'
    - cistron:
        label: human_protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: X
              source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator for S. cerevisiae constructs