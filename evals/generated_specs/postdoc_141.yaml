construct:
  name: "human_protein_X_yeast_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: human_protein_X
              source: uniprot

    - terminator: rrnB_T1
