construct:
  name: yeast_secreted_Fab
  host: yeast

  backbone:
    catalog_vector: "pPICZ_B"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_Fab
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: Fab_fragment
              source: uniprot
              description: "User-provided antibody Fab sequence"

    - terminator: rrnB_T1
