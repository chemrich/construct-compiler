construct:
  name: dual_fluorescent_sensor_mCherry_EGFP
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: HA

    # IRES enables cap-independent translation of the downstream cistron from the same mRNA
    - spacer: 27  # IRES sequence (approx 27 bp represents minimal IRES functionality)

    - cistron:
        label: EGFP
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase

    - terminator: rrnB_T1
