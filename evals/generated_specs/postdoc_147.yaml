construct:
  name: "protein_C_solubility_optimized"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: protein_C
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_C
              source: uniprot
          - solubility_tag: SUMO
    
    - terminator: rrnB_T1
  
  # Note: Expression temperature should be optimized post-compilation.
  # Recommend induction at OD600 ~0.6–0.8 followed by 4–6 hour expression at 16–20 °C
  # to reduce aggregation. BL21(DE3) with T7 RNA polymerase allows tight, inducible control.
  # SUMO tag enhances solubility; consider co-expression with GroEL/ES chaperones if aggregation persists.
