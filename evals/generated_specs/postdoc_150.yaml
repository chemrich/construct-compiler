construct:
  name: "shuttle_vector_protein_F_dual_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322  # bacterial replication origin
    # Note: SV40 ori for mammalian replication cannot be fully represented in this schema
    # which is optimized for bacterial backbones. Recommend using a commercial shuttle vector
    # like pSVK3 or pCEP4 as the physical backbone, which already contains both ori sequences.
    # This YAML spec describes the E. coli cassette; mammalian use requires backbone adjustment.
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_F
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_F
              source: uniprot
    
    - terminator: rrnB_T1
