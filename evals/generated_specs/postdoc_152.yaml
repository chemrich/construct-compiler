construct:
  name: "simple_luciferase_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1