construct:
  name: "mNeonGreen_H_Strep_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha_weak
      # EF1_alpha_weak chosen as a moderate/reduced-strength promoter
      # to minimize expression toxicity of transmembrane protein H

    - cistron:
        label: mNeonGreen_H_Strep
        expression: low
        chain:
          - tag: mNeonGreen
            source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: H
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
