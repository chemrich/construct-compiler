construct:
  name: "yeast_trienzyme_IRES_operon"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_I
        expression: high
        gene:
          id: enzyme_I
          source: uniprot

    - spacer: 50

    - cistron:
        label: enzyme_J
        expression: high
        fused: false
        gene:
          id: enzyme_J
          source: uniprot

    - spacer: 50

    - cistron:
        label: enzyme_K
        expression: high
        fused: false
        gene:
          id: enzyme_K
          source: uniprot

    - terminator: rrnB_T1
