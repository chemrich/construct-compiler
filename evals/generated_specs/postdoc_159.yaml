construct:
  name: "mammalian_secreted_P_with_signal_peptide"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_P
        expression: high
        chain:
          - tag: SP_alpha_factor  # Mammalian-compatible signal peptide for secretion
          - tag: FLAG  # Mammalian-secretion-compatible purification tag (replacing OmpA)
          - gene:
              id: P
              source: uniprot

    - terminator: rrnB_T1
