construct:
  name: "ReporterGene_triple_resistance"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
    # Note: Standard plasmid backbones contain ONE primary resistance marker.
    # Multiple resistance markers in a single construct requires custom assembly
    # or stacking of separate selectable markers. For practical cloning, recommend
    # choosing primary selection (ampicillin here) and noting that dual/triple
    # markers require custom synthesis or sequential cloning steps.

  cassette:
    - promoter: T7

    - cistron:
        label: ReporterGene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ReporterGene
              source: uniprot

    - terminator: rrnB_T1
