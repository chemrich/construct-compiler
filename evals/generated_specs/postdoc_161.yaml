construct:
  name: yeast_therapeutic_peptide_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: rrnB_T1
