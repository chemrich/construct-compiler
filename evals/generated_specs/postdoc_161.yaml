construct:
  name: "yeast_constitutive_peptide_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Standard constitutive yeast promoter
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01270  # Parathyroid hormone (PTH) selected as representative therapeutic peptide
              source: uniprot
    - terminator: CYC1  # Common yeast terminator