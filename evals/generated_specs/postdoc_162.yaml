construct:
  name: "metabolic_pathway_tristone_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: gene1
        expression: high
        chain:
          - gene:
              id: gene1
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: gene2_ires
        expression: high
        fused: false
        chain:
          - gene:
              id: gene2
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: gene3_ires
        expression: high
        fused: false
        chain:
          - gene:
              id: gene3
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
