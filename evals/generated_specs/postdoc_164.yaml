construct:
  name: yeast_gfp_reporter_tet_inducible
  host: yeast

  backbone:
    resistance: G418
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: tTA_responsive
    
    - cistron:
        label: gfp_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
