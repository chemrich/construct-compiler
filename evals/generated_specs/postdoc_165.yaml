construct:
  name: "bacterial_expression_CMV_fusion"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
      # Note: CMV is a mammalian promoter and not functional in bacteria.
      # Substituted T7lac for proper bacterial expression.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: placeholder_protein
              source: uniprot
    - terminator: rrnB_T1
      # Note: poly-A tails are not used in bacterial expression systems.
      # rrnB_T1 terminator provides efficient transcription termination in E. coli.
