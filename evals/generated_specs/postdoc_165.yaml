construct:
  name: "bacterial_fusion_protein_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Substituted T7lac for CMV because CMV is a mammalian promoter and will not function in E. coli
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term  # Substituted T7term for poly-A tail as bacteria use specific rho-independent/dependent terminators rather than polyadenylation signals for mRNA stability