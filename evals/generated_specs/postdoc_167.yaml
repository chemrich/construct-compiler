construct:
  name: "pichia_constitutive_expression_aggregation_protein"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP # Strong constitutive promoter in Pichia pastoris
    - cistron:
        label: target
        expression: high
        gene:
          id: P37840 # Human alpha-synuclein (example aggregation-prone protein)
          source: uniprot
    - terminator: CYC1_term # Substituted mammalian poly-A with yeast CYC1 terminator for proper mRNA processing in yeast