construct:
  name: "pichia_pastoris_aggregation_prone_protein"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1  # Strong constitutive promoter for Pichia pastoris

    - cistron:
        label: target
        expression: high
        gene:
          id: null  # User must provide gene ID or sequence separately
          source: uniprot

    - terminator: CYC1  # Pichia pastoris terminator

    # Note: Poly-A tails are not standard in Pichia pastoris genomic constructs.
    # They are added post-transcriptionally in mammalian systems but are not
    # typically incorporated into yeast expression vectors. Yeast uses different
    # 3' UTR mechanisms (e.g., CYC1 terminator already includes polyadenylation signals).
    # For maximum mRNA stability in yeast, the CYC1 terminator is already optimized.
