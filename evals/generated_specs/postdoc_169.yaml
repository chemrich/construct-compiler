construct:
  name: yeast_two_hybrid_AD_fusion
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
  - promoter: GAL4
  - cistron:
      label: AD_fusion
      expression: high
      chain:
      - tag: FLAG
      - gene:
          id: GAL4_AD
          source: uniprot
      - linker:
          type: GS_flexible
          repeats: 1
      - gene:
          id: bait_protein
          source: uniprot
  - terminator: CYC1_poly_A
