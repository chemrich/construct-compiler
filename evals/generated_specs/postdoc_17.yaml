construct:
  name: "ImmunogenProtein_Strep_E_coli"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: immunogen
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ImmunogenProtein
              source: uniprot
    
    - terminator: rrnB_T1
