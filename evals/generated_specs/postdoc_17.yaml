construct:
  name: "immunogen_protein_strep_tagged"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: immunogen
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ImmunogenProtein
              source: uniprot

    - terminator: rrnB_T1  # Note: Using bacterial terminator as mammalian polyA signals don't function in E. coli