construct:
  name: "human_GLUT1_constitutive_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100  # Strong constitutive promoter as requested
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P11166  # SLC2A1 (GLUT1), a representative human membrane protein
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag as requested
    - terminator: rrnB_T1