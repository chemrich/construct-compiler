construct:
  name: human_gene_his_myc_expression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - tag: Myc
          - gene:
              id: human_codon_optimized
              source: uniprot
              # Note: Gene ID should be replaced with actual UniProt accession or gene symbol.
              # Codon optimization for human expression requested; compiler will apply
              # human codon optimization despite E. coli host selection.

    - terminator: rrnB_T1
