construct:
  name: "strep_tagged_library_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # CMV is mammalian-specific; J23100 is a very strong constitutive substitute for E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1