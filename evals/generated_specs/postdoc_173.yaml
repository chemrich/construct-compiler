construct:
  name: "protein_variant_library_strep_tag"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # Note: T7lac is the standard high-yield promoter for E. coli BL21(DE3).
      # CMV (mammalian) is not functional in bacteria. T7lac provides comparable
      # inducible high expression with IPTG induction.

    - cistron:
        label: protein_variant
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: null
              # Placeholder for variant library; sequence to be inserted

    - terminator: rrnB_T1
