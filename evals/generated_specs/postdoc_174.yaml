construct:
  name: "yeast_protein_stable_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1
