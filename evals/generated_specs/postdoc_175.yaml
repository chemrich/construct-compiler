construct:
  name: "bacterial_periplasmic_secretion"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - signal_peptide: pelB  # PDI signal peptide not standard in bacteria; using pelB (periplasmic leader) instead
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
