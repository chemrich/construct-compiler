construct:
  name: "two_subunit_complex_furin_cleavable"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: subunit_1_2_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: subunit_1
              source: uniprot
          - cleavage_site: Furin
          - gene:
              id: subunit_2
              source: uniprot
    
    - terminator: rrnB_T1
