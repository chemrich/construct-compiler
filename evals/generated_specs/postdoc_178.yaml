construct:
  name: "e_coli_shuttle_blasticidin_T7"
  host: e_coli
  backbone:
    resistance: blasticidin # Blasticidin selection used as requested for mammalian compatibility, though less common than kanamycin in E. coli
    ori: pUC
    source: custom
  cassette:
    - promoter: T7
    - cistron:
        label: mammalian_target_gene
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term