construct:
  name: "mammalian_gene_ecoli_temp_host"
  host: e_coli

  backbone:
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        gene:
          id: custom_mammalian_gene
          source: uniprot

    - terminator: rrnB_T1
