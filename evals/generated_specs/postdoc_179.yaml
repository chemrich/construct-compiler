construct:
  name: "yeast_sumo_tev_protein_assay"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: difficult_protein
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
    - spacer: 40  # IRES functional distance for yeast internal ribosome entry
    - cistron:
        label: assay_peptide
        expression: medium
        fused: false  # Independent translation via IRES
        gene:
          id: functional_peptide
          source: uniprot
    - terminator: CYC1