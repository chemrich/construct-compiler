construct:
  name: "yeast_SUMO_fusion_functional_assay"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: SUMO_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
        # Note: IRES included conceptually for polycistronic co-expression in yeast

    - cistron:
        label: functional_peptide
        expression: medium
        fused: false
        gene:
          id: assay_peptide
          source: uniprot

    - terminator: rrnB_T1
