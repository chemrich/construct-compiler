construct:
  name: "DrugTargetY_GFP_Myc_yeast"
  host: yeast

  backbone:
    resistance: zeocin
    ori: CEN6/ARS4
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: target_GFP_Myc
        expression: high
        chain:
          - gene:
              id: DrugTargetY
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GFP
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc

    - terminator: CYC1
