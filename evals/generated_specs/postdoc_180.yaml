construct:
  name: "AwesomeProtein_N_His_Expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tetA  # Substitution: tetA (bacterial tet-inducible) used for E. coli host instead of mammalian Tet-On system
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AwesomeProtein
              source: uniprot
    - terminator: rrnB_T1