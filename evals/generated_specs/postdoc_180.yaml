construct:
  name: "E_coli_AwesomeProtein_His_inducible"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tetA  # Tet-inducible promoter for precise control
    
    - cistron:
        label: AwesomeProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AwesomeProtein
              source: uniprot
    
    - terminator: rrnB_T1
