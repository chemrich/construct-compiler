construct:
  name: "YeastBuddy_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # CMV is mammalian-specific; using GAL1 (strong yeast promoter) instead

    - cistron:
        label: YeastBuddy
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: YeastBuddy
              source: uniprot

    - terminator: rrnB_T1
