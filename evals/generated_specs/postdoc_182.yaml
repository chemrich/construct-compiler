construct:
  name: "ProteinA_ProteinB_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
