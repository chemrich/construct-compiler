construct:
  name: YeastProtein1_P2A_YeastProtein2
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: YeastProtein1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: YeastProtein1
              source: uniprot

    - spacer: 22  # P2A self-cleaving peptide sequence

    - cistron:
        label: YeastProtein2
        expression: high
        fused: false
        gene:
          id: YeastProtein2
          source: uniprot

    - terminator: rrnB_T1
