construct:
  name: SecretedFactor_Ecoli_secretion
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: SecretedFactor
        expression: high
        chain:
          - tag: pelB  # E. coli-compatible secretion signal (better than mammalian in E. coli)
          - gene:
              id: SecretedFactor
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
