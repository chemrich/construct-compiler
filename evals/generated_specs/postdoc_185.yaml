construct:
  name: "yeast_ToughProtein_GST_TEV_FLAG"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: ToughProtein
        expression: high
        chain:
          - tag: GST
          - cleavage_site: TEV
          - gene:
              id: ToughProtein
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
