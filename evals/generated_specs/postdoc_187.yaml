construct:
  name: AwesomeYeastProtein_Myc_HA
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: tetO_TRP1
      # Doxycycline-inducible promoter for S. cerevisiae with TRP1 marker

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - linker:
              type: short_GS
              repeats: 1
          - tag: HA
          - cleavage_site: Thrombin
          - gene:
              id: AwesomeYeastProtein
              source: uniprot

    - terminator: rrnB_T1
