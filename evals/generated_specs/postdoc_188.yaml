construct:
  name: "CarrierProtein_SmallPeptide_dual_cleavage"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CarrierProtein
              source: uniprot
          - cleavage_site: TEV
          - cleavage_site: 3C
          - gene:
              id: SmallPeptide
              source: uniprot
    
    - terminator: rrnB_T1
