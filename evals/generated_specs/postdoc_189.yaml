construct:
  name: "HumanEnzyme_Yeast_Constitutive_Expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: HumanEnzyme
              source: uniprot
    - terminator: CYC1_term