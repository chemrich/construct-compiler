construct:
  name: "human_insulin_with_BiP_chaperone"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: insulin
        expression: medium
        gene:
          id: P01308  # Human insulin
          source: uniprot

    - spacer: 30  # Note: E. coli ribosomes don't recognize mammalian IRES, using spacer for polycistronic expression

    - cistron:
        label: chaperone
        expression: medium
        fused: false
        gene:
          id: P11021  # BiP/GRP78 chaperone
          source: uniprot

    - terminator: rrnB_T1