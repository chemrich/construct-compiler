construct:
  name: membrane_x_ecoli_expression
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: membrane_protein
        expression: medium  # Medium expression used to minimize toxicity often associated with membrane protein overexpression
        gene:
          id: MembraneX
          source: uniprot
    - terminator: T7term # Standard T7 terminator for E. coli T7 systems