construct:
  name: negative_control_DummyProtein_polyadenylation
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: DummyProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: DummyProtein
              source: uniprot

    # Note: mammalian polyadenylation signal (AATAAA) added post-terminator
    # for negative control testing of unexpected transcript processing in E. coli
    - terminator: rrnB_T1
