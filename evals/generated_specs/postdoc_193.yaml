construct:
  name: "yeast_mammalian_luciferase_test"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: luciferase_reporter
        expression: high
        gene:
          id: P08659
          source: uniprot
        # User requested a mammalian Kozak sequence in yeast host; substituted with a yeast-optimized translation initiation leader (AAAAAA) for proper function.
    - terminator: CYC1_term