construct:
  name: "yeast_mammalian_promoter_luciferase_test"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Strong inducible yeast promoter for testing

    - cistron:
        label: luciferase
        expression: high
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot
        # Note: Kozak sequence (GCCRCCATGG) will be automatically optimized
        # for mammalian context during compilation; yeast ribosomes will still
        # recognize the standard start codon in this yeast expression context.

    - terminator: rrnB_T1
