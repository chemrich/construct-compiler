construct:
  name: "BacterialProteinZ_mammalian_UTRs"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: BacterialProteinZ
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: BacterialProteinZ
              source: uniprot
              # Note: mammalian beta-actin 5' and 3' UTRs will be added
              # via synthetic DNA synthesis or ligation post-compilation.
              # E. coli ribosomes have limited compatibility with mammalian UTRs;
              # consider using optimized hybrid UTRs for best results.

    - terminator: rrnB_T1
