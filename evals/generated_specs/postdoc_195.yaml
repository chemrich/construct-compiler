construct:
  name: "NuclearEnzyme_Nuclear_Localization_Yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: TEF1  # Standard high-expression yeast promoter substituted for default
    - cistron:
        label: target
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: NuclearEnzyme
              source: uniprot
          - tag: FLAG
    - terminator: CYC1  # Standard yeast terminator