construct:
  name: "YeastA_YeastB_YeastC_polycistronic"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: YeastA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YeastA
              source: uniprot

    # IRES1 represented as spacer with comment
    - spacer: 50  # IRES sequence for yeast polycistronic translation

    - cistron:
        label: YeastB
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: YeastB
              source: uniprot

    # IRES2 represented as spacer with comment
    - spacer: 50  # Second IRES sequence for yeast polycistronic translation

    - cistron:
        label: YeastC
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: YeastC
              source: uniprot

    - terminator: rrnB_T1
