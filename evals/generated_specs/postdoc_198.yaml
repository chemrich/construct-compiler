construct:
  name: "ToxicProtein_Tight_Control_E_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Ptet  # Substituted Ptet for Tet-On/CMV; CMV is mammalian-specific and Ptet provides tetracycline-inducible control in E. coli.
    - cistron:
        label: target
        expression: high
        gene:
          id: ToxicProtein
          source: uniprot
    - terminator: rrnB_T1