construct:
  name: ToxicProtein_TetOn_control
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: tetO
      # Note: tetO (Tet-On) operator placed upstream; requires TetR repressor or rtTA transactivator.
      # In E. coli, this is typically paired with a basal weak promoter (here minimal CMV analog substituted as pTrc99A-like).
      # CMV is mammalian-specific; using tetO-controlled minimal promoter (trc/tac-derived) for E. coli Tet-On instead.

    - cistron:
        label: ToxicProtein
        expression: very_low
        chain:
          - tag: 6xHis
          - gene:
              id: ToxicProtein
              source: uniprot

    - terminator: rrnB_T1
