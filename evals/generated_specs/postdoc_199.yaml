construct:
  name: "yeast_mammalian_fusion"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YeastDomain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: MammalianDomain
              source: uniprot

    - terminator: CYC1
