construct:
  name: "GeneA_GeneB_polycistronic_complex"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GeneA
              source: uniprot
    
    # Note: E. coli ribosomes don't recognize IRES sequences (eukaryotic mechanism)
    # Using spacer for polycistronic expression with separate RBS for each cistron
    - spacer: 30
    
    - cistron:
        label: GeneB
        expression: high
        fused: false  # independent translation with its own RBS
        chain:
          - tag: 6xHis
          - gene:
              id: GeneB
              source: uniprot
    
    - terminator: rrnB_T1