construct:
  name: "GeneA_GeneB_complex_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GeneA
              source: uniprot

    # Note: E. coli ribosomes do not recognize IRES elements (eukaryotic feature).
    # Using RBS + spacing instead for efficient polycistronic translation.
    - spacer: 30

    - cistron:
        label: GeneB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GeneB
              source: uniprot

    - terminator: rrnB_T1
