construct:
  name: "constitutive_his_protein_x_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100  # Substituted CMV with J23100; CMV is a mammalian promoter and will not function in E. coli.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: X
              source: uniprot
    - terminator: rrnB_T1