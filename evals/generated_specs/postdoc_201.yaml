construct:
  name: secreted_enzyme_Y_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_Y
        expression: high
        chain:
          - tag: SP_albumin
          - tag: Myc
          - gene:
              id: enzyme_Y
              source: uniprot

    - terminator: CYC1
