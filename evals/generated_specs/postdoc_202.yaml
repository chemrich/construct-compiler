construct:
  name: "coexpression_A_B_polycistronic"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: A
              source: uniprot
    - spacer: 30 # Substituted EMCV IRES with a 30bp spacer; IRES elements are eukaryotic, E. coli co-expression uses polycistronic spacers with internal RBS.
    - cistron:
        label: protein_B
        expression: high
        fused: false
        gene:
          id: B
          source: uniprot
    - terminator: T7term