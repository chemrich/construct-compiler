construct:
  name: "dual_protein_A_B_IRES"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 50

    # EMCV IRES represented as a spacer element with note
    # Note: EMCV IRES (Encephalomyocarditis virus IRES) included here
    # In E. coli, IRES-mediated translation is limited; consider RBS-based polycistronic design instead
    - spacer: 27

    - cistron:
        label: protein_B
        expression: high
        fused: false
        gene:
          id: protein_B
          source: uniprot

    - terminator: rrnB_T1
