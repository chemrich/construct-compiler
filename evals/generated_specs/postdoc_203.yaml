construct:
  name: "yeast_tetOn_Z_inducible"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetO_minimal
      # Tet-responsive minimal promoter for yeast (bidirectional or unidirectional variant)

    - cistron:
        label: Z
        expression: high
        gene:
          id: Z
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL4
      # Constitutive/inducible promoter for transactivator expression in yeast

    - cistron:
        label: tTA
        expression: medium
        chain:
          - gene:
              id: tTA
              source: uniprot
          # tTA (tetracycline-controlled transactivator) activates tetO in presence of doxycycline/tetracycline

    - terminator: rrnB_T1
