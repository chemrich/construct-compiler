construct:
  name: "E_coli_P_His_tag"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Note: Blasticidin resistance is primarily used in mammalian/eukaryotic systems.
    # E. coli strains do not commonly carry blasticidin resistance markers.
    # Substituting kanamycin for reliable E. coli selection.

  cassette:
    - promoter: T7lac

    - cistron:
        label: P
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P
              source: uniprot

    - terminator: rrnB_T1
