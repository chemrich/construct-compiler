construct:
  name: "e_coli_genomic_integration_donor_R"
  host: e_coli
  backbone:
    # Homology arms (1kb each) and CRISPR target sites for genomic integration 
    # are not explicitly supported by the schema; this specification defines 
    # the Gene R expression cassette cargo for the donor plasmid.
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: R
          source: uniprot
    - terminator: rrnB_T1