construct:
  name: "yeast_human_PROS1_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: V5
          - gene:
              id: PROS1
              source: uniprot
    - terminator: CYC1_term