construct:
  name: "dual_luciferase_reporter_assay"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Placeholder for the user-provided promoter; high-strength inducible promoter
    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1
    - promoter: J23106  # Constitutive Anderson library promoter for normalization
    - cistron:
        label: renilla_luciferase
        expression: medium
        fused: false
        gene:
          id: P27652
          source: uniprot
    - terminator: BBa_B0015