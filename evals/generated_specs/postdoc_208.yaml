construct:
  name: "dual_luciferase_reporter_ecoli"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: firefly_luciferase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P08659
              source: uniprot
    
    - spacer: 30
    
    - promoter: araBAD
    
    - cistron:
        label: renilla_luciferase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P27738
              source: uniprot
    
    - terminator: rrnB_T1
