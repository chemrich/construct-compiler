construct:
  name: antibody_fragment_yeast_secreted
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Strong constitutive yeast promoter (CMV is mammalian; using GAL1 for S. cerevisiae)

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor  # S. cerevisiae secretion signal
          - tag: 6xHis
          - gene:
              id: antibody_fragment
              source: uniprot

    - terminator: CYC1  # S. cerevisiae transcription terminator
