```yaml
construct:
  name: antibody_fragment_secretion_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1  # CMV is mammalian - using strong constitutive TEF1 for yeast

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast secretion signal
          - tag: 6xHis
          - gene:
              id: antibody_fragment
              source: uniprot

    - terminator: CYC1
```