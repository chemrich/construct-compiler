construct:
  name: "membrane_anchored_W_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: W
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: EGFR
              source: uniprot # Note: Mammalian TMDs may require optimization for E. coli membrane insertion.
    - terminator: T7term