construct:
  name: human_gene_X_yeast_expression
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: X
              source: uniprot
              codon_optimization: humanized  # Preserves human codon usage while maintaining S. cerevisiae compatibility

    - terminator: CYC1
