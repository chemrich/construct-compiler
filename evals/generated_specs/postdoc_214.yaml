construct:
  name: "protein_Y_furin_activation_construct"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_Y_mature
        expression: high
        chain:
          - cleavage_site: Furin # E. coli does not natively express furin proteases; site included per request for potential in vitro or engineered processing.
          - gene:
              id: protein_Y
              source: uniprot
    - terminator: T7term