construct:
  name: "yeast_protein_K_high_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3 # CAG is a mammalian promoter; substituted with TDH3 for high constitutive expression in yeast.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: K
              source: uniprot
    - terminator: CYC1_term