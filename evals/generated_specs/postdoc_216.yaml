construct:
  name: "E_coli_LMN_polycistronic_2A_F2A"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: L
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: L
              source: uniprot
    
    - cleavage_site: P2A
    
    - cistron:
        label: M
        expression: high
        fused: false
        gene:
          id: M
          source: uniprot
    
    - cleavage_site: F2A
    
    - cistron:
        label: N
        expression: high
        fused: false
        gene:
          id: N
          source: uniprot
    
    - terminator: rrnB_T1
