construct:
  name: protein_O_nuclear_localization_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_O_NLS_GFP
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: O
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
