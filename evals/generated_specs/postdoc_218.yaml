construct:
  name: "high_expression_protein_D_pUC"
  host: e_coli_bl21_de3

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
    # Note: SV40 ori is a mammalian replication origin and will not function in E. coli.
    # For extremely high copy number in bacteria, pUC (15-20 copies) is already optimal.
    # If mammalian co-expression is needed, use a separate dual-origin plasmid design.

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_D
        expression: high
        chain:
          - gene:
              id: D
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
