construct:
  name: "yeast_TetOn_E_F_coexpression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: pTet
      inducible: doxycycline

    - cistron:
        label: E
        expression: high
        chain:
          - tag: HA
          - gene:
              id: E
              source: uniprot

    - spacer: 20

    - ires: IRES_eukaryotic

    - cistron:
        label: F
        expression: high
        fused: false
        gene:
          id: F
          source: uniprot

    - terminator: rrnB_T1
