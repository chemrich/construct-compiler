construct:
  name: "bicistronic_protein_a_b_coexpression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: Protein_A
              source: uniprot
    - spacer: 30 # IRES is replaced by a prokaryotic spacer and RBS to enable polycistronic expression in E. coli
    - cistron:
        label: protein_b
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Protein_B
              source: uniprot
    - terminator: T7term