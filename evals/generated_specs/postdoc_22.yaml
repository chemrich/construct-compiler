construct:
  name: bicistronic_proteinA_proteinB
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: # Please specify UniProt ID for Protein A
              source: uniprot

    # Note: E. coli ribosomes cannot use IRES elements (eukaryotic mechanism)
    # Using spacer + separate RBS for prokaryotic bicistronic expression
    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: # Please specify UniProt ID for Protein B
              source: uniprot

    - terminator: rrnB_T1