construct:
  name: "bacterial_bicistronic_A_Myc_B_Strep"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Protein_A
        expression: high
        chain:
          - tag: HA
          - gene:
              id: proteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: Protein_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: proteinB
              source: uniprot

    - terminator: rrnB_T1
