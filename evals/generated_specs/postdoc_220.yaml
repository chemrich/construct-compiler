construct:
  name: "hGH_variant_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac
      # Note: CMV is a mammalian promoter and non-functional in E. coli.
      # Substituted with T7lac for strong prokaryotic expression in BL21.

    - cistron:
        label: hGH_variant
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01241
              source: uniprot

    - terminator: rrnB_T1
