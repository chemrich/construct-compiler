construct:
  name: "yeast_human_protein_A_B_coexpression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL4

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: HUMAN_PROTEIN_A
              source: uniprot
          - tag: HA

    - spacer: 25

    - cistron:
        label: IRES
        expression: medium
        fused: false
        gene:
          id: IRES_EMCV
          source: uniprot

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: HUMAN_PROTEIN_B
              source: uniprot

    - terminator: rrnB_T1
