construct:
  name: "human_receptor_secreted_yeast"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: receptor
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - tag: alpha-factor_signal
          - gene:
              id: human_receptor
              source: uniprot
              # Note: User should specify exact UniProt ID (e.g., P08069 for IL2RA)
              # Yeast will perform N-linked glycosylation at consensus sites (N-X-S/T)
              # similar to mammalian cells due to ER/Golgi processing

    - terminator: CYC1
