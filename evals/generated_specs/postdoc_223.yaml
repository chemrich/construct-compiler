construct:
  name: "E_coli_GFP_reporter"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # Substitution: hTERT is a mammalian promoter; T7lac substituted for high-level expression in E. coli.
    - cistron:
        label: reporter
        expression: high
        # Note: Kozak sequences are eukaryotic; an RBS is used here for bacterial translation.
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term