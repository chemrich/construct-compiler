construct:
  name: "hTERT_GFP_reporter"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # hTERT is a mammalian promoter; substituted T7lac for E. coli expression. Kozak sequences are mammalian-specific and not used in bacterial systems; bacterial RBS sequences are used instead by the compiler.
    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
