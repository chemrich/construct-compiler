construct:
  name: "viral_enzyme_GST_Myc"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: viral_enzyme
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: viral_enzyme
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
