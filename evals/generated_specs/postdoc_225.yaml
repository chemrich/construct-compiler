construct:
  name: "yeast_Tet-On_TF_rtTA"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: tetO_minimal
    
    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "human_transcription_factor"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: ADH1

    - cistron:
        label: rtTA
        expression: medium
        chain:
          - gene:
              id: "rtTA"
              source: uniprot
          - tag: V5

    - terminator: rrnB_T1
