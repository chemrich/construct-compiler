construct:
  name: human_fab_secreted_ecoli
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: fab_heavy_chain
        expression: high
        chain:
          - tag: pelB_signal_peptide  # E. coli-compatible secretion signal for periplasmic expression
          - cleavage_site: Furin
          - gene:
              id: human_fab_heavy
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: fab_light_chain
        expression: high
        fused: false
        chain:
          - tag: pelB_signal_peptide
          - gene:
              id: human_fab_light
              source: uniprot

    - terminator: rrnB_T1
