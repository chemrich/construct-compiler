construct:
  name: "human_fab_secretion_e_coli"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: pelB  # Substituted mammalian signal peptide with pelB for E. coli periplasmic translocation as requested
          - gene:
              id: P01834
              source: uniprot
    - spacer: 30
    - cistron:
        label: heavy_chain
        expression: high
        fused: false  # Independent translation for polycistronic assembly
        chain:
          - tag: pelB  # Substituted mammalian signal peptide with pelB for E. coli periplasmic translocation
          - cleavage_site: Furin  # Note: Furin is mammalian; cleavage in E. coli may require co-expression or in vitro processing
          - gene:
              id: P01857
              source: uniprot
          - tag: FLAG
    - terminator: T7term