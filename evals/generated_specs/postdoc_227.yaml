construct:
  name: yeast_membrane_protein_Xpress
  host: yeast

  backbone:
    resistance: G418
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1  # Strong yeast promoter (SV40 is mammalian; substituted with GAL1 for yeast)

    - cistron:
        label: membrane_protein
        expression: high
        chain:
          - tag: Xpress
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: YPL181W  # Example yeast membrane protein; substitute with your target
              source: uniprot

    - terminator: CYC1  # Yeast terminator
