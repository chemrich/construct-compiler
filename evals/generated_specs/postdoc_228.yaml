construct:
  name: "dual_peptide_P2A_coexpression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: peptide_1
              source: custom

    - cistron:
        label: P2A_peptide_2
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A_peptide_2_fusion
              source: custom
          # Note: P2A self-cleaving peptide is included as part of the construct
          # but E. coli lacks the post-translational machinery for efficient P2A cleavage.
          # Consider using a TEV cleavage site or GST-tag for in vitro cleavage instead.
          - tag: 6xHis

    - terminator: rrnB_T1
