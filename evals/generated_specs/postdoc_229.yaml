construct:
  name: secreted_luciferase_GFP_reporter
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: secreted_luciferase_GFP
        expression: high
        chain:
          - tag: signal_peptide_mammalian
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
