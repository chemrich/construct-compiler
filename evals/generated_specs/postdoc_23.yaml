construct:
  name: "mammalian_GFP_V5_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: GFP_V5
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: V5

    - terminator: rrnB_T1
