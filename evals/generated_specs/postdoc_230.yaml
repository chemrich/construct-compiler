construct:
  name: "yeast_MBP_protein_His_crystallography"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Strong constitutive yeast promoter (EF1alpha is mammalian; using GAL1 for yeast instead)

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: 3C  # 3C protease is similar to Prescission in specificity
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
