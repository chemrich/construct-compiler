construct:
  name: "NLS_mCherry_Ecoli_Constitutive"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: nls_mcherry_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1 # SV40 polyA substituted with rrnB_T1 because SV40 polyA is a mammalian termination signal and is not functional in E. coli.