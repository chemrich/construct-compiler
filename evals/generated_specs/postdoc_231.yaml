construct:
  name: "NLS_mCherry_reporter"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: NLS_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
