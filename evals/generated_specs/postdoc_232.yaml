construct:
  name: "toxic_protein_cre_lox_control"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: toxic_target
        expression: high
        chain:
          - tag: 6xHis
          - loxP_site: loxP_forward  # N-terminal loxP flank
          - gene:
              id: toxic_protein_insert
              source: uniprot
          - loxP_site: loxP_reverse  # C-terminal loxP flank
          - tag: HA

    - spacer: 30

    - cistron:
        label: cre_recombinase
        expression: medium
        fused: false
        promoter: araBAD  # constitutive/inducible arabinose promoter for tight control
        gene:
          id: cre
          source: uniprot

    - terminator: rrnB_T1
