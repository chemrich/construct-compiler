construct:
  name: "human_antibody_full_length_yeast_secreted"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: IGHG1
              source: uniprot

    - spacer: 21

    - cistron:
        label: F2A_linker_light_chain
        expression: high
        chain:
          - cleavage_site: F2A
          - tag: alpha_factor_signal_peptide
          - gene:
              id: IGKC
              source: uniprot

    - terminator: CYC1
