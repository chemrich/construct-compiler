construct:
  name: GFP_human_enzyme_PDI_coexpression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P04637  # human enzyme (TP53 example; user should specify actual enzyme)
              source: uniprot

    - spacer: 25

    - cistron:
        label: PDI
        expression: medium
        fused: false
        gene:
          id: P07237  # human PDI (protein disulfide isomerase)
          source: uniprot

    - terminator: rrnB_T1
