construct:
  name: bicistronic_ProteinX_ProteinY_2A
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: ProteinX
              source: uniprot

    - cistron:
        label: 2A_peptide
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - cistron:
        label: ProteinY
        expression: high
        chain:
          - gene:
              id: ProteinY
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
