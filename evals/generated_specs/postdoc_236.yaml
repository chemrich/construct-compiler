construct:
  name: "yeast_protein_V5_BirA_CMV_enhancer"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
    
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: YFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: V5
          - linker:
              type: short_GS
              repeats: 1
          - sequence: GGAGGTGGT  # BirA recognition site (biotin ligase substrate)

    - terminator: rrnB_T1
