construct:
  name: "E_coli_human_kinase_SUMO_ubiquitin"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: kinase_construct
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: Ubiquitin
          - gene:
              id: "human_kinase"
              source: uniprot
    
    - terminator: T7term
