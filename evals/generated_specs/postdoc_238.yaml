construct:
  name: human_GPCR_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GPCR
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GPCR
              source: uniprot
          - tag: KDEL

    - terminator: rrnB_T1
