construct:
  name: "E_coli_HTS_peptide_His_SpyTag"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: screening_peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: custom_peptide
              source: uniprot
          - tag: SpyTag
    
    - terminator: rrnB_T1
