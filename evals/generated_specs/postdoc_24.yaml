construct:
  name: cytoplasmic_enzyme_with_KDEL
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - gene:
              id: # Please specify the enzyme you want to express
              source: uniprot
          - tag: KDEL  # Note: KDEL is an ER retention signal for mammalian cells, not functional in E. coli cytoplasm

    - terminator: rrnB_T1