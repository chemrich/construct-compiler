construct:
  name: yeast_secretion_construct
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: YFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
