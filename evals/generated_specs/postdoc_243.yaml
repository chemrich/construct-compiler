construct:
  name: "yeast_tet_on_strep_protein"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: tTA  # tetracycline-controlled transactivator; S. cerevisiae Tet-On equivalent

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: tTA
              source: uniprot

    - terminator: CYC1
