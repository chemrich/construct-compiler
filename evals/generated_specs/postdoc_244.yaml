construct:
  name: "GST_TEV_fusion_high_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
    
    - terminator: rrnB_T1
