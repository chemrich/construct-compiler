construct:
  name: human_GPCR_yeast_PM_localization
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GPCR
        expression: high
        chain:
          - tag: N_myristoylation
          - gene:
              id: GPCR
              source: uniprot
          - tag: FLAG

    - terminator: CYC1
