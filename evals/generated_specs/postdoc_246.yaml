construct:
  name: "tandem_purification_p53_high_copy"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: 3C
          - tag: Myc
          - gene:
              id: P53_HUMAN
              source: uniprot
    - terminator: T7term