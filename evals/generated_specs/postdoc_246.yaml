construct:
  name: tandem_purification_His_SUMO_Myc
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: 3C
          - tag: Myc
          - gene:
              id: ""
              source: uniprot

    - terminator: rrnB_T1
