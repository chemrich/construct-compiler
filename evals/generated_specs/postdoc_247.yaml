construct:
  name: "yeast_constitutive_gfp_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3 # Substituted strong constitutive yeast promoter TDH3 for CMV, which is mammalian.
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1_term # Standard yeast terminator.