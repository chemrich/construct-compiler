construct:
  name: yeast_gfp_reporter
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1  # Constitutive promoter in yeast (TEF1 is the yeast equivalent of CMV)

    - cistron:
        label: gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1  # Standard yeast terminator
