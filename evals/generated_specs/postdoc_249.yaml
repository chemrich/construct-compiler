construct:
  name: yeast_two_protein_interaction_test
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: YFP
              source: fpbase

    - terminator: CYC1

  cassette:
    - promoter: ADH1

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
