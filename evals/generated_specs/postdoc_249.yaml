construct:
  name: yeast_dual_constitutive_coexpression
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: bait_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_A
              source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: prey_protein
        expression: high
        chain:
          - tag: HA
          - gene:
              id: protein_B
              source: uniprot
    - terminator: ADH1