construct:
  name: human_receptor_yeast_expression
  host: yeast

  backbone:
    resistance: neomycin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: human_receptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: NR3C1
              source: uniprot

    - terminator: CYC1
