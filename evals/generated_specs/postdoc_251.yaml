construct:
  name: "yeast_Cas9_sgRNA"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      
    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: rrnB_T1

    - promoter: SNR52
      
    - cistron:
        label: sgRNA
        expression: high
        gene:
          id: sgRNA_target
          source: uniprot

    - terminator: rrnB_T1
