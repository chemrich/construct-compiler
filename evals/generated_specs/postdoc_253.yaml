construct:
  name: "yeast_autophagy_reporter_mCherry_GFP"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: autophagy_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
