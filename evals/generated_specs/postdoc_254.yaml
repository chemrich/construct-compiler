construct:
  name: "ivt_screening_high_expression"
  host: in_vitro
  backbone:
    # A backbone is required for a valid spec; using pUC/Kanamycin as a standard template
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
    - terminator: T7term