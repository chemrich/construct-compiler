construct:
  name: "biofilm_reporter_lacz"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: csgD  # csgD promoter is a key regulator for biofilm formation induction in E. coli
    - cistron:
        label: lacZ_reporter
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1