construct:
  name: metabolic_pathway_five_enzymes
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: HA
          - gene:
              id: enzyme1
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: enzyme2
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme3
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: enzyme3
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme4
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: enzyme4
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme5
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: enzyme5
              source: uniprot

    - terminator: rrnB_T1
