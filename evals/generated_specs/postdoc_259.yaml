construct:
  name: "yeast_Fab_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Fab
        expression: high
        chain:
          - gene:
              id: Fab
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Myc

    - terminator: rrnB_T1
