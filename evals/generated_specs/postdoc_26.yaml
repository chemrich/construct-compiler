construct:
  name: "human_albumin_secretion_ecoli"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: cytokine_target
        expression: high
        chain:
          - tag: PelB  # Substituted PelB for the human albumin signal peptide to ensure functional secretion in E. coli per rule 18.
          - gene:
              id: ALB
              source: uniprot
    - terminator: T7term