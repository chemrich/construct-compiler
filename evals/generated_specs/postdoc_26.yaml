construct:
  name: "cytokine_secretion_ecoli"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: secreted_cytokine
        expression: high
        chain:
          - tag: human_albumin_signal_peptide
          - gene:
              id: cytokine
              source: uniprot
    
    - terminator: rrnB_T1
