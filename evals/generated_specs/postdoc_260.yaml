construct:
  name: "dual_protein_expression_AB"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # Note: IRES sequences are not functional in E. coli prokaryotic translation.
      # Substituting with a standard RBS spacer between cistrons for proper polycistronic expression.
      # For true dual independent translation in E. coli, each cistron gets its own RBS via the spacer element.

    - cistron:
        label: Protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProtA
              source: uniprot

    - spacer: 30

    - cistron:
        label: Protein_B
        expression: high
        fused: false
        gene:
          id: ProtB
          source: uniprot

    - terminator: rrnB_T1
