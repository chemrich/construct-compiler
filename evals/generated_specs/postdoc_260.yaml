construct:
  name: "protein_a_b_coexpression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100  # Substituted mammalian constitutive promoter with strong bacterial constitutive promoter J23100
    - cistron:
        label: protein_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_A
              source: uniprot
    - spacer: 30  # Substituted mammalian IRES with a 30bp spacer; IRES sequences do not function in E. coli for translation initiation
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: Protein_B
          source: uniprot
    - terminator: rrnB_T1