construct:
  name: "Cytokine_X_Yeast_Secretion"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # High-constitutive yeast promoter (GPD)
    - cistron:
        label: target
        expression: high
        chain:
          - tag: mammalian_signal_peptide
          - gene:
              id: Cytokine_X
              source: uniprot
          - tag: FLAG
    - terminator: CYC1