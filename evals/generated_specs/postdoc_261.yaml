construct:
  name: yeast_cytokine_x_secretion
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: cytokine_x_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: cytokine_x
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
