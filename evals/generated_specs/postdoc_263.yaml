construct:
  name: "VP1_P2A_ChapC_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: VP1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: VP1
              source: uniprot

    # P2A self-cleaving peptide for polycistronic expression
    - spacer: 51  # P2A sequence is ~51 bp

    - cistron:
        label: ChapC
        expression: high
        fused: false
        gene:
          id: Chaperone_C
          source: uniprot

    - terminator: rrnB_T1
