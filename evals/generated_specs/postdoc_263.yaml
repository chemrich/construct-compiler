        label: vp1_p2a_chaperone
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: VP1
              source: uniprot
          - linker:
              type: P2A
              repeats: 1
          - gene:
              id: Chaperone_C
              source: uniprot
    - terminator: CYC1