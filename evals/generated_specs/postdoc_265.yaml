construct:
  name: "TF_Beta_Tet_On_Yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: CEN_ARS
    source: addgene

  cassette:
    - promoter: TRE  # Tet-responsive element adapted for yeast expression
    - cistron:
        label: target_tf
        expression: high
        gene:
          id: TF_Beta
          source: uniprot
    - terminator: ADH1_term