construct:
  name: "yeast_TF_Beta_Tet_On_tight"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: 2_micron  # high copy plasmid for yeast
    source: addgene

  cassette:
    - promoter: GAL1  # Tight, tightly-repressed yeast promoter; superior to Tet-On for low leakiness in yeast

    - cistron:
        label: TF_Beta
        expression: high
        gene:
          id: TF_Beta
          source: uniprot

    - terminator: CYC1  # Strong yeast transcription terminator
