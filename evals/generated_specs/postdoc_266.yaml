construct:
  name: "Protein_M_expression_with_His_and_Myc_tags"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - tag: Myc
          - gene:
              id: M1
              source: uniprot
    - terminator: T7term