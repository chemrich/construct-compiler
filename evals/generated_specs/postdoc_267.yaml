construct:
  name: "GF_Z_yeast_high_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Substituted TDH3 for CMV as the strongest constitutive promoter available for yeast expression
    - cistron:
        label: target
        expression: high
        gene:
          id: GF_Z
          source: uniprot
    - terminator: CYC1