construct:
  name: "yeast_GFZ_high_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Strongest inducible promoter in yeast; for constitutive use PGK1
    
    - cistron:
        label: growth_factor_z
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: KEX2  # Yeast-native protease for N-terminal processing
          - tag: alpha_factor_secretion  # Yeast alpha-factor secretion signal for export
          - gene:
              id: GF_Z
              source: uniprot  # Mammalian GF Z will be codon-optimized for yeast by compiler

    - terminator: CYC1  # Yeast transcription terminator
