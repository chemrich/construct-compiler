construct:
  name: "Receptor_Frag_periplasmic_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: receptor_fragment
        expression: high
        chain:
          - tag: pelB_signal  # E. coli-optimized periplasmic signal peptide; mammalian signal peptides are not reliably cleaved in E. coli
          - gene:
              id: "Receptor_Frag"
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
