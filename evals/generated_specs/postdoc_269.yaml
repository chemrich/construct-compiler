construct:
  name: "dual_protein_X_Y_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_X
              source: uniprot

    # Note: IRES is not natively functional in S. cerevisiae (eukaryotic ribosome scanning model).
    # Using separate RBS-independent translation via 2A self-cleaving peptide instead.
    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: rrnB_T1
