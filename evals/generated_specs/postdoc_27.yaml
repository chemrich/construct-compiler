construct:
  name: "t7_mammalian_low_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: T7 # Note: T7 promoter in mammalian cells typically requires co-expression of T7 RNA polymerase.
    - cistron:
        label: "ha_tagged_protein"
        expression: low
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term