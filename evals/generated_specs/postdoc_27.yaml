construct:
  name: T7_promoter_mammalian_low_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: T7  # Note: T7 promoter will have minimal activity in mammalian cells without T7 RNA polymerase

    - cistron:
        label: target
        expression: very_low
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1