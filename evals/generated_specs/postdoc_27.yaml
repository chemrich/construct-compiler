construct:
  name: "mammalian_T7_driven_expression"
  host: HEK293
  
  backbone:
    catalog_vector: "pTwist CMV"
  
  cassette:
    # T7 promoter included for potential basal activity or co-expression with T7 RNAP
    # Note: T7 is bacterial; in mammalian cells it requires co-expressed T7 polymerase
    - promoter: T7
    
    - cistron:
        label: target
        expression: very_low
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
