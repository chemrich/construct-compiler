construct:
  name: "ecoli_pBAD_eGFP_reporter"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: eGFP
              source: fpbase
    
    - terminator: rrnB_T1
