construct:
  name: "araBAD_eGFP_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: reporter
        expression: high
        gene:
          id: eGFP
          source: fpbase
    - terminator: rrnB_T1