construct:
  name: "GST_TEV_ProteinP_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: ProteinP
              source: uniprot
              codon_optimization: yeast

    - terminator: rrnB_T1
