construct:
  name: "mammalian_tm_protein_e_coli_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strongest constitutive promoter for E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TM_Protein
              source: uniprot
    - terminator: rrnB_T1