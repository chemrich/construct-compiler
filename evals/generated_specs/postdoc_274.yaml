construct:
  name: "divergent_dual_expression_R_S"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_R
              source: uniprot

    - terminator: rrnB_T1

    # Note: True bi-directional promoter divergent expression from a single central region
    # is not natively supported in the construct_compiler schema. This design shows
    # sequential expression on the same strand. For true divergent/opposite-strand expression
    # in E. coli, consider using two separate compatible replicons or manual cloning.

    - promoter: T7lac

    - cistron:
        label: protein_S
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_S
              source: uniprot

    - terminator: rrnB_T1
