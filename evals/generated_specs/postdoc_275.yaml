construct:
  name: "yeast_secreted_domain_A_domain_B"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: domain_A
        expression: high
        chain:
          - tag: mammalian_signal_peptide_1
          - gene:
              id: domain_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: domain_B
        expression: high
        fused: false
        chain:
          - tag: mammalian_signal_peptide_2
          - gene:
              id: domain_B
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
