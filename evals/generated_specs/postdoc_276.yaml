construct:
  name: "Protein_L_solubility_optimization"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # Selected lacUV5 for lower expression levels to improve solubility
    - cistron:
        label: target
        expression: low
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: Protein_L
              source: uniprot
    - terminator: rrnB_T1