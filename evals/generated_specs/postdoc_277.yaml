construct:
  name: "protein_n_high_purity_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GPD  # Strong constitutive yeast promoter (TDH3)
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: Protein_N
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1