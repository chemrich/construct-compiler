construct:
  name: "yeast_ProteinN_dual_tag_purification"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinN
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinN
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
