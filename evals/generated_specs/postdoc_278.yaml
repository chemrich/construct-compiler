construct:
  name: Peptide_T_GST_fusion
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: peptide_t
              source: uniprot

    - terminator: rrnB_T1
