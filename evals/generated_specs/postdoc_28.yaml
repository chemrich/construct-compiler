construct:
  name: "nuclear_lacI_yeast_expression"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: nuclear_target
        expression: high
        chain:
          - tag: NLS
          - tag: Myc
          - gene:
              id: lacI
              source: uniprot
    - terminator: CYC1