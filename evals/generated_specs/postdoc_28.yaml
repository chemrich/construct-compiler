construct:
  name: "bacterial_DBP_yeast_nuclear_localization"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
          - gene:
              id: bacterial_DBP
              source: uniprot

    - terminator: CYC1
