construct:
  name: "yeast_protein_Y_secreted_strep"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_Y
        expression: high
        chain:
          - tag: Strep-II
          - secretion_signal: alpha-factor
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: CYC1_poly_A
