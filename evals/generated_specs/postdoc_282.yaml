construct:
  name: "coexpression_GST_ProteinA_ProteinB"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        gene:
          id: ProteinB
          source: uniprot

    - terminator: rrnB_T1
