construct:
  name: "protein_a_b_coexpression_operon"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: Protein_A
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false
        gene:
          id: Protein_B
          source: uniprot
    - terminator: T7term