construct:
  name: "E_F_coIP_construct"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_E
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_E
              source: uniprot
    
    - spacer: 30
    
    # Note: IRES elements do not function in E. coli prokaryotic systems.
    # Using a ribosome binding site (RBS) instead for independent translation of protein F.
    - cistron:
        label: protein_F
        expression: high
        fused: false
        gene:
          id: protein_F
          source: uniprot
    
    - terminator: rrnB_T1
