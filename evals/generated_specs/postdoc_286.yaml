construct:
  name: "protein_G_myc_inducible_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_G
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: protein_G
              source: uniprot

    - terminator: CYC1
