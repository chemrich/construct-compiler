construct:
  name: "protein_g_inducible_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1 # GAL1 is a standard galactose-inducible promoter for yeast
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: P06654
              source: uniprot
    - terminator: CYC1 # CYC1 is a standard terminator for S. cerevisiae