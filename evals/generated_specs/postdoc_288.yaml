construct:
  name: "mitochondrial_protein_I_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_I_mitochondrial
        expression: high
        chain:
          - tag: HA
          - mitochondrial_targeting_sequence: cox4_mts
          - gene:
              id: protein_I
              source: uniprot

    - terminator: CYC1_terminator
