construct:
  name: his_tagged_protein_with_furin_cleavage
  host: e_coli_bl21_de3
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Furin  # RXRR motif, cleaves after basic residues
          - gene:
              id: # specify your target gene
              source: uniprot
    
    - terminator: rrnB_T1