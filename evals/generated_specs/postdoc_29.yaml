construct:
  name: "his_furin_cleavable_target"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
      cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Furin  # Furin cleavage site (R-X-K/R-R) for in vitro processing after purification
          - gene:
              id: mEGFP
              source: fpbase
      terminator: T7term