construct:
  name: "yeast_secreted_K_intracellular_L"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: K_secreted
        expression: high
        chain:
          - tag: Strep-II
          - secretion_signal: alpha-factor
          - gene:
              id: K
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - cistron:
        label: L_intracellular
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: L
              source: uniprot

    - terminator: CYC1
