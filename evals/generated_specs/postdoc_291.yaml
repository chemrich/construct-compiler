construct:
  name: "E_coli_M_His_tag"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: M_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: M
              source: uniprot

    - terminator: rrnB_T1
