construct:
  name: "P_Q_P2A_yeast_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: P
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P
              source: uniprot

    - cistron:
        label: P2A_peptide
        expression: high
        chain:
          - gene:
              id: P2A
              source: uniprot
        fused: false

    - cistron:
        label: Q
        expression: high
        chain:
          - gene:
              id: Q
              source: uniprot
        fused: false

    - terminator: CYC1
