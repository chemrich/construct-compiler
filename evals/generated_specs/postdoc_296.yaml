construct:
  name: "protein_S_yeast_expression"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Standard constitutive yeast promoter
    - cistron:
        label: protein_S
        gene:
          id: P0DTC2  # SARS-CoV-2 Spike (Protein S), a well-known transmembrane protein
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator