construct:
  name: "mammalian_triple_expression_plasmid"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_X
              source: uniprot

    - terminator: SV40_poly_A

    - promoter: SV40

    - cistron:
        label: protein_Y
        expression: medium
        chain:
          - tag: V5
          - gene:
              id: protein_Y
              source: uniprot

    - terminator: SV40_poly_A

    - promoter: EF1_alpha

    - cistron:
        label: PuroR
        expression: high
        gene:
          id: PuroR
          source: uniprot

    - terminator: SV40_poly_A
