construct:
  name: "mammalian_triple_expression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_x
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: Protein_X
              source: uniprot
    - terminator: bgh_polyA
    - promoter: SV40
    - cistron:
        label: protein_y
        expression: medium
        chain:
          - tag: V5
          - gene:
              id: Protein_Y
              source: uniprot
    - terminator: sv40_polyA
    - promoter: EF1_alpha
    - cistron:
        label: selectable_marker
        expression: medium
        gene:
          id: PuroR
          source: uniprot
    - terminator: hGH_polyA