construct:
  name: "high_throughput_GFP_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    
    - terminator: rrnB_T1
