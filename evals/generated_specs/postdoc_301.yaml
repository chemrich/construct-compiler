    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Mammalian promoter substituted with strong yeast TEF1 promoter for host compatibility
    - cistron:
        label: hGH_secretion
        expression: high
        chain:
          - gene:
              id: P01241
              source: uniprot
    - terminator: CYC1_term