construct:
  name: "dual_protein_strep_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: protein_B
              source: uniprot

    - terminator: CYC1
