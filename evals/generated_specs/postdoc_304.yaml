construct:
  name: "KillerProtein_Low_Constitutive"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106  # Substituted mammalian promoter with low-strength constitutive E. coli promoter as mammalian promoters are non-functional in E. coli.
    - cistron:
        label: target
        expression: low
        gene:
          id: KillerProtein
          source: uniprot
    - terminator: rrnB_T1