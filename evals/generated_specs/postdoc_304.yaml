construct:
  name: "KillerProtein_low_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5  # Weaker than T7/T7lac; provides low basal expression without induction
    
    - cistron:
        label: KillerProtein
        expression: very_low
        gene:
          id: KillerProtein
          source: uniprot
    
    - terminator: rrnB_T1