construct:
  name: "MBP_TEV_fusion_enzyme"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: bacterial_enzyme
              source: uniprot
    - terminator: rrnB_T1