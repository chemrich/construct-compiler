construct:
  name: "MBP_fusion_TEV_cleavable"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: MBP_enzyme_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: your_enzyme_id  # Replace with actual UniProt ID or gene name
              source: uniprot
    
    - terminator: rrnB_T1
