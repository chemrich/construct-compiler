construct:
  name: human_antibody_fragment_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - gene:
              id: human_antibody_fragment
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
