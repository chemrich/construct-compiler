construct:
  name: "mammalian_tf_yeast_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      # Note: CMV is a mammalian promoter; using GAL1 (strong, inducible yeast promoter) instead
      # User's Kozak sequence will be placed before start codon during compilation

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: transcription_factor
              source: uniprot

    - terminator: rrnB_T1
