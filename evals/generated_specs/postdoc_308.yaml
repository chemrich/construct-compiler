construct:
  name: "triple_peptide_high_expression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: peptide_copy_1
              source: uniprot

    - spacer: 20

    - cistron:
        label: peptide_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: peptide_copy_2
              source: uniprot

    - spacer: 20

    - cistron:
        label: peptide_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: peptide_copy_3
              source: uniprot

    - terminator: rrnB_T1
