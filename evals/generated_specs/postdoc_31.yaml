construct:
  name: mammalian_protein_GST_fusion_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: PRNP  # example mammalian protein - replace with actual target
              source: uniprot

    - terminator: CYC1