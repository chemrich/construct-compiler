construct:
  name: "GST_fusion_insoluble_mammalian_protein_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GST_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: insoluble_mammalian_protein
              source: uniprot

    - terminator: T7term
