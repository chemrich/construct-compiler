construct:
  name: E_coli_XYZ_operon_IRES_Myc
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: gene_X
        expression: high
        chain:
          - gene:
              id: X
              source: uniprot
          - tag: Myc
    
    - spacer: 30
    
    - cistron:
        label: gene_Y
        expression: high
        fused: false
        chain:
          - gene:
              id: Y
              source: uniprot
          - tag: Myc
    
    - spacer: 30
    
    - cistron:
        label: gene_Z
        expression: high
        fused: false
        chain:
          - gene:
              id: Z
              source: uniprot
          - tag: Myc
    
    - terminator: rrnB_T1
