construct:
  name: "E_coli_XYZ_operon_with_Myc_tags"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_X
        chain:
          - gene:
              id: X
              source: uniprot
          - tag: Myc
    - spacer: 30  # IRES is a eukaryotic element; using 30bp spacer with fused:false for E. coli operon translation
    - cistron:
        label: gene_Y
        fused: false
        chain:
          - gene:
              id: Y
              source: uniprot
          - tag: Myc
    - spacer: 30
    - cistron:
        label: gene_Z
        fused: false
        chain:
          - gene:
              id: Z
              source: uniprot
          - tag: Myc
    - terminator: rrnB_T1