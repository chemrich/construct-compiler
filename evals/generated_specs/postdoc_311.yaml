construct:
  name: "codon_optimized_human_gene_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        codon_optimization:
          organism: e_coli
          bias: balanced_mammalian
          description: "Optimized for E. coli expression with preference for codons common in highly expressed mammalian genes to maintain balanced tRNA usage"
        chain:
          - tag: 6xHis
          - gene:
              id: human_gene
              source: uniprot

    - terminator: rrnB_T1
