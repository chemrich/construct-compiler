construct:
  name: "yeast_reporter_v5"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: V5
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
