construct:
  name: "yeast_v5_reporter_construct"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted strong yeast promoter; mammalian/eukaryotic promoters are generally not cross-functional with yeast.
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: V5
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term  # Standard yeast-specific terminator for proper polyadenylation.