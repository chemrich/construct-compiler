construct:
  name: "yeast_mitochondrial_targeted_mEGFP"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: pGPD
    - cistron:
        label: mitochondrial_target
        expression: high
        chain:
          - tag: MTS  # Native mammalian mitochondrial targeting sequence
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term