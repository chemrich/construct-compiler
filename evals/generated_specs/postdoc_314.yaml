construct:
  name: "mammalian_protein_yeast_mitochondrial_targeting"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: null
              # NOTE: User requesting mammalian mitochondrial targeting sequence (MTS) in S. cerevisiae.
              # Mammalian MTS are NOT reliably recognized by yeast mitochondrial import machinery.
              # For optimal mitochondrial localization in yeast, recommend using yeast-specific MTS
              # (e.g., from COX4, CYT1, or other nuclear-encoded yeast mitochondrial proteins).
              # Mammalian MTS may cause mislocalization or protein aggregation.
              # Consider substituting with a characterized yeast MTS if expression is poor.

    - terminator: rrnB_T1
