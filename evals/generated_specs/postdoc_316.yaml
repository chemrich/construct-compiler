construct:
  name: "protein_x_y_fusion_flag"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: Protein_X
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Protein_Y
              source: uniprot
          - tag: FLAG
    - terminator: T7term