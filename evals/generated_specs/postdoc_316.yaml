construct:
  name: ProteinX_ProteinY_fusion
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ProteinY
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
