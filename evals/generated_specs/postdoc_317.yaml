construct:
  name: mammalian_complex_with_chaperones
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: pET-28b(+)
    resistance: kanamycin

  cassette:
    - promoter: T7

    - cistron:
        label: complex_protein_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0DMV8
              source: uniprot

    - spacer: 25

    - cistron:
        label: complex_protein_2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: P63104
              source: uniprot

    - spacer: 25

    - cistron:
        label: complex_protein_3
        expression: high
        fused: false
        chain:
          - tag: Myc
          - gene:
              id: P12931
              source: uniprot

    - spacer: 25

    - cistron:
        label: complex_protein_4
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: P04637
              source: uniprot

    - spacer: 25

    - cistron:
        label: Hsp70
        expression: high
        fused: false
        gene:
          id: P08107
          source: uniprot

    - spacer: 25

    - cistron:
        label: Hsp90
        expression: high
        fused: false
        gene:
          id: P07900
          source: uniprot

    - terminator: rrnB_T1
