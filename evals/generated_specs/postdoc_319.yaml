construct:
  name: e_coli_high_copy_c_terminal_his
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC # Substituted pUC for SV40; SV40 is a mammalian origin, while pUC provides high-copy replication in E. coli.
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
    - terminator: T7term