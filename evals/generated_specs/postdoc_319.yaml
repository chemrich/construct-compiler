construct:
  name: "high_copy_ecoli_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC  # High-copy E. coli ori; SV40 is mammalian-specific, substituted with pUC for E. coli high-copy replication
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: generic_insert
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
    - terminator: rrnB_T1