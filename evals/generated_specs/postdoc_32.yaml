construct:
  name: gene_with_strep_and_bgh_polya
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: your_gene_id  # Replace with actual gene ID
              source: uniprot   # Replace with appropriate source
          - tag: Strep-II

    # Note: BGH polyA won't function in E. coli - using rrnB_T1 terminator instead
    - terminator: rrnB_T1