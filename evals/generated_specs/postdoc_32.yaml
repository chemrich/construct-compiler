construct:
  name: "ecoli_strep_bgh_polya"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: null
              # User to supply gene ID
          - tag: Strep-II

    # Note: BGH polyA signals are mammalian-specific and have no functional
    # effect in E. coli. For mRNA stability in E. coli, use bacterial
    # terminators (rrnB_T1, T7term) instead. BGH polyA will be transcribed
    # but not processed by bacterial ribosomes. Including it anyway as requested.
    - terminator: rrnB_T1
