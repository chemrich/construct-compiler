construct:
  name: "e_coli_strep_tagged_target"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: Strep-II
    - terminator: rrnB_T1 # User requested BGH polyA, which is a mammalian signal; substituted with rrnB_T1 for efficient transcriptional termination in E. coli.