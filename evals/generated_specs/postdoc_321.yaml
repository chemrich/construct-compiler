construct:
  name: human_growth_factor_secreted_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - signal_peptide: mammalian_native
          - gene:
              id: human_growth_factor
              source: uniprot
          - tag: FLAG

    - terminator: CYC1
