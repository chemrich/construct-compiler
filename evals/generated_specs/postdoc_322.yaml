construct:
  name: "HEK293T_membrane_protein_GFP_StrepTag"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: membrane_protein
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: YFP  # placeholder - replace with your actual membrane protein ID
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40poly
