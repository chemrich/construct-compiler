construct:
  name: GroEL_GroES_dual_expression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GroEL
        expression: high
        chain:
          - tag: Twin-Strep
          - gene:
              id: groEL
              source: uniprot

    - spacer: 30

    - cistron:
        label: GroES
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: groES
              source: uniprot

    - terminator: rrnB_T1
