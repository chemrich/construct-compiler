construct:
  name: "human_enzyme_yeast_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - gene:
              id: human_enzyme
              source: uniprot

    - terminator: rrnB_T1
