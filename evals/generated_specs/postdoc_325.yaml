construct:
  name: "human_glycoprotein_glycosylation_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_glycoprotein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01588 # Human Erythropoietin (EPO) used as a model human glycoprotein
              source: uniprot
    - spacer: 30
    - cistron:
        label: glycosylation_machinery
        expression: medium
        fused: false # Expressed as a separate protein to modify the target in trans
        gene:
          id: P0C1B0 # Campylobacter jejuni PglB, the oligosaccharyltransferase required for N-glycosylation in E. coli
          source: uniprot
    - terminator: T7term