construct:
  name: "human_glycoprotein_nglyc_ecolibgl21"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: glycoprotein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "human_glycoprotein"
              source: uniprot

    - cistron:
        label: nglycan_machinery
        expression: medium
        fused: false
        chain:
          - gene:
              id: "pglB"
              source: uniprot

    - terminator: rrnB_T1
