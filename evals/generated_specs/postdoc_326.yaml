construct:
  name: "antibody_fragment_Fc_CHO_secreted"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_Fc
        expression: high
        chain:
          - signal_peptide: albumin_signal
          - gene:
              id: antibody_fragment
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: human_Fc
              source: uniprot

    - terminator: WPRE
