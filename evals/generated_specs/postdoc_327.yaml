construct:
  name: "dual_protein_X_Y_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: X
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - gene:
              id: Y
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
