construct:
  name: "mammalian_optimized_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_gene
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
