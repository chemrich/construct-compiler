construct:
  name: yeast_his_tp53_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD # CMV is mammalian; substituted with GPD (TDH3) for strong constitutive expression in yeast
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P04637
              source: uniprot
    - terminator: CYC1_term