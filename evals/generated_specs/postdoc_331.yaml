construct:
  name: human_gene_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Strong constitutive yeast promoter (CMV is mammalian-specific; GAL1 is the yeast equivalent for strong constitutive expression)

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: human_gene
              source: uniprot

    - terminator: rrnB_T1
