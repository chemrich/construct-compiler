construct:
  name: "secreted_peptide_with_HA"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: prolactin_signal_peptide
          - gene:
              id: custom_peptide
              source: uniprot
          - tag: HA
    
    - terminator: rrnB_T1
