construct:
  name: "yeast_metabolic_pathway_E1E2E3"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: E1
        expression: high
        chain:
          - gene:
              id: E1
              source: uniprot
          - tag: Strep-II

    - spacer: 30

    - cistron:
        label: E2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: E2
              source: uniprot

    - spacer: 30

    - cistron:
        label: E3
        expression: high
        fused: false
        gene:
          id: E3
          source: uniprot

    - terminator: rrnB_T1
