construct:
  name: "HeLa_Protein_Alpha_Myc_IRES_Protein_Beta_HA"
  host: HeLa

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_Alpha
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: Protein_Alpha
              source: uniprot

    - spacer: 30

    - cistron:
        label: Protein_Beta
        expression: high
        fused: false
        chain:
          - gene:
              id: Protein_Beta
              source: uniprot
          - tag: HA

    - terminator: SV40_polyA
