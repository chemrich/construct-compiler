construct:
  name: "yeast_surface_display_aga2p_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GLP1
              source: uniprot
          - tag: FLAG
    - terminator: CYC1