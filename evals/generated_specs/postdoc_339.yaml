construct:
  name: "mammoth_protein_dual_tag_ecoli"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: mammoth
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mammoth_bacterial_protein
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
