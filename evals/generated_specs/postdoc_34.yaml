construct:
  name: "GFP_target_secreted_endosomal_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP_target_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target
              source: uniprot
          - tag: KDEL

    - terminator: CYC1
