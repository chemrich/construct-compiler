```yaml
construct:
  name: secreted_GFP_target_fusion
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: alpha_factor  # for secretion into media
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_protein  # replace with your actual target protein ID
              source: uniprot     # or appropriate source

    - terminator: CYC1
```