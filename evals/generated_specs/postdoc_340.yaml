construct:
  name: "yeast_human_GPCR_secreted"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_GPCR
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: GPCR_human
              source: uniprot
          - tag: HA

    - terminator: CYC1
