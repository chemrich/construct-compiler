construct:
  name: "ComplexAlpha_Beta_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ComplexAlpha
        expression: high
        chain:
          - signal_peptide: alpha_factor_secretion
          - gene:
              id: ComplexAlpha
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - element: IRES  # encodes IRES for cap-independent translation of second cistron

    - spacer: 30

    - cistron:
        label: ComplexBeta
        expression: high
        fused: false
        chain:
          - gene:
              id: ComplexBeta
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
