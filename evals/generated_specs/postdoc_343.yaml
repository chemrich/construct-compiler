construct:
  name: "phosphokinase_his_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PhosphoKinase
              source: uniprot
    - terminator: T7term
# E. coli lacks native machinery for site-specific Ser123 phosphorylation; successful phosphorylation may require co-expression of a specific kinase or use of a phosphomimetic mutation.