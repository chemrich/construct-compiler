construct:
  name: "yeast_secreted_therapy_peptide"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2mu
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_therapy
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: YeastTherapy
              source: uniprot
          - tag: HA
          - tag: KDEL
            # KDEL ensures proper ER retention/secretion pathway localization

    - terminator: CYC1
