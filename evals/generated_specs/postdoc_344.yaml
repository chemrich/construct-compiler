construct:
  name: "YeastTherapy_Secretory_Expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - secretion_signal: alpha_mating_factor
          - tag: HA
          - gene:
              id: YeastTherapy
              source: uniprot
    - terminator: CYC1