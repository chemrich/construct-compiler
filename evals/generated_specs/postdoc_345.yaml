construct:
  name: MyProtein_GFP_fusion
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
