construct:
  name: "yeast_tf_activator_overexpression"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TDH3 # Substituted CMV with TDH3 for strong constitutive expression in yeast
    - cistron:
        label: target
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: YeastTF_Activator
              source: uniprot
    - terminator: CYC1_term