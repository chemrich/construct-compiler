construct:
  name: "drosophila_cd8_flag_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: transmembrane_fusion
        expression: medium
        chain:
          - gene:
              id: "P01732" # Human CD8 alpha (Transmembrane domain source)
              source: uniprot
          - gene:
              id: "drosophila_protein" # Placeholder for specific Drosophila TM protein
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1