construct:
  name: "drosophila_tm_protein_with_cd8_tmd_flag"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CD8A_TMD
              source: uniprot
              description: "human CD8 alpha transmembrane domain"
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: drosophila_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    - terminator: rrnB_T1
