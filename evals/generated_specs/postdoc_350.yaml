construct:
  name: AggroProtein_Hsp70_coexpression
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: AggroProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AggroProtein
              source: uniprot

    - spacer: 30

    - cistron:
        label: Hsp70
        expression: high
        fused: false
        gene:
          id: HSPA1A
          source: uniprot

    - terminator: rrnB_T1
