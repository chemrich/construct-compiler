construct:
  name: UltraPureProtein_dual_tag
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: UltraPureProtein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: UltraPureProtein
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
