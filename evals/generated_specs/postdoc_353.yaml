construct:
  name: "Tet_On_ControlledProtein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: TRE  # Tet-responsive element (tetracycline-controlled)

    - cistron:
        label: ControlledProtein
        expression: high
        gene:
          id: ControlledProtein
          source: uniprot

    - terminator: SV40_polyA  # robust polyadenylation signal for mammalian cells
