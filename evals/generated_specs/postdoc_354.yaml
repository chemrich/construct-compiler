construct:
  name: "metabolic_pathway_ABC_complex"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeC
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeC
              source: uniprot

    - terminator: rrnB_T1
