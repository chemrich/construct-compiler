construct:
  name: metabolic_enzyme_complex_operon
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeB
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeC
              source: uniprot
    - terminator: T7term