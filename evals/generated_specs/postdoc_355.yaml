construct:
  name: "MitoTarget_yeast_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: MitoTarget
        expression: high
        chain:
          - tag: mitochondrial_targeting_sequence
          - gene:
              id: MitoTarget
              source: uniprot
          - tag: HA

    - terminator: CYC1_terminator
