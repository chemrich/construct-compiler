construct:
  name: GlycoEnzyme_secreted_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GlycoEnzyme
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: SP_IgG  # N-terminal secretion signal for mammalian ER targeting
          - gene:
              id: GlycoEnzyme
              source: uniprot

    - terminator: SV40polyA
