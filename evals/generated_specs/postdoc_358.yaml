construct:
  name: "MyYeastProtein_Cterm_FactorXa_6xHis"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: GPD  # Using standard yeast GPD (TDH3) promoter for high expression
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: "MyYeastProtein"
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: 6xHis
    - terminator: CYC1  # Standard yeast CYC1 terminator