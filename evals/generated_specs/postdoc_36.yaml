              source: uniprot
          - cleavage_site: P2A  # P2A self-cleaving peptide

    - cistron:
        label: protein_B
        expression: high
        fused: true  # Part of polycistronic transcript
        chain:
          - tag: Myc
          - gene:
              id: "protein_B"  # Replace with actual protein ID
              source: uniprot
          - cleavage_site: T2A  # T2A self-cleaving peptide

    - cistron:
        label: protein_C
        expression: high
        fused: true  # Part of polycistronic transcript
        chain:
          - tag: FLAG
          - gene:
              id: "protein_C"  # Replace with actual protein ID
              source: uniprot

    - terminator: BBa_B0015
