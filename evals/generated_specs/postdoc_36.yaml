construct:
  name: "mammalian_triprotein_P2A_T2A"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 22

    - cistron:
        label: P2A_cleavage
        expression: high
        fused: false
        chain:
          - tag: P2A
          - gene:
              id: protein_B
              source: uniprot
          - tag: Myc

    - spacer: 22

    - cistron:
        label: T2A_cleavage
        expression: high
        fused: false
        chain:
          - tag: T2A
          - gene:
              id: protein_C
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
