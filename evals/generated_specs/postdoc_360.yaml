construct:
  name: "mammalian_cytokine_ecoli_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_id_required
              source: uniprot
              # NOTE: E. coli lacks the mammalian secretory machinery (ER/Golgi).
              # A mammalian signal peptide alone will NOT enable secretion in E. coli.
              # For soluble cytoplasmic expression, remove the signal peptide.
              # For periplasmic export, use an OmpA or PelB signal peptide instead.
              # For inclusion bodies + refolding, no signal peptide is needed.

    - terminator: rrnB_T1
