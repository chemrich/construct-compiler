construct:
  name: "mammalian_glycoprotein_yeast_expression"
  host: yeast
  # NOTE: S. cerevisiae performs N-linked glycosylation at the consensus sequence N-X-S/T,
  # but adds high-mannose oligosaccharides (Man8-14GlcNAc2) rather than complex biantennary
  # glycans typical of mammalian cells. For mammalian-type glycosylation (bisected, fucosylated,
  # galactosylated structures), HEK293 or CHO mammalian cells are required. If yeast is necessary
  # for other reasons, consider engineered yeast strains (e.g., Pichia pastoris with humanized
  # glycosylation pathways) or post-translational enzymatic modification of yeast-produced protein.
  # This spec uses S. cerevisiae with a signal peptide for ER targeting and proper folding.

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: glycoprotein
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: alpha_factor  # ER targeting and signal peptidase cleavage in S. cerevisiae
          - gene:
              id: target_glycoprotein
              source: uniprot
        # Note: Ensure the target protein contains N-X-S/T consensus sequences for N-linked glycosylation.
        # Yeast-mediated glycosylation will occur at these sites but will differ from mammalian patterns.

    - terminator: rrnB_T1
