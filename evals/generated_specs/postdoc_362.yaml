construct:
  name: "high_yield_GFP_fusion_constitutive"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      # Note: CMV is a mammalian promoter and does not function in E. coli.
      # Substituted with J23100, a very strong constitutive promoter for prokaryotes.

    - cistron:
        label: GFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
