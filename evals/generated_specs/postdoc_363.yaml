construct:
  name: "triple_chaperone_mammalian_polycistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: chaperone_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: HSP70
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_chaperone_2
        expression: high
        chain:
          - gene:
              id: "P2A"
              source: uniprot
          - gene:
              id: HSP40
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_chaperone_3
        expression: high
        chain:
          - gene:
              id: "P2A"
              source: uniprot
          - gene:
              id: HSP90
              source: uniprot

    - terminator: rrnB_T1
