construct:
  name: "standard_his_tag_protein"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: your_protein_name
              source: uniprot

    - terminator: rrnB_T1
