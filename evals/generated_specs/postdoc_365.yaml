construct:
  name: "protein_MBP_fusion_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_protein
              source: uniprot

    - terminator: CYC1
