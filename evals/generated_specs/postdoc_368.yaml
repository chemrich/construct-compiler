construct:
  name: protein_ER_GFP_KDEL
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: ER_signal_peptide
          - gene:
              id: your_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
          - tag: KDEL

    - terminator: CYC1
