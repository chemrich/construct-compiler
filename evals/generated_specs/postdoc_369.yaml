construct:
  name: "TetOn_toxic_protein_ecoli"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tetA  # tetA (Tet-On) for tight, inducible control in E. coli
    
    - cistron:
        label: toxic_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: toxic_protein
              source: uniprot
    
    - terminator: rrnB_T1
