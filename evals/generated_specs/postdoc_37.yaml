construct:
  name: human_mito_protein_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: COX8_MTS  # mitochondrial targeting sequence from COX8
          - tag: Strep-II
          - gene:
              id: P12345  # replace with actual UniProt ID
              source: uniprot

    - terminator: rrnB_T1