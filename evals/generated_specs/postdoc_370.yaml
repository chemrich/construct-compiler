construct:
  name: "yeast_mitochondrial_targeting"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: mito_target
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term