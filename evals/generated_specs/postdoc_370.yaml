construct:
  name: "yeast_mitochondrial_protein"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: MTS  # Mitochondrial Targeting Sequence (N-terminal)
          - gene:
              id: YPR001C
              source: uniprot

    - terminator: rrnB_T1
