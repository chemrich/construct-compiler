I appreciate the context, but I need to clarify my role: I'm a tool to generate YAML specifications for genetic constructs. I don't perform codon optimization—that's a separate computational step handled by external tools (like IDT's codon optimization, Benchling, or JCAT).

**What I can do:**
- Generate a YAML spec for your construct with host set to `e_coli` (or another host)
- Reference genes by `id` and `source` (fpbase, uniprot, etc.)

**What happens next:**
- The `construct_compiler` tool reads this YAML
- You (or downstream automation) then run the sequences through a codon optimizer before synthesis

**To help you:** Please describe the genetic construct you'd like me to specify in YAML form. For example:
- What gene(s) do you want to express?
- What tags or modifications?
- E. coli or another host?
- Any special requirements (secretion, solubility, etc.)?

Once you provide those details, I'll output the YAML spec, and you can handle codon optimization as a separate step in your pipeline.