construct:
  name: "scFv_secreted_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: scFv_vh_vl
              source: uniprot
          - tag: His6

    - terminator: CYC1
