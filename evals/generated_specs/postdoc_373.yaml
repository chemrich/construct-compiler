construct:
  name: "stabilized_protein_solubility_fusion"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: your_protein_here
              source: uniprot

    - terminator: rrnB_T1
