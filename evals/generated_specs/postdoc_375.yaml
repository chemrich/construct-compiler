construct:
  name: "ecoli_promoter_test_luciferase"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac  # Default per instruction for E. coli since the 'new' promoter sequence/id was not provided
    - cistron:
        label: luciferase_reporter
        expression: medium
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1