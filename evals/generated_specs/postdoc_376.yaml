construct:
  name: mammalian_GPCR_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GPCR
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: UNIPROT_ID_HERE
              source: uniprot

    - terminator: rrnB_T1
