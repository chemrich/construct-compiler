construct:
  name: "ecoli_dual_tag_protein"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: your_protein_id
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - terminator: rrnB_T1
