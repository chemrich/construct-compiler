construct:
  name: "small_peptide_secretion_ecoli"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - signal_peptide: pelB  # N-terminal signal peptide for periplasmic secretion
          - gene:
              id: custom_peptide_10_15aa
              source: uniprot

    - terminator: rrnB_T1
