construct:
  name: "egfp_with_kinase_coexpression"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pETDuet-1"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1

    # Second MCS for kinase co-expression
    - promoter: T7lac

    - cistron:
        label: kinase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P06241
              source: uniprot
        # UniProt ID for human protein kinase A (PKA) catalytic subunit alpha
        # Adjust ID based on your preferred kinase

    - terminator: rrnB_T1