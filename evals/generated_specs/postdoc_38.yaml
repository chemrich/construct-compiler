construct:
  name: ubiquitin_fusion_degradation_control
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0CG48  # Human ubiquitin
              source: uniprot
          # Note: Ubiquitin fusion for degradation control - protein will be processed by E. coli deubiquitinating enzymes
          - gene:
              id: mEGFP  # Replace with your target protein
              source: fpbase

    - terminator: rrnB_T1