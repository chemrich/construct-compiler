construct:
  name: ubiquitin_fusion_protein
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ubiquitin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: MCP
              source: uniprot

    - terminator: rrnB_T1
