construct:
  name: "ubiquitin_n_fusion_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - solubility_tag: Ubiquitin # E. coli lacks the 26S proteasome system; N-terminal Ubiquitin fusion is provided as requested, though N-end rule degradation in bacteria is functionally distinct from the mammalian system.
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term