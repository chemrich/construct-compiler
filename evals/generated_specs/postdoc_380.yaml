construct:
  name: TF_alpha_high_expression_ecoli
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # CMV is mammalian-specific; T7lac provides strongest E. coli expression equivalent
    
    - cistron:
        label: TF_alpha
        expression: high
        chain:
          - gene:
              id: TF_alpha
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1