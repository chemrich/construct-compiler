construct:
  name: human_growth_hormone_secretion_yeast
  host: yeast
  backbone:
    resistance: kanamycin # Standard G418 selection for yeast
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1 # Standard constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II # User requested N-terminal tag; note: placing this before the signal peptide in P01241 may interfere with secretion
          - gene:
              id: P01241 # Human Growth Hormone (Somatotropin), including its native human signal peptide (residues 1-26)
              source: uniprot
    - terminator: CYC1 # Standard yeast terminator