construct:
  name: "secreted_hGH_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_hGH
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GH1
              source: uniprot

    - terminator: CYC1
