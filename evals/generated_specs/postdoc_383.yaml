construct:
  name: "bacterial_ABC_transporter_trisubunit_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: SV40
    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ABC_transporter_subunit_A
              source: uniprot

    - promoter: SV40
    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ABC_transporter_subunit_B
              source: uniprot

    - promoter: SV40
    - cistron:
        label: subunit_C
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ABC_transporter_subunit_C
              source: uniprot

    - terminator: poly_A  # SV40 poly-A signal for mRNA stability in mammalian cells
