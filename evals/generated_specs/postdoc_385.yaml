construct:
  name: "human_enzyme_GST_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: GST
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: human_enzyme
              source: uniprot
              introns: preserve

    - terminator: CYC1
