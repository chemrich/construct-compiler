construct:
  name: "NR_gamma_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD # High-expression constitutive yeast promoter
    - cistron:
        label: NR-gamma
        expression: medium
        gene:
          id: PPARG # PPARG is the common gene symbol for human NR-gamma (NR1C3)
          source: uniprot
    - terminator: CYC1