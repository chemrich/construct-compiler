construct:
  name: "yeast_proteinz_expression"
  host: yeast
  backbone:
    resistance: kanamycin  # Kanamycin resistance (kanMX) provides G418 selection in yeast
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinZ
              source: uniprot
    - terminator: CYC1_term