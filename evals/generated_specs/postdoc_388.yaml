construct:
  name: "human_IL2_constitutive_flag"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Substituted SV40 with J23100; mammalian promoters like SV40 are non-functional in E. coli hosts.
    - cistron:
        label: target_cytokine
        expression: high
        chain:
          - gene:
              id: P60568
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1