construct:
  name: "soluble_receptor_secretion_ecoli"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: soluble_receptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SolubleR
              source: uniprot
        # NOTE: Native human signal peptide included in SolubleR sequence for periplasmic secretion.
        # E. coli lacks N-linked glycosylation machinery (OST and oligosaccharyl transferase).
        # For proper glycosylation, consider engineered strains (e.g., E. coli with eukaryotic N-glycosylation pathway)
        # or alternative hosts (yeast, mammalian, insect cells). This construct will produce
        # non-glycosylated but secreted soluble receptor.

    - terminator: rrnB_T1
