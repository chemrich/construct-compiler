construct:
  name: human_cytokine_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: 6xHis
          - gene:
            id: P01375  # IL-2 as example cytokine
            source: uniprot
            codon_optimize: homo_sapiens  # Note: codon optimization for human in yeast may actually reduce expression

    - terminator: rrnB_T1