construct:
  name: "human_cytokine_yeast_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: IL6
              source: uniprot
              species: Homo_sapiens

    - terminator: CYC1
