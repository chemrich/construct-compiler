construct:
  name: yeast_surface_display_DomainY_HA
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: DomainY
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: rrnB_T1
