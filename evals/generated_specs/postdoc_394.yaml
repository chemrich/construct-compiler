construct:
  name: "human_KinaseK_yeast_high_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted EF1_alpha with TEF1, its strong constitutive equivalent in S. cerevisiae
    - cistron:
        label: kinase_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: KinaseK
              source: uniprot
    - terminator: CYC1  # Standard strong yeast terminator/poly-A signal