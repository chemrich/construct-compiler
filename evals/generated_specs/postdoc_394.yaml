construct:
  name: "KinaseK_yeast_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1  # Strong constitutive yeast promoter, equivalent to mammalian EF1α

    - cistron:
        label: KinaseK
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: KinaseK
              source: uniprot

    - terminator: CYC1  # Yeast poly(A) signal for mRNA stability
