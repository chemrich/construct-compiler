construct:
  name: "GeneA_GeneB_coexpression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneA
              source: uniprot
    
    # Note: IRES elements do not function in E. coli prokaryotic translation.
    # Using a ribosome binding site (RBS) spacer instead for proper polycistronic
    # expression in bacteria. Each gene gets independent translation initiation.
    - spacer: 30
    
    - cistron:
        label: GeneB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GeneB
              source: uniprot
    
    - terminator: rrnB_T1