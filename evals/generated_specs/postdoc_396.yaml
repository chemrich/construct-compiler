construct:
  name: "yeast_ViralP_Strep"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Native yeast strong promoter; viral promoter not directly compatible with yeast expression systems, substituting with GAL1

    - cistron:
        label: ViralP
        expression: high
        chain:
          - gene:
              id: ViralP
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1
