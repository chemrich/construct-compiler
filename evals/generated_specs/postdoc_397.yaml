construct:
  name: "ProteinP_HA_Phosphorylation_Study"
  host: HEK293 # Substituted HEK293 for E. coli because E. coli lacks the kinase machinery required for human-specific Ser/Thr phosphorylation.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: ProteinP
              source: uniprot
          - tag: HA
    - terminator: bGH_pA