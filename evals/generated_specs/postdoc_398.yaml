construct:
  name: "human_proinsulin_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: ADH1  # Defaulting to ADH1 as a standard yeast constitutive promoter
    - cistron:
        label: proinsulin
        expression: high
        gene:
          id: P01308
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator for expression cassettes