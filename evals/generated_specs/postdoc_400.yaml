construct:
  name: "strep_gfp_high_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac # Substituted requested CMV promoter with T7lac for high-level expression in E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1