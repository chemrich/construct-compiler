construct:
  name: "yeast_secreted_enzyme_constitutive"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TPI1
      # TPI1 is a strong constitutive promoter in S. cerevisiae
      # (GAL1 is inducible; TPI1 provides constitutive high expression)

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: SP_human_preproinsulin
            # Human signal peptide for robust secretion from S. cerevisiae
          - gene:
              id: your_enzyme
              # Replace with actual enzyme UniProt ID or gene identifier

    - terminator: CYC1_terminator
