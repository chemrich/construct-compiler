construct:
  name: "yeast_secretion_high_constitutive"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Substituted strong constitutive TDH3 for P_GAL1 as user requested a constitutive high-expression promoter
    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: HSA_SP  # Human Serum Albumin signal peptide as requested
          - gene:
              id: enzyme_x
              source: uniprot
    - terminator: CYC1