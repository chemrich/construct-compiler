construct:
  name: "human_glycoprotein_ecoli_production"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: glycoprotein_target
        expression: high
        chain:
          - solubility_tag: MBP  # Added MBP to ensure high solubility in E. coli as requested
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P02763
              source: uniprot
          - tag: 6xHis          # C-terminal His-tag for purification
    - terminator: T7term
# Note: E. coli lacks the mammalian machinery (ER/Golgi) required for post-translational glycosylation. 
# While glycosylation motifs are present in the gene sequence, the protein will not be glycosylated in this host.