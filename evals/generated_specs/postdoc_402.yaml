construct:
  name: "human_glycoprotein_ecoli_soluble"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: glycoprotein
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: human_glycoprotein
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis
    
    - terminator: rrnB_T1
