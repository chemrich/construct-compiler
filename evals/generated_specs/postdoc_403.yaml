construct:
  name: "dual_protein_expression_myc_flag"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: protein_A
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: protein_B
              source: uniprot
    
    - terminator: rrnB_T1
