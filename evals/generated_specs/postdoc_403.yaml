construct:
  name: "dual_expression_protein_a_and_b"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a_cistron
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: protein_a
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b_cistron
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: protein_b
              source: uniprot
    - terminator: T7term