construct:
  name: "yeast_oncogene_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # CMV is mammalian-specific; using GAL1 as the strongest constitutive/inducible promoter in S. cerevisiae

    - cistron:
        label: oncogene
        expression: high
        chain:
          - gene:
              id: null  # User must provide specific oncogene ID and source (uniprot recommended)
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - terminator: rrnB_T1
