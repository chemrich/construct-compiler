construct:
  name: "antibody_fragment_periplasmic_secretion"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: Lys-tag
          - secretion_signal: pelB  # E. coli-optimized signal peptide for periplasmic secretion
          - gene:
              id: antibody_fragment
              source: uniprot
    
    - terminator: rrnB_T1
