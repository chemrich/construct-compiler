construct:
  name: "peptide_library_highthroughput"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter; avoids induction complexity

    - cistron:
        label: peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LIBRARY_PLACEHOLDER
              source: custom

    - terminator: rrnB_T1
