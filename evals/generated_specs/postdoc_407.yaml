construct:
  name: "mitochondrial_protein_gfp_fusion_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mitochondrial_target
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: generic_mito_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
