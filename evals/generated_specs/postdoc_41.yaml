construct:
  name: "secreted_cytokine_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1  # constitutive yeast promoter, equivalent to CMV for yeast

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast secretion signal
          - gene:
              id: your_cytokine_id  # replace with actual cytokine UniProt ID
              source: uniprot

    - terminator: CYC1