construct:
  name: "yeast_surface_display_peptide"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: custom_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga1p
              source: uniprot

    - terminator: CYC1
