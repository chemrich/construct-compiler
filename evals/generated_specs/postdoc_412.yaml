construct:
  name: "protein_with_chaperone_coexpression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pGro7"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: groEL_groES
              source: uniprot
              # Note: GroEL/ES are co-transcribed from the pGro7 plasmid upon arabinose induction.
              # GroEL and GroES work synergistically in E. coli; Hsp70 is a eukaryotic ortholog with different properties.

    - terminator: rrnB_T1
