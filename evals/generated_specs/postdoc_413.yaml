construct:
  name: "antibody_ER_retention_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: antibody
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: antibody
              source: uniprot
          - tag: KDEL

    - terminator: rrnB_T1
