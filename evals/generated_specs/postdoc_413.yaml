construct:
  name: Yeast_ER_Retention_Antibody
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: antibody_cistron
        expression: high
        chain:
          - tag: alpha_factor_signal  # Required for ER entry
          - gene:
              id: scFv_antibody
              source: uniprot
          - tag: FLAG
          - tag: KDEL  # Note: S. cerevisiae typically uses HDEL for ER retention; KDEL is used as requested.
    - terminator: CYC1