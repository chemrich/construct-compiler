construct:
  name: "yeast_four_subunit_complex"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      cistron:
        label: subunit_A
        expression: high
        gene:
          id: subunit_A
          source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: GAL1
      cistron:
        label: subunit_B
        expression: high
        gene:
          id: subunit_B
          source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: GAL1
      cistron:
        label: subunit_C
        expression: high
        gene:
          id: subunit_C
          source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: GAL1
      cistron:
        label: subunit_D
        expression: high
        gene:
          id: subunit_D
          source: uniprot

    - terminator: CYC1
