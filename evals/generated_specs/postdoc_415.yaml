construct:
  name: yeast_four_subunit_complex_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3 # Strong constitutive yeast promoter (GPD)
    - cistron:
        label: subunit_alpha
        expression: high
        fused: false
        gene:
          id: subunit_alpha_placeholder
          source: uniprot
    - terminator: CYC1

    - promoter: TEF1 # Strong constitutive yeast promoter
    - cistron:
        label: subunit_beta
        expression: high
        fused: false
        gene:
          id: subunit_beta_placeholder
          source: uniprot
    - terminator: ADH1

    - promoter: PGK1 # Strong constitutive yeast promoter
    - cistron:
        label: subunit_gamma
        expression: high
        fused: false
        gene:
          id: subunit_gamma_placeholder
          source: uniprot
    - terminator: ENO1

    - promoter: PYK1 # Strong constitutive yeast promoter
    - cistron:
        label: subunit_delta
        expression: high
        fused: false
        gene:
          id: subunit_delta_placeholder
          source: uniprot
    - terminator: TPI1