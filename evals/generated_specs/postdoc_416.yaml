construct:
  name: "human_kinase_expression_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase_target
        expression: high # Substitution: User requested a strong Kozak sequence for E. coli; provided a strong ribosome binding site (RBS) instead as Kozak is for mammalian hosts.
        chain:
          - gene:
              id: P31749
              source: uniprot
          - tag: Strep-II
    - terminator: T7term