construct:
  name: viral_fusion_protein_yeast_expression
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: viral_fusion_protein
              source: uniprot
          - tag: Myc

    - terminator: CYC1
