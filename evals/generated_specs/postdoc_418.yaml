construct:
  name: "toxic_protein_expression_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: toxic_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: toxic_protein
              source: uniprot
    - terminator: T7term