construct:
  name: protein_A_B_bicistronic
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        gene:
          id: proteinA  # Replace with actual protein ID
          source: uniprot

    # E. coli doesn't use IRES - using spacer for bicistronic expression via ribosome binding
    - spacer: 50

    - cistron:
        label: protein_B
        expression: high
        fused: false  # Independent translation with separate RBS
        gene:
          id: proteinB  # Replace with actual protein ID
          source: uniprot

    - terminator: rrnB_T1