construct:
  name: "his_megfp_expression_ecoli"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # CMV/SV40 are mammalian; T7lac substituted for strong E. coli expression. RBS used instead of Kozak for prokaryotic host.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term