construct:
  name: "ecoli_gfp_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
      # Note: CMV and SV40 are mammalian promoters. Substituted with T7lac for robust E. coli expression.
      # Kozak sequence is mammalian-specific and not applicable to prokaryotes; using RBS instead.
    
    - rbs: RBS_strong
    
    - cistron:
        label: gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
