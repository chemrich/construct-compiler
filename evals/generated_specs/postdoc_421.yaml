construct:
  name: secreted_cytokine_yeast_expression
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2µ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: cytokine
        expression: high
        chain:
          - signal_peptide: alpha_factor  # yeast native signal peptide, not mammalian (mammalian peptides don't process correctly in yeast ER)
          - gene:
              id: IL2
              source: uniprot
          - cleavage_site: 3C
          - tag: Myc

    - terminator: CYC1
