construct:
  name: "bacterial_proteins_X_Y_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_X
        expression: high
        chain:
          - gene:
              id: protein_X
              source: uniprot
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: protein_Y
        expression: high
        fused: false
        chain:
          - gene:
              id: protein_Y
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
