construct:
  name: "yeast_polycistronic_ABC_HA_tagged"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: HA
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: ProteinB
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_C
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: ProteinC
              source: uniprot

    - terminator: rrnB_T1
