construct:
  name: "membrane_protein_with_chaperone_cocktail"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: BiP
        expression: high
        chain:
          - gene:
              id: HSPA5
              source: uniprot

    - spacer: 30

    - cistron:
        label: Calnexin
        expression: high
        chain:
          - gene:
              id: CANX
              source: uniprot

    - spacer: 30

    - cistron:
        label: Calreticulin
        expression: high
        chain:
          - gene:
              id: CALR
              source: uniprot

    - spacer: 30

    - cistron:
        label: target_membrane_protein
        expression: high
        chain:
          - gene:
              id: your_membrane_protein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
