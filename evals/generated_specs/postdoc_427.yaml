construct:
  name: "yeast_enzyme_dual_tag"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: enzyme
              source: uniprot
          - tag: FLAG

    - terminator: CYC1
