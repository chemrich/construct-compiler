construct:
  name: yeast_strep_flag_enzyme_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: tagged_enzyme
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ADH1 # Using S. cerevisiae ADH1 (P00330) as a placeholder for the enzyme
              source: uniprot
          - tag: FLAG
    - terminator: CYC1_term