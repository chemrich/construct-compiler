construct:
  name: strong_luciferase_reporter_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # CMV is a mammalian promoter; GAL1 is the yeast equivalent for strong inducible expression

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P09041  # Photinus pyralis luciferase
          source: uniprot

    - terminator: rrnB_T1
