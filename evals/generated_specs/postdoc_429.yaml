construct:
  name: "super_strong_yeast_luciferase_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3 # User requested CMV (mammalian); substituted with TDH3, which is a strong constitutive promoter in S. cerevisiae.
    - cistron:
        label: luciferase_reporter
        expression: high
        gene:
          id: NanoLuc
          source: uniprot
    - terminator: CYC1_term