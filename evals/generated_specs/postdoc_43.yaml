construct:
  name: "His_tagged_enzyme_yeast_stable"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: SUMO
          - gene:
              id: enzyme
              source: uniprot

    - terminator: rrnB_T1
