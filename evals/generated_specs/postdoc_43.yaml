```yaml
construct:
  name: His_tagged_enzyme_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: # Need enzyme ID and source to be specified
              source: uniprot

    - terminator: rrnB_T1
```