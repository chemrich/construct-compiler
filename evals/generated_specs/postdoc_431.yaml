construct:
  name: "E_coli_periplasmic_peptide_strep"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: pelB  # E. coli-specific signal peptide for periplasmic secretion
          - gene:
              id: peptide_construct
              source: custom
          - tag: Strep-II
    - terminator: rrnB_T1
