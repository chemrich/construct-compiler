construct:
  name: "enzyme_ER_retained_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: enzyme
              source: uniprot
          - tag: KDEL  # ER retention signal (C-terminal)

    - terminator: rrnB_T1
