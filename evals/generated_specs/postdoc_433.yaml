construct:
  name: "GFP_SV40NLS_bacterial_protein"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS  # SV40 NLS; note: lacks functional nuclear import machinery in E. coli
    
    - terminator: rrnB_T1
