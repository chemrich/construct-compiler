construct:
  name: "protein_aprotinin_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: your_protein
              source: uniprot

    - spacer: 30

    - cistron:
        label: aprotinin
        expression: high
        fused: false
        gene:
          id: SPINK1
          source: uniprot

    - terminator: rrnB_T1
