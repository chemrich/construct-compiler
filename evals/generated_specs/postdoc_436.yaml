construct:
  name: "high_yield_ecoli_protein_strep"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    # Note: mammalian origins (e.g., SV40) do not replicate in E. coli.
    # Using pUC (high-copy, ~500-700 copies) for robust E. coli amplification instead.
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
