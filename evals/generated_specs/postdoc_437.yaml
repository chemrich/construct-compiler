construct:
  name: "S_cerevisiae_stable_integration"
  host: yeast

  backbone:
    resistance: geneticin  # G418 selection in yeast
    ori: CEN4             # Centromere for stable segregation
    source: addgene

  cassette:
    - promoter: GAL1      # Strong constitutive promoter for yeast

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YFP
              source: fpbase

    - terminator: CYC1    # Yeast transcription terminator
