construct:
  name: "yeast_stable_centromeric_expression"
  host: yeast
  backbone:
    resistance: kanamycin # Selected with G418 to provide neomycin resistance in yeast
    ori: CEN6_ARSH4 # CEN/ARS origin for stable episomal segregation as requested
    source: addgene
  cassette:
    - promoter: TDH3 # Strong constitutive promoter in S. cerevisiae
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1 # Standard yeast terminator