construct:
  name: "E_coli_GPCR_StrepTEV"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac  # E. coli-optimized; CMV is mammalian-specific and non-functional in bacteria
    
    - cistron:
        label: GPCR
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: human_GPCR  # Specify UniProt ID or gene name for your target GPCR
              source: uniprot
    
    - terminator: rrnB_T1  # Standard E. coli terminator; poly-A tails are not functional in prokaryotes
