construct:
  name: "metabolic_pathway_ABC_operon"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_B
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_C
              source: uniprot

    - terminator: rrnB_T1
