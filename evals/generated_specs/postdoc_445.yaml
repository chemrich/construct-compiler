construct:
  name: "rare_snake_venom_production"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T5
    - cistron:
        label: venom_toxin
        expression: high
        gene:
          id: P01416
          source: uniprot
    - terminator: rrnB_T1
# Codon optimization was adjusted for the E. coli host rather than mammalian, as requested, to ensure high yields and avoid translational bottlenecks in the bacterial system.