construct:
  name: "snake_venom_mammalian_optimized"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
      # NOTE: T5 is not standard in E. coli expression vectors; T7lac substituted.
      # Mammalian codon optimization in E. coli is counterproductive—E. coli prefers
      # its own codon bias. Using E. coli-optimized codons instead for high expression.
    
    - cistron:
        label: snake_venom_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: snake_venom_protein
              source: uniprot
    
    - terminator: rrnB_T1