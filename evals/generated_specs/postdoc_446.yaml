construct:
  name: "yeast_secreted_protein_Z"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: signal_peptide_HSA  # human serum albumin signal peptide for efficient secretion
          - gene:
              id: protein_Z
              source: uniprot

    - terminator: rrnB_T1
