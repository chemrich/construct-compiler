construct:
  name: "dual_protein_P_Q_IRES_arabinose"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: protein_P
        expression: high
        chain:
          - gene:
              id: protein_P
              source: uniprot
          - tag: Strep-II
    
    - spacer: 27
    
    - cistron:
        label: IRES_protein_Q
        expression: high
        chain:
          - gene:
              id: IRES
              source: uniprot
          - gene:
              id: protein_Q
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
