construct:
  name: "His_Luc_R_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CAG

    - cistron:
        label: luciferase_R_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Renilla_luciferase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: R
              source: uniprot

    - terminator: rrnB_T1
