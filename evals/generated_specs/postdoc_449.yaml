construct:
  name: "protein_S_nuclear_localization"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: protein_S
        expression: high
        chain:
          - gene:
              id: protein_S
              source: uniprot
          - tag: c_Myc
          - NLS

    - terminator: rrnB_T1
