construct:
  name: "HEK293_receptor_expression"
  host: HEK293

  backbone:
    resistance: kanamycin
    ori: pBR322
    # Note: T7 promoter requires T7 RNA polymerase, which is not endogenously expressed in HEK293 cells.
    # Substituting CMV (constitutive mammalian promoter) for direct expression in HEK293s.
    # For T7-driven expression, use an inducible mammalian system or transfect T7 polymerase separately.

  cassette:
    - promoter: CMV

    - cistron:
        label: receptor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: null
              # User must provide receptor protein ID (UniProt ID or gene name)
              source: uniprot

    - terminator: rrnB_T1
