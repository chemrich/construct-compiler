construct:
  name: receptor_protein_HEK293
  host: HEK293

  backbone:
    # Using CMV instead of T7 - T7 promoter doesn't work in mammalian cells
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV  # CMV promoter for mammalian expression, not T7

    - cistron:
        label: receptor
        expression: high
        gene:
          id: your_receptor_gene
          source: uniprot

    - terminator: SV40_polyA