construct:
  name: HEK293_receptor_expression_shuttle
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # T7 substituted with CMV for HEK293; T7 is a bacteriophage promoter that requires T7 polymerase, while CMV is a strong mammalian promoter.
    - cistron:
        label: receptor_target
        expression: high
        gene:
          id: P00533
          source: uniprot
    - terminator: bGH_pA