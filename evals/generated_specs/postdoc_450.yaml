construct:
  name: "yeast_dual_gpd_cup1_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: protein_G
        expression: high
        chain:
          - gene:
              id: G
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1
    - promoter: CUP1
    - cistron:
        label: protein_H
        expression: medium
        chain:
          - gene:
              id: H
              source: uniprot
          - tag: 6xHis
    - terminator: ADH1