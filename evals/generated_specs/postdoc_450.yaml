construct:
  name: "yeast_dual_promoter_G_H"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GPD

    - cistron:
        label: protein_G
        expression: high
        chain:
          - gene:
              id: G
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

    - promoter: CUP1

    - cistron:
        label: protein_H
        expression: medium
        chain:
          - gene:
              id: H
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
