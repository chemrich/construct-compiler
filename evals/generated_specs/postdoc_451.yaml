construct:
  name: "human_Fv_disulfide_bond_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Fv_fragment
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01857  # Human variable heavy chain (example UniProt)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P01834  # Human variable light chain (example UniProt)
              source: uniprot

    - terminator: rrnB_T1

  # NOTE: E. coli cytoplasm is reducing and lacks ER machinery for proper disulfide bond formation.
  # For authentic disulfide bonds, consider using:
  # - E. coli Origami or SHuffle strains (cytoplasmic disulfide bonds)
  # - Periplasmic expression (use pelB or similar signal peptide)
  # - Mammalian expression (HEK293 or CHO) with native signal peptide
  # This construct provides the basic framework; add pelB signal peptide or use appropriate E. coli strain.