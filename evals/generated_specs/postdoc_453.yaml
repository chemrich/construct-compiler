construct:
  name: "plant_protein_with_chloroplast_targeting"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: plant_protein
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: "plant_protein"
              source: uniprot

    - terminator: rrnB_T1
