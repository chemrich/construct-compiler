construct:
  name: yeast_protein_K_constitutive
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Constitutive yeast promoter

    - cistron:
        label: protein_K
        expression: high
        gene:
          id: protein_K
          source: uniprot

    # Note: BGH poly-A is a mammalian signal and does not function in yeast.
    # Using CYC1 terminator (yeast-specific) for proper mRNA stability instead.
    - terminator: CYC1
