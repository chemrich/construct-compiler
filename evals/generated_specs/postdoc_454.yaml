construct:
  name: "yeast_constitutive_protein_k"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: GPD  # Standard constitutive yeast promoter
    - cistron:
        label: protein_k
        expression: high
        gene:
          id: K
          source: uniprot
    - terminator: BGH_polyA  # User requested mammalian poly-A signal for stability, though yeast typically uses native terminators like CYC1_term.