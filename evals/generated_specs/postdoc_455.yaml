construct:
  name: "periplasm_expression_difficult_fold"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: pelB  # E. coli periplasm targeting; mammalian signals (e.g., IgG) are not functional in E. coli
          - gene:
              id: your_protein
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
