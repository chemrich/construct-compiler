construct:
  name: "XYZ_complex_yeast_2A_linked"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron

  cassette:
    - promoter: TDH3

    - cistron:
        label: X
        expression: high
        chain:
          - tag: GFP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: X
              source: uniprot

    - spacer: 22

    - cistron:
        label: T2A_separator
        fused: false
        gene:
          id: T2A
          source: uniprot

    - spacer: 22

    - cistron:
        label: Y
        expression: high
        fused: false
        gene:
          id: Y
          source: uniprot

    - spacer: 22

    - cistron:
        label: F2A_separator
        fused: false
        gene:
          id: F2A
          source: uniprot

    - spacer: 22

    - cistron:
        label: Z
        expression: high
        fused: false
        gene:
          id: Z
          source: uniprot

    - terminator: CYC1
