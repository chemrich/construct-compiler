construct:
  name: "large_protein_with_chaperones"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: your_large_protein
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: groEL
        expression: high
        fused: false
        gene:
          id: groEL
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: groES
        expression: high
        fused: false
        gene:
          id: groES
          source: uniprot
    
    - terminator: rrnB_T1

# Note: In E. coli, co-expression of chaperones in a polycistronic operon is a standard
# strategy for improving solubility and folding of large proteins. Unlike eukaryotes,
# bacterial chaperones (GroEL/GroES) must be provided in *trans* on the same plasmid or
# chromosome via separate cistrons with independent RBS elements, not fused to your protein.
# The spacers between cistrons allow proper translation initiation for each protein.