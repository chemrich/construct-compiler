construct:
  name: "soluble_protein_with_MBP_tag"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: P0A7B8  # placeholder - replace with actual protein ID
              source: uniprot

    - terminator: rrnB_T1