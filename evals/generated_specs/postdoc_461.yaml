construct:
  name: "yeast_secreted_Fab_His"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_Fab
        expression: high
        chain:
          - tag: signal_peptide_ER
          - gene:
              id: Fab_fragment
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
