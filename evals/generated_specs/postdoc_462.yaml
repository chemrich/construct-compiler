construct:
  name: ComplexX_two_subunit_IRES
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: SubunitA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: SubunitA
              source: uniprot
    # Note: IRES (Internal Ribosome Entry Site) elements are primarily functional in eukaryotic systems.
    # In E. coli, they do not function efficiently. This construct uses an IRES placeholder for documentation,
    # but translation of SubunitB will likely be minimal or absent in prokaryotic systems.
    # For E. coli, consider using a spacer with a ribosome binding site (RBS) and separate start codon instead.
    - spacer: 30
    - cistron:
        label: SubunitB
        expression: low
        fused: false
        gene:
          id: SubunitB
          source: uniprot
    - terminator: rrnB_T1
