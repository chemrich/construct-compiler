construct:
  name: GFP_MyProtein_TEV_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP_MyProtein_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
          - cleavage_site: TEV
          - gene:
              id: MyProtein
              source: uniprot

    - terminator: rrnB_T1
