construct:
  name: "yeast_GeneA_GeneB_GeneC_pathway"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 30

    - cistron:
        label: GeneB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GeneB
              source: uniprot

    - spacer: 30

    - cistron:
        label: GeneC
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot

    - terminator: rrnB_T1
