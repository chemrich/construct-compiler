construct:
  name: "gal_inducible_transcription_factor"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GAL4_DBD
              source: uniprot

    - terminator: CYC1
