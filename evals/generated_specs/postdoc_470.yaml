construct:
  name: "DifficultProtein_with_BiP_chaperone"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: DifficultProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: DifficultProtein
              source: uniprot

    - spacer: 30

    - cistron:
        label: BiP_chaperone
        expression: high
        fused: false
        gene:
          id: BiP
          source: uniprot

    - terminator: rrnB_T1
