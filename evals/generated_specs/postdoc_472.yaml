construct:
  name: "Aggregator_solubility_enhanced"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Aggregator_soluble
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: Aggregator
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
