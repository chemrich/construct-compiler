construct:
  name: "aggregator_solubility_enhancement"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: aggregator_target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: Aggregator
              source: uniprot
          - tag: Myc
    - terminator: T7term