construct:
  name: "TestProtein_A_shuttle_vector"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Note: This is a simplified E. coli-optimized backbone.
    # For true S. cerevisiae shuttle capability, add a yeast origin (2μ or CEN/ARS) 
    # and yeast selection marker (URA3, LEU2, or HIS3) in addition to bacterial elements.
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: TestProtein_A
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: TestProtein_A
              source: uniprot
    
    - terminator: rrnB_T1
