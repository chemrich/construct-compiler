construct:
  name: "TestProtein_A_Shuttle_Vector"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac # Dual-host expression: T7lac for E. coli BL21(DE3)
    - promoter: GAL1  # Dual-host expression: GAL1 for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: TestProtein_A
              source: uniprot
    - terminator: CYC1 # Yeast terminator compatible with shuttle vector requirements