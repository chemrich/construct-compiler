construct:
  name: "GPCR_X_GFP_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GPCR_X
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: GPCR_X
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: GFP
        expression: high
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
