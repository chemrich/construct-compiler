construct:
  name: "yeast_RPLP0_ribosomal_protein"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: RPLP0
        expression: high
        chain:
          - tag: HA
          - gene:
              id: RPLP0
              source: uniprot

    - terminator: rrnB_T1
