construct:
  name: "human_RPLP0_HA_yeast_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1 # Constitutive promoter for high-level yeast expression
    - cistron:
        label: RPLP0_fusion
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P05388 # Human RPLP0 UniProt ID
              source: uniprot
    - terminator: CYC1_term # Standard yeast terminator
# Ribosomal integration of RPLP0 is mediated by its endogenous protein-protein interaction domains; no specific ribosomal targeting tag is required.