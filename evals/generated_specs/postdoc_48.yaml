construct:
  name: two_component_sensor_system
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_kinase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sensor_kinase
              source: uniprot

    - spacer: 30

    - cistron:
        label: response_regulator
        expression: high
        fused: false
        gene:
          id: response_regulator
          source: uniprot

    - terminator: rrnB_T1
