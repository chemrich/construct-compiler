construct:
  name: "dual_protein_coexpression_AB"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: protein_A
              source: uniprot
          - tag: Strep-II

    - spacer: 25

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
