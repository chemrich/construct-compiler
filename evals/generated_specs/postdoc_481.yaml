construct:
  name: "polycistronic_protein_A_and_B_coexpression"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7
    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: Protein_A
              source: uniprot
          - tag: Strep-II
    - spacer: 30
    - cistron:
        label: protein_B
        expression: high
        fused: false # Independent translation via separate RBS (Kozak sequences are replaced by Shine-Dalgarno for E. coli)
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_B
              source: uniprot
    - terminator: T7term