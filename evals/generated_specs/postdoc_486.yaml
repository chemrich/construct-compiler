construct:
  name: "yeast_EnzY_Tet_on_FLAG"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetO_minimal
      # Tet-on system: requires tTA or rtTA transactivator (typically on a separate plasmid in yeast)

    - cistron:
        label: EnzY
        expression: high
        chain:
          - gene:
              id: EnzY
              source: uniprot
          - tag: FLAG

    - terminator: SV40_polyA
      # SV40 polyA is functional in yeast for mRNA stability
