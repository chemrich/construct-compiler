construct:
  name: "EnzY_Tet_on_Inducible_Yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE  # Tetracycline Response Element for Tet-on induction in yeast
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EnzY
              source: uniprot
          - tag: FLAG  # C-terminal FLAG-tag
    - terminator: CYC1  # Standard yeast poly-A signal/terminator