construct:
  name: ProtX_sfGFP_HEK293
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: ProtX_sfGFP_fusion
        expression: high
        chain:
          - gene:
              id: ProtX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
          - tag: Strep-II

    - terminator: rrnB_T1
