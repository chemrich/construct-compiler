construct:
  name: "ProtZ_dual_tags"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: ProtZ
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: ProtZ
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
