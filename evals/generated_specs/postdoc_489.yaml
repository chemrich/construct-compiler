construct:
  name: "MitoProt_mitochondrial_targeting_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: MitoProt
        expression: high
        chain:
          - tag: 6xHis
          - mito_targeting_peptide: MTS
          - gene:
              id: MitoProt
              source: uniprot

    - terminator: rrnB_T1
