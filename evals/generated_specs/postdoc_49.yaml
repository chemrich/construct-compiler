construct:
  name: "CHO_secreted_antibody_fragment_FLAG"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: FLAG
          - secretion_signal: SP_Kozak  # mammalian secretion signal peptide
          - gene:
              id: Fab_fragment
              source: uniprot

    - terminator: rrnB_T1
