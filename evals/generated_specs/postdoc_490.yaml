construct:
  name: ProtA_ProtB_co_expression_operon
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProtA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProtA
              source: uniprot

    - spacer: 50

    - cistron:
        label: ProtB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProtB
              source: uniprot

    - terminator: rrnB_T1
