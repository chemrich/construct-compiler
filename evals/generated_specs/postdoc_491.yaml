construct:
  name: "mammalian_secreted_ligand_CMV"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_ligand
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - gene:
              id: ligand
              source: uniprot
          - cleavage_site: TEV
          - tag: FLAG

    - terminator: SV40_poly_A
