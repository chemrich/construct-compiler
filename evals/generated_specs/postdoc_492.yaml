construct:
  name: "ChapX_stress_inducible_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: HSP70  # stress-inducible promoter for yeast

    - cistron:
        label: ChapX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ChapX
              source: uniprot

    - terminator: rrnB_T1
