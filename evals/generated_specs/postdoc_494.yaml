construct:
  name: CRISPR_knockout_Cas9_GFP_HEK293
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9_GFP
        expression: high
        chain:
          - gene:
              id: SpCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
        poly_a: true

    - spacer: 30

    - element: IRES
      type: ENCV

    - cistron:
        label: guide_RNA
        expression: medium
        fused: false
        gene:
          id: gRNA_scaffold
          source: uniprot
        poly_a: true

    - terminator: SV40_poly_A
