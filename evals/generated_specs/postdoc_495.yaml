construct:
  name: "TMPro_Constitutive_Expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strong constitutive promoter for E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: TMPro
              source: uniprot
          - tag: FLAG  # C-terminal FLAG-tag
    - terminator: rrnB_T1