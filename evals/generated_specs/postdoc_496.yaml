construct:
  name: yeast_ProtX_ProtY_coexpression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProtX
        expression: very_high
        chain:
          - tag: 6xHis
          - gene:
              id: ProtX
              source: uniprot

    - terminator: CYC1

    - promoter: ADH1

    - cistron:
        label: ProtY
        expression: medium
        chain:
          - gene:
              id: ProtY
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1
