construct:
  name: GlycoProt_yeast_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: GlycoProt
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GlycoProt
              source: uniprot

    - terminator: rrnB_T1
