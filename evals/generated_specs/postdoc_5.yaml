construct:
  name: "mEGFP_MyNuclearProtein_E_coli_localization"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac  # Substituted mammalian SV40 promoter with E. coli T7lac for functional expression
    - cistron:
        label: target
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: MyNuclearProtein
              source: uniprot
    - terminator: rrnB_T1