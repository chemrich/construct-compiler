```yaml
construct:
  name: GFP_MyNuclearProtein_localization
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac  # Using T7lac instead of SV40 since this is E. coli - SV40 won't function in prokaryotes

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: MyNuclearProtein
              source: uniprot

    - terminator: rrnB_T1
```