construct:
  name: "enzyme_mitochondrial_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - tag: MTS  # Mitochondrial targeting sequence
          - gene:
              id: enzyme
              source: uniprot

    - terminator: rrnB_T1
