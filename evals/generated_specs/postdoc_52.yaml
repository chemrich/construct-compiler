construct:
  name: metabolic_pathway_E1E2E3_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Constitutive in yeast (glucose-repressed but active in galactose/raffinose)

    - cistron:
        label: E1
        expression: high
        gene:
          id: E1
          source: uniprot

    - spacer: 50

    - cistron:
        label: E2
        expression: high
        fused: false
        gene:
          id: E2
          source: uniprot

    - spacer: 50

    - cistron:
        label: E3
        expression: high
        fused: false
        gene:
          id: E3
          source: uniprot

    - terminator: CYC1
