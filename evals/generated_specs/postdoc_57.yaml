construct:
  name: "toxicity_assay_low_copy"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: SC101 # SC101 is used as a generic low-copy substitute for P1/F origins
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: toxic_payload
        expression: low
        gene:
          id: P00648 # Barnase (standard toxic protein)
          source: uniprot
    - terminator: rrnB_T1