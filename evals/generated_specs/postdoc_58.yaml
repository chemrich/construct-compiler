construct:
  name: mammalian_luciferase_reporter_custom
  host: HEK293
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: minCMV  # Using minimal CMV as the base for the reporter construct
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: P08659  # Firefly luciferase (Photinus pyralis)
          source: uniprot
    - terminator: SV40_polyA  # Standard polyadenylation signal for mammalian expression