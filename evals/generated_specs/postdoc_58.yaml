construct:
  name: "mammalian_luciferase_reporter"
  host: HEK293

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: SV40  # Minimal mammalian promoter, similar to pGL3-Basic

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: "P08659"  # Firefly luciferase (Photinus pyralis)
          source: uniprot

    - polya: SV40  # SV40 late polyadenylation signal, standard in pGL3

  # Note: Custom enhancer elements should be cloned upstream of SV40 promoter
  # during vector construction. Add them to the cassette as separate elements
  # if they are part of the compiled sequence.
