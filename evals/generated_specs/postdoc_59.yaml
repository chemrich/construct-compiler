construct:
  name: scFv_Aga2p_surface_display
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv_display
        expression: high
        chain:
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot
          - tag: c_Myc

    - terminator: CYC1
