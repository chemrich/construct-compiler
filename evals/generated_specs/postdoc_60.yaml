construct:
  name: "MMP_bacterial_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: MMP
        expression: high
        chain:
          - gene:
              id: MMP
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
