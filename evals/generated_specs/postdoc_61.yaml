construct:
  name: YeastMMP_secreted_strep
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Strong constitutive yeast promoter (CMV not suitable for yeast; using GAL1 instead)

    - cistron:
        label: YeastMMP
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor  # Yeast-optimized secretion signal (mammalian signal peptides do not function reliably in yeast)
          - gene:
              id: YeastMMP
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1_poly_A  # Poly-A terminator standard for yeast (not rrnB_T1, which is bacterial)
