construct:
  name: BacterialSecretedProtein
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: BacterialSecretedProtein
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
