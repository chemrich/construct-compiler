construct:
  name: YeastProteinX_mitochondrial_luciferase
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1  # Strong yeast promoter substituted for mammalian CMV (incompatible with S. cerevisiae)

    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: MTS  # Mitochondrial targeting sequence
          - gene:
              id: ProteinX
              source: uniprot

    - spacer: 30

    - cistron:
        label: luciferase_reporter
        expression: high
        fused: false
        chain:
          - cleavage_site: P2A  # Self-cleaving 2A peptide for stoichiometric separation
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: rrnB_T1
