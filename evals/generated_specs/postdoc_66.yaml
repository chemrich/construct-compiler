construct:
  name: "SmallPeptide_GST_Fusion"
  host: e_coli_bl21_de3  # Using e_coli_bl21_de3 to provide T7 polymerase for the T7lac promoter
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: SmallPeptide
    - terminator: rrnB_T1