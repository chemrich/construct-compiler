construct:
  name: "dual_TetO_GeneA_Myc_GeneB_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: TetO  # Tetracycline-inducible promoter

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: GeneA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TetO  # Second independent transcription unit

    - cistron:
        label: GeneB_GFP
        expression: high
        chain:
          - gene:
              id: GeneB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GFP

    - terminator: rrnB_T1
