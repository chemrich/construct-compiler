construct:
  name: tet_inducible_dual_expression
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE
    - cistron:
        label: GeneA_unit
        chain:
          - tag: Myc
          - gene:
              id: GeneA
              source: uniprot
    - terminator: bGH_pA
    - promoter: TRE
    - cistron:
        label: GeneB_unit
        chain:
          - gene:
              id: GeneB
              source: uniprot
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_pA