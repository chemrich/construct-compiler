construct:
  name: "MyYeastEnzyme_Constitutive_Yeast_Expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1 # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: target
        expression: high # Note: Using yeast-optimized consensus initiation (AAAAAAATGT) instead of mammalian Kozak (GCCRCCATGG) for S. cerevisiae host
        chain:
          - gene:
              id: MyYeastEnzyme
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1