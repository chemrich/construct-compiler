construct:
  name: yeast_dual_expression_enzyme_regulator
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
    - terminator: CYC1
    - promoter: GAL1
    - cistron:
        label: regulator_b
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: RegulatorB
              source: uniprot
    - terminator: ADH1