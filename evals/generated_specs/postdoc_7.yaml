construct:
  name: "yeast_dual_expression_EnzymeA_RegulatorB"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassettes:
    - name: "EnzymeA_cassette"
      promoter: TEF1
      cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
      terminator: CYC1

    - name: "RegulatorB_cassette"
      promoter: GAL1
      cistron:
        label: RegulatorB
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: RegulatorB
              source: uniprot
      terminator: CYC1
