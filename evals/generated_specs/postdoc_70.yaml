construct:
  name: "domainA_domainB_fusion_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: "DomainA"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: "DomainB"
              source: uniprot
          - tag: V5
    - terminator: bGH_polyA