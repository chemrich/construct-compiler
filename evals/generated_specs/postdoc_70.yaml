construct:
  name: DomainA_DomainB_fusion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: DomainA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: DomainB
              source: uniprot
          - tag: V5

    - terminator: rrnB_T1
