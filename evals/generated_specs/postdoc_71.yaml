construct:
  name: "PeriplasmicEnzyme_Production"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: PelB
          - gene:
              id: periplasmic_enzyme
              source: uniprot
          - tag: Twin-Strep
    - terminator: rrnB_T1