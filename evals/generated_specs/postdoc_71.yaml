construct:
  name: "PeriplasmicEnzyme_araBAD_TwinStrep"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: PeriplasmicEnzyme
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: PeriplasmicEnzyme
              source: uniprot
          - tag: Twin-Strep

    - terminator: rrnB_T1
