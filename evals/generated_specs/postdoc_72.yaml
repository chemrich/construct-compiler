construct:
  name: "Yeast_A_B_C_Polycistronic_IRES"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: 2u
    source: addgene
  cassette:
    - promoter: TEF1  # Robust constitutive yeast promoter
    - cistron:
        label: YeastA
        expression: high
        chain:
          - tag: HA
          - gene:
              id: YeastA
              source: uniprot
    - spacer: 50  # IRES sequence as requested for inter-cistronic translation initiation
    - cistron:
        label: YeastB
        expression: high
        fused: false  # Independently translated via IRES
        gene:
          id: YeastB
          source: uniprot
    - spacer: 50  # IRES sequence as requested for inter-cistronic translation initiation
    - cistron:
        label: YeastC
        expression: high
        fused: false  # Independently translated via IRES
        chain:
          - gene:
              id: YeastC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1_term