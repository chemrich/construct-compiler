construct:
  name: "YeastA_YeastB_YeastC_polycistronic"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: YeastA
        expression: high
        chain:
          - tag: HA
          - gene:
              id: YeastA
              source: uniprot

    - spacer: 50

    - cistron:
        label: YeastB
        expression: high
        fused: false
        gene:
          id: YeastB
          source: uniprot

    - spacer: 50

    - cistron:
        label: YeastC_mCherry
        expression: high
        fused: false
        chain:
          - gene:
              id: YeastC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: mCherry

    - terminator: rrnB_T1
