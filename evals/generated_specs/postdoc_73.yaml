construct:
  name: "luciferase_reporter_5xTFBS"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - regulatory_element:
        type: transcription_factor_binding_site
        id: TranscriptionFactorBindingSite
        repeats: 5

    - kozak_sequence: GCCRCCAUGG

    - cistron:
        label: luciferase
        expression: high
        chain:
          - gene:
              id: Luciferase
              source: uniprot

    - polya_signal: SV40

    - terminator: rrnB_T1
