construct:
  name: "Secreted_Yeast_Protein_Production"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive yeast promoter chosen for industrial production levels
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor  # Substituted mammalian signal with yeast-appropriate alpha-factor for secretion per rule 18
          - gene:
              id: SecretedYeastProtein
              source: uniprot
          - tag: FLAG
    - terminator: CYC1_term