construct:
  name: "SecretedYeastProtein_FLAG"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: SecretedYeastProtein
              source: uniprot
          - tag: FLAG

    - terminator: CYC1_terminator
