construct:
  name: "mammalian_GFP_ProteinX_ProteinY_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_ProteinX_ProteinY
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
