construct:
  name: "BacterialTargetProtein_Expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high # Optimized Shine-Dalgarno sequence will be used instead of requested Kozak sequence, which is for eukaryotic systems.
        chain:
          - gene:
              id: BacterialTargetProtein
              source: uniprot
          - tag: 6xHis
    - terminator: T7term