construct:
  name: FLAG_ProteinX_ProteinY_fusion
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinY
              source: uniprot
    
    - terminator: rrnB_T1
