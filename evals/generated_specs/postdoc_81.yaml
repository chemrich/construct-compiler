construct:
  name: "Fab_Z_secretion_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Fab_Z
        expression: high
        chain:
          - tag: alpha_factor_signal  # Yeast-optimized signal peptide for ER secretion
          - gene:
              id: Fab_Z
              source: uniprot
          - cleavage_site: 3C
          - tag: c_Myc

    - terminator: CYC1_poly_A
