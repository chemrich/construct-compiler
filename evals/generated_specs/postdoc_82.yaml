construct:
  name: ProteinA_ProteinB_coexpression
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinA
              source: uniprot

    # Note: IRES is a mammalian mechanism and non-functional in bacteria.
    # Using a ribosome binding site (RBS) spacer instead for independent translation
    # of ProteinB at comparable levels to ProteinA.
    - spacer: 35

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: SUMO
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
