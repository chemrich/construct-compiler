construct:
  name: "proteinA_proteinB_coexpression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: proteinA
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinA
              source: uniprot
    - spacer: 30 # IRES is not functional in E. coli; replaced with a 30bp spacer to facilitate polycistronic expression with independent translation.
    - cistron:
        label: proteinB
        expression: medium
        fused: false
        chain:
          - solubility_tag: SUMO
          - gene:
              id: ProteinB
              source: uniprot
    - terminator: T7term