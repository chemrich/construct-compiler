construct:
  name: "KinaseK_GST_yeast_high_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: KinaseK_GST
        expression: high
        chain:
          - tag: GST
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KinaseK
              source: uniprot

    - terminator: CYC1
