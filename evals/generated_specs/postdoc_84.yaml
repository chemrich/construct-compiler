construct:
  name: "GST_KinaseK_Yeast_Expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: kinase_target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: KinaseK
              source: uniprot
    - terminator: CYC1_term  # Standard yeast transcription terminator```yaml
