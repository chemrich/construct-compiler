construct:
  name: "yeast_dual_reporter_awesome_promoter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AwesomePromoter
    - cistron:
        label: stoichiometric_reporters
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: T2A
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase
    - terminator: ADH1