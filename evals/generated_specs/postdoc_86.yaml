construct:
  name: "AwesomePromoter_GFP_T2A_mCherry"
  host: yeast

  backbone:
    catalog_vector: "pRS416"
    resistance: uracil
    ori: CEN6_ARSH4
    source: addgene

  cassette:
    - promoter: AwesomePromoter

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 24  # T2A self-cleaving peptide (24 bp)

    - cistron:
        label: mCherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: ADH1
