construct:
  name: "mammalian_HDR_integration_GeneOfInterest_Flag_puro"
  host: HEK293

  backbone:
    catalog_vector: "pTwist HDR"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - element: homology_arm_5prime
      type: genomic_dna
      length: 500
      label: "5prime_homology"

    - promoter: CAG

    - cistron:
        label: GeneOfInterest
        expression: high
        chain:
          - gene:
              id: GeneOfInterest
              source: uniprot
          - tag: FLAG

    - terminator: SV40_polyA

    - element: spacer_internal
      length: 50

    - promoter: EF1_alpha

    - cistron:
        label: puromycin_resistance
        expression: high
        gene:
          id: PuroR
          source: uniprot

    - terminator: SV40_polyA

    - element: homology_arm_3prime
      type: genomic_dna
      length: 500
      label: "3prime_homology"
