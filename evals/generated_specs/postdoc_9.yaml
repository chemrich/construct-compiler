construct:
  name: polycistronic_subunit1_subunit2_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: subunit1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Subunit1
              source: uniprot

    # Note: Yeast lacks IRES machinery for polycistronic mRNA translation
    # Using spacer but recommend separate cassettes for functional expression
    - spacer: 30

    - cistron:
        label: subunit2
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Subunit2
              source: uniprot

    - terminator: rrnB_T1