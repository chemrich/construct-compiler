construct:
  name: "yeast_subunit1_subunit2_polycistronic"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: Subunit1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Subunit1
              source: uniprot

    - spacer: 30

    # Note: S. cerevisiae lacks IRES. Using separate translation via 5' UTR optimization.
    # For true polycistronic in yeast, consider 2A peptide or dual promoters instead.
    - cistron:
        label: Subunit2
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Subunit2
              source: uniprot

    - terminator: rrnB_T1