construct:
  name: "TetOn_inducible_reporter_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: rtTA
        expression: medium
        gene:
          id: rtTA
          source: uniprot

    - terminator: WPRE

    - spacer: 50

    - promoter: TRE

    - cistron:
        label: ReporterProtein
        expression: high
        chain:
          - gene:
              id: ReporterProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: GFP

    - terminator: WPRE
