construct:
  name: ubiquitin_TargetProtein_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ubiquitin_fusion
        expression: high
        chain:
          - gene:
              id: P62249
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TargetProtein
              source: uniprot

    - terminator: rrnB_T1
