construct:
  name: "yeast_ubiquitin_target_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: ubiquitin_fusion
        expression: high
        chain:
          - gene:
              id: UBB
              source: uniprot
          - gene:
              id: TargetProtein
              source: uniprot
    - terminator: CYC1_term