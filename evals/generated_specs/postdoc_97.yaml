construct:
  name: "GeneX_HA_GeneY_Myc_dual_resistance"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV
    
    - cistron:
        label: GeneX
        expression: high
        chain:
          - gene:
              id: GeneX
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1

    - promoter: PGK

    - cistron:
        label: GeneY
        expression: high
        chain:
          - gene:
              id: GeneY
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1

    - promoter: CMV

    - cistron:
        label: blasticidin_resistance
        expression: high
        gene:
          id: BSD
          source: uniprot

    - terminator: rrnB_T1

    - promoter: PGK

    - cistron:
        label: neomycin_resistance
        expression: high
        gene:
          id: NEO
          source: uniprot

    - terminator: rrnB_T1
