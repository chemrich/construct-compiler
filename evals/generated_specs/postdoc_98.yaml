construct:
  name: "Aga2p_PeptideZ_surface_display"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - gene:
              id: Aga2p
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PeptideZ
              source: uniprot

    - terminator: CYC1
