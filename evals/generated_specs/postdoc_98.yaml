construct:
  name: "yeast_surface_display_PeptideZ"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: PeptideZ
    - terminator: CYC1_term