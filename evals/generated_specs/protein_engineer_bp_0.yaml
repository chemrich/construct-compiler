construct:
  name: "Pichia_pastoris_GFP_secreted"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: ColA
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: GFP_codon_optimized_Pichia
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1_TT
