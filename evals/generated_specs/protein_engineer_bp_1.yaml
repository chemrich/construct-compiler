construct:
  name: bacillus_secreted_cutinase_FLAG
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - tag: FLAG
          - gene:
              id: cutinase
              source: uniprot

    - terminator: rrnB_T1
