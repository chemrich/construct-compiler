```yaml
construct:
  name: "pichia_lipase_secretion_system"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - tag: alpha_MF  # secretion signal for yeast
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: P29391  # Candida antarctica lipase B
              source: uniprot

    - terminator: AOX1_TT
```