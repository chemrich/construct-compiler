construct:
  name: Pichia_lipase_secretion
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: lipase_codon_optimized_pichia
              source: uniprot
        secretion_signal: alpha_MF

    - terminator: rrnB_T1
