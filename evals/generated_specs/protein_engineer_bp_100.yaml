construct:
  name: "Pichia_pastoris_secretory_enzyme_His6"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: secretory_enzyme
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - cleavage_site: TEV
          - gene:
              id: target_enzyme
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
