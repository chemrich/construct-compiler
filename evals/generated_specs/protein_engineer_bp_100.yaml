construct:
  name: "Pichia_PAOX1_Secretory_Enzyme"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PAOX1
    - cistron:
        label: secretory_target
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: TEV
          - gene:
              id: target_enzyme
          - tag: 6xHis
    - terminator: AOX1_term