construct:
  name: "bacillus_subtilis_Pveg_AmyE_StrepII_secretion_optimization"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: Pveg
      cistron:
        label: secreted_target_protein
        expression: high
        chain:
          - tag: AmyE # Bacillus secretion signal peptide
          - tag: Strep-II
          - gene:
              id: mEGFP
              source: fpbase
      terminator: rrnB_T1