construct:
  name: "pichia_pastoris_dual_expression_subunits"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: PAOX1
    - cistron:
        label: subunit_a
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: Subunit_A
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1_TT
    - promoter: PAOX1
    - cistron:
        label: subunit_b
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: Subunit_B
              source: uniprot
          - tag: FLAG
    - terminator: AOX1_TT