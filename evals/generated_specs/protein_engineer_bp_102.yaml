construct:
  name: "pichia_dual_subunit_coexpression"
  host: yeast

  backbone:
    catalog_vector: "pPICZalpha"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: Subunit_A
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: Subunit_B
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
