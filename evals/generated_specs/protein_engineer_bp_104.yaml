construct:
  name: "Pichia_pastoris_lipase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - cleavage_site: Kex2
          - gene:
              id: lipase
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
