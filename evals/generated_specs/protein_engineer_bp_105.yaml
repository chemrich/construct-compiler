construct:
  name: "Bacillus_secretion_vector_Pgrac_AprE_protease_HA"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_protease
        expression: high
        chain:
          - secretion_signal: AprE
          - gene:
              id: proprietary_protease
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
