construct:
  name: "Bacillus_protease_secretion_vector"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pgrac
      cistron:
        label: protease_production
        expression: high
        chain:
          - secretion_signal: AprE
          - gene:
              id: protease
          - tag: HA
      terminator: rrnB_T1