construct:
  name: "bacillus_two_enzyme_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_A
              source: uniprot
              codon_optimization: bacillus

    - spacer: 30

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: enzyme_B
              source: uniprot
              codon_optimization: bacillus

    - terminator: rrnB_T1
