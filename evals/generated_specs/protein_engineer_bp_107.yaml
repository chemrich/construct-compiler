construct:
  name: scFv_pichia_secreted
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - secretion_signal: alpha_factor
          - gene:
              id: scFv
              source: uniprot

    - terminator: CYC1
