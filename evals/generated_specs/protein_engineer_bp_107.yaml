construct:
  name: "PAOX1_scFv_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PAOX1
    - cistron:
        label: scFv_target
        expression: high
        chain:
          - tag: alpha-factor
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: scFv
    - terminator: AOX1_term