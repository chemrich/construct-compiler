construct:
  name: "Bacillus_therapeutic_MBP_fusion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PamyL

    - cistron:
        label: therapeutic_MBP_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: therapeutic_protein
              # Note: Replace 'therapeutic_protein' with actual UniProt ID or protein identifier

    - terminator: rrnB_T1
