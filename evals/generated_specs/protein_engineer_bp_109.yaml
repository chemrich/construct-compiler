construct:
  name: "Pichia_toxic_protein_intracellular"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: target_protein
              source: uniprot
    - terminator: AOX1_TT