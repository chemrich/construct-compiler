construct:
  name: "pichia_pastoris_GST_toxin_PAOX1"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: GST_toxin
        expression: low
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
