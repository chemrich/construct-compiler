construct:
  name: "bacillus_pmtla_lipa_cellulase"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: PmtlA
    - cistron:
        label: target
        expression: high
        chain:
          - tag: LipA
          - tag: Twin-Strep
          - cleavage_site: 3C
          - gene:
              id: celA
              source: uniprot
    - terminator: rrnB_T1