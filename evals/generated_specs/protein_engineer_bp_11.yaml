construct:
  name: bacillus_lipase_cellulase_secretion
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: LipA_signal_peptide
          - tag: Twin-Strep
          - cleavage_site: 3C
          - gene:
              id: cellulase_Bacillus
              source: uniprot

    - terminator: rrnB_T1
