```yaml
construct:
  name: "Bacillus_cellulase_secretion_construct"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: LipA_signal  # secretion signal for Bacillus
          - tag: Twin-Strep
          - cleavage_site: 3C
          - gene:
              id: cellulase
              source: uniprot

    - terminator: rrnB_T1
```