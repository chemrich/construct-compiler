construct:
  name: "bacillus_engineered_amylase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AmyQ

    - cistron:
        label: amylase
        expression: high
        chain:
          - secretion_signal: AmyQ_signal_sequence
          - gene:
              id: amylase_engineered
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
