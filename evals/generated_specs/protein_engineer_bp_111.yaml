construct:
  name: "pichia_antibody_heavy_light"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: antibody_heavy_chain
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1

    - promoter: PAOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: antibody_light_chain
              source: uniprot

    - terminator: CYC1
