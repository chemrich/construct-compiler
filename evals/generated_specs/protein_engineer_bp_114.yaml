construct:
  name: "Bacillus_lipolytic_secretion_cassette"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PamyL

    - cistron:
        label: lipolytic_enzyme
        expression: high
        chain:
          - signal_peptide: Vpr_protease
          - gene:
              id: lipase
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
