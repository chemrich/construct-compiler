construct:
  name: "pichia_pastoris_3_gene_metabolic_pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PGAP
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: metabolic_enzyme_1
              source: uniprot
    - terminator: AOX1_term
    - promoter: PGAP
    - cistron:
        label: enzyme_2
        expression: high
        gene:
          id: metabolic_enzyme_2
          source: uniprot
    - terminator: AOX1_term
    - promoter: PGAP
    - cistron:
        label: enzyme_3
        expression: high
        gene:
          id: metabolic_enzyme_3
          source: uniprot
    - terminator: AOX1_term