construct:
  name: bacillus_nanobody_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pglv

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: nanobody
              source: uniprot
          - tag: c_Myc

    - terminator: rrnB_T1
