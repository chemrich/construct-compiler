construct:
  name: "Pichia_glycoprotein_PAOX1_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_glycoprotein
        expression: high
        chain:
          - tag: alpha_factor_prepro
          - cleavage_site: Kex2
          - gene:
              id: target_glycoprotein
              source: uniprot
          - tag: Twin-Strep

    - terminator: CYC1
