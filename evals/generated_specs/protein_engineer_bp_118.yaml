construct:
  name: "bacillus_autodisplay_passenger"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: autodisplay
        expression: high
        chain:
          - tag: YuaB_BslA
          - cleavage_site: TEV
          - gene:
              id: passenger_protein
              source: uniprot

    - terminator: rrnB_T1
