construct:
  name: "pichia_fld1_antigen_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: target_antigen
        expression: high
        chain:
          - tag: alpha-factor
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: surface_antigen
              source: uniprot
    - terminator: AOX1_term_v2 # Standard terminator for Pichia systems to ensure proper mRNA processing.