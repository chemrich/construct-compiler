construct:
  name: "pichia_viral_antigen_FLD1"
  host: yeast

  backbone:
    resistance: zeomycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: secreted_antigen
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: viral_surface_antigen
              source: uniprot

    - terminator: CYC1_terminator
