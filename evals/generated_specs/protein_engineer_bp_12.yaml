construct:
  name: "Pichia_pastoris_dual_chaperone_expression"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP
    
    - cistron:
        label: chaperone
        expression: high
        gene:
          id: KAR2
          source: uniprot

    - terminator: CYC1

  cassette_2:
    - promoter: AOX1
    
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis

    - terminator: TT_AOX1
