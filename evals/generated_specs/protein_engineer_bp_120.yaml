construct:
  name: "scFv_secretion_Pichia_pastoris"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv_codon_optimized_pichia
              source: custom
          - cleavage_site: Kex2
          - tag: 6xHis

    - terminator: CYC1
