construct:
  name: "bacillus_secreted_cutinase"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: custom
  cassette:
    - promoter: Pgrac
    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: cutinase
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II
    - terminator: rrnB_T1