construct:
  name: cutinase_secretion_bacillus
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: cutinase
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: cutinase
              source: uniprot
          - cleavage_site: TEV
          - tag: Strep-II

    - terminator: rrnB_T1
