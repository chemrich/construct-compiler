construct:
  name: "pichia_mAb_heavy_light_chains"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mAb_heavy_chain
              source: uniprot

    - spacer: 30

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mAb_light_chain
              source: uniprot

    - terminator: rrnB_T1
