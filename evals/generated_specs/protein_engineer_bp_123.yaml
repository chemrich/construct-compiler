construct:
  name: nattokinase_SUMO_TEV_Bacillus
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: nattokinase_construct
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: nattokinase
              source: uniprot
              # Codon optimization for B. subtilis is handled by compiler

    - terminator: rrnB_T1
