construct:
  name: "HSA_therapeutic_peptide_pichia"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: HSA_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: P02768
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - tag: FLAG
          - tag: His6

    - terminator: rrnB_T1
