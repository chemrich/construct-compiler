construct:
  name: "Pichia_pastoris_FLD1_lipase_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: lipase
        expression: high
        chain:
          - signal_peptide: alpha_factor_pre_pro
          - gene:
              id: lipase_novel
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: myc

    - terminator: AOX1
