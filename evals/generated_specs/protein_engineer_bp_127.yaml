construct:
  name: "subtilisin_groeles_dual_expression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: subtilisin_secreted
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: subtilisin_variant
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 40

    - promoter: Pgrac

    - cistron:
        label: groeles_chaperone
        expression: high
        fused: false
        gene:
          id: groES
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 40

    - promoter: Pgrac

    - cistron:
        label: groel_chaperone
        expression: high
        fused: false
        gene:
          id: groEL
          source: uniprot

    - terminator: rrnB_T1
