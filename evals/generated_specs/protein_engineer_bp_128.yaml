construct:
  name: "Pichia_secretion_biosensor"
  host: yeast
  backbone:
    resistance: zeocin
    ori: pUC
    source: custom
  cassette:
    - promoter: GAP
    - cistron:
        label: biosensor
        expression: high
        chain:
          - tag: Ost1-alpha-factor
          - gene:
              id: mNeonGreen
              source: fpbase
          - cleavage_site: 3C
          - tag: Twin-Strep
    - terminator: AOX1