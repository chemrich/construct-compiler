construct:
  name: "Pichia_pastoris_fluorescent_biosensor_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: biosensor
        expression: high
        chain:
          - secretion_signal: Ost1_alpha_factor_hybrid
          - gene:
              id: biosensor
              source: custom
          - cleavage_site: 3C
          - tag: Twin-Strep

    - terminator: rrnB_T1
