construct:
  name: "bacillus_lipase_extracellular_esterase"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - rbs: RBS_bacillus_consensus

    - cistron:
        label: esterase
        expression: high
        chain:
          - signal_peptide: LipA
          - gene:
              id: lipA_esterase
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
