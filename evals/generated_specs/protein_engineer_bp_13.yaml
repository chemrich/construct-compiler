construct:
  name: "Bacillus_amylase_secretion_construct"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: amylase_secreted
        expression: high
        chain:
          - tag: YncM
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: amylase
              source: uniprot

    - terminator: rrnB_T1
