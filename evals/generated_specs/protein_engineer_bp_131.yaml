construct:
  name: "Bacillus_phytase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: phytase
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: "phytase_codon_optimized_bacillus"
              source: uniprot
              # Phytase from common feed additive sources (e.g., Aspergillus niger AppA or Escherichia coli AppA)
              # User specifies Bacillus codon optimization; compiler applies appropriate optimization profile

    - terminator: rrnB_T1
