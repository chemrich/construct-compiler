construct:
  name: "interferon_PDI_coexpression_pichia"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: interferon_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: interferon_alpha_2b
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: GAP

    - cistron:
        label: PDI_intracellular
        expression: medium
        gene:
          id: PDI
          source: uniprot

    - terminator: CYC1
