construct:
  name: "pichia_interferon_alpha2_pdi_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: interferon_alpha2
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: P01563
              source: uniprot
    - terminator: AOX1_term
    - promoter: GAP
    - cistron:
        label: pdi_chaperone
        expression: medium
        gene:
          id: P26327
          source: uniprot
    - terminator: CYC1_term