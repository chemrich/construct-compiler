construct:
  name: "Pichia_pastoris_anti_EGFR_nanobody_secreted"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: anti_EGFR_nanobody
        expression: high
        chain:
          - tag: HA
          - cleavage_site: Enterokinase
          - secretion_signal: alpha_factor
          - gene:
              id: anti_EGFR_nanobody
              source: uniprot
              codon_optimization: pichia_pastoris

    - terminator: rrnB_T1
