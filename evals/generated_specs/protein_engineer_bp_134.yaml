construct:
  name: "Pichia_anti_EGFR_nanobody_secretion"
  host: yeast
  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secretable_nanobody
        expression: high
        chain:
          - tag: alpha_factor
          - tag: HA
          - cleavage_site: Enterokinase
          - gene:
              id: "7D12"
              source: uniprot
    - terminator: AOX1_term