construct:
  name: "thermostable_cellulase_secreted_bacillus"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: cellulase
        expression: high
        chain:
          - signal_peptide: AprE
          - gene:
              id: thermostable_cellulase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
