construct:
  name: Fc_fusion_therapeutic_pichia_pastoris
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: fc_fusion_therapeutic
        expression: high
        codon_optimization: GC_enriched_pichia
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: human_Fc
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: therapeutic_domain
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
