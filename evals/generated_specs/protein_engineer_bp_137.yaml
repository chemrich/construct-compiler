construct:
  name: "bacillus_protease_stabilization_dual_promoter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: protease_secreted
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: protease
              source: uniprot

    - terminator: rrnB_T1

  cassette_2:
    - promoter: Pxyl

    - cistron:
        label: protease_inhibitor
        expression: medium
        gene:
          id: inhibitor_peptide
          source: uniprot

    - terminator: rrnB_T1
