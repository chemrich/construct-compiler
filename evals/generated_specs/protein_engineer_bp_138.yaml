construct:
  name: "elastase_pichia_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: elastase
        expression: high
        chain:
          - signal_peptide: Ost1_alpha_factor_preproseq
          - gene:
              id: elastase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
