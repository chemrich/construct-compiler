construct:
  name: "Pichia_pastoris_AOX1_Elastase_CELA1"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: elastase_secretion_unit
        expression: high
        chain:
          - tag: "Ost1-alpha-factor"
          - gene:
              id: "CELA1_HUMAN"
              source: uniprot
          - tag: "6xHis"
    - terminator: AOX1_term