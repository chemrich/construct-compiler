construct:
  name: bacillus_subtilis_vaccine_antigen
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: antigen
        expression: high
        chain:
          - signal_sequence: VapA
          - gene:
              id: antigen
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: FLAG

    - terminator: rrnB_T1
