```yaml
construct:
  name: "pichia_secreted_mcherry_scfv_reporter"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_reporter
        expression: high
        chain:
          - tag: alpha_factor  # secretion signal for yeast
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: scFv_target
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1_TT
```