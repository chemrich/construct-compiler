construct:
  name: "Pichia_secreted_reporter_scFv"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
