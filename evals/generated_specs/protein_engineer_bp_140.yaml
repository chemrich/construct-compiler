construct:
  name: "pichia_pastoris_lipaseA_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: autonomously_replicating_sequence
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipaseA_secreted
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: LipaseA
              source: uniprot
          - tag: 6xHis

    - terminator: TT_AOX1
