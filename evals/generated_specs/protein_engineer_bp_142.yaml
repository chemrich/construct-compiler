construct:
  name: "pGAP_alpha_factor_mEGFP_Strep"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: secretory_reporter
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Strep-II
    - terminator: AOX1_TT