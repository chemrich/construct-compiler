construct:
  name: "Pichia_GAP_GFP_secretion"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - tag: alpha-factor
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Strep-II

    - terminator: rrnB_T1
