construct:
  name: "xylose_inducible_cellulase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PxylA

    - cistron:
        label: cellulase
        expression: high
        chain:
          - signal_peptide: SacB
          - gene:
              id: cellulase
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
