construct:
  name: "pichia_pastoris_chitinase_sumo_his"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: chitinase_sumo_his
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: 3C
          - gene:
              id: chitinase
              source: uniprot

    - terminator: rrnB_T1
