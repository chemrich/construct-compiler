construct:
  name: "bacillus_secreted_serine_protease"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - rbs: optimized

    - cistron:
        label: secreted_protease
        expression: high
        chain:
          - signal_peptide: WapA
          - gene:
              id: serine_protease
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
