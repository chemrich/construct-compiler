construct:
  name: "Bacillus_Pveg_WapA_Subtilisin_6xHis"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
  cassette:
    - promoter: Pveg
      cistron:
        label: secreted_protease
        expression: high
        chain:
          - tag: WapA  # Secretion signal peptide for B. subtilis
          - gene:
              id: P04189  # UniProt ID for Subtilisin E (Serine Protease)
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag
      terminator: rrnB_T1