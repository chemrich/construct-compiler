construct:
  name: "dual_subunit_pichia_pastoris"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: secretion_signal_alpha_factor
          - gene:
              id: subunit_A
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1

    - promoter: AOX1

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: secretion_signal_alpha_factor
          - gene:
              id: subunit_B
              source: uniprot
          - tag: Myc

    - terminator: CYC1
