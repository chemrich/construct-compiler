construct:
  name: "bacillus_toxin_complex_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: toxinA
        expression: high
        chain:
          - tag: AmyE_signal
          - gene:
              id: ToxinA
              source: uniprot

    - spacer: 25

    - cistron:
        label: toxinB
        expression: high
        fused: false
        rbs: strong
        chain:
          - tag: AmyQ_signal
          - gene:
              id: ToxinB
              source: uniprot

    - terminator: rrnB_T1
