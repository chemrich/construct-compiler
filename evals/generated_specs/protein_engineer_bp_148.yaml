construct:
  name: "Pichia_FLD1_alphafactor_cytokine_HSA"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: pichia_expression_vector

  cassette:
    - promoter: FLD1

    - cistron:
        label: secreted_cytokine_HSA
        expression: high
        chain:
          - secretion_signal: alpha_factor_prepro
          - gene:
              id: cytokine
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - solubility_tag: HSA_domain

    - terminator: rrnB_T1
