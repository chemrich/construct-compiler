construct:
  name: "bacillus_phytase_secretion_cassette"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - rbs: RBS_strong

    - cistron:
        label: phytase_secreted
        expression: high
        chain:
          - secretion_signal: SamP
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: phytase
              source: uniprot

    - terminator: rrnB_T1
