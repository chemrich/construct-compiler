construct:
  name: "bacillus_subtilis_intracellular_antigen_expression"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110  # Bacillus-specific origin for stable maintenance
  cassette:
    - promoter: Pgrac100  # High-level IPTG-inducible promoter for Bacillus
    - cistron:
        label: target_antigen
        expression: high
        chain:
          - solubility_tag: Trx
          - cleavage_site: TEV
          - gene:
              id: viral_antigen
              source: uniprot
    - terminator: rrnB_T1