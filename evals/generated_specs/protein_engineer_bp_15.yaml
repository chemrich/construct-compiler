    - cistron:
        label: viral_antigen
        expression: high
        chain:
          - solubility_tag: Trx
          - cleavage_site: TEV
          - gene:
              id: P1A  # Example viral antigen - replace with specific antigen ID
              source: uniprot
              codon_optimize: B_subtilis

    - terminator: rrnB_T1
