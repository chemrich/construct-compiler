construct:
  name: "Pichia_Ost1_scFv_TwinStrep"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: target_scFv
        expression: high
        chain:
          - tag: Ost1
          - gene:
              id: scFv
          - tag: Twin-Strep
    - terminator: AOX1_TT