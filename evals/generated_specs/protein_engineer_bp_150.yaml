construct:
  name: "Pichia_pastoris_Ost1_scFv_TwinStrep"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_scFv
        expression: high
        chain:
          - secretion_signal: Ost1
          - gene:
              id: scFv
              source: uniprot
          - tag: Twin-Strep

    - terminator: rrnB_T1
