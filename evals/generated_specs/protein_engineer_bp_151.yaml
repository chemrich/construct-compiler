construct:
  name: "Bacillus_subtilis_Subtilisin_E_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PxylA

    - cistron:
        label: subtilisin_E
        expression: high
        chain:
          - signal_peptide: NprE
          - gene:
              id: aprE
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
