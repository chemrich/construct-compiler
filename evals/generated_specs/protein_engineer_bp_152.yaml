construct:
  name: pichia_pastoris_IgG1Fc_nanobody_GAP
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: Fc_nanobody_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - solubility_tag: IgG1_Fc
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot

    - terminator: rrnB_T1
