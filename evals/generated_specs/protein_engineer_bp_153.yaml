construct:
  name: "bacillus_phytase_expression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: 10xHis
          - gene:
              id: YncM
              source: uniprot
          - gene:
              id: phytase_codon_optimized_bacillus
              source: uniprot

    - terminator: rrnB_T1
