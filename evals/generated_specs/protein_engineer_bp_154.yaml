construct:
  name: "pichia_pastoris_thermostable_xylanase_secretion"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: xylanase_secreted
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: thermostable_xylanase
              source: uniprot
          - cleavage_site: PreScission
          - solubility_tag: GST

    - terminator: rrnB_T1
