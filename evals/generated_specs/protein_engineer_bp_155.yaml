construct:
  name: "Bacillus_Lipase_secretion_optimized"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac01

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - tag: signal_peptide_LipA
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: lipase
              source: uniprot

    - terminator: rrnB_T1
