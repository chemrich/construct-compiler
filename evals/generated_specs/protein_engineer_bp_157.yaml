construct:
  name: "bacillus_keratinase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - rbs: strong  # strong RBS for Bacillus

    - cistron:
        label: keratinase_secreted
        expression: high
        chain:
          - signal_peptide: Vpr  # Vpr signal peptide for Bacillus secretion
          - gene:
              id: keratinase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
