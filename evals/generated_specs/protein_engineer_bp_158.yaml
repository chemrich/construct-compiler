construct:
  name: pPICZalpha_esterase_construct
  host: yeast

  backbone:
    catalog_vector: pPICZalpha
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: esterase
        expression: high
        chain:
          - solubility_tag: alpha_factor_prepro
          - tag: c_Myc
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: esterase
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
