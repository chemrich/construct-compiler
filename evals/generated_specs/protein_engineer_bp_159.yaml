construct:
  name: "bacillus_fab_secretion_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: AmyE
          - gene:
              id: P01857
              source: uniprot

    - spacer: 30

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - secretion_signal: SacB
          - gene:
              id: P01834
              source: uniprot

    - terminator: rrnB_T1
