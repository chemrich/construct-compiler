construct:
  name: Pichia_phytase_commercial_scale
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: secretion_leader
        expression: high
        chain:
          - gene:
              id: alpha_mating_factor_Kex2
              source: uniprot
          - cleavage_site: Kex2

    - cistron:
        label: phytase
        expression: high
        fused: false
        gene:
          id: phytase
          source: uniprot

    - terminator: rrnB_T1
