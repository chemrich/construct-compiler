construct:
  name: "Bacillus_amylase_secretion_construct"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: amylase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: amylase
              source: uniprot
              codon_optimization: bacillus_subtilis
          - tag: 6xHis

    - terminator: rrnB_T1
