construct:
  name: "Pichia_pastoris_PAOX1_nanobody_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot
              codon_optimize: pichia_pastoris
          - tag: 6xHis

    - terminator: rrnB_T1
