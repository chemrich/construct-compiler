construct:
  name: "Pichia_pastoris_PGAP_lipase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: lipase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipase
              source: uniprot
          - tag: Myc

    - terminator: CYC1_terminator
