construct:
  name: "pichia_heterodimeric_complex"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot

    - terminator: CYC1

  cassette_2:
    - promoter: PAOX1

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: CYC1
