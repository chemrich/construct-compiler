construct:
  name: "Pichia_pastoris_intracellular_enzyme_MBP"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: human_enzyme
              source: uniprot
              codon_optimization: pichia_pastoris

    - terminator: CYC1
