construct:
  name: "bacillus_amyQ_sfgfp_secretion_assay"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: secreted_sfGFP
        expression: high
        chain:
          - secretion_signal: AmyQ
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1