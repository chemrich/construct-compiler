construct:
  name: "Bacillus_sfGFP_secretion_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: sfGFP_secreted
        expression: high
        chain:
          - signal_peptide: AmyQ
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
