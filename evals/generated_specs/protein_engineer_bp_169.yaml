construct:
  name: "pichia_viral_antigen_secreted"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: viral_antigen
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: viral_surface_antigen
              source: uniprot

    - terminator: AOX1
