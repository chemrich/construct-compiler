construct:
  name: "Bacillus_target_PrsA_coexpression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: target
        expression: high
        chain:
          - tag: AmyE_signal
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: chaperone
        expression: high
        fused: false
        gene:
          id: PrsA
          source: uniprot

    - terminator: rrnB_T1
