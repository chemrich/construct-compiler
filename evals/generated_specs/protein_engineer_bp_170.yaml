construct:
  name: bacillus_cellulase_producer
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: cel5A
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
