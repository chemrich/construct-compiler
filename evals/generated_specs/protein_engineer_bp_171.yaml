construct:
  name: membrane_receptor_pichia_pastoris
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: receptor
        expression: high
        codon_optimization: pichia_pastoris
        chain:
          - tag: FLAG
          - cleavage_site: 3C
          - gene:
              id: membrane_receptor
              source: uniprot

    - terminator: rrnB_T1
