construct:
  name: "bacillus_groeles_target_coexpression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: groeles_chaperone
        expression: high
        gene:
          id: groES_groEL
          source: uniprot

    - spacer: 30

    - cistron:
        label: target
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
