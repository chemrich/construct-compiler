construct:
  name: "Pichia_pastoris_secreted_cytokine"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: secreted_cytokine
        expression: high
        chain:
          - tag: alpha_factor_preproleader
          - cleavage_site: TEV
          - gene:
              id: cytokine
              source: uniprot
              codon_optimization: pichia_pastoris
          - tag: Strep-II

    - terminator: rrnB_T1
