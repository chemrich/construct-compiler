construct:
  name: "bacillus_chaperone_overexpression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: chaperone
        expression: high
        chain:
          - gene:
              id: groES
              source: uniprot
          - cleavage_site: Thrombin
          - tag: HA

    - terminator: rrnB_T1
