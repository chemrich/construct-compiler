construct:
  name: pichia_pastoris_secreted_esterase
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: secreted_esterase
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - gene:
              id: novel_fungal_esterase
              source: uniprot

    - terminator: CYC1
