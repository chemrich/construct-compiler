construct:
  name: "pAOX1_fungal_esterase_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_esterase
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - gene:
              id: fungal_esterase
              source: uniprot
    - terminator: AOX1_TT