construct:
  name: bacillus_growth_factor_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - signal_peptide: LipA_Bacillus
          - gene:
              id: HGF
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
