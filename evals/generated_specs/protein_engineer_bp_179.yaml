construct:
  name: "aggregation_prone_scFv_MBP_His_pichia"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeomycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: scFv_MBP_His
        expression: high
        chain:
          - tag: alpha_factor_signal
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
