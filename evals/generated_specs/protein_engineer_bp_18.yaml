construct:
  name: "pichia_ubiquitin_kinase_ha"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: ubiquitin_kinase_ha
        expression: high
        chain:
          - tag: Ubiquitin
          - cleavage_site: USP2
          - gene:
              id: S6K1
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
