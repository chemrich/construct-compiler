```yaml
construct:
  name: "ubiquitin_kinase_stability_test"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: target_kinase
        expression: high
        chain:
          - tag: Ubiquitin
          - cleavage_site: Ubp1  # deubiquitinase cleavage site
          - gene:
              id: P06493  # CDK1 human kinase
              source: uniprot
          - tag: HA

    - terminator: CYC1
```