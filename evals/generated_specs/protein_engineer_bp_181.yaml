construct:
  name: "Pichia_pastoris_scFv_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: scFv_human
              source: uniprot

    - terminator: rrnB_T1
