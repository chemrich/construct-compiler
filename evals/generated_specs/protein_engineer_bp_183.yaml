construct:
  name: "Pichia_pastoris_dual_IgG_expression"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: IgG_heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: IGHG1
              source: uniprot

    - terminator: rrnB_T1

  cassette_2:
    - promoter: GAP

    - cistron:
        label: IgG_light_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: IGKC
              source: uniprot

    - terminator: rrnB_T1
