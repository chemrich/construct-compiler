construct:
  name: bacillus_synthetic_promoter_sfGFP_reporter
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: synthetic_placeholder  # User-defined synthetic promoter for library testing

    - cistron:
        label: sfGFP_reporter
        expression: high
        rbs: strong  # Strong RBS for Bacillus
        chain:
          - gene:
              id: sfGFP
              source: fpbase
              optimization: bacillus_codon_optimized

    - terminator: rrnB_T1

    - terminator: T7term
