construct:
  name: "Pichia_secreted_engineered_amylase"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_B"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: amylase
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: engineered_amylase
              source: uniprot
          - tag: myc

    - terminator: AOX1
