construct:
  name: "Bacillus_FabG_FabI_operon"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: FabG
        expression: high
        gene:
          id: FabG
          source: uniprot

    - spacer: 20

    - cistron:
        label: FabI
        expression: high
        fused: false
        gene:
          id: FabI
          source: uniprot

    - terminator: rrnB_T1
