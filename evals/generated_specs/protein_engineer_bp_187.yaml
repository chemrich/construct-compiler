construct:
  name: pichia_viral_capsid_his_tag
  host: yeast

  backbone:
    catalog_vector: pPIC9
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: viral_capsid
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: viral_capsid_protein
              source: uniprot

    - terminator: CYC1
