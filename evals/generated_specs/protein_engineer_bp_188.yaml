construct:
  name: "bacillus_secreted_cytokine"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: cytokine_secreted
        expression: high
        chain:
          - tag: AprE_signal_peptide
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: cytokine_human
              source: uniprot
              codon_optimization: bacillus_subtilis

    - terminator: rrnB_T1
