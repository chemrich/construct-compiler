construct:
  name: pichia_FLD1_nanobody_secretion
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: nanobody
        expression: high
        chain:
          - tag: alpha_factor_preproseq
          - cleavage_site: Kex2
          - gene:
              id: nanobody
              source: uniprot
          - tag: Strep_II

    - terminator: TT_Pichia
