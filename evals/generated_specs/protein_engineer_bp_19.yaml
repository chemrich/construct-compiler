construct:
  name: "Bacillus_subtilis_esterase_secretion_vector"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PxylA

    - cistron:
        label: esterase_secreted
        expression: high
        chain:
          - tag: 8xHis
          - tag: Strep-II
          - cleavage_site: Thrombin
          - gene:
              id: EstA
              source: uniprot
        secretion_signal: SacB

    - terminator: rrnB_T1
