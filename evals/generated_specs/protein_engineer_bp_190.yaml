construct:
  name: "Bacillus_lipase_chaperone_coexpression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: lipase
        expression: high
        chain:
          - tag: AmyE_signal
          - gene:
              id: lipase
              source: uniprot

    - terminator: rrnB_T1

  cassette_2:
    - promoter: Pveg

    - cistron:
        label: GroES
        expression: high
        chain:
          - gene:
              id: GroES
              source: uniprot

    - spacer: 25

    - cistron:
        label: GroEL
        expression: high
        fused: false
        chain:
          - gene:
              id: GroEL
              source: uniprot

    - terminator: rrnB_T1
