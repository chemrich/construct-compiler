construct:
  name: "Pichia_heterodimer_dual_cassette"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot
          - tag: FLAG

    - terminator: AOX1

    - promoter: AOX1

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot
          - tag: HA

    - terminator: AOX1
