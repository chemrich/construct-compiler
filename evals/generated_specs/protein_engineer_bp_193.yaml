construct:
  name: "pichia_pastoris_catalase_peroxisome"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: catalase_PTS1
        expression: high
        chain:
          - gene:
              id: CAT
              source: uniprot
          - tag: PTS1

    - terminator: CYC1
