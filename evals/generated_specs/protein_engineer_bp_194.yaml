construct:
  name: "bacillus_spore_display_cotG_antigen"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cotG  # Native CotG promoter for spore coat protein expression

    - cistron:
        label: spore_display
        expression: high
        chain:
          - gene:
              id: cotG
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: antigen
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
