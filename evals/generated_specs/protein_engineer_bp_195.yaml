construct:
  name: "Pichia_AOX1_MBP_enzyme"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: enzyme
              source: uniprot

    - terminator: CYC1_polA
