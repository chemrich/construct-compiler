construct:
  name: "pichia_aox1_secretion_mbp_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_solubility_enzyme
        expression: high
        chain:
          - tag: alpha_factor
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: target_enzyme
              source: uniprot
    - terminator: AOX1_TT