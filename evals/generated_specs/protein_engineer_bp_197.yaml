construct:
  name: Pichia_IFN_alpha_SUMO_secretion
  host: yeast

  cassette:
    - promoter: YPT1

    - cistron:
        label: interferon
        expression: high
        chain:
          - tag: alpha-factor
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: IFNA1
              source: uniprot

    - spacer: 30

    - cistron:
        label: selection
        expression: medium
        fused: false
        gene:
          id: Zeocin_resistance
          source: uniprot

    - terminator: CYC1
