construct:
  name: "dual_tagged_dehalogenase_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: DehA
              source: uniprot

    - terminator: rrnB_T1
