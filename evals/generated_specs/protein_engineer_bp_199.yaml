construct:
  name: "pichia_pastoris_er_retained_chaperone"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: er_chaperone
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: HSP70
              source: uniprot
          - tag: HDEL

    - terminator: rrnB_T1
