construct:
  name: "Pichia_GAP_GST_TEV_lipase_stability"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: lipase_construct
        expression: high
        chain:
          - tag: GST
          - cleavage_site: TEV
          - gene:
              id: lipase_codon_optimized_pichia
              source: uniprot

    - terminator: CYC1
