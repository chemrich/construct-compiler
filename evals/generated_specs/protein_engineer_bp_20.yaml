construct:
  name: "Bacillus_cellulase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: cellulase_codon_optimized
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
