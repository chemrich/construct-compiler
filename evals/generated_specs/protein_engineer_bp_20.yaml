construct:
  name: bacillus_secreted_cellulase_pgrac
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: P62694  # Trichoderma reesei endoglucanase I (codon-optimized for Bacillus)
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1