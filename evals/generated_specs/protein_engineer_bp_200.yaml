construct:
  name: "Bacillus_lipase_secretion_high_yield"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - secretion_tag: AmyE
          - gene:
              id: lipase
              source: uniprot
              codon_optimization: bacillus_subtilis
          - tag: 6xHis

    - terminator: rrnB_T1
