construct:
  name: "pichia_pastoris_scFv_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: scFv
              source: uniprot

    - terminator: TT_AOX1
