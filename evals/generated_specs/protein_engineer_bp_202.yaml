construct:
  name: "bacillus_kinase_groES_EL_bicistronic"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: kinase
        expression: high
        chain:
          - gene:
              id: kinase
              source: uniprot

    - spacer: 30

    - cistron:
        label: GroES_EL
        expression: high
        fused: false
        chain:
          - gene:
              id: groES
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: groEL
              source: uniprot

    - terminator: rrnB_T1
