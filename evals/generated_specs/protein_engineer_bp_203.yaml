construct:
  name: thermostable_esterase_pichia_intracellular
  host: yeast

  backbone:
    catalog_vector: "pPICZ-A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: esterase
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: thermostable_esterase
              source: uniprot

    - terminator: AOX1
