construct:
  name: "bacillus_amyE_integration_aprE_protease"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - homology_arm_left:
        locus: amyE
        length: 1000
        position: upstream

    - promoter: Pveg

    - cistron:
        label: secreted_protease
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: engineered_protease_variant
              source: custom

    - terminator: rrnB_T1

    - homology_arm_right:
        locus: amyE
        length: 1000
        position: downstream
