construct:
  name: pichia_dual_igG_expression
  host: yeast

  cassette:
    - promoter: AOX1
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: human_IgG_heavy_chain
              source: uniprot
    - terminator: AOX1_TT

  cassette:
    - promoter: AOX1
    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: human_IgG_light_chain
              source: uniprot
    - terminator: AOX1_TT

  backbone:
    resistance: zeocin
    ori: pPIC
    source: addgene
