construct:
  name: nanobody_SUMO_TEV_StrepII_Bacillus
  host: bacillus
  
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: araBAD  # Pxyl equivalent; araBAD is the xylose-inducible promoter analog for Bacillus
    
    - cistron:
        label: nanobody
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
