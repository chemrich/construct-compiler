construct:
  name: "pichia_pastoris_secretion_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_gfp
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: AOX1_term