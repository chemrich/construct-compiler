construct:
  name: "pichia_secretion_gfp_screen"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_gfp
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
