construct:
  name: "bacillus_metabolic_pathway_three_enzyme"
  host: bacillus

  backbone:
    resistance: spectinomycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - gene:
              id: P37140
              source: uniprot
        rbs: RBS_strong_bsub_1

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - gene:
              id: P39768
              source: uniprot
        rbs: RBS_medium_bsub_1

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        fused: false
        chain:
          - gene:
              id: P42877
              source: uniprot
        rbs: RBS_weak_bsub_1

    - terminator: rrnB_T1
