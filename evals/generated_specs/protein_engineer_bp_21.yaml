construct:
  name: "Pichia_pastoris_lipA_secretion"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipA_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipA
              source: uniprot
          - cleavage_site: TEV
          - tag: FLAG

    - terminator: AOX1
