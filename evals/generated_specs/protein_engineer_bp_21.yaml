construct:
  name: "pichia_pastoris_lipA_secretion_system"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_lipA
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: LIPA
              source: uniprot
          - cleavage_site: TEV
          - tag: FLAG
    - terminator: AOX1