construct:
  name: markerless_replacement_sacB_amylase
  host: bacillus
  
  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: native
      # Native amylase promoter from B. subtilis
    
    - cistron:
        label: amylase_mutant
        expression: medium
        chain:
          - gene:
              id: amyE_mutant
              source: uniprot
              # Native signal peptide retained for secretion
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: native
      # Native constitutive promoter for counter-selection
    
    - cistron:
        label: counter_selection
        expression: high
        fused: false
        gene:
          id: sacB
          source: uniprot
          # SacB encodes levansucrase; cells expressing sacB are killed by sucrose
    
    - terminator: rrnB_T1
