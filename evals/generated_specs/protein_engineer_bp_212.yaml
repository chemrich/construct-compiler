construct:
  name: "cotB_spike_domain_spore_display"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PcotB  # Native Bacillus cotB sporulation-specific promoter

    - cistron:
        label: spike_display
        expression: high
        chain:
          - gene:
              id: cotB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: spike_domain
              source: uniprot

    - terminator: rrnB_T1
