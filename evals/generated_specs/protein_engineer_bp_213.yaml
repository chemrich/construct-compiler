construct:
  name: Pichia_pastoris_CRISPR_Cas9_editing
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: Cas9
        expression: high
        chain:
          - gene:
              id: Cas9_Pichia_pastoris_codon_optimized
              source: uniprot
              # Note: This references a Pichia-optimized variant of Cas9

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: SNR52

    - cistron:
        label: sgRNA
        expression: medium
        chain:
          - gene:
              id: sgRNA_scaffold
              source: uniprot

    - terminator: rrnB_T1
