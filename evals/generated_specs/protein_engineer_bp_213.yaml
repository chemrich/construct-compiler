construct:
  name: "Pichia_Cas9_sgRNA_plasmid"
  host: yeast  # Yeast host used for Pichia pastoris codon optimization
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: GAP
    - cistron:
        label: cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: Q99ZW2
              source: uniprot
          - tag: NLS
    - terminator: AOX1_TT
    - promoter: U6
    - cistron:
        label: sgrna
        gene:
          id: sgRNA_scaffold
    - terminator: BBa_B0015