construct:
  name: bacillus_auto_inducible_cutinase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - signal_peptide: WapA
          - gene:
              id: cutinase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
