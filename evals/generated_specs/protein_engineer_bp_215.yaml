construct:
  name: pichia_trimeric_peptide_AOX1
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: trimeric_peptide
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: leucine_zipper_trimeric
              source: uniprot

    - terminator: rrnB_T1
