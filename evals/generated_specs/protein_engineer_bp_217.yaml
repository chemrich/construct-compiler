construct:
  name: "Pichia_dual_promoter_mAb_PDI_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: mAb_fragment
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: scFv
              source: uniprot
        fused: false

    - terminator: CYC1

    - spacer: 30

    - promoter: GAP

    - cistron:
        label: PDI_chaperone
        expression: medium
        chain:
          - tag: alpha_factor
          - gene:
              id: PDI
              source: uniprot
        fused: false

    - terminator: CYC1
