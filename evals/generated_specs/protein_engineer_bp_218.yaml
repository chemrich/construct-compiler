construct:
  name: "B_subtilis_bispecific_nanobody_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: nanobody_1
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: VHH_domain_1
              source: uniprot

    - spacer: 30

    - cistron:
        label: nanobody_2
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: VHH_domain_2
              source: uniprot

    - terminator: rrnB_T1
