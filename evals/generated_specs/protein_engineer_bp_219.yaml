construct:
  name: "Pichia_capsid_accumulation_vector"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: capsid
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: VP1
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 500

    - promoter: GAP

    - cistron:
        label: zeocin_resistance
        expression: high
        gene:
          id: Zeocin_resistance_marker
          source: uniprot

    - terminator: rrnB_T1
