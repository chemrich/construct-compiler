```yaml
construct:
  name: "secA_amyE_gfp_secretion_optimizer"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: secA
        expression: high
        gene:
          id: P37368
          source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_reporter
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal  # secretion signal for B. subtilis
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
```