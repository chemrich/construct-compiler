construct:
  name: bacillus_secretory_pathway_optimizer
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: SecA
        expression: high
        gene:
          id: SecA
          source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_GFP_reporter
        expression: high
        fused: false
        chain:
          - signal_peptide: AmyE
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
