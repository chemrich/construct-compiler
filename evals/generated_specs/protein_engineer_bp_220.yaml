construct:
  name: pichia_nanobody_secretion
  host: yeast
  
  backbone:
    resistance: zeocin
    ori: 2micron
    source: standard
  
  cassette:
    - promoter: AOX1
    
    - cistron:
        label: nanobody
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: alpha_factor
          - gene:
              id: nanobody_pichia_codon_optimized
              source: custom
    
    - terminator: CYC1
