construct:
  name: "pichia_aox1_nanobody_secretion"
  host: yeast
  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: VHH
              source: uniprot
    - terminator: AOX1_term