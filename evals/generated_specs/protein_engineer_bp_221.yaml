construct:
  name: bacillus_secreted_lipase
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: lipase_bacillus_codon_optimized
              source: uniprot

    - terminator: rrnB_T1_T2  # double terminator for enhanced transcript stability
