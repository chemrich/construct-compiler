construct:
  name: "pichia_cytokine_constitutive"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: cytokine
        expression: high
        chain:
          - tag: alpha-factor
          - tag: Strep-II
          - cleavage_site: Enterokinase
          - gene:
              id: human_cytokine
              source: uniprot

    - terminator: rrnB_T1
