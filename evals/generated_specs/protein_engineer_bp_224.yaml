construct:
  name: "pichia_mab_expression_system"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: light_chain
              source: uniprot
    - terminator: CYC1
    - promoter: AOX1
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: heavy_chain
              source: uniprot
    - terminator: AOX1