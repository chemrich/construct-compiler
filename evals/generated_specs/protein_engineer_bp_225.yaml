construct:
  name: "cotg_dehydrogenase_spore_display"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cotG_native

    - cistron:
        label: spore_anchor_enzyme_fusion
        expression: high
        chain:
          - gene:
              id: cotG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: dehydrogenase
              source: uniprot

    - terminator: rrnB_T1
