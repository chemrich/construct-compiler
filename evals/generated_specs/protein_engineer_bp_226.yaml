construct:
  name: "Pichia_scFv_SUMO_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: Ost1_signal_peptide
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: scFv
              source: uniprot

    - terminator: rrnB_T1
