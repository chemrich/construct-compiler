construct:
  name: "Bacillus_tandem_promoter_cellulase_purification"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - promoter: Pgrac

    - rbs: optimized_RBS

    - cistron:
        label: cellulase
        expression: high
        chain:
          - signal_peptide: AprE
          - gene:
              id: cellulase
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
