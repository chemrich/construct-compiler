construct:
  name: "pichia_vlp_gst_fld1"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: vlp_protein
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: viral_protein
              source: uniprot
    - terminator: AOX1_term