construct:
  name: "pichia_VLP_structural_protein"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: structural_protein
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: viral_structural_protein
              source: uniprot

    - terminator: rrnB_T1
