construct:
  name: "B_subtilis_cutinase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: cutinase_secreted
        expression: high
        chain:
          - signal_peptide: WapA
          - gene:
              id: cutinase
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
