construct:
  name: pichia_HSA_constitutive
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: HSA
        expression: high
        chain:
          - secretion_signal: HSA_signal_peptide
          - gene:
              id: HSA
              source: uniprot
              codon_optimized: true
          - tag: 6xHis

    - terminator: rrnB_T1
