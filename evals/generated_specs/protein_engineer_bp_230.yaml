construct:
  name: "pichia_intracellular_two_enzyme_cascade"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: enzyme_1
          source: uniprot
    - terminator: ILV5
    - promoter: TEF1
    - cistron:
        label: enzyme_2
        expression: medium
        gene:
          id: enzyme_2
          source: uniprot
    - terminator: AOX1