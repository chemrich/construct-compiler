construct:
  name: pichia_two_enzyme_cascade
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: enzyme_1
          source: uniprot
    - terminator: ILV5

  cassette:
    - promoter: TEF1
    - cistron:
        label: enzyme_2
        expression: high
        gene:
          id: enzyme_2
          source: uniprot
    - terminator: AOX1
