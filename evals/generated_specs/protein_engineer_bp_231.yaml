construct:
  name: "protease_sensitive_hormone_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - cistron:
        label: hormone
        expression: high
        chain:
          - signal_peptide: SacB
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: hormone
              source: uniprot

    - terminator: rrnB_T1
