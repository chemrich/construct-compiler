construct:
  name: "Pichia_GCW14_secretion_industrial_enzyme"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: GCW14

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - signal_peptide: alpha_mating_factor_pre_pro
          - gene:
              id: industrial_enzyme_proprietary
              source: custom
          - tag: Strep-II

    - terminator: CYC1
