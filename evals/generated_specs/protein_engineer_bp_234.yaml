construct:
  name: "Pichia_GPCR_eGFP_localization"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: GPCR_fusion
        expression: high
        chain:
          - tag: 10xHis
          - cleavage_site: TEV
          - gene:
              id: GPCR
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: eGFP
              source: fpbase

    - terminator: rrnB_T1
