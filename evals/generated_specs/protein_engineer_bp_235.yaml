construct:
  name: "tag_free_alkaline_phosphatase_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AmyQ

    - cistron:
        label: secreted_alkaline_phosphatase
        expression: high
        chain:
          - signal_peptide: AmyQ
          - intein:
              type: self_cleaving
          - gene:
              id: alkaline_phosphatase
              source: uniprot

    - terminator: rrnB_T1
