construct:
  name: "Pichia_HIS4_AOX1_kinase_multicopy"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: custom
    auxotrophic_marker: HIS4_defective

  cassette:
    - promoter: AOX1

    - cistron:
        label: kinase_expression
        expression: high
        chain:
          - tag: alpha_factor_signal
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: kinase
              source: custom

    - terminator: AOX1_terminator
