construct:
  name: "phaffii_albumin_secretion_test"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: albumin_secreted
        expression: high
        chain:
          - signal_peptide: PHA-E
          - gene:
              id: recombinant_albumin
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
