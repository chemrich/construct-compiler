construct:
  name: "P_amyE_GFP_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P_amyE

    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
