construct:
  name: "amyE_GFP_reporter_bacillus"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: P_amyE
    - cistron:
        label: reporter
        expression: high  # Mapping 'strong RBS from veg gene' to high expression level
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1