```yaml
construct:
  name: tandem_Pveg_Pgrac_subtilisin_strep
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - promoter: Pgrac  # Tandem promoter for maximum expression

    - cistron:
        label: subtilisin
        expression: high
        chain:
          - secretion_signal: AprE  # Bacillus secretion signal
          - gene:
              id: subtilisin_E
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
