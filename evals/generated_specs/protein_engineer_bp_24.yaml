construct:
  name: "Bacillus_dual_promoter_secreted_subtilisin"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - promoter: Pgrac

    - cistron:
        label: secreted_subtilisin
        expression: high
        chain:
          - tag: AmyE_SP  # AmyE signal peptide for Bacillus secretion
          - gene:
              id: subtilisin_BPN
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
