construct:
  name: "pichia_human_lipase_high_yield"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: target_lipase
        expression: high
        chain:
          - tag: alpha-factor
          - cleavage_site: TEV
          - gene:
              id: LIPA_HUMAN
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1