construct:
  name: "pichia_pastoris_human_lipase_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: LIPB1
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
