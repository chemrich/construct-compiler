construct:
  name: "bacillus_phytase_secretion_amyE_strep"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: phytase_secreted
        expression: high
        chain:
          - tag: AmyE_signal
          - gene:
              id: phytase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
