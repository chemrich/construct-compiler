construct:
  name: "pichia_nanobody_SUMO_solubility"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: nanobody_SUMO
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot

    - terminator: rrnB_T1
