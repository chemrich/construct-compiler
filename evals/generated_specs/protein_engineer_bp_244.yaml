construct:
  name: "Pichia_mAb_dual_AOX1_HC_LC"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1
      direction: forward

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: monoclonal_antibody_heavy_chain
              source: uniprot

    - terminator: AOX1_TT

    - spacer: 100

    - promoter: AOX1
      direction: reverse

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: monoclonal_antibody_light_chain
              source: uniprot

    - terminator: AOX1_TT
