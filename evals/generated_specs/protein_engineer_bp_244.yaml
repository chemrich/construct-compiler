construct:
  name: "Pichia_bidirectional_AOX1_mAb_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: mAb_heavy_chain
              source: uniprot
    - terminator: AOX1_TT
    - spacer: 50
    - promoter: AOX1
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: mAb_light_chain
              source: uniprot
    - terminator: AOX1_TT