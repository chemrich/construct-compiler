construct:
  name: "Bacillus_amylase_secretion_food_grade"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Veg

    - cistron:
        label: amylase
        expression: high
        chain:
          - tag: SacB  # Signal peptide for Bacillus secretion
          - gene:
              id: alpha_amylase
              source: uniprot

    - terminator: rrnB_T1
