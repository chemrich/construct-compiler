construct:
  name: "Pichia_AOX1_viral_glycoprotein_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_glycoprotein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - cleavage_site: Kex2
          - gene:
              id: gp120
              source: uniprot
          - c_tag: Strep-II

    - terminator: AOX1_TT
