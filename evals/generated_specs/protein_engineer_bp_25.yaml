construct:
  name: "Pichia_pastoris_sfGFP_stability_baseline"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: sfGFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis

    - terminator: CYC1
