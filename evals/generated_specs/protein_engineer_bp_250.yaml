construct:
  name: pFLD1_secreted_enzyme_his
  host: yeast

  backbone:
    catalog_vector: "pPICZ-A"
    resistance: zeocin
    ori: ARS4
    source: addgene

  cassette:
    - promoter: pFLD1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - secretion_signal: Ost1
          - gene:
              id: target_enzyme
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
