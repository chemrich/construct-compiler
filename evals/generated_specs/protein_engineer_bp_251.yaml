construct:
  name: "Bacillus_WapA_secreted_cutinase"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: WapA

    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PET_degrading_cutinase
              source: uniprot
              # Note: WapA signal sequence is N-terminal and will direct secretion in Bacillus

    - terminator: rrnB_T1
