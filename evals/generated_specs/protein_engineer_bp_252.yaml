construct:
  name: "Pichia_scFv_with_PDI_dual_AOX1"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: PDI
        expression: high
        gene:
          id: PDI1
          source: uniprot

    - terminator: CYC1

    - promoter: AOX1

    - cistron:
        label: scFv
        expression: high
        chain:
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
