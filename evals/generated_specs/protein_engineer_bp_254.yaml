construct:
  name: pichia_secreted_gfp_reporter_t2a
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: gfp_reporter
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 18

    - cistron:
        label: t2a_peptide
        fused: false
        gene:
          id: T2A
          source: synthetic

    - spacer: 18

    - cistron:
        label: target_protein
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: MBP
              source: uniprot

    - terminator: CYC1
