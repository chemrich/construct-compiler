construct:
  name: "pichia_gap_secretion_t2a_gfp"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: target_protein
              source: uniprot
    - spacer: 20  # T2A self-cleaving peptide junction
    - cistron:
        label: reporter
        expression: medium
        fused: true  # part of the same translational unit via T2A
        chain:
          - cleavage_site: T2A
          - tag: alpha_factor
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: AOX1