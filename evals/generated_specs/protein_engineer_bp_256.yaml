construct:
  name: "Pichia_DAS1_cellulase_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: cellulase
        expression: medium
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - secretion_signal: alpha_factor
          - gene:
              id: cel7a
              source: uniprot

    - terminator: rrnB_T1
