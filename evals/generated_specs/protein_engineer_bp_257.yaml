construct:
  name: "Bacillus_kinase_Trx_dual_promoter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - promoter: Pgrac

    - cistron:
        label: kinase_trx
        expression: high
        chain:
          - solubility_tag: Trx
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: kinase
              source: uniprot

    - terminator: rrnB_T1
