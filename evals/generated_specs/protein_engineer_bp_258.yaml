construct:
  name: "Pichia_hIFN_SUMOstar_TwinStrep"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: hIFN
        expression: high
        chain:
          - tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IFNA2
              source: uniprot
          - tag: Twin-Strep

    - terminator: rrnB_T1
