construct:
  name: "Bacillus_thermophilic_xylanase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: xylA

    - cistron:
        label: xylanase
        expression: high
        chain:
          - tag: AmyQ_signal
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: thermophilic_xylanase
              source: uniprot

    - terminator: rrnB_T1
