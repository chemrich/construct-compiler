construct:
  name: "B_subtilis_amyE_locus_amylase"
  host: bacillus

  backbone:
    resistance: spectinomycin
    ori: pBS72
    source: addgene

  cassette:
    - homology_arm:
        label: amyE_front
        length: 1000
        target_locus: amyE

    - promoter: Pxyl

    - cistron:
        label: amylase
        expression: high
        chain:
          - tag: SamY
          - gene:
              id: amylase_proprietary
              source: uniprot

    - terminator: rrnB_T1

    - homology_arm:
        label: amyE_back
        length: 1000
        target_locus: amyE
