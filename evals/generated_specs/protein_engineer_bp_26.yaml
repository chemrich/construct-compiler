```yaml
construct:
  name: "amyE_integration_amylase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - homology_arm:
        label: amyE_front
        locus: amyE
        length: 1000  # bp upstream homology

    - promoter: Pxyl

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - secretion_signal: SamY  # B. subtilis secretion signal
          - gene:
              id: proprietary_amylase
              source: custom  # proprietary gene

    - terminator: rrnB_T1

    - homology_arm:
        label: amyE_back
        locus: amyE
        length: 1000  # bp downstream homology
```