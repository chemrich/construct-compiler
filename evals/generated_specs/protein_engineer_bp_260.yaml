construct:
  name: "Pichia_pastoris_lipase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: lipase_codon_optimized
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1_terminator
