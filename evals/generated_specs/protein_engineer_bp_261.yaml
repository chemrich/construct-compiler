construct:
  name: "Bacillus_AmyE_secreted_amylase_FLAG_TEV"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: target_amylase
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - cleavage_site: TEV
          - tag: FLAG
          - gene:
              id: amylase
              source: uniprot
              codon_optimization: bacillus_subtilis

    - terminator: rrnB_T1
