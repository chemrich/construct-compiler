construct:
  name: bacillus_bicistronic_enzyme_operon
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: Enzyme_A
        expression: high
        chain:
          - secretion_signal: AprE
          - gene:
              id: enzyme_a
              source: uniprot

    - spacer: 50

    - cistron:
        label: Enzyme_B
        expression: high
        fused: false
        chain:
          - secretion_signal: AprE
          - gene:
              id: enzyme_b
              source: uniprot

    - terminator: rrnB_T1
