construct:
  name: bacillus_cotg_spore_display_nanobody
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CotG

    - cistron:
        label: spore_display
        expression: high
        chain:
          - gene:
              id: CotG
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: VHH
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
