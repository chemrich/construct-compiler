construct:
  name: "Pichia_coexpression_heavy_chain_PDI"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette_1:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: heavy_chain
              source: uniprot

    - terminator: rrnB_T1

  cassette_2:
    - promoter: TEF1

    - cistron:
        label: PDI_chaperone
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: P04786
              source: uniprot

    - terminator: rrnB_T1
