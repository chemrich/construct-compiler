construct:
  name: "pichia_pastoris_secreted_therapeutic_peptide"
  host: yeast

  backbone:
    catalog_vector: "pPIC9"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: Ost1_signal_peptide
          - tag: HA
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: rrnB_T1
