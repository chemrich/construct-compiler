construct:
  name: "bacillus_toxic_protease_mtlA_control"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - secretion_signal: NprE
          - gene:
              id: NprE
              source: uniprot

    - terminator: rrnB_T1
