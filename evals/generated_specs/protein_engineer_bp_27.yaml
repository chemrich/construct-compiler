construct:
  name: "pichia_kinase_secretion_sumo"
  host: yeast
  
  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pARS
    source: addgene
  
  cassette:
    - promoter: FLD1
    
    - cistron:
        label: secreted_kinase
        expression: high
        chain:
          - signal_peptide: alpha-factor
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: kinase
              source: uniprot
          - tag: c-myc
    
    - terminator: rrnB_T1
