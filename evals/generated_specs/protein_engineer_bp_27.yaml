```yaml
construct:
  name: kinase_secretion_sumo_construct
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: target_kinase
        expression: high
        chain:
          - tag: alpha_factor  # secretion signal for yeast
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: kinase_gene  # replace with actual kinase ID
              source: uniprot
          - tag: c-myc

    - terminator: rrnB_T1
```