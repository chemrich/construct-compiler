construct:
  name: "pichia_mcherry_membrane_protein_localization"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: YPT1

    - cistron:
        label: fluorescent_reporter
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3

    - cistron:
        label: target_membrane_protein
        expression: medium
        fused: false
        gene:
          id: membrane_protein
          source: uniprot

    - terminator: CYC1
