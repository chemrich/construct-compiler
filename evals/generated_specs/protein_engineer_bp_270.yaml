construct:
  name: "Pichia_YPT1_mCherry_fusion"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: YPT1

    - cistron:
        label: membrane_protein_localization
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_membrane_protein

    - terminator: AOX1_term