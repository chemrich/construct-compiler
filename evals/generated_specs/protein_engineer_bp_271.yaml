construct:
  name: "bacillus_multisubunit_complex_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac01

    - cistron:
        label: subunit_A
        expression: high
        rbs: optimized_bacillus
        fused: false
        gene:
          id: subunitA
          source: uniprot

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        rbs: optimized_bacillus
        fused: false
        gene:
          id: subunitB
          source: uniprot

    - spacer: 30

    - cistron:
        label: subunit_C
        expression: high
        rbs: optimized_bacillus
        fused: false
        chain:
          - tag: Twin-Strep
          - gene:
              id: subunitC
              source: uniprot

    - terminator: rrnB_T1
