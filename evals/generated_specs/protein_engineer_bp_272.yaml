construct:
  name: "pAOX1_secreted_biosensor_pichia"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: biosensor_cistron
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: biosensor
    - terminator: AOX1_TT