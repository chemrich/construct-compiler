construct:
  name: pichia_aox1_secreted_biosensor
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_biosensor
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: biosensor
              source: uniprot

    - terminator: rrnB_T1
