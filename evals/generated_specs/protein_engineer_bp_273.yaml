    - cistron:
        label: target
        expression: high
        chain:
          - tag: PhoD_signal_peptide
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: reductase
              source: uniprot

    - terminator: rrnB_T1
