construct:
  name: "pichia_pastoris_heterodimer_dual_promoter"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: heavy_chain_orf
              source: uniprot

    - terminator: TT_AOX1

    - spacer: 100

    - promoter: DAS1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: light_chain_orf
              source: uniprot
          - tag: FLAG

    - terminator: CYC1_terminator
