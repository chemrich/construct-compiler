construct:
  name: bacillus_stress_induced_cutinase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PsigmaB  # General stress response promoter for Bacillus subtilis

    - cistron:
        label: cutinase_secreted
        expression: high
        chain:
          - signal_peptide: LipA  # Bacillus lipase signal peptide for secretion
          - gene:
              id: cutinase
              source: uniprot

    - terminator: rrnB_T1
