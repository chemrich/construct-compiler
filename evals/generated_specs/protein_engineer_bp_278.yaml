construct:
  name: "pichia_GST_target_10xHis"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: GST
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
          - tag: 10xHis

    - terminator: rrnB_T1
