construct:
  name: "bacillus_secretion_efficiency_screen"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Spac

    - rbs: RBS_opt  # optimized ribosome binding site

    - cistron:
        label: secretion_reporter
        expression: high
        chain:
          - secretion_signal: AmyQ  # AmyQ signal peptide for Bacillus secretion
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: hydrolase_target
              source: uniprot

    - terminator: rrnB_T1
