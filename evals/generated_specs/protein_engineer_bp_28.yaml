construct:
  name: "bacillus_AMP_secretion_vector"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - ribosome_binding_site: strong

    - cistron:
        label: AMP
        expression: high
        chain:
          - secretion_signal: NprE
          - gene:
              id: AMP
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
