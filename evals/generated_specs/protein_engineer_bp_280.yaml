construct:
  name: "Pichia_pastoris_CalB_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: CalB_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: CalB_codon_optimized_Candida_antarctica
              source: uniprot
          - tag: 6xHis

    - terminator: TT_AOX1
