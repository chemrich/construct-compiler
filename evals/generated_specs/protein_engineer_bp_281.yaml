construct:
  name: "bacillus_amyE_secreted_alpha_amylase"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - rbs: strong

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: alpha_amylase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
