construct:
  name: "pichia_scFv_secreted_TEV_His"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - signal_peptide: alpha_factor_prepro
          - gene:
              id: scFv
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
