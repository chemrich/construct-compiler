construct:
  name: Bacillus_cellulase_secretion_IMAC
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: cellulase
        expression: high
        chain:
          - secretion_signal: Vpr
          - gene:
              id: cellulase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
