construct:
  name: "pichia_mab_bicistronic_AOX1"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pAOX
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: monoclonal_antibody_heavy_chain
              source: uniprot
          - cleavage_site: 2A

    - spacer: 20

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - tag: alpha-factor
          - gene:
              id: monoclonal_antibody_light_chain
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
