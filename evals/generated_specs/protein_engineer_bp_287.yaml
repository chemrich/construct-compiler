construct:
  name: "bacillus_promoter_dynamics_dual_expression"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110 # Standard B. subtilis origin; substituting for E. coli pBR322
    source: addgene
  cassette:
    - promoter: Pgrac
    - cistron:
        label: gfp_monitor
        expression: medium
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: Pxyl
    - cistron:
        label: rfp_monitor
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1