construct:
  name: "bacillus_dual_promoter_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: Pxyl

    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
