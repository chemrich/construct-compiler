construct:
  name: "pichia_fld1_nanobody_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: nanobody_cistron
        expression: high
        chain:
          - tag: Ost1
          - gene:
              id: nanobody
              source: uniprot
          - cleavage_site: 3C
          - tag: Myc
          - tag: 6xHis
    - terminator: AOX1_TT