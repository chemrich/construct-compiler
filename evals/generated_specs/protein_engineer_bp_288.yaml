construct:
  name: "Pichia_FLD1_nanobody_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPICZ
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: nanobody
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: nanobody
              source: uniprot
          - cleavage_site: 3C
          - tag: Myc
          - tag: 6xHis

    - terminator: rrnB_T1
