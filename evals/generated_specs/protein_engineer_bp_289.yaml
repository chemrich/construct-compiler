construct:
  name: "Bacillus_subtilis_xylanase_secretion_system"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: secreted_xylanase
        expression: high
        chain:
          - signal_peptide: SacB
          - gene:
              id: xylanase
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: 6xHis

    - terminator: rrnB_T1
