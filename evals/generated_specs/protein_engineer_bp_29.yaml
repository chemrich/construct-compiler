construct:
  name: "Pichia_heterodimeric_Fab"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: fab_light_chain
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: GAP

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: fab_heavy_chain
              source: uniprot

    - terminator: CYC1
