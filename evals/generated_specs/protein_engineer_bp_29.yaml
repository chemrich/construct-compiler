construct:
  name: "pichia_fab_dual_cassette"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: trastuzumab_LC
              source: uniprot
    - terminator: AOX1
    - promoter: GAP
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: trastuzumab_HC
              source: uniprot
    - terminator: AOX1