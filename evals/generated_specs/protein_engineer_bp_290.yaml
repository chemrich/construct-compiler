construct:
  name: "Pichia_Kar2_Cutinase_coexpression"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: Kar2_chaperone
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: Kar2
              source: uniprot

    - terminator: CYC1

    - promoter: TEF1

    - cistron:
        label: cutinase
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: cutinase
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
