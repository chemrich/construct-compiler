construct:
  name: "bacillus_phytase_mbp_solubility"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: phytase_mbp
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: phytase
              source: uniprot

    - terminator: rrnB_T1
