construct:
  name: "subtilisin_variant_secreted_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: subtilisin
        expression: high
        chain:
          - signal_peptide: NprE
          - gene:
              id: subtilisin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - terminator: rrnB_T1
