construct:
  name: "Pichia_DAS1_betaglucosidase_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: autonomously_replicating_sequence
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: betaglucosidase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: "GH1_betaglucosidase"
              source: uniprot

    - terminator: CYC1_terminator
