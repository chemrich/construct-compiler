construct:
  name: bacillus_mtlA_lipase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - signal_peptide: AmyQ
          - gene:
              id: lip
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
