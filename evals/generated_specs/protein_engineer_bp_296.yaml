construct:
  name: "pichia_kinase_GST_thrombin"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: kinase
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: kinase
              source: uniprot

    - terminator: rrnB_T1
