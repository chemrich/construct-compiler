construct:
  name: bacillus_cotg_scfv_display
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: cotg_scfv_display
        expression: high
        chain:
          - gene:
              id: CotG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
