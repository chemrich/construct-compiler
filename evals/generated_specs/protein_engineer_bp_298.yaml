construct:
  name: "pichia_interferon_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: interferon_expression
        expression: high
        chain:
          - tag: alpha-factor
          - cleavage_site: Enterokinase
          - gene:
              id: IFNA2
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1_TT