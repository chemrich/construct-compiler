construct:
  name: "Bacillus_Tat_pathway_GFP_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: sfGFP
              source: fpbase
          - signal_peptide: PhoD_Tat  # Tat signal peptide for secretion via Twin-Arginine pathway

    - terminator: rrnB_T1
