```yaml
construct:
  name: "bacillus_mannitol_inducible_levansucrase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA  # mannitol-inducible promoter

    - cistron:
        label: secreted_levansucrase
        expression: high
        chain:
          - signal_peptide: SacB  # B. subtilis secretion signal
          - gene:
              id: P00724  # levansucrase from B. subtilis
              source: uniprot
          - tag: HA  # C-terminal HA tag for Western blotting

    - terminator: rrnB_T1
```