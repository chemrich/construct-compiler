  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: levansucrase_secreted
        expression: high
        chain:
          - signal_peptide: SacB
          - gene:
              id: levansucrase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - terminator: rrnB_T1
