construct:
  name: "Bacillus_subtilis_secreted_cellulase"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: cellulase_codon_optimized
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
