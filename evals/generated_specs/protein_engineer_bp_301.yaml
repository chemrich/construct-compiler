construct:
  name: pichia_pastoris_HSA_secretion
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: HSA_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: FLAG
          - cleavage_site: Kex2
          - gene:
              id: P02768
              source: uniprot

    - terminator: CYC1
