construct:
  name: "pichia_antibody_bicistronic_light_heavy"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: antibody_light_chain
              source: uniprot

    - spacer: 30

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: antibody_heavy_chain
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
