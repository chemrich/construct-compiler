construct:
  name: "Bacillus_licheniformis_lipoxygenase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: aprE

    - cistron:
        label: lipoxygenase_secreted
        expression: high
        chain:
          - tag: amyQ_signal_peptide
          - solubility_tag: MBP
          - cleavage_site: Enterokinase
          - gene:
              id: lipoxygenase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
