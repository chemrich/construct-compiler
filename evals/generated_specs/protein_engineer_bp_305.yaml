construct:
  name: "pastoris_amylase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: amylase
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: TEV
          - tag: Twin-Strep
          - gene:
              id: amylase
              source: uniprot

    - terminator: rrnB_T1
