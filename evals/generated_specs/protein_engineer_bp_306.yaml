construct:
  name: "bacillus_gfp_ha_integration_cassette"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: gfp_ha
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - terminator: rrnB_T1
