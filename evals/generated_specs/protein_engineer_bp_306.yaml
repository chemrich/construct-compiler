construct:
  name: "bacillus_subtilis_pveg_gfp_ha_integration"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pveg
    - cistron:
        label: gfp_reporter
        expression: high
        chain:
          - gene:
              id: GFP
              source: fpbase
          - tag: HA
    - terminator: rrnB_T1