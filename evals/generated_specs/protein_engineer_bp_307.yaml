construct:
  name: "Pichia_pastoris_secreted_cytokine_HSA_fusion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322

  cassette:
    - promoter: GAP

    - cistron:
        label: cytokine_secreted
        expression: high
        chain:
          - tag: alpha_mating_factor_pre_pro
          - solubility_tag: HSA
          - cleavage_site: PreScission
          - tag: Myc
          - gene:
              id: cytokine
              source: uniprot

    - terminator: rrnB_T1
