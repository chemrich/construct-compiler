construct:
  name: "bacillus_dual_metabolic_enzymes"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: enzyme_A
        expression: high
        gene:
          id: enzyme_A
          source: uniprot

    - spacer: 30

    - promoter: Pxyl

    - cistron:
        label: enzyme_B
        expression: high
        chain:
          - gene:
              id: enzyme_B
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
