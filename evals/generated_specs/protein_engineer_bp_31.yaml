construct:
  name: pichia_pdi_lipase_coexpression
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: pdi_chaperone
        expression: high
        gene:
          id: PDI1
          source: uniprot

    - terminator: CYC1

    - spacer: 30

    - promoter: GAP

    - cistron:
        label: target_lipase
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipase
              source: uniprot

    - terminator: CYC1
