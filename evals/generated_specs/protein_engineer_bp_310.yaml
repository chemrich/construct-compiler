construct:
  name: "Bacillus_subtilis_native_subtilisin_His6"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: aprE_native  # Native Bacillus subtilis aprE (alkaline protease/subtilisin) promoter

    - cistron:
        label: subtilisin
        expression: high
        chain:
          - signal_peptide: aprE_signal  # Native aprE secretion signal for Bacillus
          - gene:
              id: aprE
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
