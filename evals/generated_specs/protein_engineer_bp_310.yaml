construct:
  name: "subtilisin_native_overexpression_bacillus"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: aprE  # Native subtilisin promoter for Bacillus subtilis
    - cistron:
        label: subtilisin_E
        expression: high
        chain:
          - gene:
              id: P00782  # UniProt ID for Bacillus subtilis Subtilisin E (AprE), includes native signal peptide
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification
    - terminator: BBa_B0015