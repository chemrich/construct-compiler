construct:
  name: "pichia_pastoris_nanobody_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: nanobody
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: camelid_nanobody
              source: uniprot
          - tag: FLAG

    - terminator: AOX1_TT
