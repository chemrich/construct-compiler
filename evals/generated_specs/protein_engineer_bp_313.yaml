construct:
  name: "Pichia_UPIC_cutinase"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: UPIC

    - cistron:
        label: cutinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - signal_peptide: alpha_factor
          - gene:
              id: cutinase
              source: uniprot

    - terminator: CYC1
