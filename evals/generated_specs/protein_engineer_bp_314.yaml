construct:
  name: "bacillus_spore_display_antigen_cotG"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: spore_display
        expression: high
        chain:
          - tag: signal_peptide_amyE
          - gene:
              id: target_antigen
              source: uniprot
          - tag: V5
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: cotG
              source: uniprot

    - terminator: rrnB_T1
