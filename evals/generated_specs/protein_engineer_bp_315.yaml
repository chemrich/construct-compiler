construct:
  name: "pichia_transaminase_biocatalyst"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: transaminase
        expression: high
        chain:
          - tag: Trx
          - cleavage_site: TEV
          - gene:
              id: transaminase
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1
