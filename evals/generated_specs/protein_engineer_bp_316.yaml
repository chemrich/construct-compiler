construct:
  name: "bacillus_nprE_nanoluc_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_reporter
        expression: high
        chain:
          - signal_peptide: nprE
          - gene:
              id: nanoluc
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
