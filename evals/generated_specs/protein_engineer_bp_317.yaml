construct:
  name: "pichia_pastoris_enzyme_chaperone_cosecretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_alpha"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: enzyme
              source: uniprot
          - tag: 6xHis

    - spacer: 100

    - promoter: PGAP

    - cistron:
        label: chaperone
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: chaperone
              source: uniprot
          - tag: FLAG

    - terminator: CYC1
