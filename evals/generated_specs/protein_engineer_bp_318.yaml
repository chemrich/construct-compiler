construct:
  name: "scFv_SUMO_secreted_bacillus"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: sacB
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: scFv
              source: uniprot

    - terminator: rrnB_T1
