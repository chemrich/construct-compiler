construct:
  name: "Pichia_viral_glycoprotein_secreted"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: viral_glycoprotein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: viral_glycoprotein
              source: uniprot
          - cleavage_site: 3C
          - tag: 8xHis

    - terminator: CYC1
