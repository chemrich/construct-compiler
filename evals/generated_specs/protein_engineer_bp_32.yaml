construct:
  name: "B_subtilis_surface_display_CotA"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: surface_display
        expression: high
        chain:
          - signal_peptide: YuaB
          - gene:
              id: CotA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_enzyme
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
