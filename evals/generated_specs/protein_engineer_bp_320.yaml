construct:
  name: "Pichia_pastoris_AOX1_lipase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - secretion_signal: alpha_factor_prepro_Pichia_codon_optimized
          - gene:
              id: lipase_novel
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
