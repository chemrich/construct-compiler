construct:
  name: "lipase_secretion_pichia_aox1"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: lipase_expression
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: lipase
          - tag: 6xHis
    - terminator: AOX1_term