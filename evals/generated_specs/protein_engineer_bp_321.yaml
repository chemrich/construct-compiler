construct:
  name: "bacillus_secreted_amylase_twinstep"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: amylase
              source: uniprot
          - tag: Twin-Strep

    - terminator: rrnB_T1
