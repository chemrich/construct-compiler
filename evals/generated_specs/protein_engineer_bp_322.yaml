construct:
  name: "Pichia_nanobody_SUMO_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - tag: Ost1_signal_peptide
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot

    - terminator: CYC1
