construct:
  name: "Pichia_pastoris_mAb_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: IgG1_LC
              source: uniprot
    - terminator: AOX1_TT
    - promoter: AOX1
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: IgG1_HC
              source: uniprot
    - terminator: AOX1_TT