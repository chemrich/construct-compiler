construct:
  name: "pichia_mAb_dual_cistron"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: monoclonal_antibody_light_chain
              source: uniprot
              codon_optimized: pichia

    - spacer: 30

    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: monoclonal_antibody_heavy_chain
              source: uniprot
              codon_optimized: pichia

    - terminator: rrnB_T1
