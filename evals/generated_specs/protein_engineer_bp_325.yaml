construct:
  name: "GST_kinase_intracellular_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: target
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: kinase
              source: uniprot

    - terminator: rrnB_T1
