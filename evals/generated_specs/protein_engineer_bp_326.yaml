construct:
  name: "pichia_egfp_secretion_assay"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_reporter
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: EGFP
              source: fpbase
          - tag: 3xFLAG
    - terminator: AOX1_term