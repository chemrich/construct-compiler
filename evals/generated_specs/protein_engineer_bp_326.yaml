construct:
  name: "pichia_secretion_screening_EGFP_3xFLAG"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPICZ
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_reporter
        expression: high
        chain:
          - signal_peptide: alpha-factor
          - gene:
              id: EGFP
              source: fpbase
          - tag: 3xFLAG

    - terminator: rrnB_T1
