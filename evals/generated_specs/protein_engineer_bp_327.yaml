construct:
  name: "bacillus_cotA_vaccine_display"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PcotA

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: cotA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: viral_antigen
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
