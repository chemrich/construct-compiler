construct:
  name: Pichia_scFv_FLD1_promoter
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv
              source: uniprot
          - tag: Myc
          - tag: 6xHis

    - terminator: CYC1_terminator
