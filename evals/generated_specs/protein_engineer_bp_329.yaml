construct:
  name: "Bacillus_megaterium_mannitol_cellulase_secretion"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: custom
  cassette:
    - promoter: PmtlA
    - cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - tag: WapA
          - gene:
              id: cellulase
          - tag: 6xHis
    - terminator: rrnB_T1