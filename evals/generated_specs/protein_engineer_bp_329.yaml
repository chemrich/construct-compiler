construct:
  name: "Bacillus_megaterium_auto_inducible_cellulase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: cellulase
        expression: high
        chain:
          - signal_peptide: WapA
          - gene:
              id: cellulase_proprietary
              source: custom
          - tag: 6xHis

    - terminator: rrnB_T1
