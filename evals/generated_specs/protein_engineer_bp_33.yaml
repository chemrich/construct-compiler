construct:
  name: Pichia_scFv_Ost1_secretion
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: YPT1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
