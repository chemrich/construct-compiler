construct:
  name: "bacillus_isomerase_groESL_operon"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: isomerase
        expression: high
        codon_optimization: bacillus_subtilis
        gene:
          id: isomerase
          source: uniprot

    - spacer: 30

    - cistron:
        label: groES
        expression: high
        fused: false
        codon_optimization: bacillus_subtilis
        rbs_strength: strong_synthetic
        gene:
          id: groES
          source: uniprot

    - spacer: 30

    - cistron:
        label: groEL
        expression: high
        fused: false
        codon_optimization: bacillus_subtilis
        gene:
          id: groEL
          source: uniprot

    - terminator: rrnB_T1
