construct:
  name: split_intein_multidomain_pichia
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: domain_A_N_intein
        expression: high
        chain:
          - gene:
              id: target_domain_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: N_intein
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - promoter: AOX1

    - cistron:
        label: C_intein_domain_B
        expression: high
        chain:
          - gene:
              id: C_intein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_domain_B
              source: uniprot

    - terminator: CYC1
