construct:
  name: bacillus_cell_wall_enzyme_display
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: cell_wall_enzyme
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: amylase
              source: uniprot
          - tag: LPXTG_sorting_motif

    - terminator: rrnB_T1
