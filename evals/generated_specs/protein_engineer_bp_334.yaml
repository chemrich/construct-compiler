construct:
  name: "Pichia_rDNA_HSA_Zeocin"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene
    # Note: rDNA integration cassette for Pichia pastoris

  cassette:
    - promoter: GAP

    - cistron:
        label: HSA
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: P02768
              source: uniprot

    - spacer: 30

    - promoter: constitutive

    - cistron:
        label: Zeocin_resistance
        expression: high
        fused: false
        gene:
          id: Sh_ble
          source: uniprot

    - terminator: rrnB_T1
