construct:
  name: bacillus_groES_groEL_therapeutic_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: GroES
        expression: high
        chain:
          - gene:
              id: groES
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: Pveg

    - cistron:
        label: GroEL
        expression: high
        chain:
          - gene:
              id: groEL
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: Pgrac

    - cistron:
        label: therapeutic_target
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: therapeutic_protein
              source: uniprot

    - terminator: rrnB_T1
