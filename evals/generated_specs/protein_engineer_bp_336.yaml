construct:
  name: "pichia_das1_antigen_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: DAS1
    - cistron:
        label: target_antigen
        expression: high
        chain:
          - tag: alpha_factor_delta_pro
          - gene:
              id: antigen
              source: uniprot
          - tag: HA
    - terminator: AOX1_term