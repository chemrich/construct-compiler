construct:
  name: "pichia_DAS1_delta_pro_alphafactor_antigen_HA"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: target
        expression: high
        chain:
          - secretion_signal: delta_pro_alpha_factor
          - gene:
              id: antigen
              source: uniprot
          - tag: HA
          - cleavage_site: Kex2

    - terminator: CYC1_TT
