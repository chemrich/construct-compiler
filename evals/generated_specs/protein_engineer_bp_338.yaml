construct:
  name: "pichia_cytokine_thioredoxin_fusion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_cytokine
        expression: high
        chain:
          - tag: alpha-factor
          - solubility_tag: Trx
          - cleavage_site: Enterokinase
          - gene:
              id: cytokine
              source: uniprot

    - terminator: rrnB_T1
