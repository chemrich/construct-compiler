construct:
  name: "pichia_secreted_scFv_AOX1"
  host: yeast

  backbone:
    catalog_vector: "pPICZA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_scFv
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv_pichia_codon_optimized
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
