construct:
  name: "Bacillus_amylase_secretion_construct"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: amylase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: amylase_Bacillus_codon_optimized
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: Strep-II

    - terminator: rrnB_T1
