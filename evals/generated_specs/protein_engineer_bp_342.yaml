construct:
  name: "pichia_gap_megfp_baseline"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: AOX1 # Standard terminator for Pichia pastoris expression cassettes