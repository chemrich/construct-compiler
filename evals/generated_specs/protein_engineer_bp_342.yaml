construct:
  name: "pichia_GFP_constitutive"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1
