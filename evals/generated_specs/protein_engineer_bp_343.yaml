construct:
  name: "bacillus_secreted_protease_xylose_inducible"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: secreted_protease
        expression: low
        chain:
          - signal_peptide: WapA
          - gene:
              id: subtilisin
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
