construct:
  name: "pichia_pastoris_antibody_dual_cassette"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - gene:
              id: antibody_heavy_chain
              source: uniprot

    - terminator: TT_AOX1

  cassette:
    - promoter: AOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: antibody_light_chain
              source: uniprot

    - terminator: TT_AOX1
