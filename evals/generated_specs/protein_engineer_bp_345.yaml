construct:
  name: "B_subtilis_spore_display_CotG_viral_antigen"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: spore_display
        expression: high
        chain:
          - gene:
              id: CotG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: viral_antigen
              source: uniprot

    - terminator: rrnB_T1
