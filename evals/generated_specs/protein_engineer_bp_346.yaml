construct:
  name: "Pichia_secreted_nanobody_production"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: target_nanobody
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: P0CI97
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis
    - terminator: AOX1_term