construct:
  name: "Pichia_secreted_nanobody_His"
  host: yeast

  backbone:
    catalog_vector: "pPICZalpha"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: alpha_factor_prepro
          - gene:
              id: nanobody
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis

    - terminator: rrnB_T1
