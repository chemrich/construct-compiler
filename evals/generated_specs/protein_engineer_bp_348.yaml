construct:
  name: pichia_catalase_GST_solubility
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: catalase
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: CAT
              source: uniprot

    - terminator: rrnB_T1
