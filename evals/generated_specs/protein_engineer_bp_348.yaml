construct:
  name: "Pichia_GAP_GST_Catalase_Fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: catalase_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: P00432
              source: uniprot
    - terminator: CYC1_term