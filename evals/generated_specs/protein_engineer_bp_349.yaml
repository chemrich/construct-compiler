construct:
  name: "Bacillus_secreted_cellulase"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: secreted_cellulase
        expression: medium
        chain:
          - tag: amyQ_signal_peptide
          - gene:
              id: cellulase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
