construct:
  name: pichia_pastoris_cutinase_das1
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: cutinase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: cutinase
              source: uniprot
          - tag: FLAG

    - terminator: AOX1
