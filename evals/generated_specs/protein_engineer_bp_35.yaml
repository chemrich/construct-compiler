construct:
  name: "p_pastoris_fed_batch_cutinase_optimization"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: DAS1
    - cistron:
        label: cutinase_expression
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: cutinase
              source: uniprot
          - tag: FLAG
    - terminator: AOX1