construct:
  name: "Pichia_secreted_therapeutic_HSA_fusion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P02768
              source: uniprot
              description: Human_Serum_Albumin

    - terminator: CYC1
