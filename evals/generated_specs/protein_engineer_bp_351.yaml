construct:
  name: "Bacillus_GroEL_GroES_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: GroES
        expression: high
        gene:
          id: groES
          source: uniprot

    - spacer: 30

    - cistron:
        label: GroEL
        expression: high
        fused: false
        gene:
          id: groEL
          source: uniprot

    - terminator: rrnB_T1
