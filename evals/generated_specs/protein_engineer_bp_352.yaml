construct:
  name: "Pichia_secreted_IL2_FLD1"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: secreted_IL2
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: IL2
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
