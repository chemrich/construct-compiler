construct:
  name: "bacillus_nuclease_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: nuclease_secreted
        expression: high
        chain:
          - tag: signal_peptide_NprB
          - solubility_tag: SUMO
          - gene:
              id: nuclease
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
