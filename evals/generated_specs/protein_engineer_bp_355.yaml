construct:
  name: "P43_mCherry_Bacillus_reporter"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110  # Bacillus-specific origin of replication
    source: addgene
  cassette:
    - promoter: P43
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1