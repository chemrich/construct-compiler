construct:
  name: "bacillus_p43_mcherry_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: mcherry_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
