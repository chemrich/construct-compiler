construct:
  name: pichia_phytase_secretion
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: phytase
              source: uniprot
              codon_optimized: true
          - tag: c-Myc

    - terminator: rrnB_T1
