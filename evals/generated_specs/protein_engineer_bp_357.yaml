construct:
  name: "Bacillus_secreted_cutinase"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - cleavage_site: TEV
          - gene:
              id: cutinase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
