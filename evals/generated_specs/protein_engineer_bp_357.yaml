construct:
  name: "secreted_cutinase_bacillus"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene

  cassette:
    - promoter: Pgrac
    - cistron:
        label: cutinase_expression
        expression: high
        chain:
          - secretion_signal: AmyE
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P0CT14
              source: uniprot
    - terminator: rrnB_T1