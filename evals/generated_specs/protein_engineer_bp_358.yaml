construct:
  name: pichia_pastoris_secreted_vaccine_antigen
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: vaccine_antigen
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
