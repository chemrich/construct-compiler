construct:
  name: "secreted_pullulanase_bacillus"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: pullulanase
        expression: high
        chain:
          - tag: SacB_signal_peptide
          - tag: 6xHis
          - gene:
              id: pullulanase_subtilis_codon_optimized
              source: uniprot

    - terminator: rrnB_T1
