construct:
  name: "bacillus_secreted_pullulanase_production"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: secreted_pullulanase
        expression: high
        chain:
          - tag: SacB_signal_peptide
          - tag: 6xHis
          - gene:
              id: pulA
              source: uniprot
    - terminator: rrnB_T1