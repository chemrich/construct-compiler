```yaml
construct:
  name: chaperone_assisted_protease_expression_bacillus
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: groES_chaperone
        expression: high
        gene:
          id: P0A6F9
          source: uniprot

    - spacer: 30

    - cistron:
        label: groEL_chaperone
        expression: high
        fused: false
        gene:
          id: P0A6F5
          source: uniprot

    - terminator: rrnB_T1

    - promoter: Pxyl

    - cistron:
        label: target_protease
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P00776  # Trypsin precursor as example inactive protease mutant
              source: uniprot

    - terminator: rrnB_T1
```