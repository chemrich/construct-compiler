construct:
  name: bacillus_protease_chaperone_coexpression
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Pxyl is xylose-inducible; araBAD is the closest standard equivalent
      # Comment: Using araBAD as Pxyl (xylose-inducible) for Bacillus compatibility

    - cistron:
        label: groES
        expression: high
        gene:
          id: groES
          source: uniprot

    - spacer: 30

    - cistron:
        label: groEL
        expression: high
        gene:
          id: groEL
          source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD
      # Second Pxyl promoter for the protease mutant

    - cistron:
        label: protease_mutant
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protease_mutant
              source: uniprot

    - terminator: rrnB_T1
