construct:
  name: "Bacillus_amylase_secretion_vector"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: amylase_secreted
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: amylase
              source: uniprot
              codon_optimization: bacillus_subtilis
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
