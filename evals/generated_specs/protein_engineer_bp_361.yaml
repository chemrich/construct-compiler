construct:
  name: "pichia_scfv_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scfv
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: human_scfv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
