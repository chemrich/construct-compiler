construct:
  name: "pichia_pastoris_phytase_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: signal_peptide_Ost1
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: phytase
              source: uniprot

    - terminator: rrnB_T1
