construct:
  name: "pichia_constitutive_phytase_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: phytase_expression
        expression: high
        chain:
          - tag: Ost1
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: P07102
              source: uniprot
    - terminator: AOX1_term