construct:
  name: "pichia_dual_cassette_heavy_light_chain"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: heavy_chain
              source: uniprot
          - tag: Myc

    - terminator: AOX1_terminator

    - spacer: 50

    - promoter: AOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: light_chain
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1_terminator
