construct:
  name: "bacillus_secreted_protease"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: secreted_protease
        expression: high
        chain:
          - tag: signal_peptide_SacB
          - gene:
              id: protease
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
