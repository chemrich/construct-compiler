construct:
  name: pichia_pastoris_FLD1_GST_enzyme
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: ADH1
              source: uniprot

    - terminator: CYC1
