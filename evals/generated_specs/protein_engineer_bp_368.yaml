construct:
  name: "Bacillus_subtilis_AprE_xylanase_secretion"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AprE

    - cistron:
        label: secreted_xylanase
        expression: high
        chain:
          - secretion_signal: AprE_signal_peptide
          - gene:
              id: xylanase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
