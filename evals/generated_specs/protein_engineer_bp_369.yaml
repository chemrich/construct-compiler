construct:
  name: pichia_secreted_nanobody
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - tag: alpha_mating_factor
          - cleavage_site: Kex2
          - gene:
              id: nanobody
              source: uniprot
          - cleavage_site: TEV
          - tag: Twin-Strep

    - terminator: rrnB_T1
