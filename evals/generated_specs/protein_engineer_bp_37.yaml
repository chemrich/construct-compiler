construct:
  name: "pichia_secretion_screen_mcherry_affibody"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: affibody
              source: uniprot

    - terminator: rrnB_T1
