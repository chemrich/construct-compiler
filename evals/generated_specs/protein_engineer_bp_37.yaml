```yaml
construct:
  name: pichia_affibody_secretion_screen
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - tag: alpha_factor  # secretion signal for yeast
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: affibody
              source: uniprot

    - terminator: CYC1_term
```