construct:
  name: "bacillus_dehydrogenase_MBP_expression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PlepA

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: 3C
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: dehydrogenase
              source: uniprot

    - terminator: rrnB_T1
