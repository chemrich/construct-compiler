construct:
  name: "bacillus_subtilis_high_yield_dehydrogenase"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110  # Standard Bacillus subtilis origin
    source: addgene
  cassette:
    - promoter: PlepA
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: 3C
          - gene:
              id: P00330
              source: uniprot
    - terminator: rrnB_T1