construct:
  name: "pichia_heterodimer_dual_promoter"
  host: yeast
  backbone:
    resistance: kanamycin
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: subunit_a
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: protein_a
              source: uniprot
    - terminator: CYC1
    - promoter: YPT1
    - cistron:
        label: subunit_b
        expression: medium
        chain:
          - tag: alpha_factor
          - gene:
              id: protein_b
              source: uniprot
    - terminator: AOX1