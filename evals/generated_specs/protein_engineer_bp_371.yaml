construct:
  name: "dual_promoter_heterodimer_Pichia_pastoris"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: Protein_A
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: "Protein_A"
              source: uniprot

    - terminator: CYC1

    - promoter: YPT1

    - cistron:
        label: Protein_B
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: "Protein_B"
              source: uniprot

    - terminator: CYC1
