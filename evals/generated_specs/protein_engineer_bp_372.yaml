construct:
  name: bacillus_esterase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: YncM
          - gene:
              id: esterase
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: HA

    - terminator: rrnB_T1
