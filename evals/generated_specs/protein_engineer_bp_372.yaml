construct:
  name: "bacillus_esterase_secretion_construct"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: Pgrac
    - cistron:
        label: secreted_esterase
        expression: high
        chain:
          - tag: YncM
          - gene:
              id: P37967
              source: uniprot
          - cleavage_site: Factor_Xa
          - tag: HA
    - terminator: rrnB_T1