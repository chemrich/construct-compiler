construct:
  name: "pichia_pastoris_three_gene_pathway"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: pathway_gene_1
        expression: high
        gene:
          id: gene1
          source: uniprot

    - terminator: AOX1

    - spacer: 50

    - promoter: GAP

    - cistron:
        label: pathway_gene_2
        expression: high
        gene:
          id: gene2
          source: uniprot

    - terminator: AOX1

    - spacer: 50

    - promoter: GAP

    - cistron:
        label: pathway_gene_3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gene3
              source: uniprot

    - terminator: AOX1
