construct:
  name: bacillus_secreted_vaccine_antigen
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - signal_peptide: Vpr
          - gene:
              id: antigen
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
