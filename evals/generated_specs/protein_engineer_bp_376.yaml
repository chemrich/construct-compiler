construct:
  name: "bacillus_secreted_vaccine_antigen"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P43
    - cistron:
        label: antigen_expression_unit
        expression: high
        chain:
          - tag: Vpr
          - gene:
              id: vaccine_antigen
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - tag: 6xHis
    - terminator: rrnB_T1