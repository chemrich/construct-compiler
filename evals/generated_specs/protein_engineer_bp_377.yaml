construct:
  name: "Pichia_pastoris_cellulase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: cellulase
              source: uniprot
          - tag: Myc
          - tag: 6xHis

    - terminator: AOX1_TT
