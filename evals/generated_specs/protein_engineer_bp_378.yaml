construct:
  name: "bacillus_groel_target_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: groEL
        expression: high
        gene:
          id: groEL
          source: uniprot

    - spacer: 30

    - cistron:
        label: target
        expression: high
        chain:
          - tag: NusA
          - cleavage_site: TEV
          - gene:
              id: target
              source: uniprot

    - terminator: rrnB_T1
