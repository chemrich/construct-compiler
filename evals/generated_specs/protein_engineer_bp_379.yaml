construct:
  name: pichia_pastoris_secreted_biosensor
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_biosensor
        expression: high
        chain:
          - tag: signal_sequence_Ost1
          - gene:
              id: biosensor
              source: uniprot
          - cleavage_site: PreScission
          - tag: Strep-II

    - terminator: CYC1
