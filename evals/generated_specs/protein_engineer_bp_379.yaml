construct:
  name: "pichia_aox1_secreted_biosensor"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: biosensor_target
        expression: high
        chain:
          - tag: Ost1
          - gene:
              id: biosensor
          - cleavage_site: 3C
          - tag: Strep-II
    - terminator: CYC1