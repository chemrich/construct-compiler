construct:
  name: "Pichia_pastoris_secreted_lipase"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: TT_AOX1
