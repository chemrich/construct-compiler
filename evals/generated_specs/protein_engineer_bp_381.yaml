construct:
  name: "pichia_lipase_secretion_construct"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: P41365
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis
    - terminator: AOX1_term