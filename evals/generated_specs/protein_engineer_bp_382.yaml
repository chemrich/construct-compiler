construct:
  name: "Bacillus_xylanase_extracellular"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: xylanase
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: thermostable_xylanase
              source: uniprot

    - terminator: rrnB_T1
