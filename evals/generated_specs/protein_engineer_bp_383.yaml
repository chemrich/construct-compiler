construct:
  name: "pichia_pastoris_dual_antibody_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: antibody_heavy_chain
              source: uniprot

    - terminator: CYC1

  cassette_2:
    - promoter: GAP

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: antibody_light_chain
              source: uniprot

    - terminator: CYC1
