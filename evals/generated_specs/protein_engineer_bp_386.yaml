construct:
  name: "bacillus_amylase_pulldown_complex"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: target_amylase
        expression: high
        chain:
          - tag: GST
          - cleavage_site: TEV
          - gene:
              id: amylase
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
