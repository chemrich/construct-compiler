construct:
  name: pichia_pastoris_HSA_secretion
  host: yeast

  backbone:
    resistance: G418
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: HSA_secreted
        expression: high
        chain:
          - secretion_signal: alpha_mating_factor
          - gene:
              id: P02768
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1_polyA
