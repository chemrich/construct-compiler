construct:
  name: "bacillus_levansucrase_secreted"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - cistron:
        label: levansucrase
        expression: high
        chain:
          - tag: signal_peptide_SacB
          - gene:
              id: sacB
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
