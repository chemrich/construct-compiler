construct:
  name: "scFv_PDI_secretion_Pichia"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1

    - promoter: GAP

    - cistron:
        label: PDI
        expression: medium
        fused: false
        gene:
          id: PDI
          source: uniprot

    - terminator: CYC1
