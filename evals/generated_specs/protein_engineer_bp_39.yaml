construct:
  name: pichia_nanobody_secretion_system
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: G1

    - cistron:
        label: nanobody
        expression: high
        chain:
          - tag: alpha-factor_signal
          - gene:
              id: VHH
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis

    - terminator: CYC1
