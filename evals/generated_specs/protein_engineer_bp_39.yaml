```yaml
construct:
  name: "G1_promoter_nanobody_secretion_pichia"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: G1  # glucose-repressible promoter for methanol-free induction

    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: alpha_factor  # secretion signal for yeast
          - gene:
              id: nanobody  # specify actual nanobody ID/sequence
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis

    - terminator: rrnB_T1
```