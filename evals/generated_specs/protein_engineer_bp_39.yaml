construct:
  name: "pichia_methanol_free_nanobody_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: G1
    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: nanobody
          - cleavage_site: Enterokinase
          - tag: 6xHis
    - terminator: AOX1