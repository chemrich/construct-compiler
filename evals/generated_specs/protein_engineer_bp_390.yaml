construct:
  name: "bacillus_metabolic_operon_AB"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: gene_A
        expression: high
        gene:
          id: gene_A
          source: uniprot

    - spacer: 25

    - cistron:
        label: gene_B
        expression: medium
        fused: false
        gene:
          id: gene_B
          source: uniprot

    - terminator: rrnB_T1
