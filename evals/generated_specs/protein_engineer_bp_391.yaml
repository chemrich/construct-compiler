construct:
  name: "fld1_nanobody_secretion_pichia"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: nanobody
              source: uniprot
          - tag: c-myc
          - tag: 6xHis
    - terminator: AOX1_TT