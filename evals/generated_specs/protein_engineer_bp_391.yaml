construct:
  name: pichia_nanobody_secreted
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: nanobody
        expression: high
        chain:
          - secretion_signal: alpha_mating_factor
          - gene:
              id: nanobody
              source: uniprot
          - tag: c_myc
          - tag: 6xHis
          - terminator: CYC1
