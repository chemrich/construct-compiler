construct:
  name: "pichia_cutinase_secretion_optimization"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: cutinase_expression
        expression: high
        chain:
          - tag: Ost1_alpha_factor
          - gene:
              id: cutinase
              source: uniprot
          - tag: FLAG
    - terminator: AOX1_TT