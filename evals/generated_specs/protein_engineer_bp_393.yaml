construct:
  name: "Pichia_pastoris_cutinase_secretion_hybrid_SP"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: cutinase_secreted
        expression: high
        chain:
          - secretion_signal: Ost1_alpha_factor_hybrid
          - gene:
              id: cutinase
              source: uniprot
          - tag: FLAG
          - cleavage_site: Factor_Xa

    - terminator: rrnB_T1
