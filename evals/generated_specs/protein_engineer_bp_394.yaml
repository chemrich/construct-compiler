construct:
  name: "Bacillus_YncM_alkaline_phosphatase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: alkaline_phosphatase_secreted
        expression: high
        chain:
          - tag: signal_peptide_YncM
          - gene:
              id: alkaline_phosphatase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
