construct:
  name: "bacillus_tat_pathway_phod_gfp"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: HpaII

    - cistron:
        label: tat_reporter
        expression: high
        chain:
          - signal_peptide: PhoD  # Tat signal peptide for Bacillus secretion
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
