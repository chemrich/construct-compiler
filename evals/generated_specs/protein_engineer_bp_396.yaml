construct:
  name: "bacillus_tat_pathway_reporter"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: HpaII
    - cistron:
        label: tat_reporter
        expression: high
        chain:
          - tag: PhoD
          - gene:
              id: GFP
              source: fpbase
    - terminator: rrnB_T1