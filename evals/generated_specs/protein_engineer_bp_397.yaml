        label: interferon_alpha_secretion
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: IFNA2
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis
    - terminator: AOX1_TT