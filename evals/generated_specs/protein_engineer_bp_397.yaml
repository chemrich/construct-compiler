construct:
  name: "Pichia_IFN_alpha_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: IFN_alpha_secreted
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: interferon_alpha_2b
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: 6xHis

    - terminator: TT_AOX1
