construct:
  name: "pichia_secreted_scFv_mCherry"
  host: yeast
  
  backbone:
    resistance: zeocin
    ori: pAO815
    source: addgene
  
  cassette:
    - promoter: YPT1
    
    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - secretion_signal: alpha_factor_prepro
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
