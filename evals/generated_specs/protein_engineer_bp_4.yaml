```yaml
construct:
  name: heterodimeric_protein_coexpression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - gene:
              id: subunit_A
              source: uniprot

    - terminator: rrnB_T1

    - promoter: AOX1

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - secretion_signal: alpha_factor
          - tag: Strep-II
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: rrnB_T1
```