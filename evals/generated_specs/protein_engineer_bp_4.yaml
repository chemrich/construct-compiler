construct:
  name: "pichia_heterodimer_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: AOX1

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: Strep-II
          - secretion_signal: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: rrnB_T1
