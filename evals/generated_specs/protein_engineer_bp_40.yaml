construct:
  name: "bacillus_subtilis_secreted_target"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target
              source: uniprot
              codon_optimization: bacillus_subtilis

    - terminator: rrnB_T1
