construct:
  name: "pichia_methanol_induced_gfp_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_gfp
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GFP
              source: fpbase
    - terminator: AOX1_term