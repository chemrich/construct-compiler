construct:
  name: "Pichia_pastoris_secreted_GFP"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: alpha_factor
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
