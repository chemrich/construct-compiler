construct:
  name: "bacillus_thermostable_lipase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: lipase
        expression: high
        chain:
          - tag: AmyE_signal
          - gene:
              id: thermostable_lipase
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
