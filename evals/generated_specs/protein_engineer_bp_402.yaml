construct:
  name: "pichia_phaffii_HSA_secretion"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: HSA
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: P02768
              source: uniprot
              codon_optimization: true
              organism: Komagataella_phaffii

    - terminator: rrnB_T1
