construct:
  name: "bacillus_inducible_secreted_nanobody"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: nanobody
        expression: medium
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: nanobody
              source: uniprot
        secretion_signal: SacB

    - terminator: rrnB_T1
