construct:
  name: "bacillus_pxyl_nanobody_secretion"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - tag: SacB  # Bacillus secretion signal peptide
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: VHH
              source: uniprot
    - terminator: rrnB_T1