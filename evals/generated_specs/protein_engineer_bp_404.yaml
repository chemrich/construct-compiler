construct:
  name: "mAb_dual_chain_Pichia_pastoris"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: "antibody_heavy_chain"
              source: uniprot

    - spacer: 50

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: "antibody_light_chain"
              source: uniprot

    - terminator: rrnB_T1
