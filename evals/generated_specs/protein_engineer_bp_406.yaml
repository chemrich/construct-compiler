construct:
  name: "Pichia_FLD1_cutinase_secretion"
  host: yeast

  backbone:
    resistance: zeomycin
    ori: ARS
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: cutinase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: cutinase_codon_optimized
              source: uniprot

    - terminator: CYC1
