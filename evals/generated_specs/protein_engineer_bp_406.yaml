construct:
  name: "pichia_fld1_cutinase_secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: secreted_cutinase
        expression: high
        chain:
          - tag: alpha-factor
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: cutinase
              source: uniprot
    - terminator: AOX1_term