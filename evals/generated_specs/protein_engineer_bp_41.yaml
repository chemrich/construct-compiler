construct:
  name: "Pichia_pastoris_AOX1_secreted_FLAG"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: target
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: target_protein
              source: uniprot
              codon_optimization: pichia_pastoris
          - tag: FLAG

    - terminator: AOX1_terminator
