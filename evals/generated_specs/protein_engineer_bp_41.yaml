construct:
  name: "pichia_pastoris_aox1_secretion_construct"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: mCherry
              source: fpbase
          - tag: FLAG
    - terminator: AOX1_term