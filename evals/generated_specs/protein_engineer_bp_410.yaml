construct:
  name: pichia_secreted_mCherry_zeocin
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: mCherry_secreted
        expression: high
        chain:
          - tag: 8xHis
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - promoter: TEF1

    - cistron:
        label: zeocin_resistance
        expression: high
        gene:
          id: Zeocin_resistance_marker
          source: uniprot

    - terminator: CYC1
