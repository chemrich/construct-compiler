construct:
  name: "bacillus_subtilis_phytase_secretion"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: fungal_phytase
        expression: high
        chain:
          - tag: WprA  # Bacillus secretion signal peptide
          - gene:
              id: P34752
              source: uniprot
          - tag: 6xHis
    - terminator: trpA_term  # Strong Bacillus rho-independent terminator_termings