construct:
  name: IL2_HSA_secretion_Pichia
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: IL2_HSA_fusion
        expression: high
        chain:
          - tag: alpha_factor_signal
          - solubility_tag: HSA
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: Enterokinase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IL2
              source: uniprot

    - terminator: rrnB_T1
