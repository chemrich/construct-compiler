construct:
  name: "bacillus_lipase_secretion_cassette"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_esterase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: estA
              source: uniprot

    - terminator: rrnB_T1
