construct:
  name: "Pichia_Cas9_secretion_SpyTag_purification"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: Cas9_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: SpyTag
          - gene:
              id: Cas9
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
