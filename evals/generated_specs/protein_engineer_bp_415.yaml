construct:
  name: bacillus_xylanase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: xylanase
        expression: high
        chain:
          - signal_peptide: YncM
          - gene:
              id: xynA
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
