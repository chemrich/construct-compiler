construct:
  name: "pichia_biocatalytic_cascade"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: DAS1
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: enzyme_1
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1_term
    - promoter: DAS2
    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: enzyme_2
              source: uniprot
          - tag: FLAG
    - terminator: CYC1_term