construct:
  name: pichia_biocatalytic_cascade_dual_promoter
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: enzyme1
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1

    - promoter: DAS2

    - cistron:
        label: enzyme2
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: enzyme2
              source: uniprot
          - tag: FLAG

    - terminator: CYC1
