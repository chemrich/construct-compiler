construct:
  name: "gst_reductase_bacillus_subtilis"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pspac
    - cistron:
        label: reductase_expression
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: reductase
              source: uniprot
    - terminator: rrnB_T1