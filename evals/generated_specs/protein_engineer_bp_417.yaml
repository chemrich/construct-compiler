construct:
  name: "Bacillus_intracellular_reductase_GST"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - cistron:
        label: reductase
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: thioredoxin_reductase
              source: uniprot
              codon_optimization: B_subtilis
              localization: cytoplasmic

    - terminator: rrnB_T1
