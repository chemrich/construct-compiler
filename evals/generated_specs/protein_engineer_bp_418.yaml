construct:
  name: "scFv_secretion_PDI_chaperone_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: scFv
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: AOX1

    - cistron:
        label: PDI_chaperone
        expression: high
        fused: false
        gene:
          id: PDI
          source: uniprot

    - terminator: rrnB_T1
