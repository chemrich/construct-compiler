construct:
  name: "Bacillus_AmyE_sfGFP_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: AmyE_sfGFP
        expression: high
        chain:
          - tag: AmyE_signal_peptide
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
