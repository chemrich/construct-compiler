construct:
  name: "pichia_pastoris_aox1_secreted_lipase"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: lipase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: TT_polyA
