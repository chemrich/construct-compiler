construct:
  name: bacillus_amylase_secretion_cassette
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: amylase_secreted
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: Enterokinase
          - solubility_tag: AmyE
