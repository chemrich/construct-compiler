construct:
  name: "bacillus_secreted_amylase"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pgrac
    - cistron:
        label: target_amylase
        expression: high
        chain:
          - tag: AmyE
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: amyE
              source: uniprot
    - terminator: rrnB_T1