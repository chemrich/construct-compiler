construct:
  name: "Bacillus_heat_stable_polymerase_8xHis_MBP"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: polymerase
        expression: high
        chain:
          - tag: 8xHis
          - solubility_tag: MBP
          - gene:
              id: Taq
              source: uniprot

    - terminator: rrnB_T1
