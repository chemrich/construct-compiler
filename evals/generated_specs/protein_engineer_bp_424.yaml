construct:
  name: pichia_pastoris_secretion_AOX1
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: alpha_factor_prepro
          - gene:
              id: GFP
              source: uniprot
          - tag: Myc
          - tag: 10xHis

    - terminator: AOX1_term
