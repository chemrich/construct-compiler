        label: subunit_A
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: subunit_A
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1_TT
    - promoter: AOX1
    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: subunit_B
              source: uniprot
          - tag: FLAG
    - terminator: AOX1_TT