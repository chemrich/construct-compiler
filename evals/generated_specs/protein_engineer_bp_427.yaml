construct:
  name: bacillus_chaperone_enzyme_operon
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: chaperone
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GroEL
              source: uniprot

    - spacer: 35

    - cistron:
        label: target_enzyme
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: your_enzyme_name
              source: uniprot

    - terminator: rrnB_T1
