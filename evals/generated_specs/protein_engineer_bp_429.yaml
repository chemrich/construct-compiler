construct:
  name: "Bacillus_secreted_mammalian_protein"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac100

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - signal_peptide: vpr
          - gene:
              id: unknown_mammalian_protein
              source: uniprot

    - terminator: rrnB_T1
