construct:
  name: "B_subtilis_high_expression_Strep_SUMO_target"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Veg

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - solubility_tag: SUMO
          - cleavage_site: 3C
          - gene:
              id: target_protein

    - terminator: rrnB_T1
