construct:
  name: "pichia_hsa_peptide_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_hsa_peptide
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: P02768
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_peptide
              source: uniprot

    - terminator: rrnB_T1
