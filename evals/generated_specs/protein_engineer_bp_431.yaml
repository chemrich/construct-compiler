construct:
  name: bacillus_sacB_secretion_His_tag
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: sacB

    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: sacB
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
