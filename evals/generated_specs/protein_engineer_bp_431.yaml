construct:
  name: bacillus_sacB_secretion_purification
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: sacB
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: sacB_signal
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - terminator: rrnB_T1