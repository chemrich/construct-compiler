construct:
  name: "pichia_pastoris_fld1_secretion_system"
  host: yeast
  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: target_protein
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_gene
              source: uniprot
    - terminator: AOX1_term