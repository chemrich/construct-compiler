construct:
  name: "bacillus_gst_bait_pull_down"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: bait_expression
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: 3C
          - gene:
              id: bait_protein
              source: uniprot
    - terminator: rrnB_T1