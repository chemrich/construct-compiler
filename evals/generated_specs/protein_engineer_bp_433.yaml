construct:
  name: "bacillus_GST_bait_pulldown"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: bait
        expression: high
        chain:
          - tag: GST
          - cleavage_site: PreScission
          - gene:
              id: bait
              source: uniprot

    - terminator: rrnB_T1
