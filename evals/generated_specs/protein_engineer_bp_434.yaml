construct:
  name: pichia_gappromoter_his_p2a_ha
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: gene1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gene1
              source: uniprot

    - spacer: 21

    - cistron:
        label: p2a_peptide
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 21

    - cistron:
        label: gene2
        expression: high
        chain:
          - gene:
              id: gene2
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
