construct:
  name: "amyE_integration_cassette_bacillus"
  host: bacillus
  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: custom  # Backbone includes amyE homology arms for genomic integration
  cassette:
    - promoter: Pgrac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - terminator: rrnB_T1