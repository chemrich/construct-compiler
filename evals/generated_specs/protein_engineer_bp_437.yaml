construct:
  name: "amyE_integration_cassette_his_tag"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - homology_arm:
        target: amyE
        position: upstream
        length: 1000

    - promoter: Pgrac

    - rbs: strong

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: target_gene
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

    - homology_arm:
        target: amyE
        position: downstream
        length: 1000

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: cat
          source: uniprot
