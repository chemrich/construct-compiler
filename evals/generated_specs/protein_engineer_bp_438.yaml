construct:
  name: "pichia_aox1_secreted_dual_tagged_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: alpha_factor
          - tag: 6xHis
          - gene:
              id: target_gene
              source: uniprot
          - tag: Twin-Strep
    - terminator: AOX1_term