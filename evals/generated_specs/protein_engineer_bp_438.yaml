construct:
  name: pichia_dual_tagged_secreted_protein
  host: yeast

  backbone:
    catalog_vector: "pPIC9"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: target_protein
              source: uniprot
          - tag: Twin_Strep

    - terminator: rrnB_T1
