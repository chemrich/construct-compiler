```yaml
construct:
  name: antibody_heavy_light_chain_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1
    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: heavy_chain
              source: custom  # User will provide sequence
          - tag: 6xHis
    - terminator: AOX1_TT

    - promoter: AOX1
    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: light_chain
              source: custom  # User will provide sequence
    - terminator: AOX1_TT
```