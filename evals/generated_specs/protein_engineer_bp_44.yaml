construct:
  name: "pichia_pastoris_antibody_biexpress"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS4
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: heavy_chain
              source: uniprot
          - tag: 6xHis

    - terminator: TT_AOX1

    - promoter: AOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: light_chain
              source: uniprot

    - terminator: TT_AOX1
