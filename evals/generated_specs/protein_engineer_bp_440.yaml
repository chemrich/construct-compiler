construct:
  name: "Pichia_pastoris_lipase_secretion"
  host: pichia_pastoris

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: lipase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
