construct:
  name: "bacillus_subtilis_subtilisin_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: subtilisin
        expression: high
        chain:
          - secretion_signal: AmyE_signal_peptide
          - gene:
              id: aprE
              source: uniprot

    - terminator: rrnB_T1
