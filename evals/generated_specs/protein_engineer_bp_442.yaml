construct:
  name: pichia_scfv_gst_stability
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: scfv_gst
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: 3C
          - gene:
              id: scFv
              source: uniprot

    - terminator: rrnB_T1
