construct:
  name: "Bacillus_amylase_GroES_bicistronic"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: amylase
        expression: high
        chain:
          - signal_peptide: AprE
          - gene:
              id: amyE
              source: uniprot

    - spacer: 30

    - cistron:
        label: GroES
        expression: high
        fused: false
        gene:
          id: groES
          source: uniprot

    - terminator: rrnB_T1
