construct:
  name: "Pichia_AOX1_Ost1_mEGFP_Strep"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Ost1
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Strep-II
    - terminator: AOX1_term