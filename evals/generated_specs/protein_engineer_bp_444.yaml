construct:
  name: "pichia_pastoris_GFP_secretion_Ost1"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: sfGFP
              source: fpbase
          - tag: Strep-II

    - terminator: rrnB_T1
