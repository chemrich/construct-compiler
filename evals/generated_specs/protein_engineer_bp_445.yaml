construct:
  name: bacillus_xylose_inducible_cutinase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: cutinase_secreted
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - signal_peptide: LipA
          - gene:
              id: cutinase
              source: uniprot

    - terminator: rrnB_T1
