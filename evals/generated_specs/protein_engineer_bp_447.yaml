construct:
  name: "Bacillus_amyE_integration_phytase"
  host: bacillus

  backbone:
    resistance: spectinomycin
    ori: pAMβ
    source: addgene
    # Integration vector backbone with amyE homology arms for chromosomal integration

  cassette:
    - homology_arm_5:
        target_locus: amyE
        length: 500
        position: upstream

    - promoter: Pgrac

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: SacB_signal_peptide
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "Bacillus_phytase_codon_optimized"
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

    - homology_arm_3:
        target_locus: amyE
        length: 500
        position: downstream
