construct:
  name: "pichia_pastoris_dual_mAb_expression"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: PAOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mAb_heavy_chain
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: PAOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: mAb_light_chain
              source: uniprot

    - terminator: CYC1
