construct:
  name: "bacillus_nanobody_secretion_amyQ"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PamyQ

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - secretion_signal: Vpr
          - gene:
              id: nanobody
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
