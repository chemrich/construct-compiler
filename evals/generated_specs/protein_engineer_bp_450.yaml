construct:
  name: "xylanase_SUMO_optimized_Pichia"
  host: yeast

  backbone:
    catalog_vector: "pGAPZ"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: xylanase_SUMO
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: xylanase
              source: uniprot

    - terminator: rrnB_T1
