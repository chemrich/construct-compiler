construct:
  name: "bacillus_cellulase_secretion_P43"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - signal_peptide: YncM
          - gene:
              id: cellulase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Twin-Strep

    - terminator: rrnB_T1
