construct:
  name: "insulin_precursor_pichia_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: insulin_precursor
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: Enterokinase
          - gene:
              id: INS
              source: uniprot
    - terminator: AOX1_term