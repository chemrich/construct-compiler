construct:
  name: insulin_precursor_pichia_expression
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeomycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: insulin_precursor
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: Enterokinase
          - gene:
              id: INS
              source: uniprot

    - terminator: rrnB_T1
