construct:
  name: Bacillus_dual_protease_secretion
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: protease_A
        expression: high
        chain:
          - signal_peptide: AprE
          - gene:
              id: aprE
              source: uniprot

    - spacer: 30

    - cistron:
        label: protease_B
        expression: high
        fused: false
        chain:
          - signal_peptide: Vpr
          - gene:
              id: vpr
              source: uniprot

    - terminator: rrnB_T1
