construct:
  name: "Pichia_IFN_alpha_GAP_constitutive"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: IFN_alpha
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Thrombin
          - signal_sequence: alpha_factor_modified
          - gene:
              id: "IFN2"
              source: uniprot

    - terminator: rrnB_T1
