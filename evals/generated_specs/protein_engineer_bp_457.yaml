construct:
  name: "bacillus_maltogenic_amylase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac100

    - cistron:
        label: maltogenic_amylase
        expression: high
        chain:
          - signal_peptide: NprE
          - gene:
              id: "NprE_maltogenic_amylase"
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
