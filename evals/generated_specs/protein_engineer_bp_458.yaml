construct:
  name: Pichia_pastoris_dual_enzyme_metabolic
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: Enzyme_A
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P12345
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: PGAP

    - cistron:
        label: Enzyme_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P67890
              source: uniprot

    - terminator: CYC1
