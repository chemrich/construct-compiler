construct:
  name: Komagataella_phaffii_FLD1_lipase_secretion
  host: yeast

  backbone:
    resistance: zeocin
    ori: pAO815
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: secreted_lipase
        expression: high
        chain:
          - secretion_signal: alpha-factor
          - gene:
              id: lipase
              source: uniprot
          - tag: HA

    - terminator: CYC1
