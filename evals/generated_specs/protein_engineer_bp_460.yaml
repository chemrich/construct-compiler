construct:
  name: "pichia_pastoris_lipase_secretion_vector"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: lipase_expression
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: P41365
              source: uniprot
          - tag: 6xHis
    - terminator: AOX1_term