construct:
  name: "Pichia_pastoris_lipase_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipase_codon_optimized_pichia
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis

    - terminator: TT_AOX1
