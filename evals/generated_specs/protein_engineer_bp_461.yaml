construct:
  name: "Bacillus_amylase_secretion_optimized"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - secretion_signal: AmyE
          - gene:
              id: amylase_codon_optimized
              source: uniprot

    - terminator: rrnB_T1
