construct:
  name: "Pichia_cellulase_SUMO_cytosolic"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: cellulase_SUMO
        expression: high
        chain:
          - tag: SUMO
          - cleavage_site: 3C
          - gene:
              id: cellulase
              source: uniprot
              codon_optimized: true
              organism: pichia_pastoris

    - terminator: CYC1_TT
