construct:
  name: bacillus_phytase_secretion
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - secretion_signal: AprE
          - gene:
              id: phytase
              source: uniprot

    - terminator: rrnB_T1
