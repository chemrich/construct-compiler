construct:
  name: "nattokinase_industrial_bacillus"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: nattokinase
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: nattokinase
              source: uniprot
              # Note: sequence assumed codon-optimized for B. subtilis during compilation

    - terminator: rrnB_T1
