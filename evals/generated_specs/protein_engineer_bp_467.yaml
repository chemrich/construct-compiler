construct:
  name: "Pichia_pastoris_mAb_bicistronic_AOX1"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: "mAb_HC_codon_optimized"
              source: uniprot
              note: "Pichia pastoris codon optimization required"

    - spacer: 51

    - cistron:
        label: light_chain
        expression: high
        fused: false
        chain:
          - tag: P2A
          - tag: alpha_factor_signal
          - gene:
              id: "mAb_LC_codon_optimized"
              source: uniprot
              note: "Pichia pastoris codon optimization required"

    - terminator: AOX1_TT
