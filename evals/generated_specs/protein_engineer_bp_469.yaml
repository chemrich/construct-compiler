construct:
  name: "pichia_cutinase_secreted_cmyc"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS4
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: cutinase_secreted
        expression: high
        chain:
          - signal_peptide: alpha_mating_factor
          - gene:
              id: cutinase
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: c_Myc

    - terminator: CYC1
