construct:
  name: Bacillus_AprE_protease_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AprE

    - cistron:
        label: secreted_protease
        expression: high
        chain:
          - secretion_signal: AprE_signal_peptide
          - region:
              label: pro_peptide
              type: propeptide
          - region:
              label: mature_protease
              type: catalytic_domain
              gene:
                id: subtilisin
                source: uniprot
          - tag: 6xHis
        codon_optimization: bacillus

    - terminator: rrnB_T1
