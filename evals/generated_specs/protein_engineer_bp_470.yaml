construct:
  name: "bacillus_pxyl_chitinase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: chitinase
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: Thrombin
          - secretion_signal: AmyQ
          - gene:
              id: chitinase
              source: uniprot

    - terminator: rrnB_T1
