construct:
  name: "pichia_pastoris_heterodimer_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: subunit_a
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: Subunit_A
              source: uniprot
    - terminator: AOX1_TT
    - promoter: GAP
    - cistron:
        label: subunit_b
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: Subunit_B
              source: uniprot
    - terminator: AOX1_TT