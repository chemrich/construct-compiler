construct:
  name: "heterodimeric_complex_pichia"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: GAP

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: CYC1
