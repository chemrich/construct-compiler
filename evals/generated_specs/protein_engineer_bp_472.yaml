construct:
  name: "bacillus_secretion_reporter"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: secreted_GFP
        expression: high
        chain:
          - secretion_signal: Vpr
          - gene:
              id: GFP
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
