  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
  cassette:
    - promoter: Pveg
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: Vpr
          - gene:
              id: sfGFP
              source: fpbase
          - tag: 6xHis
    - terminator: rrnB_T1