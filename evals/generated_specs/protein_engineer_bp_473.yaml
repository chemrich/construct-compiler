construct:
  name: "Pichia_esterase_stable_secreted"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: esterase
        expression: high
        chain:
          - tag: alpha_factor_secretion_signal
          - cleavage_site: Signal_peptidase
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: esterase
              source: uniprot

    - terminator: rrnB_T1
