construct:
  name: "pichia_aox1_gst_esterase_secretion"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_esterase
        expression: high
        chain:
          - tag: alpha_factor
          - solubility_tag: GST
          - cleavage_site: TEV
          - gene:
              id: esterase
              source: uniprot
    - terminator: AOX1_term