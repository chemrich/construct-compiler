construct:
  name: "bacillus_pullulanase_high_yield"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac01

    - cistron:
        label: pullulanase
        expression: high
        chain:
          - signal_peptide: yncM
          - gene:
              id: pullulanase_codon_optimized
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
