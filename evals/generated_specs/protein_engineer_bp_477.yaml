construct:
  name: "Pichia_scFv_AOX1_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: synthetic_secretion_signal
          - cleavage_site: Kex2
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
