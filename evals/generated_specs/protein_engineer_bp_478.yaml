construct:
  name: "bacillus_lipase_chaperone_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: chaperone
        expression: high
        gene:
          id: groES
          source: uniprot

    - spacer: 25

    - cistron:
        label: lipase
        expression: high
        fused: false
        gene:
          id: lipase
          source: uniprot

    - terminator: rrnB_T1
