construct:
  name: "pichia_nanobody_production"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: nanobody
        expression: high
        chain:
          - secretion_signal: alpha_mating_factor
          - gene:
              id: nanobody_pichia_codon_optimized
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
