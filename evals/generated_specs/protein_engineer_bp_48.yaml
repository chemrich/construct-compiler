construct:
  name: "Pichia_pastoris_secreted_kinase_stability_construct"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1
    - cistron:
        label: secreted_kinase
        expression: high
        chain:
          - tag: Ost1-alpha-factor
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: MAPK1
              source: uniprot
          - tag: Myc
    - terminator: BBa_B0015