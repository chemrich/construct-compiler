construct:
  name: "pichia_secreted_GST_kinase_myc"
  host: yeast
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: TEF1
    
    - cistron:
        label: secreted_kinase
        expression: high
        codon_optimization: pichia_pastoris
        chain:
          - secretion_signal: Ost1_alpha_factor
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: kinase
              source: uniprot
              note: "aggregation-prone kinase - user-specified sequence"
          - tag: Myc
    
    - terminator: rrnB_T1
