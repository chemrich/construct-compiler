```yaml
construct:
  name: "stabilized_kinase_secretion_pichia"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: target_kinase
        expression: medium
        chain:
          - secretion_signal: Ost1_alpha_factor
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: your_kinase_id  # Replace with actual kinase UniProt ID
              source: uniprot
              codon_optimize: P_pastoris
          - tag: Myc

    - terminator: rrnB_T1
```