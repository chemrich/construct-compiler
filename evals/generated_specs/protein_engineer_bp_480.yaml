construct:
  name: "Bacillus_LipA_secretion_cassette"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: LipA_secreted
        expression: high
        chain:
          - secretion_signal: AmyQ
          - gene:
              id: LipA
              source: uniprot
              codon_optimized: true
              optimization_host: bacillus_subtilis
          - tag: 6xHis

    - terminator: rrnB_T1
