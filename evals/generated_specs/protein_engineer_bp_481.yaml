construct:
  name: pichia_pastoris_scFv_secretion
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: alpha_factor
          - gene:
              id: scFv
              source: uniprot

    - terminator: rrnB_T1
