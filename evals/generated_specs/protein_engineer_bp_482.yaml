construct:
  name: bacillus_aprE_cutinase_groes_bicistronic
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: aprE

    - cistron:
        label: cutinase
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: cutinase
              source: uniprot

    - spacer: 30

    - cistron:
        label: groes
        expression: high
        fused: false
        gene:
          id: groes
          source: uniprot

    - terminator: rrnB_T1
