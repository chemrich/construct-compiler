construct:
  name: "Pichia_pastoris_GAP_HSA_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: HSA_secreted
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor
          - tag: FLAG
          - cleavage_site: Enterokinase
          - gene:
              id: HSA
              source: uniprot
              codon_optimization: pichia_pastoris

    - terminator: CYC1_TT
