construct:
  name: "pichia_pastoris_esterase_gfp_dual"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: esterase_secreted
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: esterase
              source: uniprot

    - spacer: 20

    - cistron:
        label: gfp_cytosolic
        expression: high
        fused: false
        chain:
          - tag: P2A
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
