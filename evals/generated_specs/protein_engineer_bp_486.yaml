construct:
  name: "bacillus_sporulation_amylase_expression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PspoVG

    - rbs: strong

    - cistron:
        label: amylase
        expression: high
        chain:
          - secretion_signal: YncM
          - tag: 6xHis
          - cleavage_site: Thrombin
          - gene:
              id: amylase
              source: uniprot

    - terminator: rrnB_T1
