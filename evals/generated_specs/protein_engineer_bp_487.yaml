construct:
  name: pichia_rDNA_nanobody_secretion
  host: yeast

  backbone:
    catalog_vector: "pPIC9K"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - tag: GST
          - cleavage_site: PreScission
          - gene:
              id: nanobody
              source: uniprot
        secretion_signal: alpha_factor_Ost1_hybrid

    - terminator: CYC1
