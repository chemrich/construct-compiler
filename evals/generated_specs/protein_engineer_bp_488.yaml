construct:
  name: bacillus_promoter_screening_mCherry
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - signal_peptide: AmyE
          - gene:
              id: mCherry
              source: fpbase
          - tag: 6xHis

    - terminator: rrnB_T1
