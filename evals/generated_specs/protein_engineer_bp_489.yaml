construct:
  name: "Pichia_viral_antigen_intracellular"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: viral_antigen
        expression: high
        chain:
          - tag: 8xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: viral_antigen_pp_codon_optimized
              source: uniprot

    - terminator: rrnB_T1
