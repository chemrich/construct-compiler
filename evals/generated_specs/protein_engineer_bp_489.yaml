construct:
  name: "pichia_pastoris_antigen_intracellular_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: TEF1
    - cistron:
        label: antigen_fusion
        expression: high
        chain:
          - tag: 8xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: P0DTC2
              source: uniprot
    - terminator: CYC1