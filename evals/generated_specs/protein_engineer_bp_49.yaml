construct:
  name: "bacillus_subtilis_scfv_secretion_chaperone_system"
  host: bacillus
  backbone:
    resistance: kanamycin
    source: addgene
  cassette:
    - promoter: Pgrac
    - cistron:
        label: secreted_scFv
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1
    - promoter: Pveg
    - cistron:
        label: groES
        expression: medium
        gene:
          id: groES
          source: uniprot
    - spacer: 30
    - cistron:
        label: groEL
        expression: medium
        fused: false
        gene:
          id: groEL
          source: uniprot
    - terminator: rrnB_T1