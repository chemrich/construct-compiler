construct:
  name: "B_subtilis_scFv_with_chaperones"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: AmyE
          - gene:
              id: scFv
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1

  cassette_2:
    - promoter: Pveg

    - cistron:
        label: groES
        expression: high
        gene:
          id: groES
          source: uniprot

    - spacer: 30

    - cistron:
        label: groEL
        expression: high
        fused: false
        gene:
          id: groEL
          source: uniprot

    - terminator: rrnB_T1
