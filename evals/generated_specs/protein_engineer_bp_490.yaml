construct:
  name: "bacillus_cellulase_secretion_tandem"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pveg_Pgrac  # Tandem promoter configuration for high-level expression in Bacillus
      cistron:
        label: secreted_cellulase
        expression: high
        chain:
          - tag: VapA_signal_peptide  # N-terminal secretion signal for Bacillus
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: P10446
              source: uniprot
      terminator: BBa_B0015