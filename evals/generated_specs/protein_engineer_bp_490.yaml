construct:
  name: "Bacillus_VapA_cellulase_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg
    
    - promoter: Pgrac
    
    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: signal_peptide_VapA
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: cellulase
              source: uniprot

    - terminator: rrnB_T1
