construct:
  name: "pichia_bispecific_scFv_AOX1"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: bispecific_scFv
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: scFv1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: scFv2
              source: uniprot
          - tag: c_Myc
          - tag: 6xHis

    - terminator: rrnB_T1
