construct:
  name: "Pichia_pastoris_secretion_validation_GLuc"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_GLuc_reporter
        expression: high
        chain:
          - tag: alpha_factor_pre_pro
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GLuc
              source: uniprot

    - terminator: CYC1_poly_A
