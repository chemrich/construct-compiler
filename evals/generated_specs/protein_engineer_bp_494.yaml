construct:
  name: "bacillus_subtilisin_variant_expression"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PaprE

    - cistron:
        label: subtilisin_variant
        expression: high
        chain:
          - gene:
              id: aprE_signal_peptide
              source: uniprot
          - gene:
              id: subtilisin_pro_peptide
              source: uniprot
          - gene:
              id: subtilisin_mature
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
