construct:
  name: pichia_surface_display_aga2p_affibody
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: HA
          - gene:
              id: affibody
              source: uniprot

    - terminator: rrnB_T1
