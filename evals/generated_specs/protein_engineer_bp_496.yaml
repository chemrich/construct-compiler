construct:
  name: "auto_inducible_kinase_bacillus"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PmtlA

    - cistron:
        label: target_kinase
        expression: high
        chain:
          - tag: Twin-Strep
          - cleavage_site: 3C
          - solubility_tag: MBP
          - gene:
              id: kinase
              source: uniprot

    - terminator: rrnB_T1
