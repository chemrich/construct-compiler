construct:
  name: "Pichia_GPCR_YPT1_FLAG_TEV_10xHis"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: YPT1

    - cistron:
        label: GPCR
        expression: medium
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: GPCR
              source: uniprot
              codon_optimization: pichia_pastoris
          - tag: 10xHis

    - terminator: rrnB_T1
