construct:
  name: "Bacillus_TAT_secreted_sfGFP"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: TAT_secreted_reporter
        expression: high
        chain:
          - tag: TAT_signal_PhoD
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
