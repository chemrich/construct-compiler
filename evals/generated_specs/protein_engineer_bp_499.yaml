construct:
  name: pichia_antibody_dual_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: pAOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: antibody_heavy_chain
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1_TT

    - promoter: pDAS1
      direction: reverse

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: antibody_light_chain
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1_TT
