construct:
  name: "pichia_pastoris_intracellular_das1_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: DAS1
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
    - terminator: AOX1_term # AOX1 terminator is used for optimal termination in methanol-induced Pichia systems