construct:
  name: "Pichia_pastoris_intracellular_SUMO_target"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: DAS1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: target_codon_optimized
              source: uniprot

    - terminator: rrnB_T1
