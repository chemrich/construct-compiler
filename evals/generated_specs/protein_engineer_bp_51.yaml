construct:
  name: bacillus_sacb_antigen_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: sacB

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Twin-Strep
            position: c_terminal
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - secretion_signal: alpha-factor
          - gene:
              id: antigen
              source: uniprot

    - terminator: rrnB_T1
