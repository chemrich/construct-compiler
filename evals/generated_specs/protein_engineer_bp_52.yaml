construct:
  name: "Pichia_AOX1_secretion_monitor"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_eGFP
        expression: high
        chain:
          - tag: alpha_factor_prepro
          - gene:
              id: eGFP
              source: fpbase
          - tag: 8xHis

    - terminator: CYC1
