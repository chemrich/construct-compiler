construct:
  name: "Pichia_pastoris_metabolic_pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: gene_a_cistron
        expression: high
        chain:
          - gene:
              id: Gene_A
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1_term
    - promoter: TEF1
    - cistron:
        label: gene_b_cistron
        expression: high
        chain:
          - gene:
              id: Gene_B
              source: uniprot
          - tag: FLAG
    - terminator: CYC1_term
    - promoter: PGK1
    - cistron:
        label: gene_c_cistron
        expression: high
        chain:
          - gene:
              id: Gene_C
              source: uniprot
          - tag: HA
    - terminator: CYC1_term