construct:
  name: "pichia_3gene_metabolic_pathway"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: gene_A
        expression: high
        chain:
          - gene:
              id: gene_A
              source: custom
              codon_optimized: pichia_pastoris
          - tag: 6xHis

    - terminator: CYC1

    - promoter: TEF1

    - cistron:
        label: gene_B
        expression: high
        chain:
          - gene:
              id: gene_B
              source: custom
              codon_optimized: pichia_pastoris
          - tag: FLAG

    - terminator: CYC1

    - promoter: PGK1

    - cistron:
        label: gene_C
        expression: high
        chain:
          - gene:
              id: gene_C
              source: custom
              codon_optimized: pichia_pastoris
          - tag: HA

    - terminator: CYC1
