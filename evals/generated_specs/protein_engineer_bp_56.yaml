construct:
  name: "Pichia_HSA_fusion_therapeutic"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: HSA_fusion
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: P02768
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: therapeutic_protein
              source: uniprot

    - terminator: AOX1
