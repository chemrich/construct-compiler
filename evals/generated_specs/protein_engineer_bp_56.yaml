construct:
  name: "HSA_therapeutic_fusion_pichia"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: P02768  # Human Serum Albumin (HSA)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01574  # Interferon beta-1 (representative therapeutic target)
              source: uniprot
    - terminator: AOX1