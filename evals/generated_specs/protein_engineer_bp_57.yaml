construct:
  name: bacillus_secretion_enzyme
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: LipA

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: LipA_signal_peptide
          - cleavage_site: TEV
          - gene:
              id: enzyme
              source: uniprot

    - terminator: rrnB_T1
