construct:
  name: "pichia_surface_display_nanobody"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: nanobody
              source: uniprot
          - tag: Myc
          - gene:
              id: Sed1_anchor
              source: uniprot

    - terminator: CYC1
