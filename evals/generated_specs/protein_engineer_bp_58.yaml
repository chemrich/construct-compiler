construct:
  name: "Pichia_GAP_surface_display_nanobody_Sed1"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAP
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: target_nanobody
              source: uniprot
          - tag: Myc
          - gene:
              id: SED1
              source: uniprot
    - terminator: CYC1