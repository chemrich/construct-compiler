construct:
  name: "dual_promoter_bacillus_cellulase_secreted"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - promoter: Pgrac

    - cistron:
        label: cellulase_secreted
        expression: high
        chain:
          - tag: secretion_signal_amyE
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: 3C
          - gene:
              id: cellulase
              source: uniprot

    - terminator: rrnB_T1
