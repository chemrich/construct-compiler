construct:
  name: pichia_AOX1_hSA_secretion
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: hSA_secreted
        expression: high
        chain:
          - secretion_signal: alpha_mating_factor_preproleader
          - cleavage_site: Kex2
          - cleavage_site: TEV
          - gene:
              id: P02768
              source: uniprot

    - terminator: rrnB_T1
