construct:
  name: pichia_lipase_secretion
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: lipase_secreted
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: lipase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: TT_AOX1
