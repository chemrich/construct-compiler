construct:
  name: "Pichia_PGAP_GFP_nanobody_His"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PGAP

    - cistron:
        label: GFP_nanobody
        expression: high
        chain:
          - signal_peptide: alpha_mating_factor
          - gene:
              id: GFP_nanobody
              source: uniprot
              codon_optimization: pichia_pastoris
          - tag: 6xHis

    - terminator: rrnB_T1
