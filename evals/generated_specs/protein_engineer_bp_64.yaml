construct:
  name: "Pichia_PAOX1_SUMO_kinase"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: kinase_target
              source: uniprot

    - terminator: CYC1
