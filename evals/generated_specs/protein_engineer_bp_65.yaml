construct:
  name: "Bacillus_subtilis_MBP_reductase"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: 3C
          - gene:
              id: reductase
              source: uniprot

    - terminator: rrnB_T1
