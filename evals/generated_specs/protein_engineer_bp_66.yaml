construct:
  name: pichia_scFv_secretion
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: scFv
              source: uniprot
          - cleavage_site: Enterokinase
          - tag: FLAG

    - terminator: rrnB_T1
