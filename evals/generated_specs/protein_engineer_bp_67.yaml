construct:
  name: bacillus_wapA_cellulase_secretion
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pspac

    - cistron:
        label: cellulase_secreted
        expression: high
        chain:
          - tag: WapA_signal_peptide
          - gene:
              id: cellulase
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
