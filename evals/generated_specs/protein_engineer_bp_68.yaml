construct:
  name: "pichia_ost1_glycoprotein_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: PTEF1
    - cistron:
        label: target_glycoprotein
        expression: high
        chain:
          - tag: Ost1
          - gene:
              id: glycoprotein_target
              source: uniprot
          - tag: Strep-II
    - terminator: CYC1