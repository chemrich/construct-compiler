construct:
  name: "Bacillus_protease_secretion_optimized"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: protease
        expression: high
        chain:
          - tag: signal_peptide_SacB
          - cleavage_site: 3C
          - gene:
              id: subtilisin
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
