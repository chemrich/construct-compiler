```yaml
construct:
  name: "CotG_nanobody_spore_display"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cotG

    - cistron:
        label: spore_display
        expression: medium
        chain:
          - gene:
              id: CotG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P0DTC2  # SARS-CoV-2 spike RBD nanobody target as example
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
```