construct:
  name: bacillus_spore_display_nanobody
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: cotG

    - cistron:
        label: spore_display
        expression: high
        chain:
          - gene:
              id: cotG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: nanobody
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
