construct:
  name: "Pichia_pastoris_heterodimer_bicistronic"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_A
              source: uniprot
              codon_optimization: pichia_pastoris

    - spacer: 50

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: alpha_factor
          - gene:
              id: subunit_B
              source: uniprot
              codon_optimization: pichia_pastoris

    - terminator: AOX1_terminator
