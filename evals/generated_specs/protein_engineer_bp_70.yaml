construct:
  name: "pPIC_AOX1_Heterodimer_Secretion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: subunit_A
              source: uniprot
    - terminator: AOX1_term
    - promoter: AOX1
    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: subunit_B
              source: uniprot
    - terminator: AOX1_term