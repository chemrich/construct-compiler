construct:
  name: "Bacillus_polycistronic_AmyE_operon"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: protein_1
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: protein_1
              source: uniprot

    - spacer: 50

    - cistron:
        label: protein_2
        expression: high
        fused: false
        chain:
          - secretion_signal: AmyE
          - gene:
              id: protein_2
              source: uniprot

    - terminator: rrnB_T1
