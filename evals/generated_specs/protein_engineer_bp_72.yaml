construct:
  name: "Pichia_HSA_fusion_secreted"
  host: pichia
  
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: PAOX1
    
    - cistron:
        label: HSA_fusion_target
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - solubility_tag: HSA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_peptide
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1
