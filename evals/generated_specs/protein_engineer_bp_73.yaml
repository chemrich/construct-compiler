construct:
  name: "bacillus_isomerase_gst_thrombin"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pxyl

    - cistron:
        label: isomerase
        expression: high
        chain:
          - tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: isomerase
              source: uniprot
              codon_optimization: bacillus_subtilis

    - terminator: rrnB_T1
