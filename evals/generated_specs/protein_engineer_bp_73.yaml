construct:
  name: "isomerase_bacillus_gst_thrombin"
  host: bacillus
  backbone:
    resistance: kanamycin
    ori: pUB110
    source: addgene
  cassette:
    - promoter: Pxyl
    - cistron:
        label: target_isomerase
        expression: medium  # Medium expression used to facilitate correct folding of difficult proteins
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: isomerase  # Placeholder: specific UniProt ID should be provided for the isomerase
              source: uniprot
    - terminator: BBa_B0015