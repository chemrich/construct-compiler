construct:
  name: Pichia_xylanase_secretion_PGAP
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: PGAP

    - cistron:
        label: xylanase
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: xylanase
              source: uniprot
          - tag: 10xHis

    - terminator: rrnB_T1
