construct:
  name: "Pichia_cutinase_PAOX1_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: ARS
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: cutinase
        expression: high
        chain:
          - secretion_signal: alpha-factor
          - gene:
              id: cutinase
              source: uniprot
          - cleavage_site: TEV
          - tag: Myc

    - terminator: rrnB_T1
