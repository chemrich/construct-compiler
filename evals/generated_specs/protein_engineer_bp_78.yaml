construct:
  name: Pichia_interferon_secretion_system
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PAOX1

    - cistron:
        label: interferon
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: IFN_alpha
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3

    - terminator: CYC1
