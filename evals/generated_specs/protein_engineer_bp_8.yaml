    - cistron:
        label: secreted_nanobody
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: nanobody  # User needs to specify actual nanobody sequence
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
