construct:
  name: "Pichia_pastoris_nanobody_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: nanobody_secreted
        expression: high
        chain:
          - signal_peptide: Ost1
          - gene:
              id: nanobody
              source: uniprot
          - tag: 6xHis

    - terminator: AOX1_terminator
