construct:
  name: "Pichia_pastoris_lipase_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZ"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: lipase_codon_optimized
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
