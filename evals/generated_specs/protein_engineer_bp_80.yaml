construct:
  name: "AOX1_Lipase_Secretion_Pichia"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: AOX1
      cistron:
        label: secreted_lipase
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: lipase
          - tag: 6xHis
      terminator: AOX1_TT