construct:
  name: "bacillus_amylase_secretion_cassette"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: amylase_secreted
        expression: high
        chain:
          - secretion_signal: AmyE
          - gene:
              id: amyE
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
