construct:
  name: "bacillus_protease_chaperone_operon"
  host: bacillus

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac

    - cistron:
        label: protease
        expression: high
        chain:
          - secretion_signal: AprE
          - gene:
              id: protease
              source: uniprot

    - cistron:
        label: chaperone
        expression: high
        fused: false
        gene:
          id: PrsA
          source: uniprot

    - terminator: rrnB_T1
