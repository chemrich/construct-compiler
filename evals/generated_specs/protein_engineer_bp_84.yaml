construct:
  name: pichia_surface_display_nanobody
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: surface_display
        expression: high
        chain:
          - secretion_tag: alpha_factor_prepro
          - gene:
              id: nanobody
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Aga2p
              source: uniprot
          - tag: c_Myc

    - terminator: rrnB_T1
