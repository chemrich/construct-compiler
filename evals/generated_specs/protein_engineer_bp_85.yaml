construct:
  name: "amyE_integration_PxylA_MBP_TEV_enzyme"
  host: bacillus
  backbone:
    # Homology arms for amyE locus integration are included in the vector flanks
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PxylA
    - cistron:
        label: metabolic_enzyme
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: target_enzyme
              source: uniprot
    - terminator: BBa_B0015