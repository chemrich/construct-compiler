construct:
  name: "bacillus_amyE_metabolic_integration"
  host: bacillus

  backbone:
    resistance: chloramphenicol
    ori: pUC
    source: addgene

  cassette:
    - homology_arm:
        label: amyE_front
        length: 1000
        target_locus: amyE

    - promoter: PxylA

    - rbs: RBS_canonical

    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: CDS_metabolic_enzyme
              source: uniprot

    - homology_arm:
        label: amyE_back
        length: 1000
        target_locus: amyE

    - terminator: rrnB_T1
