construct:
  name: "monoclonal_antibody_pichia_dual_cassette"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: AOX1
    - cistron:
        label: antibody_light_chain
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: mAb_Light_Chain
              source: uniprot
    - terminator: CYC1
    - promoter: AOX1
    - cistron:
        label: antibody_heavy_chain
        expression: high
        chain:
          - tag: alpha-factor
          - gene:
              id: mAb_Heavy_Chain
              source: uniprot
    - terminator: AOX1