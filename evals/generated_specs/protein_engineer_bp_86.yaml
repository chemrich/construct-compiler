construct:
  name: "Pichia_mAb_Light_Heavy_Chain"
  host: pichia_pastoris

  backbone:
    catalog_vector: "pPIC9K"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: light_chain
        expression: high
        chain:
          - signal_peptide: alpha-factor
          - gene:
              id: antibody_light_chain
              source: uniprot

    - terminator: CYC1

  cassette_2:
    - promoter: AOX1

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - signal_peptide: alpha-factor
          - gene:
              id: antibody_heavy_chain
              source: uniprot

    - terminator: AOX1
