construct:
  name: "pichia_phytase_fld1_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: FLD1
    - cistron:
        label: target_phytase
        expression: high
        chain:
          - tag: alpha_factor
          - cleavage_site: Enterokinase
          - gene:
              id: P11077
              source: uniprot
          - tag: FLAG
    - terminator: AOX1