construct:
  name: "Pichia_FLD1_phytase_FLAG"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: FLD1

    - cistron:
        label: phytase
        expression: high
        chain:
          - tag: alpha_factor_signal
          - cleavage_site: Enterokinase
          - gene:
              id: phytase
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
