construct:
  name: "B_subtilis_3enzyme_pathway"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: P43

    - cistron:
        label: enzyme_A
        expression: high
        rbs: RBS_optimized_Bsubtilis_v1
        chain:
          - gene:
              id: GeneA
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        rbs: RBS_optimized_Bsubtilis_v2
        chain:
          - gene:
              id: GeneB
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_C
        expression: high
        fused: false
        rbs: RBS_optimized_Bsubtilis_v3
        chain:
          - gene:
              id: GeneC
              source: uniprot

    - terminator: rrnB_T1
