construct:
  name: "pichia_cellulase_secretion_monitor"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: cellulase_reporter
        expression: high
        chain:
          - tag: signal_peptide_Ost1
          - gene:
              id: cellulase
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: eGFP
              source: fpbase
          - tag: Twin-Strep

    - terminator: rrnB_T1
