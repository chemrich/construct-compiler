construct:
  name: "Pichia_scFv_Zeocin_expression"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: zeocin_resistance
        expression: high
        gene:
          id: ZeoR
          source: uniprot

    - terminator: EM7

    - spacer: 40

    - promoter: GAP

    - cistron:
        label: target_scFv
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: scFv
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
