construct:
  name: "pichia_scfv_expression_with_zeo_marker"
  host: yeast
  backbone:
    resistance: zeocin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: zeo_resistance
        gene:
          id: ZeoR
    - terminator: EM7  # User requested EM7 as terminator; note EM7 is typically a bacterial promoter
    - promoter: GAP
    - cistron:
        label: scfv_target
        chain:
          - tag: alpha-factor
          - gene:
              id: scFv
          - tag: HA
    - terminator: AOX1