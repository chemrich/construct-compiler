construct:
  name: "bacillus_keratinase_autoinduction"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: constitutive
      # lacI repressor cassette for tight control
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: Pspac
      # IPTG-inducible Pspac promoter for keratinase expression

    - cistron:
        label: keratinase
        expression: high
        chain:
          - signal_peptide: NprE
          - gene:
              id: NprE
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
