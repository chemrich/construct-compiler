construct:
  name: "Pichia_PDI_lipase_coexpression"
  host: yeast

  backbone:
    resistance: zeomycin
    ori: ARS
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: lipase_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: KEX2
          - secretion_signal: alpha_factor
          - gene:
              id: lipase
              source: uniprot

    - terminator: CYC1

  cassette_2:
    - promoter: GAP

    - cistron:
        label: PDI
        expression: medium
        gene:
          id: PDI
          source: uniprot

    - terminator: CYC1
