construct:
  name: "bacillus_xylanase_extracellular"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PamyQ

    - cistron:
        label: xylanase
        expression: high
        chain:
          - signal_peptide: AmyE  # Native B. subtilis secretion signal
          - gene:
              id: xynA
              source: uniprot  # B. subtilis xylanase (native CDS)
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
