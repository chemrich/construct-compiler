construct:
  name: "pichia_hsa_secretion_cassette"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: hsa_secreted
        expression: high
        chain:
          - solubility_tag: alpha_factor_prepro
          - cleavage_site: 3C
          - gene:
              id: P02768
              source: uniprot

    - terminator: AOX1
