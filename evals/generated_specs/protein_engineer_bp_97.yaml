construct:
  name: "Bacillus_licheniformis_esterase_Pgrac100_Trx"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pgrac100

    - rbs: RBS_B0034  # optimal RBS for Bacillus

    - cistron:
        label: esterase
        expression: high
        chain:
          - tag: Trx
          - cleavage_site: Thrombin
          - gene:
              id: esterase_BL
              source: uniprot

    - terminator: rrnB_T1
