construct:
  name: "Pichia_pastoris_thaumatin_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: pPIC9
    source: addgene

  cassette:
    - promoter: YPT1

    - cistron:
        label: thaumatin_secreted
        expression: medium
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: thaumatin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 8xHis

    - terminator: rrnB_T1
