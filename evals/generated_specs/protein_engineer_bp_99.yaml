construct:
  name: bacillus_groEL_groES_pullulanase
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: Pveg

    - cistron:
        label: groEL
        expression: high
        gene:
          id: groEL
          source: uniprot

    - spacer: 30

    - cistron:
        label: groES
        expression: high
        fused: false
        gene:
          id: groES
          source: uniprot

    - spacer: 30

    - cistron:
        label: pullulanase
        expression: high
        fused: false
        chain:
          - tag: AmyE_signal
          - gene:
              id: pullulanase
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
