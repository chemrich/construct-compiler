construct:
  name: NOT_gate_GFP_repressor
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - promoter: tetO
    
    - cistron:
        label: output_GFP
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
