```yaml
construct:
  name: NOT_gate_fluorescent_repressor
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: medium
        gene:
          id: P0451  # LacI repressor
          source: uniprot

    - spacer: 50

    - promoter: lacUV5  # repressible by LacI

    - cistron:
        label: output
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
```