construct:
  name: AND_gate_therapeutic_purification
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD
      # Input 1: arabinose-inducible promoter

    - cistron:
        label: transcriptional_regulator_1
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P_tet_repressor
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      # Input 2: IPTG-inducible promoter (orthogonal to araBAD)

    - cistron:
        label: transcriptional_regulator_2
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P_lux_activator
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      # Output promoter: requires both input signals
      # Regulated by the two transcriptional regulators above
      # This creates AND logic: araBAD input AND IPTG input → therapeutic protein

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VEGF
              source: uniprot

    - terminator: rrnB_T1
