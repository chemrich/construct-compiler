```yaml
construct:
  name: dual_input_AND_gate_therapeutic
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD  # Input 1: L-arabinose inducible

    - cistron:
        label: T7_polymerase
        expression: medium
        gene:
          id: P00573
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac  # Input 2: IPTG inducible, requires T7 polymerase from first cassette

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P01308  # Human insulin
              source: uniprot

    - terminator: T7term
