```yaml
construct:
  name: genetic_latch_circuit
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: latch_repressor
        expression: medium
        gene:
          id: P0440  # CI repressor
          source: uniprot

    - spacer: 25

    - cistron:
        label: set_activator
        expression: medium
        fused: false
        gene:
          id: P03023  # CAP-cAMP activator
          source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD  # SET input promoter

    - cistron:
        label: set_circuit
        expression: high
        gene:
          id: P0440  # CI repressor for self-reinforcement
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5  # RESET input promoter

    - cistron:
        label: reset_circuit
        expression: high
        gene:
          id: P06959  # Cro repressor to inhibit CI
          source: uniprot

    - terminator: rrnB_T1

    - promoter: tac  # Output promoter (repressed by CI when latch is OFF)

    - cistron:
        label: luminescent_output
        expression: high
        fused: false
        gene:
          id: mNeonGreen  # Luminescent reporter
          source: fpbase

    - terminator: rrnB_T1
```