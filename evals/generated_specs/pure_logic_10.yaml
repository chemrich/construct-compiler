construct:
  name: "bistable_genetic_latch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: repressor_tetR
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: luminescent_reporter
        expression: high
        fused: false
        gene:
          id: Q9GV45
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tetO
    - cistron:
        label: repressor_lacI
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: BBa_B0015