construct:
  name: "genetic_latch_bistable_switch"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pSC101"
    resistance: ampicillin
    ori: SC101
    source: addgene

  cassette:
    - promoter: araBAD
      label: "set_input"

    - cistron:
        label: "CI_repressor"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "CI"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 40

    - promoter: lacUV5
      label: "cro_locus"

    - cistron:
        label: "Cro_repressor"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "Cro"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 40

    - promoter: T7lac
      label: "reporter_locus"

    - cistron:
        label: "ON_state_reporter"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "mCherry"
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 40

    - promoter: araBAD
      label: "reset_input"

    - cistron:
        label: "FLP_recombinase"
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: "FLP"
              source: uniprot

    - terminator: rrnB_T1
