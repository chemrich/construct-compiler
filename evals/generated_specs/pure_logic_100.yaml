construct:
  name: "transcriptional_and_gate_split_t7"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: input_a_component
        expression: medium
        gene:
          id: T7RNAP_N
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5
    - cistron:
        label: input_b_component
        expression: medium
        gene:
          id: T7RNAP_C
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: output_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term