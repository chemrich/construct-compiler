construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: State1_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: State2_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: State1_reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: mGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: State2_reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: Set_input_sensor
        expression: low
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: Reset_input_sensor
        expression: low
        fused: false
        chain:
          - gene:
              id: rhamnose_operon_regulator
              source: uniprot

    - terminator: rrnB_T1
