construct:
  name: NOR_logic_gate
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_X
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_Y
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lexA
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_product
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
