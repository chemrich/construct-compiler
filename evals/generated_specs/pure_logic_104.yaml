construct:
  name: XOR_logic_gate
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: InputA_repressor
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: InputB_repressor
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 25
    
    - promoter: T7lac
    
    - cistron:
        label: ResultReporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
