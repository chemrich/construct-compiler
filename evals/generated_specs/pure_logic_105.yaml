construct:
  name: "sequential_counter_two_step"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: InputPulse1_sensor
        expression: high
        chain:
          - gene:
              id: LexA_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output1_latch
        expression: high
        chain:
          - gene:
              id: CI_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: InputPulse2_sensor
        expression: high
        chain:
          - gene:
              id: TetR_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output2_executor
        expression: high
        chain:
          - gene:
              id: cro_protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output1_reset
        expression: medium
        chain:
          - gene:
              id: Cre_recombinase
              source: uniprot

    - terminator: rrnB_T1
