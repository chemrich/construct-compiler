construct:
  name: "deadmans_switch_survival_circuit"
  host: mammalian
  
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: survival_signal_sensor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P99072
              source: uniprot
        notes: "Assumes SurvivalSignal is a growth factor receptor or JAK-STAT component"
    
    - spacer: 30
    
    - cistron:
        label: timer_protein
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: P04637
              source: uniprot
        notes: "p53 as molecular timer; phosphorylation/MDM2 interaction extends half-life under survival signal"
    
    - spacer: 30
    
    - cistron:
        label: caspase_death_trigger
        expression: very_low
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P42574
              source: uniprot
        notes: "Human Caspase-3 (CASP3); expressed at low basal level, activated when timer protein accumulates"
    
    - spacer: 30
    
    - cistron:
        label: apoptosis_effector
        expression: low
        chain:
          - gene:
              id: P55957
              source: uniprot
        notes: "BAX; directly triggered by activated Caspase-3 for mitochondrial outer membrane permeabilization"
    
    - terminator: rrnB_T1
