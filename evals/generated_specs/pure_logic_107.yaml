construct:
  name: "analog_rheostat_control_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # araBAD is selected to provide analog (rheostat) control in response to L-arabinose concentration
    - cistron:
        label: target
        expression: medium
        gene:
          id: TargetGene
    - terminator: rrnB_T1