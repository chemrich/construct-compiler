construct:
  name: "analog_control_TargetGene_rheostat"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: regulatory_protein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TargetGene
              source: uniprot

    - terminator: rrnB_T1
