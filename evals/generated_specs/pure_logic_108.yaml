construct:
  name: environmental_factor_sensor
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor
        expression: high
        chain:
          - gene:
              id: environmental_factor_sensor
              source: uniprot

    - spacer: 30

    - cistron:
        label: warning_signal
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
