construct:
  name: "environmental_factor_threshold_sensor"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD # araBAD is used as a representative inducible sensor for EnvironmentalFactor threshold detection
    - cistron:
        label: warning_signal
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1