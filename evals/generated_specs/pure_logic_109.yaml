construct:
  name: "quorum_sensing_density_triggered_secretion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106
    - cistron:
        label: sensor_luxR
        expression: medium
        gene:
          id: luxR
          source: uniprot
    - terminator: rrnB_T1
    - promoter: PluxI
    - cistron:
        label: synthase_luxI
        expression: high
        fused: false
        gene:
          id: luxI
          source: uniprot
    - spacer: 30
    - cistron:
        label: secreted_output
        expression: high
        fused: false
        chain:
          - tag: PelB
          - gene:
              id: OutputEffect
    - terminator: BBa_B0015