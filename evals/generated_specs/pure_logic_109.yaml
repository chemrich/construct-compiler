construct:
  name: quorum_sensing_high_density_secreted_peptide
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: luxR_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac

    - cistron:
        label: luxI_synthase
        expression: high
        chain:
          - gene:
              id: luxI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: luxPR

    - cistron:
        label: OutputEffect
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: OutputEffect
              source: uniprot

    - terminator: rrnB_T1
