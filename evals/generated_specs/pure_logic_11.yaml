```yaml
construct:
  name: inverter_with_secretion
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD  # Repressible by glucose, inducible by arabinose

    - cistron:
        label: repressor
        expression: high
        gene:
          id: lacI
          source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_hormone
        expression: medium
        fused: false
        chain:
          - tag: pelB  # E. coli secretion signal
          - gene:
              id: insulin
              source: uniprot

    - terminator: rrnB_T1
```