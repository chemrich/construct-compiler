construct:
  name: Inverter_with_Secretion
  host: mammalian

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: KRAB
              source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_hormone
        expression: medium
        chain:
          - tag: signal_peptide
          - gene:
              id: human_growth_hormone
              source: uniprot
          - tag: His6

    - terminator: rrnB_T1
