construct:
  name: blue_light_inducible_therapeutic
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YtvA
              source: uniprot

    - spacer: 30

    - cistron:
        label: therapeutic_protein
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TherapeuticProtein
              source: uniprot

    - terminator: rrnB_T1
