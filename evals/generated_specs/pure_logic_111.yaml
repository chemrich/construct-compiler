construct:
  name: "chloroplast_HighValueMetabolite_producer"
  host: algae

  backbone:
    resistance: spectinomycin
    ori: plastid_homologous_recombination
    source: synthetic

  cassette:
    - promoter: Prrn  # plastid ribosomal RNA promoter for high constitutive expression in chloroplasts

    - cistron:
        label: HighValueMetabolite
        expression: high
        chain:
          - tag: His6  # plant-compatible purification tag
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HighValueMetabolite
              source: uniprot

    - terminator: rrnB_T1  # plastid-optimized terminator
