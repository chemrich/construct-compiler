construct:
  name: "cell_free_pathogen_diagnostic_circuit"
  host: in_vitro

  backbone:
    resistance: null
    ori: null
    source: custom

  cassette:
    - promoter: T7

    - cistron:
        label: cascade_amplification
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Q5_RNA_dependent_RNA_polymerase
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7

    - cistron:
        label: signal_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

    - promoter: T7

    - cistron:
        label: regulatory_sensor
        expression: medium
        chain:
          - gene:
              id: twister_ribozyme_sensor
              source: custom

    - terminator: rrnB_T1
