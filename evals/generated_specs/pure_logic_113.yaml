construct:
  name: "bistable_memory_toggle_switch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PLtetO-1  # Repressed by TetR; derepressed by InputEvent (e.g., aTc)
    - cistron:
        label: state_repressor_lacI
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: MemoryOutput
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: Ptrc-1    # Repressed by LacI; derepressed by ClearSignal (e.g., IPTG)
    - cistron:
        label: state_repressor_tetR
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - terminator: BBa_B0015