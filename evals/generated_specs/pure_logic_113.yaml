construct:
  name: stable_memory_circuit_latch
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: set_repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: reset_recombinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Cre
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: memory_switch
        expression: medium
        chain:
          - gene:
              id: loxP_flanked_promoter
              source: addgene
    
    - spacer: 30
    
    - cistron:
        label: memory_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
