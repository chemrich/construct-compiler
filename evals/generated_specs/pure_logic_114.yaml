construct:
  name: "simple_not_gate_logic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive promoter to express the InputSignal repressor
    - cistron:
        label: "InputSignal"
        expression: medium
        gene:
          id: lacI
          source: uniprot
    - terminator: BBa_B0015
    - promoter: tac  # This promoter is repressed by LacI, creating the NOT gate logic
    - cistron:
        label: "OutputProtein"
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1