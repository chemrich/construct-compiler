construct:
  name: "NOT_gate_logic_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        gene:
          id: tetR
          source: uniprot

    - spacer: 30

    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: OutputProtein
              source: uniprot

    - terminator: rrnB_T1
