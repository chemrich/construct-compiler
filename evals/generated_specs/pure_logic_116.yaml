construct:
  name: "tristable_genetic_latch"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac # Input A: Induced by IPTG
    - cistron:
        label: state_A_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
    - promoter: araBAD # Input B: Induced by L-arabinose
    - cistron:
        label: state_B_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
    - promoter: T7lac # Input C: Induced by T7 Polymerase/IPTG
    - cistron:
        label: state_C_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term