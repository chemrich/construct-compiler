construct:
  name: "three_state_genetic_latch_ABC"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: StateA_latch_domain
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: StateB_latch_domain
        expression: high
        chain:
          - gene:
              id: LambdaCIrepressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: StateC_latch_domain
        expression: high
        chain:
          - gene:
              id: AraC
              source: uniprot

    - spacer: 25

    - cistron:
        label: ReporterA_GFP
        expression: medium
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: ReporterB_RFP
        expression: medium
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 25

    - cistron:
        label: ReporterC_YFP
        expression: medium
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

  # Design notes:
  # This construct encodes three repressor proteins (TetR, Lambda CI, AraC) that form mutually exclusive states.
  # Each state is associated with a unique fluorescent protein reporter (mEGFP, mScarlet, mNeonGreen).
  # InputA (tetracycline pulse) activates TetR, InputB (temperature shift or small molecule) activates CI,
  # InputC (arabinose pulse) activates AraC.
  # The logic integrates through a multi-state genetic switch where each input preferentially represses
  # the competing states while stabilizing its own reporter expression.
  # In practice, regulatory elements (promoter variants, RBS strengths, and operator sites) would be optimized
  # to achieve robust bistability and prevent state leakage.
