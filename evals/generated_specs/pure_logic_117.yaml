construct:
  name: feedback_regulated_ProductX_production
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProductX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProductX
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor
        expression: medium
        fused: false
        chain:
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: feedback_sensor
        expression: low
        fused: false
        chain:
          - gene:
              id: AraC
              source: uniprot

    - terminator: rrnB_T1
