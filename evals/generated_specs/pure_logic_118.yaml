construct:
  name: and_not_gate_secreted_enzyme
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Functions as an AND-NOT gate: requires T7 Polymerase (Activator) AND NOT LacI (Inhibitor)
    - cistron:
        label: OutputActivity
        expression: high
        chain:
          - tag: pelB  # Signal peptide for periplasmic enzyme secretion
          - gene:
              id: P00634  # Alkaline phosphatase (PhoA), a periplasmic enzyme
              source: uniprot
    - terminator: T7term