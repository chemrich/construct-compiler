construct:
  name: AND_NOT_gate_enzyme_output
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ActivatorInput
        expression: high
        chain:
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: InhibitorInput
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: OutputActivity
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MalE
              source: uniprot
        # MalE includes an N-terminal signal peptide for periplasmic secretion in E. coli

    - terminator: rrnB_T1
