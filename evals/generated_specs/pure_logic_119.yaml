construct:
  name: circadian_light_entrained_reporter
  host: mammalian
  
  backbone:
    catalog_vector: pTwist CMV
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: circadian_reporter
        expression: medium
        chain:
          - tag: degron_d2
          - gene:
              id: PER2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: light_sensor
        expression: medium
        fused: false
        chain:
          - gene:
              id: CRY1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA
    
    - spacer: 30
    
    - cistron:
        label: circadian_clock
        expression: low
        fused: false
        gene:
          id: BMAL1
          source: uniprot
    
    - terminator: rrnB_T1
