construct:
  name: AND_NOT_gate_fluorescent
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: LacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_B_repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: TetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_fluorescence
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
