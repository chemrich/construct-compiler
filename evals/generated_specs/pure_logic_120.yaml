construct:
  name: "digital_switch_chemical_input_detector"
  host: e_coli
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: sensor_input
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_reporter
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
