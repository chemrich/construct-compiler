construct:
  name: NOT_gate_genetic_logic
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output
        expression: high
        fused: false
        chain:
          - promoter: lacUV5
          - gene:
              id: mGFP
              source: fpbase

    - terminator: rrnB_T1
