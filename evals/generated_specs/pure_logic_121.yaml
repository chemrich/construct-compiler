construct:
  name: "genetic_not_gate_arabinose_lacI"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: repressor_lacI
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - spacer: 40
    - promoter: tac
    - cistron:
        label: reporter_output
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1