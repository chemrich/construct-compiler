construct:
  name: "genetic_or_gate_tandem"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Input A: Activated by L-arabinose
    - promoter: lacUV5  # Input B: Activated by IPTG. Tandem promoters provide OR logic.
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015