construct:
  name: OR_gate_genetic_circuit
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # Input A: araBAD promoter is activated by AraC + arabinose
    
    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - spacer: 25
    
    - promoter: T7lac
      # Input B: T7lac promoter is activated by T7 RNAP (induced by IPTG)
    
    - cistron:
        label: output_alternate
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
