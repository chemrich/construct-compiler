construct:
  name: "eukaryotic_bistable_toggle_switch"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: TRE

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: HA
          - gene:
              id: lacI
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: tetO_minimal

    - cistron:
        label: reporter_ON_state
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: lacO_minimal

    - cistron:
        label: reporter_OFF_state
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: SV40_polyA
