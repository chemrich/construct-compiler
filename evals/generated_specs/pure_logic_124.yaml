construct:
  name: "eukaryotic_bistable_toggle_switch_HEK293"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE_Tight
    - cistron:
        label: state_1_repressor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: "P03023"
              source: uniprot
    - spacer: 30
    - cistron:
        label: state_1_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_PA
    - promoter: LacO_CMV
    - cistron:
        label: state_2_repressor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: "P04483"
              source: uniprot
    - spacer: 30
    - cistron:
        label: state_2_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_PA