construct:
  name: "tunable_yeast_oscillator"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: GAL10

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TetO

    - cistron:
        label: output_fluorescent
        expression: medium
        chain:
          - gene:
              id: mCitrine
              source: fpbase

    - terminator: rrnB_T1

    - promoter: LacO

    - cistron:
        label: output_secondary
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
