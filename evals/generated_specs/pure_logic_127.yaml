construct:
  name: "threshold_detector_molecular_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: sensor_kinase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnvZ
              source: uniprot
        # EnvZ detects osmotic pressure; can be engineered for small molecule sensing

    - spacer: 25

    - cistron:
        label: response_regulator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: OmpR
              source: uniprot
        # OmpR is phosphorylated by EnvZ; acts as transcriptional switch

    - spacer: 25

    - cistron:
        label: output_protein
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mNeonGreen
              source: fpbase
        # Output is driven by OmpR-controlled promoter (P_ompC or engineered variant)
        # Sharp ON/OFF transition occurs at threshold phosphorylation level

    - terminator: rrnB_T1
