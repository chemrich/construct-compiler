construct:
  name: "signal_amplifier_cascade"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: amplifier_kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CheY
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: very_high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
