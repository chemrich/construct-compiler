construct:
  name: conditional_crispr_cas9_mammalian_editor
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: doxycycline_controlled_cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA
        # Note: This Cas9 should be fused to a doxycycline-responsive degron or conditional domain
        # In practice, implement rtTA (reverse tTA) system or conditional protein degradation tag

    - spacer: 25

    - cistron:
        label: gfp_reporter
        expression: medium
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: inducible_guide_rna
        expression: high
        fused: false
        # Note: sgRNA targeting specific genomic locus; expression controlled by inducible U6 or H1 promoter
        # This is a structural RNA, not a protein

    - terminator: rrnB_T1
