construct:
  name: "ecoli_adjustable_delay_cascade"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: delay_element
        expression: low  # Low expression creates a longer accumulation time for the intermediate, increasing the delay
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: delayed_output
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term