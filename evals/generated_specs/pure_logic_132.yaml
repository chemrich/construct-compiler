construct:
  name: "adjustable_time_delay_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: delay_controller
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: integrase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: phiC31_integrase
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: output_repressor
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: output_reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
