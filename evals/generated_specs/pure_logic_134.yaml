construct:
  name: "mercury_ion_sensor"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: PmerT  # Mercury-responsive promoter induced in the presence of Hg(II) and MerR
    - cistron:
        label: fluorescent_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1