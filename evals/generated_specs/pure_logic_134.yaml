construct:
  name: heavy_metal_sensor_ecoli
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: metal_sensing_transcription_factor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P_ZntA
              source: uniprot
              description: zinc-responsive transcriptional regulator

    - spacer: 30

    - cistron:
        label: fluorescent_output
        expression: high
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1
