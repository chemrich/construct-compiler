construct:
  name: XOR_logic_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - gene:
              id: rhamnose_operon_regulator
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: XOR_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
