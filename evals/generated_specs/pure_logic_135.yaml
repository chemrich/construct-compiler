construct:
  name: "genetic_xor_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    # This XOR gate uses a dual-branch design where each branch represents (Input AND NOT Other_Input).
    # Branch 1: Inducible by Arabinose (Input A), but repressed by high IPTG (Input B) via a hybrid araBAD-lacO promoter.
    - promoter: araBAD_lacO
    - cistron:
        label: branch_a_high_b_low
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1

    # Branch 2: Inducible by IPTG (Input B), but repressed by Arabinose (Input A) via a hybrid lacUV5-araO promoter.
    - promoter: lacUV5_araO
    - cistron:
        label: branch_b_high_a_low
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015