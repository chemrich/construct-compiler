construct:
  name: "genetic_toggle_memory_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: LacI_repressor
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: TetR_repressor
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Cre_recombinase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cre
              source: uniprot

    - spacer: 25

    - cistron:
        label: memory_output_ON_state
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: Flp_recombinase_RESET
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: flp
              source: uniprot

    - terminator: rrnB_T1
