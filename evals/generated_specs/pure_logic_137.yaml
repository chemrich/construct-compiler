construct:
  name: "NOT_gate_cascade_three_stage"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: NOT_gate_1_TetR_repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: NOT_gate_2_LacI_repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: NOT_gate_3_output_mScarlet
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
