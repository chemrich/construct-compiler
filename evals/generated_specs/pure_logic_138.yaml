construct:
  name: "mammalian_graded_response_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: dCas9
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: U6

    - cistron:
        label: guide_rna_low
        expression: high
        chain:
          - gene:
              id: gRNA_weak_promoter
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: output_low
        expression: low
        chain:
          - tag: HA
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: output_medium
        expression: medium
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: output_high
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
