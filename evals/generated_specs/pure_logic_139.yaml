construct:
  name: "negative_feedback_homeostatic_loop"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_protein
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: reporter_monitor
        expression: low
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
