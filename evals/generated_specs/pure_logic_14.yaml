```yaml
construct:
  name: programmable_amplifier_system
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac  # Weak input signal - IPTG inducible

    - cistron:
        label: amplifier_module
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P0A9B2  # LacI repressor
              source: uniprot

    - spacer: 30

    - cistron:
        label: gain_controller
        expression: low
        fused: false
        gene:
          id: P03023  # CAT (chloramphenicol acetyltransferase) - third input control
          source: uniprot

    - spacer: 30

    - cistron:
        label: output_reporter
        expression: high
        fused: false
        chain:
          - tag: 8xHis  # For purification
          - cleavage_site: TEV
          - gene:
              id: mEGFP  # Strong amplified output signal
              source: fpbase

    - terminator: rrnB_T1
```