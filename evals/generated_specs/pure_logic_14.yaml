construct:
  name: "programmable_amplifier_circuit"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # Input 1: Weak signal (Arabinose)
    - cistron:
        label: amplifier_core
        expression: medium
        gene:
          id: P00573  # T7 RNA Polymerase
          source: uniprot
    - terminator: rrnB_T1

    - promoter: tac     # Input 2: Gain Tuner (IPTG)
    - cistron:
        label: gain_controller
        expression: medium
        gene:
          id: P00648  # T7 Lysozyme (Inhibits T7 RNAP to tune gain)
          source: uniprot
    - terminator: rrnB_T1

    - promoter: T7      # Amplified Output Stage
    - cistron:
        label: amplified_reporter
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term