construct:
  name: "NOT_gate_signal_A_repressed"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD is repressed by AraC in absence of arabinose (signal A)
      # When arabinose (signal A) is absent, AraC represses this promoter
      # When arabinose is present, AraC activates it - so we need constitutive + repressible setup
      
    - cistron:
        label: signal_sensor
        expression: high
        gene:
          id: araC
          source: uniprot
          # AraC protein acts as repressor of araBAD when arabinose absent
    
    - spacer: 30
    
    - promoter: lacUV5
      # Constitutive-ish promoter for output X, but modulated by signal A system
    
    - cistron:
        label: output_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase
    
    - terminator: rrnB_T1
