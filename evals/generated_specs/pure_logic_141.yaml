construct:
  name: "AND_gate_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_Y
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
