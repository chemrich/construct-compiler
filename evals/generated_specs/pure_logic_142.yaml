construct:
  name: "OR_gate_genetic_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_A
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_B
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
