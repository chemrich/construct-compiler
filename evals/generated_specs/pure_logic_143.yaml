construct:
  name: "genetic_xor_gate_mcherry"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # Signal A: Arabinose induced
    - cistron:
        label: "path_a_output"
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    - spacer: 30
    - cistron:
        label: "path_b_inhibitor"
        expression: medium
        fused: false
        gene:
          id: lacI
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Signal B: IPTG induced; repressed by LacI from Path A
    - cistron:
        label: "path_b_output"
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    - spacer: 30
    - cistron:
        label: "path_a_inhibitor"
        expression: medium
        fused: false
        gene:
          id: araC  # AraC acts as a repressor in the absence of arabinose or at specific operator sites
          source: uniprot
    - terminator: T7term