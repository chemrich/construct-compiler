construct:
  name: XOR_gate_genetic_circuit
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: NOT_A
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: NOT_B
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: AND_gate_controller
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: XOR_output_W
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
