construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD is inducible by L-arabinose (Inducer1)
    
    - cistron:
        label: Repressor1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              # tetR represses PRtet promoter; repressed by tetracycline/doxycycline (Inducer2)
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: PRtet
      # PRtet (tetracycline repressor promoter) is repressed by TetR/Inducer2
    
    - cistron:
        label: Repressor2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              # araC is the arabinose repressor; repressed by arabinose (Inducer1)
              source: uniprot
    
    - terminator: rrnB_T1
