construct:
  name: genetic_pulse_generator
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: stimulus_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: pulse_generator_repressor
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output_protein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: transient_degradation_tag
        expression: high
        chain:
          - gene:
              id: ssrA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: feedback_inhibitor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - terminator: rrnB_T1
