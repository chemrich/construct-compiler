construct:
  name: "cascading_amplifier_three_stage"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Stage 1: Weak input signal A induces low-level Activator1

    - cistron:
        label: Activator1
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
      # Stage 2: Activator1 induces medium-level Activator2

    - cistron:
        label: Activator2
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      # Stage 3: Activator2 induces high-level Output signal

    - cistron:
        label: Output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
