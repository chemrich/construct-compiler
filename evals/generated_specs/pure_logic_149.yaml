construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Repressed by LacI; induced by Signal 1 (IPTG)
    - cistron:
        label: state_1_repressor
        gene:
          id: tetR
          source: uniprot
    - spacer: 30
    - cistron:
        label: state_1_output
        expression: high
        fused: false
        gene:
          id: GeneX
          source: uniprot
    - terminator: rrnB_T1
    - promoter: Ptet # Repressed by TetR; induced by Signal 2 (aTc)
    - cistron:
        label: state_0_repressor
        gene:
          id: lacI
          source: uniprot
    - terminator: BBa_B0015