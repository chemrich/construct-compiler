construct:
  name: yeast_cell_fate_decision_switch
  host: yeast

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: GAL1
      label: input_A_driven
    
    - cistron:
        label: TF1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: GAL10
      label: input_B_driven

    - cistron:
        label: TF2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GCN4
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: GAL4_UAS
      label: fate_output_1

    - cistron:
        label: metabolic_regulator_1
        expression: medium
        chain:
          - gene:
              id: HXK2
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: GCN4_RE
      label: fate_output_2

    - cistron:
        label: metabolic_regulator_2
        expression: medium
        chain:
          - gene:
              id: ADH1
              source: uniprot

    - terminator: rrnB_T1
