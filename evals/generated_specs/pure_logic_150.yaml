construct:
  name: genetic_latch_memory_element
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: set_input
    
    - cistron:
        label: LacI_repressor
        expression: high
        gene:
          id: lacI
          source: uniprot
    
    - spacer: 30
    
    - promoter: lacUV5
      label: output_promoter
    
    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - spacer: 30
    
    - promoter: araBAD
      label: reset_input
    
    - cistron:
        label: TetR_repressor
        expression: high
        gene:
          id: tetR
          source: uniprot
    
    - spacer: 30
    
    - promoter: tetO
      label: laci_maintenance
    
    - cistron:
        label: LacI_maintenance
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
