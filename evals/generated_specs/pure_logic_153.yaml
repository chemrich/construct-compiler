construct:
  name: "proteink_negative_feedback_loop"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5 # Negative feedback: ProteinK is designed to bind the operator in this promoter to repress its own transcription
    - cistron:
        label: ProteinK_expression
        expression: medium
        gene:
          id: ProteinK
    - terminator: rrnB_T1