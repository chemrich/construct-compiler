construct:
  name: "genetic_binary_counter_toggle"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: input_sensor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: toggle_switch_ON_state
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
