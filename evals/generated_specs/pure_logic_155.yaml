construct:
  name: "genetic_edge_detector"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: delay_protein
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: repressor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: edge_detector_logic
        expression: high
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase
    
    - terminator: rrnB_T1
