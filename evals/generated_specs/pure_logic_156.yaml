construct:
  name: weighted_sum_detector_analog_output
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: InputA_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR_variant
              source: uniprot
        # LuxR homolog for first weighted input

    - spacer: 30

    - cistron:
        label: InputB_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR_variant
              source: uniprot
        # TetR homolog for second weighted input

    - spacer: 30

    - cistron:
        label: InputC_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AraC_variant
              source: uniprot
        # AraC homolog for inhibitory third input

    - spacer: 30

    - cistron:
        label: FinalProduct
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
        # Fluorescent output scaled by integrated regulatory logic; expression modulated by weighted combination of upstream regulators

    - terminator: rrnB_T1
