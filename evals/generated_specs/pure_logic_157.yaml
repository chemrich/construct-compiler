construct:
  name: three_stage_genetic_inverter
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: Input_I
        expression: high
        gene:
          id: tetR
          source: uniprot

    - spacer: 30

    - cistron:
        label: Gene1
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gene2
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output
        expression: high
        chain:
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
