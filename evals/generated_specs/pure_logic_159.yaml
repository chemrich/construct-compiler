construct:
  name: "redundant_error_correction_EssentialEnzyme"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    # Pathway 1: Primary production route with native regulation
    - promoter: T7lac
      label: "Pathway1_control"

    - cistron:
        label: Pathway1_EssentialEnzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EssentialEnzyme
              source: uniprot

    - terminator: rrnB_T1

    # Spacer between pathways
    - spacer: 35

    # Pathway 2: Backup production route with inducible upregulation
    - promoter: araBAD
      label: "Pathway2_inducible"

    - cistron:
        label: Pathway2_EssentialEnzyme
        expression: high
        chain:
          - tag: 8xHis
          - gene:
              id: EssentialEnzyme
              source: uniprot

    - terminator: rrnB_T1

    # Spacer before failure sensor
    - spacer: 35

    # Failure Sensor: Detects pathway collapse and triggers arabinose-based upregulation
    - promoter: lacUV5
      label: "FailureSensor_promoter"

    - cistron:
        label: FailureSensor_AraC_regulator
        expression: medium
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    # Spacer before output
    - spacer: 30

    # Reporter/Validation: GFP output correlates with EssentialEnzyme production
    - promoter: T7
      label: "validation_reporter"

    - cistron:
        label: production_validator
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: BBa_B0015
