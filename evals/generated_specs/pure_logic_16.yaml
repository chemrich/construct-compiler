```yaml
construct:
  name: protease_actuated_gate
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gated_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - solubility_tag: MBP  # Acts as inhibitory domain - blocks activity until cleaved
    - spacer: 30
    - cistron:
        label: protease
        expression: medium
        fused: false
        gene:
            id: P1A02_TOBAC  # TEV protease
            source: uniprot
    - terminator: rrnB_T1
