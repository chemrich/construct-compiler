construct:
  name: Protease_Actuated_Gate
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: inactive_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: protease
        expression: medium
        fused: false
        chain:
          - gene:
              id: TEV_protease
              source: uniprot

    - terminator: rrnB_T1
