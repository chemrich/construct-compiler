construct:
  name: genetic_AND_gate_dual_input
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: regulator_A
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: regulator_B
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      # AND gate logic: P_A (lactose) represses lacI; P_B (arabinose) activates araC
      # Both must be present: araC protein (from P_B) + absence of lacI repression (from P_A)

    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
