construct:
  name: "mammalian_NOT_gate"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: KRAB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ZBTB10
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
