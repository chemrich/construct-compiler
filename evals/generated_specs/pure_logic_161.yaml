construct:
  name: "mammalian_not_gate_nuclear_egfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha  # Represents the 'P_NOT' input signal promoter
    - cistron:
        label: repressor_input
        expression: high
        gene:
          id: TetR
          source: uniprot
    - terminator: SV40_PA
    - promoter: CMV_TetO  # Tet-repressible promoter for NOT gate logic
    - cistron:
        label: reporter_output
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_PA