construct:
  name: "genetic_bistable_switch_dual_output"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: CI_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot

    - spacer: 25

    - cistron:
        label: Cro_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Cro
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output_A
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: Output_B
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: dual_input_sensor
        expression: medium
        chain:
          - gene:
              id: araBAD_sensing_domain
              source: uniprot

    - terminator: rrnB_T1
