construct:
  name: "two_layer_logic_AND_OR_gate"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: AND_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: I1_I2_AND_gate
              source: uniprot
              # Logical AND: both I1 and I2 required for activation

    - spacer: 25

    - cistron:
        label: OR_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: I3_OR_gate
              source: uniprot
              # Logical OR: activated by AND output or I3

    - spacer: 25

    - cistron:
        label: enzyme_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: horseradish_peroxidase
              source: uniprot

    - terminator: rrnB_T1
