construct:
  name: "secreted_therapeutic_repressilator"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: LacI_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: TetR_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: tetO

    - cistron:
        label: CI_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: pRM

    - cistron:
        label: therapeutic_peptide
        expression: medium
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: GLP1R_agonist
              source: uniprot

    - terminator: rrnB_T1
