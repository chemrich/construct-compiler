construct:
  name: delayed_ON_switch_circuit
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: integrase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: phiC31_integrase
              source: uniprot

    - spacer: 25

    - cistron:
        label: timer_protein
        expression: medium
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - degradation_tag: ssrA_LAA
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: output_response_regulator
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: signal_sensor
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1
