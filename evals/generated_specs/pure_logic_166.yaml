construct:
  name: "delayed_on_switch_timer"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: timing_activator
        expression: high
        chain:
          - gene:
              id: P00573
              source: uniprot
          - tag: SsrA
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: delayed_output
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term