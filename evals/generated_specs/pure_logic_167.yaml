construct:
  name: "pH_and_ligand_responsive_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: VEGF165
              source: uniprot

    - spacer: 30

    - cistron:
        label: pH_responsive_domain
        expression: medium
        fused: false
        chain:
          - gene:
              id: pHluorin
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: 3C

    - spacer: 30

    - cistron:
        label: ligand_binding_domain
        expression: medium
        fused: false
        chain:
          - gene:
              id: MBP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: Factor_Xa

    - terminator: rrnB_T1
