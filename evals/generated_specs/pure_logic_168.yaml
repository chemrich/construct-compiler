construct:
  name: mammalian_majority_vote_circuit
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: Synthetic_Majority_Logic_P # Logic: Output ON if at least 2 of 3 inputs (I1, I2, I3) are present
    - cistron:
        label: O_MAJORITY
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BGH_polyA