construct:
  name: "yeast_sensitive_not_gate_membrane_output"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene

  cassette:
    # First transcriptional unit: Input promoter driving the repressor
    - promoter: P_REPRESS  # The user-specified input promoter
    - cistron:
        label: gate_repressor
        expression: high
        gene:
          id: TetR
          source: uniprot
    - terminator: ADH1_term

    - spacer: 50

    # Second transcriptional unit: Highly sensitive repressible promoter driving the membrane-anchored output
    - promoter: TetO7_CYC1  # Highly sensitive repressible promoter (repressed by TetR)
    - cistron:
        label: membrane_anchored_output
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: CAAX  # C-terminal prenylation signal for membrane anchoring in yeast
    - terminator: CYC1_term