construct:
  name: "yeast_NOT_gate_repressible"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Fen1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: TM_anchor_Saccharomyces_cerevisiae
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: MIG1
              source: uniprot

    - terminator: rrnB_T1
