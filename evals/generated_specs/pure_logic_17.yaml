```yaml
construct:
  name: frequency_divider_circuit
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: toggle_switch_repressor_A
        expression: medium
        gene:
          id: P0140  # LacI repressor
          source: uniprot

    - spacer: 30

    - cistron:
        label: toggle_switch_repressor_B
        expression: medium
        gene:
          id: P03023  # CI repressor (lambda)
          source: uniprot

    - spacer: 30

    - cistron:
        label: fluorescent_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
```