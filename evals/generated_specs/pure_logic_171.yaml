construct:
  name: "A_B_comparator_antibody_output"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: comparator_sensor
        expression: high
        chain:
          - gene:
              id: "intein_split_TF_A_sensor"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "dCas9_VP64"
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_response_unit
        expression: high
        fused: false
        chain:
          - gene:
              id: "TetR_degron"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "intein_split_TF_B_repressor"
              source: uniprot

    - spacer: 30

    - cistron:
        label: antibody_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: "scFv_human"
              source: uniprot

    - terminator: rrnB_T1
