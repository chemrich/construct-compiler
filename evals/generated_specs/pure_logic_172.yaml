construct:
  name: "genetic_memory_toggle_switch"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Substituted for a TetR-repressible promoter (SET arm) to fulfill the toggle logic within allowed schema options
    - cistron:
        label: repressor_lacI
        expression: high
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: growth_factor_output
        expression: high
        fused: false # Independent translation for second protein in the SET operon
        chain:
          - tag: PelB # Secretion signal for E. coli
          - gene:
              id: P01133 # Human Epidermal Growth Factor (hEGF)
              source: uniprot
    - spacer: 50
    - promoter: lacUV5 # RESET arm (LacI-repressible)
    - cistron:
        label: repressor_tetR
        expression: high
        gene:
          id: P04483
          source: uniprot
    - terminator: rrnB_T1