construct:
  name: genetic_memory_SR_latch
  host: mammalian
  
  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: SET_input_responsive
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - spacer: 30

    - cistron:
        label: memory_latch_output
        expression: high
        chain:
          - tag: signal_peptide_IgK
          - gene:
              id: VEGF_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: RESET_repressor
        expression: medium
        chain:
          - gene:
              id: Gal4_DBD_fusion
              source: uniprot

    - terminator: SV40_poly_A

  # Design notes:
  # - This uses a doxycycline-inducible system (rtTA acts as SET signal responder)
  # - VEGF_A with IgK signal peptide provides secreted growth factor output
  # - Gal4_DBD fusion acts as RESET repressor to silence memory circuit
  # - Once SET (dox added), rtTA activates VEGF output which is maintained via positive feedback
  # - RESET input (removal of dox or addition of repressor ligand) silences the circuit
  # - For true genetic bistability, implement with synthetic promoters containing both TRE (for rtTA) and GAL4 binding sites in cis-regulatory elements (not fully captured here but implied by construct purpose)
