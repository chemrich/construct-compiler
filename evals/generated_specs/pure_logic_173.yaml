construct:
  name: yeast_multiplexer_switch
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1
      description: "Inducible by galactose; represents control input C (ON state)"

    - cistron:
        label: Output_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1

    - promoter: GAL10
      description: "Repressed when GAL1 is active; represents control input C (OFF state)"

    - cistron:
        label: Output_Y
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
