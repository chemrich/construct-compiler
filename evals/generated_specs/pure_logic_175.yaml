construct:
  name: "multi_level_threshold_detector"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: sensor_protein
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: threshold1_detector
        expression: medium
        chain:
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: threshold2_detector
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: high_output
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: rrnB_T1
