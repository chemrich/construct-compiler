construct:
  name: "positive_feedback_amplifier_GH"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: signal_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: rtTA3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP16
              source: uniprot

    - spacer: 25

    - cistron:
        label: growth_hormone_secreted
        expression: high
        fused: false
        chain:
          - tag: SP_KDEL
          - gene:
              id: GH
              source: uniprot

    - spacer: 25

    - cistron:
        label: feedback_response
        expression: medium
        fused: false
        chain:
          - gene:
              id: rtTA3
              source: uniprot

    - terminator: rrnB_T1
