construct:
  name: logic_multiplier_analog_concentrations
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: multiplier_output
        expression: high
        chain:
          - tag: signal_peptide  # secretion signal for mammalian cells
          - gene:
              id: P01375  # human TNF-alpha as secreted signaling molecule
              source: uniprot

    - terminator: rrnB_T1