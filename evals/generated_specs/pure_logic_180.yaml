construct:
  name: "genetic_AND_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is repressed by AraC; activated only when L-arabinose is present
      # This serves as Input_A sensor

    - cistron:
        label: AraC_repressor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    # Second cassette for Input_B sensing
    - promoter: T7lac
      # T7lac is repressed by LacI; activated when lactose/IPTG is present
      # This serves as Input_B sensor

    - cistron:
        label: LacI_repressor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    # Third cassette: AND gate logic - Reporter only expressed when BOTH signals present
    # Uses a hybrid promoter responsive to both AraC-arabinose AND TetR (from Input_B pathway)
    - promoter: araBAD
      # Dual-input promoter: activated by AraC+arabinose AND repressed by TetR
      # (In practice, this would be a synthetic promoter with both araBAD and tetO sites)

    - cistron:
        label: Reporter_Protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
