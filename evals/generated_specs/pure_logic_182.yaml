construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: reporter_A
        expression: high
        fused: false
        chain:
          - gene:
              id: mGFP
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: reporter_B
        expression: high
        fused: false
        chain:
          - gene:
              id: mRFP
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: inducer_synthesis_A
        expression: medium
        fused: false
        chain:
          - gene:
              id: araB
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: inducer_synthesis_B
        expression: medium
        fused: false
        chain:
          - gene:
              id: iptg_synthase
              source: uniprot
    
    - terminator: rrnB_T1
