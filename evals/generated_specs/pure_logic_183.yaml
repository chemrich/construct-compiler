construct:
  name: mammalian_synthetic_oscillator
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - terminator: polyA

    - promoter: TRE

    - cistron:
        label: fluorescent_marker
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: activator
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: p65
              source: uniprot

    - terminator: polyA

    - promoter: constitutive_weak

    - cistron:
        label: negative_feedback_protein
        expression: medium
        chain:
          - gene:
              id: IkappaB_alpha
              source: uniprot

    - terminator: polyA
