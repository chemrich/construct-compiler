construct:
  name: toxin_triggered_irreversible_kill_switch
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: toxin_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Input_Toxin_Sensor_Signal
              source: uniprot

    - spacer: 25

    - cistron:
        label: lysis_effector
        expression: high
        fused: false
        gene:
          id: lysozyme
          source: uniprot
        # Note: lysozyme degrades peptidoglycan; alternative: use colicin, holin-endolysin system

    - spacer: 25

    - cistron:
        label: membrane_disruptor
        expression: high
        fused: false
        gene:
          id: phage_lysis_protein_E
          source: uniprot
        # Creates membrane pores; works synergistically with lysozyme

    - terminator: rrnB_T1
