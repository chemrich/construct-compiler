construct:
  name: optogenetic_AND_gate
  host: mammalian

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CRY2
              source: uniprot

    - spacer: 30

    - cistron:
        label: red_light_sensor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: PhyB
              source: uniprot

    - spacer: 30

    - cistron:
        label: transcriptional_activator
        expression: high
        chain:
          - gene:
              id: VP16
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
