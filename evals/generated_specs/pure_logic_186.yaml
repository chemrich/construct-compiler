construct:
  name: threshold_detector_circuit
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: cooperative_activator
        expression: medium
        chain:
          - gene:
              id: AraC
              source: uniprot

    - terminator: rrnB_T1
