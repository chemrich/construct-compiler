construct:
  name: "sharp_threshold_detector_circuit"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # T7lac provides a sharp, all-or-nothing threshold response in BL21(DE3) strains upon IPTG induction
    - cistron:
        label: Reporter_Protein
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term