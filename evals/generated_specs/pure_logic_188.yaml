construct:
  name: Negative_Feedback_Loop_Therapeutic_Stabilizer
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: BDNF
              source: uniprot

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: negative_feedback_repressor
        expression: medium
        chain:
          - gene:
              id: KRAB
              source: uniprot

    - spacer: 30

    - cistron:
        label: feedback_targeting_element
        expression: medium
        fused: false
        chain:
          - gene:
              id: dCas9
              source: uniprot

    - spacer: 30

    - cistron:
        label: guide_rna_scaffold
        expression: very_low
        fused: false
        chain:
          - gene:
              id: crRNA_therapeutic_promoter
              source: uniprot

    - terminator: rrnB_T1
