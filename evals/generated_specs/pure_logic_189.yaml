construct:
  name: "cell_free_OR_gate_diagnostic"
  host: in_vitro

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: OR_gate_scaffolding_protein
        expression: high
        chain:
          - gene:
              id: MS2_coat_protein
              source: uniprot

    - spacer: 30

    - cistron:
        label: target_RNA_1_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: twisty_ribozyme_sensor_1
              source: uniprot

    - spacer: 30

    - cistron:
        label: target_RNA_2_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: twisty_ribozyme_sensor_2
              source: uniprot

    - spacer: 30

    - cistron:
        label: luminescent_reporter
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Nanoluciferase
              source: uniprot

    - terminator: rrnB_T1
