construct:
  name: pulse_generator_circuit
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: pulse_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
          - tag: LAA  # rapid degradation tag for pulse decay

    - spacer: 30

    - cistron:
        label: negative_feedback
        expression: medium
        fused: false
        chain:
          - gene:
              id: P0A7E4  # lacI repressor
              source: uniprot

    - terminator: rrnB_T1