construct:
  name: spatial_patterning_morphogen_responsive
  host: mammalian

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: morphogen_sensor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: Input_Morphogen
              source: uniprot

    - spacer: 25

    - cistron:
        label: adhesion_factor_responsive
        expression: medium
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: Cell_Adhesion_Factor
              source: uniprot

    - spacer: 25

    - cistron:
        label: morphogen_signaling_module
        expression: medium
        fused: false
        chain:
          - gene:
              id: BMP_receptor
              source: uniprot

    - terminator: rrnB_T1
