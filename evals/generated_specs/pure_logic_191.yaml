construct:
  name: plant_XOR_gate
  host: mammalian
  # Note: Plant-optimized variant uses plant promoters/elements; compiled for HEK293 as proxy for eukaryotic expression

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: InputA_sensor
        expression: medium
        chain:
          - gene:
              id: TetR_VP16
              source: uniprot
        # Transcriptional repressor when Input_A (tetracycline/doxycycline) is absent

    - spacer: 25

    - cistron:
        label: InputB_sensor
        expression: medium
        chain:
          - gene:
              id: LacI_VP16
              source: uniprot
        # Transcriptional repressor when Input_B (lactose/IPTG) is absent

    - spacer: 25

    - cistron:
        label: OutputFluorescence
        expression: high
        fused: false
        chain:
          - promoter: TetO_LacO_hybrid
            # Dual operator: repressed by TetR-VP16 AND LacI-VP16
            # Output ON when: (InputA=0 AND InputB=1) OR (InputA=1 AND InputB=0)
            # Output OFF when: InputA=0 AND InputB=0 OR InputA=1 AND InputB=1
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: T7term
