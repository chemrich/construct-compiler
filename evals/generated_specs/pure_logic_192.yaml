construct:
  name: "positive_feedback_amplifier_for_differentiation"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: VP16_activation_domain
              source: uniprot
              # VP16 strong activation domain for robust TF activity

    - spacer: 25

    - cistron:
        label: gene_of_interest
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Input_Inducer
              source: uniprot

    - spacer: 30

    - cistron:
        label: positive_feedback_amplifier
        expression: high
        fused: false
        # This cistron produces the feedback TF that binds its own promoter
        chain:
          - tag: HA
          - gene:
              id: dCas9_VP64
              source: uniprot
              # dCas9-VP64 provides robust feedback amplification via synthetic activation

    - spacer: 25

    - cistron:
        label: self_amplifying_loop
        expression: medium
        fused: false
        # gRNA targeting the positive_feedback_amplifier promoter region
        # This creates the self-sustaining loop
        chain:
          - gene:
              id: sgRNA_custom
              source: uniprot

    - terminator: rrnB_T1
