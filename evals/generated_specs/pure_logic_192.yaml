construct:
  name: "T7_autocatalytic_positive_feedback_loop"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: trigger_t7
        expression: low
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: feedback_t7
        expression: high
        gene:
          id: P00573
          source: uniprot
    - spacer: 35
    - cistron:
        label: gene_of_interest
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term