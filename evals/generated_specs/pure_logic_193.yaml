construct:
  name: "temporal_delay_circuit_output_enzyme"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: delay_element_1
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: ssrA_tag_degradation_target
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: delay_element_2
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: unstable_protein_intermediate
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: output_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: output_enzyme
              source: uniprot
        fused: false

    - terminator: rrnB_T1
