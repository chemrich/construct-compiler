construct:
  name: frequency_discriminator_high_pass_filter
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: envZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: signal_integrator
        expression: high
        chain:
          - gene:
              id: cheY
              source: uniprot

    - spacer: 25

    - cistron:
        label: high_pass_filter
        expression: high
        chain:
          - gene:
              id: cheZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter
        expression: medium
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
