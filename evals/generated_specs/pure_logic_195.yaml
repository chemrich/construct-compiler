construct:
  name: NOR_gate_growth_factor
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_X
        expression: medium
        gene:
          id: tetR
          source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_Y
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - spacer: 25

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - promoter: tetO_lacO_hybrid
          - gene:
              id: Growth_Promoting_Factor
              source: uniprot

    - terminator: rrnB_T1
