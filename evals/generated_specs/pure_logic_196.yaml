construct:
  name: metabolic_logic_array_AND_OR
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Input_1_sensor
        expression: medium
        gene:
          id: LacI
          source: uniprot

    - spacer: 25

    - cistron:
        label: Input_2_sensor
        expression: medium
        gene:
          id: TetR
          source: uniprot

    - spacer: 25

    - cistron:
        label: Input_3_sensor
        expression: medium
        gene:
          id: AraC
          source: uniprot

    - spacer: 35

    - cistron:
        label: Output_Enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Output_Enzyme_A_AND_gate
              source: uniprot

    - spacer: 35

    - cistron:
        label: Output_Enzyme_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Output_Enzyme_B_OR_gate
              source: uniprot

    - terminator: rrnB_T1
