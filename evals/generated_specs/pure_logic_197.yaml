construct:
  name: adaptive_metabolite_Z_homeostasis_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: sensor_kinase
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PhoQ
              source: uniprot

    - spacer: 25

    - cistron:
        label: response_regulator
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PhoP
              source: uniprot

    - spacer: 25

    - cistron:
        label: metabolite_Z_synthase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MetZ_synthetase
              source: uniprot

    - spacer: 25

    - cistron:
        label: phosphatase_regulator
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PhoM
              source: uniprot

    - terminator: rrnB_T1
