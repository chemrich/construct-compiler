construct:
  name: "reversible_ON_OFF_switch_Gene_E"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: activator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: AraC
              source: uniprot

    - spacer: 30

    - cistron:
        label: ssrA_protease
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ClpX
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gene_E_regulated
        expression: very_low
        fused: false
        chain:
          - gene:
              id: Gene_E
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ssrA

    - terminator: rrnB_T1
