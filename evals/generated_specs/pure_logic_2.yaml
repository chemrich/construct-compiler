construct:
  name: "mammalian_OR_gate_three_input_cytokine"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: OR_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TNF_alpha
              source: uniprot

    - terminator: rrnB_T1

    # Separate cassette for input sensor 1 (ligand-responsive transcription factor)
    - promoter: EF1_alpha

    - cistron:
        label: sensor_1
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: STAT3
              source: uniprot

    - terminator: rrnB_T1

    # Separate cassette for input sensor 2
    - promoter: EF1_alpha

    - cistron:
        label: sensor_2
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: NF_kB_p65
              source: uniprot

    - terminator: rrnB_T1

    # Separate cassette for input sensor 3
    - promoter: EF1_alpha

    - cistron:
        label: sensor_3
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: AP1_c_Jun
              source: uniprot

    - terminator: rrnB_T1

    # OR gate logic: composite promoter with binding sites for all three sensors
    # (represented as regulatory element upstream of output, design assumes
    # chemical signal 1 → STAT3 activation, signal 2 → NF-κB activation,
    # signal 3 → AP-1/c-Jun activation; any one drives output expression)
    - promoter: CMV
      # Comment: Composite promoter with tandem STAT3, NF-κB, and AP-1 binding sites
      # ensures OR logic: activation by any sensor alone is sufficient for transcription

    - cistron:
        label: secreted_cytokine_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: IL_6
              source: uniprot

    - terminator: rrnB_T1
