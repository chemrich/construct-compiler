```yaml
construct:
  name: three_input_OR_gate_secreted_cytokine
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
      
    - cistron:
        label: dCas9_VP64
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: P61964  # dCas9 (nuclease dead)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: VP64_activation_domain  # transcriptional activator
              source: uniprot

    - spacer: 50

    - promoter: U6
      
    - cistron:
        label: gRNA_signal1
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold_signal1_target  # targets signal1-responsive promoter
          source: custom

    - spacer: 30

    - cistron:
        label: gRNA_signal2
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold_signal2_target  # targets signal2-responsive promoter
          source: custom

    - spacer: 30

    - cistron:
        label: gRNA_signal3
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold_signal3_target  # targets signal3-responsive promoter
          source: custom

    - spacer: 50

    - promoter: minimal_CMV  # minimal promoter with gRNA target sites
      
    - cistron:
        label: secreted_cytokine
        expression: high
        chain:
          - tag: signal_peptide  # for secretion
          - gene:
              id: P01579  # Interferon-gamma as example cytokine
              source: uniprot

    - terminator: BBa_B0015
```