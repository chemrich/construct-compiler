construct:
  name: "e_coli_NOT_gate_reporter"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
