construct:
  name: "AND_gate_growth_control"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: repressor_C1
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - promoter: T7lac
    
    - cistron:
        label: repressor_C2
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 25
    
    - promoter: araBAD
    
    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: igf1
              source: uniprot
    
    - spacer: 25
    
    - promoter: T7lac
    
    - cistron:
        label: growth_inhibitor
        expression: high
        chain:
          - gene:
              id: mazF
              source: uniprot
    
    - terminator: rrnB_T1
