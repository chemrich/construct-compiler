construct:
  name: "light_inducible_or_gate_therap"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_EL222  # Light_A sensor: Blue light inducible promoter
    - cistron:
        label: production_unit_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TheraP
              source: uniprot
    - terminator: rrnB_T1
    - promoter: P_FixK2  # Light_B sensor: Red light/anaerobic inducible promoter
    - cistron:
        label: production_unit_b
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TheraP
              source: uniprot
    - terminator: BBa_B0015