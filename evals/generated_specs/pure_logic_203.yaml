construct:
  name: "XOR_apoptosis_gate"
  host: mammalian
  
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: C1_repressor
        expression: high
        chain:
          - gene:
              id: "KRAB"
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: C2_repressor
        expression: high
        chain:
          - gene:
              id: "Krüppel-associated_box"
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: apoptosis_effector
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: "caspase_3"
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: C1_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: "dCas9"
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: C2_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: "split_TF_C2"
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: inhibitory_output
        expression: high
        fused: false
        chain:
          - gene:
              id: "BCL2"
              source: uniprot
    
    - terminator: rrnB_T1
