construct:
  name: "NAND_gate_temperature_pH_antibiotic_resistance"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: temperature_sensor
        expression: medium
        chain:
          - gene:
              id: cI857
              source: uniprot
        # cI857 is a temperature-sensitive lambda repressor (inactive at high temp)

    - spacer: 25

    - cistron:
        label: pH_sensor
        expression: medium
        chain:
          - gene:
              id: cadBA
              source: uniprot
        # cadBA is pH-sensitive (active at low pH)

    - spacer: 25

    - cistron:
        label: NAND_logic_output
        expression: high
        chain:
          - gene:
              id: blaTEM
              source: uniprot
        # TEM beta-lactamase confers ampicillin resistance
        # Logic: blaTEM transcription is repressed by both cI857 (at high temp) AND cadBA (at low pH)
        # When BOTH conditions present (high temp AND low pH), repression is maximized
        # Otherwise, at least one repressor is inactive, allowing blaTEM expression

    - terminator: rrnB_T1
