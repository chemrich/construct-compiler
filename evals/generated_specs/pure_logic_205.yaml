construct:
  name: "NOR_gate_LacZ_secretion"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: C1_sensor
        expression: medium
        chain:
          - gene:
              id: arsR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: C2_sensor
        expression: medium
        chain:
          - gene:
              id: mals
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: repressor_integrase
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 30
    
    - promoter: araBAD
    
    - cistron:
        label: LacZ_secreted
        expression: high
        chain:
          - tag: signal_peptide_ompA
          - gene:
              id: lacZ
              source: uniprot
    
    - terminator: rrnB_T1
