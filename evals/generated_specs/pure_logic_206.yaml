construct:
  name: "robust_bistable_toggle_switch"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: tac
    - cistron:
        label: "tetr_repressor"
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: "on_state_reporter"
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: PLtetO_1
    - cistron:
        label: "laci_repressor"
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: BBa_B0015