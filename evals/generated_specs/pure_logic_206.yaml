construct:
  name: "robust_inducible_bistable_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: C1_input
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: output_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: positive_feedback
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1
