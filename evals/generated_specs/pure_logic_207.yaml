construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tetO
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: output_A
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
    - promoter: lacUV5
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: output_B
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1