construct:
  name: mammalian_AND_logic_gate
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - gene:
              id: rtTA3
              source: uniprot
        # rtTA3: reverse tetracycline transactivator (Tet-On) — activated by doxycycline

    - terminator: rrnB_T1

    - promoter: CMV

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot
        # TetR: tetracycline repressor — active by default, inhibited by doxycycline

    - terminator: rrnB_T1

    - promoter: CMV

    - cistron:
        label: output_C
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mVenus
              source: fpbase
        # Output: mVenus (yellow fluorescent protein) with NLS for nuclear localization
        # Logic: mVenus is expressed only when rtTA3 (input A, doxycycline-activated) 
        # is present AND TetR (input B, doxycycline-inhibited) is absent.
        # This creates an AND gate: A AND NOT B, which can be configured as A AND B 
        # by using input logic inversion upstream.

    - terminator: rrnB_T1
