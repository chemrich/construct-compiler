construct:
  name: three_node_repressilator_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
    
    - cistron:
        label: node_A
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_A
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: node_B
        expression: high
        chain:
          - gene:
              id: lambda_CI
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_B
        expression: medium
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: node_C
        expression: high
        chain:
          - gene:
              id: cI_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_C
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
