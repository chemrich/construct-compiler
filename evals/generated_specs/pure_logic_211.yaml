construct:
  name: "timer_circuit_RFP_delay"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: C1_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: timer_delay
        expression: medium
        chain:
          - gene:
              id: luxI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: luxPR

    - cistron:
        label: RFP_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
