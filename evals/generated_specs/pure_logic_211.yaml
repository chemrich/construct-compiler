construct:
  name: "timer_circuit_c1_delayed_rfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Responds to inducer C1
    - cistron:
        label: delay_activator
        expression: medium
        gene:
          id: P00573  # T7 RNA Polymerase (UniProt)
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Activated by the delay_activator protein
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015