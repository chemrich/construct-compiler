construct:
  name: frequency_detector_c1_pulse
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: araBAD

    - cistron:
        label: oscillator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: timing_circuit
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cheZ
              source: uniprot

    - spacer: 30

    - cistron:
        label: frequency_discriminator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: memory_element
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
