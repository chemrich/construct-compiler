construct:
  name: "c1_threshold_comparator_luminescence"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # araBAD provides a sigmoidal threshold response to the inducer (C1)
    - cistron:
        label: luminescence_reporter
        expression: high
        gene:
          id: P08659  # Firefly luciferase
          source: uniprot
    - terminator: rrnB_T1