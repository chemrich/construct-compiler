construct:
  name: "C1_concentration_comparator_luminescence"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: C1_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: luminescence_reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: luxAB
              source: uniprot

    - terminator: rrnB_T1
