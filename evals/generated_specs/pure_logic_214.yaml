construct:
  name: "genetic_sr_flip_flop"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    # State 1: Set by C1 (e.g., aTc), produces Output A (mEGFP) and LacI to repress State 2
    - promoter: pTet # Repressed by TetR; induced by Anhydrotetracycline (C1)
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: output_A
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1

    # State 2: Reset by C2 (e.g., IPTG), produces TetR to repress State 1
    - promoter: lacUV5 # Repressed by LacI; induced by IPTG (C2)
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - terminator: BBa_B0015