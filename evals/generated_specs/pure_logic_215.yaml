construct:
  name: cascaded_logic_gates_C1_to_GFP
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Gate_A
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gate_B
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gate_C
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - promoter: T7lac

    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
