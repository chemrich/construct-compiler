construct:
  name: two_bit_combinatorial_decoder
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      description: "Input A: arabinose-inducible promoter"
    
    - cistron:
        label: output_00
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: lacUV5
      description: "Input B: IPTG-inducible promoter"
    
    - cistron:
        label: output_01
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
      description: "Input A AND B: dual arabinose induction"
    
    - cistron:
        label: output_10
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
      description: "Input A OR B: combined induction"
    
    - cistron:
        label: output_11
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
