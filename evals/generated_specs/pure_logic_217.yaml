construct:
  name: conditional_enzyme_x_secretion_system
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_pH_low
        expression: medium
        chain:
          - gene:
              id: PhoB
              source: uniprot

    - spacer: 30

    - cistron:
        label: sensor_temperature_high
        expression: medium
        chain:
          - gene:
              id: HrcA
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor_heavy_metal
        expression: medium
        chain:
          - gene:
              id: MerR
              source: uniprot

    - spacer: 30

    - cistron:
        label: enzyme_x_secreted
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_pelB
          - gene:
              id: Enzyme_X
              source: uniprot

    - spacer: 30

    - cistron:
        label: logic_controller
        expression: medium
        fused: false
        chain:
          - gene:
              id: AND_gate_regulatory_protein
              source: uniprot

    - terminator: rrnB_T1
