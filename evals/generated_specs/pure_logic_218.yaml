construct:
  name: quorum_sensing_gfp_amplification
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: autoinducer_receptor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: autoinducer_synthase
        expression: medium
        chain:
          - gene:
              id: luxI
              source: uniprot

    - spacer: 25

    - promoter: lacUV5
      # Quorum-sensing responsive promoter (activated by AutoInducer_X-LuxR complex)

    - cistron:
        label: gfp_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: signaling_protein_amplifier
        expression: high
        chain:
          - tag: signal_peptide
          - gene:
              id: SignalingProtein_Y
              source: uniprot

    - terminator: rrnB_T1
