```yaml
construct:
  name: yeast_OR_gate_circuit
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1
      
    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: P04386
              source: uniprot  # GAL4 transcription factor
              
    - terminator: CYC1

    - promoter: GAL10
      
    - cistron:
        label: input_B_sensor  
        expression: medium
        chain:
          - gene:
              id: P04386
              source: uniprot  # GAL4 transcription factor
              
    - terminator: CYC1

    - promoter: GAL4_UAS
      
    - cistron:
        label: output_D
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: sfGFP
              source: fpbase
              
    - terminator: ADH1
