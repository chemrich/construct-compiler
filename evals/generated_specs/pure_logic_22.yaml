construct:
  name: "yeast_OR_gate_logic_circuit"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: LexA_DBD
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_D
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
