construct:
  name: NOT_gate_Input_A_represses_Output_Z
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Input_A
        expression: high
        gene:
          id: tetR
          source: uniprot

    - spacer: 25

    - promoter: tetO

    - cistron:
        label: Output_Z
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
