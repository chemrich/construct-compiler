construct:
  name: "two_input_AND_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Input_A_receptor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Input_B_receptor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
