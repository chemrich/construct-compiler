construct:
  name: two_input_OR_gate
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: Input_A_promoter
    
    - cistron:
        label: repressor_B
        expression: high
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
      label: Input_B_promoter
    
    - cistron:
        label: repressor_A
        expression: high
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
      label: OR_output_promoter_1
    
    - cistron:
        label: Output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
      label: OR_output_promoter_2
    
    - cistron:
        label: Output_Z_alt
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
