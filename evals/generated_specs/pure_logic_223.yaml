construct:
  name: "bistable_memory_toggle_switch"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: LacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - spacer: 30

    - cistron:
        label: TetR_repressor
        expression: medium
        gene:
          id: tetR
          source: uniprot

    - spacer: 30

    - cistron:
        label: Input_S_set
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Input_R_reset
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_Q_state
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
