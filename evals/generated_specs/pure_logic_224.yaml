construct:
  name: mammalian_oscillatory_feedback_loop
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Repressor_Y
        expression: high
        chain:
          - tag: HA
          - gene:
              id: Krüppel_associated_box_repressor
              source: uniprot

    - terminator: bGH_polyA

    - promoter: EF1_alpha

    - cistron:
        label: Activator_X
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: VP16_activation_domain
              source: uniprot

    - terminator: bGH_polyA

    - promoter: U6

    - cistron:
        label: Output_Z
        expression: medium
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: U6_term
