construct:
  name: edge_detection_circuit_input_A_rising
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: input_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: pulse_generator
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_z_transient
        expression: medium
        chain:
          - gene:
              id: gfp
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: fast_decay
        expression: high
        chain:
          - gene:
              id: ssrA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: integrase_for_timing
        expression: medium
        chain:
          - gene:
              id: int
              source: uniprot
    
    - terminator: rrnB_T1
