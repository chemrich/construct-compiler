construct:
  name: SR_latch_reset_priority
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: NOR_gate_S
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: NOR_gate_protein_S
              source: uniprot
              description: "NOR logic gate for Set input (part of SR latch)"

    - spacer: 25

    - cistron:
        label: NOR_gate_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: NOR_gate_protein_R
              source: uniprot
              description: "NOR logic gate for Reset input (prioritized)"

    - spacer: 25

    - cistron:
        label: buffer_output
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase
              description: "Output buffer for Q state readout"

    - terminator: rrnB_T1
