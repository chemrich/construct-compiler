construct:
  name: "SR_latch_reset_dominant"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: reset_repressor
        expression: high
        gene:
          id: P03023
          source: uniprot
    - spacer: 40
    - promoter: araBAD
    - cistron:
        label: set_state_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: output_q
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015