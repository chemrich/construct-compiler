construct:
  name: "xor_gate_recombinase_logic"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # Input A: L-arabinose inducible promoter
    - cistron:
        label: input_a_processor
        expression: medium
        gene:
          id: P0CH72  # Bxb1 recombinase (UniProt)
          source: uniprot
    - spacer: 40
    - promoter: lacUV5  # Input B: IPTG inducible promoter
    - cistron:
        label: input_b_processor
        expression: medium
        fused: false
        gene:
          id: P06491  # Cre recombinase (UniProt)
          source: uniprot
    - spacer: 40
    - promoter: J23100  # Constitutive promoter for the XOR logic gate output
    - cistron:
        label: output_z
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015  # Standard double terminator for transcriptional isolation