construct:
  name: "two_input_XOR_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output_Z_XOR
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
