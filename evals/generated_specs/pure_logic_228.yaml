construct:
  name: "Input_A_proportional_control_Output_Z"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: Input_A
        expression: high
        gene:
          id: araC
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: Output_Z
        expression: medium
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
