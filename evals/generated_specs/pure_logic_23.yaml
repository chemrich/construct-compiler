construct:
  name: "XOR_gate_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: NOT_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: NOT_B
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: AND_gate
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: OR_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: XOR_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
