construct:
  name: pulse_counter_three_pulse_detector
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: counter_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PulseCounter
              source: uniprot
        description: |
          Synthetic pulse counter protein with three-state logic:
          - State 0: Default (no pulses registered)
          - State 1: One pulse received (Input_P detected once)
          - State 2: Two pulses received (Input_P detected twice)
          - State 3: Three pulses received → activates Output_Z
          Incorporates phosphorelay or allosteric switching mechanism for pulse counting.
          Includes intrinsic timeout mechanism (30+ minute inactivity) to reset to State 0.
          After Output_Z activation, auto-resets to State 0 after 5 minutes.

    - spacer: 30

    - cistron:
        label: input_receptor
        expression: medium
        fused: false
        gene:
          id: InputP_Sensor
          source: uniprot
        description: |
          Detects Input_P signal pulses and communicates count to counter_protein.
          Each pulse triggers a transient signal lasting ~2 seconds.

    - spacer: 30

    - cistron:
        label: output_effector
        expression: medium
        fused: false
        gene:
          id: OutputZ_Activator
          source: uniprot
        description: |
          Activated only when counter_protein reaches State 3.
          Produces Output_Z signal when counter confirms exactly three pulses.
          Signal remains active for ~10 minutes before counter resets.

    - terminator: rrnB_T1
