construct:
  name: "recombinase_based_three_pulse_counter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD  # Used araBAD to represent Input_P for controlled pulsing in E. coli
    - cistron:
        label: pulse_integrator_1
        expression: medium
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P06956 # Cre recombinase
              source: uniprot
    - spacer: 40
    - cistron:
        label: pulse_integrator_2
        expression: medium
        fused: false # Independent translation for second pulse component
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P03870 # Flp recombinase
              source: uniprot
    - spacer: 40
    - cistron:
        label: output_z
        expression: high
        fused: false # Independent translation for the final output reporter
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: rrnB_T1