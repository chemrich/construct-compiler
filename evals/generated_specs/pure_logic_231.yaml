construct:
  name: "mammalian_self_regulating_therapeutic_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PDGF
              source: uniprot
        description: "Primary therapeutic protein with N-terminal 6xHis tag for detection and purification"

    - spacer: 35

    - cistron:
        label: miR_sponge
        expression: medium
        fused: false
        chain:
          - gene:
              id: miR_122_sponge
              source: uniprot
        description: "miRNA sponge (decoy) that sequesters miR-122 in low therapeutic protein state"

    - spacer: 35

    - cistron:
        label: feedback_miRNA
        expression: medium
        fused: false
        chain:
          - gene:
              id: miR_122
              source: uniprot
        description: "Primary miRNA under control of Therapeutic_Protein-responsive promoter element; represses miR_sponge when protein levels are high"

    - spacer: 35

    - cistron:
        label: feedback_regulator
        expression: low
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: KRAB_repressor
              source: uniprot
        description: "KRAB-containing repressor protein that suppresses therapeutic protein translation when activated by elevated protein concentrations"

    - terminator: bGH_polyA
