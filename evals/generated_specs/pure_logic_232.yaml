construct:
  name: two_input_NAND_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: Input_A_repressor
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Input_B_repressor
        expression: medium
        fused: false
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Output_Z
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
