construct:
  name: "A_greater_than_B_comparator"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Output_Z
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: comparator_A_sensor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: comparator_B_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Output_inverse_B_greater
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mScarlet
              source: fpbase
    
    - terminator: rrnB_T1
