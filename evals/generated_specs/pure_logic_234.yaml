construct:
  name: light_gated_repressor_Output_Z
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YtvA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_repressor
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Output_Z
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          # Secretion signal for E. coli: Pel B signal peptide context
          - gene:
              id: Output_Z_secreted
              source: uniprot
    
    - terminator: rrnB_T1
