construct:
  name: "quorum_sensing_AND_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: signal_receptor_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 25
    - promoter: lacUV5
    - cistron:
        label: signal_receptor_2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rhlR
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 25
    - promoter: araBAD
    - cistron:
        label: output_Z
        expression: medium
        chain:
          - gene:
              id: gfp
              source: fpbase
    - terminator: rrnB_T1
