construct:
  name: "binary_logic_circuit_two_input"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    # Input X sensing module with fluorescent output
    - promoter: araBAD
      
    - cistron:
        label: Input_X_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
    
    - terminator: rrnB_T1
    
    # Input Y sensing module with orthogonal fluorescent output
    - spacer: 50
    
    - promoter: lacUV5
      
    - cistron:
        label: Input_Y_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
    
    - terminator: rrnB_T1
    
    # Output 00: Neither input active (constitutive, low expression)
    - spacer: 50
    
    - promoter: J23100
      
    - cistron:
        label: Output_00
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: mTagBFP2
              source: fpbase
    
    - terminator: rrnB_T1
    
    # Output 01: Only Input Y active (araBAD-controlled)
    - spacer: 50
    
    - promoter: araBAD
      
    - cistron:
        label: Output_01
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
    
    # Output 10: Only Input X active (lacUV5-controlled)
    - spacer: 50
    
    - promoter: lacUV5
      
    - cistron:
        label: Output_10
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    
    - terminator: rrnB_T1
    
    # Output 11: Both inputs active (dual-regulated, bidirectional)
    - spacer: 50
    
    - promoter: T7lac
      
    - cistron:
        label: Output_11
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
