construct:
  name: "oxidative_stress_memory_reporter"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: stress_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: OxyR
              source: uniprot

    - spacer: 30

    - cistron:
        label: memory_integrase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Cre
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
