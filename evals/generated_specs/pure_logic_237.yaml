construct:
  name: "oxidative_stress_memory_circuit"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: soxS  # Environmental stress sensor (oxidative stress/superoxide)
    - cistron:
        label: trigger_activator
        expression: medium
        gene:
          id: AraC
          source: uniprot
    - terminator: rrnB_T1
    - promoter: araBAD  # Activated by AraC, creating a positive feedback loop for memory
    - cistron:
        label: feedback_activator
        expression: medium
        gene:
          id: AraC
          source: uniprot
    - spacer: 30
    - cistron:
        label: output_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015