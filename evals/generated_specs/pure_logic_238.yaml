construct:
  name: "pulse_generator_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: input_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: pulse_generator
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output_z
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase
    
    - terminator: rrnB_T1
