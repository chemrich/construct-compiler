```yaml
construct:
  name: bistable_toggle_switch_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483  # TetR from E. coli
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: mCherry_output_state1
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: CMV  # Second cassette for the reciprocal repressor
    
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: P03023  # LacI from E. coli
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: mEGFP_output_state2
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
```