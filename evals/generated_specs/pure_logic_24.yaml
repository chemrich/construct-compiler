construct:
  name: mammalian_bistable_toggle_switch
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TRE3G
      # TRE3G is tetracycline response element (signal X inducible)

    - cistron:
        label: mCherry_state1
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1

    - promoter: CMV

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - gene:
              id: tTA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: tetO
      # tetO (tet operator) sequence repressed by tTA; de-repressed by signal Y (doxycycline)

    - cistron:
        label: mNeonGreen_state2
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
