construct:
  name: genetic_NOT_gate_X_inhibits_Y
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      
    - cistron:
        label: repressor_X
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      
    - cistron:
        label: output_Y
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
