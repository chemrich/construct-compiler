construct:
  name: "two_input_AND_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: AND_gate_output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
