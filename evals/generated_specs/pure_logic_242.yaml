construct:
  name: "genetic_OR_gate_tandem"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Input C: activated by Arabinose
    - promoter: lacUV5  # Input D: activated by IPTG
    - cistron:
        label: output_W
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1