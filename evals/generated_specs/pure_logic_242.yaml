construct:
  name: "genetic_OR_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_C_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_D_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_W
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
