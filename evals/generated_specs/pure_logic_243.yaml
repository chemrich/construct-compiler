construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_reporter_1
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: output_reporter_2
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
