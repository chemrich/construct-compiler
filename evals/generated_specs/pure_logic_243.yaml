construct:
  name: "bistable_toggle_switch_lacI_tetR"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: PL_lacO1  # Repressed by LacI, induced by IPTG (Input R)
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: egfp_reporter
        expression: medium
        fused: false  # Separate RBS for reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: PL_tetO1  # Repressed by TetR, induced by aTc (Input S)
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: mscarlet_reporter
        expression: medium
        fused: false  # Separate RBS for reporter
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term