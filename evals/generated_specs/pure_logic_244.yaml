construct:
  name: "negative_feedback_loop_protein_P"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_P
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor
        expression: medium
        fused: false
        chain:
          - gene:
              id: lacI
              source: uniprot
        # lacI repressor binds operator to inhibit P transcription
        # As P levels rise, more lacI is produced, reducing P synthesis

    - terminator: rrnB_T1
