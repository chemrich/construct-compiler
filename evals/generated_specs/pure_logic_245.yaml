construct:
  name: genetic_oscillator_60min
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output_protein_O
        expression: medium
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: activator_B
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: degradation_tag
        expression: high
        fused: false
        chain:
          - gene:
              id: ssrA
              source: uniprot
    
    - terminator: rrnB_T1
