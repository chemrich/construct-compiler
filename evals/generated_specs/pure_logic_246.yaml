construct:
  name: "two_input_NOR_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Q_output
        expression: high
        chain:
          - gene:
              id: Q
              source: uniprot
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: repressor_E
        expression: medium
        fused: false
        gene:
          id: tetR
          source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_F
        expression: medium
        fused: false
        gene:
          id: cI
          source: uniprot

    - terminator: rrnB_T1
