construct:
  name: "two_input_XOR_gate"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: XOR_output_M
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_N_sensor
        expression: medium
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_P_sensor
        expression: medium
        fused: false
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1
