```yaml
construct:
  name: negative_feedback_stabilizer
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # Galactose-inducible promoter for input G responsiveness

    - cistron:
        label: output_protein
        expression: medium
        chain:
          - tag: alpha_factor  # Yeast secretion signal
          - gene:
              id: F_output
              source: uniprot

    - spacer: 50

    - cistron:
        label: repressor
        expression: high
        fused: false
        chain:
          - gene:
              id: GAL80  # Galactose repressor for negative feedback
              source: uniprot

    - terminator: CYC1_T1
```