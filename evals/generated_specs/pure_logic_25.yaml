construct:
  name: "negative_feedback_loop_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - promoter: GAL1

    - cistron:
        label: output_F
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: CYC1

    - spacer: 30

    - promoter: TetO

    - cistron:
        label: repressor_R
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tTA_tetracycline_controlled_transactivator
              source: uniprot

    - terminator: CYC1
