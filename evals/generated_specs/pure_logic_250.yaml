construct:
  name: "three_stage_NOT_inverter_cascade"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: stage1_NOT
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: stage2_NOT
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: stage3_NOT
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1
