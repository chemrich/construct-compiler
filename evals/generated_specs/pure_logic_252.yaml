construct:
  name: "delay_circuit_W_to_V"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Input W (Arabinose) activates this promoter
    - cistron:
        label: delay_activator
        expression: medium
        gene:
          id: P00573  # T7 RNA Polymerase (UniProt ID), acts as a transcriptional delay element
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7     # Output V is only expressed once T7 Polymerase has accumulated
    - cistron:
        label: output_V
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: BBa_B0015