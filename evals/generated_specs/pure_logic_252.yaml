construct:
  name: "two_hour_delay_circuit_W_to_V"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: delay_element_1
        expression: medium
        chain:
          - gene:
              id: araB
              source: uniprot

    - spacer: 25

    - cistron:
        label: delay_element_2
        expression: medium
        chain:
          - gene:
              id: araA
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_V
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
