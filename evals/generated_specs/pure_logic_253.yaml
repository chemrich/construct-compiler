construct:
  name: "genetic_selector_switch_system"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: "select_A_input"
    
    - cistron:
        label: "recombinase_A"
        expression: high
        gene:
          id: "cre"
          source: "uniprot"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
      label: "select_B_input"
    
    - cistron:
        label: "recombinase_B"
        expression: high
        gene:
          id: "flp"
          source: "uniprot"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: "loxP_regulated"
      label: "input_data_1_path"
    
    - cistron:
        label: "output_X_from_input_1"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "gfp"
              source: "fpbase"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: "FRT_regulated"
      label: "input_data_2_path"
    
    - cistron:
        label: "output_X_from_input_2"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "gfp"
              source: "fpbase"
    
    - terminator: rrnB_T1
