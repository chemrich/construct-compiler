construct:
  name: "frequency_divider_2to1"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: toggle_switch_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: toggle_switch_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
