construct:
  name: genetic_NAND_gate
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: repressor_S
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    - spacer: 25
    - cistron:
        label: repressor_T
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    - spacer: 25
    - promoter: araBAD
    - cistron:
        label: output_R
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: msfGFP
              source: fpbase
    - terminator: rrnB_T1
