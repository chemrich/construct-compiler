construct:
  name: blue_light_AND_NOT_input_G_logic_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CRY2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP16
              source: uniprot

    - spacer: 25

    - cistron:
        label: NOT_gate_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_F_under_light_control
        expression: medium
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
