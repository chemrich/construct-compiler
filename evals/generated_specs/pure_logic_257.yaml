construct:
  name: temperature_dependent_switch_37C
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: thermosensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TlpA
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_H
        expression: medium
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
