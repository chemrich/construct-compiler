construct:
  name: "two_input_two_output_logic_gate"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: input_1_promoter
    
    - cistron:
        label: I1_repressor
        expression: medium
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
      label: output_1_promoter
    
    - cistron:
        label: O1_output
        expression: high
        chain:
          - gene:
              id: mGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
      label: input_2_promoter
    
    - cistron:
        label: I2_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
      label: output_2_promoter
    
    - cistron:
        label: O2_output
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
