construct:
  name: quorum_sensing_circuit
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: synthase
        expression: medium
        chain:
          - gene:
              id: luxI
              source: uniprot

    - spacer: 25

    - cistron:
        label: regulator
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_X
        expression: very_low
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase

    - terminator: rrnB_T1
