construct:
  name: positive_feedback_amplifier_H_to_I
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # Input-responsive promoter: responds to weak H signal

    - cistron:
        label: H_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
              # AraC acts as transcriptional regulator; will sense input H

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
      # Positive feedback: araBAD is activated by AraC in presence of arabinose (H signal)

    - cistron:
        label: I_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacZ
              source: uniprot
              # Beta-galactosidase: highly active enzyme with strong output

    - spacer: 30

    - cistron:
        label: feedback_amplifier
        expression: high
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot
              # Second AraC copy: creates positive feedback loop
              # As H signal activates araBAD promoter, more AraC is produced,
              # further amplifying activation of araBAD and output I

    - terminator: rrnB_T1
