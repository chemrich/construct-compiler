construct:
  name: "NOT_logic_gate_LacI_repressor"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
