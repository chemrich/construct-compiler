construct:
  name: "E_coli_AND_gate_ara_iptg"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: araBAD_lacO # Hybrid promoter requiring Arabinose (Input B) and IPTG (Input C) for induction of Protein Y
    - cistron:
        label: Protein_Y
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1