construct:
  name: "XOR_logic_gate_E_coli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_F
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_G
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_protein_W
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
