construct:
  name: "e_coli_xor_logic_gate_w"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_XOR_F_G  # Logic: (Ligand_F OR Ligand_G) AND NOT (Ligand_F AND Ligand_G)
    - cistron:
        label: target_protein_W
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_W
              source: uniprot
    - terminator: rrnB_T1