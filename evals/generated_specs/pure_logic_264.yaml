construct:
  name: mammalian_bistable_switch
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: TF_SET
        expression: high
        chain:
          - gene:
              id: dCas9_VP64
              source: uniprot

    - spacer: 30

    - cistron:
        label: TF_RESET
        expression: high
        chain:
          - gene:
              id: dCas9_KRAB
              source: uniprot

    - spacer: 30

    - cistron:
        label: receptor_H
        expression: medium
        chain:
          - gene:
              id: hER_LBD
              source: uniprot

    - spacer: 30

    - cistron:
        label: receptor_I
        expression: medium
        chain:
          - gene:
              id: hGR_LBD
              source: uniprot

    - terminator: rrnB_T1

  secondary_cassette_1:
    - promoter: CMV
    
    - cistron:
        label: state_memory_SET
        expression: high
        chain:
          - gene:
              id: tTA_VP64
              source: uniprot

    - terminator: rrnB_T1

  secondary_cassette_2:
    - promoter: CMV

    - cistron:
        label: state_memory_RESET
        expression: high
        chain:
          - gene:
              id: rtTA_KRAB
              source: uniprot

    - terminator: rrnB_T1

  secondary_cassette_3:
    - promoter: TRE_tight

    - cistron:
        label: output_protein_P
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
