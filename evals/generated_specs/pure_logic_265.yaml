construct:
  name: "S_cerevisiae_Q_negative_feedback_loop"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Q_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Q_repressor
              source: uniprot

    - terminator: CYC1

    - spacer: 25

    - promoter: pGAL4_UAS_minimal
      # Minimal GAL4 promoter with upstream activation sequences (UAS) to enable protein Q-mediated repression

    - cistron:
        label: Q_production
        expression: low
        chain:
          - gene:
              id: Q_repressor
              source: uniprot
          - cleavage_site: 3C

    - terminator: CYC1
