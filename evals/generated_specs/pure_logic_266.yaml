construct:
  name: positive_feedback_hysteresis_module
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # High-affinity promoter for basal repression by LacI; sensitive to induction

    - cistron:
        label: regulator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
              # Repressor protein; constitutively expressed at moderate level

    - terminator: rrnB_T1

    - promoter: lacUV5
      # Same promoter; dual control creates positive feedback loop

    - cistron:
        label: response_protein_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P_target_response
              source: uniprot
              # Replace with actual protein ID; R protein acts as co-repressor
              # When R binds ligand J, it inhibits lacI expression or enhances own expression
              # This creates positive autoregulation and hysteresis

    - terminator: rrnB_T1

    - promoter: araBAD
      # Secondary inducible promoter for ligand-sensing input

    - cistron:
        label: ligand_sensor
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
              # AraC: senses ligand J (L-arabinose or engineered ligand)
              # Activates araBAD promoter; couples input to feedback circuit

    - terminator: rrnB_T1
