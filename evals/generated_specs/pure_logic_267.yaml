construct:
  name: relaxation_oscillator_e_coli
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: S1_repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: S2_activator
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: GFP_monitor_S1
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: RFP_monitor_S2
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
