construct:
  name: "signal_amplification_cascade_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TLR4
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: signal_amplifier
        expression: high
        chain:
          - gene:
              id: MAPK1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - spacer: 30

    - cistron:
        label: output_protein
        expression: very_low
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
