construct:
  name: "logic_array_L_M_exclusive_outputs"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: araBAD_lacO  # Logic: L AND NOT M (Inducer L: Arabinose; Repressor M: LacI/IPTG)
    - cistron:
        label: output_U
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: tac_araO    # Logic: M AND NOT L (Inducer M: IPTG; Repressor L: AraC/Arabinose)
    - cistron:
        label: output_V
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015