construct:
  name: "logic_AND_NOT_gate_array"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: LacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - spacer: 30

    - cistron:
        label: output_U_L_AND_NOT_M
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - cistron:
        label: output_V_NOT_L_AND_M
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 30

    - cistron:
        label: input_sensor_L
        expression: medium
        fused: false
        gene:
          id: araC
          source: uniprot

    - spacer: 30

    - cistron:
        label: input_sensor_M
        expression: medium
        fused: false
        gene:
          id: rhaSR
          source: uniprot

    - terminator: rrnB_T1
