```yaml
construct:
  name: mammalian_delay_circuit
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: rtTA3
              source: uniprot

    - terminator: SV40_polyA

    - promoter: TRE3G

    - cistron:
        label: delay_integrator
        expression: medium
        chain:
          - gene:
              id: dNLuc
              source: uniprot
          - cleavage_site: T2A
          - tag: degron_D-box
          - gene:
              id: mCherry
              source: fpbase

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: output_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mVenus
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_PEST
              source: uniprot

    - terminator: SV40_polyA
```