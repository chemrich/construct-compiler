construct:
  name: "mammalian_delay_element"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE3G  # Responds to Input K (assuming rtTA is present)
    - cistron:
        label: intermediate_activator
        expression: medium
        gene:
          id: GAL4_VP16  # Synthetic activator to create cascade delay
    - terminator: SV40_polyA
    - promoter: UAS    # Activated by the intermediate GAL4_VP16
    - cistron:
        label: output_j
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: PEST  # C-terminal degradation tag for rapid turnover
    - terminator: SV40_polyA  # Standard mammalian terminator for final transcript