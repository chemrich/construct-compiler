```yaml
construct:
  name: genetic_delay_element_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    - cistron:
        label: delay_circuit
        expression: medium
        chain:
          - gene:
              id: rtTA3  # tetracycline-controlled transactivator for delay
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: PEST  # degradation tag for rapid turnover
    - terminator: BGH_polyA

    - promoter: TRE3GS  # tetracycline response element - activated by rtTA3
    - cistron:
        label: output_protein
        expression: high
        chain:
          - gene:
              id: mScarlet  # output protein J
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: CL1  # degradation tag for quick shutdown
    - terminator: SV40_polyA
```