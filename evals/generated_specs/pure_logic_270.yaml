construct:
  name: "ahl_responsive_gfp_detector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: luxR_regulator
        expression: medium
        gene:
          id: P12746
          source: uniprot
    - terminator: BBa_B0015
    - promoter: pLux  # AHL-LuxR inducible promoter
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1