construct:
  name: "quorum_sensing_detector_ahl_gfp"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # lacUV5 provides constitutive low-level expression of QS receptor

    - cistron:
        label: ahl_receptor
        expression: medium
        gene:
          id: luxR
          source: uniprot
          # luxR encodes the AHL-binding transcriptional regulator

    - terminator: rrnB_T1

    - promoter: luxO
      # luxO is the AHL-responsive promoter (activated when luxR binds AHL)
      # This promoter is activated only when the AHL threshold is exceeded

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
