construct:
  name: temperature_controlled_switch_X
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: thermosensor
        expression: high
        chain:
          - gene:
              id: cI857
              source: uniprot
        comment: "cI857 is temperature-sensitive repressor (active at 30°C, inactive at 37°C)"

    - spacer: 30

    - cistron:
        label: output_protein_X
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: output_protein_X
              source: uniprot
        comment: "Expression controlled by cI857-regulated promoter; ON at 30°C, OFF at 37°C"

    - terminator: rrnB_T1
