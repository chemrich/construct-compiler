construct:
  name: cold_inducible_gene_switch
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: cspA  # Cold-inducible promoter from E. coli; active at 30C, repressed at 37C
    - cistron:
        label: protein_x
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1