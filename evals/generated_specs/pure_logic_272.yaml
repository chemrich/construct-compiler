construct:
  name: "light_activated_photoenzyme_circuit"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "CRY2"
              source: uniprot

    - spacer: 30

    - cistron:
        label: photoenzyme_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: "PhotoEnzyme"
              source: uniprot

    - terminator: rrnB_T1
