construct:
  name: "blue_light_inducible_photoenzyme_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: C120  # VP16-EL222 responsive promoter for blue-light induction
    - cistron:
        label: target_enzyme
        expression: high
        gene:
          id: PhotoEnzyme
    - terminator: CYC1_term