construct:
  name: metabolic_responsive_operon_switch
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD promoter is repressed by AraC in absence of L-arabinose
      # Here we repurpose it as a metabolite-responsive promoter by co-expressing
      # a metabolite-sensing transcription factor (e.g., based on riboswitch or allolactose-sensing)
    
    - cistron:
        label: M1
        expression: high
        gene:
          id: M1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M2
        expression: high
        fused: false
        gene:
          id: M2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: M3
        expression: high
        fused: false
        gene:
          id: M3
          source: uniprot
    
    - terminator: rrnB_T1
