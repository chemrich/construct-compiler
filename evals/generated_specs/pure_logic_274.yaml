construct:
  name: "toggle_flip_flop_memory_module"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pSC101"
    resistance: kanamycin
    ori: SC101
    source: addgene

  cassette:
    # Cassette 1: O-inducible promoter driving CI repressor (sets State 1)
    - promoter: araBAD
      gene_id: araC
      # araC is constitutively expressed to enable araBAD regulation
    
    - cistron:
        label: CI_repressor
        expression: high
        gene:
          id: CI
          source: uniprot

    - terminator: rrnB_T1

    # Spacer between cassettes
    - spacer: 50

    # Cassette 2: P-inducible promoter driving Cro repressor (sets State 2)
    - promoter: araBAD
      gene_id: araC

    - cistron:
        label: Cro_repressor
        expression: high
        gene:
          id: Cro
          source: uniprot

    - terminator: rrnB_T1

    # Spacer
    - spacer: 50

    # Cassette 3: CI-repressible promoter (P_RM from lambda) driving Output E
    - promoter: lacUV5
      # Note: Use CI-responsive promoter P_RM (CI represses, Cro allows expression)

    - cistron:
        label: Output_E
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1

    # Spacer
    - spacer: 50

    # Cassette 4: Cro-repressible promoter (P_R from lambda) driving Output F
    - promoter: tac
      # Note: Use Cro-responsive promoter P_R (Cro represses, CI allows expression)

    - cistron:
        label: Output_F
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
