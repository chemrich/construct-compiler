construct:
  name: "toggle_flip_flop_memory_module"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Repressed by LacI; induced by Ligand O (IPTG)
    - cistron:
        label: output_e
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: repressor_tetr
        expression: medium
        fused: false # Independent translation via its own RBS
        gene:
          id: P04483 # TetR
          source: uniprot
    - terminator: rrnB_T1
    - promoter: Ptet # Repressed by TetR; induced by Ligand P (aTc)
    - cistron:
        label: output_f
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: repressor_laci
        expression: medium
        fused: false # Independent translation via its own RBS
        gene:
          id: P03023 # LacI
          source: uniprot
    - terminator: BBa_B0015