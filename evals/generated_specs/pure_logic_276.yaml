construct:
  name: time_delayed_expression_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: delay_accumulator
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: timer_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P99A_cAMP_phosphodiesterase
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: output_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
