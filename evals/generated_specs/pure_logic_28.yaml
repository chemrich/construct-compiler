construct:
  name: "yeast_threshold_detector_output_L"
  host: yeast

  backbone:
    catalog_vector: "pYES2/NT"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - gene:
              id: MET31
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_L
        expression: medium
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase
          - tag: degron_PEST

    - terminator: CYC1
