construct:
  name: "NOT_logic_gate_with_reporter"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is repressed by AraC protein in absence of L-arabinose
      # When input 'A' (L-arabinose) is absent, araBAD is ON → output protein X expressed
      # When input 'A' is present, araBAD is OFF → output protein X repressed

    - cistron:
        label: output_protein_X
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: constitutive_reporter
        expression: medium
        fused: false
        promoter: T7lac
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
