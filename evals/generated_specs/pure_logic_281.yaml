construct:
  name: "two_input_AND_logic_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: input_C_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: output_Y_AND_gate
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
