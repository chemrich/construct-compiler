construct:
  name: "and_gate_split_t7_logic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Induced by Input B (Arabinose)
    - cistron:
        label: n_terminal_t7_rnap
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1

    - promoter: lacUV5  # Induced by Input C (IPTG)
    - cistron:
        label: c_terminal_t7_rnap
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1

    - promoter: T7      # Logic gate output: requires assembled N-T7 and C-T7
    - cistron:
        label: output_protein_y
        expression: high
        gene:
          id: sfGFP     # Representing protein Y as requested
          source: fpbase
    - terminator: T7term