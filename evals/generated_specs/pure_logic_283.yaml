construct:
  name: "genetic_toggle_switch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PLtetO-1  # Repressed by P2 (TetR); pulse of aTc (Input F) switches to State 1
    - cistron:
        label: P1
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac  # Repressed by P1 (LacI); pulse of IPTG (Input G) switches to State 2
    - cistron:
        label: P2
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - terminator: BBa_B0015