construct:
  name: negative_feedback_H_homeostasis
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: H_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxI
              source: uniprot

    - spacer: 25

    - cistron:
        label: H_repressor
        expression: medium
        fused: false
        chain:
          - promoter: araBAD
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1
