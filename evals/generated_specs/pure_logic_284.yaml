construct:
  name: "negative_feedback_loop_protein_H"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Strong promoter repressed by LacI; provides high initial expression and negative feedback control
    - cistron:
        label: target_protein_H
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: repressor
        expression: low
        fused: false  # Independent translation of the LacI repressor
        gene:
          id: P00308  # UniProt ID for LacI repressor
          source: uniprot
    - terminator: rrnB_T1