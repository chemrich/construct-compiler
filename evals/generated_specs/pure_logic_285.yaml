construct:
  name: "repressilator_oscillator"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: SC101
    source: addgene

  cassette:
    # TU 1: Repressor TetR (repressed by LacI from TU 3)
    - promoter: lacUV5
    - cistron:
        label: node_1_tetR
        expression: low
        chain:
          - tag: SsrA # Degradation tag to ensure rapid protein turnover for oscillation
          - gene:
              id: P04483
              source: uniprot
    - terminator: rrnB_T1

    # TU 2: Repressor cI (repressed by TetR from TU 1)
    - promoter: tetR_promoter
    - cistron:
        label: node_2_cI
        expression: low
        chain:
          - tag: SsrA
          - gene:
              id: P03034
              source: uniprot
    - terminator: rrnB_T1

    # TU 3: Repressor LacI (repressed by cI from TU 2)
    - promoter: lambda_PR
    - cistron:
        label: node_3_lacI
        expression: low
        chain:
          - tag: SsrA
          - gene:
              id: P03023
              source: uniprot
    - terminator: rrnB_T1

    # TU 4: Reporter GFP (repressed by TetR; oscillates in phase with cI)
    - promoter: tetR_promoter
    - cistron:
        label: reporter_output
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015