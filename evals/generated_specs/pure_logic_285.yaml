construct:
  name: repressilator_GFP_oscillator
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: tetR_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: cI_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac

    - cistron:
        label: lambda_cro_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cro
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: J23100

    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase

    - terminator: rrnB_T1
