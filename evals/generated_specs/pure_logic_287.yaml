construct:
  name: CRISPRi_AND_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: dCas9
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dCas9
              source: uniprot

    - spacer: 30

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: output_Q
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 30

    - terminator: rrnB_T1

    # Note: Input gRNAs (gRNA1 and gRNA2) must be provided exogenously or on
    # separate plasmids. The dCas9 protein produced here will bind and repress
    # output_Q transcription only when BOTH gRNAs are present and target the
    # promoter/5'UTR of the output gene. Absence of either gRNA allows Q expression.
