construct:
  name: "genetic_memory_unit_integrase_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_integrase
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Bxb1_integrase
              source: uniprot

    - spacer: 25

    - cistron:
        label: memory_unit_state_off
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # loxP sites flanking Reporter1 for Cre-mediated inversion/excision
    - promoter: T7lac

    - cistron:
        label: memory_unit_state_on
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 25

    - cistron:
        label: recombinase_expression_control
        expression: low
        fused: false
        gene:
          id: araBAD_inducible_recombinase_activator
          source: uniprot

    - terminator: rrnB_T1
