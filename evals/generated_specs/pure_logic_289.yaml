construct:
  name: "XNOR_logic_gate_equality_detector"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: input_1_sensor
        expression: high
        chain:
          - gene:
              id: LacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: input_2_sensor
        expression: high
        chain:
          - gene:
              id: AraC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_R
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
