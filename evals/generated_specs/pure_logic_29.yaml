```yaml
construct:
  name: genetic_2to1_multiplexer_secreted
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD  # Control signal S - LOW arabinose = input A selected

    - cistron:
        label: signal_peptide_A
        expression: medium
        chain:
          - tag: pelB  # Secretion signal for E. coli
          - gene:
              id: mEGFP  # Input A
              source: fpbase
          - tag: 6xHis  # Purification tag

    - spacer: 30

    - promoter: lacUV5  # Control signal S - HIGH IPTG = input B selected

    - cistron:
        label: signal_peptide_B
        expression: medium
        chain:
          - tag: pelB  # Secretion signal for E. coli
          - gene:
              id: mScarlet  # Input B
              source: fpbase
          - tag: 6xHis  # Purification tag

    - terminator: rrnB_T1
```