construct:
  name: "e_coli_2to1_multiplexer_secreted"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: multiplexer_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MuxO
              source: uniprot
              # Functional description: Logic gate protein that outputs A when S=LOW, B when S=HIGH
              # Implementation requires a fusion protein with conditional domain-swapping or allosteric regulation
              # DNA sequence encodes a synthetic logic circuit protein responsive to S signal

    - spacer: 25

    - cistron:
        label: signal_input_A
        expression: medium
        fused: false
        gene:
          id: InputA
          source: uniprot

    - spacer: 25

    - cistron:
        label: signal_input_B
        expression: medium
        fused: false
        gene:
          id: InputB
          source: uniprot

    - spacer: 25

    - cistron:
        label: control_signal_S
        expression: medium
        fused: false
        gene:
          id: ControlS
          source: uniprot

    - terminator: rrnB_T1
