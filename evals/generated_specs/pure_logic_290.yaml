construct:
  name: "transcriptional_amplifier_cascade"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: stage1_activator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: stage2_activator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: AMP_OUT
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
