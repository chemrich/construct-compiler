construct:
  name: "binary_ph_sensor_acid_gfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: asr  # pH-responsive promoter (acid stress response) induced at pH < 6.5
      cistron:
        label: ACID_GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
      terminator: rrnB_T1