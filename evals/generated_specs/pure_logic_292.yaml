construct:
  name: "time_delayed_transcriptional_cascade"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # Initial trigger (Arabinose)
    - cistron:
        label: trigger_relay
        expression: low  # Low expression to increase the lag time of the cascade
        gene:
          id: P00573  # T7 RNA Polymerase
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Activated only once T7 RNA Polymerase has accumulated
    - cistron:
        label: delay_out
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term