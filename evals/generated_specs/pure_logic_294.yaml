construct:
  name: "dual_input_AND_gate_cancer_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
      
    - cistron:
        label: input_sensor_1
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: drug1_sensor
              source: uniprot
              # Drug1-binding transcription factor (e.g., rtTA variant for Dox)

    - terminator: rrnB_T1

    - promoter: TRE3G
      # Tetracycline Response Element - activated by Input_Drug1 sensor

    - cistron:
        label: input_sensor_2
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: drug2_sensor
              source: uniprot
              # Drug2-binding transcription factor (e.g., LexA variant for 4-OHT)

    - terminator: rrnB_T1

    - promoter: pGL4.27_hybrid
      # Hybrid promoter containing both TRE (for Drug1) and hormone response element (for Drug2)
      # Requires BOTH Input_Drug1 AND Input_Drug2 for activation
      # Cancer cell specificity through promoter selection

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: THERAPEUTIC_P
              source: uniprot

    - terminator: rrnB_T1
