construct:
  name: "nand_logic_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: input_x
        expression: medium
        gene:
          id: IN_X
    - spacer: 25
    - promoter: J23106
    - cistron:
        label: input_y
        expression: medium
        gene:
          id: IN_Y
    - spacer: 25
    - promoter: tac # NAND logic implementation: promoter is repressed only when IN_X and IN_Y (e.g., split-LacI components) are both present to form a functional repressor
    - cistron:
        label: target
        expression: high
        gene:
          id: NAND_OUT
    - terminator: rrnB_T1