construct:
  name: NAND_logic_gate
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: repressor_X
        expression: medium
        gene:
          id: tetR
          source: uniprot
    - spacer: 25
    - cistron:
        label: repressor_Y
        expression: medium
        gene:
          id: lacI
          source: uniprot
    - spacer: 25
    - cistron:
        label: NAND_OUT
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: rrnB_T1
