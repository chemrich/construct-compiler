construct:
  name: "blue_light_inducible_GFP_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YtvA
              source: uniprot
        # YtvA is the blue-light photoreceptor domain from Bacillus subtilis

    - spacer: 25

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - gene:
              id: EL222
              source: uniprot
        # EL222 is a light-activated transcription factor that responds to YtvA activation

    - spacer: 25

    - cistron:
        label: BLUE_GFP_reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
