construct:
  name: "diagnostic_logic_and_gate"
  host: in_vitro
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7  # Logic (M1 AND M2) is assumed to be implemented via logic-gated T7 polymerase or toehold switches in the cell-free extract.
    - cistron:
        label: "COLOR_OUT"
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term