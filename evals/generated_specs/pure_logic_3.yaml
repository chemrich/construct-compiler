construct:
  name: yeast_XOR_gate
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: LexA_DBD_Gal4_AD
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - gene:
              id: MS2_coat_protein_fusion
              source: uniprot

    - spacer: 25

    - cistron:
        label: XOR_logic_integrator
        expression: high
        chain:
          - gene:
              id: Not1_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_fluorescent_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
