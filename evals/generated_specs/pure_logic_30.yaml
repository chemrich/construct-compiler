construct:
  name: "repressilator_oscillator_circuit"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: SC101
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: tetR_repressor
        expression: medium
        fused: false
        gene:
          id: P04483
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tet
    - cistron:
        label: lambda_cI_repressor
        expression: medium
        fused: false
        gene:
          id: P03034
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lambda_pL
    - cistron:
        label: lacI_repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lambda_pL
    - cistron:
        label: reporter_output
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015