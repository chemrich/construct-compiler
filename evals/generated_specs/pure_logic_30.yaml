construct:
  name: "E_coli_repressilator_oscillator"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: tetR_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 35

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: lacI_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 35

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: cI_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot

    - spacer: 35

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: fluorescent_reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - terminator: rrnB_T1
