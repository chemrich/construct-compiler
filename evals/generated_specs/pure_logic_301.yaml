construct:
  name: two_input_AND_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: Input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Input_C_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Output_Y
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
