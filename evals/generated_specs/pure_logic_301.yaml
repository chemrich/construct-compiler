construct:
  name: "two_input_and_gate_split_t7"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Input B sensor
    - cistron:
        label: t7_polymerase_n_fragment
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Input C sensor
    - cistron:
        label: t7_polymerase_c_fragment
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Output Y (only active if N and C fragments assemble)
    - cistron:
        label: output_y_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term