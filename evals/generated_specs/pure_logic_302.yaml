construct:
  name: genetic_OR_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: Input_D_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Input_E_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: Output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase
    
    - terminator: rrnB_T1
