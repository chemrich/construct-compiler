construct:
  name: "mammalian_bistable_toggle_switch"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: HA
          - gene:
              id: tetR
              source: uniprot

    - terminator: bGH_polyA

    - spacer: 30

    - promoter: TRE  # Tetracycline Response Element

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: lacI
              source: uniprot

    - terminator: bGH_polyA

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: state_indicator_on
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: bGH_polyA

    - spacer: 30

    - promoter: TRE

    - cistron:
        label: state_indicator_off
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: bGH_polyA
