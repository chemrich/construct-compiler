construct:
  name: negative_feedback_output_P_stabilizer
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_P
        expression: medium
        fused: false
        chain:
          - cleavage_site: TEV
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: input_sensor
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1
