construct:
  name: yeast_tunable_repressilator_oscillator
  host: yeast

  backbone:
    catalog_vector: "pRS426"
    resistance: uracil_selection
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Repressor_A
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: GAL10

    - cistron:
        label: Repressor_B
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: ADH1

    - cistron:
        label: Repressor_C
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: pLacO_modified
      # Repressed by Repressor_A (LacI)

    - cistron:
        label: Output_Q
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: CYC1
