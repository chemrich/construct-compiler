construct:
  name: "signal_amplification_cascade_G_to_R"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: Input_G
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - spacer: 30

    - cistron:
        label: Activator_A
        expression: medium
        fused: false
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Activator_B
        expression: medium
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_R
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
