construct:
  name: pH_sensitive_switch_Output_S
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: pH_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CadC
              source: uniprot

    - spacer: 30

    - cistron:
        label: pH_response_regulator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CadBA
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_S
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase

    - terminator: rrnB_T1
