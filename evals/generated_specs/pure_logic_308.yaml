construct:
  name: "quorum_sensing_receiver_module"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: luxR_receiver
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_T
        expression: high
        fused: false
        chain:
          - promoter: luxPR
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
