construct:
  name: "quorum_sensing_receiver_module"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106
    - cistron:
        label: receiver_protein
        expression: medium
        gene:
          id: P12746
          source: uniprot
    - terminator: BBa_B0015
    - promoter: luxI
    - cistron:
        label: activated_output
        expression: high
        gene:
          id: Output_T
    - terminator: rrnB_T1