construct:
  name: "dual_control_output_U_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Output_U
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: Output_U
              source: uniprot

    - terminator: SV40_polyA

    - promoter: TRE  # Tetracycline Response Element (Input_H dependent)

    - cistron:
        label: Protease_from_Input_I
        expression: high
        chain:
          - gene:
              id: TEV_protease
              source: uniprot

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: Input_H_transactivator
        expression: high
        chain:
          - gene:
              id: tTA
              source: uniprot

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: Input_I_protease_inducer
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: degron_for_Output_U
        expression: high
        chain:
          - tag: degron_D-box
          - gene:
              id: Output_U_degron_variant
              source: uniprot

    - terminator: SV40_polyA
