```yaml
construct:
  name: mammalian_cascade_amplifier
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV  # Initial weak promoter for input P

    - cistron:
        label: stage1_transcription_factor
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: Gal4-VP64  # Transcriptional activator
              source: uniprot

    - terminator: rrnB_T1

    - promoter: UAS  # Gal4 responsive promoter - amplifies stage 1 signal

    - cistron:
        label: stage2_transcription_factor  
        expression: high
        chain:
          - tag: HA
          - gene:
              id: dCas9-VPR  # Strong transcriptional activator
              source: uniprot

    - terminator: rrnB_T1

    - promoter: dCas9_target  # Multiple gRNA target sites - strong amplification

    - cistron:
        label: final_output_Q
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen  # Bright fluorescent readout
              source: fpbase

    - terminator: rrnB_T1
```