construct:
  name: mammalian_cascade_amplifier_P_to_Q
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: stage1_intermediate
        expression: medium
        chain:
          - tag: FLAG
          - cleavage_site: 3C
          - gene:
              id: VP16_activation_domain
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: stage2_intermediate
        expression: high
        chain:
          - tag: HA
          - cleavage_site: 3C
          - gene:
              id: synthetic_transactivator
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: stage3_output_Q
        expression: very_high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: mScarlet
              source: fpbase
        fused: false

    - terminator: rrnB_T1
