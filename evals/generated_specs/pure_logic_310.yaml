construct:
  name: "mammalian_neuronal_differentiation_switch"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: master_regulator
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: NEUROD1
              source: uniprot

    - spacer: 25

    - cistron:
        label: feedback_amplifier
        expression: high
        fused: false
        chain:
          - gene:
              id: NEUROD1
              source: uniprot

    - spacer: 25

    - cistron:
        label: differentiation_reporter
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: positive_feedback_promoter
        expression: medium
        fused: false
        chain:
          - gene:
              id: TBR1
              source: uniprot

    - terminator: rrnB_T1
