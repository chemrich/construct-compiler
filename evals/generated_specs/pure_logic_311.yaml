construct:
  name: "yeast_metabolic_bypass_circuit_v"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1 # GAL1 promoter used for high-inducibility ON/OFF control via Input_J (Galactose)
    - cistron:
        label: output_v_diverter
        expression: high
        gene:
          id: Output_V_synthase
          source: uniprot
    - terminator: CYC1