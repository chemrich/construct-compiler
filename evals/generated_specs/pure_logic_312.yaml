construct:
  name: "conditional_membrane_localization_Output_W"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Output_W
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Output_W
              source: uniprot
          # Note: In E. coli, membrane targeting typically requires the Lipobox signal peptide (SPase II substrate)
          # or fusion to outer membrane proteins. MBP provides cytoplasmic localization; for true membrane
          # localization, Output_W should be fused to an outer membrane protein domain or contain an N-terminal
          # Lipobox (LXXC motif). This design assumes Output_W encodes or is fused to a membrane-anchoring domain.

    - spacer: 30

    - cistron:
        label: Input_K
        expression: medium
        fused: false
        gene:
          id: Input_K
          source: uniprot

    - terminator: rrnB_T1
