construct:
  name: "genetic_rheostat_Output_X_Input_L"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: output_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: input_L_repressor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1
