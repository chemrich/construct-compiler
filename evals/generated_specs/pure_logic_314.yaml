construct:
  name: "XOR_logic_circuit_Input_M_Input_N_Output_Y"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD-controlled NOT gate for Input_M
    - cistron:
        label: NOT_M_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
              # tetR represses tetO sequences; acts as NOT gate for Input_M pathway

    - terminator: rrnB_T1

    - promoter: araBAD
      # araBAD-controlled NOT gate for Input_N
    - cistron:
        label: NOT_N_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot
              # cI represses cIR sequences; acts as NOT gate for Input_N pathway

    - terminator: rrnB_T1

    - promoter: lacUV5
      # Dual input promoter: active when (Input_M AND NOT Input_N) OR (NOT Input_M AND Input_N)
    - cistron:
        label: Output_Y_XOR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
              # Output protein; fluorescence indicates XOR logic state

    - terminator: rrnB_T1
