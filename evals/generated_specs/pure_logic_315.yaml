construct:
  name: yeast_oxidative_stress_sensor
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TRX2  # Oxidative stress-responsive promoter induced by Yap1 in yeast
    - cistron:
        label: output_z
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1