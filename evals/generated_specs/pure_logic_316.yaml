construct:
  name: "coli_deadman_kill_switch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Activated by Arabinose (Input P)
    - cistron:
        label: repressor_lacI
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Repressed by LacI; active when Arabinose (Input P) is absent
    - cistron:
        label: toxin_mazF
        expression: high
        gene:
          id: P0AE70
          source: uniprot
    - terminator: BBa_B0015