construct:
  name: "transient_pulse_generator_Input_Q_Output_B"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Input_Q_receptor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TRPA1
              source: uniprot

    - terminator: polyA

    - spacer: 50

    - promoter: CMV

    - cistron:
        label: transient_amplifier
        expression: high
        chain:
          - gene:
              id: NFAT1
              source: uniprot

    - terminator: polyA

    - spacer: 50

    - promoter: NFAT_responsive_element

    - cistron:
        label: pulse_timer
        expression: medium
        chain:
          - gene:
              id: GSK3beta
              source: uniprot

    - terminator: polyA

    - spacer: 50

    - promoter: NFAT_responsive_element

    - cistron:
        label: Output_B
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mCherry
              source: fpbase

    - terminator: polyA
