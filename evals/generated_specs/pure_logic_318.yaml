construct:
  name: mammalian_irreversible_positive_feedback_switch
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: UAS  # Synthetic promoter activated by GAL4-VP16 to create the feedback loop
    - cistron:
        label: Input_R
        expression: high
        gene:
          id: GAL4_VP16
          source: uniprot
    - spacer: 600  # IRES element for polycistronic expression in mammalian cells
    - cistron:
        label: Output_C
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_pA