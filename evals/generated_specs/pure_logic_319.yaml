construct:
  name: "sender_module_cell_communication"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: sender
        expression: high
        chain:
          - gene:
              id: luxI
              source: uniprot

    - spacer: 30

    - cistron:
        label: signal_output
        expression: high
        fused: false
        chain:
          - gene:
              id: Input_S
              source: uniprot

    - terminator: rrnB_T1
