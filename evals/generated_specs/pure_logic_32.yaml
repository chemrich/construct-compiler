construct:
  name: "yeast_bandpass_filter_S_to_R"
  host: yeast

  backbone:
    catalog_vector: "pRS426"
    resistance: uracil
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: S_sensor_high_pass
        expression: high
        chain:
          - gene:
              id: GAL4_DBD_LexA
              source: uniprot

    - spacer: 25

    - cistron:
        label: R_output_bandpass
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: S_sensor_low_pass
        expression: high
        fused: false
        chain:
          - gene:
              id: GAL4_AD_mutant_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: metabolic_sink
        expression: medium
        fused: false
        chain:
          - gene:
              id: invertase_SUC2
              source: uniprot

    - terminator: CYC1
