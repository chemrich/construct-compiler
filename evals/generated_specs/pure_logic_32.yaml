```yaml
construct:
  name: yeast_bandpass_filter_S_to_R
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1  # S-inducible promoter (acts as high-pass)

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - gene:
            id: P0A9E0  # LacI repressor
            source: uniprot

    - terminator: CYC1

    - promoter: GAL1  # Same S-inducible promoter

    - cistron:
        label: output_R
        expression: medium
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
            id: mScarlet
            source: fpbase

    - terminator: ADH1
```