construct:
  name: "not_gate_lac_repression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: input_repressor_A
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac
    - cistron:
        label: output_reporter_B
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015