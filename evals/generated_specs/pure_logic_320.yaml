construct:
  name: "NOT_gate_A_represses_B"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_B
        expression: high
        fused: false
        chain:
          - promoter: lacUV5
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
