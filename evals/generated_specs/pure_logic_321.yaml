construct:
  name: "AND_gate_protein_C"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_C_reporter
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
