construct:
  name: "and_gate_split_t7_logic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Input Signal A (Arabinose)
    - cistron:
        label: t7_rnap_n_terminus
        expression: medium
        fused: false
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Input Signal B (IPTG)
    - cistron:
        label: t7_rnap_c_terminus
        expression: medium
        fused: false
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Logic: requires functional assembly of N and C terminals
    - cistron:
        label: protein_c
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term