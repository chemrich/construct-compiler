construct:
  name: "OR_gate_D_output"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_E_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: LexA
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_F_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_D
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
