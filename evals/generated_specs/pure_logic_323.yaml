construct:
  name: "bistable_memory_toggle_switch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: pTet  # Repressed by TetR; Signal H (aTc) induces to reset the system to OFF
    - cistron:
        label: lacI_repressor
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Repressed by LacI; Signal G (IPTG) induces to trigger the system to ON
    - cistron:
        label: tetR_repressor
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: state_reporter
        fused: false  # Separate translation unit for independent reporter expression
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015