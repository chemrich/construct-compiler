construct:
  name: bistable_memory_toggle
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: memory_output_ON
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: inducible_protease_G
        expression: medium
        fused: false
        chain:
          - gene:
              id: TEV_protease
              source: uniprot

    - spacer: 30

    - cistron:
        label: inducible_protease_H
        expression: medium
        fused: false
        chain:
          - gene:
              id: rhinovirus_3C_protease
              source: uniprot

    - terminator: rrnB_T1
