construct:
  name: "oscillatory_circuit_6h_period"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: repressor_C
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: fluorescent_output
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

  # Configuration notes:
  # This circuit implements a three-stage cascaded negative feedback oscillator.
  # - araBAD promoter drives basal expression of three repressors (LacI, TetR, CI) in sequence
  # - Each repressor inhibits the promoter of the next stage (requires operator sequences upstream of each gene)
  # - The delays in protein synthesis, maturation, and degradation create the oscillatory period (~6-8 hours)
  # - mNeonGreen fluorescent output reports on oscillations in the third repressor's activity
  # - Fine-tuning RBS strengths and adding protease degradation tags (ssrA) on repressors can modulate period
