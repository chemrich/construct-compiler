construct:
  name: "XOR_logic_gate_K_output"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: input_L_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: input_M_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: output_K_XOR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
