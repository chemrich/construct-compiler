construct:
  name: "signal_detector_amplifier_with_positive_feedback"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot
        # LuxR: transcription factor that binds acyl-homoserine lactone (input signal N)

    - spacer: 30

    - cistron:
        label: output_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxI
              source: uniprot
        # LuxI: produces acyl-homoserine lactone (AHL), enabling positive feedback

    - spacer: 30

    - cistron:
        label: output_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
        # Output signal P: strong red fluorescence upon activation

    - terminator: rrnB_T1
