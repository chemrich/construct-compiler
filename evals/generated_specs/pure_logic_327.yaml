construct:
  name: "feedback_amplified_sensor"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Activated by input signal N (Arabinose)
    - cistron:
        label: trigger_polymerase
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Strong promoter for amplification and feedback
    - cistron:
        label: feedback_polymerase
        gene:
          id: P00573
          source: uniprot
    - spacer: 30
    - cistron:
        label: signal_P_output
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term