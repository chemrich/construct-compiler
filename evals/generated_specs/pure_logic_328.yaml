construct:
  name: "NOT_gate_cascade_A_to_C"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: NOT_gate_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: NOT_gate_2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cI
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: output_buffer_C
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: sfGFP
              source: fpbase
        fused: false

    - terminator: rrnB_T1
