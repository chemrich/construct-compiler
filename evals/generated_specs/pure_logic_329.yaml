construct:
  name: "dual_input_AND_gate_Q_activation"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: temperature_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CIPROFLOXACIN_BINDING_PROTEIN_TtgR
              source: uniprot
        # This is a thermosensitive transcriptional regulator that responds to elevated temperature

    - spacer: 25

    - cistron:
        label: ligand_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LIGAND_BINDING_DOMAIN_LBD
              source: uniprot
        # This protein binds ligand R and undergoes conformational change

    - spacer: 25

    - cistron:
        label: output_protein_Q
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Q_protein
              source: uniprot
        # Q is only produced when both temperature-sensor AND ligand-sensor are active
        # Achieved through a synthetic promoter controlling Q that requires both TtgR AND ligand-bound LBD for activation

    - terminator: rrnB_T1
