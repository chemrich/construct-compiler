```yaml
construct:
  name: genetic_set_reset_latch_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483  # TetR repressor
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: EF1_alpha
    
    - cistron:
        label: cI_repressor
        expression: medium
        gene:
          id: P03034  # Lambda cI repressor
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: CMV  # Set promoter - induces tetR when doxycycline present
    
    - cistron:
        label: set_response
        expression: high
        gene:
          id: P04483  # TetR (activated by doxycycline to repress cI)
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: EF1_alpha  # Reset promoter - induces cI when IPTG present
    
    - cistron:
        label: reset_response  
        expression: high
        gene:
          id: P03034  # Lambda cI (activated by IPTG to repress tetR)
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: CMV  # Output promoter - repressed by cI, drives mEGFP (ON state)
    
    - cistron:
        label: output_on
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: EF1_alpha  # Constitutive promoter for OFF state reporter
    
    - cistron:
        label: output_off
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    
    - terminator: rrnB_T1
```