construct:
  name: "T_Flip_Flop_Genetic_Toggle"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: toggle_switch_A
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: toggle_switch_B
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
