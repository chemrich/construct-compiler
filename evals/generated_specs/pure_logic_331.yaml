construct:
  name: "sender_receiver_distributed_logic"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassettes:
    - name: "sender_cell_A"
      cassette:
        - promoter: araBAD

        - cistron:
            label: input_sensor
            expression: medium
            chain:
              - tag: 6xHis
              - gene:
                  id: araC
                  source: uniprot

        - spacer: 25

        - cistron:
            label: signaling_molecule_U
            expression: high
            fused: false
            chain:
              - gene:
                  id: luxI
                  source: uniprot

        - terminator: rrnB_T1

    - name: "receiver_cell_B"
      cassette:
        - promoter: araBAD

        - cistron:
            label: U_receptor
            expression: medium
            chain:
              - tag: 6xHis
              - gene:
                  id: luxR
                  source: uniprot

        - spacer: 25

        - cistron:
            label: output_W
            expression: high
            fused: false
            chain:
              - gene:
                  id: gfp
                  source: fpbase

        - terminator: rrnB_T1
