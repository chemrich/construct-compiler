construct:
  name: "signal_multiplexer_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: "signal_A_input"
    
    - cistron:
        label: "repressor_for_C"
        expression: high
        gene:
          id: "tetR"
          source: "uniprot"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      label: "signal_C_input"
    
    - cistron:
        label: "anti_repressor"
        expression: high
        gene:
          id: "cI"
          source: "uniprot"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
      label: "output_B_promoter"
    
    - cistron:
        label: "output_B"
        expression: high
        fused: false
        gene:
          id: "mScarlet"
          source: "fpbase"
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: tac
      label: "output_D_promoter"
    
    - cistron:
        label: "output_D"
        expression: high
        fused: false
        gene:
          id: "mNeonGreen"
          source: "fpbase"
    
    - terminator: rrnB_T1
