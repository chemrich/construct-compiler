construct:
  name: frequency_detector_0p1_to_0p5_Hz
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_receptor_F
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TcsL
              source: uniprot
        # TcsL is a two-component histidine kinase that phosphorylates in response to external signals

    - spacer: 30

    - cistron:
        label: frequency_filter
        expression: high
        chain:
          - gene:
              id: CheZ
              source: uniprot
        # CheZ provides temporal filtering via phosphatase activity with tunable dephosphorylation kinetics

    - spacer: 30

    - cistron:
        label: band_pass_oscillator
        expression: high
        chain:
          - gene:
              id: repressilator_component_A
              source: uniprot
        # Synthetic oscillator with period ~5-10 seconds (0.1-0.2 Hz range)

    - spacer: 30

    - cistron:
        label: output_E
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase
        # Output reporter only expressed when input F frequency matches band-pass window (0.1-0.5 Hz)

    - terminator: rrnB_T1
