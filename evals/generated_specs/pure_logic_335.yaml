construct:
  name: "analog_to_digital_signal_converter_G_to_H"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: G_receptor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: luxR
              source: uniprot
        # luxR acts as the analog sensor: binds acyl-homoserine lactone (proxy for G)
        # Conformational change upon G binding acts as threshold detector

    - spacer: 25

    - cistron:
        label: output_H
        expression: medium
        fused: false
        # H output protein; expression controlled by luxR-regulated Plux promoter
        # This represents the digital output controlled by the G-sensing circuit
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
