construct:
  name: "metabolic_load_balancing_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: "pathway_A_detector"
    
    - cistron:
        label: "signal_integrator_I"
        expression: medium
        gene:
          id: luxR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
      label: "pathway_B_activation_on_high_I"
    
    - cistron:
        label: "pathway_B_activator"
        expression: high
        fused: false
        gene:
          id: araC
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
      label: "pathway_B_detector"
    
    - cistron:
        label: "signal_integrator_J"
        expression: medium
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
      label: "pathway_A_activation_on_high_J"
    
    - cistron:
        label: "pathway_A_activator"
        expression: high
        fused: false
        gene:
          id: crp
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      label: "basal_pathway_K_low_load"
    
    - cistron:
        label: "pathway_K_basal"
        expression: low
        fused: false
        gene:
          id: fabA
          source: uniprot
    
    - terminator: rrnB_T1
