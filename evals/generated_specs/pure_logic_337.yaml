construct:
  name: "protein_L_negative_feedback_loop"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: L_main
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: L_repressor_target
        expression: medium
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: feedback_sensor
        expression: low
        fused: false
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1
