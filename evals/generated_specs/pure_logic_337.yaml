construct:
  name: "negative_feedback_protein_l_autoregulation"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # T7lac is repressed by LacI, creating the negative feedback loop
    - cistron:
        label: protein_l_regulator
        expression: medium
        gene:
          id: P03023  # LacI is used as the regulator protein 'L' to implement negative feedback on the T7lac promoter
          source: uniprot
    - terminator: T7term