construct:
  name: "light_NAND_gate"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CRY2
              source: uniprot

    - spacer: 25

    - cistron:
        label: red_light_sensor
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: 3C
          - gene:
              id: PhyB
              source: uniprot

    - spacer: 25

    - cistron:
        label: NAND_output
        expression: high
        chain:
          - tag: HA
          - cleavage_site: Factor_Xa
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
