construct:
  name: "event_counter_3pulse_detector"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: counter_kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: histidine_kinase_counter
              source: uniprot

    - spacer: 25

    - cistron:
        label: response_regulator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: response_regulator_phosphatase
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ssrA  # C-terminal degradation tag for rapid turnover

    - terminator: rrnB_T1
