```yaml
construct:
  name: genetic_event_counter_3pulse
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: counter_integrase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P1_CRE
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_protein
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ssrA  # degradation tag for pulse counting reset

    - terminator: rrnB_T1
```