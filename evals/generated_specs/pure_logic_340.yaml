construct:
  name: "AND_gate_dual_inducer_ecoli"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # araBAD responds to L-arabinose (inducer_A)
    
    - cistron:
        label: activator_protein
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
              # araC is the arabinose operon regulatory protein
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      # lacUV5 responds to IPTG (inducer_B) when combined with araC activity
    
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
