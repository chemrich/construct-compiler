construct:
  name: "and_gate_split_t7_sfgfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: araBAD  # Induced by Inducer A (L-Arabinose)
    - cistron:
        label: t7_rnap_n_terminal
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Induced by Inducer B (IPTG)
    - cistron:
        label: t7_rnap_c_terminal
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Requires both T7 fragments to assemble for activity
    - cistron:
        label: visible_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015