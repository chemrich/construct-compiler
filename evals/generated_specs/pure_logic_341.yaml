construct:
  name: "high_gain_NOT_gate_cytotoxic"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LacI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ssrA_degron

    - spacer: 25

    - cistron:
        label: cytotoxin
        expression: high
        chain:
          - gene:
              id: ccdB
              source: uniprot

    - spacer: 25

    - cistron:
        label: inducer_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1
