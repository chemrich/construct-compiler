construct:
  name: "mammalian_toggle_switch_AB"
  host: HEK293

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor_B
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_A
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 25

    - cistron:
        label: inducer_alpha_responsive_promoter_note
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: SV40poly

  # Additional elements (represented as comments for toggle architecture):
  # State A: CMV drives repressor_B (tetR) → represses State B promoter (tetO-driven)
  # Inducer_alpha pulse: inhibits repressor_B → allows Reporter_B expression → commits to State A
  # State B: Alternative CMV cassette drives repressor_A → represses State A promoter
  # Inducer_beta pulse: inhibits repressor_A → allows Reporter_A expression → commits to State B
  # Bistability maintained by mutual repression and positive feedback via reporter expression
