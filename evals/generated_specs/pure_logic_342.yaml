construct:
  name: "mammalian_robust_toggle_switch"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE_tight  # Inducible by Doxycycline (inducer_alpha); repressed by TetR
    - cistron:
        label: state_a_logic
        chain:
          - gene:
              id: "P03023"  # LacI (Repressor B)
              source: uniprot
          - cleavage_site: P2A
          - gene:
              id: "mCherry"
              source: fpbase
    - terminator: bGH_PA
    - promoter: CMV_LacO   # Inducible by IPTG (inducer_beta); repressed by LacI
    - cistron:
        label: state_b_logic
        chain:
          - gene:
              id: "P04483"  # TetR (Repressor A)
              source: uniprot
          - cleavage_site: P2A
          - gene:
              id: "mEGFP"
              source: fpbase
    - terminator: SV40_PA