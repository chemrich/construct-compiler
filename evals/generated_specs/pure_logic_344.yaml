construct:
  name: "E_coli_heavy_metal_threshold_detector"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: metal_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MerR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: threshold_switch
        expression: medium
        chain:
          - gene:
              id: lexA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1

  # Design rationale:
  # MerR acts as metal-dependent transcriptional regulator: binds operator DNA in presence of Hg2+/Pb2+/etc
  # lexA produces repressor protein that maintains reporter OFF state in absence of metal
  # When metal_ion_X concentration exceeds threshold, MerR undergoes conformational change
  # MerR-metal complex activates SOS response cascade, leading to lexA auto-cleavage and RecA-mediated degradation
  # Sharp depletion of lexA repressor causes rapid ON switching of reporter gene
  # Result: steep threshold with minimal leakage (digital switch behavior)
