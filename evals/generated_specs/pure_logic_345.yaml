construct:
  name: "sequential_logic_circuit_ABC"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Step A: arabinose-inducible enzyme A with auto-repressor
    - cistron:
        label: step_A_enzyme
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: cI
              source: uniprot

    - spacer: 35

    - promoter: T7lac
      # Step B: induced by removal of LacI/CI repression; produces enzyme B and tetR repressor
    - cistron:
        label: step_B_enzyme
        expression: high
        chain:
          - gene:
              id: dioxygenase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: tetR
              source: uniprot

    - spacer: 35

    - promoter: T7lac
      # Step C: induced by removal of TetR repression; produces enzyme C and lacZ reporter for visual confirmation
    - cistron:
        label: step_C_enzyme
        expression: high
        chain:
          - gene:
              id: monooxygenase
              source: uniprot

    - spacer: 35

    - cistron:
        label: reporter_C_confirmation
        expression: high
        fused: false
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
