construct:
  name: type1_feedforward_loop_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: inducer_Z
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: dCas9_VP64
              source: uniprot

    - spacer: 30

    - cistron:
        label: Activator_X
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: tTA_codon_optimized
              source: uniprot

    - spacer: 30

    - cistron:
        label: Reporter_Y
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
