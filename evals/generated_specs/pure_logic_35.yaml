construct:
  name: "temperature_controlled_genetic_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: thermosensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cI857
              source: uniprot

    - spacer: 25

    - cistron:
        label: output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
