```yaml
construct:
  name: temperature_controlled_genetic_switch
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # Temperature-inducible promoter system

    - cistron:
        label: temperature_sensor
        expression: medium
        chain:
          - gene:
              id: P0A1X3  # E. coli TlpA thermosensor protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_protein
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP  # Visual output indicator
              source: fpbase

    - terminator: rrnB_T1
```