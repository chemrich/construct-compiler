construct:
  name: "NAND_gate_growth_factor_failsafe"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # Constitutive growth factor expression

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ_alpha
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD
      # Temperature-sensing repressor (conditional)

    - cistron:
        label: temp_sensor
        expression: medium
        chain:
          - gene:
              id: cspA
              source: uniprot
              # Cold shock protein A as temperature sensor

    - terminator: rrnB_T1

    - promoter: T7lac
      # Nutrient stress sensor

    - cistron:
        label: nutrient_sensor
        expression: medium
        chain:
          - gene:
              id: relA
              source: uniprot
              # Stringent response protein for nutrient stress detection

    - terminator: rrnB_T1

    - promoter: araBAD
      # NAND logic: dual repressor only active when both signals present

    - cistron:
        label: dual_repressor
        expression: low
        chain:
          - gene:
              id: lacI
              source: uniprot
              # LacI repressor of growth_factor promoter, activated by both sensors

    - terminator: rrnB_T1
