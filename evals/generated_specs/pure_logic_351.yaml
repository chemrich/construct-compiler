construct:
  name: "yeast_OR_gate_metabolite_X_drug_Y"
  host: yeast

  backbone:
    catalog_vector: "pRS426"
    resistance: uracil
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: sensor_metabolite_X
        expression: high
        chain:
          - gene:
              id: SNF3
              source: uniprot

    - spacer: 30

    - cistron:
        label: sensor_drug_Y
        expression: high
        chain:
          - gene:
              id: PDR5
              source: uniprot

    - spacer: 30

    - cistron:
        label: transcription_factor_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
