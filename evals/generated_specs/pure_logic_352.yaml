construct:
  name: mammalian_time_delay_apoptosis_circuit
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: doxycycline_regulated_transactivator
        expression: high
        chain:
          - tag: HA
          - gene:
              id: rtTA3
              source: uniprot

    - spacer: 30

    - cistron:
        label: timer_protein
        expression: high
        chain:
          - gene:
              id: degron_fused_caspase3
              source: uniprot

    - spacer: 30

    - cistron:
        label: time_delay_stabilizer
        expression: medium
        chain:
          - gene:
              id: phosphodiesterase_PDE4D8
              source: uniprot

    - spacer: 30

    - cistron:
        label: feedback_timer
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: titin_degradation_domain
              source: uniprot

    - terminator: rrnB_T1
