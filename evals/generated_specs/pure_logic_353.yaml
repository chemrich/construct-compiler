construct:
  name: "mammalian_2to4_decoder"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Input_A
        expression: high
        chain:
          - tag: HA
          - gene:
              id: rtTA3
              source: uniprot

    - terminator: SV40_poly_A

    - promoter: CMV

    - cistron:
        label: Input_B
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: tTA
              source: uniprot

    - terminator: SV40_poly_A

    - promoter: TRE

    - cistron:
        label: Output_00
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40_poly_A

    - promoter: TRE_tight

    - cistron:
        label: Output_01
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: SV40_poly_A

    - promoter: TRE_tight

    - cistron:
        label: Output_10
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: SV40_poly_A

    - promoter: TRE_tight

    - cistron:
        label: Output_11
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: SV40_poly_A
