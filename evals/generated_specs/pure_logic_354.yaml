construct:
  name: "E_coli_SR_latch_memory"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      label: "Set_Input_promoter"

    - cistron:
        label: "CI_repressor"
        expression: high
        chain:
          - gene:
              id: "CI"
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      label: "lysis_promoter"

    - cistron:
        label: "Cro_protein"
        expression: high
        chain:
          - gene:
              id: "Cro"
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      label: "memory_storage_promoter"

    - cistron:
        label: "CI_integrase"
        expression: medium
        chain:
          - gene:
              id: "int"
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD
      label: "Reset_Input_promoter"

    - cistron:
        label: "Flp_recombinase"
        expression: high
        chain:
          - gene:
              id: "Flp"
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      label: "reporter_promoter"

    - cistron:
        label: "reporter_gene"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "mEGFP"
              source: fpbase

    - terminator: rrnB_T1
