construct:
  name: "pH_responsive_bandpass_filter"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: tac # tac promoter substituted for pH-logic; a functional band-pass requires a dual-input logic gate (e.g., CadR activator and Asr repressor)
    - cistron:
        label: reporter_output
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: rrnB_T1