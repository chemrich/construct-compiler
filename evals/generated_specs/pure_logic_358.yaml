construct:
  name: "XOR_gate_osmotic_oxidative_stress"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: sensor_A_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: OmpR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: sensor_B_activator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: SoxR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: AND_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
