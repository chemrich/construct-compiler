construct:
  name: pH_responsive_ON_gate_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: pH_sensor
        expression: high
        chain:
          - gene:
              id: PHO4
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_W
        expression: high
        fused: false
        chain:
          - tag: HA
          - solubility_tag: GFP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase
        # Cell-surface localization via yeast alpha-factor secretion signal
        localization: alpha_factor_secretion_signal

    - terminator: CYC1
