```yaml
construct:
  name: pH_responsive_ON_gate_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: PHO5  # pH-responsive promoter, activated under acidic conditions

    - cistron:
        label: pH_sensor_output
        expression: high
        chain:
          - tag: alpha_factor_signal  # secretion signal for yeast
          - tag: GPI_anchor  # cell-surface localization
          - gene:
              id: W  # output protein W
              source: uniprot

    - terminator: CYC1
```