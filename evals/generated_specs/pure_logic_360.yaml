construct:
  name: "inducible_on_off_switch"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # araBAD selected for minimal leakiness; Inducer_A = Arabinose
    - cistron:
        label: reporter_x
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1