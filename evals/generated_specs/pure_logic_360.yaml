construct:
  name: "inducible_ON_OFF_switch"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD

    - cistron:
        label: reporter_X
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: msfGFP
              source: fpbase

    - terminator: rrnB_T1
