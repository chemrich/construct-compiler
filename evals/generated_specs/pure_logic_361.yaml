construct:
  name: transcriptional_AND_gate
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is repressed by AraC; activated by arabinose (Inducer_B)

    - cistron:
        label: AraC_TF
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      # lacUV5 is repressed by LacI; activated by IPTG (Inducer_C)

    - cistron:
        label: LacI_repressor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
      # AND gate logic: araBAD output promoter activated by AraC+arabinose,
      # but also controlled by LacI repression. Output only when both inducers present.

    - cistron:
        label: Reporter_Z
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
