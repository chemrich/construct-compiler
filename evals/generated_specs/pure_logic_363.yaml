construct:
  name: "not_gate_inverter_f_w"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Inducer_F (Arabinose) triggers expression of the repressor
    - cistron:
        label: repressor_logic
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Repressed by LacI; active only when Inducer_F is absent
    - cistron:
        label: reporter_W
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015