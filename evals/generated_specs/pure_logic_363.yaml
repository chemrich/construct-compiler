construct:
  name: NOT_gate_inverter
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_protein
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_W
        expression: medium
        fused: false
        chain:
          - promoter: Ptet

    - cistron:
        label: output_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
