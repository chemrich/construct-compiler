construct:
  name: XOR_logic_gate_reporter_G
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: repressor_J
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
    
    - cistron:
        label: repressor_K
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
    
    - cistron:
        label: reporter_G
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
