construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    # State 1: LacI repressor (inhibits State 2)
    - cistron:
        label: LacI_State1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    # State 2: TetR repressor (inhibits State 1)
    - cistron:
        label: TetR_State2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    # Set Pulse input: AraBAD-driven Cre recombinase to flip State 1 ON
    - promoter: araBAD

    - cistron:
        label: Set_Pulse_Cre
        expression: high
        chain:
          - gene:
              id: cre
              source: uniprot

    - spacer: 25

    # Reset Pulse input: rhamnose-driven Flp recombinase to flip State 2 ON
    - promoter: T7lac

    - cistron:
        label: Reset_Pulse_Flp
        expression: high
        chain:
          - gene:
              id: flp
              source: uniprot

    - spacer: 25

    # State 1 Reporter: mGFP (active when State 1 is ON)
    - promoter: T7lac

    - cistron:
        label: State1_Reporter
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    # State 2 Reporter: mCherry (active when State 2 is ON)
    - promoter: T7lac

    - cistron:
        label: State2_Reporter
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
