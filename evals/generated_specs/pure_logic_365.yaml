construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: P_L_tetO_1 # Repressed by TetR; Induced by aTc (Set_Pulse)
    - cistron:
        label: state1_repressor
        expression: high
        gene:
          id: P03023 # LacI
          source: uniprot
    - spacer: 30
    - cistron:
        label: state1_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: lacUV5 # Repressed by LacI; Induced by IPTG (Reset_Pulse)
    - cistron:
        label: state2_repressor
        expression: high
        gene:
          id: P04483 # TetR
          source: uniprot
    - spacer: 30
    - cistron:
        label: state2_reporter
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015