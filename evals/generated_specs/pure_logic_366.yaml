construct:
  name: "self_regulating_oscillatory_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: delay_protein
        expression: medium
        chain:
          - gene:
              id: ssrA
              source: uniprot

    - spacer: 30

    - cistron:
        label: Pulse_Reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - cistron:
        label: activator_protease
        expression: medium
        chain:
          - gene:
              id: lon
              source: uniprot

    - terminator: rrnB_T1
