construct:
  name: "genetic_comparator_small_molecule_detector"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
        # araC senses arabinose (Concentration_A input)

    - spacer: 25

    - cistron:
        label: sensor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: malT
              source: uniprot
        # malT senses maltose (Concentration_B input)

    - spacer: 25

    - cistron:
        label: high_A_output
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
        # Expressed when araC >> malT (High_A_Reporter)

    - spacer: 25

    - cistron:
        label: high_B_output
        expression: medium
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
        # Expressed when malT >> araC (High_B_Reporter)

    - spacer: 25

    - cistron:
        label: equal_output
        expression: medium
        fused: false
        gene:
          id: sfGFP
          source: fpbase
        # Expressed when araC ≈ malT (Equal_Reporter)

    - terminator: rrnB_T1
