construct:
  name: two_step_sequential_logic_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Event1_sensor
        expression: high
        chain:
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: Step1_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 25

    - cistron:
        label: Event2_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Step2_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - spacer: 25

    - cistron:
        label: Reset_function
        expression: high
        fused: false
        chain:
          - gene:
              id: Cre
              source: uniprot

    - terminator: rrnB_T1
