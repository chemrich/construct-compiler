construct:
  name: "sequential_logic_circuit"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Event1_Input (Arabinose inducible)
    - cistron:
        label: Step1_Reporter
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 30
    - promoter: tac     # Event2_Input (IPTG inducible; functional AND logic with Step 1 assumed via molecular mechanism)
    - cistron:
        label: Step2_Reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - promoter: tet     # Reset_Input (Anhydrotetracycline inducible)
    - cistron:
        label: Reset_Mechanism
        expression: medium
        gene:
          id: P06956    # Cre recombinase for circuit reset/excision
          source: uniprot
    - terminator: rrnB_T1