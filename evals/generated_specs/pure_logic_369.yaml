construct:
  name: "quorum_sensing_amplifier"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: QS_synthase
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: luxI
              source: uniprot

    - spacer: 25

    - cistron:
        label: QS_regulator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: signal_peptide_output
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Sec_signal_peptide
              source: uniprot

    - terminator: rrnB_T1
