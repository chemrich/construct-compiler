```yaml
construct:
  name: dual_light_AND_gate_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: CRY2_PHR
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: CRY2-PHR
              source: uniprot

    - spacer: 30

    - cistron:
        label: CIB1_VP16
        expression: medium
        fused: false
        chain:
          - gene:
              id: CIB1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: VP16  # transcriptional activator domain

    - spacer: 30

    - cistron:
        label: PhyB_DBD
        expression: medium
        fused: false
        chain:
          - gene:
              id: PHYB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: GAL4_DBD  # DNA binding domain

    - spacer: 30

    - cistron:
        label: PIF3
        expression: medium
        fused: false
        gene:
          id: PIF3
          source: uniprot

    - terminator: BGH_pA

    - promoter: GAL4_UAS  # synthetic promoter with GAL4 binding sites

    - cistron:
        label: output_protein
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NES  # Nuclear Export Signal

    - terminator: BGH_pA
```