construct:
  name: light_inducible_AND_gate_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: blue_light_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CRY2
              source: uniprot

    - terminator: WPRE

  cassette_2:
    - promoter: CMV

    - cistron:
        label: red_light_sensor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: phyB
              source: uniprot

    - terminator: WPRE

  cassette_3:
    - promoter: CMV

    - cistron:
        label: output_AND_gate
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NES

    - terminator: WPRE
