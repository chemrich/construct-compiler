construct:
  name: "blue_light_inducible_therap_p"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: pEL222 # Blue light-inducible promoter (EL222-responsive)
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Therap_P
              source: uniprot
    - terminator: T7term