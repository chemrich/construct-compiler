construct:
  name: "mammalian_therap_x_inducible_switch"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
    
    - cistron:
        label: transactivator
        expression: high
        chain:
          - gene:
              id: rtTA3
              source: uniprot
    
    - terminator: WPRE
    
    - spacer: 50
    
    - promoter: TRE
    
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: IgG_leader
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Therap_X
              source: uniprot
    
    - terminator: WPRE
