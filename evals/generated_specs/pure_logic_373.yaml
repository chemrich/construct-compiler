construct:
  name: "cell_free_rna_sensing_module"
  host: in_vitro
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7  # T7 promoter is used for high-yield in vitro transcription
    - cistron:
        label: Reporter_R
        expression: high
        # Note: Functional sensing (e.g., toehold switch) is typically implemented in the 5' UTR,
        # which is not explicitly modeled in this schema. This cistron represents the reporter output.
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term