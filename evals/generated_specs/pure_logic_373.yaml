construct:
  name: "cell_free_RNA_sensing_module"
  host: in_vitro

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: toehold_switch_riboregulator
        expression: high
        chain:
          - gene:
              id: toehold_switch_Target_RNA
              source: custom
        # Comment: toehold switch RNA structure encodes riboregulator that activates translation of Reporter_R only upon Target_RNA binding

    - spacer: 25

    - cistron:
        label: Reporter_R
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: replication_factor
        expression: medium
        fused: false
        chain:
          - gene:
              id: T7_RNA_polymerase
              source: uniprot

    - terminator: rrnB_T1
