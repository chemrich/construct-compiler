construct:
  name: "plant_drought_pathogen_AND_circuit"
  host: algae

  backbone:
    resistance: spectinomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: J23106

    - cistron:
        label: AND_gate_input_D
        expression: medium
        chain:
          - gene:
              id: Input_D
              source: uniprot

    - spacer: 25

    - cistron:
        label: AND_gate_input_P
        expression: medium
        chain:
          - gene:
              id: Input_P
              source: uniprot

    - spacer: 25

    - cistron:
        label: Resist_G
        expression: high
        chain:
          - tag: chloroplast_transit_peptide
          - gene:
              id: Resist_G
              source: uniprot

    - terminator: rrnB_T1
