construct:
  name: "Delayed_Reporter_Circuit_90min"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: delay_element
        expression: high
        chain:
          - gene:
              id: araBAD_repressor
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: time_integrator
        expression: medium
        chain:
          - gene:
              id: recA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: delayed_reporter_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
