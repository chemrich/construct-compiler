construct:
  name: "genetic_memory_toggle_module"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: CI_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Cro_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Cro
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Write_ON_Input
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PhageT7RNAP
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Write_OFF_Input
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PhageLambdaRecombinase
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Readout_Reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
