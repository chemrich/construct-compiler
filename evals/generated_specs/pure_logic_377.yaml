construct:
  name: "two_of_three_threshold_logic_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Input_1_sensor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Input_2_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: Input_3_sensor
        expression: high
        chain:
          - gene:
              id: rhaSR
              source: uniprot

    - spacer: 25

    - cistron:
        label: logic_integrator
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: Above_Threshold_Reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - cistron:
        label: Below_Threshold_Reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
