construct:
  name: "Therap_Z_stability_control_system"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Therap_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Therap_Z
              source: uniprot

    - spacer: 30

    - cistron:
        label: degron_fusion
        expression: high
        fused: false
        chain:
          - gene:
              id: ssrA_degron
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Stabilizer_S_binding_domain
              source: uniprot

    - spacer: 30

    - cistron:
        label: protease
        expression: medium
        fused: false
        gene:
          id: Lon_protease
          source: uniprot

    - terminator: rrnB_T1
