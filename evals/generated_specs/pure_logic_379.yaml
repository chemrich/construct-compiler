construct:
  name: "spatial_boundary_patterning_circuit"
  host: mammalian
  
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: sender
        expression: high
        chain:
          - tag: HA
          - gene:
              id: wnt3a
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: receiver
        expression: high
        fused: false
        chain:
          - gene:
              id: frizzled_7
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: boundary_reporter
        expression: medium
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
