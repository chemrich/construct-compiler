construct:
  name: sender_receiver_system_part1
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
  - promoter: araBAD
  - cistron:
      label: input_sensor
      expression: high
      chain:
      - gene:
          id: luxR
          source: uniprot
  - spacer: 30
  - cistron:
      label: signal_molecule
      expression: high
      chain:
      - cleavage_site: TEV
      - gene:
          id: luxI
          source: uniprot
  - terminator: rrnB_T1
