construct:
  name: two_input_AND_logic_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AraC
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_AND_gate
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
