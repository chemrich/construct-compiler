construct:
  name: NOT_logic_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: repressor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 20
    
    - promoter: lacUV5
    
    - cistron:
        label: output
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
