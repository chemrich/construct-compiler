construct:
  name: two_input_XOR_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tet_repressor_TetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: XOR_output
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
