construct:
  name: bistable_toggle_switch
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      label: set_input
    
    - cistron:
        label: tetR_repressor
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac
      label: reset_input

    - cistron:
        label: cI_repressor
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      label: output_a

    - cistron:
        label: output_state_tetR_regulated
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: tac
      label: output_b

    - cistron:
        label: output_state_cI_regulated
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
