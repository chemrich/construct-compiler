construct:
  name: "genetic_oscillator_negative_feedback"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_signal
        expression: medium
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: time_delay_protein
        expression: medium
        fused: false
        chain:
          - gene:
              id: ssrA_tag
              source: uniprot

    - spacer: 25

    - cistron:
        label: degradation_tag
        expression: low
        fused: false
        chain:
          - gene:
              id: lon_protease
              source: uniprot

    - terminator: rrnB_T1
