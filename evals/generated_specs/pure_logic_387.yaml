construct:
  name: positive_feedback_amplifier
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 25

    - cistron:
        label: feedback_loop
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot

    - spacer: 25

    - cistron:
        label: stabilizer
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: cro
              source: uniprot

    - terminator: rrnB_T1
