construct:
  name: positive_feedback_memory_amplifier
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: trigger_polymerase
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: feedback_loop_polymerase
        expression: high
        gene:
          id: P00573
          source: uniprot
    - spacer: 30
    - cistron:
        label: memory_reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term