construct:
  name: "cascaded_not_gates_delay_chain"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive input starts the cascade
    - cistron:
        label: inverter_1_lacI
        gene:
          id: lacI
          source: uniprot
    - terminator: BBa_B0015
    - spacer: 40
    - promoter: lacUV5  # Repressed by LacI
    - cistron:
        label: inverter_2_tetR
        gene:
          id: tetR
          source: uniprot
    - terminator: BBa_B0015
    - spacer: 40
    - promoter: P_tet  # Repressed by TetR
    - cistron:
        label: inverter_3_cI
        gene:
          id: cI
          source: uniprot
    - terminator: BBa_B0015
    - spacer: 40
    - promoter: lambda_pR  # Repressed by cI
    - cistron:
        label: reporter_output
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015