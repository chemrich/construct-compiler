construct:
  name: cascaded_NOT_gate_chain
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: NOT_gate_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: NOT_gate_2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: NOT_gate_3_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot
    
    - terminator: rrnB_T1
