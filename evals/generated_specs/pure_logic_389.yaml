construct:
  name: "two_to_four_decoder_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_sensor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_sensor_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rhamnose_operon_regulator
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_pathway_1
        expression: high
        chain:
          - gene:
              id: mGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: output_pathway_2
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 25

    - cistron:
        label: output_pathway_3
        expression: high
        chain:
          - gene:
              id: mYFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: output_pathway_4
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
