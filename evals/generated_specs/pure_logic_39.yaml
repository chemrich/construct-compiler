construct:
  name: "S_cerevisiae_3input_decoder_O1_O3_O5"
  host: yeast

  backbone:
    catalog_vector: "pRS415"
    resistance: none
    ori: CEN6
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: O1_decoder_001
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_PEST

    - spacer: 25

    - cistron:
        label: O3_decoder_011
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_PEST

    - spacer: 25

    - cistron:
        label: O5_decoder_101
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_PEST

    - terminator: T7term
