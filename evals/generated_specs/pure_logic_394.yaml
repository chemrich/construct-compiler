construct:
  name: "single_bit_event_counter_toggle"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Induced by IPTG/repressed by LacI; acts as set/reset input for the toggle
    - cistron:
        label: repressor_A
        gene:
          id: P04483  # TetR
          source: uniprot
    - promoter: Ptet  # Repressed by TetR; part of the mutual inhibition bistable loop
    - cistron:
        label: repressor_B
        gene:
          id: P03023  # LacI
          source: uniprot
    - spacer: 40
    - cistron:
        label: state_reporter
        fused: false  # Separate translation to report the current bit state (ON/OFF)
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1