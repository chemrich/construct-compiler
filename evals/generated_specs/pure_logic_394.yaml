construct:
  name: single_bit_event_counter
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PhoQ
              source: uniprot

    - spacer: 25

    - cistron:
        label: toggle_switch
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: CheY
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
