construct:
  name: timing_delay_circuit
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: delay_integrator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_actuator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - spacer: 25

    - cistron:
        label: timing_buffer
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: cAMP_receptor_protein
              source: uniprot

    - terminator: rrnB_T1
