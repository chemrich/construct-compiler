construct:
  name: "master_enable_gated_outputs"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # T7lac serves as the 'Enable' switch, requiring IPTG-induced T7 RNA Polymerase from the BL21(DE3) host
    - cistron:
        label: output_X
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: output_Y
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term