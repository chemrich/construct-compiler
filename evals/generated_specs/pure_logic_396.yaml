construct:
  name: conditional_activation_system_enable_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: Enable_regulator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_X_activator
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_Y_activator
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: malT
              source: uniprot

    - spacer: 30

    - cistron:
        label: Output_X_protein
        expression: low
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - cistron:
        label: Output_Y_protein
        expression: low
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
