construct:
  name: "unidirectional_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: integrase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: phiC31_integrase
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_sensor
        expression: medium
        chain:
          - gene:
              id: AraC
              source: uniprot

    - spacer: 30

    - cistron:
        label: output_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: recombination_directionality_factor
        expression: medium
        fused: false
        chain:
          - gene:
              id: phiC31_rdf
              source: uniprot

    - terminator: rrnB_T1
