construct:
  name: "genetic_full_adder_logic"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: sum_output_S
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: araBAD
    - cistron:
        label: carry_out_output_Cout
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015