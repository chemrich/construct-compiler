```yaml
construct:
  name: bistable_toggle_switch_NLS
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    
    - cistron:
        label: repressor1_output
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: TetR
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 200

    - promoter: tetO  # tetracycline operator, repressed by TetR
    
    - cistron:
        label: repressor2_output  
        expression: high
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: LacI
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 200

    - promoter: lacO  # lac operator, repressed by LacI (completes the mutual repression loop)
    
    - cistron:
        label: feedback_repressor
        expression: high
        fused: false
        gene:
          id: TetR
          source: uniprot

    - terminator: rrnB_T1
```