```yaml
construct:
  name: small_molecule_AND_gate_fluorescent_reporter
  host: e_coli

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: araBAD  # activated by arabinose (molecule X)

    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P0A0D1  # TetR repressor
          source: uniprot

    - terminator: rrnB_T1

    - promoter: J23100  # constitutive promoter for TetR-regulated circuit

    - cistron:
        label: tet_operator_gfp
        expression: high
        chain:
          - gene:
              id: mEGFP  # repressed by TetR, derepressed by tetracycline/aTc (molecule Y)
              source: fpbase

    - terminator: rrnB_T1
```