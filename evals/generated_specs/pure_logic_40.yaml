construct:
  name: "genetic_AND_gate_XY_reporter"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: X_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: XylR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Y_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AraC
              source: uniprot

    - spacer: 30

    - promoter: pXyl

    - cistron:
        label: AND_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
