construct:
  name: "NOT_gate_input_repressed_output"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      label: "constitutive_repressor"

    - cistron:
        label: repressor
        expression: high
        gene:
          id: tetR
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      label: "repressed_output"
      regulation:
        type: repressed_by
        factor: tetR

    - cistron:
        label: output
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
