construct:
  name: "AND_gate_two_input_cooperative"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ActivatorA
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot
        # luxR senses acyl-homoserine lactone (INPUT_A)

    - spacer: 25

    - cistron:
        label: ActivatorB
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
        # araC senses L-arabinose (INPUT_B)

    - spacer: 25

    - cistron:
        label: OUTPUT
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
        # Driven by pLux-ara hybrid promoter requiring both ActivatorA-INPUT_A and ActivatorB-INPUT_B

    - terminator: rrnB_T1
