construct:
  name: OR_gate_dual_inducible
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      label: INPUT_A_responsive

    - cistron:
        label: OUTPUT_from_A
        expression: high
        chain:
          - gene:
              id: lacZ_alpha
              source: uniprot

    - terminator: rrnB_T1

    - promoter: rhamnose
      label: INPUT_B_responsive

    - cistron:
        label: OUTPUT_from_B
        expression: high
        chain:
          - gene:
              id: lacZ_alpha
              source: uniprot

    - terminator: rrnB_T1
