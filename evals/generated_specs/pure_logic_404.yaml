construct:
  name: "genetic_toggle_switch_lacI_tetR"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # LacI-repressible promoter (Induced by IPTG)
    - cistron:
        label: repressor_1
        expression: high
        gene:
          id: P04483  # TetR repressor protein
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_1
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: J23100 # Substitution: J23100 used as placeholder for a TetR-repressible promoter (e.g., P_L_tetO-1), induced by aTc
    - cistron:
        label: repressor_2
        expression: high
        gene:
          id: P03023  # LacI repressor protein
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_2
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015