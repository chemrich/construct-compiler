construct:
  name: sharp_threshold_detector
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: sensor_kinase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: acyl_homoserine_lactone_synthase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxS
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: output_protein
        expression: very_low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    
    - terminator: rrnB_T1

# Design rationale:
# The sharp threshold is achieved through cooperative transcriptional regulation.
# luxI (INPUT) produces acyl-homoserine lactone (AHL) in response to sensed signal.
# luxS amplifies AHL production, creating positive feedback.
# The luxR-AHL complex exhibits Hill coefficient > 1 at the mNeonGreen promoter,
# producing sharp ON/OFF switching at a tunable AHL concentration threshold.
# Expression level of luxI/luxS tunes the activation threshold.
# Very low expression of output ensures sharp digital behavior.
