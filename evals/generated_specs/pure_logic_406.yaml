construct:
  name: "sharp_threshold_detector"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: J23106
    - cistron:
        label: sensor_activator
        expression: medium
        gene:
          id: P12746
          source: uniprot
    - terminator: rrnB_T1
    - promoter: luxI  # LuxR-AHL responsive promoter with high cooperativity for sharp thresholding
    - cistron:
        label: detector_output
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015