construct:
  name: "iff_loop_edge_detector"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Responsive to Arabinose (Input)
    - cistron:
        label: activator
        expression: high
        fused: false
        gene:
          id: P12746
          source: uniprot
    - spacer: 30
    - cistron:
        label: repressor
        expression: medium
        fused: false
        gene:
          id: P04483
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac # Placeholder for hybrid LuxR-activated/TetR-repressed promoter to implement IFFL logic
    - cistron:
        label: output_signal
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term