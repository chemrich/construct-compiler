construct:
  name: edge_detector_incoherent_ffl
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: fast_activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CI_repressor
              source: uniprot

    - spacer: 30

    - cistron:
        label: slow_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CII_repressor
              source: uniprot

    - spacer: 30

    - cistron:
        label: output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
