construct:
  name: "NOT_gate_repressible_enzyme"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is repressed by AraC protein in the absence of L-arabinose
      # This serves as our NOT logic: no arabinose (input A absent) = high expression
      # Arabinose present (input A present) = repressed expression

    - cistron:
        label: metabolic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: atp_synthase_beta
              source: uniprot

    - terminator: rrnB_T1
