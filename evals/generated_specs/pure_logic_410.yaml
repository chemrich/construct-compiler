construct:
  name: "analog_to_digital_converter"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Utilizes the AraC-arabinose system, which exhibits digital (all-or-none) behavior in E. coli
    - cistron:
        label: digital_output
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1