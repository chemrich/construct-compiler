construct:
  name: "load_balancer_circuit"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # High-level constitutive promoter for baseline
    - cistron:
        label: output_A_baseline
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
    - promoter: tac  # Inducible INPUT promoter (e.g., via IPTG)
    - cistron:
        label: output_A_amplified
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: output_B_inducible
        expression: high
        fused: false  # Independent translation for Output B
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term