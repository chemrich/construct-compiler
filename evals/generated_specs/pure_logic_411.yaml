construct:
  name: load_balancer_circuit
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # Constitutive baseline for OutputA; will be modulated by INPUT
    
    - cistron:
        label: OutputA
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
      # INPUT-dependent promoter for OutputB (only active when INPUT/L-arabinose present)
    
    - cistron:
        label: OutputB
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    
    - terminator: rrnB_T1
