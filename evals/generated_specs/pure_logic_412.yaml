construct:
  name: "chemical_comparator_A_greater_than_B"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: reporter_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: activator_input_A
        expression: medium
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: repressor_input_B
        expression: medium
        fused: false
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - terminator: rrnB_T1
