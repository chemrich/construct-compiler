construct:
  name: i1_ffl_pulse_generator
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Input-responsive promoter (Input = IPTG)
    - cistron:
        label: activator_x
        expression: high
        gene:
          id: P12746
          source: uniprot
    - spacer: 40
    - cistron:
        label: repressor_y
        expression: high
        fused: false  # Ensures independent translation for the second protein in the polycistron
        gene:
          id: P04483
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac  # Substituted for a hybrid pLux-tetO promoter to represent X-activation and Y-repression
    - cistron:
        label: pulse_output
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015