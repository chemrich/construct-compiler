construct:
  name: "Type1_Incoherent_FeedForward_Loop_I1FFL"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: INPUT
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac

    - cistron:
        label: activator_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac

    - cistron:
        label: repressor_Y
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: OUTPUT
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
