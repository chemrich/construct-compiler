construct:
  name: "sequential_activation_circuit"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: activator_B
        expression: medium
        gene:
          id: P03833
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 60
    - promoter: T7
    - cistron:
        label: final_output
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015