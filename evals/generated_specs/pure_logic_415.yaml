construct:
  name: "two_stage_sequential_activation_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: INPUT_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: araBAD

    - cistron:
        label: INTERMEDIATE_ACTIVATOR_B
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: crp
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: lacUV5

    - cistron:
        label: FINAL_OUTPUT
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
