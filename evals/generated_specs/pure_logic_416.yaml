construct:
  name: lux_sender_receiver_system
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: sender_synthase
        expression: high
        fused: false
        gene:
          id: P12746
          source: uniprot
    - terminator: rrnB_T1
    - promoter: J23106
    - cistron:
        label: receiver_receptor
        expression: medium
        fused: false
        gene:
          id: P12747
          source: uniprot
    - terminator: BBa_B0015
    - promoter: lux
    - cistron:
        label: receiver_output
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term