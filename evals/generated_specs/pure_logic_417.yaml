construct:
  name: "environmental_sensor_logic_array"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: "P_TempHigh_AND_pHLow" # Logic AND: requires both activator proteins
    - cistron:
        label: output_a
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
    - promoter: "P_TempHigh" # Logic OR - Part 1: initiates transcription of Output B
    - promoter: "P_GlucLow"  # Logic OR - Part 2: initiates transcription of Output B (tandem architecture)
    - cistron:
        label: output_b
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term