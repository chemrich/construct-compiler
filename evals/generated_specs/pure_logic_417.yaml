construct:
  name: "multi_input_sensor_array"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Temp_HIGH_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TlpA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: pH_LOW_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CadC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Gluc_LOW_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CreB
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: AND_gate_TempHigh_pHLow
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: OUTPUT_A
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: OR_gate_TempHigh_GlucLow
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: OUTPUT_B
              source: uniprot
    
    - terminator: rrnB_T1
