construct:
  name: "proportional_controller_sfGFP"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: araBAD  # Graded response promoter for proportional control with L-arabinose
    - cistron:
        label: output_reporter
        expression: medium  # Represents a medium-strength RBS for tunable dynamic range
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1