construct:
  name: "OR_gate_therapeutic_protein_secretion"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: S1_sensor
        expression: medium
        chain:
          - gene:
              id: TF_S1_responsive
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: S2_sensor
        expression: medium
        chain:
          - gene:
              id: TF_S2_responsive
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: signal_peptide_secretion
          - gene:
              id: therapeutic_payload
              source: uniprot

    - terminator: rrnB_T1
