construct:
  name: "AND_gate_luminescence_secretion"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor_A
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_sensor_B
        expression: high
        chain:
          - gene:
              id: traR
              source: uniprot

    - spacer: 25

    - cistron:
        label: AND_gate_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Vibrio_fischeri_luxAB
              source: uniprot

    - spacer: 25

    - cistron:
        label: secretion_signal_fusion
        expression: high
        fused: false
        chain:
          - gene:
              id: Renilla_reniformis_luciferase
              source: fpbase

    - terminator: rrnB_T1
