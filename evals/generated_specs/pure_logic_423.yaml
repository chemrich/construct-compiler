construct:
  name: "NOT_gate_therapeutic_repressible"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor
        expression: medium
        gene:
          id: tetR
          source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: IL10
              source: uniprot

    - terminator: rrnB_T1
