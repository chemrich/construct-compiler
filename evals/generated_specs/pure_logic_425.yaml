construct:
  name: bistable_switch_positive_feedback
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_with_activity
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: araBAD_promoter_regulated_protease
              source: uniprot

    - spacer: 25

    - cistron:
        label: positive_feedback_regulator
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1
