construct:
  name: homeostatic_GFP_negative_feedback
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_fluorescent_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: repressor_transcription_factor
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 30

    - cistron:
        label: destabilizing_degron_tag
        expression: high
        fused: false
        chain:
          - gene:
              id: ssrA_tag
              source: uniprot

    - terminator: rrnB_T1
