construct:
  name: two_stage_signal_cascade
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: intermediate_transcription_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: T7lac

    - cistron:
        label: growth_promoting_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: bFGF
              source: uniprot

    - terminator: rrnB_T1
