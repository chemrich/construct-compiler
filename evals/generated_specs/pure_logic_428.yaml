construct:
  name: threshold_detector_detoxification
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: threshold_sensor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 30

    - cistron:
        label: detoxifying_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CYP2E1
              source: uniprot

    - terminator: rrnB_T1
