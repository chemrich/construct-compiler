construct:
  name: "frequency_to_amplitude_integrator"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: NFAT  # NFAT promoter used to decode calcium pulse frequency into transcriptional amplitude
    - cistron:
        label: secreted_signaling_output
        expression: high
        chain:
          - tag: IgK_leader  # Secretion signal for mammalian host (Rule 18)
          - gene:
              id: P60568  # UniProt ID for Human Interleukin-2 (IL2), a signaling molecule
              source: uniprot
    - terminator: SV40_polyA