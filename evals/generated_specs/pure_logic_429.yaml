construct:
  name: "frequency_to_amplitude_secreted_converter"
  host: mammalian
  
  backbone:
    catalog_vector: "pTwist CMV"
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: frequency_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: NFAT1
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: secreted_output
        expression: high
        fused: false
        chain:
          - tag: signal_peptide
          - gene:
              id: IL2
              source: uniprot
    
    - terminator: rrnB_T1
