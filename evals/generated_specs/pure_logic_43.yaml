construct:
  name: bistable_toggle_switch
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      label: araBAD_promoter_for_G1

    - cistron:
        label: G1_reporter
        expression: high
        chain:
          - gene:
              id: mGFP
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      label: lacUV5_promoter_for_G2

    - cistron:
        label: G2_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac
      label: T7lac_promoter_for_repressors

    - cistron:
        label: araBAD_repressor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - cistron:
        label: lacUV5_repressor
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1
