```yaml
construct:
  name: bistable_toggle_switch
  host: e_coli
  
  backbone:
    catalog_vector: "pET-28b(+)"
    
  cassette:
    - promoter: araBAD  # Signal A inducible promoter
    
    - cistron:
        label: repressor_B
        expression: high
        gene:
          id: P0351_CI  # lambda CI repressor
          source: uniprot
          
    - spacer: 30
    
    - cistron:
        label: reporter_G1
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
          
    - terminator: rrnB_T1
    
    - promoter: lacUV5  # Signal B inducible promoter (repressed by CI)
    
    - cistron:
        label: repressor_A
        expression: high
        gene:
          id: P03023_ARAC  # AraC repressor domain
          source: uniprot
          
    - spacer: 30
    
    - cistron:
        label: reporter_G2
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
          
    - terminator: rrnB_T1
```