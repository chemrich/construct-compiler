construct:
  name: "genetic_timer_hormone_output"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: trigger_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rtTA
              source: uniprot

    - spacer: 30

    - cistron:
        label: time_delay
        expression: medium
        chain:
          - gene:
              id: degron_timer
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: destabilizing_domain
              source: uniprot

    - spacer: 30

    - cistron:
        label: hormone_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Furin
          - gene:
              id: human_growth_hormone
              source: uniprot

    - terminator: rrnB_T1
