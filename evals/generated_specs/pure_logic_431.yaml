construct:
  name: genetic_flip_flop_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      label: input_A_promoter

    - cistron:
        label: repressor_B
        expression: high
        gene:
          id: tetR
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac
      label: state_A_promoter

    - cistron:
        label: reporter_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
      label: input_B_promoter

    - cistron:
        label: repressor_A
        expression: high
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: T7lac
      label: state_B_promoter

    - cistron:
        label: reporter_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
