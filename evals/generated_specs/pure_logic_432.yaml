construct:
  name: "synthetic_band_pass_filter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: activator_sensor
        expression: medium
        gene:
          id: P0A6C8
          source: uniprot
    - terminator: rrnB_T1
    - promoter: araBAD
    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
          - tag: 6xHis
    - spacer: 45
    - cistron:
        label: high_threshold_repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - terminator: BBa_B0015