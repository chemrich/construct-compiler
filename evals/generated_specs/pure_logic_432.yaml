construct:
  name: "band_pass_filter_fluorescent"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_low
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      # This promoter is repressed by tetR (low input) and activated by araC-araBAD (intermediate input)

    - cistron:
        label: reporter
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
