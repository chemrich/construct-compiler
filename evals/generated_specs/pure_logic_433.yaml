construct:
  name: "deadman_switch_anaerobic_ccdB"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: PnirB  # Anaerobically induced promoter; active when oxygen (input) is removed, repressed when oxygen is present.
    - cistron:
        label: cytotoxin
        expression: high
        gene:
          id: ccdB
          source: uniprot
    - terminator: BBa_B0015