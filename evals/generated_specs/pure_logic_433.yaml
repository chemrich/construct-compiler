construct:
  name: oxygen_dependent_deadman_switch
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: fnr_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: fnr
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: oxygen_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: arcA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: cytotoxic_protein
        expression: high
        fused: false
        chain:
          - gene:
              id: mazF
              source: uniprot
    
    - terminator: rrnB_T1
