construct:
  name: "sequential_logic_circuit_antibody"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: memory_protein_A
        expression: medium
        chain:
          - gene:
              id: dCas9
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: EF1_alpha
    - cistron:
        label: input_sensor_A
        expression: medium
        chain:
          - gene:
              id: rtTA3
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: EF1_alpha
    - cistron:
        label: input_sensor_B
        expression: medium
        chain:
          - gene:
              id: M2rtTA
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: TRE3G
    - cistron:
        label: anti_HER2_scFv
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: trastuzumab_scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: ER_signal_peptide
    - terminator: rrnB_T1
