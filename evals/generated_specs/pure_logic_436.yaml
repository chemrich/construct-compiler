construct:
  name: "three_stage_genetic_inverter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Stage 1: Input-inducible repressor (LacI)
    - cistron:
        label: repressor_1
        expression: high
        gene:
          id: lacI
          source: uniprot

    - spacer: 30

    - promoter: lacUV5
      # Stage 2: LacI-repressed repressor (TetR)
    - cistron:
        label: repressor_2
        expression: high
        gene:
          id: tetR
          source: uniprot

    - spacer: 30

    - promoter: tetO
      # Stage 3: TetR-repressed repressor (CI)
    - cistron:
        label: repressor_3
        expression: high
        gene:
          id: cI
          source: uniprot

    - spacer: 30

    - promoter: PRM
      # Output: CI-repressed fluorescent protein
    - cistron:
        label: output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
