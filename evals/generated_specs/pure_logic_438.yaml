construct:
  name: metabolic_feedback_control_loop
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: metabolite_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: synthetic_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LacI
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: biosynthetic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ADH1
              source: uniprot
    
    - terminator: rrnB_T1
