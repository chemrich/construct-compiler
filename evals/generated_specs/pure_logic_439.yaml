construct:
  name: "QS_receiver_purification_module"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: QS_receptor
        expression: high
        chain:
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: lacUV5

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
