construct:
  name: "negative_feedback_P_concentration_control"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: product_P_synthase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: fbiC
              source: uniprot

    - spacer: 30

    - cistron:
        label: P_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: P_responsive_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC_variant
              source: uniprot

    - terminator: rrnB_T1
