```yaml
construct:
  name: "P_negative_feedback_loop"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: activator_A
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P0A9E0  # AraC transcriptional activator
              source: uniprot

    - spacer: 30

    - cistron:
        label: product_P
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: P0ACB0  # LacI repressor (serves as product P with dual function)
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD  # Activated by AraC (activator A), repressed by LacI (product P)

    - cistron:
        label: feedback_target
        expression: medium
        fused: false
        chain:
          - gene:
              id: mGFP
              source: fpbase

    - terminator: T7term
```