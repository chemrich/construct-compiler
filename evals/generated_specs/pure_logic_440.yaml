construct:
  name: robust_NOT_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_Z
        expression: medium
        fused: false
        chain:
          - promoter: tetO_minimal
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: repressor_stabilization
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ssrA_tag
              source: uniprot

    - terminator: rrnB_T1
