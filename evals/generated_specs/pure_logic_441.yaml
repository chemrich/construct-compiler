construct:
  name: "AND_gate_logic_rapid_response"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AraC
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: AND_output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
