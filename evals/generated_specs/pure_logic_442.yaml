construct:
  name: "bistable_toggle_switch"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: repressor_A
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
    
    - cistron:
        label: output_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
    
    - cistron:
        label: repressor_B
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
    
    - cistron:
        label: output_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
