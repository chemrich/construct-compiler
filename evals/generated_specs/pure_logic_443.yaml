construct:
  name: "self_regulating_feedback_loop_protein_P"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5
      # lacUV5 is repressed by LacI protein product from first cistron
      # This creates negative feedback: P accumulation → more LacI → reduced P transcription

    - cistron:
        label: output_protein_P
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P
              source: uniprot

    - terminator: rrnB_T1
