construct:
  name: "OR_gate_minimal"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 20

    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - gene:
              id: malT
              source: uniprot

    - spacer: 20

    - cistron:
        label: output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
