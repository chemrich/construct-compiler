construct:
  name: "or_gate_tandem_promoter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: araBAD  # Input A: Arabinose
    - promoter: tac     # Input B: IPTG
    - cistron:
        label: output_Z
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1