construct:
  name: "high_gain_amplifier_cascade"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: stage_1_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: S_weak
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: stage_2_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Z_strong
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: positive_feedback
        expression: medium
        chain:
          - gene:
              id: S_weak
              source: uniprot
    
    - terminator: rrnB_T1
