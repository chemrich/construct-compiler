construct:
  name: "high_gain_amplifier_cascade"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106  # Weak constitutive promoter representing initial S_weak signal
    - cistron:
        label: S_weak_activator
        expression: low
        gene:
          id: P00573  # T7 RNA Polymerase (UniProt ID)
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 45
    - promoter: T7  # High-gain promoter activated by S_weak_activator
    - cistron:
        label: Z_strong_output
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term