construct:
  name: genetic_oscillator_repressilator
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: LacI_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: TetR_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: CI_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cI
              source: uniprot

    - spacer: 25

    - cistron:
        label: ReporterR
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
