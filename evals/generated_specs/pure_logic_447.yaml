construct:
  name: heavy_metal_sensor_actuator_system
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      # Metal-responsive promoter controlled by sensor protein
    
    - cistron:
        label: metal_sensor
        expression: high
        chain:
          - gene:
              id: MerR
              source: uniprot
      # MerR: mercury/heavy metal sensor transcription factor
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
      # This promoter is activated by MerR upon metal M detection
    
    - cistron:
        label: detoxification_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MerA
              source: uniprot
      # MerA: mercury reductase detoxifying enzyme
    
    - terminator: rrnB_T1
