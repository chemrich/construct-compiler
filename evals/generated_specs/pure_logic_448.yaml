construct:
  name: "XNOR_logic_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_A
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp
              source: fpbase

    - terminator: rrnB_T1
