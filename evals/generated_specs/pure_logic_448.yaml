construct:
  name: "xnor_logic_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Synthetic promoter acting as an XNOR gate (active when inputs A and B are both present or both absent)
    - cistron:
        label: output_Z
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1