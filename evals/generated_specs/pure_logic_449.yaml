construct:
  name: "three_state_genetic_switch"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: State1_repressor
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: State2_repressor
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - spacer: 25

    - cistron:
        label: State3_repressor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: memory_register_state1
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: CI_like_domain
              source: uniprot

    - spacer: 25

    - cistron:
        label: memory_register_state2
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: TetR_domain
              source: uniprot

    - spacer: 25

    - cistron:
        label: memory_register_state3
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: AraC_domain
              source: uniprot

    - spacer: 30

    - cistron:
        label: input_sensor_pulse1
        expression: low
        chain:
          - gene:
              id: holin
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_sensor_pulse2
        expression: low
        chain:
          - gene:
              id: recombinase_flp
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_sensor_pulse3
        expression: low
        chain:
          - gene:
              id: cre_recombinase
              source: uniprot

    - terminator: rrnB_T1
