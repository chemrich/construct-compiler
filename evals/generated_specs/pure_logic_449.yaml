        label: reporter_2_mScarlet
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
    - promoter: pL
    - cistron:
        label: repressor_3_LacI
        expression: medium
        gene:
          id: LacI
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_3_mTagBFP2
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015