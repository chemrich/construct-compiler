construct:
  name: positive_feedback_amplification_loop
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: activator
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LuxR
              source: uniprot
        # LuxR: acyl-homoserine lactone receptor that activates its own promoter (positive feedback)

    - terminator: rrnB_T1

    - promoter: lux_pR
      # lux_pR is activated by LuxR-AHL complex, creating feedback loop

    - cistron:
        label: growth_factor
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: FGF2
              source: uniprot

    - terminator: rrnB_T1
