construct:
  name: "deadmans_switch_safety_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: input_A_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: input_B_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: safety_output_Z
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
