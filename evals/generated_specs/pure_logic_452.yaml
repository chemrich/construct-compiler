construct:
  name: "genetic_memory_latch_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      label: "SET_input"
    
    - cistron:
        label: "LacI_repressor"
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: lacUV5
      label: "output_promoter_repressed_by_LacI"
    
    - cistron:
        label: "output_O"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: araBAD
      label: "RESET_input"
    
    - cistron:
        label: "TetR_repressor"
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
    
    - cistron:
        label: "cI_bistable_switch"
        expression: medium
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - terminator: rrnB_T1
