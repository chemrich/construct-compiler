construct:
  name: tunable_threshold_NOT_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: modulator
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: Mod_X
              source: uniprot

    - spacer: 25

    - cistron:
        label: allosteric_modulation_protein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1
