construct:
  name: three_input_majority_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: majority_logic_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: majority_gate_logic_circuit
              source: synthetic
    
    - spacer: 20
    
    - cistron:
        label: input_sensor_A
        expression: medium
        fused: false
        gene:
          id: input_A_sensor
          source: synthetic
    
    - spacer: 20
    
    - cistron:
        label: input_sensor_B
        expression: medium
        fused: false
        gene:
          id: input_B_sensor
          source: synthetic
    
    - spacer: 20
    
    - cistron:
        label: input_sensor_C
        expression: medium
        fused: false
        gene:
          id: input_C_sensor
          source: synthetic
    
    - spacer: 20
    
    - cistron:
        label: output_Z
        expression: high
        fused: false
        gene:
          id: output_Z_reporter
          source: synthetic
    
    - terminator: rrnB_T1
