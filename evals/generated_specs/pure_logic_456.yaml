construct:
  name: "conditional_biocontainment_lysis"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Essential gene under constitutive/weak expression
    
    - cistron:
        label: essential_gene
        expression: medium
        gene:
          id: EG
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
      # Lysis gene under inducible control (inverted logic via repressor)
      # Absent inducer I_env means no repression → LG expressed → cell death

    - cistron:
        label: lysis_gene
        expression: high
        gene:
          id: LG
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5
      # Repressor of lysis gene (active when I_env is present)

    - cistron:
        label: lysis_repressor
        expression: medium
        gene:
          id: LacI
          source: uniprot

    - terminator: rrnB_T1
