construct:
  name: "split_t7_logic_and_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Input A sensor: Induced by L-arabinose
    - cistron:
        label: t7_rnap_n_fragment
        expression: medium
        gene:
          id: T7RNAP_N
          source: uniprot
    - terminator: rrnB_T1

    - promoter: tac # Input B sensor: Induced by IPTG
    - cistron:
        label: t7_rnap_c_fragment
        expression: medium
        gene:
          id: T7RNAP_C
          source: uniprot
    - terminator: rrnB_T1

    - promoter: T7 # Logic gate output: Requires assembled T7 RNAP (A AND B)
    - cistron:
        label: reporter_output
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term