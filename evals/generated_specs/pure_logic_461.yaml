construct:
  name: "NOT_gate_therapeutic_protein_X_secretion"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: repressor_TetR
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_X
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: IgE_signal_peptide
          - gene:
              id: therapeutic_protein_X
              source: uniprot

    - terminator: rrnB_T1
