construct:
  name: "yeast_bistable_toggle_switch"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL4_UAS
      label: "state_A_promoter"

    - cistron:
        label: "repressor_B"
        expression: high
        chain:
          - gene:
              id: LacI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL1_UAS
      label: "state_B_promoter"

    - cistron:
        label: "repressor_A"
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL4_UAS
      label: "reporter_A_promoter"

    - cistron:
        label: "fluorescent_protein_A"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL1_UAS
      label: "reporter_B_promoter"

    - cistron:
        label: "fluorescent_protein_B"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
