construct:
  name: "dual_sensor_stress_response_system"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: thermosensor
        expression: medium
        chain:
          - gene:
              id: ibpA
              source: uniprot

    - spacer: 25

    - cistron:
        label: redox_sensor
        expression: medium
        chain:
          - gene:
              id: oxyR
              source: uniprot

    - spacer: 25

    - cistron:
        label: stress_response
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: dnaK
              source: uniprot

    - terminator: rrnB_T1
