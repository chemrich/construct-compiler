construct:
  name: "two_stage_signal_amplifier_cascade"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Input A: Inducible by arabinose
    - cistron:
        label: intermediate_B_T7Pol
        expression: high
        gene:
          id: P00552  # T7 RNA Polymerase (Intermediate B)
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: T7  # Triggered by Intermediate B for second-stage amplification
    - cistron:
        label: output_C_mEGFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term