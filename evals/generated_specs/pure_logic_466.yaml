construct:
  name: quorum_sensing_hysteresis_biofilm_switch
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: qs_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: high_threshold_promoter
        expression: high
        fused: false
        chain:
          - gene:
              id: pLuxR_high
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: biofilm_dispersion
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: flagellar_motor_protein
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: low_threshold_promoter
        expression: medium
        fused: false
        chain:
          - gene:
              id: pLuxR_low
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: biofilm_formation
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: curli_major_subunit_csgA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: hysteresis_memory
        expression: medium
        fused: false
        chain:
          - gene:
              id: cI_repressor
              source: uniprot
    
    - terminator: rrnB_T1
