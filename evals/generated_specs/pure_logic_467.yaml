construct:
  name: XOR_gate_dual_input_red_reporter
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_X
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: repressor_Y
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: NOT_gate_1
        expression: high
        chain:
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: NOT_gate_2
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: OR_gate
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: mScarlet_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
