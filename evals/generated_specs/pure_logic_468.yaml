construct:
  name: "transient_pulse_generator_S_to_P"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AraC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: pulse_generator
        expression: high
        chain:
          - gene:
              id: P
              source: uniprot

    - spacer: 20

    - cistron:
        label: anti_termination_factor
        expression: high
        fused: false
        chain:
          - gene:
              id: N_antiterminator
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: degradation_timer
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ClpX
              source: uniprot

    - spacer: 20

    - cistron:
        label: ssrA_protease_target
        expression: medium
        fused: false
        chain:
          - gene:
              id: ssrA_tagged_repressor
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: timing_oscillator
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 20

    - cistron:
        label: acyl_homoserine_lactone_synthase
        expression: low
        fused: false
        chain:
          - gene:
              id: LuxI
              source: uniprot

    - terminator: rrnB_T1
