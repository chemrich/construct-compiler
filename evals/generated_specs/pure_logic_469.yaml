construct:
  name: "three_stage_sequential_logic_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: stage1_input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: stage1_reporter_R1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: stage1_timer_protease
        expression: medium
        chain:
          - gene:
              id: lon_protease
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: stage2_R1_dependent_activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: stage2_R1_degron_tag
        expression: high
        fused: false
        chain:
          - gene:
              id: ssrA_tag
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: stage2_reporter_R2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 25

    - cistron:
        label: stage2_timer_protease_2
        expression: medium
        chain:
          - gene:
              id: clpX
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: stage3_R2_dependent_activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: cI_repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: stage3_R2_degron_tag
        expression: high
        fused: false
        chain:
          - gene:
              id: ssrA_tag
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: stage3_reporter_R3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
