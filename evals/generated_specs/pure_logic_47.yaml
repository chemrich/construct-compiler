```yaml
construct:
  name: genetic_NAND_gate
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor_X
        expression: medium
        gene:
          id: P0451  # LacI repressor
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: repressor_Y
        expression: medium
        fused: false
        gene:
          id: P03023  # TetR repressor
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: fluorescent_output
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
```