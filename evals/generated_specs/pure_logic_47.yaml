construct:
  name: "fluorescent_NAND_gate"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: input_X_repressor
        expression: medium
        gene:
          id: tetR
          source: uniprot

    - spacer: 25

    - cistron:
        label: input_Y_repressor
        expression: medium
        gene:
          id: cI
          source: uniprot

    - spacer: 25

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mGFP
              source: fpbase

    - terminator: rrnB_T1
