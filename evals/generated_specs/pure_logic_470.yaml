construct:
  name: "yeast_enzyme_E_secretion_high_yield"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_E
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: enzyme_E
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - terminator: CYC1_poly_A
