construct:
  name: "pH_sensor_acid_resistance_circuit"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: pH_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cadC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: acid_resistance_response
        expression: high
        fused: false
        chain:
          - gene:
              id: gadA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: robustness_factor
        expression: medium
        fused: false
        gene:
          id: hdeA
          source: uniprot
    
    - terminator: rrnB_T1
