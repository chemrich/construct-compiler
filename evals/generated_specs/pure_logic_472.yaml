construct:
  name: "repressible_therapeutic_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # T7lac provides tight repression with lacI and is derepressed only in absence of allolactose/IPTG
      # For input molecule X, we use a conditional repressor system

    - cistron:
        label: repressor_protein
        expression: high
        chain:
          - gene:
              id: trp_repressor  # TrpR protein that binds operator in presence of tryptophan
              source: uniprot

    - spacer: 35

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TNF_alpha
              source: uniprot

    - terminator: rrnB_T1
  
  # Additional regulatory region (specified in comments for implementation):
  # The therapeutic cistron should be placed under control of a trp operator (Otrp)
  # positioned immediately upstream of its RBS. When molecule X (tryptophan analogue or 
  # cognate ligand) binds TrpR repressor, TrpR-X complex blocks RNA polymerase access,
  # shutting off therapeutic expression. Without X, TrpR remains inactive and 
  # therapeutic gene is fully expressed from T7lac promoter.
  # For maximum repression and minimal leakiness, use multiple operator sites (Otrp1-Otrp2)
  # and ensure strong RBS for high basal expression in OFF state.
