construct:
  name: "biofuel_precursor_negative_feedback_loop"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: transcriptional_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: biofuel_precursor_enzyme
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ADH
              source: uniprot

    - spacer: 30

    - cistron:
        label: biosensor_output_protein
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
