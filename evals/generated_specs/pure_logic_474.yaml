construct:
  name: "mammalian_bistable_memory_circuit"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: transactivator_rtTA
        expression: high
        chain:
          - tag: HA
          - gene:
              id: rtTA
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: TRE_tight

    - cistron:
        label: positive_feedback_activator
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: rtTA
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: TRE_tight

    - cistron:
        label: memory_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: repressor_tTS
        expression: medium
        chain:
          - tag: V5
          - gene:
              id: tTS
              source: uniprot

    - terminator: rrnB_T1
