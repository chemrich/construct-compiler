construct:
  name: mammalian_genetic_memory_circuit
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE  # Stimulated by input S (Tet-inducible system)
    - cistron:
        label: trigger_recombinase
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: P06956
              source: uniprot
    - terminator: SV40_pA
    - spacer: 100
    - promoter: CMV
    - cistron:
        label: memory_state_reporter
        expression: high
        # This cistron is assumed to contain a Lox-Stop-Lox element for DNA-level memory switching
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_pA