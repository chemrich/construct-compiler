    ori: p15A
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: toxin_antitoxin_toxin
        expression: high
        chain:
          - gene:
              id: mazF
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: nutrient_sensor
        expression: high
        chain:
          - gene:
              id: gyrA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: antitoxin_conditional
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mazE
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: protease_activator
        expression: medium
        chain:
          - gene:
              id: clpX
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: irreversible_dna_damage
        expression: low
        chain:
          - gene:
              id: colicin_E1
              source: uniprot
    
    - terminator: rrnB_T1
