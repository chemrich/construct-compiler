construct:
  name: "spatial_patterning_logic_circuit"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV # Substituted as a placeholder for a Signal X-inducible, Signal Y-repressible hybrid promoter
    - cistron:
        label: reporter_A
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: bGH_PA
    - promoter: EF1_alpha # Substituted as a placeholder for a Signal Y-inducible, Signal X-repressible hybrid promoter
    - cistron:
        label: reporter_B
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_PA