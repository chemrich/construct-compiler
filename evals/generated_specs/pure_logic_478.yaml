construct:
  name: "time_delayed_gene_expression_system"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: delay_element_protease
        expression: high
        chain:
          - gene:
              id: ClpXP
              source: uniprot

    - spacer: 25

    - cistron:
        label: timing_protein_stabilizer
        expression: medium
        chain:
          - gene:
              id: ssrA_tag_variant
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_protein
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: timer_OFF_switch
        expression: medium
        fused: false
        chain:
          - gene:
              id: toxin_antitoxin_MazE
              source: uniprot

    - terminator: rrnB_T1
