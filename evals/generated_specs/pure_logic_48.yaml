construct:
  name: "NOR_gate_cytotoxic_switch"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor_A
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_B
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: cytotoxic_output
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ccdB
              source: uniprot

    - terminator: rrnB_T1
