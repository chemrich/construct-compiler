construct:
  name: "E_coli_AND_gate_ReporterGreen"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: InducerA_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LuxR
              source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: InducerB_sensor
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: TraR
              source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: AND_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
