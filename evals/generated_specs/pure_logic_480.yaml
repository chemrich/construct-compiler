construct:
  name: "genetic_and_gate_split_t7"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Inducer A: Arabinose
    - cistron:
        label: "t7_rnap_fragment_n"
        gene:
          id: "P00573"
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac  # Inducer B: IPTG
    - cistron:
        label: "t7_rnap_fragment_c"
        gene:
          id: "P00573"
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7  # Output: Contingent on presence of both T7 fragments
    - cistron:
        label: "ReporterGreen"
        expression: high
        gene:
          id: "sfGFP"
          source: fpbase
    - terminator: T7term