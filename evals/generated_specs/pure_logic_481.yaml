construct:
  name: "yeast_OR_gate_therapeutic"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      label: "SignalX_sensing"

    - cistron:
        label: "TranscriptionFactor_X"
        expression: medium
        chain:
          - gene:
              id: "GAL4_DBD"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL4
      label: "SignalY_sensing"

    - cistron:
        label: "TranscriptionFactor_Y"
        expression: medium
        chain:
          - gene:
              id: "LexA_DBD"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL4_UAS_LexA_operator
      label: "OR_output_promoter"

    - cistron:
        label: "therapeutic_output"
        expression: high
        chain:
          - tag: "alpha_factor_signal"
          - linker:
              type: "GS_flexible"
              repeats: 1
          - gene:
              id: "TherapeuticProtein"
              source: uniprot

    - terminator: rrnB_T1
