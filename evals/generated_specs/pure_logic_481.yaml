construct:
  name: yeast_OR_gate_secretion_signalX_signalY
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene
  cassette:
    - promoter: GAL1  # Inducible by SignalX (Galactose); yeast-specific promoter substituted for schema examples
    - cistron:
        label: therapeutic_unit_x
        expression: high
        chain:
          - tag: alpha_factor  # Yeast secretion signal (MF-alpha1 leader)
          - gene:
              id: TherapeuticProtein
              source: uniprot
    - terminator: CYC1_terminator
    - promoter: CUP1  # Inducible by SignalY (Copper); minimal crosstalk with GAL pathway
    - cistron:
        label: therapeutic_unit_y
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: TherapeuticProtein
              source: uniprot
    - terminator: ADH1_terminator