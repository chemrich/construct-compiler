construct:
  name: "mammalian_NOT_gate_detoxification"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: toxin_sensor
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: P53
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: detoxification_enzyme
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CYP3A4
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
        fused: false

    - terminator: rrnB_T1
