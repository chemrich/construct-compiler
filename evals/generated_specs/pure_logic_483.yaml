construct:
  name: E_coli_XOR_gate
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: InputP_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: InputQ_sensor
        expression: high
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: XOR_controller
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_red_fluorescent
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
