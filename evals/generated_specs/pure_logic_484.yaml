construct:
  name: "yeast_bistable_toggle_switch"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL4_UAS
      label: "state_A_promoter"

    - cistron:
        label: "protein_A"
        expression: high
        chain:
          - gene:
              id: "GAL80"
              source: uniprot

    - terminator: "CYC1_terminator"

    - spacer: 50

    - promoter: "ADH1"
      label: "state_B_promoter"

    - cistron:
        label: "protein_B"
        expression: high
        chain:
          - gene:
              id: "ASH1"
              source: uniprot

    - terminator: "CYC1_terminator"

    - spacer: 50

    - promoter: "GAL1"
      label: "inducer_state_transition"

    - cistron:
        label: "toggle_controller"
        expression: medium
        chain:
          - gene:
              id: "MET3"
              source: uniprot

    - terminator: "CYC1_terminator"
