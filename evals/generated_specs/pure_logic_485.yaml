construct:
  name: "e_coli_self_sustained_oscillator"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_LacI
        expression: medium
        chain:
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: activator_AraC
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 35

    - promoter: araBAD

    - cistron:
        label: reporter_fluorescent
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: oscillator_integrase
        expression: medium
        chain:
          - gene:
              id: phiC31_integrase
              source: uniprot

    - terminator: rrnB_T1
