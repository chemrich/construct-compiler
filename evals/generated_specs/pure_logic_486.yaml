construct:
  name: "mammalian_signal_amplification_circuit"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: InputSignal_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: dCas9_VP64
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: U6

    - cistron:
        label: gRNA_amplifier
        expression: high
        chain:
          - gene:
              id: gRNA_GrowthFactorY_promoter
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: GrowthFactorY_output
        expression: very_high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: GrowthFactorY
              source: uniprot

    - terminator: rrnB_T1
