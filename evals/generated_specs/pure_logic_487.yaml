construct:
  name: "metabolite_m_threshold_detector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Responsive to metabolite induction; selected to represent MetaboliteM sensing
    - cistron:
        label: reporter_yellow
        expression: high
        gene:
          id: mVenus
          source: fpbase
    - terminator: rrnB_T1