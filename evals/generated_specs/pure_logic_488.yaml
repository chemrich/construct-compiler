construct:
  name: "yeast_event_counter_three_state"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: SignalP_receptor
        expression: high
        chain:
          - gene:
              id: STE2
              source: uniprot

    - terminator: rrnB_T1

    - promoter: ADH1

    - cistron:
        label: memory_counter_module
        expression: high
        chain:
          - gene:
              id: cre_recombinase
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TEF1

    - cistron:
        label: state_0_reporter_green
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: TEF1

    - cistron:
        label: state_1_reporter_blue
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1

    - promoter: TEF1

    - cistron:
        label: state_2_reporter_red
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
