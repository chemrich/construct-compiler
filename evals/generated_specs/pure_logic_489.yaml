construct:
  name: "TherapeuticEnzyme_negative_feedback_loop"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: sensor_repressor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: 2A
          - gene:
              id: KRAB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: dCas9
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TherapeuticEnzyme
              source: uniprot

    - spacer: 25

    - cistron:
        label: sgRNA_scaffold
        expression: high
        fused: false
        chain:
          - gene:
              id: U6_sgRNA_CMV_promoter
              source: uniprot

    - terminator: rrnB_T1
