```yaml
construct:
  name: circadian_antibody_oscillator
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: clock_activator
        expression: medium
        chain:
          - gene:
              id: CLOCK
              source: uniprot

    - spacer: 30

    - cistron:
        label: clock_repressor
        expression: medium
        fused: false
        chain:
          - gene:
              id: PER2
              source: uniprot

    - spacer: 30

    - cistron:
        label: therapeutic_antibody
        expression: high
        fused: false
        chain:
          - tag: signal_peptide  # secretion signal for mammalian cells
          - gene:
              id: P01857  # human IgG1 heavy chain constant region
              source: uniprot

    - spacer: 30

    - cistron:
        label: antibody_light_chain
        expression: high
        fused: false
        chain:
          - tag: signal_peptide
          - gene:
              id: P01834  # human IgG kappa light chain constant region
              source: uniprot

    - terminator: BBa_B0015
```