construct:
  name: circadian_antibody_oscillator
  host: mammalian
  
  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin
    
  cassette:
    - promoter: CMV
    
    - cistron:
        label: clock_repressor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: PER2
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: EF1_alpha
    
    - cistron:
        label: clock_activator
        expression: high
        chain:
          - tag: HA
          - gene:
              id: CLOCK
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: CMV
    
    - cistron:
        label: oscillating_antibody
        expression: medium
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IgG1_Fc_optimized
              source: uniprot
        notes: "Secretion signal (leader peptide) automatically included for mammalian expression. Output protein has N-terminal secretion signal, MBP solubility tag, and therapeutic antibody Fc domain. Rhythmic expression driven by clock_repressor/clock_activator negative feedback oscillator with ~24h period."
    
    - terminator: rrnB_T1
