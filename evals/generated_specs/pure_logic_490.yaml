construct:
  name: positive_feedback_loop_with_blue_reporter
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: ActivationProtein
        expression: low
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: FluorescentBlue
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
