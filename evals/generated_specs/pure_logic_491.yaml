construct:
  name: "E_coli_2to1_multiplexer"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: DataIn1
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot

    - spacer: 30

    - cistron:
        label: DataIn2
        expression: high
        fused: false
        chain:
          - gene:
              id: araB
              source: uniprot

    - spacer: 30

    - cistron:
        label: Select
        expression: high
        fused: false
        chain:
          - gene:
              id: tetR
              source: uniprot

    - spacer: 30

    - cistron:
        label: Multiplexer_Logic
        expression: high
        fused: false
        chain:
          - gene:
              id: cI
              source: uniprot

    - spacer: 30

    - cistron:
        label: ReporterOrange
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
