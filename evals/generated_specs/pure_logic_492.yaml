construct:
  name: "yeast_1to2_demultiplexer"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Control_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4
              source: uniprot

    - terminator: CYC1

    - promoter: GAL10

    - cistron:
        label: Control_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LEU2
              source: uniprot

    - terminator: CYC1

    - promoter: GAL7

    - cistron:
        label: CommonInput_OutputGreen
        expression: high
        chain:
          - cleavage_site: 2A
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: CYC1

    - promoter: GAL2

    - cistron:
        label: CommonInput_OutputRed
        expression: high
        chain:
          - cleavage_site: 2A
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
