construct:
  name: "time_delayed_therapeutic_switch"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: delay_module
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: signal_integrator
        expression: medium
        chain:
          - gene:
              id: P2A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: DsRed
              source: fpbase

    - spacer: 30

    - cistron:
        label: therapeutic_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TherapeuticFactor_delayed
              source: uniprot

    - terminator: rrnB_T1

# Time-delay mechanism: mCherry accumulates as a temporal marker; 
# signal integrator uses P2A for stoichiometric separation; 
# TherapeuticFactor is under independent control with 6xHis for purification 
# and secretion signal (assumed engineered into TherapeuticFactor_delayed UniProt entry or added post-translationally).
# The 8-12 hour delay is achieved through transcriptional/translational kinetics tuning 
# and optional addition of degron tags to upstream cistrons (not explicitly shown here but 
# implementation-dependent on specific mammalian system parameters).
