construct:
  name: "E_coli_genetic_comparator_InputX_vs_InputY"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: InputX_sensor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: InputY_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: blueFluorescence_output
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mTagBFP2
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: redFluorescence_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
