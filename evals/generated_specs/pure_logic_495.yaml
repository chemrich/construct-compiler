construct:
  name: "yeast_signal_amplification_cascade"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: InputSignal
        expression: very_low
        chain:
          - gene:
              id: "P65_transactivator"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL4_UAS

    - cistron:
        label: AmplifierStage
        expression: high
        chain:
          - gene:
              id: "VP16_activation_domain"
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: GAL1_strong

    - cistron:
        label: OutputEnzymeZ
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "ADH1"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
