construct:
  name: frequency_filter_reporter_yellow
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: signal_input_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: envZ
              source: uniprot

    - spacer: 25

    - cistron:
        label: frequency_decoder
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ompR
              source: uniprot

    - spacer: 25

    - cistron:
        label: filter_oscillator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: bandpass_integrator
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter_yellow
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mVenus
              source: fpbase

    - terminator: rrnB_T1
