construct:
  name: addressable_fluorescent_reporter_system
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: AddressBit0_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CI_repressor
              source: uniprot
        # Note: This represents the first address bit sensor (simplified placeholder)

    - spacer: 25

    - cistron:
        label: AddressBit1_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Cro_repressor
              source: uniprot
        # Note: This represents the second address bit sensor (simplified placeholder)

    - spacer: 30

    - cistron:
        label: reporter_CFP_00
        expression: medium
        # Activated when AddressBit0=0, AddressBit1=0
        fused: false
        gene:
          id: mCerulean
          source: fpbase

    - spacer: 25

    - cistron:
        label: reporter_GFP_01
        expression: medium
        # Activated when AddressBit0=1, AddressBit1=0
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - spacer: 25

    - cistron:
        label: reporter_YFP_10
        expression: medium
        # Activated when AddressBit0=0, AddressBit1=1
        fused: false
        gene:
          id: mVenus
          source: fpbase

    - spacer: 25

    - cistron:
        label: reporter_RFP_11
        expression: medium
        # Activated when AddressBit0=1, AddressBit1=1
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1

  # Note: This construct requires additional regulatory elements (NOT shown in this schema)
  # such as promoters with address-dependent binding sites, repressors, and logic gates
  # to implement the actual 2-to-4 decoder function. The cassette above shows the
  # four fluorescent reporters that would be activated by external address bits.
  # Recommend supplementing with synthetic biology design tools (e.g., Cello, Ribozyme-based logic)
  # to implement the addressable switching between the four outputs.
