```yaml
construct:
  name: repressilator_oscillator
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacI
    
    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P0040  # TetR repressor
          source: biobrick
    
    - spacer: 25
    
    - promoter: tetR
    
    - cistron:
        label: cI_repressor
        expression: medium
        gene:
          id: C0051  # CI repressor (lambda)
          source: biobrick
    
    - spacer: 25
    
    - promoter: cI
    
    - cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: C0012  # LacI repressor
          source: biobrick
    
    - spacer: 30
    
    - cistron:
        label: reporter
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
