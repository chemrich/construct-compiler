construct:
  name: "Repressilator_oscillator_60min_ecoli"
  host: e_coli_bl21
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: tetR_repressor
        expression: medium
        chain:
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: cI_repressor
        expression: medium
        chain:
          - gene:
              id: cI
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: araC_repressor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 50
    
    - cistron:
        label: reporter_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
