```yaml
construct:
  name: metabolite_M_toxin_T_comparator
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: metabolite_sensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: FapR
              source: uniprot
        comment: "Metabolite M-responsive transcriptional repressor; binds M above threshold"

    - terminator: rrnB_T1

    - promoter: lacUV5
        comment: "Repressed by FapR when M is below threshold; derepressed when M exceeds threshold"

    - cistron:
        label: toxin_degradation_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DegP
              source: uniprot
        comment: "Protease active only when promoter is derepressed (M above threshold)"

    - terminator: rrnB_T1
```