construct:
  name: "dual_signal_counter_two_S_activation"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: counter_state_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: signal_sensor_and_logic
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: counter_reset_enzyme
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: FLP
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: reporter_GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
