construct:
  name: "genetic_multiplexer_dual_input_output"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: I1_sensor
        expression: high
        chain:
          - gene:
              id: LuxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: I2_sensor
        expression: high
        chain:
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: C1_control_gate
        expression: medium
        chain:
          - gene:
              id: cI
              source: uniprot

    - spacer: 25

    - cistron:
        label: C2_control_gate
        expression: medium
        chain:
          - gene:
              id: Cro
              source: uniprot

    - spacer: 30

    - promoter: araBAD

    - cistron:
        label: O1_reporter_A
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - promoter: araBAD

    - cistron:
        label: O2_reporter_B
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
