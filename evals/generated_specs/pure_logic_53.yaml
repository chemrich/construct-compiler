construct:
  name: "conditional_therapeutic_cargo_circuit"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: signal_integrator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: logic_controller
        expression: high
        chain:
          - gene:
              id: LacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: cargo_output
        expression: medium
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IL6
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: Trx

    - terminator: rrnB_T1
