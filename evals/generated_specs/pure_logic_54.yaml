construct:
  name: "genetic_toggle_latch_differentiation"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tet  # Repressed by TetR; drives the RESET state (LacI production)
    - cistron:
        label: LacI_repressor
        expression: medium
        gene:
          id: P03023
          source: uniprot
    - terminator: rrnB_T1
    - promoter: lacUV5  # Repressed by LacI; drives the SET state (TetR and Differentiation factor)
    - cistron:
        label: TetR_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - spacer: 30
    - cistron:
        label: differentiation_factor
        expression: high
        fused: false  # Independent translation with its own RBS
        gene:
          id: P15172
          source: uniprot
    - terminator: BBa_B0015