construct:
  name: metabolite_ADC_converter
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Output_Low
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mTagBFP2
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: Output_Mid
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: Output_High
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: metabolite_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: threshold_controller
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
    
    - terminator: rrnB_T1
