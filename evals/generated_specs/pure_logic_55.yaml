construct:
  name: "metabolite_adc_converter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5 # Threshold 1: Low-sensitivity sensor
    - cistron:
        label: Output_Low
        expression: medium
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: tac # Threshold 2: Medium-sensitivity sensor
    - cistron:
        label: Output_Mid
        expression: medium
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: BBa_B0015
    - spacer: 40
    - promoter: araBAD # Threshold 3: High-sensitivity sensor
    - cistron:
        label: Output_High
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term