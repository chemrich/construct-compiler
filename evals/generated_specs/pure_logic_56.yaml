construct:
  name: dual_quorum_sensing_biofilm_integrator
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: Q1_receptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: Q2_receptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: rhlR
              source: uniprot

    - spacer: 25

    - cistron:
        label: dual_integrase
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: cre
              source: uniprot

    - spacer: 25

    - cistron:
        label: biofilm_effector
        expression: low
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: pgaA
              source: uniprot

    - terminator: rrnB_T1
