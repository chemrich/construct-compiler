construct:
  name: three_stage_therapeutic_cascade
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Gene1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: araC
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gene2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: araBAD
              source: uniprot

    - spacer: 30

    - cistron:
        label: Gene3_therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: lacZ
              source: uniprot

    - terminator: rrnB_T1
