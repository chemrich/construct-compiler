construct:
  name: "contaminant_C_sensor_with_safety_gating"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD is inducible by L-arabinose; represents detection of contaminant C
      # This promoter will be active when C is present

    - cistron:
        label: safety_signal_S_detector
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
              # LuxR acts as a transcriptional regulator; requires acyl-homoserine lactone (safety signal S)

    - terminator: rrnB_T1

    - promoter: T7lac
      # Standard T7lac promoter for antitoxin expression
      # Controlled by LuxR-S complex formation

    - cistron:
        label: antitoxin_T
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: RelB
              source: uniprot
              # RelB is a representative antitoxin protein that neutralizes toxins
