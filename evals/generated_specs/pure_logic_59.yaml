construct:
  name: "environmental_kill_switch_apoptosis"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: apoptosis_inducer
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: BAX
              source: uniprot

    - terminator: rrnB_T1

  control_logic:
    condition: "NOT nutrient_N AND stressor_S"
    action: "constitutive_expression_of_BAX"
    note: "Environmental niche absence triggers cell death. BAX with NLS ensures mitochondrial and nuclear apoptotic signaling. Integration with nutrient/stressor biosensors required via separate regulatory constructs."
