```yaml
construct:
  name: negative_feedback_homeostasis_loop
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P0451  # LacI repressor
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_protein
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1

    # Second cassette for repressor-regulated output
    - promoter: lacUV5  # Repressible by LacI

    - cistron:
        label: regulated_output
        expression: medium
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
```