construct:
  name: "negative_feedback_homeostatic_loop"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: output_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_signal
        expression: medium
        fused: false
        chain:
          - gene:
              id: araC
              source: uniprot

    - spacer: 25

    - cistron:
        label: feedback_sensor
        expression: medium
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: cAMP_receptor_protein
              source: uniprot

    - terminator: rrnB_T1
