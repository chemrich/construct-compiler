construct:
  name: "two_input_transcriptional_AND_gate"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
      # AND gate logic: dual repression architecture
      # Input A represses via TetR, Input B represses via CI
      # Output Z (mGFP) only expressed when both repressors are absent
    
    - cistron:
        label: output_Z
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: J23106
      # Constitutive production of TetR (repressor for input A)
    
    - cistron:
        label: repressor_A
        expression: medium
        fused: false
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: J23100
      # Constitutive production of CI (repressor for input B)
    
    - cistron:
        label: repressor_B
        expression: medium
        fused: false
        gene:
          id: cI
          source: uniprot
    
    - terminator: rrnB_T1
