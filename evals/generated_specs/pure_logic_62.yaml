construct:
  name: "yeast_transcriptional_or_gate"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: output_z_input_a
        expression: medium
        gene:
          id: URA3
          source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: CUP1
    - cistron:
        label: output_z_input_b
        expression: medium
        gene:
          id: URA3
          source: uniprot
    - terminator: ADH1_term