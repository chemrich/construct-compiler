construct:
  name: "yeast_OR_gate_z_selection"
  host: yeast

  backbone:
    resistance: nourseothricin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1
      # Input A: GAL1 is native yeast promoter, activated by galactose/repressed by glucose
      
    - cistron:
        label: input_A_sensor
        expression: medium
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
              # DNA-binding domain sensing input A

    - terminator: CYC1

    - spacer: 30

    - promoter: ADH1
      # Input B: constitutive promoter with binding sites for input B TF

    - cistron:
        label: input_B_sensor
        expression: medium
        chain:
          - gene:
              id: GAL4_AD
              source: uniprot
              # Activation domain sensing input B

    - terminator: CYC1

    - spacer: 30

    - promoter: hybrid_OR
      # Hybrid promoter with binding sites for both GAL4 and input B TF
      # Activated if either GAL4-DBD (from A) OR input B TF binds

    - cistron:
        label: output_Z
        expression: high
        chain:
          - gene:
              id: kanMX
              source: uniprot
              # G418/neomycin resistance for selection

    - terminator: CYC1
