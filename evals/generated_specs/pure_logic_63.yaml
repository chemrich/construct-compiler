construct:
  name: mammalian_bistable_switch_nls_reporter
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: state_protein_A
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP16
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS

    - spacer: 25

    - cistron:
        label: state_protein_B
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS

    - spacer: 25

    - cistron:
        label: reporter
        expression: medium
        fused: false
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS

    - spacer: 25

    - cistron:
        label: inducible_input
        expression: very_low
        fused: false
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: dCas9-VP64
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS

    - terminator: rrnB_T1

  # Design notes: VP16 activation domain and KRAB repression domain create mutual
  # inhibition feedback. VP16 and dCas9-VP64 both activate state_protein_A promoter
  # (positive feedback), while KRAB represses it. mNeonGreen with dual NLS tags
  # reports nuclear localization of active state. Input pulse of dCas9-VP64 can
  # drive system toward state A; removal allows KRAB to dominate, driving toward state B.
