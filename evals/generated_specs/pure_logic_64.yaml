construct:
  name: repressilator_oscillatory_circuit
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
    
    - cistron:
        label: repressor_1_LacI
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: repressor_2_TetR
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: tac

    - cistron:
        label: repressor_3_CI
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: cI
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: J23100

    - cistron:
        label: output_fluorophore
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
