construct:
  name: "mammalian_hysteresis_comparator_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: TRE3G
              source: uniprot
        fused: true

    - spacer: 25

    - cistron:
        label: memory_toggle
        expression: high
        chain:
          - gene:
              id: Gal4DBD
              source: uniprot
        fused: true

    - spacer: 25

    - cistron:
        label: output_protein
        expression: high
        fused: false
        chain:
          - tag: Signal_Peptide_SP
          - gene:
              id: IFNG
              source: uniprot

    - terminator: rrnB_T1
