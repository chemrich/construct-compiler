construct:
  name: CRISPR_Cas9_XOR_gate
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9_repressor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot
          - tag: NLS

    - spacer: 30

    - cistron:
        label: sgRNA_A
        expression: high
        fused: false
        gene:
          id: sgRNA_A_XOR
          source: uniprot

    - spacer: 30

    - cistron:
        label: sgRNA_B
        expression: high
        fused: false
        gene:
          id: sgRNA_B_XOR
          source: uniprot

    - spacer: 30

    - cistron:
        label: output_Z
        expression: medium
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
