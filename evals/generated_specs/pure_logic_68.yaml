construct:
  name: "E_coli_three_state_genetic_timer"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: S1_state_marker
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: degradation_trigger_1
        expression: high
        chain:
          - gene:
              id: ssrA_tag_fusion
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: S2_state_marker
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 30

    - cistron:
        label: time_delay_protein_1
        expression: medium
        chain:
          - gene:
              id: cI_repressor
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: degradation_trigger_2
        expression: medium
        chain:
          - gene:
              id: lon_protease_substrate
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: S3_state_marker
        expression: low
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: reset_regulator
        expression: low
        chain:
          - gene:
              id: araC_repressor
              source: uniprot
        fused: false

    - spacer: 30

    - cistron:
        label: clp_protease_activator
        expression: very_low
        chain:
          - gene:
              id: clpP_ClpX_cochaperone
              source: uniprot
        fused: false

    - terminator: rrnB_T1
