construct:
  name: positive_feedback_amplifier_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: receptor
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: EGFR
              source: uniprot

    - spacer: 25

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: FGF2
              source: uniprot

    - spacer: 25

    - cistron:
        label: transcription_factor
        expression: medium
        chain:
          - gene:
              id: STAT3
              source: uniprot

    - terminator: rrnB_T1
