construct:
  name: positive_feedback_signal_amplifier
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: transcriptional_activator
        expression: medium
        chain:
          - gene:
              id: VP64-dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P2A  # self-cleaving peptide for polycistronic expression
              source: uniprot

    - cistron:
        label: growth_factor
        expression: high
        fused: false
        chain:
          - tag: signal_peptide  # for secretion
          - gene:
              id: PDGF-BB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: T2A  # self-cleaving peptide
              source: uniprot

    - cistron:
        label: feedback_sensor
        expression: medium
        fused: false
        chain:
          - gene:
              id: PDGFR-beta
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: gRNA_scaffold
              source: uniprot

    - terminator: BBa_B0015