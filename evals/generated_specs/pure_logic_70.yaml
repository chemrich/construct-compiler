construct:
  name: "ligand_sensing_secretory_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: sensor_receptor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: IL2RA
              source: uniprot

    - spacer: 30

    - cistron:
        label: therapeutic_secreted
        expression: high
        fused: false
        chain:
          - gene:
              id: SP_Immunoglobulin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TNF
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
