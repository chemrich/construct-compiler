construct:
  name: "dual_input_AND_gate_fluorescent"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: temperature_sensor
        expression: high
        chain:
          - gene:
              id: TlpA
              source: uniprot

    - spacer: 25

    - cistron:
        label: pH_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: CadC
              source: uniprot

    - spacer: 25

    - cistron:
        label: AND_gate_output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
