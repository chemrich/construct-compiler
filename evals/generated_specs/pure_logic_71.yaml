construct:
  name: "bacterial_and_gate_temp_ph_mbp_megfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: cspA # Input 1: Temperature sensitive (cold-shock promoter)
    - cistron:
        label: split_T7_N
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: cadA # Input 2: pH sensitive (acid-inducible promoter)
    - cistron:
        label: split_T7_C
        expression: medium
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7 # Output: Driven by reconstructed T7 RNA Polymerase
    - cistron:
        label: target_reporter
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term