construct:
  name: "yeast_toggle_memory_switch"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL4

    - cistron:
        label: memory_ON_state
        expression: high
        chain:
          - gene:
              id: GAL4_VP16
              source: uniprot
              # Activator of memory state; responds to input A

    - spacer: 25

    - cistron:
        label: memory_OFF_state
        expression: high
        chain:
          - gene:
              id: MatA1
              source: uniprot
              # Repressor that silences memory ON; responds to input B

    - spacer: 25

    - cistron:
        label: memory_reporter
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: tdTomato
              source: fpbase
              # Robust red fluorescent reporter; expressed when memory is ON

    - terminator: rrnB_T1
