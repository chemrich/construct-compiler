construct:
  name: "yeast_bistable_toggle_memory"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1_LacO  # Repressed by LacI; Input A (Galactose) switches the state
    - cistron:
        label: repressor_tetr
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: P04483
              source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TetO_CYC1  # Repressed by TetR; Input B (aTc) switches the state
    - cistron:
        label: repressor_laci
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: P03023
              source: uniprot
    - terminator: ADH1_term
    - spacer: 50
    - promoter: TetO_CYC1  # Robust reporter linked to the ON-state (LacI expression)
    - cistron:
        label: reporter_mcherry
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: ACT1_term