construct:
  name: "reversible_adhesion_switch_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: transcription_factor
        expression: high
        chain:
          - tag: FLAG
          - tag: NLS
          - cleavage_site: 2A
          - gene:
              id: dCas9
              source: uniprot

    - spacer: 30

    - cistron:
        label: adhesion_protein
        expression: high
        fused: false
        chain:
          - gene:
              id: NCAM1
              source: uniprot

    - spacer: 30

    - cistron:
        label: signal_sensor
        expression: medium
        fused: false
        chain:
          - tag: HA
          - gene:
              id: PIP2
              source: uniprot

    - terminator: rrnB_T1
