construct:
  name: "transcriptional_cascade_amplifier"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106
    - cistron:
        label: intermediate_regulator_B
        expression: low
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7
    - cistron:
        label: intermediate_regulator_C
        expression: medium
        gene:
          id: P07659
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T3
    - cistron:
        label: stable_output_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term