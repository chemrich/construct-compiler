construct:
  name: "dual_wavelength_light_controlled_mitochondrial_P"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: light_sensor_1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: VVD
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: light_dependent_transcription_factor
        expression: high
        chain:
          - tag: HA
          - gene:
              id: EL222
              source: uniprot
        fused: false

    - spacer: 25

    - cistron:
        label: target_protein_P
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: MTS
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_ODC1
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 25

    - cistron:
        label: degron_tuning_module
        expression: medium
        chain:
          - gene:
              id: phyB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
        fused: false

    - terminator: rrnB_T1
