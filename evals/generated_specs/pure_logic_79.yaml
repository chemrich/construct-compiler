construct:
  name: yeast_logic_router_S1_S2_S3
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: S1_receptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: STE2
              source: uniprot

    - spacer: 25

    - cistron:
        label: S2_state_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: AND_gate_integrase
        expression: medium
        fused: false
        chain:
          - gene:
              id: Cre
              source: uniprot

    - spacer: 25

    - cistron:
        label: S3_signal_transmitter
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: AGA2
              source: uniprot

    - spacer: 25

    - cistron:
        label: S2_internal_state_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
