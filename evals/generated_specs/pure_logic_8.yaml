construct:
  name: threshold_detector_switch
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: threshold_output
        expression: very_low
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: araBAD_promoter_regulated_enzyme
              source: uniprot

    - terminator: rrnB_T1
