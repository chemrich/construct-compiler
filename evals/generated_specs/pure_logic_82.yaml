construct:
  name: NOT_gate_yeast_metabolic
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: repressor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: LexA
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
