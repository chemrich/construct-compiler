construct:
  name: "tunable_periodic_oscillator"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: activator
        expression: medium
        fused: false
        gene:
          id: P0A9E0
          source: uniprot
    - spacer: 30
    - cistron:
        label: repressor
        expression: medium
        fused: false
        gene:
          id: P03023
          source: uniprot
    - spacer: 30
    - cistron:
        label: pulsating_reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1