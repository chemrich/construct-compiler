construct:
  name: "tunable_genetic_oscillator"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: repressor_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: activator_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: fluorescent_output
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    
    - spacer: 25
    
    - cistron:
        label: stability_factor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: ssrA
              source: uniprot
    
    - terminator: rrnB_T1
