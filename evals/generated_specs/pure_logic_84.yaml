construct:
  name: "graded_inducible_switch_negative_feedback"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: TetR
              source: uniprot

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: output_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P_effector
              source: uniprot

    - terminator: SV40_polyA

    - promoter: CMV

    - cistron:
        label: negative_feedback_regulator
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: feedback_repressor
              source: uniprot

    - terminator: SV40_polyA
