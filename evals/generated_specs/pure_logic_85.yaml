construct:
  name: nand_gate_split_repressor_HTS
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23106  # Constitutive output promoter; assumed to contain TetO operator sites for repression
    - cistron:
        label: output_z
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: rrnB_T1
    - promoter: araBAD  # Input I1: Arabinose-inducible promoter
    - cistron:
        label: i1_split_tetr_n
        expression: medium
        fused: false
        gene:
          id: P04483
          source: uniprot
    - terminator: T7term
    - promoter: lacUV5  # Input I2: IPTG-inducible promoter
    - cistron:
        label: i2_split_tetr_c
        expression: medium
        fused: false
        gene:
          id: P04483
          source: uniprot
    - terminator: BBa_B0015