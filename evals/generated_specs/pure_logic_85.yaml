construct:
  name: "two_input_NAND_gate"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_CI
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: CI
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_TetR
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: tetR
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_Z
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
