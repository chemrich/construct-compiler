construct:
  name: "mammalian_sr_latch_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: SET_sensor
        expression: high
        chain:
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP64
              source: uniprot

    - spacer: 30

    - cistron:
        label: RESET_sensor
        expression: high
        chain:
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot

    - spacer: 30

    - cistron:
        label: latch_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 2A
          - solubility_tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Insulin
              source: uniprot

    - terminator: rrnB_T1
