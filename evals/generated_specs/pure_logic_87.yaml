construct:
  name: "yeast_k_threshold_detector"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: corepressor_sensor
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: trpR
              source: uniprot
    - terminator: CYC1_term
    - promoter: TEF1_TrpO # Engineered promoter containing TrpR operator sites for threshold-dependent corepression by input K
    - cistron:
        label: colorimetric_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: ADH1_term