construct:
  name: "K_threshold_detector_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: K_sensor
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: GAL80
              source: uniprot

    - terminator: rrnB_T1

    - promoter: GAL1

    - cistron:
        label: repressor_tunable
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: MIG1
              source: uniprot

    - terminator: rrnB_T1

    - promoter: CYC1

    - cistron:
        label: colorimetric_reporter
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot

    - terminator: rrnB_T1
