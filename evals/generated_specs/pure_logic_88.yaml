construct:
  name: two_input_OR_gate_amplified
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # Input X: arabinose-inducible promoter

    - cistron:
        label: input_X_sensor
        expression: high
        chain:
          - gene:
              id: araC
              source: uniprot
              # AraC activator for araBAD promoter

    - spacer: 30

    - promoter: T7lac
      # Input Y: IPTG-inducible promoter

    - cistron:
        label: input_Y_sensor
        expression: high
        chain:
          - gene:
              id: lacI
              source: uniprot
              # LacI repressor; absence (high Y) derepresses output

    - spacer: 30

    - promoter: araBAD
      # Output promoter: activated by araC (from input X) OR constitutively active when LacI is absent (input Y OFF state)
      # This achieves OR logic: output ON if X present OR Y absent

    - cistron:
        label: output_amplifier
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: gfp
              source: fpbase
              # mEGFP for strong fluorescent signal amplification

    - spacer: 30

    - cistron:
        label: output_effector
        expression: very_high
        fused: false
        chain:
          - gene:
              id: luxAB
              source: uniprot
              # Bioluminescence operon for strong amplified output signal

    - terminator: rrnB_T1
