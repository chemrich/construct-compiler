construct:
  name: "T7_Amplified_OR_Gate_EColi"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Input X (Arabinose)
    - cistron:
        label: t7_pol_driver_x
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: lacUV5  # Input Y (IPTG)
    - cistron:
        label: t7_pol_driver_y
        gene:
          id: P00573
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 40
    - promoter: T7  # Amplification step
    - cistron:
        label: high_output_effector
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015