construct:
  name: delayed_activation_switch_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: input_sensor
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: rtTA3
              source: uniprot

    - spacer: 30

    - cistron:
        label: delay_module
        expression: medium
        chain:
          - gene:
              id: d2EGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: output
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
