construct:
  name: Delayed_ON_gate
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7lac

    - cistron:
        label: delay_circuit_repressor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: temporal_controller
        expression: high
        chain:
          - gene:
              id: ssrA_tagged_RNase
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: detoxification_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: katG
              source: uniprot

    - terminator: rrnB_T1
