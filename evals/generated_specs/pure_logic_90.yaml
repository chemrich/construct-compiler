construct:
  name: "E_coli_band_pass_filter_chromogenic"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD

    - cistron:
        label: repressor_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: low_threshold_sensor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot

    - spacer: 25

    - cistron:
        label: high_threshold_repressor
        expression: medium
        fused: false
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: chromogenic_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot

    - terminator: T7term
