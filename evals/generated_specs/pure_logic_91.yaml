construct:
  name: "yeast_XOR_gate_fluorescent"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: input_A_repressor
        expression: medium
        chain:
          - gene:
              id: GAL80
              source: uniprot

    - spacer: 25

    - cistron:
        label: input_B_repressor
        expression: medium
        chain:
          - gene:
              id: MIG1
              source: uniprot

    - spacer: 25

    - cistron:
        label: XOR_output
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
