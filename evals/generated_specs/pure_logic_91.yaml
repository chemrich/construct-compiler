construct:
  name: "yeast_xor_logic_gate_reporter"
  host: yeast
  backbone:
    catalog_vector: "pRS426"
  cassette:
    - promoter: "pXOR_A_B_synthetic" # Synthetic promoter integrated to activate only when (A OR B) and NOT (A AND B) are present
    - cistron:
        label: "output_E"
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: "CYC1"