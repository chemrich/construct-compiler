construct:
  name: "mammalian_protein_homeostat_negative_feedback"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: degradation_tag
        expression: high
        chain:
          - tag: degron_DD  # destabilizing degron for rapid turnover control
          - gene:
              id: P
              source: uniprot

    - spacer: 25

    - cistron:
        label: repressor_inhibitor
        expression: medium
        fused: false
        chain:
          - gene:
              id: miR_P_sponge
              source: uniprot
        # This synthetic circuit element sequesters microRNAs targeting P mRNA
        # As P concentration rises, feedback inhibition increases sponge expression
        # Sponge sequesters miRNAs → P mRNA is translated more → P accumulates
        # At steady state, P concentration auto-regulates via this negative loop

    - spacer: 25

    - cistron:
        label: miR_sensor
        expression: medium
        fused: false
        chain:
          - gene:
              id: miR_P_generator
              source: uniprot
        # Constitutive microRNA generator targeting P mRNA
        # Creates the negative feedback arm: high P → more sponge → less miR activity
        # Low P → less sponge → more miR activity on P mRNA

    - terminator: rrnB_T1
