construct:
  name: "triple_stage_amplification_cascade"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: lacUV5
    - cistron:
        label: stage_1_arac
        expression: low
        gene:
          id: "P0A9E5"
          source: uniprot
    - terminator: rrnB_T1
    - promoter: araBAD
    - cistron:
        label: stage_2_t7pol
        expression: medium
        gene:
          id: "P00573"
          source: uniprot
    - terminator: T7term
    - promoter: T7
    - cistron:
        label: stage_3_fliA
        expression: high
        gene:
          id: "P0AEC8"
          source: uniprot
    - terminator: rrnB_T1
    - promoter: fliC  # fliC promoter is activated by Sigma 28 (FliA) for the final stage of amplification
    - cistron:
        label: output_megfp
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BBa_B0015