construct:
  name: "multi_stage_signal_amplifier"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: stage1_sensor
        expression: very_low
        chain:
          - gene:
              id: luxR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      # Stage 1: weakly expressed input protein activates Stage 2

    - cistron:
        label: stage2_amplifier
        expression: low
        chain:
          - gene:
              id: tetR
              source: uniprot

    - terminator: rrnB_T1

    - promoter: trc99A
      # Stage 2: moderate expression of activator for Stage 3

    - cistron:
        label: stage3_amplifier
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD
      # Stage 3: high-level expression controlled by Stage 2/3 products

    - cistron:
        label: final_output
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
