construct:
  name: yeast_signal_register_memory_switch
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: signal_detector
        expression: high
        chain:
          - gene:
              id: LexA_DBD
              source: uniprot

    - spacer: 25

    - cistron:
        label: integrase
        expression: medium
        chain:
          - gene:
              id: Cre
              source: uniprot

    - spacer: 25

    - cistron:
        label: memory_lock
        expression: high
        chain:
          - gene:
              id: CI
              source: uniprot

    - spacer: 25

    - cistron:
        label: output_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
