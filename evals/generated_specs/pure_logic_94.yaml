construct:
  name: "yeast_lineage_tracking_memory_switch"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: signal_detector_recombinase
        expression: high
        gene:
          id: P06956
          source: uniprot
    - terminator: CYC1_term
    - promoter: TEF1
    - cistron:
        label: permanent_memory_reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - terminator: ADH1_term