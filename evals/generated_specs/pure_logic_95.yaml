construct:
  name: quorum_sensing_secreted_effector_circuit
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: acyl_homoserine_lactone_synthase
        expression: high
        chain:
          - gene:
              id: luxI
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: quorum_sensing_receptor
        expression: medium
        chain:
          - gene:
              id: luxR
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: araBAD
    
    - cistron:
        label: secreted_effector
        expression: high
        chain:
          - tag: PelB
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: rrnB_T1
