construct:
  name: "quorum_sensing_secreted_effector_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive promoter for quorum sensing machinery
    - cistron:
        label: luxI_synthase
        expression: medium
        gene:
          id: P12746
          source: uniprot
    - spacer: 30
    - cistron:
        label: luxR_regulator
        expression: medium
        fused: false
        gene:
          id: P12747
          source: uniprot
    - terminator: rrnB_T1
    - promoter: Plux  # Activated by LuxR-AHL complex at high cell density
    - cistron:
        label: effector_hGH
        expression: high
        chain:
          - tag: PelB  # N-terminal secretion signal for E. coli periplasmic export
          - gene:
              id: P01241
              source: uniprot
    - terminator: BBa_B0015