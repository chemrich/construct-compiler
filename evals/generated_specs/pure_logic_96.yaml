construct:
  name: "temperature_regulated_P_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Constitutively active promoter as requested
    - cistron:
        label: protein_P
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mEGFP
              source: fpbase
        # Note: Restricting constitutive expression to a 30-37°C band-pass range in mammalian cells 
        # requires a temperature-sensitive degron (e.g., TS-DHFR) or a temperature-sensitive 
        # intein to ensure protein stability/function is lost outside the permissive range.
    - terminator: BBa_B0015