construct:
  name: chemically_inducible_repressilator
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    # Gene 1: TetR repressor (represses PRmVenus promoter) - under araBAD control
    - promoter: araBAD
    
    - cistron:
        label: tetr
        expression: medium
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    # Gene 2: LacI repressor (represses Ptet promoter) - constitutive
    - promoter: lacUV5
    
    - cistron:
        label: laci
        expression: medium
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    # Gene 3: CI/lambda repressor (represses Plac promoter) - under TetR-repressible Ptet
    - promoter: Ptet
      # Repressed by TetR in absence of aTc; derepressed when aTc added
    
    - cistron:
        label: ci_reporter
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
    
    # Additional control: araBAD-inducible helper gene for fine-tuning oscillation onset
    - promoter: araBAD
    
    - cistron:
        label: oscillation_timer
        expression: low
        gene:
          id: ssrA_degradation_tag
          source: uniprot
    
    - terminator: rrnB_T1
