construct:
  name: "genetic_binary_adder_poc"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Representative logic surrogate for SUM output (A XOR B)
    - cistron:
        label: SUM_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: tac # Representative logic surrogate for CARRY output (A AND B)
    - cistron:
        label: CARRY_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015