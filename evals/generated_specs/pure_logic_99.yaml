construct:
  name: dual_stress_sensor_yeast
  host: yeast

  backbone:
    catalog_vector: pRS426
    resistance: uracil
    ori: 2μ
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: oxidative_stress_sensor
        expression: high
        chain:
          - gene:
              id: YAP1
              source: uniprot

    - spacer: 25

    - cistron:
        label: nutrient_starvation_sensor
        expression: high
        fused: false
        chain:
          - gene:
              id: GCN4
              source: uniprot

    - spacer: 25

    - cistron:
        label: synthetic_AND_gate
        expression: high
        fused: false
        chain:
          - gene:
              id: LexA_DBD_VP16
              source: uniprot

    - spacer: 25

    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
