construct:
  name: antibody_fragment_coexpression
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: light_chain_scFv_A
        expression: medium
        gene:
          id: scFv-A
    - spacer: 30
    - cistron:
        label: heavy_chain_placeholder
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1