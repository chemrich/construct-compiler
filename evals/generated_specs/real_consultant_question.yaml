construct:
  name: "human_fab_disulfide_optimized"
  host: e_coli_bl21_de3  # Recommended: use SHuffle or Origami strains for cytoplasmic disulfide bond formation
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: heavy_chain_fd
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: P01857 # Human IGHG1 constant region
              source: uniprot
    - spacer: 30
    - cistron:
        label: light_chain
        expression: high
        fused: false # Independent translation for proper stoichiometry
        gene:
          id: P01834 # Human IGKC constant region
          source: uniprot
    - terminator: T7term