construct:
  name: "mNeonGreen_MBP_solubility_optimized"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: optimized_mNeonGreen
        expression: medium
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: T7term