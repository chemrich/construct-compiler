```yaml
construct:
  name: "37C_soluble_expression_construct"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP # Maltose-binding protein (MBP) is used to promote solubility and prevent aggregation at 37°C
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP # Using mEGFP as a generic example gene to demonstrate the construct design
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```