```yaml
construct:
  name: "template_variant_expression_megfp_his"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: variant_gene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "YOUR_VARIANT_GENE_ID" # Placeholder for the gene of your 100 variants
              source: "YOUR_VARIANT_GENE_SOURCE" # e.g., uniprot, a custom sequence, or omit
    - spacer: 30
    - cistron:
        label: mEGFP_reporter
        expression: medium
        fused: false # mEGFP is translated independently as a reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```