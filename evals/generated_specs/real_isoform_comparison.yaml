```yaml
construct:
  name: "bicistronic_isoform_comparison_6xhis"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: isoform1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_isoform1

    - spacer: 30

    - cistron:
        label: isoform2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_isoform2

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
