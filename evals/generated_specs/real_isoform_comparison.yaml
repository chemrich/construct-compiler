construct:
  name: "bicistronic_isoform_comparison"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: isoform_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: TARGET_ISOFORM_1
              source: uniprot
    - spacer: 30
    - cistron:
        label: isoform_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: TARGET_ISOFORM_2
              source: uniprot
    - terminator: T7term