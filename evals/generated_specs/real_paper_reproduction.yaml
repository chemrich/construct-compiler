```yaml
construct:
  name: "kinase_substrate_bicistronic"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase
        expression: high
        gene:
          id: kinase_gene # Placeholder for kinase gene
    - spacer: 30
    - cistron:
        label: substrate
        expression: medium
        fused: false
        gene:
          id: substrate_gene # Placeholder for substrate gene
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```