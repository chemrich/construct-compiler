```yaml
construct:
  name: "bicistronic_his_tagged_wt_mutant_comparison"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: wild_type_protein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A_wt

    - spacer: 30

    - cistron:
        label: mutant_protein
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A_mutant

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```