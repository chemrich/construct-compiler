construct:
  name: "kinase_substrate_phosphorylation_assay"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase
        expression: high
        gene:
          id: P28482  # MAPK1/ERK2
          source: uniprot
    - spacer: 30
    - cistron:
        label: substrate
        expression: low
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P04637  # TP53
              source: uniprot
    - terminator: T7term