```yaml
construct:
  name: "kinase_substrate_assay"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase
        expression: high
        chain:
          - gene:
              id: YOUR_KINASE_ID_HERE # Specify UniProt ID or internal ID for your kinase
              source: uniprot # Or omit if internal ID
    - spacer: 30
    - cistron:
        label: substrate
        expression: low
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: YOUR_SUBSTRATE_ID_HERE # Specify UniProt ID or internal ID for your substrate
              source: uniprot # Or omit if internal ID
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```