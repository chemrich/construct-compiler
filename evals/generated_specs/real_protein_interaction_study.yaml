construct:
  name: "kinase_megfp_bait_affinity_capture"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: kinase_target
        expression: high
        chain:
          - gene:
              id: P17612
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: bait_protein
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P04637
              source: uniprot
    - terminator: T7term