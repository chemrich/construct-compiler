```yaml
construct:
  name: kinase_egfp_bait_coexpression
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: kinase_egfp_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: generic_kinase # Placeholder: please provide UniProt ID for specific kinase
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: bait_protein
        expression: medium
        fused: false
        gene:
          id: generic_bait_protein # Placeholder: please provide UniProt ID for specific bait protein
          source: uniprot

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
```