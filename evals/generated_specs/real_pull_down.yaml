construct:
  name: "GST_p53_DBD_bait"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: p53_bait
        expression: medium
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: P04637
              source: uniprot
    - terminator: T7term