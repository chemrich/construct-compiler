```yaml
construct:
  name: "gst_p53_dbd_bait"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: bait
        expression: medium
        chain:
          - solubility_tag: GST
          - cleavage_site: Thrombin
          - gene:
              id: P04637 # Human p53, assumed to refer to the DNA binding domain
              source: uniprot

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
