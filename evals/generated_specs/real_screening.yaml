```yaml
construct:
  name: "megfp_high_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: mEGFP
        # Only one of the requested expression levels (high) is provided as per the single YAML output constraint.
        # To test medium and low expression, generate separate constructs by changing this 'expression' field
        # or by using different promoters like tac (medium) or J23106 (low).
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```