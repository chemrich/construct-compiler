construct:
  name: "mEGFP_expression_level_screen"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: mEGFP_high
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: short_GS
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: mEGFP_medium
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: short_GS
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: mEGFP_low
        expression: low
        fused: false
        chain:
          - tag: 6xHis
          - linker:
              type: short_GS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term