construct:
  name: "GeneX_expression_low_recombination_risk"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GeneX
              source: uniprot

    - terminator: rrnB_T1
