```yaml
construct:
  name: polycistronic_GeneA_GeneB_GeneC
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 45  # unique spacer length

    - cistron:
        label: GeneB
        expression: medium
        fused: false  # independent translation with distinct RBS
        gene:
          id: GeneB
          source: uniprot

    - spacer: 32  # different spacer length

    - cistron:
        label: GeneC
        expression: low
        fused: false  # independent translation with distinct RBS
        gene:
          id: GeneC
          source: uniprot

    - terminator: rrnB_T1
```