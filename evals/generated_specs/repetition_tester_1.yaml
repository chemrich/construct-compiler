construct:
  name: polycistronic_GeneA_GeneB_GeneC_ecoli
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneA
        expression: high
        rbs: BBa_B0034
        chain:
          - tag: 6xHis
          - gene:
              id: GeneA
              source: uniprot

    - spacer: 35

    - cistron:
        label: GeneB
        expression: high
        fused: false
        rbs: BBa_B0030
        chain:
          - tag: Strep-II
          - gene:
              id: GeneB
              source: uniprot

    - spacer: 42

    - cistron:
        label: GeneC
        expression: high
        fused: false
        rbs: BBa_B0032
        chain:
          - tag: FLAG
          - gene:
              id: GeneC
              source: uniprot

    - terminator: rrnB_T1
