construct:
  name: "polycistronic_abc_expression_system"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_a
        expression: medium
        gene:
          id: GeneA
          source: uniprot
    - spacer: 32
    - cistron:
        label: gene_b
        expression: medium
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - spacer: 47
    - cistron:
        label: gene_c
        expression: medium
        fused: false
        gene:
          id: GeneC
          source: uniprot
    - terminator: rrnB_T1