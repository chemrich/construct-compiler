construct:
  name: yeast_surface_display_proteinZ_aga2p
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: randomized_diverse  # Non-repetitive randomized sequence
              length: 20  # amino acids
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: CYC1