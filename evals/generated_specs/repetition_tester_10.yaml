construct:
  name: yeast_surface_display_ProteinZ_Aga2p
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: HA
          - gene:
              id: ProteinZ
              source: uniprot
          - linker:
              type: randomized_nonrepetitive
              length_aa: 20
              description: "Randomized 20 aa linker designed to avoid recombination hotspots and repetitive sequences"
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
