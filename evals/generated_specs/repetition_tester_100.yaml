construct:
  name: "dual_tag_purification_difficult_protein"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - solubility_tag: MBP
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - cleavage_site: 3C
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: uniprot_target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: Factor_Xa
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: Twin-Strep

    - terminator: rrnB_T1
