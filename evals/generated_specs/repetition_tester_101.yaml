construct:
  name: "tri_effector_no_repeat"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      rbs: BBa_B0030
    - cistron:
        label: effector_1
        expression: high
        gene:
          id: toxin_A
          source: uniprot
    - terminator: rrnB_T1

    - promoter: J23106
      rbs: BBa_B0031
    - cistron:
        label: effector_2
        expression: high
        gene:
          id: toxin_B
          source: uniprot
    - terminator: rrnB_T2

    - promoter: trc
      rbs: BBa_B0034
    - cistron:
        label: effector_3
        expression: high
        gene:
          id: toxin_C
          source: uniprot
    - terminator: T7term
