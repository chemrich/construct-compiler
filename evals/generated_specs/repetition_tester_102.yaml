construct:
  name: mammalian_GOI_Renilla_luciferase_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: GOI_luciferase_fusion
        expression: high
        chain:
          - gene:
              id: Renilla_luciferase
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: placeholder_GOI
              source: uniprot
        # Note: Replace placeholder_GOI with actual gene of interest ID

    - terminator: SV40_poly_A

    # Secondary polyadenylation signal for robust termination
    - terminator: BGH_poly_A
