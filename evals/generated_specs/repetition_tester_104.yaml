construct:
  name: "yeast_alpha_beta_IRES_polycistronic"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: alpha_subunit
        expression: high
        gene:
          id: ALPHA_SUBUNIT
          source: uniprot
        codon_optimize: S_cerevisiae

    - ires:
        type: IRES_chimeric_yeast_optimized
        divergent_variant: true

    - cistron:
        label: beta_subunit
        expression: high
        fused: false
        gene:
          id: BETA_SUBUNIT
          source: uniprot
        codon_optimize: S_cerevisiae

    - terminator: PGK1_terminator
