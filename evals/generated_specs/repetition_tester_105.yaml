construct:
  name: "CRISPR_Cas9_triple_gRNA_array_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      # Pol III promoter for robust, non-repetitive small RNA expression

    - cistron:
        label: gRNA_1
        expression: high
        fused: false
        chain:
          - gene:
              id: "guide_RNA_target_gene_1"
              source: custom
              # 20bp spacer sequence + canonical SVN (GTTTAAGAGCTAAGCTGGAA) scaffold

    - spacer: 75
      # Non-homologous linker (tevopreQ1 aptamer derivative or synthetic GC-rich separator)
      # Prevents recombination and ensures independent processing

    - cistron:
        label: gRNA_2
        expression: high
        fused: false
        chain:
          - gene:
              id: "guide_RNA_target_gene_2"
              source: custom
              # 20bp spacer sequence + alternate SVN variant scaffold (GTTTAAGAGCTAAGCTGGAA with 2bp wobble at position 15-16)

    - spacer: 75
      # Distinct GC-rich synthetic linker (non-repetitive poly-T resistant)

    - cistron:
        label: gRNA_3
        expression: high
        fused: false
        chain:
          - gene:
              id: "guide_RNA_target_gene_3"
              source: custom
              # 20bp spacer sequence + canonical SVN scaffold

    - terminator: "polyT_U6"
      # Pol III termination (4x T)
