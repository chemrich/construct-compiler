construct:
  name: "mammalian_triple_gRNA_array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: target_1
        gene:
          id: sgRNA_scaffold_variant_A
    - spacer: 32 # Unique non-homologous spacer/linker 1
    - cistron:
        label: target_2
        fused: false # Independent functional unit
        gene:
          id: sgRNA_scaffold_variant_B
    - spacer: 45 # Unique non-homologous spacer/linker 2
    - cistron:
        label: target_3
        fused: false # Independent functional unit
        gene:
          id: sgRNA_scaffold_variant_C
    - terminator: BBa_B0015 # Generic terminator for Pol III transcript termination