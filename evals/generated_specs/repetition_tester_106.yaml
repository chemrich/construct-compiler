construct:
  name: secreted_protein_ecoli_periplasm
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # strong constitutive promoter, distinct from T7/araBAD

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: pelB  # N-terminal periplasmic signal peptide (highly efficient, non-homologous to cytoplasmic sequences)
          - gene:
              id: "PLACEHOLDER_GOI"  # Replace with actual gene ID
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: rrnB_T1
