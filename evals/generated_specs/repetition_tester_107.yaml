construct:
  name: "plant_herbicide_resistance_vector"
  host: algae

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - utr_5prime: "GCCGCCACCATG"
      # 5' UTR variant 1: RBS + spacer optimized for plants

    - utr_5prime_alt: "AAACCCGGGAAAAGTGC"
      # 5' UTR variant 2: structurally distinct Kozak-like element (non-overlapping)

    - cistron:
        label: herbicide_resistance
        expression: high
        gene:
          id: bar
          source: uniprot
        # bar gene (phosphinothricin acetyltransferase) for herbicide resistance

    - utr_3prime: "AATAGTGATCGATCGATCGATCG"
      # 3' UTR variant 1: unique polyadenylation signal sequence

    - utr_3prime_alt: "TTTTTTGAGACGATATATCGCGCGAAT"
      # 3' UTR variant 2: distinct termination element (non-homologous)

    - terminator: rrnB_T1
      # Bacterial terminator for plasmid stability
