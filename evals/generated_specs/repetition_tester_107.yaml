construct:
  name: "plant_herbicide_resistance_vector"
  host: mammalian # Substituting plant host for mammalian as it is the closest eukaryotic match in the schema
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV35S # High-strength constitutive plant promoter
    - cistron:
        label: pat_resistance
        expression: high
        gene:
          id: P16425
          source: uniprot
    - terminator: Nos_T # First 3' UTR / termination signal
    - terminator: OCS_T # Second non-homologous 3' UTR / termination signal