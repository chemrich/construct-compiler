construct:
  name: "constitutive_repressor_dual_terminator"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    - terminator: BBa_B0015
