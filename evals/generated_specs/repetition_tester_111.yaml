construct:
  name: "HEK293_P2RX2_2TM_Construct"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_2TM_protein
        expression: high
        chain:
          - tag: IgK_leader
          - gene:
              id: Q9UBL9
              source: uniprot
    - terminator: bGH_pA
# Note: Differential codon optimization for TM1/TM2 and unique extracellular loop/linker sequences cannot be specified via UniProt IDs in this YAML schema; these requirements must be implemented during the sequence synthesis and optimization phase for the P2RX2 (Q9UBL9) scaffold.