construct:
  name: "mammalian_2TM_membrane_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: membrane_protein
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: SP_alpha_factor_mammalian
          - gene:
              id: TM1_codon_optimized_v1
              source: custom
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: extracellular_loop_unique
              source: custom
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: TM2_codon_optimized_v2
              source: custom

    - terminator: rrnB_T1
