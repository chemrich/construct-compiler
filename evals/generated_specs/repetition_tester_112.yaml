construct:
  name: phage_display_pIII_fusion
  host: e_coli_bl21
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: peptide_variant
        expression: high
        chain:
          - gene:
              id: PEPTIDE_VARIANT
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
              sequence: "GGAGCGGTGGATCAGGTGGATCA"
          - gene:
              id: pIII
              source: uniprot
    
    - terminator: rrnB_T1
