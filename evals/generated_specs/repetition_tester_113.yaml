construct:
  name: "S_cerevisiae_inducible_expression_system"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: GFP
              source: fpbase

    - terminator: CYC1

    - spacer: 25

    - promoter: MET25

    - cistron:
        label: selection_marker
        expression: medium
        fused: false
        gene:
          id: URA3
          source: uniprot

    - terminator: ADH1
