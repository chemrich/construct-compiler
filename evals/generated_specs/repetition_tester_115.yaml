construct:
  name: "dual_IRES_mammalian_enzyme_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P69905
              source: uniprot
        codon_optimization: mammalian
        notes: "Lactase (beta-galactosidase), mammalian-optimized"

    - element:
        type: IRES
        id: IRES_EMCV
        notes: "Encephalomyocarditis virus IRES - non-homologous to HCV"

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P04637
              source: uniprot
        codon_optimization: mammalian
        notes: "Cellulase (Trichoderma reesei), mammalian-optimized, distinct codon usage"

    - polyA_signal: SV40
      notes: "SV40 polyadenylation signal for enzyme_1"

    - polyA_signal: bGH
      notes: "Bovine growth hormone polyadenylation signal for enzyme_2"

    - terminator: rrnB_T1
