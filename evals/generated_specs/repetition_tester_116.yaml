construct:
  name: "dual_tag_solubility_construct"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_with_tags
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: target_orf
              source: uniprot
          - linker:
              type: short_GS
              repeats: 2
          - solubility_tag: SUMO

    - terminator: rrnB_T1
