construct:
  name: "inducible_plant_expression_unique_regulatory"
  host: algae
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: dexamethasone_inducible
      # Unique synthetic inducible system: GVG transactivator (glucocorticoid-inducible)
      # non-homologous to endogenous plant promoters; requires dexamethasone treatment
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: gfp_a206k
              source: uniprot
    
    - terminator: nos_3utr_synthetic1
      # First 3' UTR: synthetic design derived from nopaline synthase terminator
      # with engineered polyadenylation signals
    
    - terminator: ocs_3utr_synthetic2
      # Second 3' UTR: octopine synthase derived synthetic terminator
      # dual termination ensures robust transcript stability and prevents read-through
