construct:
  name: "inducible_unique_plant_expression_system"
  host: mammalian # Plant host not explicitly in schema; mammalian used as eukaryotic proxy
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: XVE_inducible_system # Estradiol-inducible unique promoter system for plants
    - cistron:
        label: target_gene
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: NOS_plus_VTC2_tandem_UTR # Dual non-homologous 3' UTRs for robust termination