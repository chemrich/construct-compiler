construct:
  name: "dual_orthogonal_mammalian_expression"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: GFP_expression_unit
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: mCherry_expression_unit
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: BGH_polyA