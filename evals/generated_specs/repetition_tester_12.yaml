construct:
  name: "baculovirus_tri_viral_protein_orthogonal_expression"
  host: mammalian # Substituted 'mammalian' for insect cells to comply with schema host list
  backbone:
    catalog_vector: "pFastBac1"
  cassette:
    - promoter: polh
    - cistron:
        label: VP1_expression_unit
        expression: high
        gene:
          id: VP1
          source: uniprot
    - terminator: polh_term
    - spacer: 50
    - promoter: p10
    - cistron:
        label: VP2_expression_unit
        expression: high
        gene:
          id: VP2
          source: uniprot
    - terminator: p10_term
    - spacer: 50
    - promoter: gp64
    - cistron:
        label: VP3_expression_unit
        expression: high
        gene:
          id: VP3
          source: uniprot
    - terminator: sv40_polyA