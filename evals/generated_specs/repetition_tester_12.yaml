construct:
  name: "baculovirus_VP1_VP2_VP3_triple_expression"
  host: insect_cells
  
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: polyhedrin
      
    - cistron:
        label: VP1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: VP1
              source: uniprot
    
    - terminator: SV40_poly_A

    - spacer: 50

    - promoter: p10
      
    - cistron:
        label: VP2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: VP2
              source: uniprot
    
    - terminator: hGH_poly_A

    - spacer: 50

    - promoter: ie1
      
    - cistron:
        label: VP3
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: VP3
              source: uniprot
    
    - terminator: TK_poly_A
