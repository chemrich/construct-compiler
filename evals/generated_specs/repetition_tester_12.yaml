```yaml
construct:
  name: orthogonal_viral_protein_triad
  host: sf9  # insect cells for baculovirus system

  backbone:
    catalog_vector: pFastBac1
    source: invitrogen

  cassette:
    - promoter: polyhedrin
    - cistron:
        label: VP1
        expression: high
        gene:
          id: P03300  # VP1 example - replace with actual VP1 UniProt ID
          source: uniprot
    - terminator: polyhedrin_3UTR

    - spacer: 200  # substantial spacing between independent expression units

    - promoter: p10
    - cistron:
        label: VP2
        expression: high
        gene:
          id: P03301  # VP2 example - replace with actual VP2 UniProt ID
          source: uniprot
    - terminator: SV40_polyA

    - spacer: 200

    - promoter: ie1  # immediate early 1 promoter - completely orthogonal
    - cistron:
        label: VP3
        expression: high
        gene:
          id: P03302  # VP3 example - replace with actual VP3 UniProt ID
          source: uniprot
    - terminator: hr5_enhancer_term  # baculovirus hr5 region terminator
```