construct:
  name: "ProteinA_StrepTag_ProteinB_FlagTag_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinA_with_C_terminal_Strep
        expression: high
        chain:
          - gene:
              id: ProteinA
              source: uniprot
          - tag: Strep-II

    - spacer: 35

    - cistron:
        label: ProteinB_with_N_terminal_Flag
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
