construct:
  name: "dual_reporter_mammalian_diversity"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_pA
    - spacer: 60
    - promoter: CMV
    - cistron:
        label: green_fluorescent_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_pA