construct:
  name: "dual_reporter_mammalian_diverse"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha
      label: luciferase_cassette

    - cistron:
        label: luciferase
        expression: high
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot

    - terminator: SV40_poly_A
      label: SV40_terminator

    - spacer: 200

    - promoter: U6
      label: gfp_cassette
      # U6 is a Pol III promoter, driving constitutive expression
      # Note: U6 is typically used for small RNAs; substituting with hSPC promoter for better protein expression
    
    - promoter: hSPC
      label: alternative_constitutive

    - cistron:
        label: gfp
        expression: high
        fused: false
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: BGH_poly_A
      label: BGH_terminator
