construct:
  name: "yeast_secreted_PeptideY"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: SP_Alpha
          - gene:
              id: PeptideY
              source: uniprot

    - terminator: CYC1
