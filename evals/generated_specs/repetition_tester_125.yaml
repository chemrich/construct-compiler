construct:
  name: DomainA_DomainB_GS3_linker
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
              codon_optimization: max_entropy
          - gene:
              id: DomainB
              source: uniprot

    - terminator: rrnB_T1
