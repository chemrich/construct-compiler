construct:
  name: "tripartite_operon_GeneXYZ"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneX
        expression: high
        gene:
          id: GeneX
          source: uniprot

    - spacer: 45

    - cistron:
        label: GeneY
        expression: high
        fused: false
        gene:
          id: GeneY
          source: uniprot

    - spacer: 52

    - cistron:
        label: GeneZ
        expression: high
        fused: false
        gene:
          id: GeneZ
          source: uniprot

    - terminator: rrnB_T1
