construct:
  name: "conditional_expression_system_ecoli"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      comment: "Constitutive expression of repressor"

    - cistron:
        label: Repressor_Protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacI
              source: uniprot
              codon_optimization: ecoli_rare_codon_optimized

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: custom_operator_promoter
      comment: "Repressible promoter with custom operator sequence unique to this repressor variant"
      operator: custom_unique_operator_1

    - cistron:
        label: Controlled_GOI
        expression: medium
        chain:
          - tag: 8xHis
          - gene:
              id: gfp
              source: fpbase
              codon_optimization: ecoli_high_diversity_codon_set
              comment: "Codon-optimized for maximum sequence diversity from standard variants"

    - terminator: T7term
