construct:
  name: "orthogonal_conditional_expression_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106  # Strong constitutive promoter for repressor expression
    - cistron:
        label: phlf_repressor
        expression: medium
        gene:
          id: P0A2L0  # PhlF transcriptional repressor
          source: uniprot
    - terminator: BBa_B0015  # Bidirectional terminator to isolate transcriptional units
    - spacer: 50
    - promoter: pPhlF  # Orthogonal promoter repressed by PhlF
    - cistron:
        label: controlled_goi
        expression: high
        fused: false  # Ensures independent translation with its own RBS
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1  # Distinct terminator to maintain sequence diversity