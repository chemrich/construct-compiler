```yaml
construct:
  name: Gateway_dual_destination_vector
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: attR1_1_site
        expression: very_low
        gene:
          id: attR1.1_recombination_site
          # Gateway attR1.1 variant for first cloning site
    
    - spacer: 50
    
    - cistron:
        label: ccdB_counter_selection
        expression: medium
        gene:
          id: ccdB_codon_optimized
          # Codon-optimized ccdB for negative selection against empty vector
    
    - spacer: 50
    
    - cistron:
        label: attR2_2_site
        expression: very_low
        gene:
          id: attR2.2_recombination_site
          # Gateway attR2.2 variant for second cloning site - distinct from attR1.1
    
    - terminator: rrnB_T1
```