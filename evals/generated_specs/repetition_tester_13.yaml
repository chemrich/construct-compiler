construct:
  name: Gateway_destination_dual_attR_ccdB
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Custom backbone with dual Gateway attR sites and codon-optimized ccdB
    features:
      - att_site:
          type: attR1.1
          variant: Gateway_recombination_site_1
          position: upstream
      - ccdB_variant:
          id: ccdB_ec_codon_optimized
          source: custom
          description: "E. coli-optimized ccdB for enhanced counter-selection"
      - att_site:
          type: attR2.2
          variant: Gateway_recombination_site_2
          position: downstream
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: destination_cassette
        expression: medium
        chain:
          - gene:
              id: ccdB_ec_codon_optimized
              source: custom
    
    - terminator: rrnB_T1
