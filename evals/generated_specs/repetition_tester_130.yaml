construct:
  name: "FactorX_FactorY_dual_inducible_mammalian"
  host: HEK293

  cassette:
    - promoter: TRE_tight
      # Tet-On inducible promoter (tetracycline response element)

    - cistron:
        label: FactorX
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: FactorX
              source: uniprot

    - polyadenylation: SV40_poly_A
      # SV40 polyadenylation signal

    - promoter: Cumate_inducible
      # Cumate-responsive promoter (non-homologous to TRE)

    - cistron:
        label: FactorY
        expression: high
        chain:
          - tag: HA
          - gene:
              id: FactorY
              source: uniprot

    - polyadenylation: BGH_poly_A
      # BGH (bovine growth hormone) polyadenylation signal (structurally divergent from SV40)

    - terminator: rrnB_T1
      # Prokaryotic terminator for final construct boundary
