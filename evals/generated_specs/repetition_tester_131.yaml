construct:
  name: "S_cerevisiae_BaitProtein_DBD_twohybrid"
  host: yeast
  
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: GAL4
    
    - cistron:
        label: bait_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: BaitProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: GAL4_DBD
              source: uniprot
    
    - terminator: rrnB_T1
