construct:
  name: "Bacillus_IndustrialEnzyme_secretion"
  host: bacillus

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: IndustrialEnzyme_secreted
        expression: high
        chain:
          - tag: signal_peptide_AmyE
          - gene:
              id: IndustrialEnzyme
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
