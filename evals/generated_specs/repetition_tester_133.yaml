construct:
  name: multi_domain_fusion_ecoli_optimized
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: multi_domain_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Domain1
              source: uniprot
              codon_optimization: e_coli_max
          - linker:
              type: custom
              sequence: GGSGGSGGSGGT
              label: linker_A
          - gene:
              id: Domain2
              source: uniprot
              codon_optimization: e_coli_max
          - linker:
              type: custom
              sequence: GSGGSGGSGGS
              label: linker_B
          - gene:
              id: Domain3
              source: uniprot
              codon_optimization: e_coli_max

    - terminator: rrnB_T1
