construct:
  name: "diversified_u6_grna_target1_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6  # Sequence diversity required; implementer should use an orthogonal U6 variant (e.g., from a different species or synthetic)
    - cistron:
        label: grna_target1
        expression: high
        gene:
          id: "gRNA_Target1_orthogonal_scaffold" # Scaffold sequence must be diversified to prevent recombination with existing U6/scaffold systems
    - terminator: poly_T # Standard Pol III termination sequence (TTTTTT)