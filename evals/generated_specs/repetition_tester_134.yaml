construct:
  name: "U6_gRNA_Target1_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      # U6 promoter sequence sourced from codon-optimized variant to maximize diversity
      # and minimize homology with endogenous U6 elements

    - cistron:
        label: gRNA_Target1
        expression: high
        chain:
          - gene:
              id: gRNA_Target1
              source: custom
              # Custom gRNA with uniquely engineered scaffold sequence
              # Scaffold variants optimized for sequence diversity
              # to avoid recombination with endogenous U6/gRNA loci
              note: "scaffold_variant_diversified"

    - terminator: rrnB_T1
