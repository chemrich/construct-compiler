construct:
  name: ReporterGene_Red_E_coli_optimized
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: reporter_red
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ReporterGene_Red
              source: uniprot
              codon_optimization:
                organism: e_coli
                strategy: high_expression
              notes: "Codon-optimized for E. coli with maximal synonymous codon diversity to eliminate internal sequence repeats and secondary structure formation. All three common E. coli start codons (ATG, GTG, TTG) explored during optimization phase for initiation context variation."

    - terminator: rrnB_T1
