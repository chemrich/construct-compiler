construct:
  name: dual_carrier_peptide_fusion_ecoli
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_1_CarrierZ_PeptideX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: CarrierProtein_Z
              source: uniprot
          - linker:
              type: custom_linker_X
              sequence: GGSGGSGGS
          - gene:
              id: Peptide_X
              source: uniprot

    - spacer: 30

    - cistron:
        label: fusion_2_CarrierZ_PeptideY
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: CarrierProtein_Z_codon_optimized
              source: uniprot
          - linker:
              type: custom_linker_Y
              sequence: AAPVSTSGGGS
          - gene:
              id: Peptide_Y
              source: uniprot

    - terminator: rrnB_T1
