construct:
  name: dual_reporter_mammalian_distinct_elements
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV
      # CMV promoter (distinct from subsequent promoters)

    - cistron:
        label: ReporterA
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
              codon_usage: human_optimized_variant_A

    - terminator: SV40_polyA
      # SV40 polyadenylation signal (distinct from subsequent)

    - promoter: EF1_alpha
      # EF1-alpha promoter (non-homologous to CMV)

    - cistron:
        label: ReporterB
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
              codon_usage: human_optimized_variant_B

    - terminator: bGH_polyA
      # bGH polyadenylation signal (non-homologous to SV40)
