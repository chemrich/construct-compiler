construct:
  name: "dual_mammalian_reporter_recombination_resistant"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ReporterA
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA
    - promoter: EF1_alpha
    - cistron:
        label: ReporterB
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA