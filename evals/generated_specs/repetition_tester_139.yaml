construct:
  name: "intein_split_splicing_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: n_terminal_fusion
        expression: high
        chain:
          - gene:
              id: ProteinFragment_N
              source: uniprot
          - gene:
              id: gp41-1_N_intein
              source: uniprot
    - spacer: 30
    - cistron:
        label: c_terminal_fragment
        expression: high
        fused: false
        gene:
          id: ProteinFragment_C
          source: uniprot
    - terminator: T7term