construct:
  name: intein_mediated_protein_splicing_precursor
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: precursor_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: extein_N_terminal
              source: uniprot
              codon_optimization: standard

          - gene:
              id: Gp41_1_intein
              source: uniprot
              codon_optimization: aggressive
              note: "Extensively codon-optimized Mycobacterium xenopi GyrA intein with no internal repeats or secondary structure homology to flanking exteins"

          - gene:
              id: extein_C_terminal
              source: uniprot
              codon_optimization: standard

    - terminator: rrnB_T1
