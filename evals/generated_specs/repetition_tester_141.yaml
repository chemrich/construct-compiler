construct:
  name: "FusionY_Internal_Loop_Design"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: FusionY_Domain_A
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: FusionY_Domain_B
          - tag: 6xHis # The DNA sequence for this C-terminal tag must be synonymous with the internal tag to avoid repeats
    - terminator: bGH_polyA