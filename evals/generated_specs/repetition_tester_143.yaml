construct:
  name: "dual_operon_GeneA_GeneB_recombination_resistant"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    # First operon
    - cistron:
        label: GeneA_operon1
        expression: high
        gene:
          id: GeneA
          source: uniprot
          variant: syn_v1
          # syn_v1 indicates first synonymous codon variant

    - spacer: 25
      # First intergenic linker (GS-rich spacer)

    - cistron:
        label: GeneB_operon1
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
          variant: syn_v1

    - spacer: 30

    - terminator: rrnB_T1

    # Second operon (identical function, distinct sequences)
    - promoter: T7lac

    - cistron:
        label: GeneA_operon2
        expression: high
        gene:
          id: GeneA
          source: uniprot
          variant: syn_v2
          # syn_v2 indicates second synonymous codon variant

    - spacer: 28
      # Second intergenic linker (different length and composition)

    - cistron:
        label: GeneB_operon2
        expression: high
        fused: false
        gene:
          id: GeneB
          source: uniprot
          variant: syn_v2

    - terminator: rrnB_T1
