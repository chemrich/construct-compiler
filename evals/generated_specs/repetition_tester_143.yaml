construct:
  name: "tandem_synonymous_operons_A_B"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_A_v1
        gene:
          id: GeneA
          source: uniprot
    - spacer: 30
    - cistron:
        label: gene_B_v1
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - spacer: 50 # Inter-operon spacer to separate functional units
    - promoter: T7lac
    - cistron:
        label: gene_A_v2 # Synonymous variant to prevent homologous recombination
        gene:
          id: GeneA
          source: uniprot
    - spacer: 35 # Non-identical intergenic spacer variant
    - cistron:
        label: gene_B_v2 # Synonymous variant to prevent homologous recombination
        fused: false
        gene:
          id: GeneB
          source: uniprot
    - terminator: T7term