  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ComplexW
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainB
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: DomainB
              source: uniprot

    - terminator: rrnB_T1
