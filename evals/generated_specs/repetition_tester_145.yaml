construct:
  name: ReporterG_dual_terminator
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: reporter
        expression: high
        gene:
          id: ReporterG
          source: uniprot
    
    - terminator: rrnB_T1
    
    - terminator: T7term
