construct:
  name: "TheraProt_E_coli_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: TheraProt_bacterial
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TheraProt
              source: uniprot
              codon_optimization: e_coli
    
    - terminator: rrnB_T1
