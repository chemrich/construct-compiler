construct:
  name: "LinkerProt_multi_domain"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: LinkerProt
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: DomainD
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: DomainE
              source: uniprot

    - terminator: rrnB_T1
