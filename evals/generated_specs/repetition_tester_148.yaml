construct:
  name: dual_iptg_inducible_genef_expression
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: genef_copy_1
        expression: high
        gene:
          id: GeneF
          source: uniprot
    - spacer: 50
    - promoter: tac
    - cistron:
        label: genef_copy_2
        expression: high
        fused: false
        gene:
          id: GeneF
          source: uniprot
    - terminator: T7term