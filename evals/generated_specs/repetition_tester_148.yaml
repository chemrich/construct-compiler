construct:
  name: "dual_inducible_GeneF_control"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: GeneF_1
        expression: high
        gene:
          id: GeneF
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: araBp

    - cistron:
        label: GeneF_2
        expression: high
        gene:
          id: GeneF
          source: uniprot

    - terminator: rrnB_T1
