construct:
  name: "GeneH_dual_RBS_efficiency"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneH_RBS1
        expression: high
        gene:
          id: GeneH
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: GeneH_RBS2
        expression: high
        gene:
          id: GeneH
          source: uniprot

    - terminator: rrnB_T1
