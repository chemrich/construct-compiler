construct:
  name: "tandem_peptide_p_high_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: triple_peptide_p
        expression: high
        # Note: Compiler will handle codon shuffling for the redundant PeptideP entries to minimize repetitive sequence identity.
        chain:
          - gene:
              id: PeptideP
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: PeptideP
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: PeptideP
    - terminator: T7term