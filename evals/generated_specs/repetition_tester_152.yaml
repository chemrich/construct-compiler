construct:
  name: "dual_antisense_TargetM_knockdown"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1
      cistron:
        label: antisense_TargetM_region1
        expression: high
        chain:
          - gene:
              id: antisense_TargetM_AS1
              source: custom
              sequence: "GACGTCGATCGATCGATCGATCGATCGAT"
              description: "Antisense RNA targeting TargetM mRNA region 1"

    - terminator: CYC1

    - spacer: 30

    - promoter: PGK1
      cistron:
        label: antisense_TargetM_region2
        expression: high
        chain:
          - gene:
              id: antisense_TargetM_AS2
              source: custom
              sequence: "TCGATAGCTAGCTAGCTAGCTAGCTAGCTA"
              description: "Antisense RNA targeting TargetM mRNA region 2, non-homologous to AS1"

    - terminator: ADH1
