construct:
  name: "TargetM_yeast_dual_antisense_knockdown"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: antisense_reg1
        gene:
          id: TargetM_antisense_1
          source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TEF1
    - cistron:
        label: antisense_reg2
        gene:
          id: TargetM_antisense_2
          source: uniprot
    - terminator: ADH1_term