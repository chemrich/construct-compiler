construct:
  name: "dual_constitutive_GeneN_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: GeneN_unit1
        expression: high
        gene:
          id: GeneN
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: J23106

    - cistron:
        label: GeneN_unit2
        expression: high
        gene:
          id: GeneN
          source: uniprot

    - terminator: BBa_B0015
