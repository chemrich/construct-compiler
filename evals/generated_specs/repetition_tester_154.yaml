construct:
  name: "SpacerProt_NonHomologous_Fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: DomainF
              source: uniprot
          - linker:
              # GS_flexible and short_GS provide non-homologous sequences with similar flexible properties
              type: GS_flexible
              repeats: 4
          - linker:
              type: short_GS
              repeats: 4
          - gene:
              id: DomainG
              source: uniprot
    - terminator: T7term