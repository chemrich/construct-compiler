construct:
  name: "SpacerProt_dual_spacer_variants"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: SpacerProt_variant_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainF
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: DomainG
              source: uniprot
    
    - terminator: rrnB_T1

    - spacer: 100
    
    - cistron:
        label: SpacerProt_variant_B
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainF
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: DomainG
              source: uniprot
    
    - terminator: rrnB_T1
