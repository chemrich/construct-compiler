construct:
  name: "dual_secreted_protein_S_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_protein_S_v1
        expression: high
        chain:
          - signal_peptide: IgG_signal  # IgG leader sequence for mammalian secretion
          - gene:
              id: SecretedProteinS
              source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_protein_S_v2
        expression: high
        fused: false
        chain:
          - signal_peptide: HPA_signal  # Human placental alkaline phosphatase signal peptide (structurally distinct)
          - gene:
              id: SecretedProteinS
              source: uniprot

    - terminator: rrnB_T1
