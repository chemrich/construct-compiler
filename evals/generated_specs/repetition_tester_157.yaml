construct:
  name: "dual_sgRNA_CRISPR_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    # pX330 is a standard mammalian CRISPR/Cas9 delivery vector

  cassette:
    - promoter: U6

    - cistron:
        label: sgRNA_Locus1
        expression: high
        gene:
          id: sgRNA_Locus1_scaffold_variant_A
          # Custom sgRNA targeting Locus1 with scaffold variant A
          # Variant A uses codon-optimized scaffold maintaining secondary structure
          source: custom

    - spacer: 30

    - promoter: U6

    - cistron:
        label: sgRNA_Locus2
        expression: high
        gene:
          id: sgRNA_Locus2_scaffold_variant_B
          # Custom sgRNA targeting Locus2 with scaffold variant B
          # Variant B uses alternative codon usage and wobble positions
          # maintaining critical stem-loop and tetraloop while diverging at silent sites
          source: custom

    - terminator: BBa_B0015
