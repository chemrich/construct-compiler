construct:
  name: "GeneX_sfGFP_reporter_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: reporter_fusion
        expression: high
        chain:
          - gene:
              id: GeneX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term