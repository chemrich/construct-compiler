construct:
  name: "orthogonal_dual_shRNA_mammalian_vector"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_target_1
        expression: high
        gene:
          id: "shRNA_sequence_A"
    - terminator: U6_terminator
    - spacer: 50
    - promoter: H1
    - cistron:
        label: shRNA_target_2
        expression: high
        gene:
          id: "shRNA_sequence_B"
    - terminator: H1_terminator