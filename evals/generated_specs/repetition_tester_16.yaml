    resistance: ampicillin

  cassette:
    - promoter: U6
      
    - cistron:
        label: shRNA_1
        expression: high
        gene:
          id: shRNA_target_1
          source: custom
          sequence: GCTAGCCTAATACGACTCACTATAGGTGAAGCCGCAGTCTGTGAGTTTCAAGAGAACTCACAGACTGCGGCTTCTTTTTGGAAGG

    - terminator: BBa_B0015

    - spacer: 50

    - promoter: H1
      
    - cistron:
        label: shRNA_2
        expression: high
        gene:
          id: shRNA_target_2
          source: custom
          sequence: GGTACCCTAATACGACTCACTATAGGCGACTACGACGTCTAGCGATTTTAAGAGAATCGCTAGACGTCGTAGTCGTTTTTGGAAGG

    - terminator: rrnB_T1
