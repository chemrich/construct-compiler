construct:
  name: "yeast_triple_enzyme_operon_codon_optimized"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: SynthaseX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: SynthaseX
              source: uniprot
              codon_optimization: "yeast_maximal_diversity_v1"

    - spacer: 45
      comment: "Functionally equivalent RBS + terminator region with sequence variant A; genetically distinct from downstream spacers"

    - cistron:
        label: KinaseY
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: KinaseY
              source: uniprot
              codon_optimization: "yeast_maximal_diversity_v2"

    - spacer: 45
      comment: "Functionally equivalent RBS + terminator region with sequence variant B; distinct from variant A"

    - cistron:
        label: ReductaseZ
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - cleavage_site: Factor_Xa
          - gene:
              id: ReductaseZ
              source: uniprot
              codon_optimization: "yeast_maximal_diversity_v3"

    - terminator: CYC1
      comment: "Yeast transcriptional terminator; sequence variant C, distinct from upstream spacers"
