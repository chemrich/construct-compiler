construct:
  name: tandem_ReporterFP_no_recombination_HEK293
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ReporterFP_v1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
              codon_optimization: human_optimized_v1

    - linker:
        type: custom_unique
        sequence: GGSGGSGGSGGSGGSGGSGGS
        repeats: 1

    - cistron:
        label: ReporterFP_prime_v2
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
              codon_optimization: human_optimized_v2

    - terminator: SV40_poly_A

    # Second independent expression unit with distinct poly(A) signal
    - spacer: 50

    - promoter: EF1_alpha

    - cistron:
        label: ReporterFP_v1_independent
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase
              codon_optimization: human_optimized_v1

    - terminator: BGH_poly_A
