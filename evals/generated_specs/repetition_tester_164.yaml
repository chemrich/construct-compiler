construct:
  name: "TranscriptionFactorA_Triple_NLS_Fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: tf_nls_fusion
        expression: high
        chain:
          - gene:
              id: TranscriptionFactorA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: NLS1
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: NLS2
          - linker:
              type: short_GS
              repeats: 1
          - tag: NLS3
    - terminator: bGH_polyA