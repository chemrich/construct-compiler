construct:
  name: TranscriptionFactorA_tri_NLS_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: TFA_NLS1_NLS2_NLS3
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TranscriptionFactorA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS  # SV40 NLS (PKKKRKV)
          - linker:
              sequence: GGSGGA
          - tag: NLS  # c-myc NLS (PAAKRVKLD)
          - linker:
              sequence: SGSGGS
          - tag: NLS  # nucleoplasmin NLS (KRXR)

    - terminator: rrnB_T1
