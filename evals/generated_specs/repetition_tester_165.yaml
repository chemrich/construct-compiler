construct:
  name: "E_coli_AMP_hexapeptide_array"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - rbs: BBa_B0030
    - gene:
        id: AMP_variant_1_codon_opt_v1
        source: custom
        description: "AMP1 with signal peptide SP1 and codon set A"
    - terminator: rrnB_T1
    
    - spacer: 25
    
    - rbs: BBa_B0031
    - gene:
        id: AMP_variant_2_codon_opt_v2
        source: custom
        description: "AMP2 with signal peptide SP2 and codon set B"
    - terminator: rrnB_T2
    
    - spacer: 25
    
    - rbs: BBa_B0032
    - gene:
        id: AMP_variant_3_codon_opt_v3
        source: custom
        description: "AMP3 with signal peptide SP3 and codon set C"
    - terminator: BBa_B0015
    
    - spacer: 25
    
    - rbs: BBa_B0034
    - gene:
        id: AMP_variant_4_codon_opt_v4
        source: custom
        description: "AMP4 with signal peptide SP4 and codon set D"
    - terminator: T7term
    
    - spacer: 25
    
    - rbs: BBa_B0064
    - gene:
        id: AMP_variant_5_codon_opt_v5
        source: custom
        description: "AMP5 with signal peptide SP5 and codon set E"
    - terminator: rrnB_T1T2
    
    - spacer: 25
    
    - rbs: BBa_B0065
    - gene:
        id: AMP_variant_6_codon_opt_v6
        source: custom
        description: "AMP6 with signal peptide SP6 and codon set F"
    - terminator: BBa_B0010
