construct:
  name: SensorProtein_insect_cells
  host: insect

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: SensorProtein
        expression: high
        chain:
          - tag: signal_peptide_insect
          - gene:
              id: BindingDomain
              source: custom
          - linker:
              type: GS_flexible
              repeats: 3
              label: FlexibleLinker1
          - gene:
              id: TransmembraneDomain
              source: custom
          - linker:
              type: GS_flexible
              repeats: 3
              label: FlexibleLinker2
          - gene:
              id: IntracellularReporterDomain
              source: custom

    - terminator: rrnB_T1
