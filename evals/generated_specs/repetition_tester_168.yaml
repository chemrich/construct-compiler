construct:
  name: "ProteinScaffold_TripleEffector_Recruitment"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinScaffold
              source: uniprot
              # Contains three distinct BindingSite sequences with unique flanking regions

    - terminator: rrnB_T1

    # Spacer between independent cassettes
    - spacer: 25

    - promoter: tac
      # Unique promoter for EffectorA cassette

    - cistron:
        label: effector_A
        expression: high
        fused: false
        rbs: BBa_B0034
        chain:
          - tag: 8xHis
          - gene:
              id: EffectorA
              source: uniprot

    - terminator: BBa_B0015

    - spacer: 25

    - promoter: araBAD
      # Unique promoter for EffectorB cassette

    - cistron:
        label: effector_B
        expression: medium
        fused: false
        rbs: BBa_B0032
        chain:
          - tag: Strep-II
          - gene:
              id: EffectorB
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 25

    - promoter: lacUV5
      # Unique promoter for EffectorC cassette

    - cistron:
        label: effector_C
        expression: medium
        fused: false
        rbs: BBa_B0031
        chain:
          - tag: FLAG
          - gene:
              id: EffectorC
              source: uniprot

    - terminator: T7term
