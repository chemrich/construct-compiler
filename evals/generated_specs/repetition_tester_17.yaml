```yaml
construct:
  name: synthetic_three_gene_operon_dual_control
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - operator: LacO1  # First operator site for LacI repressor
    - operator: AraO2  # Second operator site for AraC repressor (non-homologous)
    - promoter: tac    # Hybrid promoter responsive to both operators
    
    - cistron:
        label: gene_G1
        expression: high
        rbs: BBa_B0034  # Strong RBS for first gene
        gene:
          id: G1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: gene_G2
        expression: medium
        fused: false
        rbs: BBa_B0032  # Medium strength RBS, non-homologous to B0034
        gene:
          id: G2
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: gene_G3
        expression: medium
        fused: false
        rbs: BBa_B0030  # Different RBS sequence, non-homologous to previous
        gene:
          id: G3
          source: uniprot
    
    - terminator: rrnB_T1
```