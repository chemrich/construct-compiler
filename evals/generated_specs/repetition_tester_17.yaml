construct:
  name: "synthetic_operon_G1_G2_G3_dual_repression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    # Operator sites (upstream of promoter, non-homologous)
    - regulatory_element:
        type: operator
        label: operator_TetR
        sequence: TCCCTATCAGTGATAGAGA  # TetO consensus, binds TetR

    - regulatory_element:
        type: operator
        label: operator_LacI
        sequence: AATTGTGAGCGCTCACAATT  # LacO consensus, binds LacI

    # Promoter
    - promoter: tac

    # Gene 1 with distinct RBS1
    - cistron:
        label: G1
        expression: high
        rbs_sequence: AGGAGGU  # RBS1 (Shine-Dalgarno variant)
        fused: false
        gene:
          id: G1
          source: uniprot

    # Spacer before Gene 2
    - spacer: 25

    # Gene 2 with distinct RBS2
    - cistron:
        label: G2
        expression: high
        rbs_sequence: GAGG  # RBS2 (alternative Shine-Dalgarno)
        fused: false
        gene:
          id: G2
          source: uniprot

    # Spacer before Gene 3
    - spacer: 25

    # Gene 3 with distinct RBS3
    - cistron:
        label: G3
        expression: high
        rbs_sequence: AGGAGGA  # RBS3 (third non-homologous variant)
        fused: false
        gene:
          id: G3
          source: uniprot

    - terminator: rrnB_T1
