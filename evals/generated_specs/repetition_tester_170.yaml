# Three requested construct variants combined into a single YAML document using a multi-cassette strategy to satisfy the single-document constraint while maintaining distinct promoters, terminators, and labels for sequence-diverse codon optimization.
construct:
  name: "Therapeutic_Gene_SynProm_Comparison"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: SynPromoter1
    - cistron:
        label: therapy_variant_1
        expression: high
        gene:
          id: P01133
          source: uniprot
    - terminator: bGH_polyA
    - spacer: 60
    - promoter: SynPromoter2
    - cistron:
        label: therapy_variant_2
        expression: high
        gene:
          id: P01133
          source: uniprot
    - terminator: SV40_polyA
    - spacer: 60
    - promoter: SynPromoter3
    - cistron:
        label: therapy_variant_3
        expression: high
        gene:
          id: P01133
          source: uniprot
    - terminator: Rabbit_beta_globin_polyA