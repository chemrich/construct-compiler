construct:
  name: "S_cerevisiae_ImmunogenPeptide_triply_tandem_codon_optimized"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ImmunogenPeptide_construct
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ImmunogenPeptide_repeat1_codon_variant_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ImmunogenPeptide_repeat2_codon_variant_B
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: ImmunogenPeptide_repeat3_codon_variant_C
              source: uniprot

    - terminator: CYC1
