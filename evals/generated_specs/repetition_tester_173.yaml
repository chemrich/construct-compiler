construct:
  name: "TargetGeneX_Diversified_shRNA_Array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_alpha
        fused: false
        gene:
          id: shRNA_TargetGeneX_v1_miR30_scaffold
    - terminator: T6_terminator_alpha

    - spacer: 30

    - promoter: H1
    - cistron:
        label: shRNA_beta
        fused: false
        gene:
          id: shRNA_TargetGeneX_v2_miR155_scaffold
    - terminator: T6_terminator_beta

    - spacer: 30

    - promoter: 7SK
    - cistron:
        label: shRNA_gamma
        fused: false
        gene:
          id: shRNA_TargetGeneX_v3_traditional_scaffold
    - terminator: T6_terminator_gamma