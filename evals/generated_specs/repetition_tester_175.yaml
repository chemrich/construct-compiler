construct:
  name: "Engineered_Pathway"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: enzyme_a
        expression: high
        gene:
          id: EnzymeA
          source: uniprot
    - terminator: CYC1
    - spacer: 40
    - promoter: TEF1
    - cistron:
        label: enzyme_b
        expression: medium
        gene:
          id: EnzymeB
          source: uniprot
    - terminator: ADH1
    - spacer: 40
    - promoter: PGK1
    - cistron:
        label: enzyme_c
        expression: medium
        gene:
          id: EnzymeC
          source: uniprot
    - terminator: TPI1
    - spacer: 40
    - promoter: ENO2
    - cistron:
        label: enzyme_d
        expression: low
        gene:
          id: EnzymeD
          source: uniprot
    - terminator: ACT1