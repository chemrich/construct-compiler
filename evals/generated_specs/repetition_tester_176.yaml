construct:
  name: "mammalian_degron_optimization_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: degron_variant_1
        expression: high
        chain:
          - tag: DegronTag_v1
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BGH_polyA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: degron_variant_2
        expression: high
        chain:
          - tag: DegronTag_v2
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: PGK  # Substitution: PGK is a common mammalian promoter for stable expression
    - cistron:
        label: degron_variant_3
        expression: high
        chain:
          - tag: DegronTag_v3
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: hGH_polyA