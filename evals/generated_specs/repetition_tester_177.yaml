construct:
  name: Biosensor_variant_1_ReceptorDomain_v1
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
  - promoter: T7lac
  - cistron:
      label: ReceptorDomain_variant_1
      expression: high
      chain:
      - tag: 6xHis
      - gene:
          id: ReceptorDomain_codon_variant_1
          source: uniprot
  - linker:
      type: GS_flexible
      repeats: 2
  - cistron:
      label: TransducerDomain
      expression: high
      fused: false
      chain:
      - gene:
          id: TransducerDomain
          source: uniprot
  - spacer: 25
  - cistron:
      label: FluorescentReporter
      expression: medium
      fused: false
      gene:
        id: sfGFP
        source: fpbase
  - terminator: rrnB_T1
