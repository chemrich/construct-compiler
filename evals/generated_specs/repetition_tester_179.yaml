construct:
  name: "FusionProteinB_yeast_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: FusionProteinB
        expression: high
        chain:
          - gene:
              id: ActivatorDomain
              source: uniprot
              codon_optimization: maximum_bias_AT_rich

          - linker:
              type: rigid_EAAAK
              repeats: 1
              custom_sequence: "GGAGGTGGCGGCAGCGGC"

          - gene:
              id: BindingDomain
              source: uniprot
              codon_optimization: maximum_bias_GC_rich

          - linker:
              type: GS_flexible
              repeats: 1
              custom_sequence: "TCCGGTTCCGGCTCCGGT"

          - gene:
              id: TaggingDomain
              source: uniprot
              codon_optimization: maximum_bias_GC_lean

          - tag: 6xHis

    - terminator: CYC1
