construct:
  name: yeast_integration_cassette_homology_arms
  host: yeast

  backbone:
    resistance: G418
    ori: null
    source: homology_arm_integration

  cassette:
    - homology_arm:
        label: upstream_homology
        length: 500
        orientation: forward
        codon_optimization: maximal_degeneracy
        repeat_check: cryptic_repeats_screened

    - promoter: GAL1

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: kanMX
          source: uniprot

    - terminator: ADH1_terminator

    - spacer: 50

    - promoter: ADH2

    - cistron:
        label: gene_of_interest
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GFP
              source: fpbase

    - terminator: CYC1_terminator

    - spacer: 50

    - homology_arm:
        label: downstream_homology
        length: 500
        orientation: forward
        codon_optimization: maximal_degeneracy
        repeat_check: cryptic_repeats_screened
