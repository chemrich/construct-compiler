construct:
  name: "triple_divergent_gene_x_expression"
  host: e_coli
  # Note: Each copy of P0AEE5 (Gene X) must be codon-optimized to be maximally 
  # divergent from the other copies to prevent homologous recombination.
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100 # Strong constitutive promoter
    - cistron:
        label: gene_x_variant_1
        expression: high
        fused: false
        gene:
          id: P0AEE5
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 45
    - promoter: J23102 # Similar strength constitutive promoter
    - cistron:
        label: gene_x_variant_2
        expression: high
        fused: false
        gene:
          id: P0AEE5
          source: uniprot
    - terminator: BBa_B0015
    - spacer: 55
    - promoter: J23104 # Similar strength constitutive promoter
    - cistron:
        label: gene_x_variant_3
        expression: high
        fused: false
        gene:
          id: P0AEE5
          source: uniprot
    - terminator: T7term