construct:
  name: "triple_X_divergent_no_recombination"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      
    - cistron:
        label: X_copy1
        expression: high
        gene:
          id: X
          source: uniprot
          codon_optimization: e_coli_variant1
    
    - terminator: rrnB_T1

    - spacer: 50

    - promoter: J23106
      
    - cistron:
        label: X_copy2
        expression: high
        gene:
          id: X
          source: uniprot
          codon_optimization: e_coli_variant2
    
    - terminator: BBa_B0015

    - spacer: 50

    - promoter: lacUV5
      
    - cistron:
        label: X_copy3
        expression: high
        gene:
          id: X
          source: uniprot
          codon_optimization: e_coli_variant3
    
    - terminator: T7term
