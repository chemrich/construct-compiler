construct:
  name: "mammalian_fusion_proteinA_linker_proteinB_dual_tags"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: P69905
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P12345
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: Strep-II

    - terminator: rrnB_T1
