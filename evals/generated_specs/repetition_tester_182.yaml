construct:
  name: "yeast_recombination_resistant_multi_gene_cluster"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GPD
    - cistron:
        label: cistron_A
        gene:
          id: A
          source: uniprot
    - terminator: CYC1_term

    - spacer: 30

    - promoter: TEF1
    - cistron:
        label: cistron_B
        gene:
          id: B
          source: uniprot
    - terminator: ADH1_term

    - spacer: 30

    - promoter: ADH1
    - cistron:
        label: cistron_C
        gene:
          id: C
          source: uniprot
    - terminator: TEF1_term

    - spacer: 30

    - promoter: CYC1
    - cistron:
        label: cistron_D
        gene:
          id: D
          source: uniprot
    - terminator: PGK1_term