construct:
  name: "5x_DomainZ_tandem_diverse_linkers"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: DomainZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: DomainZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: DomainZ
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: DomainZ
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: DomainZ
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
