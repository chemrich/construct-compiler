construct:
  name: "bicistronic_GeneY_GeneZ_dual_promoter"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: Gene_Y
        expression: high
        gene:
          id: Gene_Y
          source: uniprot

    - terminator: SV40_poly_A

  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: Gene_Z
        expression: high
        gene:
          id: Gene_Z
          source: uniprot

    - terminator: hGH_poly_A
