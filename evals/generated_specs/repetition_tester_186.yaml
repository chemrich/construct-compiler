construct:
  name: "yeast_gfp_constitutive_promoter_1"
  host: yeast
  
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: TEF1  # Translational Elongation Factor 1 promoter
    
    - cistron:
        label: gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    
    - terminator: CYC1  # Cytochrome c terminator
