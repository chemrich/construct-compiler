construct:
  name: "secreted_multidomain_protein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_multidomain
        expression: high
        chain:
          - tag: signal_peptide_IL2
            # IL-2 signal peptide: MYRMQLLSCIALsl
          - gene:
              id: domain_a
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
              # Seq: (GGGGS)×3 - standard GS linker
          - gene:
              id: domain_b
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
              # Seq: (EAAAK)×2 - charged helical linker, distinct from GS
          - tag: FLAG
            # FLAG epitope: DYKDDDDK - distinct from His/Strep

    - terminator: rrnB_T1
