construct:
  name: mCherry_Luciferase_dual_promoter_plant
  host: algae

  backbone:
    resistance: spectinomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CaMV_35S
      label: constitutive_strong

    - cistron:
        label: mCherry
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: Arabidopsis_rbcS_polyA
      label: terminator_1

    - promoter: Arabidopsis_HSP70_promoter
      label: heat_inducible

    - cistron:
        label: Luciferase
        expression: high
        gene:
          id: Luciferase
          source: uniprot

    - terminator: Pea_rbcS_3C_polyA
      label: terminator_2
