construct:
  name: "mammalian_triple_2A_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: P1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P1
              source: uniprot

    - cistron:
        label: P2A_linker1
        expression: high
        fused: false
        chain:
          - cleavage_site: F2A
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA
          - gene:
              id: P2
              source: uniprot

    - cistron:
        label: P3A_linker2
        expression: high
        fused: false
        chain:
          - cleavage_site: P2A
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: 6xHis
          - gene:
              id: P3
              source: uniprot

    - terminator: rrnB_T1
