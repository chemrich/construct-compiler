construct:
  name: "baculovirus_tripartite_expression_system"
  host: sf9  # Substituted sf9 for baculovirus expression as it is a standard insect cell line
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: polh
    - cistron:
        label: protein_p
        fused: false
        gene:
          id: PROTEIN_P
          source: uniprot
    - terminator: polh_PA
    - spacer: 40
    - promoter: p10
    - cistron:
        label: protein_q
        fused: false
        gene:
          id: PROTEIN_Q
          source: uniprot
    - terminator: p10_PA
    - spacer: 40
    - promoter: OpIE2
    - cistron:
        label: protein_r
        fused: false
        gene:
          id: PROTEIN_R
          source: uniprot
    - terminator: SV40_PA