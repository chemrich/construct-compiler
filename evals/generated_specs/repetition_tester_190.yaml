construct:
  name: baculovirus_triple_expression_PQR
  host: insect  # baculovirus expression in Sf9/Sf21 cells

  backbone:
    catalog_vector: "pFastBac_dual"
    source: addgene

  cassette:
    - promoter: p10  # polyhedrin-independent early promoter

    - cistron:
        label: protein_P
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 30

    - promoter: ie1  # immediate early promoter (non-homologous to p10)

    - cistron:
        label: protein_Q
        expression: high
        chain:
          - tag: 8xHis  # different His-tag length to avoid homology
          - cleavage_site: 3C  # different protease (non-homologous to TEV)
          - gene:
              id: Q
              source: uniprot

    - terminator: rrnB_T1  # different terminator (non-homologous to SV40)

    - spacer: 30

    - promoter: hsp70  # heat shock protein promoter (third unique promoter)

    - cistron:
        label: protein_R
        expression: high
        chain:
          - tag: Strep-II  # entirely different tag to avoid homology
          - cleavage_site: Factor_Xa  # third distinct protease
          - gene:
              id: R
              source: uniprot

    - terminator: T7term  # fourth unique terminator
