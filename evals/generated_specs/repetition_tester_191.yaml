construct:
  name: "mammalian_nuclear_fusion_dual_NLS"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: nuclear_fusion
        expression: high
        chain:
          - tag: SV40_NLS
          - gene:
              id: protein_x
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: protein_y
              source: uniprot
          - tag: IBB_NLS

    - terminator: SV40_polyA
