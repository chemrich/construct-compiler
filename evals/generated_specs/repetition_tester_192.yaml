construct:
  name: two_component_signaling_system
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: sensor_kinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: envZ
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: rhamnose

    - cistron:
        label: response_regulator
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - gene:
              id: ompR
              source: uniprot

    - terminator: T7term
