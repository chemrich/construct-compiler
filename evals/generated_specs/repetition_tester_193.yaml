construct:
  name: "yeast_triple_epitope_divergent"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target_triple_epitope
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: Myc
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: GFP
              source: fpbase

    - terminator: rrnB_T1
