construct:
  name: dual_sgRNA_mammalian_no_homology
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: U6
      cistron:
        label: sgRNA_1
        expression: high
        chain:
          - gene:
              id: sgRNA_target_locus_1
              source: custom
              sequence: GGTGAGTGAGTGTGTGCGTG

    - promoter: H1
      cistron:
        label: sgRNA_2
        expression: high
        chain:
          - gene:
              id: sgRNA_target_locus_2
              source: custom
              sequence: GGTGTGTGAGTGCGTGTGTG

    - terminator: rrnB_T1
