construct:
  name: "dual_sgRNA_orthogonal_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: sgRNA_locus_A
        fused: false
        gene:
          id: "sgRNA_target_A_standard_scaffold"
    - spacer: 50
    - promoter: H1
    - cistron:
        label: sgRNA_locus_B
        fused: false
        gene:
          id: "sgRNA_target_B_orthogonal_E_scaffold"
    - terminator: BBa_B0015 # Added to ensure cassette termination as per rule 10