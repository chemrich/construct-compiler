construct:
  name: GFP_dual_cleavage_ProteinS
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP_ProteinS_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - cleavage_site: Factor_Xa
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: P0A799
              source: uniprot

    - terminator: rrnB_T1
