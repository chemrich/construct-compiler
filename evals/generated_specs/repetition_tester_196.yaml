construct:
  name: "algae_dual_selectable_markers"
  host: algae

  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: rbcL

    - cistron:
        label: hygromycin_resistance
        expression: high
        gene:
          id: hpt
          source: uniprot

    - terminator: psaA_terminator

    - spacer: 50

    - promoter: atpA

    - cistron:
        label: paromomycin_resistance
        expression: high
        gene:
          id: aph
          source: uniprot

    - terminator: rbcS_terminator
