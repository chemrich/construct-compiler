construct:
  name: dual_fluorescent_mammalian_expression
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_polyA

    - promoter: EF1_alpha
    - cistron:
        label: EGFP
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - terminator: BGH_polyA
