construct:
  name: "coexpression_gene_k_dual_chaperones"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_k_target
        expression: high  # High expression triggers the use of a strong RBS
        gene:
          id: gene_k
          source: uniprot
    - terminator: rrnB_T1  # First distinct terminator
    - promoter: T7lac
    - cistron:
        label: chaperone_1
        expression: high  # Non-homologous strong RBS will be selected for this cistron
        gene:
          id: chaperone_1
          source: uniprot
    - terminator: T7term  # Second distinct terminator
    - promoter: T7lac
    - cistron:
        label: chaperone_2
        expression: high  # Non-homologous strong RBS will be selected for this cistron
        gene:
          id: chaperone_2
          source: uniprot
    - terminator: BBa_B0015  # Third distinct terminator