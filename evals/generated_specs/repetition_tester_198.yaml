construct:
  name: "Gene_K_with_dual_chaperones_independent_RBS_terminators"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Gene_K
        expression: high
        rbs: BBa_B0034
        gene:
          id: Gene_K
          source: uniprot
        terminator: rrnB_T1

    - cistron:
        label: Chaperone_1
        expression: high
        fused: false
        rbs: BBa_B0032
        gene:
          id: Chaperone_1
          source: uniprot
        terminator: T7term

    - cistron:
        label: Chaperone_2
        expression: high
        fused: false
        rbs: BBa_B0030
        gene:
          id: Chaperone_2
          source: uniprot
        terminator: BBa_B0015
