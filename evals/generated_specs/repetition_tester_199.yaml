construct:
  name: yeast_alpha_dimer_heterologous_parts
  host: yeast

  cassette:
    - promoter: GAL1

    - cistron:
        label: alpha_dim1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: alpha_dim1_fusion
              source: uniprot
          - cleavage_site: 3C

    - terminator: CYC1

    - spacer: 50

    - promoter: ADH1

    - cistron:
        label: alpha_dim2
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: alpha_dim2_fusion
              source: uniprot
          - cleavage_site: Factor_Xa

    - terminator: PGK1
