construct:
  name: "ProteinP_secreted_FLAG_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: signal_peptide  # secretion signal for mammalian export
          - gene:
              id: ProteinP
              source: uniprot
          - tag: FLAG  # C-terminal FLAG tag with maximal codon optimization

    - terminator: SV40_polyA