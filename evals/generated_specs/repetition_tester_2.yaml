```yaml
construct:
  name: "mammalian_secreted_ProteinP_FLAG"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_ProteinP
        expression: high
        chain:
          - signal_peptide:
              id: custom_optimized_SP
              source: synthetic
              description: "Codon-optimized mammalian signal peptide with maximal synonymous divergence"
          - gene:
              id: ProteinP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
              # FLAG tag: codon-optimized with maximal synonymous substitution for sequence diversity
              custom_sequence: "TTC CTG GCC CGC AAG GCT TCG AAG CTG TTC"
              description: "FLAG epitope (DYKDDDDK) with maximal codon optimization for diversity"

    - terminator: rrnB_T1
```