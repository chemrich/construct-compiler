construct:
  name: "ProteinX_reporter_dual_cassette"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette_1:
    - promoter: T7lac
    
    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinX
              source: uniprot

    - terminator: rrnB_T1

  cassette_2:
    - promoter: araBAD
    
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase

    - terminator: T7term
