construct:
  name: "enzymex_synonymous_triple_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzymex_v1
        expression: high
        gene:
          id: EnzymeX
          source: uniprot
    - spacer: 35
    - cistron:
        label: enzymex_v2
        expression: high
        fused: false
        gene:
          id: EnzymeX
          source: uniprot
    - spacer: 52
    - cistron:
        label: enzymex_v3
        expression: high
        fused: false
        gene:
          id: EnzymeX
          source: uniprot
    - terminator: T7term