construct:
  name: "mammalian_alpha_beta_gamma_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: multi_fusion_target
        expression: high
        chain:
          - solubility_tag: MBP  # N-terminal solubility tag for ProteinAlpha
          - gene:
              id: P02768  # ProteinAlpha (Human Serum Albumin)
              source: uniprot
          - cleavage_site: TEV  # Unique Cleavage Site 1
          - gene:
              id: P01375  # ProteinBeta (Tumor Necrosis Factor)
              source: uniprot
          - cleavage_site: 3C   # Unique Cleavage Site 2 (using different protease to ensure unique DNA)
          - gene:
              id: P05231  # ProteinGamma (Interleukin-6)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mNeonGreen  # C-terminal Fluorescent Tag
              source: fpbase
    - terminator: BBa_B0015  # Standard terminator; compiler will use mammalian-appropriate polyA signal for HEK293