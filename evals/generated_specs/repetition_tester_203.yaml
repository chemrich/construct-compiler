construct:
  name: "complex_mammalian_triple_fusion_optimized"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinAlpha_construct
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinAlpha
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: ProteinBeta
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: ProteinGamma
              source: uniprot
          - tag: mNeonGreen

    - terminator: rrnB_T1
