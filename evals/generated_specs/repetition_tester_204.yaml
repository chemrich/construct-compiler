construct:
  name: multi_reporter_synonymous_codon_optimized_system
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
      promoter_variant: custom_synthetic_araBAD_v1
      rbs: custom_rbs_optimized_1
    
    - cistron:
        label: reporter_1_gfp_variant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: synthetic_gfp_codon_randomized_v1
              source: custom
              note: extensively_synonymous_mutations

    - spacer: 35

    - promoter: T7lac
      promoter_variant: custom_synthetic_T7lac_v2
      rbs: custom_rbs_optimized_2
    
    - cistron:
        label: reporter_2_mcherry_variant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: synthetic_mcherry_codon_randomized_v2
              source: custom
              note: extensively_synonymous_mutations_distinct_from_gfp

    - spacer: 35

    - promoter: custom_constitutive_synthetic_v3
      promoter_variant: synthetic_strong_constitutive
      rbs: custom_rbs_optimized_3
    
    - cistron:
        label: reporter_3_lacz_control
        expression: medium
        chain:
          - tag: FLAG
          - gene:
              id: synthetic_lacz_codon_randomized_v3
              source: custom
              note: extensively_synonymous_mutations_unique_sequence

    - terminator: rrnB_T1
