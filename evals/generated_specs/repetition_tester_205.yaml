construct:
  name: "bicistronic_GeneX_GeneY_custom_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # Comment: Strong mammalian promoter alternative to CMV for reduced silencing

    - cistron:
        label: GeneX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneX
              source: custom
              # Note: User must provide codon-optimized, recombination-resistant sequence

    - spacer: 25
      # Comment: Novel IRES variant inserted here (user must provide custom sequence distinct from EMCV)
      # IRES function must be experimentally validated

    - cistron:
        label: GeneY
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: GeneY
              source: custom
              # Note: User must provide codon-optimized, recombination-resistant sequence

    - terminator: rrnB_T1
      # Comment: Followed by proprietary polyA signal (user must provide custom sequence distinct from SV40/hGH)
