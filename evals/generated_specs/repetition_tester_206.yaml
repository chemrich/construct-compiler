construct:
  name: "S_cerevisiae_CRISPR_array_three_guides"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6
      cistron:
        label: gRNA1_target_gene1
        expression: high
        chain:
          - gene:
              id: S_cerevisiae_crRNA_1
              sequence: "GGTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCTTTTTTT"
              # crRNA targeting Gene1 with unique tracrRNA scaffold variant 1

    - spacer: 30

    - promoter: SNR52
      cistron:
        label: gRNA2_target_gene2
        expression: high
        chain:
          - gene:
              id: S_cerevisiae_crRNA_2
              sequence: "GGTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCTTTTTT"
              # crRNA targeting Gene2 with unique tracrRNA scaffold variant 2 (modified 3' end)

    - spacer: 30

    - promoter: RPR1
      cistron:
        label: gRNA3_target_gene3
        expression: high
        chain:
          - gene:
              id: S_cerevisiae_crRNA_3
              sequence: "GGTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCTTTTT"
              # crRNA targeting Gene3 with unique tracrRNA scaffold variant 3 (alternative 3' structure)

    - terminator: rrnB_T1
