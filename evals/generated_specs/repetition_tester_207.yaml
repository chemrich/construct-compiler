construct:
  name: "multi_domain_scaffold_diversified"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: BD1_codon_optimized_variant_A
              source: custom
              codon_bias: "extreme_synonymous_diversity"
          - linker:
              type: rigid_EAAAK
              repeats: 2
              custom_sequence: "GGSGGSGGAGGSGGS"
          - gene:
              id: BD2_codon_optimized_variant_B
              source: custom
              codon_bias: "extreme_synonymous_diversity"
          - linker:
              type: GS_flexible
              repeats: 3
              custom_sequence: "GSGSGSGSGSGSGSGSGSGSG"
          - gene:
              id: BD3_codon_optimized_variant_C
              source: custom
              codon_bias: "extreme_synonymous_diversity"
          - linker:
              type: rigid_EAAAK
              repeats: 1
              custom_sequence: "GGAGGCGGAGGTGG"
          - gene:
              id: BD4_codon_optimized_variant_D
              source: custom
              codon_bias: "extreme_synonymous_diversity"

    - terminator: rrnB_T1
