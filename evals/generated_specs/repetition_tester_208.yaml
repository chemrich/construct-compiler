construct:
  name: "S_cerevisiae_surface_display_three_targets"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
    
    - cistron:
        label: Aga2p_PeptideA
        expression: high
        chain:
          - gene:
              id: AGA2_codon_opt_v1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: PeptideA
              source: uniprot

    - terminator: CYC1

  cassette:
    - promoter: ADH1
    
    - cistron:
        label: Aga2p_PeptideB
        expression: high
        chain:
          - gene:
              id: AGA2_codon_opt_v2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 4
          - gene:
              id: PeptideB
              source: uniprot

    - terminator: ADH1_terminator

  cassette:
    - promoter: PGK1
    
    - cistron:
        label: Aga2p_PeptideC
        expression: high
        chain:
          - gene:
              id: AGA2_codon_opt_v3
              source: uniprot
          - linker:
              type: short_GS
              repeats: 2
          - gene:
              id: PeptideC
              source: uniprot

    - terminator: PGK1_terminator
