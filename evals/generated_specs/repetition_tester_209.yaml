construct:
  name: "scFv_diversified_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scFv_construct
        expression: high
        chain:
          - tag: PelB_signal_peptide
          - gene:
              id: VH_diversified_synthetic
              source: custom
          - linker:
              type: rigid_EAAAK
              repeats: 1
              # Comment: custom_novel_linker_sequence_non_homologous
          - gene:
              id: VL_diversified_synthetic
              source: custom
          - tag: custom_purification_tag_diversified
              # Comment: sequence-optimized orthogonal purification handle, distinct from 6xHis/Strep/FLAG

    - terminator: rrnB_T1
