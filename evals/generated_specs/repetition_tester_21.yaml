construct:
  name: ProteinA_ProteinB_fusion_optimized_linker
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
              description: "Custom linker with synonymous codon diversity to eliminate 3-mer repeats >6bp and prevent homology with ProteinA/ProteinB junction regions"
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
