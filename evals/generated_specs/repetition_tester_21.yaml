construct:
  name: "ProteinA_ProteinB_fusion"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: P0DTC2  # Spike protein as ProteinA example
              source: uniprot
          - linker:
              type: custom
              sequence: "GAATCGACTCAGGTGCAAGCTATCGA"  # 26bp, no 3-mer repeats >6bp, high codon diversity
          - gene:
              id: P04406  # GAPDH as ProteinB example
              source: uniprot

    - terminator: rrnB_T1