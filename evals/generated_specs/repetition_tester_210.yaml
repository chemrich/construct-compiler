construct:
  name: mammalian_tri_therapeutic_divergent_2A
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: thera_gene_1
        expression: high
        chain:
          - gene:
              id: TheraGene1
              source: uniprot
          - linker:
              type: P2A
              repeats: 1
    - cistron:
        label: thera_gene_2
        expression: high
        fused: true
        chain:
          - gene:
              id: TheraGene2
              source: uniprot
          - linker:
              type: T2A
              repeats: 1
    - cistron:
        label: thera_gene_3
        expression: high
        fused: true
        chain:
          - gene:
              id: TheraGene3
              source: uniprot
    - terminator: hGH_polyA