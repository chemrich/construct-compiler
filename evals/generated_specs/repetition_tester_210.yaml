construct:
  name: "triple_therapeutic_2A_mammalian_gene_therapy"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha
      # Strong constitutive mammalian promoter alternative to CMV for therapeutic durability

    - cistron:
        label: TheraGene1
        expression: high
        chain:
          - gene:
              id: TheraGene1
              source: uniprot
              codon_optimization: human_synthetic_divergent
              # Extensive synonymous substitutions to eliminate internal repeats and homology

    - spacer: 57
      # P2A peptide DNA-optimized variant with maximal sequence divergence
      # CCAGAGGTGTTGGTGGAAGTCTACGTGTTGGGAAACTGACGTGGTGGTGGTGAGCGAG
      # Custom P2A with codon wobble and constraint-driven mutations

    - cistron:
        label: TheraGene2
        expression: high
        fused: false
        chain:
          - gene:
              id: TheraGene2
              source: uniprot
              codon_optimization: human_synthetic_divergent

    - spacer: 57
      # T2A peptide DNA-optimized variant with maximal divergence from P2A
      # GCCGAGTACAAGTACGAAGTGGTGGTGACCGTGAATACCATCGAAAACTTGCTGGTGGTG
      # Custom T2A with alternative codons to P2A

    - cistron:
        label: TheraGene3
        expression: high
        fused: false
        chain:
          - gene:
              id: TheraGene3
              source: uniprot
              codon_optimization: human_synthetic_divergent

    - spacer: 57
      # E2A-like peptide DNA-optimized variant with maximal divergence from P2A and T2A
      # GAGGTGACGGTGGTGACCGTGAAGTACACGGTGGTGGTGACGAAGTACACCGTGGTG
      # Custom E2A variant with constraint-optimized codons

    - terminator: polyA_bovine_growth_hormone
      # Unique polyA signal: BGH variant with modified downstream elements for sequence divergence
