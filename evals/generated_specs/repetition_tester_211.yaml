construct:
  name: synthetic_four_enzyme_operon_E_coli
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: EnzA
        expression: high
        gene:
          id: EnzA
          source: uniprot
        rbs_variant: custom_optimized_RBS_A
        # Note: compiler will apply codon-optimization variant A with unique synonymous codons
    
    - spacer: 45
      # Unique intergenic spacer 1 with non-homologous sequence
      spacer_id: intergenic_spacer_A_to_B
    
    - cistron:
        label: EnzB
        expression: high
        gene:
          id: EnzB
          source: uniprot
        rbs_variant: custom_optimized_RBS_B
        # Note: compiler will apply codon-optimization variant B with distinct synonymous codons
    
    - spacer: 50
      # Unique intergenic spacer 2 with non-homologous sequence
      spacer_id: intergenic_spacer_B_to_C
    
    - cistron:
        label: EnzC
        expression: high
        gene:
          id: EnzC
          source: uniprot
        rbs_variant: custom_optimized_RBS_C
        # Note: compiler will apply codon-optimization variant C with distinct synonymous codons
    
    - spacer: 55
      # Unique intergenic spacer 3 with non-homologous sequence
      spacer_id: intergenic_spacer_C_to_D
    
    - cistron:
        label: EnzD
        expression: high
        gene:
          id: EnzD
          source: uniprot
        rbs_variant: custom_optimized_RBS_D
        # Note: compiler will apply codon-optimization variant D with distinct synonymous codons
    
    - terminator: T7_echo_terminator
      # Custom terminator distinct from rrnB_T1 and standard variants
