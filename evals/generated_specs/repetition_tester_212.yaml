construct:
  name: "dual_antibiotic_resistance_cassette"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      label: "constitutive_promoter_ampR"

    - cistron:
        label: ampicillin_resistance
        expression: high
        gene:
          id: bla_synonymous_optimized_v1
          source: custom
          note: "Extensively codon-diversified AmpR variant using rare codons and alternative start contexts"

    - terminator: rrnB_T1
      label: "terminator_ampR"

    - spacer: 50

    - promoter: J23106
      label: "constitutive_promoter_kanR"

    - cistron:
        label: kanamycin_resistance
        expression: high
        gene:
          id: neo_synonymous_optimized_v1
          source: custom
          note: "Extensively codon-diversified KanR (neo) variant using alternative codon usage and regulatory sequence changes"

    - terminator: BBa_B0015
      label: "terminator_kanR"
