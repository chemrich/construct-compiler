construct:
  name: "yeast_biosensor_SensorA_TransducerB_ReporterC"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: biosensor_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SensorDomainA_codon_optimized
              source: custom
          - linker:
              type: custom_novel_linker_1
              sequence: GGSGGGSGGGSGGGS
          - gene:
              id: TransducerDomainB_codon_optimized
              source: custom
          - linker:
              type: custom_novel_linker_2
              sequence: PPPGPPPGPPPGPPPG
          - gene:
              id: ReporterDomainC_codon_optimized
              source: custom

    - terminator: CYC1
