construct:
  name: "triple_FP_mammalian_expression"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: BlueFP
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: SV40_polyA

  cassette_2:
    - promoter: EF1_alpha
    - cistron:
        label: YellowFP
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mVenus
              source: fpbase
    - terminator: WPRE_polyA

  cassette_3:
    - promoter: PGK
    - cistron:
        label: RedFP
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BGH_polyA
