construct:
  name: "tri_color_diversified_mammalian_system"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: blue_reporter
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: bGH_polyA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: yellow_reporter
        expression: high
        fused: false
        gene:
          id: mVenus
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: UbC
    - cistron:
        label: red_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: hGH_polyA