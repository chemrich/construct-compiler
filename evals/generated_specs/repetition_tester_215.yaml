construct:
  name: "E_coli_triple_secreted_diverse_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: SecretedProteinX
        expression: high
        chain:
          - signal_peptide: PelB
          - gene:
              id: SecretedProteinX_syn_v1
              source: custom

    - terminator: rrnB_T1

  cassette:
    - promoter: tac

    - cistron:
        label: SecretedPeptideY
        expression: high
        chain:
          - signal_peptide: OmpA
          - gene:
              id: SecretedPeptideY_syn_v2
              source: custom

    - terminator: T7term

  cassette:
    - promoter: araBAD

    - cistron:
        label: SecretedEnzymeZ
        expression: high
        chain:
          - signal_peptide: MalE
          - gene:
              id: SecretedEnzymeZ_syn_v3
              source: custom

    - terminator: BBa_B0015
