construct:
  name: "yeast_triple_degradation_tag_fusion"
  host: yeast

  cassette:
    - promoter: GAL1
      
    - cistron:
        label: TargetA_DegTag1
        expression: high
        chain:
          - gene:
              id: TargetA
              source: uniprot
              codon_optimization: maximal_synonymous_diversity
          - degradation_tag: DegTag1_variant_LPLG

    - terminator: CYC1

    - spacer: 25

    - promoter: ADH1
      
    - cistron:
        label: TargetB_DegTag2
        expression: high
        chain:
          - gene:
              id: TargetB
              source: uniprot
              codon_optimization: maximal_synonymous_diversity
          - degradation_tag: DegTag2_variant_KDHF

    - terminator: PGK1

    - spacer: 25

    - promoter: TPI1
      
    - cistron:
        label: TargetC_DegTag3
        expression: high
        chain:
          - gene:
              id: TargetC
              source: uniprot
              codon_optimization: maximal_synonymous_diversity
          - degradation_tag: DegTag3_variant_RTNM

    - terminator: ADH1_terminator

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
