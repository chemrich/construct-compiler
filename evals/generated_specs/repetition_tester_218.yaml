construct:
  name: "CAR_T_cell_scFv_TM_3xSignaling_HCO"
  host: HEK293

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # Note: EF1_alpha provides strong ubiquitous expression suitable for T-cell engineering
      # For truly T-cell-specific promoter, user should substitute with lck or CD2 promoter sequences

    - cistron:
        label: CAR
        expression: high
        chain:
          - gene:
              id: scFv_HCO_diverse
              source: custom
              description: "human codon-optimized scFv with maximal synonymous diversity, no internal repeats"

          - linker:
              type: custom
              sequence: "GGTGGTGGTGGTGGTGGTGGTGGT"
              description: "unique linker 1: scFv-to-TM connector"

          - gene:
              id: TM_domain_HCO_diverse
              source: custom
              description: "human codon-optimized transmembrane domain with maximal synonymous diversity"

          - linker:
              type: custom
              sequence: "GGCGGCGGCGGCGGCGGCGGCGGC"
              description: "unique linker 2: TM-to-Signaling1 connector"

          - gene:
              id: Signaling1_HCO_diverse
              source: custom
              description: "human codon-optimized signaling domain 1 with maximal synonymous diversity"

          - linker:
              type: custom
              sequence: "GCCGCCGCCGCCGCCGCCGCCGCC"
              description: "unique linker 3: Signaling1-to-Signaling2 connector"

          - gene:
              id: Signaling2_HCO_diverse
              source: custom
              description: "human codon-optimized signaling domain 2 with maximal synonymous diversity"

          - linker:
              type: custom
              sequence: "GAGGATGAGGATGAGGATGAGGA"
              description: "unique linker 4: Signaling2-to-Signaling3 connector"

          - gene:
              id: Signaling3_HCO_diverse
              source: custom
              description: "human codon-optimized signaling domain 3 with maximal synonymous diversity"

    - terminator:
        type: custom
        sequence: "AATAAAAGGACGCGCCGCCGAAA"
        description: "custom polyA signal non-standard sequence for enhanced stability"
