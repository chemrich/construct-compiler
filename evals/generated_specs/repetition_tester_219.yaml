construct:
  name: "orthogonal_dual_phage_display_system"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: scaffold_p1_fusion
        expression: high
        chain:
          - gene:
              id: g3p_m13_variant_alpha
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: peptide_x_target
              source: uniprot
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: araBAD
    - cistron:
        label: scaffold_p2_fusion
        expression: medium
        chain:
          - gene:
              id: g8p_m13_variant_beta
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 4
          - gene:
              id: peptide_y_target
              source: uniprot
    - terminator: T7term