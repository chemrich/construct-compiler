construct:
  name: "phage_display_dual_scaffold_fusion"
  host: e_coli_bl21

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold_peptide_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: pIII_scaffold_variant_A
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: PeptideX_target
              source: uniprot

    - terminator: rrnB_T1

    - promoter: tac

    - cistron:
        label: scaffold_peptide_2
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - linker:
              type: short_GS
              repeats: 2
          - gene:
              id: pVIII_scaffold_variant_B
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: PeptideY_target
              source: uniprot

    - terminator: T7term

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
