          - tag: 6xHis
          - gene:
              id: P0A6F5  # E. coli beta-galactosidase (lacZ)
              source: uniprot

    - spacer: 35  # Unique spacer length to avoid recombination

    - cistron:
        label: E2
        expression: medium
        fused: false  # Independent translation with distinct RBS
        gene:
          id: P00350  # E. coli 6-phosphofructokinase (pfkA)
          source: uniprot

    - spacer: 47  # Different spacer length for sequence divergence

    - cistron:
        label: E3
        expression: medium
        fused: false  # Independent translation with distinct RBS
        gene:
          id: P0A9P0  # E. coli alkaline phosphatase (phoA)
          source: uniprot

    - terminator: rrnB_T1
