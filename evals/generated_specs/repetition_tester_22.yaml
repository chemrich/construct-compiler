```yaml
construct:
  name: three_enzyme_operon_distinct_RBS
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: E1
