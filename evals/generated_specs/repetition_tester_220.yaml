construct:
  name: "fusion_protein_no_repeats"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - cleavage_site: 3C
          - tag: Strep-II
          - gene:
              id: "CUSTOM_GOI"
              source: uniprot
              # User must provide their gene of interest ID

    - terminator: rrnB_T1
