construct:
  name: "multi_enzyme_operon_recombination_resistant"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # Non-standard strong promoter (IPTG-inducible, distinct from T7/T7lac)

    - cistron:
        label: E1
        expression: high
        rbs: BBa_B0030  # Standard RBS variant 1
        gene:
          id: E1_codon_variant_A
          # Codon-optimized variant A with synonymous substitutions
          source: custom

    - spacer: 25

    - cistron:
        label: E2
        expression: high
        rbs: BBa_B0031  # RBS variant 2 (different strength/sequence)
        gene:
          id: E2_codon_variant_B
          # Codon-optimized variant B with distinct synonymous substitutions
          source: custom

    - spacer: 25

    - cistron:
        label: E3
        expression: high
        rbs: BBa_B0034  # RBS variant 3 (third distinct RBS)
        gene:
          id: E3_codon_variant_C
          # Codon-optimized variant C with unique synonymous substitutions
          source: custom

    - terminator: L3S2P54  # Non-standard terminator (distinct from rrnB_T1/T7term/BBa_B0015)
