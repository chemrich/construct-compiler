construct:
  name: orthogonal_dual_reporter_mammalian
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: red_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA