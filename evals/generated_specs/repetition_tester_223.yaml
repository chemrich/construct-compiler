construct:
  name: "dual_secretion_signal_yeast_inducible"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secretion_variant_alpha
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: MFalpha1
              source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: ADH2

    - cistron:
        label: secretion_variant_ost
        expression: high
        chain:
          - tag: OST1_signal
          - gene:
              id: PHO5
              source: uniprot

    - terminator: ADH1
