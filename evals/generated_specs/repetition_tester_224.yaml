construct:
  name: "dual_gRNA_CRISPR_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin

  cassette:
    - promoter: U6
      cistron:
        label: gRNA1
        expression: high
        gene:
          id: gRNA_scaffold_mpknot
          source: uniprot
      terminator: U6term

    - promoter: H1
      cistron:
        label: gRNA2
        expression: high
        gene:
          id: gRNA_scaffold_twister_sister
          source: uniprot
      terminator: H1term
