construct:
  name: "mammalian_dual_grna_orthogonal_scaffolds"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: grna_1
        expression: high
        gene:
          id: sgRNA_FplusE_variant # Using non-identical scaffold variant to avoid repeats
    - terminator: U6_terminator
    - spacer: 50 # Separation between gRNA expression units
    - promoter: H1 # Utilizing different Pol III promoter to avoid repetition
    - cistron:
        label: grna_2
        expression: high
        gene:
          id: sgRNA_standard_variant
    - terminator: U6_terminator