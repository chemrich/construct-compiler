construct:
  name: "dual_tag_dual_cleavage_fusion"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - cleavage_site: TEV
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - cleavage_site: Factor_Xa
          - linker:
              type: short_GS
              repeats: 2
          - tag: Strep-II
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
