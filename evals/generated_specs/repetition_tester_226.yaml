construct:
  name: "yeast_triple_marker_diverse"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      cistron:
        label: marker1
        expression: high
        gene:
          id: KanMX4
          source: uniprot
      terminator: CYC1

    - spacer: 25

    - promoter: ADH1
      cistron:
        label: marker2
        expression: high
        gene:
          id: HygromycinB_phosphotransferase
          source: uniprot
      terminator: PGK1

    - spacer: 25

    - promoter: TEF1
      cistron:
        label: marker3
        expression: high
        gene:
          id: NatMX4
          source: uniprot
      terminator: ADH1_poly
