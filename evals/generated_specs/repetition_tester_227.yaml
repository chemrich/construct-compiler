construct:
  name: dual_inducible_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    # First inducible system: Tet-On (tetracycline-responsive)
    - promoter: TRE  # Tetracycline Response Element
      cistron:
        label: gene_of_interest_tet
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_id_placeholder
              source: uniprot
      terminator: rrnB_T1

    - spacer: 50

    # Second inducible system: Ecdysone-responsive (non-homologous to Tet system)
    - promoter: EcRE  # Ecdysone Response Element
      cistron:
        label: gene_of_interest_ecd
        expression: high
        chain:
          - tag: Strep-II  # Different tag to minimize homology
          - cleavage_site: 3C
          - gene:
              id: uniprot_id_placeholder
              source: uniprot
      terminator: T7term
