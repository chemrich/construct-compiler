construct:
  name: "multi_domain_fusion_protein_distinct_linkers"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: domain_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: domain_3
              source: uniprot

    - terminator: rrnB_T1
