construct:
  name: "five_GFP_variants_multi_promoter"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
    - rbs: RBS_1
    - cistron:
        label: GFP1
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1

    - spacer: 100

    - promoter: J23106
    - rbs: RBS_2
    - cistron:
        label: GFP2
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1

    - spacer: 100

    - promoter: J23119
    - rbs: RBS_3
    - cistron:
        label: GFP3
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

    - spacer: 100

    - promoter: araBAD
    - rbs: RBS_4
    - cistron:
        label: GFP4
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1

    - spacer: 100

    - promoter: tac
    - rbs: RBS_5
    - cistron:
        label: GFP5
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
