construct:
  name: "five_tandem_peptide_repeats_synonymous"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: repeat_cassette
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: "peptide_repeat_1_codon_set_A"
              source: "custom"
              note: "First synonymous encoding of target peptide"
          - linker:
              type: "custom_linker_1"
              sequence: "GGTGGTGGT"
          - gene:
              id: "peptide_repeat_2_codon_set_B"
              source: "custom"
              note: "Second synonymous encoding (alt codons) of target peptide"
          - linker:
              type: "custom_linker_2"
              sequence: "GGCGGCGGC"
          - gene:
              id: "peptide_repeat_3_codon_set_C"
              source: "custom"
              note: "Third synonymous encoding (alt codons) of target peptide"
          - linker:
              type: "custom_linker_3"
              sequence: "AGCAGCAGC"
          - gene:
              id: "peptide_repeat_4_codon_set_D"
              source: "custom"
              note: "Fourth synonymous encoding (alt codons) of target peptide"
          - linker:
              type: "custom_linker_4"
              sequence: "AGTCGACCC"
          - gene:
              id: "peptide_repeat_5_codon_set_E"
              source: "custom"
              note: "Fifth synonymous encoding (alt codons) of target peptide"

    - terminator: rrnB_T1
