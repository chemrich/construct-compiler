construct:
  name: yeast_dual_anchor_display_system
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: aga2_anchor_fusion
        expression: high
        chain:
          - gene:
              id: P02829
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1
    - spacer: 50
    - promoter: TEF1
    - cistron:
        label: sed1_anchor_fusion
        expression: high
        chain:
          - gene:
              id: P38288
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: ADH1