construct:
  name: yeast_dual_wall_anchor_display
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
    
    - cistron:
        label: anchor1_fusion
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p_N_fragment
              source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: ADH1

    - cistron:
        label: anchor2_fusion
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p_C_fragment
              source: uniprot

    - terminator: PGK1
