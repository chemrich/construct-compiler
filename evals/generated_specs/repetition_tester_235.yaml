construct:
  name: "dual_scFv_fusion_constructs_divergent"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    
    - cistron:
        label: scFv_construct_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: VH_domain_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: VL_domain_1
              source: uniprot
    
    - terminator: rrnB_T1

    - promoter: tac
    
    - cistron:
        label: scFv_construct_2
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: VH_domain_2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: VL_domain_2
              source: uniprot
    
    - terminator: T7term
