construct:
  name: "yeast_dual_trna_recombination_resistant"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SNR52
    - cistron:
        label: trna_unit_1
        gene:
          id: tRNA_1
    - terminator: SUP4_term
    - spacer: 50
    - promoter: RPR1
    - cistron:
        label: trna_unit_2
        fused: false
        gene:
          id: tRNA_2
    - terminator: SNR52_term