construct:
  name: segmented_gene_dual_linker_fusion
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: segmented_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: segment_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: segment_2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: segment_3
              source: uniprot

    - terminator: rrnB_T1
