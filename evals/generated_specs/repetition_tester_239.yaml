construct:
  name: "dual_luciferase_UTR_comparison_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
      cistron:
        label: luciferase_UTR1
        expression: high
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot
      utr_5prime: "GCCACCGCTAGCTAGCTGCGCGCTAGC"
      utr_3prime: "AATAGTACGTACGTACGTACGTACGTA"
      polya_signal: SV40

    - spacer: 300

    - promoter: EF1_alpha
      cistron:
        label: luciferase_UTR2
        expression: high
        chain:
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot
      utr_5prime: "TACGACTACGACTACGACTACGATACGA"
      utr_3prime: "CGTAGCTAGCTAGCTAGCTAGCTAGCTA"
      polya_signal: WPRE

    - terminator: rrnB_T1
