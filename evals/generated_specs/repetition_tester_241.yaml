construct:
  name: mammalian_receptor_ligand_fusion_unique_linker
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: receptor_ligand_fusion
        expression: high
        chain:
          - tag: signal_peptide_unique
            # Custom mammalian secretion signal (non-repetitive)
            sequence: "MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQAPILSRVGDGTQDNLSGAEKAVQVKVKALPDAQFEVV"
          - gene:
              id: "PDGFRA"
              source: uniprot
          - linker:
              type: custom_aperiodic
              # Unique, non-repetitive linker designed to minimize secondary structure and deletions
              sequence: "GGLNQSVQPPSDKPGTRPPDPFSAQLDHTGAELPGVVPPRQKVSGHG"
          - gene:
              id: "PDGF_B"
              source: uniprot

    - terminator: rrnB_T1

  # Note: Mammalian polyA tail is typically added post-transcriptionally by the host cell machinery.
  # For synthetic control, specify a custom non-repetitive polyA sequence in the 3' UTR if cloning into a system requiring explicit polyA specification.
  # Standard mammalian expression vectors (like pTwist CMV) include native polyA machinery.
