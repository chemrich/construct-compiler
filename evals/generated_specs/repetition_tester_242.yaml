construct:
  name: yeast_metabolic_multigene_pathway
  host: yeast
  # Note: Standard polycistronic mRNAs are not typically supported in yeast. 
  # This design uses unique promoter-terminator pairs for each enzyme to 
  # satisfy the requirement for distinct translation initiation sites and unique terminators.
  backbone:
    resistance: ampicillin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: ERG10_acetyltransferase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P12683
              source: uniprot
    - terminator: CYC1
    - promoter: PGK1
    - cistron:
        label: ERG13_synthase
        expression: high
        fused: false
        chain:
          - tag: Twin-Strep
          - gene:
              id: P54839
              source: uniprot
    - terminator: ADH1
    - promoter: GPD
    - cistron:
        label: HMG1_reductase
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: P12068
              source: uniprot
    - terminator: ENO2