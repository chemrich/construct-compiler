construct:
  name: "yeast_trienzyme_metabolic_pathway"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: PDC1
              source: uniprot

    - terminator: ADH1_terminator

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: ADH2
              source: uniprot

    - terminator: CYC1_terminator

    - spacer: 25

    - cistron:
        label: enzyme3
        expression: low
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: GPD2
              source: uniprot

    - terminator: PGK1_terminator
