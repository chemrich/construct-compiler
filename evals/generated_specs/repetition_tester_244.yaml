construct:
  name: mammalian_dual_tag_expression_vector
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    # Note: pTwist CMV includes standard SV40 polyA; we'll add distinct polyA in cassette

  cassette:
    - promoter: CMV

    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: unspecified_target
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: BGH_polyA
