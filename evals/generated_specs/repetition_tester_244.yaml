construct:
  name: "divergent_tagged_mammalian_expression_vector"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: divergent_fusion_protein
        expression: high
        chain:
          - tag: Twin-Strep
          - gene:
              id: P01106
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: SV40_polyA # Selected SV40 polyA to provide divergence from the standard BGH polyA often found in CMV-driven backbones