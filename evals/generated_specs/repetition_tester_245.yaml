construct:
  name: "bacterial_cluster_minimal_recombination"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: gene_1
        expression: high
        gene:
          id: cluster_gene_1
          source: uniprot
    
    - spacer: 35
    
    - cistron:
        label: gene_2
        expression: high
        fused: false
        gene:
          id: cluster_gene_2
          source: uniprot
    
    - terminator: rrnB_T1
