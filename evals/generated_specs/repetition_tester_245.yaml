construct:
  name: "non_repetitive_bacterial_cluster_reconstitution"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A  # Selected p15A for lower copy number and reduced recombination risk
    source: addgene

  cassette:
    - promoter: araBAD  # araBAD is used to avoid common T7 or lac-based system crosstalk

    - cistron:
        label: gene_A
        expression: medium
        gene:
          id: P21683
          source: uniprot

    - spacer: 35  # Defined spacer to ensure distinct intergenic distance

    - cistron:
        label: gene_B
        expression: high  # Different expression level used to ensure distinct RBS sequence selection
        fused: false      # Ensures independent translation with its own RBS
        gene:
          id: P21684
          source: uniprot

    - terminator: rrnB_T1