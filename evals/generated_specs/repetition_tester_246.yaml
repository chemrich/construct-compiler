construct:
  name: "dual_marker_yeast_non_homologous"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1
      
    - cistron:
        label: marker_1
        expression: high
        chain:
          - gene:
              id: kanMX4
              source: uniprot

    - terminator: CYC1

    - spacer: 50

    - promoter: GAL1

    - cistron:
        label: marker_2
        expression: high
        chain:
          - gene:
              id: natNT2
              source: uniprot

    - terminator: PGK1
