construct:
  name: "inducible_expression_maximal_divergence"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD promoter with maximal sequence divergence from T7/lac system

    - cistron:
        label: repressor
        expression: medium
        chain:
          - gene:
              id: araC
              source: uniprot
              # Native araC repressor for araBAD control; minimally used elsewhere in construct

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: araBAD
      # Second araBAD instance for target gene (induced by L-arabinose)

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: codon_optimized_target
              source: uniprot
              # Use codon-optimized variant without poly-A/T or repetitive GC-rich motifs

    - terminator: T7term
