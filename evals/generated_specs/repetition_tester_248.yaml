construct:
  name: "mammalian_triple_immunogenic_peptide_codon_optimized"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: immunogenic_repeat_1
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: custom_immunogenic_peptide_v1
              source: uniprot
              note: "Codon variant 1 - optimized for human expression pattern A"

    - spacer: 24

    - cistron:
        label: immunogenic_repeat_2
        expression: high
        fused: false
        chain:
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: custom_immunogenic_peptide_v2
              source: uniprot
              note: "Codon variant 2 - optimized for human expression pattern B"

    - spacer: 28

    - cistron:
        label: immunogenic_repeat_3
        expression: high
        fused: false
        chain:
          - linker:
              type: short_GS
          - gene:
              id: custom_immunogenic_peptide_v3
              source: uniprot
              note: "Codon variant 3 - optimized for human expression pattern C"
          - cleavage_site: TEV

    - terminator: rrnB_T1
