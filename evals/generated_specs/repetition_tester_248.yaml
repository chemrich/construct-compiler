construct:
  name: "tandem_immunogenic_peptide_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: trivalent_fusion_protein
        expression: high
        chain:
          - gene:
              id: immunogenic_peptide_codon_v1 # Using distinct IDs to enforce synonymously unique codon usage
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: immunogenic_peptide_codon_v2 # Using distinct IDs to enforce synonymously unique codon usage
              source: uniprot
          - linker:
              type: short_GS
              repeats: 2
          - gene:
              id: immunogenic_peptide_codon_v3 # Using distinct IDs to enforce synonymously unique codon usage
              source: uniprot
    - terminator: bGH_polyA # Standard mammalian terminator for high-level expression in HEK293