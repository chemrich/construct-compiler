construct:
  name: "secreted_multidomain_enzyme_sc"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: catalytic_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: binding_domain
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: cellulose_binding_module
              source: uniprot

    - terminator: CYC1
