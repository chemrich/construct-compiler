construct:
  name: "mammalian_bicistronic_dual_purified"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - gene:
              id: EGFP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    # 2A self-cleaving peptide (T2A variant) positioned between cistrons
    # T2A is structurally distinct from typical IRES sequences and avoids homology-driven deletions
    - spacer: 18

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - terminator: rrnB_T1
