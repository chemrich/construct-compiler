construct:
  name: "paranoid_triple_terminator_ecoli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    # First terminator: rrnB T1 (strong Rho-independent)
    - terminator: rrnB_T1

    # Spacer between terminators to prevent interference
    - spacer: 25

    # Second terminator: T7 terminator (sequential Rho-independent)
    - terminator: T7term

    # Additional spacer
    - spacer: 25

    # Third terminator: BBa_B0015 (canonical BioBrick terminator, structurally distinct)
    - terminator: BBa_B0015
