construct:
  name: "E_coli_therapeutic_peptide_mammalian_divergent"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: synthetic_therapeutic_peptide_eco_optimized
              source: custom
              # Note: This peptide sequence should be codon-optimized for E. coli
              # using rare codons and non-mammalian-preferred codon frequencies
              # to maximize divergence from any future mammalian version while
              # maintaining identical amino acid sequence

    - terminator: T7term
