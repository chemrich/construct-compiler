construct:
  name: "yeast_scaffold_protein_four_sites"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scaffold_core
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: WW_domain_scaffold
              source: uniprot
              # Core scaffold unit (e.g., tandem WW domains or PDZ-like)

    - linker:
        type: rigid_EAAAK
        repeats: 1

    - cistron:
        label: binding_site_1
        fused: false
        expression: high
        chain:
          - gene:
              id: SH3_domain_1
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 3

    - cistron:
        label: binding_site_2
        fused: false
        expression: high
        chain:
          - gene:
              id: SH3_domain_1_syn1
              source: uniprot
              # Synonymous variant of SH3 domain to minimize deletion risk

    - linker:
        type: rigid_EAAAK
        repeats: 2

    - cistron:
        label: binding_site_3
        fused: false
        expression: high
        chain:
          - gene:
              id: SH3_domain_1_syn2
              source: uniprot
              # Second synonymous variant of SH3 domain

    - linker:
        type: GS_flexible
        repeats: 4

    - cistron:
        label: binding_site_4
        fused: false
        expression: high
        chain:
          - gene:
              id: SH3_domain_1_syn3
              source: uniprot
              # Third synonymous variant of SH3 domain

    - terminator: rrnB_T1
