construct:
  name: "mammalian_ABC_fusion_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_ABC_fusion
        expression: high
        chain:
          - tag: signal_peptide_SP
          - gene:
              id: ProteinA
              source: uniprot
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinB
              source: uniprot
          - cleavage_site: Thrombin
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: ProteinC
              source: uniprot
          - solubility_tag: GST

    - terminator: rrnB_T1
