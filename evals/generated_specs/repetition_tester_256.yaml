construct:
  name: "dual_gene_ribozyme_processing"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: gene1
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - ribozyme:
        type: hammerhead
        variant: minimal
        # Ensures proper self-cleavage downstream of gene1

    - cistron:
        label: gene2
        expression: high
        gene:
          id: mScarlet
          source: fpbase

    - ribozyme:
        type: HDV
        variant: canonical
        # Distinct ribozyme type prevents recombination and provides diversity

    - terminator: rrnB_T1
