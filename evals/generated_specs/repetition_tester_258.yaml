construct:
  name: "dual_reporter_GFP_mCherry_mammalian"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: SV40_polyA

    - promoter: EF1_alpha
    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BGH_polyA
