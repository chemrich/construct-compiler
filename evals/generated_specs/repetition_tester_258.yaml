construct:
  name: "dual_mammalian_divergent_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 100
    - promoter: EF1_alpha
    - cistron:
        label: red_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA