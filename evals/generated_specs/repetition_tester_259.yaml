construct:
  name: "Gateway_entry_vector_unique_attL_variants"
  host: e_coli
  
  backbone:
    resistance: chloramphenicol  # chloramphenicol chosen for uniqueness vs. standard kan/amp libraries
    ori: CloDF13                  # CloDF13 chosen for low-copy, reduced recombination risk
    source: addgene

  cassette:
    - promoter: lacUV5  # lacUV5 for chloramphenicol resistance (distinct from typical promoters)

    - cistron:
        label: chloramphenicol_acetyltransferase
        expression: high
        gene:
          id: cat
          source: uniprot

    - terminator: T7term  # T7 terminator for unique flanking sequence context

    # attL1 variant (sequence-divergent from standard Gateway)
    - comment: "attL1_variant_custom: AACAAAGCTGGAGCTCCACCCGCAGACGTACGAAACACCCGCCTG"

    # Entry cassette spacer for cloning insert
    - spacer: 50

    # attL2 variant (sequence-divergent from standard Gateway)
    - comment: "attL2_variant_custom: CTGGAGACGACGAAACACCGCCTGCGCTACGAGCTGCAGCTG"
