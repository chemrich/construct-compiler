construct:
  name: "yeast_secreted_ProteinY"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_ProteinY
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: ProteinY
              source: uniprot
              codon_optimization: yeast_synonymous_divergence

    - terminator: CYC1_poly_A
