construct:
  name: "ProteinY_secretion_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - signal_peptide: alpha_factor  # S. cerevisiae secretion signal
          - gene:
              id: ProteinY
              source: uniprot
              # Codon optimization will use synonymous divergence to avoid repeats

    - terminator: CYC1