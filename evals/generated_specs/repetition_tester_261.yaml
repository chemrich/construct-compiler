construct:
  name: "triple_AMP-X_codon_optimized_divergent"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: AMP-X_v1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AMP-X_codon_variant_1
              source: uniprot
              note: "First copy with synonymous codons optimized for E. coli codon bias"
          - linker:
              id: linker_divergent_1
              sequence_note: "Unique non-homologous linker #1 (GGGSGGG linker variant A)"
    
    - cistron:
        label: AMP-X_v2
        expression: high
        fused: false
        chain:
          - linker:
              id: linker_divergent_2
              sequence_note: "Unique non-homologous linker #2 (AAAGAAA linker variant B)"
          - gene:
              id: AMP-X_codon_variant_2
              source: uniprot
              note: "Second copy with alternate synonymous codons to minimize homology with v1"
          - linker:
              id: linker_divergent_3
              sequence_note: "Unique non-homologous linker #3 (GAGAGAG linker variant C)"
    
    - cistron:
        label: AMP-X_v3
        expression: high
        fused: false
        chain:
          - gene:
              id: AMP-X_codon_variant_3
              source: uniprot
              note: "Third copy with third unique set of synonymous codons, maximizing divergence from v1 and v2"
    
    - terminator: rrnB_T1
