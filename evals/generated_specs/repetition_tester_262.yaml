construct:
  name: "recombination_proof_enzyme_operon_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzymeA
        expression: high
        rbs: GCGAGACCC
        codon_optimization: high_gc_bias
        chain:
          - gene:
              id: EnzymeA
              source: uniprot

    - terminator: CYC1

    - spacer: 25

    - cistron:
        label: EnzymeB
        expression: high
        rbs: AAAGAACC
        codon_optimization: high_gc_bias
        fused: false
        chain:
          - gene:
              id: EnzymeB
              source: uniprot

    - terminator: PGK1

    - spacer: 25

    - cistron:
        label: EnzymeC
        expression: high
        rbs: GAGATCTG
        codon_optimization: standard
        fused: false
        chain:
          - gene:
              id: EnzymeC
              source: uniprot

    - terminator: ADH1
