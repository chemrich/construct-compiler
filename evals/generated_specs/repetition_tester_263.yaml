construct:
  name: "dual_orthogonal_mammalian_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: red_reporter
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_pA
    - spacer: 100
    - promoter: EF1_alpha
    - cistron:
        label: green_reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_pA