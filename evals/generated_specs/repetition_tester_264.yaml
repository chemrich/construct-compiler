construct:
  name: "baculovirus_dual_protein_expression"
  host: insect_cells

  backbone:
    catalog_vector: "pFastBac_Dual"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: p10

    - cistron:
        label: ProteinAlpha
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinAlpha
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: Strep-II

    - terminator: SV40_polyA

    - promoter: polh

    - cistron:
        label: ProteinBeta
        expression: high
        chain:
          - tag: 8xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinBeta
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc

    - terminator: SV40_polyA
