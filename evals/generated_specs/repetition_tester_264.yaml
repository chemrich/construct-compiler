construct:
  name: "dual_protein_alpha_beta_baculovirus_expression"
  host: insect
  backbone:
    catalog_vector: "pFastBac_Dual"
    resistance: ampicillin
    ori: pUC
  cassette:
    - promoter: polh
    - cistron:
        label: protein_alpha
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ProteinAlpha
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Strep-II
    - spacer: 50
    - promoter: p10
    - cistron:
        label: protein_beta
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: short_GS
              repeats: 2
          - gene:
              id: ProteinBeta
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Myc
    - terminator: SV40_polyA