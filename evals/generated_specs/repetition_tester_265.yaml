construct:
  name: "GeneX_dual_cassette_anti_recombination"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
      # Strong constitutive synthetic promoter (BBa_J23100)
    
    - cistron:
        label: GeneX_cassette_1
        expression: high
        chain:
          - gene:
              id: GeneX
              source: uniprot
              codon_usage: optimized_ecoli
    
    - terminator: BBa_B0015
      # Strong transcriptional terminator (synthetic BioBrick)
    
    - spacer: 50
      # Physical spacing between cassettes to minimize recombination risk
    
    - promoter: araBAD
      # Alternative strong constitutive promoter (araBAD without arabinose gives basal expression)
    
    - cistron:
        label: GeneX_cassette_2
        expression: high
        chain:
          - gene:
              id: GeneX
              source: uniprot
              codon_usage: optimized_yeast
              # Deliberately use alternative codon bias to maximize sequence divergence
    
    - terminator: rrnB_T1
      # Alternative terminator (rRNA operon terminator, distinct sequence from BBa_B0015)
