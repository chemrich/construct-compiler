construct:
  name: "multi_domain_fusion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: multi_domain_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DomainA
              source: uniprot
              codon_optimization: mammalian_high_bias
          - linker:
              type: GS_flexible
              repeats: 1
              sequence_variant: "GGSGGSGGSGGSGGS"
          - gene:
              id: DomainB
              source: uniprot
              codon_optimization: mammalian_low_bias
          - linker:
              type: GS_flexible
              repeats: 1
              sequence_variant: "GGTGGATCTGGATCCGGTTCT"
          - gene:
              id: DomainC
              source: uniprot
              codon_optimization: mammalian_medium_bias

    - terminator: rrnB_T1
