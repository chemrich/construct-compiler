construct:
  name: "triple_sgRNA_yeast_CRISPR"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: CEN/ARS
    source: addgene

  cassette:
    - promoter: U6
      # First sgRNA unit with standard U6 promoter
    - gene:
        id: sgRNA_target1
        source: uniprot
      label: sgRNA_1

    - spacer: 25

    - promoter: SNR52
      # Second sgRNA unit with SNR52 promoter (yeast Pol III, distinct from U6)
    - gene:
        id: sgRNA_target2
        source: uniprot
      label: sgRNA_2

    - spacer: 25

    - promoter: RPR1
      # Third sgRNA unit with RPR1 promoter (yeast Pol III, distinct from U6 and SNR52)
    - gene:
        id: sgRNA_target3
        source: uniprot
      label: sgRNA_3

    - terminator: yeast_polyA
