construct:
  name: "yeast_orthogonal_triple_sgrna_array"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: U6
    - cistron:
        label: sgrna_target_1
        expression: high
        gene:
          id: sgRNA_scaffold_variant_1
    - spacer: 50
    - promoter: SNR52
    - cistron:
        label: sgrna_target_2
        expression: high
        gene:
          id: sgRNA_scaffold_variant_2
    - spacer: 50
    - promoter: RPR1
    - cistron:
        label: sgrna_target_3
        expression: high
        gene:
          id: sgRNA_scaffold_variant_3
    - terminator: BBa_B0015