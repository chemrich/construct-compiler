construct:
  name: "dual_selection_non_homologous_mammalian"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: puromycin_selection
        expression: medium
        gene:
          id: PuroR
          source: uniprot
    - terminator: BGH_pA
    - spacer: 100
    - promoter: EF1_alpha
    - cistron:
        label: hygromycin_selection
        expression: medium
        gene:
          id: HygR
          source: uniprot
    - terminator: SV40_pA