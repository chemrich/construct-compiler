construct:
  name: "LacI_inducible_GeneY_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    # First cassette: LacI repressor gene with its own dedicated promoter
    - promoter: lacUV5
      cistron:
        label: lacI_repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    # Spacer to separate the two independent cassettes
    - spacer: 50

    # Second cassette: GeneY under pTac-like (IPTG-inducible) control
    - promoter: tac
      cistron:
        label: target_gene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneY
              source: uniprot

    - terminator: rrnB_T1
