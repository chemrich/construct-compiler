construct:
  name: dual_reporter_recombination_safe
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha  # Human elongation factor 1-alpha promoter

    - cistron:
        label: reporter1
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: SV40_polyA  # Simian virus 40 polyadenylation signal

    - promoter: U6  # Human RNA polymerase III promoter (completely different machinery)

    - cistron:
        label: reporter2
        expression: medium
        gene:
          id: sfGFP
          source: fpbase

    - terminator: BGH_polyA  # Bovine growth hormone polyadenylation signal