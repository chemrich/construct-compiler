construct:
  name: dual_reporter_mammalian_mCherry_sfGFP
  host: HEK293

  cassette:
    - promoter: CMV
      # CMV from human cytomegalovirus

    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: SV40_poly_A
      # SV40 polyadenylation signal from Simian Virus 40

    - spacer: 50

    - promoter: EF1_alpha
      # EF1-alpha from human elongation factor 1-alpha

    - cistron:
        label: sfGFP_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rBG_poly_A
      # Rabbit beta-globin polyadenylation signal (no sequence homology to SV40)
