construct:
  name: "ProteinZ_triple_tag_low_recombination"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinZ_with_triple_tags
        expression: high
        chain:
          - tag: 6xHis
            codon_variant: variant_A
          - linker:
              type: GS_flexible
              repeats: 1
              codon_variant: variant_A
          - tag: Strep-II
            codon_variant: variant_B
          - linker:
              type: rigid_EAAAK
              codon_variant: variant_B
          - solubility_tag: GST
            codon_variant: variant_C
          - linker:
              type: GS_flexible
              repeats: 2
              codon_variant: variant_C
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: rrnB_T1
