construct:
  name: "yeast_dual_secreted_protein_system"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: secreted_A
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - gene:
              id: SecretedProteinA
              source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TDH3
    - cistron:
        label: secreted_B
        expression: high
        chain:
          - tag: SUC2_signal_peptide
          - gene:
              id: SecretedProteinB
              source: uniprot
    - terminator: ADH1_term