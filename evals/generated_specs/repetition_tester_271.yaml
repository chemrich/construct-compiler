construct:
  name: "dual_secreted_proteins_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: secreted_protein_A
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: SecretedProteinA
              source: uniprot

    - terminator: CYC1

    - spacer: 25

    - promoter: ADH1

    - cistron:
        label: secreted_protein_B
        expression: high
        chain:
          - secretion_signal: invertase_signal
          - gene:
              id: SecretedProteinB
              source: uniprot

    - terminator: ADH1_terminator
