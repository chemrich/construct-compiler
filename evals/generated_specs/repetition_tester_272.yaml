construct:
  name: "triple_TMD_fusion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: TMD_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TMD1
              source: uniprot
              codon_usage: mammalian_variant_A
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TMD2
              source: uniprot
              codon_usage: mammalian_variant_B
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: TMD3
              source: uniprot
              codon_usage: mammalian_variant_C
          - tag: HA

    - terminator: rrnB_T1
