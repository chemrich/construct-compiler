construct:
  name: "yeast_orthogonal_dual_reporter_sensor"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TEF1
    - cistron:
        label: mcherry_expression
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: ADH1_term