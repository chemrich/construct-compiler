construct:
  name: "triple_enzyme_localization_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: EnzymeA_nuclear
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: EnzymeA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: EnzymeB_mitochondrial
        expression: high
        chain:
          - tag: MTS
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: EnzymeB
              source: uniprot

    - terminator: rrnB_T1

    - promoter: U6

    - cistron:
        label: EnzymeC_ER_retention
        expression: high
        chain:
          - tag: KDEL
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: EnzymeC
              source: uniprot

    - terminator: rrnB_T1
