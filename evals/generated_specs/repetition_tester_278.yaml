construct:
  name: "medium_strength_promoter_library_e_coli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23106
      # Medium-strength BioBrick promoter; consensus -35/-10 boxes
      # Variant A: baseline sequence

    - cistron:
        label: reporter_1
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1

  cassette:
    - promoter: trc
      # Medium-strength Trc promoter; distinct -35/-10 architecture from J23106
      # Variant B: divergent consensus

    - cistron:
        label: reporter_2
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1

  cassette:
    - promoter: araBAD
      # Medium-strength araBAD promoter without arabinose induction
      # Variant C: araBAD half-site, constitutively active configuration
      # Distinct -35/-10 positioning from Trc and J23106

    - cistron:
        label: reporter_3
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1

  cassette:
    - promoter: rrnA_P1
      # Medium-strength rrn P1 promoter
      # Variant D: bacterial rRNA operon promoter; minimal homology to synthetic/engineered promoters
      # Distinct spacing and consensus from araBAD, Trc, J23106

    - cistron:
        label: reporter_4
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1

  cassette:
    - promoter: tacI
      # Medium-strength TacI promoter variant
      # Variant E: modified Tac with divergent -35 box from trc
      # Orthogonal sequence space to all above; distinct consensus mutations

    - cistron:
        label: reporter_5
        expression: medium
        gene:
          id: lacZ_alpha
          source: uniprot

    - terminator: rrnB_T1
