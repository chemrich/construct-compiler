construct:
  name: "non_homologous_constitutive_medium_library"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23106  # Anderson synthetic medium-strength constitutive promoter
    - cistron:
        label: reporter_1
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: pbla  # Beta-lactamase promoter, natural medium constitutive (non-homologous to Anderson)
    - cistron:
        label: reporter_2
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term
    - spacer: 50
    - promoter: proC  # proC metabolic promoter, natural medium constitutive
    - cistron:
        label: reporter_3
        expression: medium
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase
    - terminator: BBa_B0015
    - spacer: 50
    - promoter: rpsL  # rpsL ribosomal promoter, natural medium constitutive
    - cistron:
        label: reporter_4
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: gapA  # gapA glycolytic promoter, natural medium constitutive
    - cistron:
        label: reporter_5
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: T7term