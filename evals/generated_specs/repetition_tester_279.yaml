construct:
  name: ProteinX_P2A_ProteinY_low_recombination
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinX
              source: uniprot
              codon_optimization: "max_divergence"
          - linker:
              type: "custom_non_homologous"
              sequence: "GGSGGT"
          - peptide:
              id: P2A
              type: "self_cleaving_2A"
          - linker:
              type: "custom_non_homologous"
              sequence: "GGTGGA"
          - gene:
              id: ProteinY
              source: uniprot
              codon_optimization: "max_divergence"

    - terminator: rrnB_T1
    
  notes: "Construct uses P2A self-cleaving peptide for stoichiometric 1:1 expression of ProteinX and ProteinY as separate mature proteins from a single fusion. Codon optimization set to 'max_divergence' to minimize homologous recombination risk. Pre- and post-P2A linkers are non-homologous (GGSGGT vs GGTGGA) to prevent internal recombination hotspots."
