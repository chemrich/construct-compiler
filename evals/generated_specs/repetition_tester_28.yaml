construct:
  name: "mammalian_4sgRNA_array_distinct_promoters"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: U6
      cistron:
        label: sgRNA_1
        expression: high
        chain:
          - gene:
              id: "CRISPR_sgRNA_scaffold_v1"
              source: "uniprot"

    - terminator: U6term

    - spacer: 50

    - promoter: H1
      cistron:
        label: sgRNA_2
        expression: high
        chain:
          - gene:
              id: "CRISPR_sgRNA_scaffold_v2"
              source: "uniprot"

    - terminator: H1term

    - spacer: 50

    - promoter: 7SL
      cistron:
        label: sgRNA_3
        expression: high
        chain:
          - gene:
              id: "CRISPR_sgRNA_scaffold_v3"
              source: "uniprot"

    - terminator: 7SLterm

    - spacer: 50

    - promoter: 5S
      cistron:
        label: sgRNA_4
        expression: high
        chain:
          - gene:
              id: "CRISPR_sgRNA_scaffold_v4"
              source: "uniprot"

    - terminator: 5Sterm
