construct:
  name: "SynthaseABC_tricistronic_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1

    - cistron:
        label: SynthaseA
        expression: high
        chain:
          - gene:
              id: SynthaseA
              source: uniprot

    - spacer: 45

    - cistron:
        label: SynthaseB
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: SynthaseB
              source: uniprot

    - spacer: 48

    - cistron:
        label: SynthaseC
        expression: high
        fused: false
        chain:
          - gene:
              id: SynthaseC
              source: uniprot

    - terminator: rrnB_T1
