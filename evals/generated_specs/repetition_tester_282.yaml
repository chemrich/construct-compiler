construct:
  name: ProteinX_sfGFP_TEV_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinX_sfGFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              # Custom non-standard linker preceding rare-codon TEV site
              sequence: TPPTPPT
          - cleavage_site: TEV
            # Note: TEV site implemented with rare codon optimization
            # (codon-optimized variant: GAGACGAAACTTATTATTTCAGGGC)
            # This is maximally differentiated from canonical TEV sequences
          - linker:
              # Custom non-standard linker following rare-codon TEV site
              sequence: PPGTPP
          - solubility_tag: MBP
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
