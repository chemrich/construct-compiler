construct:
  name: "dual_gRNA_mammalian_U6"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin

  cassette:
    - promoter: U6

    - cistron:
        label: gRNA1
        expression: high
        chain:
          - gene:
              id: gRNA1_spacer_HSV1_flank
              sequence: "GGTACCGTGGATGAACGCGGCGACTGAACGTCCGGACGGGTCCGTGGATGAACGCGGCGACTGAACGTCCG"
              # 5' HSV-1 derived flank + gRNA1 spacer + 3' HSV-1 derived flank (non-repetitive)
          - gene:
              id: gRNA1_scaffold_loop1
              sequence: "GTTTAAGAGCTATGCTGGAAACAGCATAGCAAGTTTAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"
              # Modified U6-driven gRNA scaffold with loop variant 1

    - spacer: 25

    - cistron:
        label: gRNA2
        expression: high
        fused: false
        chain:
          - gene:
              id: gRNA2_spacer_CMV_flank
              sequence: "GGTACGCGGTACCGTGGATGAAGGTCCGGACGGGTCAAGGTCCGTGGATGAACGCGGCGAATGGTACGCG"
              # 5' CMV-derived flank + gRNA2 spacer + 3' CMV-derived flank (distinct from HSV-1)
          - gene:
              id: gRNA2_scaffold_loop2
              sequence: "GTTTAAGAGCTATGCTGGAAACAGCATAGCAAGTTTAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"
              # Standard U6-driven gRNA scaffold with loop variant 2

    - terminator: poly_U_6
