construct:
  name: "AntigenZ_Aga2p_Yeast_Surface_Display"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Strong constitutive yeast promoter selected as alternative to TDH3
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: AntigenZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: AGA2
              source: uniprot
    - terminator: CYC1_term