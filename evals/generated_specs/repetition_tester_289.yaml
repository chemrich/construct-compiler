construct:
  name: AntigenZ_Aga2p_yeast_display
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: AntigenZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Aga2p
              source: uniprot
              codon_optimization: true
              # Codon optimization subtly recodes Aga2p while preserving function

    - terminator: CYC1
