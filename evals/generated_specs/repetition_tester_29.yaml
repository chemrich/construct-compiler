construct:
  name: "toxin_antitoxin_diverged_system"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: antitoxin
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ccdA
              source: uniprot
    
    # Highly diverged spacer: 127 bp with low sequence identity to flanking regions
    - spacer: 127
    
    - promoter: araBAD
    
    - cistron:
        label: toxin
        expression: medium
        chain:
          - gene:
              id: ccdB
              source: uniprot
    
    - terminator: rrnB_T1
