construct:
  name: "insect_scFv_secreted_codon_optimized"
  host: insect_Sf9

  backbone:
    catalog_vector: "pIEx-4"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: signal_peptide_Drosophila  # Native insect secretion signal
          - gene:
              id: VH_domain
              source: custom
              codon_optimization: insect_Sf9
          - linker:
              type: custom_scFv
              sequence: "TVAAPSVFIFPPSDEQLKSGTASVVCLLNNFYPREAKVQWKVDNALQSGNSQESVTEQDSKDSTYSLSSTLTLSKADYEKHKVYACEVTHQGLSSPVTKSFNRGEC"
          - gene:
              id: VL_domain
              source: custom
              codon_optimization: insect_Sf9
          - tag: 6xHis

    - terminator: SV40_polyA
