construct:
  name: "dual_promoter_mammalian_proteinA_mCherry_proteinB_EGFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: proteinA_mCherry
        expression: high
        chain:
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase
              variant: "codon_optimized_v1"

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: proteinB_EGFP
        expression: high
        chain:
          - gene:
              id: ProteinB
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: EGFP
              source: fpbase
              variant: "codon_optimized_v2"

    - terminator: BGH_polyA
