construct:
  name: "mammalian_EGFP_degron_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: EGFP_degron
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - degron:
              type: dPEST
              variant: "canonical_C-terminal"
              sequence: "PEST_motif_C-terminal"
          - tag: V5

    - terminator: rrnB_T1
