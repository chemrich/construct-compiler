construct:
  name: "ethanol_pathway_EnzymeX_EnzymeY_EnzymeZ"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: EnzymeX
        expression: high
        gene:
          id: EnzymeX_codon_optimized_yeast
          source: custom
        codon_optimization: yeast

    - terminator: ADH1_terminator

    - spacer: 42

    - promoter: TEF1

    - cistron:
        label: EnzymeY
        expression: high
        gene:
          id: EnzymeY_codon_optimized_yeast
          source: custom
        codon_optimization: yeast

    - terminator: CYC1_terminator

    - spacer: 51

    - promoter: PGK1

    - cistron:
        label: EnzymeZ
        expression: high
        gene:
          id: EnzymeZ_codon_optimized_yeast
          source: custom
        codon_optimization: yeast

    - terminator: PGK1_terminator
