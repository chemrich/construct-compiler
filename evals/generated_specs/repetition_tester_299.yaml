construct:
  name: "aav2_rep_rec_resistant"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha  # EF1-alpha is used to provide high expression while avoiding sequence homology with common CMV-driven AAV helper components.
    - cistron:
        label: rep_protein
        expression: high
        gene:
          id: P03132
          source: uniprot
    - terminator: hGH_polyA  # Utilizing the human Growth Hormone polyadenylation signal as a unique alternative to standard bGH or SV40 signals to minimize homology.