construct:
  name: "AAV_Rep_mammalian_production"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: EF1_alpha  # Novel choice for AAV Rep: avoids CMV/SV40 commonly used in helper plasmids

    - cistron:
        label: Rep
        expression: high
        chain:
          - gene:
              id: "Rep_codon_optimized_synonymous_diversified"
              source: uniprot
              # Note: Sequence should be human codon-optimized with maximal synonymous variation
              # to eliminate homology windows with ITRs and helper plasmid sequences.
              # Recommend synthesis with algorithm-driven codon shuffling (e.g., IDT OptimizationEngine).

    - terminator: polyA_unique  # Custom polyA signal distinct from SV40/BGH
      # Recommendation: Use synthetic polyA derived from different viral source
      # or designed de novo to avoid ITR recombination hotspots.
