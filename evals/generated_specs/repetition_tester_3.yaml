construct:
  name: "GeneY_yeast_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        gene:
          id: GeneY
          source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: kanMX_codon_scrambled
          source: custom
          note: "Extensively codon-optimized variant of kanMX with wobble-position synonymous substitutions to minimize homologous recombination with host genomic sequences"
