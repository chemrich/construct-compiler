construct:
  name: ProteinX_TEV_ProteinY_fusion
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: ProteinX  # Replace with actual protein ID
              source: uniprot
          - cleavage_site: TEV  # Compiler will optimize codon usage for maximal divergence
          - gene:
              id: ProteinY  # Replace with actual protein ID
              source: uniprot
    
    - terminator: rrnB_T1