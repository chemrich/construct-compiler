construct:
  name: ProteinX_TEV_ProteinY_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot
          - cleavage_site: TEV
            codon_optimization: divergence_maximized
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
