construct:
  name: "E_coli_StrepHis_TEV_ProteinX"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 8xHis
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: X
              source: uniprot

    - terminator: rrnB_T1
