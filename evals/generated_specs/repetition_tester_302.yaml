              id: D1_yeast_codon_optimized_synonymous
              source: uniprot
              codon_optimization: yeast_synthetic
              repeat_avoidance: synonymous_codons
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: D2_yeast_codon_optimized_synonymous
              source: uniprot
              codon_optimization: yeast_synthetic
              repeat_avoidance: synonymous_codons
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: D3_yeast_codon_optimized_synonymous
              source: uniprot
              codon_optimization: yeast_synthetic
              repeat_avoidance: synonymous_codons

    - terminator: rrnB_T1
