construct:
  name: "E_coli_dual_resistance_biosensor"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    - cistron:
        label: biosensor
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1

    - spacer: 30

    - promoter: araBAD
    - cistron:
        label: kan_resistance
        expression: high
        gene:
          id: neo
          source: uniprot
    - terminator: T7term

    - spacer: 30

    - promoter: tac
    - cistron:
        label: spec_resistance
        expression: high
        gene:
          id: aadA
          source: uniprot
    - terminator: BBa_B0015
