construct:
  name: "tricolor_fluorescent_protein_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 25
    
    - cistron:
        label: rfp
        expression: high
        chain:
          - tag: 8xHis
          - gene:
              id: mScarlet
              source: fpbase
    
    - terminator: T7term
    
    - spacer: 25
    
    - cistron:
        label: bfp
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mTagBFP2
              source: fpbase
    
    - terminator: BBa_B0015
