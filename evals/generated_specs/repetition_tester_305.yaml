construct:
  name: "dual_secreted_ProteinZ_different_SPs"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinZ_albumin_SP
        expression: high
        chain:
          - gene:
              id: SP_albumin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: rrnB_T1

    # Second cassette with non-identical strong constitutive promoter
    - promoter: EF1_alpha

    - cistron:
        label: ProteinZ_IgG_SP
        expression: high
        chain:
          - gene:
              id: SP_immunoglobulin
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: rrnB_T1
