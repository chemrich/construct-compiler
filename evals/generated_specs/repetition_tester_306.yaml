construct:
  name: "tandem_BD1_trimer_recombination_resistant"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: BD1_trimer
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: BD1_variant_1
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: BD1_variant_2_synonymous
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: BD1_variant_3_synonymous
              source: uniprot
    
    - terminator: rrnB_T1
