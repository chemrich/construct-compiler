construct:
  name: "mammalian_dual_promoter_puro_resistance"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: puromycin_resistance
        expression: high
        gene:
          id: PuroR
          source: uniprot

    - terminator: rrnB_T1

    # Internal mini-promoter cassette (distinct genetic element)
    - promoter: U6

    - cistron:
        label: short_peptide
        expression: medium
        gene:
          id: custom_peptide
          source: uniprot

    - terminator: BBa_B0015
