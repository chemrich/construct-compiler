construct:
  name: MyPOI_SUMO_solubility_fusion
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: MyPOI_SUMO_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: MyPOI
              source: uniprot

    - terminator: rrnB_T1
