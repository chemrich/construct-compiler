construct:
  name: gene_a_orthogonal_arabinose_expression
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # Arabinose-inducible promoter; sequence design to be optimized for zero similarity and no repeats
    - cistron:
        label: target
        expression: high
        gene:
          id: GeneA
          source: uniprot
    - terminator: rrnB_T1