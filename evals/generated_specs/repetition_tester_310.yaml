construct:
  name: "yeast_stress_reporter_system"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
    # Note: yeast uses selection markers (e.g., URA3, LEU2) not antibiotic resistance
    # This is a placeholder; in practice use yeast_marker: URA3

  cassette:
    - promoter: HSP70  # Heat shock protein 70 promoter (stress-inducible in yeast)

    - cistron:
        label: stress_reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: GPD  # Glyceraldehyde-3-phosphate dehydrogenase (constitutive in yeast)

    - cistron:
        label: reference_control
        expression: high
        gene:
          id: luciferase
          source: uniprot

    - terminator: rrnB_T1
