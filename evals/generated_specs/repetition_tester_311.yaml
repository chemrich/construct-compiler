construct:
  name: diversified_sgrna_array_expression
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: sgrna_unit_1
        gene:
          id: sgrna_target_1_scaffold_v1
    - spacer: 35
    - cistron:
        label: sgrna_unit_2
        fused: true
        gene:
          id: sgrna_target_2_scaffold_v2
    - spacer: 35
    - cistron:
        label: sgrna_unit_3
        fused: true
        gene:
          id: sgrna_target_3_scaffold_v3
    - terminator: BBa_B0015