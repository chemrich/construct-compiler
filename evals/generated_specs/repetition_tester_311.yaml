construct:
  name: "triple_sgRNA_array_diverse_scaffolds"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: sgRNA_1
        expression: high
        gene:
          id: sgRNA_spacer_1_scaffold_variant_A
          source: custom
          # Note: User must provide sgRNA_1 with unique spacer and scaffold sequence A (synonymous codon usage optimized)
    
    - spacer: 40
    
    - cistron:
        label: sgRNA_2
        expression: high
        gene:
          id: sgRNA_spacer_2_scaffold_variant_B
          source: custom
          # Note: User must provide sgRNA_2 with unique spacer and scaffold sequence B (synonymous codon usage optimized differently)
    
    - spacer: 40
    
    - cistron:
        label: sgRNA_3
        expression: high
        gene:
          id: sgRNA_spacer_3_scaffold_variant_C
          source: custom
          # Note: User must provide sgRNA_3 with unique spacer and scaffold sequence C (synonymous codon usage optimized differently)
    
    - terminator: rrnB_T1
