construct:
  name: "dual_origin_stability_plasmid"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Note: Primary ori is pBR322 (low-copy). Secondary ori will be represented in cassette.
    # For true dual-ori stability with distinct sequences, a custom backbone is recommended.
    # This spec represents the primary backbone; secondary ori module follows in cassette.

  cassette:
    # Unique spacer fingerprint 1 (non-coding, unique sequence)
    - spacer: 60  # bp unique fingerprint spacer

    # Primary ori region (pBR322-derived, implicit in backbone)
    # Represented here as structural element with comment
    - promoter: T7lac

    - cistron:
        label: safety_marker_1
        expression: medium
        gene:
          id: aph
          source: uniprot
        # Kanamycin resistance for primary selection

    # Unique spacer fingerprint 2 (distinct from spacer 1)
    - spacer: 75  # bp unique fingerprint spacer

    # Secondary ori module (ColA-derived, distinct from primary)
    # Represented as a low-expression genetic element to maintain without recombination
    - cistron:
        label: secondary_ori_control
        expression: very_low
        gene:
          id: repE
          source: uniprot
        # RepE protein maintains secondary ColA-derived origin independently

    # Unique spacer fingerprint 3 (third distinct fingerprint)
    - spacer: 55  # bp unique fingerprint spacer

    # Stability cassette with marker for secondary ori
    - cistron:
        label: secondary_selection
        expression: low
        gene:
          id: cat
          source: uniprot
        # Chloramphenicol resistance for dual-selection verification

    # Unique spacer fingerprint 4 (final distinct fingerprint)
    - spacer: 80  # bp unique fingerprint spacer

    - terminator: rrnB_T1
