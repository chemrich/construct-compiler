construct:
  name: "tandem_secretion_signal_enhanced_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - secretion_signal: alpha_factor_prepro
          - linker:
              type: custom_GGSGGS
              sequence: GGTGGTAGTGGTTCT
          - secretion_signal: Suc2_signal
          - linker:
              type: custom_APAQ
              sequence: GCTCCAGCTCAAGCT
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
