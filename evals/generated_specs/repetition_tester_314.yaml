construct:
  name: "yeast_tandem_secretion_sfGFP"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor_prepro
          - linker:
              type: short_GS
              repeats: 1
          - tag: SUC2_signal
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: CYC1_terminator