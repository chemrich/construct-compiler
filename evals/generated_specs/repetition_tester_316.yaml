construct:
  name: "synthetic_trienzyme_operon_ena_enb_enc"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: ena_cistron
        expression: medium
        gene:
          id: Ena
          source: uniprot
    - spacer: 35
    - cistron:
        label: enb_cistron
        expression: medium
        fused: false
        gene:
          id: Enb
          source: uniprot
    - spacer: 42
    - cistron:
        label: enc_cistron
        expression: medium
        fused: false
        gene:
          id: Enc
          source: uniprot
    - terminator: rrnB_T1