construct:
  name: "synthetic_tri_enzyme_operon_Ena_Enb_Enc"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: p15A
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: Ena
        expression: high
        chain:
          - gene:
              id: "P69541"
              source: uniprot
    
    - spacer: 45
    
    - cistron:
        label: Enb
        expression: high
        fused: false
        gene:
          id: "P12345"
          source: uniprot
    
    - spacer: 52
    
    - cistron:
        label: Enc
        expression: high
        fused: false
        gene:
          id: "Q9XYZ1"
          source: uniprot
    
    - terminator: BBa_B0015
