construct:
  name: "dual_marker_centromeric_yeast_plasmid"
  host: yeast

  backbone:
    resistance: null
    ori: CEN6_ARSH4
    source: custom
    # Centromeric element CEN6/ARSH4 provides single-copy stability in S. cerevisiae
    # No antibiotic selection used; instead relying on dual auxotrophic markers

  cassette:
    - promoter: GAL1
      # Strong, regulatable promoter from GAL1 locus

    - cistron:
        label: URA3_marker
        expression: high
        gene:
          id: URA3
          source: uniprot
          # Orotidine 5'-phosphate decarboxylase; standard yeast marker

    - terminator: CYC1
      # Transcription terminator from cytochrome c gene

    - spacer: 50
      # Minimal spacing to reduce recombination risk

    - promoter: ADH1
      # Distinct constitutive promoter from alcohol dehydrogenase

    - cistron:
        label: LEU2_marker
        expression: high
        gene:
          id: LEU2
          source: uniprot
          # 3-isopropylmalate dehydrogenase; second selection marker

    - terminator: ADH1
      # Distinct terminator from ADH1 3' region
