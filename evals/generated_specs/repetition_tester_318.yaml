construct:
  name: multivalent_DBD_trimer_ecoli
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: multivalent_DBD
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DBD1_var1
              source: uniprot
              codon_variant: "optimized_E_coli_v1"
          
          - linker:
              type: rigid_EAAAK
              repeats: 3
              comment: "First linker: 15 aa, rigid architecture"
          
          - gene:
              id: DBD1_var2
              source: uniprot
              codon_variant: "optimized_E_coli_v2"
          
          - linker:
              type: GS_flexible
              repeats: 4
              comment: "Second linker: 12 aa, flexible, distinct from first"
          
          - gene:
              id: DBD1_var3
              source: uniprot
              codon_variant: "optimized_E_coli_v3"
    
    - terminator: rrnB_T1
  
  notes: "Three tandem DBD1 domains with synonymous codon variants to minimize recombination risk. Linkers differ in length (15 aa vs 12 aa), structure (rigid vs flexible), and amino acid composition to eliminate sequence identity at DNA level."
