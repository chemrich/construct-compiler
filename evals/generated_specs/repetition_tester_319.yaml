construct:
  name: "multiplex_gRNA_editor_three_targets"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: U6
      cistron:
        label: gRNA_target1
        expression: high
        gene:
          id: gRNA_spacer1
          source: uniprot

    - terminator: rrnB_T1

    - promoter: H1
      cistron:
        label: gRNA_target2
        expression: high
        gene:
          id: gRNA_spacer2
          source: uniprot

    - terminator: polT

    - promoter: 7SL
      cistron:
        label: gRNA_target3
        expression: high
        gene:
          id: gRNA_spacer3
          source: uniprot

    - terminator: BBa_B0015
