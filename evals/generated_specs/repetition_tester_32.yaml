```yaml
construct:
  name: "ProteinS_mitochondrial_targeting"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: mito_targeted_proteinS
        expression: high
        chain:
          - tag: mito_targeting_sequence  # mitochondrial targeting peptide
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P04637  # ProteinS (p53 tumor suppressor)
              source: uniprot
              codon_optimize: true  # ensures synonymous codon usage to avoid repeats

    - terminator: rrnB_T1
```