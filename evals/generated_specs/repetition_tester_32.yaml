construct:
  name: "ProteinS_Mito_Fusion_Repeat_Free"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mito_target_protein_s
        expression: high
        chain:
          - tag: MTS
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: PROS1
              source: uniprot
    - terminator: bGH_pA  # Standard mammalian terminator for stable expression