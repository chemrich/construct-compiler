construct:
  name: "ProteinS_mitochondrial_targeting"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinS_MTS
        expression: high
        chain:
          - tag: MTS_Cox8a  # Mitochondrial targeting sequence from Cox8a; non-repetitive design
          - linker:
              type: GS_flexible
              repeats: 1
              codon_optimization: synonymous_divergent  # Forces codon divergence from protein body
          - gene:
              id: ProteinS
              source: uniprot
              codon_optimization: synonymous_divergent  # Applies synonymous codon variants to avoid repeats

    - terminator: rrnB_T1
