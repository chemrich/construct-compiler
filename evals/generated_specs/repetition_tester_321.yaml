construct:
  name: "dual_promoter_activator_reporter_operon"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
      # T7lac consensus: TAATACGACTCACTATAG...AGGAGG(RBS)
    
    - cistron:
        label: activator
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: araC
              # AraC is a well-characterized transcriptional regulator
              source: uniprot
    
    - spacer: 25
    
    - promoter: tac
      # tac promoter: TTGACAATTAATCATCCGGCTCGTATAATGTGTGGAA...AGGAGG
      # Entirely different consensus from T7lac, with divergent -35/-10 elements
    
    - cistron:
        label: reporter
        expression: medium
        fused: false
        # Using custom RBS with maximal sequence divergence
        # Standard RBS (AGGAGG) replaced with high-efficiency Kozak variant GAGG
        # This maintains translation efficiency while preventing recombination
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
