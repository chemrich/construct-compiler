construct:
  name: "S_cerevisiae_trienzyme_pathway"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_1
              source: uniprot

    - comment: "2A_peptide_variant_1_P2A"
      spacer: 15

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_2
              source: uniprot

    - comment: "2A_peptide_variant_2_T2A"
      spacer: 15

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_3
              source: uniprot

    - terminator: CYC1
