construct:
  name: "pentameric_binding_domain_codon_optimized"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: pentamer_construct
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: binding_domain_repeat_1_codon_opt_variant_A
              source: custom
          - linker:
              type: short_GS
          - gene:
              id: binding_domain_repeat_2_codon_opt_variant_B
              source: custom
          - linker:
              type: short_GS
          - gene:
              id: binding_domain_repeat_3_codon_opt_variant_C
              source: custom
          - linker:
              type: short_GS
          - gene:
              id: binding_domain_repeat_4_codon_opt_variant_D
              source: custom
          - linker:
              type: short_GS
          - gene:
              id: binding_domain_repeat_5_codon_opt_variant_E
              source: custom

    - terminator: rrnB_T1
