construct:
  name: "tandem_affinity_purification_sfGFP"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - cleavage_site: TEV
          - linker:
              type: short_GS
              repeats: 2
          - tag: Twin-Strep
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - cleavage_site: 3C
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1