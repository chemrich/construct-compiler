construct:
  name: tandem_affinity_purification_ecoli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: target_with_dual_tags
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: Strep-II
          - cleavage_site: 3C
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: your_protein_of_interest
              source: uniprot

    - terminator: rrnB_T1
