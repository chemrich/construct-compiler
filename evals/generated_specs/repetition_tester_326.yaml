construct:
  name: dual_reporter_mammalian_non_homologous
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA
    - spacer: 100
    - promoter: EF1_alpha
    - cistron:
        label: red_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA