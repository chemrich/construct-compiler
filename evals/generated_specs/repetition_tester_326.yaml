construct:
  name: "dual_reporter_mammalian_CMV_EF1a"
  host: HEK293

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40_poly_A

    - promoter: EF1_alpha

    - cistron:
        label: mScarlet_reporter
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: BGH_poly_A
