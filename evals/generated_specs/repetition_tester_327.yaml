construct:
  name: "yeast_orthogonal_3x_sgRNA_array"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SNR52
    - cistron:
        label: sgRNA_ortholog_1
        fused: false
        gene:
          id: SpCas9_sgRNA_scaffold
    - spacer: 30
    - promoter: RPR1
    - cistron:
        label: sgRNA_ortholog_2
        fused: false
        gene:
          id: SaCas9_sgRNA_scaffold
    - spacer: 30
    - promoter: U6
    - cistron:
        label: sgRNA_ortholog_3
        fused: false
        gene:
          id: St1Cas9_sgRNA_scaffold
    - terminator: SUP4