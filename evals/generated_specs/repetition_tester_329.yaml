construct:
  name: "dual_secretion_signal_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: secretion_variant_1
        expression: high
        chain:
          - signal_peptide: IgE  # rat IgE signal peptide - secretion signal
          - gene:
              id: P12345  # placeholder UniProt ID for difficult-to-express protein
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: EF1_alpha

    - cistron:
        label: secretion_variant_2
        expression: high
        chain:
          - signal_peptide: PRLSP  # prolactin signal peptide - structurally distinct
          - gene:
              id: P12345
              source: uniprot

    - terminator: BGH_polyA
