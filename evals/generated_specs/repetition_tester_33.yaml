construct:
  name: "self_assembling_tripartite_complex"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Sub1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sub1_variant_A
              source: uniprot
        rbs: consensus_optimized_v1
        terminator: rrnB_T1

    - spacer: 50

    - cistron:
        label: Sub2
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: sub2_variant_B
              source: uniprot
        rbs: consensus_optimized_v2
        terminator: T7term

    - spacer: 50

    - cistron:
        label: Sub3
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: sub3_variant_C
              source: uniprot
        rbs: consensus_optimized_v3
        terminator: BBa_B0015
