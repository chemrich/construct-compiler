construct:
  name: "multi_domain_protein_three_distinct_linkers"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: multi_domain
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DNA_binding_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: activation_domain
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: dimerization_domain
              source: uniprot

    - terminator: rrnB_T1
