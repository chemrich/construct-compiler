construct:
  name: "yeast_logic_circuit_diverse"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TDH3
    - cistron:
        label: tetR_repressor
        expression: high
        gene:
          id: P03038
          source: uniprot
    - terminator: CYC1_term

    - promoter: PGK1
    - cistron:
        label: lacI_repressor
        expression: high
        gene:
          id: P03023
          source: uniprot
    - terminator: ADH1_term

    - promoter: ENO2
    - cistron:
        label: gal80_repressor
        expression: medium
        gene:
          id: P04387
          source: uniprot
    - terminator: ENO2_term

    - promoter: TEF1
    - cistron:
        label: gal4_activator
        expression: medium
        gene:
          id: P04386
          source: uniprot
    - terminator: PGK1_term

    - promoter: ADH1
    - cistron:
        label: gcn4_activator
        expression: low
        gene:
          id: P03069
          source: uniprot
    - terminator: TPS1_term