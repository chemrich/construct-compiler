construct:
  name: "triple_epitope_tagged_expression_system"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: HA
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Myc
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term