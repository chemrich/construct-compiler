construct:
  name: "solubility_fusion_minimal_repetition"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: solubility_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
