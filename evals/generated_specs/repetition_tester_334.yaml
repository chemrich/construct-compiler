construct:
  name: "dual_enzyme_mammalian_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_1
              source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - gene:
              id: enzyme_2
              source: uniprot

    - terminator: BGH_polyA
