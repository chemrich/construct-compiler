construct:
  name: metabolic_pathway_four_gene_operon
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: gene_A
        expression: high
        rbs: BBa_B0034
        gene:
          id: GENE_A
          source: uniprot

    - spacer: 28

    - cistron:
        label: gene_B
        expression: high
        rbs: BBa_B0030
        fused: false
        gene:
          id: GENE_B
          source: uniprot

    - spacer: 35

    - cistron:
        label: gene_C
        expression: high
        rbs: BBa_B0032
        fused: false
        gene:
          id: GENE_C
          source: uniprot

    - spacer: 42

    - cistron:
        label: gene_D
        expression: high
        rbs: BBa_B0031
        fused: false
        gene:
          id: GENE_D
          source: uniprot

    - terminator: rrnB_T1
