construct:
  name: "AAV_tissue_specific_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pAAV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # Tissue specificity can be achieved via enhancer elements; compiler will use sequence-diverse variants

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 2A
          - gene:
              id: LDLR
              source: uniprot
              # LDLR: low-density lipoprotein receptor, common AAV therapeutic target

    - terminator: polyA
      # Note: Internal poly-A sequences (if used by compiler for safety/regulation) 
      # must employ synonymously diverse DNA sequences to avoid harmful repeats in AAV context
