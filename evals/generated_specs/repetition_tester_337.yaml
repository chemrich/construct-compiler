construct:
  name: yeast_surface_display_Aga2_mCherry
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: display_protein_1
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p_variant_A
              source: uniprot
              # Aga2p N-terminal cell wall anchoring domain (S. cerevisiae)

    - terminator: CYC1
