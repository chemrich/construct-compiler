```yaml
construct:
  name: divergent_two_enzyme_pathway
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: EnzA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0A6F5  # E. coli lacZ (beta-galactosidase) as EnzA
              source: uniprot
    
    - spacer: 127  # Odd number, highly divergent sequence to avoid palindromes
    
    - cistron:
        label: EnzB
        expression: high
        fused: false  # Independent translation with separate RBS
        gene:
          id: P31677  # E. coli galK (galactokinase) as EnzB
          source: uniprot
    
    - terminator: T7term
```