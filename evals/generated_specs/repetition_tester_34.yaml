construct:
  name: divergent_two_enzyme_pathway
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzA
              sequence: MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQAPILSRVGDGTQDNLSGAEKAVQVKVKALPDAQFEVV
              source: uniprot

    - spacer: 47

    - cistron:
        label: linker_EnzB
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - gene:
              id: EnzB
              sequence: MVHLTPEEKS AVTALWGKVN VDEVGGEALG RLLVVYPWTQ RFFESFGDLS TPDAVMGNPK VKAHGKKVLG
              source: uniprot

    - terminator: rrnB_T1
