construct:
  name: "scFv_dual_tag_optimized"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: scFv_with_tags
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II
          - linker:
              sequence: "GGGSSGGGSGGG"
          - gene:
              id: scFv_human
              codon_optimization: true
              optimization_settings:
                avoid_repeats: true
                target_gc: 0.50
                minimize_homopolymer_runs: true
              source: uniprot

    - terminator: rrnB_T1
