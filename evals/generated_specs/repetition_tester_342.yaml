construct:
  name: "yeast_metabolic_pathway_operon_EnzA_EnzB_EnzC"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzA
              source: uniprot
              codon_optimization: S_cerevisiae_rare_codons_set_1

    - spacer: 45

    - cistron:
        label: EnzB
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - cleavage_site: 3C
          - gene:
              id: EnzB
              source: uniprot
              codon_optimization: S_cerevisiae_rare_codons_set_2

    - spacer: 52

    - cistron:
        label: EnzC
        expression: high
        fused: false
        chain:
          - tag: HA
          - cleavage_site: Factor_Xa
          - gene:
              id: EnzC
              source: uniprot
              codon_optimization: S_cerevisiae_rare_codons_set_3

    - terminator: rrnB_T1
