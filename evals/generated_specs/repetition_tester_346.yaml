construct:
  name: "mammalian_tricistronic_IRES_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: resistance_marker
        expression: high
        chain:
          - gene:
              id: PuroR
              source: uniprot

    # IRES1: EMCV optimized variant (encephalomyocarditis virus)
    - spacer: 25

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    # IRES2: FMDV-2A fusion variant (foot-and-mouth disease virus)
    - spacer: 28

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: IL_2
              source: uniprot

    - terminator: rrnB_T1
