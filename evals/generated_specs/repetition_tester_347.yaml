construct:
  name: "yeast_multiplex_sgrna_array"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SNR52
    - cistron:
        label: sgRNA_target_1
        expression: high
        gene:
          id: sgRNA_scaffold_v1
    - terminator: SUP4_term

    - promoter: RPR1
    - cistron:
        label: sgRNA_target_2
        expression: high
        gene:
          id: sgRNA_scaffold_v2
    - terminator: RPR1_term

    - promoter: SCR1
    - cistron:
        label: sgRNA_target_3
        expression: high
        gene:
          id: sgRNA_scaffold_v3
    - terminator: SCR1_term

    - promoter: SUP4
    - cistron:
        label: sgRNA_target_4
        expression: high
        gene:
          id: sgRNA_scaffold_v4
    - terminator: SUP4_term