construct:
  name: "mammalian_secretion_POI_affinity_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_POI
        expression: high
        chain:
          - signal_peptide: IL2_signal  # IL-2 signal peptide for mammalian secretion
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: POI
              source: uniprot  # User must provide UniProt ID or protein sequence via separate specification
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Twin-Strep  # C-terminal affinity tag for purification

    - terminator: rrnB_T1
