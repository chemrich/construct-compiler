construct:
  name: "Gateway_compatible_cloning_vector"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
    # Gateway att sites: attP1 and attP2 are asymmetric recombination sites
    # that will not recombine with each other, only with attB sites from donor vectors
    gateway_cassette: true
    gateway_att_sites:
      - type: attP1
        position: upstream
      - type: attP2
        position: downstream
    # Note: attP1/attP2 are NOT perfect direct repeats; they have different
    # sequences recognized by different recombinases (Cre for attP/attB pairs)
    # This ensures unidirectional cloning and prevents self-recombination
    
  cassette:
    - promoter: lacUV5
      # lacUV5 is suitable for Gateway vectors in E. coli; allows IPTG-inducible control
    
    - cistron:
        label: gateway_destination_cassette
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ccdB
              source: uniprot
              # ccdB is the Gateway marker gene; lethal in most E. coli strains
              # Allows blue-white screening in positive recombinants
    
    - terminator: rrnB_T1
