construct:
  name: "bicistronic_chaperonin_difficult_protein"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: chaperonin
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: groEL
              source: uniprot
              codon_optimization: standard_e_coli

    - spacer: 35

    - cistron:
        label: difficult_protein
        expression: medium
        fused: false
        chain:
          - tag: 8xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_protein
              source: uniprot
              codon_optimization: rare_codon_enriched

    - terminator: rrnB_T1
