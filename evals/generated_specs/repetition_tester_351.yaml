construct:
  name: yeast_tricolor_2A_reporter
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sGFP
              source: fpbase
              optimization: codon_optimized_s_cerevisiae

    - spacer: 25

    - cistron:
        label: 2A_P2A
        expression: high
        chain:
          - linker:
              type: P2A
              repeats: 1

    - cistron:
        label: BFP
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
              optimization: codon_optimized_s_cerevisiae

    - spacer: 25

    - cistron:
        label: 2A_T2A
        expression: high
        chain:
          - linker:
              type: T2A
              repeats: 1

    - cistron:
        label: RFP
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
              optimization: codon_optimized_s_cerevisiae

    - spacer: 25

    - cistron:
        label: 2A_F2A
        expression: high
        chain:
          - linker:
              type: F2A
              repeats: 1

    - terminator: rrnB_T1
