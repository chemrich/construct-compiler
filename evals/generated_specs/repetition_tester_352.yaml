construct:
  name: "insect_NusA_POI_soluble_fusion"
  host: insect
  
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  
  cassette:
    - promoter: p10
    
    - cistron:
        label: NusA_POI_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: NusA
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: POI
              source: custom
              codon_optimize: true
              eliminate_repeats: true
    
    - terminator: SV40_polyA
