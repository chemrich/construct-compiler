construct:
  name: POI_dual_tag_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: POI_with_dual_tags
        expression: high
        chain:
          - gene:
              id: POI
              source: uniprot
              codon_optimization: mammalian_high_expression
          - linker:
              type: custom_GS
              sequence: GGSGGSGGS
          - tag: HA
          - linker:
              type: custom_GS
              sequence: GGAGAGGAGGC
          - tag: myc

    - terminator: rrnB_T1
