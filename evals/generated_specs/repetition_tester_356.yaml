construct:
  name: "mammalian_antibody_heavy_light_dual_promoter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_heavy_chain
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal for secretion
          - gene:
              id: "IGHG1_codon_optimized_mammalian"
              source: uniprot
              codon_optimize: true
              repeat_elimination: true

    - terminator: bGH_polyA

    - spacer: 150  # physical spacer to prevent recombination

    - promoter: EF1_alpha

    - cistron:
        label: antibody_light_chain
        expression: high
        chain:
          - tag: signal_peptide_IgK  # N-terminal signal for secretion
          - gene:
              id: "IGKC_codon_optimized_mammalian"
              source: uniprot
              codon_optimize: true
              repeat_elimination: true

    - terminator: SV40_polyA
