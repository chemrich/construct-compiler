construct:
  name: "bacterial_biosensor_ligand_activated_GFP"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: biosensor_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: LBD_synthetic
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: TranscriptionalActivator_synthetic
              source: uniprot

    - terminator: rrnB_T1

    - promoter: J23100
      # Custom operator sequence upstream for ligand-responsive activation
      # Operator: synthetic, non-homologous DNA to prevent recombination

    - cistron:
        label: reporter
        expression: medium
        gene:
          id: sfGFP
          source: fpbase

    - terminator: T7term
