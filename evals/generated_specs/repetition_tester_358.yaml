construct:
  name: insect_membrane_protein_expression
  host: insect_sf9

  backbone:
    catalog_vector: "pIEX-4"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: membrane_target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: codon_optimized_membrane_protein
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: V5

    - terminator: SV40_poly_A
