construct:
  name: "dual_promoter_cleavable_protein_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: target_protein
              source: uniprot
          - tag: 6xHis
    
    - terminator: rrnB_T1

    - promoter: araBAD
      
    - cistron:
        label: protease
        expression: medium
        fused: false
        chain:
          - gene:
              id: TEV_protease
              source: uniprot
    
    - terminator: BBa_B0015
