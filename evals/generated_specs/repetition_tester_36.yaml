construct:
  name: "lentiviral_vector_GeneG_optimized"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene
    # Note: This is a mammalian expression backbone. For full lentiviral packaging,
    # co-expression of gag, pol, env, and rev from separate plasmids is required.
    # The LTR regions, packaging signal (psi), and internal repeats must be
    # engineered separately using codon-optimization and wobble-base modifications
    # to eliminate homology with the GeneG insert and reduce internal repeat structures.

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneG
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GeneG
              source: uniprot
        # Codon optimization and synonymous modifications should be applied
        # to the GeneG sequence to eliminate internal repeats and homology
        # with flanking LTR/psi sequences during synthesis.

    - terminator: rrnB_T1
