construct:
  name: "lentiviral_GeneG_optimized"
  host: HEK293
  backbone:
    catalog_vector: "pLenti-puro"
  cassette:
    - promoter: CMV
    - cistron:
        label: GeneG_payload
        expression: high # High expression setting triggers synonymous codon optimization to ensure viral integrity and avoid repeats
        gene:
          id: GeneG
    - terminator: bGH_polyA