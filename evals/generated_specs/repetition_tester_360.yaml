construct:
  name: ProteinA_His_Strep_dual_tagged
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: Strep-II
    
    - terminator: rrnB_T1
