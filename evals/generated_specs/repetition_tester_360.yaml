construct:
  name: protein_a_dual_tag_expression
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Strep-II
    - terminator: T7term