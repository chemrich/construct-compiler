construct:
  name: "distinct_dual_expression_cassette"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_b
        expression: medium
        gene:
          id: ProteinB
          source: uniprot
    - terminator: rrnB_T1
    - promoter: tac
    - cistron:
        label: protein_c
        expression: medium
        gene:
          id: ProteinC
          source: uniprot
    - terminator: T7term