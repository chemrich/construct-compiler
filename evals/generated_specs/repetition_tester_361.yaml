construct:
  name: "dual_promoter_proteinBC_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    - cistron:
        label: ProteinB
        expression: high
        gene:
          id: protB
          source: uniprot
    - terminator: rrnB_T1

    - promoter: tac
    - cistron:
        label: ProteinC
        expression: high
        gene:
          id: protC
          source: uniprot
    - terminator: T7term
