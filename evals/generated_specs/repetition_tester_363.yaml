construct:
  name: "yeast_polycistronic_ProteinEFG_2A"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinE
        expression: high
        chain:
          - gene:
              id: ProteinE
              source: uniprot

    - spacer: 25

    - cistron:
        label: 2A_P2A
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProteinF
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinF
              source: uniprot

    - spacer: 25

    - cistron:
        label: 2A_T2A
        expression: high
        fused: false
        gene:
          id: T2A
          source: uniprot

    - spacer: 25

    - cistron:
        label: ProteinG
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinG
              source: uniprot

    - terminator: rrnB_T1
