construct:
  name: ProteinH_GFP_dual_linker
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinH_GFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinH
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 2

    - terminator: rrnB_T1
