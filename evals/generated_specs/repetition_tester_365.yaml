construct:
  name: "dual_reporter_Luciferase_mCherry"
  host: HEK293

  cassette:
    - promoter: CMV

    - cistron:
        label: Luciferase
        expression: high
        chain:
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: BGH_polyA
