    - cistron:
        label: firefly_luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_pA
    - promoter: EF1_alpha
    - cistron:
        label: mcherry_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_pA