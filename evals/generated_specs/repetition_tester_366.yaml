construct:
  name: "periplasmic_his_tev_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: pelB  # Periplasmic secretion signal
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term