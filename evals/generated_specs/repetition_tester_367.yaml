construct:
  name: "dual_sgRNA_CRISPR_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    # pX330 is a standard dual-sgRNA CRISPR/Cas9 vector for mammalian cells

  cassette:
    - promoter: U6
      # First sgRNA with optimized scaffold variant 1

    - cistron:
        label: sgRNA_1
        expression: high
        fused: false
        gene:
          id: sgRNA_scaffold_v1
          # Note: Guide sequence to be cloned separately
          # Scaffold: GGTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAA
          # (mpknot-derived scaffold with optimized secondary structure)
          source: uniprot

    - spacer: 25

    - promoter: U6
      # Second sgRNA with distinct optimized scaffold variant 2

    - cistron:
        label: sgRNA_2
        expression: high
        fused: false
        gene:
          id: sgRNA_scaffold_v2
          # Note: Guide sequence to be cloned separately
          # Scaffold: GGTTTTAGAGCTAGAAATAGCAGGTGAAATAAGGCTAGTCCGTTATCAACTTGAAAA
          # (Modified scaffold with altered internal stem-loop to minimize cross-repeat)
          source: uniprot

    - terminator: rrnB_T1
