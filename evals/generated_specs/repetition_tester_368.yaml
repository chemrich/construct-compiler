construct:
  name: "protein_j_orthogonal_tight_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: Ptet  # Chosen for high orthogonality to Lac/Ara systems and tight regulation to prevent leaky expression of toxic ProteinJ
    - cistron:
        label: target
        expression: high
        gene:
          id: ProteinJ
          source: uniprot
    - terminator: rrnB_T1