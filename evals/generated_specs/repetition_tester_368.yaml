construct:
  name: "ProteinJ_tight_rhamnose_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: rhaPBAD
      # rhaPBAD (L-rhamnose-inducible) uses completely orthogonal operator sequences
      # distinct from lac/ara systems, minimizing cross-talk and cryptic binding

    - cistron:
        label: ProteinJ
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinJ
              source: uniprot

    - terminator: rrnB_T1
