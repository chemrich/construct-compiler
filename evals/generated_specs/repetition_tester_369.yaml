construct:
  name: "ProteinK_fusion_yeast_expression"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinK_fusion
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ProteinK
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - solubility_tag: MBP

    - terminator: CYC1
