construct:
  name: "mammalian_ProteinL_isoforms_triple_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinL_L1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinL_L1
              source: uniprot

    # IRES1: EMCV (Encephalomyocarditis virus) – distinct sequence
    - spacer: 586  # EMCV IRES canonical length

    - cistron:
        label: ProteinL_L2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinL_L2
              source: uniprot

    # IRES2: CrPV (Cricket paralysis virus) – non-homologous to EMCV
    - spacer: 372  # CrPV IRES canonical length

    - cistron:
        label: ProteinL_L3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinL_L3
              source: uniprot

    - terminator: rrnB_T1

  # IMPORTANT: The spacer elements above represent distinct IRES sequences.
  # Spacer 1 (586 bp) = EMCV IRES
  # Spacer 2 (372 bp) = CrPV IRES
  # These are structurally and sequentially non-homologous viral IRES elements
  # that enable cap-independent translation of each downstream cistron.
  # During compilation, replace these canonical spacer lengths with the actual
  # EMCV and CrPV IRES sequences from standard molecular biology repositories.
