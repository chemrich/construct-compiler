construct:
  name: "dual_timer_fusion_no_repeats"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target_N_terminal_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: dTomato
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_domain_1
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: tdTomato
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: target_domain_2
              source: uniprot
          - tag: Strep-II
    
    - terminator: rrnB_T1
