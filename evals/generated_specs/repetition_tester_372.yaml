construct:
  name: "cerevisiae_multimeric_subunits_M_N"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: SubunitM
        expression: high
        chain:
          - gene:
              id: SubunitM
              source: uniprot

    - terminator: CYC1

    - promoter: ADH1

    - cistron:
        label: SubunitN
        expression: high
        chain:
          - gene:
              id: SubunitN
              source: uniprot

    - terminator: PGK1
