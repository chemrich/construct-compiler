construct:
  name: "circuit_breaker_GeneO_dual_lox"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: loxP_upstream
        expression: very_low
        chain:
          - gene:
              id: loxP_site_variant1
              sequence: "ATAACTTCGTATA.ATTATACGTAT.CCTATACGTAT"
              source: custom

    - cistron:
        label: GeneO_target
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: GeneO
              source: uniprot

    - cistron:
        label: lox2272_downstream
        expression: very_low
        fused: false
        chain:
          - gene:
              id: lox2272_site_variant2
              sequence: "ATAACTTCGTATA.ATTATACGCAT.CCTATACGCAT"
              source: custom

    - terminator: rrnB_T1
