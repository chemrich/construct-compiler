construct:
  name: "dual_signal_peptide_periplasmic_secretion"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinP_secretion
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: ProteinP
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ProteinQ_secretion
        expression: high
        fused: false
        chain:
          - signal_peptide: ompA
          - gene:
              id: ProteinQ
              source: uniprot
    
    - terminator: rrnB_T1
