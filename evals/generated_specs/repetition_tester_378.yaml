construct:
  name: "ProteinX_dual_localization_mitochondrial_peroxisomal"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinX_mitochondrial
        expression: high
        chain:
          - tag: MTS  # mitochondrial targeting sequence (N-terminal)
          - gene:
              id: ProteinX
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinX_peroxisomal
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinX
              source: uniprot
          - tag: PTS1  # peroxisomal targeting sequence (C-terminal)

    - terminator: BBa_B0015
