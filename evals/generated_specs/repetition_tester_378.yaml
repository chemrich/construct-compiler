construct:
  name: "protein_x_subcellular_dual_targeting"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: mitochondrial_variant
        expression: medium
        chain:
          - tag: MTS
          - gene:
              id: ProteinX
              source: uniprot
    - spacer: 40
    - cistron:
        label: peroxisomal_variant
        expression: medium
        fused: false
        chain:
          - gene:
              id: ProteinX
              source: uniprot
          - tag: PTS1
    - terminator: bGH_polyA