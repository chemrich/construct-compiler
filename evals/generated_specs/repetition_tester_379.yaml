construct:
  name: "GeneY_triple_mutant_codon_optimized"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GeneY_mutant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GeneY
              source: custom
              description: "Triple point mutant with codon-optimized flanking sequences to maximize sequence diversity and prevent template switching during synthesis"
              mutations:
                - position: 1
                  codon_change: "ATG_to_GTG"
                  flanking_sequence_variant: "variant_A"
                - position: 2
                  codon_change: "GAA_to_GAG"
                  flanking_sequence_variant: "variant_B"
                - position: 3
                  codon_change: "TTC_to_TTT"
                  flanking_sequence_variant: "variant_C"
              codon_optimization: "synonymous_diversity_maximized"

    - terminator: rrnB_T1
