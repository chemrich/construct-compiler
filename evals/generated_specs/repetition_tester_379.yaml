construct:
  name: "gene_y_triple_mutant_recoded"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: GeneY # Optimization: Sequence diversity and diverse synonymous codon usage in flanking regions of the three mutation sites are required to prevent template switching and replication errors.
          source: uniprot
    - terminator: T7term