construct:
  name: yeast_synonymous_high_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: gene_b
        expression: high
        gene:
          id: GeneB
          source: uniprot
    - spacer: 50
    - cistron:
        label: gene_c
        expression: high
        fused: false
        gene:
          id: GeneC
          source: uniprot
    - terminator: CYC1_term