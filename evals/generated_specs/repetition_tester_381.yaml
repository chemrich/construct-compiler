construct:
  name: "dual_GeneB_GeneC_yeast_expression"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GeneB_codon_opt_v1
        expression: high
        chain:
          - gene:
              id: GeneB_yeast_optimized_1
              source: uniprot
              codon_optimization: yeast_high_expression
              sequence_variant: "variant_A"

    - spacer: 30

    - cistron:
        label: GeneC_codon_opt_v2
        expression: high
        fused: false
        chain:
          - gene:
              id: GeneC_yeast_optimized_2
              source: uniprot
              codon_optimization: yeast_high_expression
              sequence_variant: "variant_B"

    - terminator: CYC1
