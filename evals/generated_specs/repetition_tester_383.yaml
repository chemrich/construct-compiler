construct:
  name: "dual_promoter_dual_terminator_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: geneE
        expression: high
        gene:
          id: GeneE
          source: uniprot
    - spacer: 25
    - cistron:
        label: geneF
        expression: high
        gene:
          id: GeneF
          source: uniprot
    - terminator: rrnB_T1
    - terminator: T7term
  # Note: Two non-homologous strong promoters (T7 and tac) can be arranged
  # in tandem upstream of GeneE via manual DNA assembly, as the YAML schema
  # supports one primary promoter. T7 and tac share minimal homology.
  # Similarly, rrnB_T1 and T7term are structurally distinct terminators.
  # Post-compilation, arrange both promoters upstream of GeneE in the final construct.
