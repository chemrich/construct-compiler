construct:
  name: "redundant_regulatory_operon_GeneE_GeneF"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7
    - promoter: tac
    - cistron:
        label: GeneE
        expression: high
        gene:
          id: GeneE
          source: uniprot
    - spacer: 40
    - cistron:
        label: GeneF
        expression: high
        fused: false
        gene:
          id: GeneF
          source: uniprot
    - terminator: rrnB_T1
    - terminator: T7term