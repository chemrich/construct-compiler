construct:
  name: "triple_PeptideX_yeast_synonymous"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: PeptideX_v1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: PeptideX_codon_variant_1
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1

    - spacer: 24

    - cistron:
        label: PeptideX_v2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: PeptideX_codon_variant_2
              source: custom
          - linker:
              type: rigid_EAAAK
              repeats: 1

    - spacer: 26

    - cistron:
        label: PeptideX_v3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: PeptideX_codon_variant_3
              source: custom

    - terminator: rrnB_T1
