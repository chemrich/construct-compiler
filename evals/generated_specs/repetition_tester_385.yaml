construct:
  name: "dual_reporter_GFP_mCherry_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
              codon_optimization: mammalian_minimal_repeats

    - terminator: SV40_polyA

    # Second reporter with distinct Kozak and terminator
    # Using IRES to enable independent translation from same promoter
    - spacer: 25

    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
              codon_optimization: mammalian_minimal_repeats

    - terminator: BGH_polyA
