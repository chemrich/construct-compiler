construct:
  name: "GeneG_LinkerA_TEV_GeneH_LinkerB_3C_CustomTag"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_complex
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - cleavage_site: TEV
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: GeneH
              source: uniprot
          - linker:
              type: short_GS
              repeats: 2
          - cleavage_site: 3C
          - tag: Strep-II

    - terminator: rrnB_T1
