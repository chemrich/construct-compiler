construct:
  name: "dual_GeneL_independent_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: GeneL_unit1
        expression: high
        chain:
          - gene:
              id: GeneL
              source: uniprot
              codon_optimization: "ecoli_variant_1"
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: lacUV5
    
    - cistron:
        label: GeneL_unit2
        expression: high
        chain:
          - gene:
              id: GeneL
              source: uniprot
              codon_optimization: "ecoli_variant_2"
    
    - terminator: BBa_B0015
