construct:
  name: "triexpress_GeneN_GeneO_GeneP_ribozyme_separated"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneN
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneN
              source: uniprot
    
    - ribozyme: hammerhead_type1
      # Classic hammerhead ribozyme (autocatalytic cleavage, different fold mechanism)
    
    - cistron:
        label: GeneO
        expression: high
        fused: false
        # Independent translation with distinct RBS
        chain:
          - tag: 6xHis
          - gene:
              id: GeneO
              source: uniprot
    
    - ribozyme: HDV_ribozyme
      # Hepatitis Delta Virus ribozyme (fundamentally different catalytic mechanism: uses metal ion cofactors)
    
    - cistron:
        label: GeneP
        expression: high
        fused: false
        # Independent translation with distinct RBS
        chain:
          - tag: 6xHis
          - gene:
              id: GeneP
              source: uniprot
    
    - terminator: rrnB_T1
