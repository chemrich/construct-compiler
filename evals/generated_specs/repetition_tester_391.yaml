construct:
  name: "triple_ortholog_expression_mammalian"
  host: HEK293

  cassette:
    - promoter: CMV
    - cistron:
        label: P_human
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GeneP_human_codon_optimized_HEK293
              source: uniprot
              codon_optimization: HEK293_aggressive
    - terminator: bGH_polyA

    - spacer: 30

    - promoter: EF1_alpha
    - cistron:
        label: P_mouse
        expression: high
        chain:
          - tag: HA
          - gene:
              id: GeneP_mouse_codon_optimized_HEK293
              source: uniprot
              codon_optimization: HEK293_aggressive
    - terminator: SV40_polyA

    - spacer: 30

    - promoter: PGK
    - cistron:
        label: P_rat
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GeneP_rat_codon_optimized_HEK293
              source: uniprot
              codon_optimization: HEK293_aggressive
    - terminator: WPRE
