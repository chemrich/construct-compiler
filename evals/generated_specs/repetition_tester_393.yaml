construct:
  name: "GeneR_triple_intron_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneR
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneR
              source: uniprot
              # Three non-homologous introns required:
              # Intron_1: Human beta-globin intron (positions 51-126)
              # Intron_2: Trypanosoma brucei spliced leader intron (positions 201-290)
              # Intron_3: Saccharomyces cerevisiae ACT1 intron (positions 401-480)
              # Exons screened for repeats; no internal repetitive sequences present
              introns:
                - position: 51
                  source: "human_beta_globin"
                  length: 75
                - position: 201
                  source: "trypanosoma_brucei_sl"
                  length: 89
                - position: 401
                  source: "saccharomyces_cerevisiae_act1"
                  length: 79

    - terminator: rrnB_T1
