construct:
  name: "non_homologous_quad_gRNA_array"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gRNA_unit_1
        expression: medium
        gene:
          id: gRNA1_orthogonal_scaffold_A_spacer1
    - spacer: 30 # Non-homologous sequence spacer
    - cistron:
        label: gRNA_unit_2
        expression: medium
        gene:
          id: gRNA2_orthogonal_scaffold_B_spacer2
    - spacer: 30 # Non-homologous sequence spacer
    - cistron:
        label: gRNA_unit_3
        expression: medium
        gene:
          id: gRNA3_orthogonal_scaffold_C_spacer3
    - spacer: 30 # Non-homologous sequence spacer
    - cistron:
        label: gRNA_unit_4
        expression: medium
        gene:
          id: gRNA4_orthogonal_scaffold_D_spacer4
    - terminator: T7term