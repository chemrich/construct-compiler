construct:
  name: GeneS_dual_UTR_dual_Kozak_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneS_variant1
        expression: high
        chain:
          - gene:
              id: GeneS
              source: uniprot
        kozak_variant: gccrccATG  # Strong Kozak (GCC instead of GCC consensus)
        utr_3p:
          - type: ARE_AU_rich
            variant: class_I_canonical

    - spacer: 30

    - cistron:
        label: GeneS_variant2
        expression: medium
        chain:
          - gene:
              id: GeneS
              source: uniprot
        kozak_variant: GCCRCCATG  # Alternative strong Kozak (uppercase variant)
        utr_3p:
          - type: polyA_signal
            variant: AATAAA_downstream_element

    - terminator: polyA_signal
