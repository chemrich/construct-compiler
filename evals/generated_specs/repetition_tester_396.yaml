construct:
  name: "FLAG_GeneT_Strep_Fusion"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_t_target
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: GeneT
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1  # Using a distinct linker type to ensure DNA sequence divergence from the N-terminal linker
          - tag: Strep-II
    - terminator: T7term