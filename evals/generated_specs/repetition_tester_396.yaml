construct:
  name: GeneT_FLAG_Strep_fusion
  host: e_coli_bl21
  backbone:
    catalog_vector: pET-28b(+)
  cassette:
    - promoter: T7lac
    - cistron:
        label: GeneT_tagged
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GeneT
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Strep-II
    - terminator: rrnB_T1
