construct:
  name: "two_component_system_GeneU_GeneV"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: GeneU_sensor_kinase
        expression: high
        gene:
          id: GeneU
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: J23106
    
    - cistron:
        label: GeneV_response_regulator
        expression: high
        gene:
          id: GeneV
          source: uniprot
    
    - terminator: BBa_B0015
