construct:
  name: mammalian_GeneW_GeneX_P2A_cassette_v1
  host: HEK293
  backbone:
    catalog_vector: pTwist CMV
    resistance: ampicillin
  cassette:
  - promoter: CMV
  - cistron:
      label: GeneW
      expression: high
      chain:
      - gene:
          id: GeneW
          source: uniprot
  - cistron:
      label: P2A_linker
      expression: high
      fused: false
      chain:
      - gene:
          id: P2A
          source: uniprot
  - cistron:
      label: GeneX
      expression: high
      fused: false
      chain:
      - gene:
          id: GeneX
          source: uniprot
  - terminator: rrnB_T1
