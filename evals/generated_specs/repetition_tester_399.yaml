construct:
  name: "mammalian_site_specific_integration_GeneY"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: GeneY_integrated
        expression: high
        chain:
          - recombinase_site: loxP
            orientation: forward
          - gene:
              id: GeneY
              source: uniprot
          - recombinase_site: FRT
            orientation: forward

    - terminator: rrnB_T1
