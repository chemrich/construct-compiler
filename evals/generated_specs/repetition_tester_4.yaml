construct:
  name: ProteinX_ProteinY_tandem_fusion
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot
          - cleavage_site: 3C
          - linker:
              type: custom_TPEAK
              repeats: 1
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
