construct:
  name: triple_fluorescent_reporter_non_homologous
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: J23100  # Strong constitutive BioBrick promoter
    - cistron:
        label: reporter1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
          codon_optimization: ecoli_high_gc  # Force high GC codon usage
    - terminator: rrnB_T1

    - promoter: J23106  # Different strong constitutive promoter
    - cistron:
        label: reporter2
        expression: high
        gene:
          id: mScarlet
          source: fpbase
          codon_optimization: ecoli_rare_codons  # Use rare codon variant
    - terminator: BBa_B0015  # Double terminator, different from rrnB_T1

    - promoter: tac  # Third strong promoter option
    - cistron:
        label: reporter3
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
          codon_optimization: ecoli_balanced  # Balanced codon usage
    - terminator: T7term  # T7 terminator, non-homologous to others