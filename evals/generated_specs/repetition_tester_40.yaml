construct:
  name: "non_homologous_triple_reporter_system"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: green_reporter
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 42
    - promoter: J23106
    - cistron:
        label: red_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term
    - spacer: 47
    - promoter: J23119
    - cistron:
        label: blue_reporter
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015