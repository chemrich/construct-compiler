construct:
  name: "triple_reporter_codon_diversity"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: reporter_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
              codon_usage: human

    - terminator: rrnB_T1

    - spacer: 30

    - cistron:
        label: reporter_2
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
              codon_usage: yeast

    - terminator: T7term

    - spacer: 30

    - cistron:
        label: reporter_3
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase
              codon_usage: bacteria

    - terminator: BBa_B0015
