construct:
  name: "five_enzyme_metabolic_pathway_codon_optimized"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: enzyme_1
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: enzyme_1_codon_set_A
              source: uniprot
              note: "codon_optimized_variant_A"

    - spacer: 30

    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - solubility_tag: GST
          - gene:
              id: enzyme_2_codon_set_B
              source: uniprot
              note: "codon_optimized_variant_B"

    - spacer: 30

    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - solubility_tag: SUMO
          - gene:
              id: enzyme_3_codon_set_C
              source: uniprot
              note: "codon_optimized_variant_C"

    - spacer: 30

    - cistron:
        label: enzyme_4
        expression: high
        fused: false
        chain:
          - tag: HA
          - solubility_tag: Trx
          - gene:
              id: enzyme_4_codon_set_D
              source: uniprot
              note: "codon_optimized_variant_D"

    - spacer: 30

    - cistron:
        label: enzyme_5
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - solubility_tag: NusA
          - gene:
              id: enzyme_5_codon_set_E
              source: uniprot
              note: "codon_optimized_variant_E"

    - terminator: rrnB_T1
