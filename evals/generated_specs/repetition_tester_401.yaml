construct:
  name: "HEK293_tricolor_FP_tandem_unique_linkers"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: tricolor_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
              codon_optimization: unique_variant_1
          - linker:
              type: GS_flexible
              sequence: "GGTGGTGGTGGTGGC"
              # Custom unique linker 1: divergent GS-rich sequence
          - gene:
              id: mCherry
              source: fpbase
              codon_optimization: unique_variant_2
          - linker:
              type: GS_flexible
              sequence: "GGCGGTGGCGGTGGT"
              # Custom unique linker 2: distinct permutation
          - gene:
              id: mTagBFP2
              source: fpbase
              codon_optimization: unique_variant_3
          - tag: Strep-II

    - terminator: rrnB_T1
