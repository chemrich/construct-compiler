construct:
  name: "yeast_orthogonal_inducible_expression_system"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2um
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: expression_unit_X
        expression: medium
        fused: false
        gene:
          id: Gene_X
          source: uniprot
    - terminator: CYC1
    - spacer: 30
    - promoter: CUP1
    - cistron:
        label: expression_unit_Y
        expression: medium
        fused: false
        gene:
          id: Gene_Y
          source: uniprot
    - terminator: ADH1
    - spacer: 30
    - promoter: Tet-On
    - cistron:
        label: expression_unit_Z
        expression: medium
        fused: false
        gene:
          id: Gene_Z
          source: uniprot
    - terminator: TEF1