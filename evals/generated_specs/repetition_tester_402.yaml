construct:
  name: three_orthogonal_inducible_promoters_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      comment: "Galactose-inducible; ligand = galactose; orthogonal system 1"

    - cistron:
        label: gene_x
        expression: high
        gene:
          id: GENE_X
          source: uniprot

    - terminator: PGK1_3UTR
      comment: "Distinct 3' UTR: PGK1 polyadenylation signal"

    - spacer: 50

    - promoter: CUP1
      comment: "Copper-inducible; ligand = Cu2+; orthogonal system 2"

    - cistron:
        label: gene_y
        expression: high
        gene:
          id: GENE_Y
          source: uniprot

    - terminator: ADH1_3UTR
      comment: "Distinct 3' UTR: ADH1 polyadenylation signal; prevents recombination with PGK1_3UTR"

    - spacer: 50

    - promoter: MET25
      comment: "Methionine-repressible (inverse induction with Met depletion); ligand = methionine absence; orthogonal system 3"

    - cistron:
        label: gene_z
        expression: high
        gene:
          id: GENE_Z
          source: uniprot

    - terminator: TPI1_3UTR
      comment: "Distinct 3' UTR: TPI1 polyadenylation signal; structurally unrelated to PGK1 and ADH1 terminators"
