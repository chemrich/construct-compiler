construct:
  name: lentiviral_therapeutic_IRES_marker
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # Non-viral constitutive mammalian promoter (distinct from CMV/SV40)

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: VEGFA
              # User must provide or specify actual therapeutic gene ID
              source: uniprot

    # IRES element represented as spacer with annotation
    # Note: Using a synthetic, non-viral IRES (e.g., EMCV variant or synthetic designer IRES)
    # This must be manually inserted as a custom DNA element post-compilation
    - spacer: 50
      # Placeholder for custom synthetic IRES element — not a standard viral sequence

    - cistron:
        label: selectable_marker
        expression: high
        fused: false
        gene:
          id: NEOMYCIN_PHOSPHOTRANSFERASE_CODON_OPTIMIZED
          # Codon-optimized synonymous variant, distinct from wild-type and helper sequences
          source: uniprot

    - terminator: rrnB_T1
