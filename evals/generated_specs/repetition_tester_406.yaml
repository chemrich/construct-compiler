construct:
  name: "lentiviral_therapeutic_EF1a_ADA_IRES_Puro"
  host: HEK293
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Human non-viral constitutive promoter to prevent recombination
    - cistron:
        label: therapeutic_gene
        expression: high
        gene:
          id: ADA
          source: uniprot
    - spacer: 585  # Approximate length for a non-viral IRES-like sequence to facilitate independent translation
    - cistron:
        label: selectable_marker
        expression: low
        fused: false  # Ensures independent translation initiation
        gene:
          id: PAC
          source: uniprot  # Puromycin acetyltransferase, to be codon-optimized synonymously
    - terminator: SV40_pA