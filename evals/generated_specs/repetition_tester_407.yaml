construct:
  name: "four_domain_array_with_distinct_protease_sites"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: four_domain_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Domain1
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: Domain2
              source: uniprot
          - cleavage_site: Factor_Xa
          - gene:
              id: Domain3
              source: uniprot
          - cleavage_site: Thrombin
          - gene:
              id: Domain4
              source: uniprot

    - terminator: rrnB_T1
