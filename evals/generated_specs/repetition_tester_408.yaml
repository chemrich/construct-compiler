construct:
  name: "mammalian_dual_protein_2A_stoichiometric"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: protein_A
              source: uniprot

    - cistron:
        label: 2A_peptide
        expression: high
        fused: false
        chain:
          - linker:
              sequence: "GGSGGS"
          - gene:
              id: T2A
              source: uniprot

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - linker:
              sequence: "SSGSGSS"
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
