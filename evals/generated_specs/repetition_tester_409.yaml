construct:
  name: "quad_gRNA_nonhomologous_array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: gRNA_target_1
        gene:
          id: gRNA_spacer_1_scaffold
    - spacer: 26  # Varied spacer lengths to ensure non-homologous flanking sequences
    - cistron:
        label: gRNA_target_2
        gene:
          id: gRNA_spacer_2_scaffold
    - spacer: 33  # Distinct sequence length to minimize recombination risk
    - cistron:
        label: gRNA_target_3
        gene:
          id: gRNA_spacer_3_scaffold
    - spacer: 41  # Distinct sequence length to minimize recombination risk
    - cistron:
        label: gRNA_target_4
        gene:
          id: gRNA_spacer_4_scaffold
    - terminator: rrnB_T1