construct:
  name: "mammalian_protein_X_soluble"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_X_fusion
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - gene:
              id: protein_X
              source: uniprot

    - terminator: rrnB_T1
