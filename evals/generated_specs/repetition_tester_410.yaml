construct:
  name: "diverged_enhancer_amplification_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: "triple_diverged_enhancer_minimal_P" # Three synonymously diverged enhancer variants with unique non-homologous spacers upstream of a minimal promoter
    - cistron:
        label: reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1