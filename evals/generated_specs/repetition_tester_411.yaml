construct:
  name: "synthetic_three_gene_operon_unique_RBS"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: Gene_Alpha
        expression: high
        gene:
          id: Gene_Alpha
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Gene_Beta
        expression: high
        fused: false
        gene:
          id: Gene_Beta
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Gene_Gamma
        expression: high
        fused: false
        gene:
          id: Gene_Gamma
          source: uniprot
    
    - terminator: rrnB_T1
