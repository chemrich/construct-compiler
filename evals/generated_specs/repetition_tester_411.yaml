construct:
  name: "constitutive_tri_gene_unique_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: J23100
    - cistron:
        label: alpha
        expression: high
        gene:
          id: Gene_Alpha
    - spacer: 30
    - cistron:
        label: beta
        expression: high
        fused: false
        gene:
          id: Gene_Beta
    - spacer: 30
    - cistron:
        label: gamma
        expression: high
        fused: false
        gene:
          id: Gene_Gamma
    - terminator: rrnB_T1