construct:
  name: "yeast_dual_expression_non_homologous"
  host: yeast
  backbone:
    resistance: "URA3_HIS3"
    ori: "2_micron"
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: enzyme_x
        expression: high
        gene:
          id: P12345
          source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TEF1
    - cistron:
        label: enzyme_y
        expression: high
        fused: false
        gene:
          id: P67890
          source: uniprot
    - terminator: ADH1_term