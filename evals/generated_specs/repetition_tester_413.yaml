construct:
  name: "dual_enzyme_yeast_coexpression"
  host: yeast

  backbone:
    resistance: URA3
    ori: CEN6
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Enzyme_X
        expression: high
        gene:
          id: Enzyme_X
          source: uniprot

    - terminator: CYC1

    - spacer: 100

    - promoter: ADH1

    - cistron:
        label: Enzyme_Y
        expression: high
        gene:
          id: Enzyme_Y
          source: uniprot

    - terminator: ADH1_term

    - spacer: 150

    - promoter: TPI1

    - cistron:
        label: selection_marker_LEU2
        expression: high
        gene:
          id: LEU2
          source: uniprot

    - terminator: TEF1

    - spacer: 150

    - promoter: PGK1

    - cistron:
        label: selection_marker_HIS3
        expression: high
        gene:
          id: HIS3
          source: uniprot

    - terminator: SV40
