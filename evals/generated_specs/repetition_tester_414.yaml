construct:
  name: "triple_shRNA_H1_mammalian_knockdown"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: H1
    - cistron:
        label: shRNA_target1
        expression: high
        chain:
          - gene:
              id: shRNA_KRAS_v1
              source: uniprot
    - terminator: rrnB_T1

    - spacer: 85
      # Non-homologous linker sequence 1 (GC-rich, unique)

    - promoter: H1
    - cistron:
        label: shRNA_target2
        expression: high
        chain:
          - gene:
              id: shRNA_TP53_v1
              source: uniprot
    - terminator: BBa_B0015
      # Distinct terminator from rrnB_T1

    - spacer: 92
      # Non-homologous linker sequence 2 (AT-rich, unique)

    - promoter: H1
    - cistron:
        label: shRNA_target3
        expression: high
        chain:
          - gene:
              id: shRNA_PTEN_v1
              source: uniprot
    - terminator: T7term
      # Third unique terminator variant
