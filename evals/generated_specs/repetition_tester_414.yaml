construct:
  name: "triple_shRNA_nonhomologous_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: H1
    - cistron:
        label: shRNA_1
        expression: high
        gene:
          id: "Target_1_shRNA"
    - terminator: polyT_5
    - spacer: 33 # Unique spacer length to minimize homology
    - promoter: H1
    - cistron:
        label: shRNA_2
        expression: high
        gene:
          id: "Target_2_shRNA"
    - terminator: polyT_6 # Distinct terminator sequence length
    - spacer: 51 # Unique spacer length to prevent recombination
    - promoter: H1
    - cistron:
        label: shRNA_3
        expression: high
        gene:
          id: "Target_3_shRNA"
    - terminator: polyT_7 # Distinct terminator sequence length