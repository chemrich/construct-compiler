construct:
  name: "five_enzyme_metabolic_pathway_divergent_codon_optimization"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: E1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: E1_codon_variant_A
              source: custom
              note: "Synonymously codon-optimized variant A for maximum sequence divergence"

    - spacer: 25

    - cistron:
        label: E2
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: E2_codon_variant_B
              source: custom
              note: "Synonymously codon-optimized variant B, non-homologous to E1"

    - spacer: 30

    - cistron:
        label: E3
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: Factor_Xa
          - gene:
              id: E3_codon_variant_C
              source: custom
              note: "Synonymously codon-optimized variant C, non-homologous to E1 and E2"

    - spacer: 28

    - cistron:
        label: E4
        expression: high
        chain:
          - tag: HA
          - cleavage_site: Thrombin
          - gene:
              id: E4_codon_variant_D
              source: custom
              note: "Synonymously codon-optimized variant D, non-homologous to E1, E2, and E3"

    - spacer: 32

    - cistron:
        label: E5
        expression: high
        chain:
          - tag: Twin-Strep
          - cleavage_site: Enterokinase
          - gene:
              id: E5_codon_variant_E
              source: custom
              note: "Synonymously codon-optimized variant E, non-homologous to all other variants"

    - terminator: rrnB_T1
