construct:
  name: "mammalian_TM_protein_dual_protease_cleavage"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: transmembrane_protein
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal (ER targeting)
          - gene:
              id: sfGFP
              source: fpbase
          - cleavage_site: TEV  # First protease site (post-fluorescent protein)
          - gene:
              id: TMD_human_PDGFR  # Generic transmembrane domain reference
              source: uniprot
          - cleavage_site: HRV3C  # Second protease site (post-transmembrane domain, non-homologous to TEV)
          - tag: FLAG  # C-terminal epitope tag

    - terminator: SV40_polyA
