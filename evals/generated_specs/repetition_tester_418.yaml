construct:
  name: "bacterial_two_hybrid_bait_prey_system"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: bait
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: LexA_DNA_binding_domain
              source: uniprot
          - linker:
              sequence: "GGAGGTGGAGGTGGA"
          - gene:
              id: bait_protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: prey
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - linker:
              sequence: "GGATCCGGATCCGGATCC"
          - gene:
              id: VP16_activation_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: prey_protein
              source: uniprot

    - terminator: rrnB_T1
