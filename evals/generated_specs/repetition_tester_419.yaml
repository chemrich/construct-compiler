construct:
  name: "recombination_proof_high_copy_backbone"
  host: e_coli
  backbone:
    # High-copy origin (pUC) with kanamycin resistance, custom optimized for zero homology
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: tac
    - cistron:
        label: stability_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1