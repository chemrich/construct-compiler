construct:
  name: "conditional_degradation_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: degradation_target
        expression: high
        chain:
          - tag: ssrA
          - gene:
              id: mEGFP
              source: fpbase
          - tag: ssrA
    - terminator: rrnB_T1