construct:
  name: conditional_degradation_dual_tag_ecoli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: target_with_degradation
        expression: high
        chain:
          - tag: degron_N_variant1
            # N-terminal degron (first codon-optimized variant for TEV/ssrA recognition)
          - gene:
              id: mEGFP
              source: fpbase
          - tag: degron_C_variant2
            # C-terminal degron (second codon-optimized variant for same protease recognition)

    - terminator: rrnB_T1
