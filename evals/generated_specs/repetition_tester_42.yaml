        chain:
          - tag: ClpXP_ssrA_N  # N-terminal ClpXP recognition sequence (codon-optimized variant 1)
          - gene:
              id: mEGFP
              source: fpbase
          - tag: ClpXP_ssrA_C  # C-terminal ClpXP recognition sequence (codon-optimized variant 2)
    
    - terminator: rrnB_T1
