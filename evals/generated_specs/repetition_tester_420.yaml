construct:
  name: "A_B_C_fusion_distinct_linkers"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: A_B_C_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: proteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: proteinB
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: proteinC
              source: uniprot

    - terminator: rrnB_T1
