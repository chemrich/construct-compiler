construct:
  name: "tandem_peptide_repeats_low_homology"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_repeat_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: custom_peptide_v1
              source: uniprot
              description: "First codon-optimized variant of target peptide"

    - spacer: 35

    - cistron:
        label: peptide_repeat_2
        expression: high
        fused: false
        chain:
          - gene:
              id: custom_peptide_v2
              source: uniprot
              description: "Second synonymous variant (<70% nt identity to v1)"

    - spacer: 35

    - cistron:
        label: peptide_repeat_3
        expression: high
        fused: false
        chain:
          - gene:
              id: custom_peptide_v3
              source: uniprot
              description: "Third synonymous variant (<70% nt identity to v2)"

    - spacer: 35

    - cistron:
        label: peptide_repeat_4
        expression: high
        fused: false
        chain:
          - gene:
              id: custom_peptide_v4
              source: uniprot
              description: "Fourth synonymous variant (<70% nt identity to v3)"

    - spacer: 35

    - cistron:
        label: peptide_repeat_5
        expression: high
        fused: false
        chain:
          - gene:
              id: custom_peptide_v5
              source: uniprot
              description: "Fifth synonymous variant (<70% nt identity to v4)"

    - terminator: rrnB_T1
