construct:
  name: "dual_reporter_tf_responsive_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: reporter_1
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: tac
    - cistron:
        label: reporter_2
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term