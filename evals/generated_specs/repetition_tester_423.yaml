construct:
  name: "dual_TF_responsive_reporter_system"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE3G  # Tet-responsive element, TF-inducible
    - cistron:
        label: primary_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: pGL4.23  # Alternative luciferase-compatible TRE variant, functionally equivalent to TRE3G
    - cistron:
        label: secondary_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015  # Distinct from rrnB_T1
