construct:
  name: "tandem_n_terminal_tag_construct"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: tandem_tagged_protein
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - linker:
              type: short_GS
              repeats: 1
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term