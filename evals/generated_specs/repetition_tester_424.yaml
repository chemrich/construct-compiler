construct:
  name: "dual_tag_proteolytic_cleavage"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
