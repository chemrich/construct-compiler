construct:
  name: "max_diversity_expression_cassette"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: null
              # User must provide their specific gene ID and source (uniprot or custom sequence reference)
              # This ensures the CDS is distinct from UTR/regulatory sequences

    - terminator: rrnB_T1
