construct:
  name: "ncRNA_scaffold_three_distinct_loops"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: ncRNA_scaffold
        expression: high
        chain:
          - gene:
              id: ncRNA_scaffold_three_distinct_loops
              sequence: >
                GGGAGACCGACCGACCGACCGA
                GAATTCTAGAGAATTCTAGA
                GACCGACCGACCGACCGACC
                CTGCTGGAGCTGCTGGAGCTG
                GACCGACCGACCGACCGACCGA
                AATTCTAGAGAATTCTAGAGAA
                GACCGACCGACCGACCGACCGACC

    - terminator: rrnB_T1
