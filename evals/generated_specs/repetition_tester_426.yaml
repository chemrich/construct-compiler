construct:
  name: "ncRNA_scaffold_3x_binding_distinct_loops"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: "scaffold_unit"
        expression: high
        gene:
          id: "MS2_scaffold_3x_identical_sites_distinct_loops"
          # Sequence designed with three identical protein binding sites (e.g. MS2/PP7) 
          # but with non-monotonous, unique intervening loop/linker sequences.
    - terminator: T7term