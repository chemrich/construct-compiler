construct:
  name: "secretory_protein_complex_subunits"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: subunit_A
        expression: high
        chain:
          - signal_peptide: pelB
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P12345
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 30
    
    - promoter: T7lac
    
    - cistron:
        label: subunit_B
        expression: high
        chain:
          - signal_peptide: OmpA
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: P67890
              source: uniprot
    
    - terminator: BBa_B0015
