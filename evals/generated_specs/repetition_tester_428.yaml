construct:
  name: "mEGFP_dual_degron_fusion"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: PEST
          - linker:
              type: short_GS
              repeats: 2
          - tag: Ubiquitin
    - terminator: T7term