construct:
  name: "dual_degradation_tag_protein"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: PEST
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: degron_ubiquitination

    - terminator: rrnB_T1
