construct:
  name: "quad_crRNA_array"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: gRNA_1
        expression: high
        chain:
          - gene:
              id: crRNA_spacer_1_GCTAGCTAGCTAGCTAGCTAGCTAGCTA
              source: custom

    - terminator: rrnB_T1

    - spacer: 25

    - cistron:
        label: gRNA_2
        expression: high
        chain:
          - gene:
              id: crRNA_spacer_2_ATCGATCGATCGATCGATCGATCGAT
              source: custom

    - terminator: T7term

    - spacer: 25

    - cistron:
        label: gRNA_3
        expression: high
        chain:
          - gene:
              id: crRNA_spacer_3_TTAATTAATTAATTAATTAATTAATTAA
              source: custom

    - terminator: BBa_B0015

    - spacer: 25

    - cistron:
        label: gRNA_4
        expression: high
        chain:
          - gene:
              id: crRNA_spacer_4_GGCCGGCCGGCCGGCCGGCCGGCCGGCC
              source: custom

    - terminator: rrnB_T1
