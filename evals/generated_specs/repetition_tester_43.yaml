construct:
  name: "yeast_four_subunit_complex"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: subunit_A
        expression: high
        rbs: AGGAGGU
        gene:
          id: P12345
          source: uniprot

    - terminator: CYC1

    - promoter: ADH1

    - cistron:
        label: subunit_B
        expression: high
        rbs: GAGG
        gene:
          id: P12346
          source: uniprot

    - terminator: PGK1

    - promoter: TEF1

    - cistron:
        label: subunit_C
        expression: high
        rbs: AAGGAGGA
        gene:
          id: P12347
          source: uniprot

    - terminator: TDH3

    - promoter: TPI1

    - cistron:
        label: subunit_D
        expression: high
        rbs: AGGAACU
        gene:
          id: P12348
          source: uniprot

    - terminator: ENO2
