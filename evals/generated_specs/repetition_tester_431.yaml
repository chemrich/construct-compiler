construct:
  name: "tri_protein_2A_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: P1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P1
              source: uniprot

    - cistron:
        label: P2A_P2
        expression: high
        fused: false
        chain:
          - cleavage_site: P2A  # Porcine 2A
          - gene:
              id: P2
              source: uniprot

    - cistron:
        label: T2A_P3
        expression: high
        fused: false
        chain:
          - cleavage_site: T2A  # Thosea asigna 2A (different from P2A)
          - gene:
              id: P3
              source: uniprot

    - terminator: rrnB_T1
