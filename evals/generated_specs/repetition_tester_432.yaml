construct:
  name: "dual_solubility_tag_fusion_diverse_linkers"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: solubility_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - cleavage_site: 3C
          - solubility_tag: SUMO
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - cleavage_site: Factor_Xa
          - gene:
              id: "your_protein_of_interest"
              source: uniprot

    - terminator: rrnB_T1
