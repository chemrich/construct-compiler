construct:
  name: "S_cerevisiae_metabolic_pathway_gradient"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: enzyme_1
        expression: high
        rbs: GCTAGCGAGACCA
        gene:
          id: ADH1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: medium
        rbs: TTAAGACAAGG
        gene:
          id: PGK1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_3
        expression: medium
        rbs: CTGAAGTACA
        gene:
          id: HXK2
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_4
        expression: low
        rbs: GATCTGC
        gene:
          id: GLK1
          source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme_5
        expression: very_low
        rbs: AGCAAC
        gene:
          id: PFK1
          source: uniprot

    - terminator: rrnB_T1
