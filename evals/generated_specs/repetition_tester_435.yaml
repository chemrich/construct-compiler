construct:
  name: "tandem_anchor_surface_display"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: Lpp
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: OmpA
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: T7term