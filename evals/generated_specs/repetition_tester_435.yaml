construct:
  name: "dual_anchor_cell_surface_display"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GPI_anchor_domain
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: TM_anchor_domain
              source: uniprot

    - terminator: rrnB_T1
