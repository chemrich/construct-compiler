construct:
  name: three_stage_transcriptional_cascade
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    # Stage 1: T7 promoter → TetR repressor
    - promoter: T7
    
    - cistron:
        label: stage1_tetr
        expression: high
        gene:
          id: tetR
          source: uniprot
    
    - terminator: rrnB_T1
    
    # Spacer between stages
    - spacer: 50
    
    # Stage 2: tac promoter + operator → LacI repressor
    - promoter: tac
    
    - cistron:
        label: stage2_laci
        expression: high
        gene:
          id: lacI
          source: uniprot
    
    - terminator: BBa_B0015
    
    # Spacer between stages
    - spacer: 50
    
    # Stage 3: araBAD promoter → AraC activator
    - promoter: araBAD
    
    - cistron:
        label: stage3_arac
        expression: medium
        gene:
          id: araC
          source: uniprot
    
    - terminator: T7term
