construct:
  name: "tandem_quad_amp_diversity_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: quad_amp_concatemer
        expression: high
        # Note: Four copies of P49913 are provided in the chain. 
        # The compiler must use synonymous codons for each copy to maximize nucleotide divergence
        # and unique linkers to prevent homologous recombination.
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P49913
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: P49913
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P49913
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: P49913
              source: uniprot
    - terminator: T7term