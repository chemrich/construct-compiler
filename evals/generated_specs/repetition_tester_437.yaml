construct:
  name: "quad_AMP_codon_diverged"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: AMP_quad
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: "AMP_codon1_optimized"
              source: "custom"
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "AMP_codon2_diverged_v1"
              source: "custom"
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "AMP_codon3_diverged_v2"
              source: "custom"
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "AMP_codon4_diverged_v3"
              source: "custom"

    - terminator: rrnB_T1
