construct:
  name: "synthetic_organelle_triple_targeting"
  host: mammalian
  
  backbone:
    catalog_vector: "pTwist CMV"
  
  cassette:
    - promoter: CMV
    
    - cistron:
        label: protein_A_targeted
        expression: high
        chain:
          - tag: "MKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQAPILSRVGDGTQDNLSGAEKAVQ"  # Custom organelle-targeting peptide 1
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: protein_B_targeted
        expression: high
        fused: false
        chain:
          - tag: "MLPGLALLLLAAWTARALEVPTVRPVNYLSTPGSNIEGRAGQDNLSGAEKAVQVKV"  # Custom organelle-targeting peptide 2 (diverged from peptide 1)
          - gene:
              id: mCherry
              source: fpbase
    
    - spacer: 30
    
    - cistron:
        label: protein_C_targeted
        expression: high
        fused: false
        chain:
          - tag: "MSVLSEFQHWENLYTPQGSYNLTQGKQLALLPLSQVFSVSVQQEEKNQEIAQEVT"  # Custom organelle-targeting peptide 3 (distinct from peptides 1 and 2)
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
