construct:
  name: viral_protein_mammalian_codon_optimized_repeat_diversified
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: viral_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: viral_protein_codon_optimized_repeat_diversified
              source: uniprot
              codon_optimization:
                algorithm: mammalian_high_expression
                repeat_diversification: aggressive
                # Synonymous codon variants applied across repeat regions
                # to maximize sequence divergence while maintaining protein identity
                strategy: break_homologous_repeats

    - terminator: rrnB_T1
