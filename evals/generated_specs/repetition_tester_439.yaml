construct:
  name: "diversified_repetitive_viral_protein"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: repetitive_target
        expression: high
        gene:
          id: P03211 # Epstein-Barr nuclear antigen 1 (EBNA1) containing high-frequency GA repeats
          source: uniprot
        # Optimization requirement: Synonymous codon diversification for all repetitive regions to maximize genetic stability
    - terminator: bGH_pA