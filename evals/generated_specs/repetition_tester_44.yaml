construct:
  name: "tandem_affinity_purification_vector"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: Strep-II
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term