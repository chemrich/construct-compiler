construct:
  name: "orthogonal_triple_fluorescent_reporter"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: gfp_unit
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term
    - spacer: 30
    - promoter: tac
    - cistron:
        label: mcherry_unit
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 30
    - promoter: araBAD
    - cistron:
        label: bfp_unit
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015