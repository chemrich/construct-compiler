construct:
  name: "tri_fluorescent_orthogonal_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
    
    - cistron:
        label: gfp_module
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
              codon_opt: ecoli_max_divergent
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: araBAD
    
    - cistron:
        label: cherry_module
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - gene:
              id: mCherry
              source: fpbase
              codon_opt: ecoli_max_divergent
    
    - terminator: BBa_B0015
    
    - spacer: 50
    
    - promoter: lacUV5
    
    - cistron:
        label: bfp_module
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: mTagBFP2
              source: fpbase
              codon_opt: ecoli_max_divergent
    
    - terminator: T7term
