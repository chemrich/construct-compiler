construct:
  name: "tandem_purification_difficult_protein_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_dual_affinity
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II
          - linker:
              sequence: AAAGGG
              comment: "Non-homologous rigid linker (purine-rich, distinct from GS repeats) to prevent internal recombination"
          - gene:
              id: target_protein
              source: uniprot

    - terminator: rrnB_T1
