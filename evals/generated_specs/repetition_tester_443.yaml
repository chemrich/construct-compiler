    - cistron:
        label: enzyme_copy_1
        expression: high
        gene:
          id: P04036
          source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TEF1  # Strong constitutive yeast promoter 2
    - cistron:
        label: enzyme_copy_2
        expression: high
        gene:
          id: P04036
          source: uniprot
    - terminator: ADH1_term
    - spacer: 50
    - promoter: PGK1  # Strong constitutive yeast promoter 3
    - cistron:
        label: enzyme_copy_3
        expression: high
        gene:
          id: P04036
          source: uniprot
    - terminator: ENO2_term