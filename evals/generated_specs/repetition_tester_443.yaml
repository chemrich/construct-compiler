construct:
  name: "Yeast_Enzyme_Triplication_SyntheticCodons"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      cistron:
        label: enzyme_copy1
        expression: high
        gene:
          id: enzyme_v1_codon_optimized
          source: uniprot
      terminator: CYC1

    - spacer: 25

    - promoter: TEF1
      cistron:
        label: enzyme_copy2
        expression: high
        gene:
          id: enzyme_v2_alternative_codons
          source: uniprot
      terminator: ADH1

    - spacer: 25

    - promoter: PGK1
      cistron:
        label: enzyme_copy3
        expression: high
        gene:
          id: enzyme_v3_divergent_codons
          source: uniprot
      terminator: rrnB_T1
