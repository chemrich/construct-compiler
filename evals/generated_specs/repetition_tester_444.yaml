construct:
  name: "multi_domain_fusion_complex_secretion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: multi_domain_fusion
        expression: high
        chain:
          - tag: pelB  # N-terminal secretion signal (Pectate lyase B)
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: lacZ
              source: uniprot  # Beta-galactosidase as enzyme domain
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: MBP  # Maltose binding protein as PPI domain
              source: uniprot
          - linker:
              sequence: "GGSGGSGGS"  # Custom unique linker (distinct from GS_flexible repeats)
          - solubility_tag: SUMO  # SUMO for maximal divergence from MBP

    - terminator: rrnB_T1
