construct:
  name: "Orthogonal_Pol_III_CRISPR_Array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: U6
    - cistron:
        label: "gRNA_unit_1"
        gene:
          id: "sgRNA_target_1"
    - terminator: "U6_term"
    
    - spacer: 40
    
    - promoter: H1
    - cistron:
        label: "gRNA_unit_2"
        gene:
          id: "sgRNA_target_2"
    - terminator: "H1_term"
    
    - spacer: 40
    
    - promoter: 7SK
    - cistron:
        label: "gRNA_unit_3"
        gene:
          id: "sgRNA_target_3"
    - terminator: "7SK_term"

# Note: The user requested a "single transcript" but specified distinct promoters and terminators for each gRNA. 
# In mammalian systems, Pol III promoters (U6, H1, 7SK) initiate independent transcripts. 
# This design utilizes three unique expression cassettes to fulfill the requirement for non-homologous regulatory elements.