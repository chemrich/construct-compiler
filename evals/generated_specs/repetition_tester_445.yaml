construct:
  name: mammalian_CRISPR_gRNA_array_three_units
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: U6
      cistron:
        label: gRNA_unit_1
        expression: high
        chain:
          - gene:
              id: gRNA_scaffold_SpCas9
              sequence: "GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"

    - spacer: 25

    - promoter: H1
      cistron:
        label: gRNA_unit_2
        expression: high
        chain:
          - gene:
              id: gRNA_scaffold_SpCas9
              sequence: "GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"

    - spacer: 25

    - promoter: 7SL
      cistron:
        label: gRNA_unit_3
        expression: high
        chain:
          - gene:
              id: gRNA_scaffold_SpCas9
              sequence: "GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"

    - terminator: rbcL_poly_T
      label: terminator_1

    - spacer: 40

    - terminator: histone_H3_poly_T
      label: terminator_2

    - spacer: 40

    - terminator: polyadenylation_sequence_SV40
      label: terminator_3
