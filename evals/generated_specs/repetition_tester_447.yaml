construct:
  name: "dual_enzyme_orthogonal_inducible"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      label: "cassette_1_T7lac_system"

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69470
              source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD
      label: "cassette_2_araBAD_system"

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - gene:
              id: P00760
              source: uniprot

    - terminator: BBa_B0015
