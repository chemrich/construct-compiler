construct:
  name: "mammalian_fluorescent_timer_red_green"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: timer_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: custom_unique
              sequence: "GGCAGCGGCTCCGGTGGTACGACCCGATGACCTACGTCGAGCTGAAGGACTACGACATCGACAAGATC"
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
