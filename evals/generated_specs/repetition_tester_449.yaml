construct:
  name: "dual_orthogonal_pathway_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1
      label: "inducible_system_1_promoter"

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: ADH1
              source: uniprot

    - terminator: CYC1

    - spacer: 100

    - promoter: MET25
      label: "inducible_system_2_promoter"

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: PDC1
              source: uniprot

    - terminator: ADH1_terminator
