```yaml
construct:
  name: TF_reporter_diversified_binding_sites
  host: HEK293
  
  backbone:
    catalog_vector: "pTwist CMV"
  
  cassette:
    - promoter: 
        type: custom
        elements:
          - binding_sites:
              count: 5
              factor: transcription_factor
              sequences: diversified  # Each of 5 sites uses different synonymous sequence
          - minimal_promoter: TATA_box
    
    - cistron:
        label: reporter
        expression: high
        gene:
          id: firefly_luciferase
          source: uniprot
    
    - terminator: SV40_polyA
```