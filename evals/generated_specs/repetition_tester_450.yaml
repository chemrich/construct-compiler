construct:
  name: "dual_reporter_divergent_e_coli"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: inducible_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1
    - spacer: 35
    - promoter: J23100
    - cistron:
        label: constitutive_control
        expression: high
        chain:
          - tag: 8xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: BBa_B0015
