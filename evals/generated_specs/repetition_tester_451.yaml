construct:
  name: "synthetic_protein_scaffold_dual_enzyme_recruitment"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: scaffold_binding_site_A_variant_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: scaffold_binding_site_B_variant_2
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: scaffold_central_domain
              source: uniprot
          - linker:
              type: short_GS
          - gene:
              id: scaffold_binding_site_C_variant_3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: scaffold_binding_site_D_variant_4
              source: uniprot
          - tag: 8xHis

    - terminator: rrnB_T1
