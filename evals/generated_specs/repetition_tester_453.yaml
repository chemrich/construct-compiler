construct:
  name: "dual_secretion_signal_therapeutic_yeast"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: therapeutic_v1_mating_factor
        expression: high
        chain:
          - secretion_signal: alpha_factor_mating
          - gene:
              id: GCN4
              source: uniprot

    - spacer: 50

    - cistron:
        label: therapeutic_v2_invertase
        expression: high
        chain:
          - secretion_signal: SUC2_invertase
          - gene:
              id: GCN4_codon_optimized_variant_A
              source: uniprot

    - terminator: CYC1_poly_A
