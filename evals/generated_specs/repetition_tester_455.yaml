construct:
  name: "cell_free_three_module_system"
  host: in_vitro
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
      cistron:
        label: module_1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
      terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: SP6
      cistron:
        label: module_2
        expression: high
        gene:
          id: mCherry
          source: fpbase
      terminator: T7term
    
    - spacer: 50
    
    - promoter: T3
      cistron:
        label: module_3
        expression: high
        gene:
          id: mScarlet
          source: fpbase
      terminator: BBa_B0015
