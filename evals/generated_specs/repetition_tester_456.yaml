construct:
  name: "lentiviral_packaging_vector_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist Lenti"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    # 5' LTR (fixed element for viral packaging)
    - promoter: CMV

    - cistron:
        label: packaging_element_psi
        expression: very_low
        # Psi (Ψ) packaging signal - essential, fixed sequence
        gene:
          id: HIV1_Psi
          source: uniprot

    - spacer: 25

    # RRE (Rev Response Element) - essential for RNA export
    - cistron:
        label: packaging_element_rre
        expression: very_low
        gene:
          id: HIV1_RRE
          source: uniprot

    - spacer: 30

    # cPPT/CTS (Central Polypurine Tract / Central Termination Sequence)
    - cistron:
        label: packaging_element_cppt
        expression: very_low
        gene:
          id: HIV1_cPPT
          source: uniprot

    - spacer: 28

    # Transgene expression cassette (example: fluorescent reporter)
    - cistron:
        label: transgene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 32

    # First polyA signal (SV40 variant for redundancy)
    - cistron:
        label: polya_sv40
        expression: very_low
        gene:
          id: SV40_polyA
          source: uniprot

    - spacer: 26

    # Second polyA signal (bGH variant - distinct sequence to prevent recombination)
    - cistron:
        label: polya_bgh
        expression: very_low
        gene:
          id: bGH_polyA
          source: uniprot

    - terminator: rrnB_T1
