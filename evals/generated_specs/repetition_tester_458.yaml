construct:
  name: "toxin_antitoxin_stabilization"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      
    - cistron:
        label: toxin
        expression: medium
        gene:
          id: RelE
          source: uniprot
          codon_optimization: ecoli_high_expression

    - terminator: rrnB_T1

    - promoter: J23106
      
    - cistron:
        label: antitoxin
        expression: medium
        gene:
          id: RelB
          source: uniprot
          codon_optimization: ecoli_standard

    - terminator: BBa_B0015
