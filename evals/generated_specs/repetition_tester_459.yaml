construct:
  name: "directed_evolution_library_yeast"
  host: yeast

  backbone:
    resistance: geneticin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1
      # Constitutive yeast promoter for directed evolution target

    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - gene:
              id: target_enzyme
              source: uniprot
              # Placeholder: user will supply specific enzyme UniProt ID
              # Mutagenesis library will be applied to this gene

    - terminator: CYC1
      # First terminator: CYC1 is a robust yeast terminator

    - spacer: 50
      # Sequence buffer to ensure complete separation between cassettes

    - promoter: TEF1
      # Constitutive TEF1 promoter for selection marker (completely distinct from GAL1)

    - cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: kanMX
              source: uniprot
              # kanMX encodes neomycin phosphotransferase; robust selection marker
              # Distinct from target enzyme to prevent cross-mutagenesis

    - terminator: ADH1
      # Second terminator: ADH1 (completely non-identical to CYC1)
