construct:
  name: triple_target_crispr_array_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: crispr_array
        expression: high
        gene:
          # Custom CRISPR array with varied repeats to minimize repetitive elements
          # Repeat1: GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC
          # Spacer1: GCATACGTGCATACGTGCAT (20bp targeting locus 1)
          # Repeat2: GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCT
          # Spacer2: ATGCTAGCATGCTAGCATGC (20bp targeting locus 2)  
          # Repeat3: GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCC
          # Spacer3: CGTAGCGTAGCGTAGCGTAG (20bp targeting locus 3)
          # Final repeat: GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC
          id: custom_triple_crispr_array
          sequence: 

    - terminator: rrnB_T1