construct:
  name: "CRISPR_array_three_loci_S_cerevisiae"
  host: yeast

  backbone:
    resistance: URA3
    ori: CEN6
    source: addgene

  cassette:
    - promoter: SNR52

    - cistron:
        label: CRISPR_array
        expression: high
        chain:
          - gene:
              id: Cas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - terminator: T7term

    - promoter: U6

    - cistron:
        label: gRNA_array
        expression: high
        chain:
          - gene:
              id: "spacer_1_GCTAGCTAGCTAGCTAGCTAGCTA"
              source: custom
          - gene:
              id: "repeat_variant_1"
              source: custom
          - gene:
              id: "spacer_2_ATGATGATGATGATGATGATGATG"
              source: custom
          - gene:
              id: "repeat_variant_2"
              source: custom
          - gene:
              id: "spacer_3_CGCGCGCGCGCGCGCGCGCGCGCG"
              source: custom
          - gene:
              id: "repeat_variant_3"
              source: custom

    - terminator: rrnB_T1
