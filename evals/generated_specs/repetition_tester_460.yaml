construct:
  name: "multi_tag_recombination_resistant"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Strep-II
          - gene:
              id: target_protein
              source: uniprot
        # Note: The construct_compiler will apply synonymous codon variation
        # to tags and use divergent DNA sequences for the two functionally
        # identical GS linkers to minimize recombination risk. Unique
        # restriction sites (e.g., NheI, XhoI) will be added flanking
        # the entire expression cassette for cloning safety.
    
    - terminator: rrnB_T1
