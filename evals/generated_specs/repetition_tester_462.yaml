construct:
  name: "yeast_triple_enzyme_metabolic_pathway"
  host: yeast

  backbone:
    resistance: G418
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1
      cistron:
        label: EnzymeA
        expression: high
        gene:
          id: EnzymeA
          source: uniprot
          codon_optimization: yeast_max_diversity

    - terminator: CYC1_poly

    - promoter: ADH1
      cistron:
        label: EnzymeB
        expression: high
        gene:
          id: EnzymeB
          source: uniprot
          codon_optimization: yeast_max_diversity

    - terminator: PGK1_poly

    - promoter: TEF1
      cistron:
        label: EnzymeC
        expression: high
        gene:
          id: EnzymeC
          source: uniprot
          codon_optimization: yeast_max_diversity

    - terminator: SV40_poly
