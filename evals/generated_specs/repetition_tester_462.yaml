construct:
  name: "yeast_metabolic_enzyme_pathway_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: enzyme_a
        expression: high
        fused: false
        gene:
          id: EnzymeA
          source: uniprot
    - terminator: CYC1
    - promoter: TEF1
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: EnzymeB
          source: uniprot
    - terminator: ADH1
    - promoter: PGK1
    - cistron:
        label: enzyme_c
        expression: high
        fused: false
        gene:
          id: EnzymeC
          source: uniprot
    - terminator: ENO2