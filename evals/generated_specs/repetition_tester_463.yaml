construct:
  name: "triple_AMP_tandem_codon_optimized"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: AMP_copy1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: AMP_variant_1
              source: custom
              note: "codon-optimized variant 1 for E. coli"

    - spacer: 20
      note: "non-homologous recombination roadblock 1"

    - cistron:
        label: AMP_copy2
        expression: high
        chain:
          - gene:
              id: AMP_variant_2
              source: custom
              note: "synonymously divergent codon-optimized variant 2"

    - spacer: 20
      note: "non-homologous recombination roadblock 2"

    - cistron:
        label: AMP_copy3
        expression: high
        chain:
          - gene:
              id: AMP_variant_3
              source: custom
              note: "synonymously divergent codon-optimized variant 3"

    - terminator: rrnB_T1
