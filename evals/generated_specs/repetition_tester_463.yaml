construct:
  name: "tandem_amp_triplet"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: amp_fusion
        expression: high
        chain:
          - gene:
              id: P11006  # Magainin-2 antimicrobial peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2  # ~30bp unique spacer to prevent recombination
          - gene:
              id: P11006
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 2  # Different linker sequence (non-homologous) to prevent recombination
          - gene:
              id: P11006
              source: uniprot
    - terminator: T7term