construct:
  name: "mammalian_triprotein_2A_polycistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot

    - p2a_peptide: P2A

    - cistron:
        label: ProteinY
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: ProteinY
              source: uniprot
        # Kozak variant: GCCRCCATGG (slightly weaker than consensus GCCRCCAUGG)

    - t2a_peptide: T2A

    - cistron:
        label: ProteinZ
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ProteinZ
              source: uniprot
        # Kozak variant: ACCAUGG (minimal context, moderate strength)

    - f2a_peptide: F2A

    - terminator: rrnB_T1
