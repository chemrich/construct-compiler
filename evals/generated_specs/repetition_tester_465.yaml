construct:
  name: "insect_secreted_protein_dual_tag"
  host: insect_cells

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: OpIE2

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_bip
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: 8xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - terminator: rrnB_T1
