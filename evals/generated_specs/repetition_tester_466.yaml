construct:
  name: "triple_plant_sgRNA_divergent_array"
  host: plant  # Plant host used; substituting for schema-listed hosts per rule 12
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: AtU6-26
    - cistron:
        label: sgRNA_alpha
        gene:
          id: sgRNA_scaffold_v1
    - terminator: poly_T_6_At
    - spacer: 40
    - promoter: GmU6-10
    - cistron:
        label: sgRNA_beta
        gene:
          id: sgRNA_scaffold_v2
    - terminator: poly_T_6_Gm
    - spacer: 40
    - promoter: OsU6
    - cistron:
        label: sgRNA_gamma
        gene:
          id: sgRNA_scaffold_v3
    - terminator: poly_T_6_Os