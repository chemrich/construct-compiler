construct:
  name: "dual_kanamycin_resistance_markers"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      # First kanamycin resistance marker
    - cistron:
        label: kan_resistance_1
        expression: high
        gene:
          id: neo
          source: uniprot

    - terminator: rrnB_T1

    # Spacer between independent resistance cassettes
    - spacer: 50

    - promoter: tac
      # Second kanamycin resistance marker (different promoter and RBS)
    - cistron:
        label: kan_resistance_2
        expression: high
        gene:
          id: nptII
          source: uniprot

    - terminator: BBa_B0015
