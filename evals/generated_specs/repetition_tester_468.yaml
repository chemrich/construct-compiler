construct:
  name: yeast_tandem_nls_mEGFP
  host: yeast
  backbone:
    resistance: kanamycin
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TEF1  # Robust constitutive yeast promoter
    - cistron:
        label: nls_reporter_fusion
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: NLS
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: NLS
          - linker:
              type: short_GS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1  # Standard yeast terminator