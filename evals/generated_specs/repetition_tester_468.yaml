construct:
  name: "yeast_triple_NLS_reporter"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: triple_NLS_reporter
        expression: high
        chain:
          - tag: NLS
            variant: SV40_canonical
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
            variant: SV40_synonymous_v2
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
            variant: bipartite_IBB
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
