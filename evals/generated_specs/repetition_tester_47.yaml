construct:
  name: "multi_site_tev_cleavage_ecoli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_multi_tev
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: custom_multi_tev_target
              source: user_defined
              # Note: This gene must be manually synthesized with three synonymously
              # encoded TEV sites (ENLYFQ-G). Each site should use different codon
              # combinations for the same amino acid sequence while maintaining
              # TEV protease recognition. Example codon variants:
              # Site 1: GAA AAC CTG TAC TTC CAA GG[T/C/A/G]
              # Site 2: GAG AAT TTA TAT TTC CAG GG[T/C/A/G]
              # Site 3: GAA AAC CTG TAC TTC CAG GG[T/C/A/G]
              # All encode ENLYFQ but with maximum sequence divergence.
              # The user should generate the full sequence using optimization tools
              # such as GeneDesigner, Codon Harmonizer, or similar, ensuring each
              # TEV site differs in nucleotide sequence while remaining functional.

    - terminator: rrnB_T1
