construct:
  name: "biosynthetic_pathway_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: GeneA
        expression: high
        chain:
          - gene:
              id: GeneA
              source: uniprot
    - spacer: 22
    - cistron:
        label: GeneB
        expression: medium
        fused: false
        chain:
          - gene:
              id: GeneB
              source: uniprot
    - spacer: 25
    - cistron:
        label: GeneC
        expression: low
        fused: false
        chain:
          - gene:
              id: GeneC
              source: uniprot
    - spacer: 23
    - cistron:
        label: GeneD
        expression: very_low
        fused: false
        chain:
          - gene:
              id: GeneD
              source: uniprot
    - terminator: rrnB_T1
