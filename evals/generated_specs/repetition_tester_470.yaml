construct:
  name: "biosynthetic_pathway_operon_abcd"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_a
        expression: high
        gene:
          id: GeneA
    - spacer: 25
    - cistron:
        label: gene_b
        expression: medium
        fused: false
        gene:
          id: GeneB
    - spacer: 30
    - cistron:
        label: gene_c
        expression: low
        fused: false
        gene:
          id: GeneC
    - spacer: 35
    - cistron:
        label: gene_d
        expression: very_low
        fused: false
        gene:
          id: GeneD
    - terminator: rrnB_T1