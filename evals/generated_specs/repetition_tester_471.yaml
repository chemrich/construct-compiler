construct:
  name: "mammalian_quadruple_IRES_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: copy1
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: IRES1_copy2
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase
        # IRES: EMCV (Encephalomyocarditis virus IRES)

    - spacer: 25

    - cistron:
        label: IRES2_copy3
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase
        # IRES: HCV (Hepatitis C virus IRES)

    - spacer: 25

    - cistron:
        label: IRES3_copy4
        expression: high
        fused: false
        chain:
          - gene:
              id: mEGFP
              source: fpbase
        # IRES: PV (Poliovirus IRES)

    - terminator: rrnB_T1
