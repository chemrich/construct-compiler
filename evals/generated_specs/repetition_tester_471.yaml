construct:
  name: "quad_ires_identical_proteins"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_copy_1_emcv
        fused: false
        ires: EMCV  # Distinct IRES used for each copy to prevent recombination
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 25
    - cistron:
        label: protein_copy_2_ev71
        fused: false
        ires: EV71
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 25
    - cistron:
        label: protein_copy_3_crpv
        fused: false
        ires: CrPV
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 25
    - cistron:
        label: protein_copy_4_rhpv
        fused: false
        ires: RhPV
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA