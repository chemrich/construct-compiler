construct:
  name: "yeast_trivalent_scaffold_fusion"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: multi_domain_assembly
        expression: high
        chain:
          - gene:
              id: SpyCatcher
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: short_GS
              repeats: 4
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1