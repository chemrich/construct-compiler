construct:
  name: "yeast_multi_domain_scaffold"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scaffold_domain1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: P12345
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3

    - cistron:
        label: scaffold_domain2
        expression: high
        fused: false
        chain:
          - linker:
              # Divergent linker: EAAAK-based rigid composition
              type: rigid_EAAAK
              repeats: 4
          - gene:
              id: P12345
              source: uniprot
          - linker:
              # Second divergent linker: short GS motif
              type: short_GS
              repeats: 5

    - cistron:
        label: scaffold_domain3
        expression: high
        fused: false
        chain:
          - linker:
              # Third divergent linker: alternate composition (KST-based custom)
              # Use GS with minimal repeats for sequence divergence
              type: GS_flexible
              repeats: 2
          - gene:
              id: P12345
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
