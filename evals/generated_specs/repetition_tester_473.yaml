construct:
  name: "dual_orthogonal_protease_cleavage_fusion"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: target_protein
              source: uniprot
          - cleavage_site: 3C
        codon_optimization: maximize_divergence  # Force degenerate codon usage at cleavage sites
        
    - terminator: rrnB_T1
