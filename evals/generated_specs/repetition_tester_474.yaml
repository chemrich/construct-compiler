construct:
  name: mammalian_secretion_signal_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: secretion_signal_test
        expression: high
        chain:
          - tag: signal_peptide_SP  # Natural mammalian signal peptide from Ig kappa
          - linker:
              type: GS_flexible
              repeats: 1

    - spacer: 45

    - cistron:
        label: mCherry_ER_targeting
        expression: high
        chain:
          - tag: signal_peptide_IL2  # IL-2 signal peptide, alternative mammalian secretion signal
          - linker:
              type: rigid_EAAAK
              repeats: 1

    - spacer: 60

    - cistron:
        label: reporter_HBD
        expression: high
        chain:
          - tag: signal_peptide_PAH  # Preproarensin signal peptide, third distinct mammalian secretion signal
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mCherry
              source: fpbase

    - terminator: poly_A_BGH
