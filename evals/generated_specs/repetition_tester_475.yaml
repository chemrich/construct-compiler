construct:
  name: "plant_chloroplast_targeting_construct"
  host: algae

  backbone:
    resistance: spectinomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: chloroplast_targeted_protein
        expression: high
        chain:
          - tag: chloroplast_transit_peptide
          - gene:
              id: codon_optimized_plant_protein_diversified
              source: custom
              notes: "Sequences must be synonymously diversified with variable GC content to eliminate long identical DNA repeats. Apply wobble position randomization and alternative codon usage patterns throughout the ORF."

    - terminator: rrnB_T1
