construct:
  name: "divergent_dual_ori_low_copy_system"
  host: e_coli
  backbone:
    # Primary low-copy origin SC101 is used. The schema supports only one origin in the backbone; 
    # the second required pMB1 variant would be treated as an additional modular component.
    resistance: kanamycin
    ori: SC101
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: "secondary_marker"
        expression: medium
        gene:
          id: "cat"
          source: uniprot
    - terminator: BBa_B0015