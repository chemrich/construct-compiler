construct:
  name: "divergent_mammalian_hr_cassette"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV  # Viral promoter used to minimize homology with endogenous mammalian sequences
    - cistron:
        label: divergent_reporter
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase  # Lancelet-derived fluorescent protein is maximally divergent from mammalian proteins
    - terminator: bGH_polyA  # Bovine growth hormone poly-A signal used to avoid human genomic sequences