construct:
  name: "triple_polIII_shRNA_array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_target_1
        gene:
          id: shRNA_luciferase
    - terminator: PolyT_6
    - spacer: 40
    - promoter: H1
    - cistron:
        label: shRNA_target_2
        gene:
          id: shRNA_GFP
    - terminator: PolyT_7
    - spacer: 40
    - promoter: 7SK
    - cistron:
        label: shRNA_target_3
        gene:
          id: shRNA_LaminAC
    - terminator: PolyT_8