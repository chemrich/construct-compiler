```yaml
construct:
  name: quintuple_ribozyme_unique_linkers
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ribozyme_array
        expression: high
        chain:
          - gene:
              id: hammerhead_ribozyme
              source: uniprot
          - linker:
              type: custom
              sequence: GGAGGCGGAGGC  # GG-rich flexible
          - gene:
              id: hammerhead_ribozyme
              source: uniprot
          - linker:
              type: custom
              sequence: AACAACAACAAC  # polyasparagine coding
          - gene:
              id: hammerhead_ribozyme
              source: uniprot
          - linker:
              type: custom
              sequence: CCACCGCCACCT  # proline-rich rigid
          - gene:
              id: hammerhead_ribozyme
              source: uniprot
          - linker:
              type: custom
              sequence: TCTAAGTCTAAG  # serine-lysine alternating
          - gene:
              id: hammerhead_ribozyme
              source: uniprot

    - terminator: BGH_polyA
```