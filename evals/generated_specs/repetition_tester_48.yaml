construct:
  name: "mammalian_5x_ribozyme_array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ribozyme_unit_1
        expression: high
        gene:
          id: hammerhead_ribozyme
    - spacer: 31  # Varied spacer lengths ensure unique, non-homologous linkers
    - cistron:
        label: ribozyme_unit_2
        expression: high
        gene:
          id: hammerhead_ribozyme
    - spacer: 37
    - cistron:
        label: ribozyme_unit_3
        expression: high
        gene:
          id: hammerhead_ribozyme
    - spacer: 43
    - cistron:
        label: ribozyme_unit_4
        expression: high
        gene:
          id: hammerhead_ribozyme
    - spacer: 49
    - cistron:
        label: ribozyme_unit_5
        expression: high
        gene:
          id: hammerhead_ribozyme
    - terminator: SV40_pA  # Strong mammalian terminator appropriate for Pol II transcripts