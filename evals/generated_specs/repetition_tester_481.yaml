construct:
  name: mammalian_tri_FP_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: mCherry
        expression: high
        chain:
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: BBa_B0015

    - promoter: U6

    - cistron:
        label: mTagBFP2
        expression: high
        chain:
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: T7term
