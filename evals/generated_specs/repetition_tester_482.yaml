construct:
  name: "yeast_Catalase_Beta_His_TEV_Strep"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Catalase_Beta_tagged
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: custom
              sequence: GGGSGGS
          - cleavage_site: TEV
          - linker:
              type: custom
              sequence: AAPVAT
          - gene:
              id: Catalase_Beta
              source: uniprot
          - linker:
              type: custom
              sequence: EAAAKEF
          - tag: Strep-II

    - terminator: rrnB_T1
