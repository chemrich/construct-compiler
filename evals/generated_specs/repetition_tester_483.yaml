construct:
  name: "three_enzyme_pathway_Enz_A_B_C"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac
      rbs: RBS1
      cistron:
        label: Enz_A
        expression: high
        gene:
          id: Enz_A
          source: uniprot

    - terminator: rrnB_T1

    - promoter: tac
      rbs: RBS2
      cistron:
        label: Enz_B
        expression: high
        gene:
          id: Enz_B
          source: uniprot

    - terminator: T7term

    - promoter: araBAD
      rbs: RBS3
      cistron:
        label: Enz_C
        expression: high
        gene:
          id: Enz_C
          source: uniprot

    - terminator: BBa_B0015
