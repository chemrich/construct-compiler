construct:
  name: "dual_inducible_gene_red_gene_blue"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR_promoter
      operator: tetO
      repressor_gene: tetR
      expression: high
      chain:
        - gene:
            id: Gene_Red
            source: uniprot

    - terminator: rrnB_T1

    - spacer: 100

    - promoter: araBAD
      expression: high
      chain:
        - gene:
            id: Gene_Blue
            source: uniprot

    - terminator: rrnB_T1
