construct:
  name: Chimeric_P_yeast_multi_tag
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Chimeric_P_multi_tagged
        expression: high
        chain:
          - tag: 8xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: Strep-II
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - gene:
              id: Chimeric_P
              source: uniprot
          - linker:
              type: SGSG
              repeats: 2
          - tag: FLAG

    - terminator: CYC1
