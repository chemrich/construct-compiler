construct:
  name: "Reporter_Green_triple_expression_levels"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Reporter_Green_high
        expression: high
        chain:
          - gene:
              id: Reporter_Green
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: lacUV5

    - cistron:
        label: Reporter_Green_medium
        expression: medium
        chain:
          - gene:
              id: Reporter_Green
              source: uniprot

    - terminator: BBa_B0015

    - spacer: 30

    - promoter: araBAD

    - cistron:
        label: Reporter_Green_low
        expression: low
        chain:
          - gene:
              id: Reporter_Green
              source: uniprot

    - terminator: T7term
