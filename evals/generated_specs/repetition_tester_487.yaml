construct:
  name: "three_level_reporter_expression_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100 # High strength Anderson promoter
    - cistron:
        label: high_expression_mEGFP
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1

    - spacer: 40

    - promoter: J23106 # Medium strength Anderson promoter
    - cistron:
        label: medium_expression_mEGFP
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term

    - spacer: 40

    - promoter: J23114 # Low strength Anderson promoter
    - cistron:
        label: low_expression_mEGFP
        expression: low
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015