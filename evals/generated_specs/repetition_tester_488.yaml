construct:
  name: chimeric_three_domain_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: chimeric_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: Domain_X
              source: uniprot
              codon_optimization: maximize_divergence_set_1
          - linker:
              type: rigid_EAAAK
              sequence: EAAAKEAAAKEAAAK
          - gene:
              id: Domain_Y
              source: uniprot
              codon_optimization: maximize_divergence_set_2
          - linker:
              type: GS_flexible
              sequence: GGSGGSGGSGGSGGS
          - gene:
              id: Domain_Z
              source: uniprot
              codon_optimization: maximize_divergence_set_3

    - terminator: rrnB_T1
