construct:
  name: "e_coli_four_gene_operon_unique_spacers"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: gene1
        expression: high
        chain:
          - gene:
              id: gene1
              source: uniprot
        rbs: "AGGAGGA"
    
    - spacer: 35
    
    - cistron:
        label: gene2
        expression: high
        fused: false
        chain:
          - gene:
              id: gene2
              source: uniprot
        rbs: "GAGGAGG"
    
    - spacer: 42
    
    - cistron:
        label: gene3
        expression: high
        fused: false
        chain:
          - gene:
              id: gene3
              source: uniprot
        rbs: "AGGAGGT"
    
    - spacer: 38
    
    - cistron:
        label: gene4
        expression: high
        fused: false
        chain:
          - gene:
              id: gene4
              source: uniprot
        rbs: "TAGGAGG"
    
    - terminator: rrnB_T1
