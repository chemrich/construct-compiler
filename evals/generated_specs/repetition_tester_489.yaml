construct:
  name: "non_homologous_four_gene_operon"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gene_1
        expression: medium
        fused: false
        gene:
          id: gene1
    - spacer: 32
    - cistron:
        label: gene_2
        expression: medium
        fused: false
        gene:
          id: gene2
    - spacer: 38
    - cistron:
        label: gene_3
        expression: medium
        fused: false
        gene:
          id: gene3
    - spacer: 44
    - cistron:
        label: gene_4
        expression: medium
        fused: false
        gene:
          id: gene4
    - terminator: T7term