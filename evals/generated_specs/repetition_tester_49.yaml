construct:
  name: synthetic_operon_three_enzymes
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: aroA
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 35
    
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: trpE
              source: uniprot
    
    - terminator: BBa_B0015
    
    - spacer: 35
    
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: dapA
              source: uniprot
    
    - terminator: T7term
