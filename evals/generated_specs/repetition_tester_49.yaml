construct:
  name: "synthetic_metabolic_operon"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    # To satisfy the requirement for unique terminators between genes while maintaining 
    # inducible control, this design uses three independent transcriptional units 
    # (gene clusters) instead of a single polycistronic operon, as a single operon 
    # would be terminated by the first internal terminator.
    - promoter: araBAD
    - cistron:
        label: gapA_enzyme
        expression: high
        gene:
          id: P0A9B2
          source: uniprot
    - terminator: rrnB_T1
    - spacer: 45
    - promoter: araBAD
    - cistron:
        label: pgk_enzyme
        expression: high
        gene:
          id: P0A7B1
          source: uniprot
    - terminator: T7term
    - spacer: 52
    - promoter: araBAD
    - cistron:
        label: eno_enzyme
        expression: high
        gene:
          id: P0A6P1
          source: uniprot
    - terminator: BBa_B0015