construct:
  name: Secretase_Epsilon_yeast_secretion
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal yeast secretion signal
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: Secretase_Epsilon
              source: uniprot

    - terminator: CYC1
