construct:
  name: "dual_reporter_nuclear_cytoplasmic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: nuclear_gfp
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: SV40_poly_A

    - spacer: 100

    - promoter: EF1_alpha

    - cistron:
        label: cytoplasmic_mcherry
        expression: high
        chain:
          - tag: NES
          - gene:
              id: mCherry
              source: fpbase

    - terminator: BGH_poly_A
