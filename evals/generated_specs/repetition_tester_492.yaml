construct:
  name: "triple_gRNA_array_mammalian_CRISPR"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      cistron:
        label: gRNA1
        expression: high
        chain:
          - gene:
              id: gRNA1_U6_variant1
              source: custom
        # Note: gRNA1 scaffold uses canonical sgRNA scaffold sequence

    - spacer: 25

    - promoter: H1
      cistron:
        label: gRNA2
        expression: high
        chain:
          - gene:
              id: gRNA2_H1_variant2
              source: custom
        # Note: gRNA2 scaffold uses synonymous variant of sgRNA scaffold to prevent recombination

    - spacer: 25

    - promoter: U6alt
      cistron:
        label: gRNA3
        expression: high
        chain:
          - gene:
              id: gRNA3_U6alt_variant3
              source: custom
        # Note: gRNA3 scaffold uses highly diversified scaffold sequence distinct from gRNA1 and gRNA2

    - terminator: rrnB_T1
