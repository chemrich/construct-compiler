construct:
  name: "mammalian_multiplex_gRNA_array"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: U6
    - cistron:
        label: gRNA_target_1
        expression: high
        gene:
          id: sgRNA_scaffold_v1
    - spacer: 35
    - promoter: H1
    - cistron:
        label: gRNA_target_2
        expression: high
        gene:
          id: sgRNA_scaffold_v2_diversified
    - spacer: 35
    - promoter: 7SK
    - cistron:
        label: gRNA_target_3
        expression: high
        gene:
          id: sgRNA_scaffold_v3_diversified
    - terminator: PolyT