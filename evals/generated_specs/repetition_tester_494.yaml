construct:
  name: synthetic_transcription_factor_dual_LBD_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: synthetic_TF
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LBD1_Arabidopsis_NR5A1_homolog
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 3
          - gene:
              id: LBD2_Drosophila_EcR_homolog
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: DBD_synthetic_zinc_finger
              source: uniprot

    - terminator: rrnB_T1
