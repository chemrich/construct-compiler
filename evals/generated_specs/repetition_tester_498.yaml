construct:
  name: "S_cerevisiae_triepitope_surface_display_vaccine"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_scaffold
        expression: high
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: AGA1_display_domain
              source: uniprot

    - spacer: 24

    - cistron:
        label: epitope_1
        expression: high
        fused: false
        chain:
          - linker:
              type: custom_linker_APRGLGAQKQ
          - gene:
              id: epitope_pathogen_A
              source: uniprot
              codon_optimization: divergent_set_1

    - spacer: 22

    - cistron:
        label: epitope_2
        expression: high
        fused: false
        chain:
          - linker:
              type: custom_linker_DGSGSETSP
          - gene:
              id: epitope_pathogen_B
              source: uniprot
              codon_optimization: divergent_set_2

    - spacer: 26

    - cistron:
        label: epitope_3
        expression: high
        fused: false
        chain:
          - linker:
              type: custom_linker_KSSPGSKVS
          - gene:
              id: epitope_pathogen_C
              source: uniprot
              codon_optimization: divergent_set_3

    - terminator: CYC1_poly_A
