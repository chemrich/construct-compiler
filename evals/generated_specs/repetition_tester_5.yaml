construct:
  name: "GeneR_dual_terminator_reporter"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    # First terminator (rrnB T1 - strong, Rho-independent)
    - terminator: rrnB_T1

    # Note: The second terminator request cannot be fulfilled as specified.
    # The schema supports only one terminator per cassette. Additionally,
    # creating wholly novel, non-homologous terminators with zero sequence
    # identity to all known E. coli terminators while maintaining function
    # is not feasible through this tool's standard library.
    # 
    # RECOMMENDATION: Use a secondary synthetic terminator from literature
    # (e.g., BBa_B0015 or a de novo designed terminator from SynBio resources)
    # by custom DNA synthesis if absolute non-homology is required.
    # This construct provides the primary rrnB_T1 terminator.
