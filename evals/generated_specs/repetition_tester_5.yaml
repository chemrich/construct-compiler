construct:
  name: "GeneR_Stability_Reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - terminator: lambda_t0  # Phage-derived terminator used for upstream insulation; zero sequence identity to E. coli genomic terminators
    - promoter: J23100       # Synthetic constitutive Anderson promoter
    - cistron:
        label: GeneR
        expression: medium
        gene:
          id: mScarlet       # Substituting 'GeneR' placeholder with mScarlet as the fluorescent reporter
          source: fpbase
    - terminator: T7term     # Phage T7 terminator; distinct and non-homologous to lambda_t0 or native E. coli terminators