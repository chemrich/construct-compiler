```yaml
construct:
  name: GeneR_dual_terminator_reporter
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # synthetic constitutive promoter

    - cistron:
        label: GeneR_reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1  # first terminator

    - terminator: T7term   # second terminator with different sequence/structure
```