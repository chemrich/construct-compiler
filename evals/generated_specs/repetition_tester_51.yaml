construct:
  name: GPCR_Galpha_coexpression_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: GPCR
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P07550
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: EF1_alpha

    - cistron:
        label: Galpha
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: P04637
              source: uniprot

    - terminator: bGH_polyA
