construct:
  name: "hexameric_AMP_polycistronic_unique_linkers"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: AMP_poly_fusion
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: custom
              sequence: "GGSGGSGGS"
          - gene:
              id: AMP_copy_1
              source: custom
          - linker:
              type: custom
              sequence: "GGTGGTGGT"
          - gene:
              id: AMP_copy_2
              source: custom
          - linker:
              type: custom
              sequence: "GGATGGATGG"
          - gene:
              id: AMP_copy_3
              source: custom
          - linker:
              type: custom
              sequence: "GGAGGGAGG"
          - gene:
              id: AMP_copy_4
              source: custom
          - linker:
              type: custom
              sequence: "GGTGATGGT"
          - gene:
              id: AMP_copy_5
              source: custom
          - linker:
              type: custom
              sequence: "GGAGATGGA"
          - gene:
              id: AMP_copy_6
              source: custom
    
    - terminator: rrnB_T1
