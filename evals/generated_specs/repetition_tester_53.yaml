construct:
  name: "phage_display_library_vector"
  host: e_coli_bl21

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: display_fusion
        expression: high
        chain:
          - tag: signal_peptide_pelB
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: target_domain
              source: uniprot
              # User must supply actual UniProt ID or gene sequence
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: g3p
              source: uniprot
              # g3p = phage M13 coat protein (P8); UniProt P69541 standard

    - terminator: rrnB_T1
