construct:
  name: "NLS_NES_dual_localization_signal_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: dual_localization
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: EGFP
              source: fpbase
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: NES
          - cleavage_site: 3C

    - terminator: rrnB_T1
