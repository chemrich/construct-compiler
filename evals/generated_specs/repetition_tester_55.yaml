construct:
  name: "dual_rnat_divergent_expression_system"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    # The 5' UTR of this cistron is designed to contain two functionally equivalent 
    # but sequence-divergent RNA thermometers (RNATs) in tandem. 
    # The DNA sequences are optimized for maximum divergence to prevent 
    # homologous recombination while maintaining identical thermal response profiles.
    - cistron:
        label: temperature_regulated_reporter
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term