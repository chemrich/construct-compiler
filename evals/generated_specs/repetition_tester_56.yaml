construct:
  name: "yeast_multitagged_protein_complex"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 8xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - tag: Strep-II
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: MFalpha1
              source: uniprot

    - terminator: rrnB_T1
