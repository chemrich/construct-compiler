construct:
  name: yeast_complex_tagged_protein
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: FLAG
          - linker:
              type: rigid_EAAAK
              repeats: 2
          - tag: Strep-II
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1