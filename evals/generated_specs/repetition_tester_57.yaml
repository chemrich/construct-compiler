construct:
  name: "trimerized_bioactive_peptide_2A_polyprotein"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: polyprotein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: bioactive_peptide_v1
              source: custom
          - cleavage_site: P2A
          - gene:
              id: bioactive_peptide_v2
              source: custom
          - cleavage_site: T2A
          - gene:
              id: bioactive_peptide_v3
              source: custom

    - terminator: rrnB_T1
