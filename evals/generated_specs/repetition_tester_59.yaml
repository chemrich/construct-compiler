construct:
  name: "synthetic_codon_optimized_recombination_resistant"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: synthetic_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: synthetic_codon_optimized
              source: custom
              note: "Entire coding sequence subjected to maximal synonymous codon substitution for divergence; identical protein product but minimized sequence homology to prevent recombination"
    
    - terminator: rrnB_T1
