construct:
  name: "orthogonal_tandem_coexpression_geneA_geneB"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: expression_unit_a
        expression: high
        gene:
          id: GeneA
          source: uniprot
    - terminator: T7term
    - promoter: tac  # Distinct promoter to prevent recombination
    - cistron:
        label: expression_unit_b
        expression: medium  # Different expression level to ensure non-identical RBS
        gene:
          id: GeneB
          source: uniprot
    - terminator: rrnB_T1  # Distinct terminator to prevent homology