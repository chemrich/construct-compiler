construct:
  name: "ProteinX_ProteinY_ProteinZ_triple_fusion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: triple_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              type: custom_sequence
              sequence: "APNPEDPNPE"
          - gene:
              id: ProteinY
              source: uniprot
          - linker:
              type: custom_sequence
              sequence: "GKPPKDKSRG"
          - gene:
              id: ProteinZ
              source: uniprot
          - solubility_tag: MBP

    - terminator: rrnB_T1
