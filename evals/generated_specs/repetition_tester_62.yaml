construct:
  name: "yeast_tricistronic_GeneA_GeneB_GeneC"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneA
              source: uniprot

    # 2A peptide variant 1 (P2A - porcine teschovirus)
    - p2a_variant: P2A

    - cistron:
        label: GeneB
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GeneB
              source: uniprot

    # 2A peptide variant 2 (T2A - thosea asigna virus)
    - p2a_variant: T2A

    - cistron:
        label: GeneC
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GeneC
              source: uniprot

    - terminator: rrnB_T1
