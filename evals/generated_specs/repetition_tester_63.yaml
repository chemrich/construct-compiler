construct:
  name: "dual_pathway_plant_monitor"
  host: algae
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
      # Plant-optimized constitutive promoter variant
    
    - cistron:
        label: pathway_A_reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
              codon_usage: mammalian
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: araBAD
      # Distinct inducible promoter for second pathway
    
    - cistron:
        label: pathway_B_reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase
              codon_usage: yeast
    
    - terminator: BBa_B0015
