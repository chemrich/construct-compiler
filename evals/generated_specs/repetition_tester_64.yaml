construct:
  name: "protein_a_expression_pbr322_kan"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: ProteinA
          source: uniprot
    - terminator: T7term

# To fulfill the requirement for two co-existing plasmids with no similarity, 
# this construct (Plasmid 1) uses a pBR322 origin and Kanamycin resistance. 
# The second construct (Plasmid 2) must be designed using a p15A origin, 
# Chloramphenicol resistance, and a non-homologous promoter like 'araBAD' 
# to ensure stability and independent regulation.