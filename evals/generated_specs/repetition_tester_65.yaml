construct:
  name: "dual_inducible_mammalian_GeneX_GeneY"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE_tight
      comment: "Tet-On inducible promoter for GeneX (requires rtTA transactivator)"

    - cistron:
        label: GeneX
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: GeneX
              source: uniprot

    - terminator: SV40_poly_A

    - spacer: 150
      comment: "Spacer to prevent 3' UTR interference"

    - promoter: EcR_VgEcR
      comment: "Ecdysone-inducible promoter for GeneY (requires EcR/RXR + ecdysone analogue)"

    - cistron:
        label: GeneY
        expression: high
        chain:
          - tag: HA
          - gene:
              id: GeneY
              source: uniprot

    - terminator: WPRE
