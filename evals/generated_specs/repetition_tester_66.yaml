construct:
  name: ProA_SubB_coexpression
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: SubB
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: SubB
              source: uniprot

    - spacer: 25

    - cistron:
        label: ProA
        expression: high
        fused: false
        chain:
          - tag: Twin-Strep
          - gene:
              id: ProA
              source: uniprot
          - solubility_tag: GST

    - terminator: rrnB_T1
