construct:
  name: "GeneZ_Yeast_Expression_Diversity_Library"
  host: yeast
  backbone:
    catalog_vector: "pRS426"
  cassette:
    - promoter: TDH3  # Unique constitutive yeast promoter 1 (high)
    - cistron:
        label: GeneZ_variant_1
        expression: high
        fused: false  # S. cerevisiae translation initiation request; distinct UTR/RBS substituted by promoter choice and fused:false
        gene:
          id: GeneZ
          source: uniprot
    - terminator: CYC1
    - spacer: 30
    - promoter: TEF1  # Unique constitutive yeast promoter 2 (high)
    - cistron:
        label: GeneZ_variant_2
        expression: high
        fused: false
        gene:
          id: GeneZ
          source: uniprot
    - terminator: PRM1
    - spacer: 30
    - promoter: PGK1  # Unique constitutive yeast promoter 3 (medium-high)
    - cistron:
        label: GeneZ_variant_3
        expression: medium
        fused: false
        gene:
          id: GeneZ
          source: uniprot
    - terminator: TDH1
    - spacer: 30
    - promoter: ADH1  # Unique constitutive yeast promoter 4 (medium)
    - cistron:
        label: GeneZ_variant_4
        expression: medium
        fused: false
        gene:
          id: GeneZ
          source: uniprot
    - terminator: IDP1
    - spacer: 30
    - promoter: ENO2  # Unique constitutive yeast promoter 5 (low-medium)
    - cistron:
        label: GeneZ_variant_5
        expression: low
        fused: false
        gene:
          id: GeneZ
          source: uniprot
    - terminator: RPL18B  # Unique terminators utilized to prevent construct recombination