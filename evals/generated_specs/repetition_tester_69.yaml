construct:
  name: "polycistronic_gRNA_array_3targets_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: EF1_alpha
      # Strong, constitutive mammalian promoter; distinct from CMV in backbone

    - cistron:
        label: gRNA_target1
        expression: high
        chain:
          - gene:
              id: "CRISPR_gRNA_site1"
              source: uniprot
              # Custom gRNA targeting locus 1 with unique 20bp spacer sequence

    - spacer: 45
      # First linker: tevopreQ1 ribozyme-like scaffold (non-repetitive, 45 bp)

    - cistron:
        label: gRNA_target2
        expression: high
        fused: false
        chain:
          - gene:
              id: "CRISPR_gRNA_site2"
              source: uniprot
              # Custom gRNA targeting locus 2 with unique 20bp spacer sequence

    - spacer: 62
      # Second linker: hybrid tdaptazime-like architecture (non-repetitive, 62 bp)

    - cistron:
        label: gRNA_target3
        expression: high
        fused: false
        chain:
          - gene:
              id: "CRISPR_gRNA_site3"
              source: uniprot
              # Custom gRNA targeting locus 3 with unique 20bp spacer sequence

    - terminator: rrnB_T1
      # Robust mammalian terminator distinct from standard polyA signals
