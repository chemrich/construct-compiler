construct:
  name: "diverse_polycistronic_grna_array"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: "grna_1"
        expression: high
        gene:
          id: "grna_scaffold_v1"
    - spacer: 26
    - cistron:
        label: "grna_2"
        expression: high
        fused: false
        gene:
          id: "grna_scaffold_v2"
    - spacer: 38
    - cistron:
        label: "grna_3"
        expression: high
        fused: false
        gene:
          id: "grna_scaffold_v3"
    - terminator: bGH_polyA