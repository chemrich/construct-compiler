construct:
  name: "dual_gRNA_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: U6
    
    - cistron:
        label: gRNA1
        expression: high
        gene:
          id: gRNA1_U6_scaffold_v1
          sequence: "GTTTAAGAGCTATGCTGGAAACAGCATAGCAAGTTTAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC"
          source: custom

    - promoter: H1
    
    - cistron:
        label: gRNA2
        expression: high
        gene:
          id: gRNA2_H1_scaffold_v2
          sequence: "GTTTGAGCTAGCTGGAGACAGTATGCAAGCTTCAAACGAGGCTCGTCCCGTGATCGACCTGAAAAGAGGCACTGAGTCGGTGCT"
          source: custom

    - terminator: rrnB_T1
