construct:
  name: "ProteinK_E_coli_codon_set_1"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinK_optimized_set1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinK
              source: uniprot
              codon_usage: e_coli_high_expression

    - terminator: rrnB_T1
