construct:
  name: "protein_m_subcellular_localization_dual_cassette"
  host: mammalian  # Substituted mammalian for insect host as it is the closest schema-supported eukaryotic host
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: OpIE2  # Insect cell specific promoter
    - cistron:
        label: mitochondrial_protein_m
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: ProteinM
              source: uniprot
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: IE1  # Distinct insect cell promoter (HR5-IE1) to avoid repeats
    - cistron:
        label: er_protein_m
        expression: high
        chain:
          - tag: ERTS
          - gene:
              id: ProteinM
              source: uniprot
    - terminator: bGH_polyA  # Distinct terminator to avoid sequence repeats