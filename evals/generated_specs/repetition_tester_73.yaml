construct:
  name: "ProteinP_dual_tag_dual_site_ivt"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - rbs: BBa_B0034  # Strong RBS for robust translation initiation

    - cistron:
        label: ProteinP_purification_cassette
        expression: high
        chain:
          - tag: 8xHis  # N-terminal purification tag (nickel affinity)
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV  # First protease site (recognition: ENLYFQ-G)
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinP  # Core protein target
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: Factor_Xa  # Second protease site (recognition: I(E/D)GR)
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Twin-Strep  # C-terminal purification tag (streptavidin affinity)

    - terminator: rrnB_T1  # Robust transcription terminator for cell-free systems
