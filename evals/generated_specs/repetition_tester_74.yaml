construct:
  name: "synthetic_three_gene_circuit_InputA_SensorB_OutputC"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100
      rbs: B0030
    
    - cistron:
        label: InputA
        expression: high
        gene:
          id: luxI
          source: uniprot
    
    - terminator: BBa_B0010

    - spacer: 25

    - promoter: J23106
      rbs: B0031
    
    - cistron:
        label: SensorB
        expression: high
        gene:
          id: luxR
          source: uniprot
    
    - terminator: rrnB_T1

    - spacer: 25

    - promoter: tac
      rbs: B0034
    
    - cistron:
        label: OutputC
        expression: medium
        gene:
          id: gfp
          source: fpbase
    
    - terminator: T7term
