construct:
  name: "mammalian_mCherry_IRES_sfGFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: mCherry
        expression: high
        gene:
          id: mCherry
          source: fpbase

    # IRES from Encephalomyocarditis Virus (EMCV) – distinct organism, low homology to mammalian sequences
    - ires: EMCV

    - cistron:
        label: sfGFP
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: BBa_B0015
