construct:
  name: ProteinP_multimerization_study
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: ProteinP_multimerization_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinP
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: GCN4_pLZ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
