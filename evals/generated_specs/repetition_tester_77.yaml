construct:
  name: "S_cerevisiae_integration_ProteinX_locus1"
  host: yeast

  backbone:
    resistance: G418  # Dominant selectable marker for yeast (Kanamycin B phosphotransferase)
    ori: 2_micron    # Yeast episomal; ignored during genomic integration
    source: custom

  cassette:
    - homology_arm_left:
        locus: "intergenic_region_chromosome_5_left"
        length_bp: 500
        repeat_filter: "no_repeats_gt_4bp"
        sequence_id: "Ha_L_locus1_chr5"

    - promoter: GPD  # Strong constitutive glyceraldehyde-3-phosphate dehydrogenase promoter

    - cistron:
        label: ProteinX
        expression: high
        gene:
          id: ProteinX
          source: uniprot

    - terminator: CYC1_term  # Robust yeast transcription terminator from CYC1

    - homology_arm_right:
        locus: "intergenic_region_chromosome_5_right"
        length_bp: 500
        repeat_filter: "no_repeats_gt_4bp"
        sequence_id: "Ha_R_locus1_chr5"
        distinct_from: "any_subsequent_integrations"

  integration_notes:
    selection_marker: "KanMX4_S288C"
    target_locus: "chromosome_5_intergenic"
    recombination_risk: "minimized_by_unique_homology_arms"
    strategy: "CRITICAL: For any future integration construct, use a different chromosomal locus (e.g., chromosome_7, chromosome_10) and regenerate homology arms de novo to ensure no cross-homology between constructs."
