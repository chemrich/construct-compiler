construct:
  name: "optogenetic_Cry2_CIB1_luciferase_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
      utr_5: Kozak_GCCRCCATGG

    - cistron:
        label: Cry2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mCry2
              source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha
      utr_5: EMCV_IRES

    - cistron:
        label: CIB1
        expression: high
        chain:
          - tag: HA
          - gene:
              id: CIB1
              source: uniprot

    - terminator: BGH_polyA

    - promoter: TRE_tight
      utr_5: Kozak_GCCRCCATGG

    - cistron:
        label: luciferase_reporter
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: WPRE_polyA
