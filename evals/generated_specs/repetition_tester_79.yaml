construct:
  name: "high_throughput_cell_free_array_10_genes"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    # Gene 1
    - spacer: 25
    - cistron:
        label: gene_1
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1

    # Gene 2
    - spacer: 30
    - cistron:
        label: gene_2
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
