          type: rigid_EAAAK
          repeats: 3
      - gene:
          id: ProteinA
          source: uniprot
      - linker:
          type: GS_flexible
          repeats: 4
      - gene:
          id: VP16
          source: uniprot
  - terminator: rrnB_T1
