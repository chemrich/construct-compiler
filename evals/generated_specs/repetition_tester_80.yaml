construct:
  name: bicistronic_dual_constitutive_dissimilar
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: protein_1
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 50
    - promoter: proD # Selected proD for high constitutive strength and sequence dissimilarity from J23100 to prevent recombination
    - cistron:
        label: protein_2
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1