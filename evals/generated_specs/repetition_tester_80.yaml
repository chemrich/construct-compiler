construct:
  name: "bicistronic_dissimilar_promoters"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: gene1
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - spacer: 30

    - promoter: J23106

    - cistron:
        label: gene2
        expression: high
        fused: false
        gene:
          id: gfp
          source: fpbase

    - terminator: rrnB_T1
