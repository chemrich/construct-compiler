construct:
  name: "yeast_tricistronic_distinct_RBS_terminators"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: gene1
        expression: high
        chain:
          - rbs: AGGAGGU
          - gene:
              id: HIS3
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - cistron:
        label: gene2
        expression: high
        fused: false
        chain:
          - rbs: GAGG
          - gene:
              id: LEU2
              source: uniprot

    - terminator: ADH1

    - spacer: 30

    - cistron:
        label: gene3
        expression: high
        fused: false
        chain:
          - rbs: AGGAGG
          - gene:
              id: URA3
              source: uniprot

    - terminator: PGK1
