construct:
  name: "GFP_RFP_fusion_with_diverse_linkers"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: fluorescent_fusion
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: short_GS
              repeats: 2
          - solubility_tag: MBP
    - terminator: T7term