construct:
  name: "bicistronic_dual_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: cistron_1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase

    # IRES from Encephalomyocarditis virus (EMCV) - canonical mammalian IRES
    - ires: EMCV

    - cistron:
        label: cistron_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    # IRES from Hepatitis C virus (HCV) - structurally distinct from EMCV, reduces recombination risk
    - ires: HCV

    - cistron:
        label: cistron_3
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
