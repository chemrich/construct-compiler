construct:
  name: "yeast_dual_secretion_pathway"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: primary_export
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: challenging_protein
              source: uniprot
          - tag: HDEL
        fused: false

    - spacer: 50

    - cistron:
        label: alternate_export
        expression: high
        chain:
          - tag: SUC2_signal
          - gene:
              id: challenging_protein
              source: uniprot
          - tag: c_myc
        fused: false

    - terminator: CYC1_poly_A
