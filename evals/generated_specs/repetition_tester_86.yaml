construct:
  name: "dual_synonymous_enzyme_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_v1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_v1_codon_optimized
              source: uniprot
              # Note: User must provide or specify the enzyme UniProt ID
              # This cistron uses standard codon optimization for E. coli

    - spacer: 30

    - cistron:
        label: enzyme_v2_synonymous
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_v2_codon_optimized_alt
              source: uniprot
              # Note: This is a fully synonymous variant with alternative codon usage
              # Same amino acid sequence and expression level, but minimized DNA identity
              # to prevent recombination and mutation propagation

    - terminator: rrnB_T1
