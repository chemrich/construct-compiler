construct:
  name: triple_reporter_independent_promoters
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV
      cistron:
        label: GFP_unit
        expression: high
        gene:
          id: mEGFP
          source: fpbase
      terminator: rrnB_T1

    - promoter: EF1_alpha
      cistron:
        label: RFP_unit
        expression: high
        gene:
          id: mScarlet
          source: fpbase
      terminator: rrnB_T1

    - promoter: PGK1
      cistron:
        label: BFP_unit
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
      terminator: rrnB_T1
