construct:
  name: "yeast_quadruple_gRNA_array_pol3"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      cistron:
        label: gRNA_1
        expression: high
        gene:
          id: gRNA_1_scaffold
          source: uniprot

    - promoter: SNR52  # distinct Pol III promoter
      cistron:
        label: gRNA_2
        expression: high
        gene:
          id: gRNA_2_scaffold
          source: uniprot

    - promoter: RPR1  # third distinct Pol III promoter
      cistron:
        label: gRNA_3
        expression: high
        gene:
          id: gRNA_3_scaffold
          source: uniprot

    - promoter: SCR1  # fourth distinct Pol III promoter
      cistron:
        label: gRNA_4
        expression: high
        gene:
          id: gRNA_4_scaffold
          source: uniprot

    - terminator: rrnB_T1
