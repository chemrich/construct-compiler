construct:
  name: dual_tag_proteolytic_purification
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_dual_tagged
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - tag: Twin-Strep
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
