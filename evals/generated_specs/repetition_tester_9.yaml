```yaml
construct:
  name: "ProteinP_IRES_ProteinQ_bicistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: proteinP
        expression: high
        chain:
          - gene:
              id: "ProteinP"  # User must provide actual protein ID
              source: uniprot
          - tag: V5  # Unique C-terminal tag for ProteinP

    - spacer: 150  # IRES-like element (user must provide non-standard scrambled IRES sequence)
    # Note: This spacer represents the custom scrambled IRES - actual sequence must be provided by user

    - cistron:
        label: proteinQ
        expression: medium
        fused: false  # Independent translation via IRES
        chain:
          - gene:
              id: "ProteinQ"  # User must provide actual protein ID
              source: uniprot
          - tag: Myc  # Unique C-terminal tag for ProteinQ

    - terminator: rrnB_T1
```