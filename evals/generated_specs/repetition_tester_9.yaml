construct:
  name: "mammalian_bicistronic_ProteinP_ProteinQ_custom_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinP
        expression: high
        chain:
          - gene:
              id: ProteinP
              source: uniprot
          - tag: FLAG

    # Custom scrambled IRES variant (non-homologous to encephalomyocarditis or poliovirus IRES)
    # Represents a synthetic IRES element with codon-optimized non-essential regions
    - spacer: 580  # bp - synthetic IRES variant with scrambled internal elements

    - cistron:
        label: ProteinQ
        expression: medium
        fused: false
        chain:
          - gene:
              id: ProteinQ
              source: uniprot
          - tag: HA

    - terminator: rrnB_T1
