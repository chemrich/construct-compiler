construct:
  name: yeast_dual_selection_markers
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
    # Note: pUC backbone for E. coli propagation; yeast selection via auxotrophic markers

  cassette:
    - promoter: GAL1
      cistron:
        label: URA3_marker
        expression: high
        gene:
          id: URA3
          source: uniprot
          # Orotidine 5'-phosphate decarboxylase; pyrimidine biosynthesis pathway
          # S. cerevisiae native ORF; widely used auxotrophic marker

    - spacer: 500
      # Large spacer to minimize recombination risk between divergent markers

    - promoter: ADH1
      cistron:
        label: LEU2_marker
        expression: high
        gene:
          id: LEU2
          source: uniprot
          # Isopropylmalate dehydrogenase; leucine biosynthesis pathway
          # Distinct pathway from URA3; functionally independent selection

    - terminator: rrnB_T1
