construct:
  name: "multi_operator_inducible_expression"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5
      # Multiple distinct operator variants to prevent recombination
      operators:
        - id: "O1_canonical"
          sequence: "AATTGTGAGC_GCTCACAATT"
          position: "upstream"
        - id: "O2_variant_half1"
          sequence: "GGCCAGTGAG_CGGCACACC"
          position: "spacer_1"
        - id: "O3_variant_half2"
          sequence: "CCAGTGAGCG_CTCACGGCC"
          position: "spacer_2"

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lacZ_alpha
              source: uniprot

    - terminator: rrnB_T1
