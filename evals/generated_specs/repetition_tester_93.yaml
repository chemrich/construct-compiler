construct:
  name: mammalian_viral_vector_packaging_robust
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: gag_pol
        expression: high
        chain:
          - gene:
              id: HIV_gag_pol
              source: uniprot
              codon_optimization: mammalian
              # Note: This element is sequence-diverse variant A

    - spacer: 30

    - cistron:
        label: rev
        expression: medium
        fused: false
        chain:
          - gene:
              id: HIV_rev
              source: uniprot
              codon_optimization: mammalian

    - spacer: 30

    - cistron:
        label: env
        expression: medium
        fused: false
        chain:
          - gene:
              id: VSV_G
              source: uniprot
              codon_optimization: mammalian
              # Note: Sequence-diverse variant B for insulator element placement

    - terminator: SV40_polyA
