construct:
  name: "dual_peptide_codon_optimized_diverse_tags"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: peptide_v1_HA
        expression: high
        chain:
          - gene:
              id: "small_peptide_codon_opt_v1"
              source: "custom"
              # Note: User must provide codon-optimized variant 1
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA

    - spacer: 40

    - cistron:
        label: peptide_v2_V5
        expression: high
        fused: false
        chain:
          - gene:
              id: "small_peptide_codon_opt_v2"
              source: "custom"
              # Note: User must provide codon-optimized variant 2 (synonymous but sequence-diverse)
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: V5

    - terminator: rrnB_T1
