construct:
  name: "dual_secreted_protein_distinct_leaders"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_copy1_sec_pathway
        expression: high
        chain:
          - signal_peptide: PelB
          - gene:
              id: secreted_protein
              source: uniprot

    - spacer: 30

    - cistron:
        label: secreted_copy2_tat_pathway
        expression: high
        fused: false
        chain:
          - signal_peptide: TorA
          - gene:
              id: secreted_protein
              source: uniprot

    - terminator: rrnB_T1
