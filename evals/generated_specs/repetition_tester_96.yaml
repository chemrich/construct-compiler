construct:
  name: "dual_NLS_fusion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        chain:
          - tag: NLS  # SV40 NLS (PKKKRKV)
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS  # distinct: c-myc NLS (PAAKRVKLD) - different sequence at DNA level
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
