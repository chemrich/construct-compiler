construct:
  name: "domain_swap_scaffold_3site"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MBP
              source: uniprot
          # Domain 1 insertion site
          - linker:
              type: rigid_EAAAK
              repeats: 1
          # NheI site: GCTAGC
          - linker:
              type: GS_flexible
              repeats: 1
          # BamHI site: GGATCC
          - linker:
              type: rigid_EAAAK
              repeats: 2
          # Domain 2 insertion site
          - linker:
              type: GS_flexible
              repeats: 2
          # XhoI site: CTCGAG
          - linker:
              type: rigid_EAAAK
              repeats: 1
          # Domain 3 insertion site
          - linker:
              type: GS_flexible
              repeats: 3
          # NotI site: GCGGCCGC
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1

# Note: Restriction sites (NheI, BamHI, XhoI, NotI) are non-palindromic and provide
# directional cloning. Linker composition alternates between rigid and flexible types
# to minimize sequence homology between flanking regions, preventing unwanted
# recombination during library construction. MBP scaffold provides solubility and
# expression; sfGFP fluorescent reporter enables screening.
