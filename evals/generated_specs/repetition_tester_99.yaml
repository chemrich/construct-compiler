construct:
  name: mammalian_dual_intron_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: gene1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
        intron: CAGG  # CAGG intron from chicken β-actin

    - spacer: 30

    - cistron:
        label: gene2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase
        intron: hPGK  # human PGK1 intron — structurally distinct from CAGG

    - terminator: rrnB_T1
