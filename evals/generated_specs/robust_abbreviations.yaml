construct:
  name: "mEGFP_T7_expression"
  host: e_coli_bl21_de3 # Substituted BL21 with BL21(DE3) to provide T7 RNA polymerase for the T7 promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term