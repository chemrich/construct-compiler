```yaml
construct:
  name: "mgfp_his_tag_purification"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mgfp_his
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mGFP # Assuming 'mGFP' refers to a known fluorescent protein in FPbase. If resolution fails, 'mEGFP' is a common alternative.
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```