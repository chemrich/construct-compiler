construct:
  name: "his6_megfp_mcherry_polycistronic_expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: reporter_mcherry
        expression: low
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term