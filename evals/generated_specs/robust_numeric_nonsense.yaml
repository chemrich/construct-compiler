construct:
  name: "mEGFP_mScarlet_His123"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: megfp
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_multi_tag
        expression: high
        fused: false
        chain:
          - tag: 123xHis
          - gene:
              id: mScarlet
              source: fpbase
    # Note: 456 copies of mScarlet is physically impossible for a standard genetic construct due to size and repetitive sequence instability; a single high-expression cistron is used instead.
    - terminator: T7term