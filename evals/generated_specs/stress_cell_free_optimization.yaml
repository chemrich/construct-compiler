```yaml
construct:
  name: "cfps_wheat_germ_optimized"
  host: e_coli # Chosen as a proxy for a bacterial-style expression system often used in CFPS, given the T7 promoter/terminator.

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high # Corresponds to "strong RBS (BBa_B0034)"
        chain:
          - tag: 6xHis
          - gene:
              id: gene_of_interest # Placeholder: Please replace with your target gene ID and source.

    - terminator: T7term

  constraints:
    codon_optimization: local # Corresponds to "avoid problematic codons"
```