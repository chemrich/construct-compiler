construct:
  name: "wheat_germ_ivt_optimized"
  host: in_vitro
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high # strong RBS/leader for high CFPS yield
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term # t7 terminator for runoff control and efficient termination