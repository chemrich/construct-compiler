```yaml
construct:
  name: "cp_gfp_his_tag_template"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: cp_gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP # Placeholder for specific circular permutant GFP variant
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
