```yaml
construct:
  name: "human_insulin_e_coli_optimization"
  host: e_coli # The request specified E. coli K-12, BL21(DE3), and B. subtilis.
               # B. subtilis is not a supported host. As only a single YAML document is permitted,
               # this construct provides human insulin optimized for a general E. coli host (e.g., K-12).
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: human_insulin
        expression: high
        gene:
          id: P01308 # Human insulin (preproinsulin)
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```