construct:
  name: "human_insulin_expression_bl21_de3"
  # As per Rule 14, only one YAML document is provided; BL21(DE3) was selected as the host.
  # Codon optimization for E. coli K-12 (host: e_coli) or B. subtilis (host: b_subtilis) 
  # is automatically performed by the compiler when the 'host' field is changed.
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: human_proinsulin
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01308
              source: uniprot
    - terminator: T7term