```yaml
construct:
  name: inclusion_body_protein_expression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac
    - cistron:
        label: target_protein
        expression: high # High expression, often leading to inclusion bodies
        chain:
          - gene:
              id: target_gene_for_inclusion_bodies # Placeholder gene, none specified in prompt
              source: uniprot # Defaulting to uniprot for a generic protein
    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```