# This spec represents the second (optimized) version requested, designed for soluble protein production.
construct:
  name: "Optimized_Soluble_mEGFP_Production"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_fusion
        expression: low
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term