```yaml
construct:
  name: "pentacistronic_fp_operon"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mEGFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 50

    - cistron:
        label: mScarlet
        expression: medium
        chain:
          - solubility_tag: GST
          - cleavage_site: 3C
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 50

    - cistron:
        label: mNeonGreen
        expression: low
        gene:
          id: mNeonGreen
          source: fpbase

    - spacer: 50

    - cistron:
        label: mCherry
        expression: very_low
        chain:
          - tag: Strep-II
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 50

    - cistron:
        label: mTagBFP2
        expression: medium
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```