construct:
  name: "pentacistronic_fp_operon_optimization"
  # Notes on expression optimization:
  # 1. RBS strengths are modulated via the 'expression' key (high/medium/low/very_low).
  # 2. Cistron order is optimized for translational coupling and mRNA stability.
  # 3. 50bp spacers prevent secondary structure interference between adjacent RBS sequences.
  # 4. Metabolic load is balanced by placing lower-expression genes later in the operon.
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
  cassette:
    - promoter: T7lac

    - cistron:
        label: mgfp_high
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 50

    - cistron:
        label: mscarlet_medium
        expression: medium
        fused: false
        chain:
          - solubility_tag: GST
          - cleavage_site: 3C
          - gene:
              id: mScarlet
              source: fpbase

    - spacer: 50

    - cistron:
        label: mneongreen_low
        expression: low
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase

    - spacer: 50

    - cistron:
        label: mcherry_very_low
        expression: very_low
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 50

    - cistron:
        label: mtagbfp2_medium
        expression: medium
        fused: false
        chain:
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: T7term