construct:
  name: "mEGFP_metabolic_burden_high_copy"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term
# Substitution: Rule 14 restricts output to a single YAML document. This spec defines the high-copy (pBR322) variant; the low-copy variant to test metabolic burden would be identical but with 'ori: p15A'.