construct:
  name: "polycistronic_4_enzyme_metabolic_pathway"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_a
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: medium
        fused: false
        gene:
          id: enzyme_b
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: medium
        fused: false
        chain:
          - solubility_tag: GST
          - gene:
              id: enzyme_c
              source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_d
        expression: low
        fused: false
        gene:
          id: enzyme_d
          source: uniprot
    - terminator: rrnB_T1