```yaml
construct:
  name: "four_enzyme_metabolic_pathway"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: enzyme_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Enzyme_A

    - spacer: 30

    - cistron:
        label: enzyme_b
        expression: medium
        fused: false
        gene:
          id: Enzyme_B

    - spacer: 30

    - cistron:
        label: enzyme_c
        expression: medium
        fused: false
        chain:
          - solubility_tag: GST
          - gene:
              id: Enzyme_C

    - spacer: 30

    - cistron:
        label: enzyme_d
        expression: low
        fused: false
        gene:
          id: Enzyme_D

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```