construct:
  name: "phage_display_fab_library"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: IGLC1
              source: uniprot
    - spacer: 30
    - cistron:
        label: heavy_chain_pIII_fusion
        expression: high
        fused: false
        chain:
          - tag: pelB
          - tag: IGHG1
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: 6xHis
          - tag: amber_stop
          - gene:
              id: P03633
              source: uniprot
    - terminator: rrnB_T1