```yaml
construct:
  name: "phage_display_fab_fragment"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: fab_fragment
        expression: high
        gene:
          id: custom_fab_fragment # Assumed to include the leader peptide sequence
        linker:
          type: GS_flexible
          repeats: 2
        c_tag: 6xHis
        # The "amber stop codon" is a sequence design feature for conditional display
        # and is not explicitly represented as a tag or cleavage site within this schema.
        # It would be incorporated into the `custom_fab_fragment` gene sequence
        # or as an instruction to the synthesis vendor.

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```