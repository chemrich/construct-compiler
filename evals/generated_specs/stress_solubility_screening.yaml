```yaml
construct:
  name: "target_protein_mbp_his_tag"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_protein
        expression: medium
        chain:
          - solubility_tag: MBP
          - tag: 6xHis
          - gene:
              id: target_protein
              source: uniprot # Assuming a generic target protein, not from fpbase.

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```