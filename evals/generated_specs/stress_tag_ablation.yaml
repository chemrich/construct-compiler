construct:
  name: "mEGFP_tagging_and_solubility_study"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: mEGFP_untagged
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mEGFP_His
        expression: high
        fused: false  # Encoded as a separate protein with its own RBS
        chain:
          - tag: 6xHis
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: mEGFP_MBP_His
        expression: high
        fused: false  # Encoded as a separate protein with its own RBS
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term