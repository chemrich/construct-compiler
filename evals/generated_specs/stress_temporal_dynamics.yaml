```yaml
construct:
  name: "protein_degradation_comparison_operon"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: untagged_variant
        expression: medium
        fused: false # Independent translation for this variant
        gene:
          id: user_protein_variant_1 # Placeholder: User must specify the actual gene ID (e.g., "my_gene")
          source: uniprot

    - spacer: 30

    - cistron:
        label: ssrA_variant
        expression: medium
        fused: false # Independent translation for this variant
        gene:
          id: user_protein_ssrA_variant_2 # Placeholder: User must specify the actual gene ID (e.g., "my_gene_ssrA")
          source: uniprot
          # The ssrA degradation tag is typically C-terminal. Please ensure 'user_protein_ssrA_variant_2'
          # includes the ssrA sequence at its C-terminus, as the schema does not support explicit C-terminal tags.

    - spacer: 30

    - cistron:
        label: His_tagged_variant
        expression: medium
        fused: false # Independent translation for this variant
        chain:
          - tag: 6xHis
          - gene:
              id: user_protein_variant_3 # Placeholder: User must specify the actual gene ID (e.g., "my_gene")
              source: uniprot

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```