construct:
  name: "temporal_protein_expression_dynamics"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: stable_variant
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: fast_degradation_base
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: rapid_degradation_ssrA
        expression: medium
        fused: false
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: ssrA
    - terminator: T7term