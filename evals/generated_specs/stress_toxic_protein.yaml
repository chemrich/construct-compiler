construct:
  name: "toxic_protease_lethality_control"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: cspA  # Cold-shock promoter for 16°C induction
    - cistron:
        label: protease_domain
        expression: very_low
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P03398
              source: uniprot
    - terminator: rrnB_T1  # Standard terminator chosen to meet basic expression needs