```yaml
construct:
  name: "rbs_optimization_mneongreen_template"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mNeonGreen_expression
        # To vary RBS strength, change the 'expression' level for each variant.
        # Options: very_low, low, medium, high
        # Map requested strengths:
        # "very weak" -> very_low
        # "weak" -> low
        # "medium" -> medium
        # "strong" -> high
        # "very strong" -> high (as it's the highest available option)
        expression: medium # Placeholder; vary for each construct in the optimization series
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
```