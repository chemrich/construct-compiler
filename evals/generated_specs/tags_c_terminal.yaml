```yaml
construct:
  name: "mscarlet_flag_ecoli"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: mscarlet_flag
        expression: medium
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: FLAG # Placed after the gene to indicate a C-terminal tag

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
