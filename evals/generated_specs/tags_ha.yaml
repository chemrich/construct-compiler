construct:
  name: "mCherry_HA_expression_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1