construct:
  name: "His_3C_MBP_mScarlet_fusion"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - solubility_tag: MBP
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term