construct:
  name: "mEGFP_N_His_FLAG_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1