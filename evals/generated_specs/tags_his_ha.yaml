    - cistron:
        label: mScarlet_expression
        expression: high
        chain:
          - tag: 6xHis
          - tag: HA
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21
