construct:
  name: "polycistronic_sfGFP_mScarlet_purification"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: sfGFP_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: sfGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: mScarlet_reporter
        expression: medium
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
          - tag: HA
    - terminator: T7term