construct:
  name: "His_GS_TEV_MBP_mCherry_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: custom
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: mCherry
              source: fpbase
    - terminator: T7term