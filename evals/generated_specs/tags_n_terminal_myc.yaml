construct:
  name: "myc_mneongreen_low_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: low
        chain:
          - tag: Myc
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: rrnB_T1