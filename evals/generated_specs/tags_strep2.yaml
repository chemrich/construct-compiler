construct:
  name: "mScarlet_StrepII_purification"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1