construct:
  name: "sumo_factor_xa_target_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - cleavage_site: Factor_Xa
          - gene:
              id: target_protein
              source: uniprot
    - terminator: T7term