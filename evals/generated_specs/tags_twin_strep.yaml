construct:
  name: "mNeonGreen_TwinStrep_purification"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: Twin-Strep
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: T7term