construct:
  name: "human_antibody_fragment_TEV_cleavable"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: null  # No antibiotic resistance gene per requirements
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac  # Tight regulation via IPTG induction
    
    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01857  # Human immunoglobulin heavy chain variable domain (example UniProt ID)
              source: uniprot
    
    - terminator: rrnB_T1
