construct:
  name: "stable_secreted_therapeutic_human"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Non-viral constitutive promoter used for stable expression in human cells
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: IgK_leader  # Standard mammalian secretion signal for extracellular targeting
          - gene:
              id: P01588  # Human Erythropoietin (EPO)
              source: uniprot
    - terminator: hGH_pA  # Human Growth Hormone polyadenylation signal for enhanced mRNA stability without viral sequences