construct:
  name: "secreted_therapeutic_peptide_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - solubility_tag: Trx
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - tag: KDEL

    - terminator: rrnB_T1

  features:
    mRNA_stability: poly_A_signal_enhanced
    integration: non-viral_episomal
    selection: constitutive_no_inducible
