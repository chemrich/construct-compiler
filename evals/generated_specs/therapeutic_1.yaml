          - tag: signal_peptide_IgK  # Immunoglobulin kappa light chain signal peptide
          - gene:
              id: P01308  # Human insulin precursor as example therapeutic peptide
              source: uniprot
          - tag: 6xHis

    - terminator: BGH_polyA
