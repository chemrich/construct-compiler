```yaml
construct:
  name: "shRNA_knockdown_vector"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: U6  # RNA Pol III promoter for shRNA expression

    - cistron:
        label: shRNA_hairpin
        expression: high
        gene:
          id: "custom_shRNA"
          # shRNA hairpin structure will be designed by compiler
          # targeting sequence and loop structure optimized for RNAi

    - terminator: U6_terminator  # Pol III terminator (polyT tract)
```