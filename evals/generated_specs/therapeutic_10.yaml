construct:
  name: "mammalian_shRNA_silencing_construct"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter for robust shRNA expression in mammalian cells

    - cistron:
        label: shRNA
        expression: high
        chain:
          - gene:
              id: shRNA_GFP
              sequence: >
                GATCCCCGGTGAACGTGGAGACTTTCGTTTCAAGAGAACGAAAGUCUCCACGUUCACCTTTTTTA
              source: custom
      # shRNA sequence targeting GFP; user should replace with target gene sequence

    - terminator: poly_T
      # Pol III terminator (4 consecutive T's signal transcription termination)
