construct:
  name: "hGH_nonviral_high_solubility_production"
  host: e_coli
  backbone:
    resistance: kanamycin # Placeholder: Schema requires resistance; recommend auxotrophic selection (e.g., glnA/infB) for marker-free production.
    ori: pUC
    source: custom
  cassette:
    - promoter: tac # High-yield bacterial promoter; selected over viral T7 to satisfy "no viral elements" requirement.
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP # MBP significantly improves the folding and solubility of human growth hormone in E. coli.
          - tag: 6xHis # For immobilized metal affinity chromatography (IMAC) purification.
          - cleavage_site: TEV # Enables precise removal of the N-terminal fusion for pharmaceutical-grade purity.
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P01241 # UniProt ID for Human Growth Hormone (Somatotropin).
              source: uniprot
    - terminator: rrnB_T1