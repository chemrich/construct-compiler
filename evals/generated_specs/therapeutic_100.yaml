construct:
  name: hGH_variant_expression_system
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # Antibiotic-free backbone for pharmaceutical compliance
    ori: pBR322
    source: addgene
    # Note: Using pBR322 ori with no selection marker; production strain maintains plasmid through auxotrophic complementation or integration

  cassette:
    - promoter: T7lac

    - cistron:
        label: hGH_variant
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GH1
              source: uniprot

    - terminator: rrnB_T1
