construct:
  name: secreted_human_scFv_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin  # non-antibiotic selection marker

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_scFv
        expression: high
        chain:
          - tag: signal_peptide_myeloma  # N-terminal secretion signal (IgG kappa leader sequence)
          - gene:
              id: human_scFv
              source: uniprot
          - tag: His6  # C-terminal purification tag
          - tag: KDEL  # optional ER retention/retrieval signal for enhanced secretion

    - terminator: SV40_pA  # mammalian polyadenylation signal

    - spacer: 50

    - cistron:
        label: selection_marker
        expression: medium
        fused: false
        gene:
          id: blasticidin_S_deaminase
          source: uniprot

    - terminator: SV40_pA
