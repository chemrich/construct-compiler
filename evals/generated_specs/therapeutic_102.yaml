construct:
  name: "fibroblast_metabolic_enzyme_cytoplasmic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No antibiotic resistance marker for clinical safety
    # Non-integrating episomal plasmid backbone for transient-to-persistent expression

  cassette:
    - promoter: EF1_alpha
      # Strong ubiquitous mammalian promoter, constitutive expression

    - cistron:
        label: metabolic_enzyme
        expression: high
        chain:
          - tag: 6xHis
            # Enables purification/tracking if needed, C-terminal can be removed post-expression
          - gene:
              id: GCK
              # Glucokinase as example metabolic enzyme; substitute with desired enzyme UniProt ID
              source: uniprot

    - terminator: rrnB_T1
      # Strong polyadenylation signal for mRNA stability in mammalian cells
