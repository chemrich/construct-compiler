construct:
  name: "yeast_dual_protein_bioproduction"
  host: yeast

  backbone:
    resistance: auxotrophic_marker  # URA3 or HIS3 for non-antibiotic selection
    ori: 2_micron  # high-copy plasmid for yeast
    source: addgene

  cassette:
    - promoter: GAL1  # Inducible, strong promoter for yeast

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
