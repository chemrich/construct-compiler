construct:
  name: "yeast_industrial_therapeutic_coexpression"
  host: yeast
  backbone:
    resistance: URA3 # Non-antibiotic auxotrophic marker for industrial fermentation stability
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: PROTEIN_A
          source: uniprot
    - spacer: 50
    - cistron:
        label: protein_b
        expression: high
        fused: false # Ensures independent translation of the second protein
        gene:
          id: PROTEIN_B
          source: uniprot
    - terminator: CYC1_term