construct:
  name: inducible_cytotoxic_therapeutic_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Clinical-grade mammalian expression vector without antibiotic selection markers
    # Uses puromycin N-acetyltransferase for transient selection, removable before manufacturing

  cassette:
    - promoter: TRE3G
      # Tetracycline Response Element 3G: tight, inducible by doxycycline
      # Requires co-expression of rtTA3 transactivator (typically on separate plasmid or genomic integration)

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: caspase_3
              # Representative cytotoxic protein; substitute with actual therapeutic target
              source: uniprot

    - terminator: SV40_polyA
      # SV40 polyadenylation signal for efficient mammalian transcript maturation and stability
