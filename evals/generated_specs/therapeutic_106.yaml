construct:
  name: non_viral_liver_specific_factor_IX
  host: mammalian
  backbone:
    resistance: kanamycin # Kanamycin used for industrial plasmid production; clinical construct is designed as a minicircle to remove antibiotic resistance genes post-production.
    ori: pUC
    source: custom
  cassette:
    - promoter: hAAT # Human alpha-1-antitrypsin promoter for hepatocyte-specific expression
    - cistron:
        label: coagulation_factor_IX
        expression: high
        gene:
          id: P00740
          source: uniprot
    - terminator: hGH_polyA # Human growth hormone polyadenylation signal (non-viral)