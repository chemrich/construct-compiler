construct:
  name: "hepatocyte_coagulation_factor_therapy"
  host: mammalian

  backbone:
    resistance: null  # antibiotic-free design for therapeutic use
    ori: pUC  # minimal non-viral origin
    source: custom

  cassette:
    - promoter: HNF1_alpha  # hepatocyte-specific promoter

    - cistron:
        label: coagulation_factor
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor  # secretion signal for hepatocyte export
          - gene:
              id: F9  # Factor IX (Christmas factor) - therapeutic coagulation protein
              source: uniprot

    - terminator: SV40_polyA  # mammalian polyadenylation (non-viral backbone)
