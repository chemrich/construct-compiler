construct:
  name: "therapeutic_proprotein_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No antibiotic resistance for clinical safety; selection via non-antibiotic methods

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_proprotein
        expression: high
        chain:
          - tag: signal_peptide_leader  # N-terminal signal peptide for ER/secretion pathway
          - gene:
              id: "proprotein_therapeutic"
              source: uniprot
          - tag: c_KDEL  # Optional ER retention if needed, or omit for secretion

    - terminator: SV40_polyA  # Mammalian polyadenylation signal
