construct:
  name: "nuclear_localized_therapeutic_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: pTwist CMV is a non-viral mammalian expression vector without antibiotic resistance

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IL10
              source: uniprot

    - terminator: rrnB_T1
