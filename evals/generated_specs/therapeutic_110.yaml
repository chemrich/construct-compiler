construct:
  name: peptide_library_expression_plasmid
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_variant_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: variant_peptide_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: peptide_variant_2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: variant_peptide_2
              source: uniprot

    - spacer: 25

    - cistron:
        label: peptide_variant_3
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: variant_peptide_3
              source: uniprot

    - spacer: 25

    - cistron:
        label: peptide_variant_4
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: variant_peptide_4
              source: uniprot

    - terminator: rrnB_T1
