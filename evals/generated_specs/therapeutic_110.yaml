construct:
  name: peptide_screening_plasmid_no_selection
  host: e_coli
  backbone:
    resistance: none # User requested no antibiotic resistance; implementation requires auxotrophic markers (e.g., thyA, pyrF) or toxin-antitoxin systems
    ori: pUC
    source: custom
  cassette:
    - promoter: tac # E. coli derived promoter used as a non-viral alternative to T7
    - cistron:
        label: peptide_variant_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P81447
              source: uniprot
    - spacer: 30
    - cistron:
        label: peptide_variant_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P81448
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator, avoids viral T7 terminator sequences