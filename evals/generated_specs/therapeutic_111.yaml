construct:
  name: "bispecific_antibody_expression_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian vector, no antibiotic selection
    # Uses internal mammalian selection if needed (e.g., puromycin via separate construct)

  cassette:
    - promoter: CMV

    - cistron:
        label: heavy_chain_1
        expression: high
        chain:
          - gene:
              id: "heavy_chain_1_var"
              source: uniprot
              # User to provide specific heavy chain sequence/ID

    - spacer: 30

    - cistron:
        label: heavy_chain_2
        expression: high
        fused: false
        chain:
          - gene:
              id: "heavy_chain_2_var"
              source: uniprot
              # User to provide specific heavy chain sequence/ID

    - terminator: rrnB_T1

  # Secondary cassette for light chains (same vector, separate promoter-driven cassette)
  cassette_2:
    - promoter: EF1_alpha

    - cistron:
        label: light_chain_kappa
        expression: high
        chain:
          - gene:
              id: "light_chain_kappa_var"
              source: uniprot
              # User to provide specific light chain sequence/ID

    - spacer: 30

    - cistron:
        label: light_chain_lambda
        expression: high
        fused: false
        chain:
          - gene:
              id: "light_chain_lambda_var"
              source: uniprot
              # User to provide specific light chain sequence/ID

    - terminator: rrnB_T1
