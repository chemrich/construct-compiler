construct:
  name: "S_cerevisiae_human_enzyme_metabolic_pathway"
  host: yeast

  backbone:
    resistance: none
    ori: none
    integration_site: URA3
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: human_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_enzyme
              source: uniprot

    - terminator: CYC1
