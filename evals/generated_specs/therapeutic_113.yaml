construct:
  name: "mammalian_cell_surface_receptor_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # pTwist CMV is a non-viral mammalian expression vector
    # without antibiotic resistance markers; uses selection-free design

  cassette:
    - promoter: CMV
      # Strong constitutive mammalian promoter for therapeutic protein expression

    - cistron:
        label: receptor
        expression: high
        chain:
          - signal_peptide: alpha_factor_analog
            # Signal peptide for ER translocation and N-terminal trafficking
          - gene:
              id: EGFR
              source: uniprot
            # Exemplar: Epidermal Growth Factor Receptor
            # Replace with specific therapeutic receptor as needed (e.g., CD40, TNF-R, IL-2R)
          - tag: FLAG
            # C-terminal FLAG tag for detection and purification
            # Minimal, non-immunogenic tag for therapeutic use

    - terminator: SV40poly_A
      # Mammalian polyadenylation signal for mRNA stability and export
