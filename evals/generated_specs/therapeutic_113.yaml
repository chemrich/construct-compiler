construct:
  name: "Non_Viral_Therapeutic_Receptor_HEK293"
  host: HEK293
  backbone:
    # Kanamycin included for E. coli propagation; for therapeutic use, alternative selection (e.g. minicircle) is recommended.
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Non-viral human-derived promoter
    - cistron:
        label: therapeutic_receptor
        expression: high
        chain:
          - gene:
              id: P00533 # EGFR (Human Epidermal Growth Factor Receptor)
              source: uniprot
    - terminator: bGH_pA # Non-viral polyadenylation signal (Bovine Growth Hormone)