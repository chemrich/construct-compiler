construct:
  name: "diagnostic_reagent_expression_system"
  host: e_coli_bl21

  backbone:
    resistance: null  # metabolic selection via sacB instead of antibiotic
    ori: pBR322
    source: addgene
    # Note: sacB (sucrose sensitivity) provides metabolic selection on sucrose-containing media

  cassette:
    - promoter: T7lac

    - cistron:
        label: diagnostic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: sacB
              source: uniprot
              # sacB acts as metabolic marker; replace with actual diagnostic protein ID
              # This is a placeholder—substitute with your bacterial protein of interest

    - terminator: rrnB_T1
