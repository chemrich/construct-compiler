construct:
  name: "mammalian_dual_protein_2A_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian vector; resistance gene removed post-cloning if needed
    # Use selection-marker-free backbone or piggyBac for integration

  cassette:
    - promoter: CMV
      # Constitutive mammalian promoter, non-viral origin

    - cistron:
        label: Protein_X
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: "Protein_X"
              source: uniprot
              # User to provide UniProt ID or sequence reference

    - spacer_2A: "GGCAGCGGAGGTGGCGGTGGTGGTGGAGGATCTGGTGAGCGAGGATGTGGGCGAG"
      # Synonym for 2A self-cleaving peptide (e.g., T2A or P2A sequence)
      # This causes ribosomal skipping and produces two separate proteins from one ORF

    - cistron:
        label: Protein_Y
        expression: high
        fused: false
        # fused: false indicates independent translation post-2A cleavage
        chain:
          - tag: HA
          - cleavage_site: TEV
          - gene:
              id: "Protein_Y"
              source: uniprot
              # User to provide UniProt ID or sequence reference

    - terminator: SV40polyA
      # Mammalian polyadenylation signal (non-viral backbone includes standard polyA)
