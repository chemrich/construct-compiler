construct:
  name: human_therapeutic_peptide_stability
  host: e_coli_bl21_de3
  
  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene
    # Non-antibiotic selection via auxotrophic complementation
    selection_marker: araBAD_sacB  # Counter-selectable marker for plasmid maintenance
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_peptide_human
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: chaperone
        expression: high
        fused: false
        gene:
          id: GroEL
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: protease_inhibitor
        expression: medium
        fused: false
        gene:
          id: Lon_protease_inhibitor
          source: uniprot
    
    - terminator: rrnB_T1
