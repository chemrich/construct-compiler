construct:
  name: "Human_GLP1_Stability_Enhanced_Fusion"
  host: e_coli_bl21
  backbone:
    # Note: Kanamycin selected as schema placeholder; implement with auxotrophic marker for non-antibiotic selection.
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Non-viral, IPTG-inducible promoter for high-level expression in E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP # MBP enhances solubility and protects small peptides from degradation
          - cleavage_site: TEV # Allows for precise removal of the MBP-His tag
          - gene:
              id: P01275 # Glucagon-like peptide 1 (human)
              source: uniprot
    - terminator: rrnB_T1