construct:
  name: mitochondrial_therapeutic_protein_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: mitochondrial_therapeutic
        expression: high
        chain:
          - tag: MTS
            # Mitochondrial Targeting Sequence (N-terminal)
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein
              # User must specify the actual therapeutic protein ID and source
              # Examples: uniprot for natural proteins (e.g., SOD2, CAT, IDH2)
              source: uniprot

    - terminator: rrnB_T1
