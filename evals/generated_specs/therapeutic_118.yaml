construct:
  name: "Mitochondrial_Therapeutic_SOD2_NonViral"
  host: HEK293
  backbone:
    resistance: kanamycin # Rule 12: Substituted for a non-antibiotic selection system (e.g. pFAR or minicircle) to satisfy schema requirements.
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Non-viral mammalian promoter substituted for CMV to meet requirement.
    - cistron:
        label: mitochondrial_therapeutic
        expression: high
        chain:
          - tag: MTS # Mitochondrial Targeting Signal for efficient organelle localization.
          - gene:
              id: P04179 # Human SOD2 (Superoxide Dismutase 2, mitochondrial)
              source: uniprot
    - terminator: bGH_polyA # Non-viral mammalian terminator.