construct:
  name: "yeast_pH_inducible_secreted_enzyme"
  host: yeast

  backbone:
    resistance: null  # No antibiotic resistance marker for bioprocessing compliance
    ori: 2_micron    # S. cerevisiae 2-micron plasmid for episomal maintenance
    source: addgene

  cassette:
    - promoter: PHO5  # pH-inducible acid phosphatase promoter; repressed at neutral pH, induced at acidic pH

    - cistron:
        label: secreted_enzyme
        expression: low  # Basal expression at neutral pH
        chain:
          - tag: alpha_factor_signal  # N-terminal alpha-factor secretion signal for ER-Golgi trafficking
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CEL5A  # Example: cellulase enzyme; replace with specific enzyme ID as needed
              source: uniprot

    - terminator: CYC1  # S. cerevisiae CYC1 transcription terminator
