construct:
  name: "CPP_cargo_fusion_construct"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: CPP_cargo
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TAT_CPP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_cargo
              source: uniprot

    - terminator: rrnB_T1
