construct:
  name: "secreted_human_growth_factor_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_growth_factor
        expression: high
        chain:
          - signal_peptide: IgG_leader  # N-terminal secretion signal for mammalian ER targeting
          - tag: 8xHis
          - cleavage_site: Factor_Xa  # for removal of His-tag if needed post-purification
          - gene:
              id: FGF2
              source: uniprot

    - terminator: polyA  # mammalian polyadenylation signal
