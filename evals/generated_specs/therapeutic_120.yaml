construct:
  name: "Secreted_hGH_NonViral_High_Expression"
  host: HEK293
  backbone:
    # Antibiotic resistance omitted per request for systemic/therapeutic safety; using a custom backbone spec.
    resistance: none
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha  # Non-viral, high-expression mammalian promoter substituted for CMV
    - cistron:
        label: human_growth_factor
        expression: high
        chain:
          - gene:
              id: P01241
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: 3C
          - tag: Twin-Strep
    - terminator: bGH_polyA  # Standard high-efficiency mammalian polyadenylation signal