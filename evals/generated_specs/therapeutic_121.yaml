construct:
  name: "transient_nonviral_human_nuclease_editor"
  host: mammalian
  backbone:
    resistance: none # User requested selection-marker-free construct
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # High-expression non-viral human promoter
    - cistron:
        label: gene_editing_nuclease
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: Q99ZW2
              source: uniprot
          - tag: NLS
    - terminator: hGH_polyA # Non-viral human polyadenylation signal