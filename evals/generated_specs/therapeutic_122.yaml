construct:
  name: "Fab_periplasmic_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: Antibiotic-free backbone selection requires custom vector without selection marker

  cassette:
    - promoter: T7lac

    - cistron:
        label: Fab_fragment
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: Fab_light_chain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Fab_heavy_chain
              source: uniprot
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP

    - terminator: rrnB_T1
