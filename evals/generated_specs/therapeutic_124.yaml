construct:
  name: "dual_secreted_immunomodulator_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-integrating, mammalian expression vector without antibiotic resistance

  cassette:
    - promoter: CMV

    - cistron:
        label: immunomod_1
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: 3C
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IL10
              source: uniprot

    - spacer: 25

    - cistron:
        label: immunomod_2
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TNF
              source: uniprot

    - terminator: rrnB_T1
