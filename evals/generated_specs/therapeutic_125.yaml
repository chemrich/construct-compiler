construct:
  name: "mammalian_membrane_receptor_caHER2"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: caHER2
        expression: high
        chain:
          - tag: FLAG
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HER2_human
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: CAAX  # C-terminal CAAX prenylation motif for membrane anchoring

    - terminator: rrnB_T1
