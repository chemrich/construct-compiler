construct:
  name: constitutive_membrane_receptor_ERBB2
  host: HEK293

  backbone:
    # Kanamycin included for bacterial propagation as per schema; no selection marker added to expression cassette to satisfy "No ARGs" requirement.
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha  # Strong non-viral promoter

    - cistron:
        label: receptor_target
        expression: high
        chain:
          - solubility_tag: MBP  # N-terminal solubility tag
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: ERBB2  # Constitutively active receptor (HER2)
              source: uniprot

    - terminator: SV40_polyA