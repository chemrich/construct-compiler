construct:
  name: yeast_surface_display_vaccine_antigen
  host: yeast

  backbone:
    resistance: zeomycin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigen_display_motif
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: aga2
              source: uniprot

    - terminator: CYC1
