construct:
  name: "yeast_surface_display_therapeutic_vaccine"
  host: yeast
  backbone:
    resistance: URA3 # Using URA3 auxotrophic marker to fulfill the "free of ARGs" (Antibiotic Resistance Genes) requirement
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GPD # Using GPD (TDH3) constitutive yeast promoter for high-level expression in yeast host

    - cistron:
        label: display_fusion
        expression: high
        chain:
          - gene:
              id: P02829 # AGA2 surface display anchor protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P04626 # Human HER2 (ERBB2) therapeutic antigen (non-viral)
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1 # Standard yeast transcriptional terminator