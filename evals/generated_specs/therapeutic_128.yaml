construct:
  name: "inducible_IL10_secretion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Removed antibiotic resistance per user request; mammalian vector uses selection via fluorescent marker if needed

  cassette:
    - promoter: TRE3G  # Tetracycline-responsive element (tet-off inducible)
    
    - cistron:
        label: rtTA_transactivator
        expression: medium
        chain:
          - gene:
              id: rtTA3
              source: uniprot  # Reverse tetracycline-controlled transactivator, non-immunogenic variant

    - terminator: bGH_polyA

    # Separate cassette element: second promoter for cytokine expression
    - promoter: TRE3G  # Same TRE3G responsive to rtTA3 + doxycycline

    - cistron:
        label: IL10_secreted
        expression: high
        chain:
          - tag: His6  # N-terminal His tag for purification
          - linker:
              type: GS_flexible
              repeats: 1
          - signal_peptide: IL2_signal  # Signal peptide for secretion from HEK293
          - gene:
              id: IL10
              source: uniprot  # Human interleukin-10, anti-inflammatory cytokine

    - terminator: bGH_polyA
