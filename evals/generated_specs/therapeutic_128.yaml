construct:
  name: "tet_off_nonviral_il10_secretion"
  host: HEK293
  backbone:
    resistance: kanamycin # Required for E. coli propagation; no mammalian selection marker is included in the cassette per request.
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: transactivator
        expression: medium
        gene:
          id: "tTA_p65" # Substituted viral VP16 domain with human p65 activation domain to satisfy non-viral requirement.
    - terminator: SV40_pA
    - promoter: TRE3G # Tetracycline-responsive promoter for chemically controllable expression.
    - cistron:
        label: target_cytokine
        expression: high
        chain:
          - tag: Igk_leader # Secretion signal for mammalian cell trafficking.
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P22301 # Human IL-10 (anti-inflammatory cytokine).
              source: uniprot
    - terminator: BGH_pA