construct:
  name: "siRNA_reporter_mammalian_nonviral"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null
    source: addgene

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter for constitutive siRNA expression

    - cistron:
        label: siRNA
        expression: high
        chain:
          - gene:
              id: "generic_siRNA_target"
              source: uniprot
              # Note: User specifies siRNA design; compiler should handle Pol III output

    - terminator: "U6_term"

    # Separate cassette for fluorescent reporter
    - promoter: EF1_alpha
      # EF1_alpha provides mammalian constitutive expression independent of CMV

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: "rrnB_T1"
