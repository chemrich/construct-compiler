construct:
  name: "ABE8e_mammalian_base_editor"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: base_editor_fusion
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ABE8e
              source: uniprot
    - terminator: SV40_pA
    - promoter: U6
    - cistron:
        label: guide_rna
        expression: high
        gene:
          id: sgRNA_scaffold
          source: uniprot
    - terminator: BBa_B0015  # Representative terminator for the U6 cassette terminal sequence