construct:
  name: CRISPR_ABE8e_gRNA_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: ABE8e
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ABE8e
              source: uniprot
          - tag: NLS

    - terminator: bGH_polyA

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        fused: false
        chain:
          - gene:
              id: CRISPR_gRNA_scaffold
              source: uniprot

    - terminator: U6_terminator
