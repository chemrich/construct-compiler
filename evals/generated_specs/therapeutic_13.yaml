```yaml
construct:
  name: ABE8e_dual_gRNA_transient
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: base_editor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: P1UBF5  # ABE8e adenine base editor
              source: uniprot
          - tag: NLS

    - terminator: BBa_B0015

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        gene:
          id: scaffold_gRNA
          source: addgene  # Standard Cas9 gRNA scaffold sequence

    - terminator: rrnB_T1
```