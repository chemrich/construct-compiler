construct:
  name: "CPP_cargo_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: CPP_cargo_fusion
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TAT_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: cargo_protein
              source: uniprot
          # Note: CPP (TAT peptide) fused N-terminal to cargo enables cell internalization.
          # GS linkers provide spatial separation and flexibility for optimal CPP function.
          # 6xHis tag allows affinity purification of the fusion complex.
          # Consider that endosomal escape may require additional engineering (pH-sensitive elements or helper molecules not encoded here).

    - terminator: rrnB_T1
