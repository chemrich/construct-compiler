construct:
  name: "yeast_heterodimer_secretion_system"
  host: yeast

  backbone:
    resistance: hygromycin
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal yeast secretion signal
          - gene:
              id: subunit_A
              source: uniprot
          - tag: FLAG  # C-terminal purification tag for subunit A

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: alpha_factor_signal  # N-terminal yeast secretion signal
          - gene:
              id: subunit_B
              source: uniprot
          - tag: Strep-II  # C-terminal purification tag for subunit B

    - terminator: CYC1
