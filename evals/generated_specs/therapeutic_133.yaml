construct:
  name: E3_ligase_oncoprotein_degradation
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: E3_ligase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - tag: NLS
          - gene:
              id: NEDD4L
              source: uniprot

    - terminator: rrnB_T1
