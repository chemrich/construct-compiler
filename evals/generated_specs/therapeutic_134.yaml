construct:
  name: "cysteine_rich_peptide_periplasmic_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: pelB
          - gene:
              id: cysteine_rich_peptide
              source: uniprot

    - terminator: rrnB_T1
