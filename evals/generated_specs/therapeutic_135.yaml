construct:
  name: "mitochondrial_targeting_gene_therapy"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: MTS  # mitochondrial targeting sequence
          - gene:
              id: therapeutic_protein
              source: uniprot
              # User to specify actual protein ID; placeholder for gene therapy application

    - terminator: SV40poly
