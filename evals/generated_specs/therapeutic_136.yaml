construct:
  name: "NRP_synthetase_production_chassis"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: NRP_synthetase
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: NRP_synthetase
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
