construct:
  name: exosome_targeted_il2_fusion
  host: HEK293
  backbone:
    # A standard mammalian backbone is used. Kanamycin resistance is included for E. coli cloning 
    # as per schema requirements, but no mammalian antibiotic resistance gene (ARG) is included 
    # in the expression cassette.
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: therapeutic_payload
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P08962 # CD63 (Exosome-targeting tetraspanin)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: P60568 # IL-2 (Therapeutic cytokine)
              source: uniprot
    - terminator: bgh_polyA