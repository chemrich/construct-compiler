construct:
  name: exosome_therapeutic_scFv_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: null

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_scFv_exosomal
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: scFv_anti_PD1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: PDGF_signal_peptide
          - gene:
              id: CD63_exosomal_targeting
              source: uniprot
          - tag: HA

    - terminator: SV40poly_A
