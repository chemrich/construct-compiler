construct:
  name: "yeast_VLP_therapeutic_antigen_display"
  host: yeast

  backbone:
    resistance: hygromycin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: VLP_structural
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: gag
              source: uniprot
        # gag = viral-like particle structural protein (e.g., from Ty or similar non-human virus)

    - spacer: 30

    - cistron:
        label: antigen_fusion
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: therapeutic_antigen
              source: uniprot
        # Independent translation of antigen fusion protein with purification tag

    - terminator: rrnB_T1
