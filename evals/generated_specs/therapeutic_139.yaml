construct:
  name: "mammalian_bispecific_antibody"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null
    source: mammalian

  cassette:
    - promoter: CMV

    - cistron:
        label: scFv_A
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: Fc
          - gene:
              id: scFv_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: scFv_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - solubility_tag: Fc
          - gene:
              id: scFv_B
              source: uniprot

    - terminator: polyA
