          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ZZ_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ZZ_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ZZ_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ZZ_domain
              source: uniprot

    - terminator: rrnB_T1
