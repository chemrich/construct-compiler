construct:
  name: "human_therapeutic_soluble_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance per specification
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: human_therapeutic  # User to specify actual UniProt ID
              source: uniprot

    - terminator: rrnB_T1
