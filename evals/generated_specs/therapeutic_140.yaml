construct:
  name: "Human_TNF_Alpha_Soluble_Production"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Placeholder: schema requires an antibiotic resistance; for therapeutic production, this would be replaced with a selection-free system like auxotrophic markers.
    ori: pBR322
  cassette:
    - promoter: tac # High-yield non-viral bacterial promoter (inducible by IPTG).
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01375
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator; no viral components used.