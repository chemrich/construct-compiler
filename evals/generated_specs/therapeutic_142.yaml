construct:
  name: yeast_surface_peptide_display
  host: yeast

  backbone:
    resistance: none
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - gene:
              id: AGA1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: PEPTIDE_INSERT
              source: uniprot

    - terminator: CYC1
