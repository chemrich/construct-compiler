construct:
  name: "dual_subunit_therapeutic_mammalian_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: none
    ori: mammalian

  cassette:
    - promoter: CMV

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: signal_peptide_human_IgG
          - gene:
              id: "therapeutic_subunit_A"
              source: uniprot

    - spacer: 30

    - cistron:
        label: IRES
        fused: false

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: signal_peptide_human_albumin
          - gene:
              id: "therapeutic_subunit_B"
              source: uniprot

    - terminator: rrnB_T1
