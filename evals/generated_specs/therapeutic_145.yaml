construct:
  name: "muscle_specific_antibiotic_free_gene_therapy"
  host: mammalian
  backbone:
    resistance: none # Substituted antibiotic resistance with a comment: design implies pFAR or sucrose-based selection for antibiotic-free regulatory compliance
    ori: pBR322
    source: custom
  cassette:
    - promoter: MHCK7 # Strong muscle-specific chimeric promoter (MCK/alpha-MHC based)
    - cistron:
        label: therapeutic_payload
        expression: high
        gene:
          id: IGF1
          source: uniprot
    - terminator: bGH_pA # Bovine growth hormone polyadenylation signal (non-viral)