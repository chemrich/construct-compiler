construct:
  name: muscle_specific_therapeutic_gene_therapy
  host: mammalian

  backbone:
    # Custom backbone without antibiotic resistance
    # Suitable for direct in vivo delivery to muscle tissue
    ori: pUC
    source: addgene
    # No resistance marker for clinical safety

  cassette:
    - promoter: MCK  # Muscle Creatine Kinase - muscle-specific promoter

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - gene:
              id: therapeutic_gene
              source: uniprot
        # No tags or cleavage sites to minimize construct size

    - terminator: SV40_polyA  # SV40 polyadenylation signal for efficient mRNA processing
