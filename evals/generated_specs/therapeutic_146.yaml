construct:
  name: SARS_CoV2_mRNA_vaccine_template
  host: in_vitro

  backbone:
    resistance: none
    ori: none
    source: synthetic

  cassette:
    - utr_5:
        type: Kozak_optimized
        sequence: GCCGCCACCAUGG

    - cistron:
        label: spike_antigen
        expression: high
        chain:
          - gene:
              id: SARS_CoV2_spike_RBD
              source: uniprot
              codon_optimization: mammalian

    - utr_3:
        type: beta_globin_derived
        length: 64

    - poly_a_tail:
        length: 200
        modified_nucleotides: m1pseudouridine
