construct:
  name: "mammalian_crisprgRNA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Using pTwist as base; antibiotic resistance will be removed in custom modifications
    resistance: null
    ori: pUC

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter ideal for small RNA expression in mammalian cells

    - gene:
        id: crisprgRNA
        sequence: "GGTGTTTAATTACGAGTGCTGATGAGTTTGATGCTGATGTACTGGTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGCTTTTTT"
        # Standard 20bp gRNA spacer region (user should customize spacer sequence)
        # Followed by constant CRISPR repeat and termination signal

    - terminator: rrnB_T1
      # Pol III termination signal (6 consecutive T's for transcription termination)
