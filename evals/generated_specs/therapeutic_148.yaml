construct:
  name: metabolic_reporter_mCherry_safe
  host: e_coli

  backbone:
    resistance: none
    ori: pSC101
    source: addgene
    # pSC101 is a low-copy-number origin; naturally low expression burden
    # No antibiotic resistance marker for environmental safety

  cassette:
    - promoter: araBAD
      # araBAD is tunable via L-arabinose concentration; ideal for metabolic pathway sensing

    - cistron:
        label: reporter
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
