```yaml
construct:
  name: mRNA_vaccine_antigen_IVT
  host: in_vitro

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7  # T7 promoter for in vitro transcription

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: tPA_signal  # tissue plasminogen activator signal peptide for secretion
          - gene:
              id: P0DTC2  # SARS-CoV-2 spike protein as example antigen
              source: uniprot

    - terminator: rrnB_T1
```