construct:
  name: mRNA_vaccine_antigen_IVT
  host: in_vitro

  backbone:
    # In vitro transcription template - minimal backbone for RNA synthesis
    resistance: null
    ori: null
    source: synthetic

  cassette:
    - promoter: T7

    - utr:
        type: 5_prime
        variant: Kozak_optimized

    - cistron:
        label: antigen
        expression: high
        chain:
          - tag: Signal_peptide_SP64
          - gene:
              id: antigen_optimized
              source: uniprot
              # User must provide specific antigen ID (e.g., SPIKE_SARS2)

    - utr:
        type: 3_prime
        variant: beta_globin_stability

    - poly_a:
        length: 200
        # Extended poly-A tail for mRNA stability and translation efficiency
