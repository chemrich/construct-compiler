construct:
  name: "mammalian_nuclear_enzyme_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Clinical-grade mammalian vector with no antibiotic resistance markers
    # Compatible with GMP manufacturing workflows

  cassette:
    - promoter: CMV

    - cistron:
        label: nuclear_enzyme
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: null
              # User must specify the therapeutic enzyme gene ID and source (uniprot or custom)
              # Placeholder for enzyme of interest
              source: uniprot

    - terminator: rrnB_T1
