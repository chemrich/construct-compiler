construct:
  name: "E_coli_outer_membrane_peptide_display_vaccine"
  host: e_coli
  
  backbone:
    resistance: null  # No antibiotic resistance marker for safety
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: outer_membrane_display
        expression: high
        chain:
          - gene:
              id: OmpA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: peptide_insert_site
              source: uniprot
              # Note: User should specify the immunogenic peptide sequence
              # This represents a restriction site for peptide insertion
    
    - spacer: 25
    
    - cistron:
        label: surface_display_anchor
        expression: medium
        fused: false
        gene:
          id: LPS
          source: uniprot
    
    - terminator: rrnB_T1
