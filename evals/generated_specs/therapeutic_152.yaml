construct:
  name: "mammalian_therapeutic_CPP_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_CPP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: tat_CPP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IFN_beta_1
              source: uniprot

    - terminator: rrnB_T1
