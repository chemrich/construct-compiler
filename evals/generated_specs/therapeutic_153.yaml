construct:
  name: "yeast_human_enzyme_cytosolic"
  host: yeast

  backbone:
    resistance: null
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: human_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_placeholder
              source: uniprot

    - terminator: CYC1
