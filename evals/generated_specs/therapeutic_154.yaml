construct:
  name: "mammalian_therapeutic_degron_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: degron_d-box
            # D-box degron (RXXLXXXXN motif) for APC/C-mediated proteasomal degradation
            # Alternative: KEN box (DMEN), ornithine degron, or PEST sequence

    - terminator: rrnB_T1
