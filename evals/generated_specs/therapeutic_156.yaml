construct:
  name: "mammalian_episomal_therapeutic_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral, episomal backbone; no antibiotic resistance for clinical safety
    # pTwist CMV supports transient episomal replication via EBNA-1 origin
    ori: EBNA1
    resistance: none

  cassette:
    - promoter: CMV
      # Strong constitutive mammalian promoter for high-level transient expression

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
            # C-terminal His-tag for purification; can be removed post-expression
          - gene:
              id: IL10
              # Example: Interleukin-10 therapeutic; substitute with target protein ID
              source: uniprot

    - terminator: BGH_polyA
      # Bovine growth hormone polyadenylation signal for efficient mRNA 3' end processing
