construct:
  name: starvation_triggered_genetic_lysis_system
  host: e_coli

  backbone:
    resistance: null  # No antibiotic selection - use alternative verification
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # Arabinose-inducible for tight OFF state during production

    - cistron:
        label: sensor_histidine_kinase
        expression: medium
        chain:
          - gene:
              id: phoQ
              source: uniprot  # Phosphate starvation sensor (EnvZ/OmpR family)

    - spacer: 25

    - cistron:
        label: response_regulator
        expression: medium
        chain:
          - gene:
              id: phoP
              source: uniprot  # Transcriptional regulator activated by PhoQ

    - spacer: 25

    - promoter: lacUV5  # Constitutive weak promoter for basal expression

    - cistron:
        label: lysis_effector
        expression: high
        chain:
          - gene:
              id: holin_S21
              source: uniprot  # Lambda-like holin for membrane disruption (non-toxin)

    - spacer: 25

    - cistron:
        label: spanin_murein_hydrolase
        expression: high
        chain:
          - gene:
              id: endolysin_R
              source: uniprot  # Spanin endolysin - degrades peptidoglycan layer

    - terminator: rrnB_T1
