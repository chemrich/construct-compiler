construct:
  name: "scFv_periplasmic_expression_no_resistance"
  host: e_coli
  
  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: custom
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: pelB_signal_peptide  # Bacterial signal peptide for periplasmic targeting
          - gene:
              id: scFv_antibody
              source: uniprot
              # User must provide the specific scFv sequence via UniProt ID or custom input
    
    - terminator: rrnB_T1
