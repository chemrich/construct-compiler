construct:
  name: "mammalian_secreted_vaccine_antigen"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pUC
    # No antibiotic resistance marker for clinical safety

  cassette:
    - promoter: CMV

    - cistron:
        label: antigen
        expression: high
        chain:
          - signal_peptide: IgE_leader  # Mammalian secretion signal
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: SARS_CoV2_RBD
              source: uniprot

    - terminator: BGH_polyA
