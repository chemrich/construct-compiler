```yaml
construct:
  name: "doxycycline_inducible_therapeutic_enzyme"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
      
    - cistron:
        label: transactivator
        expression: medium
        chain:
          - gene:
              id: rtTA3
              source: uniprot
              
    - spacer: 50
    
    - promoter: TRE3G  # Tight, doxycycline-responsive promoter
      
    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ASPA  # Aspartoacylase - therapeutic enzyme for Canavan disease
              source: uniprot
              
    - terminator: BGH_polyA
```