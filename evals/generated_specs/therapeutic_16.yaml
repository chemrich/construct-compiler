construct:
  name: "mammalian_doxycycline_inducible_enzyme"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA_transactivator
        expression: high
        chain:
          - tag: HA
          - gene:
              id: rtTA3
              source: uniprot
        fused: false

    - spacer: 30

    - promoter: TRE

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905
              source: uniprot
        fused: false

    - terminator: rrnB_T1
