construct:
  name: "therapeutic_human_growth_factor_production"
  host: e_coli_bl21
  backbone:
    # Note: Kanamycin resistance included for initial plasmid selection; clinical-grade antibiotic-free systems (e.g., pFAR/pMINI) must be used for final therapeutic vector production.
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD # AraBAD is a purely bacterial promoter, satisfying the "no viral sequences" requirement while allowing high-yield induction.
    - cistron:
        label: target_factor
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV # TEV allows for precise removal of purification/solubility tags to yield a clean therapeutic protein.
          - gene:
              id: P01241
              source: uniprot
    - terminator: rrnB_T1 # Standard bacterial terminator to avoid viral T7 sequences.