construct:
  name: "hGF_high_yield_therapeutic"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # Antibiotic-free backbone; selection via auxotrophic complementation or counter-selection
    ori: pBR322
    source: addgene
    # Note: Use an antibiotic-free plasmid variant (e.g., pET-28b derivative with no resistance marker)
    # or a plasmid with removable resistance cassette for GMP compliance

  cassette:
    - promoter: T7lac

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HGF
              source: uniprot

    - terminator: rrnB_T1
