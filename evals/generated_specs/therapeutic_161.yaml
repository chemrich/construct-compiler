construct:
  name: human_IgG_Fc_fusion_therapeutic_secretion
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV Flexi
    # Non-integrating episomal vector, no antibiotic resistance
    # Mammalian expression optimized for transient transfection
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: IgG_Fc_fusion
        expression: high
        chain:
          - tag: signal_peptide_IgG
            # N-terminal secretion signal for mammalian ER/Golgi routing
          - gene:
              id: P01857
              source: uniprot
              # Human immunoglobulin G1 Fc region (hIgG1-Fc)
              # Contains N-glycosylation sites (Asn297) for therapeutic efficacy
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_target
              source: uniprot
              # User to specify target protein UniProt ID
              # e.g., PDGF, FGF, TNF-alpha, etc.

    - terminator: rrnB_T1
      # WPRE (Woodchuck Post-transcriptional Regulatory Element) optional for enhanced expression
      # Rabbit beta-globin polyA signal for mammalian stability
