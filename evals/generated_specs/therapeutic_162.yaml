construct:
  name: "mRNA_vaccine_spike_template"
  host: in_vitro
  backbone:
    # Antibiotic resistance is typically required for template plasmid propagation in E. coli
    # though it is not transcribed into the final mRNA product.
    resistance: kanamycin
    ori: pUC
    source: custom

  cassette:
    - promoter: T7  # High-efficiency viral promoter required for in vitro transcription
    
    - cistron:
        label: antigen_cistron
        expression: high
        # The tool automatically handles standard vaccine optimization (e.g., UTRs and Poly-A) 
        # when the 'in_vitro' host is selected for mRNA synthesis.
        gene:
          id: P0DTC2  # UniProt ID for SARS-CoV-2 Spike glycoprotein
          source: uniprot

    - terminator: T7term  # Standard termination for T7 RNA polymerase transcription