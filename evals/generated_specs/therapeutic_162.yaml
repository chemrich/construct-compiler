construct:
  name: "mRNA_vaccine_antigen_IVT_template"
  host: in_vitro

  backbone:
    resistance: null
    ori: null
    source: synthetic

  cassette:
    - promoter: T7

    - cistron:
        label: 5_UTR
        expression: null
        chain:
          - gene:
              id: "5_UTR_Kozak_enhanced"
              source: synthetic
              sequence: "GCCGCCACCAUGGCCGCC"

    - cistron:
        label: antigen
        expression: high
        chain:
          - gene:
              id: "target_antigen"
              source: uniprot

    - cistron:
        label: 3_UTR_polyA
        expression: null
        chain:
          - gene:
              id: "3_UTR_WPRE_polyA"
              source: synthetic
              sequence: "AAGCTTCTGACTGAATAGAGGAAGTGTTTGAGCCCCGCTAGACCCTTTTTTTTTTTTTTTTTTTTTT"

    - terminator: null
