construct:
  name: "CAR_T_cell_mRNA_construct"
  host: in_vitro

  backbone:
    resistance: none
    ori: none
    source: synthetic

  cassette:
    - promoter: T7

    - cistron:
        label: CAR
        expression: high
        chain:
          - tag: 5_UTR_Kozak
          - gene:
              id: CAR_scFv_CD28_CD3z
              source: uniprot

    - cistron:
        label: stabilization
        expression: high
        fused: false
        chain:
          - gene:
              id: PABP
              source: uniprot

    - terminator: poly_A_tail

  notes: "This construct is designed for in vitro transcription to generate mRNA for lipid nanoparticle delivery to human T-cells. The 5' Kozak sequence optimizes translation initiation in mammalian cells. PABP (poly(A) binding protein) enhances mRNA stability. No antibiotic resistance markers or viral elements are included. The poly(A) tail is essential for mRNA stability and translation efficiency in mammalian cells. The CAR gene should encode a second-generation CAR with scFv targeting domain, CD28 costimulatory domain, and CD3-zeta signaling domain."
