construct:
  name: cas9_sgrna_ivt_template
  host: in_vitro
  backbone:
    resistance: kanamycin # Standard selection for plasmid maintenance prior to IVT; omitted if linear template
    ori: pUC
  cassette:
    - promoter: T7 # Standard promoter for high-yield in vitro transcription
    - cistron:
        label: sgrna_scaffold
        expression: high
        gene:
          id: cas9_sgrna_scaffold
          source: addgene
    - terminator: T7term