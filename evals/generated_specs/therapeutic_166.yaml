construct:
  name: "yeast_lysosomal_enzyme_secretion"
  host: yeast

  backbone:
    resistance: null  # no antibiotic resistance - uses auxotrophic selection
    ori: 2micron     # yeast episomal plasmid
    source: standard

  cassette:
    - promoter: GAL1  # strong inducible promoter for high-level expression

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast secretion signal peptide
          - gene:
              id: P10744  # human beta-hexosaminidase A (hexosaminidase A)
              source: uniprot

    - terminator: CYC1_poly_A  # yeast CYC1 terminator with poly(A) signal
