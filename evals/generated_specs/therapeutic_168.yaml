construct:
  name: therapeutic_peptide_bacterial_expression
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Rule 9: Defaulting to kanamycin; antibiotic resistance is required for plasmid selection in E. coli.
    ori: pUC
  cassette:
    - promoter: tac # Non-viral bacterial promoter used to comply with the "no viral sequences" constraint.
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: short_GS
              repeats: 1
          - cleavage_site: Enterokinase # Non-viral protease cleavage site (bovine-derived) used to comply with the "no viral" constraint.
          - gene:
              id: P01275
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator used to avoid viral sequences (like T7term).