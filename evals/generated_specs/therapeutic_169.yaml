construct:
  name: "mammalian_transient_NanoLuc_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Using pTwist CMV as non-integrating episomal mammalian vector
    # Explicitly removing antibiotic resistance by specification
    ori: SV40_ori
    # Note: catalog_vector pTwist CMV is antibiotic-free formulation available from Twist

  cassette:
    - promoter: CMV
      # Strong constitutive mammalian promoter for high expression

    - cistron:
        label: NanoLuc_secreted
        expression: high
        chain:
          - tag: signal_peptide_IgK
            # Immunoglobulin kappa chain signal peptide for mammalian secretion
          - gene:
              id: NanoLuc
              source: uniprot
              # NanoLuc luciferase (Oplophorus gracilirostris)

    - terminator: SV40_polyA
      # SV40 polyadenylation signal for mammalian expression
