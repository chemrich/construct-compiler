construct:
  name: "mammalian_high_expression_bicistronic_therapeutic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: therapeutic_payload
        expression: high
        chain:
          - gene:
              id: P01584  # Human Interleukin-2 (hIL2)
              source: uniprot
          - linker:
              type: P2A
          - gene:
              id: P01588  # Human Erythropoietin (hEPO)
              source: uniprot
    - terminator: bGH_pA