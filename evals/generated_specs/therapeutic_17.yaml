```yaml
construct:
  name: dual_therapeutic_2A_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_1
        expression: high
        chain:
          - signal_peptide: IgK  # Immunoglobulin kappa light chain signal for secretion
          - gene:
              id: VEGFA
              source: uniprot
          - cleavage_peptide: P2A  # Self-cleaving 2A peptide for coordinated expression

    - cistron:
        label: therapeutic_2
        expression: high
        fused: true  # Fused via 2A peptide, but will separate post-translationally
        chain:
          - signal_peptide: IgK
          - gene:
              id: FGF2
              source: uniprot

    - terminator: SV40_polyA
```