construct:
  name: dual_therapeutic_2A_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TNF_alpha
              source: uniprot

    # 2A self-cleaving peptide spacer
    - spacer: 18  # T2A peptide sequence (18 bp encodes the minimal self-cleaving motif)

    - cistron:
        label: therapeutic_protein_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: IL_6
              source: uniprot

    - terminator: rrnB_T1
