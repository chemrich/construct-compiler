construct:
  name: dual_therapeutic_enzyme_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    # Non-viral mammalian expression vector; removing antibiotic resistance not standard for pTwist,
    # so we note this is a custom backbone requirement for the final construct.
    # In practice, the resistance cassette would be removed during synthesis.
    source: custom

  cassette:
    - promoter: CMV

    - cistron:
        label: enzyme_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P69905
              source: uniprot
        # P69905 is lactase (therapeutic enzyme example)

    - spacer: 30

    # 2A self-cleaving peptide for equimolar co-translation
    - cistron:
        label: P2A_peptide
        expression: high
        chain:
          - gene:
              id: P2A
              source: uniprot
        # P2A self-cleaves, separating the two enzymes post-translationally

    - spacer: 25

    - cistron:
        label: enzyme_2
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P04637
              source: uniprot
        # P04637 is a therapeutic protease example

    - terminator: rrnB_T1
