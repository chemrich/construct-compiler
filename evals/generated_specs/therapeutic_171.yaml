construct:
  name: "amyloid_protein_expression_high_level"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: amyloid_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ""
              source: uniprot
              # Note: User must specify UniProt ID for disease-associated amyloidogenic protein

    - terminator: rrnB_T1
