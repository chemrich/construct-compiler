construct:
  name: "clinical_delivery_hTherapeuticProtein_nonviral"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: pBR322
    source: addgene
    # Note: Antibiotic resistance gene removed for clinical safety compliance

  cassette:
    - promoter: EF1_alpha
      # EF1_alpha is a strong, ubiquitous promoter active across human tissues
      # without immunogenicity concerns associated with CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905
              source: uniprot
              # Human serum albumin as exemplary therapeutic protein
              # Substitute with target protein UniProt ID as needed

    - terminator: rrnB_T1
      # Robust termination for mammalian expression
