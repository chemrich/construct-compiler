construct:
  name: "Yamanaka_OSKM_Polycistronic_IVT"
  host: in_vitro
  backbone:
    # Kanamycin is included for the template plasmid propagation in E. coli; 
    # it is not part of the final IVT mRNA product.
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: Oct4
        expression: high
        gene:
          id: P09012
          source: uniprot
    - spacer: 30
    - cistron:
        label: Sox2
        expression: high
        fused: false
        gene:
          id: P48431
          source: uniprot
    - spacer: 30
    - cistron:
        label: Klf4
        expression: high
        fused: false
        gene:
          id: O43474
          source: uniprot
    - spacer: 30
    - cistron:
        label: c-Myc
        expression: high
        fused: false
        gene:
          id: P01106
          source: uniprot
    - terminator: T7term