construct:
  name: "Yamanaka_factors_IVT_polycistronic"
  host: in_vitro

  backbone:
    resistance: none
    ori: none
    source: synthetic

  cassette:
    - promoter: T7

    - cistron:
        label: Oct4
        expression: high
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: POU5F1
              source: uniprot

    - spacer: 30

    - cistron:
        label: Sox2
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: SOX2
              source: uniprot

    - spacer: 30

    - cistron:
        label: Klf4
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: KLF4
              source: uniprot

    - spacer: 30

    - cistron:
        label: c_Myc
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: TEV
          - gene:
              id: MYC
              source: uniprot

    - terminator: rrnB_T1
