construct:
  name: human_scaffold_protein_soluble_expression
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: human_scaffold_protein
              source: uniprot

    - terminator: rrnB_T1
