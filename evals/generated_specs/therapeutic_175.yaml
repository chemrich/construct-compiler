construct:
  name: "mammalian_bispecific_diabody_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # No antibiotic resistance per requirements
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: bispecific_diabody
        expression: high
        chain:
          - tag: secretion_signal  # Signal peptide for ER targeting and secretion
          - gene:
              id: bispecific_scFv_diabody
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification from secreted protein

    - terminator: bGH_polyA  # Mammalian polyadenylation signal for transient expression
