construct:
  name: "human_tRNA_nonsense_suppressor"
  host: HEK293
  backbone:
    resistance: none  # User requested no antibiotic markers
    ori: pUC
    source: custom
  cassette:
    - promoter: U6  # Standard human RNA polymerase III promoter for tRNA expression
    - cistron:
        label: suppressor_tRNA
        expression: high
        gene:
          id: tRNA_Ser_CUA
    - terminator: polyT  # Standard Pol III termination signal (sequence of T's)