construct:
  name: "mammalian_tRNA_suppressor_u6_driven"
  host: HEK293

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pUC  # Mammalian expression vector, episomal replication
    source: addgene

  cassette:
    - promoter: U6  # RNA Polymerase III promoter for stable tRNA expression

    - cistron:
        label: suppressor_tRNA
        expression: high
        gene:
          id: "amber_suppressor_tRNA"
          source: uniprot
          # Modified human tRNA(CUA) with UAG suppressor activity
          # User should provide the actual tRNA sequence or UniProt ID
          # This construct uses U6 for constitutive, stable expression

    - terminator: "polIII_terminator"  # RNA Pol III terminator (string of U residues typically)
