construct:
  name: "HEK293_alphagal_lysosomal_therapy"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # No antibiotic resistance for safety
    ori: pUC

  cassette:
    - promoter: EF1_alpha  # Strong ubiquitous mammalian promoter

    - cistron:
        label: alphagal_a
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - secretion_signal: SP  # Alpha-gal A is lysosomal; signal peptide for trafficking
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: GLA  # Alpha-galactosidase A
              source: uniprot

    - terminator: rrnB_T1
