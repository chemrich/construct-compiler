construct:
  name: "GLA_NonViral_Gene_Therapy"
  host: HEK293
  backbone:
    resistance: none # Antibiotic resistance genes excluded for safety as requested
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Strong ubiquitous human promoter used to avoid viral elements
    - cistron:
        label: alpha_galactosidase_A
        gene:
          id: P06280
          source: uniprot
    - terminator: hGH_PA # Human growth hormone polyadenylation signal (non-viral)