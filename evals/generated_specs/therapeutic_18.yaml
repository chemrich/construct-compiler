construct:
  name: "human_enhancer_trap_mEGFP"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: minCMV  # Minimal CMV promoter lacking enhancer elements for enhancer-trap readout
    - cistron:
        label: reporter
        expression: low
        chain:
          - tag: NLS
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: bGH_pA