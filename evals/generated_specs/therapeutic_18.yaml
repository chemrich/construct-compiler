construct:
  name: "enhancer_trap_reporter_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: minimal_SV40
      # Minimal SV40 promoter with minimal transcriptional activity unless adjacent to enhancer

    - cistron:
        label: reporter
        expression: low
        chain:
          - tag: NLS
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: SV40_polyA
