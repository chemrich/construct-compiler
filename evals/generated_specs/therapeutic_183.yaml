construct:
  name: "doxycycline_inducible_ProteinA_ProteinB"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE3G  # Tetracycline Response Element for doxycycline induction

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: T2A  # Self-cleaving peptide for effective separation
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
