construct:
  name: "yeast_scFv_secretion_construct"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: scFv_VH_VL
              source: uniprot
              codon_optimization: yeast

    - terminator: CYC1
