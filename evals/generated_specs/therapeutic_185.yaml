construct:
  name: "Cas9_sgRNA_GeneZ_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9_nuclear
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: bGH_polyA

    - spacer: 50

    - promoter: U6

    - gene:
        id: sgRNA_GeneZ
        source: synthetic
        description: "U6-driven sgRNA targeting GeneZ"

    - terminator: U6_terminator
