construct:
  name: "HRE_mCherry_reporter_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pUC

  cassette:
    - promoter: HRE
      # Hypoxia-responsive element driving expression under hypoxic conditions

    - cistron:
        label: mCherry_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
