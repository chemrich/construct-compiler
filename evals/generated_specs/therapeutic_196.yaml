construct:
  name: "inducible_CytokineC_secretion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: TRE_tight
      # TRE (Tetracycline Response Element) for ligand-inducible (doxycycline) control

    - cistron:
        label: CytokineC_secreted
        expression: high
        chain:
          - tag: signal_peptide_IgG_Fc
            # Signal peptide for ER targeting and secretion
          - gene:
              id: CytokineC
              source: uniprot

    - terminator: poly_A_signal_BGH
