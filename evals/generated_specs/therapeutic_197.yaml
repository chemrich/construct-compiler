construct:
  name: "therapeutic_peptide_carrier_fusion"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: carrier_protein
              source: uniprot

    - terminator: rrnB_T1
