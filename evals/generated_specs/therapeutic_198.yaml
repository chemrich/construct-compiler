construct:
  name: "bicistronic_EnzymeZ_GFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null

  cassette:
    - promoter: CMV

    - cistron:
        label: EnzymeZ
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeZ
              source: uniprot

    - IRES: EMCV  # Encephalomyocarditis virus IRES for cap-independent translation

    - cistron:
        label: GFP
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase

    - terminator: polyA  # Poly(A) tail for mRNA stability in mammalian cells
