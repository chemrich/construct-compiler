construct:
  name: "yeast_FabF_secreted_purification"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: FabF
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: FabF
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - cleavage_site: Factor_Xa

    - terminator: rrnB_T1
