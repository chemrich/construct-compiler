```yaml
construct:
  name: yeast_vaccine_antigen_his_tagged
  host: yeast

  backbone:
    resistance: kanamycin  # for E. coli cloning steps
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P0DTC2  # SARS-CoV-2 spike protein RBD as example antigen
              source: uniprot

    - terminator: CYC1_T
```