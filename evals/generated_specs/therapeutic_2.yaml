construct:
  name: yeast_vaccine_antigen_soluble
  host: yeast

  backbone:
    catalog_vector: pYES2
    ori: 2_micron
    resistance: ura3
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigen_consensus
              source: uniprot

    - spacer: 25

    - cistron:
        label: solubility_enhancer
        expression: medium
        fused: false
        gene:
          id: MBP
          source: uniprot

    - terminator: CYC1
