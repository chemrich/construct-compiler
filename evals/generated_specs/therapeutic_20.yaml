construct:
  name: human_therapeutic_enzyme_production
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    # Note: pET-28b uses kanamycin resistance for selection during cloning.
    # For final construct without antibiotic markers, this would be removed
    # in downstream processing (e.g., via site-specific recombination or
    # vector modification). This spec assumes selection phase only.

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P12345
              source: uniprot
              # Replace P12345 with actual human enzyme UniProt ID

    - terminator: rrnB_T1
