construct:
  name: "secreted_antibody_fragment_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    source: addgene
    # Note: pTwist CMV is mammalian-optimized with no antibiotic resistance markers
    # and uses SV40 ori (non-viral origin compatible with mammalian expression)

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for secretion
          - gene:
              id: scFv_or_Fab  # User to provide specific antibody sequence ID or UniProt accession
              source: uniprot
          - solubility_tag: Protein_disulfide_isomerase  # PDI for enhanced folding and disulfide bond formation
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His tag for purification via affinity chromatography

    - terminator: SV40_poly_A  # Mammalian polyadenylation signal for mRNA stability and translation efficiency
