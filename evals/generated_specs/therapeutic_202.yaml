construct:
  name: "Non_Viral_Cas9_gRNA_IVT_Template"
  host: in_vitro
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: cas9_protein
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: Q99ZW2
              source: uniprot
    - spacer: 30
    - cistron:
        label: gRNA_scaffold
        expression: low
        fused: false
        gene:
          id: sgRNA_scaffold
    - terminator: T7term