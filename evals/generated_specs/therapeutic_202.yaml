construct:
  name: "in_situ_Cas9_gRNA_RNA_therapeutic"
  host: in_vitro

  backbone:
    resistance: null
    ori: null
    source: null

  cassette:
    - promoter: T7

    - cistron:
        label: Cas9_mRNA
        expression: high
        chain:
          - tag: 5_UTR_optimized
          - tag: Kozak
          - gene:
              id: S_pyogenes_Cas9_codon_optimized
              source: uniprot
          - tag: 3_UTR_hSV40pA

    - spacer: 25

    - element:
        label: gRNA_scaffold
        type: guide_RNA
        sequence_context: "U6 promoter-driven or T7-driven gRNA with optimized stem-loop structure for disease allele targeting"

    - modification:
        label: mRNA_enhancements
        features:
          - "7-methylguanosine_Cap"
          - "Poly_A_tail_120nt"
          - "2_O_methyl_pseudouridine_substitution_for_stability"
          - "codon_optimization_for_human_expression"

    - terminator: T7term
