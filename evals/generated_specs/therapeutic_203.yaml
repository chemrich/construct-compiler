construct:
  name: "yeast_secreted_vaccine_antigen_hisTag"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: alpha_factor_signal_peptide
          - tag: 6xHis
          - gene:
              id: vaccine_antigen
              source: uniprot
              codon_optimization: yeast

    - terminator: CYC1_terminator
