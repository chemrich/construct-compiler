construct:
  name: "dual_therapeutic_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_A
              source: uniprot

    - spacer: "P2A"
      # Comment: P2A self-cleaving peptide enables stoichiometric separation of two proteins from a single transcript without viral components

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_B
              source: uniprot

    - terminator: BGH_pA
      # Comment: BGH polyadenylation signal provides robust 3' end processing and mRNA stability in mammalian cells
