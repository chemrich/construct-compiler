construct:
  name: "prophylactic_mrna_vaccine_spike"
  host: in_vitro
  backbone:
    resistance: kanamycin # Kanamycin is used for DNA template propagation in E. coli; the IVT mRNA product is marker-free.
    ori: pUC
    source: custom
  cassette:
    - promoter: T7
    - cistron:
        label: viral_surface_antigen
        expression: high
        gene:
          id: P0DTC2
          source: uniprot
    - terminator: T7term # Standard terminator for T7-driven in vitro transcription templates