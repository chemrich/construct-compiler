construct:
  name: environmental_diagnostic_circuit
  host: e_coli

  backbone:
    resistance: null
    ori: pUC
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
