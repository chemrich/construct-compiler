construct:
  name: "environmental_diagnostic_sensor"
  host: e_coli
  backbone:
    resistance: kanamycin # Kanamycin provided as default selection; plasmid-based systems typically require a resistance marker for maintenance.
    ori: p15A
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1