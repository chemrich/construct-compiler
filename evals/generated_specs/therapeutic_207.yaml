construct:
  name: "engineered_TCR_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: TCR_alpha_beta
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TCR_alpha_engineered
              source: uniprot
          - cleavage_site: P2A
          - gene:
              id: TCR_beta_engineered
              source: uniprot

    - terminator: WPRE_polyA
