construct:
  name: "therapeutic_enzyme_with_chaperonin"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: chaperonin
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: groES
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: P12345
              source: uniprot

    - terminator: rrnB_T1
