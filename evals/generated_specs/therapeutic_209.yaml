construct:
  name: "liver_specific_human_pah_gene_therapy"
  host: mammalian
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: Albumin  # Liver-specific promoter for targeted expression
    - cistron:
        label: therapeutic_payload
        expression: high
        gene:
          id: PAH  # Human Phenylalanine Hydroxylase
          source: uniprot
    - terminator: bGH_pA  # Bovine growth hormone polyadenylation signal for mammalian stability