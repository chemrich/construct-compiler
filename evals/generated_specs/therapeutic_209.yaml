construct:
  name: "gene_therapy_payload_lipid_nanoparticle"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # Tissue-specific mammalian promoter; EF1_alpha provides constitutive expression
      # Alternative: use tissue-specific promoter if targeting specific tissue

    - cistron:
        label: therapeutic_gene
        expression: high
        chain:
          - gene:
              id: HEXA
              source: uniprot
              # HEXA (hexosaminidase subunit alpha) as exemplar human therapeutic gene
              # User should replace with their target gene ID

    - terminator: polyA_signal
      # bGH polyadenylation signal for mammalian expression and mRNA stability
      # Critical for non-viral LNP delivery to ensure mRNA stability and translation efficiency
