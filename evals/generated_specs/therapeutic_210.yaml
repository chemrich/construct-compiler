construct:
  name: mammalian_secreted_luciferase_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: secreted_luciferase
        expression: high
        chain:
          - signal_peptide: IgE_signal
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - polyadenylation: SV40_poly_A
