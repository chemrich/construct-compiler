construct:
  name: "S_cerevisiae_bacterial_enzyme_biosynthesis"
  host: yeast

  backbone:
    resistance: none  # no antibiotic resistance per requirements
    ori: 2_micron    # S. cerevisiae autonomous replication sequence
    source: addgene

  cassette:
    - promoter: GAL1  # strong, inducible yeast promoter

    - cistron:
        label: bacterial_enzyme
        expression: high
        chain:
          - gene:
              id: bacterial_enzyme_codon_optimized
              source: uniprot
              codon_optimization: saccharomyces_cerevisiae

    - terminator: CYC1  # strong S. cerevisiae transcription terminator
