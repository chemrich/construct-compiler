construct:
  name: "inducible_cytotoxic_therapeutic_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
      label: rtTA_expression

    - cistron:
        label: rtTA
        expression: high
        chain:
          - gene:
              id: rtTA2S_M2
              source: uniprot
              # rtTA2S-M2: reverse tetracycline-controlled transactivator, improved variant

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: TRE_tight
      label: therapeutic_protein_inducible

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_cds
              source: uniprot

    - terminator: SV40_polyA
      comment: "SV40 polyA signal for 3' end processing and mRNA stability"
