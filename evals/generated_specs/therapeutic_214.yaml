construct:
  name: inducible_nonviral_cytotoxic_system
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha  # Human promoter used to avoid viral elements like CMV
    - cistron:
        label: tet_on_regulator
        expression: medium
        gene:
          id: rtTA3
          source: uniprot
    - terminator: hGH_pA  # Human growth hormone polyadenylation signal
    - promoter: TRE3G  # Tet-responsive promoter for tight inducible control
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P00588  # Diphtheria toxin fragment A (DTA)
              source: uniprot
    - terminator: bGH_pA  # Bovine growth hormone polyadenylation signal