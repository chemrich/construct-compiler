construct:
  name: "dual_protease_substrate_expression"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protease
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TEV_protease
              source: uniprot

    - spacer: 25

    - cistron:
        label: substrate
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: target_substrate
              source: uniprot

    - terminator: rrnB_T1
