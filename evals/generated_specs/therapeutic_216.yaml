construct:
  name: "CHO_therapeutic_scFv_secretion"
  host: CHO
  backbone:
    resistance: none  # User requested: No antibiotic resistance genes allowed
    ori: pUC         # Bacterial origin (non-viral) for plasmid maintenance
    source: custom
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: therapeutic_scFv
        expression: high
        chain:
          - tag: IgK_leader  # Mammalian secretion signal peptide
          - solubility_tag: SUMO  # Facilitates robust protein folding
          - gene:
              id: therapeutic_scFv
          - tag: 6xHis  # For purification and detection
    - terminator: bGH_polyA  # Robust mammalian polyadenylation signal