construct:
  name: "mammalian_nonviral_circRNA_vector"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted CMV with EF1_alpha to ensure a completely non-viral construct
    - cistron:
        label: therapeutic_circRNA_template
        expression: high
        gene:
          id: circRNA_therapeutic_scaffold
          source: uniprot
    - terminator: bGH_polyA  # Standard non-viral mammalian polyadenylation signal