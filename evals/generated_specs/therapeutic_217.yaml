construct:
  name: "therapeutic_circRNA_expression_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - element:
        type: intron
        label: 5prime_intron
        source: synthetic
        # Flanking intron for circularization via back-splicing

    - rna_element:
        label: therapeutic_circRNA
        type: noncoding_RNA
        sequence_source: custom
        # User-supplied therapeutic RNA sequence (e.g., miRNA sponge, translation inhibitor)
        # Compiler will accept the raw RNA sequence in downstream specification

    - element:
        type: intron
        label: 3prime_intron
        source: synthetic
        # Flanking intron enables back-splicing to generate circular form

    - element:
        type: ribozyme
        label: HDV_ribozyme
        # Hammerhead or hepatitis delta virus ribozyme for self-cleavage
        source: synthetic

    - signal:
        type: polyadenylation
        label: bGH_pA
        # Bovine growth hormone polyadenylation signal for mRNA stability

    - terminator: synthetic_terminator
