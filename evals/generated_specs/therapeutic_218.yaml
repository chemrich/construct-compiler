construct:
  name: "e_coli_surface_display_antigen"
  host: e_coli_bl21

  backbone:
    resistance: null  # No antibiotic resistance as specified
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - rbs: BBa_B0030

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: OmpA_anchor
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigenic_peptide
              source: uniprot

    - terminator: rrnB_T1
