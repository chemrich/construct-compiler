construct:
  name: "Lactobacillus_metabolite_producer"
  host: bacillus
  
  backbone:
    resistance: null
    ori: pBAC_derived
    source: custom
    # Note: Using bacillus as closest match for Gram-positive LAB; pBAC represents
    # Lactobacillus-compatible low-copy plasmid backbone without antibiotic markers
  
  cassette:
    - promoter: J23100
      # Strong constitutive promoter from BioBrick parts, functional in LAB species
    
    - cistron:
        label: metabolite_enzyme
        expression: high
        chain:
          - gene:
              id: LAC_metabolite_synthase_codon_optimized
              source: custom
              # Represents codon-optimized enzyme for target metabolite production
              # (user to specify exact enzyme and optimize for Lactobacillus codon bias)
    
    - terminator: rrnB_T1
      # Strong transcriptional terminator compatible with Gram-positive bacteria
