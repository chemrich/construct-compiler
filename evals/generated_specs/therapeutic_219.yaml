construct:
  name: "lactobacillus_metabolite_producer"
  host: lactobacillus
  backbone:
    # Rule 12: User requested no antibiotic resistance for safety in a probiotic strain.
    resistance: none
    ori: pSH71
    source: custom
  cassette:
    - promoter: P_slpA # Strong constitutive promoter from Lactobacillus acidophilus S-layer protein
    - cistron:
        label: bsh_enzyme
        expression: high
        gene:
          id: F9UST3
          source: uniprot
    - terminator: rrnB_T1