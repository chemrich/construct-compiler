construct:
  name: "scFv_therapeutic_purification_construct"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    # Note: pET-28b(+) contains kanamycin resistance for selection during cloning.
    # For final therapeutic production, this plasmid would be removed via curing
    # or replaced with a resistance-marker-free derivative (e.g., pET-28b without kanR).
    # This spec reflects the cloning/expression phase; downstream processing removes the resistance gene.

  cassette:
    - promoter: T7lac
      # T7lac allows tight control with IPTG induction for high-level scFv expression

    - cistron:
        label: scFv_therapeutic
        expression: high
        chain:
          - tag: 6xHis
            # Enables Ni-NTA affinity purification
          - cleavage_site: TEV
            # TEV protease recognition site for clean tag removal post-purification
          - gene:
              id: scFv_therapeutic
              source: uniprot
              # User must provide the scFv sequence via UniProt ID or direct submission

    - terminator: rrnB_T1
      # Strong transcription terminator ensures efficient mRNA processing
