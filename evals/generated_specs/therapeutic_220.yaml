construct:
  name: "therapeutic_scfv_clean_production"
  host: e_coli_bl21
  backbone:
    resistance: none  # Constraint: No antibiotic resistance genes permitted for therapeutic compliance; requires alternative selection (e.g., auxotrophy)
    ori: pBR322
    source: custom
  cassette:
    - promoter: tac  # Constraint: Non-viral bacterial promoter used instead of phage-derived T7
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P01730
              source: uniprot
    - terminator: rrnB_T1  # Constraint: Non-viral bacterial terminator used instead of T7term