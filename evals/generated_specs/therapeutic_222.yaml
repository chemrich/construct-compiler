construct:
  name: "yeast_surface_antigen_display"
  host: yeast

  backbone:
    resistance: null  # No antibiotic resistance; using URA3 auxotrophic selection instead
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigen_target
              source: uniprot
          - tag: Strep-II
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
