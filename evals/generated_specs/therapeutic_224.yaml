construct:
  name: "T_cell_dual_therapeutic_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: IRES_element
        expression: high
        fused: false
        chain:
          - gene:
              id: EMCV_IRES
              source: uniprot

    - spacer: 25

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
