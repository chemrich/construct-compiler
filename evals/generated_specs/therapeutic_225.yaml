construct:
  name: "therapeutic_fusion_protein_soluble"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    # Non-antibiotic selection: using pBR322 ori with chloramphenicol-free vector
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: "targeting_ligand"
              source: uniprot
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: "therapeutic_enzyme"
              source: uniprot

    - terminator: rrnB_T1
