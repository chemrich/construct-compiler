construct:
  name: "IVT_mRNA_Vaccine_Antigen_Template"
  host: in_vitro
  backbone:
    resistance: none # Specified no antibiotic resistance genes for IVT template
    source: custom
  cassette:
    - promoter: T7
    - cistron:
        label: viral_antigen
        expression: high
        gene:
          id: P0DTC2
          source: uniprot
    - terminator: T7term