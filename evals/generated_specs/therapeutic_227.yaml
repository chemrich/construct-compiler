construct:
  name: "lung_epithelial_therapeutic_scFv_delivery"
  host: mammalian
  backbone:
    resistance: none # Substitution: Antibiotic-free backbone used for clinical safety as requested
    ori: pUC
    source: custom
  cassette:
    - promoter: SP-B # Strong, lung epithelial-specific Surfactant Protein B promoter
    - cistron:
        label: therapeutic_scFv
        expression: high
        chain:
          - gene:
              id: scFv_anti_EGFR
              source: uniprot
    - terminator: bGH_pA