construct:
  name: "lung_epithelial_antibody_fragment"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: pUC
    source: addgene

  cassette:
    - promoter: CC10  # CC10 (Club cell protein 10) is a lung epithelial-specific promoter

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: signal_peptide_SP_B  # N-terminal secretion signal for lung epithelial secretion
          - gene:
              id: scFv_therapeutic  # Single-chain variable fragment (antibody)
              source: uniprot
          - tag: 6xHis  # C-terminal His tag for purification

    - terminator: polyA_signal  # SV40 polyadenylation signal for mammalian expression
