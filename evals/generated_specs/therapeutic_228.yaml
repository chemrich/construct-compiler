construct:
  name: "synthetic_promoter_evaluation_fibroblast"
  host: mammalian
  backbone:
    resistance: none  # User requested antibiotic-free construct
    ori: pUC
    source: custom
  cassette:
    - promoter: synthetic_promoter  # Novel synthetic promoter as per request
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_pA  # Non-viral mammalian polyadenylation signal