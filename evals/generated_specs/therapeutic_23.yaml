construct:
  name: "therapeutic_protein_solubility_enhanced"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: UNIPROT_ID_PLACEHOLDER
              source: uniprot

    - terminator: rrnB_T1
