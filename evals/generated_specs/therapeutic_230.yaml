construct:
  name: mitochondrial_therapeutic_enzyme_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No resistance marker for clinical safety

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: mitochondrial_enzyme
        expression: high
        chain:
          - tag: MTS_Cox8a  # N-terminal mitochondrial targeting sequence from Cox8a
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P12345
              source: uniprot
              # Replace P12345 with actual therapeutic enzyme UniProt ID

    - terminator: bGH_polyA
