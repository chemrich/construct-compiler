construct:
  name: "mito_therapeutic_enzyme_SOD2"
  host: HEK293
  backbone:
    resistance: none # Clinical safety: exclusion of antibiotic resistance genes for human therapeutic use.
    ori: pBR322
    source: custom
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: SOD2_expression
        expression: high
        chain:
          - tag: MTS # Mitochondrial Targeting Sequence (e.g., from SOD2 or COX4)
          - gene:
              id: SOD2
              source: uniprot
    - terminator: bGH_polyA