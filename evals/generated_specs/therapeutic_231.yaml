construct:
  name: "bacterial_toxin_therapeutic_delivery"
  host: e_coli_bl21_de3

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: toxin
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: toxin_modified
              source: uniprot

    - terminator: rrnB_T1
