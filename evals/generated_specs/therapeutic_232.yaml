construct:
  name: yeast_two_hybrid_bait_dbd_fusion
  host: yeast

  backbone:
    resistance: null
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: bait_dbd
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lexA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: bait_protein
              source: uniprot

    - terminator: CYC1
