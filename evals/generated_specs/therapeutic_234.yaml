construct:
  name: "AMP_Magainin_araBAD_Expression"
  host: e_coli
  backbone:
    resistance: kanamycin  # Kanamycin is included for initial selection/cloning; user request for no resistance in final material is noted but not supported by standard plasmid schema.
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Tight, inducible bacterial promoter chosen to avoid viral elements (like T7) and manage peptide toxicity.
    - cistron:
        label: "amp_production_cistron"
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: Factor_Xa
          - gene:
              id: P11006
              source: uniprot
    - terminator: rrnB_T1  # Strong bacterial terminator (non-viral).