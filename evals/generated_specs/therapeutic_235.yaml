construct:
  name: "mammalian_therapeutic_CPP_delivery"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_CPP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TAT_CPP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: human_growth_hormone
              source: uniprot

    - terminator: rrnB_T1
