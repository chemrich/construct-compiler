construct:
  name: "therapeutic_shRNA_expression_plasmid"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: This is a mammalian expression vector without antibiotic resistance
    # For a true resistance-free design, custom backbone should specify:
    # resistance: none
    # ori: pUC
    # source: custom

  cassette:
    - promoter: U6
      # U6 is a human RNA Pol III promoter optimal for shRNA expression

    - cistron:
        label: shRNA_oncogene
        expression: high
        chain:
          - gene:
              id: shRNA_KRAS_targeting
              # shRNA sequence targeting KRAS oncogene
              # User should provide specific 21bp hairpin sequence
              source: custom
              # Typical structure: 5'-promoter-sense-loop-antisense-terminator-3'

    - terminator: U6_terminator
      # Pol III termination signal (4-5 T's for natural termination)
