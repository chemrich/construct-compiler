construct:
  name: "therapeutic_shRNA_non_viral_plasmid"
  host: HEK293
  backbone:
    resistance: none # User specified no antibiotic resistance genes; requires alternative selection or transient use
    ori: pUC
    source: custom
  cassette:
    - promoter: U6 # Human RNA Pol III promoter for shRNA expression
    - cistron:
        label: shRNA_expression_unit
        gene:
          id: oncogene_targeting_shRNA
          source: custom
    - terminator: rrnB_T1