construct:
  name: yeast_secreted_oph_bioremediation
  host: yeast
  backbone:
    resistance: URA3  # Nutritional marker used instead of antibiotic resistance for biosafety and environmental compliance
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - tag: alpha_factor  # Yeast alpha-mating factor secretion signal
          - gene:
              id: P0A434
              source: uniprot
    - terminator: CYC1