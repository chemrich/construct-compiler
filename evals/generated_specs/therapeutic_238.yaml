construct:
  name: "non_viral_constitutive_aso_expression"
  host: mammalian
  backbone:
    resistance: none # Explicitly removed antibiotic resistance marker per user request
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Human EF1-alpha promoter used as a non-viral constitutive alternative to CMV
    - cistron:
        label: antisense_rna_payload
        expression: high
        gene:
          id: antisense_target_sequence
    - terminator: hGH_polyA # Human growth hormone polyadenylation signal used as a non-viral terminator