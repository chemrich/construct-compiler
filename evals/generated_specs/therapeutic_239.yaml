construct:
  name: "dual_therapeutic_2A_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_X
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_x_therapeutic
              source: uniprot

    - spacer: 21

    - element: P2A_self_cleaving_peptide
      # Self-cleaving 2A sequence (e.g., Porcine Teschovirus-1 2A) inserted here
      # This enables ribosomal skipping, releasing Protein X
      # No additional RBS needed; ribosomal skipping produces stoichiometric amounts

    - cistron:
        label: Protein_Y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: protein_y_therapeutic
              source: uniprot

    - terminator: rrnB_T1
