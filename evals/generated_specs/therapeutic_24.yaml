construct:
  name: yeast_minimal_biosynthesis_pathway
  host: yeast

  backbone:
    resistance: URA3
    ori: 2micron
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: enzyme1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P69527
              source: uniprot

    - spacer: 25

    - cistron:
        label: enzyme2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: P00924
              source: uniprot

    - terminator: CYC1
