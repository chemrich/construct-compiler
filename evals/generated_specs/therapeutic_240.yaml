construct:
  name: "hEnzymeX_HighYield_Intracellular_Production"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Substitution: Kanamycin included to satisfy tool requirements; antibiotic-free selection (e.g., auxotrophy or TA systems) recommended for clinical production.
    ori: pBR322
  cassette:
    - promoter: J23100 # Robust constitutive promoter for non-inducible expression and avoidance of viral elements (e.g., T7).
    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - gene:
              id: hEnzymeX
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator; non-viral origin.