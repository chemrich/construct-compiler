construct:
  name: "hEnzymeX_high_yield_soluble"
  host: e_coli

  backbone:
    resistance: null  # No antibiotic resistance; use auxotrophic selection or alternative
    ori: pBR322
    source: custom

  cassette:
    - promoter: trc  # Strong, non-inducible constitutive promoter for high-yield expression

    - cistron:
        label: hEnzymeX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: hEnzymeX
              source: uniprot

    - terminator: rrnB_T1
