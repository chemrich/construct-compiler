construct:
  name: CAR_TargetY_transient_T_cell
  host: HEK293

  backbone:
    # Non-viral backbone for mammalian transient expression
    # No antibiotic resistance; selection via post-transfection sorting
    ori: pUC
    source: synthetic

  cassette:
    - promoter: EF1_alpha
      # EF1α provides strong, constitutive expression in T cells
      # Non-viral, minimizes immunogenicity compared to CMV

    - cistron:
        label: CAR_TargetY
        expression: high
        chain:
          - linker:
              type: Kozak
              # Kozak sequence ensures efficient translation initiation in mammalian cells
          - gene:
              id: CAR_TargetY
              # User-defined CAR construct; compiler will handle sequence resolution
              source: uniprot

    - terminator: polyA_BGH
      # BGH polyadenylation signal; standard for mammalian transient expression
      # Enhances mRNA stability and translation efficiency
