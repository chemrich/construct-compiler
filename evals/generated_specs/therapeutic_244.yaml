construct:
  name: yeast_vaccine_antigen_Q_secreted
  host: yeast

  backbone:
    resistance: URA3  # yeast auxotrophic marker, selects for uracil prototrophy
    ori: 2_micron    # high-copy yeast plasmid origin
    source: addgene

  cassette:
    - promoter: GAL1  # strong, inducible yeast promoter (repressed by glucose, induced by galactose)

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - secretion_signal: alpha_factor  # yeast alpha-mating factor N-terminal secretion signal
          - gene:
              id: VaccineAntigenQ
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV  # post-purification cleavage to remove tag
          - tag: 6xHis  # C-terminal histidine tag for affinity purification

    - terminator: CYC1  # yeast transcription terminator (CYC1 polyadenylation signal)
