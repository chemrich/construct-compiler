construct:
  name: "mRNA_Therapeutic_ProteinK"
  host: in_vitro
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: T7
    - cistron:
        label: protein_k_payload
        expression: high
        gene:
          id: ProteinK
          source: uniprot
    - terminator: polyA_120 # Standard 120bp poly-A tail for IVT mRNA stability and translation efficiency