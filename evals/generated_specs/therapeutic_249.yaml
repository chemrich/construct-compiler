construct:
  name: bicistronic_ProteinP_ProteinQ_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No resistance marker for transient transfection; backbone provides backbone elements only

  cassette:
    - promoter: EF1_alpha
      # Strong, constitutive mammalian promoter (alternative to CMV); both are suitable

    - cistron:
        label: ProteinP
        expression: high
        chain:
          - gene:
              id: ProteinP
              source: uniprot
          - solubility_tag: MBP

    # IRES element to enable cap-independent translation of second cistron
    - spacer: 90
      # Represents IRES insertion point; actual IRES sequence (e.g., EMCV-IRES, ~600 bp) 
      # should be added at this junction in the compiled vector

    - cistron:
        label: ProteinQ
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinQ
              source: uniprot

    - terminator: rrnB_T1
