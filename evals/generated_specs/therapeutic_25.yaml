construct:
  name: "mammalian_nuclear_therapeutic_effector"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # No antibiotic resistance gene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: effector
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: therapeutic_effector
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
