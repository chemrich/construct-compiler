  cassette:
    - promoter: CMV

    - cistron:
        label: ExosomeCargoS_CD63
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ExosomeCargoS
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CD63
              source: uniprot

    - terminator: rrnB_T1
