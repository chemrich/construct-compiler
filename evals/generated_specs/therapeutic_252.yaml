construct:
  name: "TherapeuticPeptideT_2A_scaffold"
  host: e_coli_bl21_de3

  backbone:
    resistance: spectinomycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 8xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: scaffold_protein
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_peptide
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A_self_cleaving
          - gene:
              id: TherapeuticPeptideT
              source: uniprot

    - terminator: rrnB_T1
