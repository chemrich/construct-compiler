construct:
  name: "sgRNA_TargetU_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: sgRNA_TargetU
        expression: high
        chain:
          - gene:
              id: sgRNA_TargetU
              source: uniprot
              # Note: sgRNA sequence should be designed targeting the specific genomic locus
              # Standard 20bp guide sequence + PAM context for SpCas9

    - terminator: U6_poly_T
