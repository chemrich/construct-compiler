construct:
  name: "yeast_pH_sensitive_secreted_therapeutic"
  host: yeast

  backbone:
    resistance: URA3  # auxotrophic marker for S. cerevisiae selection
    ori: 2micron      # high-copy yeast plasmid origin
    source: addgene

  cassette:
    - promoter: PHO5  # pH-responsive promoter; activated under low-phosphate/acidic conditions

    - cistron:
        label: pH_sensitive_therapeutic
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast secretion signal peptide (N-terminal)
          - gene:
              id: pH_SensitiveProteinV
              source: uniprot
          - cleavage_site: Kex2  # yeast-compatible protease cleavage to remove signal peptide
          - tag: 6xHis  # C-terminal His tag for purification

    - terminator: CYC1  # S. cerevisiae transcription terminator
