construct:
  name: "dual_therapeutic_mammalian_expression"
  host: HEK293

  backbone:
    resistance: null  # Clinical safety: no antibiotic marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha
    
    - cistron:
        label: therapeutic_gene_Y
        expression: high
        chain:
          - gene:
              id: TherapeuticGeneY
              source: uniprot

    - terminator: SV40_poly_A

    - spacer: 50

    - promoter: CMV

    - cistron:
        label: therapeutic_gene_Z2
        expression: high
        chain:
          - gene:
              id: TherapeuticGeneZ2
              source: uniprot

    - terminator: BGH_poly_A

    - spacer: 100

    - promoter: SV40_early
    
    - cistron:
        label: selection_marker
        expression: medium
        chain:
          - gene:
              id: DHFR
              source: uniprot

    - terminator: SV40_poly_A
