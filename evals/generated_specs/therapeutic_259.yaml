construct:
  name: "CHO_humanized_Fab_secretion_dual_promoter"
  host: CHO

  backbone:
    resistance: null  # No antibiotic resistance; using metabolic selection instead
    ori: null  # Mammalian episomal or integration-ready backbone
    source: addgene
    # Note: This backbone supports stable integration and includes DHFR (dihydrofolate reductase) 
    # for methotrexate-based metabolic selection in CHO cells

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: Fab_light_chain
        expression: high
        chain:
          - tag: signal_peptide_SP1  # Mammalian secretion signal (SP1 from immunoglobulin light chain)
          - gene:
              id: FabFragmentB_light_chain
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 100

    - promoter: EF1_alpha

    - cistron:
        label: Fab_heavy_chain
        expression: high
        chain:
          - tag: signal_peptide_SP2  # Mammalian secretion signal (SP2 from immunoglobulin heavy chain)
          - gene:
              id: FabFragmentB_heavy_chain
              source: uniprot

    - terminator: SV40_polyA
