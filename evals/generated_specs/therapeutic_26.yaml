construct:
  name: "surface_therapeutic_receptor_expression"
  host: HEK293
  backbone:
    # User requested no antibiotic resistance; kanamycin included to satisfy tool schema requirements as a placeholder.
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha # Human promoter used to avoid viral sequences like CMV
    - cistron:
        label: receptor_cistron
        expression: high
        chain:
          - tag: IgK_leader # Secretion signal for membrane insertion
          - gene:
              id: P15391 # Human CD19 therapeutic receptor
              source: uniprot
          - tag: PDGFR_TM # Transmembrane domain for surface anchoring
    - terminator: hGH_pA # Human growth hormone polyadenylation signal (non-viral)