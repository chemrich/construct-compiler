construct:
  name: "mammalian_surface_receptor_display"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: surface_receptor
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: IgG_leader
          - gene:
              id: EGFR_ectodomain
              source: uniprot
          - transmembrane_domain: PDGFR_TM
          - gene:
              id: CD3zeta_cytoplasmic
              source: uniprot

    - terminator: BGH_poly_A
