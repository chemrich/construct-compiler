construct:
  name: "hGF_analog_therapeutic_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance gene per requirements
    ori: pBR322
    source: addgene
    # Note: Construct uses non-selective survival; user must implement alternative selection strategy

  cassette:
    - promoter: T7lac

    - cistron:
        label: hGF_analog
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: human_growth_factor_analog
              source: uniprot

    - terminator: rrnB_T1
