construct:
  name: dCas9_activator_gRNA_HEK293
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pUC
    # No resistance marker as per requirement

  cassette:
    - promoter: CMV

    - cistron:
        label: dCas9_VP64
        expression: high
        chain:
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP64
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        fused: false
        chain:
          - gene:
              id: guide_RNA_scaffold
              source: uniprot

    - terminator: rrnB_T1
