construct:
  name: "yeast_surface_display_vaccine_epitope"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_epitope
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: generic_epitope_tag
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Aga2p_anchor

    - terminator: CYC1_poly_A
