construct:
  name: "Sf9_mCherry_constitutive_reporter"
  host: insect  # Spodoptera frugiperda Sf9 cells
  
  backbone:
    # Custom backbone for insect cells: no resistance marker, suitable for transient transfection
    ori: null  # Transient expression only; no replication required
    source: custom
  
  cassette:
    - promoter: OpIE2  # Optimized Polyhedron Immediate Early promoter; strong constitutive insect promoter
    
    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
    
    - terminator: SV40_polyA  # SV40 polyadenylation signal; widely used in insect cell vectors for robust 3' processing
