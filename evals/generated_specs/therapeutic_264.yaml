construct:
  name: "sf9_mcherry_constitutive_reporter"
  host: Sf9
  backbone:
    resistance: kanamycin # Kanamycin included for bacterial propagation; antibiotic-free selection in insect cells is achieved by omitting the insect-selection marker.
    ori: pUC
    source: custom
  cassette:
    - promoter: Actin_5C
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_polyA