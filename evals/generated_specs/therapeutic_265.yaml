construct:
  name: "therapeutic_enzyme_dual_tag_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: lysozyme
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - cleavage_site: 3C
          - tag: Strep-II

    - terminator: rrnB_T1
