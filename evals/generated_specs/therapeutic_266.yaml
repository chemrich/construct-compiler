construct:
  name: "HEK293_human_kinase_cytoplasmic"
  host: HEK293

  backbone:
    resistance: none
    ori: none
    # Mammalian expression backbone without antibiotic resistance
    source: custom

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: kinase
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: human_protein_kinase
              source: uniprot

    - terminator: SV40_polyA
