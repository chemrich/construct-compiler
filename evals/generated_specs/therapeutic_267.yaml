construct:
  name: "therapeutic_peptide_MBP_fusion"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: no antibiotic resistance marker as requested

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - gene:
              id: therapeutic_peptide_30aa
              source: custom
              codon_optimization: e_coli

    - terminator: rrnB_T1
