construct:
  name: "cell_free_diagnostic_antigen"
  host: in_vitro

  backbone:
    resistance: none
    ori: none
    source: linear_dna

  cassette:
    - promoter: T7

    - cistron:
        label: diagnostic_antigen
        expression: high
        chain:
          - gene:
              id: antigen
              source: uniprot

    - terminator: T7term
