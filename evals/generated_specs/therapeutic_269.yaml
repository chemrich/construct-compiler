construct:
  name: "mitochondrial_fluorescent_reporter_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: pTwist vectors use hygromycin B resistance by default; 
    # for antibiotic-free selection, a mammalian selectable marker 
    # (e.g., blasticidin or puromycin) or fluorescent selection marker 
    # should be substituted. Using EF1_alpha promoter for non-viral constitutive expression.
    resistance: null
    ori: mammalian

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: mitochondrial_reporter
        expression: high
        chain:
          - tag: MTS  # Mitochondrial Targeting Sequence (N-terminal)
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
