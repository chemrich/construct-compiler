construct:
  name: "mammalian_fluorescent_reporter_no_ARG"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pUC
    source: addgene
    # Note: pTwist CMV is antibiotic-free; uses selection-free mammalian expression

  cassette:
    - promoter: CMV

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
