construct:
  name: mammalian_constitutive_reporter_nonviral
  host: HEK293
  backbone:
    resistance: none # Explicitly excluded per user request for strict absence of antibiotic markers
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Non-viral constitutive mammalian promoter
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_pA # Non-viral mammalian polyadenylation signal