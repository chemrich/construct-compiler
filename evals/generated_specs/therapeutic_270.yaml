construct:
  name: "ER_retained_therapeutic_protein_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector; no antibiotic resistance

  cassette:
    - promoter: EF1_alpha
      # Strong, constitutive non-viral mammalian promoter

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: IGHG1
              # Using IgG1 as representative therapeutic protein; customize with specific protein ID
              source: uniprot
          - er_retention_signal: KDEL
            # C-terminal KDEL motif for ER retention

    - terminator: rrnB_T1
