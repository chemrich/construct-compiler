construct:
  name: "Drosophila_S2_secreted_therapeutic"
  host: drosophila_s2

  backbone:
    resistance: null  # No antibiotic marker for Drosophila S2 cells
    ori: pUC  # Standard plasmid replication
    source: custom

  cassette:
    - promoter: Drosophila_actin5C  # Constitutive insect promoter

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - tag: signal_peptide_Drosophila  # Drosophila melanogaster secretion signal (e.g., from Kl-16A or Drs)
          - gene:
              id: therapeutic_protein
              source: uniprot

    - terminator: Drosophila_polyadenylation  # Drosophila poly-A signal (e.g., hsp70 or fw4)
