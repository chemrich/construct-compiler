construct:
  name: therapeutic_solubility_fusion_autocleaving
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: solubility_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: 2A  # Self-cleaving peptide for in vivo separation
          - gene:
              id: IFN_beta
              source: uniprot

    - terminator: rrnB_T1
