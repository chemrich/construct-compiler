construct:
  name: "dual_therapeutic_enzyme_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pBR322
    source: addgene
    # Note: removed resistance marker for non-viral, marker-free design

  cassette:
    - promoter: EF1_alpha  # robust constitutive mammalian promoter, non-viral

    - cistron:
        label: enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905  # UniProt ID for a representative therapeutic enzyme
              source: uniprot

    # IRES element represented as spacer with functional annotation
    # In practice, this would be a 500-800 bp IRES sequence (e.g., EMCV or CrPV IRES)
    - spacer: 600  # bp; represents IRES element for cap-independent translation

    - cistron:
        label: enzyme_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P12345  # UniProt ID for second therapeutic enzyme
              source: uniprot

    - terminator: rrnB_T1
