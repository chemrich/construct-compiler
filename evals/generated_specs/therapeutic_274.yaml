construct:
  name: bifunctional_fusion_protein_expression
  host: e_coli_bl21_de3

  backbone:
    resistance: chloramphenicol
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: bifunctional_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: domain_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: domain_2
              source: uniprot
          - cleavage_site: 3C
          - solubility_tag: SUMO

    - terminator: rrnB_T1
