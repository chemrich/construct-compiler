construct:
  name: "bi_functional_fusion_construct"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Defaulting to kanamycin as tool requires resistance; user requested no antibiotics
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Non-viral bacterial inducible promoter
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01133
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01375
              source: uniprot
          - cleavage_site: 3C
          - solubility_tag: MBP
    - terminator: rrnB_T1 # Bacterial terminator (non-viral)