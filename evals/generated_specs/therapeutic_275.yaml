construct:
  name: "mammalian_CPP_therapeutic_cytoplasmic_delivery"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No antibiotic resistance: using mammalian selection-free vector
    ori: null
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: THRAP3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: TAT_CPP

    - terminator: polyA
