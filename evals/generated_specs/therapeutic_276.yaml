construct:
  name: "hMSC_inducible_cytokine_expression"
  host: HEK293

  backbone:
    resistance: null
    ori: SC101
    source: addgene
    # SC101 is a mammalian-compatible low-copy origin; no antibiotic marker included per requirements

  cassette:
    - promoter: EF1_alpha
      label: "regulatory_cassette"

    - cistron:
        label: rtTA_regulator
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: "rtTA3"
              source: uniprot
          - tag: NLS

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: TRE
      # TRE = Tetracycline Response Element (tet-on); non-viral synthetic element
      label: "inducible_cytokine_cassette"

    - cistron:
        label: therapeutic_cytokine
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "P05112"
              source: uniprot
              # IL-6: therapeutic cytokine for immunomodulation in stem cells
          - tag: NLS

    - terminator: rrnB_T1
