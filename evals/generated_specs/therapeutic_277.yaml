construct:
  name: "plant_cellfree_scfv_diagnostic"
  host: in_vitro

  backbone:
    resistance: null
    ori: null
    source: synthetic

  cassette:
    - promoter: SP6
      # SP6 is the standard promoter for wheat germ cell-free systems (in vitro transcription)

    - element: Kozak_consensus
      # Enhances translation efficiency in plant-derived lysates

    - cistron:
        label: scfv_diagnostic
        expression: high
        chain:
          - gene:
              id: "anti_SARS_CoV2_spike_RBD_scfv"
              source: uniprot
              # User to provide UniProt ID or sequence directly; represents a diagnostic single-chain variable fragment

    - terminator: rrnB_T1
      # Standard transcription terminator for in vitro systems
