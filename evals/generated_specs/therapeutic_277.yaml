construct:
  name: "plant_ivt_scfv_diagnostic_template"
  host: in_vitro
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ZmUbi1  # Maize Ubiquitin 1: strong non-viral plant promoter for wheat germ systems
    - cistron:
        label: diagnostic_scfv
        expression: high
        gene:
          id: P01857  # Human IgG1 constant region used as a representative fragment component
          source: uniprot
    - terminator: AtHsp70_term  # Arabidopsis Hsp70 terminator (non-viral plant origin)