construct:
  name: "nonviral_stable_integration_therapeutic_GLA"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha  # Non-viral constitutive promoter for stable expression
    - cistron:
        label: therapeutic_enzyme
        expression: high
        gene:
          id: P06280  # Human alpha-galactosidase A
          source: uniprot
    - terminator: bGH_polyA  # Standard non-viral mammalian polyadenylation signal