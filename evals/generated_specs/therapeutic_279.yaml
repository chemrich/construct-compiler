construct:
  name: "mammalian_piggyBac_therapeutic_enzyme"
  host: HEK293

  backbone:
    # Custom backbone for piggyBac transposon cargo
    # No antibiotic resistance; integration via transposase provided externally
    ori: null
    resistance: null
    source: custom

  cassette:
    - comment: "5' piggyBac ITR (Inverted Terminal Repeat)"
      feature: "piggyBac_ITR_5prime"

    - promoter: EF1_alpha

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: null
              source: null
              # User must specify the therapeutic enzyme gene ID and source

    - terminator: rrnB_T1

    - comment: "3' piggyBac ITR (Inverted Terminal Repeat)"
      feature: "piggyBac_ITR_3prime"
