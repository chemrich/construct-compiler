construct:
  name: "therapeutic_protein_expression_purification"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_TNF_alpha
              source: uniprot

    - terminator: rrnB_T1
