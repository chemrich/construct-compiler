construct:
  name: soluble_therapeutic_protein_expression
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Defaulted to kanamycin as per Rule 9; selection is required for plasmid stability and antibiotic-free systems are not supported in the standard spec.
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Chosen as a robust, non-viral inducible promoter to satisfy the 'no viral' constraint.
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P01241
              source: uniprot
    - terminator: rrnB_T1