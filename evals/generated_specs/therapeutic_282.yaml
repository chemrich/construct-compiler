construct:
  name: "non_viral_CAR_HEK293"
  host: HEK293

  backbone:
    resistance: kanamycin  # Required for bacterial propagation; omitted from eukaryotic cassette
    ori: pUC
    source: custom

  cassette:
    - promoter: EF1_alpha  # Strong constitutive human promoter, non-viral

    - cistron:
        label: chimeric_antigen_receptor
        expression: high
        chain:
          - gene:
              id: CD8A_signal_peptide
              source: uniprot
          - gene:
              id: FMC63_scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: CD28_hinge_transmembrane
              source: uniprot
          - gene:
              id: CD247_CD3_zeta_signaling
              source: uniprot

    - terminator: hGH_pA  # Human Growth Hormone polyadenylation signal, non-viral