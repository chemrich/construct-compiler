construct:
  name: "yeast_scfv_surface_display"
  host: yeast
  backbone:
    resistance: URA3  # Non-antibiotic auxotrophic marker for yeast
    ori: 2_micron     # High-copy yeast origin of replication
    source: addgene
  cassette:
    - promoter: TEF1  # Constitutive yeast promoter
    - cistron:
        label: scfv_fusion
        expression: high
        chain:
          - tag: alpha_factor  # Secretion signal for targeting to the secretory pathway
          - gene:
              id: therapeutic_scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: Aga2p         # C-terminal anchor for Aga1p-Aga2p cell wall display
    - terminator: CYC1         # Standard yeast terminator