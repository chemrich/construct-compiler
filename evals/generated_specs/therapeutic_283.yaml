construct:
  name: yeast_scFv_surface_display
  host: yeast

  backbone:
    resistance: auxotrophic_uracil  # URA3 auxotrophic selection for yeast
    ori: 2micron                     # High-copy yeast plasmid origin
    source: addgene

  cassette:
    - promoter: GAL1  # Constitutive yeast promoter

    - cistron:
        label: scFv_display
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal yeast secretion signal
          - gene:
              id: scFv_therapeutic
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Aga2p  # C-terminal yeast cell wall anchoring domain for surface display

    - terminator: CYC1  # Yeast transcription terminator
