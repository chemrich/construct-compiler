construct:
  name: "inducible_reporter_non_viral"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: TRE_minHSP70  # Tetracycline-responsive element with a minimal Heat Shock Protein 70 promoter to avoid viral components like CMV-min
    - cistron:
        label: luciferase_reporter
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_pA  # Bovine Growth Hormone polyadenylation signal (non-viral)