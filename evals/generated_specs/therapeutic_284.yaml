construct:
  name: mammalian_inducible_luciferase_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TRE  # Tetracycline Response Element - tight, inducible by doxycycline

    - cistron:
        label: luciferase_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Photinus_pyralis_luciferase
              source: uniprot

    - polyadenylation_signal: SV40_polyA  # Non-viral synthetic poly(A) signal

    - terminator: rrnB_T1
