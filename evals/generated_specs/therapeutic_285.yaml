construct:
  name: "dual_therapeutic_protein_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_protein_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P12345
              source: uniprot

    - terminator: rrnB_T1
