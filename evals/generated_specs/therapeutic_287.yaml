construct:
  name: "therapeutic_protein_tag_free_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - gene:
              id: therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - solubility_tag: MBP

    - terminator: rrnB_T1
