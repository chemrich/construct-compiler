construct:
  name: "mammalian_cas9_gRNA_delivery_non_viral"
  host: HEK293

  cassette:
    - promoter: EF1_alpha
      
    - cistron:
        label: cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - cleavage_site: P2A
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        chain:
          - gene:
              id: guide_RNA
              source: uniprot

    - terminator: rrnB_T1
