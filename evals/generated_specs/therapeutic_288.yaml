construct:
  name: "non_viral_cas9_grna_expression_system"
  host: HEK293
  backbone:
    resistance: kanamycin # Substitution: Tool requires standard antibiotic resistance; kanamycin used as default despite 'non-antibiotic' request.
    ori: pUC
    source: twist
  cassette:
    - promoter: EF1_alpha # Human-derived non-viral robust constitutive promoter.
    - cistron:
        label: cas9_p2a_egfp
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: Q99ZW2
              source: uniprot
          - linker:
              type: P2A # 2A self-cleaving peptide for multicistronic expression in mammals.
          - gene:
              id: mEGFP
              source: fpbase
          - tag: NLS
    - spacer: 40
    - promoter: U6 # Pol III promoter for guide RNA expression.
    - cistron:
        label: grna
        gene:
          id: sgRNA_scaffold
    - terminator: hGH_polyA