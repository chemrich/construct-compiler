construct:
  name: "dual_therapeutic_fragment_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: null  # antibiotic resistance-free design
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Fragment_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_fragment_A
              source: uniprot
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: T7lac
    
    - cistron:
        label: Fragment_B
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: therapeutic_fragment_B
              source: uniprot
    
    - terminator: rrnB_T1
