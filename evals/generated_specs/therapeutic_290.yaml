construct:
  name: "ER_retained_therapeutic_GLA"
  host: HEK293
  backbone:
    resistance: none  # User requested construct free of antibiotic resistance
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha  # Non-viral constitutive mammalian promoter
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: IgK_leader  # N-terminal secretion signal
          - gene:
              id: P06670  # Human alpha-galactosidase A (GLA)
              source: uniprot
          - tag: KDEL        # C-terminal ER retention signal
    - terminator: bGH_pA     # Non-viral polyadenylation signal