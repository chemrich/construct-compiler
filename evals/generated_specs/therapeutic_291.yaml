construct:
  name: therapeutic_enzyme_expression
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: No antibiotic resistance marker included per requirements

  cassette:
    - promoter: J23100
      # Strong constitutive promoter (synthetic BioBrick, no viral origin)

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_enzyme
              source: uniprot

    - terminator: rrnB_T1
