construct:
  name: dual_FP_mammalian_tracker
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: cell_tracker
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - spacer: 25

    - cistron:
        label: state_monitor
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
        # 2A peptide for ribosomal skipping enables polycistronic expression
        # from a single mRNA transcript without requiring IRES elements
        fused: false

    - terminator: polyA
