construct:
  name: "yeast_secreted_enzyme_purification"
  host: yeast

  backbone:
    resistance: none  # no antibiotic resistance marker
    ori: 2_micron   # high-copy yeast plasmid origin
    source: custom

  cassette:
    - promoter: GAL1  # strong inducible promoter in yeast

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: alpha_factor_signal  # yeast N-terminal secretion signal
          - gene:
              id: enzyme_of_interest
              source: uniprot
          - cleavage_site: Kex2  # yeast-native endopeptidase cleavage site
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: CYC1_poly_A  # yeast polyadenylation signal
