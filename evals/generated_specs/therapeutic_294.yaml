construct:
  name: "mammalian_nuclear_therapeutic_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-antibiotic resistance; uses auxotrophic selection or DHFR
    ori: ColA
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: "therapeutic_protein"
              source: uniprot

    - polyadenylation_signal: SV40_poly_A

    - terminator: rrnB_T1
