construct:
  name: "bacterial_surface_display_therapeutic"
  host: e_coli

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: surface_display
        expression: medium
        chain:
          - signal_peptide: pelB
          - gene:
              id: therapeutic_peptide
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - anchor_domain: Lpp_OmpA

    - terminator: rrnB_T1
