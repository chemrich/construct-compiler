construct:
  name: "mammalian_inducible_therapeutic_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector without antibiotic resistance
    # Using CMV as default; will be overridden by inducible promoter in cassette
    ori: ColA
    source: addgene

  cassette:
    - promoter: TRE_tight  # Tetracycline Response Element for tight inducible control

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis  # N-terminal purification tag
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_protein
              source: uniprot

    - polya: SV40_pA  # SV40 polyadenylation signal for mRNA stability and nuclear export
