construct:
  name: "multi_domain_therapeutic_bacterial_expression"
  host: e_coli_bl21

  backbone:
    resistance: null  # No antibiotic resistance as requested
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Strong constitutive promoter for bacterial systems

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: domain_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_2
              source: uniprot

    - terminator: rrnB_T1
