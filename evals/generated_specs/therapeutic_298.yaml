construct:
  name: "mammalian_therapeutic_solubility_tag"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - gene:
              id: therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: MBP

    - polyadenylation_signal: SV40_polyA
    
    - terminator: rrnB_T1
