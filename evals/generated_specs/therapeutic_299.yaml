construct:
  name: "cell_cycle_regulated_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Custom backbone with minimal immunogenic elements
    ori: pUC
    # No antibiotic resistance marker; selection via fluorescent marker or other method
    # User should implement alternative selection strategy

  cassette:
    - promoter: cyclin_B1  # Cell cycle-regulated promoter; peaks at G2/M phase

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: "therapeutic_protein"
              source: uniprot
              # Note: Replace with actual UniProt ID of therapeutic target

    - polyadenylation_signal: SV40_polyA  # Standard mammalian polyA signal; minimal immunogenicity

    - terminator: SV40_polyA
