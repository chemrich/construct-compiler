construct:
  name: "mRNA_therapeutic_high_expression"
  host: in_vitro

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: utron_5prime
        expression: high
        chain:
          - element: Kozak_consensus
          - element: IRES_EMCV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_target
              source: uniprot

    - element: poly_A_tail_extended
      length: 200

    - terminator: T7term
