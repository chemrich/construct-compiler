construct:
  name: base_editor_gene_editing_complex
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: base_editor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ABE8e
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
          - tag: HA

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: medium
        fused: false
        gene:
          id: sgRNA_target
          source: custom
          # User must specify the target site sequence
          # Format: 20bp sgRNA + NGG PAM for SpCas9

    - terminator: T7term
