construct:
  name: "bifunctional_fusion_targeting_ligand_therapeutic_peptide"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: bifunctional_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: targeting_ligand
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: rrnB_T1
