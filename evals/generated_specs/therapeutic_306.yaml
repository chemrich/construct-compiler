construct:
  name: inducible_immunomodulator_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA
        expression: medium
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - terminator: SV40_polyA

    - spacer: 50

    - promoter: TRE

    - cistron:
        label: immunomodulator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: IL12p35
              source: uniprot

    - terminator: SV40_polyA
