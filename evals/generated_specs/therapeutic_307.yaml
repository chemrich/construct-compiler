construct:
  name: "neuronal_diagnostic_reporter"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: hSyn  # Neuron-specific promoter for identification of neuronal populations
    - cistron:
        label: neuronal_marker
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mNeonGreen
              source: fpbase
    - terminator: bGH_polyA