construct:
  name: scFv_antibody_yeast_secreted
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: alpha_factor_secretion_signal
          - gene:
              id: scFv_VH_linker_VL
              source: uniprot
          - tag: 6xHis
          - tag: Strep-II
          - cleavage_site: TEV

    - terminator: CYC1_polA
