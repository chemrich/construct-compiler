construct:
  name: "insect_cell_triple_expression_plasmid"
  host: insect_cells

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: polyhedrin

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: therapeutic_protein_B
              source: uniprot

    - spacer: 30

    - cistron:
        label: subunit_C
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: therapeutic_protein_C
              source: uniprot

    - terminator: SV40_polyA
