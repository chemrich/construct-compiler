construct:
  name: secreted_therapeutic_fusion_protein
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - tag: signal_peptide_IgK  # Ig kappa chain signal peptide for robust secretion
          - gene:
              id: binding_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: effector_domain
              source: uniprot
          - tag: His6  # C-terminal His6 for purification

    - terminator: SV40_polyA
