construct:
  name: therapeutic_fusion_secretion
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: signal_peptide  # robust mammalian secretion signal
          - gene:
              id: scFv_anti_CD19  # therapeutic binding domain example
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: IL2  # effector domain example
              source: uniprot

    - terminator: SV40_polyA