construct:
  name: dCas9_epigenetic_modulator_transient_silencing
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: dCas9_KRAB
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot
          - tag: HA

    - spacer: 30

    - cistron:
        label: guide_RNA_scaffold
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold
          source: uniprot
        # Note: gRNA sequence should be designed targeting specific locus; 
        # scaffold includes U6 terminator compatibility for standalone gRNA expression

    - terminator: rrnB_T1
