construct:
  name: "AAV_therapeutic_compact_construct"
  host: mammalian

  backbone:
    catalog_vector: "pAAV-CMV"
    # AAV backbone with inverted terminal repeats (ITRs) for packaging
    # CMV promoter for broad mammalian expression
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV
      # Compact CMV variant to minimize size

    - cistron:
        label: therapeutic_gene
        expression: high
        chain:
          - tag: 6xHis
            # Minimal His-tag for purification if needed
          - cleavage_site: 2A
            # Self-cleaving peptide for clean separation from tag
          - gene:
              id: SERPINA1
              # Alpha-1 antitrypsin as example therapeutic
              source: uniprot

    - terminator: SV40poly
      # Compact polyadenylation signal
