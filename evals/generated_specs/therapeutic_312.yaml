construct:
  name: "dual_therapeutic_self_cleaving"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: lysozyme
              source: uniprot

    - spacer: 25

    - cistron:
        label: 2A_self_cleaving
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A
              source: uniprot

    - spacer: 25

    - cistron:
        label: therapeutic_2
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: catalase
              source: uniprot

    - terminator: rrnB_T1
