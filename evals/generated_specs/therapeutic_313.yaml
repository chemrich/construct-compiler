construct:
  name: "intracellular_RNA_aptamer_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: RNA_aptamer
        expression: high
        chain:
          - gene:
              id: RNA_aptamer_scaffold
              source: uniprot
              # Note: This represents a generic aptamer expression unit
              # User should specify the actual aptamer sequence or ID

    - terminator: rrnB_T1
