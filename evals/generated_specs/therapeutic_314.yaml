construct:
  name: "modular_protein_scaffold_three_effectors"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold_n_terminus
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: scaffold_core_backbone
              source: uniprot

    - spacer: 30

    - cistron:
        label: effector_domain_1
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: effector_binding_site_1
              source: uniprot

    - spacer: 30

    - cistron:
        label: effector_domain_2
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: effector_binding_site_2
              source: uniprot

    - spacer: 30

    - cistron:
        label: effector_domain_3
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: effector_binding_site_3
              source: uniprot

    - spacer: 30

    - cistron:
        label: solubility_tag_c_terminus
        expression: high
        fused: false
        chain:
          - solubility_tag: MBP
          - tag: 8xHis

    - terminator: rrnB_T1
