construct:
  name: mitochondrial_micropeptide_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: micropeptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - localization_signal: MTS  # Mitochondrial Targeting Sequence
          - gene:
              id: novel_mitochondrial_micropeptide
              source: uniprot

    - terminator: rrnB_T1
