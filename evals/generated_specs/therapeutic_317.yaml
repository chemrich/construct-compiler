construct:
  name: "dendritic_cell_antigen_presentation_enhancer"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: antigen_MHC_I
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: P04637
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - spacer: 30

    - cistron:
        label: CLIP_removal_cathepsin
        expression: medium
        chain:
          - tag: signal_peptide_CD33
          - gene:
              id: P07339
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: 3C

    - spacer: 30

    - cistron:
        label: MHC_II_loading_factor
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: P29774
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG

    - spacer: 30

    - cistron:
        label: immunostimulatory_adjuvant
        expression: high
        fused: false
        chain:
          - tag: signal_peptide_IgE
          - gene:
              id: P19438
              source: uniprot

    - terminator: rrnB_T1
