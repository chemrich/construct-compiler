construct:
  name: dox_inducible_therapeutic_switch
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA_transactivator
        expression: medium
        chain:
          - tag: HA
          - gene:
              id: rtTA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: TRE_tight
      # TRE (Tetracycline Response Element) provides doxycycline-dependent activation

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 2A
          - gene:
              id: IL12
              source: uniprot

    - terminator: rrnB_T1
