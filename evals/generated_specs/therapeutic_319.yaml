construct:
  name: "human_protein_stable_isotope_labeling"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_protein
              source: uniprot
              # Note: Replace 'human_protein' with specific UniProt ID (e.g., P12345)

    - terminator: rrnB_T1
