construct:
  name: "CRISPR_Cas9_mRNA_IVT_template"
  host: in_vitro

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: Cas9_mRNA
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: T2A
          - gene:
              id: SpCas9
              source: uniprot

    - cistron:
        label: PolyA_binding_protein
        expression: high
        fused: false
        chain:
          - gene:
              id: PABP
              source: uniprot

    - terminator: rrnB_T1
