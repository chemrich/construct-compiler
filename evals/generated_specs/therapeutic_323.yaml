construct:
  name: bicistronic_TCR_alpha_beta_HEK293
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: TCR_alpha
        expression: high
        chain:
          - tag: HA
          - gene:
              id: TCR_alpha_chain
              source: uniprot

    - spacer: 30

    - cistron:
        label: IRES_2A_linker
        expression: high
        fused: false
        chain:
          - gene:
              id: P2A_self_cleaving_peptide
              source: uniprot

    - spacer: 30

    - cistron:
        label: TCR_beta
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: TCR_beta_chain
              source: uniprot

    - terminator: rrnB_T1
