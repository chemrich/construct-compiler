construct:
  name: "synthetic_TCR_alpha_beta_coexpression"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: "tcr_alpha"
        expression: high
        gene:
          id: TRAC
          source: uniprot
    - spacer: 20
    - cistron:
        label: "tcr_beta"
        expression: high
        fused: false
        gene:
          id: TRBC1
          source: uniprot
    - terminator: BGH_polyA