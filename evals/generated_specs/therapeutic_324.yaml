construct:
  name: "yeast_viral_envelope_vaccine_antigen"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_antigen
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - secretion_tag: alpha_factor
          - gene:
              id: P0DTC2
              source: uniprot
          - tag: Strep-II

    - terminator: CYC1
