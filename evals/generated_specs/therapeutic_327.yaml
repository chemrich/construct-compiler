construct:
  name: "E_coli_cellulase_secretion_purification"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: cellulase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Cel7A
              source: uniprot
              # Fungal cellulase (e.g., Trichoderma reesei Cel7A, commonly used for heterologous expression)

    - terminator: rrnB_T1
