construct:
  name: "piggybac_therapeutic_f9_integration"
  host: HEK293
  backbone:
    # The cassette is flanked by 5' and 3' PiggyBac ITRs for transposase-mediated integration
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: therapeutic_payload
        expression: high
        gene:
          id: P00740
          source: uniprot
    - terminator: bGH_PA