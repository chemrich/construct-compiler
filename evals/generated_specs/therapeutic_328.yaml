construct:
  name: "PiggyBac_therapeutic_integration"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - element: ITR_piggyBac
      type: 5_prime
      # 5' inverted terminal repeat for PiggyBac transposon

    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: IL_10  # Example therapeutic cytokine
              source: uniprot

    - terminator: SV40poly

    - element: ITR_piggyBac
      type: 3_prime
      # 3' inverted terminal repeat for PiggyBac transposon; essential for transposition

    - spacer: 100
      # Spacing between transposon cassette and selection marker

    - promoter: SV40

    - cistron:
        label: selection
        expression: high
        gene:
          id: puromycin_N_acetyltransferase
          source: uniprot
      # PAC gene for puromycin selection in mammalian cells

    - terminator: SV40poly
