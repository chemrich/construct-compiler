construct:
  name: "mammalian_miRNA_expression_cassette"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: pre_miRNA
        expression: high
        chain:
          - gene:
              id: "hsa-miR-122"
              source: mirbase
              # Note: pre-miRNA construct with flanking sequences for proper Drosha/Dicer processing
              # Recommend using ~500 bp flanking genomic context for physiological expression

    - terminator: polyA_signal
