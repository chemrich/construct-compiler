construct:
  name: dual_therapeutic_peptide_IRES_expression
  host: e_coli_bl21

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_peptide_1
              source: uniprot

    # IRES-like element represented as spacer with structural RNA component
    # Note: In E. coli, true IRES function is limited; this design uses
    # a strong RBS + Kozak-like sequence for the second cistron to enable
    # independent translation from the same mRNA
    - spacer: 50  # Extended spacer to accommodate IRES-equivalent regulatory element

    - cistron:
        label: peptide_2
        expression: medium
        fused: false  # Independent translation initiation
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: therapeutic_peptide_2
              source: uniprot

    - terminator: rrnB_T1
