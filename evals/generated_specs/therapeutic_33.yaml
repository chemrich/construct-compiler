construct:
  name: dual_therapeutic_peptide_expression
  host: e_coli_bl21_de3
  
  backbone:
    resistance: none
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: peptide1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P10145  # Example therapeutic peptide from uniprot
              source: uniprot
    
    - spacer: 50  # Extended spacer to accommodate ribosome binding
    
    - cistron:
        label: peptide2
        expression: high
        fused: false  # Independent translation via internal RBS
        chain:
          - tag: Strep-II
          - gene:
              id: P01308  # Example therapeutic peptide from uniprot
              source: uniprot
    
    - terminator: rrnB_T1