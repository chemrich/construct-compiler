construct:
  name: GPCR_ectodomain_secreted_yeast
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: GPCR_ectodomain
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GPCR_ectodomain
              source: uniprot
          - secretion_signal: alpha_factor

    - terminator: rrnB_T1
