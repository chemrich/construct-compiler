construct:
  name: "dual_CAR_signaling_modules_T_cell"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: CAR_extracellular
        expression: high
        chain:
          - tag: Flag
          - gene:
              id: scFv_domain
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1

    - cistron:
        label: transmembrane_spacer
        expression: high
        fused: true
        gene:
          id: CD8a_transmembrane
          source: uniprot

    - cistron:
        label: 2A_peptide
        expression: high
        fused: true
        gene:
          id: T2A
          source: uniprot

    - cistron:
        label: costimulatory_module
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: 4_1BB_intracellular
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CD3zeta_signaling
              source: uniprot

    - terminator: rrnB_T1
