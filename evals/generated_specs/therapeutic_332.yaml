construct:
  name: "mammalian_polyprotein_vaccine_dual_antigen"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: antigen_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: antigen_1
              source: uniprot

    - spacer: 21

    - cistron:
        label: t2a_linker
        expression: high
        fused: false
        chain:
          - gene:
              id: T2A
              source: uniprot
          - gene:
              id: antigen_2
              source: uniprot

    - terminator: rrnB_T1
