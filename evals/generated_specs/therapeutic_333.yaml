construct:
  name: plant_secreted_pharmaceutical_high_yield
  host: plant_nicotiana_benthamiana

  backbone:
    catalog_vector: pEAQ-HT
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CaMV35S

    - cistron:
        label: target_pharmaceutical
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - secretion_signal: plant_signal_peptide
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_protein
              source: uniprot
        secretion: true

    - terminator: Ocs_poly_A
