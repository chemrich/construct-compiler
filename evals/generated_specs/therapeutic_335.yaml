construct:
  name: "metabolite_biosensor_reporter_system"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: biosensor_transcription_factor
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: AraC
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: reporter
        expression: high
        fused: false
        chain:
          - promoter: araBAD
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
