construct:
  name: "mammalian_RNA_aptamer_Pol3"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter for constitutive, high-level RNA expression in mammalian cells

    - cistron:
        label: aptamer_construct
        expression: high
        chain:
          - gene:
              id: aptamer_5p_stem_loop
              source: synthetic
          - linker:
              type: GS_flexible
              repeats: 0
          - gene:
              id: therapeutic_aptamer
              source: synthetic
          - linker:
              type: GS_flexible
              repeats: 0
          - gene:
              id: aptamer_3p_stem_loop
              source: synthetic

    - terminator: rrnB_T1
      # rrnB_T1 provides efficient transcription termination for Pol III-driven RNA constructs
