construct:
  name: "Lactobacillus_AMP_secretion_stable"
  host: bacillus  # Bacillus-like expression system, compatible with gram-positive commensals like Lactobacillus

  backbone:
    resistance: chloramphenicol  # chloramphenicol resistance for stable maintenance in Lactobacillus
    ori: pUC  # high-copy plasmid for robust expression in gram-positive bacteria
    source: addgene

  cassette:
    - promoter: J23100  # strong constitutive promoter for stable high-level expression

    - cistron:
        label: AMP_secreted
        expression: high
        chain:
          - signal_peptide: AmyE  # Bacillus AmyE signal peptide for secretion in gram-positive bacteria
          - gene:
              id: lacticin_480  # example: Lactobacillus-derived antimicrobial peptide
              source: uniprot
          - tag: 6xHis  # C-terminal His tag for detection/purification if needed

    - terminator: rrnB_T1
