construct:
  name: "mammalian_protac_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Clean mammalian expression vector without antibiotic resistance

  cassette:
    - promoter: CMV

    - cistron:
        label: protac_therapeutic
        expression: high
        chain:
          - tag: FLAG
          - cleavage_site: TEV
          - gene:
              id: custom_protac
              source: uniprot
        nuclear_localization: true

    - terminator: bgh_poly_a
