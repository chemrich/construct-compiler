construct:
  name: "non_viral_therapeutic_degrader"
  host: HEK293
  backbone:
    resistance: kanamycin # Kanamycin is used for bacterial propagation; clinical-grade constructs typically use antibiotic-free selection systems like Nanoplasmid or minicircle.
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Human EF1-alpha promoter used as a constitutive non-viral alternative to CMV.
    - cistron:
        label: therapeutic_degrader
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P40337
              source: uniprot
    - terminator: hGH_pA # Human Growth Hormone polyadenylation signal used as a non-viral termination sequence.