construct:
  name: "therapeutic_protein_degrader_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic_degrader
        expression: medium
        chain:
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "PROTAC_E3_ligase_domain"  # Placeholder for therapeutic protein
              source: uniprot

    - terminator: BGH_polyA