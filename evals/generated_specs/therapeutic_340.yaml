construct:
  name: non_viral_secreted_human_therapeutic
  host: HEK293
  backbone:
    resistance: none  # User requested no antibiotic resistance genes; typically requires alternative selection or minicircle production.
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha  # High-level constitutive human promoter used to avoid viral elements like CMV.
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: IgK_leader  # Signal peptide for efficient protein secretion.
          - gene:
              id: P01308     # Human Insulin as a representative therapeutic peptide.
              source: uniprot
    - terminator: hGH_polyA  # Human growth hormone polyadenylation signal to avoid viral terminators like SV40.