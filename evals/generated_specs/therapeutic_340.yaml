construct:
  name: "mammalian_secreted_therapeutic_peptide"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Mammalian expression vector with CMV promoter; using pTwist avoids antibiotic resistance requirement

  cassette:
    - promoter: EF1_alpha
      # EF1_alpha provides strong, constitutive expression in mammalian cells

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: signal_peptide_SP
            # N-terminal signal peptide for ER-directed secretion
          - gene:
              id: therapeutic_peptide
              source: uniprot
              # User to specify UniProt ID for their therapeutic peptide
          - tag: His6
            # C-terminal His6 tag for purification of secreted product

    - terminator: SV40_polyA
      # SV40 polyadenylation signal for efficient mRNA processing and stability
