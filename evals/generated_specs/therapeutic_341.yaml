construct:
  name: "high_yield_solubility_optimized_enzyme"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin # Standard selection marker substituted for 'no antibiotic' request to ensure plasmid maintenance in BL21(DE3)
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_cistron
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: novel_enzyme
              source: uniprot
    - terminator: T7term