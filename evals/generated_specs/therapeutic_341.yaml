construct:
  name: "high_yield_enzyme_expression_system"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: novel_enzyme
              source: uniprot

    - terminator: rrnB_T1
