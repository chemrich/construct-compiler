construct:
  name: yeast_Fab_secretion
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: Fab_heavy
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: Fab_heavy
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - spacer: 25

    - cistron:
        label: Fab_light
        expression: high
        fused: false
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: Fab_light
              source: uniprot

    - terminator: CYC1
