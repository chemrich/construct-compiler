construct:
  name: yeast_secretory_fab_expression_system
  host: yeast
  backbone:
    resistance: ura3 # Substituted auxotrophic marker for antibiotic resistance as requested for yeast host
    ori: 2_micron
    source: custom
  cassette:
    - promoter: TDH3 # Strong constitutive yeast promoter (GPD)
    - cistron:
        label: fab_heavy_chain
        expression: high
        chain:
          - tag: alpha_mating_factor # Yeast secretion signal (pre-pro leader)
          - gene:
              id: P01857 # Human IgG1 heavy chain constant region
              source: uniprot
    - spacer: 40
    - cistron:
        label: fab_light_chain
        expression: high
        fused: false # Independent translation for separate protein chain
        chain:
          - tag: alpha_mating_factor # Necessary for co-secretion/folding in the ER
          - gene:
              id: P01834 # Human Ig kappa chain C region
              source: uniprot
    - terminator: CYC1