construct:
  name: "dox_inducible_cytokine_expression_system"
  host: HEK293
  backbone:
    resistance: kanamycin # User requested ARG-free; kanamycin is default for cloning propagation
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Constitutive non-viral promoter
    - cistron:
        label: transactivator
        expression: medium
        gene:
          id: rtTA3
          source: uniprot
    - spacer: 100
    - promoter: TRE3G # Doxycycline-inducible promoter
    - cistron:
        label: therapeutic_cytokine
        expression: high
        gene:
          id: P60568 # Human Interleukin-2
          source: uniprot
    - terminator: bGH_PA # Non-viral polyadenylation signal