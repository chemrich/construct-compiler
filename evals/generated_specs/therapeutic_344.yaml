construct:
  name: "mammalian_dual_therapeutic_2A_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 22
      # 2A peptide (self-cleaving) inserted here for stoichiometric separation
      # Compiler will add P2A or equivalent ribosomal skip sequence

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
