construct:
  name: "Equimolar_Therapeutic_Protein_Coexpression"
  host: HEK293
  backbone:
    resistance: kanamycin  # Required for cloning; non-viral selection markers are not standard in this tool.
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Human promoter used to avoid viral CMV promoter.
    - cistron:
        label: therapeutic_polyprotein
        expression: high
        chain:
          - gene:
              id: P01133  # Human EGF (Example Therapeutic Protein A)
              source: uniprot
          - linker:
              type: P2A   # Self-cleaving peptide for equimolar expression; viral origin per user request.
          - gene:
              id: P01137  # Human TGF-alpha (Example Therapeutic Protein B)
              source: uniprot
    - terminator: bGH_pA   # Bovine growth hormone polyA signal (non-viral).