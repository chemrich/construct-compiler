construct:
  name: "liver_specific_enzyme_therapy"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV" # Note: Antibiotic resistance gene (ARG) is included for plasmid propagation but must be removed for clinical minicircle production
  cassette:
    - promoter: HLP # Hybrid Liver-specific Promoter (ApoE enhancer and human alpha-1 antitrypsin promoter)
    - cistron:
        label: therapeutic_enzyme
        expression: high
        gene:
          id: P35575 # G6PC - Human Glucose-6-phosphatase catalytic subunit
          source: uniprot
    - terminator: bGH_polyA