construct:
  name: "liver_specific_enzyme_expression_vector"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: hAAT  # hepatocyte-specific alpha-1 antitrypsin promoter, liver-specific and strong

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P69905  # Example: Catalase from Homo sapiens (UniProt ID)
              source: uniprot

    - terminator: rrnB_T1
