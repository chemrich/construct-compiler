construct:
  name: "CHO_therapeutic_glycoprotein_secretion"
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral backbone; antibiotic resistance removed via custom specification
    resistance: none
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: therapeutic_glycoprotein
        expression: high
        chain:
          - tag: SP_alpha_factor  # mammalian secretion signal peptide for CHO cells
          - gene:
              id: human_IgG1_Fc
              source: uniprot

    - terminator: SV40_polyA  # mammalian polyadenylation signal
