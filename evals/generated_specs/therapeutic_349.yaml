construct:
  name: "Mammalian_NonViral_Dual_Reporter"
  host: HEK293
  backbone:
    resistance: kanamycin  # Required for bacterial propagation; avoid viral SV40-driven selection markers
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Human elongation factor 1-alpha promoter used to avoid viral CMV or SV40 components
    - cistron:
        label: fluorescence_monitor
        expression: high
        gene:
          id: mNeonGreen
          source: fpbase
    - spacer: 100  # Spacer designed to accommodate a mammalian IRES for polycistronic expression
    - cistron:
        label: luciferase_monitor
        expression: high
        fused: false  # Enables independent translation initiation for the second reporter
        gene:
          id: P0DIX0
          source: uniprot
    - terminator: hGH_polyA  # Human growth hormone polyadenylation signal (non-viral)