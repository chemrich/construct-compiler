construct:
  name: "mammalian_dual_reporter_IRES_transfection_monitor"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    # IRES for cap-independent translation of second cistron
    - spacer: 590  # Poliovirus IRES-like synthetic element (non-viral, mammalian-optimized)

    - cistron:
        label: luciferase_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: Renilla_reniformis_luciferase
              source: uniprot

    - terminator: rrnB_T1
