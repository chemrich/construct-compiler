construct:
  name: therapeutic_protein_prodomain_cleavable
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: prodomain_therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: prodomain
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein
              source: uniprot

    - terminator: rrnB_T1
