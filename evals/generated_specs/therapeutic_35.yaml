construct:
  name: therapeutic_protein_with_cleavable_prodomain
  host: e_coli_bl21_de3

  backbone:
    resistance: none  # No antibiotic resistance as requested
    ori: pBR322
    source: custom

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: prodomain_placeholder  # Replace with specific pro-domain sequence
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein_placeholder  # Replace with specific therapeutic protein
              source: uniprot

    - terminator: rrnB_T1