construct:
  name: "yeast_surface_display_therapeutic_peptide"
  host: yeast

  backbone:
    resistance: null  # No antibiotic resistance genes
    ori: 2_micron    # Standard yeast plasmid origin
    source: addgene

  cassette:
    - promoter: GAL1  # Strong, inducible yeast promoter

    - cistron:
        label: surface_anchor
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot  # Yeast cell surface anchoring protein

    - spacer: 30

    - cistron:
        label: therapeutic_peptide
        expression: high
        fused: true  # Fused to AGA2 for surface display
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide_custom
              source: uniprot

    - terminator: CYC1  # Yeast terminator
