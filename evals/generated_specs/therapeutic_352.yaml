construct:
  name: "secreted_therapeutic_solubility_enhanced"
  host: HEK293
  backbone:
    resistance: none # ARG-free: uses antibiotic-free selection system
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Non-viral promoter selection
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - solubility_tag: MBP # Solubility-enhancing tag requested N-terminal to signal peptide
          - tag: IgK_leader # Secretion signal peptide
          - gene:
              id: EPO_HUMAN
              source: uniprot
    - terminator: bGH_polyA