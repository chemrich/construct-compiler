construct:
  name: therapeutic_antigen_vaccine_construct
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: therapeutic_antigen
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: antigen_therapeutic
              source: uniprot

    - terminator: rrnB_T1
