construct:
  name: "inducible_therapeutic_HEK293_design"
  host: HEK293
  backbone:
    # ARG-free requirement: kanamycin used for cloning/amplification; backbone is non-viral
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: activator
        expression: medium
        gene:
          id: rtTA3
    - terminator: SV40_pA
    - spacer: 100
    - promoter: TRE3G
    - cistron:
        label: therapeutic_payload
        expression: high
        gene:
          id: P60568
          source: uniprot
    - terminator: bGH_pA