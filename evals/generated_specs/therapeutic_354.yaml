construct:
  name: "chemically_inducible_therapeutic_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: activator
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: rtTA3
              source: uniprot
        # rtTA3 is the reverse tetracycline transactivator (tTA variant)
        # responds to doxycycline/anhydrotetracycline for inducible control

    - spacer: 30

    - cistron:
        label: therapeutic_protein
        expression: medium
        fused: false
        # This cistron uses its own promoter (tetracycline-responsive element, TRE)
        # In practice, the TRE promoter should be placed before this cistron
        # For this schema, we note that rtTA3 binds TRE sequences upstream
        chain:
          - tag: 6xHis
          - gene:
              id: IL12B
              source: uniprot
        # IL12B (IL-12 p40 subunit) as example therapeutic protein

    - terminator: rrnB_T1
