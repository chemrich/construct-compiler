construct:
  name: "stable_therapeutic_periplasmic_ecoli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: DsbA_signal_peptide
              source: uniprot
          - gene:
              id: therapeutic_protein
              source: uniprot
              # Note: User must provide UniProt ID for their specific therapeutic protein

    - terminator: rrnB_T1
