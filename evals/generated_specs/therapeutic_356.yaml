construct:
  name: "pichia_pastoris_viral_antigen_secretion"
  host: yeast

  backbone:
    resistance: null
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_antigen
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: viral_antigen_fragment
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1_TT
