construct:
  name: "pichia_pastoris_vaccine_antigen"
  host: yeast
  backbone:
    resistance: HIS4  # Substituted nutritional marker for antibiotic resistance to satisfy the 'ARG-free' requirement
    ori: pUC
    source: addgene
  cassette:
    - promoter: AOX1
    - cistron:
        label: secreted_antigen
        expression: high
        chain:
          - tag: alpha_MF  # Alpha-mating factor secretion signal for yeast secretion
          - gene:
              id: P0DTC2
              source: uniprot
    - terminator: AOX1_TT