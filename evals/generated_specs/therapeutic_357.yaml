construct:
  name: "non_viral_mitochondria_targeted_therapeutic"
  host: HEK293
  backbone:
    resistance: none # Note: Standard plasmid propagation typically requires resistance; "none" is provided per user request for a non-antibiotic construct.
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Human elongation factor 1-alpha promoter used as a constitutive, non-viral alternative to CMV.
    - cistron:
        label: mitochondrial_therapeutic
        expression: high
        chain:
          - tag: MTS # Mitochondrial Targeting Sequence (e.g., from COX8A)
          - gene:
              id: SOD1
              source: uniprot
    - terminator: bGH_PA # Bovine growth hormone polyadenylation signal used as a non-viral alternative to SV40 polyA.