construct:
  name: "mammalian_tripartite_self_cleaving_therapeutic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_domain_1
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: IL6
              source: uniprot

    - cistron:
        label: self_cleaving_peptide_1
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - cistron:
        label: therapeutic_domain_2
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: TNF
              source: uniprot

    - cistron:
        label: self_cleaving_peptide_2
        expression: high
        fused: false
        gene:
          id: T2A
          source: uniprot

    - cistron:
        label: therapeutic_domain_3
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: IFNG
              source: uniprot

    - terminator: rrnB_T1
