construct:
  name: "mammalian_transmembrane_receptor"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # no antibiotic resistance marker
    ori: null
    source: addgene

  cassette:
    - promoter: EF1_alpha  # constitutive mammalian promoter, strong and stable

    - cistron:
        label: receptor
        expression: high
        chain:
          - tag: HA  # N-terminal epitope tag for detection
          - gene:
              id: multi_pass_transmembrane_receptor
              source: uniprot
          - tag: NLS  # nuclear localization signal for proper subcellular trafficking

    - terminator: bGH_polyA  # mammalian poly(A) signal for mRNA stability
