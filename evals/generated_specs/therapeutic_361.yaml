construct:
  name: "E_coli_recombinant_fusion_protein_purification"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Comment: No antibiotic resistance marker specified; alternative: use toxin-antitoxin system for plasmid maintenance

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: target_protein
              # Note: Replace 'target_protein' with actual gene ID (e.g., from uniprot)

    - terminator: rrnB_T1
