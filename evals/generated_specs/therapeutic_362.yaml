construct:
  name: "yeast_constitutive_human_enzyme"
  host: yeast

  backbone:
    resistance: null  # No antibiotic resistance marker for safety
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: human_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P00001
              source: uniprot
              # User should specify the actual human enzyme UniProt ID

    - terminator: CYC1
