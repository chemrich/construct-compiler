construct:
  name: "mRNA_therapeutic_hEPO_IVT"
  host: in_vitro
  backbone:
    resistance: kanamycin # Required for plasmid template propagation; not included in final transcribed mRNA
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: therapeutic_payload
        expression: high
        gene:
          id: P01588 # Human Erythropoietin (hEPO)
          source: uniprot
    - terminator: T7term