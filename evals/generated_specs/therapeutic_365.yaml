construct:
  name: "CAR_T_cell_transient_single_chain"
  host: HEK293

  backbone:
    resistance: null  # No antibiotic resistance marker for safety
    ori: pUC  # Mammalian-compatible origin for transient expression
    source: custom

  cassette:
    - promoter: EF1_alpha  # Constitutive expression in human cells

    - cistron:
        label: CAR_single_chain
        expression: high
        chain:
          - tag: signal_peptide_CD8a  # Leader sequence for surface trafficking
          - cleavage_site: signal_peptidase  # Native signal peptide cleavage
          - gene:
              id: scFv_anti_CD19  # Single-chain Fv targeting CD19
              source: custom  # User to provide validated scFv sequence
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: transmembrane_CD8a  # CD8-alpha transmembrane domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: intracellular_4-1BB_CD3zeta  # 4-1BB co-stimulatory + CD3-zeta signaling domain
              source: uniprot

    - terminator: WPRE  # Woodchuck Posttranscriptional Regulatory Element for enhanced expression
