construct:
  name: "clinical_safe_mammalian_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # pTwist CMV is a mammalian expression vector without antibiotic resistance
    # Uses hygromycin B phosphotransferase for selection in mammalian cells (can be removed)
    # Includes mammalian codon optimization for clinical safety

  cassette:
    - promoter: EF1_alpha
      # Constitutive mammalian promoter, non-viral, suitable for in vivo expression

    - cistron:
        label: imaging_reporter
        expression: high
        chain:
          - tag: NLS
            # Nuclear localization signal for improved detection and reduced cytoplasmic toxicity
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase
              # mNeonGreen: bright, photostable, non-toxic, optimized for mammalian expression
              # Excellent for in vivo imaging with minimal immunogenicity

    - spacer: 24

    - cistron:
        label: safety_marker
        expression: medium
        fused: false
        chain:
          - gene:
              id: secreted_alkaline_phosphatase
              source: uniprot
              # SEAP serves as a non-immunogenic, easily detectable biomarker
              # Secreted nature allows non-invasive detection from blood/serum

    - terminator: rrnB_T1
