construct:
  name: "dual_therapeutic_subunit_2A_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # No antibiotic resistance marker
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: subunit_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_subunit_1
              source: uniprot

    - spacer: 51  # P2A self-cleaving peptide (51 bp)

    - cistron:
        label: subunit_2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_subunit_2
              source: uniprot

    - terminator: rrnB_T1
