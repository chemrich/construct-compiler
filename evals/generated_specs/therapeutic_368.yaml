construct:
  name: "vaccine_antigen_expression_system"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: antigen
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: vaccine_antigen
              source: uniprot

    - terminator: rrnB_T1
