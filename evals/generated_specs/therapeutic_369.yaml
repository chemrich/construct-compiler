construct:
  name: "insect_scfv_intracellular_expression"
  host: insect

  backbone:
    resistance: null
    ori: pUC
    source: custom

  cassette:
    - promoter: OpIE2

    - cistron:
        label: scfv
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: scfv_intracellular
              source: uniprot

    - terminator: SV40_polyA
