construct:
  name: "dual_subunit_therapeutic_linker"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: dual_subunit
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein_subunit_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_protein_subunit_1
              source: uniprot

    - terminator: rrnB_T1
