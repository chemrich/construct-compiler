```yaml
construct:
  name: "therapeutic_protein_tandem_dimer"
  host: e_coli

  backbone:
    resistance: none
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: tandem_dimer
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01308  # human insulin as example therapeutic protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01308  # second identical subunit
              source: uniprot

    - terminator: rrnB_T1
```