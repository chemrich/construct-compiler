construct:
  name: "plant_apoplast_therapeutic_secretion"
  host: plant

  backbone:
    resistance: null  # antibiotic-free design
    ori: plant_autonomous_replication  # plant-specific autonomous replication element
    source: custom

  cassette:
    - promoter: CaMV35S  # constitutive plant promoter

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - signal_peptide: plant_secretion_signal  # N-terminal ER-targeting signal for apoplast localization
          - gene:
              id: therapeutic_target
              source: uniprot
          - c_tag: HDEL  # C-terminal ER retention signal (optional: use SEKDEL for apoplast accumulation instead)

    - terminator: plant_polyA  # plant-specific polyadenylation signal
