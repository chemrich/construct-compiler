construct:
  name: "bacterial_enzyme_constitutive_expression"
  host: e_coli

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene
    # Alternative: use a marker-free or auxotrophic selection system in practice

  cassette:
    - promoter: J23100  # Constitutive BioBrick promoter (no antibiotics, standardized)

    - cistron:
        label: enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P0AEX9  # Example: E. coli TolC outer membrane protein or similar
              source: uniprot

    - terminator: rrnB_T1
