construct:
  name: "therapeutic_precursor_enzyme_expressor"
  host: e_coli
  backbone:
    # Industrial bioproduction requires antibiotic-free selection (e.g., auxotrophy or toxin-antitoxin systems); 
    # kanamycin is specified here as a placeholder to satisfy schema requirements.
    resistance: kanamycin
    ori: p15A
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: DAHP_synthase
        expression: high
        gene:
          id: P0ABH7
          source: uniprot
    - terminator: rrnB_T1