construct:
  name: "IVT_Bioactive_Peptide_Discovery_Template"
  host: in_vitro
  backbone:
    resistance: none # Explicitly set to none per requirement for therapeutic discovery pipeline compatibility
    ori: pUC
    source: custom
  cassette:
    - promoter: T7 # Optimized for in vitro transcription (IVT) systems
    - cistron:
        label: bioactive_peptide
        expression: high
        gene:
          id: P01275 # Glucagon: a representative short, biologically active peptide
          source: uniprot
    - terminator: T7term