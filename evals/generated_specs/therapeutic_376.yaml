construct:
  name: "mammalian_tet_on_therapeutic_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-integrating episomal plasmid backbone
    # No antibiotic resistance genes; selection via transient transfection
    # Compatible with Tet-On system

  cassette:
    - promoter: TRE  # Tetracycline Response Element (doxycycline-inducible)
    
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CXCL10"  # Example: chemokine for immune therapy
              source: uniprot

    - terminator: rrnB_T1

  # Note: This construct requires co-transfection with a constitutive rtTA (reverse Tet transactivator)
  # expression vector. Doxycycline (or doxycycline analogues) in culture medium activates TRE-driven
  # expression. The episomal backbone ensures no chromosomal integration and maintains temporal control
  # without genomic instability. Selection can be performed via fluorescent marker co-expression if needed.
