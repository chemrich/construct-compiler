construct:
  name: metabolite_biosensor_no_resistance
  host: e_coli

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # Metabolite-responsive promoter (L-arabinose inducible)

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
