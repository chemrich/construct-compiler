construct:
  name: "bacillus_peptide_scaffold_production"
  host: bacillus

  backbone:
    resistance: null  # No antibiotic resistance - using Bacillus integration or auxotrophic selection
    ori: pBS1C  # Bacillus-compatible origin
    source: addgene

  cassette:
    - promoter: aprE  # Strong constitutive Bacillus promoter (alkaline protease)

    - cistron:
        label: scaffold_peptide
        expression: high
        chain:
          - tag: His6  # Purification via IMAC
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: Factor_Xa  # For tag removal if needed
          - gene:
              id: scaffold_peptide_bacillus
              source: uniprot

    - spacer: 25

    - cistron:
        label: localization_signal
        fused: false
        gene:
          id: AmyE_signal_peptide
          source: uniprot
        # AmyE signal allows secretion into culture medium for easier downstream processing

    - terminator: rrnB_T1
