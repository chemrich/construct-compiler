construct:
  name: "yeast_human_enzyme_high_expression"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: human_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: null
              source: uniprot
              note: "Specify UniProt ID for target human enzyme"

    - terminator: CYC1
