construct:
  name: "human_therapeutic_enzyme_expression_optimized"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: Antibiotic resistance excluded per requirements

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: uniprot_lookup_required
              source: uniprot
              # User must specify the UniProt ID for the 30 kDa human enzyme

    - terminator: rrnB_T1
