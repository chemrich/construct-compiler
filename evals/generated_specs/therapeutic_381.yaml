construct:
  name: "humanized_Fab_secretion_vector_clinical"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # Clinical manufacturing: no antibiotic markers
    ori: null         # Non-viral origin of replication implied by clinical grade vector
    source: addgene
    # Note: This vector uses GS selection (DHFR) as clinical-grade, non-viral marker

  cassette:
    - promoter: EF1_alpha
      # EF1_alpha is constitutive and clinically acceptable for stable expression

    - cistron:
        label: Fab_heavy_chain
        expression: high
        chain:
          - tag: Signal_Peptide_SP  # Mammalian secretion signal for ER targeting
          - gene:
              id: "humanized_Fab_heavy_chain"
              source: uniprot
          - tag: 6xHis  # For affinity purification (C-terminal)

    - terminator: SV40_poly_A
      # SV40 polyadenylation signal; clinically acceptable

    - promoter: EF1_alpha

    - cistron:
        label: Fab_light_chain
        expression: high
        chain:
          - tag: Signal_Peptide_SP
          - gene:
              id: "humanized_Fab_light_chain"
              source: uniprot
          - tag: FLAG  # Optional secondary tag for light chain purification

    - terminator: SV40_poly_A
