construct:
  name: yeast_surface_display_therapeutic_peptide
  host: yeast

  backbone:
    resistance: null
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - gene:
              id: alpha_factor_signal
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot

    - terminator: CYC1
