construct:
  name: human_ABC_complex_therapeutic_operon
  host: e_coli_bl21_de3
  
  backbone:
    resistance: null  # No antibiotic resistance as specified
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7
    
    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: subunit_A
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - gene:
              id: subunit_B
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: subunit_C
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: subunit_C
              source: uniprot
    
    - terminator: rrnB_T1
