construct:
  name: "human_ESR1_mEGFP_nuclear_fusion"
  host: HEK293
  backbone:
    resistance: none  # User strictly prohibited antibiotic resistance markers
    ori: pUC          # Required for bacterial propagation during construction
    source: custom
  cassette:
    - promoter: EF1_alpha  # Moderate constitutive human promoter, avoiding viral CMV
    - cistron:
        label: receptor_fusion
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: ESR1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: hGH_polyA  # Human growth hormone polyadenylation signal, avoiding viral SV40