construct:
  name: "human_nuclear_receptor_mCherry_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: nuclear_receptor
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: NR3C1
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 1

    - cistron:
        label: fluorescent_reporter
        expression: medium
        fused: true
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
