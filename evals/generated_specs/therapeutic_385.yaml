construct:
  name: "toxic_cancer_therapy_enzyme_tight_inducible"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"
    # Note: pET-28b(+) includes kanamycin resistance by default in standard catalogs.
    # For antibiotic-free selection, this would require a custom backbone with alternative
    # selection (e.g., auxotrophic complementation). Using pET-28b(+) as specified but
    # flagging that true antibiotic-free requires custom backbone substitution.

  cassette:
    - promoter: T7lac
      # T7lac provides tight basal repression via LacI and inducible control via IPTG

    - cistron:
        label: toxic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - gene:
              id: toxic_enzyme
              source: uniprot
              # User must specify actual UniProt ID; placeholder indicates custom/proprietary enzyme

    - terminator: rrnB_T1
