construct:
  name: "ivt_human_therapeutic_peptide"
  host: in_vitro
  # Backbone omitted as per user requirement for linear IVT template without replication/resistance markers
  cassette:
    - promoter: T7
    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P01308 # Human Insulin
              source: uniprot
    - terminator: T7term