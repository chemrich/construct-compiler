construct:
  name: "yeast_scFv_secretion_construct"
  host: yeast

  backbone:
    resistance: none
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv_secreted
        expression: high
        chain:
          - tag: HA
          - secretion_signal: alpha_factor
          - gene:
              id: scFv_VH_VL
              source: uniprot
          - tag: 6xHis
          - cleavage_site: 3C

    - terminator: CYC1
