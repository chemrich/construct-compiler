construct:
  name: "dual_therapeutic_IRES_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein_X
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: NES_tag
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: X_therapeutic
              source: uniprot

    - spacer: 25

    - cistron:
        label: IRES_element
        expression: high
        chain:
          - gene:
              id: EMCV_IRES
              source: uniprot

    - spacer: 25

    - cistron:
        label: Protein_Y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Y_therapeutic
              source: uniprot

    - terminator: rrnB_T1
