construct:
  name: "E_coli_soluble_human_protein_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: Antibiotic resistance marker excluded per specifications

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: human_target_protein
              source: uniprot

    - terminator: rrnB_T1
