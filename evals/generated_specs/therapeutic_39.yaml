construct:
  name: "mammalian_targeted_degradation_recruiter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: pTwist CMV is antibiotic-free backbone suitable for therapeutic applications

  cassette:
    - promoter: CMV

    - cistron:
        label: degradation_recruiter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: VHL_binding_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_target_binding
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
