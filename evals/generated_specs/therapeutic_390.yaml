construct:
  name: "mammalian_transmembrane_receptor_surface_display"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-antibiotic selection: using DHFR for methotrexate selection
    selectable_marker: DHFR
    ori: SV40
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: receptor_fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EGFR
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: WPRE
