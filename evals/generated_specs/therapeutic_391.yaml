construct:
  name: human_therapeutic_peptide_production
  host: e_coli
  backbone:
    resistance: kanamycin # Note: The schema requires an antibiotic resistance gene; kanamycin is selected as a placeholder despite the request to avoid them.
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100 # Strong constitutive bacterial promoter (non-viral).
    - cistron:
        label: target_peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01133 # Human Epidermal Growth Factor (EGF), a therapeutic peptide (approx. 50 residues).
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator (non-viral).