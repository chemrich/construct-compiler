construct:
  name: "E_coli_therapeutic_peptide_hisTag"
  host: e_coli_bl21

  backbone:
    resistance: null  # Antibiotic resistance omitted per specification
    ori: pBR322
    source: custom

  cassette:
    - promoter: trc  # Strong constitutive promoter suitable for high-yield expression

    - cistron:
        label: therapeutic_peptide
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: human_therapeutic_peptide_codon_optimized
              source: uniprot
              # Note: Sequence must be codon-optimized for E. coli during compilation

    - terminator: rrnB_T1
