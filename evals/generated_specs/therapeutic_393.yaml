construct:
  name: "e_coli_therapeutic_protease_pro_enzyme"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protease_pro_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: thrombin
              source: uniprot
          - cleavage_site: Factor_Xa

    - terminator: rrnB_T1
