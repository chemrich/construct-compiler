construct:
  name: "plant_hGF_apoplast_expression"
  host: algae
  
  backbone:
    resistance: null  # No antibiotic resistance for clinical safety
    ori: null
    source: custom
  
  cassette:
    - promoter: "ubiquitin_constitutive"  # Strong, constitutive plant promoter
    
    - cistron:
        label: human_growth_factor
        expression: high
        chain:
          - tag: "signal_peptide_APOPLAST"  # Plant apoplast-targeting secretion signal
          - gene:
              id: "HGF"
              source: "uniprot"
          - linker:
              type: "GS_flexible"
              repeats: 1
          - tag: "6xHis"  # C-terminal His tag for purification
    
    - terminator: "plant_polyA_signal"  # Plant-specific polyadenylation signal (e.g., Agrobacterium tumefaciens)
