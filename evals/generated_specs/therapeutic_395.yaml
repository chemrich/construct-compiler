construct:
  name: "human_cytokine_surface_reporter_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-antibiotic selection: mammalian cytosine deaminase (CDH)
    selectable_marker: CDH
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: cytokine
        expression: high
        chain:
          - signal_peptide: SP_human_IgG  # N-terminal signal for ER targeting
          - gene:
              id: IL_12_p40
              source: uniprot

    - spacer: 25

    - element: IRES_internal_entry  # IRES for cap-independent translation of second cistron

    - spacer: 25

    - cistron:
        label: surface_reporter
        expression: high
        fused: false
        chain:
          - signal_peptide: SP_human_CD33  # N-terminal signal for plasma membrane trafficking
          - gene:
              id: CD34
              source: uniprot
          - tag: GPI_anchor  # Glycosylphosphatidylinositol anchor for cell surface localization

    - terminator: SV40_polyA
