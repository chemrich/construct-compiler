construct:
  name: "miRNA_mimic_mammalian_Pol3"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Using pTwist CMV as base; resistance gene will be removed in final construct
    # Alternative: custom backbone with no resistance marker for therapeutic use
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6
      # U6 is RNA Pol III promoter for high constitutive ncRNA expression

    - cistron:
        label: miRNA_precursor
        expression: high
        chain:
          - element: 5prime_flank
            # 5' flanking sequence for proper miRNA processing
            sequence_feature: "GGCCAGCCATGG"
          
          - gene:
              id: hsa-miR-122
              # Therapeutic miRNA mimic targeting hepatitis C virus
              source: mirbase
          
          - element: 3prime_flank
            # 3' flanking sequence (poly-U tract) for Pol III termination
            sequence_feature: "TTTTTT"

    - terminator: U6_poly_U
      # Pol III termination: poly(T) tract for proper transcript release
