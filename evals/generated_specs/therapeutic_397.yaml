construct:
  name: "therapeutic_protein_with_chaperone_coexpression"
  host: e_coli_bl21
  
  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: therapeutic_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_protein
              source: uniprot
    
    - spacer: 25
    
    - promoter: lacUV5
    
    - cistron:
        label: chaperone_dnak
        expression: medium
        fused: false
        gene:
          id: dnaK
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: chaperone_dnaj
        expression: medium
        fused: false
        gene:
          id: dnaJ
          source: uniprot
    
    - terminator: rrnB_T1
