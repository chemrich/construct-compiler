construct:
  name: dual_therapeutic_peptide_no_resistance
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: custom
    # Note: Construct specified no antibiotic resistance genes.
    # In practice, a selectable marker is typically required for plasmid maintenance.
    # This design omits it per specification, but should use biosafety alternatives
    # (e.g., auxotrophic complementation) in actual implementation.

  cassette:
    - promoter: T7lac

    - cistron:
        label: peptide_1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: therapeutic_peptide_1
              source: uniprot

    - spacer: 25

    - cistron:
        label: self_cleaving_linker_2A
        expression: high
        fused: false
        chain:
          - gene:
              id: 2A_self_cleaving_peptide
              source: uniprot

    - spacer: 25

    - cistron:
        label: peptide_2
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: therapeutic_peptide_2
              source: uniprot

    - terminator: rrnB_T1
