construct:
  name: dCas9_KRAB_gRNA_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: dCas9_KRAB
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot
          - tag: NLS

    - terminator: rrnB_T1

    # Second cassette for gRNA expression using Pol III promoter
    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold
          source: uniprot

    - terminator: BBa_B0015
