construct:
  name: therapeutic_scFv_soluble_expression
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Placeholder: schema requires selection; user requested no antibiotic resistance.
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac # Bacterial hybrid promoter used to avoid viral T7 system components.
    - cistron:
        label: therapeutic_scFv
        expression: high
        chain:
          - tag: pelB # Periplasmic secretion signal to promote oxidative folding and solubility.
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: scFv_anti_TNFa
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis # C-terminal purification tag as requested.
    - terminator: rrnB_T1 # Bacterial terminator to avoid viral sequences.