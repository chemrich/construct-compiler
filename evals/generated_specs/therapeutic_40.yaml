```yaml
construct:
  name: therapeutic_scFv_expression
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin  # Required for selection despite user preference
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_scFv
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: scFv_template  # User must provide specific scFv sequence
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
