construct:
  name: human_growth_factor_secretion_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Factor_Xa
          - gene:
              id: FGF2
              source: uniprot
          - tag: signal_peptide_hsp
        secretion: true

    - terminator: WPRE
