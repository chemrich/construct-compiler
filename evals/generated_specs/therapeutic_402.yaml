construct:
  name: recombinant_antigen_yeast_vaccine
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: antigen
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigen
              source: uniprot

    - terminator: CYC1
