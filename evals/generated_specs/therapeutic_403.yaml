construct:
  name: "human_protein_A_B_dimer_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A_secreted
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: IL2SS
          - gene:
              id: P00001
              source: uniprot
          - cleavage_site: P2A

    - cistron:
        label: protein_B_intracellular
        expression: high
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: P00002
              source: uniprot

    - terminator: SV40_poly_A
