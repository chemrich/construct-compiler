construct:
  name: "scFv_secreted_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: scFv_therapeutic
        expression: high
        chain:
          - tag: signal_peptide_IgE  # N-terminal secretion signal
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: Fc  # Enhanced stability via Fc domain
          - tag: 8xHis  # C-terminal purification tag

    - terminator: poly_A
