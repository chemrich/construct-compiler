construct:
  name: yeast_surface_antigen_display
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_antigen
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HA_epitope
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p_anchor
              source: uniprot
              # C-terminal yeast cell surface anchor (Aga2 from panning vector)

    - terminator: CYC1
