construct:
  name: "mammalian_therapeutic_CPP_purification"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CPP_therapeutic"
              # Note: CPP sequence (e.g., TAT, polyarginine, or penetratin) should be N-terminal
              # This represents a fusion protein with cell-penetrating peptide functionality

    - terminator: rrnB_T1
