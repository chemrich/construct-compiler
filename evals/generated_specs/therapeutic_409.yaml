construct:
  name: "multi_domain_therapeutic_E_coli"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: domain1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain2
              source: uniprot

    - terminator: rrnB_T1
