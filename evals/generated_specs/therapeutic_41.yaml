construct:
  name: "rhGH_CHO_secreted_purification"
  host: CHO
  backbone:
    resistance: none # User requested a construct free of antibiotic resistance markers
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # EF1_alpha used instead of CMV to meet the non-viral requirement
    - cistron:
        label: rhGH_variant
        expression: high
        chain:
          - tag: signal_peptide # N-terminal secretion signal for media export
          - gene:
              id: P01241
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: Twin-Strep # C-terminal tag for gentle purification
    - terminator: bGH_PA