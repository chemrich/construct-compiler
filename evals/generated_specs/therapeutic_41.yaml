construct:
  name: hGH_variant_CHO_secretion
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"
    ori: ColA
    source: addgene
    # No antibiotic resistance marker specified for mammalian CHO expression
    # Selectable marker omitted per requirements

  cassette:
    - promoter: CMV

    - cistron:
        label: hGH_secreted
        expression: high
        chain:
          - tag: signal_peptide_hGH
            # N-terminal human GH signal peptide for ER-mediated secretion
          - gene:
              id: "GH1"
              source: uniprot
          - tag: Strep-II
            # C-terminal Strep-tag for affinity purification

    - terminator: SV40_polyA
