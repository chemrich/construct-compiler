construct:
  name: "heat_shock_diagnostic_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: dnaK # Substituted standard E. coli heat-shock inducible promoter
    - cistron:
        label: reporter
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1