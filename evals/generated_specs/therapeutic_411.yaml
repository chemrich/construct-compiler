construct:
  name: heat_shock_inducible_reporter
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # araBAD is commonly used as a heat-shock inducible alternative in E. coli; alternatively could use rhaPBAD

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
