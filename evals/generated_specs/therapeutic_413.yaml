construct:
  name: "yeast_scaffold_protein_secretion"
  host: yeast

  backbone:
    catalog_vector: "pPICZα"
    resistance: zeocin
    ori: pBR322

  cassette:
    - promoter: AOX1

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: "P25391"
              source: uniprot

    - terminator: rrnB_T1
