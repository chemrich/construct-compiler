construct:
  name: targeting_enzyme_reporter_fusion
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: bifunctional_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: targeting_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: horseradish_peroxidase
              source: uniprot

    - terminator: rrnB_T1
