construct:
  name: "yeast_nanoparticle_component"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: nanoparticle_component
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: nanoparticle_assembly_domain
              source: uniprot
          # Note: assembly domain sequence must be provided separately or referenced by UniProt ID

    - terminator: rrnB_T1
