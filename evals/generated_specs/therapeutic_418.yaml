construct:
  name: human_growth_factor_secreted_inducible
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: FGF2
              source: uniprot
          - tag: KDEL  # ER retention signal for proper secretion pathway

    - terminator: rrnB_T1
