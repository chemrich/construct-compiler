```yaml
construct:
  name: therapeutic_proteins_A_B_yeast_coexpression
  host: yeast

  backbone:
    resistance: none
    ori: ARS_CEN
    source: yeast_shuttle

  cassette:
    - promoter: ADH1

    - cistron:
        label: protein_A
        expression: medium
        chain:
          - solubility_tag: SUMO
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: medium
        fused: false
        chain:
          - gene:
              id: protein_B
              source: uniprot
          - tag: Myc

    - terminator: ADH1_term
