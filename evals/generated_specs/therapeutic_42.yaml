construct:
  name: "yeast_dual_therapeutic_AB_SUMO_Myc"
  host: yeast

  backbone:
    resistance: none
    ori: pRS426
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - gene:
              id: protein_B
              source: uniprot
          - tag: Myc

    - terminator: rrnB_T1
