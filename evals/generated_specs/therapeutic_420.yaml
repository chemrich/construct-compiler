construct:
  name: "therapeutic_hGH_solubility_optimized"
  host: e_coli_bl21
  backbone:
    resistance: none  # User requested no antibiotic resistance markers; implies non-antibiotic selection or transient system
    ori: pUC
    source: custom
  cassette:
    - promoter: tac  # Bacterial promoter used to avoid viral components (like T7)
    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: P01241
              source: uniprot
    - terminator: rrnB_T1  # Bacterial terminator (E. coli rRNA operon)