construct:
  name: "human_therapeutic_enzyme_soluble_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: null
              # User must provide UniProt ID for the specific human therapeutic enzyme
              # Example: P00750 for human alkaline phosphatase
              source: uniprot

    - terminator: rrnB_T1
