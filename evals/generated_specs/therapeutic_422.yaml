construct:
  name: "CAR_T_transient_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression backbone without antibiotic resistance
    # Integration-free for transient expression in primary T-cells

  cassette:
    - promoter: CMV
      # Strong mammalian promoter for high transgene expression in T-cells

    - cistron:
        label: CAR
        expression: high
        chain:
          - tag: HA
            # N-terminal epitope tag for CAR detection and tracking
          - gene:
              id: "scFv_anti_CD19"
              # Single-chain variable fragment targeting CD19 (standard CAR architecture)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD8a_hinge"
              # Extracellular spacer domain from CD8α for optimal CAR geometry
              source: uniprot
          - gene:
              id: "CD28_transmembrane"
              # Transmembrane domain from CD28
              source: uniprot
          - gene:
              id: "CD28_costimulatory"
              # CD28 co-stimulatory intracellular domain (essential for T-cell activation)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD3zeta_signaling"
              # CD3ζ signaling domain for TCR-like activation (essential for CAR function)
              source: uniprot
          - tag: PEST
            # C-terminal degron for transient expression (auto-degradation control)

    - terminator: bGH_polyA
      # Bovine growth hormone polyadenylation signal for mRNA stability and export
