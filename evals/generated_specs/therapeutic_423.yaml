construct:
  name: "yeast_secreted_bacterial_antigen"
  host: yeast

  backbone:
    catalog_vector: "pPICZαA"
    ori: 2μm
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_antigen
        expression: high
        chain:
          - tag: alpha_factor_signal  # N-terminal secretion leader for yeast ER/Golgi targeting
          - gene:
              id: bacterial_surface_antigen
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal purification tag

    - terminator: CYC1
