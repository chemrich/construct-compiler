construct:
  name: mitochondrial_matrix_enzyme_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    ori: pUC
    # No antibiotic resistance marker - mammalian expression uses selection-free approach
    source: addgene

  cassette:
    - promoter: EF1_alpha  # Strong constitutive mammalian promoter

    - cistron:
        label: mito_enzyme
        expression: high
        chain:
          - tag: 6xHis                    # C-terminal purification tag for mammalian expression
          - solubility_tag: SUMO          # Enhances expression and solubility in mammalian cells
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: MTS                      # Mitochondrial targeting sequence (N-terminal for matrix import)
          - gene:
              id: enzyme_of_interest
              source: uniprot

    - terminator: rrnB_T1
