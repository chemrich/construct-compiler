construct:
  name: "mammalian_secreted_heterodimer_AB"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - signal_peptide: hIgG_signal
          - gene:
              id: subunit_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: P2A_peptide
        expression: high
        fused: false
        gene:
          id: P2A
          source: uniprot

    - spacer: 30

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - signal_peptide: hIgG_signal
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: rrnB_T1
