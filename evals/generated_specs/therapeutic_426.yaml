construct:
  name: "non_viral_CRISPR_base_editor_HEK293"
  host: HEK293

  cassette:
    - promoter: CMV

    - cistron:
        label: ABE8e_nuclease
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ABE8e
              source: uniprot
          - tag: NLS

    - terminator: bGH_polyA

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        gene:
          id: CRISPR_gRNA
          source: uniprot

    - terminator: U6_terminator

  backbone:
    resistance: null
    ori: null
    source: custom
