construct:
  name: "diagnostic_GFP_reporter_ecoli"
  host: e_coli
  
  backbone:
    resistance: null  # No antibiotic resistance gene
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: trc  # Strong constitutive promoter for E. coli
    
    - cistron:
        label: GFP_reporter
        expression: high
        chain:
          - solubility_tag: MBP  # Enhances cytoplasmic solubility
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase
    
    - terminator: rrnB_T1
