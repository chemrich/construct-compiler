construct:
  name: "constitutive_soluble_megfp_reporter"
  host: e_coli
  backbone:
    resistance: none # User specified no antibiotic resistance; selection must be achieved via alternative methods like auxotrophy.
    ori: pUC
    source: custom
  cassette:
    - promoter: J23100 # Strong constitutive synthetic promoter (Anderson library), non-viral.
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1 # Strong bacterial terminator from E. coli, non-viral.