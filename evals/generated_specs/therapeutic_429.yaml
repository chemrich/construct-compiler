construct:
  name: "pichia_pastoris_secreted_peptide"
  host: yeast

  backbone:
    catalog_vector: "pGAPZα"
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAP

    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: alpha_factor_signal
          - cleavage_site: 3C
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: CYC1_polya
