construct:
  name: "inducible_nonviral_aggregation_prone_peptide_fusion"
  host: e_coli
  backbone:
    # Note: Schema requires an antibiotic resistance; kanamycin selected as the default fallback despite the 'no antibiotic' request.
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Inducible bacterial promoter (avoids viral T7/T7lac)
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - cleavage_site: 3C # Note: HRV3C is of viral origin (Rhinovirus), but used here per specific functional request.
          - gene:
              id: P05067 # UniProt ID for Amyloid-beta precursor protein (Abeta42 is aggregation-prone)
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator (avoids viral T7term)