construct:
  name: "enzyme_scaffold_assembly_system"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: This construct uses a resistance-free backbone suitable for
    # expression systems relying on metabolic complementation or selection
    # alternatives (e.g., auxotrophic complementation or counter-selection).

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: synthetic_scaffold
              source: custom

    - terminator: rrnB_T1
