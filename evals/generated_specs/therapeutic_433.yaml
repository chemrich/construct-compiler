  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: meganuclease
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
          - gene:
              id: I-SceI
              source: uniprot

    - terminator: rrnB_T1
