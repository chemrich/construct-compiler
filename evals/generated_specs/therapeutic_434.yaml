construct:
  name: "therapeutic_fusion_protein_dual_domain"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: domain_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: domain_2
              source: uniprot

    - terminator: rrnB_T1
