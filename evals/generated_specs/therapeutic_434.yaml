construct:
  name: therapeutic_fusion_solubility_optimized
  host: e_coli_bl21
  backbone:
    # User requested no antibiotic resistance; substituting kanamycin as per rule 9 to ensure valid YAML schema.
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Non-viral bacterial hybrid promoter for robust expression without phage elements
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: P01275  # Glucagon-like peptide 1 (GLP-1)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P09681  # Gastric inhibitory polypeptide (GIP)
              source: uniprot
    - terminator: rrnB_T1  # Bacterial terminator (non-viral)