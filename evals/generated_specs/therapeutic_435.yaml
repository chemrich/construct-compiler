construct:
  name: "inducible_secreted_therapeutic_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Using pTwist CMV as base; will specify tetracycline-inducible modifications
    # Antibiotic resistance gene should be removed or replaced with non-antibiotic selection
    resistance: null
    source: addgene

  cassette:
    - promoter: TRE3G
      # TRE3G = tetracycline response element (Tet-On system)
      # Requires co-expression of tTA or rtTA transactivator

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - tag: signal_peptide_SP
            # Mammalian secretion signal peptide (e.g., IgE leader sequence or human PRLR signal)
          - gene:
              id: therapeutic_protein
              # Replace with actual UniProt ID or gene symbol for your protein of interest
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
            # C-terminal His-tag for purification via IMAC

    - terminator: SV40_poly_A
      # SV40 polyadenylation signal for mammalian expression
