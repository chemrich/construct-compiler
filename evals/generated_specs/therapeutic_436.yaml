construct:
  name: "yeast_multidomain_therapeutic_secreted"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: PGK1

    - cistron:
        label: therapeutic_polyprotein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: domain_1
              source: uniprot
          - cleavage_site: 3C
          - gene:
              id: domain_2
              source: uniprot
          - cleavage_site: TEV
          - gene:
              id: domain_3
              source: uniprot

    - terminator: CYC1
