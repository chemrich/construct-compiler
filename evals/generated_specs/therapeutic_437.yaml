construct:
  name: ER_chaperone_mammalian_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    # Non-viral backbone; no antibiotic resistance required for mammalian expression

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: ER_chaperone
        expression: high
        chain:
          - tag: Strep-II
          - cleavage_site: 3C
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HSP70
              source: uniprot
          - tag: KDEL

    - terminator: rrnB_T1
