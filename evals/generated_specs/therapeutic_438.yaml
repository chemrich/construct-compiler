construct:
  name: "mammalian_shRNA_knockdown_U6"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Using mammalian expression vector; antibiotic resistance omitted per requirements
    ori: ColA
    source: addgene

  cassette:
    - promoter: U6
      # U6 is a constitutive RNA Pol III promoter ideal for shRNA expression

    - cistron:
        label: shRNA
        expression: high
        chain:
          - gene:
              id: shRNA_target
              # User should provide specific shRNA sequence targeting their gene of interest
              # Format: 5'-[19bp sense]-TTCAAGAGA-[19bp antisense]-TTTT-3'
              source: custom

    - terminator: poly_T
      # Poly(T) terminator required for Pol III transcription termination
