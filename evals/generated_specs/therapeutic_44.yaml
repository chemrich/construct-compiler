construct:
  name: "GFP_gene_editor_NLS_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector; no resistance marker per user request

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP_editor_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: Cas9
              source: uniprot
          - tag: NLS

    - terminator: rrnB_T1
