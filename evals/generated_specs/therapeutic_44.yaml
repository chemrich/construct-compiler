```yaml
construct:
  name: gene_editing_enzyme_GFP_NLS
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: gene_editor
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P9WQL1  # Cas9 from Streptococcus pyogenes
              source: uniprot
          - tag: NLS

    - terminator: SV40_polyA
```