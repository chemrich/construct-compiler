construct:
  name: "therapeutic_enzyme_expression_pBAD"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance - uses auxotrophic selection instead
    ori: p15A
    source: addgene
    # Comment: Using p15A (low-copy) for reduced metabolic burden and lower endotoxin risk

  cassette:
    - promoter: araBAD
      # Comment: araBAD provides tight, dose-dependent control without T7 phage elements

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
            # Comment: His-tag allows IMAC purification; easily cleavable for clinical use
          - cleavage_site: TEV
            # Comment: TEV protease removes His-tag post-purification if needed
          - gene:
              id: human_enzyme
              source: uniprot
              # Note: Replace "human_enzyme" with specific UniProt ID (e.g., P12345)

    - terminator: rrnB_T1
    # Comment: Strong, phage-independent terminator for efficient transcript termination
