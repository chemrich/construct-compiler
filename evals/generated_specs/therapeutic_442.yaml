construct:
  name: yeast_surface_antigen_vaccine
  host: yeast

  backbone:
    resistance: none
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_antigen
        expression: high
        chain:
          - tag: HA
          - gene:
              id: OVA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p_anchor
              source: uniprot

    - terminator: CYC1
