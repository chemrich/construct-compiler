construct:
  name: "human_fibroblast_rapamycin_inducible_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null  # No antibiotic resistance for clinical safety
    ori: null

  cassette:
    - promoter: CMV

    - cistron:
        label: rapalogs_binding_domain
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: "FKBP12_v36"
              source: uniprot

    - spacer: 30

    - cistron:
        label: mCherry_reporter
        expression: medium
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
