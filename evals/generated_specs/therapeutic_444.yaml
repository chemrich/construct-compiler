construct:
  name: "dual_enzyme_metabolic_pathway_operon"
  host: e_coli
  
  backbone:
    resistance: null  # No antibiotic resistance per compliance requirement
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD  # Arabinose-inducible for tunable, efficient expression
    
    - cistron:
        label: enzyme_x
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_x  # Replace with actual UniProt ID
              source: uniprot
    
    - spacer: 25  # RBS spacing for independent translation initiation
    
    - cistron:
        label: enzyme_y
        expression: high
        fused: false  # Independent translation ensures both enzymes expressed at functional levels
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: enzyme_y  # Replace with actual UniProt ID
              source: uniprot
    
    - terminator: rrnB_T1
