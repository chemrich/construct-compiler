construct:
  name: "hHSC_sgRNA_expression_non_viral"
  host: HEK293

  backbone:
    resistance: null  # No antibiotic resistance - safety requirement for HSC use
    ori: pUC
    source: custom

  cassette:
    - promoter: U6  # Pol III promoter for optimal sgRNA production

    - cistron:
        label: sgRNA
        expression: high
        chain:
          - gene:
              id: CRISPR_sgRNA_scaffold
              source: uniprot
              # Generic sgRNA scaffold; user should provide target sequence via design

    - terminator: U6_terminator  # Pol III-specific terminator for efficient sgRNA release
