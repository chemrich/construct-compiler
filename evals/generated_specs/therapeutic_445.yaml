construct:
  name: "sgRNA_U6_HSC_Safe"
  host: mammalian
  backbone:
    resistance: kanamycin # Kanamycin is included for E. coli cloning; for clinical safety in HSCs, marker-free technology like minicircle or nanoplasmid is required.
    ori: pUC
    source: custom
  cassette:
    - promoter: U6
    - cistron:
        label: target_sgRNA
        gene:
          id: sgRNA_scaffold
    - terminator: rrnB_T1 # Standard terminator; U6 transcription naturally terminates at a 5-6bp poly-T tract.