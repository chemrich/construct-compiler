construct:
  name: "human_therapeutic_soluble_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Note: antibiotic-free backbone using auxotrophic selection instead

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_target
              source: uniprot

    - terminator: rrnB_T1
