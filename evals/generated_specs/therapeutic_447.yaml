construct:
  name: "mitochondrial_therapeutic_SOD2_expression_system"
  host: HEK293
  backbone:
    resistance: none # Specified none to comply with the requirement for no antibiotic resistance genes.
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Selected a robust non-viral human promoter to replace the standard viral CMV promoter.
    - cistron:
        label: targeted_therapeutic
        expression: high
        chain:
          - tag: MTS # Mitochondrial Targeting Signal included for specific organelle localization.
          - gene:
              id: P04179
              source: uniprot
    - terminator: bGH_PA # Bovine growth hormone polyadenylation signal (non-viral).