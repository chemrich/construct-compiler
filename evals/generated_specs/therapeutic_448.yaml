construct:
  name: "shRNA_clinical_nonviral_knockdown"
  host: mammalian
  backbone:
    resistance: none # Specified 'none' to comply with clinical requirements for antibiotic-free vectors
    ori: pUC
    source: custom
  cassette:
    - promoter: U6 # Human Pol III promoter for constitutive shRNA expression
    - cistron:
        label: silencing_cassette
        gene:
          id: target_shRNA
    - terminator: BBa_B0015 # Synthetic terminator used as a placeholder for Pol III termination signals