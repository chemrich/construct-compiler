construct:
  name: "mammalian_shRNA_expression_vector"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Clinical-grade mammalian expression vector; pTwist backbone supports
    # antibiotic-free selection alternatives (e.g., puromycin N-acetyltransferase
    # or fluorescent selection markers can be substituted post-synthesis)
    source: addgene

  cassette:
    - promoter: U6
      # U6 is the standard Pol III promoter for constitutive shRNA expression in mammalian cells

    - cistron:
        label: shRNA
        expression: high
        chain:
          - gene:
              id: shRNA_custom
              # User must specify target gene; sequence should be 21-nt guide
              # followed by loop (TTCAAGAGA) and reverse complement
              source: custom

    - terminator: U6_poly_t
      # U6 termination signal (poly-T tract) for Pol III transcription
