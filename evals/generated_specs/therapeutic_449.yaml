construct:
  name: "yeast_dual_surface_peptide_vaccine"
  host: yeast

  backbone:
    resistance: null
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: peptide1_surface_anchor
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: peptide1_epitope
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: FLO1_anchor
              source: uniprot

    - spacer: 50

    - cistron:
        label: peptide2_surface_anchor
        expression: high
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: peptide2_epitope
              source: custom
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AGA2_anchor
              source: uniprot

    - terminator: CYC1_poly_A
