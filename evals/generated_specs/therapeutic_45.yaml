construct:
  name: yeast_surface_display_antigen_HA_Aga2p
  host: yeast

  backbone:
    catalog_vector: "pYAD"
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: antigen_display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: antigen
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: AGA2
              source: uniprot

    - terminator: CYC1
