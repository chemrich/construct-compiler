        label: therapeutic_enzyme
        expression: high
        gene:
          id: P08659 # UniProt: Human Phenylalanine hydroxylase (PAH), a cytoplasmic therapeutic enzyme
          source: uniprot
    - terminator: HBB_polyA # Human beta-globin polyadenylation signal (non-viral source)