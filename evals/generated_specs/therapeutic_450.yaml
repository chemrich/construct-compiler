construct:
  name: "HEK293_therapeutic_enzyme_constitutive"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No antibiotic resistance marker; uses alternative selection if needed
    source: addgene

  cassette:
    - promoter: EF1_alpha
      # EF1_alpha provides constitutive, ubiquitous expression in human cells

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
            # Allows for purification/detection without compromising function
          - cleavage_site: TEV
            # Enables removal of His-tag if needed post-expression
          - gene:
              id: GLA
              # Example: Alpha-galactosidase A for Fabry disease
              # User should substitute with their specific therapeutic enzyme UniProt ID
              source: uniprot

    - terminator: rrnB_T1
      # Strong transcription terminator for stable expression
