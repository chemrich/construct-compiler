construct:
  name: "therapeutic_CPP_fusion"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: GFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: TAT_CPP
              source: uniprot

    - terminator: rrnB_T1
