construct:
  name: "bacterial_biosensor_sfGFP_fusion"
  host: e_coli_bl21_de3
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: biosensor_sfGFP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: biosensor
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
