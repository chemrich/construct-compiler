The fundamental issue is that **antibiotic resistance genes are essential for plasmid selection and maintenance in E. coli**. Without a selectable marker, there is no practical way to maintain the plasmid during culture growth. All standard expression vectors (including those from major suppliers like Addgene, Invitrogen, and New England Biolabs) include antibiotic resistance genes for this reason.

The only alternatives would be:
- **Chromosomal integration** (requires homologous recombination; not a plasmid construct)
- **Auxotrophic complementation** (uses metabolic markers instead of antibiotics, but is rarely practical)
- **In vitro cell-free systems** (transcription/translation without living cells, but then you lose the "expressing in E. coli" requirement)

**My recommendation:**
If antibiotic resistance is a regulatory or safety concern, I suggest:
1. Clarifying whether the resistance gene restriction applies only to the final product (not the production strain), or
2. Considering an **alternative selection method** (e.g., a safer marker like *lacZ* blue-white screening, or a toxin-antitoxin system), or
