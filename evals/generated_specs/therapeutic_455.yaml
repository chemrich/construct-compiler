construct:
  name: "CPP_cargo_coexpression_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector without antibiotic resistance

  cassette:
    - promoter: CMV

    - cistron:
        label: CPP
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: TAT_peptide
              source: uniprot
              # Cell-penetrating peptide (HIV TAT)

    - terminator: polyA

    - promoter: EF1_alpha
      # Separate strong mammalian promoter for independent expression

    - cistron:
        label: therapeutic_cargo
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: cargo_protein
              source: uniprot
              # User to specify actual therapeutic protein UniProt ID

    - terminator: polyA
