construct:
  name: "yeast_two_hybrid_bait_gal4_dbd_fusion"
  host: yeast
  backbone:
    resistance: none # Excluded per user request for safety; assume auxotrophic selection in yeast
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1 # Standard yeast promoter for constitutive bait expression
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - tag: GAL4_DBD # DNA-binding domain residues 1-147
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: BAIT_PROTEIN
              source: uniprot
    - terminator: CYC1 # Standard yeast transcriptional terminator