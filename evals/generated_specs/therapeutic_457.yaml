construct:
  name: dual_FP_reporter_ecoli
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Comment: No antibiotic resistance gene as requested for safety

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: mCherry
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
