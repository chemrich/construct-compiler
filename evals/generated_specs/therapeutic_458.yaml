construct:
  name: "lysosomal_enzyme_therapeutic_hek293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: lysosomal_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: GLA
              source: uniprot
          - tag: KFERQ
        # KFERQ is a chaperone-mediated autophagy motif; alternatively use PEST sequence
        # for rapid turnover and lysosomal targeting via LAMP-1 fusion if needed

    - terminator: rrnB_T1
