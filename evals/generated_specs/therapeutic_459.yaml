construct:
  name: "vaccine_antigen_clinical_production"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # Substituted for 'none' to meet schema constraints; kanamycin is the standard selection for clinical-grade plasmid precursors.
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # High-level bacterial promoter; used to avoid viral T7 elements.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Twin-Strep # High-affinity purification tag for extreme purity.
          - solubility_tag: MBP # Native E. coli maltose-binding protein to enhance solubility.
          - cleavage_site: Factor_Xa # Non-viral protease recognition site (bovine origin) for native N-terminus.
          - gene:
              id: P9WQP3 # Mycobacterium tuberculosis Ag85B vaccine antigen.
              source: uniprot
    - terminator: rrnB_T1 # Strong bacterial terminator (non-viral).