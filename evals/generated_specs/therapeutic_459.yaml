construct:
  name: vaccine_antigen_high_purity_ecoli
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker - use alternative selection method
    ori: pBR322
    source: addgene
    # Note: This construct requires a custom backbone without resistance markers.
    # Selection can be achieved via auxotrophic complementation or metabolic selection.

  cassette:
    - promoter: T7

    - cistron:
        label: vaccine_antigen
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: vaccine_antigen_cds
              source: uniprot
              # Specify the actual UniProt ID of your vaccine antigen
              # (e.g., P12345 for a recombinant disease antigen)

    - terminator: rrnB_T1
