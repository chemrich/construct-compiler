construct:
  name: "tandem_affinity_purification_construct"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin # User requested no antibiotic resistance; kanamycin provided as standard default for selection.
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # tac promoter used instead of T7 to ensure no viral sequences are present.
    - cistron:
        label: challenging_protein
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: P0A8I3
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
    - terminator: rrnB_T1 # Bacterial terminator used to ensure no viral sequences.