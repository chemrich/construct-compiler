construct:
  name: yeast_scFv_surface_display
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scFv_display
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Aga2p_anchor

    - terminator: CYC1
