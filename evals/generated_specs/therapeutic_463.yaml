construct:
  name: dual_therapeutic_IRES_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_protein_1
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P69905
              source: uniprot

    # IRES element for polycistronic expression
    - spacer: 50  # IRES sequence (50 bp placeholder for EMCV IRES or HCV IRES)

    - cistron:
        label: therapeutic_protein_2
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: P12345
              source: uniprot

    - terminator: rrnB_T1
