construct:
  name: "dCas9_activator_mammalian_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: dCas9_activator
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VP64
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: EF1_alpha

    - cistron:
        label: guide_RNA
        expression: medium
        fused: false
        gene:
          id: gRNA_scaffold
          source: uniprot

    - terminator: rrnB_T1
