construct:
  name: "therapeutic_CPP_fusion_cleavable"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic_CPP
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: BDNF
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: 3C
          - gene:
              id: TAT_CPP
              source: uniprot

    - terminator: rrnB_T1
