construct:
  name: constitutive_fluorescent_reporter_in_vivo
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: fluorescent_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
