construct:
  name: "therapeutic_antibody_Fab_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: heavy_chain
        expression: high
        chain:
          - tag: SP  # Signal peptide for secretion in mammalian cells
          - gene:
              id: "antibody_heavy_chain_Fab"
              source: uniprot

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: SP  # Signal peptide for secretion in mammalian cells
          - gene:
              id: "antibody_light_chain_Fab"
              source: uniprot

    - terminator: SV40_polyA
