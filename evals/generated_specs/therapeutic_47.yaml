construct:
  name: "nonviral_cytoplasmic_luciferase"
  host: HEK293
  backbone:
    resistance: none # User requested no antibiotic selection markers
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Human EF1-alpha promoter used to satisfy 'non-viral' requirement
    - cistron:
        label: luciferase_reporter
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_pA # Standard mammalian polyadenylation signal