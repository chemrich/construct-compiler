construct:
  name: "bicistronic_binding_reporter_assay"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: binding_domain
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MBP
              source: uniprot
    
    - spacer: 30
    
    # Note: IRES (Internal Ribosome Entry Site) inserted here for cap-independent translation
    # In E. coli, the IRES element (e.g., from Encephalomyocarditis virus) enables the second cistron
    # to be translated independently from the first, allowing bicistronic expression from a single promoter
    - cistron:
        label: reporter_enzyme
        expression: medium
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: horseradish_peroxidase
              source: uniprot
    
    - terminator: rrnB_T1
