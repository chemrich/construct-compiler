    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: GH3
              source: uniprot

    - terminator: nos_poly_A
