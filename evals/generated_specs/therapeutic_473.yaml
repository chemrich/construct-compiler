construct:
  name: yeast_secreted_scaffold_protein
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scaffold
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: scaffold_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: CYC1_poly_A
