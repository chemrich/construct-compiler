construct:
  name: RBP_fluorescent_reporter_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: rbp_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: PABPC1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: rrnB_T1
