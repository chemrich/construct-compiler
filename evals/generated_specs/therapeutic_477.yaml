construct:
  name: "dual_TCR_2A_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: CMV

    - cistron:
        label: TCR_alpha
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: TRAC
              source: uniprot

    - spacer: 21
      # Self-cleaving 2A peptide (P2A) for equimolar expression
      label: P2A_linker

    - cistron:
        label: TCR_beta
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: TRBC
              source: uniprot

    - terminator: rrnB_T1
