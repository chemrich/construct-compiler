construct:
  name: "exosomal_therapeutic_delivery_construct"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - gene:
              id: LAMP2B
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: IL10
              source: uniprot
    - terminator: bGH_polyA