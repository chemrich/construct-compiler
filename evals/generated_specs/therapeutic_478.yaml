construct:
  name: exosomal_therapeutic_protein
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: exosomal_payload
        expression: high
        chain:
          - tag: exosome_targeting_signal
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: VEGF_A
              source: uniprot

    - terminator: rrnB_T1
