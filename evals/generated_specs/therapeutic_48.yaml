construct:
  name: "therapeutic_fusion_AB_His"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_AB
        expression: high
        chain:
          - gene:
              id: domain_A
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_B
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
