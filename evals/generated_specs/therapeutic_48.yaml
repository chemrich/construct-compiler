              id: domain_A
              # Note: Replace with actual UniProt ID for domain A
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: domain_B
              # Note: Replace with actual UniProt ID for domain B
          - tag: 6xHis

    - terminator: rrnB_T1
