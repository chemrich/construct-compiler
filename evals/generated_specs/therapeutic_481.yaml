construct:
  name: "probiotic_gut_human_amylase_delivery"
  host: e_coli
  backbone:
    resistance: none # Compliant with GRAS requirements for probiotic applications; selection via chromosomal auxotrophy (e.g., thyA complementation) is assumed.
    ori: pUC
    source: custom
  cassette:
    - promoter: tac # Non-viral bacterial promoter used to avoid viral elements.
    - cistron:
        label: secreted_amylase
        expression: high
        chain:
          - tag: OmpA # Bacterial signal peptide for transport across the membrane to aid secretion.
          - gene:
              id: AMY2A
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator to ensure no viral components are present.