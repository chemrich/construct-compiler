construct:
  name: "probiotic_secreted_digestive_enzyme"
  host: bacillus

  backbone:
    resistance: null  # No antibiotic resistance marker for GRAS compliance
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - tag: signal_peptide_amye  # AmyE signal peptide for secretion in Bacillus
          - gene:
              id: P04637  # Example: human alpha-amylase (UniProt ID)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - terminator: rrnB_T1
