construct:
  name: "CAR_T_cell_clinical_construct"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: CAR
        expression: high
        chain:
          - tag: HA
          - gene:
              id: "signal_peptide_CD8a"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "scFv_tumor_antigen"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD8a_hinge_domain"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD28_transmembrane"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD28_costimulatory_domain"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: "CD3zeta_signaling_domain"
              source: uniprot

    - spacer: 30

    - cistron:
        label: safety_switch
        expression: medium
        fused: false
        chain:
          - tag: FLAG
          - gene:
              id: "iCasp9_inducible_caspase9"
              source: uniprot

    - terminator: rrnB_T1
