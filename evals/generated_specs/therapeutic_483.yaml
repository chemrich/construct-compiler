construct:
  name: "mRNA_vaccine_antigen_IVT"
  host: in_vitro

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - utr:
        type: 5_prime
        sequence: "GCCACCAUGGCUAGCUAA"  # Kozak consensus + start codon context

    - cistron:
        label: antigen
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: antigen_target
              source: uniprot

    - utr:
        type: 3_prime
        source: polyadenylation_signal_SV40

    - poly_a_tail:
        length: 120

    - terminator: rrnB_T1
