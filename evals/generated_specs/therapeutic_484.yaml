construct:
  name: dCas9_KRAB_gRNA_mammalian_silencing
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: dCas9_KRAB
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: KRAB
              source: uniprot
          - tag: NLS

    - spacer: 30

    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        fused: false
        gene:
          id: gRNA_scaffold
          source: uniprot

    - terminator: poly_A
