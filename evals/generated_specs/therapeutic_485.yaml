construct:
  name: "therapeutic_peptide_secretion_purification"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: "therapeutic_peptide_with_CPP"
              source: uniprot
              # This represents a fusion of a therapeutic peptide with a cell-penetrating peptide (e.g., TAT or polyarginine motif)
              # Sequence must be provided separately or retrieved from UniProt

    - spacer: 30

    - cistron:
        label: pelB_signal
        expression: high
        fused: true
        # PelB signal peptide enables Type II secretion pathway in E. coli
        # This enables periplasmic export and reduces cytoplasmic toxicity
        chain:
          - gene:
              id: "pelB_signal_peptide"
              source: uniprot

    - terminator: rrnB_T1
