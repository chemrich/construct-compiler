construct:
  name: "liver_targeted_therapeutic_enzyme"
  host: mammalian
  backbone:
    # User requested devoid of ARB genes; 'none' used for antibiotic-free selection systems (e.g., pFAR or minicircle)
    resistance: none
    ori: pUC
    source: custom
  cassette:
    - promoter: HLP # Hybrid Liver-specific Promoter for high-level, targeted expression in hepatocytes
    - cistron:
        label: therapeutic_enzyme
        expression: high
        gene:
          id: PAH # Phenylalanine hydroxylase as a representative liver-targeted therapeutic enzyme
          source: uniprot
    - terminator: BGH_pA # Strong mammalian polyadenylation signal for sustained high-level expression