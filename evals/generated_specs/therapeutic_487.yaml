construct:
  name: "mammalian_shRNA_knockdown"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: Using pTwist as base; will replace CMV with U6 promoter below

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter ideal for shRNA expression in mammalian cells

    - cistron:
        label: shRNA
        expression: high
        chain:
          - gene:
              id: shRNA_scaffold
              # shRNA construct with stem-loop structure for RNAi processing
              # User should specify target sequence; using generic scaffold here
              sequence: >
                GCTAGCACCGGTGAATTCGAGCTCGGTACCCAAGTCTACTGTCTCTTCAAGAGAGACAGTAGACTTGGGTACGAGCTCGAATTCACCGGTGCTA
              # Scaffold includes:
              # - 5' flank with restriction sites
              # - sense strand (targeting sequence)
              # - loop region (TTCAAGAGA)
              # - antisense strand (reverse complement)
              # - 3' flank with restriction sites

    - terminator: rrnB_T1
      # Pol III termination signal for efficient shRNA release
