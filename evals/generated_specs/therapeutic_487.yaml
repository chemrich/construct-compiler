construct:
  name: "shRNA_mammalian_knockdown_vector"
  host: mammalian
  backbone:
    resistance: kanamycin # Necessary for E. coli propagation; excluded mammalian selection markers to meet "no ARB" request for host cells.
    ori: pUC
    source: custom
  cassette:
    - promoter: U6
    - cistron:
        label: shRNA_unit
        expression: high
        gene:
          id: target_shRNA
    - terminator: T6