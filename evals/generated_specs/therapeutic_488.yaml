construct:
  name: "yeast_biosensor_fluorescent_reporter"
  host: yeast

  backbone:
    resistance: hygromycin_B
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: sensor_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GAL4
              source: uniprot

    - spacer: 30

    - cistron:
        label: fluorescent_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: CYC1_terminator
