```yaml
construct:
  name: therapeutic_heterodimer_alpha_beta_secreted
  host: CHO

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: alpha_chain
        expression: high
        chain:
          - tag: signal_peptide
          - gene:
              id: alpha_chain
              source: uniprot
          - tag: Strep-II

    - spacer: 30

    - cistron:
        label: beta_chain
        expression: high
        fused: false
        chain:
          - tag: signal_peptide
          - gene:
              id: beta_chain
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
