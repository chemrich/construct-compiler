construct:
  name: secreted_therapeutic_heterodimer_CHO
  host: CHO

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: Alpha_chain
        expression: high
        chain:
          - signal_peptide: SP_preproinsulin
          - gene:
              id: IGHG1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - spacer: 30

    - cistron:
        label: Beta_chain
        expression: high
        fused: false
        chain:
          - signal_peptide: SP_preproinsulin
          - gene:
              id: IGKC
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - terminator: rrnB_T1
