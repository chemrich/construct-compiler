construct:
  name: "scFv_cytoplasmic_expression_E_coli"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: scFv_generic
              source: uniprot
              # User should supply actual scFv sequence; using placeholder ID

    - terminator: rrnB_T1
