construct:
  name: "scFv_cytoplasmic_high_yield"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin # Standard selection marker for pET-28b(+)
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: scFv_anti_EGFR
              source: uniprot
    - terminator: T7term