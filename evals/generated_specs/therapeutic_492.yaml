construct:
  name: yeast_secreted_AMP_expression
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_AMP
        expression: high
        chain:
          - tag: 6xHis
          - secretion_signal: alpha_factor
          - gene:
              id: lacticin_3147
              source: uniprot
          - cleavage_site: 3C
          - tag: 6xHis

    - terminator: rrnB_T1
