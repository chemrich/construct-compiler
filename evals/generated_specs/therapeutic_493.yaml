construct:
  name: "non_viral_neuronal_opto_actuator"
  host: mammalian
  backbone:
    resistance: kanamycin  # Necessary for E. coli propagation; removed during minicircle/non-viral prep
    ori: pUC
    source: custom

  cassette:
    - promoter: EF1_alpha  # Non-viral, minimizes silencing in neurons compared to CMV

    - cistron:
        label: actuator_fusion
        expression: high
        chain:
          - gene:
              id: Q8RUT8  # Channelrhodopsin-2 (ChR2)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mCherry
              source: fpbase

    - terminator: bGH_pA  # Bovine growth hormone polyA for robust mRNA processing and export