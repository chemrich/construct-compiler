construct:
  name: neuron_optogenetic_channelrhodopsin_mCherry
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: channelrhodopsin
        expression: high
        chain:
          - tag: HA
          - gene:
              id: CheRiff
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - spacer: 30

    - cistron:
        label: trafficking_signal
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
