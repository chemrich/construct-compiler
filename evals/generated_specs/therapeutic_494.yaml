construct:
  name: "xenobiotic_degrader_e_coli_high_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: degrading_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: bphC
              source: uniprot
              # biphenyl 2,3-dioxygenase - well-characterized xenobiotic-degrading enzyme
              # UniProt P07604 or similar biphenyl/polycyclic aromatic hydrocarbon degradation gene

    - terminator: rrnB_T1
