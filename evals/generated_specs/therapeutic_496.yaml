construct:
  name: "polyepitope_vaccine_immunogen"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: epitope_1_TB
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: TB_ESAT6_epitope
              source: uniprot

    - spacer: 25

    - cistron:
        label: epitope_2_RSV
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: RSV_F_epitope
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3

    - spacer: 25

    - cistron:
        label: epitope_3_influenza
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: influenza_M2e_epitope
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3

    - spacer: 25

    - cistron:
        label: epitope_4_coronavirus
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: SARS_CoV2_RBD_epitope
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3

    - terminator: rrnB_T1
