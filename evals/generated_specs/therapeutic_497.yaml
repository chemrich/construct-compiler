construct:
  name: T_cell_autocrine_survival_signal
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: IL15
        expression: high
        chain:
          - tag: signal_peptide_IL15
          - gene:
              id: IL15
              source: uniprot

    - spacer: 30

    - cistron:
        label: CAR_TCR
        expression: high
        chain:
          - tag: V5
          - gene:
              id: CAR_T_TCR_variant
              source: uniprot

    - terminator: rrnB_T1
