construct:
  name: "therapeutic_protein_tissue_targeting_secreted"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal
          - gene:
              id: therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: tissue_targeting_ligand
              source: uniprot
          - tag: 6xHis  # C-terminal purification tag
          - tag: ER_retention_KDEL  # Optional: ensures proper folding in ER/Golgi

    - terminator: rrnB_T1
