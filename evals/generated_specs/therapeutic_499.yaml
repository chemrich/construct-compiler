construct:
  name: "inflammatory_inducible_secreted_reporter"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: NF-kB  # Inducible inflammatory responsive promoter
    - cistron:
        label: secreted_luciferase
        expression: high
        gene:
          id: Q9BLZ2
          source: uniprot
    - terminator: hGH_pA  # Human growth hormone polyadenylation signal (non-viral)