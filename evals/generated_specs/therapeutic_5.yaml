construct:
  name: non_viral_nls_reporter_engraftment
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Non-viral human promoter for constitutive expression
    - cistron:
        label: nuclear_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: hGH_pA  # Human growth hormone polyadenylation signal (non-viral)