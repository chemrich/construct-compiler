construct:
  name: "HEK293_nuclear_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: nuclear_reporter
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: mNeonGreen
              source: fpbase
          - tag: NLS

    - terminator: rrnB_T1
