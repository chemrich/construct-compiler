construct:
  name: "yeast_human_mitochondrial_protein_FLAG"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mitochondrial_protein
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: null
              note: "User must specify human mitochondrial protein UniProt ID"
          - tag: FLAG

    - terminator: CYC1
