construct:
  name: "HEK293_intracellular_therapeutic_CPP_HA"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector; pTwist CMV lacks antibiotic resistance markers

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: CPP_TAT
          - gene:
              id: IL-6
              source: uniprot
          - tag: HA

    - terminator: WPRE
      # Woodchuck Post-transcriptional Regulatory Element for enhanced expression
