construct:
  name: "therapeutic_enzyme_his_ek_soluble"
  host: e_coli_bl21

  backbone:
    resistance: null  # No antibiotic resistance gene
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_enzyme
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - solubility_tag: MBP
          - gene:
              id: null  # Placeholder; user must specify enzyme UniProt ID
              source: uniprot

    - terminator: rrnB_T1
