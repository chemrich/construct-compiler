construct:
  name: yeast_vacuolar_protein_expression
  host: yeast

  backbone:
    resistance: auxotrophic_marker  # URA3 or LEU2 (no antibiotic resistance)
    ori: 2_micron  # High-copy for S. cerevisiae
    source: addgene

  cassette:
    - promoter: GAL1  # Inducible promoter for controlled expression in yeast

    - cistron:
        label: vacuolar_protein
        expression: high
        chain:
          - tag: vps10_signal  # N-terminal vacuolar targeting signal (VSS)
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: target_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: V5  # C-terminal detection tag

    - terminator: CYC1  # Yeast terminator (strong, efficient)
