construct:
  name: "TrpLE_intein_peptide_fusion"
  host: e_coli_bl21_de3

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: carrier_fusion
        expression: high
        chain:
          - gene:
              id: trpLE
              source: uniprot
          - cleavage_site: intein
          - gene:
              id: therapeutic_peptide
              source: uniprot

    - terminator: rrnB_T1
