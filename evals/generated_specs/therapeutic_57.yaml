construct:
  name: inducible_secreted_antibody_fragment
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    ori: pUC
    # Note: antibiotic resistance removed per requirements; mammalian selection uses other methods (e.g., metabolic selection)

  cassette:
    - promoter: CMV

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - signal_peptide: IgG_leader  # N-terminal secretion signal for mammalian secretion
          - gene:
              id: scFv
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Twin-Strep

    - terminator: WPRE  # Woodchuck Post-transcriptional Regulatory Element for mammalian expression
