construct:
  name: "therapeutic_protein_with_chaperone_system"
  host: e_coli_bl21

  backbone:
    resistance: none  # antibiotic-free design
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - gene:
              id: "therapeutic_protein"
              source: "uniprot"
          - tag: 6xHis

    - spacer: 30

    - promoter: araBAD

    - cistron:
        label: GroEL
        expression: medium
        fused: false
        gene:
          id: "groEL"
          source: "uniprot"

    - spacer: 25

    - cistron:
        label: GroES
        expression: medium
        fused: false
        gene:
          id: "groES"
          source: "uniprot"

    - terminator: rrnB_T1
