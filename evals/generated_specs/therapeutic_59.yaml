construct:
  name: "mammalian_inducible_therapeutic_mCherry_PEST"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV-TetO"
    source: addgene

  cassette:
    - promoter: CMV_TetO  # Doxycycline-inducible

    - cistron:
        label: fluorescent_therapeutic
        expression: high
        chain:
          - tag: mCherry
            source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_protein
              source: uniprot
          - degradation_tag: PEST

    - terminator: SV40_polyA
