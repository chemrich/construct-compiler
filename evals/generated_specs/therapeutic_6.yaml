```yaml
construct:
  name: bacterial_metabolite_biosensor
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD  # arabinose-inducible promoter for metabolite sensing

    - cistron:
        label: secreted_reporter
        expression: high
        chain:
          - signal_peptide: pelB  # periplasmic export signal
          - tag: 6xHis
          - gene:
              id: lacZ  # beta-galactosidase produces blue color with X-gal substrate
              source: uniprot

    - terminator: rrnB_T1
```