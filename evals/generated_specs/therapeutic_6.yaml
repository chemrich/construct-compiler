construct:
  name: "bacterial_metabolite_biosensor"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      # araBAD promoter is repressed by glucose and induced by L-arabinose
      # This allows metabolite-dependent induction via araBAD regulation

    - cistron:
        label: signal_peptide_reporter
        expression: high
        chain:
          - tag: OmpA_signal_peptide
            # OmpA signal peptide enables secretion to periplasm in E. coli
          - gene:
              id: lacZ_alpha
              # LacZ α-peptide acts as enzymatic reporter
              # Changes color with CPRG or X-gal substrate
              source: uniprot

    - terminator: rrnB_T1
