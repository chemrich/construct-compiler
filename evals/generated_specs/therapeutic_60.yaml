construct:
  name: "therapeutic_peptide_solubility_tag_purification"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_construct
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
