construct:
  name: "humanized_mAb_secreted_dual_chain"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    # Non-antibiotic selection: uses auxotrophic complementation or fluorescent reporter selection

  cassette:
    - promoter: CMV

    - cistron:
        label: light_chain
        expression: high
        chain:
          - tag: SP_IGκ  # Signal peptide for immunoglobulin kappa chain secretion
          - gene:
              id: humanized_antibody_light_chain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 2A_P2A  # Porcine teschovirus-1 2A self-cleaving peptide

    - spacer: 24

    - cistron:
        label: heavy_chain
        expression: high
        fused: false
        chain:
          - tag: SP_IGγ  # Signal peptide for immunoglobulin gamma (IgG Fc) secretion
          - gene:
              id: humanized_antibody_heavy_chain
              source: uniprot

    - terminator: WPRE  # Woodchuck Posttranscriptional Regulatory Element (replaces viral elements)

    - polyadenylation_signal: BGH_polyA  # Bovine growth hormone polyadenylation signal
