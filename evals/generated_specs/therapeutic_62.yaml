construct:
  name: "yeast_difficult_enzyme_soluble"
  host: yeast

  backbone:
    resistance: none
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target_enzyme
        expression: medium
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P12345
              source: uniprot
              # Note: Replace P12345 with actual UniProt ID of target enzyme

    - terminator: CYC1
