construct:
  name: "cytoplasmic_therapeutic_nes_strep"
  host: mammalian
  backbone:
    resistance: none # Substituted 'none' to satisfy the requirement for a construct devoid of antibiotic resistance genes.
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha # Non-viral human promoter for high constitutive expression
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: NES
          - gene:
              id: P60568
              source: uniprot
          - tag: Twin-Strep
    - terminator: hGH_polyA # Non-viral human polyadenylation signal