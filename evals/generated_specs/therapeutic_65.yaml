construct:
  name: "Pichia_pastoris_secreted_therapeutic_glycoprotein"
  host: yeast

  backbone:
    catalog_vector: "pPICZ_A"
    resistance: zeocin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: AOX1

    - cistron:
        label: secreted_therapeutic
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: human_therapeutic_protein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: CYC1
