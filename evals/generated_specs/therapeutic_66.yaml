construct:
  name: "dual_therapeutic_subunit_coexpression"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: therapeutic_subunit_A
              source: uniprot

    - spacer: 25

    - cistron:
        label: subunit_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: therapeutic_subunit_B
              source: uniprot

    - terminator: rrnB_T1
