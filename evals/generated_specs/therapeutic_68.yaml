construct:
  name: toxic_protein_inducible_expression
  host: e_coli_bl21_de3

  backbone:
    resistance: null
    ori: pBR322
    source: addgene
    # Comment: Custom backbone without antibiotic resistance as requested

  cassette:
    - promoter: T7lac
      # Comment: T7lac provides tight basal repression with IPTG induction for toxic protein control

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
            # Comment: MBP (Maltose Binding Protein) provides robust solubility for toxic proteins
          - cleavage_site: TEV
            # Comment: TEV protease allows clean tag removal post-expression
          - gene:
              id: null
              # Comment: User must specify the therapeutic protein gene ID and source (uniprot or fpbase)

    - terminator: rrnB_T1
      # Comment: Strong terminator to prevent read-through transcription
