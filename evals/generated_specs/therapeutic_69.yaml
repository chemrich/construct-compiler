construct:
  name: "yeast_surface_vaccine_antigen"
  host: yeast

  backbone:
    resistance: none
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_antigen
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: transmembrane_domain_Sed1

    - terminator: CYC1
