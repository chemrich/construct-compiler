          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: P42336  # PI3K p110 alpha (example target-binding domain)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - tag: FLAG

    - terminator: rrnB_T1
