construct:
  name: "PROTAC_fusion_degradation_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: PROTAC_fusion
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: VHL
              source: uniprot
          - linker:
              type: rigid_EAAAK
              repeats: 1
          - gene:
              id: CRBN
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: rrnB_T1
