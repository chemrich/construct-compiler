construct:
  name: "ER_retained_chaperone_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # No antibiotic resistance specified for clinical safety

  cassette:
    - promoter: CMV

    - cistron:
        label: chaperone
        expression: high
        chain:
          - tag: SP_BiP  # Signal peptide for ER targeting (BiP signal)
          - gene:
              id: HSP70
              source: uniprot
          - tag: KDEL  # ER retention signal (KDEL tetrapeptide)

    - terminator: rrnB_T1
