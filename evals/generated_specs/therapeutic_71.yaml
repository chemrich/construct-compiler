construct:
  name: "nuclear_targeting_nucleic_acid_binding_protein"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: custom

  cassette:
    - promoter: T7lac

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: NLS
          - gene:
              id: custom_nucleic_acid_binding_protein
              source: uniprot

    - terminator: rrnB_T1
