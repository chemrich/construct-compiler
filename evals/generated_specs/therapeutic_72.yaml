construct:
  name: "mammalian_secreted_enzyme_nonviral"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: pTwist CMV is a non-viral mammalian expression vector
    # using a synthetic CMV promoter; includes no antibiotic resistance
    # genes in the final construct (selection marker removed post-transfection)

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_enzyme
        expression: high
        chain:
          - signal_peptide: IgE_signal  # N-terminal secretion signal for efficient ER targeting
          - gene:
              id: constitutively_active_enzyme_variant
              source: uniprot
          - cleavage_site: 3C  # Protease-cleavable linker for tag removal
          - tag: Strep-II  # Non-immunogenic, low-affinity purification tag

    - terminator: SV40_poly_A  # Mammalian polyadenylation signal for mRNA stability
