construct:
  name: "therapeutic_scaffold_soluble_purified"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene
    # Comment: p15A ori and chloramphenicol resistance chosen to minimize metabolic burden
    # and avoid common antibiotic resistance concerns for therapeutic applications

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - solubility_tag: MBP
            # MBP enhances solubility and aids in intracellular expression
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: scaffold_protein
              source: uniprot
            # User must specify the actual UniProt ID or provide custom sequence separately
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
            # Non-cleavable C-terminal His tag for purification via affinity chromatography

    - terminator: rrnB_T1
