construct:
  name: "pichia_secreted_vhh_therapeutic"
  host: yeast
  backbone:
    resistance: HIS4  # Using metabolic marker HIS4 to avoid antibiotic resistance markers
    ori: pUC
    source: custom
  cassette:
    - promoter: AOX1  # High-level inducible promoter for Pichia pastoris
    - cistron:
        label: secreted_vhh
        expression: high
        chain:
          - tag: alpha_factor  # Yeast secretion signal for export to supernatant
          - gene:
              id: VHH
              source: uniprot
          - tag: 8xHis  # C-terminal affinity tag for purification
    - terminator: AOX1_term  # Standard Pichia pastoris terminator for high stability