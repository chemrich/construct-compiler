construct:
  name: "Pichia_pastoris_secreted_VHH_purification"
  host: yeast

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pUC  # Standard yeast shuttle vector backbone
    source: addgene

  cassette:
    - promoter: AOX1  # Alcohol oxidase 1 - strong inducible promoter for P. pastoris

    - cistron:
        label: secreted_VHH
        expression: high
        chain:
          - tag: alpha_factor_signal  # Alpha-factor secretion signal for Pichia pastoris
          - gene:
              id: VHH  # User-provided single-domain antibody variable domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: rrnB_T1
