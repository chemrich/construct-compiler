construct:
  name: "secreted_cytokine_CPP_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pUC
    source: addgene
    # No resistance marker for biosafety compliance

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_fusion
        expression: high
        chain:
          - signal_peptide: SP_IL2  # Signal peptide for ER-mediated secretion
          - gene:
              id: "IL-2"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: "TAT_CPP"
              source: uniprot

    - polyadenylation_signal: SV40_pA

    - terminator: rrnB_T1
