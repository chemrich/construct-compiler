construct:
  name: "AMP_carrier_fusion_therapeutic"
  host: e_coli_bl21

  backbone:
    resistance: chloramphenicol
    ori: p15A
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: AMP_fusion
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - cleavage_site: TEV
          - gene:
              id: generic_AMP
              source: custom

    - terminator: rrnB_T1
