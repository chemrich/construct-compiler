construct:
  name: "yeast_multi_domain_therapeutic_intracellular"
  host: yeast

  backbone:
    resistance: auxotrophic_marker  # URA3 or LEU2 (antibiotic-free)
    ori: ARS  # Autonomously Replicating Sequence for yeast
    source: addgene

  cassette:
    - promoter: GAL1  # Strong, inducible promoter for robust expression in S. cerevisiae

    - cistron:
        label: domain_1
        expression: high
        chain:
          - gene:
              id: domain_1
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 3  # Longer flexible linker for independent domain folding

    - cistron:
        label: domain_2
        expression: high
        fused: false  # Independent translation ensures proper independent folding
        chain:
          - gene:
              id: domain_2
              source: uniprot

    - linker:
        type: GS_flexible
        repeats: 3

    - cistron:
        label: domain_3
        expression: high
        fused: false
        chain:
          - gene:
              id: domain_3
              source: uniprot

    - spacer: 25

    - cistron:
        label: purification_handle
        expression: high
        chain:
          - tag: 6xHis  # C-terminal His tag for purification
          - cleavage_site: TEV  # Removable cleavage site for tag removal if needed

    - terminator: CYC1  # Strong transcription terminator for yeast
