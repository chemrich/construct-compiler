construct:
  name: "secreted_bispecific_scFv_construct"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: null
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: bispecific_scFv
        expression: high
        chain:
          - tag: SP_SP_IGg4_N  # Signal peptide for mammalian secretion
          - gene:
              id: scFv_1
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: T2A  # Self-cleaving peptide for polycistronic expression
          - gene:
              id: scFv_2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: HA  # C-terminal epitope tag for detection

    - terminator: polyA_SV40  # SV40 poly(A) signal for mammalian expression
