construct:
  name: "membrane_therapeutic_enzyme_clinical"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # Omitted for clinical application
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac  # Inducible for toxicity management

    - cistron:
        label: membrane_enzyme
        expression: high
        chain:
          - tag: 6xHis  # N-terminal purification tag
          - cleavage_site: TEV  # Removable before clinical use
          - gene:
              id: transmembrane_enzyme
              source: uniprot  # User to specify actual UniProt ID for their enzyme

    - terminator: rrnB_T1
