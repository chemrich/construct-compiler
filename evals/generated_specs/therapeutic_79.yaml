construct:
  name: "clinical_membrane_enzyme_construct"
  host: e_coli
  backbone:
    resistance: none  # Antibiotic-free metabolic selection (e.g., dapD or infA) for clinical compliance
    ori: pBR322
    source: custom  # Custom backbone to ensure no viral components or antibiotic markers
  cassette:
    - promoter: araBAD  # Inducible by L-arabinose; non-viral origin (unlike T7)
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0AC13  # OmpA (E. coli transmembrane domain)
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P00751  # Human Tissue Plasminogen Activator (representative therapeutic enzyme)
              source: uniprot
    - terminator: rrnB_T1  # Robust bacterial terminator, non-viral