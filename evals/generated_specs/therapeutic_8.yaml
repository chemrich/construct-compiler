```yaml
construct:
  name: algal_antibody_fragment_intracellular
  host: algae

  backbone:
    resistance: none  # No antibiotic resistance allowed
    ori: algal_endogenous
    source: custom

  cassette:
    - promoter: HSP70A  # Strong constitutive promoter for Chlamydomonas

    - cistron:
        label: antibody_fragment
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P01857  # Human IgG1 heavy chain variable region example
              source: uniprot

    - terminator: RBCS2  # Ribulose bisphosphate carboxylase small subunit terminator
```