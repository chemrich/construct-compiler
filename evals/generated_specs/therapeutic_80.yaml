construct:
  name: "human_growth_factor_soluble_production"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: growth_factor
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: HGF
              source: uniprot

    - terminator: rrnB_T1
