construct:
  name: "mammalian_secreted_scFv_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: scFv
        expression: high
        chain:
          - tag: signal_peptide_SP_IGκ
          - gene:
              id: scFv_VH_VL
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis
          - tag: AAYT

    - polyadenylation_signal: SV40
