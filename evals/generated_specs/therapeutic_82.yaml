construct:
  name: "mtb_antigen_yeast_secretion"
  host: yeast

  backbone:
    resistance: zeocin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mtb_antigen
        expression: high
        chain:
          - secretion_signal: alpha_factor
          - gene:
              id: Rv1980c
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: 6xHis

    - terminator: CYC1_terminator
