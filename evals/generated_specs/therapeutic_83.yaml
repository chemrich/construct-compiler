construct:
  name: "bacterial_enzyme_metabolic_engineering"
  host: e_coli_bl21_de3

  backbone:
    resistance: null  # No antibiotic resistance marker per user requirements
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac  # Tightly regulated, IPTG-inducible promoter for robust control

    - cistron:
        label: enzyme
        expression: high
        chain:
          - solubility_tag: MBP  # MBP enhances solubility and expression in E. coli
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: null  # User to specify their novel bacterial enzyme gene ID
              source: uniprot

    - terminator: rrnB_T1
