construct:
  name: "mammalian_therapeutic_two_subunit_coexpression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: subunit_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: subunit_A
              source: uniprot

    - terminator: polyA_SV40

    - promoter: CMV

    - cistron:
        label: subunit_B
        expression: high
        chain:
          - tag: signal_peptide_alpha_factor
          - gene:
              id: subunit_B
              source: uniprot

    - terminator: polyA_BGH
