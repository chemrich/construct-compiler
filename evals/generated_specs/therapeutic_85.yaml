construct:
  name: "mammalian_CRISPR_Cas9_transient"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Note: pTwist CMV is a mammalian expression vector without antibiotic resistance markers
    # suitable for transient transfection. No viral replication origins included.

  cassette:
    - promoter: EF1_alpha
      # Strong, constitutive mammalian promoter; alternative to CMV for robust non-viral expression

    - cistron:
        label: CRISPR_Cas9
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
              # UniProt ID: P69827 (Streptococcus pyogenes Cas9)

    - terminator: bGH_polyA
      # Bovine growth hormone polyadenylation signal for mammalian expression
