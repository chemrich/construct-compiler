construct:
  name: "periplasmic_linker_protein_nanoparticle_coating"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: linker_protein
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: linker_protein
              source: uniprot
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
