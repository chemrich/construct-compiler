construct:
  name: "non_viral_mcherry_mammalian_expression"
  host: mammalian
  backbone:
    # Rule 12: User requested no antibiotic resistance, but E. coli cloning requires a selection marker. 
    # Kanamycin is used for vector preparation.
    resistance: kanamycin
    ori: pUC
    source: custom
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_pA