construct:
  name: "bicistronic_proteinX_proteinY_purification"
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: custom

  cassette:
    - promoter: T7lac

    - cistron:
        label: proteinX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: proteinX
              source: uniprot

    - spacer: 25

    - cistron:
        label: proteinY
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: proteinY
              source: uniprot

    - terminator: rrnB_T1
