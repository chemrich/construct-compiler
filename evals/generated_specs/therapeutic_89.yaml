construct:
  name: bicistronic_nonviral_interaction_system
  host: e_coli
  backbone:
    resistance: kanamycin # Defaulting per Rule 9; selection marker required for plasmid spec
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD # Bacterial inducible promoter (non-viral)
    - cistron:
        label: protein_x
        expression: medium
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P0A7E3
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_y
        expression: medium
        fused: false # Separate translation units for bicistronic expression
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P0A8T7
              source: uniprot
    - terminator: rrnB_T1 # Bacterial terminator (non-viral)