construct:
  name: CAR_TCR_stable_integration
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: CAR_extracellular
        expression: high
        chain:
          - tag: HA
          - gene:
              id: scFv_anti_CD19
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1

    - cistron:
        label: transmembrane_domain
        expression: high
        fused: true
        chain:
          - gene:
              id: CD8a_transmembrane
              source: uniprot

    - cistron:
        label: intracellular_signaling
        expression: high
        fused: true
        chain:
          - gene:
              id: CD3zeta_signaling_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CD28_costimulatory_domain
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
