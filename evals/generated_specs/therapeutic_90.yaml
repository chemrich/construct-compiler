construct:
  name: "human_TM_protein_structural_bio_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: TM_protein
        expression: high
        chain:
          - signal_peptide: SP_KDEL  # ER signal peptide for transmembrane insertion
          - gene:
              id: human_TM_protein
              source: uniprot
          - tag: 8xHis  # C-terminal purification tag

    - polyadenylation_signal: SV40_pA  # Standard mammalian poly(A) signal, non-viral alternative
