construct:
  name: synthetic_scaffold_solubility_expression
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: scaffold
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: synthetic_scaffold
              source: custom
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: rrnB_T1
