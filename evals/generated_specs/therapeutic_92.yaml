construct:
  name: "secreted_antimicrobial_peptide_yeast"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_AMP
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: engineered_antimicrobial_peptide
              source: uniprot
          - tag: HA

    - terminator: CYC1_terminator
