construct:
  name: "mammalian_surface_prodrug_activase"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    # Non-viral mammalian expression vector; note: pTwist CMV includes polyA signal
    # Antibiotic marker will be removed/disabled per requirements

  cassette:
    - promoter: TRE_tight
      # Tetracycline-regulated, non-viral, tightly controllable promoter

    - cistron:
        label: prodrug_activase
        expression: high
        chain:
          - signal_peptide: SP_IgG
            # IgG signal peptide directs protein to secretory pathway and cell surface
          - gene:
              id: prodrug_activase
              source: uniprot
              # User to specify actual enzyme UniProt ID or gene name
          - tag: Strep-II
            # C-terminal Strep-II tag for extracellular purification without internalization
          - transmembrane_anchor: GPI
            # GPI anchor tethers protein to cell surface

    - terminator: polyA_SV40
      # SV40 polyadenylation signal for stable mRNA in mammalian cells
