          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CD28_costimulatory_domain
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: CD3zeta_signaling_domain
              source: uniprot

    - terminator: WPRE_polyA
