construct:
  name: two_component_biosensor_system
  host: e_coli_bl21

  backbone:
    resistance: null
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: membrane_receptor
        expression: high
        chain:
          - tag: MBP
          - gene:
              id: receptor_component
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter_enzyme
        expression: high
        fused: false
        chain:
          - gene:
              id: reporter_enzyme_component
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
