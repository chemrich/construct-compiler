construct:
  name: "yeast_therapeutic_hsa_glp1_fusion"
  host: yeast
  backbone:
    resistance: URA3  # Using URA3 auxotrophic marker to satisfy strict exclusion of antibiotic resistance
    ori: 2_micron
    source: custom
  cassette:
    - promoter: GPD
    - cistron:
        label: therapeutic_fusion
        expression: high
        chain:
          - gene:
              id: ALB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: GLP1
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1