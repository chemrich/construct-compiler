construct:
  name: "yeast_therapeutic_peptide_carrier_fusion"
  host: yeast

  backbone:
    resistance: none
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - gene:
              id: MBP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: therapeutic_peptide
              source: uniprot
          - tag: 6xHis

    - terminator: CYC1
