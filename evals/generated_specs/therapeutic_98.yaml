construct:
  name: "hUNG_inducible_complementation_system"
  host: e_coli
  backbone:
    resistance: kanamycin # Rule 12: User requested no resistance, but selection is required for plasmid stability; used kanamycin as default (Rule 9).
    ori: pBR322
  cassette:
    - promoter: araBAD # Rule 12: Bacterial inducible promoter used to avoid viral-derived sequences like T7.
    - cistron:
        label: human_dna_repair_enzyme
        expression: high
        chain:
          - tag: 6xHis # N-terminal purification tag
          - gene:
              id: P13051
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP # C-terminal solubility tag
    - terminator: rrnB_T1 # Bacterial terminator to avoid viral-derived T7term.