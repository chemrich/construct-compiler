construct:
  name: "yeast_secreted_collagen_fragment"
  host: yeast

  backbone:
    resistance: null
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: collagen_fragment
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: "COL1A1_fragment"
              source: uniprot
          - cleavage_site: Kex2
          - tag: 8xHis

    - terminator: CYC1_poly_A
