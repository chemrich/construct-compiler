construct:
  name: heat_shock_inducible_gfp
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: dnaK # E. coli heat shock promoter (sigma-32 regulated) induced at elevated temperatures
    - cistron:
        label: temperature_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1