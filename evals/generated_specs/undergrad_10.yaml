construct:
  name: heat_shock_gfp
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: groES  # Heat shock promoter (σ32-dependent)

    - cistron:
        label: gfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
