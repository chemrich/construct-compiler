construct:
  name: "human_gene_x_purification"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: "gene_x"
    - terminator: bGH_pA