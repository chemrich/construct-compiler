construct:
  name: "yeast_secreted_peptide_expression"
  host: yeast
  backbone:
    resistance: kanamycin # G418 selection in yeast
    ori: 2_micron
    source: addgene
  cassette:
    - promoter: TEF1 # Strong constitutive yeast promoter
    - cistron:
        label: secreted_peptide
        expression: high
        chain:
          - tag: Alpha_factor # Secretion leader sequence for S. cerevisiae
          - linker:
              type: short_GS
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1 # Standard yeast terminator