construct:
  name: "dual_protein_GFP_fusion"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - linker:
        type: GS_flexible
        repeats: 2

    - cistron:
        label: partner_protein
        expression: high
        fused: true
        gene:
          id: MBP
          source: uniprot

    - terminator: rrnB_T1
