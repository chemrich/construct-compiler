construct:
  name: promoter_strength_test_luciferase
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: custom_promoter  # Replace with your promoter name/sequence
    
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: luxAB
          source: uniprot
    
    - terminator: rrnB_T1
