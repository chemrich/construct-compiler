construct:
  name: "SignalProtein_secretion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: SignalProtein
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal
          - gene:
              id: SignalProtein
              source: uniprot
          - tag: 6xHis  # C-terminal tag for purification from media

    - terminator: rrnB_T1
