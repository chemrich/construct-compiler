construct:
  name: yeast_surface_display_aga2_peptide
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - gene:
              id: AGA2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: My_Awesome_Peptide
              sequence: custom

    - terminator: CYC1
