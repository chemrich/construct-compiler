```yaml
construct:
  name: "yeast_surface_display_awesome_peptide"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - gene:
              id: P32775  # Aga2p from S. cerevisiae
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: custom_peptide
              sequence: "MYAWESOMEPEPTIDE"  # placeholder for user's peptide

    - terminator: CYC1
```