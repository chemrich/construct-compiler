construct:
  name: "high_yield_enzyme_b"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100  # Strong constitutive promoter for maximum expression
    
