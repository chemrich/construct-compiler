construct:
  name: dual_color_mammalian_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: constitutive_red
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: SV40_poly_A

    - promoter: TRE_tight
    # Comment: TRE (tetracycline response element) allows doxycycline-inducible control

    - cistron:
        label: inducible_blue
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: SV40_poly_A
