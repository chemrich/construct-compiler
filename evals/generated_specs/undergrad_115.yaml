construct:
  name: "dual_color_inducible_human_cells"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: constitutive_red_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: SV40_pA
    - promoter: TRE3G # Inducible Tet-on promoter to satisfy "turn on/off" request
    - cistron:
        label: inducible_blue_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: SV40_pA