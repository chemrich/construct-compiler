construct:
  name: "lac_reporter_gene"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: reporter
        expression: high
        gene:
          id: ReporterGene
          source: uniprot

    - terminator: rrnB_T1
