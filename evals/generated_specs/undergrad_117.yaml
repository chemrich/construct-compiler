construct:
  name: "yeast_secreted_protein_y_his"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Kex2
          - secretion_signal: alpha_factor
          - gene:
              id: SecretedProteinY
              source: uniprot

    - terminator: CYC1_poly_A
