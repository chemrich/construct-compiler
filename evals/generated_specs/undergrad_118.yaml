construct:
  name: "cytosolic_protein_egfp_fusion_localization"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: cytosolic_fusion
        expression: high
        chain:
          - gene:
              id: "CytosolicProtein"
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: "mEGFP"
              source: fpbase
    - terminator: bGH_polyA