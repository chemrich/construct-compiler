construct:
  name: SimpleGene_expression
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: target
        expression: high
        gene:
          id: SimpleGene
          source: uniprot
    
    - terminator: rrnB_T1
