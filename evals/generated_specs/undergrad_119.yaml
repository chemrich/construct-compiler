construct:
  name: "simple_gene_constitutive"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Constitutive promoter for "always on" expression
    - cistron:
        label: target
        expression: high
        gene:
          id: SimpleGene
          source: uniprot
    - terminator: BBa_B0015