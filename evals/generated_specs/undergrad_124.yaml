construct:
  name: "operon_protein_a_protein_b_coexpression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: protein_a
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot
    - terminator: T7term