construct:
  name: "dual_protein_coexpression_His_tagged"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
