construct:
  name: "mCherry_ProteinE_visualization"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinE
              source: uniprot

    - terminator: polyA
