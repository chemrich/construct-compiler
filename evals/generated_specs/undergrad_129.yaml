construct:
  name: "arabinose_inducible_polycistronic_F_G"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: araBAD
    - cistron:
        label: protein_f
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_F
              source: uniprot
    - spacer: 30
    - cistron:
        label: protein_g
        expression: medium
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: Protein_G
              source: uniprot
    - terminator: rrnB_T1