construct:
  name: "dual_arabinose_inducible_F_G"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: protein_F
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_F
              source: uniprot

    - spacer: 25

    - cistron:
        label: protein_G
        expression: high
        fused: false
        chain:
          - tag: Strep-II
          - gene:
              id: protein_G
              source: uniprot

    - terminator: rrnB_T1
