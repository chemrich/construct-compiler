construct:
  name: yeast_two_hybrid_bait_Protein_H_Gal4_DBD
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: bait
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Protein_H
              source: uniprot

    - terminator: rrnB_T1
