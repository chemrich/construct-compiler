construct:
  name: "Protein_I_constitutive_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Strong constitutive promoter for E. coli
    - cistron:
        label: target
        expression: medium
        gene:
          id: Protein_I
          source: uniprot
    - terminator: rrnB_T1