construct:
  name: "mammalian_dual_protein_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_J
        expression: high
        gene:
          id: protein_J
          source: uniprot

    - spacer: 30

    # IRES enables cap-independent translation of the downstream cistron
    - cistron:
        label: protein_K
        expression: high
        gene:
          id: protein_K
          source: uniprot

    - terminator: rrnB_T1
