construct:
  name: "Mammalian_IRES_J_K_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_j
        gene:
          id: Protein_J
          source: uniprot
    - spacer: 580 # Spacer represents the IRES sequence for internal ribosome entry
    - cistron:
        label: protein_k
        fused: false # Indicated as an independent translation unit via IRES
        gene:
          id: Protein_K
          source: uniprot
    - terminator: bGH_polyA