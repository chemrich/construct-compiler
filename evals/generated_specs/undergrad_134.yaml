construct:
  name: "yeast_secreted_protein_m"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: secreted_protein_m
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: protein_m
              source: uniprot

    - terminator: ADH1_terminator
