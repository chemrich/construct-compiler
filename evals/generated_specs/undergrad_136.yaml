construct:
  name: "dual_induction_protein_N"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_N
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_N
              source: uniprot

    - terminator: rrnB_T1

  # Additional construct (second plasmid) for dual regulation
  construct_2:
    name: "dual_induction_arabinose_repressor"
    host: e_coli_bl21

    backbone:
      resistance: ampicillin
      ori: pUC
      source: addgene

    cassette:
      - promoter: araBAD

      - cistron:
          label: tetR_repressor
          expression: medium
          gene:
            id: tetR
            source: uniprot

      - terminator: rrnB_T1
