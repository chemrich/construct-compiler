construct:
  name: "Protein_P_O_fusion"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: P_O_fusion
        expression: high
        chain:
          - gene:
              id: proteinP
              source: uniprot
          - gene:
              id: proteinO
              source: uniprot
    
    - terminator: rrnB_T1
