construct:
  name: "high_copy_GFP_yeast_sorter"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: CloDF13  # high-copy ori for yeast
    source: addgene

  cassette:
    - promoter: GAL1  # strong inducible yeast promoter, can reach very high expression with galactose

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 8xHis
          - gene:
              id: sfGFP  # superfolder GFP - superior brightness and folding kinetics in yeast
              source: fpbase

    - terminator: rrnB_T1
