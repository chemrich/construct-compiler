construct:
  name: "E_coli_EnzymeX_GFP_dual_expression"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: EnzymeX
              source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1
