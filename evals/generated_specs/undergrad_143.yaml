construct:
  name: "yeast_ProteinZ_expression_mCherry_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target_protein
        gene:
          id: ProteinZ
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        fused: false
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1