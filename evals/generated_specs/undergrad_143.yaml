construct:
  name: "S_cerevisiae_ProteinZ_mCherry"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinZ
        expression: high
        chain:
          - gene:
              id: ProteinZ
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase

    - terminator: CYC1
