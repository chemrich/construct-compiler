construct:
  name: "PeptideC_periplasmic_secretion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: PeptideC
        expression: high
        chain:
          - tag: pelB
          - gene:
              id: PeptideC
              source: uniprot

    - terminator: rrnB_T1
