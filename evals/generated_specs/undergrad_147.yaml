construct:
  name: ProteinD_IRES_ProteinE
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinD
        expression: high
        chain:
          - gene:
              id: ProteinD
              source: uniprot

    # IRES (Internal Ribosome Entry Site) enables cap-independent translation of downstream ProteinE
    - spacer: 27  # IRES consensus sequence (~27 bp minimal)

    - cistron:
        label: ProteinE
        expression: high
        fused: false
        gene:
          id: ProteinE
          source: uniprot

    - terminator: rrnB_T1
