construct:
  name: "gRNA_GeneTargetX_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        chain:
          - gene:
              id: GeneTargetX_gRNA
              source: custom
              # User must provide the 20bp guide sequence targeting GeneTargetX
              # Standard gRNA scaffold will be appended by compiler

    - terminator: rrnB_T1
