construct:
  name: "MegaProtein_Tandem_Purification"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: megaprotein_target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: Strep-II
          - gene:
              id: MegaProtein
              source: uniprot
    - terminator: T7term