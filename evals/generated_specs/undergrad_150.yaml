construct:
  name: SuperEnzyme_with_HelperProtein_secreted
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: SuperEnzyme_secreted
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: SuperEnzyme
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: HelperProtein
              source: uniprot

    - terminator: rrnB_T1
