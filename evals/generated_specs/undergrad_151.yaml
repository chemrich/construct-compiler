construct:
  name: "y2h_bait_gal4bd_fusion"
  host: yeast
  backbone:
    # This YAML represents the Bait plasmid; a matching Prey plasmid with GAL4_AD is also required.
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1 # Constitutive yeast promoter for Y2H
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_BD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: BaitProtein
              source: uniprot
    - terminator: CYC1