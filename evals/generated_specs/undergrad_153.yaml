construct:
  name: "TargetProtein_His_TEV"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TargetProtein
              source: uniprot
    
    - terminator: rrnB_T1
