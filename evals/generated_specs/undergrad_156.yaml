construct:
  name: GeneY_knockout_NatR
  host: yeast

  backbone:
    resistance: nourseothricin
    ori: 2micron
    source: addgene

  cassette:
    - sequence:
        id: GeneY_5prime_homology_arm
        length: 500
        description: 5' homology arm flanking GeneY

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: NatR
          source: uniprot

    - sequence:
        id: GeneY_3prime_homology_arm
        length: 500
        description: 3' homology arm flanking GeneY

    - terminator: rrnB_T1
