construct:
  name: "dual_mScarlet_BFP_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: mScarlet
        expression: high
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1

  cassette:
    - promoter: CMV

    - cistron:
        label: BFP
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
