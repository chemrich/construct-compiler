construct:
  name: "blue_light_responsive_expression_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: pEL222  # Blue-light activated promoter (VP16-EL222 system)
    - cistron:
        label: target_protein
        expression: high
        gene:
          id: LightGene
          source: uniprot
    - terminator: rrnB_T1