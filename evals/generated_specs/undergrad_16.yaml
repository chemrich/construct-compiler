construct:
  name: optogenetic_LightGene_blue_responsive
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: BLRP  # Blue-light responsive promoter

    - cistron:
        label: LightGene
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: LightGene
              source: uniprot

    - terminator: rrnB_T1
