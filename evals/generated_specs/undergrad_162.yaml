construct:
  name: "FungiEnzymeX_secretion_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor  # Secretion signal for yeast
          - gene:
              id: FungiEnzymeX
              source: uniprot
    - terminator: CYC1_term # Standard yeast terminator