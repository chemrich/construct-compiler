construct:
  name: "dual_protein_expression_A_B"
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ProteinB
        expression: high
        fused: false
        gene:
          id: ProteinB
          source: uniprot
    
    - terminator: rrnB_T1
