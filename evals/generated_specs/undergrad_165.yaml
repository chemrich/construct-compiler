construct:
  name: dual_fluorescent_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # IRES enables cap-independent translation of downstream cistron in mammalian cells
    - spacer: 50

    - cistron:
        label: RFP
        expression: high
        fused: false
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
