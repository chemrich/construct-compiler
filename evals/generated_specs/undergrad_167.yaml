construct:
  name: MyYeastGene_GAL_Strep
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: MyYeastGene
              source: uniprot

    - terminator: rrnB_T1
