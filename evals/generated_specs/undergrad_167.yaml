construct:
  name: "yeast_gal1_inducible_strep_myyeastgene"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: MyYeastGene
              source: uniprot
    - terminator: CYC1