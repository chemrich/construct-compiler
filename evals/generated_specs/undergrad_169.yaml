construct:
  name: "EnzymeX_IRES_FluorescentMarker"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - gene:
              id: EnzymeX
              source: uniprot

    # IRES element for polycistronic expression from single mRNA
    - spacer: 50

    - cistron:
        label: FluorescentMarker
        expression: high
        fused: false
        gene:
          id: mNeonGreen
          source: fpbase

    - terminator: rrnB_T1
