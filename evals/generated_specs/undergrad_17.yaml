construct:
  name: MyNovelPromoter_GFP_reporter
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: MyNovelPromoter

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
