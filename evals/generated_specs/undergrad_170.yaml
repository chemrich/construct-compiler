construct:
  name: "his_myprotein_gfp_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyProteinOfInterest
              source: uniprot
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term