construct:
  name: "His_MyProteinOfInterest_GFP_fusion"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyProteinOfInterest
              source: uniprot
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
