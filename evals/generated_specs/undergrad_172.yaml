construct:
  name: "SecretedFactor_Purification_System"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: IgK_leader  # Signal peptide for mammalian secretion
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: SecretedFactor
              source: uniprot
    - terminator: bGH_polyA