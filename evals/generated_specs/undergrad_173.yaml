construct:
  name: "dual_expression_regulator_effector"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: araBAD

    - cistron:
        label: EffectorEnzyme
        expression: high
        gene:
          id: EffectorEnzyme
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: J23106

    - cistron:
        label: RegulatorProtein
        expression: low
        gene:
          id: RegulatorProtein
          source: uniprot

    - terminator: rrnB_T1
