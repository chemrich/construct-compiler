construct:
  name: "regulator_effector_dual_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23106
    - cistron:
        label: regulator
        expression: low
        gene:
          id: RegulatorProtein
          source: uniprot
    - terminator: BBa_B0015
    - promoter: araBAD
    - cistron:
        label: effector
        expression: high
        gene:
          id: EffectorEnzyme
          source: uniprot
    - terminator: rrnB_T1