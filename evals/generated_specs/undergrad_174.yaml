    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: mitoprotein
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: MitoProtein
              source: uniprot
    - terminator: CYC1