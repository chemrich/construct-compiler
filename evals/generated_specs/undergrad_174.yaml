construct:
  name: "yeast_mito_targeting_construct"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mito_protein
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: MitoProtein
              source: uniprot

    - terminator: rrnB_T1
