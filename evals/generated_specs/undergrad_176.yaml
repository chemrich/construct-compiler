construct:
  name: "MyProtein_His_Strep_tagged"
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: MyProtein
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: MyProtein
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
