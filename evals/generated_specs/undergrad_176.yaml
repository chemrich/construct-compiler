construct:
  name: "his_myprotein_tandem_strep_fusion"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: tandem_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyProtein
          - linker:
              type: short_GS
              repeats: 2
          - gene:
              id: MyProtein
          - tag: Strep-II
    - terminator: T7term