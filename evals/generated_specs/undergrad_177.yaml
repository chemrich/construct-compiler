construct:
  name: cytoplasmic_GFP_nuclear_RFP
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: cytoplasmic_GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: nuclear_RFP
        expression: high
        fused: false
        chain:
          - tag: NLS
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
