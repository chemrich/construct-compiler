construct:
  name: yeast_membrane_anchor_high_expression
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive yeast promoter (also known as GPD)
    - cistron:
        label: target
        expression: high
        gene:
          id: MembraneAnchor
          source: uniprot
    - terminator: CYC1 # Standard yeast terminator