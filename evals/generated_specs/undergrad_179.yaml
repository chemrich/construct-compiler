construct:
  name: "yeast_membrane_anchor"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: membrane_anchor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MembraneAnchor
              source: uniprot

    - terminator: CYC1
