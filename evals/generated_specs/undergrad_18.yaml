construct:
  name: two_component_system_dual_TU
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: SensorKinase
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: SensorKinase
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: ResponseRegulator
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ResponseRegulator
              source: uniprot
    
    - terminator: rrnB_T1
