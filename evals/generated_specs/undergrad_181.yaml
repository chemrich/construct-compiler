construct:
  name: "GFP_and_Laccase_dual_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: Laccase
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: laccase
              source: uniprot

    - terminator: rrnB_T1
