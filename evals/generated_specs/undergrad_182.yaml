construct:
  name: GrowthFactorX_secreted
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: GrowthFactorX
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for ER-directed secretion
          - gene:
              id: GrowthFactorX
              source: uniprot

    - terminator: WPRE  # Woodchuck Post-transcriptional Regulatory Element for mammalian expression
