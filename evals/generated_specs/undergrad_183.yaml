construct:
  name: "ProteinOfInterest_GFP_localization"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: ProteinOfInterest
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
