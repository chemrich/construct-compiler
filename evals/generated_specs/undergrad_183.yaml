construct:
  name: "yeast_protein_localization_study"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Defaulting to TEF1 as the standard constitutive promoter for yeast
    - cistron:
        label: target_fusion
        expression: medium
        chain:
          - gene:
              id: ProteinOfInterest
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term