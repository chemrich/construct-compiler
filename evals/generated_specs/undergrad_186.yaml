construct:
  name: "FRET_ProteinA_CFP_ProteinB_YFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA_CFP
        expression: high
        chain:
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: ProteinB_YFP
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinB
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mYFP
              source: fpbase

    - terminator: rrnB_T1
