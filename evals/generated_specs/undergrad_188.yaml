construct:
  name: "bacterial_two_hybrid_proteinX_LexA"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinX_LexA_DBD
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: LexA_DBD
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ProteinY_B42_AD
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinY
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: B42_activation_domain
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: lacZ_reporter
        expression: medium
        fused: false
        gene:
          id: lacZ
          source: uniprot
    
    - terminator: rrnB_T1
