construct:
  name: "Tet_on_therapeutic_protein"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: TRE_tight
      # TRE (tetracycline response element) requires rtTA transactivator
      # Dox-dependent activation of tight TRE promoter

    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: 3C
          - gene:
              id: THERAPEUTIC_PROTEIN
              # Note: replace with actual UniProt ID or protein name
              source: uniprot

    - terminator: SV40_polyA
