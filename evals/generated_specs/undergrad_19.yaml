construct:
  name: "dox_inducible_therapeutic_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE3G  # Tet-on 3G promoter for strong Dox-induced expression
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - gene:
              id: IL2  # Using Human Interleukin-2 as a representative therapeutic protein
              source: uniprot
    - terminator: bGH_polyA  # Standard strong mammalian polyadenylation signal