construct:
  name: "three_enzyme_operon"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Enzyme1
        expression: high
        gene:
          id: Enzyme1
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enzyme2
        expression: high
        fused: false
        gene:
          id: Enzyme2
          source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: Enzyme3
        expression: high
        fused: false
        gene:
          id: Enzyme3
          source: uniprot
    
    - terminator: rrnB_T1
