construct:
  name: "enzymatic_pathway_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_1
        expression: high
        gene:
          id: Enzyme1
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: high
        fused: false
        gene:
          id: Enzyme2
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_3
        expression: high
        fused: false
        gene:
          id: Enzyme3
          source: uniprot
    - terminator: rrnB_T1