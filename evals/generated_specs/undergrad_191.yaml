construct:
  name: "pseudomonas_mscarlet_reporter"
  host: e_coli # Pseudomonas not in schema; e_coli used as standard bacterial host for cloning/surrogate expression
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015