construct:
  name: "CRISPR_Cas9_GeneX_knockout"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - spacer: 30

    - promoter: U6

    - cistron:
        label: gRNA_GeneX
        expression: high
        fused: false
        gene:
          id: gRNA_GeneX
          source: uniprot

    - terminator: rrnB_T1
