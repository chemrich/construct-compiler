construct:
  name: "ProteinY_tetracycline_inducible"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetO_promoter
      # tetO (tetracycline operator) sequences upstream of minimal promoter
      # In presence of doxycycline + TetR repressor: Tet-off (repressed)
      # Without doxycycline: Tet-on (derepressed, expressed)
      # Expression level tuned by doxycycline concentration

    - cistron:
        label: ProteinY
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
