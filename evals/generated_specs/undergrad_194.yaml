construct:
  name: "lacZ_promoter_activity_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac # Defaulted to T7lac per instructions; replace with specific promoter name if known
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1