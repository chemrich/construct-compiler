construct:
  name: promoter_strength_reporter_lacZ
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: custom_promoter
      sequence: "PLACEHOLDER_INSERT_YOUR_PROMOTER_SEQUENCE_HERE"

    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
