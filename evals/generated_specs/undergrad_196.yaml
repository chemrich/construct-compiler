construct:
  name: "PeriplasmicEnzyme_periplasmic_export"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: periplasmic_enzyme
        expression: high
        chain:
          - signal_peptide: pelB  # pelB signal peptide for periplasmic export
          - gene:
              id: PeriplasmicEnzyme
              source: uniprot
    
    - terminator: rrnB_T1
