construct:
  name: "dual_protein_expression_independent_control"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - terminator: rrnB_T1

    - promoter: lacUV5

    - cistron:
        label: ProteinB
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
