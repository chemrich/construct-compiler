construct:
  name: "toxin_antitoxin_plasmid_stability_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: toxin
        expression: medium
        gene:
          id: ToxinX
          source: uniprot
    - spacer: 30
    - cistron:
        label: antitoxin
        expression: high
        fused: false
        gene:
          id: AntitoxinX
          source: uniprot
    - terminator: T7term