construct:
  name: toxin_antitoxin_stability_system
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: antitoxin
        expression: high
        gene:
          id: AntitoxinX
          source: uniprot

    - spacer: 25

    - cistron:
        label: toxin
        expression: medium
        fused: false
        gene:
          id: ToxinX
          source: uniprot

    - terminator: rrnB_T1
