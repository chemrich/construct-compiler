construct:
  name: bicistronic_ProteinX_ProteinY
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: ProteinX
        expression: high
        fused: false
        gene:
          id: ProteinX
          source: uniprot

    - spacer: 30

    - cistron:
        label: ProteinY
        expression: high
        fused: false
        gene:
          id: ProteinY
          source: uniprot

    - terminator: rrnB_T1
