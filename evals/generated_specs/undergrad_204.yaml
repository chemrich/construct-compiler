construct:
  name: "bicistronic_araBAD_proteinX_proteinY"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: ProteinX
        expression: medium
        gene:
          id: ProteinX
          source: uniprot
    - spacer: 30
    - cistron:
        label: ProteinY
        expression: medium
        fused: false
        gene:
          id: ProteinY
          source: uniprot
    - terminator: rrnB_T1