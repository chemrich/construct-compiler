construct:
  name: "U6_sgRNA"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: sgRNA
        expression: high
        chain:
          - gene:
              id: sgRNA_spacer
              source: custom

    - terminator: U6_poly_III_term
