construct:
  name: "light_inducible_GFP_switch"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: light_inducible
      # Note: Using generic "light_inducible" label for literature-based photosensitive promoter
      # (e.g., cph8-based, EL222, or similar optogenetic system)

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
