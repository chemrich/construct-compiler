construct:
  name: "yeast_two_hybrid_lacz_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: lacz_reporter
        expression: high
        gene:
          id: LacZ
          source: uniprot
    - terminator: CYC1_term