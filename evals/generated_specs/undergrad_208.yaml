construct:
  name: yeast_two_hybrid_reporter
  host: yeast

  backbone:
    catalog_vector: "pGAD424"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: CYC1
