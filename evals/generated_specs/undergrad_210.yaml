construct:
  name: "toggle_switch_side_a"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100 # Constitutive promoter as requested; note that self-repression logic typically requires operator sites (e.g., tetO).
    - cistron:
        label: "ProteinA_repressor"
        expression: "high"
        gene:
          id: "P02976"
          source: "uniprot"
    - terminator: "BBa_B0015"