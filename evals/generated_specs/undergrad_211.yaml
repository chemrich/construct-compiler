construct:
  name: "dual_reporter_constitutive_inducible"
  host: e_coli_bl21_de3

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100  # Standard constitutive E. coli promoter
    - cistron:
        label: constitutive_gfp
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1

    - spacer: 50

    - promoter: T7lac  # Inducible E. coli promoter (IPTG)
    - cistron:
        label: inducible_rfp
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term