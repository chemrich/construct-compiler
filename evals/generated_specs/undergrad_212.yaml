construct:
  name: "stress_response_reporter_mCherry"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD
      # araBAD is stress-inducible (activated by arabinose, repressed under glucose)
      # Alternative: could use other stress promoters like rpoH or phage λ PRM

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
