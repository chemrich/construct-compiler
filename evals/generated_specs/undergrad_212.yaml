construct:
  name: "e_coli_stress_inducible_mcherry_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: uspA  # Universal stress protein A promoter, naturally inducible by various E. coli stress conditions
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015