construct:
  name: "yeast_ura3_knockout_cassette"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: selection_marker
        expression: medium
        gene:
          id: URA3
          source: uniprot
    - terminator: CYC1_term # Standard yeast terminator for expression cassettes