construct:
  name: "yeast_URA3_knockout_cassette"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - homology_arm_5prime: "500bp_upstream_of_target_locus"

    - promoter: GAL1

    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: URA3
          source: uniprot

    - terminator: CYC1

    - homology_arm_3prime: "500bp_downstream_of_target_locus"
