construct:
  name: "Tet_Off_ProteinB_system"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV
      comment: "Constitutive CMV drives TetR expression"

    - cistron:
        label: TetR
        expression: high
        gene:
          id: "TetR"
          source: "uniprot"

    - terminator: SV40_polyA

    - spacer: 30

    - promoter: TetO_minimal
      comment: "TetO sites upstream; active when TetR absent (Tet-Off logic)"

    - cistron:
        label: ProteinB
        expression: high
        gene:
          id: "ProteinB"
          source: "uniprot"

    - terminator: SV40_polyA
