construct:
  name: "polycistronic_ribozyme_separator"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: gene1
        expression: high
        gene:
          id: Gene1
          source: uniprot

    - ribozyme: twister_sister

    - cistron:
        label: gene2
        expression: high
        fused: false
        gene:
          id: Gene2
          source: uniprot

    - ribozyme: twister_sister

    - cistron:
        label: gene3
        expression: high
        fused: false
        gene:
          id: Gene3
          source: uniprot

    - terminator: rrnB_T1
