construct:
  name: "ribozyme_polycistronic_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: gene_1
        expression: medium
        gene:
          id: Gene1
    - spacer: 75 # RiboJ ribozyme for insulating the first intergenic region
    - cistron:
        label: gene_2
        expression: medium
        fused: false
        gene:
          id: Gene2
    - spacer: 75 # RiboJ ribozyme for insulating the second intergenic region
    - cistron:
        label: gene_3
        expression: medium
        fused: false
        gene:
          id: Gene3
    - terminator: rrnB_T1