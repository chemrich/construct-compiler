construct:
  name: "AND_gate_dual_inducers_GFP"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      comment: "Responsive to InducerA (L-arabinose); repressed by AraC in absence of inducer"

    - cistron:
        label: repressor_B
        expression: high
        gene:
          id: tetR
          source: uniprot
      comment: "TetR repressor protein; expressed constitutively from araBAD promoter"

    - terminator: rrnB_T1

    - promoter: J23100
      comment: "Constitutive baseline; modulated by TetR repression"

    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
      comment: "GFP output; transcription requires both araBAD ON (InducerA present) AND tetR OFF (InducerB present to inactivate TetR via tetO operator upstream)"

    - terminator: rrnB_T1
