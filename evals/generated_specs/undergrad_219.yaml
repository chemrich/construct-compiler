construct:
  name: SurfaceProtein_yeast_display
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_protein
        expression: high
        chain:
          - tag: alpha_factor_signal
          - gene:
              id: SurfaceProtein
              source: uniprot

    - terminator: CYC1
