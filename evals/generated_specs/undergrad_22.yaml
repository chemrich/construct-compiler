construct:
  name: mammalian_promoter_test_luciferase
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: custom_test_promoter
      # User-supplied custom promoter sequence to be inserted here

    - cistron:
        label: luciferase
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Renilla_luciferase
              source: uniprot
              # Renilla reniformis luciferase is bright and commonly used in mammalian cells

    - terminator: SV40_polyA
      # SV40 polyadenylation signal for efficient transcript termination in mammalian cells
