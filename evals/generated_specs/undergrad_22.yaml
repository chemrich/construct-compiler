```yaml
construct:
  name: "custom_promoter_luciferase_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV  # Replace with your custom promoter sequence

    - cistron:
        label: reporter
        expression: high
        gene:
          id: P14084  # Firefly luciferase
          source: uniprot

    - terminator: rrnB_T1
```