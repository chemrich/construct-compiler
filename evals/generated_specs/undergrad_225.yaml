construct:
  name: "dual_protein_mammalian_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinA
              source: uniprot

    - spacer: 25

    - cistron:
        label: ProteinB
        expression: high
        fused: false
        chain:
          - gene:
              id: ProteinB
              source: uniprot
        # IRES (Internal Ribosome Entry Site) placed before this cistron
        # enables cap-independent translation of ProteinB from same mRNA
        ires: EMCV

    - terminator: rrnB_T1
