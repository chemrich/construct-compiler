construct:
  name: "Awesome_Enzyme_SUMO_TEV"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: SUMO
          - cleavage_site: TEV
          - gene:
              id: Awesome_Enzyme
              source: uniprot

    - terminator: rrnB_T1
