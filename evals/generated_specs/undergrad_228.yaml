construct:
  name: "xyz_operon_high_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: Gene_X
        expression: high
        gene:
          id: Gene_X
    
    - spacer: 30
    
    - cistron:
        label: Gene_Y
        expression: high
        fused: false
        gene:
          id: Gene_Y
    
    - spacer: 30
    
    - cistron:
        label: Gene_Z
        expression: high
        fused: false
        gene:
          id: Gene_Z
    
    - terminator: rrnB_T1
