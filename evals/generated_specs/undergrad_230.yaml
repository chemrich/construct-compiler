construct:
  name: "Protein_D_low_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD  # weak/tunable promoter for low expression

    - cistron:
        label: Protein_D
        expression: low
        gene:
          id: Protein_D
          source: uniprot

    - terminator: rrnB_T1
