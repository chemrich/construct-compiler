construct:
  name: "yeast_two_hybrid_bait_ProteinA_DBD"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL4

    - cistron:
        label: bait
        expression: high
        chain:
          - tag: GAL4_DBD
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: YTH_ProteinA
              source: uniprot

    - terminator: rrnB_T1
