construct:
  name: "y2h_bait_yth_proteina"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: high
        chain:
          - gene:
              id: Gal4_DBD
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: YTH_ProteinA
    - terminator: ADH1_term