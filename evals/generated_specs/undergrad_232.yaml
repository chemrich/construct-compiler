construct:
  name: "secreted_protein_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal signal peptide for ER-mediated secretion
          - gene:
              id: Secreted_Protein
              source: uniprot

    - terminator: SV40_polyA
