construct:
  name: "High_Yield_Constitutive_AMP_Expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100  # Strongest constitutive Anderson promoter for maximum expression
    - cistron:
        label: amp_target
        expression: high
        chain:
          - gene:
              id: Antimicrobial_Peptide
              source: uniprot
    - terminator: rrnB_T1