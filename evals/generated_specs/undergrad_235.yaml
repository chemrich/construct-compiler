construct:
  name: "ProteinG_splitGFP1_10_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinG_splitGFP
        expression: high
        chain:
          - tag: FLAG
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: ProteinG
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP_1_10
              source: fpbase
              # N-terminal fragment of split GFP for complementation assays

    - terminator: rrnB_T1
