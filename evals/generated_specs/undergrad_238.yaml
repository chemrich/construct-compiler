construct:
  name: "dual_vibrant_fluorescence_system"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_expression_unit
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term
    - spacer: 40
    - promoter: T7lac
    - cistron:
        label: rfp_expression_unit
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1