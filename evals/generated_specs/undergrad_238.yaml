construct:
  name: dual_fluorescent_vibrant_ecoli
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
    
    - spacer: 50
    
    - promoter: tac
    
    - cistron:
        label: RFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    
    - terminator: rrnB_T1
