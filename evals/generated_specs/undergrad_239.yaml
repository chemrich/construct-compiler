construct:
  name: "yeast_surface_display_Target_Protein_L"
  host: yeast

  backbone:
    catalog_vector: "pCTCON"
    resistance: ampicillin
    ori: pBR322

  cassette:
    - promoter: GAL1

    - cistron:
        label: surface_display
        expression: high
        chain:
          - tag: HA
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Aga2p
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Target_Protein_L
              source: uniprot

    - terminator: CYC1
