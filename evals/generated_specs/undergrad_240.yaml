construct:
  name: "super_green_ecoli"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pUC
  cassette:
    - promoter: J23100 # Strong constitutive promoter for continuous high-level expression
    - cistron:
        label: sfGFP_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1