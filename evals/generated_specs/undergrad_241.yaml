construct:
  name: "Enzyme_X_IPTG_inducible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacUV5

    - cistron:
        label: enzyme_x
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_x
              source: uniprot

    - terminator: rrnB_T1
