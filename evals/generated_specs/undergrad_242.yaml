construct:
  name: mammalian_mCherry_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
