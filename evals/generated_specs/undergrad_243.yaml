construct:
  name: "purification_my_favorite_protein"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: MyFavoriteProtein
              source: uniprot
    - terminator: T7term