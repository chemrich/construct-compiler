construct:
  name: secreted_factor_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_factor
        expression: high
        chain:
          - tag: signal_peptide_IgG  # IgG signal peptide for mammalian secretion
          - gene:
              id: SecretedFactor
              source: uniprot

    - terminator: SV40_polyA
