construct:
  name: "dual_protein_operon_high_yield"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: Protein_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: proteinA
              source: uniprot
    - spacer: 30
    - cistron:
        label: Protein_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: proteinB
              source: uniprot
    - terminator: rrnB_T1
