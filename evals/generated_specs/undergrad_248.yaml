construct:
  name: "mammalian_CRISPR_Cas9_gRNA"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot
          - tag: NLS

    - promoter: U6

    - cistron:
        label: gRNA
        expression: high
        fused: false
        chain:
          - gene:
              id: CRISPR_gRNA_scaffold
              source: uniprot

    - terminator: BBa_B0015
