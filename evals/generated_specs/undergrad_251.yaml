construct:
  name: "plant_constitutive_mEGFP_expression"
  host: plant # Plant host used as requested; CaMV 35S is a standard constitutive promoter for plant systems.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CaMV_35S
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: NOS_term