construct:
  name: "StickyProtein_MBP_fusion"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: StickyProtein_MBP
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: StickyProtein
              source: uniprot

    - terminator: rrnB_T1
