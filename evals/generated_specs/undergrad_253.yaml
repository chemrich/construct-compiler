construct:
  name: "yeast_galactose_inducible_YeastProtein"
  host: yeast

  backbone:
    resistance: G418  # geneticin, standard selection marker for S. cerevisiae
    ori: 2_micron    # 2_micron plasmid origin for S. cerevisiae
    source: addgene

  cassette:
    - promoter: GAL1  # galactose-inducible promoter in S. cerevisiae

    - cistron:
        label: YeastProtein
        expression: high
        gene:
          id: YeastProtein
          source: uniprot

    - terminator: CYC1  # CYC1 terminator, standard for yeast
