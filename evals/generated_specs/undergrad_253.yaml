construct:
  name: "yeast_galactose_inducible_expression"
  host: yeast
  backbone:
    catalog_vector: "pRS416" # Common S. cerevisiae centromere vector with URA3 selection marker
  cassette:
    - promoter: GAL1 # Standard yeast galactose-inducible promoter
    - cistron:
        label: target
        expression: high
        gene:
          id: YeastProtein
          source: uniprot
    - terminator: CYC1 # Standard yeast transcriptional terminator