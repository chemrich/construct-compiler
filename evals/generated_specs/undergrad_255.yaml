construct:
  name: "TargetGene_chromosomal_integration"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - homology_arm_upstream:
        length: 500
        target_region: "chromosomal_locus"
    
    - cistron:
        label: target
        expression: high
        gene:
          id: TargetGene
          source: uniprot
    
    - homology_arm_downstream:
        length: 500
        target_region: "chromosomal_locus"
    
    - terminator: rrnB_T1
