construct:
  name: "GFP_Protein_X_Fusion_Constitutive"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: target_fusion
        expression: medium
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Protein_X
    - terminator: rrnB_T1