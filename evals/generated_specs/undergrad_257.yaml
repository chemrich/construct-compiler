construct:
  name: two_component_sensor_effector_system
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: sensor
        expression: high
        gene:
          id: SensorProtein
          source: uniprot

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: effector
        expression: high
        gene:
          id: EffectorProtein
          source: uniprot

    - terminator: rrnB_T1
