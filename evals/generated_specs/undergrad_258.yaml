construct:
  name: "antisense_RNA_TargetGene_knockdown"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: U6

    - cistron:
        label: antisense_TargetGene
        expression: high
        chain:
          - gene:
              id: TargetGene_antisense
              source: custom
              # Note: User must provide the antisense sequence complementary to TargetGene mRNA

    - terminator: U6term

    - spacer: 30

    - promoter: CMV

    - cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: PURO
              source: uniprot
              # Puromycin resistance for mammalian selection

    - terminator: BHKS_polyA
