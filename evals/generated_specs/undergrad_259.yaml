construct:
  name: "PeriplasmicProtein_periplasmic_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tac

    - cistron:
        label: periplasmic_target
        expression: high
        chain:
          - signal_peptide: pelB
          - gene:
              id: PeriplasmicProtein
              source: uniprot

    - terminator: rrnB_T1
