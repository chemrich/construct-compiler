construct:
  name: "dual_expression_constitutive_inducible"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD
      cistron:
        label: protein_A
        expression: medium
        gene:
          id: protein_A
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac
      cistron:
        label: protein_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot

    - terminator: rrnB_T1
