```yaml
construct:
  name: dual_expression_constitutive_and_inducible
  host: e_coli_bl21_de3

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: J23100  # Constitutive expression

    - cistron:
        label: protein_A
        expression: medium
        gene:
          id: A  # Replace with actual protein ID
          source: uniprot

    - terminator: rrnB_T1

    - promoter: T7lac  # IPTG-inducible

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: B  # Replace with actual protein ID
              source: uniprot

    - terminator: rrnB_T1
