construct:
  name: "constitutive_inducible_dual_expression"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: protein_A
        expression: medium
        gene:
          id: protein_A
          source: uniprot
    - terminator: rrnB_T1
    - promoter: T7lac
    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_B
              source: uniprot
    - terminator: T7term