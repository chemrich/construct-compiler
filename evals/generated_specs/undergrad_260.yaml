construct:
  name: "AwesomeProtein_expression"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: AwesomeProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AwesomeProtein
              source: uniprot
    
    - terminator: rrnB_T1
