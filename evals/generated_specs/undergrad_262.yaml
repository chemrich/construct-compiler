construct:
  name: "HEK293_constitutive_therapeutic_protein_FLAG"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: therapeutic_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P01241  # Using Human Growth Hormone (hGH) as a representative therapeutic protein
              source: uniprot
    - terminator: SV40_polyA  # Standard polyadenylation signal for mammalian expression