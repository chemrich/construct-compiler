construct:
  name: EnzymeA_EnzymeB_dual_expression
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeA
              source: uniprot
    
    - spacer: 25
    
    - cistron:
        label: EnzymeB
        expression: high
        fused: false
        chain:
          - gene:
              id: EnzymeB
              source: uniprot
          - tag: Myc
    
    - terminator: rrnB_T1
