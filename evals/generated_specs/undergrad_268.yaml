construct:
  name: InsolubleProtein_MBP_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: pET-28b(+)

  cassette:
    - promoter: T7

    - cistron:
        label: InsolubleProtein_MBP
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: InsolubleProtein
              source: uniprot

    - terminator: rrnB_T1
