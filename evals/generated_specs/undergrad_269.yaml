construct:
  name: "dual_promoter_yeast_GFP_mCherry"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1

    - spacer: 100

    - promoter: TEF1

    - cistron:
        label: mCherry
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: CYC1
