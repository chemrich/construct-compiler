construct:
  name: "yeast_dual_reporter_GPD_TEF1"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: gfp_unit
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1
    - spacer: 50
    - promoter: TEF1
    - cistron:
        label: mcherry_unit
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: ADH1