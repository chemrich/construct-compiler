construct:
  name: yeast_protein_C_GFP_fusion
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: C
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1