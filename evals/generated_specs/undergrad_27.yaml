construct:
  name: "protein_C_GFP_localization"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: pADH1

    - cistron:
        label: protein_C_GFP
        expression: high
        chain:
          - gene:
              id: protein_C
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sGFP
              source: fpbase

    - terminator: rrnB_T1
