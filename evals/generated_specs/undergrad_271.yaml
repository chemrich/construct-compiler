construct:
  name: "arabinose_inducible_SensorProtein"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: SensorProtein
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: SensorProtein
              source: uniprot

    - terminator: rrnB_T1
