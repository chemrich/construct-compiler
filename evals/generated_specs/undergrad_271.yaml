construct:
  name: "SensorProtein_Myc_Inducible_Ecoli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: sensor_cistron
        expression: medium
        chain:
          - tag: Myc
          - gene:
              id: SensorProtein
              source: uniprot
    - terminator: rrnB_T1