construct:
  name: DomainA_DomainB_fusion
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: fusion
        expression: high
        chain:
          - gene:
              id: DomainA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: DomainB
              source: uniprot
          - tag: 6xHis

    - terminator: rrnB_T1
