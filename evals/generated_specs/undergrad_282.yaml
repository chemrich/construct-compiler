construct:
  name: HEK293_therapeutic_with_selection
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: therapeutic_protein
              source: uniprot

    - spacer: 30

    - promoter: SV40

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        gene:
          id: PuroR
          source: uniprot

    - terminator: SV40_polyA
