construct:
  name: "yeast_dual_constitutive_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # High-level constitutive yeast promoter
    - cistron:
        label: protein_a
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: protein_b
        expression: high
        fused: false  # Independent translation via separate start site (e.g., IRES or 2A in yeast context)
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term