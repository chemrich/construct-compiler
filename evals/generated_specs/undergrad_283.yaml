construct:
  name: dual_protein_yeast_expression
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: protein_A
        expression: high
        gene:
          id: HIS3
          source: uniprot

    - terminator: CYC1

    - promoter: ADH1

    - cistron:
        label: protein_B
        expression: high
        gene:
          id: URA3
          source: uniprot

    - terminator: CYC1
