construct:
  name: "Protein_Alpha_Beta_fusion_Myc"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - tag: Myc
          - gene:
              id: P12345
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P67890
              source: uniprot

    - terminator: rrnB_T1
