construct:
  name: "mammalian_sgRNA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - gene:
        id: sgRNA
        sequence: "GGTGAGTGAGTGTGTGCGTG"
        description: "User-defined guide RNA target sequence"

    - terminator: U6_terminator
