construct:
  name: "IPTG_inducible_Awesome"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: lacI
    - cistron:
        label: repressor
        expression: medium
        gene:
          id: lacI
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 50

    - promoter: T7lac
    - cistron:
        label: Awesome
        expression: high
        gene:
          id: Awesome
          source: uniprot

    - terminator: rrnB_T1
