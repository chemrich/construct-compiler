construct:
  name: "HEK293_TargetGene_GFP_BlasticidinR"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin

  cassette:
    - promoter: CMV

    - cistron:
        label: target
        expression: high
        gene:
          id: TargetGene
          source: uniprot

    - terminator: SV40pA

    - promoter: EF1_alpha

    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: SV40pA

    - promoter: SV40

    - cistron:
        label: BlasticidinR
        expression: high
        gene:
          id: BSD
          source: uniprot

    - terminator: SV40pA
