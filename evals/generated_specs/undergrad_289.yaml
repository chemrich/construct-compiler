construct:
  name: mitoprotein_mammalian_mitochondrial_expression
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mitochondrial_target
        expression: high
        chain:
          - tag: MTS # Mitochondrial Targeting Signal (typically from COX4 or SOD2)
          - gene:
              id: MitoProtein
              source: uniprot
    - terminator: bGH_pA