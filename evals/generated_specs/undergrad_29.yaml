construct:
  name: "mammalian_polycistronic_D_E"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: protein_D
        expression: medium
        gene:
          id: D
          source: uniprot
    - spacer: 585  # Length of an EMCV IRES for independent translation in mammalian systems
    - cistron:
        label: protein_E
        expression: medium
        fused: false  # Indicates independent translation via the IRES spacer
        gene:
          id: E
          source: uniprot
    - terminator: bGH_polyA  # Standard polyadenylation signal for mammalian expression constructs