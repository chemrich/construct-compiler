construct:
  name: mammalian_D_E_IRES_coexpression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_D
        expression: high
        gene:
          id: D
          source: uniprot

    - spacer: 500  # IRES sequence for independent translation initiation

    - cistron:
        label: protein_E
        expression: medium
        fused: false  # independent translation via IRES
        gene:
          id: E
          source: uniprot

    - terminator: rrnB_T1