construct:
  name: "mammalian_coexpression_D_E_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_D
        expression: high
        gene:
          id: D
          source: uniprot

    - spacer: 50  # IRES sequence region

    - cistron:
        label: protein_E
        expression: high
        fused: false
        gene:
          id: E
          source: uniprot

    - terminator: rrnB_T1
