construct:
  name: "yeast_lacz_reporter_assay"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: "custom_yeast_promoter" # User-provided novel yeast promoter sequence
    - cistron:
        label: lacz_reporter
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - terminator: CYC1_term # Standard yeast transcription terminator