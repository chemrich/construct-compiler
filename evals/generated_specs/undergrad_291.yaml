construct:
  name: "SuperProtein_Tandem_Purification"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II
          - cleavage_site: TEV
          - gene:
              id: SuperProtein
              source: uniprot
    - terminator: rrnB_T1