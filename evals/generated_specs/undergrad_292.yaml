construct:
  name: "AwesomeProtein_His_Enterokinase"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: Enterokinase
          - gene:
              id: AwesomeProtein
              source: uniprot

    - terminator: rrnB_T1
