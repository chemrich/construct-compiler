construct:
  name: "short_peptide_binding_assay_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_peptide
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP  # Added MBP for stability and solubility, as 10-15 aa peptides are often unstable/degraded in E. coli
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV   # TEV site allows for the release of the short peptide from the MBP carrier
          - gene:
              id: peptide_target
              source: uniprot
    - terminator: T7term