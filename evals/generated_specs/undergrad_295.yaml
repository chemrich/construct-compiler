construct:
  name: "mammalian_dual_protein_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Gene_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Gene_A
              source: uniprot

    # IRES enables cap-independent translation of the downstream cistron
    # from the same mRNA, allowing two separate proteins from one transcript
    - spacer: 27  # IRES sequence (~27 bp for minimal IRES)

    - cistron:
        label: Gene_B
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Gene_B
              source: uniprot

    - terminator: rrnB_T1
