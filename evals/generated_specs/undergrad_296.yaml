construct:
  name: "high_level_constitutive_therapeutic_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Strongest constitutive promoter in the Anderson library for high-level always-on expression
    - cistron:
        label: therapeutic_protein
        expression: high
        gene:
          id: P01308  # Human insulin as a representative therapeutic protein
          source: uniprot
    - terminator: rrnB_T1