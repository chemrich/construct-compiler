construct:
  name: "constitutive_therapeutic_protein"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: trc  # trc is a strong constitutive promoter, stronger than lacUV5 alone

    - cistron:
        label: therapeutic
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ""
              source: uniprot
              # User should specify their therapeutic protein ID

    - terminator: rrnB_T1
