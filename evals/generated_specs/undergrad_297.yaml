construct:
  name: "constitutive_blue_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: blue_reporter
        expression: medium
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1