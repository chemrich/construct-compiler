construct:
  name: "dual_enzyme_polycistronic_expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_a
        expression: high
        gene:
          id: Enzyme_A
          source: uniprot
    - spacer: 30  # 2A peptides function via eukaryotic ribosome skipping; polycistronic expression (spacer + separate RBS) is the standard method for E. coli separation.
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: Enzyme_B
          source: uniprot
    - terminator: T7term