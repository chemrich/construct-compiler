construct:
  name: "Enzyme_A_2A_Enzyme_B"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: Enzyme_A
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Enzyme_A
              source: uniprot

    - cistron:
        label: Enzyme_B
        expression: high
        fused: false
        chain:
          - cleavage_site: 2A_self_cleaving
          - gene:
              id: Enzyme_B
              source: uniprot

    - terminator: rrnB_T1
