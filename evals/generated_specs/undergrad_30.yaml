construct:
  name: "t7_small_rna_expression_vector"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: "sRNA_payload"
        # Note: Expression as a cistron allows DNA assembly; intended for transcription of non-coding RNA
        gene:
          id: "small_RNA_sequence"
    - terminator: T7term