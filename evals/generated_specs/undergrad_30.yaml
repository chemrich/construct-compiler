construct:
  name: small_RNA_expression_ecoli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - rna_sequence:
        label: target_small_rna
        sequence: "GGAATTCGAGCTCGGTACCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"
        # Replace the above sequence with your desired small RNA (miRNA, siRNA, sRNA, etc.)

    - terminator: rrnB_T1
