```yaml
construct:
  name: "small_RNA_expression"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: small_RNA
        expression: high
        gene:
          id: "custom_small_RNA"  # Replace with your specific RNA sequence ID
          source: custom

    - terminator: T7term
```