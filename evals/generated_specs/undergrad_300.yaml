construct:
  name: "glow_green_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Constitutive promoter for "all the time" expression
    - cistron:
        label: fluorescence_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1