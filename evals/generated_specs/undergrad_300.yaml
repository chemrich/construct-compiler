construct:
  name: "e_coli_constitutive_gfp"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: J23100
    
    - cistron:
        label: gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    
    - terminator: rrnB_T1
