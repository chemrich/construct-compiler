construct:
  name: dual_fluorophore_mammalian
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: green
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    # 2A peptide enables stoichiometric production of two separate proteins from one promoter
    - spacer: 18  # 2A peptide sequence (GSGATNFSLLKQAGDVEENPFT)

    - cistron:
        label: red
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
