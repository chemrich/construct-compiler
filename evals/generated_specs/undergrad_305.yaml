construct:
  name: mammalian_dual_color_skip_2A
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 66  # 22aa P2A self-cleaving "skip" sequence
    - cistron:
        label: red_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_polyA