construct:
  name: "effector_GFP_fusion_TEV_cleavable"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: effector_GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: effector
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
