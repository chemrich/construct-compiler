    - cistron:
        label: tetR_repressor
        expression: medium
        gene:
          id: P04483
          source: uniprot
    - terminator: BBa_B0015
    - promoter: Ptet
    - cistron:
        label: reporter_gfp
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1