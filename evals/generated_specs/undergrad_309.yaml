construct:
  name: repressor_gfp_circuit
  host: e_coli_bl21
  
  backbone:
    catalog_vector: "pET-28b(+)"
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: repressor
        expression: high
        gene:
          id: lacI
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: lacO  # operator-containing promoter repressed by LacI
    
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    
    - terminator: rrnB_T1
