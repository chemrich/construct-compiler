construct:
  name: yeast_Cas9_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: pTDH3  # Strong constitutive yeast promoter

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: rrnB_T1
