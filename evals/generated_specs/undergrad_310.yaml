construct:
  name: "GST_solubility_fusion_sfGFP"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gst_target_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - cleavage_site: TEV
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: sfGFP  # sfGFP used as a placeholder for the user's protein to ensure solubility/folding
              source: fpbase
    - terminator: T7term