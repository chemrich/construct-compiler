construct:
  name: "yeast_two_hybrid_dual_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_BD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Protein_A
    - terminator: CYC1_term
    - promoter: ADH1
    - cistron:
        label: prey_fusion
        expression: medium
        chain:
          - gene:
              id: GAL4_AD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: Protein_B
    - terminator: CYC1_term