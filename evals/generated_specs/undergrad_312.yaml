construct:
  name: blue_light_switch_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: photoreceptor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: CRY2
              source: uniprot

    - spacer: 30

    - cistron:
        label: transactivator
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CIBN
              source: uniprot

    - spacer: 30

    - cistron:
        label: target_gene
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
