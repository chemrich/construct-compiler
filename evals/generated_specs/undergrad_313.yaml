construct:
  name: "quorum_sensing_lux_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lux
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1