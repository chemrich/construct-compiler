construct:
  name: translation_blocking_aptamer
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: aptamer
        expression: high
        chain:
          - gene:
              id: custom_aptamer
              sequence: "GGCCGAGGCGACCAGCCGAGCCGAGCCGAGAAGCCCCGAGAAGCCCCGAGAAGCCCCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATCGACGAGACGGATC"
              source: custom
    
    - terminator: rrnB_T1
