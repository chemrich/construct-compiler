construct:
  name: "heat_shock_inducible_protein"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: groES  # Heat shock promoter; activated at elevated temperature (typically 42°C)

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
