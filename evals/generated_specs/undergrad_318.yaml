construct:
  name: heat_shock_inducible_sfgfp
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: grpE  # Natural E. coli heat shock promoter
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1