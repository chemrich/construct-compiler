construct:
  name: yeast_pheromone_pathway_reporter
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: FUS1  # FUS1 is a pheromone-responsive promoter in S. cerevisiae

    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
