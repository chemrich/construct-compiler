construct:
  name: "yeast_mating_response_reporter"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: FUS1 # Standard yeast pheromone-inducible promoter
    - cistron:
        label: reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1 # Standard yeast terminator