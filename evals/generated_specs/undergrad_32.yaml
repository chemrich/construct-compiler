construct:
  name: "pBAD_6xHis_MCS_vector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: araBAD
    - cistron:
        label: cloning_site
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: lacZ_alpha
              source: uniprot
    - terminator: rrnB_T1