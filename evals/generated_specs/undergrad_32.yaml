construct:
  name: pBAD_MCS_His_expression_vector
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: araBAD

    - cistron:
        label: insert
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: MCS_placeholder
              source: uniprot

    - terminator: rrnB_T1
