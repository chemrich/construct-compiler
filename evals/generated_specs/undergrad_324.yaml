construct:
  name: "yeast_red_reporter"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: red_fluorescent_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: CYC1