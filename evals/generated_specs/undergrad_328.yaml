construct:
  name: green_and_red_e_coli
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: GFP
        expression: high
        gene:
          id: mEGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: J23106

    - cistron:
        label: RFP
        expression: high
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
