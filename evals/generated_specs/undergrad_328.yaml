construct:
  name: "dual_constitutive_green_red_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: green_reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
    - promoter: J23100
    - cistron:
        label: red_reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015