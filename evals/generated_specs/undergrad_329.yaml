construct:
  name: "human_CRISPR_guide_RNA"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        gene:
          id: SpCas9_gRNA_scaffold
          source: uniprot
        # Note: For functional CRISPR guide RNAs, the actual target sequence
        # should be cloned into the variable region. The compiler will provide
        # the gRNA scaffold; you will need to insert your specific 20bp target
        # sequence into the appropriate position during cloning.

    - terminator: rrnB_T1
