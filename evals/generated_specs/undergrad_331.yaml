construct:
  name: light_inducible_GFP_expression
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: CRY2_light_inducible
      # Blue light-inducible promoter based on cryptochrome 2 (CRY2) system
      # Requires co-expression of CRY2-VP16 or similar optogenetic transactivator

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
