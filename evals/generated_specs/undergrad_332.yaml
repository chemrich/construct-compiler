construct:
  name: "yeast_EnzymeZ_URA3_pathway"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzymeZ
        expression: high
        gene:
          id: EnzymeZ
          source: uniprot

    - terminator: CYC1

    - spacer: 30

    - promoter: URA3

    - cistron:
        label: URA3_selection
        expression: high
        gene:
          id: URA3
          source: uniprot

    - terminator: CYC1
