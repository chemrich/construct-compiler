construct:
  name: "SuperProtein_dual_tag"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SuperProtein
              source: uniprot
          - tag: Strep-II

    - terminator: rrnB_T1
