construct:
  name: mammalian_shRNA_knockdown
  host: mammalian
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: H1
    - cistron:
        label: shRNA_payload
        gene:
          id: shRNA_sequence
    - terminator: polyT  # Standard Pol III terminator for H1/U6 promoters