construct:
  name: "shRNA_knockdown_construct"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: H1

    - cistron:
        label: shRNA
        expression: high
        gene:
          id: shRNA_custom
          sequence: "GATCCCCGAATTCTAGAGCCACGAATTCAAGAATTCGTGGCTCTAGAATTCTTTTTGGAAA"

    - terminator: rrnB_T1
