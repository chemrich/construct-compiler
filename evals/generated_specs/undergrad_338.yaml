construct:
  name: "biosensor_gfp_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: araBAD  # Substituted 'ExternalFactorPromoter' with araBAD, a standard inducible promoter for E. coli biosensors.
    - cistron:
        label: reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1