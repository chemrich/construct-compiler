construct:
  name: "biosensor_GFP_reporter"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: ExternalFactorPromoter

    - cistron:
        label: GFP_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
