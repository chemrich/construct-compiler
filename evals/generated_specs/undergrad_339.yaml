construct:
  name: "his_tag_tev_minipeptide_expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: peptide_expression
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MiniPeptide
              source: uniprot
    - terminator: T7term