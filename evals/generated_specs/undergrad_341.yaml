construct:
  name: yeast_constitutive_sfGFP_LEU2
  host: yeast
  backbone:
    resistance: leucine
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strongest constitutive promoter for high expression in S. cerevisiae
    - cistron:
        label: reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator