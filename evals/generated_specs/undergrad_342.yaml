construct:
  name: "doxycycline_inducible_growthfactorx"
  host: HEK293
  backbone:
    resistance: neomycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE3G  # Doxycycline-inducible (Tet-On) promoter
    - cistron:
        label: target
        expression: high
        gene:
          id: GrowthFactorX
          source: uniprot
    - terminator: SV40_polyA  # Standard mammalian polyadenylation signal