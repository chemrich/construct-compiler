construct:
  name: "EnzymeA_EnzymeB_polycistronic"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzymeA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: EnzymeA
              source: uniprot

    - spacer: 30

    - cistron:
        label: EnzymeB
        expression: high
        fused: false
        chain:
          - gene:
              id: EnzymeB
              source: uniprot
          - tag: FLAG

    - terminator: rrnB_T1
