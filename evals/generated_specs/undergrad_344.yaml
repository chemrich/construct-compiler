construct:
  name: ScaffoldProtein_mCherry_yeast
  host: yeast

  backbone:
    resistance: URA3
    ori: CEN6
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: scaffold_cherry
        expression: high
        chain:
          - gene:
              id: ScaffoldProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
