construct:
  name: "CytokineY_secretion_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: CytokineY_secreted
        expression: high
        chain:
          - tag: signal_peptide_IL2
          - tag: Myc
          - gene:
              id: CytokineY
              source: uniprot

    - terminator: SV40_polyA
