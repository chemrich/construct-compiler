construct:
  name: "yeast_split_mVenus_complementation"
  host: yeast

  backbone:
    resistance: HIS3
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mVenus_N_terminal
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mVenus_1_155
              source: uniprot

    - spacer: 25

    - cistron:
        label: mVenus_C_terminal
        expression: high
        fused: false
        chain:
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mVenus_156_238
              source: uniprot

    - terminator: CYC1
