construct:
  name: "shRNA_GeneZ_knockdown"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: shRNA_GeneZ
        expression: high
        chain:
          - gene:
              id: shRNA_GeneZ_targeting_sequence
              source: custom
              # Note: User should provide the actual 21-22 nt target sequence
              # Format: 5'-sense-loop-antisense-3' under U6 promoter
              # Typical loop: TTCAAGAGA or CTCGAG

    - terminator: U6_terminator
