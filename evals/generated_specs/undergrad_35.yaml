construct:
  name: doxycycline_inducible_F_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: TRE3G  # Tetracycline Response Element for doxycycline induction

    - cistron:
        label: F
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: F
              source: uniprot

    - terminator: bGH_polyA
