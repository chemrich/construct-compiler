construct:
  name: "yeast_StressSensor_galactose_inducible_with_BFP"
  host: yeast

  backbone:
    resistance: tryptophan
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1
      
    - cistron:
        label: StressSensor
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: StressSensor
              source: uniprot

    - terminator: CYC1

    - spacer: 30

    - promoter: TDH3

    - cistron:
        label: BFP
        expression: high
        fused: false
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase

    - terminator: CYC1
