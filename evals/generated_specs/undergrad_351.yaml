construct:
  name: ReceptorM_surface_display
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ReceptorM
        expression: high
        chain:
          - tag: signal_peptide_SP  # N-terminal secretion signal
          - gene:
              id: ReceptorM
              source: uniprot
          - tag: Myc
          - tag: GPI_anchor_signal  # C-terminal GPI modification signal

    - terminator: polyA
