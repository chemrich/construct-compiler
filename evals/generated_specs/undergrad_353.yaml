construct:
  name: "AntifungalPeptide_HO_integration"
  host: yeast

  backbone:
    resistance: LEU2
    ori: null
    source: integration_cassette

  cassette:
    - homology_arm:
        locus: HO
        direction: upstream
        length: 1000

    - promoter: GAL1

    - cistron:
        label: antifungal_peptide
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AntifungalPeptide
              source: uniprot

    - terminator: CYC1

    - marker:
        type: LEU2
        direction: forward

    - homology_arm:
        locus: HO
        direction: downstream
        length: 1000
