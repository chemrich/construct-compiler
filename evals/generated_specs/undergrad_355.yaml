construct:
  name: "ToxPro_low_expression_system"
  host: e_coli
  backbone:
    resistance: tetracycline
    ori: SC101  # Low-copy origin for stability with toxic proteins
    source: addgene
  cassette:
    - promoter: J23106  # Weak constitutive promoter to minimize expression
    - cistron:
        label: toxic_target
        expression: very_low
        gene:
          id: ToxPro
          source: uniprot
    - terminator: rrnB_T1