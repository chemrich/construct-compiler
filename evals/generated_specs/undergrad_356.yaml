construct:
  name: BactEnzyme_mNeonGreen_yeast
  host: yeast

  backbone:
    resistance: ADE2
    ori: 2micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: BactEnzyme_fusion
        expression: high
        chain:
          - gene:
              id: BactEnzyme
              source: uniprot
              codon_optimization: yeast
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mNeonGreen
              source: fpbase

    - terminator: CYC1
