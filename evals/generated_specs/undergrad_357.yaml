construct:
  name: "dual_promoter_mammalian_activator_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: ActivatorA
        expression: high
        gene:
          id: ActivatorA
          source: uniprot

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: ReporterR
        expression: high
        gene:
          id: ReporterR
          source: uniprot

    - terminator: rrnB_T1
