construct:
  name: "dual_promoter_mammalian_activator_reporter"
  host: mammalian
  backbone:
    resistance: blasticidin
    ori: pUC
    source: custom
  cassette:
    - promoter: CMV
    - cistron:
        label: activator
        expression: high
        gene:
          id: ActivatorA
          source: uniprot
    - terminator: BGH_pA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: reporter
        expression: high
        gene:
          id: ReporterR
          source: uniprot
    - terminator: SV40_pA