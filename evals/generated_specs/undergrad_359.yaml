construct:
  name: "mammalian_bicistronic_Protein1_Protein2"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: zeocin
    # Note: zeocin resistance cassette will be included in the backbone

  cassette:
    - promoter: CMV

    - cistron:
        label: Protein1
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Protein1
              source: uniprot

    # IRES (Internal Ribosome Entry Site) represented as spacer with comment
    # Standard ENCV IRES sequence (~600 bp) enables cap-independent translation
    - spacer: 600

    - cistron:
        label: Protein2
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Protein2
              source: uniprot

    - terminator: rrnB_T1
