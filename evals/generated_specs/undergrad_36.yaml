construct:
  name: "constitutive_his_tev_protein_g"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100  # Standard constitutive promoter for E. coli
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: G
              source: uniprot
    - terminator: rrnB_T1