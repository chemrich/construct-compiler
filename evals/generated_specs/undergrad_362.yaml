construct:
  name: "YeastStuff_secreted"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: ADH1

    - cistron:
        label: YeastStuff
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: YeastStuff
              source: uniprot

    - terminator: CYC1
