construct:
  name: "HEK293_TargetX_mCherry_Fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_reporter_fusion
        expression: high
        chain:
          - gene:
              id: TargetX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: mCherry
              source: fpbase
    - terminator: SV40_pA