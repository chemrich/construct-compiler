construct:
  name: "HEK293_TargetX_mCherry_fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: TargetX_mCherry
        expression: high
        chain:
          - gene:
              id: TargetX
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
