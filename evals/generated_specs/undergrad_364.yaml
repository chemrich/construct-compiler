construct:
  name: "Gene1_Gene2_coexpression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: Gene1
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: Gene1
              source: uniprot
    - terminator: rrnB_T1
    - promoter: J23106
    - cistron:
        label: Gene2
        expression: medium
        chain:
          - gene:
              id: Gene2
              source: uniprot
    - terminator: rrnB_T1
