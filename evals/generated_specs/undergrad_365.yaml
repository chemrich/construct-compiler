construct:
  name: "PromoterA_GFP_constitutive_BFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: PromoterA

    - cistron:
        label: test
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: EF1_alpha

    - cistron:
        label: control
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
