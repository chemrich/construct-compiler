construct:
  name: "Cas9_gRNA_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: bGH_poly_A

    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        gene:
          id: CRISPR_guide_RNA
          source: uniprot

    - terminator: U6_terminator
