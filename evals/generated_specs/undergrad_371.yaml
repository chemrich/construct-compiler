construct:
  name: "ProteinB_ReporterC_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: ProteinB
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinB
              source: uniprot

    # IRES element for cap-independent translation of second cistron
    - spacer: 150  # IRES sequence ~150 bp

    - cistron:
        label: ReporterC
        expression: high
        fused: false
        gene:
          id: ReporterC
          source: uniprot

    - terminator: rrnB_T1
