construct:
  name: "EF1a_bicistronic_ProteinB_ReporterC"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target_protein_b
        expression: high
        gene:
          id: ProteinB
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_c
        expression: medium
        fused: false
        gene:
          id: ReporterC
          source: uniprot
    - terminator: bGH_pA