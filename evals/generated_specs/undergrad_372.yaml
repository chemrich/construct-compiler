construct:
  name: MembraneThing_expression_weak_promoter
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5  # Weaker than T7lac to reduce expression rate and avoid inclusion bodies
    
    - cistron:
        label: MembraneThing
        expression: low  # Reduced expression to minimize aggregation of hydrophobic protein
        chain:
          - tag: 6xHis
          - gene:
              id: MembraneThing
              source: uniprot
    
    - terminator: rrnB_T1
