construct:
  name: "promoter_library_gfp_reporter"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: "YOUR_PROMOTER_HERE" # Placeholder ID for promoter library insertion
    - cistron:
        label: reporter
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1