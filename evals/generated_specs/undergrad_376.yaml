construct:
  name: "GeneToBeKnockedOut_knockout_cassette"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - homology_arm:
        label: homology_left
        length: 500
        target_gene: GeneToBeKnockedOut
        position: upstream

    - marker:
        label: selection_marker
        type: URA3
        selectable: true

    - homology_arm:
        label: homology_right
        length: 500
        target_gene: GeneToBeKnockedOut
        position: downstream
