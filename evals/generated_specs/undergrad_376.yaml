construct:
  name: "gene_to_be_knocked_out_ko_ura3"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - cistron:
        label: homology_arm_5
        fused: false # Homology arms are non-coding sequences; represented as cistrons for the compiler
        gene:
          id: "gene_to_be_knocked_out_5_prime"
    
    - spacer: 40

    - promoter: TEF1 # Standard yeast constitutive promoter for selection markers

    - cistron:
        label: selection_marker
        expression: medium
        gene:
          id: URA3
          source: uniprot

    - terminator: CYC1_term # Standard yeast terminator for transcription stop

    - spacer: 40

    - cistron:
        label: homology_arm_3
        fused: false # Homology arms are non-coding sequences; represented as cistrons for the compiler
        gene:
          id: "gene_to_be_knocked_out_3_prime"

    - terminator: BBa_B0015