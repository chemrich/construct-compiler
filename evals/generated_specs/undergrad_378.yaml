construct:
  name: "triple_protein_polycistronic"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot

    # F2A self-cleaving peptide spacer
    - spacer: 18  # F2A peptide sequence

    - cistron:
        label: ProteinY
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinY
              source: uniprot

    # F2A self-cleaving peptide spacer
    - spacer: 18

    - cistron:
        label: ProteinZ
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinZ
              source: uniprot

    - terminator: rrnB_T1
