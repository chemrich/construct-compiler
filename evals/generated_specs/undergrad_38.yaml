construct:
  name: "XYZ_enzyme_operon"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7

    - cistron:
        label: enzyme_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: X

    - spacer: 25

    - cistron:
        label: enzyme_Y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Y

    - spacer: 25

    - cistron:
        label: enzyme_Z
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: Z

    - terminator: rrnB_T1
