construct:
  name: "constitutive_high_gfp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Strong constitutive promoter for constant high-level expression
    - cistron:
        label: bright_gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015