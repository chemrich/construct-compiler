construct:
  name: "mEGFP_His_Purification"
  host: e_coli_bl21_de3 # DE3 strain required for T7-based expression
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term