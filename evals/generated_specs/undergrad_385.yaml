construct:
  name: GFP_RepA_polycistronic
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 25

    - cistron:
        label: RepA
        expression: high
        fused: false
        chain:
          - gene:
              id: RepA
              source: uniprot

    - terminator: rrnB_T1
