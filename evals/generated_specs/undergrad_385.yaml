construct:
  name: "polycistronic_egfp_repa_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: repa_protein
        expression: medium
        fused: false
        gene:
          id: P03819
          source: uniprot
    - terminator: rrnB_T1