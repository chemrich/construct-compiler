construct:
  name: ProteinY_with_MBP_solubility_tag
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: ProteinY
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
