construct:
  name: "tet_off_toxink_repressible"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: tetR_off
      # tetR_off = Tet-repressible promoter; active without Tet, repressed when Tet present

    - cistron:
        label: toxin
        expression: high
        gene:
          id: ToxinK
          source: uniprot

    - terminator: rrnB_T1
