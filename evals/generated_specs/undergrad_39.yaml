construct:
  name: "mammalian_mCherry_blasticidin_stable"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin

  cassette:
    - promoter: CMV

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - spacer: 30

    - cistron:
        label: blasticidin_resistance
        expression: high
        fused: false
        gene:
          id: BSD
          source: uniprot

    - terminator: rrnB_T1
