construct:
  name: "EnzymeP_yeast_high_production"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC

  cassette:
    - promoter: TDH3  # TDH3 (GPD) is one of the strongest constitutive promoters in S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EnzymeP
              source: uniprot
          - tag: Strep-II
    - terminator: CYC1_term