construct:
  name: EnzymeP_high_expression_yeast
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2micron

  cassette:
    - promoter: GAL1

    - cistron:
        label: EnzymeP
        expression: high
        chain:
          - gene:
              id: EnzymeP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: Strep-II

    - terminator: CYC1
