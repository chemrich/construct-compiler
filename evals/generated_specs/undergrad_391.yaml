construct:
  name: mammalian_dual_promoter_comparison
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: green_reporter
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA
    - spacer: 50
    - promoter: EF1_alpha
    - cistron:
        label: red_reporter
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA