construct:
  name: dual_promoter_comparison_GFP_mCherry
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV
    resistance: kanamycin

  cassette:
    - promoter: CMV
      cistron:
        label: GFP_CMV
        expression: high
        gene:
          id: mEGFP
          source: fpbase
      terminator: rrnB_T1

    - promoter: EF1_alpha
      cistron:
        label: mCherry_EF1a
        expression: high
        gene:
          id: mCherry
          source: fpbase
      terminator: rrnB_T1
