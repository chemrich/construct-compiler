construct:
  name: SecretedProteinX_mammalian
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - gene:
              id: ProteinX
              source: uniprot
          - tag: 6xHis  # C-terminal His-tag for purification

    - terminator: rrnB_T1
