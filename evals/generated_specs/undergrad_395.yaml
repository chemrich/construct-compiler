construct:
  name: "ProteinAlpha_ProteinBeta_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinAlpha
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinAlpha
              source: uniprot

    # IRES element enables cap-independent translation of downstream cistron
    - spacer: 598  # EMCV IRES is ~598 bp; allows reinitiation without 5' cap

    - cistron:
        label: ProteinBeta
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinBeta
              source: uniprot

    - terminator: rrnB_T1
