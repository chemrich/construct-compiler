construct:
  name: "my_protein_gst_flag"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: MyProtein
              source: uniprot
          - tag: FLAG
    - terminator: T7term