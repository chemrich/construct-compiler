construct:
  name: "promoter_probe_mEGFP"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: none  # No promoter included per user request to create a promoter-probe plasmid
    - cistron:
        label: reporter
        expression: medium  # This defines the inclusion of a medium-strength RBS
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1