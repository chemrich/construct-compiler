```yaml
construct:
  name: dual_fluorescent_GFP_BFP
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac
    - cistron:
        label: green_fluorescence
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: blue_fluorescence
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
```