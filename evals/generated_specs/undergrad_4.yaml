construct:
  name: dual_fluorescent_E_coli_GFP_BFP
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1

    - promoter: T7lac

    - cistron:
        label: BFP
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
