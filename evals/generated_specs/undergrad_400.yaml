construct:
  name: "SuperProtein_high_expression_constitutive"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Strong constitutive promoter for 'always on' expression in E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SuperProtein
              source: uniprot
    - terminator: rrnB_T1