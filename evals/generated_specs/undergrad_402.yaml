construct:
  name: "AwesomeEnzyme_Yeast_Secretion_Construct"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: GPD
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor  # Secretion signal for yeast export
          - gene:
              id: AwesomeEnzyme
              source: uniprot
    - terminator: CYC1