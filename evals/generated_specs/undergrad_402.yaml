construct:
  name: "yeast_AwesomeEnzyme_expression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: AwesomeEnzyme
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AwesomeEnzyme
              source: uniprot

    - terminator: rrnB_T1
