construct:
  name: "gRNA_GeneX_HEK293"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    # pX330 is optimized for U6-driven gRNA expression in mammalian cells

  cassette:
    - promoter: U6
      # U6 is a Pol III promoter for high-level gRNA expression in mammalian cells

    - cistron:
        label: gRNA
        expression: high
        chain:
          - gene:
              id: GeneX_targeting_gRNA
              source: uniprot
              # User should specify the actual 20bp target sequence for GeneX
              # or provide the gRNA design separately

    - terminator: U6_term
      # Pol III termination signal (typically TTTTTT)
