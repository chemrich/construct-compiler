construct:
  name: "bidirectional_GeneA_GeneB"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: bidirectional_CMV
      # Bidirectional promoter driving divergent transcription

    - cistron:
        label: GeneA
        expression: high
        gene:
          id: GeneA
          source: uniprot

    - spacer: 50

    - cistron:
        label: GeneB
        expression: high
        gene:
          id: GeneB
          source: uniprot

    - terminator: SV40_poly_A
