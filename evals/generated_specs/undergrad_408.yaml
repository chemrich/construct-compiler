construct:
  name: MysteryProtein_mCherry_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: MysteryProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mCherry
              source: fpbase

    - terminator: rrnB_T1
