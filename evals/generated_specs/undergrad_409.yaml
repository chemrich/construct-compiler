construct:
  name: "SensorKinase_ResponseRegulator_operon"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: tac
    
    - cistron:
        label: SensorKinase
        expression: high
        chain:
          - gene:
              id: SensorKinase
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ResponseRegulator
        expression: high
        fused: false
        chain:
          - gene:
              id: ResponseRegulator
              source: uniprot
    
    - terminator: rrnB_T1
