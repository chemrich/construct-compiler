construct:
  name: "constitutive_signaling_operon"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: J23100
    - cistron:
        label: sensor_kinase
        expression: medium
        gene:
          id: SensorKinase
          source: uniprot
    - spacer: 30
    - cistron:
        label: response_regulator
        expression: medium
        fused: false
        gene:
          id: ResponseRegulator
          source: uniprot
    - terminator: rrnB_T1