construct:
  name: "HEK293_Dox_Inducible_Awesome_Protein"
  host: HEK293
  backbone:
    resistance: neomycin # Neomycin resistance (NPTII) confers G418 selection in mammalian cells
    ori: pUC
    source: addgene
  cassette:
    - promoter: TRE_CMV # Dox-inducible promoter (Tetracycline Response Element + CMV minimal promoter)
    - cistron:
        label: target
        expression: high
        gene:
          id: Awesome_Protein
    - terminator: BGH_pA # Standard mammalian polyadenylation signal for high expression