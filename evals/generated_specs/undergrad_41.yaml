construct:
  name: doxycycline_inducible_awesome_protein
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin  # for bacterial propagation; G418 resistance in mammalian cells via neomycin gene

  cassette:
    - promoter: CMV_TetO  # CMV promoter with TetO operator sequences for doxycycline induction
    
    - cistron:
        label: awesome_protein
        expression: high
        gene:
          id: "custom_awesome_protein"  # placeholder - user would need to provide actual sequence
          source: custom
    
    - terminator: SV40_polyA