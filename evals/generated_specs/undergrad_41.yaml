construct:
  name: "HEK293_Awesome_Protein_Dox_inducible"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: rtTA
        expression: high
        chain:
          - gene:
              id: rtTA
              source: uniprot

    - terminator: WPRE

    - promoter: TRE

    - cistron:
        label: Awesome_Protein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Awesome_Protein
              source: uniprot

    - terminator: WPRE
