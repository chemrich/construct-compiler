construct:
  name: "dual_protein_mammalian_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot

    - spacer: 30

    # IRES (Internal Ribosome Entry Site) enables cap-independent translation of second protein
    - cistron:
        label: ProteinY
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinY
              source: uniprot

    - terminator: rrnB_T1
