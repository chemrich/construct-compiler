construct:
  name: "PlantProtein_chloroplast_targeting"
  host: algae

  backbone:
    catalog_vector: "pTrc99A"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: J23100

    - cistron:
        label: target
        expression: high
        chain:
          - tag: CTP  # Chloroplast Transit Peptide for chloroplast import
          - gene:
              id: PlantProtein
              source: uniprot

    - terminator: rrnB_T1
