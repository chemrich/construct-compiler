construct:
  name: "inducible_tuneprotein_dial_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # araBAD is used as a 'dial' for dose-dependent induction with L-arabinose
    - cistron:
        label: target
        expression: high
        gene:
          id: TuneProtein
          source: uniprot
    - terminator: rrnB_T1