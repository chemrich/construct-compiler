construct:
  name: "TuneProtein_inducible_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: araBAD  # arabinose-inducible; expression scales with L-arabinose concentration

    - cistron:
        label: TuneProtein
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: TuneProtein
              source: uniprot

    - terminator: rrnB_T1
