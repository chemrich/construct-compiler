construct:
  name: "mammalian_triple_gRNA_cassette"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: U6

    - cistron:
        label: gRNA1
        expression: high
        gene:
          id: gRNA1
          source: uniprot

    - spacer: 25

    - cistron:
        label: gRNA2
        expression: high
        gene:
          id: gRNA2
          source: uniprot

    - spacer: 25

    - cistron:
        label: gRNA3
        expression: high
        gene:
          id: gRNA3
          source: uniprot

    - terminator: rrnB_T1
