construct:
  name: "mammalian_SuperGene_stable_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: SuperGene
        expression: high
        chain:
          - gene:
              id: SuperGene
              source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: SV40

    - cistron:
        label: selection_marker
        expression: high
        fused: false
        chain:
          - gene:
              id: neomycin_phosphotransferase
              source: uniprot

    - terminator: rrnB_T1
