construct:
  name: MitoProtein_yeast_mitochondrial
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MitoProtein
        expression: high
        chain:
          - tag: MLS_N_terminal
          - gene:
              id: MitoProtein
              source: uniprot

    - terminator: CYC1
