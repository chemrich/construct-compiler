construct:
  name: "BindyProtein_In_Vitro_Assay_Construct"
  host: in_vitro
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - tag: FLAG
          - gene:
              id: BindyProtein
              source: uniprot
    - terminator: T7term