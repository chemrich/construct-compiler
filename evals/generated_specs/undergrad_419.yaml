construct:
  name: BindyProtein_His_FLAG_IVT
  host: in_vitro

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: FLAG
          - gene:
              id: BindyProtein
              source: uniprot

    - terminator: rrnB_T1
