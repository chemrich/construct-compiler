construct:
  name: "yeast_high_mCherry_LEU2"
  host: yeast
  backbone:
    catalog_vector: "pRS425"  # High-copy yeast shuttle vector with LEU2 selection marker
  cassette:
    - promoter: GPD  # Strong constitutive promoter for S. cerevisiae
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term