construct:
  name: mCherry_yeast_expression
  host: yeast

  backbone:
    resistance: leu2
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: mCherry
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase

    - terminator: CYC1
