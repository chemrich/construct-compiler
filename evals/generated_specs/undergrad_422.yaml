construct:
  name: "AwesomeEnzyme_Constitutive_Purification"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100 # Standard constitutive promoter for E. coli
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: AwesomeEnzyme
              source: uniprot
    - terminator: rrnB_T1