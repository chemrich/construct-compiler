construct:
  name: "e_coli_secretase_his_tag"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: secretase
        expression: high
        chain:
          - tag: 6xHis
          - signal_peptide: pelB  # E. coli outer membrane targeting
          - gene:
              id: secretase
              source: uniprot
    
    - terminator: rrnB_T1
