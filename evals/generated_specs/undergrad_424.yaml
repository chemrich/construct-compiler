construct:
  name: "dual_promoter_inducible_red_constitutive_blue"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: red_constitutive
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1

    - promoter: araBAD

    - cistron:
        label: blue_inducible
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: rrnB_T1
