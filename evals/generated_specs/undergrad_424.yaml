construct:
  name: "dual_reporter_constitutive_inducible"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100  # Constitutive promoter for E. coli
    - cistron:
        label: red_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
    - spacer: 50
    - promoter: T7lac  # IPTG-inducible promoter
    - cistron:
        label: blue_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: T7term