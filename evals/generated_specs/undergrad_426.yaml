construct:
  name: "TheraProt_secreted_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: TheraProt
        expression: high
        chain:
          - tag: signal_peptide_IgG  # N-terminal secretion signal
          - gene:
              id: TheraProt
              source: uniprot
          - tag: 6xHis  # C-terminal purification tag

    - terminator: SV40_polyA
