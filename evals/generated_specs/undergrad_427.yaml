construct:
  name: "YeastBuddy_Purification_Yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GPD  # Standard high-expression constitutive promoter for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YeastBuddy
              source: uniprot
    - terminator: CYC1  # Standard yeast terminator