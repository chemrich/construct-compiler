construct:
  name: promoter_activity_reporter
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: custom  # Custom promoter sequence to be provided

    - cistron:
        label: reporter
        expression: high
        gene:
          id: lacZ
          source: uniprot

    - terminator: rrnB_T1
