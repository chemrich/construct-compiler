construct:
  name: MyProtein_with_TEV_cleavage
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: tac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: MyProtein
              source: uniprot

    - terminator: rrnB_T1
