construct:
  name: "dual_expression_GFP_SignalX_2A"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    # 2A self-cleaving peptide enables polycistronic translation from single promoter in mammalian cells
    - spacer: 18  # T2A coding sequence is ~18 bp

    - cistron:
        label: SignalX
        expression: high
        fused: false
        gene:
          id: SignalX
          source: uniprot

    - terminator: rrnB_T1
