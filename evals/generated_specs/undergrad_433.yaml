construct:
  name: "gRNA_targetA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - gene:
        id: gRNA_targetA
        source: custom
        sequence: "GCTAGCTAGCTAGCTAGCTAGCTAGC"  # Replace with actual gRNA target sequence

    - terminator: rrnB_T1
