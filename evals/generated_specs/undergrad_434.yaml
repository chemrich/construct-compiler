construct:
  name: "MySpecialProtein_Strep_GFP"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: lacUV5

    - cistron:
        label: MySpecialProtein_fusion
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: MySpecialProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: rrnB_T1
