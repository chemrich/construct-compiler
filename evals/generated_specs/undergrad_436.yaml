construct:
  name: "SensitiveDetector_Ultra_Tight_Low_Expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: p15A # Low copy origin used to minimize basal expression/leakiness
    source: addgene
  cassette:
    - promoter: araBAD # araBAD (L-arabinose inducible) provides exceptionally tight control with minimal leakiness
    - cistron:
        label: detector
        expression: very_low
        gene:
          id: SensitiveDetector
          source: uniprot
    - terminator: rrnB_T1