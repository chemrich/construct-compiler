construct:
  name: "yeast_BioCatalyst_secretion"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: BioCatalyst
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: BioCatalyst
              source: uniprot

    - terminator: CYC1
