construct:
  name: NucleoProtein_GFP_His_NLS
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: NucleoProtein_tagged
        expression: high
        chain:
          - tag: 6xHis
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: NucleoProtein
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - tag: NLS
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: CYC1
