construct:
  name: "mammalian_dual_protein_2A"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_a
              source: uniprot

    - spacer: 21

    - cistron:
        label: 2A_self_cleaving_peptide
        expression: high
        chain:
          - gene:
              id: P2A
              source: uniprot

    - spacer: 21

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_b
              source: uniprot

    - terminator: rrnB_T1
