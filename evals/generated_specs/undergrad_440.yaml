construct:
  name: "basic_protein_X_expression"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: protein_X
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: protein_X
              source: uniprot

    - terminator: rrnB_T1
