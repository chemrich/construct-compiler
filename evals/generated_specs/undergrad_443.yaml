construct:
  name: Z_with_mScarlet_IRES
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: Z
        expression: high
        gene:
          id: Z
          source: uniprot

    # IRES enables cap-independent translation of downstream cistron
    - spacer: 27  # IRES sequence (~27 bp minimal)

    - cistron:
        label: mScarlet_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
