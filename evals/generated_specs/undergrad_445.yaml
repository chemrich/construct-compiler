construct:
  name: yeast_secreted_beta_peptide
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_beta
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: beta_peptide
              source: uniprot

    - terminator: rrnB_T1
