construct:
  name: "mammalian_ires_delta_epsilon"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: delta
        expression: medium
        gene:
          id: Delta
          source: uniprot
    - spacer: 500  # IRES element for internal ribosome entry
    - cistron:
        label: epsilon
        expression: medium
        fused: false
        gene:
          id: Epsilon
          source: uniprot
    - terminator: bGH_polyA