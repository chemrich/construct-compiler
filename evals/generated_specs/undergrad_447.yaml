construct:
  name: "Delta_Epsilon_IRES_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: Delta
        expression: high
        gene:
          id: Delta
          source: uniprot

    # IRES allows cap-independent translation of second cistron at similar levels
    - spacer: 27

    - cistron:
        label: Epsilon
        expression: high
        fused: false
        gene:
          id: Epsilon
          source: uniprot

    - terminator: rrnB_T1
