construct:
  name: "constitutive_luciferase_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: EF1_alpha

    - cistron:
        label: luciferase
        expression: high
        chain:
          - tag: HA
          - gene:
              id: Renilla_luciferase
              source: uniprot

    - terminator: rrnB_T1
