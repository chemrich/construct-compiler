```yaml
construct:
  name: "U6_gRNA_blasticidin_selection"
  host: HEK293

  backbone:
    resistance: blasticidin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        gene:
          id: sgRNA_scaffold
          source: addgene

    - promoter: EF1_alpha

    - cistron:
        label: selection_marker
        expression: medium
        chain:
          - tag: NLS
          - gene:
              id: blasticidin_resistance
              source: addgene

    - terminator: SV40_polyA
```