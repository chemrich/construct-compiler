construct:
  name: "CRISPR_guide_RNA_human"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: guide_RNA
        expression: high
        chain:
          - gene:
              id: CRISPR_guide_RNA
              source: uniprot

    - terminator: U6term

    - promoter: CMV

    - cistron:
        label: selection_marker
        expression: high
        chain:
          - gene:
              id: blasticidin_resistance
              source: uniprot

    - terminator: BBa_B0015
