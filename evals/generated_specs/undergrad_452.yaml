construct:
  name: "Protein_Iota_GS_linker_Protein_Kappa"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: Iota_Kappa_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: Protein_Iota
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 4
          - gene:
              id: Protein_Kappa
              source: uniprot
    - terminator: rrnB_T1
