construct:
  name: "Protein_Mu_FLAG"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: Mu
              source: uniprot

    - terminator: rrnB_T1
