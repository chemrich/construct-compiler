construct:
  name: "yeast_Nu_Xi_coexpression"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Nu
        expression: high
        gene:
          id: Nu
          source: uniprot

    - spacer: 30

    - cistron:
        label: Xi
        expression: high
        fused: false
        gene:
          id: Xi
          source: uniprot

    - terminator: rrnB_T1
