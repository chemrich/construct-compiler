construct:
  name: muscle_specific_protein_pi
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: MCK  # Muscle Creatine Kinase promoter - muscle-specific

    - cistron:
        label: protein_pi
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: P09493
              source: uniprot

    - terminator: rrnB_T1
