construct:
  name: "rho_sRNA_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: rho_transcript
        # Note: Rho is typically a protein-coding gene in E. coli; 
        # expressing it as a non-coding RNA is handled here by omitting 
        # translational tags and solubility markers.
        gene:
          id: rho
          source: uniprot
    - terminator: T7term