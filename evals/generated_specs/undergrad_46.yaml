construct:
  name: "Cas9_NLS_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: T2A
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: rrnB_T1
