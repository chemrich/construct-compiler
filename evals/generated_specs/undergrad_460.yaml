construct:
  name: "strong_constitutive_sfgfp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1