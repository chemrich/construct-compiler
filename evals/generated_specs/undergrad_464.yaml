construct:
  name: "bicistronic_gfp_proteinx_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: target
        expression: high
        fused: false
        gene:
          id: P00561  # Representative UniProt ID for ProteinX placeholder
          source: uniprot
    - terminator: T7term