construct:
  name: GFP_ProteinX_bicistronic
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: GFP
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mEGFP
              source: fpbase

    - spacer: 30

    - cistron:
        label: ProteinX
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinX
              source: uniprot

    - terminator: rrnB_T1
