construct:
  name: "HEK293_Dox_inducible_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTRE3G"

  cassette:
    - promoter: TRE3G  # Tet-responsive element for Dox-inducible expression

    - cistron:
        label: GFP
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase

    - terminator: SV40_polyA
