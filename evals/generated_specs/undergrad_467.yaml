construct:
  name: "E_coli_secreted_pep_high_expression"
  host: e_coli

  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_pep
        expression: high
        chain:
          - tag: pelB_signal_peptide
          - gene:
              id: SecretedPep
              source: uniprot

    - terminator: rrnB_T1
