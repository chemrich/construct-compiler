construct:
  name: TargetProt_GFP_fusion
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: target_gfp_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TargetProt
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
