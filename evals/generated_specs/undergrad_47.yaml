construct:
  name: secreted_protein_e_coli
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_protein
        expression: high
        chain:
          - tag: pelB  # periplasmic leader sequence
          - gene:
              id: secreted_protein
              source: uniprot

    - terminator: rrnB_T1
