```yaml
construct:
  name: "secreted_protein_pelB_signal"
  host: e_coli

  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: pelB  # periplasmic export signal
          - gene:
              id: "your_protein_id"  # replace with actual protein ID
              source: uniprot

    - terminator: rrnB_T1
```