construct:
  name: "LightSwitch_HEK293_CIBN_CRY2"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: CIBN
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: CIBN
              source: uniprot

    - spacer: 30

    - cistron:
        label: CRY2_LightSwitch
        expression: high
        fused: false
        chain:
          - tag: HA
          - gene:
              id: CRY2
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: LightSwitchProtein
              source: uniprot

    - terminator: rrnB_T1
