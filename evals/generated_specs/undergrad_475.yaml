construct:
  name: "CargoProt_with_TAT_CPP"
  host: e_coli_bl21

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: CargoProt_CPP
        expression: high
        chain:
          - tag: TAT_CPP
          - gene:
              id: CargoProt
              source: uniprot

    - terminator: rrnB_T1
