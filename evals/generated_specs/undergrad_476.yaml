construct:
  name: "RNA_sensor_GFP_riboswitch"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: sensor_gfp
        expression: high
        chain:
          - riboswitch:
              type: theophylline_responsive
              ligand: TargetRNA
              mechanism: translational_control
          - gene:
              id: mEGFP
              source: fpbase
    
    - terminator: rrnB_T1
