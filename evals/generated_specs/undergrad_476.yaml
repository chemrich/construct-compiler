construct:
  name: "rna_toehold_sensor_egfp"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: J23100 # Constitutive promoter typically used to drive toehold switch sensors
    - cistron:
        label: sensor_output
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015