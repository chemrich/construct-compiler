    - spacer: 30
    - cistron:
        label: enzyme_b
        expression: high
        fused: false
        gene:
          id: EnzymeB
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_c
        expression: high
        fused: false
        gene:
          id: EnzymeC
          source: uniprot
    - terminator: T7term