construct:
  name: "yeast_stress_reporter_GFP"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: HSP70  # Heat shock protein 70 promoter; activates under stress in S. cerevisiae

    - cistron:
        label: stress_reporter
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: rrnB_T1
