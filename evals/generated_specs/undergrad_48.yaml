construct:
  name: "dual_enzyme_pathway_high_expression"
  host: e_coli
  
  backbone:
    resistance: tetracycline
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: enzyme_x
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_x
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: enzyme_y
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: enzyme_y
              source: uniprot
    
    - terminator: rrnB_T1
