construct:
  name: "metabolic_pathway_enzyme_x_y"
  host: e_coli_bl21_de3
  backbone:
    resistance: tetracycline
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: enzyme_x
        expression: high
        gene:
          id: "Enzyme_X"
          source: uniprot
    - spacer: 30
    - cistron:
        label: enzyme_y
        expression: high
        fused: false
        gene:
          id: "Enzyme_Y"
          source: uniprot
    - terminator: T7term