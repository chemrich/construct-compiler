construct:
  name: "yeastzyme_low_copy_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: CEN_ARS
    source: addgene
  cassette:
    - promoter: CYC1  # Standard low-expression yeast promoter
    - cistron:
        label: enzyme
        expression: very_low
        gene:
          id: Yeastzyme
          source: uniprot
    - terminator: CYC1_term