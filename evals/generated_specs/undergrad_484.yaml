construct:
  name: dual_protein_with_reporter_HEK293
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_A
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: protein_A
              source: uniprot

    - spacer: 30

    - cistron:
        label: IRES
        expression: high
        chain:
          - gene:
              id: IRES_element
              source: uniprot

    - spacer: 30

    - cistron:
        label: protein_B
        expression: high
        chain:
          - tag: HA
          - gene:
              id: protein_B
              source: uniprot

    - spacer: 30

    - cistron:
        label: reporter
        expression: medium
        chain:
          - gene:
              id: mScarlet
              source: fpbase

    - terminator: rrnB_T1
