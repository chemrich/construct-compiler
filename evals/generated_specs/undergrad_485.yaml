construct:
  name: "constitutive_his_superprotein_expression"
  host: e_coli
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SuperProtein
    - terminator: rrnB_T1