construct:
  name: "basic_E_coli_SuperProtein_expression"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: lacUV5
    
    - cistron:
        label: SuperProtein
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: SuperProtein
              source: uniprot
    
    - terminator: rrnB_T1
