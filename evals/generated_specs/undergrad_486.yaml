construct:
  name: "mitotarget_mitochondrial_localization_yeast"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3
    - cistron:
        label: mito_target
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: MitoTarget
    - terminator: CYC1