construct:
  name: "FusionX_mammalian_His_cleavable"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: FusionX
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: FusionX
              source: uniprot

    - terminator: rrnB_T1
