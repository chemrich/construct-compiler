construct:
  name: "ProteinAlpha_ProteinBeta_dual_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinAlpha
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinAlpha
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: ProteinBeta
        expression: high
        fused: false
        chain:
          - tag: 8xHis
          - gene:
              id: ProteinBeta
              source: uniprot
    
    - terminator: rrnB_T1
