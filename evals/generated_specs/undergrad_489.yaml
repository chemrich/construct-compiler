construct:
  name: "yeast_GFP_HelperEnzyme"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GFP
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1

    - spacer: 30

    - promoter: ADH1

    - cistron:
        label: HelperEnzyme
        expression: high
        fused: false
        gene:
          id: HelperEnzyme
          source: uniprot

    - terminator: CYC1
