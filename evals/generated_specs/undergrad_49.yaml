construct:
  name: "plant_GFP_constitutive"
  host: algae

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: CaMV_35S

    - cistron:
        label: GFP
        expression: high
        gene:
          id: eGFP
          source: fpbase

    - terminator: rrnB_T1
