construct:
  name: "ChallengingP_expression_high_solubility"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: ChallengingP
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: MBP
          - cleavage_site: TEV
          - gene:
              id: ChallengingP
              source: uniprot

    - terminator: rrnB_T1

# Note: Secretion signals (e.g., pelB) are not standard in E. coli for typical soluble protein expression.
# Instead, we use MBP (maltose binding protein) as a solubility-enhancing tag, which significantly reduces aggregation.
# If periplasmic secretion is desired, add "pelB" or equivalent signal peptide before the 6xHis tag.
