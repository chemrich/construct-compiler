construct:
  name: "yeast_galactose_inducible_red_marker"
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: MysteryGene
        expression: high
        gene:
          id: MysteryGene
          source: uniprot

    - terminator: rrnB_T1

    - spacer: 30

    - promoter: ADH1

    - cistron:
        label: red_marker
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
