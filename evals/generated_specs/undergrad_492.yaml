construct:
  name: yeast_gal_inducible_mysterygene_mcherry_reporter
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: inducible_mystery_gene
        expression: high
        gene:
          id: MysteryGene
          source: uniprot
    - terminator: CYC1_term
    - spacer: 50
    - promoter: TDH3
    - cistron:
        label: constitutive_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: ADH1_term