construct:
  name: "yeast_three_enzyme_pathway"
  host: yeast

  backbone:
    resistance: kanMX  # yeast selectable marker
    ori: 2-micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: Enzyme1
        expression: high
        gene:
          id: Enzyme1
          source: uniprot

    - terminator: CYC1

    - promoter: GAL10

    - cistron:
        label: Enzyme2
        expression: high
        gene:
          id: Enzyme2
          source: uniprot

    - terminator: ADH1

    - promoter: TEF1

    - cistron:
        label: Enzyme3
        expression: high
        gene:
          id: Enzyme3
          source: uniprot

    - terminator: CYC1
