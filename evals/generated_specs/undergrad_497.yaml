construct:
  name: FusionBuddy_with_mTagBFP2
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: FusionBuddy
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: FusionBuddy
              source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    
    - terminator: rrnB_T1
