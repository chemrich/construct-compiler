construct:
  name: "yeast_secreted_SecretP_His"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: SecretP
        expression: high
        chain:
          - tag: 6xHis
          - tag: alpha-factor
          - gene:
              id: SecretP
              source: uniprot

    - terminator: CYC1
