construct:
  name: "dual_mammalian_selection_vector_neo_hygro"
  host: mammalian

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: neomycin_resistance
        expression: medium
        gene:
          id: P00552
          source: uniprot

    - spacer: 40

    - cistron:
        label: hygromycin_resistance
        expression: medium
        fused: false
        gene:
          id: P00557
          source: uniprot

    - terminator: SV40_polyA