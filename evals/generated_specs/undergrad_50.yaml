construct:
  name: "mammalian_luciferase_promoter_reporter"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: blasticidin
    ori: pUC
    source: addgene

  cassette:
    - promoter: CMV

    - cistron:
        label: luciferase
        expression: high
        gene:
          id: Renilla_luciferase
          source: uniprot

    - terminator: rrnB_T1
