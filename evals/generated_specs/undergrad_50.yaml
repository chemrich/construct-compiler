construct:
  name: "mammalian_sensitive_luciferase_reporter"
  host: HEK293
  backbone:
    resistance: blasticidin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: sensitive_reporter
        expression: high
        chain:
          - gene:
              id: P0DIW2
              source: uniprot
    - terminator: bGH_polyA