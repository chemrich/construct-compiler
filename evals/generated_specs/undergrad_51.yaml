construct:
  name: "Speedy_Degron_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: hygromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: Speedy_Degron
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: Speedy_Degron
              source: uniprot
          - degron: PEST  # C-terminal PEST degron for rapid proteasomal degradation

    - terminator: rrnB_T1
