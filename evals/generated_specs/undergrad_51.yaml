construct:
  name: "speedy_degron_mammalian_expression"
  host: HEK293
  backbone:
    resistance: hygromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: Speedy_Degron
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: ODC_degron
    - terminator: bGH_pA  # Standard mammalian terminator for use with CMV promoter