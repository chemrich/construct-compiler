construct:
  name: "mitotarget_mitochondrial_expression_puromycin"
  host: HEK293
  backbone:
    resistance: puromycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: mitochondrial_target
        expression: high
        chain:
          - tag: MTS  # Mitochondrial targeting signal zip code
          - gene:
              id: MitoTarget
              source: uniprot
    - terminator: bGH_polyA