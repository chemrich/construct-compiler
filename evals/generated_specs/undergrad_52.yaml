construct:
  name: "HEK293_MitoTarget_puromycin"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: puromycin

  cassette:
    - promoter: CMV

    - cistron:
        label: MitoTarget
        expression: high
        chain:
          - tag: MTS
          - gene:
              id: MitoTarget
              source: uniprot

    - spacer: 30

    - cistron:
        label: PuroR
        expression: high
        fused: false
        gene:
          id: puromycin_N_acetyltransferase
          source: uniprot

    - terminator: rrnB_T1
