construct:
  name: GAL4_DBD_fusion_partner_yeast_two_hybrid
  host: yeast

  backbone:
    resistance: TRP1
    ori: 2_micron
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GAL4_DBD_fusion
        expression: high
        chain:
          - gene:
              id: GAL4_DBD
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Fusion_Partner
              source: uniprot

    - terminator: CYC1
