construct:
  name: "Protein_P_GST_fusion"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - solubility_tag: GST
          - gene:
              id: Protein_P
              source: uniprot
    
    - terminator: rrnB_T1
