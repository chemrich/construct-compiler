construct:
  name: "mammalian_polycistronic_P1_P2_P3_IRES"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: neomycin

  cassette:
    - promoter: CMV

    - cistron:
        label: P1
        expression: high
        gene:
          id: P1
          source: uniprot

    - spacer: 50
      # IRES sequence will be inserted here for cap-independent translation of P2

    - cistron:
        label: P2
        expression: high
        gene:
          id: P2
          source: uniprot

    - spacer: 50
      # Second IRES sequence for cap-independent translation of P3

    - cistron:
        label: P3
        expression: high
        gene:
          id: P3
          source: uniprot

    - terminator: rrnB_T1
