construct:
  name: "CPP_drug_cargo_fusion"
  host: e_coli
  
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: cpp_cargo_fusion
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: TAT_CPP
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: cargo_protein
              source: uniprot
    
    - terminator: rrnB_T1
