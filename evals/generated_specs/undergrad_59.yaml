construct:
  name: bacterial_biosensor_gfp
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: sensor_receptor
        expression: high
        gene:
          id: luxR
          source: uniprot
    
    - spacer: 30
    
    - cistron:
        label: gfp_reporter
        expression: high
        fused: false
        gene:
          id: mGFP
          source: fpbase
    
    - terminator: rrnB_T1
