construct:
  name: "bacterial_ligand_biosensor"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: "sensor_receptor"
        expression: medium
        gene:
          id: "araC"
          source: uniprot
    - spacer: 30
    - cistron:
        label: "reporter"
        expression: high
        fused: false
        gene:
          id: "mEGFP"
          source: fpbase
    - terminator: rrnB_T1