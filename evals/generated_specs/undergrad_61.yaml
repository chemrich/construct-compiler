construct:
  name: yeast_inducible_gfp_test
  host: yeast

  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: gfp
        expression: high
        gene:
          id: sfGFP
          source: fpbase

    - terminator: CYC1
