construct:
  name: yeast_galactose_inducible_mEGFP
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Galactose-inducible yeast promoter
    - cistron:
        label: green_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1  # Standard yeast transcription terminator