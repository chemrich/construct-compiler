construct:
  name: "mammalian_Cas9_sgRNA_mCherry"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin
    ori: pUC

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - spacer: 30

    - promoter: U6

    - cistron:
        label: sgRNA
        expression: high
        gene:
          id: sgRNA_generic
          source: uniprot

    - spacer: 30

    - promoter: EF1_alpha

    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: rrnB_T1
