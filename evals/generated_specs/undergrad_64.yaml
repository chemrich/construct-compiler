construct:
  name: GeneA_GeneB_yeast_dual_expression
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: GeneA
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: GeneA
              source: uniprot

    - terminator: CYC1

    - promoter: GAL1

    - cistron:
        label: GeneB
        expression: high
        chain:
          - gene:
              id: GeneB
              source: uniprot

    - terminator: CYC1
