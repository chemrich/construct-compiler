construct:
  name: "ProteinV_dim_GFP_yeast"
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: ProteinV_GFP
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: ProteinV
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
