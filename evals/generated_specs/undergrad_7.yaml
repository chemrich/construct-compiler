```yaml
construct:
  name: bicistronic_IRES_expression
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: alpha_protein
        expression: high
        gene:
          id: P04637  # example protein ID
          source: uniprot

    - spacer: 500  # IRES element (~500bp for EMCV IRES)

    - cistron:
        label: beta_protein
        expression: medium  # IRES-dependent translation is typically lower
        fused: false  # independent translation via IRES
        gene:
          id: P53350  # example protein ID  
          source: uniprot

    - terminator: rrnB_T1
```