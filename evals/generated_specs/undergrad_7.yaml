construct:
  name: dual_protein_IRES_expression
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: protein_alpha
        expression: high
        gene:
          id: EGFP
          source: fpbase

    # IRES (Internal Ribosome Entry Site) enables cap-independent translation of second cistron
    - spacer: 589  # EMCV IRES sequence length (bp)

    - cistron:
        label: protein_beta
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1
