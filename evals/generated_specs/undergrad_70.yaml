construct:
  name: yeast_dCas9_Mxi1_repressor
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: dCas9_repressor
        expression: high
        chain:
          - gene:
              id: dCas9
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: Mxi1
              source: uniprot

    - terminator: rrnB_T1
