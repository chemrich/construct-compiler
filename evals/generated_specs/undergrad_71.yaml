construct:
  name: "ProteinS_IRES_ProteinR_GFP"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinS
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: ProteinS
              source: uniprot

    # IRES element represented as a spacer with comment
    - spacer: 600  # IRES_EMCV or similar internal ribosome entry site

    - cistron:
        label: ProteinR_GFP
        expression: high
        chain:
          - gene:
              id: ProteinR
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase

    - terminator: rrnB_T1
