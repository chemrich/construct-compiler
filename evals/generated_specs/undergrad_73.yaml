construct:
  name: stress_responsive_GFP_yeast
  host: yeast

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: HSP82  # Heat shock protein 82 promoter, stress-responsive in yeast

    - cistron:
        label: GFP
        expression: high
        gene:
          id: GFP
          source: fpbase

    - terminator: rrnB_T1
