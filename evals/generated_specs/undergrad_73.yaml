construct:
  name: "yeast_stress_responsive_reporter"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: HSP12  # Stress-responsive promoter in S. cerevisiae
    - cistron:
        label: reporter
        expression: medium
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1_term