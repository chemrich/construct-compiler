construct:
  name: ProteinO_GFP_strong_RBS_test
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: ProteinO_GFP
        expression: high
        chain:
          - gene:
              id: ProteinO
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - gene:
              id: sfGFP
              source: fpbase
    
    - terminator: rrnB_T1
