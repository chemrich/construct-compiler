construct:
  name: "ProteinM_secreted_His_mammalian"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin

  cassette:
    - promoter: CMV

    - cistron:
        label: ProteinM_secreted
        expression: high
        chain:
          - tag: signal_peptide_mammalian
          - gene:
              id: ProteinM
              source: uniprot
              codon_optimize: true
          - cleavage_site: TEV
          - tag: 6xHis

    - terminator: polyA
