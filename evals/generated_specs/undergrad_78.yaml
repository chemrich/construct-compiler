construct:
  name: "GeneL_GeneK_dual_expression"
  host: e_coli_bl21
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: GeneL
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: GeneL
              source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: tac
    
    - cistron:
        label: GeneK
        expression: high
        chain:
          - gene:
              id: GeneK
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 1
          - solubility_tag: GFP
    
    - terminator: rrnB_T1
