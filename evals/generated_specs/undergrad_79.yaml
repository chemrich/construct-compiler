construct:
  name: "yeast_protein_j_cterm_flag"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GPD  # Strong constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: ProteinJ
              source: uniprot
          - linker:
              type: short_GS
              repeats: 1
          - tag: FLAG
    - terminator: CYC1_term # Standard yeast terminator