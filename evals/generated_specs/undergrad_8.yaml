construct:
  name: "secreted_protein_export"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: pelB  # pelB signal peptide for periplasmic export
          - gene:
              id: "Secret_Protein"  # Replace with actual protein ID
              source: uniprot       # Or appropriate source

    - terminator: rrnB_T1