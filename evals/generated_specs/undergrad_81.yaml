construct:
  name: "yeast_gfp_expression"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD
    - cistron:
        label: glow_reporter
        expression: high
        gene:
          id: GFP
          source: fpbase
    - terminator: CYC1