construct:
  name: "protein_a_protein_b_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinB
              source: uniprot
    - terminator: rrnB_T1