construct:
  name: ProteinA_linker_ProteinB
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - tag: 6xHis
          - cleavage_site: TEV
          - gene:
              id: ProteinA
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: ProteinB
              source: uniprot

    - terminator: rrnB_T1
