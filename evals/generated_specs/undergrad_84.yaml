construct:
  name: "CoolEnzyme_Cterm_FLAG"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: CoolEnzyme
        expression: high
        chain:
          - gene:
              id: CoolEnzyme
              source: uniprot
          - tag: FLAG  # C-terminal FLAG tag

    - terminator: rrnB_T1
