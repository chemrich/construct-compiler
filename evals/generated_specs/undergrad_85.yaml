construct:
  name: "dual_expression_EnzymeX_HelperProteinY"
  host: e_coli_bl21

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: EnzymeX
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EnzymeX
              source: uniprot

    - spacer: 30

    - cistron:
        label: HelperProteinY
        expression: high
        fused: false
        chain:
          - tag: 6xHis
          - gene:
              id: HelperProteinY
              source: uniprot

    - terminator: rrnB_T1
