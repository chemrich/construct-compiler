construct:
  name: "SecretedProtein_Yeast_Export"
  host: yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: target
        expression: high
        chain:
          - tag: alpha_factor
          - gene:
              id: SecretedProtein
              source: uniprot
    - terminator: CYC1_term