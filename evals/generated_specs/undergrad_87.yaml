construct:
  name: "SecretedProtein_yeast"
  host: yeast

  backbone:
    catalog_vector: "pYES2"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: GAL1

    - cistron:
        label: secreted_target
        expression: high
        chain:
          - signal_peptide: alpha_factor
          - gene:
              id: SecretedProtein
              source: uniprot

    - terminator: CYC1
