construct:
  name: dual_color_mammalian_reporter
  host: HEK293

  backbone:
    catalog_vector: pTwist CMV

  cassette:
    - promoter: CMV

    - cistron:
        label: red_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase

    - terminator: SV40_polyA

    - promoter: EF1_alpha

    - cistron:
        label: blue_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase

    - terminator: SV40_polyA
