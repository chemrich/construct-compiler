construct:
  name: dual_reporter_mammalian_hek293
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: red_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA
    - promoter: EF1_alpha
    - cistron:
        label: blue_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: SV40_polyA