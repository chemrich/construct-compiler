construct:
  name: "CRISPR_sgRNA_expression"
  host: HEK293

  backbone:
    catalog_vector: "pX330"
    resistance: ampicillin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: U6

    - cistron:
        label: sgRNA
        expression: high
        chain:
          - gene:
              id: sgRNA
              source: custom
              sequence: "GGTGAGTGAGTGTGTGCGTG"

    - terminator: U6_terminator
