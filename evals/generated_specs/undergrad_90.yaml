construct:
  name: SmallPeptide_periplasmic_Strep
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: T7lac
    
    - cistron:
        label: target
        expression: high
        chain:
          - signal_peptide: pelB  # pelB signal sequence for periplasmic targeting
          - tag: Strep-II
          - gene:
              id: SmallPeptide
              source: uniprot
    
    - terminator: rrnB_T1
