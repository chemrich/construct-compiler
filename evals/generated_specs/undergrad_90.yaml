construct:
  name: "small_peptide_periplasmic_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_peptide
        expression: high
        chain:
          - tag: PelB  # Signal peptide for periplasmic translocation
          - tag: Strep-II
          - gene:
              id: SmallPeptide
              source: uniprot
    - terminator: T7term