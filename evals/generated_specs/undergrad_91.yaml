construct:
  name: "yeast_two_hybrid_bait_fusion"
  host: yeast
  backbone:
    resistance: ampicillin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: ADH1
    - cistron:
        label: bait
        expression: medium
        chain:
          - tag: GAL4_BD
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: MyBaitProtein
    - terminator: CYC1