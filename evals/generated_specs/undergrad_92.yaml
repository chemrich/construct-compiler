construct:
  name: "constitutive_high_expression_system"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: J23100  # Strongest constitutive Anderson promoter for maximum expression
    - cistron:
        label: constitutive_gene
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015