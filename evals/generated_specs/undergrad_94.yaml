construct:
  name: "mammalian_CRISPR_Cas9_TargetGeneX"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"
    resistance: ampicillin

  cassette:
    - promoter: CMV

    - cistron:
        label: Cas9
        expression: high
        chain:
          - tag: NLS
          - gene:
              id: SpCas9
              source: uniprot

    - terminator: SV40

    - promoter: U6

    - guide_rna:
        label: gRNA_TargetGeneX
        target_gene: TargetGeneX
        pam: NGG

    - terminator: U6term
