construct:
  name: "tightly_inducible_amp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # araBAD (L-arabinose inducible) provides exceptionally tight control with minimal basal expression for toxic proteins
    - cistron:
        label: antimicrobial_peptide
        expression: very_low
        gene:
          id: AMP
    - terminator: rrnB_T1