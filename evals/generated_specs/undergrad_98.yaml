construct:
  name: "dual_inducible_ProteinA_ProteinB"
  host: e_coli
  
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  
  cassette:
    - promoter: araBAD
    
    - cistron:
        label: ProteinA
        expression: high
        gene:
          id: ProteinA
          source: uniprot
    
    - terminator: rrnB_T1
    
    - promoter: T7lac
    
    - cistron:
        label: ProteinB
        expression: high
        gene:
          id: ProteinB
          source: uniprot
    
    - terminator: rrnB_T1
