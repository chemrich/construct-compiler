construct:
  name: "lacZ_yeast_pTet_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: pTet  # Tetracycline-responsive promoter requested for yeast expression
    - cistron:
        label: lacZ_reporter
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator used for S. cerevisiae constructs
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21