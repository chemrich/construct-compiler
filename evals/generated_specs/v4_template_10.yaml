construct:
  name: "sfGFP_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac  # Substituted CMV for tac as CMV is a mammalian promoter and not functional in E. coli K-12.
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21