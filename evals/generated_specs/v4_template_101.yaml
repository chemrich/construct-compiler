construct:
  name: "HEK293_BFP_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Substituted lac promoter with CMV; lac is a bacterial promoter and non-functional in HEK293.
    - cistron:
        label: bfp_reporter
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21