construct:
  name: "hek293_bfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # User requested lac promoter, which is bacterial; substituted with CMV for HEK293 expression.
    - cistron:
        label: BFP_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: bGH_PA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21