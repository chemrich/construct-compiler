construct:
  name: "bfp_ampr_polycistronic_yeast"
  host: s_cerevisiae  # Substituted yeast host for the provided eukaryotic requirement
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted common yeast promoter TEF1 for yeast-specific expression
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: ampicillin_resistance
        expression: medium
        fused: false  # Independent translation for the second cistron
        gene:
          id: P00810
          source: uniprot
    - terminator: CYC1  # Substituted CYC1 yeast terminator for proper yeast mRNA processing
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21