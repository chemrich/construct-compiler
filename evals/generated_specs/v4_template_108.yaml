construct:
  name: "lacZ_C_FLAG_expression"
  host: e_coli  # e_coli_k12 is not in schema; using e_coli as the base host
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac  # Default for e_coli; requires T7 polymerase in the host
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21