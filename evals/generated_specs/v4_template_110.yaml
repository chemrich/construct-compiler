construct:
  name: "polycistronic_mcherry_yfp_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: YFP_reporter
        expression: high
        fused: false
        gene:
          id: YFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21