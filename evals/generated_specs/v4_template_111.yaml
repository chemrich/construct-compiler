construct:
  name: "polycistronic_bfp_lacz_yeast_surrogate"
  # S. cerevisiae is not directly supported in the schema; substituting with e_coli to support polycistronic spacer architecture
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: bfp_expression
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacz_expression
        expression: medium
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21