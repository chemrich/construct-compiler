construct:
  name: "yeast_bfp_lacz_polycistronic"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Selected as a eukaryotic-compatible promoter from the allowed list
    - cistron:
        label: bfp_reporter
        expression: medium
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacz_effector
        expression: medium
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21