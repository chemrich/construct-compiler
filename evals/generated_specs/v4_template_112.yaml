construct:
  name: "egfp_c_terminal_gst_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: GST
    - terminator: bGH_polyA  # Standard polyadenylation signal for mammalian expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21