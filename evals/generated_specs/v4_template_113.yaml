construct:
  name: "rfp_flag_fusion_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is used as a functional ortholog for yeast TEF1
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: FLAG
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21