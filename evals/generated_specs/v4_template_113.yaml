construct:
  name: "RFP_FLAG_yeast_fusion"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Using TEF1 as a standard constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: FLAG
    - terminator: CYC1  # Using CYC1 as a standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21