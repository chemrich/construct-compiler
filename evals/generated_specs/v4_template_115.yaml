construct:
  name: hek293_gfp_yfp_polycistronic
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gfp_target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_reporter
        expression: high
        fused: false
        gene:
          id: mVenus
          source: fpbase
    - terminator: hGH_polyA  # hGH_polyA used as appropriate terminator for mammalian HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21