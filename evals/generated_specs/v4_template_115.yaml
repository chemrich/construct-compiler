construct:
  name: "hek293_gfp_yfp_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_cistron
        expression: high
        fused: false # Induces independent translation via a separate Kozak/RBS
        gene:
          id: mEYFP
          source: fpbase
    - terminator: BBa_B0015 # Using BBa_B0015 as a placeholder; in mammalian systems, a polyA signal is typically used.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21