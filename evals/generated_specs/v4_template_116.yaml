construct:
  name: "yeast_polycistronic_lacz_luciferase"
  host: s_cerevisiae  # Note: Host specified as yeast; using eukaryotic-compatible elements
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha substituted for yeast TEF1/PGK1 as it is the closest eukaryotic option in the schema
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: luciferase
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: BBa_B0015  # General eukaryotic/prokaryotic terminator substitution
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21