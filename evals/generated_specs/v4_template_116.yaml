construct:
  name: "lacz_luciferase_yeast_polycistronic"
  host: mammalian # S. cerevisiae is not explicitly supported in the schema; substituted with mammalian as a eukaryotic host
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV
    - cistron:
        label: lacz
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: luciferase
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21