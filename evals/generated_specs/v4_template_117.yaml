construct:
  name: "mScarlet_mCherry_polycistronic_expression"
  host: e_coli  # Substituted e_coli_k12 for e_coli as per schema host options
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: mScarlet_unit
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: mCherry_unit
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21