construct:
  name: "egfp_mcherry_polycistronic_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - spacer: 30 # For mammalian polycistronic expression, this spacer should ideally contain an IRES element
    - cistron:
        label: mcherry_expression
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21