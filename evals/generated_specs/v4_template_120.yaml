construct:
  name: "HEK293_EGFP_mCherry_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: green_fluorescence
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: red_fluorescence
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21