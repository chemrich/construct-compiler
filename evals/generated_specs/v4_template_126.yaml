construct:
  name: "HEK293_EGFP_Expression_Plasmid"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # SV40 promoter not in supported list; substituting with CMV for high-level mammalian expression
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BGH_pA # Standard mammalian polyadenylation signal for HEK293 expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21