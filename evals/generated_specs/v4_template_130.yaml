construct:
  name: "mCherry_6xHis_fusion_yeast"
  host: s_cerevisiae  # S. cerevisiae specified; treated as eukaryotic host
  backbone:
    resistance: kanamycin  # G418 selection in yeast
    ori: 2_micron         # High-copy yeast origin
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Using EF1_alpha as a eukaryotic homolog for the yeast TEF1 promoter
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: 6xHis
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21