construct:
  name: "RFP_Myc_HEK293_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: RFP_Myc
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: Myc
    - terminator: BGH_polyA  # Substituted mammalian terminator for HEK293 compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21