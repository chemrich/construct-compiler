construct:
  name: "HEK293_YFP_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # tac is a prokaryotic promoter; substituted with CMV for expression in HEK293 cells.
    - cistron:
        label: reporter
        expression: high
        gene:
          id: YFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21