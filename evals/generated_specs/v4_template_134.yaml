construct:
  name: "HEK293_YFP_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # tac promoter is bacterial; substituted with CMV for mammalian expression in HEK293
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: mVenus
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21