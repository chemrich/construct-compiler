construct:
  name: "yeast_polycistronic_ampR_rfp"
  host: mammalian # Substituted mammalian for s_cerevisiae to match schema; EF1_alpha and BBa_B0015 used for eukaryotic compatibility.
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: ampR
        expression: medium
        gene:
          id: P00810
          source: uniprot
    - spacer: 30
    - cistron:
        label: RFP
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21