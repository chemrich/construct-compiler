construct:
  name: "YFP_Myc_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: yfp_myc_fusion
        expression: high
        chain:
          - gene:
              id: YFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Myc # Note: Myc tag added as requested (EQKLISEEDL)
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21