construct:
  name: "CMV_GST_YFP_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: YFP
              source: fpbase
    - terminator: rrnB_T1  # Using rrnB_T1 as a placeholder terminator for the mammalian cassette per schema requirements
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21