construct:
  name: "egfp_gfp_polycistronic_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_cistron
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: gfp_cistron
        expression: medium
        fused: false
        gene:
          id: GFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21