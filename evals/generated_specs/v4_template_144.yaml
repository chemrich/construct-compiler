construct:
  name: "mammalian_egfp_yfp_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_unit
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - spacer: 30 # Note: In mammalian systems, polycistronic expression usually requires an IRES or 2A peptide, but using spacer and fused: false as per schema requirements.
    - cistron:
        label: yfp_unit
        expression: high
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21