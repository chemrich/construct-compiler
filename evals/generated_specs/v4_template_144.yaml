construct:
  name: "egfp_eyfp_polycistronic_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: eyfp_expression
        expression: high
        fused: false # Uses independent translation initiation
        gene:
          id: EYFP
          source: fpbase
    - terminator: bGH_polyA # Standard mammalian polyadenylation signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21