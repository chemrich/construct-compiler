construct:
  name: "mammalian_polycistronic_gfp_ampr"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: gfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30 # Mammalian polycistronic designs typically require an IRES or 2A peptide for downstream cistron translation; implemented here with spacer and fused:false per spec.
    - cistron:
        label: ampr_expression
        expression: low
        fused: false
        gene:
          id: P62593
          source: uniprot
    - terminator: bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21