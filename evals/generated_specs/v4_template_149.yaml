construct:
  name: "yfp_gst_yeast_expression"
  host: s_cerevisiae # Specified yeast host; using yeast-compatible substitutions for elements
  backbone:
    resistance: kanamycin # Default per Rule 9
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituting TEF1 with schema-supported EF1_alpha (yeast homolog)
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: EYFP
              source: fpbase
    - terminator: BBa_B0015 # Universal terminator substitution for yeast compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21