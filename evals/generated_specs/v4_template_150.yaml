construct:
  name: luciferase_ha_hek293
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase_expression
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P08659
              source: uniprot
    - terminator: BBa_B0015 # Bacterial terminator selected from schema; assume polyA substitution for mammalian host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21