construct:
  name: "YFP_FLAG_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted TEF1 for yeast compatibility as it is a common constitutive promoter in S. cerevisiae
    - cistron:
        label: YFP_expression
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: YFP
              source: fpbase
    - terminator: CYC1_term  # Substituted CYC1_term for yeast compatibility as it is a standard terminator for S. cerevisiae
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21