construct:
  name: "YFP_N_terminal_Flag_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1 # S. cerevisiae constitutive promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: YFP
              source: fpbase
    - terminator: CYC1_term # S. cerevisiae terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21