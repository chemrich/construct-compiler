construct:
  name: "polycistronic_ampR_mScarlet"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac  # Defaulting to T7lac per Rule 8, though e_coli_k12 typically requires T7 polymerase.
    - cistron:
        label: ampR
        expression: medium
        gene:
          id: P00810
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21