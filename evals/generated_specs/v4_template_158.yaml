construct:
  name: "ampR_HA_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac  # Substituted T7lac for tac as e_coli_k12 lacks T7 RNA polymerase
    - cistron:
        label: ampR_HA
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21