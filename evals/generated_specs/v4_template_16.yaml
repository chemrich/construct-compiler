construct:
  name: "rfp_bfp_polycistronic_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: red_reporter
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: blue_reporter
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21