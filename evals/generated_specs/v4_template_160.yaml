construct:
  name: egfp_expression_e_coli
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac # CMV is a mammalian promoter and will not function in E. coli; substituted with T7lac and upgraded host to BL21(DE3) for compatibility.
    - cistron:
        label: egfp_target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21