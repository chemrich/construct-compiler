construct:
  name: "egfp_expression_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: T7lac # User requested CMV; substituted with T7lac for E. coli compatibility as CMV is a mammalian promoter.
    - cistron:
        label: target
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21