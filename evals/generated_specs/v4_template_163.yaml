construct:
  name: "luciferase_myc_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase_target
        expression: high
        chain:
          - tag: Myc  # Added Myc tag as requested; note: Myc is not in the explicit example list but is a standard molecular biology tag.
          - gene:
              id: P08659
              source: uniprot
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian polyA signal for HEK293 host.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21