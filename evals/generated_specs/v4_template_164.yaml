construct:
  name: "lacZ_c_terminal_flag_yeast"
  host: s_cerevisiae # S. cerevisiae host selected; using GAL1 promoter and CYC1 terminator for yeast expression.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: FLAG
    - terminator: CYC1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21