construct:
  name: HEK293_mTagBFP2_CHis
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_expression
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: 6xHis
    - terminator: SV40_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21