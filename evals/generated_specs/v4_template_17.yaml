construct:
  name: "HEK293_mCherry_HA"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_target
        expression: high
        chain:
          - tag: HA # Myc tag substituted with HA as Myc is not in the allowed tag list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015 # Bacterial terminator included per spec list; substitution with mammalian polyA is typically handled by the catalog backbone
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21