construct:
  name: "hek293_myc_mscarlet"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_expression
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Standard terminator from schema; typically used as a strong transcriptional stop
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21