construct:
  name: "ampR_c_myc_expression"
  host: e_coli_bl21_de3 # Selected to support the default T7lac promoter
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P0AD64 # UniProt ID for TEM-1 beta-lactamase (ampR)
              source: uniprot
          - tag: Myc
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21