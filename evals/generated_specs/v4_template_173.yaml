construct:
  name: "hek293_yfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # lac promoter is prokaryotic; substituted with CMV for mammalian HEK293 expression
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: YFP
          source: fpbase
    - terminator: SV40_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21