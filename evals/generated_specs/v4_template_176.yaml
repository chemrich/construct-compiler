construct:
  name: "yfp_lac_expression"
  host: e_coli_bl21 # Substituted S. cerevisiae for e_coli_bl21 as S. cerevisiae is not a supported host and the lac promoter is specific to E. coli.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: lacUV5
    - cistron:
        label: target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21