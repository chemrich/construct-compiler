construct:
  name: "SUMO_mYFP_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mYFP
              source: fpbase
    - terminator: BBa_B0015 # Note: Using BBa_B0015 per the provided schema list; in a typical mammalian design, a polyA signal (e.g., bGH_polyA) would be used.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21