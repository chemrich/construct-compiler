construct:
  name: "SV40_YFP_His_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # User requested SV40; substituted CMV for mammalian compatibility as SV40 is not in the standard spec list
    - cistron:
        label: yfp_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EYFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21