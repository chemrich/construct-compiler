construct:
  name: "mTagBFP2_tac_expression_construct"
  # S. cerevisiae is not a supported host and tac is a bacterial promoter; substituted with e_coli.
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: target
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21