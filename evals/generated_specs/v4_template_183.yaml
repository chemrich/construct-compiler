construct:
  name: "hek293_gst_lacz_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacz_target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: P00722
              source: uniprot
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21