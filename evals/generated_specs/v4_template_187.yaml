construct:
  name: "hek293_sumo_megfp_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: sumo_egfp
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1  # Using rrnB_T1 as per schema defaults; bGH_PA would be standard for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21