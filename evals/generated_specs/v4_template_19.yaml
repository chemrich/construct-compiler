construct:
  name: "rfp_sumo_fusion"
  host: e_coli  # User requested e_coli_k12; mapping to e_coli. Note: T7lac promoter requires DE3 lysogen or T7 polymerase.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: rfp_sumo
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21