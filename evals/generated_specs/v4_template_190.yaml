construct:
  name: "pBAD_ampR_Myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: target
        expression: medium
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: HA  # Myc tag substituted with HA as Myc is not in the explicitly allowed list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21