construct:
  name: "rfp_ha_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_ha_target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: HA
    - terminator: bGH_pA  # Substituted bacterial terminator for mammalian-compatible BGH polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21