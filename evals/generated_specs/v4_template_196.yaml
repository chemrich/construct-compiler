construct:
  name: "mammalian_ampR_luciferase_polycistronic"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: beta_lactamase
        expression: medium
        gene:
          id: P0AD64
          source: uniprot
    - spacer: 30  # Note: Standard mammalian polycistronic expression typically requires an IRES or 2A peptide; using spacer as per tool schema.
    - cistron:
        label: luciferase
        expression: high
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21