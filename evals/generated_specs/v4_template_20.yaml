construct:
  name: "mScarlet_strep_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac # Substituted T7lac with tac for E. coli K12 compatibility (lacks T7 polymerase)
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21