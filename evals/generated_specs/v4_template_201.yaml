construct:
  name: "ampR_expression_tac"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # trc is not in the schema, substituted with tac (functionally equivalent hybrid promoter)
    - cistron:
        label: beta_lactamase
        expression: high
        gene:
          id: P62593
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21