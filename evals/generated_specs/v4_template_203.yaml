construct:
  name: "hek293_yfp_mscarlet_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_yfp
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: reporter_mscarlet
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_polyA  # Substituted mammalian polyA signal for bacterial terminator to suit HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21