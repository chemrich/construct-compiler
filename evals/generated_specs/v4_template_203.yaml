construct:
  name: "hek293_polycistronic_yfp_mscarlet"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_reporter
        expression: high
        fused: false # Independently translated
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_PA # Standard mammalian terminator for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21