construct:
  name: "luciferase_expression_ecoli"
  host: e_coli  # Defaulting to e_coli as e_coli_k12 is not in schema; T7lac used per default rules
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: luciferase_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P08659
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21