construct:
  name: "luciferase_expression_pLac"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: lacUV5  # Substituted lacUV5 for pLac as it is the closest schema-valid lac-based promoter
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21