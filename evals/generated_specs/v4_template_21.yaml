construct:
  name: "rfp_c_terminal_mbp_mammalian_expression"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP

    - terminator: BBa_B0015 # BBa_B0015 used as a placeholder for mammalian polyA signal per available schema options

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21