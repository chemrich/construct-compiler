construct:
  name: "lacZ_ampR_polycistronic"
  host: e_coli  # Substituted e_coli_k12 with e_coli to match supported schema values
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_primary
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - spacer: 30
    - cistron:
        label: ampR_secondary
        expression: medium
        fused: false
        gene:
          id: ampR
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21