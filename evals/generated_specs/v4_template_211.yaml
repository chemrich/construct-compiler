construct:
  name: "polycistronic_lacz_ampr_expression"
  host: e_coli  # Defaulting to e_coli as e_coli_k12 is a subset
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Default for e_coli per rule 8; requires T7 polymerase expression in host
    - cistron:
        label: lacZ
        expression: medium
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: ampR
        expression: medium
        fused: false
        gene:
          id: P00810
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21