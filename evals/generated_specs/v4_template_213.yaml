construct:
  name: "mammalian_polycistronic_egfp_rfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30 # For mammalian hosts, independent translation from a single mRNA typically requires an IRES or 2A peptide; spacer used per schema instructions
    - cistron:
        label: rfp_reporter
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21