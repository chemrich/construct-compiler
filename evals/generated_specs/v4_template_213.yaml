construct:
  name: "mammalian_egfp_rfp_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_reporter
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: rfp_reporter
        expression: high
        fused: false
        chain:
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Using provided schema example; in mammalian this acts as a placeholder for a polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21