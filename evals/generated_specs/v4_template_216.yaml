construct:
  name: "sv40_mscarlet_6xhis"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # SV40 requested; substituted with CMV as SV40 is not in the listed compatible promoters
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21