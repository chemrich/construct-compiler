construct:
  name: "mScarlet_6xHis_SV40_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # SV40 was requested but is not in the standard list; substituting with CMV for mammalian expression.
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21