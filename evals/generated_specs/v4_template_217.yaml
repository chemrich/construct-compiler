construct:
  name: mCherry_C_terminal_SUMO_yeast
  host: s_cerevisiae  # S. cerevisiae requested; utilizing yeast-specific promoter and terminator
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Strong constitutive yeast promoter (GPD)
    - cistron:
        label: mCherry_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: SUMO
    - terminator: CYC1_term  # Common yeast transcription terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21