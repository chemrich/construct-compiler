construct:
  name: "egfp_sumo_expression_e_coli"
  host: e_coli  # Defaulting to e_coli for e_coli_k12 strain request

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac  # Default for E. coli per instructions
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21