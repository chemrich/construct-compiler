construct:
  name: "lacZ_lacUV5_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # lac promoter substituted with lacUV5 for schema compatibility and improved expression
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21