construct:
  name: "egfp_c_terminal_mbp_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - solubility_tag: MBP
    - terminator: BBa_B0015  # Selected from schema list; note that BBa_B0015 is often used as a universal terminator.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21