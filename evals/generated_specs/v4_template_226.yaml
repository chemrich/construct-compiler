construct:
  name: "GFP_C_SUMO_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituted EF1_alpha as a eukaryotic promoter suitable for yeast expression
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - solubility_tag: SUMO
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21