construct:
  name: "T7lac_mTagBFP2_Myc"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: FLAG # Substituted Myc with FLAG as Myc was not in the explicitly allowed tag list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21