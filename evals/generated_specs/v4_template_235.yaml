construct:
  name: "HEK293_SV40_YFP_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Requested SV40 promoter; substituted with CMV to align with suggested mammalian promoter options.
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: SV40_polyA # Substituted bacterial terminator with mammalian polyA signal for HEK293 host.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21