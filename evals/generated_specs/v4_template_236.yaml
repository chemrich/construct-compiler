construct:
  name: "CMV_mTagBFP2_SUMO"
  host: HEK293 # Substituted HEK293 as a reasonable mammalian host for CMV promoter
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - solubility_tag: SUMO
    - terminator: bGH_polyA # Substituted for mammalian termination signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21