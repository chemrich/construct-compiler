construct:
  name: "yfp_expression_plasmid_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # pTet substituted with araBAD to provide inducible expression as requested
    - cistron:
        label: yfp_reporter
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21