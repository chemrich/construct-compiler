construct:
  name: "ha_ampr_expression"
  host: e_coli # e_coli_k12 mapped to e_coli per schema
  backbone:
    resistance: kanamycin # Using kanamycin for selection since the target gene is ampR
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P0AD64 # UniProt ID for TEM-1 beta-lactamase (ampR)
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21