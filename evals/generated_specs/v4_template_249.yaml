construct:
  name: "mCherry_lacZ_polycistronic_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 50 # Note: In mammalian systems, the spacer should ideally contain an IRES or 2A peptide for polycistronic expression.
    - cistron:
        label: lacZ_enzyme
        expression: medium
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: bGH_pA # Substituted bacterial terminator for mammalian polyadenylation signal.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21