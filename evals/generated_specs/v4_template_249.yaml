construct:
  name: "mammalian_polycistronic_mcherry_lacz"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30 # Note: In mammalian systems, independent translation typically requires an IRES or 2A peptide; using spacer as per schema
    - cistron:
        label: lacZ_reporter
        expression: high
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21