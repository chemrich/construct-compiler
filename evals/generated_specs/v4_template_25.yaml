construct:
  name: ampR_HA_fusion
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_HA
        expression: high
        chain:
          - gene:
              id: ampR
              source: uniprot
          - tag: HA
    - terminator: bGH_PA  # Using bGH_PA as it is the appropriate terminator for HEK293/pTwist CMV
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21