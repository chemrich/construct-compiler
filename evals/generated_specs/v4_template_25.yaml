construct:
  name: "ampR_HA_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015 # Note: BBa_B0015 is a bacterial terminator; for mammalian expression, the tool will typically substitute a polyA signal.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21