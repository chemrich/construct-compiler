construct:
  name: "ampR_Strep_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_Strep_fusion
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: P00810
              source: uniprot
    - terminator: BBa_B0015 # Bacterial terminator used as a place-holder per schema options; CMV vectors typically provide endogenous polyA signals.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21