construct:
  name: "bl21_myc_megfp_expression"
  host: e_coli_bl21_de3 # Using DE3 strain to support the T7lac promoter required by pET-28b(+)
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21