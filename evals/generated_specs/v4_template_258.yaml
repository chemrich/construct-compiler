construct:
  name: "polycistronic_bfp_yfp_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_expression
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_expression
        expression: high
        fused: false
        gene:
          id: mVenus
          source: fpbase
    - terminator: bgh_pA  # Substituted for mammalian compatibility; schema defaults were bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21