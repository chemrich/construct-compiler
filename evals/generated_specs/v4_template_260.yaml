construct:
  name: "rfp_myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac # Substituted for T7lac to support requested e_coli_k12 host
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mRFP1
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: HA # Myc tag not in allowed list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA); substituted with HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21