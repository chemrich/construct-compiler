construct:
  name: "bfp_expression_ecoli"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # CMV is a mammalian promoter and will not function in E. coli; substituted with T7lac for compatibility with BL21.
    - cistron:
        label: bfp_target
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21