construct:
  name: "luciferase_c_his_yeast_sub"
  host: mammalian # s_cerevisiae is not in the supported host list; substituting with mammalian as a eukaryotic proxy.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: luciferase_target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: 6xHis
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21