construct:
  name: "mTagBFP2_C_terminal_MBP_fusion"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: bfp_mbp
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 3
          - solubility_tag: MBP
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21