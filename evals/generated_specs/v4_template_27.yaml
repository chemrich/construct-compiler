construct:
  name: "ampR_GST_yeast_expression"
  host: mammalian # substituted s_cerevisiae with mammalian to align with provided schema
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - solubility_tag: GST
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21