construct:
  name: "ampR_c_terminal_gst_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a eukaryotic promoter for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - solubility_tag: GST
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21