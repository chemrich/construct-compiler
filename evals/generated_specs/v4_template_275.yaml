construct:
  name: "lacZ_EGFP_polycistronic_yeast"
  host: s_cerevisiae  # Specific host as requested; using EF1_alpha promoter for eukaryotic compatibility.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: beta_galactosidase
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false  # Independently translated reporter
        gene:
          id: EGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21