construct:
  name: "ampR_EGFP_polycistronic_expression"
  host: e_coli_bl21_de3 # s_cerevisiae host is not in the supported schema; defaulting to e_coli_bl21_de3 for T7-based polycistronic expression
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P0AD64
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false # separate RBS for independent translation in polycistronic context
        gene:
          id: EGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21