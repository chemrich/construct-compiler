construct:
  name: "polycistronic_ampR_EGFP_yeast"
  host: s_cerevisiae  # Specified host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted TEF1 for yeast host compatibility
    - cistron:
        label: ampR_selection
        expression: high
        gene:
          id: P0AD64
          source: uniprot
    - spacer: 30
    - cistron:
        label: EGFP_reporter
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: CYC1_term  # Substituted yeast-specific terminator for yeast host compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21