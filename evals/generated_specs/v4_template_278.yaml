construct:
  name: "luciferase_c_terminal_ha_expression"
  host: e_coli  # Substituted e_coli_k12 with e_coli to match supported host list
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: luciferase_ha
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21