construct:
  name: "ha_rfp_yeast_expression"
  host: s_cerevisiae  # S. cerevisiae requested; utilizing yeast-appropriate promoter (TEF1) and terminator (CYC1_term).
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1
    - cistron:
        label: ha_rfp
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1_term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21