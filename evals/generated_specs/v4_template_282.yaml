construct:
  name: "HEK293_mEGFP_Myc_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG  # Myc tag substituted with FLAG as Myc is not in standard schema list
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BBa_B0015 # Standard terminator; vector typically provides BGH pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21