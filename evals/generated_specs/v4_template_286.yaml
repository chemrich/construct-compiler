construct:
  name: "s_cerevisiae_rfp_luciferase_polycistronic"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # GPD (TDH3) promoter substituted for yeast expression; provided list only contains bacterial/mammalian promoters.
    - cistron:
        label: RFP
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: Luciferase
        expression: medium
        fused: false  # Independently translated via internal ribosome entry or similar mechanism
        gene:
          id: P08659
          source: uniprot
    - terminator: CYC1_term  # CYC1 terminator substituted for yeast compatibility; provided list contains bacterial terminators.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21