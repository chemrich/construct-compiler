construct:
  name: "yeast_polycistronic_rfp_luciferase"
  host: s_cerevisiae  # Polycistronic expression in yeast typically requires 2A peptides or IRES; schema uses independent translation spacers.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Using TEF1 promoter for S. cerevisiae expression
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: luciferase_target
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21