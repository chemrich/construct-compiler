construct:
  name: "YFP_Myc_expression_in_BL21"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG  # Myc tag requested; substituted with FLAG as Myc is not in the supported enum (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
          - gene:
              id: EYFP
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21