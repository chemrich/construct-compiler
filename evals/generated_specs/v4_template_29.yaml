construct:
  name: "polycistronic_ampR_mScarlet_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Substituted T7lac for tac as host e_coli (K12) lacks T7 polymerase
    - cistron:
        label: ampR_target
        expression: high
        gene:
          id: P62593
          source: uniprot
    - spacer: 30
    - cistron:
        label: mScarlet_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21