construct:
  name: "ampR_mScarlet_polycistronic_e_coli"
  host: e_coli

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: T7lac

    - cistron:
        label: antibiotic_resistance
        expression: medium
        gene:
          id: P0AD64
          source: uniprot

    - spacer: 30

    - cistron:
        label: fluorescent_reporter
        expression: medium
        fused: false
        gene:
          id: mScarlet
          source: fpbase

    - terminator: rrnB_T1

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21