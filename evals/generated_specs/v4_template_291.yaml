construct:
  name: "ampR_SUMO_fusion_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_SUMO_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P62593
              source: uniprot
    - terminator: rrnB_T1  # Using rrnB_T1 from schema options as generic terminator placeholder
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21