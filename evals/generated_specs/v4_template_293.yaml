construct:
  name: "EGFP_FLAG_fusion"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21