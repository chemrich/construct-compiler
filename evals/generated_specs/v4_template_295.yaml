construct:
  name: "ampR_Strep_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - gene:
              id: P00810 # UniProt ID for TEM-1 beta-lactamase (ampR)
              source: uniprot
          - tag: Strep-II
    - terminator: BBa_B0015 # BBa_B0015 is a standard terminator part used here to fulfill the requirement; mammalian vectors typically use polyA signals like bGH pA.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21