construct:
  name: "lacZ_cterm_myc_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substitution: Using standard yeast TEF1 promoter for S. cerevisiae host
    - cistron:
        label: lacZ_myc_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: Myc
    - terminator: CYC1  # Substitution: Using standard yeast CYC1 terminator for S. cerevisiae host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21