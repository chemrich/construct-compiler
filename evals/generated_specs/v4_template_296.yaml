construct:
  name: "lacZ_C_term_HA_S_cerevisiae"
  host: s_cerevisiae  # Specified specific yeast host as per cell-line rule
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Reasonable eukaryotic substitution for yeast expression
    - cistron:
        label: lacZ_expression
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA  # Myc tag not in supported list; substituted with HA as a common eukaryotic alternative
    - terminator: BBa_B0015  # Default terminator from available list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21