construct:
  name: "ampR_sumo_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P00810
              source: uniprot
    - terminator: bgh_polya  # Substituted bacterial terminator for mammalian-appropriate polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21