construct:
  name: "mammalian_sumo_ampr_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: sumo_ampr
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P00810
              source: uniprot
    - terminator: BBa_B0015  # Defaulting to schema-provided terminator; standard mammalian constructs typically use SV40 or BGH polyA.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21