construct:
  name: "Myc_lacZ_mammalian_expression"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: P00722
              source: uniprot
    - terminator: BGH_pA # Substituted bacterial terminator with mammalian-appropriate polyadenylation signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21