construct:
  name: "mScarlet_Luciferase_Polycistronic_Expression"
  host: e_coli_bl21_de3  # Selected BL21(DE3) to support the T7lac promoter

  backbone:
    catalog_vector: "pET-28b(+)"

  cassette:
    - promoter: T7lac

    - cistron:
        label: reporter_1
        expression: high
        gene:
          id: mScarlet
          source: fpbase

    - spacer: 30

    - cistron:
        label: reporter_2
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot

    - terminator: T7term

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21