construct:
  name: "pBAD_mEGFP_expression_in_e_coli"
  host: e_coli  # S. cerevisiae is not a supported host; pBAD (araBAD) is a bacterial promoter. Substituted host with e_coli.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21