construct:
  name: "ampR_YFP_HEK293_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: P00810
          source: uniprot
    - spacer: 500  # Increased spacer length to accommodate an IRES for mammalian polycistronic expression
    - cistron:
        label: reporter_yfp
        expression: medium
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015  # Using a universal terminator as placeholder; usually bGH_polyA for mammalian
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21