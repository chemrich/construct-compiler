construct:
  name: "CMV_lacZ_FLAG_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: FLAG
    - terminator: bGH_polyA  # Substituted mammalian terminator for CMV construct
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21