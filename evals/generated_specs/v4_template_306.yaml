construct:
  name: "luciferase_c_terminal_mbp_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is used as a functional eukaryotic homolog for the yeast TEF1 promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
    - terminator: BBa_B0015 # Universal terminator suitable for yeast expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21