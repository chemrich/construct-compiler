construct:
  name: "e_coli_T7lac_EYFP_expression"
  host: e_coli_bl21_de3 # T7lac promoter requires a DE3 lysogen for T7 RNA polymerase expression
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: yfp_target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21