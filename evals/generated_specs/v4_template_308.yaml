construct:
  name: "rfp_mammalian_c_strep"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: Strep-II
    - terminator: rrnB_T1 # Using rrnB_T1 as a placeholder as mammalian polyA terminators are not in the provided schema list.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21