construct:
  name: "ampR_6xHis_fusion"
  host: e_coli  # Substitution: e_coli_k12 not in list, using standard e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P62593
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21