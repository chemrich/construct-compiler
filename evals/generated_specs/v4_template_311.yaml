construct:
  name: "polycistronic_rfp_lacz_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacz_reporter
        expression: medium
        fused: false # Ensures independent translation initiation (e.g., via IRES or internal start)
        gene:
          id: P00722
          source: uniprot
    - terminator: bGH_polyA # Substituted for mammalian polyadenylation signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21