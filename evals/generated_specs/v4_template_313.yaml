construct:
  name: "HA_mEGFP_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted TEF1 as a standard constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term  # Standard yeast transcription terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21