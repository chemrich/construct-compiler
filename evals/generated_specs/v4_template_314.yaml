construct:
  name: "ampR_expression_vector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac # CMV is a mammalian promoter and non-functional in E. coli; substituted with T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: P62593
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21