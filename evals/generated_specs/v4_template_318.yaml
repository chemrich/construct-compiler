construct:
  name: "polycistronic_mcherry_yfp_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 40
    - cistron:
        label: YFP_reporter
        expression: high
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: bGH_pA  # Substituted mammalian terminator for requested HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21