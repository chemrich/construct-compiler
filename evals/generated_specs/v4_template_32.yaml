construct:
  name: "lacZ_C_terminal_6xHis_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: 6xHis
    - terminator: bGH_pA  # Substituted bacterial terminator with bGH_pA for mammalian HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21