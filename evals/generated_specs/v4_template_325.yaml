construct:
  name: "pLac_ampR_GST_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin # Using kanamycin for the backbone selection to avoid conflict with the ampR target gene
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: ampR_fusion
        expression: medium
        chain:
          - solubility_tag: GST
          - gene:
              id: P62593 # UniProt ID for TEM-1 beta-lactamase (ampR)
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21