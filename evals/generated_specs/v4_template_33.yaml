construct:
  name: "mScarlet_N_Strep_yeast_expression"
  host: s_cerevisiae  # S. cerevisiae requested; using eukaryotic promoter and terminator
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Eukaryotic promoter suitable for yeast expression
    - cistron:
        label: mScarlet_reporter
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21