construct:
  name: "pLac_mCherry_E_coli_K12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5  # lacUV5 is the standard pLac variant for reliable E. coli expression
    - cistron:
        label: mCherry_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21