construct:
  name: yeast_gfp_egfp_polycistronic
  host: s_cerevisiae # Note: Host s_cerevisiae used; polycistronic expression in yeast typically requires 2A peptides or IRES, spacer/fused:false used as requested.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Note: EF1_alpha substituted as a functional eukaryotic promoter for S. cerevisiae.
    - cistron:
        label: gfp_cistron
        expression: high
        gene:
          id: GFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: egfp_cistron
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015 # Note: Standard terminator included per requirements.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21