construct:
  name: "T7_mCherry_Myc"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21