construct:
  name: "HEK293_SUMO_Luciferase_Fusion"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P08659 # Firefly luciferase (LUC_LUCPY)
              source: uniprot
    - terminator: BBa_B0015 # Used as a placeholder; in practice, pTwist CMV uses bGH polyA

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21