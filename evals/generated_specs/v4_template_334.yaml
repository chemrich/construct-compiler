construct:
  name: "luciferase_expression_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # T7lac substituted with CMV as T7lac is not functional in mammalian cells without T7 polymerase
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian polyA signal for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21