construct:
  name: "ptet_mcherry_strep"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: pTet  # pTet is used as requested for tetracycline-inducible expression
    - cistron:
        label: mCherry_fusion
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: Strep-II
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21