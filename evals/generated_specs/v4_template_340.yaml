construct:
  name: "HA_tagged_YFP_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac for tac because host is E. coli K12 (lacks T7 polymerase)
    - cistron:
        label: yfp_target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: YFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21