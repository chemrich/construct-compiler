construct:
  name: "trc_mTagBFP2_Myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # trc substituted with tac as it is the closest available match in the schema
    - cistron:
        label: bfp_fusion
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: HA  # Myc tag substituted with HA as Myc was not in the specific schema list
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21