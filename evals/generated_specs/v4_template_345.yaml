construct:
  name: "ampR_myc_yeast_expression"
  host: s_cerevisiae # S. cerevisiae specified; EF1_alpha used as suitable eukaryotic promoter
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA # Myc tag substituted with HA as per available schema options
          - gene:
              id: P62593
              source: uniprot
    - terminator: BBa_B0015 # Generic terminator used for yeast assembly
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21