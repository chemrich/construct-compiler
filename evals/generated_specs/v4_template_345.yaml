construct:
  name: ampR_myc_epitope_yeast
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha is the mammalian ortholog of yeast TEF1; substituted for yeast compatibility
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA        # Myc tag is not in the schema-supported tag list; substituted with HA
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21