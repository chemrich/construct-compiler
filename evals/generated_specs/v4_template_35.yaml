construct:
  name: "bfp_cterm_6xhis_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac with tac for compatibility with e_coli_k12 host
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: 6xHis
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21