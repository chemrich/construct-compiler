construct:
  name: "GST_ampR_expression_yeast"
  host: s_cerevisiae  # User requested yeast; using Saccharomyces cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Yeast-specific promoter substituted for E. coli/mammalian defaults
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: P0AD64
              source: uniprot
    - terminator: CYC1_term  # Yeast-specific terminator substituted for E. coli defaults
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21