construct:
  name: "egfp_myc_expression_ecoli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Defaulting to T7lac per instructions; note that E. coli K12 requires T7 polymerase for this promoter.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: EGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21