construct:
  name: "mammalian_polycistronic_egfp_rfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30  # bp; note that for mammalian polycistronic expression, this spacer would typically be an IRES or 2A peptide, but following schema spacer convention
    - cistron:
        label: rfp_expression
        expression: high
        fused: false  # Ensures independent translation (separate protein)
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21