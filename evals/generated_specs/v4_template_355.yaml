construct:
  name: "yeast_flag_egfp_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted standard yeast promoter for requested host
    - cistron:
        label: flag_egfp
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1  # Substituted standard yeast terminator for requested host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21