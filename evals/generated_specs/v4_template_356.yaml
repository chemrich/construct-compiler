construct:
  name: "lacZ_expression_vector"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for trc as trc is not available in the specified schema; tac is a nearly identical hybrid promoter.
    - cistron:
        label: beta_galactosidase
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21