construct:
  name: "luciferase_6xhis_fusion"
  host: s_cerevisiae  # User requested yeast host; using yeast-specific parts.
  backbone:
    resistance: kanamycin
    ori: 2micron
    source: addgene
  cassette:
    - promoter: GPD  # Reasonable substitution for S. cerevisiae as no promoter was specified.
    - cistron:
        label: luciferase_target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: 6xHis
    - terminator: CYC1_term  # Standard yeast terminator.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21