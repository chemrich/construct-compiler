construct:
  name: "luciferase_6xhis_fusion"
  host: e_coli_bl21  # s_cerevisiae not supported in schema; substituted with e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Standard for e_coli_bl21 expression
    - cistron:
        label: "luciferase_fusion"
        expression: high
        chain:
          - gene:
              id: P08659  # Firefly luciferase (Photinus pyralis)
              source: uniprot
          - tag: 6xHis
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21