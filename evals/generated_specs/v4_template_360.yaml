construct:
  name: "mTagBFP2_C_MBP_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_fusion
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
    - terminator: BBa_B0015  # BBa_B0015 is used as a placeholder; mammalian vectors like pTwist CMV contain necessary polyA signals.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21