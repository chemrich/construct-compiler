construct:
  name: "HEK293_ampR_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # tac is a bacterial promoter and not functional in HEK293; substituted with CMV
    - cistron:
        label: ampR_marker
        expression: high
        gene:
          id: P62593
          source: uniprot
    - terminator: bGH_polyA  # Substituted bacterial terminator examples with mammalian bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21