construct:
  name: "hek293_ampr_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # User requested tac (bacterial); substituted with CMV for HEK293 mammalian expression
    - cistron:
        label: ampr
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21