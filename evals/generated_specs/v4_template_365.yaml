construct:
  name: "rfp_ha_fusion_yeast"
  host: s_cerevisiae  # User requested yeast; using s_cerevisiae host with eukaryotic-compatible parts
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: rfp_ha_target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: HA
    - terminator: BBa_B0015  # Using standard terminator from available list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21