construct:
  name: "rfp_ha_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substitution: EF1_alpha used as a standard eukaryotic promoter for yeast
    - cistron:
        label: rfp_ha
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: HA
    - terminator: CYC1_term  # Substitution: Standard yeast CYC1 terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21