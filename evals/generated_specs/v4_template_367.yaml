construct:
  name: "mCherry_lac_expression_construct"
  host: e_coli  # S. cerevisiae is not a supported host in the schema; defaulting to e_coli to support the requested lac promoter.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # lacUV5 is the closest available match to the lac promoter in the schema.
    - cistron:
        label: target
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21