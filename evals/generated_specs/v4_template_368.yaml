construct:
  name: "egfp_mammalian_expression"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted 'lac' with 'CMV' because the lac promoter is prokaryotic and not functional in mammalian cells.
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015 # Note: BBa_B0015 is a placeholder; mammalian constructs typically require a polyA signal (e.g., BGH_pA).
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21