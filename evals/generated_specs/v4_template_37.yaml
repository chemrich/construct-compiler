construct:
  name: "ampR_C_terminal_Strep_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha selected as eukaryotic promoter suitable for S. cerevisiae
    - cistron:
        label: target_expression
        expression: medium
        chain:
          - gene:
              id: P0AD64
              source: uniprot
          - tag: Strep-II
    - terminator: BBa_B0015 # Bacterial terminator used as placeholder; yeast-specific terminator would be optimized during local synthesis
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21