construct:
  name: "YFP_HA_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: EF1_alpha  # Substituted EF1_alpha as a eukaryotic equivalent for yeast TEF1 promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: YFP
              source: fpbase
          - tag: HA
    - terminator: BBa_B0015  # Universal terminator used as yeast-specific options are not in schema list

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21