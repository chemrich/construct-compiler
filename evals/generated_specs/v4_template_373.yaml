construct:
  name: "luciferase_strep_fusion"
  host: mammalian  # s_cerevisiae is not in the allowed host list; substituting with mammalian host.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luc_strep
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: P08659
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21