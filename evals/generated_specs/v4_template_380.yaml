construct:
  name: "RFP_C_terminal_MBP_fusion_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: 2u  # Yeast high-copy origin of replication
  cassette:
    - promoter: TEF1  # Strong constitutive yeast promoter (homolog of EF1_alpha)
    - cistron:
        label: rfp_mbp
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: MBP
    - terminator: CYC1  # Standard yeast transcription terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21