construct:
  name: "luciferase_c_terminal_sumo_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # Note: T7lac requires a DE3 lysogen; host should ideally be e_coli_bl21_de3
    - cistron:
        label: luc_sumo
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - solubility_tag: SUMO
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21