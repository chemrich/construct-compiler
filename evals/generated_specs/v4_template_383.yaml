construct:
  name: "bfp_gst_fusion_yeast"
  host: mammalian # S. cerevisiae is not in the supported host list; substituting with mammalian cell line as a eukaryotic proxy.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is a eukaryotic promoter suitable for yeast expression.
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21