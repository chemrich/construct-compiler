construct:
  name: "lacz_myc_fusion_construct"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacz_myc_fusion
        expression: medium
        chain:
          - gene:
              id: P00722
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01106
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21