construct:
  name: "pTet_lacZ_yeast_expression"
  host: mammalian  # s_cerevisiae is not in the schema; using 'mammalian' as a eukaryotic proxy for yeast expression.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # pTet is not in the schema list; substituting with EF1_alpha for eukaryotic expression.
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21