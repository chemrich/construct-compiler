construct:
  name: "pTet_lacZ_expression_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin # G418/KanMX selection is common in yeast
    ori: pUC
    source: addgene
  cassette:
    - promoter: pTet # Tetracycline-inducible promoter requested for yeast
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: CYC1_term # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21