construct:
  name: "rfp_mcherry_polycistronic_yeast"
  host: s_cerevisiae  # Using s_cerevisiae as specified; codon optimization will be adjusted accordingly
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Eukaryotic promoter suitable for yeast expression
    - cistron:
        label: rfp
        expression: medium
        gene:
          id: mRFP1
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: medium
        fused: false  # Indicates independent translation (e.g., via IRES or internal start)
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21