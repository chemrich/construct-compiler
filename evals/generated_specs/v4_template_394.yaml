construct:
  name: "yeast_polycistronic_rfp_mcherry"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: TEF1  # Using TEF1 promoter as a standard high-expression yeast promoter
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mRFP1
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21