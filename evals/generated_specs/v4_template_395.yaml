construct:
  name: "polycistronic_gfp_mcherry_expression"
  host: e_coli  # e_coli_k12 mapped to supported e_coli host
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: gfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_cistron
        expression: medium
        fused: false  # independent translation for polycistronic design
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21