construct:
  name: "yfp_gfp_polycistronic_expression"
  host: e_coli_bl21_de3  # s_cerevisiae is not in the supported schema; substituted with e_coli for polycistronic logic compatibility
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: yfp_reporter
        expression: medium
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: gfp_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21