construct:
  name: "polycistronic_yfp_gfp_yeast"
  host: mammalian  # s_cerevisiae is not a supported host; substituting with mammalian as a eukaryotic proxy
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: yfp_cistron
        expression: high
        gene:
          id: mVenus
          source: fpbase
    - spacer: 30
    - cistron:
        label: gfp_cistron
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21