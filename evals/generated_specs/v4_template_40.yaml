construct:
  name: "luciferase_6xhis_fusion_yeast"
  host: s_cerevisiae  # Specified host outside default bacterial/mammalian list

  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene

  cassette:
    - promoter: TEF1  # Using common yeast promoter as standard T7/CMV are not appropriate
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P08659
              source: uniprot
    - terminator: CYC1_term  # Using standard yeast terminator

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21