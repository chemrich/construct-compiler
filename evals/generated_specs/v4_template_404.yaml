construct:
  name: "ampR_SUMO_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_SUMO
        expression: high
        chain:
          - solubility_tag: SUMO
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1  # Using rrnB_T1 as a placeholder terminator; the compiler will resolve to a suitable mammalian polyA signal based on host.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21