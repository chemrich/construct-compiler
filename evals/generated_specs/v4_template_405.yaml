construct:
  name: "mScarlet_ampR_mammalian_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30  # Note: Mammalian polycistronic expression typically requires an IRES or 2A peptide; using spacer as per schema
    - cistron:
        label: selection_marker
        fused: false
        gene:
          id: P00810
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21