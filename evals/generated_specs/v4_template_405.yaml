construct:
  name: "mScarlet_ampR_mammalian_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: selection
        expression: medium
        fused: false
        gene:
          id: P0AD64 # UniProt ID for Beta-lactamase (ampR)
          source: uniprot
    - terminator: bGH_polyA # Standard mammalian terminator for pTwist CMV vectors
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21