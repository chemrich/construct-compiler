construct:
  name: "lacZ_EYFP_polycistronic_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_primary
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: YFP_reporter
        expression: high
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: bGH_pA  # Substituted bacterial terminator for mammalian-appropriate bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21