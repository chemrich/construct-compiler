construct:
  name: "yeast_polycistronic_luciferase_gfp"
  host: mammalian # s_cerevisiae substituted with mammalian; EF1_alpha used as a proxy for a strong eukaryotic promoter
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21