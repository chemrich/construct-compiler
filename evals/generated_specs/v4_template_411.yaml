construct:
  name: "flag_sfgfp_k12_expression"
  host: e_coli  # User requested e_coli_k12; using e_coli as the closest schema-compliant host.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Default for E. coli. Note: Requires T7 polymerase (e.g., DE3 lysogen or helper plasmid) for expression.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: sfGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21