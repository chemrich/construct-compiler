construct:
  name: "HEK293_EGFP_StrepII"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: EGFP
              source: fpbase
    - terminator: BBa_B0015  # Using BBa_B0015 as a placeholder; catalog backbone includes polyA signal.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21