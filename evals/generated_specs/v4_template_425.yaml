construct:
  name: "hek293_yfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted T7 with CMV as T7 promoter is not natively active in mammalian HEK293 cells (Rule 12)
    - cistron:
        label: target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21