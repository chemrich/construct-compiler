construct:
  name: "HEK293_YFP_expression_system"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted T7 with CMV; T7 is a bacteriophage promoter that requires T7 RNA polymerase for expression in mammalian cells.
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21