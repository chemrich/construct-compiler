construct:
  name: "mCherry_GST_fusion_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - solubility_tag: GST
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian polyA signal for HEK293 expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21