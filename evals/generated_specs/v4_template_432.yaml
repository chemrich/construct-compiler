construct:
  name: "polycistronic_mscarlet_egfp_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac for tac as the requested e_coli_k12 host lacks T7 RNA polymerase
    - cistron:
        label: mscarlet_cistron
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: egfp_cistron
        expression: medium
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21