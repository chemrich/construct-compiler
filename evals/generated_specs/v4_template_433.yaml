construct:
  name: "mScarlet_C_terminal_6xHis_yeast"
  host: s_cerevisiae  # S. cerevisiae requested; using standard yeast host configuration
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Standard high-expression yeast promoter
    - cistron:
        label: mScarlet_fusion
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
    - terminator: CYC1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21