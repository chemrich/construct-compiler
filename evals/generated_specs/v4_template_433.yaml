construct:
  name: "mScarlet_C_terminal_6xHis_yeast"
  host: s_cerevisiae  # User requested yeast; using EF1_alpha and BBa_B0015 for eukaryotic expression compatibility.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21