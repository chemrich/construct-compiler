construct:
  name: "bfp_cterminal_strep_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_bfp
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Strep-II
    - terminator: bgh_polya  # Standard mammalian polyadenylation signal for mRNA termination
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21