construct:
  name: "mScarlet_FLAG_expression_yeast"
  host: e_coli  # s_cerevisiae host is not supported in the current schema; substituted with e_coli host per Rule 12.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac  # Default promoter for bacterial expression.
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21