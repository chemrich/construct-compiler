construct:
  name: "mScarlet_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha selected as the most appropriate eukaryotic promoter from the supported list for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21