construct:
  name: "lacZ_GST_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_GST
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: GST
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian bGH_polyA signal for HEK293 expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21