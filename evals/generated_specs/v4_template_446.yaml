construct:
  name: "Polycistronic_YFP_lacZ_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30  # Note: For mammalian polycistronic expression, this spacer would typically represent an IRES or 2A sequence
    - cistron:
        label: lacz_enzyme
        expression: high
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: BGH_polyA # Substituted for mammalian compatibility; standard for pTwist CMV
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21