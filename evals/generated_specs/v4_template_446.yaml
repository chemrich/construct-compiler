construct:
  name: "HEK293_YFP_lacZ_polycistronic"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV

    - cistron:
        label: reporter_yfp
        expression: high
        gene:
          id: EYFP
          source: fpbase

    - spacer: 30

    - cistron:
        label: enzyme_lacz
        expression: medium
        fused: false  # Independent translation; compiler will insert IRES or 2A for mammalian host
        gene:
          id: P00722
          source: uniprot

    - terminator: BBa_B0015  # Substitution: Using BBa_B0015 as a generic terminator; in practice, a polyA signal is used for mammalian expression.

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21