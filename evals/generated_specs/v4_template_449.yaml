construct:
  name: "rfp_his_fusion_tac"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: tac  # trc substituted with tac as trc is not in the allowed list
    - cistron:
        label: rfp_his
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21