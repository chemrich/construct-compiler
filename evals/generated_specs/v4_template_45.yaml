construct:
  name: "myc_ampr_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: ampr_target
        expression: high
        chain:
          - tag: FLAG # Myc tag not in provided schema list; substituted with FLAG per rule 12
          - gene:
              id: P0AD64
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21