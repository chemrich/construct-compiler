construct:
  name: "yeast_polycistronic_ampR_GFP"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Standard constitutive promoter for S. cerevisiae
    - cistron:
        label: selection
        expression: medium
        gene:
          id: P62593
          source: uniprot
    - spacer: 30  # Polycistronic spacer; note that yeast usually requires IRES or 2A peptides for this
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21