construct:
  name: "yfp_expression_bl21_plac"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5  # lacUV5 used as the standard engineered version of pLac for E. coli expression
    - cistron:
        label: yfp_reporter
        expression: medium
        chain:
          - gene:
              id: EYFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21