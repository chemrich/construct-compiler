construct:
  name: "pTet_lacZ_Flag"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # pTet is not in the provided schema; substituted with tac (inducible)
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21