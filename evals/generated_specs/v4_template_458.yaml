construct:
  name: "HEK293_pTet_GFP_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE  # TRE (Tet Response Element) is the mammalian equivalent of pTet for inducible expression
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: SV40_polyA  # Standard mammalian terminator for HEK293 expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21