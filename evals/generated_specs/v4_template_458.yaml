construct:
  name: "hek293_ptet_megfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE  # TRE (Tetracycline Response Element) is the standard mammalian pTet-driven promoter
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21