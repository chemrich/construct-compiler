construct:
  name: "luciferase_c_strep_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: Strep-II
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21