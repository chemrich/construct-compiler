construct:
  name: "ampR_6xHis_yeast_fusion"
  host: mammalian # s_cerevisiae not in schema; substituted with mammalian for eukaryotic expression
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - tag: 6xHis
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21