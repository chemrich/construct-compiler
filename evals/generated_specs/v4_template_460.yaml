construct:
  name: "rfp_lacz_polycistronic_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Using EF1_alpha as a yeast-compatible surrogate for TEF1/GPD
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacz_enzyme
        expression: medium
        fused: false  # Indicates independent translation unit
        gene:
          id: P00722
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21