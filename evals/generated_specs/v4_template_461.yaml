construct:
  name: "pLac_GFP_Myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5 # Substituted pLac with lacUV5 for E. coli expression
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA # Substituted Myc-tag with HA-tag as Myc is not in the pre-defined schema list
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21