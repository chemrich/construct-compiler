construct:
  name: "ampR_strep_expression_yeast"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted for yeast expression compatibility
    - cistron:
        label: ampR_target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: ampR
              source: uniprot
    - terminator: CYC1_term  # Substituted for yeast expression compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21