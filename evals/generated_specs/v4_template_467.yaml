construct:
  name: "trc_mScarlet_FLAG_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for trc as trc is not in the standard spec; tac is functionally equivalent
    - cistron:
        label: reporter
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21