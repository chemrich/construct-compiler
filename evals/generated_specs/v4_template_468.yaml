construct:
  name: "luciferase_n_sumo_expression"
  host: e_coli # e_coli_k12 substituted with e_coli per schema constraints
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: sumo_luciferase
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P08659
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21