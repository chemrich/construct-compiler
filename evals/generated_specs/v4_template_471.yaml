construct:
  name: "lacZ_HA_fusion_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Substituted GAL1 as a standard yeast inducible promoter for s_cerevisiae
    - cistron:
        label: lacZ_HA
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA
    - terminator: CYC1_term  # Standard yeast transcription terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21