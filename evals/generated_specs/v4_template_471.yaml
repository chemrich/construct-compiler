construct:
  name: "lacZ_HA_fusion_yeast"
  host: s_cerevisiae  # Specific cell line name as requested
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1  # ADH1 used as a reasonable substitution for yeast expression as T7/CMV are inappropriate
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: HA
    - terminator: CYC1_term  # Standard yeast terminator substitution
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21