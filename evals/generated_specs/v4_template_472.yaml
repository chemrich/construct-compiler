construct:
  name: mScarlet_lacZ_polycistronic_HEK293
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mScarlet
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: lacZ
        expression: high
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: bGH_polyA  # Substituted bacterial terminator for mammalian-compatible bGH polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21