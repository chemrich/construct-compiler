construct:
  name: "hek293_mscarlet_lacz_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: target
        expression: medium
        fused: false  # Independent translation for polycistronic expression
        gene:
          id: P00722
          source: uniprot
    - terminator: bGH_pA  # Standard mammalian polyadenylation signal for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21