construct:
  name: "mammalian_polycistronic_rfp_mscarlet"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_cistron
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_cistron
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015 # BBa_B0015 is a placeholder; bGH_polyA is recommended for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21