construct:
  name: "hek293_bfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Lac promoter is specific to prokaryotes; substituted with CMV for mammalian expression
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21