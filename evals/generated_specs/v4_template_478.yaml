construct:
  name: "mScarlet_GST_fusion_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mScarlet_GST
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Using BBa_B0015 as a generic terminator placeholder per schema constraints
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21