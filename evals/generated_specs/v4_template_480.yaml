construct:
  name: "mScarlet_C_FLAG_E_coli"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Note: T7lac is the default for E. coli but requires a T7 polymerase source (e.g., DE3 lysogen) not typically found in standard K-12.
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21