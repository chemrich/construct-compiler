construct:
  name: "ptet_luciferase_myc"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for pTet as pTet is not in the allowed schema list; tac provides similar inducible control in E. coli.
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: FLAG  # Substituted FLAG for Myc as Myc is not in the allowed schema list.
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21