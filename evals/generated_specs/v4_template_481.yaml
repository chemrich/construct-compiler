construct:
  name: "pTet_Luciferase_Myc_Expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Substituted pTet with tac (inducible) as pTet is not in the schema list
    - cistron:
        label: luciferase_target
        expression: high
        chain:
          - gene:
              id: P08659 # Firefly Luciferase
              source: uniprot
          - tag: FLAG # Substituted Myc with FLAG as Myc is not in the schema list
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21