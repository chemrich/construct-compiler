construct:
  name: "lacZ_C_terminal_FLAG_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: FLAG
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21