construct:
  name: "bfp_expression_tac"
  host: e_coli  # User requested s_cerevisiae, but the tac promoter is bacterial and s_cerevisiae is not in the supported host list. Defaulted to e_coli.
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: tac
    - cistron:
        label: bfp_target
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21