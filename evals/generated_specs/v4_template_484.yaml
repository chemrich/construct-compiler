construct:
  name: "mTagBFP2_expression_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD # tac is a prokaryotic promoter; substituted with constitutive yeast GPD (TDH3) promoter for expression in S. cerevisiae.
    - cistron:
        label: bfp_reporter
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: CYC1 # Substituted yeast-specific CYC1 terminator for compatibility with S. cerevisiae.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21