construct:
  name: "lac_luciferase_ha"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # Substituted lacUV5 for 'lac' to ensure strong expression in E. coli without CRP dependence
    - cistron:
        label: luciferase_ha
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21