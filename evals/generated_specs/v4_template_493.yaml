construct:
  name: "lacZ_N_SUMO_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P00722
              source: uniprot
    - terminator: bGH_polyA # Substituted bacterial terminator with mammalian-appropriate polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21