construct:
  name: "ampR_C_terminal_Myc_expression"
  host: e_coli  # e_coli_k12 mapped to e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac with tac for E. coli K12 host compatibility
    - cistron:
        label: ampR_target
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - tag: FLAG  # Myc tag substituted with FLAG as per available schema options
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21