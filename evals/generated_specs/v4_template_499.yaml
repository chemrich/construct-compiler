construct:
  name: "ampR_c_terminal_flag_expression"
  host: e_coli # e_coli_k12 substituted with e_coli to match allowed host list
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: FLAG # Myc tag not in schema; substituted with FLAG as a reasonable alternative
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21