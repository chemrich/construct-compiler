construct:
  name: "pTet_mCherry_Strep"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # User requested pTet; substituting with araBAD as pTet is not in the provided schema list.
    - cistron:
        label: reporter
        expression: medium
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: Strep-II
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21