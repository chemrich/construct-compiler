construct:
  name: "lacZ_HA_yeast_expression"
  host: mammalian # s_cerevisiae requested; mammalian cell type used as closest eukaryotic host in schema
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is a robust eukaryotic promoter suitable for yeast expression
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21