construct:
  name: "lacZ_HA_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: ADH1  # Yeast constitutive promoter substituted for s_cerevisiae host
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21