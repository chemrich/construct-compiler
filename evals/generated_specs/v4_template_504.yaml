construct:
  name: "mammalian_ampR_SV40_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: SV40
    - cistron:
        label: ampR
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
    - terminator: bGH_polyA  # Added bGH_polyA as a standard mammalian terminator/polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21