construct:
  name: "yeast_polycistronic_rfp_ampr"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: PGK1  # High-expression constitutive yeast promoter
    - cistron:
        label: rfp
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: ampr_selection
        expression: medium
        fused: false  # Independent translation via separate ribosome entry/initiation
        gene:
          id: P62593
          source: uniprot
    - terminator: CYC1_term  # Standard yeast transcriptional terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21