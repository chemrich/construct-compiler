construct:
  name: "mammalian_yfp_luciferase_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter_yfp
        expression: medium
        gene:
          id: mVenus
          source: fpbase
    - spacer: 30
    - cistron:
        label: target_luciferase
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21