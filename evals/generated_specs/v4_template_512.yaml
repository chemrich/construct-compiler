construct:
  name: mammalian_polycistronic_lacz_yfp
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: YFP
        expression: medium
        fused: false  # Independently translated via IRES or similar mechanism resolved by compiler
        gene:
          id: EYFP
          source: fpbase
    - terminator: hGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21