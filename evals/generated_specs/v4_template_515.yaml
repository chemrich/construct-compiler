construct:
  name: "trc_ampR_SUMO_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # trc is not in the schema; tac substituted as the closest functional equivalent
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21