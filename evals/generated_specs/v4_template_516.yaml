construct:
  name: "mCherry_Strep_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_Strep
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: Strep-II
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21