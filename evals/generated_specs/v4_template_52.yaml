construct:
  name: "plac_rfp_his_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5  # lacUV5 used as the standard regulated lac promoter from allowed list
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mRFP1
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21