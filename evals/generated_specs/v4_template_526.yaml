construct:
  name: "polycistronic_mCherry_YFP_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Eukaryotic promoter suitable for yeast expression
    - cistron:
        label: mcherry_cistron
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_cistron
        expression: medium
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21