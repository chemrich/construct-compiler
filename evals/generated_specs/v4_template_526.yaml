construct:
  name: "yeast_polycistronic_mcherry_yfp"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Standard constitutive yeast promoter
    - cistron:
        label: mcherry_reporter
        expression: medium
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_reporter
        expression: medium
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21