construct:
  name: "GST_mEGFP_yeast_expression"
  host: s_cerevisiae  # Yeast host specified; EF1_alpha selected as a eukaryotic-compatible promoter from the provided list
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: gst_egfp_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21