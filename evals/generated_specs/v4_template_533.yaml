construct:
  name: "lacZ_HA_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # lacUV5 is the standard inducible lac promoter variant
    - cistron:
        label: lacZ_target
        expression: medium
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21