construct:
  name: "HEK293_MBP_mCherry_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BGH_pA # Substituted bacterial terminator with BGH_pA for polyadenylation in mammalian host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21