construct:
  name: "lacZ_MBP_yeast_expression"
  host: s_cerevisiae  # Specific host line used as per Rule 13
  backbone:
    resistance: kanamycin
    ori: 2u
    source: addgene
  cassette:
    - promoter: GAL1  # Substituted for yeast compatibility; standard inducible promoter
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: lacZ
              source: uniprot
    - terminator: CYC1  # Eukaryotic terminator for s_cerevisiae
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21