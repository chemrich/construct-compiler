construct:
  name: "hek293_egfp_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # substituted T7 with CMV for HEK293 expression as T7 requires a specialized polymerase-expressing cell line
    - cistron:
        label: egfp_target
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21