construct:
  name: "lacZ_expression_plasmid"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted CMV with tac promoter because CMV is a mammalian promoter and the host is E. coli.
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21