construct:
  name: "mscarlet_myc_expression_ecoli"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG  # Myc tag requested but not in schema list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA); substituted with FLAG per Rule 12
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21