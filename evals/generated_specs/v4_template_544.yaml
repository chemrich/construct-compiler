construct:
  name: "mScarlet_Strep_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mScarlet_fusion
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: Strep-II
    - terminator: bGH_polyA  # bGH_polyA substituted for bacterial terminators to ensure proper mRNA processing in HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21