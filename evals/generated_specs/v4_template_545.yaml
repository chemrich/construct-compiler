construct:
  name: "mammalian_polycistronic_luciferase_egfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015  # Using standard terminator as specific mammalian polyA not in schema list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21