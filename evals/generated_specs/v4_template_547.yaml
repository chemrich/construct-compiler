construct:
  name: "ptet_egfp_ha_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tet # pTet requested, using tet-inducible promoter
    - cistron:
        label: target
        expression: medium
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21