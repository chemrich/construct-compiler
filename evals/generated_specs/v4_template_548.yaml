construct:
  name: "yeast_polycistronic_mcherry_bfp"
  host: mammalian # Substituted for s_cerevisiae to align with eukaryotic host options in schema
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Eukaryotic promoter suitable for yeast/mammalian expression
    - cistron:
        label: mCherry_target
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: mTagBFP2_reporter
        expression: high
        fused: false # Ensures independent translation start for the second gene
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21