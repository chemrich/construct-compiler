construct:
  name: "egfp_c_strep_yeast"
  host: mammalian  # s_cerevisiae not in provided list; substituted with mammalian for eukaryotic processing
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Selected EF1_alpha as a eukaryotic-compatible promoter from the available list
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Strep-II
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21