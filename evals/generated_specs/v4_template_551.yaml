construct:
  name: "egfp_c_terminal_strep_yeast"
  host: s_cerevisiae # S. cerevisiae specified; utilizing EF1_alpha promoter and BBa_B0015 for eukaryotic compatibility
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: egfp_fusion
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Strep-II
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21