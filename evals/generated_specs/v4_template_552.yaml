construct:
  name: "egfp_n_myc_bl21"
  host: e_coli_bl21_de3 # Substituted bl21 with bl21_de3 to support the default T7lac promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG # Myc tag not in schema-defined enum; substituted with FLAG
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21