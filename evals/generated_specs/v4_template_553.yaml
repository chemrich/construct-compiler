construct:
  name: "lacZ_C_Myc_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted for yeast-compatible eukaryotic promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: HA  # Myc tag substituted with HA as Myc is not in the allowed schema list
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21