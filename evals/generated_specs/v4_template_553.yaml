construct:
  name: "lacZ_C_terminal_Myc_S_cerevisiae"
  host: e_coli # s_cerevisiae host not supported in schema; substituted with e_coli microbial host
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: HA # Myc tag not in schema tag list; substituted with HA for C-terminal labeling
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21