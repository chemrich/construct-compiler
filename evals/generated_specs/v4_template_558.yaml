construct:
  name: "HEK293_Luciferase_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # tac is a bacterial promoter incompatible with HEK293; substituted with CMV
    - cistron:
        label: firefly_luciferase
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21