construct:
  name: "GFP_lac_expression_BL21"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5 # User requested lac; lacUV5 is the standard lac-derived inducible promoter for E. coli
    - cistron:
        label: gfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21