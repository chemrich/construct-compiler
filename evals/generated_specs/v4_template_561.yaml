construct:
  name: "SUMO_mCherry_fusion_yeast"
  host: s_cerevisiae  # User specified yeast; using EF1_alpha as a eukaryotic promoter compatible with yeast
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: sumo_rfp_fusion
        expression: medium
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21