construct:
  name: "polycistronic_lacz_bfp_yeast"
  host: mammalian # Substituted s_cerevisiae with mammalian as it is the closest eukaryotic host defined in the schema
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: BFP_reporter
        expression: low
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21