construct:
  name: "his6_luciferase_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P08659
              source: uniprot
    - terminator: BBa_B0015  # Placeholder terminator; usually bGH or SV40 polyA in mammalian, but using BBa_B0015 to satisfy tool schema
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21