construct:
  name: "flag_ampr_expression_yeast"
  host: mammalian # s_cerevisiae not in supported list; mammalian used as eukaryotic proxy
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha # Eukaryotic promoter suitable for yeast-like expression context
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P62593 # UniProt ID for Beta-lactamase (ampR)
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21