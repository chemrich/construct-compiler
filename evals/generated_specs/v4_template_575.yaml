construct:
  name: "luciferase_c_terminal_sumo_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luc_sumo_fusion
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - solubility_tag: SUMO
    - terminator: rrnB_T1  # Using rrnB_T1 as specified in available schema options
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21