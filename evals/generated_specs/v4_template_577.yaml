construct:
  name: "lacZ_YFP_polycistronic_expression"
  host: e_coli # Substituted for e_coli_k12 as it is the closest valid enum host
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_primary
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - spacer: 30
    - cistron:
        label: YFP_reporter
        expression: medium
        fused: false
        gene:
          id: YFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21