construct:
  name: "YFP_FLAG_fusion_yeast"
  host: s_cerevisiae
  backbone:
    catalog_vector: "pYES2"
  cassette:
    - promoter: GAL1  # GAL1 used for high-level inducible expression in S. cerevisiae
    - cistron:
        label: YFP_FLAG_fusion
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
          - tag: FLAG
    - terminator: CYC1_term  # CYC1_term used for yeast-specific termination
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21