construct:
  name: "YFP_FLAG_fusion_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha is used as a suitable eukaryotic promoter for yeast expression
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EYFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21