construct:
  name: "mammalian_sumo_ampr"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: sumo_ampr
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P62593
              source: uniprot
    - terminator: bGH_polyA # Substituted bGH_polyA for mammalian expression compatibility as prompt examples were bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21