construct:
  name: "mEGFP_Myc_S_cerevisiae_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TDH3  # Substituted TDH3 for yeast expression as host is s_cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1  # Substituted CYC1 terminator for yeast expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21