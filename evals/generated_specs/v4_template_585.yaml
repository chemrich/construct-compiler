construct:
  name: "s_cerevisiae_mEGFP_Myc"
  host: mammalian # s_cerevisiae not in host list; substituted 'mammalian' as a eukaryotic proxy.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituting EF1_alpha as a eukaryotic promoter compatible with yeast.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21