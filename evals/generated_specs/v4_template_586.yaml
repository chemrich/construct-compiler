construct:
  name: "HEK293_GFP_Expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted CMV for lac as lac is a bacterial promoter and incompatible with HEK293 expression.
    - cistron:
        label: target
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21