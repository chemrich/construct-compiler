construct:
  name: "GFP_HA_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: GFP_HA
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: HA
    - terminator: bGH_PA # Substituted bGH_PA for mammalian host as the provided list was bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21