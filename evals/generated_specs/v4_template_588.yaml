construct:
  name: "mammalian_luciferase_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # tac promoter is bacterial; substituted with CMV for mammalian host compatibility.
    - cistron:
        label: luciferase_target
        expression: high
        gene:
          id: luciferase
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21