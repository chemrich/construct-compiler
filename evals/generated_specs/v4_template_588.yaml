construct:
  name: "mammalian_luciferase_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # tac is a bacterial promoter and non-functional in mammalian cells; substituted with CMV.
    - cistron:
        label: target
        expression: high
        gene:
          id: P08659
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21