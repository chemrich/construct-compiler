construct:
  name: "myc_luciferase_k12_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac
      # Note: Substituted tac for T7lac because E. coli K-12 lacks the T7 RNA polymerase required for T7-based promoters.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: P08659
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21