construct:
  name: "polycistronic_ampR_mCherry_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR
        expression: medium
        gene:
          id: P0AD64
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter_rfp
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21