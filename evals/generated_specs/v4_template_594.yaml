construct:
  name: "hek293_mbp_lacz_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mbp_lacz_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P00722
              source: uniprot
    - terminator: bGH_polyA  # Substituted bGH_polyA as a standard mammalian terminator for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21