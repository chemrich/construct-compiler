construct:
  name: "myc_lacz_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - tag: Myc  # Added Myc tag as requested; standard for mammalian detection
          - gene:
              id: P00722
              source: uniprot
    - terminator: bGH_polyA  # Using mammalian polyA terminator for pTwist CMV vector
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21