construct:
  name: "lacZ_Myc_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_expression
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: lacZ
              source: uniprot
    - terminator: bGH_polyA  # Standard polyadenylation signal for mammalian catalog vectors
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21