construct:
  name: "rfp_c_terminal_myc_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: rfp_target
        expression: high
        chain:
          - gene:
              id: mRFP1
              source: fpbase
          - tag: FLAG  # Myc tag is not in the schema-defined list; substituted with FLAG as a common epitope tag.
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21