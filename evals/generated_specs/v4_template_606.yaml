construct:
  name: "polycistronic_bfp_egfp_yeast_substitute"
  host: e_coli_bl21 # S. cerevisiae is not in the supported host list (e_coli, HEK293, CHO, mammalian); substituting with E. coli BL21
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: bfp
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: egfp
        expression: high
        fused: false # Independent translation with its own RBS
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21