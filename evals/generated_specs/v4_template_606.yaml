construct:
  name: "yeast_polycistronic_bfp_egfp"
  host: s_cerevisiae  # Note: S. cerevisiae is eukaryotic; while polycistronic expression is typically bacterial, this design uses a eukaryotic-friendly EF1_alpha promoter and spacer for tool compatibility.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: bfp_reporter
        expression: medium
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30  # Intergenic spacer; for yeast, this would typically require an IRES or 2A peptide for true polycistronic translation.
    - cistron:
        label: egfp_reporter
        expression: medium
        fused: false  # Indicates independent translation initiation
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21