construct:
  name: "GST_ampR_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted pTet with tac (inducible) as pTet is not in the allowed schema list
    - cistron:
        label: gst_ampr_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21