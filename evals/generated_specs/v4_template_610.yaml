construct:
  name: "HA_ampR_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_expression
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P0AD64
              source: uniprot
    - terminator: bGH_polyA  # Substituted bacterial terminator for mammalian polyA signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21