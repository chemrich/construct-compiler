construct:
  name: "lacZ_GST_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted T7lac with tac for compatibility with E. coli K12 host
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: lacZ
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21