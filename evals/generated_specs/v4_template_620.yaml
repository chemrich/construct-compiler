construct:
  name: "bfp_mcherry_polycistronic_yeast"
  host: s_cerevisiae

  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene

  cassette:
    - promoter: TEF1  # TEF1 promoter is used for constitutive expression in S. cerevisiae
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 40
    - cistron:
        label: mcherry_reporter
        expression: high
        fused: false  # Independently translated via IRES or internal start logic
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term  # Common yeast terminator

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21