construct:
  name: "yeast_bfp_mcherry_polycistronic"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1 # Yeast-specific constitutive promoter; substituted for bacterial/mammalian options in schema
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry_reporter
        expression: high
        fused: false # Independent translation for polycistronic effect
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term # Yeast-specific terminator; substituted for schema-listed ones
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21