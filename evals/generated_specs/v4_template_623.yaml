construct:
  name: "lacZ_6xHis_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot
    - terminator: BGH_pA # Substituted BGH_pA for bacterial terminators as the host is HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21