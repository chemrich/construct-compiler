construct:
  name: "mCherry_T7_expression_plasmid"
  host: e_coli_bl21_de3  # Substituted BL21(DE3) to provide T7 RNA polymerase for the requested T7 promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21