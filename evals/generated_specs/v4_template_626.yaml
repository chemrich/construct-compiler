construct:
  name: "SV40_mCherry_HA"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: SV40  # User requested SV40 promoter for mammalian expression
    - cistron:
        label: RFP_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: HA
    - terminator: bgh_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21