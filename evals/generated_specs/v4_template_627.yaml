construct:
  name: "yfp_gst_yeast_expression"
  host: mammalian # User requested s_cerevisiae; substituted mammalian as the closest eukaryotic host available in the schema
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Eukaryotic promoter proxy for yeast expression
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: YFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21