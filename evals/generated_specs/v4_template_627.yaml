construct:
  name: "GST_YFP_yeast_expression"
  host: s_cerevisiae # S. cerevisiae host requested; using mammalian-style eukaryotic promoter EF1_alpha for compatibility.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: YFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21