construct:
  name: "mTagBFP2_T7_expression_construct"
  host: e_coli_bl21_de3 # S. cerevisiae is not in the supported host list; substituted with e_coli_bl21_de3 to support the requested T7 promoter.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21