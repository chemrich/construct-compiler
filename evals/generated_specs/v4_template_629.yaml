construct:
  name: "T7_mTagBFP2_expression_plasmid"
  host: e_coli_bl21_de3 # s_cerevisiae is not supported by the schema; substituted with e_coli_bl21_de3 as T7 expression requires the DE3 lysogen.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: BFP_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21