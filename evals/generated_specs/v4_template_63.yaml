construct:
  name: "mammalian_polycistronic_egfp_ampr"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_reporter
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: ampr_expression
        expression: medium
        fused: false
        gene:
          id: P62593
          source: uniprot
    - terminator: bGH_polyA  # Standard mammalian terminator for use with CMV promoter
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21