construct:
  name: "cmv_luciferase_strep"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase_fusion
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: Strep-II
    - terminator: bGH_PA # Substituted for mammalian polyadenylation; schema examples were bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21