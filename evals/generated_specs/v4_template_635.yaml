construct:
  name: "ampR_T7_expression_plasmid"
  host: e_coli_bl21_de3  # Substituted e_coli_bl21_de3 for e_coli_k12 to provide T7 RNA polymerase for the T7 promoter
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: ampicillin_resistance
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21