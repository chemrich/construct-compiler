construct:
  name: "ampR_T7_expression_plasmid"
  host: e_coli_bl21_de3  # Substituted e_coli_k12 for e_coli_bl21_de3 to provide T7 RNA polymerase required for the T7 promoter.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P62593
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21