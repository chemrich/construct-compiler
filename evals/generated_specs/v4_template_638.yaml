construct:
  name: hek293_egfp_bfp_polycistronic
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30  # Note: Standard mammalian polycistronic expression usually requires an IRES or 2A peptide; using a spacer here per schema.
    - cistron:
        label: bfp_cistron
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: bGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21