construct:
  name: "hek293_polycistronic_egfp_bfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: egfp_expression
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30  # Note: Mammalian polycistronic systems typically require an IRES or 2A peptide; using a spacer per schema constraints.
    - cistron:
        label: bfp_expression
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: SV40_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21