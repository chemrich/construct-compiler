construct:
  name: "HEK293_YFP_expression_vector"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV  # trc is a bacterial promoter; substituted with CMV for mammalian host compatibility.
    - cistron:
        label: target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21