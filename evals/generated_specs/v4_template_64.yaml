construct:
  name: "lacZ_tac_e_coli_substituted"
  host: e_coli  # Substituted e_coli for s_cerevisiae because the requested trc/tac promoter and lacZ are bacterial
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for trc as it is the most similar supported promoter in the schema
    - cistron:
        label: lacZ_expression
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21