construct:
  name: "yfp_expression_plasmid"
  host: e_coli_bl21  # Changed from s_cerevisiae because trc is a bacterial promoter and yeast is not in the host enum.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted trc with tac as it is the closest compatible promoter in the schema.
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: YFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21