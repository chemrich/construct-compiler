construct:
  name: "YFP_expression_plasmid"
  host: e_coli  # Substituted e_coli for s_cerevisiae as yeast hosts are not supported; host changed to match the bacterial trc/tac promoter.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for trc as it is the closest supported equivalent in the tool schema.
    - cistron:
        label: YFP_target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21