construct:
  name: "ampR_c_terminal_ha_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Substituted T7lac for tac because e_coli_k12 lacks the T7 RNA polymerase required for T7-based systems.
    - cistron:
        label: ampR_ha
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21