construct:
  name: "mScarlet_C_term_6xHis_yeast_expression"
  host: s_cerevisiae  # S. cerevisiae requested; using yeast-specific parts
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Yeast-specific promoter substitution for S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
    - terminator: CYC1_term  # Yeast-specific terminator substitution
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21