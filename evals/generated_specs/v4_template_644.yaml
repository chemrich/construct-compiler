construct:
  name: "pTet_RFP_Flag"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted tac for pTet as pTet is not in the standard list; both are inducible in E. coli
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - gene:
              id: mRFP1
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21