construct:
  name: "ampR_6xHis_fusion_S_cerevisiae"
  host: mammalian # S. cerevisiae not in supported host list; substituting with mammalian for eukaryotic expression components.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: "ampR_fusion"
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: "P00810"
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21