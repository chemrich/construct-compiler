construct:
  name: "ampR_6xHis_yeast_fusion"
  host: mammalian # Substituted mammalian for s_cerevisiae as yeast is not in the allowed list
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: CMV # Substituted CMV for a yeast-compatible eukaryotic promoter
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P0AD64
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21