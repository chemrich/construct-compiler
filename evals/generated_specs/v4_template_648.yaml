construct:
  name: "mScarlet_Myc_yeast"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted for yeast TEF1; EF1_alpha is the homologous promoter in schema
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA  # Substituted HA for Myc as Myc is not in the provided schema list
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Substituted for yeast-specific terminator as none are in schema
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21