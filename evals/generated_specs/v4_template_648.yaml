construct:
  name: "mScarlet_Myc_yeast_expression"
  host: s_cerevisiae  # Yeast host requested
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha is used as a eukaryotic-compatible promoter for yeast since specific yeast promoters are not in the schema list
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: Myc  # N-terminal Myc tag requested by user
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015  # Using BBa_B0015 as a generic terminator; CYC1_term is standard for yeast but not in the schema list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21