construct:
  name: "MBP_lacZ_HEK293_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: P00722
              source: uniprot
    - terminator: bgh_polyA  # Substituted for mammalian host compatibility as rrnB_T1 is prokaryotic
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21