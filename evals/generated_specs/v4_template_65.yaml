construct:
  name: "sv40_egfp_ha"
  host: HEK293  # Defaulted to HEK293 to support the requested mammalian SV40 promoter
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: SV40
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: SV40_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21