construct:
  name: "sv40_egfp_ha_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # SV40 requested, but substituted with CMV as SV40 is not in the allowed promoter list (T7, T7lac, tac, araBAD, lacUV5, J23100, J23106, CMV, EF1_alpha).
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: HA
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21