construct:
  name: "Myc_mEGFP_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is used as a functional strong constitutive promoter for yeast expression
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21