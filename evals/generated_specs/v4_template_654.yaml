construct:
  name: "myc_egfp_expression_s_cerevisiae"
  host: s_cerevisiae  # Using S. cerevisiae as host with TEF1/CYC1 regulatory elements
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Constitutive yeast promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21