construct:
  name: "egfp_sumo_fusion_k12"
  host: e_coli  # Normalized from e_coli_k12 to schema-supported host
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac  # Defaulting to T7lac per instructions; requires T7 polymerase in the host
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21