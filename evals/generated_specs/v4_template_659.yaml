construct:
  name: "S_cerevisiae_Myc_EYFP_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Substituted for yeast compatibility as CMV/T7 are not suitable
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: EYFP
              source: fpbase
    - terminator: CYC1  # Substituted for yeast compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21