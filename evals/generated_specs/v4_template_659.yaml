construct:
  name: "myc_yfp_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha (yeast TEF1) is used for constitutive high expression in S. cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: EYFP
              source: fpbase
    - terminator: CYC1_term  # Standard terminator for S. cerevisiae expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21