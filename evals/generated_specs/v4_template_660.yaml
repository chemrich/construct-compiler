construct:
  name: "polycistronic_bfp_egfp_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_cistron
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30
    - cistron:
        label: egfp_cistron
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21