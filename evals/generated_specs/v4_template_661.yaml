construct:
  name: "ha_rfp_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ha_rfp
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: bGH_polyA # Substituted for mammalian polyadenylation signal as per host context
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21