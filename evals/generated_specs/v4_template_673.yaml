construct:
  name: "luciferase_ha_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha (TEF1) is a robust constitutive promoter in yeast
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: HA
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21