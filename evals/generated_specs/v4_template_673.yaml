construct:
  name: "luciferase_c_ha_yeast_expression"
  host: s_cerevisiae  # S. cerevisiae is the requested host; using eukaryotic compatible settings.
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a reasonable eukaryotic substitute available in the schema.
    - cistron:
        label: luciferase_ha
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21