construct:
  name: "ampR_sumo_expression"
  host: e_coli  # Substituted e_coli for e_coli_k12 to match allowed schema values
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac  # Defaulting to T7lac per instructions; note that K-12 requires a T7 polymerase source
    - cistron:
        label: sumo_ampR
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: ampR
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21