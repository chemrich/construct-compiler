construct:
  name: "bfp_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
  cassette:
    - promoter: tac # trc promoter not in schema; substituted with tac
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21