construct:
  name: "mammalian_polycistronic_lacz_egfp"
  host: mammalian
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_primary
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: egfp_secondary
        expression: medium
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: bGH_polyA  # Substituted mammalian polyA signal for prokaryotic terminator list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21