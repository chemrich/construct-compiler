construct:
  name: "lacZ_expression_in_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted CMV with tac for E. coli compatibility as CMV is a mammalian promoter
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21