construct:
  name: "lacZ_expression_e_coli"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac  # User requested CMV (mammalian) for E. coli host. Substituted with tac promoter for functional bacterial expression.
    - cistron:
        label: target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21