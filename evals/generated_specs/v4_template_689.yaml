construct:
  name: "mScarlet_yeast_flag_fusion"
  host: s_cerevisiae # S. cerevisiae host requested; using EF1_alpha as a eukaryotic promoter substitute from the allowed list.
  backbone:
    resistance: kanamycin # Using kanamycin resistance as it is compatible with yeast G418 selection (kanMX).
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015 # Using BBa_B0015 as a generic terminator; yeast-specific terminators were not provided in the schema.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21