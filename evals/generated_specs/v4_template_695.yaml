construct:
  name: "lacZ_HA_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Using EF1_alpha as a eukaryotic promoter compatible with yeast from the available list
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P00722
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21