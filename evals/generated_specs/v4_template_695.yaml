construct:
  name: "lacZ_HA_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituted with EF1_alpha for yeast compatibility as it is an available eukaryotic promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: P00722
              source: uniprot
    - terminator: CYC1 # Substituted with CYC1, a standard yeast terminator, for proper mRNA processing
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21