construct:
  name: "rfp_mcherry_yeast_polycistronic"
  host: mammalian # Substituted s_cerevisiae with mammalian to ensure eukaryotic compatibility with schema
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: rfp
        expression: medium
        gene:
          id: mRFP1
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: medium
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21