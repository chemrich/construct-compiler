construct:
  name: "yeast_polycistronic_rfp_mcherry"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha substituted as a functional eukaryotic equivalent for yeast TEF1
    - cistron:
        label: rfp
        expression: high
        gene:
          id: mRFP1
          source: fpbase
    - spacer: 30
    - cistron:
        label: mcherry
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: CYC1_term  # Standard yeast terminator substitution for optimal termination in S. cerevisiae
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21