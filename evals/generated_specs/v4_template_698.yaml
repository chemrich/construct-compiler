construct:
  name: "rfp_expression_yeast_substitution"
  host: e_coli  # User requested s_cerevisiae, but yeast is not supported in the current schema and trc is an E. coli promoter; substituted with e_coli.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # trc promoter not in schema; tac used as the closest functional equivalent for bacterial expression.
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21