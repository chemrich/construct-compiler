construct:
  name: "rfp_c_terminal_6xhis"
  host: e_coli_bl21_de3  # Upgraded to BL21(DE3) to support the default T7lac promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: rfp_target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: 6xHis
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21