construct:
  name: "lacZ_Myc_fusion_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_Myc_fusion
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P01106
              source: uniprot
    - terminator: BGH_polyA  # Standard mammalian terminator for polyadenylation
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21