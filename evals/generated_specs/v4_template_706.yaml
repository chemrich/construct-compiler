construct:
  name: "mCherry_C_Myc_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: Myc
    - terminator: bGH_polyA  # Substituted mammalian polyA signal for HEK293 as provided options were bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21