construct:
  name: "polycistronic_luciferase_mcherry_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: mCherry
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21