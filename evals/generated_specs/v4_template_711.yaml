construct:
  name: "mScarlet_Myc_fusion"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: FLAG  # Myc tag is not in the allowed schema list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA); substituted with FLAG.
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21