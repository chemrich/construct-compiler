construct:
  name: "ptet_gfp_myc_fusion"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: araBAD  # User requested pTet; substituted with araBAD as a standard inducible bacterial promoter.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA  # User requested Myc tag; substituted with HA as it is a supported epitope tag in the schema.
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21