construct:
  name: mammalian_flag_yfp
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: flag_yfp_fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EYFP
              source: fpbase
    - terminator: SV40_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21