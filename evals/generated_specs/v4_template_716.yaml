construct:
  name: hek293_lacZ_expression
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # trc is a bacterial promoter; substituted with CMV for expression in HEK293
    - cistron:
        label: target
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: SV40_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21