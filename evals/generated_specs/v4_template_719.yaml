construct:
  name: "ptet_sumo_megfp_fusion"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Substitution: pTet is not in the predefined list; T7lac is used for inducible expression in E. coli.
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21