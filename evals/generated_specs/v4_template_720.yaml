construct:
  name: "mCherry_MBP_fusion"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # Substituted SV40 with T7lac to match E. coli host default and schema-supported promoters
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: mCherry
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21