construct:
  name: "YFP_Strep_Fusion_K12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # Optimized for E. coli K-12 which lacks T7 polymerase
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: EYFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21