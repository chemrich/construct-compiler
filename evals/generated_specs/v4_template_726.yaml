construct:
  name: "SV40_lacZ_HA"
  host: HEK293  # SV40 is a mammalian promoter; host set to HEK293 for compatibility
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: SV40
    - cistron:
        label: lacZ_HA
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - tag: HA
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21