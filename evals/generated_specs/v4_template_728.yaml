construct:
  name: "MBP_Luciferase_Fusion"
  host: mammalian  # Substituted mammalian for s_cerevisiae as yeast is not currently in the host schema.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a eukaryotic promoter substitute for yeast expression.
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P08659
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21