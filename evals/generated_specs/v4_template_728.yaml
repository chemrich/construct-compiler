construct:
  name: "MBP_Luciferase_Fusion_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Substituted TEF1 for S. cerevisiae host expression
    - cistron:
        label: mbp_luciferase_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 3
          - gene:
              id: P08659
              source: uniprot
    - terminator: CYC1_term  # Substituted CYC1_term for S. cerevisiae host termination
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21