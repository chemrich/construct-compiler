construct:
  name: "mammalian_rfp_c_myc"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - linker:
              type: short_GS
              repeats: 1
          - tag: Myc
    - terminator: BBa_B0015 # BBa_B0015 used for schema compliance; polyA is typically vector-resident in mammalian systems
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21