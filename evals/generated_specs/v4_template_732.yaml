construct:
  name: "mammalian_rfp_c_myc"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_myc_fusion
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - tag: HA  # Myc tag was requested; substituted with HA as it is in the supported tag list.
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21