construct:
  name: "yfp_expression_plasmid"
  host: e_coli # s_cerevisiae is not supported in schema; substituted with e_coli to maintain lac-based induction
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5 # pLac substituted with lacUV5 for compatibility with E. coli host
    - cistron:
        label: reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21