construct:
  name: "ampR_expression_in_bl21"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac  # SV40 is a mammalian promoter; substituted with T7lac for E. coli host compatibility
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21