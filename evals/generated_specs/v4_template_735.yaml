construct:
  name: "polycistronic_mCherry_GFP_yeast"
  host: mammalian  # s_cerevisiae not in host list; mammalian substituted as eukaryotic host.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Yeast-specific promoters not in list; EF1_alpha used for eukaryotic expression.
    - cistron:
        label: mCherry_cistron
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: GFP_cistron
        expression: high
        fused: false
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21