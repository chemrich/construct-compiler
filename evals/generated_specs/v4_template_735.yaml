construct:
  name: "mCherry_GFP_polycistronic_yeast"
  host: s_cerevisiae  # S. cerevisiae requested; assuming polycistronic behavior via IRES or 2A-like spacer functionality
  backbone:
    resistance: kanamycin
    ori: pUC  # Standard E. coli origin for cloning/propagation
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Strong constitutive promoter compatible with S. cerevisiae
    - cistron:
        label: mCherry_expression
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: GFP_expression
        expression: high
        fused: false  # Indicates independent translation initiation
        gene:
          id: sfGFP
          source: fpbase
    - terminator: BBa_B0015  # Efficient bidirectional terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21