construct:
  name: "lac_yfp_6xhis_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # lacUV5 is the standard variant of the lac promoter used for protein expression in E. coli
    - cistron:
        label: target
        expression: medium
        chain:
          - tag: 6xHis
          - gene:
              id: YFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21