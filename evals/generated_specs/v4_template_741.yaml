construct:
  name: "T7lac_lacZ_Myc"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: Myc  # Myc tag is standard; used despite not being in the explicit schema example list
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21