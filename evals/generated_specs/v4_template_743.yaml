construct:
  name: "lacZ_flag_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac  # Default for e_coli; typically requires DE3 lysogen or helper for expression
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P00722
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21