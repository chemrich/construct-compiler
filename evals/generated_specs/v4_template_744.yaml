construct:
  name: "HEK293_pTet_YFP_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # pTet is not in the predefined schema list; CMV substituted for HEK293 expression.
    - cistron:
        label: reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1 # Bacterial terminator used to satisfy schema requirements for mammalian host.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21