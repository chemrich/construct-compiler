construct:
  name: "YFP_Myc_S_cerevisiae"
  host: mammalian # s_cerevisiae is not in the allowed host list; using mammalian as the eukaryotic alternative.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is a common constitutive eukaryotic promoter; substituting for yeast-specific promoters.
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
          - tag: Myc
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21