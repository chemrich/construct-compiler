construct:
  name: "yfp_expression_bl21"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: lacUV5 # lacUV5 used as the standard regulated lac-derived promoter for E. coli
    - cistron:
        label: yfp_target
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21