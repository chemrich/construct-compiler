construct:
  name: "luciferase_egfp_polycistronic"
  host: e_coli_bl21_de3  # Substituted for e_coli to support T7lac/pET expression system
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21