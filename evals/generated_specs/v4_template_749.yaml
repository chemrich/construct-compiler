construct:
  name: "mammalian_polycistronic_ampR_mScarlet"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampicillin_resistance
        expression: medium
        gene:
          id: P00810
          source: uniprot
    - spacer: 30
    - cistron:
        label: rfp_reporter
        expression: medium
        fused: false  # Independently translated via internal ribosome entry logic as per schema
        gene:
          id: mScarlet
          source: fpbase
    - terminator: BBa_B0015  # Using BBa_B0015 as a generic terminator placeholder per schema options
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21