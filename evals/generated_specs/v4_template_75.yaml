construct:
  name: "pLac_ampR_FLAG"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5  # pLac substituted with lacUV5 per available schema options
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21