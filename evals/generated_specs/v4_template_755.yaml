construct:
  name: "mCherry_HEK293_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted CMV for T7 as T7 requires T7 RNA Polymerase which is not native to HEK293
    - cistron:
        label: target
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21