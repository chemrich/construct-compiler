construct:
  name: "BFP_C_terminal_GST_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_fusion
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - solubility_tag: GST
    - terminator: BBa_B0015 # Using BBa_B0015 as a placeholder; catalog mammalian vectors typically provide bGH_polyA.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21