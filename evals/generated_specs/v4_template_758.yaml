construct:
  name: "hek293_sv40_ampr"
  host: HEK293
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: bGH_polyA  # Standard mammalian polyadenylation signal for HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21