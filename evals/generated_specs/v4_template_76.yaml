construct:
  name: "gst_yfp_yeast_expression"
  host: s_cerevisiae  # s_cerevisiae is a specific eukaryotic host; using EF1_alpha for eukaryotic expression.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: gst_yfp_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: EYFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21