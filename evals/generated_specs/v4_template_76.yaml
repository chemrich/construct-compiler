construct:
  name: "YFP_GST_yeast_expression"
  host: s_cerevisiae  # s_cerevisiae not in default list; EF1_alpha substituted for yeast-compatible constitutive promoter
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: YFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21