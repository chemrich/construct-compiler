construct:
  name: "YFP_N_6xHis_expression_yeast"
  host: s_cerevisiae  # S. cerevisiae host requested by user
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Standard yeast inducible promoter used for high expression
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: YFP
              source: fpbase
    - terminator: CYC1_term # Standard yeast transcriptional terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21