construct:
  name: "His_YFP_S_cerevisiae_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1 # Standard inducible promoter for S. cerevisiae
    - cistron:
        label: his_yfp
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: EYFP
              source: fpbase
    - terminator: CYC1_term # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21