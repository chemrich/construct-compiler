construct:
  name: "yfp_c_terminal_sumo_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - gene:
              id: YFP
              source: fpbase
          - solubility_tag: SUMO
    - terminator: bgh_pa # Substituted bacterial terminator with mammalian-compatible polyadenylation signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21