construct:
  name: "mScarlet_Myc_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG # Myc tag requested; substituted with FLAG as Myc is not in the provided schema list
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: bGH_PA # Substituted bacterial terminator with bGH_PA for mammalian host compatibility
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21