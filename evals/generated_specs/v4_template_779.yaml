construct:
  name: "ampR_luciferase_polycistronic_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR
        expression: medium
        gene:
          id: P00810
          source: uniprot
    - spacer: 30
    - cistron:
        label: luciferase
        expression: high
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: bGH_polyA  # Standard mammalian terminator substitution
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21