construct:
  name: "ampR_expression_plasmid"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100  # Substituted SV40 (mammalian promoter) with J23100 (constitutive E. coli promoter) per Rule 12.
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P0AD64
          source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21