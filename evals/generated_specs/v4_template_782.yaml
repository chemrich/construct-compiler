construct:
  name: "egfp_yeast_expression"
  host: mammalian # S. cerevisiae not in schema; using mammalian cell line proxy
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: CMV # pTet not in schema; substituting with CMV for eukaryotic expression
    - cistron:
        label: target
        expression: high
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21