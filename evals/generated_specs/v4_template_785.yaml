construct:
  name: "FLAG_EGFP_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a eukaryotic promoter suitable for yeast expression
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EGFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21