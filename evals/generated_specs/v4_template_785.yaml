construct:
  name: FLAG_EGFP_yeast_expression
  host: mammalian  # Substituted mammalian for s_cerevisiae as the closest eukaryotic host in the schema
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha  # EF1_alpha/TEF1 is a suitable eukaryotic promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: EGFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21