construct:
  name: "SV40_ampR_6xHis_fusion"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Substituted mammalian SV40 with bacterial J23100 as the host is E. coli
    - cistron:
        label: ampR_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P00810
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21