construct:
  name: "YFP_FLAG_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: yfp_flag
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
          - tag: FLAG
    - terminator: BBa_B0015 # Note: Using schema-provided terminator; a polyA signal is typically used for HEK293.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21