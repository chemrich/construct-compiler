construct:
  name: "yfp_strep_expression_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # tac promoter is used for E. coli K12 as T7 requires DE3 lysogens
    - cistron:
        label: yfp_target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: EYFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21