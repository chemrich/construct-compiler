construct:
  name: "mammalian_ampR_sv40"
  host: mammalian
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: SV40
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P00810
          source: uniprot
