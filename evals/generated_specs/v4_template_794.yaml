construct:
  name: "HA_mTagBFP2_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian polyadenylation signal
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21