construct:
  name: "bfp_gst_fusion_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac  # Substituted 'trc' with 'tac' as per allowed schema values
    - cistron:
        label: bfp_gst
        expression: high
        chain:
          - solubility_tag: GST
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21