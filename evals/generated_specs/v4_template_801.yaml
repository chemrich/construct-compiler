construct:
  name: "mCherry_SUMO_fusion_yeast"
  host: s_cerevisiae  # S. cerevisiae requested; yeast-specific components used
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: TEF1  # Using TEF1 constitutive yeast promoter
    - cistron:
        label: fusion_construct
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mCherry
              source: fpbase
    - terminator: CYC1  # Using CYC1 yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21