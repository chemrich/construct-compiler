construct:
  name: "lacZ_C_terminal_SUMO"
  host: e_coli  # s_cerevisiae is not in the supported host list; substituted with e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - gene:
              id: P00722
              source: uniprot
          - solubility_tag: SUMO
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21