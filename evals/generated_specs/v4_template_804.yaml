construct:
  name: "MBP_ampR_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Selected from allowed options as a suitable eukaryotic promoter for s_cerevisiae
    - cistron:
        label: target
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: P00810
              source: uniprot
    - terminator: BBa_B0015 # BBa_B0015 used as a generic terminator from the allowed list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21