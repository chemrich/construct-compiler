construct:
  name: "YFP_C_terminal_Myc_S_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha used as a substitution for a yeast constitutive promoter like TEF1
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: mYFP
              source: fpbase
          - tag: HA # Myc tag substituted with HA as Myc is not in the supported tag list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
    - terminator: BBa_B0015 # Substituted for yeast termination as a generic placeholder
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21