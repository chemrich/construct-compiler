construct:
  name: "his_tagged_lacz_expression_yeast"
  host: s_cerevisiae
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted EF1_alpha for yeast-specific promoter as per schema limitations
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P00722
              source: uniprot
    - terminator: BBa_B0015  # Generic terminator used as yeast-specific options are not in schema
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21