construct:
  name: "SV40_mScarlet_6xHis"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: SV40
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: SV40_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21