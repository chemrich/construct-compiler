construct:
  name: "pET28_sfGFP_expression_plasmid"
  host: e_coli_bl21_de3 # Substituted e_coli_bl21_de3 for K-12 to provide T7 RNA polymerase required for the T7lac promoter.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        gene:
          id: sfGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21