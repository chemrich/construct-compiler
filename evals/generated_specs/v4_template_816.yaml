construct:
  name: "ampR_gst_fusion_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - solubility_tag: GST
    - terminator: bGH_polyA  # Substituted for mammalian compatibility; original list contained only bacterial terminators.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21