construct:
  name: "polycistronic_ampR_mEGFP_yeast"
  host: s_cerevisiae  # User-requested host
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted for yeast-specific TEF1/GAL1 as EF1_alpha is functional in eukaryotes
    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: P0AD64
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: rrnB_T1  # Standard terminator used as yeast-specific terminators (e.g., CYC1) not in tool list
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21