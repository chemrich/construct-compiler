construct:
  name: "YFP_MBP_fusion_yeast"
  host: mammalian # S. cerevisiae not in schema; substituting with mammalian as eukaryotic proxy
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: EF1_alpha # Suitable eukaryotic promoter from available list
    - cistron:
        label: fusion_protein
        expression: high
        chain:
          - solubility_tag: MBP
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: EYFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21