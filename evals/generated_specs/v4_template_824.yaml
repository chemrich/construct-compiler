construct:
  name: "mammalian_SUMO_mScarlet"
  host: mammalian

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: rrnB_T1  # Using rrnB_T1 as a generic terminator per schema options

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21