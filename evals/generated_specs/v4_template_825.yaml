construct:
  name: "mScarlet_expression_e_coli_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: J23100 # Substituted SV40 (mammalian) with J23100 (E. coli constitutive) as host is E. coli
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21