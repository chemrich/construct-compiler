construct:
  name: "yfp_myc_fusion"
  host: e_coli_bl21_de3  # Substituted for T7 RNA polymerase compatibility required by the T7lac promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
          - tag: Myc  # Myc tag fused to the C-terminus of EYFP
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21