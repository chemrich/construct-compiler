construct:
  name: "HEK293_mTagBFP2_Strep"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_expression
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: SV40_polyA

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21