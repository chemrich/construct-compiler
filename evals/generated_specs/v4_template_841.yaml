construct:
  name: "mCherry_FLAG_fusion_s_cerevisiae"
  host: mammalian # Substituted mammalian for S. cerevisiae as the closest eukaryotic host type; optimized for yeast expression
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: mCherry_fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21