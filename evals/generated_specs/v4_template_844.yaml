construct:
  name: "mScarlet_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: SV40_polyA # Substituted bacterial terminator with SV40_polyA for HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21