construct:
  name: "mTagBFP2_StrepII_fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_fusion
        expression: high
        chain:
          - gene:
              id: mTagBFP2
              source: fpbase
          - tag: Strep-II
    - terminator: bGH_pA  # Substituted prokaryotic terminator for mammalian bGH polyA signal to ensure expression in HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21