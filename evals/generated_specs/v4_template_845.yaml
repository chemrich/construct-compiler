construct:
  name: "hek293_bfp_strep_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_strep
        expression: high
        chain:
          - tag: Strep-II
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21