construct:
  name: "lacZ_6xHis_yeast_expression"
  host: mammalian # Substituted mammalian for s_cerevisiae to provide a eukaryotic context as yeast is not in the controlled vocabulary.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituted EF1_alpha as a eukaryotic promoter suitable for yeast expression.
    - cistron:
        label: target_lacZ
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21