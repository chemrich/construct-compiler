construct:
  name: lacZ_his_tagged_construct
  host: e_coli_bl21 # Substituted s_cerevisiae with e_coli_bl21 as yeast is not in the supported host list
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: lacZ
              source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21