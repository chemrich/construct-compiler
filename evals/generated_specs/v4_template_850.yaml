construct:
  name: "ampR_EGFP_yeast_polycistronic"
  host: mammalian # Substituted mammalian for s_cerevisiae as it is the closest eukaryotic host in the schema; EF1_alpha used as the eukaryotic promoter.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: selection
        expression: medium
        gene:
          id: P62593
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21