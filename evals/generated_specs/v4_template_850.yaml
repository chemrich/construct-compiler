construct:
  name: "ampR_EGFP_polycistronic_yeast_sub"
  host: e_coli  # Host s_cerevisiae is not in the supported list; substituted with e_coli as the schema's polycistronic spacer architecture is prokaryotic.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: selection_marker
        expression: medium
        gene:
          id: P62593
          source: uniprot
    - spacer: 30
    - cistron:
        label: fluorescence_reporter
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21