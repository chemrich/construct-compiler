construct:
  name: "ampR_lacZ_polycistronic_expression"
  host: e_coli_bl21
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR
        expression: medium
        gene:
          id: P62593
          source: uniprot
    - spacer: 30
    - cistron:
        label: lacZ
        expression: medium
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21