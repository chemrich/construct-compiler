construct:
  name: "ampR_myc_expression"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
    resistance: kanamycin
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR_protein
        expression: high
        chain:
          - tag: Myc
          - gene:
              id: P62593
              source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21