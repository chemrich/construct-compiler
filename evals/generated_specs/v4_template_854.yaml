construct:
  name: egfp_c_myc_k12
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Defaulted to T7lac; note: e_coli_k12 requires T7 polymerase expression for this promoter
    - cistron:
        label: egfp_myc
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
          - tag: Myc
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21