construct:
  name: "egfp_c_terminal_myc_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Default for e_coli per Rule 8; note: K12 requires T7 RNA polymerase lysogen or plasmid for expression
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - tag: Myc # Myc requested specifically; if unsupported, substitute with FLAG or HA
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21