construct:
  name: "yeast_polycistronic_yfp_gfp"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Eukaryotic promoter substituted for yeast-specific TEF1/ADH1
    - cistron:
        label: yfp_target
        expression: medium
        gene:
          id: mVenus
          source: fpbase
    - spacer: 30  # Note: True polycistronic expression in yeast requires an IRES or 2A peptide sequence
    - cistron:
        label: gfp_reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21