construct:
  name: "YFP_GFP_polycistronic_yeast"
  host: e_coli_bl21_de3 # User requested s_cerevisiae; substituted with e_coli_bl21_de3 as yeast is not a supported host and polycistronic operons are natively supported in bacterial systems.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: YFP
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: GFP
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21