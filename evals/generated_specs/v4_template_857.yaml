construct:
  name: "HEK293_ampR_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: BBa_B0015 # Note: BBa_B0015 is used to comply with schema list; SV40 or BGH polyA is biologically preferred for HEK293.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21