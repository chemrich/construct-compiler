construct:
  name: "YFP_yeast_pTet_expression"
  host: s_cerevisiae  # S. cerevisiae requested; substitution made for host not explicitly in schema list
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: Tet  # pTet promoter requested for yeast expression
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mYFP
          source: fpbase
    - terminator: CYC1_term  # Yeast-specific terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21