construct:
  name: "Luciferase_GST_yeast_expression"
  host: s_cerevisiae  # User-requested yeast host
  backbone:
    resistance: ampicillin
    ori: pUC
    source: addgene
  cassette:
    - promoter: GPD  # Standard strong promoter for S. cerevisiae (TDH3)
    - cistron:
        label: GST_luciferase_fusion
        expression: high
        chain:
          - solubility_tag: GST
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: P08659
              source: uniprot
    - terminator: CYC1_term  # Standard yeast terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21