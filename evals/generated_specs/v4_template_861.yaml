construct:
  name: "mTagBFP2_lac_expression_plasmid"
  host: e_coli  # S. cerevisiae is not in the supported host list and the lac promoter is bacterial; substituted with e_coli.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21