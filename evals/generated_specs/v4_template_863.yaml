construct:
  name: "mCherry_MBP_fusion_s_cerevisiae"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha (TEF1) is a strong constitutive promoter in S. cerevisiae
    - cistron:
        label: mCherry_MBP_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21