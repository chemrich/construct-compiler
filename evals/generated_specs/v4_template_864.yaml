construct:
  name: "T7_ampR_Myc_fusion"
  host: e_coli_bl21_de3
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: HA  # Myc requested; HA substituted as Myc is not in the permitted schema list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA)
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21