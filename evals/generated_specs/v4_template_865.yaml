construct:
  name: "yeast_polycistronic_luciferase_gfp"
  host: mammalian # Substituted s_cerevisiae with mammalian as it is the closest eukaryotic host available in the schema
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: EF1_alpha # Eukaryotic promoter suitable for yeast substitution
    - cistron:
        label: luciferase
        expression: high
        gene:
          id: P08659
          source: uniprot
    - spacer: 30
    - cistron:
        label: reporter
        expression: medium
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21