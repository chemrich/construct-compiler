construct:
  name: "rfp_myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: T7lac
    - cistron:
        label: rfp_myc_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - tag: HA # Myc tag is not in the schema-supported list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA); substituted with HA as a comparable epitope tag.
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21