construct:
  name: "lacZ_yeast_expression"
  host: s_cerevisiae  # Rule 13: Using specific cell line name
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha is selected as a reasonable eukaryotic promoter for yeast
    - cistron:
        label: lacZ_fusion
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: lacZ
              source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21