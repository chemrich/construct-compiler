construct:
  name: "yfp_ampr_polycistronic"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: yfp_protein
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: ampr_protein
        expression: medium
        fused: false
        gene:
          id: P00810
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21