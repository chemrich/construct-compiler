construct:
  name: "YFP_T7_Expression_Plasmid"
  host: e_coli_bl21_de3  # S. cerevisiae is not in the supported host list and the T7 promoter requires T7 RNA polymerase; substituted with e_coli_bl21_de3.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: mVenus
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21