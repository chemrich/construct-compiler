construct:
  name: "yfp_t7_yeast_substitution_construct"
  host: e_coli_bl21_de3  # S. cerevisiae is not in the supported host list; substituted with E. coli BL21(DE3) to support the T7 promoter request.
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7
    - cistron:
        label: yfp_reporter
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21