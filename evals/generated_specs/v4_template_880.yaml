construct:
  name: "mscarlet_lacz_yeast_polycistronic"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituted EF1_alpha as a eukaryotic promoter suitable for yeast expression
    - cistron:
        label: reporter_1
        expression: medium
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30
    - cistron:
        label: enzyme_2
        expression: medium
        fused: false
        gene:
          id: P00722
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21