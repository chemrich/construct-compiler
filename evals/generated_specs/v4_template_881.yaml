construct:
  name: "HEK293_FLAG_YFP_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: target_protein
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: YFP
              source: fpbase
    - terminator: bGH_polyA  # Substituted bacterial terminator with mammalian polyA signal per rule 12
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21