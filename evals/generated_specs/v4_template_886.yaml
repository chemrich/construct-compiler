construct:
  name: "ampR_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # Substituted T7lac with CMV; T7lac is a bacterial promoter and will not function in HEK293 cells without T7 RNA polymerase.
    - cistron:
        label: ampR
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: SV40_polyA # Substituted bacterial terminator with SV40 polyA signal to ensure proper polyadenylation in mammalian cells.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21