construct:
  name: "mammalian_ampR_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV  # Substituted CMV for T7lac as T7lac is a bacterial promoter and will not function in HEK293 without T7 polymerase.
    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: P00810
          source: uniprot
    - terminator: bGH_pA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21