construct:
  name: "lacZ_c_terminal_flag"
  host: e_coli  # e_coli_k12 mapped to e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: FLAG  # Myc tag requested but not in supported list (6xHis, 8xHis, Strep-II, Twin-Strep, FLAG, HA); substituted with FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21