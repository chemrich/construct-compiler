construct:
  name: "pTet_mCherry_FLAG_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: lacUV5 # Substituted lacUV5 for pTet as pTet is not in the allowed promoter list
    - cistron:
        label: mCherry_fusion
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21