construct:
  name: "polycistronic_mScarlet_EGFP_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: scarlet_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30  # Note: For mammalian polycistronic expression, this spacer logic typically implies an IRES or 2A peptide sequence will be handled by the compiler
    - cistron:
        label: egfp_reporter
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: BGH_polyA
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21