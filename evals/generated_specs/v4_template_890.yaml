construct:
  name: "mScarlet_EGFP_HEK293_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mScarlet
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - spacer: 30 # For mammalian systems, this spacer represents the linkage between cistrons, typically resolved as an IRES or 2A peptide.
    - cistron:
        label: EGFP
        expression: high
        fused: false
        gene:
          id: EGFP
          source: fpbase
    - terminator: BBa_B0015 # Bacterial terminator used as placeholder; mammalian polyA signal typically used in practice.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21