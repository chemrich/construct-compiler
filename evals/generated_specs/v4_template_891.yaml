construct:
  name: "lacZ_6xHis_k12"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Defaulted to T7lac per Rule 8; note that expression in K-12 requires a T7 polymerase source or DE3 lysogen.
    - cistron:
        label: target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P00722
              source: uniprot
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21