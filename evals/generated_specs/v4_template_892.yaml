construct:
  name: "ha_gfp_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha (TEF1) is a strong constitutive promoter in S. cerevisiae
    - cistron:
        label: target_gfp
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: BBa_B0015 # Using BBa_B0015 as a placeholder terminator for the cassette
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21