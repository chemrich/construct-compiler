construct:
  name: "hek293_mbp_ampr_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mbp_ampr_fusion
        expression: high
        chain:
          - solubility_tag: MBP
          - gene:
              id: P00810
              source: uniprot
    - terminator: BGH_polyA  # Substituted bacterial terminator with mammalian BGH polyA for HEK293 host
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21