construct:
  name: "Strep_YFP_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: GAL1  # Substituted GAL1 for yeast expression as yeast was requested
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: YFP
              source: fpbase
    - terminator: CYC1_term  # Substituted yeast terminator CYC1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21