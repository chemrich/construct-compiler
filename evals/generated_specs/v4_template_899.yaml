construct:
  name: "Strep_YFP_yeast_expression"
  host: mammalian # s_cerevisiae is not in the supported host list; substituted with mammalian for eukaryotic expression compatibility
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # Substituted for a eukaryotic-compatible promoter from the spec
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: YFP
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21