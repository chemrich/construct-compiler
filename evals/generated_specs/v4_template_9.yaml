construct:
  name: "trc_yfp_myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # trc is not in the schema list; substituted with functionally similar tac promoter
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: YFP
              source: fpbase
          - tag: FLAG  # Myc is not in the allowed tag list; substituted with FLAG
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21