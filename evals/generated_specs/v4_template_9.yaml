construct:
  name: "trc_YFP_Myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # trc substituted with tac as it is the closest functional analog in the schema
    - cistron:
        label: "target_fusion"
        expression: high
        chain:
          - gene:
              id: "EYFP"
              source: fpbase
          - tag: "Myc"
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21