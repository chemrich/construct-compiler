construct:
  name: "polycistronic_egfp_yfp_proxy"
  host: e_coli_bl21_de3 # S. cerevisiae is not a supported host in the current schema; substituted with E. coli BL21(DE3)
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_cistron
        expression: high
        gene:
          id: mEGFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: yfp_cistron
        expression: high
        fused: false
        gene:
          id: EYFP
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21