construct:
  name: "ampR_YFP_polycistronic_expression"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: selection_marker
        expression: high
        gene:
          id: ampR
          source: uniprot
    - spacer: 30
    - cistron:
        label: fluorescent_reporter
        expression: medium
        fused: false
        gene:
          id: YFP
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21