construct:
  name: "mammalian_sumo_lacz_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: sumo_lacz
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: lacZ
              source: uniprot
    - terminator: BBa_B0015  # Using standard terminator; note that for HEK293 a polyA signal is typically required.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21