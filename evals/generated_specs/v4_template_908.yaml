construct:
  name: "luciferase_ha_expression_hek293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase_ha
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: HA
    - terminator: bGH_polyA # Substituted for mammalian polyadenylation signal as suggested terminators are bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21