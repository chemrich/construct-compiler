construct:
  name: "luciferase_myc_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin  # Defaulting to kanamycin per instructions
    ori: pUC
    source: addgene
  cassette:
    - promoter: GAL1  # Substituted GAL1 as a standard S. cerevisiae inducible promoter
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc  # Specifically requested tag
          - gene:
              id: P08659
              source: uniprot
    - terminator: CYC1  # Substituted CYC1 as a standard S. cerevisiae terminator
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21