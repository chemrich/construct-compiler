construct:
  name: "pBAD_sfGFP_Strep_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: araBAD
    - cistron:
        label: target
        expression: medium
        chain:
          - gene:
              id: sfGFP
              source: fpbase
          - tag: Strep-II
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21