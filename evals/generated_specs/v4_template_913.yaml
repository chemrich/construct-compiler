construct:
  name: "pTet_RFP_HA_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac # Substituting pTet with tac as pTet is not in the provided schema list; tac allows for inducible expression in E. coli.
    - cistron:
        label: rfp_ha_fusion
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mCherry
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21