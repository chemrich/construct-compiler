construct:
  name: "Luciferase_FLAG_Fusion"
  host: mammalian # S. cerevisiae host not in schema; mammalian substituted as the eukaryotic host option.
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase_fusion
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: FLAG
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21