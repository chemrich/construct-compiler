construct:
  name: "mScarlet_SUMO_fusion"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted EF1_alpha for yeast compatibility as CMV/T7 are not ideal for S. cerevisiae
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21