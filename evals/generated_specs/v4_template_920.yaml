construct:
  name: "ampR_c_flag_expression"
  host: e_coli_bl21  # Note: T7-based expression in BL21 typically requires the DE3 lysogen (e_coli_bl21_de3)
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: ampR_c_flag
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: FLAG
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21