construct:
  name: "HEK293_polycistronic_YFP_EGFP"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: yfp
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: egfp
        expression: high
        fused: false
        gene:
          id: mEGFP
          source: fpbase
    - terminator: bGH_polyA # Substituted for mammalian compatibility; polycistronic expression via spacer/fused:false assumes IRES or similar recruitment logic
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21