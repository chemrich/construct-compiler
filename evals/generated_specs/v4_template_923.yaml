construct:
  name: "lacZ_expression_plasmid"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac # Substituted T7lac for requested CMV as host is e_coli_bl21 (DE3) and CMV is a mammalian promoter.
    - cistron:
        label: lacZ_expression
        expression: high
        gene:
          id: P00722
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21