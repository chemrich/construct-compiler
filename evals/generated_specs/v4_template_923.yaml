construct:
  name: "lacZ_expression_in_e_coli"
  host: e_coli_bl21
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # User requested CMV, but CMV is a mammalian promoter. Substituted with T7lac for E. coli expression.
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21