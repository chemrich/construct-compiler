construct:
  name: "GFP_Strep_fusion_K12"
  host: e_coli  # Defaulted to e_coli as e_coli_k12 is a sub-strain of this category
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac  # Default for e_coli per Rule 8; requires a DE3-compatible strain
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21