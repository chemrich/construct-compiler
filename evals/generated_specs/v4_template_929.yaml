construct:
  name: "mTagBFP2_6xHis_Fusion_HEK293"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_fusion
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: mTagBFP2
              source: fpbase
    - terminator: bGH_polyA  # Standard mammalian terminator for HEK293 expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21