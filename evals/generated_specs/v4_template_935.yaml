construct:
  name: "lacZ_myc_hek293_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Myc # Myc tag requested by user
          - gene:
              id: P00722
              source: uniprot
    - terminator: BGH_pA # Using BGH_pA as a mammalian-appropriate terminator substitute for the bacterial options listed
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21