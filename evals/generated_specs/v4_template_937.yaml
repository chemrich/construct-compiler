construct:
  name: "HEK293_EYFP_MYC_Fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: target_fusion
        expression: high
        chain:
          - gene:
              id: EYFP
              source: fpbase
          - linker:
              type: GS_flexible
              repeats: 2
          - gene:
              id: MYC
              source: uniprot
    - terminator: BGH_pA # Using mammalian BGH polyA signal as the provided examples were bacterial
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21