construct:
  name: "polycistronic_yfp_mscarlet_expression"
  host: e_coli_bl21_de3
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: yfp_cistron
        expression: high
        gene:
          id: EYFP
          source: fpbase
    - spacer: 30
    - cistron:
        label: mscarlet_cistron
        expression: high
        fused: false
        gene:
          id: mScarlet
          source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21