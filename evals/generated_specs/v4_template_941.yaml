construct:
  name: "rfp_n_strep_ecoli"
  host: e_coli
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_rfp
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21