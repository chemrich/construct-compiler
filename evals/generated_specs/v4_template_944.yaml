construct:
  name: "ampR_6xHis_mammalian_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_target
        expression: high
        chain:
          - tag: 6xHis
          - gene:
              id: P62593
              source: uniprot
    - terminator: BBa_B0015 # Using BBa_B0015 as a generic terminator placeholder; typically a PolyA signal is used in mammalian systems.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21