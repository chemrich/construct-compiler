construct:
  name: "SUMO_mCherry_yeast_expression"
  host: s_cerevisiae  # S. cerevisiae requested; using EF1_alpha and BBa_B0015 for eukaryotic expression compatibility
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: SUMO_RFP_fusion
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: mCherry
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21