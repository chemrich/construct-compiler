construct:
  name: "hek293_polycistronic_bfp_luciferase"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: bfp_reporter
        expression: high
        gene:
          id: mTagBFP2
          source: fpbase
    - spacer: 30 # Using DNA spacer as requested; note that in HEK293, polycistronic expression typically requires an IRES or 2A peptide.
    - cistron:
        label: luciferase_reporter
        expression: medium
        fused: false
        gene:
          id: P08659
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21