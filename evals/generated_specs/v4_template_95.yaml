construct:
  name: "rfp_c_terminal_gst_mammalian"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: rfp_fusion
        expression: high
        chain:
          - gene:
              id: mScarlet
              source: fpbase
          - solubility_tag: GST
    - terminator: BBa_B0015  # Using BBa_B0015 as a placeholder terminator from the schema; in practice, a polyA signal is used for HEK293.
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21