construct:
  name: "ampR_yeast_expression_cterm_flag"
  host: s_cerevisiae  # host set to s_cerevisiae per user request; EF1_alpha promoter used for eukaryotic expression
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: ampR_c_flag
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - tag: FLAG
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21