construct:
  name: "trc_rfp_ha_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
  cassette:
    - promoter: tac  # trc is not in the allowed schema; tac used as a functionally near-identical substitute
    - cistron:
        label: rfp_ha
        expression: high
        chain:
          - gene:
              id: mCherry
              source: fpbase
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21