construct:
  name: "hek293_lacZ_sumo_fusion"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
    resistance: kanamycin
  cassette:
    - promoter: CMV
    - cistron:
        label: lacZ_target
        expression: high
        chain:
          - solubility_tag: SUMO
          - gene:
              id: P00722
              source: uniprot
    - terminator: BBa_B0015 # BBa_B0015 is bacterial, but selected from allowed schema list for mammalian expression
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21