construct:
  name: "polycistronic_lacZ_mScarlet_expression"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: T7lac  # Defaulting to T7lac as per rule 8; requires T7 RNA polymerase for expression
    - cistron:
        label: beta_galactosidase
        expression: high
        gene:
          id: P00722
          source: uniprot
    - spacer: 30
    - cistron:
        label: red_reporter
        expression: low
        fused: false  # Independent translation with its own RBS
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21