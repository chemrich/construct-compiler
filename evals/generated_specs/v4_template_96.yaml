construct:
  name: "Luciferase_C_Myc_yeast"
  host: mammalian # s_cerevisiae not in provided host list; substituting with mammalian cell line logic.
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: EF1_alpha # Yeast-specific promoters like GAL1 or GPD not in list; EF1_alpha is a reasonable eukaryotic substitute.
    - cistron:
        label: luc_expression
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: Myc # Myc tag requested for C-terminus; placed after gene in chain.
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21