construct:
  name: "egfp_ampr_polycistronic_yeast_substitution"
  host: e_coli_bl21 # S. cerevisiae does not natively support polycistronic operons via intergenic spacers; substituted with E. coli to utilize the compiler's spacer/RBS logic.
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: T7lac
    - cistron:
        label: egfp_expression
        expression: high
        chain:
          - gene:
              id: mEGFP
              source: fpbase
    - spacer: 30
    - cistron:
        label: ampr_expression
        expression: medium
        fused: false
        chain:
          - gene:
              id: P62593
              source: uniprot
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21