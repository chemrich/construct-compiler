construct:
  name: "mammalian_ptet_rfp"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: TRE # Substituted pTet with TRE (Tet-Response Element) which is the standard mammalian inducible promoter
    - cistron:
        label: rfp_reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: bGH_pA # Substituted for mammalian compatibility as listed examples were prokaryotic
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21