construct:
  name: "mScarlet_pLac_expression_plasmid"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: lacUV5 # Substituting requested pLac with lacUV5 for standard E. coli expression
    - cistron:
        label: reporter
        expression: high
        gene:
          id: mScarlet
          source: fpbase
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21