construct:
  name: "mScarlet_HA_yeast_expression"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a constitutive eukaryotic promoter for S. cerevisiae
    - cistron:
        label: reporter
        expression: high
        chain:
          - tag: HA
          - gene:
              id: mScarlet
              source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BpiI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21