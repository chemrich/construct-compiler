construct:
  name: "trc_ampR_6xHis"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac  # Substituted trc with tac for schema compatibility
    - cistron:
        label: ampR_target
        expression: high
        chain:
          - gene:
              id: P00810
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21