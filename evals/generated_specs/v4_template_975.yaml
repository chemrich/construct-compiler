construct:
  name: "trc_ampR_6xHis_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: tac # trc promoter substituted with tac for schema compatibility
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: P62593
              source: uniprot
          - tag: 6xHis
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21