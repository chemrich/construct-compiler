construct:
  name: "luciferase_c_his_expression"
  host: e_coli_bl21_de3  # Upgraded to DE3 for compatibility with T7lac promoter
  backbone:
    catalog_vector: "pET-28b(+)"
  cassette:
    - promoter: T7lac
    - cistron:
        label: target_luciferase
        expression: high
        chain:
          - gene:
              id: P08659
              source: uniprot
          - tag: 6xHis
    - terminator: T7term
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21