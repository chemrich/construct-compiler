construct:
  name: "ptet_egfp_myc_fusion"
  host: e_coli
  backbone:
    resistance: kanamycin
    ori: pBR322
    source: addgene
  cassette:
    - promoter: araBAD  # pTet is not in the schema list; substituting with araBAD as an inducible E. coli promoter.
    - cistron:
        label: target
        expression: high
        chain:
          - gene:
              id: EGFP
              source: fpbase
          - tag: FLAG  # Myc tag is not in the schema list; substituting with FLAG.
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21