construct:
  name: "strep_megfp_s_cerevisiae"
  host: s_cerevisiae  # S. cerevisiae specified; using eukaryotic-compatible elements
  backbone:
    resistance: kanamycin # Default per rule 9
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha # EF1_alpha is a strong constitutive promoter functional in yeast
    - cistron:
        label: target
        expression: high
        chain:
          - tag: Strep-II
          - gene:
              id: mEGFP
              source: fpbase
    - terminator: CYC1_term # Substituting yeast-appropriate terminator for bacterial options in schema
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21