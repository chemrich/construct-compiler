construct:
  name: "hek293_mcherry_bfp_polycistronic"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: mCherry_reporter
        expression: high
        gene:
          id: mCherry
          source: fpbase
    - spacer: 30
    - cistron:
        label: bfp_reporter
        expression: high
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: bGH_polyA  # Substituted mammalian terminator for functionality in HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21