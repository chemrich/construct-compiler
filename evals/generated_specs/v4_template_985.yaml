construct:
  name: "hek293_firefly_luciferase_flag"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV
    - cistron:
        label: luciferase
        expression: high
        chain:
          - tag: FLAG
          - gene:
              id: P08659
              source: uniprot
    - terminator: bGH_polyA

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21