construct:
  name: "cmv_ampr_6xhis"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV
    - cistron:
        label: ampR_fusion
        expression: high
        chain:
          - gene:
              id: P0AD64
              source: uniprot
          - tag: 6xHis
    - terminator: bgh_pa # Substituted mammalian BGH polyA for bacterial terminators as host is HEK293
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21