construct:
  name: "yeast_polycistronic_yfp_bfp"
  host: s_cerevisiae  # Host substituted to yeast as requested
  backbone:
    resistance: kanamycin
    ori: 2_micron  # High-copy yeast origin
    source: addgene
  cassette:
    - promoter: EF1_alpha  # EF1_alpha used as a eukaryotic promoter substitute for TEF1/yeast equivalent
    - cistron:
        label: yfp_expression
        expression: high
        gene:
          id: mVenus
          source: fpbase
    - spacer: 30
    - cistron:
        label: bfp_expression
        expression: high
        fused: false  # Independently translated cistron
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: rrnB_T1  # Substitution for yeast terminator (e.g., CYC1_term) as per tool limits
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21