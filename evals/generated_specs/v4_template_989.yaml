construct:
  name: "yeast_polycistronic_yfp_bfp"
  host: s_cerevisiae
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha  # Substituted EF1_alpha as a eukaryotic promoter proxy for S. cerevisiae
    - cistron:
        label: yfp_reporter
        expression: medium
        gene:
          id: mVenus
          source: fpbase
    - spacer: 30
    - cistron:
        label: bfp_reporter
        expression: medium
        fused: false
        gene:
          id: mTagBFP2
          source: fpbase
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21