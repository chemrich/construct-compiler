construct:
  name: "hek293_lacz_expression"
  host: HEK293

  backbone:
    catalog_vector: "pTwist CMV"

  cassette:
    - promoter: CMV  # Substituted CMV for pLac because pLac is a bacterial promoter and will not function in HEK293 cells.
    - cistron:
        label: lacZ_reporter
        gene:
          id: P00722
          source: uniprot
    - terminator: BBa_B0015

  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6

  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21