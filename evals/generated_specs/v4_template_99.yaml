construct:
  name: "HEK293_lacZ_expression"
  host: HEK293
  backbone:
    catalog_vector: "pTwist CMV"
  cassette:
    - promoter: CMV # pLac is a bacterial promoter and non-functional in HEK293; substituted with CMV for mammalian expression.
    - cistron:
        label: lacZ_target
        expression: high
        gene:
          id: lacZ
          source: uniprot
    - terminator: BBa_B0015
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21