construct:
  name: "lacZ_HA_fusion_yeast"
  host: s_cerevisiae  # s_cerevisiae substituted for mammalian; using EF1_alpha promoter for eukaryotic expression
  backbone:
    resistance: kanamycin
    ori: pUC
    source: addgene
  cassette:
    - promoter: EF1_alpha
    - cistron:
        label: lacZ_HA
        expression: high
        chain:
          - gene:
              id: lacZ
              source: uniprot
          - tag: HA
    - terminator: rrnB_T1
  constraints:
    assembly: golden_gate
    enzyme: BsaI
    codon_optimization: local
    gc_window: [0.35, 0.65]
    max_homopolymer: 6
  synthesis:
    vendor: twist
    budget_per_gene: 400
    max_turnaround_days: 21