prompts:
- prompt: I need to express my therapeutic protein (let's call it 'GOI-X') in mammalian
    cells. Think of it like a mini-gene cassette for AAV, but just for protein production
    in HEK cells. I want a strong, constitutive promoter, maybe like CMV, followed
    by GOI-X and a standard polyA tail. No ITRs or packaging signals needed, just
    the core expression unit.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CMV_promoter
    - PolyA_signal
  id: industry_vet_0
  category: persona_industry_vet
  difficulty: medium
- prompt: Alright, trying this *E. coli* thing for bulk protein. I need to make a
    lot of my 'Capsid_Fragment_Y' for antibody production. It needs a strong bacterial
    promoter, a ribosomal binding site, the gene, and a C-terminal His-tag for purification.
    And a terminator, of course. Keep it simple, efficient.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Bacterial_promoter
    - RBS
    - His_tag
    - Bacterial_terminator
  id: industry_vet_1
  category: persona_industry_vet
  difficulty: medium
- prompt: Some of my AAV-delivered proteins need specific post-translational mods.
    For this new 'Glyco_Protein_Z', I'm thinking *Saccharomyces cerevisiae*. I need
    a strong constitutive yeast promoter (like GPD or ADH1), the protein sequence,
    and something to ensure proper secretion and maybe even a C-terminal affinity
    tag like FLAG. And a proper yeast terminator.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Yeast_promoter
    - Secretion_signal
    - FLAG_tag
    - Yeast_terminator
  id: industry_vet_2
  category: persona_industry_vet
  difficulty: medium
- prompt: In AAV, we often use 2A peptides for expressing multiple genes from one
    transcript. Can I do that here? I want to express two proteins, 'Reporter_GFP'
    and 'Therapeutic_Enzyme', in mammalian cells, separated by a P2A sequence. Use
    a strong mammalian promoter and a single polyA for both.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - Mammalian_promoter
    - P2A_peptide
    - PolyA_signal
  id: industry_vet_3
  category: persona_industry_vet
  difficulty: medium
- prompt: Sometimes the GOI is a bit toxic, like some of our capsid components when
    overexpressed. I need an inducible system for 'Toxic_Factor_A' in mammalian cells.
    A Tet-on system seems appropriate, so the construct should include the Tet-responsive
    promoter and the gene, plus a polyA. I'll provide the transactivator separately.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Tet_responsive_promoter
    - PolyA_signal
  id: industry_vet_4
  category: persona_industry_vet
  difficulty: medium
- prompt: "Trying to express a particularly stubborn AAV Rep protein fragment in *E.\
    \ coli* \u2013 it keeps aggregating. I need a bacterial construct with a strong\
    \ promoter, RBS, followed by a N-terminal NusA or MBP tag fused to 'Rep_Fragment_B',\
    \ with a TEV cleavage site in between, and a C-terminal His-tag. Plus a terminator."
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Bacterial_promoter
    - RBS
    - Solubility_tag
    - TEV_cleavage_site
    - His_tag
    - Bacterial_terminator
  id: industry_vet_5
  category: persona_industry_vet
  difficulty: medium
- prompt: I have a secreted therapeutic protein, 'Secreted_Therapy_C', that I want
    to produce in CHO cells. I need a mammalian expression vector with a strong constitutive
    promoter, a signal peptide for secretion, the gene, and a C-terminal V5 tag for
    detection. Standard polyA, of course.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - Secretion_signal
    - V5_tag
    - PolyA_signal
  id: industry_vet_6
  category: persona_industry_vet
  difficulty: medium
- prompt: We're screening new tissue-specific promoters for AAV. Can you build a construct
    for mammalian cells where a candidate promoter drives 'Luciferase' expression,
    followed by a polyA? I want to swap out the promoter easily.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Promoter_placeholder
    - Luciferase
    - PolyA_signal
  id: industry_vet_7
  category: persona_industry_vet
  difficulty: medium
- prompt: Instead of 2A, sometimes we use IRES for bicistronic expression in AAV.
    Can you make a mammalian construct with a CMV promoter driving 'Protein_D', followed
    by an IRES, then 'Protein_E', and a single polyA?
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - CMV_promoter
    - IRES
    - PolyA_signal
  id: industry_vet_8
  category: persona_industry_vet
  difficulty: medium
- prompt: To mimic regulated turnover of some AAV components, I want to express 'Short_Lived_Protein_F'
    in mammalian cells. Use a strong promoter, the protein sequence, and a C-terminal
    PEST sequence for rapid degradation, followed by a polyA.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - PEST_sequence
    - PolyA_signal
  id: industry_vet_9
  category: persona_industry_vet
  difficulty: medium
- prompt: For some protein domains (like parts of the AAV VP proteins), we just need
    to get them expressed, even if they're in inclusion bodies, and then refold them.
    I need a super strong bacterial promoter (like T7), RBS, 'Insoluble_Domain_G',
    and a terminator. No tags needed for this one, as it's for refolding.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - T7_promoter
    - RBS
    - Bacterial_terminator
  id: industry_vet_10
  category: persona_industry_vet
  difficulty: medium
- prompt: We always codon-optimize our AAV transgenes for human expression. Can you
    generate a construct for 'Bacterial_Origin_Protein_H' in mammalian cells? Make
    sure the gene is codon-optimized for human expression, driven by a strong promoter,
    and has a standard polyA.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - Codon_optimization
    - PolyA_signal
  id: industry_vet_11
  category: persona_industry_vet
  difficulty: medium
- prompt: 'I need to produce a secreted protein ''Extracellular_Domain_I'' from mammalian
    cells, with an N-terminal Strep-tag for purification. So, it should be: mammalian
    promoter, signal peptide, Strep-tag, the protein, and a polyA. The Strep-tag needs
    to be *after* the signal peptide for it to be present in the secreted protein.'
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - Secretion_signal
    - Strep_tag
    - PolyA_signal
  id: industry_vet_12
  category: persona_industry_vet
  difficulty: medium
- prompt: To find new interaction partners for an AAV scaffold protein, 'Scaffold_Protein_J',
    I need a yeast two-hybrid bait construct. This means a yeast promoter, the GAL4
    DNA binding domain (DBD) fused to my 'Scaffold_Protein_J', and a yeast terminator.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Yeast_promoter
    - GAL4_DBD
    - Yeast_terminator
  id: industry_vet_13
  category: persona_industry_vet
  difficulty: medium
- prompt: While not a protein, sometimes we need to express guide RNAs (gRNAs) alongside
    our AAV delivered nucleases. Can you design a mammalian construct for expressing
    a U6-driven sgRNA ('sgRNA_K')? Just the U6 promoter, the sgRNA sequence, and a
    terminator. No polyA needed for Pol III transcripts.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - U6_promoter
    - sgRNA_sequence
    - Pol_III_terminator
  id: industry_vet_14
  category: persona_industry_vet
  difficulty: medium
- prompt: I'm trying to express a difficult AAV packaging factor, 'Packaging_Factor_L',
    in *E. coli*. It's known to misfold. Can you design a construct that co-expresses
    it with a bacterial chaperone like GroEL/GroES? Maybe use two separate promoters
    or an operon-like structure. Both proteins need N-terminal His-tags.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - Bacterial_promoter
    - RBS
    - His_tag
    - Chaperone_gene
    - Bacterial_terminator
  id: industry_vet_15
  category: persona_industry_vet
  difficulty: medium
- prompt: Just like in AAV, we often use WPRE for enhanced expression. I need a construct
    for 'Enhanced_Protein_M' in mammalian cells, driven by a CMV promoter, followed
    by the gene, a WPRE, and then a polyA. Get me maximum yield!
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CMV_promoter
    - WPRE
    - PolyA_signal
  id: industry_vet_16
  category: persona_industry_vet
  difficulty: medium
- prompt: We're exploring non-viral delivery of therapeutic proteins. Can I fuse 'Therapeutic_Protein_N'
    to a cell-penetrating peptide (CPP) like TAT or Antp? I need a mammalian expression
    construct with a strong promoter, the CPP sequence fused N-terminally to my protein,
    and a standard polyA.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - Cell_penetrating_peptide
    - PolyA_signal
  id: industry_vet_17
  category: persona_industry_vet
  difficulty: medium
- prompt: For screening new antibody fragments against an AAV capsid epitope, 'Capsid_Epitope_P',
    I want to try yeast surface display. The construct should have a yeast promoter,
    a secretion signal, the antibody fragment fused to Aga2p, and a yeast terminator.
    Also include a C-terminal Myc tag for detection of the fusion.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Yeast_promoter
    - Secretion_signal
    - Aga2p_fusion
    - Myc_tag
    - Yeast_terminator
  id: industry_vet_18
  category: persona_industry_vet
  difficulty: medium
- prompt: Some of our AAV helper functions (like Rep proteins) need to go straight
    to the nucleus. For a protein expression study of 'Nuclear_Factor_Q', I need a
    mammalian construct with a strong promoter, an N-terminal NLS, the protein, and
    a polyA tail.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Mammalian_promoter
    - NLS_tag
    - PolyA_signal
  id: industry_vet_19
  category: persona_industry_vet
  difficulty: medium
- prompt: I need to express my GOI in E. coli at high levels. Think of it like a viral
    expression cassette, but for bacteria. I'll need a strong bacterial promoter,
    a ribosomal binding site, and a robust terminator. Also, add a His-tag for purification,
    just like we put purification tags on our viral particles.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - BacterialPromoter
    - RBS
    - Terminator
    - HisTag
  id: industry_vet_20
  category: persona_industry_vet
  difficulty: medium
- prompt: Design a mammalian expression construct for a therapeutic protein. Use a
    strong, constitutive promoter like CMV, similar to what we use for our AAV vectors.
    Include a WPRE for enhanced expression and a BGH polyA signal. I want to be able
    to detect expression easily, so add a GFP reporter gene linked via an IRES, like
    we've done in some bicistronic AAVs.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - CMV_Promoter
    - WPRE
    - BGHpA
    - IRES
    - GFP
  id: industry_vet_21
  category: persona_industry_vet
  difficulty: medium
- prompt: I'm looking to make a protein in yeast (S. cerevisiae). I need a strong
    yeast-specific promoter, a robust terminator, and a signal peptide to ensure secretion
    into the media. It's like asking the yeast to 'package' the protein for me, similar
    to how we'd package viral particles.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - YeastPromoter
    - YeastTerminator
    - SignalPeptide
  id: industry_vet_22
  category: persona_industry_vet
  difficulty: medium
- prompt: Can you design a compact, bicistronic mammalian construct? I need two genes,
    Protein A and Protein B, expressed stoichiometrically. Use a 2A peptide linker
    for this, similar to how we sometimes make fusion proteins or express multiple
    genes from a single transcript in AAV.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - 2A_Peptide
  id: industry_vet_23
  category: persona_industry_vet
  difficulty: medium
- prompt: I need to express a target protein in HEK293 cells for large-scale production.
    Give me a mammalian promoter, a C-terminal Strep-tag II for purification, and
    a robust polyA signal. It's like preparing a large batch of 'viral supernatant',
    but it's just my protein.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - MammalianPromoter
    - StrepTagII
    - PolyA_Signal
  id: industry_vet_24
  category: persona_industry_vet
  difficulty: medium
- prompt: I want to express a highly soluble version of a challenging protein in E.
    coli. Can you add a solubility-enhancing tag like GST or MBP, N-terminally? And
    include a TEV protease cleavage site so I can remove it after purification, just
    like we sometimes process our AAVs post-production.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - SolubilityTag
    - TEV_CleavageSite
  id: industry_vet_25
  category: persona_industry_vet
  difficulty: medium
- prompt: Generate a construct for E. coli expression where the protein is secreted
    into the periplasm. This would require a periplasmic signal peptide. Also, ensure
    there's an N-terminal His-tag and a strong bacterial promoter.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - BacterialPromoter
    - PeriplasmicSignalPeptide
    - HisTag
  id: industry_vet_26
  category: persona_industry_vet
  difficulty: medium
- prompt: I need to make an inducible mammalian construct. Let's use a Tet-On system.
    So, the GOI should be under a TRE promoter, and I'll need a separate cassette
    for the rtTA transactivator. This is like having a 'conditional AAV' where expression
    only turns on with a drug.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - TRE_Promoter
    - rtTA_Transactivator
  id: industry_vet_27
  category: persona_industry_vet
  difficulty: medium
- prompt: For S. cerevisiae expression, I need a construct with a strong constitutive
    promoter, a C-terminal HA-tag for detection, and a terminator. Make sure it's
    designed for stable chromosomal integration, not just transient expression, similar
    to how we integrate certain elements into producer cells.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - YeastPromoter
    - HA_Tag
    - YeastTerminator
    - IntegrationElements
  id: industry_vet_28
  category: persona_industry_vet
  difficulty: medium
- prompt: I want to express a reporter in mammalian cells, specifically Luciferase.
    Put it under the control of a synthetic liver-specific promoter (like one for
    hepatocytes, similar to what we'd target with a liver-tropic AAV). Include a Kozak
    sequence and an SV40 polyA.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - LiverSpecificPromoter
    - KozakSequence
    - SV40_PolyA_Signal
    - Luciferase
  id: industry_vet_29
  category: persona_industry_vet
  difficulty: medium
- prompt: Design a construct for high-yield bacterial expression. I need the protein
    to be delivered to inclusion bodies for easy recovery. So, no secretion signals,
    just a very strong promoter, a His-tag, and an optimized RBS.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - StrongBacterialPromoter
    - HisTag
    - OptimizedRBS
  id: industry_vet_30
  category: persona_industry_vet
  difficulty: medium
- prompt: I'm working on a protein for gene therapy, so I need a mammalian expression
    construct with minimal immunogenicity. Use a ubiquitous promoter but avoid viral
    sequences if possible (e.g., use a synthetic or cellular promoter instead of CMV).
    Add a human beta-globin polyA and no unnecessary tags.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - UbiquitousCellularPromoter
    - HumanBetaGlobin_PolyA_Signal
  id: industry_vet_31
  category: persona_industry_vet
  difficulty: medium
- prompt: Can you create a fusion protein construct for E. coli? My GOI needs to be
    fused to a large affinity tag like SUMO, N-terminally, with a ULP1 cleavage site
    between them. This is for maximizing solubility and ease of tag removal, a bit
    like engineering the capsid surface.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - SUMO_Tag
    - ULP1_CleavageSite
  id: industry_vet_32
  category: persona_industry_vet
  difficulty: medium
- prompt: I need a bicistronic construct for mammalian cells, where the first cistron
    is my GOI and the second is mCherry, both driven by the same promoter. I don't
    want an IRES; let's use a 2A peptide. And a strong, constitutive promoter like
    CAG (CMV enhancer, Chicken Beta-actin promoter).
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - CAG_Promoter
    - 2A_Peptide
    - mCherry
  id: industry_vet_33
  category: persona_industry_vet
  difficulty: medium
- prompt: Design a 'cassette' for E. coli where my protein is expressed with an N-terminal
    His-tag and a C-terminal Strep-tag II, separated by a flexible linker. This is
    for tandem purification, much like how we'd use multiple purification steps for
    AAV.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - HisTag
    - StrepTagII
    - FlexibleLinker
  id: industry_vet_34
  category: persona_industry_vet
  difficulty: medium
- prompt: I need to express a protein in mammalian cells and ensure its stability.
    Can you add a WPRE and a Kozak sequence, along with a strong promoter like a hybrid
    CBh? And a BGH polyA. Think of it as enhancing the 'packaging efficiency' of the
    mRNA.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CBh_Promoter
    - WPRE
    - KozakSequence
    - BGHpA
  id: industry_vet_35
  category: persona_industry_vet
  difficulty: medium
- prompt: For yeast, I need an N-terminal TAP tag (tandem affinity purification) on
    my GOI. It should be under an inducible promoter (e.g., GAL1), so I can control
    expression. Include a terminator and ensure the construct is compatible with yeast
    expression vectors.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - GAL1_Promoter
    - TAP_Tag
    - YeastTerminator
  id: industry_vet_36
  category: persona_industry_vet
  difficulty: medium
- prompt: I'm looking for a construct for mammalian protein expression that includes
    a secretory signal peptide and a C-terminal Fc fusion tag for purification and
    extended half-life. Use a robust constitutive promoter like EF1a. This is like
    adding a 'tropism' for serum.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - EF1a_Promoter
    - SignalPeptide
    - Fc_FusionTag
  id: industry_vet_37
  category: persona_industry_vet
  difficulty: medium
- prompt: I need an E. coli expression construct for a cytotoxic protein. So, it needs
    to be tightly controlled. Use a T7 inducible promoter and make sure to specify
    a T7 terminator. No tags, as I want the native protein, just like sometimes we
    want native AAV without modifications.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - T7_Promoter
    - T7_Terminator
    - RBS
  id: industry_vet_38
  category: persona_industry_vet
  difficulty: medium
- prompt: Can you provide a mammalian expression cassette for a membrane protein?
    It needs an N-terminal GFP fusion for visualization and tracking, similar to how
    we track AAV spread. Use a strong promoter and a polyA signal. No secretory signal,
    it needs to stay in the membrane.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - StrongMammalianPromoter
    - GFP
    - PolyA_Signal
    - MembraneLocalizationSignal
  id: industry_vet_39
  category: persona_industry_vet
  difficulty: medium
- prompt: Alright, for this 'payload' gene, I just need a standard bacterial expression
    setup. Nothing fancy, but it has to be easy to 'harvest' and purify, kind of like
    an affinity purification for our AAV preps. Assume E. coli.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - PurificationTag
    - Terminator
  id: industry_vet_40
  category: persona_industry_vet
  difficulty: medium
- prompt: This new protein needs to be expressed in mammalian cells and secreted into
    the medium, much like how AAV particles are released. It needs a strong, constitutive
    promoter, no weak stuff. And make sure it actually gets out of the cell!
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - KozakSequence
    - SignalPeptide
    - PolyASignal
    - PurificationTag
  id: industry_vet_41
  category: persona_industry_vet
  difficulty: medium
- prompt: Our new 'transgene' tends to aggregate badly in E. coli, like our AAV capsids
    sometimes misfold. Can you suggest a construct that includes a 'chaperone-like'
    tag to improve its solubility? Still needs to be purifiable.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - SolubilityTag
    - PurificationTag
    - Terminator
  id: industry_vet_42
  category: persona_industry_vet
  difficulty: medium
- prompt: I'm pushing the limits here, usually we're just packaging one gene. But
    I need two distinct protein 'payloads' co-expressed from the same construct in
    E. coli. Can we do this, perhaps with a clever promoter arrangement or something
    like an IRES, but for bacteria?
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - PolycistronicElement
    - Terminator
    - PurificationTag
  id: industry_vet_43
  category: persona_industry_vet
  difficulty: medium
- prompt: After purification, I want to remove the affinity tag from my protein, similar
    to how we might cleave a specific linker. What kind of 'restriction site' or 'cleavage
    site' should I incorporate for that in an E. coli expression system?
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - PurificationTag
    - CleavageSite
    - Terminator
  id: industry_vet_44
  category: persona_industry_vet
  difficulty: medium
- prompt: Heard that *Saccharomyces cerevisiae* can be a good host for some proteins.
    Can we express our therapeutic 'payload' gene there? I need a robust expression,
    almost like a high-titer AAV production run, and I'll need a way to purify it.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - KozakSequence
    - PurificationTag
    - Terminator
  id: industry_vet_45
  category: persona_industry_vet
  difficulty: medium
- prompt: We use baculovirus for AAV capsid production sometimes. Can we use an insect
    cell system for direct protein expression of my 'gene of interest'? I'm looking
    for high yield, mimicking our AAV titers, and it needs a secretion signal.
  expect:
    host: insect
    min_cistrons: 1
    must_have_parts:
    - BaculovirusPromoter
    - SignalPeptide
    - PurificationTag
    - PolyASignal
  id: industry_vet_46
  category: persona_industry_vet
  difficulty: medium
- prompt: I need constitutive, high-level expression in mammalian cells, much like
    using a strong viral promoter in an AAV vector. No inducibility, just 'always
    on' for a new antibody fragment. Needs a tag for purification.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - KozakSequence
    - PurificationTag
    - PolyASignal
  id: industry_vet_47
  category: persona_industry_vet
  difficulty: medium
- prompt: Can we make this protein 'payload' expression tunable? I need to control
    when the 'transgene' is expressed in E. coli, almost like we control helper functions
    for AAV production. An inducible system would be great, with a tag.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - RibosomeBindingSite
    - PurificationTag
    - Terminator
  id: industry_vet_48
  category: persona_industry_vet
  difficulty: medium
- prompt: 'I''m planning a fusion protein for mammalian expression: my gene of interest
    linked to a fluorescent reporter. It''s like making a capsid fusion with GFP to
    track ''packaging efficiency''. Needs a strong promoter.'
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - KozakSequence
    - FusionPartner
    - PolyASignal
    - PurificationTag
  id: industry_vet_49
