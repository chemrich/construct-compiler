    RBS system.
  expect:
    host: p_pastoris
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
  id: metabolic_engineer_15
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Construct a 6-gene operon for *Clostridium acetobutylicum* for a complex
