    under a T7 promoter. Ensure optimal linker sequences for proper protein folding
    and activity.
  expect:
    host: e_coli
    min_cistrons: 4
    must_have_parts:
    - T7 Promoter
    - RBS
    - Terminator
    - His-tag
    - Linker
  id: metabolic_engineer_14
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Generate a synthetic operon for *Komagataella phaffii* (*Pichia pastoris*)
