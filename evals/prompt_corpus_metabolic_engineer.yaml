prompts:
- prompt: Design an E. coli operon for a 5-enzyme synthetic isoprenoid pathway. We
    need high and balanced expression of all enzymes. Include a C-terminal His-tag
    on the first enzyme (IsoprenoidSynthase) for downstream purification, and ensure
    robust promoter and terminator sequences.
  expect:
    host: e_coli
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - His-tag
  id: metabolic_engineer_0
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Construct a P. pastoris expression cassette for a 4-enzyme polyketide synthase
    (PKS) pathway. Aim for constitutive, high-level expression driven by a strong
    yeast promoter. Fuse a Strep-tag to the last enzyme (PKS_TE) for affinity purification.
    All enzymes must be expressed efficiently.
  expect:
    host: p_pastoris
    min_cistrons: 4
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - Strep-tag
  id: metabolic_engineer_1
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Create a *Bacillus subtilis* operon for a 6-gene pathway producing a novel
    biofuel precursor. Emphasize tight transcriptional control with an IPTG-inducible
    promoter and carefully balanced protein levels for all enzymes. Include a GFP
    reporter gene at the end of the operon, removable via a flanking BsaI site.
  expect:
    host: b_subtilis
    min_cistrons: 6
    must_have_parts:
    - Inducible Promoter
    - RBS
    - Terminator
    - GFP Reporter
  id: metabolic_engineer_2
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Develop an expression system in *Saccharomyces cerevisiae* for a 4-enzyme
    pathway leading to a pharmaceutical intermediate. Each enzyme needs a C-terminal
    solubility tag (e.g., SUMO or MBP). Ensure expression is strong and stable across
    all pathway steps using individual promoters for each enzyme, but ensure the relative
    expression levels are balanced for optimal flux.
  expect:
    host: s_cerevisiae
    min_cistrons: 4
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - SolubilityTag
  id: metabolic_engineer_3
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Design an *E. coli* operon for a 5-enzyme carbon fixation pathway (e.g.,
    Calvin Cycle enzymes). The first enzyme (RuBisCO large subunit) needs an N-terminal
    His-tag, and the final enzyme (Sedoheptulose-1,7-bisphosphatase) requires a SUMO-tag
    for improved solubility and subsequent protease cleavage. Tune ribosomal binding
    site strengths for roughly equimolar protein production.
  expect:
    host: e_coli
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - His-tag
    - SUMO-tag
    - CleavageSite
  id: metabolic_engineer_4
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: We need a *Corynebacterium glutamicum* operon for a 4-enzyme amino acid
    biosynthesis pathway. The pathway enzymes (e.g., various dehydratases and transaminases)
    are prone to aggregation. Integrate a P2A self-cleaving peptide between each cistron
    to ensure separate protein folding while maintaining a single transcript from
    a strong constitutive promoter.
  expect:
    host: c_glutamicum
    min_cistrons: 4
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - P2A Peptide
  id: metabolic_engineer_5
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: 'Generate a synthetic operon for *Rhodobacter sphaeroides* expressing 6
    enzymes involved in nitrogenase complex assembly. The challenge is differential
    expression: the first two enzymes need to be expressed at 2x the level of the
    subsequent four. Use specific RBS tuning to achieve these ratios under the control
    of a strong anaerobic promoter.'
  expect:
    host: rhodobacter_sphaeroides
    min_cistrons: 6
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
  id: metabolic_engineer_6
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Compile a *Kluyveromyces lactis* expression module for a 5-enzyme xylose
    utilization pathway. Each enzyme requires an N-terminal mitochondrial targeting
    sequence to import into mitochondria. Ensure robust, constitutive expression.
    Include a FLAG-tag on the third enzyme for localization studies.
  expect:
    host: kluyveromyces_lactis
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - Mitochondrial Targeting Sequence
    - FLAG-tag
  id: metabolic_engineer_7
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Design an *E. coli* pathway for 4 enzymes converting glucose to a desired
    product, where the enzymes must be expressed in a specific order and at decreasing
    protein levels (e.g., 4:3:2:1 ratio). Utilize a tunable RBS library or a 2A peptide
    with varying cleavage efficiencies to achieve these relative levels from a single
    T7 promoter.
  expect:
    host: e_coli
    min_cistrons: 4
    must_have_parts:
    - T7 Promoter
    - RBS
    - Terminator
    - 2A Peptide
  id: metabolic_engineer_8
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Build a *Pseudomonas putida* operon containing 6 genes for degrading a persistent
    environmental pollutant. The pathway needs to be induced by the presence of the
    pollutant itself. Ensure all enzymes are efficiently translated, and include a
    His-tag on the first enzyme for detection.
  expect:
    host: pseudomonas_putida
    min_cistrons: 6
    must_have_parts:
    - Inducible Promoter
    - RBS
    - Terminator
    - His-tag
  id: metabolic_engineer_9
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Construct a multi-cistronic expression system in *Aspergillus niger* for
    a 5-enzyme pectin degradation pathway. Due to secretion requirements, each enzyme
    needs its own signal peptide and a C-terminal GFP fusion for tracking. Drive expression
    with a strong, constitutive fungal promoter.
  expect:
    host: aspergillus_niger
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - Signal Peptide
    - GFP Fusion
  id: metabolic_engineer_10
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: We need an *E. coli* operon for a 4-enzyme artificial metabolic shunt pathway.
    To prevent degradation, all enzymes require a C-terminal LVA degron sequence.
    The entire operon should be controlled by an arabinose-inducible promoter, and
    expression levels must be robust and balanced.
  expect:
    host: e_coli
    min_cistrons: 4
    must_have_parts:
    - Inducible Promoter
    - RBS
    - Terminator
    - Degron
  id: metabolic_engineer_11
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Design a *Streptomyces coelicolor* operon for a 6-enzyme natural product
    biosynthesis pathway. The pathway is long, so ensuring high and sustained expression
    from a strong promoter is critical. All proteins should be expressed at approximately
    equal levels. Include a robust terminator.
  expect:
    host: streptomyces_coelicolor
    min_cistrons: 6
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
  id: metabolic_engineer_12
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Create an expression cassette for *Zymomonas mobilis* containing 5 enzymes
    for enhanced ethanol production. These enzymes (e.g., various dehydrogenases)
    are known to form inclusion bodies. Implement a N-terminal NusA solubility tag
    for each enzyme and a TEV cleavage site to remove the tag after purification.
    Use a strong, constitutive promoter.
  expect:
    host: zymomonas_mobilis
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - Terminator
    - SolubilityTag
    - CleavageSite
  id: metabolic_engineer_13
  category: persona_metabolic_engineer
  difficulty: medium
- prompt: Develop an *E. coli* multi-cistronic construct for a 4-enzyme pathway where
    the enzymes are fused via short flexible linkers to create a 'metabolon' structure.
