prompts:
- prompt: Alright, listen up. I need to crank out some of that 'Factor X' protein
    in E. coli. Let's stick with the tried-and-true Lac promoter for induction, and
    I want a His6-tag at the C-terminus for cleanup. Oh, and make sure this thing
    carries the 'amp' gene for selection in the bug. Simple, high yield.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - LacPromoter
    - PurificationTag
    - SelectionMarker
  id: old_school_0
  category: persona_old_school
  difficulty: medium
- prompt: For our yeast project, let's get the 'alpha-amylase' gene expressed constitutively.
    Use the ADH1 promoter, and slap a Myc-tag on the protein's C-end. We'll need a
    selectable marker, so include the 'LEU2' gene. Keep it robust.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ADH1Promoter
    - DetectionTag
    - SelectionMarker
  id: old_school_1
  category: persona_old_school
  difficulty: medium
- prompt: I've got this interesting 'secreted peptide' I want to test in mammalian
    cells. Use the robust CMV promoter, and make sure it includes the SV40 polyA signal.
    It needs a suitable signal peptide for secretion, and let's use a 'neo' gene for
    G418 selection. This is for HEK cells.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CMVPromoter
    - SV40PolyA
    - SecretionSignal
    - SelectionMarker
  id: old_school_2
  category: persona_old_school
  difficulty: medium
- prompt: We need to express two bacterial enzymes, 'Enzyme A' and 'Enzyme B', in
    E. coli. Make it a bicistronic setup, both under the control of the strong T7
    promoter. 'Enzyme A' first, then 'Enzyme B'. And give me the 'kan' resistance
    gene.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - T7Promoter
    - SelectionMarker
  id: old_school_3
  category: persona_old_school
  difficulty: medium
- prompt: Time for a reporter construct in our 'vero' cells. I want the 'firefly luciferase'
    gene driven by the SV40 early promoter. Pair it with the BGH polyA for proper
    termination. Selection will be with the 'hygro' gene.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - SV40Promoter
    - ReporterGene
    - BGHPolyA
    - SelectionMarker
  id: old_school_4
  category: persona_old_school
  difficulty: medium
- prompt: Build me an E. coli expression cassette for a 'chaperone protein'. I need
    it inducible, so the 'tac' promoter is good. Add a GST-tag at the N-terminus and
    a Thrombin cleavage site right after the tag. Don't forget 'chloramphenicol' resistance.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - TacPromoter
    - PurificationTag
    - CleavageSite
    - SelectionMarker
  id: old_school_5
  category: persona_old_school
  difficulty: medium
- prompt: I need to clone a 'domain of interest' into our yeast two-hybrid bait plasmid.
    Drive its expression with the ADH1 promoter. No specific tag needed, but it's
    part of a fusion with the LexA DNA-binding domain. Select with 'TRP1'.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ADH1Promoter
    - SelectionMarker
  id: old_school_6
  category: persona_old_school
  difficulty: medium
- prompt: Let's try to get higher yields for 'Protein Y' in E. coli. Use the T7 promoter.
    I want both a Strep-tag and a Flag-tag on it, let's say Strep first, then the
    Flag-tag at the C-terminus. Ampicillin resistance, as usual.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - T7Promoter
    - PurificationTag
    - DetectionTag
    - SelectionMarker
  id: old_school_7
  category: persona_old_school
  difficulty: medium
- prompt: Design a mammalian construct for bicistronic expression. The 'regulatory
    protein' first, followed by 'GFP' as a reporter. Use the human EF1-alpha promoter,
    an IRES sequence between the two ORFs, and the SV40 polyA. G418 selection, please.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - EF1alphaPromoter
    - IRES
    - ReporterGene
    - SV40PolyA
    - SelectionMarker
  id: old_school_8
  category: persona_old_school
  difficulty: medium
- prompt: We need to express an 'antibody fragment' in CHO cells. Use the strong CMV
    promoter and BGH polyA. It absolutely needs a signal peptide for secretion, and
    we'll select with 'hygromycin'.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CMVPromoter
    - BGHPolyA
    - SecretionSignal
    - SelectionMarker
  id: old_school_9
  category: persona_old_school
  difficulty: medium
- prompt: For our yeast expression of 'toxic protein X', let's use the inducible GAL1
    promoter. It should have a C-terminal HA-tag for detection. Terminate with the
    CYC1 terminator and use 'URA3' for selection.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - GAL1Promoter
    - DetectionTag
    - CYC1Terminator
    - SelectionMarker
  id: old_school_10
  category: persona_old_school
  difficulty: medium
- prompt: I'm trying to express 'enzyme Z' in E. coli but it's always in inclusion
    bodies. Fuse it to 'MBP' (maltose-binding protein) for solubility, use the 'tac'
    promoter, and include a His6-tag at the very end. Ampicillin resistance, of course.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - TacPromoter
    - SolubilityTag
    - PurificationTag
    - SelectionMarker
  id: old_school_11
  category: persona_old_school
  difficulty: medium
- prompt: Need a construct for mitochondrial targeting in yeast. Put a 'mitochondrial
    targeting sequence' at the N-terminus of 'protein M'. Drive it with the ADH1 promoter
    and use the CYC1 terminator. 'HIS3' for selection.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ADH1Promoter
    - LocalizationSignal
    - SelectionMarker
  id: old_school_12
  category: persona_old_school
  difficulty: medium
- prompt: Let's get an E. coli construct for 'Protein D'. Inducible expression with
    the 'araB' promoter. No tags for purification or detection, but make sure the
    'cat' gene is present for chloramphenicol selection.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - AraBPromoter
    - SelectionMarker
  id: old_school_13
  category: persona_old_school
  difficulty: medium
- prompt: I want to test a 'transcription factor' in mammalian cells. It needs to
    be inducible, so use the TRE promoter (Tet-response element). Pair it with an
    SV40 polyA. Select with 'puromycin'. This is for stable integration in 293T cells.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - TREPromoter
    - SV40PolyA
    - SelectionMarker
  id: old_school_14
  category: persona_old_school
  difficulty: medium
- prompt: For yeast, construct an expression vector for 'Protein P'. ADH1 promoter,
    followed by 'Protein P', then a C-terminal His6-tag. CYC1 terminator. This needs
    to be a low-copy plasmid, so include a centromeric sequence (CEN/ARS). Select
    with 'TRP1'.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ADH1Promoter
    - PurificationTag
    - SelectionMarker
    - LowCopy
  id: old_school_15
  category: persona_old_school
  difficulty: medium
- prompt: I need two expression cassettes on one plasmid for E. coli. One for 'Protein
    A' driven by a T7 promoter, and another for 'Protein B' also under a T7 promoter.
    Both proteins need C-terminal His6-tags. Kanamycin resistance for the plasmid.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - T7Promoter
    - PurificationTag
    - SelectionMarker
  id: old_school_16
  category: persona_old_school
  difficulty: medium
- prompt: Let's get 'beta-galactosidase' expressed in E. coli as a reporter. Use the
    'lac' promoter. No specific tags. And for selection, stick with 'ampicillin'.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - LacPromoter
    - ReporterGene
    - SelectionMarker
  id: old_school_17
  category: persona_old_school
  difficulty: medium
- prompt: For 'Protein G' in yeast, I need constitutive expression with the ADH1 promoter.
    No tags needed for this one, but I need a 'URA3' marker on the plasmid for auxotrophic
    selection.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ADH1Promoter
    - SelectionMarker
  id: old_school_18
  category: persona_old_school
  difficulty: medium
- prompt: I need an E. coli construct for 'enzyme E'. Use the T7 promoter, and for
    purification, an N-terminal His6-tag. After the His-tag, include an Enterokinase
    cleavage site. The plasmid needs 'chloramphenicol' resistance.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - T7Promoter
    - PurificationTag
    - CleavageSite
    - SelectionMarker
  id: old_school_19
  category: persona_old_school
  difficulty: medium
- prompt: Alright, I need to express my new 'Superzyme' protein in *E. coli*. Stick
    a Hexa-His tag right at the N-terminus, after the ATG, and put it under the control
    of a strong Plac promoter. Make sure it's got a proper Shine-Dalgarno for efficient
    translation. And don't forget the classic bla gene for ampicillin selection, using
    a pBR322 origin for good measure.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - RibosomeBindingSite
    - PurificationTag
    - SelectionMarker
    - OriginOfReplication
  id: old_school_20
  category: persona_old_school
  difficulty: medium
- prompt: I've got this reporter construct I want to make for *E. coli*. I need the
    TetR repressor expressed constitutively, then a Ptet promoter driving a GFP reporter.
    When I add anhydrotetracycline, I want to see green cells. Use a pUC-derived origin,
    please, and a kanR gene for selection.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - ConstitutivePromoter
    - InduciblePromoter
    - ReporterGene
    - SelectionMarker
    - OriginOfReplication
  id: old_school_21
  category: persona_old_school
  difficulty: medium
- prompt: For mammalian cells, I need to express my 'GrowthFactorZ'. Use the robust
    CMV immediate-early promoter and ensure it has the SV40 polyadenylation signal
    for good transcript stability. Throw in an SV40 origin for episomal replication
    in relevant cell lines. Oh, and an *E. coli* ColE1 origin for subcloning convenience.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - TranscriptionalTerminator
    - OriginOfReplication
  id: old_school_22
  category: persona_old_school
  difficulty: medium
- prompt: I'm setting up a yeast two-hybrid system. I need a bait protein construct
    for *S. cerevisiae*. Express my 'ProteinA' fused to the GAL4 DNA-binding domain.
    Use the strong ADH1 promoter and an ADH1 terminator. It needs to replicate in
    yeast, so include an ARS/CEN element. A pRS-derived backbone with a TRP1 selection
    marker would be perfect.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - TranscriptionalTerminator
    - OriginOfReplication
    - SelectionMarker
  id: old_school_23
  category: persona_old_school
  difficulty: medium
- prompt: 'Let''s make a bi-cistronic system in *E. coli*. First cistron: my ''EnzymeX''
    with a GST tag, driven by a Ptac promoter. Second cistron: the LacI repressor,
    so it''s self-repressed until IPTG is added. Use individual Shine-Dalgarno sequences
    for each, and the pBR322 origin with the TetR resistance gene.'
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - InduciblePromoter
    - RibosomeBindingSite
    - PurificationTag
    - SelectionMarker
    - OriginOfReplication
  id: old_school_24
  category: persona_old_school
  difficulty: medium
- prompt: I need a construct to make a secreted protein, 'FactorS', in mammalian cells.
    Put a strong signal peptide from IgG just upstream of 'FactorS'. Drive it with
    the SV40 early promoter, and terminate with a BGH polyA signal. For selection,
    let's use the Neomycin resistance gene (NeoR) under a constitutive promoter.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - SecretionSignal
    - ConstitutivePromoter
    - TranscriptionalTerminator
    - SelectionMarker
  id: old_school_25
  category: persona_old_school
  difficulty: medium
- prompt: Design a construct for yeast expression where my gene 'SensorY' is driven
    by the CUP1 promoter, inducible by copper. Fuse 'SensorY' to a classic Luciferase
    reporter. Use an ADH1 terminator and a LEU2 selection marker. A 2-micron origin
    for high copy number in yeast is what I'm after.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - ReporterGene
    - TranscriptionalTerminator
    - SelectionMarker
    - OriginOfReplication
  id: old_school_26
  category: persona_old_school
  difficulty: medium
- prompt: I want to test a new promoter, 'Pnovel', in *E. coli*. Place 'Pnovel' upstream
    of a LacZ reporter gene. I need a pACYC-like low copy origin and the chloramphenicol
    resistance gene (CmR) for selection. No other protein expression, just the reporter.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - ReporterGene
    - OriginOfReplication
    - SelectionMarker
  id: old_school_27
  category: persona_old_school
  difficulty: medium
- prompt: Create a construct for high-level mammalian expression of 'TherapeuticP'.
    Use the strong CAG promoter (CMV enhancer, chicken beta-actin promoter, rabbit
    beta-globin intron) and include a Kozak sequence. For stability, employ the WPRE
    element and a BGH polyA. A blasticidin resistance gene for selection.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - ConstitutivePromoter
    - RibosomeBindingSite
    - TranscriptionalTerminator
    - SelectionMarker
  id: old_school_28
  category: persona_old_school
  difficulty: medium
- prompt: I need a construct for *E. coli* with a removable solubility tag. Express
    my tricky 'ProteinZ' fused to MBP (maltose-binding protein) at the N-terminus,
    with a Factor Xa cleavage site in between. Drive this with a T7 promoter, and
    use a T7 terminator. A pET-style vector backbone with kanR is what I usually work
    with.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - SolubilityTag
    - CleavageSite
    - TranscriptionalTerminator
    - SelectionMarker
    - OriginOfReplication
  id: old_school_29
  category: persona_old_school
  difficulty: medium
- prompt: Let's make a shuttle vector for *E. coli* and yeast. It needs to express
    'AntigenA' under the control of a strong constitutive promoter in both organisms.
    In *E. coli*, use the Plac promoter (and provide LacI). In yeast, use the GPD
    promoter. It needs both ColE1 and ARS/CEN origins, and both AmpR and URA3 markers.
  expect:
    host: e_coli
    min_cistrons: 3
    must_have_parts:
    - InduciblePromoter
    - ConstitutivePromoter
    - OriginOfReplication
    - SelectionMarker
  id: old_school_30
  category: persona_old_school
  difficulty: medium
- prompt: I want a very simple construct for *E. coli* to just express 'peptideM'
    with a C-terminal Flag tag. Use the trp promoter for induction and a strong Rho-independent
    terminator. Use a pBR322 origin and resistance to tetracycline.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - PurificationTag
    - TranscriptionalTerminator
    - SelectionMarker
    - OriginOfReplication
  id: old_school_31
  category: persona_old_school
  difficulty: medium
- prompt: For mammalian expression, I need to express a fusion protein 'GFP-LacZ'
    where GFP is at the N-terminus. Use the ubiquitous EF1-alpha promoter and a strong
    Kozak sequence. I need a reliable polyA signal like the SV40 late polyA. No selection
    marker on this one.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - RibosomeBindingSite
    - ReporterGene
    - TranscriptionalTerminator
  id: old_school_32
  category: persona_old_school
  difficulty: medium
- prompt: I'm working with a gene 'ToxicT' in *E. coli*, so I need tightly regulated
    expression. Use the Pbad promoter, inducible by arabinose, and make sure the AraC
    regulator is also provided on the plasmid. Include a T7 terminator, pACYC origin,
    and kanR.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - InduciblePromoter
    - TranscriptionalTerminator
    - SelectionMarker
    - OriginOfReplication
  id: old_school_33
  category: persona_old_school
  difficulty: medium
- prompt: Design a construct for yeast to express my protein 'ScaffoldP' under the
    control of the MET25 promoter, which is repressed by methionine. Include an N-terminal
    myc tag. Use the CYC1 terminator. For selection, use HIS3, and a 2-micron origin.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - PurificationTag
    - TranscriptionalTerminator
    - SelectionMarker
    - OriginOfReplication
  id: old_school_34
  category: persona_old_school
  difficulty: medium
- prompt: I need a constitutively active mammalian expression system for my 'KinaseK'.
    Use the strong ubiquitous promoter from RSV (Rous Sarcoma Virus) LTR, and a robust
    polyA signal like the human growth hormone (hGH) polyA. Include a Puromycin resistance
    gene for selection.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - ConstitutivePromoter
    - TranscriptionalTerminator
    - SelectionMarker
  id: old_school_35
  category: persona_old_school
  difficulty: medium
- prompt: Make an *E. coli* operon construct! I need two genes, 'GeneA' and 'GeneB',
    to be co-expressed from the same transcript. Drive them both with a single Ptac
    promoter. Put a strong Shine-Dalgarno before each open reading frame. Use a pBR322
    origin and ampR.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - InduciblePromoter
    - RibosomeBindingSite
    - SelectionMarker
    - OriginOfReplication
  id: old_school_36
  category: persona_old_school
  difficulty: medium
- prompt: I'm looking for a construct for regulated expression in mammalian cells.
    Express my 'ReporterR' under a Tet-Off system. So, I need the CMV promoter driving
    a tetracycline transactivator (tTA), and a Ptight promoter driving 'ReporterR'.
    Both need polyA signals, and a SV40 origin.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - ConstitutivePromoter
    - InduciblePromoter
    - ReporterGene
    - TranscriptionalTerminator
    - OriginOfReplication
  id: old_school_37
  category: persona_old_school
  difficulty: medium
- prompt: Build a super-simple *E. coli* expression plasmid. Just my 'ProteinX' under
    a T7 promoter. No tags, no fancy stuff. A simple pUC origin for high copy number,
    and the kanR gene for selecting transformants.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - SelectionMarker
    - OriginOfReplication
  id: old_school_38
  category: persona_old_school
  difficulty: medium
- prompt: I need a construct to target my 'ProteinN' to the nucleus in mammalian cells.
    Fuse a classic NLS (nuclear localization signal) from SV40 T-antigen to its N-terminus.
    Use the strong ubiquitin C promoter, and the Bovine Growth Hormone (BGH) polyA
    signal for termination. For selection, a Hygromycin resistance gene.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - NuclearLocalizationSignal
    - ConstitutivePromoter
    - TranscriptionalTerminator
    - SelectionMarker
  id: old_school_39
  category: persona_old_school
  difficulty: medium
- prompt: Right, I need a simple pBR322 derivative for expressing a single cistron
    in E. coli. Stick the lac promoter on it. Give me a hexahistidine stretch for
    quick isolation after lysis, and maybe a factor Xa site to clip it clean. Ampicillin
    resistance, naturally. We're aiming for high yield.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - PurificationTag
    - CleavageSite
    - AntibioticResistance
  id: old_school_40
  category: persona_old_school
  difficulty: medium
- prompt: We need to get this human growth factor out of yeast. Use the alpha-factor
    leader sequence from *S. cerevisiae* for secretion, driven by a strong, constitutive
    promoter like PGK. One cistron. Use the URA3 marker for selection on minimal media,
    integrate it into the chromosome if you can, or a stable 2-micron derived plasmid.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - SignalPeptide
    - SelectionMarker
  id: old_school_41
  category: persona_old_school
  difficulty: medium
- prompt: This gene needs to be expressed in mammalian cells, stably. Use the SV40
    early promoter, and throw in a poly-A tail. A neomycin resistance cistron for
    G418 selection is essential for stable integrants. Just one target cistron for
    now.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - PolyASignal
    - SelectionMarker
  id: old_school_42
  category: persona_old_school
  difficulty: medium
- prompt: I've got two related cistrons that need to be co-expressed in *E. coli*
    for a protein complex. Use the T7 promoter system. The first cistron needs a GST
    fusion for solubility, and both need their own ribosome binding sites. Kanamycin
    resistance for the plasmid.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - SolubilityTag
    - AntibioticResistance
  id: old_school_43
  category: persona_old_school
  difficulty: medium
- prompt: For this therapeutic cistron in human cells, I need it to be inducible.
    Use a tetracycline-inducible system. So that means a TetR repressor cistron, and
    a target cistron under the control of a Tet-responsive promoter. A CMV promoter
    for the TetR. Keep selection separate.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - InduciblePromoter
    - RepressorGene
  id: old_school_44
  category: persona_old_school
  difficulty: medium
- prompt: I want to test a new promoter in *S. cerevisiae*. Fuse it to the *E. coli*
    beta-galactosidase cistron. Need an LEU2 selectable marker on the same plasmid.
    Let's make it a high-copy 2-micron plasmid.
  expect:
    host: s_cerevisiae
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - ReporterGene
    - SelectionMarker
  id: old_school_45
  category: persona_old_school
  difficulty: medium
- prompt: We need to make this protein with a FLAG tag for immunoprecipitation. Put
    it under the control of the tac promoter, so we can induce with IPTG. Ampicillin
    resistance, of course. No cleavage site needed for this one, the tag stays on.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - InduciblePromoter
    - PurificationTag
    - AntibioticResistance
  id: old_school_46
  category: persona_old_school
  difficulty: medium
- prompt: For gene therapy, we need a lentiviral backbone. The target cistron needs
    to be driven by a strong promoter like CMV. A PGK promoter driving a puromycin
    resistance cistron for selection. Mind the LTRs and packaging signals, though
    I assume your compiler handles that.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - SelectionMarker
  id: old_school_47
  category: persona_old_school
  difficulty: medium
- prompt: I just need the N-terminal domain of this cistron. Excise the rest. Use
    a simple constitutive promoter, maybe like the 'trc' hybrid. A His-tag at the
    N-terminus is fine, no cleavage needed. Kanamycin for selection.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - PurificationTag
    - AntibioticResistance
  id: old_school_48
  category: persona_old_school
  difficulty: medium
- prompt: I want to observe two different cellular events simultaneously. I need two
    independent cistrons, one for GFP and one for RFP. Each should be driven by its
    own SV40 promoter. Use a hygromycin resistance cistron for selection.
  expect:
    host: mammalian
    min_cistrons: 3
    must_have_parts:
    - Promoter
    - ReporterGene
    - SelectionMarker
  id: old_school_49
  category: persona_old_school
