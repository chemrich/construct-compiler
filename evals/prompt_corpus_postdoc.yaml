    for detection. And make sure it has a mammalian polyA sequence, as that usually
    helps for secretion. I want it fully processed, just like in HEK cells.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - OmpASignal
    - MycTag
    - MammalianPolyASignal
    - GlycosylationExpected
  id: postdoc_14
  category: persona_postdoc
  difficulty: medium
- prompt: For S. cerevisiae, I need 'BindingDomain' displayed on the cell surface.
