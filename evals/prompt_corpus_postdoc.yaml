    want any fancy operon stuff, just two independent T7 promoter-driven cassettes.
    Ampicillin selection.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - SUMOTag
    - HisTag
    - T7Promoter
    - AmpicillinResistance
  id: postdoc_13
  category: persona_postdoc
  difficulty: medium
- prompt: I need 'SecretedCytokine' to be secreted from E. coli and properly glycosylated.
