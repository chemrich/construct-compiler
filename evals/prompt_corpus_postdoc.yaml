prompts:
- prompt: Okay, first one. Simple enough. I need to express my human protein, 'AwesomeProtein',
    in E. coli for crystallography. Just slap a C-terminal His-tag on it, maybe a
    TEV cleavage site. Use a strong, constitutive promoter, CMV should be fine, right?
    And high copy number, I need a ton of protein.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - HisTag
    - TEVCleavageSite
    - CMVPromoter
    - pUC_ori
  id: postdoc_0
  category: persona_postdoc
  difficulty: medium
- prompt: Alright, next up, a secreted protein in S. cerevisiae. I want to use the
    alpha-factor secretion signal, obviously, N-terminal His-tag for purification.
    Inducible expression is key, so use the GAL1 promoter. Should be straightforward,
    it's just like mammalian secretion, but... yeastier.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - AlphaFactorSignal
    - HisTag
    - GAL1Promoter
  id: postdoc_1
  category: persona_postdoc
  difficulty: medium
- prompt: I've got two genes, 'GeneA' and 'GeneB', that form a complex, and I want
    to express them together in E. coli. Can we put them on the same transcript with
    an IRES in between? GeneA gets a Strep-tag, GeneB gets a His-tag. I want robust
    expression.
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - IRES
    - StrepTag
    - HisTag
  id: postdoc_2
  category: persona_postdoc
  difficulty: medium
- prompt: Right, I need a soluble fusion protein for E. coli. Fuse 'MyTrickyProtein'
    to GST, N-terminal, with an HRV3C cleavage site after the GST. Make sure it's
    under a T7 promoter. And definitely a strong bacterial terminator. High yield,
    as always.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - GSTFusion
    - HRV3CCleavageSite
    - T7Promoter
    - BacterialTerminator
  id: postdoc_3
  category: persona_postdoc
  difficulty: medium
- prompt: Simple expression of 'YeastProteinX' in S. cerevisiae. Just a C-terminal
    FLAG-tag. Use the ADH1 promoter, constitutive is fine. And make sure it's got
    a proper yeast polyA signal. Can't forget the basics.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - FLAGTag
    - ADH1Promoter
    - ADH1Terminator
  id: postdoc_4
  category: persona_postdoc
  difficulty: medium
- prompt: I need to check the localization of 'MyNuclearProtein' in E. coli. So, N-terminal
    GFP fusion. Use a robust mammalian promoter like SV40, just for consistency. And
    a Kanamycin resistance for selection. This should be super fast, it's just E.
    coli!
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - GFP
    - SV40Promoter
    - KanamycinResistance
  id: postdoc_5
  category: persona_postdoc
  difficulty: medium
- prompt: Express 'HumanKinase' in E. coli. I've already had it codon-optimized for
    mammalian expression, so just use that sequence directly. Add a C-terminal His-tag.
    Ampicillin resistance, standard T7 promoter. It *should* still work fine in bacteria,
    right? Codons are codons.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - HisTag
    - AmpicillinResistance
    - T7Promoter
    - MammalianCodonOptimization
  id: postdoc_6
  category: persona_postdoc
  difficulty: medium
- prompt: I want to express two different proteins, 'EnzymeA' and 'RegulatorB', independently
    in S. cerevisiae. EnzymeA needs a His-tag and a strong constitutive promoter like
    TEF1. RegulatorB needs a Strep-tag and an inducible GAL1 promoter. No operon nonsense,
    just two distinct expression cassettes on one plasmid.
  expect:
    host: s_cerevisiae
    min_cistrons: 2
    must_have_parts:
    - HisTag
    - TEF1Promoter
    - StrepTag
    - GAL1Promoter
  id: postdoc_7
  category: persona_postdoc
  difficulty: medium
- prompt: Okay, for E. coli, I need to secrete 'GrowthFactorZ' into the periplasm.
    Use the E. coli pelB signal peptide, N-terminal. A C-terminal His-tag for purification.
    A low-copy number plasmid this time, maybe a pBR322 ori. Keep it simple and stable.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - PelBSignalPeptide
    - HisTag
    - pBR322_ori
  id: postdoc_8
  category: persona_postdoc
  difficulty: medium
- prompt: Can we make a polycistronic mRNA in S. cerevisiae for 'Subunit1' and 'Subunit2'?
    Subunit1 gets a His-tag, Subunit2 gets a Strep-tag. Put it all under a strong
    ADH1 promoter. This works in mammalian cells with IRES, so yeast should be able
    to handle it, right? It's just a different kind of eukaryotic cell!
  expect:
    host: s_cerevisiae
    min_cistrons: 2
    must_have_parts:
    - HisTag
    - StrepTag
    - ADH1Promoter
    - PolycistronicDesign
  id: postdoc_9
  category: persona_postdoc
  difficulty: medium
- prompt: I need robust expression of 'TargetProtein' in E. coli for NMR. Give it
    both a C-terminal His-tag and an N-terminal Strep-tag. I want a T7 promoter, and
    let's go with Ampicillin resistance and a high-copy ori. I need maximum yield
    and flexibility for purification.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - HisTag
    - StrepTag
    - T7Promoter
    - AmpicillinResistance
    - pUC_ori
  id: postdoc_10
  category: persona_postdoc
  difficulty: medium
- prompt: For S. cerevisiae, I need inducible expression of 'MyAntigen'. C-terminal
    His-tag and a TEV cleavage site. GAL1 promoter is perfect for induction. And I
    need a selectable marker, G418 resistance please. And make sure it integrates
    into the genome for stability.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - HisTag
    - TEVCleavageSite
    - GAL1Promoter
    - G418Resistance
    - GenomicIntegration
  id: postdoc_11
  category: persona_postdoc
  difficulty: medium
- prompt: I have a human gene, 'hDrugTarget', complete with its native Kozak sequence
    and polyA signal. I want to express it directly in S. cerevisiae. Just put it
    under a constitutive yeast promoter like TEF1. It's a human gene, so its own signals
    should be recognized, right? Eukaryotes are eukaryotes.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - TEF1Promoter
    - NativeKozakSequence
    - NativePolyASignal
  id: postdoc_12
  category: persona_postdoc
  difficulty: medium
- prompt: I want to express a two-component system, 'SensorA' and 'EffectorB', in
