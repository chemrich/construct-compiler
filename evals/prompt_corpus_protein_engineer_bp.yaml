prompts:
- prompt: Design a Pichia pastoris construct using the AOX1 promoter. I need an alpha-factor
    secretion signal fused to a green fluorescent protein. Include a C-terminal 6xHis
    tag for purification and make sure the codons are optimized for Pichia to maximize
    protein yield.
  expect:
    host: pichia
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - SignalPeptide
    - CDS
    - PurificationTag
  id: protein_engineer_bp_0
  category: persona_protein_engineer_bp
  difficulty: medium
- prompt: I need a Bacillus subtilis expression cassette for high-level secretion.
    Use the strong constitutive Pveg promoter driving an AmyE signal peptide fused
    to a cutinase enzyme. Add an N-terminal FLAG tag right after the signal peptide
    to track secretion efficiency.
  expect:
    host: bacillus
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - SignalPeptide
    - EpitopeTag
    - CDS
  id: protein_engineer_bp_1
  category: persona_protein_engineer_bp
  difficulty: medium
- prompt: Generate a construct for constitutive intracellular expression in Pichia
    to evaluate protein stability. Use the GAP promoter driving a codon-optimized
    lipase. Include an N-terminal GST solubility tag and a TEV cleavage site immediately
    before the lipase sequence.
  expect:
    host: pichia
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - SolubilityTag
    - CleavageSite
    - CDS
  id: protein_engineer_bp_2
  category: persona_protein_engineer_bp
  difficulty: medium
- prompt: Create a xylose-inducible Bacillus construct. I want the Pxyl promoter expressing
    an scFv antibody fragment. Attach a C-terminal His-tag. Don't include a secretion
    signal; I want to test inclusion body formation and intracellular yield.
  expect:
    host: bacillus
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - CDS
    - PurificationTag
  id: protein_engineer_bp_3
  category: persona_protein_engineer_bp
  difficulty: medium
- prompt: I am trying to co-express two sub-units of a heterodimeric protein in Pichia.
    Use two separate AOX1 promoters. Both subunits need an alpha-factor signal for
    secretion. Subunit A needs a His-tag, and Subunit B needs a Strep-tag.
  expect:
    host: pichia
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - SignalPeptide
    - PurificationTag
    - CDS
  id: protein_engineer_bp_4
  category: persona_protein_engineer_bp
  difficulty: medium
- prompt: Design a construct for Bacillus subtilis to secrete an interferon-alpha.
    Use the Pgrac promoter, an AmyQ secretion signal, and put a SUMO tag with an Ulp1
