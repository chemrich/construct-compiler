  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RBS
    - PurificationTag
    - CodingSequence
    - Terminator
    - MCS
  id: repetition_tester_24
  category: persona_repetition_tester
  difficulty: medium
- prompt: Express ProteinM in mammalian cells. A strong Kozak sequence is essential,
