  expect:
    host: s_cerevisiae
    min_cistrons: 5
    must_have_parts:
    - Promoter
    - RBS
    - ReporterGene
    - Terminator
  id: repetition_tester_23
  category: persona_repetition_tester
  difficulty: medium
- prompt: Generate a library of ProteinP with 10 different N-terminal tags. The DNA
