    sequences. Absolutely no shared motifs or potential recombination hotspots!
  expect:
    host: e_coli
    min_cistrons: 3
    must_have_parts:
    - Promoter
    - RBS
    - CodingSequence
    - Terminator
  id: repetition_tester_22
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need to express five different GFP variants (GFP1-5) simultaneously. For
