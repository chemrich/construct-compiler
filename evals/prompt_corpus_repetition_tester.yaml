prompts:
- prompt: I need to express GeneX in E. coli, but I am utterly terrified of recombination.
    Please ensure the construct includes a His-tag and a unique linker sequence that
    is absolutely, positively non-homologous to any standard linker or the His-tag
    itself. Maximize synonymous codon usage for both the linker and His-tag to prevent
    any cryptic repeats, even if functionally identical.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - GeneX
    - UniqueLinker
    - HisTag
    - Terminator
  id: repetition_tester_0
  category: persona_repetition_tester
  difficulty: medium
- prompt: Design a polycistronic construct for GeneA, GeneB, and GeneC in E. coli.
    Each gene *must* have a distinct, non-homologous Ribosome Binding Site (RBS) and
    unique, non-repetitive intergenic spacer sequences. The terminators, if multiple,
    also need to be diverse and non-identical. No shared sequences, please!
  expect:
    host: e_coli
    min_cistrons: 3
    must_have_parts:
    - Promoter
    - RBS_A
    - GeneA
    - Spacer_AB
    - RBS_B
    - GeneB
    - Spacer_BC
    - RBS_C
    - GeneC
    - Terminator
  id: repetition_tester_1
  category: persona_repetition_tester
  difficulty: medium
- prompt: I require the mammalian expression and secretion of ProteinP. The construct
    needs a signal peptide and a unique C-terminal FLAG tag. Crucially, the signal
    peptide and the FLAG tag sequences, even if derived from common motifs, *must*
    be codon-optimized with maximal synonymous substitutions to ensure no sequence
    identity with each other or any common mammalian elements. Absolute sequence diversity
    is paramount.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - CMV_Promoter
    - SignalPeptide
    - GeneP
    - FLAG_Tag
    - PolyA_Signal
  id: repetition_tester_2
  category: persona_repetition_tester
  difficulty: medium
- prompt: Express GeneY in Saccharomyces cerevisiae. I need a strong constitutive
    promoter, a completely unique terminator that bears no resemblance to common yeast
    terminators, and a selection marker. The selection marker's coding sequence *must*
    be extensively codon-scrambled relative to its wild-type yeast counterpart to
    prevent any recombination with the host genome.
  expect:
    host: s_cerevisiae
    min_cistrons: 2
    must_have_parts:
    - Constitutive_Promoter
    - GeneY
    - Unique_Terminator
    - CodonScrambled_SelectionMarker
    - Yeast_OriginOfReplication
  id: repetition_tester_3
  category: persona_repetition_tester
  difficulty: medium
- prompt: Create a tandem fusion of ProteinX and ProteinY. They absolutely *must*
    be separated by a novel, non-repetitive linker sequence AND a protease cleavage
    site. Both the linker and the cleavage site must be designed to be completely
    distinct from any other sequences within the plasmid, ensuring zero homology.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RibosomeBindingSite
    - GeneX
    - NovelLinker
    - CleavageSite
    - GeneY
    - Terminator
  id: repetition_tester_4
  category: persona_repetition_tester
  difficulty: medium
- prompt: 'I need a fluorescent reporter, GeneR, expressed in E. coli. It requires
    a synthetic promoter and, here''s the critical part: *two distinct, non-homologous*
    terminators flanking the reporter gene for absolute stability. These terminators
    must have zero sequence identity to each other or any known E. coli terminators.'
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - SyntheticPromoter
    - RibosomeBindingSite
    - ReporterGene
    - Terminator1
    - Terminator2
  id: repetition_tester_5
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need arabinose-inducible expression of EnzymeE. Please include a *non-identical*
    purification tag (e.g., Strep-tag) and a *different*, distinct solubility tag.
    Both tags and any intervening linkers must be codon-optimized with maximal sequence
    difference from each other and common E. coli sequences.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - P_BAD_Promoter
    - ArabinoseInducer_Gene
    - RibosomeBindingSite
    - StrepTag
    - SolubilityTag
    - GeneE
    - Terminator
  id: repetition_tester_6
  category: persona_repetition_tester
  difficulty: medium
- prompt: Express two different guide RNAs (gRNA1, gRNA2) in mammalian cells. Each
    gRNA *must* be driven by a distinct RNA Pol III promoter (e.g., U6, H1), and their
    respective gRNA scaffold sequences, even if functionally identical, *must* be
    synonymous variants to avoid any direct repeats or homology.
  expect:
    host: mammalian
    min_cistrons: 0
    must_have_parts:
    - U6_Promoter_1
    - gRNA1_Target
    - Synonymous_gRNA_Scaffold_1
    - H1_Promoter_2
    - gRNA2_Target
    - Synonymous_gRNA_Scaffold_2
    - PolyT_Terminator
  id: repetition_tester_7
  category: persona_repetition_tester
  difficulty: medium
- prompt: For a bacterial two-hybrid system, I need ProteinA fused to an activator
    domain and ProteinB fused to a DNA binding domain. Both fusion proteins need *distinct*,
    non-homologous linkers and *different*, codon-optimized purification tags. No
    two identical sequences anywhere in these constructs!
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - Promoter1
    - RBS1
    - GeneA
    - ActivatorDomain
    - Linker1
    - PurificationTag1
    - Terminator1
    - Promoter2
    - RBS2
    - GeneB
    - DB_Domain
    - Linker2
    - PurificationTag2
    - Terminator2
  id: repetition_tester_8
  category: persona_repetition_tester
  difficulty: medium
- prompt: Design a mammalian bicistronic construct for ProteinP and ProteinQ using
    an IRES. The IRES sequence *must* be a non-standard variant or extensively codon-scrambled
    in its non-essential regions to eliminate any homology with common viral IRES
    elements. Both P and Q need *unique*, C-terminal tags that are also non-homologous.
  expect:
    host: mammalian
    min_cistrons: 2
    must_have_parts:
    - CMV_Promoter
    - GeneP
    - TagP
    - CodonScrambled_IRES
    - GeneQ
    - TagQ
    - PolyA_Signal
  id: repetition_tester_9
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need Yeast Surface Display of ProteinZ, fused to Aga2p. The linker connecting
    ProteinZ and Aga2p *must* be a randomized, non-repetitive sequence of a specified
    length (e.g., 20 amino acids). No obvious motifs, just pure sequence diversity
    to avoid recombination hotspots.
  expect:
    host: s_cerevisiae
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - SignalPeptide
    - GeneZ
    - RandomizedLinker
    - Aga2p_Fusion
    - Terminator
  id: repetition_tester_10
  category: persona_repetition_tester
  difficulty: medium
- prompt: For plant expression, I need to target EnzymeE to chloroplasts. The chloroplast
    transit peptide *must* be designed with maximal codon diversity and checked rigorously
    for any cryptic repeats or homologous regions to existing plant sequences. No
    risk of recombination with the host genome!
  expect:
    host: plant
    min_cistrons: 1
    must_have_parts:
    - CaMV35S_Promoter
    - CodonDiverse_ChloroplastTransitPeptide
    - GeneE
    - Nos_Terminator
  id: repetition_tester_11
  category: persona_repetition_tester
  difficulty: medium
- prompt: I require expression of three viral proteins (VP1, VP2, VP3) in insect cells
    using a baculovirus system. Each protein *must* be driven by its own completely
    orthogonal promoter, RBS, and terminator set. These sets absolutely cannot share
    any significant homologous sequences. Think completely independent elements!
  expect:
    host: insect
    min_cistrons: 3
    must_have_parts:
    - Promoter1
    - RBS1
    - VP1
    - Terminator1
    - Promoter2
    - RBS2
    - VP2
    - Terminator2
    - Promoter3
    - RBS3
    - VP3
    - Terminator3
  id: repetition_tester_12
  category: persona_repetition_tester
  difficulty: medium
- prompt: Design a Gateway cloning destination vector backbone. It needs *two sets*
    of attR sites, but they *must* be distinct variants (e.g., attR1.1 and attR2.2)
    to prevent any chance of internal recombination during cloning. Also, the ccdB
    counter-selection gene should be a unique, codon-optimized variant.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - OriginOfReplication
    - SelectionMarker
    - attR1.1
    - CodonOptimized_ccdB
    - attR2.2
  id: repetition_tester_13
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need an intein-mediated protein splicing construct. The precursor protein
    contains an intein flanked by exteins. The intein gene itself *must* be extensively
    codon-optimized to ensure no internal repeats and no sequence identity with the
    extein coding regions, even if the amino acid sequence is conserved. I'm terrified
    of loop-outs!
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RBS
    - N_Extein
    - CodonOptimized_Intein
    - C_Extein
    - Terminator
  id: repetition_tester_14
  category: persona_repetition_tester
  difficulty: medium
- prompt: Express a specific RNA aptamer in E. coli. Its flanking constant regions
    and any internal structural elements *must* be designed with maximal sequence
    divergence from any standard aptamer components or vector sequences. Purity from
    recombination is paramount for RNA integrity.
  expect:
    host: e_coli
    min_cistrons: 0
    must_have_parts:
    - Promoter
    - AptamerSequence
    - UniqueFlankingRegions
    - Terminator
  id: repetition_tester_15
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need to silence two different genes in mammalian cells using shRNAs. Each
    shRNA hairpin construct, including its promoter (e.g., U6, H1) and terminator,
    *must* be completely non-homologous to the other. Think orthogonal expression
    units, no shared sequences for recombination!
  expect:
    host: mammalian
    min_cistrons: 0
    must_have_parts:
    - U6_Promoter_1
    - shRNA_Hairpin_1
    - PolyT_Terminator_1
    - H1_Promoter_2
    - shRNA_Hairpin_2
    - PolyT_Terminator_2
  id: repetition_tester_16
  category: persona_repetition_tester
  difficulty: medium
- prompt: Design a synthetic operon for genes G1, G2, and G3. It requires *three distinct*
    RBS sequences for each gene. Furthermore, upstream of the promoter, I need *two
    distinct* operator sites, each binding a *different* repressor protein. All these
    elements (RBS, operators, promoter) must be non-homologous and avoid any sequence
    repeats.
  expect:
    host: e_coli
    min_cistrons: 3
    must_have_parts:
    - Operator1
    - Operator2
    - Promoter
    - RBS1
    - GeneG1
    - Spacer1
    - RBS2
    - GeneG2
    - Spacer2
    - RBS3
    - GeneG3
    - Terminator
  id: repetition_tester_17
  category: persona_repetition_tester
  difficulty: medium
- prompt: I'm designing a yeast integration cassette with homology arms for genomic
    integration. The homology arms themselves *must* be synthesized with maximal codon
    degeneracy for any coding regions within them, and their non-coding parts meticulously
    checked for cryptic repeats. The selection marker and the gene of interest *must*
    use completely different and non-homologous promoters and terminators.
  expect:
    host: s_cerevisiae
    min_cistrons: 2
    must_have_parts:
    - HomologyArm_1
    - Promoter1
    - GeneOfInterest
    - Terminator1
    - Promoter2
    - SelectionMarker
    - Terminator2
    - HomologyArm_2
  id: repetition_tester_18
  category: persona_repetition_tester
  difficulty: medium
- prompt: Express three proteins (P1, P2, P3) in mammalian cells using *different*
    2A self-cleaving peptides. Each 2A peptide *must* be a distinct variant (e.g.,
    F2A, P2A, T2A), and any linker sequences between the 2A peptide and the subsequent
    protein *must* also be unique and non-identical. Zero risk of repeated sequences
    causing issues!
  expect:
    host: mammalian
    min_cistrons: 3
    must_have_parts:
    - CMV_Promoter
    - GeneP1
    - F2A_Peptide
    - UniqueLinker1
    - GeneP2
    - P2A_Peptide
    - UniqueLinker2
    - GeneP3
    - PolyA_Signal
  id: repetition_tester_19
  category: persona_repetition_tester
  difficulty: medium
- prompt: I need to co-express ProteinX and a reporter. Please, *please* ensure their
    promoters and terminators are completely and utterly distinct, preferably from
    different cosmic origins if possible! Even synonymous sequences should be maximally
    divergent. My sanity depends on avoiding recombination!
  expect:
    host: e_coli
    min_cistrons: 2
    must_have_parts:
    - Promoter
    - RBS
    - CodingSequence
    - Terminator
    - ReporterGene
  id: repetition_tester_20
  category: persona_repetition_tester
  difficulty: medium
- prompt: Construct a fusion protein of ProteinA and ProteinB. The linker sequence
    *must not*, under any circumstances, contain any identical 3-mer repeats longer
    than 6bp, especially with regions from ProteinA or ProteinB. Codon choice for
    the linker *must* prioritize synonymous diversity!
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - Promoter
    - RBS
    - CodingSequence
    - Linker
    - Terminator
  id: repetition_tester_21
  category: persona_repetition_tester
  difficulty: medium
- prompt: Design an operon for three enzymes (E1, E2, E3). The ribosome binding sites
    (RBSs) and any intergenic linker regions *must* be entirely unique and divergent
