prompts:
- prompt: Design a high-yield genetic construct for expressing a human therapeutic
    antibody fragment in E. coli. The protein must include a poly-histidine tag for
    purification and a TEV protease cleavage site to remove the tag, ensuring the
    final product is tag-free. Absolutely no antibiotic resistance genes are permitted.
    Production should be tightly regulated via induction.
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - InduciblePromoter
    - RibosomeBindingSite
    - CodingSequence
    - PurificationTag
    - CleavageSite
    - Terminator
  id: therapeutic_0
  category: persona_therapeutic
  difficulty: medium
- prompt: Create a construct for the stable, constitutive expression of a secreted
    human therapeutic peptide in mammalian cells. The peptide should be directed to
    the extracellular space and include elements for enhanced mRNA stability. Ensure
    no viral sequences are used for delivery or integration.
  expect:
    host: mammalian
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - SecretionSignal
    - CodingSequence
    - PolyASignal
    - 3UTR_Stabilizer
  id: therapeutic_1
  category: persona_therapeutic
  difficulty: medium
- prompt: Generate a genetic construct for the intracellular production of a recombinant
    vaccine antigen in Saccharomyces cerevisiae. The antigen needs to be soluble and
    include a short affinity tag for initial validation. Non-viral and non-antibiotic
    selection methods are preferred for the host.
