    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - T7Promoter
    - RBS
    - RFP
    - T7Terminator
  id: undergrad_1
  category: persona_undergrad
  difficulty: medium
- prompt: What about mammalian cells, like HEK293? I wanna make them light up! Use
    that strong CMV promoter and some luciferase, right? And don't forget the poly-A
    tail!
