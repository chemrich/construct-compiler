prompts:
- prompt: Hey! I just want to make E. coli glow green, all the time, no fancy stuff.
    Like, super basic GFP expression, constitutive. Can we do that?
  expect:
    host: e_coli
    min_cistrons: 1
    must_have_parts:
    - ConstitutivePromoter
    - RBS
    - GFP
    - Terminator
  id: undergrad_0
  category: persona_undergrad
  difficulty: medium
- prompt: Okay, I'm doing an experiment where I need red protein to show up ONLY when
    I add that IPTG thingy. You know, like a T7 promoter system in BL21s. Let's do
    RFP for visibility!
